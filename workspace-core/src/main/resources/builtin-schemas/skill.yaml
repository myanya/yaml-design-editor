id: builtin-skill
name: skill定義（入出力変換）
match: "_skills/**/*.{yaml,yml}"
root:
  type: object
  fields:
    - key: id
      label: skillID
      type: id
      required: true
    - key: name
      label: 表示名
      type: string
    - key: description
      label: 説明
      type: text
    - key: kind
      label: 種別
      type: enum
      values: [import, export, run]
      required: true
    - key: input
      label: 入力（import）
      type: object
      fields:
        - key: format
          label: 形式
          type: enum
          values: [xlsx, csv, json, markdown, docx]
        - key: sheet
          label: シート名（xlsx）
          type: string
        - key: headerRow
          label: ヘッダ行（xlsx・1始まり）
          type: int
        - key: path
          label: 行配列へのパス（json）
          type: string
        - key: table
          label: 表の番号（docx・1始まり）
          type: int
    - key: target
      label: 取り込み先（import）
      type: object
      fields:
        - key: file
          label: ファイルパターン
          type: string
          description: 例 issues/{ID}.yaml（{列名} が行の値で置換される）
    - key: mapping
      label: 列の対応（import）
      type: array
      item:
        type: object
        fields:
          - key: column
            label: 列名
            type: string
            required: true
          - key: path
            label: 取り込み先パス
            type: string
            required: true
          - key: type
            label: 型
            type: enum
            values: [string, int, number, boolean, auto]
            default: string
          - key: required
            label: 必須
            type: boolean
          - key: map
            label: 値の変換辞書
            type: map
            value:
              type: string
            description: 列の値を変換する辞書（例 未着手 → open）
          - key: split
            label: 配列化の区切り
            type: string
    - key: source
      label: 対象文書（export）
      type: object
      fields:
        - key: match
          label: 対象glob
          type: string
        - key: rows
          label: 行にする配列パス
          type: string
          description: 省略時は1文書1行
        - key: view
          label: ビューID
          type: string
          description: _views のビュー定義を行×列の源にする（match / rows / columns と排他）
    - key: columns
      label: 列の定義（export）
      type: array
      item:
        type: object
        fields:
          - key: header
            label: 見出し
            type: string
            required: true
          - key: path
            label: 参照パス
            type: string
            required: true
          - key: join
            label: 配列の結合区切り
            type: string
    - key: output
      label: 出力（export）
      type: object
      fields:
        - key: file
          label: 出力ファイル
          type: string
          description: 拡張子で形式が決まる（.xlsx / .csv / .md / .json / .html）。YAMLへの出力は不可
        - key: sheet
          label: シート名（xlsx）
          type: string
    - key: run
      label: コード実行（run）
      type: object
      description: 実行前に人間がコマンド内容と権限を承認する明示許可制（自動実行・エージェントからは起動できない）
      fields:
        - key: command
          label: コマンドと引数
          type: array
          item: { type: string }
        - key: workdir
          label: 作業ディレクトリ（ワークスペース相対）
          type: string
        - key: timeoutSeconds
          label: タイムアウト（秒）
          type: int
        - key: writes
          label: 書込を宣言するglob
          type: array
          description: 実行後に宣言外の変更を検出して警告する（予約ディレクトリは宣言不可）
          item: { type: string }
