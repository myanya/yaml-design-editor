id: builtin-skill
name: skill定義（入出力変換）
match: "_skills/**/*.{yaml,yml}"
root:
  type: object
  fields:
    - key: id
      label: skillID
      type: id
      required: true
    - key: name
      label: 表示名
      type: string
    - key: description
      label: 説明
      type: text
    - key: kind
      label: 種別
      type: enum
      values: [import, export, run]
      required: true
    - key: input
      label: 入力（import）
      type: object
      fields:
        - key: format
          label: 形式
          type: enum
          values: [xlsx, csv, json, markdown, docx]
        - key: sheet
          label: シート名（xlsx）
          type: string
        - key: headerRow
          label: ヘッダ行（xlsx・1始まり）
          type: int
        - key: path
          label: 行配列へのパス（json）
          type: string
          description: ドット区切りのキー（例 data.items）。省略時はルート。tree のときは取り込む場所
        - key: tree
          label: 木のまま取り込む（json）
          type: boolean
          description: 配列の要素を、入れ子・数の型・null を保ったまま 1 件ずつ build に渡す（null の要素は飛ばす。配列でなければ全体を 1 件）。要素の番号は $index（0 始まり）・$position（1 始まり）で読める。build が要る
        - key: table
          label: 表の番号（docx・1始まり）
          type: int
        - key: encoding
          label: 文字コード（csv / json / markdown）
          type: string
          description: 省略時は UTF-8。銀行の CSV などは windows-31j（Shift_JIS）
        - key: columns
          label: 列の名前の並び（見出しの無い csv）
          type: array
          item: { type: string }
          description: 見出しの行が無い CSV に列の名前を与える（1 行目からデータ）。mapping の column や build のパスはこの名前で書く
    - key: target
      label: 取り込み先（import）
      type: object
      fields:
        - key: file
          label: ファイル
          type: any
          description: mapping では issues/{ID}.yaml の {列名} が行の値。build では組み立てた明細の値で埋める文字列か、ひな型（$format など）
        - key: path
          label: 配列のパス
          type: string
          description: 文書の中の配列へ追記する（例 entries）。省略時は 1 行 1 文書
        - key: id
          label: 採番
          type: object
          description: 組み立てた明細に ID が無いとき、接頭辞＋連番を付ける（配列への取り込みだけ）
          fields:
            - key: path
              label: ID の項目
              type: string
            - key: prefix
              label: 接頭辞のひな型
              type: any
              description: 組み立てた明細の値で埋める文字列（例 TX-{date}-）か、ひな型（$format など）
            - key: digits
              label: 連番の桁数
              type: int
              default: 2
        - key: key
          label: 同じ明細の見分け方
          type: array
          description: この項目の値が同じ明細が既にあれば取り込まない（配列への取り込みだけ）
          item: { type: string }
    - key: build
      label: 行のひな型（import / export）
      type: any
      description: import では行（列名 → セル、tree なら JSON の要素）を項として当てる変換のひな型で、mapping の代わりに書く（$when で行を飛ばせる）。export では文書（rows なら配列の要素）ごとに JSON の値を組み立てるひな型で、columns の代わりに書く
    - key: rules
      label: ひな型の規則（import / export）
      type: any
      description: build から $apply で当てる名前付きの規則（変換定義の rules と同じ）
    - key: mapping
      label: 列の対応（import）
      type: array
      item:
        type: object
        fields:
          - key: column
            label: 列名
            type: string
            required: true
          - key: path
            label: 取り込み先パス
            type: string
            required: true
          - key: type
            label: 型
            type: enum
            values: [string, int, number, boolean, auto]
            default: string
          - key: required
            label: 必須
            type: boolean
          - key: map
            label: 値の変換辞書
            type: map
            value:
              type: string
            description: 列の値を変換する辞書（例 未着手 → open）
          - key: split
            label: 配列化の区切り
            type: string
    - key: include
      label: まとめて書き出す定義（export）
      type: array
      item: { type: string }
      description: 束ねる書き出しの skill ID。同じ書き出し先へ 1 回で書く（全部を計画してから書き、どれかが誤りなら何も書かない。既存のファイルを上書きするときは一括で確認する）。このときは source・columns・build・output を書かない
    - key: source
      label: 対象文書（export）
      type: object
      fields:
        - key: match
          label: 対象glob
          type: string
        - key: rows
          label: 行にする配列パス
          type: string
          description: 省略時は1文書1行
        - key: view
          label: ビューID
          type: string
          description: _views のビュー定義を行×列の源にする（match / rows / columns と排他）
    - key: columns
      label: 列の定義（export）
      type: array
      item:
        type: object
        fields:
          - key: header
            label: 見出し
            type: string
            required: true
          - key: path
            label: 参照パス
            type: string
            required: true
          - key: join
            label: 配列の結合区切り
            type: string
    - key: output
      label: 出力（export）
      type: object
      fields:
        - key: file
          label: 出力ファイル
          type: string
          description: 拡張子で形式が決まる（.xlsx / .csv / .md / .json / .html）。YAMLへの出力は不可。実行のときに書き出し先のフォルダを選ぶと、このファイル名でそのフォルダに書く
        - key: sheet
          label: シート名（xlsx）
          type: string
        - key: mode
          label: 置き方（build）
          type: enum
          values:
            - { value: array, label: 配列に並べる, description: 組み立てた値を配列に並べる（index があれば番号の位置に） }
            - { value: value, label: 1 つの値, description: ちょうど 1 つの値をファイル全体にする }
            - { value: merge, label: 既存の object に書き込む, description: 書き出し先の既存の JSON（object）に、組み立てた object の項目を書き込む。ほかの項目と順はそのまま }
          default: array
        - key: index
          label: 番号（build・array）
          type: any
          description: 組み立てた値を番号の位置に並べる。組み立てた値から 0 以上の整数を読むひな型（文字列はパスの略記。例 id）
        - key: fill
          label: 番号の空きに置く値（build・index）
          type: any
          description: 番号が無い位置に置く値のひな型（$index が空きの番号）。省略時は null
        - key: style
          label: 書式（build）
          type: enum
          values:
            - { value: pretty, label: 字下げ, description: 字下げ 2 つで入れ子を 1 行ずつ }
            - { value: compact, label: 1 行, description: 空白を入れず 1 行 }
            - { value: lines, label: 要素ごとに 1 行, description: 一番外の配列の要素（object なら項目）を 1 行に 1 つ }
          default: pretty
        - key: finalNewline
          label: 末尾の改行（build）
          type: boolean
          default: true
    - key: run
      label: コード実行（run）
      type: object
      description: 実行前に人間がコマンド内容と権限を承認する明示許可制（自動実行・エージェントからは起動できない）
      fields:
        - key: command
          label: コマンドと引数
          type: array
          item: { type: string }
        - key: workdir
          label: 作業ディレクトリ（ワークスペース相対）
          type: string
        - key: timeoutSeconds
          label: タイムアウト（秒）
          type: int
        - key: writes
          label: 書込を宣言するglob
          type: array
          description: 実行後に宣言外の変更を検出して警告する（予約ディレクトリは宣言不可）
          item: { type: string }
