id: builtin-schema
name: スキーマ定義
description: _schemas 配下のスキーマ文書を検証・フォーム編集するためのメタスキーマ
match: "_schemas/**/*.{yaml,yml}"
definitions:
  field:
    type: object
    fields:
      - key: key
        label: キー
        type: string
        description: 親オブジェクト内のキー名（ルート・配列要素では不要）
      - key: label
        label: 表示ラベル
        type: string
      - key: type
        label: 型
        type: enum
        description: "基底の種類（この選択肢）か、型の名前（組込みの型 text・definitions に定義した型 金額 / common#金額）。型の名前を書くと定義の決まりを引き継ぎ、ここに書く決まりは狭めるだけ（P33）。型の名前の選択肢は読み込み時に足される"
        values: [string, int, number, boolean, enum, date, time, datetime, id, ref, array, map, object, any]
        cases:
          date:
            - key: pattern
              label: 形式（正規表現）
              type: string
              description: "正準の形（YYYY-MM-DD）に加えて狭める形式（例 ^\\d{4}-(04|10)-\\d{2}$）。存在しない日付（2026-02-30）は形式に合っても誤りになる"
            - key: format
              label: 表示の形
              type: string
              description: "画面で見せる形（DateTimeFormatter のパターン。例 yyyy年M月d日）。ファイルと編集中は YYYY-MM-DD のまま"
          time:
            - key: pattern
              label: 形式（正規表現）
              type: string
              description: "正準の形（HH:MM か HH:MM:SS）に加えて狭める形式（例 30 分刻み ^\\d{2}:(00|30)$）"
            - key: format
              label: 表示の形
              type: string
              description: "画面で見せる形（DateTimeFormatter のパターン。例 H時mm分）"
          datetime:
            - key: pattern
              label: 形式（正規表現）
              type: string
              description: "正準の形（YYYY-MM-DD HH:MM。区切りは空白か T・秒は任意）に加えて狭める形式"
            - key: format
              label: 表示の形
              type: string
              description: "画面で見せる形（DateTimeFormatter のパターン。例 M/d H:mm）"
          string:
            - key: minLength
              label: 最小文字数
              type: int
            - key: maxLength
              label: 最大文字数
              type: int
            - key: pattern
              label: 形式（正規表現）
              type: string
              description: 値の全体がこの正規表現に一致すること（R16-01）
            - key: display
              label: 編集の形
              type: enum
              values: [multiline]
              description: multiline は複数行の欄で編集する（組込みの型 text がこれを持つ。見せ方だけで、値・検証は変えない）
            - key: rows
              label: 欄の行数
              type: int
              description: "複数行の欄の高さの目安（display: multiline の型で使う。例 5）"
          int:
            - key: min
              label: 最小値
              type: int
            - key: max
              label: 最大値
              type: int
            - key: display
              label: 桁区切り
              type: enum
              values: [grouped]
              description: grouped は桁区切り（45000 → 45,000）。フォームとビューの見せ方だけで、値・検証・CLI や書き出しは変えない
            - key: format
              label: 表示の形
              type: string
              description: "画面で見せる形（DecimalFormat のパターン。例 ¥#,##0・#,##0 円）。ファイルと編集中は素の数のまま。display: grouped より優先"
          number:
            - key: min
              label: 最小値
              type: number
            - key: max
              label: 最大値
              type: number
            - key: display
              label: 桁区切り
              type: enum
              values: [grouped]
              description: grouped は桁区切り（12345.5 → 12,345.5）。フォームとビューの見せ方だけで、値・検証・CLI や書き出しは変えない
            - key: format
              label: 表示の形
              type: string
              description: "画面で見せる形（DecimalFormat のパターン。例 #,##0.00・0.0%）。ファイルと編集中は素の数のまま"
          enum:
            - key: values
              label: 選択肢
              type: array
              item:
                type: any
              description: 文字列、または {value, label, description} のリッチ選択肢
            - key: cases
              label: 値ごとの追加フィールド
              type: map
              value:
                type: array
                item:
                  $ref: field
              description: enum の値ごとに親オブジェクトへ追加される兄弟フィールド
          array:
            - key: item
              label: 要素定義
              $ref: field
            - key: display
              label: 一覧の表示形式
              type: enum
              values: [table, list]
              description: table は表形式に固定、list は縦並びに固定（省略時は列構成から自動判定）
          map:
            - key: value
              label: 値定義
              $ref: field
            - key: display
              label: 一覧の表示形式
              type: enum
              values: [table, list]
              description: table は表形式（キー列つき）に固定、list は縦並びに固定（省略時は列構成から自動判定）
          object:
            - key: fields
              label: 子フィールド
              type: array
              item:
                $ref: field
              description: "型の名前（オブジェクト型）を使う側では、定義に無いキーは末尾に足され、定義にあるキーは同じ項目を狭める（必須にする・決まりを狭める・型は定義の型を狭めた型だけ。表示のヒントは使う側が勝つ）"
            - key: unknownFields
              label: スキーマ外キーの扱い
              type: enum
              values: [allow, warning, error]
            - key: entity
              label: 同一性（エンティティ型）
              type: object
              description: "この object の要素がどのエンティティ型か（オブジェクト型。P33 第三弾）。名前付きの型にも、その場の object にも書け、文書スキーマの entity:（ID の形で判別）より優先される。名前付きの型では type を省くと定義名"
              fields:
                - key: type
                  label: エンティティ型名
                  type: string
                - key: defines
                  label: この要素の出現が定義（誕生）
                  type: boolean
                - key: aspect
                  label: 側面名（省略時はスキーマID）
                  type: string
                - key: owns
                  label: 所有する項目（省略時は宣言した項目全部）
                  type: any
          id:
            - key: pattern
              label: 形式（正規表現）
              type: string
              description: IDの全体がこの正規表現に一致すること（例 TASK-\d{3}。UX-79）
          ref:
            - key: idPattern
              label: 参照先IDパターン
              type: any
              description: glob 文字列または配列
            - key: idPatterns
              label: 参照先IDパターン（複数）
              type: any
            - key: scope
              label: 探索範囲
              type: object
              fields:
                - key: schemaIds
                  label: スキーマIDの限定
                  type: any
                  description: 文字列または配列
                - key: documentIds
                  label: ドキュメントIDの限定
                  type: any
                  description: 文字列または配列
            - key: relation
              label: 関係種別
              type: string
              description: 例 implements / depends。表示とカバレッジ判定に使う
            - key: target
              label: 参照対象種別
              type: enum
              values: [entity, document]
              description: "document は文書ノード（_document.id ＞ 相対パス）への参照（既定 entity。R21-03）"
            - key: fields
              label: エッジ属性の宣言
              type: array
              item:
                $ref: field
              description: 宣言時のみ {to, 属性...} のオブジェクト形式を許可する（属性付き参照。R20-03）
      - key: required
        label: 必須
        type: boolean
      - key: requiredFrom
        label: このフェーズ以降で必須
        type: string
      - key: expression
        label: 値の式を受け取る
        type: boolean
        description: "true にすると、この項目の値は値の式でもよくなる（短い書き方＝{パス} を含む文字列・完全な書き方＝{format, with} などの式の object。式が返す値の型が type。基底の種類が string の型でのみ）。どの項目が式かはこの印だけが決め、読み取り・評価・エラーの文面は共通。使う側（例: filePattern はファイル名として）が、いまの要素を決めて評価する"
      - key: role
        label: 表示役割
        type: enum
        values: [title, subtitle]
      - key: default
        label: 初期値
        type: any
      - key: placeholder
        label: 入力欄の案内
        type: string
        description: 値が空のときに入力欄へ薄く出す文字（例 YYYY-MM-DD）。型に書けば、その型を使う項目に引き継がれる
      - key: sample
        label: サンプル値
        type: any
        description: プレビューのサンプル YAML で、初期値が無いときに使う値（例 2026-01-01）。型に書けば引き継がれる
      - key: description
        label: 説明
        type: text
      - key: $ref
        label: 名前付き定義への参照
        type: string
        description: definitions 内の名前（横断参照は moduleId#definition）
      - key: ref
        label: 名前付き定義への参照（別記法）
        type: string
root:
  type: object
  fields:
    - key: id
      label: スキーマID
      type: id
      role: title
      description: 安定したスキーマID（省略時はファイル名）
    - key: name
      label: スキーマ名
      type: string
    - key: description
      label: 説明
      type: text
      role: subtitle
    - key: kind
      label: 種別
      type: enum
      values: [document, library, relations]
      description: document（既定）は文書に適用、library は共有する定義の置き場（フィールドの定義 definitions・検査の定義 functions・語彙の定義 vocabulary）、relations は関係レジストリ（保存すると専用フォームが適用される）
    - key: match
      label: 適用パターン（glob）
      type: string
    - key: filePattern
      label: 新しい文書の置き場所
      type: string
      expression: true
      description: "このスキーマの文書を新しく作るとき（検証の対応「詳細文書を作成」など）のファイル名（ワークスペース相対）。値の式を受け取る項目——短い書き方は {パス} を含む文字列（例 40_detail-design/screens/{id}_{name}.yaml。穴は元の要素（一覧側の定義出現）の値・{id} は ID・{title} は表示の解決結果）、完全な書き方は {format: 文字列, with: {穴の名前: 式}} などの値の式（of を省略すると元の要素。map / first / lower なども書ける）。穴に入った値はファイル名に使える文字に直される。穴が埋まらなければ作成はエラー。書かなければ match から導く（ディレクトリにワイルドカードの無い単純な glob だけ）"
    - key: scaffold
      label: 新しい文書のひな型
      type: any
      description: "このスキーマの文書を元の要素（一覧側の定義出現）から作るときに、必須の項目の初期値の上へ重ねる中身。変換のひな型（$copy / $format / $map / $first / $each / $when。いまの場所＝元の要素）で書く。例 {name: {$copy: name}, summary: {$copy: summary}, source: {$format: \"{id}（一覧から作成）\"}}。ルート直下の ID の項目には、今までどおり ID が入る"
    - key: root
      label: ルート定義
      $ref: field
    - key: definitions
      label: 名前付き定義
      type: map
      description: "構造（object など。$ref で使う）と型（string・int などスカラーの決まりの束。項目の type: 名前 で使う。P33）の名前付き定義。型の定義は type に基底の種類か別の型名を持ち、連鎖の末端が基底の種類になる"
      value:
        $ref: field
    - key: phases
      label: フェーズ宣言
      type: any
      description: フェーズ名の配列、または {key, order} の object
    - key: entity
      label: エンティティ型の宣言
      type: any
      description: "この文書群の出現のエンティティ型（R20-01）。{type, idPattern, idType, defines, aspect, owns} の object、または複数型のリスト（idPattern＝ID の glob か idType＝ID の型の名前で判別。両方書けば両方に合う ID）。aspect / owns はこの出現が所有する側面の宣言（R23-01。省略時はスキーマID／宣言フィールド全部）"
    - key: coverage
      label: カバレッジルール
      type: array
      description: "詳細文書の存在（出現ベース detailIn）の要求。組込み定義体が作る語彙で、検証の前に基本の検査（書かれた場所の数の比較）へ展開される（P29 Phase 6。CLI checks で確認できる）。被参照数の要求（旧 requiredBy）は廃止——1ホップは関係レジストリの cardinality、条件付き・多段は constraints で宣言する（R29-01）"
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: idPattern
            label: 対象IDパターン
            type: string
          - key: detailIn
            label: 出現ベースの条件
            type: object
            required: true
            fields:
              - key: schemaIds
                label: 出現先スキーマ
                type: any
              - key: minCount
                label: 必要な出現数
                type: int
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: consistency
      label: 整合ルール
      type: array
      description: このスキーマの文書のID要素の値が、導出（計算列と同じ語彙）の期待値と一致することを検証する（R16-03a）
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: idPattern
            label: 対象IDパターン
            type: string
          - key: path
            label: 検査する値の相対パス
            type: string
            required: true
            description: ID要素からの相対YPath（例 type）
          - key: expected
            label: 期待値の導出
            type: object
            required: true
            description: ビューの計算列（computed）と同じ語彙（lookup / source / path / values / map / default）
            fields:
              - key: lookup
                label: 参照の1ホップ
                type: object
                fields:
                  - key: schemaId
                    label: 参照値を読む出現のスキーマ
                    type: string
                  - key: fileGlob
                    label: 参照値を読む出現のファイル（glob）
                    type: string
                  - key: via
                    label: ref フィールドの相対パス
                    type: string
                    required: true
              - key: source
                label: 元値を読む出現
                type: object
                required: true
                fields:
                  - key: schemaId
                    label: スキーマ
                    type: string
                  - key: fileGlob
                    label: ファイル（glob）
                    type: string
              - key: path
                label: 元値の相対パス
                type: string
                required: true
              - key: values
                label: プレースホルダ解決に使う出現
                type: array
                item:
                  type: object
                  fields:
                    - key: schemaId
                      label: スキーマ
                      type: string
                    - key: fileGlob
                      label: ファイル（glob）
                      type: string
              - key: map
                label: 値辞書
                type: map
                value:
                  type: string
              - key: default
                label: 既定値
                type: string
          - key: assert
            label: 判定方法
            type: enum
            values:
              - value: equals
                label: 一致
                description: 宣言値が導出値と一致すること（既定）
              - value: lte
                label: 以下
                description: 宣言値が導出値以下であること（数値として比較。適合判定）
              - value: gte
                label: 以上
                description: 宣言値が導出値以上であること（数値として比較）
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: constraints
      label: 検査（基本の書き方）
      type: array
      description: "検査を1件ずつ書く（P29 Phase 6。CORE-CALCULUS §25）。書き方は2通り——①プリミティブを直接書く: match（クエリ）＋ expect / count / check のどれか ②定義を名前で使う: use（定義の名前）＋ with（渡す値）。consistency などの語彙は、検証の前にこの形へ展開される"
      item:
        type: object
        fields:
          - key: checker
            label: 専用チェッカーの名前
            type: enum
            values: [flow]
            description: "コードで実装された専用チェッカーを使う検査（P29 Phase 6）。flow＝遷移検証（指摘の種類 unreachable / deadEnd / undeclared）。checker を書いた検査に書けるのは id / description / checker / args / messages / level / levelFrom / activeFrom。循環の検出は専用チェッカーではなく、edge の repeat と node の same で書く"
          - key: args
            label: チェッカーへ渡す値
            type: any
            description: "flow は {nodes, edges: {from: {relation}, to: {relation}}, start: {relation}, terminal: {relation}, usage}"
          - key: messages
            label: 指摘の種類ごとの文面
            type: any
            description: "{指摘の種類: 文面のひな型}。書かなかった種類は指摘しない。ひな型には {id}（対象の ID）・{related}（関連するノードの並び）・{count}（その件数）を書ける"
          - key: use
            label: 使う定義の名前
            type: string
            description: "functions に定義した検査（組込み定義体・利用者の定義）を名前で使う。use を書いた検査に書けるのは use と with だけ"
          - key: with
            label: 定義へ渡す値
            type: any
            description: "定義の params に対応する値（例 {relation: groups, min: 1}）"
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: match
            label: パターン（node / edge の連鎖）
            type: any
            description: "先頭 node が起点束縛（kind: entity 限定）。例 [{node: {entity: usecase, bind: uc}}, {edge: {relation: uses, dir: in}}, {node: {entity: screen}}]。node の entity には型の並び（どれか）も書け、not: {entity, schema, id} はその絞り込みに合わないノードだけを残す（型が宣言されていない要素は残さない）。typed: true は型が宣言された要素だけ（false は宣言されていない要素だけ）。node: {same: 束縛名} は先行して束縛済みのノードそのものへの到達を要求（ノード一致＝2経路の合流。他のキーと同居不可）。edge の bind は辿った参照そのものを束縛する（同じ相手への参照が2本あれば2つの解。reportAt: {ref: 束縛名} で指摘を参照の場所へ出せる）。edge の in: {schemaId, fileGlob} は参照が書かれた文書の指定。edge の repeat: true は、その線を1回以上くり返して辿り着けるすべての要素へ進む（何段でも辿る。repeat: {min: 0} は0回以上＝出発した要素そのものも含む。辿る計算は専用アルゴリズムで必ず止まる。見つけた道すじは message の {path} に出せる。bind とは併用不可）。edge の row: {from: {relation}, to: {relation}} は、同じ行（object）の直下に書かれた2つの参照——from の相手から to の相手へ——を1本の線として辿る（遷移の表など。dir: in は逆向き。relation / via とは併用不可）。参照の線は、向きによらず「その参照を含む最も内側の ID を持つ要素」が書いたものとして辿る（dir: out はその要素が直接書いた参照だけ）。edge の contains: true は入れ子の線——その要素の直下に入れ子になった ID を持つ要素へ進む（dir: in は外側の要素へ。文書ノードとの間は、いちばん外側で書かれた要素。repeat と組み合わせて何段でも。relation / via / in / bind / row とは併用不可）。edge の via は、1語ならキー名・複数語なら参照が書かれた場所の末尾のキーの並び（target.ref など）"
          - key: also
            label: 分岐（1段）
            type: any
            description: "束縛済みノードからのもう1本の連鎖（内部結合）。例 {from: col, steps: [{edge: {relation: dtype}}, {node: {same: t}}]}"
          - key: where
            label: プロパティ述語
            type: any
            description: "ノードを値で絞る条件。{not: 条件}（条件が成り立たない。値が無く判定できないときは選ばれない）と {or: [条件, ...]}（どれか。同じ束縛の条件どうし）も書ける（入れ子は1段まで。「かつ」は並べて書く）。1件につき条件を一つ（例 {of: br, path: status, notEquals: approved}）。equals / notEquals（値があり指定値でないとき成立。値がなければ黙る）・exists（項目が書かれているか）・empty（false = 中身のある値がある／true = 書かれていないか空）・oneOf: [値, ...]（選択肢のどれか）・matches（正規表現の全体一致）・startsWith / endsWith / contains・lt / lte / gt / gte（数値として読めない値は成立しない）"
          - key: limit
            label: 照合上限
            type: int
          - key: expect
            label: 期待
            type: enum
            description: count / check と排他（いずれか一つを宣言する）
            values:
              - value: exists
                label: 存在すること
                description: 起点ごとにパターンの解が1つ以上あること
              - value: absent
                label: 存在しないこと
                description: 起点ごとにパターンの解がないこと
          - key: count
            label: 解の件数
            type: object
            description: 起点ごとの解（束縛の組）の distinct 件数が範囲内であること（expect / check と排他。数えたい対象に bind を書く）
            fields:
              - key: min
                label: 下限
                type: int
              - key: max
                label: 上限
                type: int
          - key: check
            label: 判定述語
            type: any
            description: "値の比較（R28-08）。{演算子: [左, 右]} または {op: 演算子, left: 左, right: 右} の配列（すべて成立が期待。expect / count と排他）。{not: 条件} と {or: [条件, ...]}（どれかが成り立てばよい）も書ける（入れ子は1段まで）。演算子は eq / ne（文字列の等値）・lte / gte / lt / gt（数値）・oneOf（右は選択肢の配列）・matches（正規表現の全体一致）・startsWith / endsWith / contains。左右は値の式——読み出し {of: 束縛, in: {schemaId, fileGlob}, path: 相対パス}（in は値を読む文書の指定。省略可）・決まった値（そのまま書く。値が無いかもしれないときは {value}）・テンプレートの展開 {format: 式, scopes: [{of, in}]}・辞書での置き換え {map: 式, using: {元: 先}}・最初に得られた値 {first: [式]}・文字数 {length: 式}・大文字と小文字 {upper: 式} {lower: 式}・数値の表記を揃える {number: 式}・四則演算 {add / multiply: [式, ...]} {subtract / divide: [式, 式]}・参照の本数 {refCount: {of: 束縛, dir: out | in, relation, via}}（同じ相手への参照が2本あれば2。出ていく参照は相手が見つからないものも数える）・集計 {sum | min | max: 配列を返す式, type: number | date} {count: 配列を返す式}（配列を受け取る関数。count は件数・length は文字数）・集合から配列へ {all: {of: 束縛, in, path}}（同じ起点の全ての解にわたり、その束縛の要素の値を並べる）と {all: {from: 起点の束縛, match: [...], where: [...], of, path}}（起点を固定した照合の解から並べる）・要素ごとの式 {each: 配列を返す式, value: 式}・書かれた場所の数 {occurrenceCount: {of: 束縛, schema: スキーマID または 並び, fileGlob, role: defining | detail, distinct: type}}（その ID が書かれている場所のうち指定に合うものの数。distinct: type は宣言されたエンティティ型の種類の数）。同じ ID が書かれた文書の組をすべて調べ、条件を満たさない組を1つでも見つけたら指摘・評価できる組（値が得られない・数値として読めない）がなければ黙る"
          - key: message
            label: 指摘の文面のひな型
            type: string
            description: "指摘の文面（省略時は判定の種類ごとの既定の文面）。どの判定にも書ける。{id}（起点の ID）・{束縛名.id} {束縛名.type} {束縛名.title}（見つかった解のノード）・{count}（解の件数）・{path}（見つけた道すじ。何段でも辿る線が通った要素を含む）・{left} {right}（比べた値）・{left.raw} {right.raw}（計算前の元の値）を書ける"
          - key: reportAt
            label: 指摘を出す場所（値の場所）
            type: any
            description: "省略時は起点を定義した場所。{of: 束縛, in: {schemaId, fileGlob}, path: 相対パス}＝値が書かれた場所（その値が書かれた文書の検証で、要素ごとに報告する。check と組み合わせる）・{ref: 参照の束縛名}＝edge の bind で束縛した参照が書かれた場所（見つかった解ごとに報告する。expect: absent か check と組み合わせる）"
          - key: forAll
            label: すべての要素について
            type: any
            description: "{node: {絞り込み, bind: 束縛名}, from: 起点側の束縛名, steps: [edge, node, ...]}。起点とは参照でつながらない、もう1つの集まり（node）を持ち込み、そのすべての要素について、from の要素（省略時は起点）から steps を辿った流れに解があることを求める（expect / count / check と排他。match は起点の node 1つだけ）。steps の中では、集まりの要素を node: {same: 束縛名} で指す。解のなかった要素が不足で、message に {count}（不足の件数）と {missing}（不足の並び）を書ける。集まりが空なら判定しない。相手の見つからない参照に出会った要素は不足に数えない"
          - key: status
            label: 充足の状況の表示
            type: string
            description: "書いた検査は、要素ごとの「検査の状況」の一覧（右パネルのカバレッジ・ID 横ぐし・ビューの状態列・エージェントの related）に出る。値は状況を1行で示すひな型（message と同じものを埋め込める。例 出現 {left} 件（必要 {right} 件））。reportAt とは組み合わせられない"
          - key: fixSite
            label: 直せる場所への案内
            type: any
            description: "{schema: スキーマID または 並び, message: 文面} 。この検査の指摘が「別の文書へ書き足す」ことで直るとき、書き足し先のスキーマの文書の検証に、指摘が出ている ID の一覧を案内（情報）として出す。message には {count}（件数）と {ids}（ID の並び）を書ける。その文書に既に書かれている ID は載せない"
          - key: levelFrom
            label: 重大度の切り替え
            type: enum
            values: [undeclaredRelation, definingUniqueness]
            description: 関係レジストリの強制スイッチ（enforcement）のキー名。そのキーが宣言されていれば、その重大度で指摘する（宣言されていなければ level）
          - key: responses
            label: エラー時の対応
            type: any
            description: "対応の宣言の配列。{jump: left.source|right.source|left.inputs|right.inputs, label}（値の出どころへ移動。check と組み合わせる）・{jump: referenceSources, relation: 関係名, label}（起点の要素への参照を書き足せそうな文書を開く。候補ごとに1件。label に {file}）・{apply: left|right, label}（値を指摘の場所へ書き込む。値の場所の reportAt が必要）・{create: detailDocument, schemas: [スキーマID], label}（起点の ID の詳細文書を、そのスキーマの置き場所に作って開く。スキーマごとに1件。label に {schema}）。label には {left} {right} {left.raw} {right.raw}、inputs では {input.placeholder} {input.value} を書ける。note はメニューでラベルの下に添える補足"
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: functions
      label: 検査の定義（関数のような定義）
      type: array
      description: "名前と受け取る値を持つ検査の定義（P29 Phase 6）。constraints の use で名前を指定して使う。どのスキーマ文書に書いてもワークスペース全体で使える（置き場は kind: library が向く）"
      item:
        type: object
        fields:
          - key: id
            label: 定義の名前
            type: string
            required: true
            role: title
          - key: description
            label: 説明
            type: text
            role: subtitle
          - key: params
            label: 受け取る値の名前
            type: array
            item: { type: string }
          - key: checks
            label: 中身（検査のひな型）
            type: any
            required: true
            description: "constraints と同じ書き方の検査の配列。文字列の $名前 に、渡された値が差し込まれる（文字列がちょうど $名前 なら値そのもの＝配列やマップも渡せる。文中の $名前 は文字列として埋まる。$ そのものは $$）"
    - key: vocabulary
      label: 語彙の定義（短く書くための書き方）
      type: array
      description: "スキーマに短く書ける書き方を作る（P29 Phase 6）。どこに書けるか（in）と、書かれた内容からどの定義をどの値で使うか（uses）を宣言する。スキーマの consistency と、関係の宣言の cardinality・source / target は、組込み定義体が作る語彙"
      item:
        type: object
        fields:
          - key: word
            label: 語彙の名前
            type: string
            required: true
            role: title
          - key: description
            label: 説明
            type: text
            role: subtitle
          - key: in
            label: 書ける場所
            type: string
            required: true
            description: "スキーマ文書の直下の配列の各要素（例 consistency[]）。関係レジストリの関係の宣言（relations[]）にも書ける"
          - key: uses
            label: 定義の使用への対応
            type: any
            required: true
            description: "（語彙には requires: [必ず書くキーのパス]・keys: [書けるキーの一覧]・removed: {廃止したキー: 案内} も書ける——書き方の形の最小の点検で、外れていればスキーマの読み込みエラー）{when: キー, unless: キー, use: 定義の名前, with: {受け取る値: 指定}} の配列。when / unless はそのキーが書かれている／いないときだけ有効（キーの並びも書ける＝すべて。空の配列・空の object・空文字は書かれていない扱い）。with の指定は、そのままの値・{from: パス, default, map, join, format}（書かれた内容から読む。join は配列の値を区切り文字でつなぐ・format は値があるときだけ {value} を埋めた文字列にする）・{schema: id}（書かれたスキーマのID）"
    - key: matrix
      label: 網羅マトリクス
      type: array
      description: "（組込み定義体が作る語彙——検証の前に「すべての要素について」の検査 forAll へ展開される。P29 Phase 6。CLI checks で確認できる）行×列の全組合せに証人（witness）が存在することを検証する（R28-03。例: 処理×試験観点→テスト項目）。あえて対象外のセルは証人側に excluded: true の行として残す（存在＝充足）"
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: rows
            label: 行の母集団
            type: any
            required: true
            description: "エンティティ選択（entity / schema / id。例 {entity: process}）"
          - key: columns
            label: 列の母集団
            type: any
            required: true
            description: "エンティティ選択（例 {entity: test-viewpoint}）"
          - key: witness
            label: 証人
            type: object
            required: true
            description: 行と列の両方を参照していればセルを充足するエンティティ
            fields:
              - key: node
                label: 証人の選択
                type: any
                required: true
                description: "例 {entity: test-item, schema: unit-test-item}"
              - key: row
                label: 行への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
              - key: column
                label: 列への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: flow
      label: 遷移検証
      type: array
      description: "宣言エッジ集合（遷移の原本）の到達閉包で、到達不能・行き止まり・宣言外遷移を検出する（R28-04。例: 画面遷移・状態遷移）。指摘はノードの定義出現に報告する。組込み定義体が作る語彙で、検証の前に「専用チェッカー flow を使う検査」へ展開される（P29 Phase 6。CLI checks で確認できる）"
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: nodes
            label: ノード母集団
            type: any
            required: true
            description: "エンティティ選択（entity / schema / id。例 {entity: screen}）"
          - key: edges
            label: 宣言エッジ
            type: object
            required: true
            description: 同じ行オブジェクト直下の from 参照と to 参照の組を1エッジとして抽出する
            fields:
              - key: from
                label: 遷移元への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
              - key: to
                label: 遷移先への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
          - key: start
            label: 開始ノードへの参照
            type: object
            description: 開始ノードを指す relation。省略時は到達不能を判定しない（開始データが空のときも判定保留）
            fields:
              - { key: relation, label: relation, type: string, required: true }
          - key: terminal
            label: 終端ノードへの参照
            type: object
            description: 終端として許容するノードを指す relation（行き止まり判定から除外する）
            fields:
              - { key: relation, label: relation, type: string, required: true }
          - key: usage
            label: 使用エッジ
            type: object
            description: 宣言外遷移の検出対象（このエッジ集合が宣言エッジに含まれることを要求。省略時は判定しない）
            fields:
              - key: from
                label: 遷移元への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
              - key: to
                label: 遷移先への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: derive
      label: 派生スキーマの宣言
      type: object
      description: 導出元文書（例 テーブル定義書）から検証スキーマをロード時にコンパイルする（R11-03）
      fields:
        - key: from
          label: 導出元文書（glob）
          type: string
          required: true
        - key: each
          label: 導出単位の配列パス
          type: string
          description: 1文書内の複数要素から導出する場合の配列パス（省略時は文書ルート）
        - key: id
          label: 導出スキーマID
          type: string
          required: true
          description: "{パス} が導出元要素の値で置換される（例 record-{id}）"
        - key: name
          label: 導出スキーマ名
          type: string
        - key: match
          label: 導出スキーマの適用先（glob）
          type: string
          required: true
        - key: fields
          label: フィールドの写像
          type: object
          required: true
          fields:
            - key: source
              label: フィールドにする配列のパス
              type: string
              required: true
            - key: key
              label: キーの値パス
              type: string
              required: true
            - key: label
              label: ラベルの値パス
              type: string
            - key: description
              label: 説明の値パス
              type: string
            - key: required
              label: 必須の値パス
              type: string
            - key: type
              label: 型の写像
              type: object
              fields:
                - key: path
                  label: 型を決める値のパス
                  type: string
                  required: true
                - key: map
                  label: 値辞書
                  type: map
                  value:
                    type: string
                  description: 導出元の値 → フィールド型（例 varchar → string）
                - key: default
                  label: 既定の型
                  type: string
