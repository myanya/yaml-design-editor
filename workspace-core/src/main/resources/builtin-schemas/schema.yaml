id: builtin-schema
name: スキーマ定義
description: _schemas 配下のスキーマ文書を検証・フォーム編集するためのメタスキーマ
match: "_schemas/**/*.{yaml,yml}"
definitions:
  field:
    type: object
    fields:
      - key: key
        label: キー
        type: string
        description: 親オブジェクト内のキー名（ルート・配列要素では不要）
      - key: label
        label: 表示ラベル
        type: string
      - key: type
        label: 型
        type: enum
        values: [string, text, int, number, boolean, enum, date, id, ref, array, map, object, any]
        cases:
          string:
            - key: minLength
              label: 最小文字数
              type: int
            - key: maxLength
              label: 最大文字数
              type: int
            - key: pattern
              label: 形式（正規表現）
              type: string
              description: 値の全体がこの正規表現に一致すること（R16-01）
          text:
            - key: minLength
              label: 最小文字数
              type: int
            - key: maxLength
              label: 最大文字数
              type: int
            - key: pattern
              label: 形式（正規表現）
              type: string
          int:
            - key: min
              label: 最小値
              type: int
            - key: max
              label: 最大値
              type: int
          number:
            - key: min
              label: 最小値
              type: number
            - key: max
              label: 最大値
              type: number
          enum:
            - key: values
              label: 選択肢
              type: array
              item:
                type: any
              description: 文字列、または {value, label, description} のリッチ選択肢
            - key: cases
              label: 値ごとの追加フィールド
              type: map
              value:
                type: array
                item:
                  $ref: field
              description: enum の値ごとに親オブジェクトへ追加される兄弟フィールド
          array:
            - key: item
              label: 要素定義
              $ref: field
            - key: display
              label: 一覧の表示形式
              type: enum
              values: [table, list]
              description: table は表形式に固定、list は縦並びに固定（省略時は列構成から自動判定）
          map:
            - key: value
              label: 値定義
              $ref: field
            - key: display
              label: 一覧の表示形式
              type: enum
              values: [table, list]
              description: table は表形式（キー列つき）に固定、list は縦並びに固定（省略時は列構成から自動判定）
          object:
            - key: fields
              label: 子フィールド
              type: array
              item:
                $ref: field
            - key: unknownFields
              label: スキーマ外キーの扱い
              type: enum
              values: [allow, warning, error]
          id:
            - key: pattern
              label: 形式（正規表現）
              type: string
              description: IDの全体がこの正規表現に一致すること（例 TASK-\d{3}。UX-79）
          ref:
            - key: idPattern
              label: 参照先IDパターン
              type: any
              description: glob 文字列または配列
            - key: idPatterns
              label: 参照先IDパターン（複数）
              type: any
            - key: scope
              label: 探索範囲
              type: object
              fields:
                - key: schemaIds
                  label: スキーマIDの限定
                  type: any
                  description: 文字列または配列
                - key: documentIds
                  label: ドキュメントIDの限定
                  type: any
                  description: 文字列または配列
            - key: relation
              label: 関係種別
              type: string
              description: 例 implements / depends。表示とカバレッジ判定に使う
            - key: target
              label: 参照対象種別
              type: enum
              values: [entity, document]
              description: "document は文書ノード（_document.id ＞ 相対パス）への参照（既定 entity。R21-03）"
            - key: fields
              label: エッジ属性の宣言
              type: array
              item:
                $ref: field
              description: 宣言時のみ {to, 属性...} のオブジェクト形式を許可する（属性付き参照。R20-03）
      - key: required
        label: 必須
        type: boolean
      - key: requiredFrom
        label: このフェーズ以降で必須
        type: string
      - key: role
        label: 表示役割
        type: enum
        values: [title, subtitle]
      - key: default
        label: 初期値
        type: any
      - key: description
        label: 説明
        type: text
      - key: $ref
        label: 名前付き定義への参照
        type: string
        description: definitions 内の名前（横断参照は moduleId#definition）
      - key: ref
        label: 名前付き定義への参照（別記法）
        type: string
root:
  type: object
  fields:
    - key: id
      label: スキーマID
      type: id
      role: title
      description: 安定したスキーマID（省略時はファイル名）
    - key: name
      label: スキーマ名
      type: string
    - key: description
      label: 説明
      type: text
      role: subtitle
    - key: kind
      label: 種別
      type: enum
      values: [document, library, relations]
      description: document（既定）は文書に適用、library は共有する定義の置き場（フィールドの定義 definitions・検査の定義 functions・語彙の定義 vocabulary）、relations は関係レジストリ（保存すると専用フォームが適用される）
    - key: match
      label: 適用パターン（glob）
      type: string
    - key: root
      label: ルート定義
      $ref: field
    - key: definitions
      label: 名前付き定義
      type: map
      value:
        $ref: field
    - key: phases
      label: フェーズ宣言
      type: any
      description: フェーズ名の配列、または {key, order} の object
    - key: entity
      label: エンティティ型の宣言
      type: any
      description: "この文書群の出現のエンティティ型（R20-01）。{type, idPattern, defines, aspect, owns} の object、または複数型のリスト（idPattern で判別）。aspect / owns はこの出現が所有する側面の宣言（R23-01。省略時はスキーマID／宣言フィールド全部）"
    - key: coverage
      label: カバレッジルール
      type: array
      description: "詳細文書の存在（出現ベース detailIn）の要求。被参照数の要求（旧 requiredBy）は廃止——1ホップは関係レジストリの cardinality、条件付き・多段は constraints で宣言する（R29-01）"
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: idPattern
            label: 対象IDパターン
            type: string
          - key: detailIn
            label: 出現ベースの条件
            type: object
            required: true
            fields:
              - key: schemaIds
                label: 出現先スキーマ
                type: any
              - key: minCount
                label: 必要な出現数
                type: int
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: consistency
      label: 整合ルール
      type: array
      description: このスキーマの文書のID要素の値が、導出（計算列と同じ語彙）の期待値と一致することを検証する（R16-03a）
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: idPattern
            label: 対象IDパターン
            type: string
          - key: path
            label: 検査する値の相対パス
            type: string
            required: true
            description: ID要素からの相対YPath（例 type）
          - key: expected
            label: 期待値の導出
            type: object
            required: true
            description: ビューの計算列（computed）と同じ語彙（lookup / source / path / values / map / default）
            fields:
              - key: lookup
                label: 参照の1ホップ
                type: object
                fields:
                  - key: schemaId
                    label: 参照値を読む出現のスキーマ
                    type: string
                  - key: fileGlob
                    label: 参照値を読む出現のファイル（glob）
                    type: string
                  - key: via
                    label: ref フィールドの相対パス
                    type: string
                    required: true
              - key: source
                label: 元値を読む出現
                type: object
                required: true
                fields:
                  - key: schemaId
                    label: スキーマ
                    type: string
                  - key: fileGlob
                    label: ファイル（glob）
                    type: string
              - key: path
                label: 元値の相対パス
                type: string
                required: true
              - key: values
                label: プレースホルダ解決に使う出現
                type: array
                item:
                  type: object
                  fields:
                    - key: schemaId
                      label: スキーマ
                      type: string
                    - key: fileGlob
                      label: ファイル（glob）
                      type: string
              - key: map
                label: 値辞書
                type: map
                value:
                  type: string
              - key: default
                label: 既定値
                type: string
          - key: assert
            label: 判定方法
            type: enum
            values:
              - value: equals
                label: 一致
                description: 宣言値が導出値と一致すること（既定）
              - value: lte
                label: 以下
                description: 宣言値が導出値以下であること（数値として比較。適合判定）
              - value: gte
                label: 以上
                description: 宣言値が導出値以上であること（数値として比較）
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: constraints
      label: 検査（基本の書き方）
      type: array
      description: "検査を1件ずつ書く（P29 Phase 6。CORE-CALCULUS §25）。書き方は2通り——①プリミティブを直接書く: match（クエリ）＋ expect / count / check のどれか ②定義を名前で使う: use（定義の名前）＋ with（渡す値）。consistency などの語彙は、検証の前にこの形へ展開される"
      item:
        type: object
        fields:
          - key: use
            label: 使う定義の名前
            type: string
            description: "functions に定義した検査（組込み定義体・利用者の定義）を名前で使う。use を書いた検査に書けるのは use と with だけ"
          - key: with
            label: 定義へ渡す値
            type: any
            description: "定義の params に対応する値（例 {relation: groups, min: 1}）"
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: match
            label: パターン（node / edge の連鎖）
            type: any
            description: "先頭 node が起点束縛（kind: entity 限定）。例 [{node: {entity: usecase, bind: uc}}, {edge: {relation: uses, dir: in}}, {node: {entity: screen}}]。node: {same: 束縛名} は先行して束縛済みのノードそのものへの到達を要求（ノード一致＝2経路の合流。他のキーと同居不可）"
          - key: also
            label: 分岐（1段）
            type: any
            description: "束縛済みノードからのもう1本の連鎖（内部結合）。例 {from: col, steps: [{edge: {relation: dtype}}, {node: {same: t}}]}"
          - key: where
            label: プロパティ述語
            type: any
            description: "equals / notEquals / exists のいずれか一つ（例 {of: br, path: status, notEquals: approved}）。notEquals は値があり指定値でないとき成立（値がなければ黙る）"
          - key: limit
            label: 照合上限
            type: int
          - key: expect
            label: 期待
            type: enum
            description: count / check と排他（いずれか一つを宣言する）
            values:
              - value: exists
                label: 存在すること
                description: 起点ごとにパターンの解が1つ以上あること
              - value: absent
                label: 存在しないこと
                description: 起点ごとにパターンの解がないこと
          - key: count
            label: 解の件数
            type: object
            description: 起点ごとの解（束縛の組）の distinct 件数が範囲内であること（expect / check と排他。数えたい対象に bind を書く）
            fields:
              - key: min
                label: 下限
                type: int
              - key: max
                label: 上限
                type: int
          - key: check
            label: 判定述語
            type: any
            description: "値の比較（R28-08）。{lte|gte|lt|gt|eq|ne: [左, 右]} または {op: 演算子, left: 左, right: 右} の配列（すべて成立が期待。expect / count と排他）。左右は値の式——読み出し {of: 束縛, in: {schemaId, fileGlob}, path: 相対パス}（in は値を読む文書の指定。省略可）・決まった値 {value}・テンプレートの展開 {format: 式, scopes: [{of, in}]}・辞書での置き換え {map: 式, using: {元: 先}}・最初に得られた値 {first: [式]}。同じ ID が書かれた文書の組をすべて調べ、条件を満たさない組を1つでも見つけたら指摘・評価できる組がなければ黙る。大小の比較は両辺が数値のときだけ評価する"
          - key: message
            label: 指摘の文面のひな型
            type: string
            description: "check の指摘の文面（省略時は既定の文面）。{left} {right}（比べた値）・{left.raw} {right.raw}（計算前の元の値）を書ける"
          - key: reportAt
            label: 指摘を出す場所（値の場所）
            type: any
            description: "{of: 束縛, in: {schemaId, fileGlob}, path: 相対パス}。省略時は起点を定義した場所。値の場所を選ぶと、その値が書かれた文書の検証で、要素ごとに報告する（check と組み合わせて使う）"
          - key: responses
            label: エラー時の対応
            type: any
            description: "対応の宣言の配列。{jump: left.source|right.source|left.inputs|right.inputs, label}（値の出どころへ移動）・{apply: left|right, label}（値を指摘の場所へ書き込む。reportAt が必要）。label には {left} {right} {left.raw} {right.raw}、inputs では {input.placeholder} {input.value} を書ける"
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: functions
      label: 検査の定義（関数のような定義）
      type: array
      description: "名前と受け取る値を持つ検査の定義（P29 Phase 6）。constraints の use で名前を指定して使う。どのスキーマ文書に書いてもワークスペース全体で使える（置き場は kind: library が向く）"
      item:
        type: object
        fields:
          - key: id
            label: 定義の名前
            type: string
            required: true
            role: title
          - key: description
            label: 説明
            type: text
            role: subtitle
          - key: params
            label: 受け取る値の名前
            type: array
            item: { type: string }
          - key: checks
            label: 中身（検査のひな型）
            type: any
            required: true
            description: "constraints と同じ書き方の検査の配列。文字列の $名前 に、渡された値が差し込まれる（文字列がちょうど $名前 なら値そのもの＝配列やマップも渡せる。文中の $名前 は文字列として埋まる。$ そのものは $$）"
    - key: vocabulary
      label: 語彙の定義（短く書くための書き方）
      type: array
      description: "スキーマに短く書ける書き方を作る（P29 Phase 6）。どこに書けるか（in）と、書かれた内容からどの定義をどの値で使うか（uses）を宣言する。スキーマの consistency は、組込み定義体が作る語彙"
      item:
        type: object
        fields:
          - key: word
            label: 語彙の名前
            type: string
            required: true
            role: title
          - key: description
            label: 説明
            type: text
            role: subtitle
          - key: in
            label: 書ける場所
            type: string
            required: true
            description: "スキーマ直下の配列の各要素（例 consistency[]）"
          - key: uses
            label: 定義の使用への対応
            type: any
            required: true
            description: "{when: キー, unless: キー, use: 定義の名前, with: {受け取る値: 指定}} の配列。when / unless はそのキーが書かれている／いないときだけ有効。with の指定は、そのままの値・{from: パス, default, map}（書かれた内容から読む）・{schema: id}（書かれたスキーマのID）"
    - key: matrix
      label: 網羅マトリクス
      type: array
      description: "行×列の全組合せに証人（witness）が存在することを検証する（R28-03。例: 処理×試験観点→テスト項目）。あえて対象外のセルは証人側に excluded: true の行として残す（存在＝充足）"
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: rows
            label: 行の母集団
            type: any
            required: true
            description: "エンティティ選択（entity / schema / id。例 {entity: process}）"
          - key: columns
            label: 列の母集団
            type: any
            required: true
            description: "エンティティ選択（例 {entity: test-viewpoint}）"
          - key: witness
            label: 証人
            type: object
            required: true
            description: 行と列の両方を参照していればセルを充足するエンティティ
            fields:
              - key: node
                label: 証人の選択
                type: any
                required: true
                description: "例 {entity: test-item, schema: unit-test-item}"
              - key: row
                label: 行への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
              - key: column
                label: 列への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: flow
      label: 遷移検証
      type: array
      description: "宣言エッジ集合（遷移の原本）の到達閉包で、到達不能・行き止まり・宣言外遷移を検出する（R28-04。例: 画面遷移・状態遷移）。指摘はノードの定義出現に報告する"
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: string
          - key: description
            label: 説明
            type: string
          - key: nodes
            label: ノード母集団
            type: any
            required: true
            description: "エンティティ選択（entity / schema / id。例 {entity: screen}）"
          - key: edges
            label: 宣言エッジ
            type: object
            required: true
            description: 同じ行オブジェクト直下の from 参照と to 参照の組を1エッジとして抽出する
            fields:
              - key: from
                label: 遷移元への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
              - key: to
                label: 遷移先への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
          - key: start
            label: 開始ノードへの参照
            type: object
            description: 開始ノードを指す relation。省略時は到達不能を判定しない（開始データが空のときも判定保留）
            fields:
              - { key: relation, label: relation, type: string, required: true }
          - key: terminal
            label: 終端ノードへの参照
            type: object
            description: 終端として許容するノードを指す relation（行き止まり判定から除外する）
            fields:
              - { key: relation, label: relation, type: string, required: true }
          - key: usage
            label: 使用エッジ
            type: object
            description: 宣言外遷移の検出対象（このエッジ集合が宣言エッジに含まれることを要求。省略時は判定しない）
            fields:
              - key: from
                label: 遷移元への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
              - key: to
                label: 遷移先への参照
                type: object
                required: true
                fields:
                  - { key: relation, label: relation, type: string, required: true }
          - key: level
            label: 重大度
            type: enum
            values: [warning, error]
          - key: activeFrom
            label: 判定を始めるフェーズ
            type: string
    - key: derive
      label: 派生スキーマの宣言
      type: object
      description: 導出元文書（例 テーブル定義書）から検証スキーマをロード時にコンパイルする（R11-03）
      fields:
        - key: from
          label: 導出元文書（glob）
          type: string
          required: true
        - key: each
          label: 導出単位の配列パス
          type: string
          description: 1文書内の複数要素から導出する場合の配列パス（省略時は文書ルート）
        - key: id
          label: 導出スキーマID
          type: string
          required: true
          description: "{パス} が導出元要素の値で置換される（例 record-{id}）"
        - key: name
          label: 導出スキーマ名
          type: string
        - key: match
          label: 導出スキーマの適用先（glob）
          type: string
          required: true
        - key: fields
          label: フィールドの写像
          type: object
          required: true
          fields:
            - key: source
              label: フィールドにする配列のパス
              type: string
              required: true
            - key: key
              label: キーの値パス
              type: string
              required: true
            - key: label
              label: ラベルの値パス
              type: string
            - key: description
              label: 説明の値パス
              type: string
            - key: required
              label: 必須の値パス
              type: string
            - key: type
              label: 型の写像
              type: object
              fields:
                - key: path
                  label: 型を決める値のパス
                  type: string
                  required: true
                - key: map
                  label: 値辞書
                  type: map
                  value:
                    type: string
                  description: 導出元の値 → フィールド型（例 varchar → string）
                - key: default
                  label: 既定の型
                  type: string
