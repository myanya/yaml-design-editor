id: builtin-view
name: ビュー定義（横断一覧・文書ビュー）
match: "_views/**/*.{yaml,yml}"
definitions:
  docBacklinks:
    type: object
    fields:
      - key: idPattern
        label: 対象IDパターン
        type: string
        description: 文書内のこのglobに一致するIDだけを対象にする（省略時は全ID）
      - key: relation
        label: 関係種別の限定
        type: string
        description: 参照の relation がこの値の被参照だけを表示する（省略時は全被参照）
      - key: schemaIds
        label: 参照元スキーマの限定
        type: array
        item:
          type: string
        description: 参照元文書のスキーマIDを限定する（省略時は制限なし）
      - key: columns
        label: 表示列
        type: array
        description: 参照元要素から表示する値の列（省略時はID・タイトルの要約のみ）
        item:
          type: object
          fields:
            - key: label
              label: 見出し
              type: string
              required: true
            - key: path
              label: 相対パス
              type: string
              required: true
              description: 参照元要素からの相対YPath（例 name）
root:
  type: object
  fields:
    - key: default
      label: 開始時に表示（dashboard）
      type: boolean
      description: ワークスペースの開始画面にするダッシュボードを1件指定する（未指定なら定義ファイル名順）
    - key: id
      label: ビューID
      type: id
      required: true
    - key: name
      label: 表示名
      type: string
    - key: description
      label: 説明
      type: text
    - key: kind
      label: ビュー種別
      type: enum
      values:
        - value: grid
          label: 横断グリッド
          description: 行（論理ID）×列（出現からの相対パス）の横断一覧（省略時の既定）
        - value: document
          label: 文書ビュー
          description: match / schemaId に一致する文書のフォーム表示を sections で合成する
        - value: matrix
          label: クロス集計
          description: 行（rows の論理ID）×列（cells.columns＝参照先か値）のセルに、行から集めた要素の集計を出す。合計の行と列つき
        - value: flow
          label: フロービュー
          description: 文書をprojectionでノード・辺・レーンへ変換する
        - value: lens
          label: レンズの見え方
          description: グラフレンズ（実体・型の段）の見え方をワークスペースで共有する（関係ごとの矢印の向き）。表示だけの定義
        - value: dashboard
          label: ダッシュボード
          description: 既存ビューの件数・一覧・対象の詳細・操作を業務の入口として合成する
        - value: chart
          label: チャート
          description: 元の表（グリッドかクロス集計）の行を横軸の項目、数の列を系列にして描く（棒・積み上げ棒・横棒・折れ線・面・円・散布図）。データは元の表が持つ
      default: grid
    - key: chart
      label: 図の種類（chart）
      type: enum
      values:
        - { value: bar, label: 棒 }
        - { value: stacked-bar, label: 積み上げ棒 }
        - { value: horizontal-bar, label: 横棒（名前は左・値は棒の端） }
        - { value: stacked-horizontal-bar, label: 積み上げ横棒 }
        - { value: line, label: 折れ線 }
        - { value: area, label: 面（線の下を塗る） }
        - { value: stacked-area, label: 積み上げ面（系列を下から積んだ帯） }
        - { value: scatter, label: 散布図（x は横軸の数の列・点＝行） }
        - { value: pie, label: 円（最初の系列だけ） }
    - key: view
      label: 元の表（chart）
      type: ref
      scope: {schemaIds: [builtin-view]}
      description: 一意なグリッドまたはクロス集計のID。行＝横軸の項目、列＝系列
    - key: series
      label: 系列にする列（chart）
      type: array
      item: {type: string}
      description: 列の見出しの並び。省略すると数として読める列すべて（クロス集計の合計と未分類の列は除く。合計を描くなら series に「合計」と書く）
    - key: x
      label: 横軸の文字にする列（chart）
      type: string
      description: 省略すると行のタイトル（無ければ ID）。散布図（scatter）では横軸にする数の列（必須）
    - key: label
      label: "点の名前の列（chart: scatter）"
      type: string
      description: 散布図で点の名前にする列。省略すると行のタイトル（無ければ ID）。他の図では x が項目の文字
    - key: "y"
      label: 縦軸（chart）
      type: object
      fields:
        - { key: label, label: 見出し, type: string }
        - { key: format, label: 値の形, type: string, description: "DecimalFormat のパターン（例 #,##0）。軸とマウスを載せたときの文字" }
    - key: drill
      label: 押したときの材料の一覧（chart）
      type: enum
      values:
        - { value: popup, label: 押した場所に浮いた一覧（既定） }
        - { value: below, label: 図の下に一覧 }
        - { value: right, label: 図の右に一覧 }
        - { value: none, label: 出さない }
      default: popup
      description: 棒・点・扇形を押すと、そのセルの材料（集めた要素と値）が並び、各要素の業務詳細か原本へ進める
    - key: scale
      label: "軸の種類（chart: scatter）"
      type: object
      description: 散布図の軸を対数にする（値が桁で散るとき）。対数の軸では 0 以下の値は描かない
      fields:
        - { key: x, label: 横軸, type: enum, values: [linear, log], default: linear }
        - { key: "y", label: 縦軸, type: enum, values: [linear, log], default: linear }
    - key: actions
      label: 主な操作（dashboard）
      type: array
      item: {type: string}
      description: 対象を持たないアクションのIDを表示順に指定する
    - key: placement
      label: 区画の並べ方（dashboard）
      type: enum
      values:
        - { value: auto, label: 自動（幅が十分で横に 3 段以上になるときだけ縦） }
        - { value: horizontal, label: 横（折り返して並べる） }
        - { value: vertical, label: 縦（左の一覧） }
      default: auto
      description: 区画のタイル（見出しと件数）の並べ方。群（sections[].group）ごとに見出しが付き、畳める
    - key: inputs
      label: 共有の入力（dashboard）
      type: array
      description: 全区画に共有する入力。値は区画の filter と、区画が参照する表の params に $名前 で渡る。空の値は絞らない
      item:
        type: object
        fields:
          - { key: key, label: 名前, type: string, required: true }
          - { key: label, label: 見出し, type: string }
          - { key: type, label: 種類, type: enum, values: [date, enum, string], default: string }
          - key: values
            label: 選択の候補（enum）
            type: array
            item: { type: any }
            description: "値の文字か {value, label}"
          - key: default
            label: 初期値
            type: string
            description: "値か、$today / $monthStart / $monthEnd（基準日から決める）"
    - key: params
      label: 受け取る値（grid / matrix）
      type: array
      item: { type: string }
      description: "名前の並び。クエリ行の rows.where とクロス集計の cells.where に $名前 で書く。ダッシュボードの inputs から渡り、値が無ければその条件は外れる（絞らない）"
    - key: relations
      label: 関係ごとの見え方（lens）
      type: array
      description: "グラフレンズで描く関係ごとの見え方（kind: lens）。name は関係レジストリの関係名か、ref 項目の relation"
      item:
        type: object
        fields:
          - { key: name, label: 関係名, type: string, required: true, role: title }
          - key: arrow
            label: 矢印の向き
            type: enum
            values: [forward, reverse]
            default: forward
            description: forward（既定）は参照を書いた側から相手へ（文字は label）、reverse は相手から参照を書いた側へ（文字は inverseLabel）。表示だけで、検証・クエリの向きは変わらない
    - key: layout
      label: フローの配置
      type: object
      fields:
        - {key: direction, label: 方向, type: enum, values: [down, right], default: down}
    - key: projection
      label: フローへの変換
      type: object
      fields:
        - {key: id, label: 変換ID, type: string, required: true}
        - {key: name, label: 名前, type: string}
        - {key: description, label: 説明, type: text}
        - {key: build, label: 出力のひな型, type: any, required: true}
        - {key: rules, label: 子に当てる規則, type: array, item: {type: any}}
    - key: cells
      label: セルの集計（matrix）
      type: object
      description: "行の要素を起点に集める照合（値の式の all の match の形）と、列の軸、集計の種類"
      fields:
        - key: match
          label: 照合
          type: any
          description: "行の要素を起点に、セルに数える要素まで辿る（例 [{node: {entity: month, bind: m}}, {edge: {via: month, dir: in}}, {node: {entity: transaction, bind: tx}}]）"
        - key: where
          label: 絞り込み
          type: any
        - key: also
          label: 合流の照合
          type: any
        - key: of
          label: 数える要素の束縛名
          type: string
          required: true
        - key: in
          label: 値を読む文書の指定
          type: object
          fields:
            - { key: schemaId, label: スキーマ, type: string }
            - { key: fileGlob, label: ファイル（glob）, type: string }
        - key: path
          label: 集計する値（相対パス）
          type: string
          description: sum / min / max のとき必須（例 amount）
        - key: aggregate
          label: 集計
          type: enum
          values: [count, sum, min, max]
          default: count
        - key: type
          label: 順序の種類
          type: enum
          values: [number, date]
          description: min / max を日付で比べるなら date
        - key: columns
          label: 列の軸
          type: object
          description: "via（要素の参照先が列。idPattern で列にする ID の形、order で並び）か path（要素の値が列。values で並びと見出し）か value（要素ごとに値の式で計算した値が列。列はデータから広がる）"
          fields:
            - key: value
              label: 値の式（計算した値が列）
              type: any
              description: "要素ごとに計算した値で列を広げる（例 {yearMonth: {path: orderedAt}}＝受付日の年月）。列はデータに現れた値を順序の種類で並べる（見出しは label の式、先に並べる値は order）。via / path とは一緒に書けない"
            - key: label
              label: 列の見出しの式（value）
              type: any
              description: "列の値を計算した要素で見出しを計算する式（例 商品の categoryId を列にし、見出しは参照を辿ったカテゴリー名）。無ければ値の文字"
            - { key: via, label: 参照の項目（参照先が列）, type: string }
            - { key: idPattern, label: 列にする ID の形（via）, type: string }
            - key: schemaIds
              label: 列のスキーマの限定（via）
              type: array
              item: { type: string }
            - key: order
              label: 列の並び（via / value）
              type: any
              description: "via なら {schemaId, fileGlob}（並び基準の出現）、value なら先に並べる値の配列（書かない値はその後ろに値の順）"
            - { key: path, label: 値の項目（値が列）, type: string }
            - key: values
              label: 列にする値の並び（path）
              type: array
              item: { type: any }
              description: "値の文字か {value, label}（見出し）"
    - key: totals
      label: 合計の行と列（matrix）
      type: boolean
      default: true
    - key: unclassified
      label: 未分類の列の見出し（matrix）
      type: any
      description: "列の軸に当たらない要素の列。既定は「（未分類）」。false で出さない"
    - key: display
      label: セルの数の表示の形（matrix）
      type: enum
      values: [grouped]
      description: grouped は桁区切り（画面の見せ方だけ）
    - key: match
      label: 適用先ファイル（glob）
      type: string
      description: "文書ビューのみ: このglobに一致する文書へ適用する（schemaId と併記時は AND）"
    - key: schemaId
      label: 適用先スキーマ
      type: string
      description: "文書ビューのみ: このスキーマが適用される文書へ適用する"
    - key: sections
      label: セクションの定義
      type: array
      description: "documentはfields / backlinks / flowのいずれか、dashboardはid・view・任意のfilterを持つ区画"
      item:
        type: object
        fields:
          - {key: id, label: 区画ID（dashboard）, type: string}
          - key: group
            label: 群（dashboard）
            type: string
            description: 同じ名前の区画を見出し付きでまとめる（例 状況・内訳・図）。書かない区画は無名の群として先頭に並ぶ
          - key: view
            label: 参照するビュー（dashboard）
            type: ref
            scope: {schemaIds: [builtin-view]}
            description: 一意なgridまたはmatrixのID
          - key: filter
            label: 対象の条件（dashboard）
            type: object
            description: 行のエンティティを起点に既存の検査を評価し、充足した行を表示する。$todayは基準日のYYYY-MM-DD
            fields:
              - {key: id, label: 条件ID, type: string}
              - {key: description, label: 説明, type: text}
              - {key: match, label: 照合, type: array, item: {type: any}, required: true}
              - {key: where, label: 対象の絞り込み, type: array, item: {type: any}}
              - {key: also, label: 合流の照合, type: any}
              - {key: expect, label: 存在の判定, type: enum, values: [exists, absent]}
              - key: count
                label: 件数の判定
                type: object
                fields:
                  - {key: min, label: 最小, type: int}
                  - {key: max, label: 最大, type: int}
              - {key: check, label: 値の比較, type: array, item: {type: any}}
              - {key: forAll, label: すべての要素の判定, type: any}
              - {key: message, label: 説明のひな型, type: string}
              - {key: limit, label: 解の上限, type: int}
          - key: label
            label: 見出し
            type: string
          - key: fields
            label: フォームセクション
            type: object
            description: スキーマ駆動フォームの射影（path 省略時はルート全体。backlinks とは併用不可）
            fields:
              - key: path
                label: 表示するデータのYPath
                type: string
                description: 文書ルートからの相対YPath（例 actors）。省略時はルート全体
              - key: definition
                label: 定義参照
                type: string
                description: このセクションが参照する named definition（module#name。schemaId 指定時は名前だけでも可）。パス先のフィールドが実際にこの定義を参照しているかをリントで検査する
              - key: include
                label: 表示キーの選別
                type: array
                item:
                  type: string
                description: 列挙したキーだけをこの順で表示する（exclude とは併用不可）
              - key: exclude
                label: 表示キーの除外
                type: array
                item:
                  type: string
                description: 列挙したキーを表示から除く
          - key: backlinks
            label: 被参照表セクション
            description: 文書内のIDへの被参照（参照元）を一覧表示する（fields とは併用不可）
            $ref: docBacklinks
          - key: flow
            label: フローセクション
            type: object
            description: fields / backlinksとは併用不可
            fields:
              - key: view
                label: フロービューID
                type: ref
                scope:
                  schemaIds: [builtin-view]
                required: true
          - key: chart
            label: チャートセクション
            type: object
            description: "チャート（kind: chart）を文書の表示に埋め込む。fields / backlinks / flow とは併用不可"
            fields:
              - key: view
                label: チャートID
                type: ref
                scope:
                  schemaIds: [builtin-view]
                required: true
    - key: attachments
      label: 要素単位アタッチ
      type: array
      description: "文書ビューのみ: at パターンに一致する要素の展開フォーム内に、その要素のIDへの被参照表を差し込む"
      item:
        type: object
        fields:
          - key: label
            label: 見出し
            type: string
          - key: at
            label: 差し込み先の要素パス
            type: string
            required: true
            description: YPath 構文＋ [*]（任意のインデックス。例 actors[*]）
          - key: backlinks
            label: 被参照表
            required: true
            description: 差し込む被参照の条件（セクションの backlinks と同じ語彙）
            $ref: docBacklinks
    - key: rows
      label: 行の定義
      type: object
      description: "横断グリッドのみ（必須）: 行になる論理IDの条件（idPattern）か、パターン照合のクエリ行（match。R22-02）のどちらか一方。クロス集計では idPattern か value（値の軸）"
      fields:
        - key: idPattern
          label: 対象IDパターン
          type: string
          description: このglobに一致する論理IDが行になる（例 SCR-*。match とは併用不可）
        - key: value
          label: 値の式（クロス集計の行を値で広げる）
          type: any
          description: "kind: matrix のみ。照合の起点の要素ごとに計算した値を行にし、同じ値を 1 行にまとめる（例 {yearMonth: {path: orderedAt}}＝受付日の年月ごとの行）。idPattern とは一緒に書けない。行は値の順序の種類で並ぶ"
        - key: schemaIds
          label: 出現スキーマの限定
          type: array
          item:
            type: string
          description: 指定時、いずれかのスキーマに出現するIDだけを行にする
        - key: match
          label: クエリ行（パターン照合）
          type: any
          description: "node / edge の交互連鎖（例 [{node: {entity: screen, bind: scr}}, {edge: {relation: uses}}, {node: {entity: usecase, bind: uc}}]）。行 = 束縛行（R22-02。ARCHITECTURE §4.32）"
        - key: also
          label: 分岐（1段）
          type: any
          description: "束縛済みノードからのもう1本の連鎖（{from: 束縛名, steps: [...]}。内部結合）"
        - key: where
          label: プロパティ述語
          type: any
          description: "束縛ノードの値の絞り込み（例 [{of: scr, path: status, equals: approved}]）。条件はスキーマの constraints の where と同じ（equals / notEquals / exists / empty / oneOf / matches / startsWith / endsWith / contains / lt / lte / gt / gte）"
        - key: rowKey
          label: 行キーの束縛名
          type: string
          description: "クエリ行の行キー（省略時は先頭の bind。kind: entity 限定）"
        - key: limit
          label: 行数上限
          type: int
          description: クエリ行の上限（既定 100。超過は決定的打切り）
    - key: order
      label: 行の並び（chart では項目の並び）
      type: object
      fields:
        - key: series
          label: 並びの系列（chart）
          type: string
          description: "kind: chart のみ。この系列の値の順に項目を並べる（省略すると最初の系列。direction で向き）"
        - key: schemaId
          label: 並び基準の出現スキーマ
          type: string
        - key: fileGlob
          label: 並び基準の出現ファイル（glob）
          type: string
        - key: path
          label: 並びの値（相対パス）
          type: string
          description: 並び基準の出現の要素から読む値で並べる（例 date）。省略時は出現の文書内順
        - key: type
          label: 順序の種類
          type: enum
          values: [number, date]
          description: 値を数として／日付として比べる（省略時は文字の順）。path と一緒に書く
        - key: direction
          label: 向き
          type: enum
          values: [asc, desc]
          default: asc
          description: desc は大きい順・新しい順（値の無い行はどちらでも後ろ）。path と一緒に書く
      description: 条件に一致する出現の文書内順、または path の値の順で並べる（省略時はID順）
    - key: columns
      label: 列の定義
      type: array
      description: "横断グリッドのみ（必須）: 一覧の列"
      item:
        type: object
        fields:
          - key: label
            label: 見出し
            type: string
            description: path / backlinks / value の列では必須（definition / each の列では要素から決まるので書かない）
          - key: schemaId
            label: 値を取る出現のスキーマ
            type: string
          - key: fileGlob
            label: 値を取る出現のファイル（glob）
            type: string
          - key: path
            label: 相対パス
            type: string
            description: 出現要素からの相対YPath（例 name / areas / inputs[0].type）。path / backlinks / definition / value / each のいずれか一つが必要
          - key: definition
            label: 定義参照
            type: string
            description: named definition（module#name。schemaId 指定時は名前だけでも可）のセル型フィールドを列集合に展開する（ラベル・パスは定義から導出。label / path / backlinks とは併用不可）
          - key: of
            label: 値元の束縛名
            type: string
            description: "クエリ行（rows: match）のみ: この列の値を取る束縛（省略時は行キー。結合先の値をセル化する。R22-02）"
          - key: editable
            label: 一覧上で編集可
            type: boolean
            default: false
          - key: display
            label: 桁区切り
            type: enum
            values: [grouped]
            description: "grouped は桁区切り（45000 → 45,000）。画面の見せ方だけで、CLI や書き出しの値は変えない。path の列は項目の側の display: grouped も効く"
          - key: format
            label: 表示の形
            type: string
            description: "画面で見せる形（数は DecimalFormat のパターン 例 ¥#,##0・日付などは DateTimeFormatter のパターン 例 yyyy年M月d日）。値は変えない。path の列は項目の側の format も効く"
          - key: each
            label: 要素ごとに列を広げる
            type: object
            description: "idPattern に合う要素ごとに列を作る（見出しは要素のタイトル）。value の式の中で列の要素の ID を $bind の名前（例 node: { id: $cat }）で指す。label / path / editable とは併用不可"
            fields:
              - key: idPattern
                label: 列にする ID の形
                type: string
                required: true
              - key: schemaIds
                label: 列のスキーマの限定
                type: array
                item: { type: string }
              - key: order
                label: 列の並び
                type: object
                fields:
                  - { key: schemaId, label: 並び基準の出現スキーマ, type: string }
                  - { key: fileGlob, label: 並び基準の出現ファイル（glob）, type: string }
              - key: bind
                label: 列の要素を指す名前
                type: string
                required: true
          - key: backlinks
            label: バックリンク列
            type: object
            description: 行IDへの被参照（参照元）を一覧表示する列にする（path / editable とは併用不可）
            fields:
              - key: relation
                label: 関係種別の限定
                type: string
                description: 参照の relation がこの値の被参照だけを表示する（省略時は全被参照）
              - key: schemaIds
                label: 参照元スキーマの限定
                type: array
                item:
                  type: string
                description: 参照元文書のスキーマIDを限定する（省略時は制限なし）
          - key: value
            label: 値の式
            type: string
            expression: true
            description: "列の値を値の式で決める読み取り専用の派生列（path / backlinks / definition / editable とは併用不可）。短い書き方は {パス} を含む文字列（例 {name}（{status}））、完全な書き方は値の式（例 {max: {path: \"comments[*].date\", type: date}}＝配列の各要素の date の最大。ひな型の展開 {format: {via: type, in: {schemaId: 写像}, path: to}, scopes: [...]}＝参照を辿った相手のひな型を穴埋め。集合から配列へ {all: {match: [...], where: [...], of: 束縛}}＝行の要素を起点にした照合の解の配列で、{count: {all: ...}} が件数・{sum: {all: {..., path: amount}}} が合計。要素ごとの式は {each: 配列の式, value: 式}。既定値は {first: [式, 値]}）。穴と path は schemaId / fileGlob で選んだ行の出現の要素から読む。{id} は行の ID・{title} は表示の解決結果"
    - key: detail
      label: 詳細文書
      type: object
      fields:
        - key: schemaId
          label: 詳細と見なす出現のスキーマ
          type: string
        - key: fileGlob
          label: 詳細と見なす出現のファイル（glob）
          type: string
        - key: filePattern
          label: 新規作成先パターン
          type: string
          expression: true
          description: "「作成」の作り先。値の式を受け取る項目（短い書き方は {パス} を含む文字列。例 designs/{id}_{name}.yaml＝穴は行の要素の値・{id} は行のID・{title} は表示の解決結果。完全な書き方は {format, with} などの値の式）。穴に入った値はファイル名に使える文字に直される"
    - key: newRow
      label: 新規行の入口
      type: object
      fields:
        - key: file
          label: 一覧文書のファイル
          type: string
          description: 配列モード。path と対で指定し、一覧文書内の配列へ新しい要素を追加する
        - key: path
          label: 追加先の配列YPath
          type: string
        - key: filePattern
          label: 新規作成先パターン
          type: string
          expression: true
          description: ファイルモード。例 designs/{id}.yaml（入力したIDで {id} を置換した詳細文書を新規作成する。行がまだ無いので、書ける穴は {id} だけ。file / path とは併用不可）
