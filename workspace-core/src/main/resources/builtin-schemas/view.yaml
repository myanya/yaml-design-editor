id: builtin-view
name: ビュー定義（横断一覧・文書ビュー）
match: "_views/**/*.{yaml,yml}"
definitions:
  docBacklinks:
    type: object
    fields:
      - key: idPattern
        label: 対象IDパターン
        type: string
        description: 文書内のこのglobに一致するIDだけを対象にする（省略時は全ID）
      - key: relation
        label: 関係種別の限定
        type: string
        description: 参照の relation がこの値の被参照だけを表示する（省略時は全被参照）
      - key: schemaIds
        label: 参照元スキーマの限定
        type: array
        item:
          type: string
        description: 参照元文書のスキーマIDを限定する（省略時は制限なし）
      - key: columns
        label: 表示列
        type: array
        description: 参照元要素から表示する値の列（省略時はID・タイトルの要約のみ）
        item:
          type: object
          fields:
            - key: label
              label: 見出し
              type: string
              required: true
            - key: path
              label: 相対パス
              type: string
              required: true
              description: 参照元要素からの相対YPath（例 name）
root:
  type: object
  fields:
    - key: id
      label: ビューID
      type: id
      required: true
    - key: name
      label: 表示名
      type: string
    - key: description
      label: 説明
      type: text
    - key: kind
      label: ビュー種別
      type: enum
      values:
        - value: grid
          label: 横断グリッド
          description: 行（論理ID）×列（出現からの相対パス）の横断一覧（省略時の既定）
        - value: document
          label: 文書ビュー
          description: match / schemaId に一致する文書のフォーム表示を sections で合成する
      default: grid
    - key: match
      label: 適用先ファイル（glob）
      type: string
      description: "文書ビューのみ: このglobに一致する文書へ適用する（schemaId と併記時は AND）"
    - key: schemaId
      label: 適用先スキーマ
      type: string
      description: "文書ビューのみ: このスキーマが適用される文書へ適用する"
    - key: sections
      label: セクションの定義
      type: array
      description: "文書ビューのみ: 上から順に描画するセクション（fields か backlinks のどちらか一方を持つ）"
      item:
        type: object
        fields:
          - key: label
            label: 見出し
            type: string
          - key: fields
            label: フォームセクション
            type: object
            description: スキーマ駆動フォームの射影（path 省略時はルート全体。backlinks とは併用不可）
            fields:
              - key: path
                label: 表示するデータのYPath
                type: string
                description: 文書ルートからの相対YPath（例 actors）。省略時はルート全体
              - key: definition
                label: 定義参照
                type: string
                description: このセクションが参照する named definition（module#name。schemaId 指定時は名前だけでも可）。パス先のフィールドが実際にこの定義を参照しているかをリントで検査する
              - key: include
                label: 表示キーの選別
                type: array
                item:
                  type: string
                description: 列挙したキーだけをこの順で表示する（exclude とは併用不可）
              - key: exclude
                label: 表示キーの除外
                type: array
                item:
                  type: string
                description: 列挙したキーを表示から除く
          - key: backlinks
            label: 被参照表セクション
            description: 文書内のIDへの被参照（参照元）を一覧表示する（fields とは併用不可）
            $ref: docBacklinks
    - key: attachments
      label: 要素単位アタッチ
      type: array
      description: "文書ビューのみ: at パターンに一致する要素の展開フォーム内に、その要素のIDへの被参照表を差し込む"
      item:
        type: object
        fields:
          - key: label
            label: 見出し
            type: string
          - key: at
            label: 差し込み先の要素パス
            type: string
            required: true
            description: YPath 構文＋ [*]（任意のインデックス。例 actors[*]）
          - key: backlinks
            label: 被参照表
            required: true
            description: 差し込む被参照の条件（セクションの backlinks と同じ語彙）
            $ref: docBacklinks
    - key: rows
      label: 行の定義
      type: object
      description: "横断グリッドのみ（必須）: 行になる論理IDの条件（idPattern）か、パターン照合のクエリ行（match。R22-02）のどちらか一方"
      fields:
        - key: idPattern
          label: 対象IDパターン
          type: string
          description: このglobに一致する論理IDが行になる（例 SCR-*。match とは併用不可）
        - key: schemaIds
          label: 出現スキーマの限定
          type: array
          item:
            type: string
          description: 指定時、いずれかのスキーマに出現するIDだけを行にする
        - key: match
          label: クエリ行（パターン照合）
          type: any
          description: "node / edge の交互連鎖（例 [{node: {entity: screen, bind: scr}}, {edge: {relation: uses}}, {node: {entity: usecase, bind: uc}}]）。行 = 束縛行（R22-02。ARCHITECTURE §4.32）"
        - key: also
          label: 分岐（1段）
          type: any
          description: "束縛済みノードからのもう1本の連鎖（{from: 束縛名, steps: [...]}。内部結合）"
        - key: where
          label: プロパティ述語
          type: any
          description: "束縛ノードの値の絞り込み（例 [{of: scr, path: status, equals: approved}]。equals / exists のみ）"
        - key: rowKey
          label: 行キーの束縛名
          type: string
          description: "クエリ行の行キー（省略時は先頭の bind。kind: entity 限定）"
        - key: limit
          label: 行数上限
          type: int
          description: クエリ行の上限（既定 100。超過は決定的打切り）
    - key: order
      label: 行の並び
      type: object
      fields:
        - key: schemaId
          label: 並び基準の出現スキーマ
          type: string
        - key: fileGlob
          label: 並び基準の出現ファイル（glob）
          type: string
      description: 条件に一致する出現の文書内順で並べる（省略時はID順）
    - key: columns
      label: 列の定義
      type: array
      description: "横断グリッドのみ（必須）: 一覧の列"
      item:
        type: object
        fields:
          - key: label
            label: 見出し
            type: string
            required: true
          - key: schemaId
            label: 値を取る出現のスキーマ
            type: string
          - key: fileGlob
            label: 値を取る出現のファイル（glob）
            type: string
          - key: path
            label: 相対パス
            type: string
            description: 出現要素からの相対YPath（例 name / areas / inputs[0].type）。path / backlinks / definition のいずれか一つが必要
          - key: definition
            label: 定義参照
            type: string
            description: named definition（module#name。schemaId 指定時は名前だけでも可）のセル型フィールドを列集合に展開する（ラベル・パスは定義から導出。label / path / backlinks とは併用不可）
          - key: of
            label: 値元の束縛名
            type: string
            description: "クエリ行（rows: match）のみ: この列の値を取る束縛（省略時は行キー。結合先の値をセル化する。R22-02）"
          - key: editable
            label: 一覧上で編集可
            type: boolean
            default: false
          - key: backlinks
            label: バックリンク列
            type: object
            description: 行IDへの被参照（参照元）を一覧表示する列にする（path / editable とは併用不可）
            fields:
              - key: relation
                label: 関係種別の限定
                type: string
                description: 参照の relation がこの値の被参照だけを表示する（省略時は全被参照）
              - key: schemaIds
                label: 参照元スキーマの限定
                type: array
                item:
                  type: string
                description: 参照元文書のスキーマIDを限定する（省略時は制限なし）
          - key: computed
            label: 計算列
            type: object
            description: 決定論的射影の計算列（R16-02）。対象IDの出現から読んだ元値（テンプレート）を評価して表示する読み取り専用の派生列（path / backlinks / editable とは併用不可）
            fields:
              - key: lookup
                label: 参照の1ホップ
                type: object
                description: 行の出現の ref フィールドを辿り、対象を参照先IDへ切り替える（省略時は行のID自身が対象）
                fields:
                  - key: schemaId
                    label: 参照値を読む出現のスキーマ
                    type: string
                  - key: fileGlob
                    label: 参照値を読む出現のファイル（glob）
                    type: string
                  - key: via
                    label: ref フィールドの相対パス
                    type: string
                    required: true
                    description: 出現要素からの相対YPath（例 type）。この値（ID）の先が対象になる
              - key: source
                label: 元値を読む出現
                type: object
                required: true
                description: 元値（テンプレート）を読む対象IDの出現の選択（schemaId / fileGlob のいずれかが必要）
                fields:
                  - key: schemaId
                    label: スキーマ
                    type: string
                  - key: fileGlob
                    label: ファイル（glob）
                    type: string
              - key: path
                label: 元値の相対パス
                type: string
                required: true
                description: source 出現要素からの相対YPath。値の {パス} プレースホルダは評価スコープの値で置換される（例 varchar({maxLength})）
              - key: values
                label: プレースホルダ解決に使う出現
                type: array
                description: 対象IDのこの出現の値でプレースホルダを解決する（解決順は source 要素 → values（宣言順）→ lookup の起点要素）
                item:
                  type: object
                  fields:
                    - key: schemaId
                      label: スキーマ
                      type: string
                    - key: fileGlob
                      label: ファイル（glob）
                      type: string
              - key: map
                label: 値辞書
                type: map
                value:
                  type: string
                description: 評価後の値を辞書で置換する（辞書に無い値はそのまま）
              - key: default
                label: 既定値
                type: string
                description: 元値が無いときに使う値
    - key: detail
      label: 詳細文書
      type: object
      fields:
        - key: schemaId
          label: 詳細と見なす出現のスキーマ
          type: string
        - key: fileGlob
          label: 詳細と見なす出現のファイル（glob）
          type: string
        - key: filePattern
          label: 新規作成先パターン
          type: string
          description: 例 designs/{id}.yaml（{id} が行のIDで置換される）
    - key: newRow
      label: 新規行の入口
      type: object
      fields:
        - key: file
          label: 一覧文書のファイル
          type: string
          description: 配列モード。path と対で指定し、一覧文書内の配列へ新しい要素を追加する
        - key: path
          label: 追加先の配列YPath
          type: string
        - key: filePattern
          label: 新規作成先パターン
          type: string
          description: ファイルモード。例 designs/{id}.yaml（入力したIDで {id} を置換した詳細文書を新規作成する。file / path とは併用不可）
