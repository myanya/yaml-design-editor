id: builtin-activity
name: アクティビティ定義
match: "_activities/**/*.{yaml,yml}"
root:
  type: object
  fields:
    - key: id
      label: アクティビティID
      type: id
      required: true
      description: "このアクティビティを指す名前。連鎖（chain）の起動先・評価セット・CLI の agent で使う"
    - key: name
      label: 表示名
      type: string
      description: 実行スペースの一覧・受信箱・履歴に出る名前
    - key: description
      label: 説明
      type: text
      description: 何のための仕事か。人が読む説明で、エージェントにも指示の前置きとして渡す
    - key: agent
      label: 実行エージェント
      type: ref
      required: true
      description: "実行するエージェント（_agents の定義）。性格・観点・モデル・使えるツール分類はエージェントの側で決める"
      scope:
        schemaIds: [builtin-agent]
    - key: target
      label: 対象
      type: object
      description: "この仕事が扱う文書の範囲"
      fields:
        - key: match
          label: 対象ファイル（glob）
          type: string
          description: "扱う文書の glob（例 requirements/**/*.yaml）。起動契機の監視対象（trigger.match を省いたとき）と、文脈レシピの phase の範囲の既定にもなる。書き込める範囲は allowedFiles で別に決める"
    - key: instruction
      label: 指示
      type: text
      required: true
      description: "エージェントに渡す仕事の指示（何を・どこまで・どう終えるか）。一括実行（foreach）では、1 件ごとの追加指示がこの後ろに付く"
    - key: context
      label: 文脈レシピ
      type: object
      description: "実行の最初にエージェントへ見せる情報の組み立て。書かなければ何も開示せず、エージェントが探索のツールで自分で読む"
      fields:
        - key: items
          label: 開示項目
          type: array
          description: 初期コンテキストへ宣言順に開示する項目（R19-02。省略時は開示なし＝空既定）
          item:
            type: object
            fields:
              - key: kind
                label: 種別
                type: enum
                required: true
                values:
                  - { value: catalog, label: カタログ, description: 文書カタログ（match で対象を絞れる） }
                  - { value: phase, label: フェーズ状態, description: 対象文書のフェーズ状態（省略時は target.match の範囲） }
                  - { value: view, label: ビュー, description: 横断グリッドの解決結果（rows / columns で絞れる） }
                  - { value: doc, label: 文書, description: 指定文書（file / path）の全文 }
                  - { value: related, label: 関連情報, description: 論理IDの出現・参照・被参照の軽量なまとめ }
                  - { value: entity, label: エンティティ全体像, description: アスペクト合成・両方向の関係・カバレッジ（related の上位互換。R23-04） }
                  - { value: sample, label: 記述例, description: 同スキーマの既存文書N件（記述粒度の手本） }
                  - { value: graph, label: グラフ, description: ID関係グラフの経路トラバース（起点から参照・被参照を多段に辿る） }
                cases:
                  catalog:
                    - key: match
                      label: 対象ファイル（glob）
                      type: string
                  phase:
                    - key: match
                      label: 対象ファイル（glob）
                      type: string
                  view:
                    - key: view
                      label: ビューID
                      type: ref
                      required: true
                      scope:
                        schemaIds: [builtin-view]
                    - key: rows
                      label: 行絞り（IDパターン。{target} 等のプレースホルダ可）
                      type: string
                    - key: columns
                      label: 列絞り（列ラベルの列挙。空は全列）
                      type: array
                      item:
                        type: string
                  doc:
                    - key: file
                      label: 対象文書（相対パス。{target} 等のプレースホルダ可）
                      type: string
                      required: true
                    - key: path
                      label: YPath（省略時は文書全体）
                      type: string
                  related:
                    - key: id
                      label: 論理ID（{target} 等のプレースホルダ可）
                      type: string
                      required: true
                  entity:
                    - key: id
                      label: 論理ID（{target} 等のプレースホルダ可）
                      type: string
                      required: true
                  sample:
                    - key: schema
                      label: スキーマID
                      type: string
                      required: true
                    - key: count
                      label: 件数
                      type: int
                  graph:
                    - key: start
                      label: 起点ID（{target} 等のプレースホルダ可）
                      type: string
                      required: true
                    - key: steps
                      label: 経路ステップ（省略時は既定経路）
                      type: array
                      item:
                        type: object
                        fields:
                          - key: follow
                            label: 方向
                            type: enum
                            values:
                              - { value: out, label: 参照を辿る }
                              - { value: in, label: 被参照を辿る }
                          - key: relation
                            label: 関係種別で絞る
                            type: string
                          - key: via
                            label: 参照キー名で絞る
                            type: string
                          - key: schema
                            label: 到達スキーマで絞る
                            type: string
                          - key: emit
                            label: 開示粒度
                            type: enum
                            values: [title, summary, outline, full]
                            default: summary
                          - key: limitPerHop
                            label: ホップ毎の上限
                            type: int
              - key: when
                label: 開示条件
                type: enum
                values:
                  - { value: always, label: 常に }
                  - { value: has-target, label: 対象指定あり, description: foreach の対象値または追加指示がある実行のみ }
                  - { value: no-target, label: 対象指定なし }
                default: always
              - key: budgetChars
                label: 文字数予算
                type: int
                description: 超過分は決定的に打切り（doc / related / sample の既定は8000字）
    - key: allowedFiles
      label: 書き込めるファイル（glob）
      type: array
      item:
        type: string
      description: "どの文書に書いてよいか（例 reviews/**/*.yaml）。ここに合わない文書への書込は断る。省略時はどの文書にも書ける。文書の中の場所は allowedPaths で絞る"
    - key: allowedPaths
      label: 文書の中で書き込める項目（パス）
      type: array
      item:
        type: string
      description: "書き込めるファイルの中で、どの項目に書いてよいか（文書の中のパス。例 review_comments*）。allowedFiles と両方に合う場所だけに書ける。省略時は文書のどこにでも書ける"
    - key: tools
      label: 許可ツール分類
      type: array
      item:
        type: enum
        values: [explore, edit, validate, ask, delegate, actions]
      description: "省略時は全部。actions はスキーマに定義した操作のツール（下の actions で許可したものだけ）。edit を外して actions だけにすると、書込を操作に限った活動になる"
    - key: actions
      label: 許可する操作
      type: array
      item:
        type: string
      description: "エージェントがツールとして使える操作（アクションの id か 型名.操作名。例 add-screen, business-rule.deprecate）。書いたものだけがツールになり、無指定は無し。許可した操作の書込は allowedFiles / allowedPaths の外でも通る（操作の定義が範囲を決める）"
    - key: limits
      label: ループ上限
      type: object
      description: "1 回の実行の上限。どれかに達すると実行を止め、そこまでの編集は未提出のドラフトとして残る"
      fields:
        - key: maxTurns
          label: 最大ターン数
          type: int
          description: "モデルとのやり取りの回数の上限（既定 24）"
        - key: maxTokens
          label: 最大トークン数
          type: int
          description: "1 回の実行で使うトークンの上限（既定 400000）"
        - key: maxSeconds
          label: 最大実行秒数
          type: int
          description: "1 回の実行の時間の上限（既定 900 秒＝15 分）"
    - key: gates
      label: 提出ゲート
      type: object
      description: "エージェントの提出を受け付ける条件。満たさない提出は受け付けず、理由をエージェントへ返す"
      fields:
        - key: validation
          label: 検証条件
          type: enum
          values:
            - { value: error-free, label: 検証エラー0（修正系） }
            - { value: no-new-errors, label: 新規エラーなし（点検系。既存エラーは許容） }
            - { value: none, label: なし }
          default: error-free
          description: "error-free は、編集した文書と影響を受ける文書に検証エラーが無いこと。no-new-errors は、実行の前より検証エラーが増えていないこと（前からあるエラーでは塞がない）。none は検証で止めない"
    - key: approval
      label: 承認方式
      type: enum
      values: [human, auto]
      default: human
      description: auto はゲート通過・スコープ内・非編集中のときのみ自動適用（条件を欠くと承認待ちへ降格）
    - key: trigger
      label: 起動契機
      type: object
      description: "いつ起動するか。手動以外の起動は、実行スペースの「自動化」で監視を有効にしている間だけ働く"
      fields:
        - key: type
          label: 種別
          type: enum
          values: [manual, on-change, schedule, on-invalid]
          default: manual
          description: "manual は手動だけ。on-change は監視対象のファイルが更新されたとき。on-invalid は更新された後に検証エラーがあるときだけ。schedule は一定の周期（everyMinutes）"
        - key: match
          label: 監視対象（glob）
          type: string
          description: "on-change / on-invalid で更新を見張るファイル。省略時は target.match（それも無ければすべての YAML）"
        - key: debounceSeconds
          label: デバウンス秒
          type: int
          description: "on-change / on-invalid で、更新を検出してから起動するまでの待ち（既定 30 秒）。続けて保存しても 1 回の起動にまとめる"
        - key: everyMinutes
          label: 周期（分）
          type: int
          description: schedule のとき必須
    - key: chain
      label: 連鎖
      type: object
      description: "実行が終わった後に、続けて起動するアクティビティ。連鎖の深さには上限があり、同じアクティビティへ戻る循環は起動しない"
      fields:
        - key: onSuccess
          label: 成功時に起動
          type: ref
          description: "変更が適用されたときに起動する（承認が human なら、人が採用したとき）"
          scope:
            schemaIds: [builtin-activity]
        - key: onFailure
          label: 失敗時に起動
          type: ref
          description: "失敗で終わったときに起動する（承認が human なら、人が却下したときも）"
          scope:
            schemaIds: [builtin-activity]
        - key: rules
          label: 出力値による分岐
          type: array
          description: 上から順に評価し、最初に一致したルールの then へ連鎖する（不一致なら onSuccess / onFailure）
          item:
            type: object
            fields:
              - key: when
                label: 条件（AND）
                type: object
                fields:
                  - key: outcome
                    label: 終わり方
                    type: enum
                    values: [any, success, failure]
                    default: any
                  - key: changedFiles
                    label: 変更ファイルglob
                    type: string
                    description: 提出（採用）変更セットに一致するファイルがあること
                  - key: minChangedFiles
                    label: 変更ファイル数の下限
                    type: int
                  - key: noteContains
                    label: メモの部分一致
                    type: string
                    description: エージェントのメモ・提出メッセージに含まれる文字列
              - key: then
                label: 分岐先
                type: ref
                required: true
                scope:
                  schemaIds: [builtin-activity]
    - key: retry
      label: 再試行（無人実行）
      type: object
      description: "自動の起動で失敗したときのやり直し。同じ失敗が続くときは、回数が残っていても打ち切る"
      fields:
        - key: maxAttempts
          label: 最大試行回数
          type: int
          description: 失敗理由をフィードバックして再実行する回数（既定 1 = 再試行なし）
    - key: foreach
      label: 一括実行（対象列挙）
      type: object
      description: "手動起動時に対象を列挙し、1件=1実行としてキューへ展開する（trigger: manual 専用。R18-01）"
      fields:
        - key: source
          label: 列挙元
          type: enum
          required: true
          values: [view, issues, search, files, ids, query]
          description: "何を 1 件として数えるか。view はビューの行、issues は検証の指摘、search は検索の結果、files はファイル、ids は ID、query はパターン照合の束縛行。下の項目は、ラベルの括弧に書いた列挙元のときだけ効く"
        - key: view
          label: ビューID（view）
          type: ref
          scope:
            schemaIds: [builtin-view]
        - key: where
          label: 行条件（view）
          type: enum
          values: [detail-missing, all]
          default: detail-missing
          description: detail-missing は詳細文書が未作成の行のみ
        - key: severity
          label: 重大度（issues）
          type: enum
          values: [error, warning]
          default: error
          description: warning はエラーを含む警告以上
        - key: match
          label: ファイル絞り込みglob（issues / files / search）
          type: string
        - key: idPattern
          label: IDパターン（ids）
          type: string
        - key: schemaIds
          label: スキーマ絞り込み（ids / search）
          type: array
          item:
            type: string
        - key: text
          label: 検索テキスト（search）
          type: string
        - key: pathGlob
          label: パスglob（search）
          type: string
        - key: refTo
          label: 参照先ID（search）
          type: string
        - key: unresolved
          label: 未解決参照のみ（search）
          type: boolean
        - key: query
          label: パターン照合（query）
          type: any
          description: "グラフパターン照合のスペック（{match: [...], where: [...], limit: n}。束縛行が1件=1実行になり、束縛名がプレースホルダ（{scr} 等）で参照できる。R22-02）"
        - key: as
          label: 1件の追加指示テンプレート
          type: string
          description: 「{id} {title} {file} {path} {message}」等が対象の値に置換される（省略時は列挙元ごとの既定文）
        - key: limit
          label: 展開上限
          type: int
          description: 1回の投入で展開する最大件数（既定 20）
    - key: meta
      label: メタアクティビティ
      type: boolean
      description: 定義文書（_agents / _activities / _evals / _skills / _views）への書込を許可する（承認は human 固定。_schemas / _runs は不可）
