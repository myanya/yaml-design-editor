id: builtin-transform
name: 生成の定義（業務モデルから文書へ）
description: 業務モデルを展開した形（操作・State・Lifecycle・エンティティ型）から、YAML の文書を組み立てる変換（build・rules）と、作る文書の場所（output）。作った文書は生成物で、手で直さず、業務モデルか生成の定義を直して作り直す（CLI generate）
match: "_transforms/**/*.{yaml,yml}"
root:
  type: object
  fields:
    - key: id
      label: 生成の定義ID
      type: id
      required: true
    - key: name
      label: 表示名
      type: string
    - key: description
      label: 説明
      type: text
    - key: scope
      label: スコープ
      type: string
      description: "業務モデルを、どのスコープ（.yde/workspace.yaml の scopes）の定義体から作るか（例 business）。省くと、ワークスペースのすべてのスキーマから作る"
    - key: stage
      label: 段
      type: string
      description: "どの段（.yde/workspace.yaml の stages）の項を読むか（例 basic）。段の項は、業務モデルの項に、その段までの規則と補正（.yde/stages）を当てたもので、形は業務モデルの項と同じ（足したものに出どころ origin が付く）。省くと業務モデルの項そのもの"
    - key: each
      label: 文書ごとの要素
      type: string
      description: "業務モデルのどの並びの要素ごとに 1 文書を作るか（entities・actions・states・lifecycles）。省くと業務モデル全体から 1 文書。build が何も作らなかった要素（$when で外したもの）は文書を作らない"
    - key: dependsOn
      label: 先に生成する定義
      type: array
      item: { type: string }
      description: 同じ計画内で先に生成し、ビューから新しい値を読める。循環と存在しない ID は誤り
    - key: input
      label: 生成入力の組み立て
      type: any
      description: "段を当てる前に業務モデルと $view の行から入力を組み立てる変換。rules も使える。入力の stages に記録済みの段は再適用せず、残りの段だけを当てる"
    - key: output
      label: 作る文書の場所
      type: string
      required: true
      description: "ワークスペース相対の YAML のパス。穴 {パス} は要素の値で埋める（例 design/generated/actions/{id}.yaml）。.yde の下と定義の置き場には書けない。穴を * にした場所にある、この定義の生成物で作り直さなかったものは消す"
    - key: build
      label: 文書の中身（変換のひな型）
      type: any
      required: true
      description: "変換のひな型（$copy / $format / $value / $each / $case / $compose / $schemaModel など）。$compose は候補を合成し競合で止める。$schemaModel はスキーマ文書の配列、または schemas と任意の views のマップから型とビューを解き、定義の誤りで止める。いまの場所は要素（each を省けば業務モデル全体）。全体は $of: model、いまの要素は $of: element で読める"
    - key: rules
      label: 名前を付けた組み立て
      type: array
      description: "同じ形を何か所でも組み立てるときに 1 か所に書く（変換の rules と同じ）。build の中から {$apply: 規則名} か {$each: パス, $apply: 規則名} で使う"
      item:
        type: object
        fields:
          - { key: id, label: 規則名, type: string, required: true }
          - { key: when, label: 条件, type: any, description: "検査の where と同じ書き方の並び。省くといつでも合う" }
          - { key: with, label: 受け取る値, type: array, item: { type: string }, description: "当てる側が $with で渡す値の名前（規則の中で $of: 名前 で読む）。入れ子をたどる規則が、外側の事実（親の名前など）を要るときに使う" }
          - { key: build, label: ひな型, type: any, required: true }
