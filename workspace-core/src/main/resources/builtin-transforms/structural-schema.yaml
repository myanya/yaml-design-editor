# 構造のスキーマの導出（P27 段C の C-1。ROADMAP の SC-01〜04・TF-03。意図的差分 D-30）。
# 利用者が書くスキーマ（意味のスキーマ）から、yaml-core が検証に使う最小の構造のスキーマを作る、組込みの変換定義
# （YAML から YAML への変換。docs/ARCHITECTURE.md §4.42・§4.43）。workspace-core の DerivedStructures が、スキーマごと・文書のフェーズごとに実行する。
# 構造の検証を変えたいときは、この定義と、yaml-core の structure パッケージ（最小の構造のスキーマ）を直す。
id: structural-schema
description: 利用者が書くスキーマ（意味のスキーマ）から、最小の構造のスキーマを作る
# 文書の現在のフェーズまでに到達したフェーズの名前の一覧。意味の側が文書から読んで渡す（構造の側はフェーズを知らない。SC-02）
params: [reachedPhases]
build:
  id: { $copy: id }
  root: { $apply: field, $at: root }
  definitions: { $eachEntry: definitions, $apply: field }

rules:
  # 属性付き参照（スカラーでも {to, 属性…} のオブジェクトでも書ける）→ 値の形ごとの決まり（SC-03）
  - id: field
    when:
      - { path: type, equals: ref }
      - { path: fields, empty: false }
    build:
      key: { $copy: key }
      label: { $copy: label }
      required: { $apply: required }
      shapes:
        scalar: { type: string }
        object:
          type: object
          unknownFields: { $copy: unknownFields }
          fields:
            $concat:
              # 参照の値 to は必須。表示名は、指摘の文面（必須項目「X の to（参照値）」が未設定です）のために付ける
              - - key: to
                  label: { $first: [ { $format: "{label} の to（参照値）" }, { $format: "{key} の to（参照値）" } ] }
                  type: string
                  required: true
              - { $each: fields, $apply: field }

  # 項目1つ → 構造のスキーマの項目1つ。ここに書かないキー（role・display・description・default・relation・scope・
  # idPatterns・target・requiredFrom・選択肢のラベル）は、出力に出ない
  - id: field
    build:
      key: { $copy: key }
      label: { $copy: label }          # 指摘の文面のために、表示名だけは持たせる（SC-04）
      type:                            # ID と参照は、構造の上では文字列（SC-03）
        $map: { $copy: type }
        $using: { id: string, ref: string }
      required: { $apply: required }
      values:                          # {value, label, description} でも文字でも、値だけを残す
        $each: values
        $build: { $first: [ { $copy: value }, { $copy: . } ] }
      pattern: { $copy: pattern }      # 値の形式的なチェックは、そのまま構造のスキーマへ（yaml-core に置く）
      min: { $copy: min }
      max: { $copy: max }
      minLength: { $copy: minLength }
      maxLength: { $copy: maxLength }
      unknownFields: { $copy: unknownFields }
      $$ref: { $first: [ { $copy: $$ref }, { $copy: ref } ] }   # 定義への参照は写すだけで、辿らない
      fields: { $each: fields, $apply: field }                 # 入れ子＝同じ規則を、子の項目に当てる
      item: { $apply: field, $at: item }
      value: { $apply: field, $at: value }
      cases:                           # 選択肢の値ごとの項目（cases）は、構造のスキーマに残す
        $eachEntry: cases
        $build: { $each: ., $apply: field }

  # フェーズに達したら必須（requiredFrom）を、素の必須に畳む（SC-02）
  - id: required
    build:
      $first:
        - { $when: { path: required, equals: true }, $then: true }
        - { $when: { path: requiredFrom, oneOf: $reachedPhases }, $then: true }
