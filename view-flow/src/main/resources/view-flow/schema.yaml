# view-flow の定義の形の断片（ADR-0014）。ビューのメタスキーマ（builtin-view）に合成される（workspace.ViewSchemaFragments）。
# 足せるのは kind の選択肢 1 つ・ルートの項目（fields）・文書ビューの区画の項目（section）だけ。
# 適用先（match・schemaId）は文書ビューと共有するので、中核の view.yaml に残している。
kind:
  value: flow
  label: フロービュー
  description: 文書をprojectionでノード・辺・レーンへ変換する
fields:
  - key: layout
    label: フローの配置
    type: object
    fields:
      - {key: direction, label: 方向, type: enum, values: [down, right], default: down}
  - key: projection
    label: フローへの変換
    type: object
    fields:
      - {key: id, label: 変換ID, type: string, required: true}
      - {key: name, label: 名前, type: string}
      - {key: description, label: 説明, type: text}
      - {key: build, label: 出力のひな型, type: any, required: true}
      - {key: rules, label: 子に当てる規則, type: array, item: {type: any}}
section:
  key: flow
  label: フローセクション
  type: object
  description: fields / backlinksとは併用不可
  fields:
    - key: view
      label: フロービューID
      type: ref
      scope:
        schemaIds: [builtin-view]
      required: true
