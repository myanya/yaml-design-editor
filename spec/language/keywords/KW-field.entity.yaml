    value: "{type, defines, aspect, owns}"
    meaning: "この object の要素がどのエンティティ型かの宣言。文書スキーマの entity より優先します。名前付きの型では、type を省くと定義の名前になります。defines: true は、この要素の出現がそのエンティティの定義であることを表します。"
