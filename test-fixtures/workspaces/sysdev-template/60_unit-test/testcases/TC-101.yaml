id: TC-101
name: 予約登録（正常・重複拒否）
preconditions:
  - 会議室 A（利用可）が登録されていること
  - 明日 10:00-11:00 の会議室 A に既存予約がないこと
steps:
  - no: 1
    operation: 明日 10:00-11:00・会議室 A で予約を登録する
    expected: 予約番号が採番され予約詳細が表示される
    items: [TI-101]
  - no: 2
    operation: 同じ会議室・明日 10:30-11:30 で再度予約を登録する
    expected: 重複エラーが表示され登録されない
    items: [TI-102]
  - no: 3
    operation: 空き状況照会で明日の会議室 A を表示する
    expected: 10:00-11:00 が予約済み表示になっている
