id: "BF-007"
trigger: "利用開始30分前の通知対象を確認する時刻になる。再実行時も最新の予約状態を確認する。"
outcome: "対象予約の通知が完了する、通知対象外と判定する、または失敗を記録して再実行に備える。"
participants: []
start:
  - "BFN-007-START"
terminal:
  - "BFN-007-SENT"
  - "BFN-007-SKIP"
  - "BFN-007-RETRY"
nodes:
  - id: "BFN-007-START"
    name: "開始30分前の通知対象を確認する時刻"
    kind: "event"
  - id: "BFN-007-ELIGIBLE"
    name: "最新の予約は通知対象か"
    kind: "decision"
    description: "取消されておらず、現在の予約日時が通知対象で、送信済みでないことを確認する。"
  - id: "BFN-007-SEND"
    name: "予約者へリマインドメールを送信する"
    kind: "automatic"
    description: "最新の予約内容と予約者を使用する。代理予約の場合も予約者本人が宛先。再実行時は二重送信を防ぐ。"
  - id: "BFN-007-RESULT"
    name: "送信は成功したか"
    kind: "decision"
  - id: "BFN-007-SENT"
    name: "送信済みとして記録する"
    kind: "state"
  - id: "BFN-007-SKIP"
    name: "通知せず終了する"
    kind: "state"
  - id: "BFN-007-RETRY"
    name: "失敗を記録し再実行に備える"
    kind: "state"
transitions:
  - id: "BFT-007-01"
    from: "BFN-007-START"
    to: "BFN-007-ELIGIBLE"
    condition: "対象候補を抽出する"
  - id: "BFT-007-02"
    from: "BFN-007-ELIGIBLE"
    to: "BFN-007-SEND"
    condition: "通知対象"
  - id: "BFT-007-03"
    from: "BFN-007-ELIGIBLE"
    to: "BFN-007-SKIP"
    condition: "取消済み・時刻変更・送信済み等"
  - id: "BFT-007-04"
    from: "BFN-007-SEND"
    to: "BFN-007-RESULT"
    condition: "送信結果を確認する"
  - id: "BFT-007-05"
    from: "BFN-007-RESULT"
    to: "BFN-007-SENT"
    condition: "成功"
  - id: "BFT-007-06"
    from: "BFN-007-RESULT"
    to: "BFN-007-RETRY"
    condition: "失敗（他の予約の処理は継続）"
notes: "再実行時は開始点から対象を再判定する。自動通知の方式・再実行方針はPOL-BATCH、既存の処理設計はPROC-002。通知の細かい送信手順をユースケースへ分解しない。"
related_usecases:
  - "UC-001"
  - "UC-009"
