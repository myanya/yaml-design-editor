id: "UC-007"
preconditions:
  - "座席管理システムにAPIの利用権限があること。"
main_flow:
  - no: 1
    action: "座席管理システムがAPIキー、対象日と任意の会議室コードを指定する。"
  - no: 2
    action: "システムが認可と要求条件を確認する。"
  - no: 3
    action: "システムが予約情報として会議室・時間帯・予約者の所属を返す。氏名・連絡先は返さない。"
alt_flows:
  - condition: "APIキーが不正な場合"
    steps:
      - "認可エラーを返し、予約情報を提供しない。"
  - condition: "該当する予約がない場合"
    steps:
      - "空の予約一覧を返す。"
postconditions:
  - "認可された要求に対して、指定範囲の予約情報が提供されていること。"
