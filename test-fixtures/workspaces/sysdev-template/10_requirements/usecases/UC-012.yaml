id: "UC-012"
preconditions:
  - "総務部の権限でログインしていること。"
main_flow:
  - no: 1
    action: "総務部が対象期間と会議室を指定する。"
  - no: 2
    action: "システムが取消済みを除く終了済み予約を抽出する。"
  - no: 3
    action: "システムが会議室別の予約件数と予約時間の合計を集計し、総務部が結果を確認する。"
alt_flows:
  - condition: "集計対象の予約がない場合"
    steps:
      - "予約件数・予約時間がゼロであることを表示する。"
postconditions:
  - "予約上の利用実績を把握できていること。実際の入退室時刻・実利用時間は集計しない。"
