id: "UC-009"
based_on:
  - "BR-001"
  - "BR-002"
  - "BR-004"
preconditions:
  - "一般社員がログインし、変更対象の自分の予約が存在すること。"
main_flow:
  - no: 1
    action: "一般社員が自分の予約を選び、内容を確認する。"
  - no: 2
    action: "会議室・利用日・時間帯・利用目的の変更内容を入力する。"
  - no: 3
    action: "システムが開始1時間前までの変更であることを確認し、変更後も営業時間・休日・14日先まで・重複不可の条件を満たすことを検証する。重複判定では対象予約自身を除く。"
  - no: 4
    action: "システムが予約を更新し、変更内容を表示する。"
alt_flows:
  - condition: "期限・予約条件・権限を満たさない場合"
    steps:
      - "理由を表示し、元の予約を維持する。条件を調整するか変更を中止する。"
postconditions:
  - "変更が成立した場合は最新の予約内容が空き状況と以後のリマインド判定に使われること。不成立の場合は元の予約が維持されること。"
