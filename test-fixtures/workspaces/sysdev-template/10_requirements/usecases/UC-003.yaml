id: "UC-003"
preconditions:
  - "一般社員がログインしていること。"
main_flow:
  - no: 1
    action: "一般社員が空き状況の照会、または自分の予約内容の確認を選ぶ。"
  - no: 2
    action: "空き状況を照会する場合は、日付・時間帯・会議室を指定し、条件に合う会議室と空き時間帯を確認する。"
  - no: 3
    action: "自分の予約を確認する場合は、対象予約を選び、会議室・利用日・時間帯・目的・予約状態を確認する。"
alt_flows:
  - condition: "条件に合う会議室や自分の予約がない場合"
    steps:
      - "システムが該当なしを表示する。条件を変更するか、確認を終了する。"
postconditions:
  - "最新の空き状況、または自分の予約内容を把握できていること。予約データは変更しない。"
