flows:
  - id: "BF-001"
    name: "会議室を予約して利用する"
    category: "業務"
    summary: "社員が会議室を確保し、必要に応じて確認・変更・取消を行う代表的な流れ。"
  - id: "BF-002"
    name: "総務部が予約・取消を代行する"
    category: "業務"
    summary: "依頼を受けた総務部が、社員に代わって予約または取消を完了する。"
  - id: "BF-003"
    name: "会議室の利用条件を整える"
    category: "業務"
    summary: "会議室の新設・改装などに合わせて、会議室情報と新規予約の可否を整える。"
  - id: "BF-004"
    name: "休日を予約受付へ反映する"
    category: "業務"
    summary: "決定した休日を登録・変更・解除し、空き照会と予約受付の判定へ反映する。"
  - id: "BF-005"
    name: "会議室の利用状況を振り返る"
    category: "業務"
    summary: "終了済み予約を集計し、期間別・会議室別の利用傾向を把握する。"
  - id: "BF-006"
    name: "座席管理システムへ予約情報を提供する"
    category: "業務"
    summary: "外部システムからの要求に応じ、認可された範囲の予約情報を提供する。"
  - id: "BF-007"
    name: "予約開始前にリマインドする"
    category: "補助"
    summary: "予約に付随して動く自動処理。利用者の独立した操作ユースケースにはしない。"
