# ユースケース一覧: アクターと機能概要の原本。操作手順は usecases/UC-*.yaml に記述する。
usecases:
  - id: UC-001
    name: 会議室を予約する
    actors: [ACT-001, ACT-002]
    summary: |
      一般社員が自分の会議室を予約する。総務部は依頼した社員を予約者として指定して代理予約する。
      空き照会・条件入力・確認・登録を一つの目的に含める。
      平日9:00〜18:00の営業時間内で休日を除き、当日から14日先までの重複しない予約を受け付ける。
      開始前リマインドは、取消済みを除く最新の予約内容に基づく付随的な自動処理とする。
  - id: UC-002
    name: 予約を取り消す
    actors: [ACT-001, ACT-002]
    summary: |
      一般社員が自分の予約を開始1時間前までに取り消す。
      総務部は他の社員の予約を代理取消でき、開始1時間前を過ぎた場合もシステム上で受け付ける。
      対象予約の検索・確認と取消結果の空き状況への反映を含む。期限後の本人操作では総務部への電話連絡を案内する。
  - id: UC-003
    name: 空き状況・自分の予約を確認する
    actors: [ACT-001]
    summary: |
      一般社員が日付・時間帯・会議室を指定して空き状況を照会する。
      または自分の予約を選び、会議室・利用日・時間帯・利用目的・予約状態を確認する。
      予約操作を行わず情報の把握だけで目的が完了する場合のユースケースとする。
      予約・変更・取消の途中で行う照会や確認は、それぞれのユースケースの内部手順に含める。
  - id: UC-005
    name: 会議室マスタを管理する
    actors: [ACT-002]
    summary: |
      総務部が本社ビルの会議室を登録し、会議室名・収容人数・利用可否を確認・更新する。
      改装中などの会議室を新規予約の対象から外せる。登録・変更を個別のユースケースに分けない。
  - id: UC-006
    name: 休日カレンダーを管理する
    actors: [ACT-002]
    summary: |
      総務部が休日カレンダーを確認し、休日を登録・変更・解除する。
      カレンダーは空き状況照会と予約受付可否の判定に使用する。
  - id: UC-007
    name: 外部システムが予約情報を取得する
    actors: [ACT-003]
    summary: |
      座席管理システムが対象日と任意の会議室コードを指定し、予約情報を取得する。
      APIキーで認可し、会議室・時間帯・予約者の所属を提供する。氏名・連絡先は提供しない。
  - id: UC-009
    name: 予約内容を変更する
    actors: [ACT-001]
    summary: |
      一般社員が自分の予約を選び、会議室・利用日・時間帯・利用目的を変更する。
      変更は開始1時間前までとし、変更後も営業時間・休日・当日から14日先まで・重複不可の条件を適用する。
      重複判定では変更対象の予約自身を除き、変更が成立した場合に予約内容と空き状況照会を更新する。
      不成立の場合は元の予約を維持する。総務部による代理変更は対象外とする。
  - id: UC-012
    name: 会議室の利用実績を集計する
    actors: [ACT-002]
    summary: |
      総務部が対象期間と会議室を指定し、会議室ごとの利用実績を集計・確認する。
      取消済みを除く終了済み予約を基に、予約件数と予約時間の合計を集計する。
      予約上の利用実績であり、実際の入退室時刻や実利用時間は記録・集計しない。
