# ビジネスルール台帳のスキーマ
#
# フリーフォーマットの「ビジネスルール定義書」を、ルール1件 = BR-* のIDを持つ要素へ
# 最小構造化した台帳。本文（text）は自由記述のままでよい——IDが付くだけで
# 「どこからも参照されないルール（取りこぼし）」「廃止済みルールの参照」が機械検証になる。
id: business-rule
name: ビジネスルール台帳
match: 00_input/business-rules.yaml
description: |
  顧客社内ルール・既存システム制約などの原文を、ルール単位（BR-*）に分割して登録する台帳。
  原文からの分割・取り込みはAIアクティビティに委託できる（取り込み後はこの台帳が原本）。
entity:
  type: business-rule
  idPattern: "BR-*"
  defines: true
constraints:
  - id: br-referenced
    description: 承認済みのビジネスルールは、ユースケース・処理・テスト項目のいずれかから根拠として参照されること（取りこぼし検出）
    match:
      - node: { entity: business-rule, bind: br }
      - edge: { dir: in, relation: based-on }
      - node: {}
    where:
      - { of: br, path: status, equals: approved }
    expect: exists
    level: warning
    # 指摘から操作を起動する（P41）: 参照されていないルールは、根拠として参照を足すか、廃止にするかのどちらか
    responses:
      - { action: deprecate-rule, label: 廃止にする（参照されていないため）, with: { reason: どこからも根拠として参照されていないため廃止 } }
  - id: br-unapproved-referenced
    description: 承認済みでないビジネスルール（起草中・廃止など）が参照され続けていないこと
    match:
      - node: { entity: business-rule, bind: br }
      - edge: { dir: in, relation: based-on }
      - node: {}
    where:
      - { of: br, path: status, notEquals: approved }
    expect: absent
    level: error
root:
  type: object
  fields:
    - key: rules
      label: ルール一覧
      type: array
      required: true
      item:
        type: object
        fields:
          - key: id
            label: ルールID
            type: id
            required: true
            description: ルールを一意に識別するID（例 BR-001）。
          - key: name
            label: ルール名
            type: string
            required: true
            description: ルールの1行要約（例 予約は営業時間内に限る）。
          - key: text
            label: ルール本文
            type: text
            required: true
            description: 原文のままの自由記述。構造化は無理にしない。
          - key: category
            label: 分類
            type: enum
            values:
              - { value: business, label: 業務ルール }
              - { value: legacy, label: 既存システム制約 }
              - { value: legal, label: 法令・規程 }
            default: business
          - key: status
            label: 状態
            type: enum
            required: true
            values:
              - { value: draft, label: 起草中 }
              - { value: approved, label: 承認済み, description: 参照必須の対象（取りこぼし検出が効く） }
              - { value: deprecated, label: 廃止, description: 参照が残っているとエラーになる }
            default: draft
          - key: source
            label: 出典
            type: string
            description: 原文の所在（資料名・ヒアリング日など）。
          - key: deprecated_reason
            label: 廃止の理由
            type: string
            description: 廃止にしたときの理由（型の操作 deprecate が入れる）。
        # 型の操作（P41）: 自分の項目だけを変える。参照元の整合は前提（アクション deprecate-rule）と検査 br-unapproved-referenced が守る
        methods:
          deprecate:
            label: 廃止にする
            description: 状態を廃止にし、理由を残す
            params:
              - { key: reason, label: 廃止の理由, type: string, required: true }
            do:
              - set: { path: status, value: deprecated }
              - set: { path: deprecated_reason, value: $reason }
# 横断の操作（P41 の最初の利用例）: 根拠として参照されていないビジネスルールだけを廃止にできる
# （参照が残っていれば前提で止まる＝検査 br-unapproved-referenced と同じ不変条件を、変える前に確かめる）
actions:
  - id: deprecate-rule
    label: ビジネスルールを廃止する
    description: 参照が残っていないことを確かめてから、型の操作 deprecate を呼ぶ
    target: { entity: business-rule, bind: br }
    params:
      - { key: reason, label: 廃止の理由, type: string, required: true }
    require:
      - match:
          - node: { entity: business-rule }
          - edge: { dir: in, relation: based-on }
          - node: { bind: x }
        expect: absent
        message: "{id} はまだ {x.id} から根拠として参照されています。先に参照を外してください"
    do:
      - call: { of: br, method: deprecate, params: { reason: $reason } }
