id: POL-ONLINE
name: オンライン処理方式
kind: online
timeout_seconds: 30
error_policy: |
  業務エラーは画面にメッセージ表示（処理は継続）。システムエラーは共通エラー画面へ遷移し、
  ログ出力方式（POL-LOG）に従いエラーIDを採番してログへ記録する。
policy: |
  画面からの同期リクエストを内部APIで処理する方式。1リクエスト=1トランザクションを原則とする。
rules:
  - 更新系の内部APIは冪等にする（同一リクエストの再送で二重登録しない）
  - 業務チェックはAPI側で必ず行う（画面側のチェックは利便性目的の補助）
