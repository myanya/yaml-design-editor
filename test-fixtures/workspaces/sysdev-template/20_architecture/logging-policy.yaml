id: POL-LOG
name: ログ出力方式
kind: logging
format: |
  日時・レベル・エラーID・処理ID（PROC-*）・利用者ID・メッセージをタブ区切りで出力する。
levels: |
  ERROR: 業務が継続できない事象（エラーID採番）。WARN: 継続可能な異常。INFO: 処理の開始・終了。
policy: |
  全処理はこの方式に従ってログを出力する。個人情報（氏名・連絡先）はログに出力しない。
rules:
  - エラーIDは画面表示とログの両方に出し、問い合わせ時に突合できるようにする
  - 個人情報のログ出力禁止（利用者IDのみ可）
