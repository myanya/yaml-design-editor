id: POL-BATCH
name: バッチ処理方式
kind: batch
rerun_policy: |
  異常終了時は原因除去後に同一パラメータで再実行する（洗い替えではなく差分処理のため、
  処理済みレコードはスキップする設計とする）。
schedule_policy: 定時起動は業務時間外（22:00〜6:00）に配置する。リマインド系のみ業務時間内を許可。
policy: |
  定時・イベント契機の非対話処理の方式。処理件数・成功/失敗件数を実行ログに必ず記録する。
rules:
  - バッチは途中失敗からの再実行で結果が変わらないこと（冪等）
  - 1件のエラーで全体を止めない（エラーレコードは退避して継続）
