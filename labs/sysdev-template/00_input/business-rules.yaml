# ビジネスルール台帳: フリーフォーマットの原文をルール単位（BR-*）に分割した最小構造化。
# BR-004 は意図的にどこからも参照していない（取りこぼし検出のデモ。検証パネルに警告が出る）。
rules:
  - id: BR-001
    name: 予約は営業時間内に限る
    text: |
      会議室の予約は営業時間（平日 9:00〜18:00）の範囲内でのみ受け付ける。
      総務部の運用ルールによる。休日カレンダーは総務部が管理する。
    category: business
    status: approved
    source: 総務部ヒアリング（2026-08-20）
  - id: BR-002
    name: 同一時間帯の重複予約は不可
    text: |
      同じ会議室・同じ時間帯に複数の予約を登録することはできない。
      時間帯が一部でも重なる場合は重複とみなす。
    category: business
    status: approved
    source: 総務部ヒアリング（2026-08-20）
  - id: BR-003
    name: キャンセルは開始1時間前まで
    text: |
      予約のキャンセルは、利用開始時刻の1時間前まで可能とする。
      それ以降は総務部への電話連絡による取消のみとする（システム外運用）。
    category: business
    status: approved
    source: 総務部ヒアリング（2026-08-20）
  - id: BR-004
    name: 予約は14日先まで
    text: |
      予約を受け付けるのは当日から14日先までとする。
      それより先の予約は部門間調整が必要なためシステムでは受け付けない。
    category: business
    status: approved
    source: 総務部ヒアリング（2026-08-27 追加分）
