id: "BF-001"
trigger: "会議の開催予定が生じる。"
outcome: "会議室を利用する、予約を取り消す、または予約を確定せず終了する。"
participants:
  - actor: "ACT-001"
    role: "一般社員（予約者）"
  - actor: "ACT-002"
    role: "総務部（期限後の代理取消）"
start:
  - "BFN-001-START"
terminal:
  - "BFN-001-CANCELLED"
  - "BFN-001-USE"
  - "BFN-001-ABORT"
nodes:
  - id: "BFN-001-START"
    name: "会議の開催予定が生じる"
    kind: "event"
  - id: "BFN-001-RESERVE"
    name: "会議室を予約する"
    kind: "usecase"
    usecase: "UC-001"
    actor: "ACT-001"
    description: "空き照会から登録までを含む。予約できない場合の条件調整はこの工程内で行う。"
  - id: "BFN-001-WAIT"
    name: "予約後の予定・確認の必要性"
    kind: "decision"
  - id: "BFN-001-CHECK"
    name: "空き状況・自分の予約を確認する"
    kind: "usecase"
    usecase: "UC-003"
    actor: "ACT-001"
    description: "情報の把握だけを目的とする任意の工程。"
  - id: "BFN-001-CHANGE"
    name: "予約内容を変更する"
    kind: "usecase"
    usecase: "UC-009"
    actor: "ACT-001"
    description: "開始1時間前まで。変更不成立の場合は元の予約を維持する。"
  - id: "BFN-001-DEADLINE"
    name: "本人による取消期限内か"
    kind: "decision"
  - id: "BFN-001-CANCEL"
    name: "自分の予約を取り消す"
    kind: "usecase"
    usecase: "UC-002"
    actor: "ACT-001"
  - id: "BFN-001-CALL"
    name: "総務部へ電話で代理取消を依頼する"
    kind: "external"
    description: "依頼はシステム外の行為。総務部のシステム操作は次の工程で行う。"
  - id: "BFN-001-ADMIN-CANCEL"
    name: "総務部が代理取消する"
    kind: "usecase"
    usecase: "UC-002"
    actor: "ACT-002"
  - id: "BFN-001-CANCELLED"
    name: "予約取消済み"
    kind: "state"
  - id: "BFN-001-USE"
    name: "会議室を利用する（システム外）"
    kind: "external"
    description: "入退室の記録は対象外。リマインドは別の補助フローで実行する。"
  - id: "BFN-001-ABORT"
    name: "予約せずに終了"
    kind: "state"
transitions:
  - id: "BFT-001-01"
    from: "BFN-001-START"
    to: "BFN-001-RESERVE"
    condition: "会議室の確保が必要"
  - id: "BFT-001-02"
    from: "BFN-001-RESERVE"
    to: "BFN-001-WAIT"
    condition: "予約成立"
  - id: "BFT-001-03"
    from: "BFN-001-RESERVE"
    to: "BFN-001-ABORT"
    condition: "予約不成立・見送り"
  - id: "BFT-001-04"
    from: "BFN-001-WAIT"
    to: "BFN-001-CHECK"
    condition: "内容だけ確認したい"
  - id: "BFT-001-05"
    from: "BFN-001-CHECK"
    to: "BFN-001-WAIT"
    condition: "確認完了"
  - id: "BFT-001-06"
    from: "BFN-001-WAIT"
    to: "BFN-001-CHANGE"
    condition: "予定を変更したい"
  - id: "BFT-001-07"
    from: "BFN-001-CHANGE"
    to: "BFN-001-WAIT"
    condition: "変更完了、または不成立で元の予約を維持"
  - id: "BFT-001-08"
    from: "BFN-001-WAIT"
    to: "BFN-001-DEADLINE"
    condition: "予約が不要になった"
  - id: "BFT-001-09"
    from: "BFN-001-DEADLINE"
    to: "BFN-001-CANCEL"
    condition: "開始1時間前まで"
  - id: "BFT-001-10"
    from: "BFN-001-DEADLINE"
    to: "BFN-001-CALL"
    condition: "開始1時間前を過ぎた"
  - id: "BFT-001-11"
    from: "BFN-001-CALL"
    to: "BFN-001-ADMIN-CANCEL"
    condition: "総務部が依頼を受ける"
  - id: "BFT-001-12"
    from: "BFN-001-CANCEL"
    to: "BFN-001-CANCELLED"
    condition: "取消成立"
  - id: "BFT-001-13"
    from: "BFN-001-CANCEL"
    to: "BFN-001-WAIT"
    condition: "取消不成立・見送り"
  - id: "BFT-001-14"
    from: "BFN-001-ADMIN-CANCEL"
    to: "BFN-001-CANCELLED"
    condition: "代理取消成立"
  - id: "BFT-001-15"
    from: "BFN-001-ADMIN-CANCEL"
    to: "BFN-001-WAIT"
    condition: "取消不成立・見送り"
  - id: "BFT-001-16"
    from: "BFN-001-WAIT"
    to: "BFN-001-USE"
    condition: "利用日時を迎える"
notes: "照会は予約の必須先行工程にしない。予約・変更・取消の内部で必要な照会・確認を行う。開始30分前の自動通知はBF-007を参照する。"
