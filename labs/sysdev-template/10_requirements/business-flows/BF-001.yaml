id: BF-001
trigger: 会議の開催予定が生じる。
outcome: 会議室を利用する、予約を取り消す、予約せず終了する、または総務部へ代理取消を引き継ぐ。
participants:
  - actor: ACT-001
    role: 一般社員（予約者）
start: [BFN-001-START]
terminal: [BFN-001-CANCELLED, BFN-001-USE, BFN-001-ABORT, BFN-001-CALL]
nodes:
  - { id: BFN-001-START, name: 会議の開催予定が生じる, kind: event, actor: ACT-001 }
  - id: BFN-001-RESERVE
    name: 会議室を予約する
    kind: usecase
    usecase: UC-001
    actor: ACT-001
    description: 空き照会・条件入力・確認・登録を含む。条件調整や業務エラーはこのユースケース内で扱う。
  - { id: BFN-001-WAIT, name: 予約後に何をするか, kind: decision, actor: ACT-001 }
  - id: BFN-001-CHECK
    name: 空き状況・自分の予約を確認する
    kind: usecase
    usecase: UC-003
    actor: ACT-001
    description: 情報の把握だけを目的とする任意の工程。
  - id: BFN-001-CHANGE
    name: 予約内容を変更する
    kind: usecase
    usecase: UC-009
    actor: ACT-001
    description: 開始1時間前まで。条件違反時は元の予約を維持し、再入力・中止はこのユースケース内で扱う。
  - id: BFN-001-CANCEL
    name: 自分の予約を取り消す
    kind: usecase
    usecase: UC-002
    actor: ACT-001
    description: 対象予約の確認と取消を含む。期限や権限の確認はユースケース定義に従う。
  - id: BFN-001-CALL
    name: 総務部へ代理取消を引き継ぐ
    kind: external
    actor: ACT-001
    description: 電話で依頼するシステム外の行為。この図は引継ぎで完了し、以降の代理取消はBF-002で扱う。
  - { id: BFN-001-CANCELLED, name: 予約取消済み, kind: state, actor: ACT-001 }
  - id: BFN-001-USE
    name: 会議室を利用する（システム外）
    kind: external
    actor: ACT-001
    description: 入退室の記録は対象外。開始前リマインドはBF-007の補助フローで行う。
  - { id: BFN-001-ABORT, name: 予約せずに終了, kind: state, actor: ACT-001 }
transitions:
  - { id: BFT-001-01, from: BFN-001-START, to: BFN-001-RESERVE, condition: 会議室を確保する }
  - { id: BFT-001-02, from: BFN-001-RESERVE, to: BFN-001-WAIT, condition: 予約成立 }
  - { id: BFT-001-03, from: BFN-001-RESERVE, to: BFN-001-ABORT, condition: 予約を見送る }
  - { id: BFT-001-04, from: BFN-001-WAIT, to: BFN-001-CHECK, condition: 内容を確認する }
  - { id: BFT-001-05, from: BFN-001-CHECK, to: BFN-001-WAIT, condition: 確認完了 }
  - { id: BFT-001-06, from: BFN-001-WAIT, to: BFN-001-CHANGE, condition: 予定を変更する }
  - { id: BFT-001-07, from: BFN-001-CHANGE, to: BFN-001-WAIT, condition: 変更完了・元の予約を維持 }
  - { id: BFT-001-08, from: BFN-001-WAIT, to: BFN-001-CANCEL, condition: 取消する（開始1時間前まで） }
  - { id: BFT-001-09, from: BFN-001-WAIT, to: BFN-001-CALL, condition: 取消する（期限後） }
  - { id: BFT-001-12, from: BFN-001-CANCEL, to: BFN-001-CANCELLED, condition: 取消完了 }
  - { id: BFT-001-16, from: BFN-001-WAIT, to: BFN-001-USE, condition: 利用日時を迎える }
notes: |
  四角の工程は利用者の目的が完了するユースケース単位とする。
  予約・変更・取消に伴う照会・確認・入力エラーは各ユースケースの内部手順に置く。
  期限後の代理取消はBF-002、開始前の自動通知はBF-007で詳述する。
