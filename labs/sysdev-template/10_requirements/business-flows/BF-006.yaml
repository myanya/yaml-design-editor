id: "BF-006"
trigger: "座席管理システムが対象日の予約情報を必要とする。"
outcome: "予約情報を取得できる、または取得できない理由が返される。"
participants:
  - actor: "ACT-003"
    role: "座席管理システム（情報取得元）"
start:
  - "BFN-006-START"
terminal:
  - "BFN-006-DONE"
  - "BFN-006-DENIED"
nodes:
  - id: "BFN-006-START"
    name: "外部システムが予約情報を必要とする"
    kind: "event"
  - id: "BFN-006-FETCH"
    name: "予約情報を取得する"
    kind: "usecase"
    usecase: "UC-007"
    actor: "ACT-003"
  - id: "BFN-006-DONE"
    name: "必要な予約情報を取得済み"
    kind: "state"
  - id: "BFN-006-DENIED"
    name: "予約情報を取得できない"
    kind: "state"
transitions:
  - id: "BFT-006-01"
    from: "BFN-006-START"
    to: "BFN-006-FETCH"
    condition: "対象日と任意の会議室を指定する"
  - id: "BFT-006-02"
    from: "BFN-006-FETCH"
    to: "BFN-006-DONE"
    condition: "認可・要求条件を満たす（該当なしは空の一覧）"
  - id: "BFT-006-03"
    from: "BFN-006-FETCH"
    to: "BFN-006-DENIED"
    condition: "APIキー不正などのエラー"
notes: "予約者の所属は提供するが、氏名・連絡先は提供しない。取得頻度や起動契機は外部システム側の責務。"
