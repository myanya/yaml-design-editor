id: "BF-002"
trigger: "社員から総務部へ予約または取消の依頼が届く。"
outcome: "依頼した社員の予約・取消が完了する、または対応できない旨を伝える。"
participants:
  - actor: "ACT-002"
    role: "総務部（代理操作の担当者）"
start:
  - "BFN-002-START"
terminal:
  - "BFN-002-DONE"
  - "BFN-002-FAILED"
nodes:
  - id: "BFN-002-START"
    name: "社員から予約・取消の依頼を受ける"
    kind: "event"
  - id: "BFN-002-TYPE"
    name: "依頼内容は予約か取消か"
    kind: "decision"
  - id: "BFN-002-RESERVE"
    name: "依頼した社員の会議室を予約する"
    kind: "usecase"
    usecase: "UC-001"
    actor: "ACT-002"
    description: "社員を予約者に指定し、本人操作と同じ予約条件を適用する。"
  - id: "BFN-002-CANCEL"
    name: "依頼された予約を取り消す"
    kind: "usecase"
    usecase: "UC-002"
    actor: "ACT-002"
    description: "対象社員の予約を確認する。開始1時間前を過ぎても総務部は取消可能。"
  - id: "BFN-002-DONE"
    name: "依頼者へ完了を連絡する（システム外）"
    kind: "external"
  - id: "BFN-002-FAILED"
    name: "依頼者へ対応できない旨を連絡する（システム外）"
    kind: "external"
transitions:
  - id: "BFT-002-01"
    from: "BFN-002-START"
    to: "BFN-002-TYPE"
    condition: "依頼を受け付ける"
  - id: "BFT-002-02"
    from: "BFN-002-TYPE"
    to: "BFN-002-RESERVE"
    condition: "予約の依頼"
  - id: "BFT-002-03"
    from: "BFN-002-TYPE"
    to: "BFN-002-CANCEL"
    condition: "取消の依頼"
  - id: "BFT-002-04"
    from: "BFN-002-RESERVE"
    to: "BFN-002-DONE"
    condition: "予約成立"
  - id: "BFT-002-05"
    from: "BFN-002-RESERVE"
    to: "BFN-002-FAILED"
    condition: "条件を満たす予約ができない"
  - id: "BFT-002-06"
    from: "BFN-002-CANCEL"
    to: "BFN-002-DONE"
    condition: "取消成立"
  - id: "BFT-002-07"
    from: "BFN-002-CANCEL"
    to: "BFN-002-FAILED"
    condition: "対象予約を特定できない等"
notes: "依頼の受付・結果連絡はシステム外で行う。代理変更のユースケースは設けない。"
