# ユースケース一覧: 機能概要はここ、フロー等の詳細は usecases/UC-*.yaml（同一ID）で詳細化する。
usecases:
  - id: UC-001
    name: 会議室を予約する
    summary: |
      一般社員が空き状況を確認したうえで会議室を予約する。
      営業時間内・重複なしの予約のみ受け付ける。
  - id: UC-002
    name: 予約を取り消す
    summary: |
      一般社員が自分の予約を取り消す。開始1時間前を過ぎた予約は取り消せない。
  - id: UC-003
    name: 空き状況を照会する
    summary: |
      一般社員が日付・時間帯・会議室を指定して空き状況を照会する。
