name: 会議室予約システム
purpose: |
  社内の会議室予約を電話・ホワイトボード運用からシステム化し、
  空き状況の確認と予約・取消をセルフサービス化する。
scope: |
  対象: 本社ビルの会議室の予約・取消・空き照会、外部の座席管理システムへの予約情報提供。
  対象外: 支社の会議室、備品（プロジェクタ等）の貸出管理、来客受付。
users:
  - { name: 一般社員, description: 会議室の予約・取消・空き照会を行う }
  - { name: 総務部, description: 会議室マスタ・休日カレンダーの管理を行う }
  - { name: 座席管理システム, description: 予約情報を参照する外部システム }
