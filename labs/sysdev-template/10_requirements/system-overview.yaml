name: 会議室予約システム
purpose: |
  社内の会議室予約を電話・ホワイトボード運用からシステム化し、
  空き状況・予約内容の確認と予約・変更・取消をセルフサービス化する。
  総務部による予約・取消の代行、会議室・休日の管理、利用実績の把握を支援する。
scope: |
  対象: 本社ビルの会議室の予約・変更・取消・空き照会・予約内容確認、開始前リマインド、
  総務部による他の社員の予約・取消代行、会議室マスタ・休日カレンダー管理、利用実績集計、
  外部の座席管理システムへの予約情報提供。
  対象外: 支社の会議室、備品（プロジェクタ等）の貸出管理、来客受付、繰り返し予約、
  総務部による代理変更、実際の入退室時刻の記録。
actors:
  - { id: ACT-001, name: 一般社員, description: 会議室の予約・変更・取消・空き照会・予約内容確認を行い、開始前リマインドを受け取る }
  - { id: ACT-002, name: 総務部, description: 会議室マスタ・休日カレンダーの管理、他の社員の予約・取消代行、利用実績集計を行う }
  - { id: ACT-003, name: 座席管理システム, description: 予約情報を参照する外部システム }
