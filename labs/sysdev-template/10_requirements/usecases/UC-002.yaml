id: UC-002
actor: 一般社員
based_on: [BR-003]
preconditions:
  - 利用者がシステムにログインしていること
  - 取消対象の予約が存在すること
main_flow:
  - { no: 1, action: 一般社員が予約詳細画面で自分の予約を表示する }
  - { no: 2, action: 一般社員が「予約を取り消す」を選択する }
  - { no: 3, action: システムが開始1時間前を過ぎていないことを確認して予約を取り消す }
  - { no: 4, action: システムが取消完了を表示する }
alt_flows:
  - condition: 手順3で開始1時間前を過ぎていた場合
    steps:
      - システムが取消不可エラーと総務部連絡の案内を表示する
postconditions:
  - 予約が取り消され、空き状況照会に反映されていること
