id: "UC-002"
based_on:
  - "BR-003"
preconditions:
  - "利用者がログインし、取消対象の予約が存在すること。"
main_flow:
  - no: 1
    action: "一般社員は自分の予約を、総務部は依頼された社員の予約を検索・確認する。"
  - no: 2
    action: "利用者が予約の取消を指定する。"
  - no: 3
    action: "システムが権限を確認する。一般社員には開始1時間前までの期限を適用し、総務部の代理取消にはこの期限を適用しない。"
  - no: 4
    action: "システムが予約を取り消し、取消完了を表示する。"
alt_flows:
  - condition: "一般社員が開始1時間前を過ぎて取消を依頼した場合"
    steps:
      - "システムが取消を拒否し、総務部への電話連絡による代理取消を案内する。"
  - condition: "一般社員が他の社員の予約を取り消そうとした場合"
    steps:
      - "システムが権限不足として取消を拒否する。"
  - condition: "予約が見つからない、または取消済みの場合"
    steps:
      - "システムが現在の状態を表示し、追加の取消処理を行わない。"
postconditions:
  - "成立した取消が予約状態と空き状況に反映され、以後のリマインド対象から除外されること。"
