id: UC-001
actor: 一般社員
based_on: [BR-001, BR-002]
preconditions:
  - 利用者がシステムにログインしていること
main_flow:
  - { no: 1, action: 一般社員が空き状況照会画面で日付・時間帯を指定する }
  - { no: 2, action: システムが空いている会議室の一覧を表示する }
  - { no: 3, action: 一般社員が会議室を選んで予約内容（時間帯・目的）を入力する }
  - { no: 4, action: システムが営業時間内であること・重複がないことを確認して予約を登録する }
  - { no: 5, action: システムが予約完了を表示し、予約詳細画面へ遷移する }
alt_flows:
  - condition: 手順4で同一時間帯に既存予約がある場合
    steps:
      - システムが重複エラーを表示し、手順3へ戻る
  - condition: 手順4で営業時間外の時間帯が指定された場合
    steps:
      - システムが営業時間外エラーを表示し、手順3へ戻る
postconditions:
  - 予約が登録され、空き状況照会に反映されていること
