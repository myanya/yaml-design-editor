id: "UC-001"
based_on:
  - "BR-001"
  - "BR-002"
  - "BR-004"
preconditions:
  - "利用者がログインしていること。代理予約は総務部の権限を持つこと。"
main_flow:
  - no: 1
    action: "一般社員または総務部が日付・時間帯を指定して空き状況を確認する。"
  - no: 2
    action: "会議室を選び、利用日時・目的を入力する。一般社員は本人、総務部は依頼した社員を予約者に指定する。"
  - no: 3
    action: "システムが休日を除く営業時間内・当日から14日先までであることと、重複がないことを確認する。"
  - no: 4
    action: "システムが予約を登録し、予約番号と内容を表示する。"
alt_flows:
  - condition: "予約条件に違反する場合"
    steps:
      - "システムが理由を表示する。条件を調整して再確認するか、登録せず終了する。"
  - condition: "一般社員が他の社員の予約を登録しようとした場合"
    steps:
      - "システムが権限不足として登録を拒否する。"
postconditions:
  - "指定した社員の予約が登録され、空き状況照会に反映されていること。"
  - "開始前通知はBF-007の補助フローで、取消済みを除く最新の予約内容を基に行う。"
