# 単体テスト項目一覧のスキーマ（詳細設計向け試験。TI-1xx の定義出現）
#
# 検証対象は詳細設計の成果物（処理・API）に限定する（scope で機械強制）。
# 試験の3階層: 単体=詳細設計向け／結合=基本設計向け／総合=要件向け。
id: unit-test-item
name: 単体テスト項目一覧
match: 60_unit-test/test-items.yaml
description: 詳細設計（処理・API）× 試験観点で抽出した単体テスト項目の台帳。
entity:
  type: test-item
  idPattern: "TI-*"
  defines: true
constraints:
  - id: ti-covered
    description: 対象外（excluded）でない全テスト項目は、いずれかのテストケースの手順に消化されること
    match:
      - node: { entity: test-item, schema: unit-test-item, bind: ti }
      - edge: { dir: in, relation: covers }
      - node: { entity: test-case }
    where:
      - { of: ti, path: excluded, exists: false }
    expect: exists
    level: warning
root:
  type: object
  fields:
    - key: items
      label: テスト項目一覧
      type: array
      required: true
      item:
        type: object
        fields:
          - { key: id, label: 項目ID, type: id, required: true, description: 例 TI-101（単体は 1xx）。 }
          - key: target
            label: 検証対象
            type: ref
            required: true
            relation: verifies
            scope:
              schemaIds: [process-design, int-api-list, ext-api-list]
            description: 処理（PROC-*）またはAPI（IAPI-*/EAPI-*）。
          - key: viewpoint
            label: 試験観点
            type: ref
            required: true
            idPattern: "VP-*"
            relation: viewpoint
            scope:
              schemaIds: [test-viewpoint]
          - { key: description, label: 確認内容, type: string, required: true }
          - key: excluded
            label: 対象外
            type: boolean
            description: あえて試験しないセル（対象×観点）はこの行を残して true にする（網羅判定は充足扱い・消化は不要）。
          - key: exclude_reason
            label: 対象外の理由
            type: string
            description: excluded の場合は理由を必ず書く（レビューの記録）。
          - key: based_on
            label: 根拠ルール
            type: array
            item:
              type: ref
              idPattern: "BR-*"
              relation: based-on
              scope:
                schemaIds: [business-rule]
