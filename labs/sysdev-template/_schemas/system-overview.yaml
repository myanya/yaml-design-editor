# システム概要のスキーマ（要件定義の入口。1ファイル）
id: system-overview
name: システム概要
match: 10_requirements/system-overview.yaml
description: システムの目的・スコープ・ID付きアクター一覧を1枚で記述する。
entity:
  type: actor
  idPattern: "ACT-*"
  defines: true
root:
  type: object
  fields:
    - key: name
      label: システム名
      type: string
      required: true
    - key: purpose
      label: 目的
      type: text
      required: true
    - key: scope
      label: スコープ
      type: text
      required: true
      description: 対象業務と、対象外とする範囲。
    - key: actors
      label: アクター一覧
      type: array
      required: true
      item:
        type: object
        fields:
          - { key: id, label: アクターID, type: id, required: true, description: 例 ACT-001。 }
          - { key: name, label: アクター名, type: string, required: true }
          - { key: description, label: 説明, type: string }
