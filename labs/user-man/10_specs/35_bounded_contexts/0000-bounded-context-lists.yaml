bounded_contexts:
  - id: BCTX-0001
    title: 権限管理
    summary: 各機能の権限とロール付与を、一貫したモデルで扱う。
  - id: BCTX-0002
    title: ユーザ管理
    summary: ユーザの登録と利用状態の変化を一貫して管理する。
  - id: BCTX-0003
    title: テナント管理
    summary: テナント開設と利用側連携の責務を明確にする。
  - id: BCTX-0004
    title: 組織・グループ管理
    summary: 各機能の権限範囲の基盤を、共通の定義として管理する。
  - id: BCTX-0005
    title: ユーザ認証
    summary: 本人の認証と認証設定の完了を一貫して扱う。
