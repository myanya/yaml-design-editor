id: BCTX-0004
status: draft
purpose: 各機能の権限範囲の基盤を、共通の定義として管理する。
responsibility: |
  組織ツリーとグループの対象組織を管理し、実行範囲の基準を提供する。
out_of_scope: |
  権限範囲以外の用途への拡張は想定しない。権限・ロール・付与関係は権限管理、ユーザの所属情報はユーザ管理で扱う。
concepts:
  - name: 組織
    meaning: テナント内の親子構造を持ち、権限範囲の基準となる単位。
  - name: グループ
    meaning: 指定した組織と、下部組織を含めるかどうかで定める管理範囲。
information_ownership: |
  組織構造とグループの定義を管理する。他機能の追加時もこの定義を権限範囲に利用する。
public_contract: |
  実行範囲の基準となる定義と、その定義の管理操作を提供する。全域管理の特例とシステム管理者の除外は維持する。
subdomains:
  - to: SDOM-0004
    responsibility: 権限範囲の基準となる組織・グループの定義
rule_refs: [RITM-0008, RITM-0010, RITM-0202, RITM-0203, RITM-0204, RITM-0205, RITM-0208]
