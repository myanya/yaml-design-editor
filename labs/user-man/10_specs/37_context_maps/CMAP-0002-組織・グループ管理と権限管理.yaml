id: CMAP-0002
status: draft
context_a: BCTX-0004
context_b: BCTX-0001
purpose: 全機能のロールに共通する実行範囲の基準を用いる。
information_flow: |
  組織・グループ管理は組織構造と対象組織の定義を提供し、権限管理と各機能はこれを実行範囲の基準に用いる。組織・グループの管理操作も権限制御の対象となる。
ownership: |
  組織構造・グループの定義は組織・グループ管理、権限値とロールの付与関係は権限管理が管理する。
model_translation: |
  組織・グループの定義を権限の実行範囲に対応付ける。テナント全域管理の特例とシステム管理者の除外を適用する。
rule_refs: [RITM-0195, RITM-0202, RITM-0203, RITM-0204, RITM-0205, RITM-0208]
