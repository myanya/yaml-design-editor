id: CMAP-0003
status: draft
context_a: BCTX-0002
context_b: BCTX-0005
purpose: 利用開始の許可と初期設定の完了を結び付ける。
information_flow: |
  ユーザ管理で初期設定中へ移ったことを契機に、認証の初期設定を案内する。ユーザ認証で必要な設定が完了したことを、ユーザ管理の利用開始条件に結び付ける。
ownership: |
  利用状態はユーザ管理、パスワード・多要素認証の設定とその完了はユーザ認証が管理する。
model_translation: |
  利用してよい状態と初期設定済みの両方を満たして利用中になる。認証設定の完了だけで利用許可を与えない。
timing_and_failure: |
  初期設定中への遷移を案内の契機とする。大量処理や送信数制限等では予約バッチを優先し、実際のメール送信を遅らせられる。
agreements:
  - name: 初期設定用URLの発行と期限
    description: 実際のメール送信処理時にURLを発行して有効期限を起算し、案内の契機から送信までの待ち時間は含めない。
    rule_refs: [RITM-0210]
  - name: 設定完了と停止解除の区別
    description: 停止中でも認証設定を完了できるが、完了だけでは通常機能の利用を許可せず、停止解除は管理者等の別操作とする。
    rule_refs: [RITM-0170, RITM-0171]
rule_refs: [RITM-0163, RITM-0165, RITM-0184, RITM-0207]
