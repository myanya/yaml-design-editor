business_flows:
  - id: BZFL-0001
    title: ユーザ登録から利用開始
    summary: |
      任意のロール付与を伴う事前登録、利用開始の操作・予約、初期設定の案内と本人による設定を経て利用中となる流れを記述する。
      大量処理時のメール送信の遅延と、初期設定未完了からの再開も扱う。
  - id: BZFL-0002
    title: ユーザの停止と再開
    summary: |
      管理者等が停止の種類を判断し、ユーザを一時停止・利用停止にした後、必要に応じて再開する業務の流れを記述する。
      基本経路は初期設定完了済みの利用中ユーザを対象とし、停止の維持・削除への分岐と予約による操作も扱う。
