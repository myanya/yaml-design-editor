id: BZFL-0001
status: draft
purpose: |
  管理者等によるユーザ登録から、利用開始の操作または予約、本人の初期設定を経て「利用中」になるまでを記述する。
  事前登録を含む基本経路と、既存ルールで確定済みの分岐を対象とする。
actors:
  - id: BATR-0004
    name: 管理者等
    description: |
      対象ユーザの登録・利用開始・ロール付与について、それぞれ必要な操作権限と実行範囲を持つ操作者。
      ロール名そのものを権限の判定条件にはしない。
  - id: BATR-0005
    name: 本人
    description: |
      登録されたユーザとして、案内されたURLからパスワードと必要な多要素認証を設定する。
  - id: BATR-0006
    name: 予約処理
    description: |
      予約された利用開始の操作を実行する。
      権限判定には予約の実行権限者を用いる。
  - id: BATR-0007
    name: 本システム
    description: |
      初期設定用URLを案内し、初期設定完了に応じた利用状態の変更を行う。
preconditions:
  - 対象テナントと、本務の所属先として指定する組織が存在する。
  - 操作者は、行う操作に必要な権限と実行範囲を持つ。
basic_flow:
  - title: ユーザを登録する
    operations: [DOPR-0005, DOPR-0003]
    usecases: [USCS-0001]
    actor: 管理者等
    content: |
      ユーザ情報と所属を登録する。
      ロール付与は任意とし、指定された場合は権限管理と連携して付与する。
      ロール未指定でも登録を受け付ける。
      指定したロールの付与に失敗した場合は、ユーザ登録も成立させない。
    state_change: 未登録から「利用開始前」として事前登録する。
    subdomains: [SDOM-0002, SDOM-0001, SDOM-0004]
    rule_refs: [RITM-0003, RITM-0162, RITM-0163, RITM-0206, RITM-0209]
  - title: 利用開始の操作を適用する
    operations: [DOPR-0008]
    usecases: [USCS-0002]
    actor: 管理者等、または予約処理
    content: |
      管理者等の操作、または予約の実行によって、本人が初期設定を開始できる状態にする。
      この遷移を契機として、初期設定用URLの案内を行う。
    state_change: 「利用開始前」から「初期設定中」へ移す。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0165, RITM-0175, RITM-0176, RITM-0180, RITM-0207]
  - title: 初期設定用URLを案内する
    operations: [DOPR-0018]
    usecases: [USCS-0003]
    actor: 本システム
    content: |
      実際の送信処理時に初期設定用URLを発行し、その時点から有効期限を起算する。
      発行したURLを登録メールアドレスへ送信する。
      大量処理やメールプロバイダの送信数制限等に応じて、実際の送信を遅らせることを許容する。
      予約バッチを優先できるものとし、前の手順の状態変更とメールの実送信を同時に完了させる前提にはしない。
    state_change: メール送信そのものによる利用状態の変更はない。
    subdomains: [SDOM-0005]
    rule_refs: [RITM-0132, RITM-0207, RITM-0210]
  - title: 本人が初期設定を完了する
    operations: [DOPR-0019]
    usecases: [USCS-0004]
    actor: 本人
    content: |
      受信したURLからパスワードを設定し、テナント設定に応じて必要な多要素認証を設定する。
      会社・組織が登録済みの本人情報を入力し直すことは求めない。
      初期設定の完了条件は、パスワードと必要な多要素認証の設定が済んでいることである。
    subdomains: [SDOM-0005]
    rule_refs: [RITM-0132, RITM-0184]
  - title: 利用中へ移行する
    operations: [DOPR-0012]
    usecases: [USCS-0005]
    actor: 本システム
    content: |
      本人の初期設定完了により利用開始の条件を満たしたユーザを「利用中」にする。
      各機能で行える操作は、ロールに設定された権限と実行範囲に従う。
    state_change: 「初期設定中」から「利用中」へ移す。
    subdomains: [SDOM-0002, SDOM-0005, SDOM-0001]
    rule_refs: [RITM-0165, RITM-0195, RITM-0197, RITM-0203, RITM-0204, RITM-0205]
variations:
  - title: 指定ロールの付与に失敗する
    usecases: [USCS-0001]
    condition: 登録時に指定されたロールを付与できない場合。
    content: |
      ユーザ登録と指定ロールの付与のどちらも成立させず、部分的な登録結果を残さない。
    rule_refs: [RITM-0209]
  - title: ロールを指定せず登録する
    usecases: [USCS-0001]
    condition: 登録時にロールを指定しない場合。
    content: |
      ロール未指定のままユーザを登録する。
      後から登録済みユーザに対するロール変更で設定することができる。
      ロール付与を、全ての登録で必ず行う手順にはしない。
    rule_refs: [RITM-0206]
  - title: 予約バッチを優先し、案内メールの送信を遅らせる
    usecases: [USCS-0003]
    condition: 一括バッチの大量変更やメールプロバイダの送信数制限等によって、送信を遅らせる場合。
    content: |
      「初期設定中」への遷移を案内の契機とすることは維持し、実際のメール送信を遅らせる。
      送信の都合よりも予約バッチの処理を優先することを許容する。
      URLの発行・期限の起算は実際の送信処理時とし、送信待ち時間を有効期間に含めない。
    rule_refs: [RITM-0207, RITM-0210]
  - title: 初期設定が未完了のユーザが再開する
    usecases: [USCS-0004]
    condition: 初期設定が許可される状態のユーザが、初期設定を完了していない場合。
    content: |
      パスワードを忘れた場合の手続きで案内されるURLから初期設定を再開できる。
      「利用開始前」のままでは、この経路からも初期設定を始められない。
      パスワード設定済みで必須MFAが未完了の場合は、設定済みパスワードで認証して未完了の設定へ進むこともできる。
      パスワードは保存時に確定し、使用したURLはその時点で無効化する。
    rule_refs: [RITM-0163, RITM-0166, RITM-0135, RITM-0211]
  - title: 認証設定の保存後に利用状態の反映が失敗する
    usecases: [USCS-0004, USCS-0005]
    condition: 認証設定は保存済みだが、「利用中」への変更に失敗した場合。
    content: |
      認証設定を保持して利用状態への反映だけを再試行し、本人に同じ設定をやり直させない。
      反映完了まで通常機能の利用を許可せず、本人には利用開始の処理が未完了であることを案内する。
      再試行でも現在の状態と設定完了状況を確認し、停止を設定完了だけで解除しない。
    rule_refs: [RITM-0212]
  - title: 初期設定メールの送信が一時的に失敗する
    usecases: [USCS-0003]
    condition: 初期設定メールの送信で一時的なエラーが発生した場合。
    content: |
      テナント設定の再試行回数・間隔と期限の上限内で、有効な同じURLの送信を自動再試行する。
      URLの期限は延長せず、再試行で解消しない場合は本人・管理者からの既存の再設定案内で対応する。
    rule_refs: [RITM-0213, RITM-0214]
  - title: 送信待ち中にユーザ情報や設定状況が変わる
    usecases: [USCS-0003]
    condition: 初回送信または再試行までの間に、登録アドレスや設定完了・削除の状況が変わった場合。
    content: |
      送信時点で有効な登録アドレスを使用し、初期設定が完了済み・削除済みの場合は未送信の案内を取りやめる。
      一時停止・利用停止だけでは案内を取りやめない。
    rule_refs: [RITM-0215]
  - title: 初期設定を長期間完了しない
    usecases: [USCS-0004]
    condition: 案内後も初期設定が完了しない場合。
    content: |
      自動取消・自動削除は行わず、管理者等が状態を確認して運用で対応する。
    rule_refs: [RITM-0167, RITM-0168]
outcome: |
  利用開始の許可と必要な初期設定の完了を満たしたユーザは「利用中」となる。
  ユーザの登録とロール付与は区別され、登録時にロールが未指定でも登録できる。
  「利用中」で行える機能・操作は、設定された権限と実行範囲に従う。
rule_refs:
  - RITM-0003
  - RITM-0162
  - RITM-0163
  - RITM-0165
  - RITM-0184
  - RITM-0197
  - RITM-0206
  - RITM-0207
