id: BZFL-0002
status: draft
purpose: |
  管理者等がユーザの通常機能の利用を停止し、その後の運用判断に応じて再開するまでを記述する。
  基本経路は、初期設定完了済みの利用中ユーザへの即時操作とする。
  停止の維持と削除への引き渡し、予約による操作を分岐として扱う。
actors:
  - id: BATR-0001
    name: 管理者等
    description: |
      テナント全体を対象とする、停止・再開等の該当操作の権限を持つ操作者。
      停止の種類と、その後に再開・維持・削除のどれを行うかを運用上判断する。
  - id: BATR-0002
    name: 対象ユーザ本人
    description: |
      停止・再開の対象となるユーザ。本人の立場から停止・再開の操作は行わない。
      停止中も許可された認証設定を行え、再開後は再ログインする。
  - id: BATR-0003
    name: 本システム
    description: |
      操作権限と対象範囲・理由の条件を適用し、利用状態を変更して利用可否へ反映する。
      予約の場合は、指定された実行権限者に基づいて処理する。
preconditions:
  - 基本経路の対象ユーザは、同じテナントに属する初期設定完了済みの利用中ユーザである。
  - 停止・再開の操作には、テナント全体を対象とする該当操作の権限を必要とする。
activities:
  - id: BACT-0001
    kind: decision
    title: 対象の状況を確認し、停止の種類を判断する
    actor: BATR-0001
    content: |
      対象ユーザの利用状態を確認する。
      再開の可能性が高ければ一時停止、削除の可能性が高ければ利用停止を選ぶ。
      これは管理者等の運用判断であり、利用停止を選んでも後の再開は禁止されない。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0168, RITM-0170]
  - id: BACT-0002
    operations: [DOPR-0009]
    kind: action
    title: 理由を付けて停止を依頼する
    actor: BATR-0001
    content: |
      対象ユーザに対して、一時停止または利用停止の操作を行う。
      操作ごとのテナント設定に従って理由を入力する。
      設定された選択肢の「その他」を選ぶ場合と、選択肢が未設定の場合は自由記述を必要とする。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0175, RITM-0176, RITM-0185]
  - id: BACT-0003
    operations: [DOPR-0009]
    kind: action
    title: 停止を適用する
    actor: BATR-0003
    content: |
      テナント全体を対象とする該当操作の権限と理由の条件に従って、ユーザ単位で状態を変更する。
      本務・兼務ごとの停止にはしない。所属・ロール・認証設定は保持し、停止だけを理由に設定用URLを無効化しない。
      停止したユーザには通常機能を利用させない。既存のログインには、次のアクセス時の確認とログアウトの方針を適用する。
    state_change: 利用中から、選択された一時停止または利用停止へ移す。
    subdomains: [SDOM-0002, SDOM-0001, SDOM-0005]
    rule_refs: [RITM-0175, RITM-0176, RITM-0185, RITM-0172, RITM-0178, RITM-0171, RITM-0053, RITM-0179]
  - id: BACT-0004
    kind: decision
    title: 停止後の扱いを判断する
    actor: BATR-0001
    content: |
      運用上、再開・維持・削除のどれを行うか判断する。
      一時停止は再開、利用停止は削除の可能性が高いことを見分ける区分であり、どちらからの再開も禁止しない。
      この判断は管理者等の運用であり、新しい承認機能や定期的な自動判断の処理を意味しない。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0170]
  - id: BACT-0005
    operations: [DOPR-0010]
    kind: action
    title: 理由を付けて再開を依頼する
    actor: BATR-0001
    content: |
      再開すると判断した場合に、再開の理由を入力して操作する。
      一時停止・利用停止のどちらからも再開できる。本人による停止解除は認めない。
      再開せず維持する場合や削除へ進む場合は、この操作を行わず対応する分岐へ進む。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0170, RITM-0175, RITM-0176, RITM-0177, RITM-0185]
  - id: BACT-0006
    operations: [DOPR-0010]
    kind: action
    title: 再開を適用する
    actor: BATR-0003
    content: |
      再開操作の権限・対象範囲・理由の条件を適用する。
      基本経路では初期設定が完了している同じユーザの停止を解除し、その時点の所属・ロール・認証設定を引き継ぐ。
      停止中に変更された情報を、停止前の値へ戻す処理にはしない。
    state_change: 初期設定完了済みの一時停止または利用停止から利用中へ移す。
    subdomains: [SDOM-0002, SDOM-0001, SDOM-0005]
    rule_refs: [RITM-0165, RITM-0170, RITM-0172, RITM-0175, RITM-0176, RITM-0185]
  - id: BACT-0007
    operations: [DOPR-0021]
    kind: outcome
    title: 再ログインして利用を再開する
    actor: BATR-0002
    content: |
      停止解除後に再ログインする。停止前から残っていたログイン状態をそのまま再利用しない。
      利用中に行える操作は、その時点のロールの権限値と実行範囲によって決まる。
    subdomains: [SDOM-0005, SDOM-0001]
    rule_refs: [RITM-0179, RITM-0195, RITM-0197, RITM-0203, RITM-0204]
  - id: BACT-0008
    kind: outcome
    actor: BATR-0001
    title: 停止を維持する
    content: |
      一時停止・利用停止の状態と設定を保持する。
      一時停止を期間の経過だけで自動解除しない。
    state_change: 一時停止または利用停止を維持する。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0170, RITM-0172]
  - id: BACT-0009
    kind: handoff
    actor: BATR-0001
    title: 削除運用へ引き渡す
    content: |
      削除時期はテナントの運用で判断し、権限のある管理者等が理由を付けて通常の削除操作を行う。
      削除後の保持・物理削除には既存の削除ルールを適用する。
      削除済みからの復活は、この再開操作の対象にしない。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0170, RITM-0173, RITM-0174, RITM-0175, RITM-0185]
supporting_activities:
  - id: BACT-0010
    operations: [DOPR-0006]
    title: 必要なユーザ情報を更新する
    actor: BATR-0001
    condition: 停止中に情報を更新する必要がある場合。
    content: |
      管理者等は必要な権限の範囲でユーザの情報を更新できる。
      再開の必須手順ではなく、時間の経過や情報更新だけでは停止を解除しない。
    state_change: 一時停止または利用停止を維持する。
    subdomains: [SDOM-0002]
    rule_refs: [RITM-0170, RITM-0172]
  - id: BACT-0011
    operations: [DOPR-0019, DOPR-0020]
    title: 許可された認証設定を行う
    actor: BATR-0002
    condition: 停止中に認証設定を行う必要がある場合。
    content: |
      本人もパスワード再設定・変更などの許可された認証設定を行えるが、通常機能は利用できない。
      再開の必須手順ではなく、設定の完了や時間の経過だけでは停止を解除しない。
    state_change: 一時停止または利用停止を維持する。
    subdomains: [SDOM-0002, SDOM-0005]
    rule_refs: [RITM-0170, RITM-0171]
transitions:
  - id: BTRN-0001
    from: BACT-0001
    to: BACT-0002
    condition: 停止の種類を選び、操作を行う場合。
    rule_refs: [RITM-0170, RITM-0185]
  - id: BTRN-0002
    from: BACT-0002
    to: BACT-0003
    condition: 停止操作を依頼し、権限・対象範囲・理由の条件を確認する。
    rule_refs: [RITM-0175, RITM-0176, RITM-0185]
  - id: BTRN-0003
    from: BACT-0003
    to: BACT-0004
    condition: 停止の適用が成立し、以後の運用で扱いを判断する。
    rule_refs: [RITM-0170, RITM-0176]
  - id: BTRN-0004
    from: BACT-0004
    to: BACT-0005
    condition: 再開すると判断した場合。
    rule_refs: [RITM-0170, RITM-0185]
  - id: BTRN-0005
    from: BACT-0005
    to: BACT-0006
    condition: 再開操作を依頼し、権限・対象範囲・理由の条件を確認する。
    rule_refs: [RITM-0175, RITM-0176, RITM-0185]
  - id: BTRN-0006
    from: BACT-0006
    to: BACT-0007
    condition: 初期設定完了済みのユーザの再開が成立した場合。
    rule_refs: [RITM-0165, RITM-0179]
  - id: BTRN-0007
    from: BACT-0004
    to: BACT-0008
    condition: 再開・削除を行わず、停止を維持する場合。
    rule_refs: [RITM-0170, RITM-0172]
  - id: BTRN-0008
    from: BACT-0004
    to: BACT-0009
    condition: 再開せず削除すると判断した場合。
    rule_refs: [RITM-0170, RITM-0173, RITM-0175, RITM-0185]
variations:
  - title: 停止・再開を予約する
    condition: 管理者等が即時操作ではなく予約で状態を変更する場合。
    content: |
      管理者等が予約便へ停止または再開の内容を登録し、実行権限者を指定する。
      登録時と実行時に、それぞれ既存の権限確認と管理範囲の条件を適用する。
      実行時には指定されたユーザが便の開始時点で持つ権限を基準とする。
      再開の予約による実行と、一時停止を期間だけで自動解除する機能は区別する。
      ジョブの成否は管理画面で確認する。
    rule_refs: [RITM-0180, RITM-0081, RITM-0087, RITM-0088, RITM-0089, RITM-0170, RITM-0145]
  - title: 停止されたユーザが予約の登録者・実行権限者である
    condition: 予約に関わるユーザが一時停止・利用停止中の場合。
    content: |
      停止中のユーザを実行権限者とする予約は実行できない。
      登録者だけが停止していても、別の実行権限者による予約は、そのことだけを理由に実行不可にしない。
      対象ユーザが停止している場合の所属・ロール等の情報変更の予約は、引き続き実行可能とする。
    rule_refs: [RITM-0181, RITM-0182]
  - title: 利用開始前のユーザを止めておく
    condition: 事前登録中のユーザの利用開始を防ぐ場合。
    content: |
      一時停止・利用停止には移さず、利用開始の操作を行わない。
      不要になったユーザは通常の削除操作の対象とする。
    rule_refs: [RITM-0163]
outcome: |
  停止を適用したユーザは通常機能を利用できず、設定を保持したまま運用上の対応を待つ。
  基本経路で再開した同じユーザは、再ログイン後、その時点の設定・権限で利用する。
  停止の維持・削除へ進む分岐もあり、停止した全員が再開へ進むことを必須とはしない。
rule_refs: [RITM-0170, RITM-0171, RITM-0172, RITM-0176, RITM-0179]
