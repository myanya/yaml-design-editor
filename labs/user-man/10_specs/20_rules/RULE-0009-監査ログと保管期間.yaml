id: RULE-0009

derived_from:
  - RULE-0002
  - RULE-0008

sections:
  - id: RITM-0063
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 監査対象の操作
    summary: 管理している情報の登録・変更・削除・閲覧を監査ログに記録する。
    content: |
      操作の成否を記録し、権限不足による拒否なども対象に含める。
      予約やバッチ処理による更新も、情報の登録・変更・削除を契機として監査ログに記録する。

  - id: RITM-0064
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: ログインログ・システム運行ログとの分担
    summary: ログインの成否とバッチ処理等の運行状況は、それぞれ別のログで管理する。
    content: |
      ログインの成否は、監査ログではなく、ログイン成否を個別に管理するログへ記録する。
      バッチ処理等の運行状況は、一般的なシステム運行ログに記録する。
      処理の運行記録と、その処理による情報の操作の監査記録を区別する。

  - id: RITM-0065
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 監査ログの記録項目
    summary: いつ、どのテナントで、誰が、何に対して、どの操作を行い、どういう結果になったかを記録する。
    content: |
      記録項目は、日時、テナント、操作者（予約の場合は予約者）、操作対象、操作内容、成否とする。
      操作者や対象ユーザの識別には内部IDを用い、氏名やユーザ名は記録しない。
      接続元IPは、取得できる場合に取得した値をそのまま保存する。

  - id: RITM-0066
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 操作時点の認可の根拠
    summary: どの組織のどのロールで、どの権限を根拠に操作したかを値として保存する。
    content: |
      操作時点の組織・ロール・権限を追跡できるように記録する。

  - id: RITM-0067
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 対象レコードの特定と絞り込み
    summary: 対象レコードを特定できる情報と、個人情報を含まない業務上の絞り込み情報を残す。
    content: |
      監査ログには変更前後の値を記録せず、個人情報も記録しない。
      対象レコードが最終的に削除された場合でも、どの組織やロールに関わる操作かなどを絞り込めるようにする。
      そのために残す組織やロール等の情報も、個人情報を含まないものとする。
    decision_reason: |
      監査ログは長期保管を目的とし、対象レコードを特定できればよい。
      対象レコードの削除後も、業務・運用上の調査である程度の絞り込みができる状態を保つ。

  - id: RITM-0068
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 業務履歴との分担
    summary: 変更前後の値は、監査ログとは別の業務履歴で管理する。
    content: |
      業務履歴の検索・保管期間と利用権限は、RULE-0016「ログ方針」に従う。
      業務履歴では、削除対象となる情報を消せるようにする。

  - id: RITM-0069
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 監査ログの保管期間
    summary: 監査ログは10年間保管する。
    content: |
      保管期間はシステム共通とする。

  - id: RITM-0070
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: データベースとファイルの保管範囲
    summary: 直近1年分をデータベースで保持し、ファイルにも同時に保存する。1年を超えたログはファイルで保管する。
    content: |
      ファイルはサーバ上で保管する。

  - id: RITM-0071
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: ファイルの保管単位とテナント分離
    summary: ファイルはテナントごと・月ごとに1つとし、実際の保管場所もテナントごとに分離する。
    content: |
      保存先の設定はシステム共通とし、テナントごとに保存先を変更する機能は設けない。
      共通設定の保管先の中で、ディレクトリ等によってテナントごとの実際の保管場所を分離する。
    decision_reason: |
      テナントごとに保存先を変更する必要はないため、設定はシステム共通とする。
      実際の保管場所の分離は、テナント分離の大原則に従う。

  - id: RITM-0072
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 監査ログの利用権限
    summary: テナント・グループ・組織の各ユーザ管理者は、それぞれの管理範囲内の監査ログを利用できる。
    content: |
      テナント管理者と監査権限を持つユーザも、監査ログを利用できる。
      登録・変更・削除・閲覧・拒否を含めた監査記録を対象とする。
      利用できる期間は「管理者ごとの参照可能期間」に従う。

  - id: RITM-0073
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 管理者ごとの参照可能期間
    summary: グループ・組織のユーザ管理者が確認できるログは過去1年分に限定し、それ以前のログはテナント全体の管理権限または監査権限を必要とする。
    content: |
      1年を超えたログは、テナント全体の権限を有する管理者か、監査権限を持つロールのユーザだけが利用できる。
    decision_reason: |
      グループ・組織のユーザ管理者による確認は、年1回の監査を想定する。
      組織単位での長期保管や組織変更への対応の複雑さを抑え、保管期間と保管先のコストのバランスを取る。

  - id: RITM-0074
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 閲覧範囲の判定時点
    summary: 監査ログを閲覧できる範囲は、閲覧時点の管理範囲で判定する。
    content: |
      ある組織の管理者になったユーザは、その組織の参照可能期間内のログを、就任前の記録も含めて確認できる。
      現在の管理範囲から外れた組織のログは確認できない。
    decision_reason: |
      過去の管理範囲ではなく、現在担当している範囲の記録を確認できることが、通常の業務に必要なためである。

  - id: RITM-0075
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 保管中の変更禁止と改ざん検知
    summary: 保管期間内の監査ログは変更できないものとし、改ざんを検知できる仕組みを設ける。
    content: |
      管理者であっても、保管期間内のログを編集・任意削除することは認めない。

  - id: RITM-0076
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 改ざん検査の実行と結果確認
    summary: 月1回程度の定期検査と随時実行を提供し、検査結果を記録して画面から確認できるようにする。
    content: |
      定期検査に加え、必要なときに改ざん検査を実行できるようにする。
      検査結果を記録として残し、画面から確認できるようにする。

  - id: RITM-0077
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 保管期限後の自動削除
    summary: 保管期限を過ぎた監査ログを自動削除し、ファイルについてはその記録期間を考慮して削除する。
    content: |
      ファイル単位で削除する場合は、ファイルに含まれるログの保管期間を満たしてから削除する。
      このため、実際の削除時期は、ファイル内の記録範囲の長さを加味した10年経過後となる。
      月ごとのファイルに含まれる1か月の記録範囲を考慮して削除時期を決める。
    decision_reason: |
      1つのファイルに異なる日時のログが含まれるため、記録範囲の途中のログを保管期限前に削除しないようにする。

  - id: RITM-0078
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 監査ログの取り出し
    summary: 監査ログをCSVとしてエクスポートできるようにする。
    content: |
      エクスポートするCSVにも個人情報は含めない。
      改ざんが検知されたファイルも、警告を表示したうえでダウンロードできるようにする。

  - id: RITM-0079
    created_on: 2026-10-04
    updated_on: 2026-10-04
    title: 1年を超えたログの取得
    summary: 画面で年月の範囲を指定し、対象月のログを一括ダウンロードできるようにする。
    content: |
      年月の範囲を指定する方式とし、オンライン検索と同等の柔軟な絞り込みは提供しない。
      1か月分を取得する場合は、CSVまたはZIP圧縮を選択できる。
      複数月分を取得する場合は、ZIP圧縮でのみダウンロードできる。
