id: RULE-0011

derived_from:
  - RULE-0006
  - RULE-0007

sections:
  - id: RITM-0101
    rule_type: ui_design
    category: ui
    tags: [PC, 対象端末]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 対象端末
    summary: 本システムの画面はPCを対象とする。
    content: |
      管理画面と本人向けの設定画面を含め、PCでの利用を対象とする。
      スマートフォン・タブレット向けの画面対応は不要とする。

  - id: RITM-0102
    rule_type: ui_design
    category: ui
    tags: [デジタル庁, デザインシステム, アクセシビリティ]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: デザインの基準
    summary: デジタル庁デザインシステムを採用する。
    content: |
      画面のデザイン、操作性、アクセシビリティは、デジタル庁デザインシステムに従う。
      キーボード操作、文字サイズ、色による表現なども、同デザインシステムを基準とする。
      公式資料： https://design.digital.go.jp/dads/
    decision_reason: |
      デジタル庁デザインシステムを、よくできたデザインシステムとして評価しているため。

  - id: RITM-0103
    rule_type: ui_design
    category: ui
    tags: [共通デザイン, カスタマイズ, CSS]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 共通デザインと利用側のカスタマイズ
    summary: 共通デザインを基本とし、ヘッダ・フッタ等の表示コンテンツとCSSをカスタマイズ可能にする。
    content: |
      他のアプリケーションに組み込む場合も、本サブシステムの共通デザインを基本とする。
      ヘッダ・フッタ等に表示するコンテンツやCSSは、利用側でカスタマイズできるようにする。
      カスタマイズを行う主体は、導入先システムの開発ベンダとする。
      設定ファイルによる変更も許容するが、基本的には開発ベンダが直接カスタマイズすることを想定する。

  - id: RITM-0104
    rule_type: ui_design
    category: ui
    tags: [カスタマイズ, 開発ベンダ, ガイドライン]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: カスタマイズガイドライン
    summary: 導入先システムの開発ベンダ向けに、画面のカスタマイズガイドラインを整備する。
    content: |
      ヘッダ・フッタ等の表示コンテンツやCSSをカスタマイズする際の指針を提供する。
    decision_reason: |
      導入先の開発ベンダが直接カスタマイズする運用を想定しているため。

  - id: RITM-0105
    rule_type: ui_design
    category: ui
    tags: [テナント設定, ロゴ, テーマカラー]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: テナント別の表示設定
    summary: テナント名の表示、ロゴ、テーマカラーをテナントごとに設定できるようにする。
    content: |
      テナント名の表示や、ロゴ・テーマカラーの変更を選択できるようにする。
      テナント管理者が管理画面からテナント名・ロゴ・テーマカラーを変更できるようにする。
      これらを超えるカスタマイズは、「共通デザインと利用側のカスタマイズ」の仕組みで対応する。

  - id: RITM-0106
    rule_type: ui_design
    category: ui
    tags: [多言語, 対応言語]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 表示言語
    summary: 日本語・英語・中国語（簡体字・繁体字）・韓国語に対応する。
    content: |
      その他の言語は、必要に応じて対応する。

  - id: RITM-0107
    rule_type: ui_design
    category: ui
    tags: [表示言語, 本人設定, 既定言語]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 表示言語の選択と保存
    summary: ユーザ本人が表示言語を選択し、その設定を保存できるようにする。
    content: |
      ログイン後は、本人が保存した表示言語設定を利用する。
      ログイン前は、ブラウザの言語設定よりもテナントの既定言語を優先する。

  - id: RITM-0108
    rule_type: ui_design
    category: ui
    tags: [ブラウザ, 対応環境]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 対応ブラウザ
    summary: PCの対応ブラウザは特定の製品に限定せず、基本的に最新版を対象とする。
    content: |
      Chrome・Edge・Firefox・Safariなどの特定のブラウザだけに対応対象を限定しない。
