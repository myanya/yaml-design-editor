id: RULE-0003

sections:
  - id: RITM-0009
    rule_type: business
    category: organization
    tags: [組織ツリー, 最上位組織]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 組織ツリーの構造
    summary: 自由な階層構造を認め、最上位組織は複数置ける。
    content: |
      組織の階層は固定の種類や順序に限定しない。
      複数の最上位組織を持つことを認める。
      実装上、疑似的な最上位組織を1つだけ置く方式を否定するものではない。

  - id: RITM-0010
    rule_type: system
    category: organization
    tags: [組織ツリー, 階層制限, 性能]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 組織の最大階層
    summary: 組織の最大階層は10段とする。
    content: |
      業務上の最上位組織を1段目として数え、実装上の疑似的な最上位組織は段数に含めない。
    decision_reason: |
      階層の深さが性能に与える影響を考慮して、上限を設ける。

  - id: RITM-0011
    rule_type: business
    category: organization
    tags: [グループ, 管理範囲]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: グループの位置付けと構成要素
    summary: グループは、組織を管理上の目的で仮想的にまとめるものである。
    content: |
      グループには組織だけを指定し、ユーザや別のグループは指定しない。
      同じ組織を複数のグループに含めることができる。
      管理上の仮想的なグルーピングとして、グループを自由に設定できる。
      複数組織を一括で管理できるように、複数組織の管理権限をまとめて扱うための簡易的な考え方である。

  - id: RITM-0012
    rule_type: business
    category: organization
    tags: [グループ, 下部組織, 管理範囲]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 下部組織を含める設定
    summary: 下部組織を含めるかどうかは、グループ全体で一律に指定する。
    content: |
      下部組織を含める場合、グループに指定したすべての組織について下部組織を対象に含める。
      下部組織には、直下の子組織だけでなく、孫以下のすべての子孫組織を含める。
      下部組織を含めない場合、グループに直接指定した組織だけを対象とする。
      指定した組織ごとに、下部組織を含めるかどうかを変えることはしない。

  - id: RITM-0202
    rule_type: business
    category: organization
    tags: [組織, グループ, 機能, ロール]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: 組織・グループ管理の独立性
    summary: 組織・グループ管理は、ユーザ管理から独立した機能IDとロールで管理する。
    content: |
      組織構造とグループの定義は、ユーザ管理以外の機能でも利用する。
      組織・グループ管理を独立した機能として扱い、その操作権限は同機能のロールに設定する。
    decision_reason: |
      組織構造はユーザ管理だけのものではなく、各機能に共通する基盤となるため。

  - id: RITM-0203
    rule_type: business
    category: authorization
    tags: [組織, グループ, ロール, 実行範囲]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 2
    title: 全機能のロールに共通する実行範囲の基準
    summary: 全機能のロールの実行範囲は、組織またはグループを基軸とすることを原則とし、テナント全域管理の特例とテナント外のシステム管理者の除外を認める。
    content: |
      ロールを設計するときは、組織に関するロールか、グループに関するロールかを基準とする。
      ユーザ管理だけでなく、組織・グループ管理や利用側の他機能のロールも、組織・グループの定義に基づく実行範囲を持つ。
      操作の可否を決める権限と、その操作を行える範囲の両方を扱う。
      ロールに権限が設定されていることだけで、組織・グループによって規定された実行範囲を超える操作を認めるものではない。
      テナント全域の管理権限については「テナント全域管理における組織権限チェックの特例」に従う。
      テナント外のシステム管理者は「システム管理者の実行範囲の扱い」に従い、本原則の対象外とする。

  - id: RITM-0204
    rule_type: architecture
    category: authorization
    tags: [テナント全域, 組織権限, 障害対応]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: テナント全域管理における組織権限チェックの特例
    summary: テナント管理者や機能限定のテナント全域管理者は、組織権限のチェックを行わない特別な実装を許容する。
    content: |
      テナント全体を対象とするロールを、組織・グループの仕組みで共通化して扱う実装を許容する。
      一方、組織を横断するテナント全域の管理権限については、組織権限をそもそもチェックしないなどの特別扱いも許容する。
      組織・グループへの対応付けを、テナント全域の管理権限を実現する唯一の方法とはしない。
      この特例は組織による範囲確認についてのものであり、自テナントという境界と、機能・操作に対して設定された権限は維持する。
      ロールの名称だけで特例を適用するものではない。
    decision_reason: |
      組織・グループに関する障害・故障によって、テナント全域の管理者まで何も操作できなくなる可能性を考慮するため。

  - id: RITM-0205
    rule_type: business
    category: authorization
    tags: [システム管理者, 組織, グループ, 対象外]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: システム管理者の実行範囲の扱い
    summary: テナント外のシステム管理者は、組織・グループを実行範囲の基準とする原則の対象外とする。
    content: |
      システム管理者のために、システム管理用の組織・グループを設ける必要はない。
      システム管理者がテナント外の存在であることは、RULE-0001の「管理者の所属」に従う。

  - id: RITM-0208
    rule_type: business
    category: organization
    tags: [組織, グループ, 権限範囲, スコープ]
    status: confirmed
    created_on: 2026-10-10
    updated_on: 2026-10-10
    revision: 1
    title: 組織・グループ管理の用途
    summary: 組織・グループ管理は各機能の権限範囲を支える基盤とし、他の用途への拡張は想定しない。
    content: |
      他の機能や業務領域を追加した場合も、その権限範囲には組織・グループの定義を用いる。
      組織・グループ管理を権限範囲以外の目的に利用することや、それに向けて機能を拡張することは、現時点の対象としない。
      この用途の限定は、本務・兼務の所属や組織構造など、権限範囲を成立させる既存の定義を取り除くものではない。
