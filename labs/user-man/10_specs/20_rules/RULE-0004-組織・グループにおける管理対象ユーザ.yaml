id: RULE-0004

derived_from:
  - RULE-0001
  - RULE-0003

sections:
  - title: 組織の管理範囲を決めるテナント設定
    summary: 組織管理者・担当者が下部組織も変更できるかは、テナントごとに設定する。
    content: |
      組織管理者の変更対象を所属組織だけとするか、下部組織も含めるかは、テナントの設定に従う。
      担当者についても、下部組織を変更できるかはテナントの設定に従う。
      管理者用と担当者用の設定は分けて指定できる。
      テナントの運用方針に合わせて設定できるようにする。

  - title: グループによる管理範囲
    summary: グループの対象組織のいずれかに所属するユーザを管理対象とする。
    content: |
      グループを通じた管理は、そのグループの対象となる複数組織の管理として扱う。
      組織管理者としては下部組織を変更できない設定であっても、下部組織を含めるグループの管理者として扱うことで、その範囲を管理できる。
      組織の管理範囲に関するテナント設定によって、グループ管理者として与えられた下部組織の管理範囲まで否定するものではない。

  - title: 本務・兼務と管理対象の判定
    summary: 管理対象ユーザに含めるかの判定では、本務と兼務を同じように扱う。
    content: |
      管理対象の組織が本務であるユーザと、その組織に兼務しているユーザの両方を管理対象とする。
      管理対象に含まれることと、そのユーザのどの情報を変更できるかは区別する。

  - title: 個人に紐づく共通情報
    summary: 個人に紐づく共通情報は、原則として本務側だけが変更できる。
    content: |
      兼務先組織の管理者であることだけでは、そのユーザの共通情報を変更できない。

  - title: 組織に紐づく権限情報
    summary: 組織に紐づく権限情報は、その組織について変更権限を持つ範囲でのみ変更できる。
    content: |
      本務先・兼務先のいずれであっても、組織に紐づく権限情報は、その組織を管理する権限に基づいて扱う。
      兼務先組織の管理者は、兼務先組織に紐づく権限のうち、変更権限を持つ範囲だけを変更できる。
      本務側の管理者であることだけで、兼務先組織に紐づく権限まで変更できるものではない。

  - title: 本務と兼務があるユーザの例
    summary: 営業部が本務で開発部が兼務のユーザについて、各組織の管理者が変更できる情報を区別する。
    content: |
      営業部の管理者は、共通情報と営業部に紐づく権限情報を変更できる。
      開発部の管理者は、開発部に紐づく権限情報だけを変更できる。
      いずれの権限情報も、管理者自身が変更権限を持つ範囲に限る。
