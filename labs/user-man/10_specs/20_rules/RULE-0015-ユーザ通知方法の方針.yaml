id: RULE-0015

derived_from:
  - RULE-0002
  - RULE-0011

sections:
  - id: RITM-0140
    rule_type: system
    category: notification
    tags: [メール, 画面内表示]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 通知手段
    summary: 本システムの通知手段は、メールと画面内表示とする。
    content: |
      利用者への通知は、この2つの手段で提供する。

  - id: RITM-0141
    rule_type: system
    category: notification
    tags: [本人情報, 変更通知, テナント設定]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 本人情報の変更通知
    summary: 本人の情報が変更された場合に、原則としてメールで本人へ通知できるようにする。
    content: |
      どの事象が発生したときに通知するかを、テナントごとに管理できるようにする。
      自動通知の基本的な対象は、本人情報の変更とする。

  - id: RITM-0142
    rule_type: ui_design
    category: notification
    tags: [一時通知, ログイン中, 画面内表示]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ログイン中の一時的な通知
    summary: ワーニング等の一時的な通知は、ユーザがログイン中であれば画面内で表示する。
    content: |
      本人向けの画面内通知は一時的なものとして扱い、後から確認する個人通知一覧には残さない。
      テナント全員への周知は、「トップページのお知らせ」に従う。

  - id: RITM-0143
    rule_type: architecture
    category: notification
    tags: [SMTP, 差出人, 共通設定]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: メールの接続設定と差出人
    summary: メールサーバの接続設定と差出人のドメインはシステム共通とし、差出人アドレスは原則テナントごとに払い出す。
    content: |
      差出人の表示名は、テナントごとに設定できるようにする。

  - id: RITM-0144
    rule_type: operation
    category: notification
    tags: [変更通知, 送信失敗, 再送]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 本人情報の変更通知の送信失敗
    summary: 本人情報の変更通知メールは、送信に失敗しても再送しない。
    content: |
      この変更通知について、自動再送・管理者による手動再送の機能は設けない。
    decision_reason: |
      あくまで情報変更の通知であり、届かなかったことによる不利益は大きくないと想定する。

  - id: RITM-0213
    rule_type: system
    category: notification
    tags: [初期設定, 送信失敗, 再送, 設定用URL]
    status: confirmed
    created_on: 2026-10-10
    updated_on: 2026-10-10
    revision: 1
    title: 初期設定メールの送信失敗と再試行
    summary: 初期設定メールの一時的な送信エラーには、期限・回数に上限を設けて自動再試行する。
    content: |
      同じ送信の再試行では、有効な同じ設定用URLを使用し、有効期限を延長しない。
      再試行はURLの再発行として扱わず、使用済み・期限切れ・再発行や削除で無効になったURLを送信しない。
      再試行で解消しない場合は、本人または管理者が既存のパスワード再設定案内の手続きで対応する。
      別の案内要求によってURLを再発行した場合は、既存の方針どおり以前のURLを無効化する。
      本人情報の変更通知を再送しない方針とは区別する。

  - id: RITM-0214
    rule_type: system
    category: notification
    tags: [初期設定, 再試行, テナント設定]
    status: confirmed
    created_on: 2026-10-10
    updated_on: 2026-10-10
    revision: 1
    title: 初期設定メールの再試行パラメータ
    summary: 初期設定メールの再試行回数と再試行間隔は、テナントごとに設定できるパラメータとする。
    content: |
      再試行回数の上限と、再試行の間隔をテナントごとに設定する。
      初期設定メールの自動再試行では、対象テナントの設定を適用する。

  - id: RITM-0215
    rule_type: system
    category: notification
    tags: [初期設定, 送信待ち, 宛先, 利用状態]
    status: confirmed
    created_on: 2026-10-10
    updated_on: 2026-10-10
    revision: 1
    title: 初期設定メールの送信待ち中の変更
    summary: 初期設定メールは送信時点で有効な登録メールアドレスへ送り、設定完了済み・削除済みなら未送信の案内を取りやめる。
    content: |
      送信待ち中に登録メールアドレスが変わった場合、送信時点で有効な登録アドレスを宛先とする。
      変更の確認が必要なテナントでは、変更が確定した登録アドレスを使用する。
      既に初期設定が完了している場合、または削除済みの場合は、未送信の初期設定案内を取りやめる。
      一時停止・利用停止中も初期設定が可能なため、停止だけを理由に案内を取りやめない。
      自動再試行による送信でも、送信時点の宛先と対象の条件を適用する。

  - id: RITM-0145
    rule_type: operation
    category: notification
    tags: [ジョブ, 実行結果, 管理画面]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ジョブの実行結果の確認
    summary: 一般的なジョブの実行成否は個別に通知せず、管理画面で確認する。
    content: |
      予約便などのジョブの実行結果は、管理者等が管理画面を開いて確認する運用とする。

  - id: RITM-0146
    rule_type: business
    category: notification
    tags: [お知らせ, テナント全員]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: トップページのお知らせ
    summary: テナント管理者がアナウンスを追加できるお知らせ枠をトップページに設ける。
    content: |
      お知らせの表示対象はテナント全員とする。
      組織・グループ・ロール等によって表示対象を限定する機能は設けない。
    decision_reason: |
      本システムはポータルサイトではないため、お知らせは最低限の機能とする。

  - id: RITM-0147
    rule_type: system
    category: notification
    tags: [お知らせ, 掲載期間, 既読管理]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: お知らせの掲載期間と閲覧状態
    summary: お知らせの掲載開始・終了日時を設定できるようにし、既読管理は行わない。
    content: |
      利用者の既読・未読の管理や、管理者による閲覧状況の確認機能は設けない。
    decision_reason: |
      お知らせの機能をシンプルに保つ。

  - id: RITM-0148
    rule_type: system
    category: notification
    tags: [多言語, 本人設定, 既定言語]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 自動通知の言語
    summary: 自動通知には本人の表示言語を使い、未設定の場合はテナントの既定言語を使う。
    content: |
      本人が保存した表示言語設定を優先する。

  - id: RITM-0149
    rule_type: system
    category: notification
    tags: [テンプレート, テナント設定]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 自動通知の文面
    summary: 自動通知の文面はテナント側で編集できるようにする。
    content: |
      テナントごとの運用に合わせて文面を変更できるようにする。
