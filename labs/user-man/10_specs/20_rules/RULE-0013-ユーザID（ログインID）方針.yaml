sections:
  - id: RITM-0115
    rule_type: system
    category: authentication
    tags: [ログインID, 方式選択, テナント設定]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ログインIDの方式
    summary: テナントごとに、メールアドレス・ユーザコード・ユーザ名の3方式からログインIDとして使う方式を選択する。
    content: |
      ユーザコードは、社員コードや社員番号など、テナント側がユーザに採番した業務上のIDを指す。
      システムが採番する内部IDと、ログインIDとして使用する値は区別する。

  - id: RITM-0116
    rule_type: business
    category: user_management
    tags: [メールアドレス, ユーザコード, 一意性]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: メールアドレスとユーザコードの必須・一意制約
    summary: メールアドレスとユーザコードは、ログインIDに使う方式にかかわらず必須かつテナント内で一意とする。
    content: |
      メールアドレス同士、ユーザコード同士で、それぞれ同一テナント内の重複を認めない。
      この必須・一意制約は固定とし、テナント設定で変更できない。
    decision_reason: |
      メールアドレスはテナント内で一意に扱う。
      ユーザコードには、テナント利用団体等の既存システムで採番された社員番号等を使用する可能性が高く、一意であることを想定する。

  - id: RITM-0117
    rule_type: system
    category: user_management
    tags: [ユーザ名, 必須条件, 一意性]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ユーザ名の必須・一意制約
    summary: ユーザ名をログインIDとして使う場合は必須とし、使わない場合は空を許容する。値を設定した場合はいずれもテナント内で一意とする。
    content: |
      ユーザ名方式のテナントでは、ユーザ名の未設定を認めない。
      ログインIDに使っていない場合も、設定されたユーザ名の同一テナント内での重複を認めない。
    decision_reason: |
      既存のユーザ名が必ず存在するとは限らないため、ログインIDとして使う場合に必須とする。

  - id: RITM-0118
    rule_type: system
    category: authentication
    tags: [ログインID, 方式切替, 検査]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 利用開始後の方式切り替え
    summary: テナントの利用開始後もログインIDの方式を切り替えられるようにする。
    content: |
      ユーザ名方式へ切り替える際は、ユーザ名が必須・一意の要件を満たしているか検査する。
      要件を満たさない場合は方式を変更できない。

  - id: RITM-0119
    rule_type: system
    category: identifier
    tags: [ユーザコード, ユーザ名, 大文字小文字]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ユーザコードとユーザ名の大文字・小文字
    summary: ユーザコードとユーザ名は、大文字・小文字を区別せずに照合する。
    content: |
      ログイン時の照合や、一意制約に基づく重複判定では、大文字・小文字の違いを区別しない。
      原簿となるDB上の値は、入力された大文字・小文字を保持して保存する。
      実装上必要な場合に、原簿の値とは別に照合用の値を保存することは許容するが、必須とはしない。
    decision_reason: |
      大文字・小文字を区別しない照合により、相互運用性を考慮する。

  - id: RITM-0120
    rule_type: system
    category: identifier
    tags: [メールアドレス, 大文字小文字, 照合]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: メールアドレスの大文字・小文字
    summary: メールアドレスは大文字・小文字を区別せずに照合し、保存時には入力された表記を保持する。
    content: |
      ログイン時と重複判定時は、メールアドレスの大文字・小文字の違いを区別しない。
      原簿となるDB上の値は、入力された大文字・小文字を保持して保存する。

  - id: RITM-0121
    rule_type: system
    category: identifier
    tags: [文字種, 長さ, 共通制約]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 使用可能な文字と長さ
    summary: ユーザコードとユーザ名に使用できる文字と長さは、システム共通の制約とする。
    content: |
      テナントごとに文字や長さの制約を自由に設定する方式は採用しない。
    decision_reason: |
      テナントごとの自由な設定にすると、DB設計を過度に汎用化する必要があるため。

  - id: RITM-0122
    rule_type: system
    category: identifier
    tags: [ユーザコード, 入力制約]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ユーザコードの入力制約
    summary: ユーザコードは3桁以上16桁以下の半角英数字とする。
    content: |
      空白や日本語、記号は使用できない。

  - id: RITM-0123
    rule_type: system
    category: identifier
    tags: [ユーザ名, 入力制約]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ユーザ名の入力制約
    summary: ユーザ名を設定する場合は3文字以上32文字以下とし、半角英数字と指定した4種類の記号を許可する。
    content: |
      使用可能な記号は、ピリオド（.）、アンダースコア（_）、ハイフン（-）、プラス（+）とする。
      アットマーク（@）、空白、日本語は使用できない。

  - id: RITM-0124
    rule_type: business
    category: authorization
    tags: [本人設定, ログインID, 変更権限]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 本人による変更
    summary: メールアドレス・ユーザコード・ユーザ名のそれぞれについて、本人による変更可否をテナントごとに設定できるようにする。
    content: |
      変更可能と設定された項目は、ユーザ本人が変更できる。
      ログインIDに使う項目も変更可能とし、本人が変更できるかどうかはその項目のテナント設定に従う。

  - id: RITM-0125
    rule_type: business
    category: authorization
    tags: [管理者, ログインID, 変更権限]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 管理者による変更
    summary: メールアドレス・ユーザコード・ユーザ名のそれぞれについて、変更できるロールを設定できるようにする。
    content: |
      管理者による変更も、テナントの設定に従って制御する。
      変更する項目について許可されたロールを持つことに加え、対象ユーザの情報を変更できる管理範囲内で操作する。

  - id: RITM-0126
    rule_type: system
    category: user_management
    tags: [メールアドレス, 変更確認, テナント設定]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: メールアドレス変更時の確認
    summary: 新しいメールアドレスへの確認を必要とするかどうかを、テナント設定で選択できるようにする。
    content: |
      テナント設定の初期値は、確認メールによる確認を必要とする設定とする。
      確認を必要とする場合は、新しいメールアドレスへ確認メールを送り、確認完了後に変更を確定する。
      確認を必要としない場合は、確認メールによる確認を待たずに変更を確定する。
      本人による変更と管理者による変更のいずれも、この方針に従う。

  - id: RITM-0127
    rule_type: system
    category: session
    tags: [ログインID, 再ログイン, 猶予期間]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ログインID変更後の再ログイン
    summary: ログインID変更後のログイン状態は、権限等の変更時と同じ扱いとする。
    content: |
      再ログイン要求、猶予設定、変更適用時からの猶予の起算、猶予中の操作・通知は、RULE-0008「認可方式」の再ログインに関する規定に従う。
