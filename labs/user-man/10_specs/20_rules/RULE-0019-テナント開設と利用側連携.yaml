sections:
  - id: RITM-0198
    rule_type: business
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: テナント開設の提供経路
    summary: テナント開設は、利用側システムが担う経路と、システム管理者が本機能を運用操作する経路の両方を提供する。
    content: |
      利用側システム向けのAPI・サービスクラス呼び出しによる開設と、本機能が提供する開設機能をシステム管理者が操作する開設に対応する。
      ユーザ管理・権限管理・組織管理など、本機能が管理対象とする機能向けのテナント作成を行う。

  - id: RITM-0199
    rule_type: business
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: 利用側システムを主体とする開設
    summary: 利用側システム向けにテナント開設のAPIを提供し、その呼び出しを組み込む運用は利用側システムに委ねる。
    content: |
      提供するAPIには、通常のサービスクラスを呼び出す形態も含める。
      利用側システムは、提供された開設処理を自システムの運用に組み込んで利用する。
      本機能の開設処理を呼び出す前後の、利用側システムの業務・運用は利用側が担う。

  - id: RITM-0200
    rule_type: architecture
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: 本機能を主体とする開設と利用側の拡張
    summary: システム管理者が本機能でテナントを開設する際、Spring Bootで注入された利用側のコンポーネントを介して、利用側の登録処理を呼び出せるようにする。
    content: |
      本機能そのものが、システム管理者の運用操作に用いるテナント開設機能を提供する。
      ユーザ管理・権限管理・組織管理などに必要なテナント作成を行うとともに、利用側システムの処理を呼び出すための拡張を可能にする。
      利用側システムは、Spring Bootの機能を用いて、本機能から呼び出すコンポーネントを注入する。
      本機能は、そのコンポーネントを介して、利用側システムが持つテナントに対する各種情報の登録処理などを呼び出せるようにする。

  - id: RITM-0201
    rule_type: ui_design
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: テナント開設画面の拡張範囲
    summary: 利用側コンポーネントによる処理の拡張に伴って、テナント開設画面に利用側固有の情報表示や選択項目を追加する機能は提供しなくてよい。
    content: |
      本機能が提供するテナント開設画面で、利用側システム固有の情報を表示して選択させるなどの画面拡張は対象としない。
      利用側コンポーネントによる登録処理の呼び出しと、開設画面の拡張を区別する。

  - id: RITM-0218
    rule_type: business
    category: tenant
    tags: [テナント開設の初期構築]
    status: confirmed
    created_on: 2026-10-11
    updated_on: 2026-10-11
    revision: 1
    title: テナント開設の初期構築
    summary: 開設処理が初期の機能・権限定義、最初の組織、そこへ本務所属する最初のテナント管理者と管理権限を用意する。
    content: |
      利用側API・サービス呼出しと、システム管理者の画面操作の両経路に適用する。
      既存のテナント内ロールで通常の登録操作を行うことを前提にせず、開設権限に基づく初期構築として実施する。
      最初の管理者にも本務所属を必須とし、システム管理者のための組織は作らない。
      開設完了時に最初の管理者を「初期設定中」として案内し、本人が必要な認証設定を完了してから利用を始める。
      通常の事前登録からの利用開始とは案内の契機を区別し、URL発行・期限起算・送信・再試行には既存の初期設定案内の条件を適用する。

  - id: RITM-0219
    rule_type: system
    category: authorization
    tags: [テナント開設の呼出主体と権限]
    status: confirmed
    created_on: 2026-10-11
    updated_on: 2026-10-11
    revision: 1
    title: テナント開設の呼出主体と権限
    summary: 利用側経路の認証・開設権限確認は利用側が担い、システム管理者の画面操作では本機能が認証・権限を確認する。
    content: |
      APIとサービスクラス呼出しのどちらも、利用側が呼出主体を認証し、開設権限を確認した処理だけが本機能を呼び出す。
      この責務分担は、認証・権限確認なしの外部公開を許可するものではない。
      本機能の開設画面では、テナント外のシステム管理者として認証し、開設権限を確認する。

  - id: RITM-0220
    rule_type: system
    category: tenant
    tags: [開設時の初期データの成立単位]
    status: confirmed
    created_on: 2026-10-11
    updated_on: 2026-10-11
    revision: 1
    title: 開設時の初期データの成立単位
    summary: 本機能の初期データ作成が途中で失敗した場合、初期構築全体を成立させない。
    content: |
      機能・権限定義、組織、最初のテナント管理者と管理権限を、部分的な初期構築結果として成立させない。
      失敗した初期構築では通常利用や最初の管理者への案内を開始しない。
      利用側コンポーネントの処理に失敗した場合は、別に定める開設未完了と再試行の条件を適用する。

  - id: RITM-0221
    rule_type: system
    category: tenant
    tags: [利用側処理の失敗と開設の再試行]
    status: confirmed
    created_on: 2026-10-11
    updated_on: 2026-10-11
    revision: 1
    title: 利用側処理の失敗と開設の再試行
    summary: 利用側コンポーネントが失敗した場合は開設未完了とし、同じ開設対象への再試行で完了させる。
    content: |
      利用側コンポーネントによる登録が必要な場合、その成功まで通常利用と初期設定案内を開始しない。
      再試行で別のテナントを作らず、同じ開設対象の処理を完了させる。
      利用側の登録処理は重複実行に対応する。
      本機能の初期構築の成立と、利用側の登録を含む開設完了を区別する。
