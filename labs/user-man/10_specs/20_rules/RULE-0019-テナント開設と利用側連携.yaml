sections:
  - id: RITM-0198
    rule_type: business
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: テナント開設の提供経路
    summary: テナント開設は、利用側システムが担う経路と、システム管理者が本機能を運用操作する経路の両方を提供する。
    content: |
      利用側システム向けのAPI・サービスクラス呼び出しによる開設と、本機能が提供する開設機能をシステム管理者が操作する開設に対応する。
      ユーザ管理・権限管理・組織管理など、本機能が管理対象とする機能向けのテナント作成を行う。

  - id: RITM-0199
    rule_type: business
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: 利用側システムを主体とする開設
    summary: 利用側システム向けにテナント開設のAPIを提供し、その呼び出しを組み込む運用は利用側システムに委ねる。
    content: |
      提供するAPIには、通常のサービスクラスを呼び出す形態も含める。
      利用側システムは、提供された開設処理を自システムの運用に組み込んで利用する。
      本機能の開設処理を呼び出す前後の、利用側システムの業務・運用は利用側が担う。

  - id: RITM-0200
    rule_type: architecture
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: 本機能を主体とする開設と利用側の拡張
    summary: システム管理者が本機能でテナントを開設する際、Spring Bootで注入された利用側のコンポーネントを介して、利用側の登録処理を呼び出せるようにする。
    content: |
      本機能そのものが、システム管理者の運用操作に用いるテナント開設機能を提供する。
      ユーザ管理・権限管理・組織管理などに必要なテナント作成を行うとともに、利用側システムの処理を呼び出すための拡張を可能にする。
      利用側システムは、Spring Bootの機能を用いて、本機能から呼び出すコンポーネントを注入する。
      本機能は、そのコンポーネントを介して、利用側システムが持つテナントに対する各種情報の登録処理などを呼び出せるようにする。

  - id: RITM-0201
    rule_type: ui_design
    category: tenant
    tags: [テナント開設, 利用側連携]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: テナント開設画面の拡張範囲
    summary: 利用側コンポーネントによる処理の拡張に伴って、テナント開設画面に利用側固有の情報表示や選択項目を追加する機能は提供しなくてよい。
    content: |
      本機能が提供するテナント開設画面で、利用側システム固有の情報を表示して選択させるなどの画面拡張は対象としない。
      利用側コンポーネントによる登録処理の呼び出しと、開設画面の拡張を区別する。
