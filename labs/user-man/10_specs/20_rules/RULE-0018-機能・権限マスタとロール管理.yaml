  - RULE-0006
  - RULE-0008

sections:
  - id: RITM-0189
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, ロール]
    status: confirmed
    created_on: 2026-10-08
    updated_on: 2026-10-08
    revision: 1
    title: 汎用的な権限管理の対象
    summary: ユーザ管理と利用側の他機能を、権限管理の対象となる機能として同じ枠組みで扱う。
    content: |
      権限管理は、ユーザ管理以外にも、決裁サービスの決裁機能などの権限を管理できるようにする。
      ユーザ管理は、権限管理から見たロール管理対象の機能の一つとする。
      各機能の独立性を考慮し、テナント・機能ごとにロールを追加・管理できるようにする。

  - id: RITM-0190
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, ロール]
    status: confirmed
    created_on: 2026-10-08
    updated_on: 2026-10-08
    revision: 1
    title: 機能と権限マスタ
    summary: 機能と、その機能に紐づく権限の一覧を管理し、それぞれID・表示名・説明を持つ。
    content: |
      機能には機能ID・表示名・説明を持たせる。
      権限には権限識別ID・表示名・説明を持たせ、対象となる機能に紐づけて権限マスタで管理する。
      権限管理機能において、機能の登録・管理と、機能に紐づく権限の追加・削除を行えるようにする。

  - id: RITM-0191
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, ロール]
    status: confirmed
    created_on: 2026-10-08
    updated_on: 2026-10-08
    revision: 1
    title: 機能と権限の定義主体
    summary: 開発者が用意する機能・権限の定義に加え、テナント側でも定義を追加・管理できるようにする。
    content: |
      本システムと利用側システムの開発者が、機能と権限の定義を用意できるようにする。
      テナント側でも、自ら保有するシステムとの連携のために、機能と権限の定義を追加・管理できるようにする。
      テナント側の追加・管理は、権限管理機能を利用して行う。

  - id: RITM-0192
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, ロール]
    status: confirmed
    created_on: 2026-10-08
    updated_on: 2026-10-08
    revision: 1
    title: 機能別ロールの定義
    summary: テナントは、機能ごとに既存ロールの権限設定を変更でき、独自のロールも作成できる。
    content: |
      対象機能の権限マスタに登録された権限一覧を用いて、ロールに付与する権限と、その権限の値を設定する。
      機能ごとに独立してロールを追加・管理する。
      ロールの定義と、ユーザへのロール付与を区別する。ユーザへの付与単位と付与数は、RULE-0008の「ロールの付与数」に従う。

  - id: RITM-0193
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, ロール]
    status: confirmed
    created_on: 2026-10-08
    updated_on: 2026-10-08
    revision: 1
    title: ユーザ管理の初期ロール
    summary: ユーザ管理に標準で備える管理者・担当者のロールは、初期設定されたロールとして扱う。
    content: |
      テナントユーザ管理者・担当者、グループユーザ管理者・担当者、組織ユーザ管理者・担当者を、ユーザ管理機能の初期ロールとして備える。
      初期ロールの一覧によって、テナントが作成できるロールの種類を固定しない。
      初期ロールの管理範囲と操作権限は、RULE-0004・RULE-0005等の該当ルールに従う。
      テナントユーザ管理者のロールの識別名は、tenant-user-adminとする。

  - id: RITM-0194
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, ロール]
    status: confirmed
    created_on: 2026-10-08
    updated_on: 2026-10-08
    revision: 1
    title: 機能内のロール管理の委譲
    summary: システム管理者やテナント管理者が機能の管理者ロールを作成し、その機能の権限設定を委譲できるようにする。
    content: |
      システム管理者やテナント管理者が、対象機能の管理者ロールを作成し、その機能の権限設定を行う権限を与える。
      そのロールを付与された機能の管理者は、委譲された範囲で当該機能のロール等を作成・管理する。
      テナントユーザ管理者がユーザ管理の権限設定を行うことも、この機能単位の管理に位置付ける。
      例えば、テナント管理者が決裁機能のテナント決裁管理者ロールを作成して権限設定を委譲し、テナント決裁管理者が決裁機能のロール等を管理する。

  - id: RITM-0195
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, ロール]
    status: confirmed
    created_on: 2026-10-08
    updated_on: 2026-10-08
    revision: 1
    title: 利用側の機能による権限の参照と制御
    summary: 利用側の機能は、ユーザの機能別ロールと権限識別ID・権限値を取得し、実際の機能の利用を制御する。
    content: |
      利用側の機能は、対象ユーザについて当該機能IDに関するロールを取得する。
      取得したロールに設定された権限識別IDと権限の値を参照し、利用側の機能で制御する。
      ユーザ管理機能も、この権限管理を利用して自機能の操作を制御する。

  - id: RITM-0196
    rule_type: business
    category: authorization
    tags: [機能, 権限マスタ, テナント分離]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: 機能・権限マスタのテナント別管理
    summary: 開発者が用意した機能・権限の定義を各テナントへ初期登録し、以後はテナントごとに独立して管理する。
    content: |
      各テナントは、初期登録された機能・権限マスタと、自テナントで追加した定義を管理する。
      共通定義への参照によって、開発者の定義変更を各テナントへ自動的に波及させる方式とはしない。
      テナント内での定義変更は、他テナントの定義に影響させない。

  - id: RITM-0197
    rule_type: business
    category: authorization
    tags: [ロール, 名称, 管理権限, 付与権限]
    status: confirmed
    created_on: 2026-10-09
    updated_on: 2026-10-09
    revision: 1
    title: ロールの名称と操作権限の分離
    summary: 操作の可否はロールに設定された権限で決まり、ロールの名称や管理者・担当者という区分では判定しない。
    content: |
      「○○管理者」等のロール名は、人間が運用上の役割を認識するための名称とする。
      管理・付与の操作も、操作者のロールに設定された当該操作の権限で判定する。
      「○○管理者」という名前であっても、権限設定によっては何も操作できないロールを作成できる。
      管理者・担当者という区分を、権限設定とは別の認可条件として設けない。
      ルール中の管理者・担当者の説明は、初期ロールの権限設定や運用上の役割を表すものであり、名称の一致による権限付与を意味しない。
      管理対象範囲、利用権限と付与権限の区別、操作ごとの条件は引き続き適用する。
