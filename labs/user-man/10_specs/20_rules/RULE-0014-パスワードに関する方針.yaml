id: RULE-0014

derived_from:
  - RULE-0007
  - RULE-0013

sections:
  - title: パスワードの長さ
    summary: パスワードは8文字以上32文字以下とする。
    content: |
      長さの制約はシステム共通とする。

  - title: 文字種の組み合わせ
    summary: 大文字・小文字・記号・数字の4種類のうち、初期設定では3種類以上の使用を必要とする。
    content: |
      必要とする文字種の最低数は、テナントごとに1〜4種類の範囲で設定できるようにする。

  - title: 使用可能な文字
    summary: 半角英数字と、指定する半角記号32種類を使用可能な文字の範囲とする。
    content: |
      記号の候補全体は、以下の32種類とする。列挙の区切りに使う空白は含まない。
      ! " # $ % & ' ( ) * + , - . /
      : ; < = > ? @ [ \ ] ^ _ ` { | } ~
      空白、日本語、全角文字は使用できない。

  - title: 使用可能な記号の設定
    summary: パスワードに使用できる記号を、テナントごとに設定できるようにする。
    content: |
      初期設定では、「使用可能な文字」に列挙した32種類の記号をすべて許可する。
      テナント側で、この候補全体から使用できる記号を絞り込めるようにする。
    decision_reason: |
      テナント利用団体等の既存システムで使用できる記号に合わせられるようにする。

  - title: 初回のパスワード設定
    summary: 登録メールアドレスへ設定用URLを送り、ユーザ本人がパスワードを設定する。
    content: |
      ユーザ本人が、受信したURLから初回のパスワード設定を行う。

  - title: パスワードを忘れた場合の再設定
    summary: 登録メールアドレスへ再設定用URLを送る方式とする。
    content: |
      ユーザ本人が、受信したURLからパスワードを再設定する。
      管理者からも、対象ユーザへ再設定の案内を送れるようにする。

  - title: 設定用URLの有効期限
    summary: 初回設定用URLの有効期間の初期値は7日間、再設定用URLは1時間とする。
    content: |
      初回設定用と再設定用の有効期間は、それぞれテナントごとに設定できるようにする。

  - title: 設定用URLの使用と再発行
    summary: 設定完了時にURLを使用済みとして無効化し、再発行時は以前のURLも無効化する。
    content: |
      初回設定用URLと再設定用URLのいずれも、この扱いとする。
      設定完了に使用したURLを再び利用することはできない。

  - title: 定期的な変更と再利用
    summary: パスワードの定期的な変更を求めず、過去に使用したパスワードの再利用制限も設けない。
    content: |
      定期変更を求めるための有効期限は設けない。
      過去の使用を理由にパスワードの設定を禁止する制約は設けない。

  - title: テナントのパスワード条件変更後の対応
    summary: 許可記号や必要な文字種数などをテナントが変更した場合、利用者にパスワード変更を求める。
    content: |
      条件変更後の初回ログイン時に、自動的にパスワード変更フローへ進める。
      新しい条件に従ってパスワードを設定する。
      条件変更時点でログイン中のユーザはそのまま利用を継続でき、次にログインする際に変更を求める。

  - title: 変更前のパスワード条件の保持
    summary: 現行の条件に加えて直前1回分の文字種等の設定だけを保持し、それより古い条件のパスワードには再設定を促す。
    content: |
      直前の条件で設定されたパスワードによる認証を可能にし、ログイン時に現行の条件への変更フローへ進める。
      条件がAからB、さらにCへ変更された場合は、現行のCと直前のBだけを保持する。
      このとき、Aで設定されたパスワードを使用しているユーザには、登録メールアドレスへの再設定用URLによるパスワード再設定を促す。
    decision_reason: |
      条件変更後の初回ログインからパスワード変更フローへ進めるため、変更前の条件で設定されたパスワードによる認証が必要となる。
      保持する過去の条件が際限なく増えることを避けるため、直前1回分に限定する。

  - title: パスワード条件変更の周知
    summary: テナント管理者がトップページのお知らせ枠へアナウンスを追加するか、システム外の手段で周知する。
    content: |
      お知らせ枠の機能は、RULE-0015「ユーザ通知方法の方針」に従う。
      別の方法による周知も運用で選択できるが、その手段は本システムのサポート対象外とする。
