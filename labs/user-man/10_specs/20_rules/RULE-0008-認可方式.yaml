  - RULE-0005
  - RULE-0007

sections:
  - id: RITM-0056
    rule_type: business
    category: authorization
    tags: [ロール, 付与数]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-09
    revision: 3
    title: ロールの付与数
    summary: ユーザに付与する機能別ロールは、同じ付与単位・同じ機能につき1つだけとする。
    content: |
      同じ組織・同じ機能について、複数ロールを組み合わせてユーザに付与することは認めない。
      グループを対象に付与する場合も、同じユーザ・同じグループ・同じ機能につき1ロールに限定する。
      テナント全体を対象とする場合は、所属組織とは独立して、同じユーザ・同じテナント・同じ機能につき1ロールを付与する。
      テナントユーザ管理者（tenant-user-admin）とテナントユーザ管理担当者（user-staff）にも、このテナント単位の付与規則を適用する。
      テナント管理者（tenant-admin）は、テナント内の全機能に及ぶ管理権限として、機能別ロールとは別に扱う。
      本項目の付与数・付与単位の規則と、実行範囲の基準は区別する。実行範囲にはRULE-0003の「全機能のロールに共通する実行範囲の基準」を適用する。
    decision_reason: |
      細分化したロールを複数付与すると、権限単位で個別に管理することと変わらなくなる。
      権限をグルーピングしたうえで複数ロールの組み合わせを管理しなければならない状態は、権限を複雑にしすぎている可能性が高いため、1ロールに限定してシンプルにする。

  - id: RITM-0057
    rule_type: system
    category: authorization
    tags: [ロール, 管理範囲, 許可の合成]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 管理範囲が重なる場合の判定
    summary: 管理範囲の重複は原則としてワーニングとし、同じ操作・対象についていずれかのロールで許可されていれば実行可能とする。
    content: |
      管理範囲が重なった場合に、すべてのロールで許可されることを実行条件にはしない。
    decision_reason: |
      ロールは、基本的に禁止ではなく許可を与えるためのものである。
      重複するすべてのロールの許可を要求するなど、権限を狭める判定にすると、何もできなくなる可能性がある。

  - id: RITM-0058
    rule_type: operation
    category: authorization
    tags: [管理範囲, 警告, 棚卸]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 管理範囲の重複に対する警告
    summary: 設定の保存時に警告を表示し、定期的な棚卸チェックの結果も警告一覧画面で確認できるようにする。
    content: |
      ロール付与やグループ設定などを保存する際に、管理範囲の重複に対する警告を表示する。
      定期的に棚卸チェックを行い、警告一覧画面からも確認できるようにする。
      定期棚卸の実行周期などは、システム共通で設定する。
      棚卸はバッチ処理として扱い、各テナントの実際の処理は、そのテナントの順番が来てから開始する。

  - id: RITM-0059
    rule_type: system
    category: authorization
    tags: [権限変更, 再ログイン, 猶予期間]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 権限等の変更の反映
    summary: 権限等の変更は対象ユーザの再ログインによって反映し、再ログインを要求するまでの猶予はテナント設定に従う。
    content: |
      権限等の変更があった対象ユーザに再ログインを求める。
      猶予を設けない場合は、変更後の次回アクセス時に再ログインフローへ進める。
      個別ユーザへのロール付与・変更だけでなく、ロール内の権限定義、グループの対象組織、組織ツリーなどの変更によって権限範囲が変わるユーザも対象とする。
      多量の設定変更は予約機能で事前に組み込み、バッチ適用を主な運用とする想定である。
    decision_reason: |
      再ログイン時に変更を反映する形とすることで、実装を含めて扱いを比較的簡単にする。
      予約した変更をまとめて適用する運用により、利用者への影響を抑える。

  - id: RITM-0060
    rule_type: system
    category: session
    tags: [再ログイン, 猶予期間, テナント設定]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 再ログインまでの猶予設定
    summary: 権限等の変更後に再ログインまでの猶予を設けられるものとし、猶予期間の初期値は30分とする。
    content: |
      猶予を設けるかどうか、猶予期間、猶予中に警告を表示するかどうかを、それぞれテナントごとに設定できる。
    decision_reason: |
      利用者への影響を抑え、操作の途中で再ログインを求められる場合にも猶予を持てるようにする。
      無操作時のセッションタイムアウトと猶予期間の初期値をそろえることで、利便性を損ないにくくすることを意図する。

  - id: RITM-0061
    rule_type: system
    category: session
    tags: [再ログイン, 猶予期間, 変更適用]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 猶予期間の起点と終了後のアクセス
    summary: 猶予期間は変更を適用した時点から数え、期間を過ぎた後のアクセスでは再ログインを求める。
    content: |
      変更後の初回アクセス時から数えるものではない。
      変更後に操作がなく、猶予期間を過ぎてから初めてアクセスした場合も、そのアクセスで再ログインフローへ進める。
      ログイン画面には、権限等の変更によって再ログインが必要となった旨の原因メッセージを表示する。

  - id: RITM-0062
    rule_type: system
    category: authorization
    tags: [権限変更, 猶予期間, 警告]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 猶予中の操作と通知
    summary: 猶予中の操作は保証せず、警告表示が有効な場合はその旨を画面上部で知らせ、再ログインを促す。
    content: |
      猶予中に操作できるかどうかは、変更された権限の内容と、その操作への影響に依存する。
      権限変更が操作に影響を与えない場合は、そのまま操作を継続できる可能性がある。
      変更前の権限で引き続き操作できることや、操作が成功することを保証するものではない。
      警告表示を有効にしている場合、猶予中の操作画面の上部に警告を表示し続ける。
      通知では、権限が変更されているため操作が保証されず、エラーが発生する可能性があることを伝え、再ログインを促す。
