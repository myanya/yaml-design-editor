id: RULE-0010

derived_from:
  - RULE-0002
  - RULE-0005
  - RULE-0008

sections:
  - title: 予約対象の業務
    summary: ユーザ管理に関する業務の変更を予約できるようにする。
    content: |
      ユーザの登録・変更・削除、組織異動、組織・グループの変更、ロール・権限の変更を対象とする。
      テナント設定のうち、テナントの利用開始時に設定し、その後は変更しないものには予約機能を設けない。

  - title: 予約をまとめる単位
    summary: 予約便を作成し、その便に予約内容を追加する。
    content: |
      予約便を、複数の予約内容をまとめる単位とする。
      複数の管理者が、同じ便にそれぞれの管理範囲の変更を追加できるようにする。

  - title: 予約便の作成単位と運用
    summary: 予約便は1テナント・1適用日につき1便のみとする。
    content: |
      通常の人事異動では、日程に合わせて人事部主体で便を作成する運用を想定する。
      急な異動で件数が少ない場合は、オンラインの即時変更で対応できるようにする。
      予約で対応する場合は、便作成を調整したうえで随時の予約便を作成する。
      随時の便も、同じテナント・適用日について複数作成しない。
    decision_reason: |
      通常の人事異動は日付が決まっているため、適用日ごとに変更をまとめる。

  - title: 競合する予約の登録
    summary: 予約内容が競合する場合は先に登録された予約を優先し、後からの競合する登録は受け付けない。
    content: |
      変更する項目・操作が衝突する場合だけを競合として扱う。
      同じユーザを対象とする予約であっても、変更する項目・操作が衝突しなければ、そのことだけを理由に競合とはしない。
      後から登録する側が先行する予約内容を確認し、現場で連絡・調整を行う。
      必要に応じて予約変更等で競合を解消したうえで再登録する運用とする。

  - title: 業務日と深夜帯の表記
    summary: 夜間処理は業務日に続く深夜帯として扱い、暦日をまたぐ時刻は25時などの表記と実際の暦日時を対応付ける。
    content: |
      例えば、3月31日業務の25〜28時は、暦日時では4月1日の1〜4時に相当する。
      「3月31日のバッチ反映」は、この3月31日業務に続く深夜帯の処理を指す。
      締め切りや実行時期は「当日」「前日」だけで示さず、何の業務日かと暦日時の対応が分かるように記述する。

  - title: 適用日と夜間処理
    summary: 予約便には新しい組織・人事で業務を開始する適用日を指定し、その早朝までに反映する。
    content: |
      適用日の2暦日前に組織・グループ側の予約登録を締め切り、その業務日に続く深夜帯にシミュレーションを行う。
      適用日の1暦日前の日中に、全体管理者が結果を確認し、現場と調整して補正する。
      その業務日に続く深夜帯に組織改編や人事異動を実行し、適用日の早朝に反映する。
      シミュレーションと本適用は、それぞれ該当業務日の25〜28時頃を処理時間帯として想定する。
      これらの時刻は運用のイメージとして扱う。

  - title: 4月1日適用の運用例
    summary: 3月30日に予約登録を締め切り、3月31日の日中を補正に使い、4月1日早朝に反映する。
    content: |
      3月30日：組織・グループの管理者・担当者が、設定された締め切り時刻まで予約を登録する。
      3月30日業務の25〜28時頃（暦日時では3月31日1〜4時頃）：シミュレーションを行う。
      3月31日の日中：全体管理者が結果を確認し、各現場と調整して、全体管理者向けの締め切りまで補正する。
      3月31日業務の25〜28時頃（暦日時では4月1日1〜4時頃）：組織改編や人事異動を実行する。
      4月1日の早朝：反映を完了し、新しい組織・人事で業務を開始できる状態とする。

  - title: 予約登録時の権限確認
    summary: 予約内容の登録時に、登録者の権限を確認する。
    content: |
      予約であっても、登録する変更に必要な権限を登録時に確認する。

  - title: 登録者と実行権限に用いるユーザ
    summary: 予約内容の登録者と、実行時の権限判定に用いるユーザを区別して指定できるようにする。
    content: |
      予約内容の登録時に、登録者と、誰の実行権限で動かすかを指定できるようにする。
      実行権限に用いるユーザは、便全体ではなく、便に追加した予約内容ごとに指定する。
      予約の実行時に用いる権限の基準時点は「便の開始時点の権限」に従う。
    decision_reason: |
      複数の管理者が同じ便にそれぞれの管理範囲の変更を登録する運用に対応する。

  - title: 便の開始時点の権限
    summary: 各予約で指定されたユーザが便の開始時点で持つ権限を、同じ便の処理中の判定に用いる。
    content: |
      登録時点の権限を実行まで保持するのではなく、便の開始時点の権限を基準とする。
      便の開始までに異動等で必要な権限を失っている場合、そのユーザの権限で実行する予約はエラーとなる。
      同じ便の処理中に権限が変わっても、その便内の予約の権限判定は影響を受けない。

  - title: 他ユーザの実行権限を指定する条件
    summary: 指定先だけでなく、指定・変更する側にも予約内容を実行できる権限を求める。
    content: |
      他ユーザを実行権限に用いるユーザとして指定・変更するときは、操作する側にもその予約内容の実行に必要な権限を求める。
      指定されたユーザ本人による承認は不要とする。

  - title: 実行権限に用いるユーザの変更
    summary: 予約の実行権限に用いるユーザを、新しい管理者等へ変更できるようにする。
    content: |
      予約登録後の異動等に対応するため、誰の権限で実行するかを変更する運用を可能にする。
      変更先には、その変更時点で予約内容の実行に必要な権限を持つユーザだけを指定できる。
    decision_reason: |
      管理者の交代後も予約を引き継げるようにする。
      変更先の指定時には必要な権限を確認し、退職者による悪用を防ぐ。

  - title: 一部の予約が失敗した場合
    summary: 失敗した予約だけをエラーとし、同じ便の他の予約は処理を続行する。
    content: |
      権限不足などで一部の予約が失敗しても、その失敗を理由に便全体の適用を中止しない。

  - title: 失敗した予約への対応
    summary: 管理者が失敗原因を解消し、即時変更または再予約で必要な変更を反映する。
    content: |
      予約による変更に加え、オンラインでの即時変更も可能とする。
      失敗分を即時変更で対応するか、再予約で対応するかは運用で判断する。

  - title: 操作種別ごとの実行順序
    summary: 操作の種類に応じて設計で定めた順序に従い、システムが予約を実行する。
    content: |
      個々の予約の依存関係から実行順序を動的に自動調整する方式は採用しない。
      ユーザの異動を行ってから組織を削除するなど、操作種別間の順序を設計上の決まりとする。
      組織の削除は最後に実施する。

  - title: 予約で指定できる組織
    summary: 予約の登録時点で存在する組織だけを指定できる。
    content: |
      新しい組織への異動を予約する場合は、先に組織新設を完了し、その後に異動予約を登録する。
      同じ便に組織新設を予約していても、その組織がまだ存在しなければ異動先として指定できない。
      組織新設から異動までを、必ず単一日の予約処理だけで対応できるものとはしない。
    decision_reason: |
      予約登録時点で存在する組織だけを指定する方針に伴う、事前の組織新設の制約を受け入れる。

  - title: 二段階の締め切り
    summary: 組織・グループの管理者・担当者向けの締め切りと、テナント全体の管理者向けの補正期限を分ける。
    content: |
      組織・グループの管理者・担当者は、適用日の2暦日前に設ける締め切り時刻まで予約内容を追加・修正・取消できる。
      この締め切りを過ぎた場合は、翌日に対処するなどの運用で対応する。
      登録締め切りの業務日に続く深夜帯にシミュレーションを実施し、結果に基づく補正はテナント全体の管理者が行う。
      テナント管理者やテナントユーザ管理者は、適用日の1暦日前に別途設定する全体管理者向けの締め切り時刻まで予約内容を修正できるようにする。
    decision_reason: |
      夜間のシミュレーション後、本適用までの間に、全体管理者が日中に現場と調整して補正する時間を確保する。

  - title: 締め切り時刻の設定
    summary: 組織・グループ側の登録締め切りと、全体管理者の締め切りを、テナントごとに別々に設定できるようにする。
    content: |
      組織・グループの管理者・担当者向けの登録締め切りは、適用日の2暦日前の19時を初期値とする。
      全体管理者の締め切りも、登録締め切りとは別のテナント別設定とする。
      いずれの締め切りも、設定可能な時刻の最小値は10時、最大値は23時とする。
      設定可能な範囲はシステム共通とする。

  - title: 事前シミュレーション
    summary: 適用前に予約内容の整合性や実行権限をまとめて検査できるようにする。
    content: |
      検査は、予約による様々な変更をシミュレーションするものとする。
      実行できるのは、テナント全体を管理する権限を持つユーザに限る。
      全体管理者による補正後のシミュレーションの再実行は任意とする。
      最終的な実行可否は実行時の検査で判定し、権限の基準時点は「便の開始時点の権限」に従う。
    decision_reason: |
      個別の管理範囲に閉じない様々な変更を扱うため、全体を管理できる権限を必要とする。

  - title: テナントごとのシミュレーション実行
    summary: シミュレーションはテナントごとに順次実行し、複数テナントを並列実行できる機構も設ける。
    content: |
      並列実行の利用や並列度などの調整は、テナントの登録状況に応じてシステム運用者が行う。
      テナント間で並列に実行する場合も、テナント分離の原則に従う。
    decision_reason: |
      テナントの登録状況によって適切な実行方法が変わるため、システム運用者によるチューニングを可能にする。

  - title: シミュレーション結果と実行結果の閲覧
    summary: 全体管理者は自テナントの全件、組織・グループの管理者・担当者は自身の管理範囲内の結果を画面で確認できる。
    content: |
      シミュレーション結果と本番の予約実行結果の両方を対象とする。
      シミュレーションを実行できる権限と、結果を閲覧できる権限を分ける。
      組織・グループの管理者・担当者は、シミュレーションの実行権限がなくても、自身の管理範囲内の結果を閲覧できる。
