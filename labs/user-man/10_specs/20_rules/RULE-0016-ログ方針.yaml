id: RULE-0016

derived_from:
  - RULE-0002
  - RULE-0007
  - RULE-0009

sections:
  - title: ログインログの記録対象
    summary: パスワード認証・多要素認証の成否、試行制限による拒否、通常のログアウトと強制ログアウトを記録する。
    content: |
      パスワード認証と多要素認証は、それぞれの成否を記録する。
      試行制限による拒否も、ログの記録対象とする。

  - title: ログインログの記録項目
    summary: 日時・テナント・ユーザ内部ID・認証方式・成否・失敗理由・取得できた接続元IPを記録する。
    content: |
      存在しないログインIDへの試行は、入力されたログインIDを記録する。

  - title: ログインログのDB保持
    summary: 直近1か月分のログインログをDBに保持する。
    content: |
      ログイン履歴の画面表示は、DBから情報を抽出して行う。
    decision_reason: |
      ログインログの検索を必要とするため。

  - title: ログイン履歴の保管と本人による閲覧
    summary: ログイン履歴は直近1か月分を保管し、本人が過去1か月分の自身の履歴を確認できるようにする。
    content: |
      この期間を過ぎた履歴は、ファイルとして長期保管する。
    decision_reason: |
      全履歴のデータ量が多くなることを考慮し、直近の履歴と長期保管を分ける。

  - title: ログインログの長期保管期間
    summary: ファイル保管分を含めたログインログの保管期間は7年間とする。
    content: |
      この保管期間はシステム共通とする。

  - title: 管理者によるログインログの閲覧
    summary: テナント管理者・監査権限を持つユーザは自テナント全体、組織・グループのユーザ管理者は自身の管理範囲内を確認できる。
    content: |
      存在しないログインIDへの試行記録は、テナント全体を確認できる権限で扱う。

  - title: 最終ログイン日時
    summary: 最後にログインした日時を画面に表示できるようにする。
    content: |
      最終ログイン日時を、ログイン履歴とは別に管理する方式を検討する。

  - title: 業務履歴の検索と保管
    summary: 業務履歴のオンライン検索期間は1年、その1年を含めた合計保管期間は7年とする。
    content: |
      これらの期間はシステム共通の固定値とする。
      オンライン検索の期間を超える履歴は、ダウンロードで対応する。

  - title: 業務履歴の利用権限
    summary: 業務履歴の利用権限は、監査ログと同じ扱いとする。
    content: |
      RULE-0009「監査ログと保管期間」の利用権限、管理者ごとの参照可能期間、閲覧範囲の判定時点に従う。

  - title: 長期保管ファイルの単位と取得
    summary: ログインログと業務履歴は、それぞれテナントごと・月ごとに1ファイルとして長期保管する。
    content: |
      テナントごとにファイルを分離し、画面から年月を指定して取得できるようにする。
      取得時の年月指定とCSV・ZIPの選択条件は、RULE-0009「監査ログと保管期間」の「1年を超えたログの取得」に定める方式に従う。
      ファイルでの長期保管へ移る期間は、本ルールのログインログ・業務履歴それぞれの規定に従う。

  - title: システム運行ログの管理
    summary: エラーやバッチ処理等の運行ログは、導入先のログ収集・監視基盤で扱う。
    content: |
      保存先・保管期間・ログレベルは、システム運用者が設定する。

  - title: テナント管理者による運行ログの確認
    summary: テナント処理に関わるエラーや正常終了等の運行ログは、そのテナントの管理者も確認できるようにする。
    content: |
      テナント管理者が確認できるのは、自テナントの処理に関わる運行ログとする。
