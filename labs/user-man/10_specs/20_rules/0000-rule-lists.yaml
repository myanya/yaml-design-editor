rules:
  - id: RULE-0001
    title: テナント・組織への所属
    summary: |
      テナントの独立性を前提に、ユーザ・組織の所属、本務・兼務、所属先の変更を定める。
      管理者の位置付けと、テナントを切り替えて利用する際の前提も扱う。
  - id: RULE-0002
    title: テナント分離の原則
    summary: |
      テナント分離をシステムの原理原則とし、テナント相互の不可侵を定める。
  - id: RULE-0003
    title: 組織ツリーとグループの管理範囲
    summary: |
      許容する組織の階層構造と、管理上の仮想的なグルーピングであるグループの対象範囲を定める。
      組織・グループ管理の独立した機能ID・ロールと、全機能のロールの実行範囲を規定する共通基盤としての位置付けを定める。
      用途は権限範囲の基盤に限定し、他の用途への拡張は想定しない。
      テナント全域管理の組織権限チェックの特例と、テナント外のシステム管理者を原則の対象外とする扱いも定める。
  - id: RULE-0004
    title: 組織・グループにおける管理対象ユーザ
    summary: |
      組織・グループから管理対象ユーザを決める方法と、変更できる情報の範囲を定める。
      個人に紐づく共通情報と、所属組織に紐づく権限情報を区別する。
  - id: RULE-0005
    title: 管理者・担当者ごとの操作権限の違い
    summary: |
      管理者・担当者の初期ロールの設定と、現在の管理・付与の権限による操作制御、テナントユーザ管理者の初期権限を定める。
      利用権限と付与権限の区別、個人情報閲覧権限の設定条件、組織異動と兼務の追加・解除に必要な管理権限も扱う。
      テナント全体を管理対象とするテナントユーザ管理担当者の専用ロールも定める。
  - id: RULE-0006
    title: アーキテクチャ基本方針
    summary: |
      モジュラモノリスを基本とする組み込み形態と、マイクロサービスとしての利用形態を定める。
      レイヤ構成、サブドメイン間の依存制限、テナントのデータ分離、標準機能と設定による利用方針を扱う。
  - id: RULE-0007
    title: 認証・セッション管理方式
    summary: |
      認証の対象方式、URLによるテナント識別、サービス間のセッション共有、セッションの有効期間を定める。
      多要素認証の初期設定と復旧、ログイン継続、ログアウトの反映方法、強制ログアウト後の再ログイン禁止も扱う。
      パスワード認証・多要素認証の失敗回数による試行制限と、テナント別の設定を定める。
  - id: RULE-0008
    title: 認可方式
    summary: |
      ユーザに付与できるロールの数、管理範囲が重なる場合の権限判定、権限等の変更の反映方法を定める。
      保存時と定期的な棚卸チェックでの警告、および再ログインまでの猶予設定と期間中の操作・通知も扱う。
  - id: RULE-0009
    title: 監査ログと保管期間
    summary: |
      監査対象の操作、記録項目、他のログとの分担、テナント別の保管、保管期間、利用権限、CSV・ZIP取得、改ざん検査と自動削除を定める。
      対象を内部IDで識別し、操作時点の組織・ロール・権限を追跡できる情報を残す。
  - id: RULE-0010
    title: 変更の予約の考え方
    summary: |
      ユーザ管理に関する変更を予約便にまとめ、シミュレーション・日中の補正・夜間の本適用を経て、適用日早朝に反映する考え方を定める。
      予約登録時の権限確認、便開始時の権限による実行、および実行権限に用いるユーザの指定と引き継ぎを扱う。
      便の作成単位、競合時の先勝ち、一部失敗時の続行と対処、二段階の締め切り、全体管理者による事前シミュレーションと補正も扱う。
      テナント間のシミュレーションの並列実行と運用調整、および管理範囲に応じた結果の閲覧を定める。
  - id: RULE-0011
    title: 画面デザイン方針
    summary: |
      PC向け画面にデジタル庁デザインシステムを採用し、共通デザイン、利用側のカスタマイズ、テナント別の表示設定を定める。
      表示言語の選択・保存、対応ブラウザ、操作性・アクセシビリティの基準、開発ベンダ向けカスタマイズガイドラインの整備も扱う。
  - id: RULE-0012
    title: ID体系
    summary: |
      内部IDと業務コードを分離し、テナント・データ種別ごとの数値連番、内部IDの変更・再利用、業務コードの運用、ログインURLでのテナント識別を定める。
  - id: RULE-0013
    title: ユーザID（ログインID）方針
    summary: |
      テナントごとに選択するログインIDの3方式と、メールアドレス・ユーザコード・ユーザ名の変更に関する設定を定める。
      本人による変更可否と、管理者側で変更できるロールを項目ごとに管理する。
      必須・一意制約、方式切り替え、大文字・小文字の照合と保存、入力制約、変更時のメール確認と再ログインも扱う。
  - id: RULE-0014
    title: パスワードに関する方針
    summary: |
      パスワードの長さ・文字種の条件とテナント設定、URLによる初期設定・再設定、管理者による再設定案内を定める。
      設定用URLの有効期限・無効化、定期変更と過去のパスワードの再利用に関する方針も扱う。
      テナントの条件変更後に求めるパスワード変更、直前1回分の条件保持と古い条件からの再設定、利用者への周知も扱う。
  - id: RULE-0015
    title: ユーザ通知方法の方針
    summary: |
      メールと画面内表示による通知、テナントごとに管理する本人情報の変更通知、ジョブ結果の確認方法を定める。
      テナント全員向けのお知らせの機能範囲と掲載期間、自動通知の言語と文面の編集も扱う。
      個人向け画面通知の一時的な扱い、メール接続設定と差出人の分担、変更通知を再送しない方針を定める。
  - id: RULE-0016
    title: ログ方針
    summary: |
      ログインログの記録・保管と本人による履歴確認、最終ログイン日時の表示、業務履歴の検索・保管と利用権限を定める。
      システム運行ログの運用管理と、テナント管理者による自テナントの処理結果の確認も扱う。
  - id: RULE-0017
    title: ユーザのライフサイクル
    summary: |
      管理者・担当者による登録、事前登録中の「利用開始前」での初期設定禁止、ユーザの状態と理由、利用開始の条件を定める。
      登録時のロール付与を任意とし、後からロール変更で設定できるようにする。
      初期設定用URLの案内は「初期設定中」への遷移を契機とし、大量処理等では予約バッチを優先して送信を遅らせることを許容する。
      「利用開始前」では一時停止・利用停止を行わず、利用開始の操作を行わないか、不要なら削除する。
      初期設定はパスワードと必要な多要素認証の設定とし、本人情報の入力を求めない。
      初期設定未完了からの再開、管理画面での状態表示、長期間未設定のユーザの運用と誤登録等の削除を扱う。
      一時停止・利用停止・再開、論理削除と月次バッチでの物理削除、削除済みユーザの特殊な復旧運用を定める。
      理由の選択肢をテナント・操作ごとに設定し、「その他」と未設定時は自由記述で入力する。
      一時停止・利用停止・再開・削除では理由を必須とし、削除済みユーザの参照と予約の扱いも定める。
      ユーザ単位の状態と変更権限、所属の変更・解除との区別、停止中の情報保持・設定、URLの無効化、再ログイン、予約の扱いも定める。
  - id: RULE-0018
    title: 機能・権限マスタとロール管理
    summary: |
      ユーザ管理と他機能を対象とする汎用的な権限管理として、機能・権限マスタ、機能別ロール、初期ロールの位置付けを定める。
      開発者とテナント側による定義の追加、機能内の管理の委譲、利用側による権限の参照と制御を扱う。
      機能・権限マスタのテナント別管理と、ロールの名称と操作権限の分離を定める。
  - id: RULE-0019
    title: テナント開設と利用側連携
    summary: |
      利用側システムから呼び出す経路と、システム管理者が本機能を操作する経路によるテナント開設を定める。
      API・サービスクラスによる提供、Spring Bootで注入された利用側コンポーネントによる登録処理の連携と、画面の拡張範囲を扱う。
