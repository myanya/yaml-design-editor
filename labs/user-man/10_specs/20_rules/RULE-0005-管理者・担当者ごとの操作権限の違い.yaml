  - RULE-0004

sections:
  - id: RITM-0019
    rule_type: business
    category: authorization
    tags: [管理者, 担当者, 権限付与]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-09
    revision: 2
    title: 管理者・担当者の任命と権限付与
    summary: 任命と権限付与は操作者の付与権限で制御し、初期ロールでは管理者と担当者の付与可能範囲を分ける。
    content: |
      初期設定では、管理者のロールには管理者・担当者を任命する権限を設定し、担当者のロールには担当者の権限だけを他のユーザに付与できるよう設定する。
      実際に任命・付与できる範囲は、現在のロールに設定された付与権限と管理対象範囲に従う。
      ロールの名称が管理者・担当者のどちらであるかを、任命・付与の可否の判定条件にはしない。

  - id: RITM-0020
    rule_type: business
    category: authorization
    tags: [管理者, 権限付与, 権限設定]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-09
    revision: 2
    title: 付与操作を行う側の権限設定
    summary: 各権限の付与操作を行える範囲を、操作者のロールに設定された管理・付与の権限によって制限する。
    content: |
      管理者に付与操作を限定する運用も、当該操作の権限をロールに設定することで実現し、管理者という名称や区分を検査するものではない。
      この設定は付与操作を行うユーザへの制限であり、付与を受けるユーザが管理者であることを求めるものではない。
      例えば、ユーザ管理者が他ユーザをユーザ管理者にする際、任命される側が事前に持つべきロールや設定の制限はない。

  - id: RITM-0021
    rule_type: business
    category: authorization
    tags: [利用権限, 付与権限]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 利用権限と付与権限
    summary: 自分が利用できる権限と、他者に付与できる権限は別のものとして扱う。
    content: |
      自分の利用権限を、そのまま他者への付与可能範囲とするものではない。
      一部の権限については、設定を行うユーザ自身がその利用権限を持つことを条件とする。

  - id: RITM-0022
    rule_type: business
    category: authorization
    tags: [個人情報, 閲覧権限, 権限付与]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-09
    revision: 2
    title: 個人情報閲覧権限の設定条件
    summary: 個人情報閲覧権限の設定には、その設定に必要な管理・付与の権限と、操作者自身の個人情報閲覧権限を必要とする。
    content: |
      設定を行うユーザは、個人情報閲覧権限を設定する権限と、個人情報を閲覧する利用権限の両方を持つ必要がある。
      管理者というロール名だけで設定を許可しない。

  - id: RITM-0023
    rule_type: business
    category: authorization
    tags: [ロール, 権限設定, 管理範囲]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: ロールと権限の設定範囲
    summary: 組織・グループで設定可能なロールと、各ロールで設定可能な権限の両方を満たす必要がある。
    content: |
      組織やグループには、設定可能なロールが存在する。
      各ロールには、設定可能な権限が存在する。
      組織・グループ側のロールの制約と、ロール側の権限の制約をANDで適用する。
      操作者が変更できる範囲は、原則として操作者自身のロールに依存する。

  - id: RITM-0024
    rule_type: business
    category: authorization
    tags: [テナントユーザ管理者, 管理範囲]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-09
    revision: 3
    title: テナントユーザ管理者
    summary: テナントユーザ管理者の初期ロールには、自テナントの全ユーザの情報と、ユーザ管理に関わる権限・設定を管理する権限を設定する。
    content: |
      テナントユーザ管理者（tenant-user-admin）は、ユーザ管理機能に初期設定されるロールであり、自テナントに所属するすべてのユーザを対象とする。
      初期設定では、ユーザ情報およびユーザ管理に関わる権限をすべて管理でき、さらにユーザ管理に関わる権限の各種設定を変更できるようにする。
      実行可能な操作は現在の権限設定によって決まり、tenant-user-adminという名称によって全操作を許可するものではない。

  - id: RITM-0025
    rule_type: business
    category: authorization
    tags: [組織異動, 操作権限]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 組織異動の実施権限
    summary: 組織異動は、異動元・異動先の両組織の権限を持つユーザ管理者・担当者が実施できる。
    content: |
      異動を実施するユーザは、異動元と異動先の双方の組織に対する権限を持つ必要がある。

  - id: RITM-0026
    rule_type: business
    category: authorization
    tags: [兼務, 追加, 解除]
    status: confirmed
    created_on: 2026-10-04
    updated_on: 2026-10-05
    title: 兼務の追加・解除の実施権限
    summary: 兼務の追加には本務側と兼務側の両組織の権限を必要とし、解除は兼務側の権限だけで実施できる。
    content: |
      営業部が本務のユーザに開発部の兼務を追加する場合、営業部と開発部の両方の権限が必要である。
      そのユーザの開発部の兼務を解除する場合は、開発部の権限だけで実施できる。

  - id: RITM-0188
    rule_type: business
    category: authorization
    tags: [テナントユーザ管理担当者, 管理範囲, ロール]
    status: confirmed
    created_on: 2026-10-06
    updated_on: 2026-10-09
    revision: 3
    title: テナントユーザ管理担当者
    summary: 自テナント全体を管理対象とする、テナントユーザ管理担当者の専用ロールを初期設定として備える。
    content: |
      テナントユーザ管理担当者（user-staff）を、組織・グループのユーザ管理担当者とは別の専用ロールとして設ける。
      管理対象は自テナントに所属する全ユーザとし、実行可能な操作はロールに設定された権限に従う。
      初期設定の付与可能範囲は「管理者・担当者の任命と権限付与」に従い、担当者という名称自体を制約として用いない。
