name: ユーザ管理システム

overview: |
  本システムは、テナント型サービスを提供するシステムに組み込む、ユーザ管理ドメインを担うサブシステムである。
  利用側のシステムは、モジュールとして提供される本ユーザ管理機能を自システムに組み込んで利用する。
  本サブシステムは画面およびAPIを通じて機能を提供し、単独での起動にも対応する。
  権限管理はユーザ管理以外の機能にも提供し、各機能の権限マスタとロールを管理する。

provided_features:
  - name: テナント開設機能
    description: |
      ユーザ管理・権限管理・組織管理など、本機能の管理対象となる機能向けにテナントを作成する。
      利用側システムには、APIおよび通常のサービスクラス呼び出しによる開設処理を提供し、その利用を組み込む運用は利用側に委ねる。
      システム管理者が本機能を運用操作して開設する経路も提供する。
      本機能を主体とする開設では、Spring Bootで注入された利用側のコンポーネントを介して、利用側固有のテナント情報の登録処理などを呼び出せるようにする。
      この処理の拡張に伴い、開設画面に利用側固有の情報表示・選択項目などを追加する機能は提供しない。
  - name: ユーザ管理機能
    description: |
      テナント型サービスを利用するユーザの情報を管理する。
      登録時のロール付与は任意とし、未指定で登録したユーザにも後からロールを設定できる。
      テナント・組織・グループを管理の単位とし、ユーザ管理を担う管理者・担当者が、それぞれの権限に応じた範囲のユーザを管理する。
      管理対象の範囲には、組織ツリーの構造と、組織を横断してまとめるグループの定義を用いる。
      ロールに設定された権限で実行できる操作や、管理対象の具体的な決定規則は、ルール側で定義する。
  - name: ユーザ認証機能
    description: |
      利用側のシステムに対して、アクセスするユーザを認証する機能を提供する。
      認証の基盤にはSpring Securityを使用し、セッション管理にはRedisを使用する。
      認証によるユーザの確認と、そのユーザが実行できる操作を決める認可を組み合わせて、画面およびAPIによる機能の利用を支える。
  - name: 権限管理機能
    description: |
      ロールを用いて、ユーザが利用できる機能や実行できる操作の権限を管理する。
      ロールはテナントごとに設定でき、さらに各テナントの機能ごとに定義できる。
      全機能のロールは、組織またはグループの定義を実行範囲の基準とすることを原則とする。
      テナント全域の管理権限は組織権限をチェックしない実装も許容し、テナント外のシステム管理者はこの原則の対象外とする。
      開発者が用意する機能・権限に加え、テナント側でも機能とそれに紐づく権限を登録・管理できる。
      機能・権限はID・表示名・説明を管理し、機能ごとの権限一覧をもとに、ロールへ権限を付与するかどうかと権限の値を設定する。
      テナントは既存ロールの設定を変更でき、機能ごとに独自のロールも追加できる。
      利用側の各機能は、ユーザの機能別ロールと、そのロールの権限識別ID・権限値を取得して、実際の機能の利用を制御する。
      権限管理から見ると、ユーザ管理も管理対象となる機能の一つである。
      システム全体を管理する権限と、所属テナント内を管理する権限を区別する。
      機能・権限マスタは各テナントへ初期登録し、以後はテナントごとに独立して管理する。
      管理者・担当者というロール名は運用上の呼称であり、操作の可否はロールに設定された権限によって決まる。
      認可の基盤にはSpring Securityを使用する。
  - name: 組織・グループ管理機能
    description: |
      ユーザ管理から独立した機能ID・ロールで、組織とグループの定義を管理する。
      組織とその親子関係をツリー構造として管理し、全機能のロールの実行範囲を決める基礎を提供する。
      複数の組織を横断的に扱うため、各テナントで自由に定義できるグループも管理する。
      グループでは、対象となる組織の集合と、下部組織を含めるかどうかを指定する。
      ユーザ管理を含む各機能が、組織ツリーに沿った範囲とグループによる横断的な範囲を利用する。

excluded_features:
  - ワークフロー／承認フロー

architecture:
  framework: Spring Boot
  language: Kotlin
  persistence: MyBatis
  authentication_authorization: Spring Security
  frontend: Thymeleaf + htmx
  development_database: H2 Database
  verification_production_databases:
    - PostgreSQL
    - Amazon Aurora（PostgreSQL互換）
  deployment_environments:
    - オンプレミス
    - クラウド
  database_policy: |
    検証環境および商用環境では、PostgreSQL系列のデータベースを使用する。
    開発環境ではH2 Databaseを使用する。
  session_store: Redis

important_points:
  - title: 監査ログ
    description: |
      各種操作を監査ログに記録する。
  - title: テナント・機能ごとのロール定義
    description: |
      権限を指定するためのロールは、テナントごとに設定できる。
      さらに、各テナントの機能ごとに定義できる。
      機能の管理者にその機能の権限設定を委譲し、委譲を受けた管理者が機能内のロールを作成・管理できる。
      ロール名は運用上の呼称として扱い、管理者という名前でも権限設定によっては何も操作できないロールを作成できる。
  - title: 組織構造とユーザの管理範囲
    description: |
      組織はツリー構造を持つ。
      管理対象となるユーザの範囲は、その組織ツリーの構造に沿って決定する。
  - title: グループによる組織横断の管理
    description: |
      グループは、複数の組織を横断的に管理するための単位である。
      各テナントは、グループを自由に定義できる。
      グループの定義では、対象となる組織の集合と、下部組織を含めるかどうかを指定する。
  - title: 標準の管理者
    description: |
      システム全体の権限を持つシステム管理者（admin）と、所属テナント内の全権限を持つテナント管理者（tenant-admin）が、デフォルトで存在することを前提とする。
      テナント管理者の権限は、所属するテナント内に限定する。
      テナント全域の管理権限は、障害時の管理操作を妨げないため、組織権限のチェックを行わない特別扱いも許容する。
      テナント外のシステム管理者のために、システム管理用の組織・グループを設ける必要はない。
  - title: ユーザ管理の初期ロール
    description: |
      ユーザ管理には、次の管理者・担当者のロールを初期設定として備える。
      - テナントユーザ管理者（tenant-user-admin）
      - テナントユーザ管理担当者（user-staff）
      - グループユーザ管理者（group-user-admin）
      - 組織ユーザ管理者（org-admin）
      - グループユーザ管理担当者（group-user-staff）
      - 組織ユーザ管理担当者（org-user-staff）
      これらは初期設定されたロールであり、テナントが定義できるロールの全種類を固定するものではない。
      初期ロールの管理範囲と権限の詳細は、別途ルール側で定義する。

principal_entities:
  - name: テナント
    description: |
      テナント型サービスにおける管理の単位である。
      ロールやグループをテナントごとに定義する際の基準となる。
      テナント管理者は、所属するテナント内の全権限を持ち、その範囲を管理する。
  - name: ユーザ
    description: |
      本システムの認証およびユーザ管理の対象となる、サービスの利用者を表す。
      利用できる機能や実行できる操作は、権限管理によって制御する。
      管理できるユーザの範囲は、設定された権限と組織ツリー・グループの定義に基づいて決定する。
  - name: 機能
    description: |
      権限とロールを独立して管理する単位であり、ユーザ管理や利用側の決裁機能などを表す。
      機能ID・表示名・説明を管理し、機能に紐づく権限を権限マスタで管理する。
      開発者が用意した定義を各テナントに初期登録し、以後はテナントごとに独立して管理する。
  - name: 権限
    description: |
      機能に紐づく利用・操作の制御項目であり、権限識別ID・表示名・説明を権限マスタで管理する。
      ロールに設定する権限の値は、利用側の機能が制御に用いる。
  - name: ロール
    description: |
      テナント・機能ごとに定義する権限のまとまりであり、その機能の権限マスタをもとに権限と値を設定する。
      組織またはグループを基軸とする実行範囲を原則とし、テナント全域管理の特例とシステム管理者の除外はRULE-0003に従う。
      初期ロールの設定変更と独自ロールの追加を可能にする。
  - name: ロール付与
    description: |
      ユーザと機能別ロールの対応を表す。付与数・付与単位はRULE-0008「ロールの付与数」に従う。
      付与単位と実行範囲の基準を区別し、実行範囲は組織・グループの定義と全域管理の特例に従う。
  - name: 組織
    description: |
      全機能のロールの実行範囲を決める基礎となる、ツリー構造上の管理単位である。
      組織同士の親子関係によって階層を表し、ユーザ管理ではその構造に沿って管理対象のユーザを決定する。
      グループを定義する際には、管理対象に含める組織として指定する。
  - name: グループ
    description: |
      複数の組織を横断的に管理するため、テナントごとに自由に定義できる管理単位である。
      対象となる組織の集合と、下部組織を含めるかどうかを指定する。
      グループに関する各機能のロールの実行範囲を決める基礎となる。
