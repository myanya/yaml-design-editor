usecases:
  - id: USCS-0001
    title: ユーザを登録する
    summary: ユーザ情報と所属を登録し、ロールを指定した場合はその付与と一体で成立させる。
  - id: USCS-0002
    title: 利用開始を許可する
    summary: 管理者等の操作または予約によって初期設定中へ移し、案内の契機を作る。
  - id: USCS-0003
    title: 初期設定用URLを案内する
    summary: 実際の送信処理時にURLを発行して期限を起算し、登録メールアドレスへ案内する。
  - id: USCS-0004
    title: 本人が初期設定を行う
    summary: 本人がパスワードと必要な多要素認証を設定し、その完了をユーザ管理へ結び付ける。
  - id: USCS-0005
    title: 初期設定完了を利用状態へ反映する
    summary: 利用開始を許可されたユーザを、必要な初期設定の完了により利用中へ移す。
