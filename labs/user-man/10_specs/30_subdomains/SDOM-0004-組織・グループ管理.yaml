id: SDOM-0004
status: draft
responsibility: |
  組織構造とグループの定義を、ユーザ管理から独立した機能ID・ロールで管理する。
  ユーザ管理を含む全機能に対し、ロールの実行範囲を規定する基盤を提供する。
concepts:
  - name: 組織
    description: |
      テナントに所属し、親子関係によるツリー構造を持つ管理単位。
      組織に関するロールの実行範囲の基準となる。
  - name: グループ
    description: |
      組織を管理上の目的で仮想的にまとめる単位。
      対象組織と、下部組織を含めるかどうかの定義によって、グループに関するロールの実行範囲の基準となる。
operations:
  - name: 組織構造の管理
    description: |
      組織と親子関係を管理し、組織ツリーを定義する。
      組織・グループ管理機能のロールに設定された操作権限と実行範囲に従う。
  - name: グループの管理
    description: |
      対象となる組織の集合と、下部組織を含めるかどうかを管理する。
      グループには組織だけを指定し、ユーザや別のグループは指定しない。
  - name: 実行範囲の基準となる定義の提供
    description: |
      権限管理と各機能が実行範囲を扱うために、組織構造とグループの定義を提供する。
boundary: |
  組織・グループの定義は本サブドメインで管理し、機能・権限マスタ、ロールの定義と付与は権限管理で扱う。
  組織・グループ管理自身も、独立した機能として権限管理を利用する。
  全機能のロールは、組織またはグループを基軸とした実行範囲を持つことを原則とする。
  テナント全域の管理権限には組織権限をチェックしない実装も許容し、テナント外のシステム管理者はこの原則の対象外とする。
  システム管理用の組織・グループを設ける必要はない。
  各機能が行う具体的な業務操作と、対象データに対する制御は、その機能の責務として扱う。
