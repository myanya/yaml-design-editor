id: SDOM-0003
status: draft
classification: supporting
classification_reason: |
  ユーザ管理と権限管理を支える、本システム固有のテナント開設と利用側連携を担う。
responsibility: |
  テナント開設の処理を提供し、本機能内の管理対象機能と利用側システムの開設処理をつなぐ。
  利用側から呼び出す経路と、システム管理者が本機能を操作する経路を扱う。
concepts:
  - kind: concept
    name: テナント
    status: draft
    rule_refs: [RITM-0008, RITM-0200]
    description: |
      ユーザ管理・権限管理・組織管理などの管理情報を分離する単位。
      開設時には、本機能の管理対象機能で必要となるテナント作成を行う。
    attributes:
      - name: 開設の完了状況
        description: 本機能の初期構築の成立と、必要な利用側登録を含む開設完了を区別する。
        rule_refs: [RITM-0220, RITM-0221]
    constraints:
      - name: 初期構築の成立単位
        description: 機能・権限定義、最初の組織、本務所属する最初の管理者と管理権限を開設処理で用意する。本機能内の途中失敗では全体を成立させない。
        rule_refs: [RITM-0218, RITM-0220]
      - name: 利用と案内の開始条件
        description: 利用側処理が必要な場合はその成功まで開設未完了とし、通常利用と初期設定案内を開始しない。開設完了時に最初の管理者を初期設定中として案内する。
        rule_refs: [RITM-0218, RITM-0221]
      - name: 同じ対象への再試行
        description: 利用側処理に失敗した場合も、同じ開設対象への再試行で完了させ、別のテナントを作らない。
        rule_refs: [RITM-0221]
  - kind: concept
    name: 利用側の開設用コンポーネント
    status: draft
    rule_refs: [RITM-0200]
    description: |
      本機能を主体とする開設で、利用側のテナント情報の登録処理などを呼び出すための拡張。
      利用側システムがSpring Bootの機能を用いて注入する。
    constraints:
      - name: 重複実行への対応
        description: 同じ開設対象の登録処理が再度呼ばれても対応できるようにする。
        rule_refs: [RITM-0221]
operations:
  - id: DOPR-0013
    name: 利用側からのテナント開設
    rule_refs: [RITM-0198, RITM-0199]
    description: |
      APIまたは通常のサービスクラス呼び出しを通じて、利用側システムに開設処理を提供する。
      呼び出しを組み込む利用側システムの業務・運用は、利用側に委ねる。
    conditions:
      - name: 開設主体の確認
        description: 利用側がAPI・サービス呼出主体の認証と開設権限を確認してから呼び出す。
        rule_refs: [RITM-0219]
    effects:
      - name: 初期構築
        description: 最初の組織・管理者と権限を含む初期構築を行い、本機能内の途中失敗では全体を成立させない。
        rule_refs: [RITM-0218, RITM-0220]
      - name: 開設完了と初期設定の案内
        description: 必要な利用側処理の成功後、最初の管理者を初期設定中として案内する。利用側コンポーネントが失敗した場合は未完了を維持し、同じ対象で再試行する。
        rule_refs: [RITM-0218, RITM-0221]

  - id: DOPR-0014
    name: システム管理者によるテナント開設
    rule_refs: [RITM-0198, RITM-0200]
    description: |
      システム管理者が、運用作業として本機能のテナント開設機能を操作する。
      本機能の管理対象機能向けにテナントを作成し、注入されたコンポーネントを介して利用側の登録処理などを呼び出せるようにする。
    conditions:
      - name: 開設主体の確認
        description: 本機能がシステム管理者の認証と開設権限を確認する。
        rule_refs: [RITM-0219]
    effects:
      - name: 初期構築
        description: 最初の組織・管理者と権限を含む初期構築を行い、本機能内の途中失敗では全体を成立させない。
        rule_refs: [RITM-0218, RITM-0220]
      - name: 開設完了と初期設定の案内
        description: 必要な利用側処理の成功後、最初の管理者を初期設定中として案内する。利用側コンポーネントが失敗した場合は未完了を維持し、同じ対象で再試行する。
        rule_refs: [RITM-0218, RITM-0221]
      - name: 開設操作の監査
        description: 開設前・失敗時も含め、システム管理者の操作をシステム用保管先に月単位で記録する。
        rule_refs: [RITM-0224]

boundary: |
  ユーザ管理・権限管理・組織管理などの管理情報について、本機能の範囲のテナント作成を担う。
  利用側システム固有のテナント情報の登録処理は、利用側システムが担う。
  本機能を主体とする開設では、利用側コンポーネントを介してその処理を連携させる。
  利用側固有の情報表示・選択項目などを本機能の開設画面に追加する拡張は対象としない。
  テナント外のシステム管理者のために、組織・グループを作成する必要はない。
related_subdomains:
  - SDOM-0001
  - SDOM-0002
  - SDOM-0004
rule_refs:
  - RITM-0001
  - RITM-0008
  - RITM-0027
  - RITM-0028
  - RITM-0198
  - RITM-0199
  - RITM-0200
