id: SDOM-0003
status: draft
classification: supporting
classification_reason: |
  ユーザ管理と権限管理を支える、本システム固有のテナント開設と利用側連携を担う。
responsibility: |
  テナント開設の処理を提供し、本機能内の管理対象機能と利用側システムの開設処理をつなぐ。
  利用側から呼び出す経路と、システム管理者が本機能を操作する経路を扱う。
concepts:
  - kind: concept
    name: テナント
    status: draft
    rule_refs: [RITM-0008, RITM-0200]
    description: |
      ユーザ管理・権限管理・組織管理などの管理情報を分離する単位。
      開設時には、本機能の管理対象機能で必要となるテナント作成を行う。
  - kind: concept
    name: 利用側の開設用コンポーネント
    status: draft
    rule_refs: [RITM-0200]
    description: |
      本機能を主体とする開設で、利用側のテナント情報の登録処理などを呼び出すための拡張。
      利用側システムがSpring Bootの機能を用いて注入する。
operations:
  - id: DOPR-0013
    name: 利用側からのテナント開設
    rule_refs: [RITM-0198, RITM-0199]
    description: |
      APIまたは通常のサービスクラス呼び出しを通じて、利用側システムに開設処理を提供する。
      呼び出しを組み込む利用側システムの業務・運用は、利用側に委ねる。
  - id: DOPR-0014
    name: システム管理者によるテナント開設
    rule_refs: [RITM-0198, RITM-0200]
    description: |
      システム管理者が、運用作業として本機能のテナント開設機能を操作する。
      本機能の管理対象機能向けにテナントを作成し、注入されたコンポーネントを介して利用側の登録処理などを呼び出せるようにする。

boundary: |
  ユーザ管理・権限管理・組織管理などの管理情報について、本機能の範囲のテナント作成を担う。
  利用側システム固有のテナント情報の登録処理は、利用側システムが担う。
  本機能を主体とする開設では、利用側コンポーネントを介してその処理を連携させる。
  利用側固有の情報表示・選択項目などを本機能の開設画面に追加する拡張は対象としない。
  テナント外のシステム管理者のために、組織・グループを作成する必要はない。
related_subdomains:
  - SDOM-0001
  - SDOM-0002
  - SDOM-0004
rule_refs:
  - RITM-0001
  - RITM-0008
  - RITM-0027
  - RITM-0028
  - RITM-0198
  - RITM-0199
  - RITM-0200
  - RITM-0201
  - RITM-0205
