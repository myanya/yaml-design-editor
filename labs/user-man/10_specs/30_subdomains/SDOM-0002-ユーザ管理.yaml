id: SDOM-0002
status: draft
responsibility: |
  テナントに所属するユーザの登録・情報更新・利用状態を管理する。
  権限管理の対象となる機能の一つとして、管理操作に必要なロール・権限を利用する。
  管理者・担当者というロール名を認可条件にせず、設定された管理・付与の権限と対象範囲に従う。
concepts:
  - name: ユーザ
    description: |
      管理者・担当者が登録するサービスの利用者。本人による新規登録は提供しない。
  - name: ユーザ情報
    description: |
      個人に紐づく共通情報など、登録・更新の対象となる情報。
      管理対象ユーザに含まれることと、そのユーザのどの情報を変更できるかを区別する。
  - name: 利用状態
    description: |
      ユーザ単位で持つ利用開始前・初期設定中・利用中・一時停止・利用停止・削除済みの状態。
      本務・兼務という所属の区別とは独立して扱う。
operations:
  - name: ユーザの登録と情報更新
    description: |
      管理者・担当者がユーザを登録し、権限の範囲内で情報を更新する。
      登録時はロールを指定しても未指定でもよく、後から登録済みユーザへのロール変更で設定できる。
      本人による一部の情報の変更は、対象項目に設定された方針に従う。
  - name: 利用開始・停止・再開
    description: |
      利用開始の操作・予約と本人の初期設定完了を区別して利用状態を管理する。
      一時停止・利用停止・再開を、設定された操作権限と管理範囲に従って行う。
  - name: ユーザの削除
    description: |
      論理削除と一定期間経過後の物理削除を行う。
      削除済みからの復活は、システムの操作機能ではなく直接DB操作による特殊な運用として扱う。
boundary: |
  機能・権限マスタ、ロールの定義と付与は権限管理で扱い、ユーザ管理はその情報を利用して管理操作を制御する。
  登録時に指定されたロールは権限管理と連携して付与し、未指定の場合も登録できる。
  初期設定で扱うパスワード・多要素認証の設定は、認証機能との連携として扱う。
  「初期設定中」への遷移を契機に初期設定用URLを案内するが、大量処理等では予約バッチを優先して送信を遅らせられる。
  独立した組織・グループ管理機能の定義とユーザの所属を、ロールの実行範囲・管理対象の判断に用いる。
  テナント全域の管理権限には、RITM-0204の組織権限チェックの特例を適用できる。
