subdomains:
  - id: SDOM-0001
    title: 権限管理
    summary: |
      各機能の権限マスタ・ロール・ユーザへのロール付与を管理し、利用側の権限制御に必要な情報を提供する。
  - id: SDOM-0002
    title: ユーザ管理
    summary: |
      ユーザの登録・情報更新・利用状態を管理し、権限管理を利用して管理操作を制御する。
  - id: SDOM-0003
    title: テナント管理
    summary: |
      テナント開設の提供経路と、利用側システムの登録処理との連携を管理する。
  - id: SDOM-0004
    title: 組織・グループ管理
    summary: |
      組織構造とグループを独立した機能として管理し、全機能のロールの実行範囲を規定する基盤を提供する。
  - id: SDOM-0005
    title: ユーザ認証
    summary: |
      認証と、そのためのパスワード・多要素認証の初期設定・再設定を担い、ユーザ管理の利用開始条件に結び付ける。
