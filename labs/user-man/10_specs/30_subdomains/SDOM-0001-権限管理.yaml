id: SDOM-0001
status: draft
classification: core
classification_reason: |
  本ユーザ管理機能を提供する立場で、各機能に共通する権限定義・ロール付与・管理範囲の制御を価値の中心として扱う。
responsibility: |
  ユーザ管理と利用側の他機能に共通する権限管理を担う。
  機能・権限マスタ、機能ごとのロール、ユーザへのロール付与を管理し、機能単位の管理の委譲を支える。
concepts:
  - kind: concept
    name: 機能
    status: draft
    rule_refs: [RITM-0189, RITM-0190]
    description: |
      機能ID・表示名・説明を持つ、権限とロールの管理単位。
      ユーザ管理も、この単位で登録・管理される機能の一つである。
  - kind: concept
    name: 権限マスタ
    status: draft
    rule_refs: [RITM-0190, RITM-0196]
    description: |
      機能に紐づく権限の一覧。各権限は権限識別ID・表示名・説明を持つ。
      機能・権限の定義は各テナントに初期登録し、以後はテナントごとに独立して管理する。
  - kind: concept
    name: ロール
    status: draft
    rule_refs: [RITM-0192, RITM-0193, RITM-0197, RITM-0203, RITM-0204, RITM-0205]
    description: |
      テナント・機能ごとに定義し、権限マスタをもとに権限とその値を設定する。
      ユーザ管理の標準ロールは初期設定であり、独自ロールも追加できる。
      ロール名は運用上の呼称であり、管理者・担当者の区分ではなく、設定された権限によって操作の可否を決める。
      全機能のロールは組織またはグループを実行範囲の基準とすることを原則とし、テナント全域管理の特例とシステム管理者の除外を適用する。
  - kind: relationship
    name: ロール付与
    status: draft
    rule_refs: [RITM-0056, RITM-0203, RITM-0204, RITM-0205]
    description: |
      ユーザ、機能とロールの対応。付与数・付与単位はRITM-0056に従う。
      実行範囲の基準は付与単位と区別し、RITM-0203の原則とRITM-0204・0205の特例・除外に従う。
    attributes:
      - name: 付与先ユーザ
        description: テナント内でロールの付与対象となるユーザ。
        rule_refs: [RITM-0002, RITM-0056]
      - name: 機能別ロールの付与単位
        description: 機能別ロールでは、組織・グループ・テナント全体のいずれかの付与単位を用いる。
        rule_refs: [RITM-0056]
      - name: 機能とロール
        description: 機能別ロールの付与では、機能とその機能に定義されたロールを指定する。
        rule_refs: [RITM-0056, RITM-0192]
    constraints:
      - name: 機能別ロールの付与数
        description: 同じユーザ・付与単位・機能につき1ロールとする。組織所属からテナント全体の付与単位を決めない。
        rule_refs: [RITM-0056]
      - name: テナント管理者との区別
        description: テナント管理者は全機能に及ぶ管理権限として、機能別ロールとは別に扱う。
        rule_refs: [RITM-0056]
      - name: 付与操作の権限
        description: 利用権限と付与権限を区別し、操作者の付与権限と管理対象範囲に従う。
        rule_refs: [RITM-0019, RITM-0020, RITM-0021, RITM-0023]
      - name: 登録時の成立単位
        description: ユーザ登録時に指定されたロールの付与は登録と一体として成立させ、付与失敗時は登録も成立させない。
        rule_refs: [RITM-0209]
operations:
  - id: DOPR-0001
    name: 機能・権限の登録と管理
    rule_refs: [RITM-0190, RITM-0191, RITM-0196]
    description: |
      開発者が用意した定義に加え、テナント側でも機能と権限を登録・管理する。
      機能に紐づく権限の追加・削除を可能にする。
      定義の変更はテナント内で管理し、共通定義への参照によって他テナントへ自動的に波及させない。
  - id: DOPR-0002
    name: ロールの作成と権限設定
    rule_refs: [RITM-0192, RITM-0194]
    description: |
      機能ごとにロールを作成し、既存ロールの権限設定を変更する。
      システム管理者・テナント管理者が機能の管理者ロールを作成し、権限設定を委譲する。
      委譲された管理者は、当該機能のロール等を作成・管理する。
    conditions:
      - name: 登録範囲の設定
        description: ユーザ管理の登録権限は、組織・グループ範囲で許可するかをテナントごとに設定する。利用状態変更の全域範囲の条件とは分ける。
        rule_refs: [RITM-0217, RITM-0176]

  - id: DOPR-0003
    name: ユーザへのロール付与
    rule_refs: [RITM-0019, RITM-0021, RITM-0023, RITM-0056, RITM-0206]
    description: |
      ユーザに対象範囲・機能別のロールを付与する。
      登録時の任意のロール付与と、登録済みユーザへのロール変更を扱う。
      利用権限と付与権限を区別し、管理対象範囲とロールに応じた制約を適用する。
  - id: DOPR-0004
    name: ロールと権限の参照
    rule_refs: [RITM-0195]
    description: |
      利用側がユーザと機能IDに対応するロール、権限識別IDと権限の値を取得できるようにする。

boundary: |
  ユーザの登録・情報更新・利用状態の変更は、ユーザ管理の操作として扱う。
  組織・グループの定義は組織・グループ管理が担い、権限管理はその定義をロールの実行範囲の基準として用いる。
  テナント全域の管理権限は、組織権限をチェックしない実装も許容するが、対象テナントと設定された機能・操作権限の制約は維持する。
  テナント外のシステム管理者の権限を、組織・グループの定義に依存させない。
  利用側の機能は、取得したロールと権限の情報をもとに、自機能の利用を制御する。
  例えば決裁の可否を実際に制御するのは利用側の決裁機能であり、決裁業務自体を本サブドメインで実行するものではない。
