id: domain-entity-catalog
name: 業務エンティティ一覧
rows:
  match:
    - node: {entity: domain-entity, bind: model}
    - edge: {contains: true, dir: in}
    - node: {entity: subdomain, bind: domain}
  rowKey: model
columns:
  - { label: エンティティ名, schemaId: subdomain-detail, path: name }
  - { label: 意味, schemaId: subdomain-detail, path: description }
  - { label: 所属サブドメイン, of: domain, schemaId: subdomain-list, path: title }
  - { label: 状態, schemaId: subdomain-detail, path: status }
  - { label: 識別, schemaId: subdomain-detail, path: identity }
  - { label: 属性と制約, schemaId: subdomain-detail, path: attributes }
  - { label: 関連と多重度, schemaId: subdomain-detail, path: relationships }
  - { label: モデルの制約, schemaId: subdomain-detail, path: constraints }
detail:
  schemaId: subdomain-detail
