id: domain-relations
kind: relations
entities:
  - { type: subdomain, label: サブドメイン }
  - { type: domain-operation, label: サブドメインの操作 }
  - { type: domain-entity, label: 業務エンティティ }
  - { type: usecase, label: 詳細ユースケース }
  - { type: business-flow, label: 業務フロー }
  - { type: business-actor, label: 業務フローの主体 }
  - { type: business-activity, label: 業務フローの主活動 }
  - { type: business-supporting-activity, label: 業務フローの任意活動 }
  - { type: business-transition, label: 業務フローの遷移 }
relations:
  - name: performed-by
    label: 実施する主体
    inverseLabel: 実施する活動
    source: [business-activity, business-supporting-activity]
    target: [business-actor]
  - name: transition-from
    label: 遷移元の主活動
    inverseLabel: 後続への遷移
    source: [business-transition]
    target: [business-activity]
  - name: transition-to
    label: 遷移先の主活動
    inverseLabel: 先行からの遷移
    source: [business-transition]
    target: [business-activity]
  - name: elaborates-with
    label: 詳細化するユースケース
    inverseLabel: 対応する業務活動・フロー
    source: [business-flow, business-activity, business-supporting-activity]
    target: [usecase]
    description: 業務フローの手順・分岐から詳細ユースケースへ対応付ける。
  - name: usecase-in-subdomain
    label: ユースケースの所属
    inverseLabel: 所属するユースケース
    source: [usecase]
    target: [subdomain]
    description: ユースケースを主に担当する一つの業務領域。他領域の操作も利用できる。
  - name: uses-operation
    label: 利用・具体化する操作
    inverseLabel: 対応する業務活動・ユースケース
    source: [business-flow, business-activity, business-supporting-activity, usecase]
    target: [domain-operation]
    description: 活動で利用する操作、またはユースケースで具体化する操作。対応は多対多を許容する。
  - name: interacts-with
    label: 連携するユースケース
    inverseLabel: 連携元のユースケース
    source: [usecase]
    target: [usecase]
    description: 手順から連携先の操作を参照する。同期呼び出しや単一トランザクションを指定しない。
  - name: grounded-in-rule
    label: 根拠の個別ルール
    inverseLabel: 根拠を用いる記述
    source: [subdomain, domain-entity, domain-operation, usecase, business-flow, business-activity, business-supporting-activity, business-transition]
    target: [rule-item]
    description: 記述から根拠のRITMへ参照する。参照元の項目位置で属性・関連・制約・操作を区別する。
