id: context-map-list
name: コンテキスト間の連携一覧
match: 10_specs/37_context_maps/0000-context-map-lists.yaml
entity:
  type: context-map
  idPattern: CMAP-*
  defines: true
coverage:
  - description: 一覧と同じIDの詳細文書を持つ。
    detailIn:
      schemaIds: [context-map-detail]
    level: warning
root:
  type: object
  fields:
    - key: context_maps
      label: コンテキスト間の連携一覧
      type: array
      display: list
      required: true
      item:
        type: object
        fields:
          - { key: id, label: ID, type: id, pattern: 'CMAP-[0-9]{4}', required: true }
          - { key: title, label: 名称, type: line, role: title, required: true }
          - { key: summary, label: 概要, type: text, role: subtitle, required: true }
