id: rule-detail
name: ルール詳細
match: 10_specs/20_rules/RULE-*.yaml
description: 1トピックを1文書に記述する。タイトルと文書全体の概要は一覧で管理する。
entity:
  type: rule
  idPattern: RULE-*
  aspect: detail
root:
  type: object
  fields:
    - key: id
      label: ルールID
      type: id
      pattern: 'RULE-[0-9]{4}'
      required: true
      description: 一覧と同じIDを指定する。親子関係をIDの階層で表現しない。
    - key: derived_from
      label: 導出元ルール
      type: array
      description: 導出元を複数指定できる。導出元側には逆方向の参照を記録しない。
      item:
        type: ref
        idPatterns: [RULE-*]
        scope:
          schemaIds: [rule-list]
        relation: derived-from
    - key: sections
      label: 本文
      type: array
      display: list
      required: true
      item:
        type: object
        entity:
          type: rule-item
          defines: true
        fields:
          - key: id
            label: 個別ルールID
            type: id
            pattern: 'RITM-[0-9]{4}'
            required: true
            description: 全ての本文項目に文書をまたいで一意のIDを付与する。文書IDや項目の位置をIDに含めない。
          - key: rule_type
            label: ルール区分
            type: enum
            required: true
            description: ルールの性質を1つ選ぶ。複数の性質を持つ場合は主となるものを選ぶ。
            values:
              - { value: business, label: 業務, description: 業務上の原則・制約・役割を定める。 }
              - { value: system, label: システム, description: システムの振る舞い・入力制約・処理条件を定める。 }
              - { value: architecture, label: アーキテクチャ, description: 技術構成・分割・連携方式を定める。 }
              - { value: operation, label: 運用, description: 運用手順・保管・点検・障害対応を定める。 }
              - { value: ui_design, label: 画面デザイン, description: 画面の表現・操作・利用環境を定める。 }
          - key: category
            label: 分類
            type: enum
            required: true
            description: 個別ルールが主に扱う主題を1つ選ぶ。補足する主題はタグで表す。
            values:
              - { value: tenant, label: テナント }
              - { value: organization, label: 組織・グループ }
              - { value: user_management, label: ユーザ管理 }
              - { value: authorization, label: 認可 }
              - { value: architecture, label: アーキテクチャ }
              - { value: authentication, label: 認証 }
              - { value: session, label: セッション }
              - { value: audit, label: 監査 }
              - { value: reservation, label: 変更予約 }
              - { value: ui, label: 画面 }
              - { value: identifier, label: ID体系 }
              - { value: password, label: パスワード }
              - { value: notification, label: 通知 }
              - { value: log, label: ログ・履歴 }
          - key: tags
            label: タグ
            type: array
            description: 横断検索に使う補足キーワードを自由入力する。複数指定でき、該当がなければ空にする。
            item:
              type: line
              minLength: 1
          - key: status
            label: ステータス
            type: enum
            required: true
            default: draft
            description: 本文の方針についての合意状態。確定は詳細設計や実装の完了を意味しない。
            values:
              - { value: draft, label: 草案, description: 内容を検討中の項目。 }
              - { value: confirmed, label: 確定, description: 本文に記した方針に合意した項目。 }
              - { value: deprecated, label: 廃止, description: 適用を終了し、参照のために残す項目。 }
          - key: created_on
            label: 作成日
            type: date
            required: true
            auto: created
            description: 個別ルールを作成した日。新しく追加したときに自動で入り、内容を変更しても維持する。
          - key: updated_on
            label: 更新日
            type: date
            required: true
            auto: updated
            description: 個別ルールを最後に修正した日。内容が変わって保存されるたびに自動で当日の日付になる。
          - key: revision
            label: 版
            type: int
            auto: revision
            format: "'rev-'000"
            description: 個別ルールの版。内容が変わって保存されるたびに自動で +1 される（画面では rev-001 のように見える）。
          - { key: title, label: 見出し, type: line, role: title, required: true }
          - { key: summary, label: 概要, type: text, role: subtitle, rows: 2, required: true }
          - { key: content, label: 自由記述, type: text, rows: 6, required: true }
          - key: decision_reason
            label: 決定理由
            type: text
            rows: 3
            description: この本文項目の決定に対応する理由を記述する。
