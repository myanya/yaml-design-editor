id: rule-detail
name: ルール詳細
match: 10_specs/20_rules/RULE-*.yaml
description: 1トピックを1文書に記述する。タイトルと文書全体の概要は一覧で管理する。
entity:
  type: rule
  idPattern: RULE-*
  aspect: detail
root:
  type: object
  fields:
    - key: id
      label: ルールID
      type: id
      pattern: 'RULE-[0-9]{4}'
      required: true
      description: 一覧と同じIDを指定する。親子関係をIDの階層で表現しない。
    - key: derived_from
      label: 導出元ルール
      type: array
      description: 導出元を複数指定できる。導出元側には逆方向の参照を記録しない。
      item:
        type: ref
        idPatterns: [RULE-*]
        scope:
          schemaIds: [rule-list]
        relation: derived-from
    - key: sections
      label: 本文
      type: array
      display: list
      required: true
      item:
        type: object
        entity:
          type: rule-item
          defines: true
        fields:
          - key: id
            label: 個別ルールID
            type: id
            pattern: 'RITM-[0-9]{4}'
            required: true
            description: 全ての本文項目に文書をまたいで一意のIDを付与する。文書IDや項目の位置をIDに含めない。
          - key: created_on
            label: 作成日
            type: date
            required: true
            description: 個別ルールを作成した日。内容を変更しても維持する。
          - key: updated_on
            label: 更新日
            type: date
            required: true
            description: 個別ルールを最後に修正した日。現在は自動更新されないため、修正時に当日の日付を設定する。
          - { key: title, label: 見出し, type: line, role: title, required: true }
          - { key: summary, label: 概要, type: text, role: subtitle, rows: 2, required: true }
          - { key: content, label: 自由記述, type: text, rows: 6, required: true }
          - key: decision_reason
            label: 決定理由
            type: text
            rows: 3
            description: この本文項目の決定に対応する理由を記述する。
