id: business-flow-detail
name: 業務フロー詳細
match: 10_specs/40_business_flows/BZFL-*.yaml
description: 複数サブドメインをまたぐ業務の流れを、関与する主体と個別ルールに対応付ける。
entity:
  type: business-flow
  idPattern: BZFL-*
  aspect: detail
root:
  type: object
  fields:
    - { key: id, label: 業務フローID, type: id, pattern: 'BZFL-[0-9]{4}', required: true }
    - key: status
      label: ステータス
      type: enum
      required: true
      values:
        - { value: draft, label: 草案 }
        - { value: confirmed, label: 確定 }
    - { key: purpose, label: 目的と対象, type: text, required: true }
    - key: actors
      label: 関与する主体
      type: array
      display: list
      required: true
      item:
        type: business-flow-types#actor
    - key: preconditions
      label: 前提条件
      type: array
      required: true
      item: { type: line }
    - key: basic_flow
      label: 基本フロー
      description: 配列の順に業務の流れを記述する。処理全体の同期実行や単一トランザクションを意味しない。
      type: array
      display: list
      item:
        type: object
        fields:
          - key: usecases
            label: 対応する詳細ユースケース
            type: array
            item:
              type: ref
              idPatterns: [USCS-*]
              scope:
                schemaIds: [usecase-list]
              relation: elaborates-with
          - { key: title, label: 手順名, type: line, role: title, required: true }
          - { key: actor, label: 実施主体, type: line, required: true }
          - { key: content, label: 内容, type: text, required: true }
          - { key: state_change, label: 利用状態の変化, type: text }
          - {key: operations, label: 利用する操作, type: domain-model-types#operation-refs}
          - key: subdomains
            label: 関与するサブドメイン
            type: array
            required: true
            item:
              type: ref
              idPatterns: [SDOM-*]
              scope:
                schemaIds: [subdomain-list]
          - key: rule_refs
            label: 根拠の個別ルール
            type: array
            required: true
            item:
              type: ref
              idPatterns: [RITM-*]
              relation: grounded-in-rule
              scope:
                schemaIds: [rule-detail]
    - key: activities
      label: 主活動
      description: 業務上の活動・判断・到達点・引き渡し。進行順序はtransitionsで指定する。
      type: array
      display: list
      item: {type: business-flow-types#activity}
    - key: supporting_activities
      label: 任意活動
      description: 条件を満たすときに行える活動。主経路の遷移には含めない。
      type: array
      display: list
      item: {type: business-flow-types#supporting-activity}
    - key: transitions
      label: 主活動間の遷移
      description: 業務上の進行条件。同期呼び出しや自動実行を指定しない。
      type: array
      display: list
      item: {type: business-flow-types#transition}
    - key: variations
      label: 代替・例外フロー
      type: array
      display: list
      item:
        type: object
        fields:
          - key: usecases
            label: 対応する詳細ユースケース
            type: array
            item:
              type: ref
              idPatterns: [USCS-*]
              scope:
                schemaIds: [usecase-list]
              relation: elaborates-with
          - { key: title, label: 分岐名, type: line, role: title, required: true }
          - { key: condition, label: 条件, type: text, required: true }
          - { key: content, label: 内容, type: text, required: true }
          - key: rule_refs
            label: 根拠の個別ルール
            type: array
            required: true
            item:
              type: ref
              idPatterns: [RITM-*]
              relation: grounded-in-rule
              scope:
                schemaIds: [rule-detail]
    - { key: outcome, label: 完了時の状態, type: text, required: true }
    - key: rule_refs
      label: フロー全体の根拠
      type: array
      required: true
      item:
        type: ref
        idPatterns: [RITM-*]
        relation: grounded-in-rule
        scope:
          schemaIds: [rule-detail]
constraints:
  - match:
      - node: {entity: business-activity, bind: s}
      - edge: {via: actor}
      - node: {entity: business-actor}
      - edge: {contains: true, dir: in}
      - node: {entity: business-flow}
      - edge: {contains: true}
      - node: {same: s}
    expect: exists
    level: error
    message: 主活動の実施主体は、同じ業務フローのactorsから指定してください。
  - match:
      - node: {entity: business-supporting-activity, bind: s}
      - edge: {via: actor}
      - node: {entity: business-actor}
      - edge: {contains: true, dir: in}
      - node: {entity: business-flow}
      - edge: {contains: true}
      - node: {same: s}
    expect: exists
    level: error
    message: 任意活動の実施主体は、同じ業務フローのactorsから指定してください。
  - match:
      - node: {entity: business-transition, bind: s}
      - edge: {via: from}
      - node: {entity: business-activity}
      - edge: {contains: true, dir: in}
      - node: {entity: business-flow}
      - edge: {contains: true}
      - node: {same: s}
    expect: exists
    level: error
    message: 遷移元は、同じ業務フローのactivitiesから指定してください。
  - match:
      - node: {entity: business-transition, bind: s}
      - edge: {via: to}
      - node: {entity: business-activity}
      - edge: {contains: true, dir: in}
      - node: {entity: business-flow}
      - edge: {contains: true}
      - node: {same: s}
    expect: exists
    level: error
    message: 遷移先は、同じ業務フローのactivitiesから指定してください。
  - match: [{node: {entity: business-flow, bind: f}}]
    where:
      - {of: f, path: basic_flow, exists: true}
      - {of: f, path: activities, exists: true}
    expect: absent
    level: error
    message: basic_flowとactivitiesは併記できません。
  - match: [{node: {entity: business-flow, bind: f}}]
    where:
      - {of: f, path: basic_flow, exists: false}
      - {of: f, path: activities, exists: false}
    expect: absent
    level: error
    message: basic_flowまたはactivitiesのどちらかが必要です。
  - match: [{node: {entity: business-flow, bind: f}}]
    where:
      - {of: f, path: basic_flow, exists: true}
      - {of: f, path: basic_flow, empty: true}
    expect: absent
    level: error
    message: basic_flowには1件以上の手順が必要です。
  - match: [{node: {entity: business-flow, bind: f}}]
    where:
      - {of: f, path: activities, exists: true}
      - {of: f, path: activities, empty: true}
    expect: absent
    level: error
    message: activitiesには1件以上の主活動が必要です。
  - match: [{node: {entity: business-flow, bind: f}}]
    where:
      - {of: f, path: activities, exists: true}
      - {of: f, path: transitions, exists: false}
    expect: absent
    level: error
    message: 新形式ではtransitionsが必要です。接続がなければ空配列にしてください。
