id: bounded-context-list
name: 境界づけられたコンテキスト一覧
match: 10_specs/35_bounded_contexts/0000-bounded-context-lists.yaml
entity:
  type: bounded-context
  idPattern: BCTX-*
  defines: true
coverage:
  - description: 一覧と同じIDの詳細文書を持つ。
    detailIn:
      schemaIds: [bounded-context-detail]
    level: warning
root:
  type: object
  fields:
    - key: bounded_contexts
      label: 境界づけられたコンテキスト一覧
      type: array
      display: list
      required: true
      item:
        type: object
        fields:
          - { key: id, label: ID, type: id, pattern: 'BCTX-[0-9]{4}', required: true }
          - { key: title, label: 名称, type: line, role: title, required: true }
          - { key: summary, label: 概要, type: text, role: subtitle, required: true }
