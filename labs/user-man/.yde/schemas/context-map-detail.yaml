id: context-map-detail
name: コンテキスト間の連携詳細
description: 一つの関係を一つのCMAP文書に記録し、その集合をコンテキストマップとして表示する。
match: 10_specs/37_context_maps/CMAP-*.yaml
entity:
  type: context-map
  idPattern: CMAP-*
  aspect: detail
root:
  type: object
  fields:
    - { key: id, label: 連携ID, type: id, pattern: 'CMAP-[0-9]{4}', required: true }
    - key: status
      label: 状態
      type: enum
      required: true
      values:
        - { value: draft, label: 草案 }
        - { value: confirmed, label: 確定 }
    - key: context_a
      label: 一方のコンテキスト
      type: ref
      idPatterns: [BCTX-*]
      relation: connects-context
      required: true
      scope:
        schemaIds: [bounded-context-list]
    - key: context_b
      label: もう一方のコンテキスト
      type: ref
      idPatterns: [BCTX-*]
      relation: connects-context
      required: true
      scope:
        schemaIds: [bounded-context-list]
    - { key: purpose, label: 連携の目的, type: text, required: true }
    - { key: information_flow, label: 情報の提供・利用と方向, type: text, required: true }
    - { key: ownership, label: 情報・変更の管理責任, type: text, required: true }
    - { key: model_translation, label: 境界間での意味の対応, type: text }
    - { key: collaboration, label: チーム間の協調・上流下流の関係, type: text }
    - { key: integration, label: 技術的な連携・翻訳の方式, type: text }
    - { key: timing_and_failure, label: 同期・遅延・失敗時の約束, type: text }
    - key: rule_refs
      label: 根拠の個別ルール
      type: array
      required: true
      item:
        type: ref
        idPatterns: [RITM-*]
        scope:
          schemaIds: [rule-detail]
