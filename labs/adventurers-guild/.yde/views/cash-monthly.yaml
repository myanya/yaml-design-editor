id: cash-monthly
name: 月ごとの現金の入りと出
kind: matrix
description: 年月ごとの、現金の入り（預かり・委託料・売却・年会費・本部からの補填）と出（精算・返金・買取・給与・経費）の合計です。年・月はそれぞれの日付から導きます。
display: grouped
cells:
  match: [ { node: { entity: [deposit, receipt, sale, membership-fee, hq-support, payment, refund, purchase, wage, expense], bind: x } } ]
  of: x
  series:
    - { label: 入り, key: { yearMonth: { first: [ { path: depositedOn }, { path: receivedOn }, { path: soldOn }, { path: collectedOn }, { path: suppliedOn } ] } } }
    - { label: 出, key: { yearMonth: { first: [ { path: paidOn }, { path: refundedOn }, { path: purchasedOn }, { path: payday }, { path: spentOn } ] } } }
  aggregate: sum
  path: amount
