id: branch-cash
name: 支部の現金
description: 支部の開始の現金と、お金の動き（入り＝預かり・委託料・売却・本部からの補填、出＝精算・返金・買取・給与・経費）の合計から導いた、いまの現金。締めの差（数えた額 − 導いた額）も足します。現金を締めるときは、この「いまの現金」を「導いた現金」に写します。預かっている報酬は、受け手へ払うか依頼者へ返す分で、いまの現金から引いた残りが支部が使えるお金です。
rows:
  match:
    - node: { entity: branch, bind: b }
columns:
  - { label: 支部, path: name }
  - { label: 開始の日, path: openingOn }
  - { label: 開始の現金, path: openingCash }
  - label: 預かり（入り）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: received-at, dir: in } }
                - { node: { entity: quest } }
                - { edge: { relation: has-deposit } }
                - { node: { entity: deposit, bind: x } }
              path: amount
        - 0
  - label: 委託料（入り）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: booked-at, dir: in } }
                - { node: { entity: contract } }
                - { edge: { relation: has-receipt } }
                - { node: { entity: receipt, bind: x } }
              path: amount
        - 0
  - label: 売却（入り）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: booked-at, dir: in } }
                - { node: { entity: sale, bind: x } }
              path: amount
        - 0
  - label: 本部からの補填（入り）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: has-support } }
                - { node: { entity: hq-support, bind: x } }
              path: amount
        - 0
  - label: 精算（出）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: received-at, dir: in } }
                - { node: { entity: quest } }
                - { edge: { relation: assignment-of, dir: in } }
                - { node: { entity: assignment } }
                - { edge: { relation: settles, dir: in } }
                - { node: { entity: payment, bind: x } }
              path: amount
        - 0
  - label: 返金（出）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: received-at, dir: in } }
                - { node: { entity: quest } }
                - { edge: { relation: has-refund } }
                - { node: { entity: refund, bind: x } }
              path: amount
        - 0
  - label: 買取（出）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: booked-at, dir: in } }
                - { node: { entity: purchase, bind: x } }
              path: amount
        - 0
  - label: 給与（出）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: works-at, dir: in } }
                - { node: { entity: staff } }
                - { edge: { relation: has-wage } }
                - { node: { entity: wage, bind: x } }
              path: amount
        - 0
  - label: 経費（出）
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: has-expense } }
                - { node: { entity: expense, bind: x } }
              path: amount
        - 0
  - label: いまの現金
    value:
      subtract:
        - add:
            - { of: b, path: openingCash }
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: received-at, dir: in } }
                        - { node: { entity: quest } }
                        - { edge: { relation: has-deposit } }
                        - { node: { entity: deposit, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: booked-at, dir: in } }
                        - { node: { entity: contract } }
                        - { edge: { relation: has-receipt } }
                        - { node: { entity: receipt, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: booked-at, dir: in } }
                        - { node: { entity: sale, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: has-support } }
                        - { node: { entity: hq-support, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: booked-at, dir: in } }
                        - { node: { entity: closing, bind: x } }
                      path: counted
                - 0
        - add:
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: received-at, dir: in } }
                        - { node: { entity: quest } }
                        - { edge: { relation: assignment-of, dir: in } }
                        - { node: { entity: assignment } }
                        - { edge: { relation: settles, dir: in } }
                        - { node: { entity: payment, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: received-at, dir: in } }
                        - { node: { entity: quest } }
                        - { edge: { relation: has-refund } }
                        - { node: { entity: refund, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: booked-at, dir: in } }
                        - { node: { entity: purchase, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: works-at, dir: in } }
                        - { node: { entity: staff } }
                        - { edge: { relation: has-wage } }
                        - { node: { entity: wage, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: has-expense } }
                        - { node: { entity: expense, bind: x } }
                      path: amount
                - 0
            - first:
                - sum:
                    all:
                      from: b
                      match:
                        - { node: { entity: branch } }
                        - { edge: { relation: booked-at, dir: in } }
                        - { node: { entity: closing, bind: x } }
                      path: expected
                - 0
  # 預かっている報酬: 精算も返金もまだの依頼の預かり（受け手へ払うか、依頼者へ返す分で、支部のお金ではない）
  - label: 預かっている報酬
    value:
      first:
        - sum:
            all:
              from: b
              match:
                - { node: { entity: branch } }
                - { edge: { relation: received-at, dir: in } }
                - { node: { entity: quest, bind: qq } }
                - { edge: { relation: has-deposit } }
                - { node: { entity: deposit, bind: x } }
              where: [ { of: qq, path: status, oneOf: [posted, assigned, reported, failed, received] } ]
              of: x
              path: reward
        - 0
