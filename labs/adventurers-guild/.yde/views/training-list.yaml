id: training-list
name: 訓練の課程の一覧
description: 課程ごとの身に付く職能・教官・受講料と、受講の数・修了の数。受講の番号も TRN- で始まるので、行は ID の形ではなく概念（training）で選びます。
rows:
  match:
    - node: { entity: training, bind: t }
columns:
  - { label: 名前, path: name, editable: true }
  - { label: 身に付く職能, path: job, editable: true }
  - { label: 教官, path: instructor, editable: true }
  - { label: 受講料, path: fee, editable: true }
  - label: 受講
    value:
      count:
        all:
          of: e
          match:
            - node: { entity: training, bind: t }
            - edge: { relation: enrolled-in, dir: in }
            - node: { entity: enrollment, bind: e }
  - label: 修了
    value:
      count:
        all:
          of: e
          match:
            - node: { entity: training, bind: t }
            - edge: { relation: enrolled-in, dir: in }
            - node: { entity: enrollment, bind: e }
          where:
            - { of: e, path: result, equals: completed }
newRow:
  filePattern: "guild/trainings/{id}.yaml"
