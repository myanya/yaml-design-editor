id: account-desk
name: 会計と在庫
kind: dashboard
description: 支部のお金と素材です。上の流れは素材の在庫（在庫なし ⇄ 在庫あり）で、工程を押すと素材が「いま操作できる／できない（理由）」に分かれて並び、行から買い取る・売る・捨てる・棚卸するができます。現金・委託料・給与・経費・本部からの補填は、区画の行（支部・委託契約）の操作から進めます。帳簿は持たず、どの数も動きの記録から導きます。
placement: auto
# 在庫の流れ: 素材を、動きから導いた在庫で 2 つの段に分ける。売り切る・捨て切ると「在庫なし」へ戻る（その移り方は宣言しないので、画面の確認では注意が出る）
flow:
  direction: right
  steps: [no-stock, in-stock]
  moves:
    - { from: no-stock, action: buy-material, to: in-stock }
    - { from: in-stock, action: buy-material }
    - { from: in-stock, action: sell-material }
    - { from: in-stock, action: dispose-material }
    - { from: in-stock, action: count-stock }
sections:
  # ---- 在庫（流れの段） ----
  - id: no-stock
    label: 在庫なし
    group: 在庫
    view: stock-list
    filter:
      match: [ { node: { entity: material, bind: m } } ]
      check:
        - lte:
            -
              subtract:
                - add:
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: buys, dir: in } }
                                - { node: { entity: purchase, bind: x } }
                              path: quantity
                        - 0
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: counts, dir: in } }
                                - { node: { entity: stocktake, bind: x } }
                              path: counted
                        - 0
                - add:
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: sells, dir: in } }
                                - { node: { entity: sale, bind: x } }
                              path: quantity
                        - 0
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: discards, dir: in } }
                                - { node: { entity: disposal, bind: x } }
                              path: quantity
                        - 0
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: counts, dir: in } }
                                - { node: { entity: stocktake, bind: x } }
                              path: expected
                        - 0
            - 0
  - id: in-stock
    label: 在庫あり
    group: 在庫
    view: stock-list
    filter:
      match: [ { node: { entity: material, bind: m } } ]
      check:
        - gt:
            -
              subtract:
                - add:
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: buys, dir: in } }
                                - { node: { entity: purchase, bind: x } }
                              path: quantity
                        - 0
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: counts, dir: in } }
                                - { node: { entity: stocktake, bind: x } }
                              path: counted
                        - 0
                - add:
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: sells, dir: in } }
                                - { node: { entity: sale, bind: x } }
                              path: quantity
                        - 0
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: discards, dir: in } }
                                - { node: { entity: disposal, bind: x } }
                              path: quantity
                        - 0
                    - first:
                        - sum:
                            all:
                              from: m
                              match:
                                - { node: { entity: material } }
                                - { edge: { relation: counts, dir: in } }
                                - { node: { entity: stocktake, bind: x } }
                              path: expected
                        - 0
            - 0
  - id: purchases
    label: 買取の記録
    group: 在庫
    view: purchase-ledger
  - id: sales
    label: 売却の記録
    group: 在庫
    view: sale-ledger
  - id: disposals
    label: 廃棄の記録
    group: 在庫
    view: disposal-list
  - id: stocktakes
    label: 棚卸の記録
    group: 在庫
    view: stocktake-list
  # ---- 現金 ----
  - id: branch-cash
    label: 支部の現金
    group: 現金
    view: branch-cash
  - id: branch-pnl
    label: 支部の収支（赤字なら本部からの補填を考える）
    group: 現金
    view: branch-pnl
  - id: cash-monthly
    label: 月ごとの現金の入りと出
    group: 現金
    view: cash-monthly
  - id: cash-chart
    label: 現金の入りと出の累計（図）
    group: 現金
    view: cash-chart
  - id: cash-by-kind
    label: 月ごとのお金の動き（種類別）
    group: 現金
    view: cash-by-kind
  - id: monthly-fees
    label: 月ごとの手数料と受付料
    group: 現金
    view: monthly-fees
  - id: closings
    label: 現金の締め
    group: 現金
    view: closing-list
  # ---- 入りと出の取り決め ----
  - id: contracts
    label: 委託契約
    group: 委託・給与・経費
    view: contract-list
  - id: wages
    label: 給与の支払い
    group: 委託・給与・経費
    view: wage-list
  - id: expenses
    label: 経費
    group: 委託・給与・経費
    view: expense-list
  # ---- 暮らし ----
  - id: earnings
    label: 冒険者の稼ぎ（暮らしの目安は 1 年 1,800）
    group: 暮らし
    view: earnings
