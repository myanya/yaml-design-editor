id: guild-dashboard
name: ギルドの受付
kind: dashboard
default: true
description: ギルドの受付の状況です。業務の流れの段（掲示待ち → 掲示中 → 遂行中 → 精算待ち → 精算済み）を押すと一覧、工程を押すとその段の依頼が「いま操作できる／できない（理由）」に分かれて並び、行から操作できます。受付の依頼は、報酬を預かってから掲示します。期限を過ぎた依頼は基準日で判定します。
# 対象を持たない操作（受け付ける・登録する・組む）
actions: [register-quest, register-adventurer, form-party]
placement: auto
# 業務の流れ: 状態の区画を段、依頼の操作を工程として並べる。区画の filter が「その段にいる」の定義。
# 却下・取消・期限切れ・失敗は流れに置かず、区画だけにする（報告で未達なら失敗へ移る。画面の確認では「流れに宣言していない移り方」の注意になる。manual/dashboards.md「移り先の予告」）
flow:
  direction: right
  start: { action: register-quest, to: received }
  steps: [received, posted, assigned, reported, settled]
  moves:
    - { from: received, action: receive-deposit }
    - { from: received, action: extend-deadline }
    - { from: received, action: post-quest, to: posted }
    - { from: posted, action: extend-deadline }
    - { from: posted, action: accept-quest, to: assigned }
    - { from: assigned, action: extend-deadline }
    - { from: assigned, action: report-quest, to: reported }
    - { from: reported, action: settle-quest, to: settled }
  # 業務詳細の「流れの中の位置」に出す履歴（依頼の history。行の項目は date / action / from / to / note）
  history: { path: history }
sections:
  # ---- 状況（流れの段） ----
  - id: received
    label: 掲示待ち（受付）
    group: 状況
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: received } ]
      expect: exists
  - id: posted
    label: 掲示中
    group: 状況
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: posted } ]
      expect: exists
  - id: assigned
    label: 遂行中（受注済み）
    group: 状況
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: assigned } ]
      expect: exists
  - id: reported
    label: 精算待ち（報告済み）
    group: 状況
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: reported } ]
      expect: exists
  - id: settled
    label: 精算済み
    group: 状況
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: settled } ]
      expect: exists
  # 期限を過ぎた依頼（基準日で判定）。受付・掲示中・失敗は期限切れにするか期限を延ばす。遂行中は報告を待ち、支部の日数がたつか全滅が確かめられたら打ち切る
  - id: overdue
    label: 期限を過ぎた依頼（受付・掲示中・遂行中・失敗）
    group: 状況
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where:
        - { of: q, path: status, oneOf: [received, posted, assigned, failed] }
        - { of: q, path: deadline, exists: true }
      check:
        - lt: [ { of: q, path: deadline }, $today ]
          type: date
  # ---- 流れの外（区画だけ） ----
  - id: failed
    label: 失敗（掲示し直せる）
    group: 流れの外
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: failed } ]
      expect: exists
  - id: expired
    label: 期限切れ
    group: 流れの外
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: expired } ]
      expect: exists
  - id: rejected
    label: 却下
    group: 流れの外
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: rejected } ]
      expect: exists
  - id: cancelled
    label: 取消
    group: 流れの外
    view: quest-board
    filter:
      match: [ { node: { entity: quest, bind: q } } ]
      where: [ { of: q, path: status, equals: cancelled } ]
      expect: exists
  # ---- 会計（精算と買取） ----
  # 今月の精算（支払日の年月が基準日の年月）
  - id: this-month-payments
    label: 今月の精算
    group: 会計
    view: payment-ledger
    filter:
      match: [ { node: { entity: payment, bind: p } } ]
      check:
        - eq: [ { yearMonth: { of: p, path: paidOn } }, { yearMonth: $today } ]
  - id: branch-cash
    label: 支部の現金
    group: 会計
    view: branch-cash
  - id: monthly-amount
    label: 月ごとの支払額
    group: 会計
    view: monthly-amount-chart
  - id: monthly-fee
    label: 月ごとの手数料
    group: 会計
    view: monthly-fee
  - id: purchases
    label: 買取の記録
    group: 会計
    view: purchase-ledger
  - id: monthly-purchase
    label: 月ごとの買取額
    group: 会計
    view: monthly-purchase
  # ---- 名簿 ----
  - id: adventurers
    label: 冒険者の名簿
    group: 名簿
    view: adventurer-roster
  - id: parties
    label: パーティの編成
    group: 名簿
    view: party-roster
  # ---- 世界 ----
  - id: monsters
    label: 魔物の一覧
    group: 世界
    view: monster-list
  - id: places
    label: 場所の一覧
    group: 世界
    view: place-list
  - id: materials
    label: 素材の一覧
    group: 世界
    view: material-list
  # ---- 運営 ----
  - id: staff
    label: 職員の一覧
    group: 運営
    view: staff-list
  - id: regulations
    label: 規約の一覧
    group: 運営
    view: regulation-list
  - id: sanctions
    label: 処分の一覧
    group: 運営
    view: sanction-list
  - id: promotions-pending
    label: 決まっていない昇格審査
    group: 運営
    view: promotion-list
    filter:
      match: [ { node: { entity: promotion, bind: p } } ]
      where: [ { of: p, path: status, oneOf: [nominated, examining] } ]
      expect: exists
  - id: promotions
    label: 昇格審査の一覧
    group: 運営
    view: promotion-list
  # ---- 育成 ----
  - id: trainings
    label: 訓練の課程
    group: 育成
    view: training-list
  - id: qualifications
    label: 資格の一覧
    group: 育成
    view: qualification-list
