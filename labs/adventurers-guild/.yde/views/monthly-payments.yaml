id: monthly-payments
name: 月ごとの精算
description: 精算の月ごとに、精算の件数と、報酬・手数料・支払額の合計を出します。精算は計上月の線（in-month）で集めます。精算の無い月は 0 です。
rows: { idPattern: "PAYM-*" }
order: { schemaId: payment-month-list }
columns:
  - { label: 年月, schemaId: payment-month-list, path: month }
  - label: 件数
    schemaId: payment-month-list
    value:
      count:
        all:
          of: p
          match:
            - node: { entity: payment-month }
            - edge: { relation: in-month, dir: in }
            - node: { entity: payment, bind: p }
  - label: 報酬
    schemaId: payment-month-list
    display: grouped
    value:
      first:
        - sum:
            all:
              of: p
              path: reward
              match:
                - node: { entity: payment-month }
                - edge: { relation: in-month, dir: in }
                - node: { entity: payment, bind: p }
        - 0
  - label: 手数料
    schemaId: payment-month-list
    display: grouped
    value:
      first:
        - sum:
            all:
              of: p
              path: fee
              match:
                - node: { entity: payment-month }
                - edge: { relation: in-month, dir: in }
                - node: { entity: payment, bind: p }
        - 0
  - label: 支払額
    schemaId: payment-month-list
    display: grouped
    value:
      first:
        - sum:
            all:
              of: p
              path: amount
              match:
                - node: { entity: payment-month }
                - edge: { relation: in-month, dir: in }
                - node: { entity: payment, bind: p }
        - 0
