id: training
name: 訓練の課程
kind: document
description: 冒険者向けの訓練の課程 1 つを 1 ファイルで管理します。身に付く職能・修了で得る資格・教官・受講料を持ちます。受講は課程と冒険者の関連で、別の文書（guild/enrollments/）に書き、課程を指します。
match: "guild/trainings/*.yaml"
filePattern: "guild/trainings/{id}.yaml"
root: { type: common#訓練の課程 }
constraints:
  - id: training-grants-beginner
    description: 訓練の課程の修了で得る資格は初級であること
    match:
      - node: { entity: training, bind: t }
      - edge: { relation: grants }
      - node: { entity: qualification, bind: x }
    where: [ { of: x, path: level, notEquals: beginner } ]
    expect: absent
    level: error
    message: "訓練の課程「{id}」の修了で得る資格 {x.title} は初級ではありません（課程の修了で得る資格は初級です）"
