id: common
name: 共通の型
kind: library
description: 冒険者ギルドの運営で使う型を 1 か所にまとめます。値の型（番号の形式・参照・金額・日付・状態）と、オブジェクト型（支部・ランク・冒険者・パーティ・依頼者・依頼・受注）です。概念（エンティティ型）はオブジェクト型の entity が決めます。
definitions:
  # ---- 番号の型 ----
  # 形式（pattern）は各文書の番号の項目と、エンティティ型の判別の両方で使います
  支部番号:
    type: id
    pattern: "^BRN-[0-9]{2}$"
    placeholder: BRN-01
    sample: BRN-01
    description: 「BRN-」と 2 桁の数字。
  ランク番号:
    type: id
    pattern: "^RNK-(SS|S|A|B|C|D|E|F)$"
    placeholder: RNK-A
    sample: RNK-A
    description: 「RNK-」とランクの呼び名（SS・S・A・B・C・D・E・F）。
  冒険者番号:
    type: id
    pattern: "^ADV-[0-9]{4}$"
    placeholder: ADV-0001
    sample: ADV-0001
    description: 「ADV-」と 4 桁の数字。冒険者のファイル名にもなります。
  パーティ番号:
    type: id
    pattern: "^PTY-[0-9]{3}$"
    placeholder: PTY-001
    sample: PTY-001
    description: 「PTY-」と 3 桁の数字。パーティのファイル名にもなります。
  依頼者番号:
    type: id
    pattern: "^CLT-[0-9]{3}$"
    placeholder: CLT-001
    sample: CLT-001
    description: 「CLT-」と 3 桁の数字。依頼者のファイル名にもなります。
  依頼番号:
    type: id
    pattern: "^QST-[0-9]{4}$"
    placeholder: QST-0001
    sample: QST-0001
    description: 「QST-」と 4 桁の数字。依頼のファイル名にもなります。
  受注番号:
    type: id
    pattern: "^QST-[0-9]{4}-A[0-9]+$"
    placeholder: QST-0001-A1
    sample: QST-0001-A1
    description: 依頼番号に「-A」と受注の順番を付けます（例 QST-0001-A1）。
  精算番号:
    type: id
    pattern: "^PAY-[0-9]{4}$"
    placeholder: PAY-0001
    sample: PAY-0001
    description: 「PAY-」と 4 桁の数字。支払った順に振ります。精算のファイル名にもなります。

  場所番号:
    type: id
    pattern: "^PLC-[0-9]{3}$"
    placeholder: PLC-001
    sample: PLC-001
    description: 「PLC-」と 3 桁の数字。
  魔物番号:
    type: id
    pattern: "^MON-[0-9]{3}$"
    placeholder: MON-001
    sample: MON-001
    description: 「MON-」と 3 桁の数字。魔物のファイル名にもなります。
  素材番号:
    type: id
    pattern: "^MAT-[0-9]{3}$"
    placeholder: MAT-001
    sample: MAT-001
    description: 「MAT-」と 3 桁の数字。
  職能番号:
    type: id
    pattern: "^JOB-[0-9]{2}$"
    placeholder: JOB-01
    sample: JOB-01
    description: 「JOB-」と 2 桁の数字。

  職員番号:
    type: id
    pattern: "^STF-[0-9]{2}$"
    placeholder: STF-01
    sample: STF-01
    description: 「STF-」と 2 桁の数字。
  規約番号:
    type: id
    pattern: "^REG-[0-9]{2}$"
    placeholder: REG-01
    sample: REG-01
    description: 「REG-」と 2 桁の数字（条の番号）。
  処分番号:
    type: id
    pattern: "^SNC-[0-9]{3}$"
    placeholder: SNC-001
    sample: SNC-001
    description: 「SNC-」と 3 桁の数字。処分のファイル名にもなります。
  昇格審査番号:
    type: id
    pattern: "^PRM-[0-9]{3}$"
    placeholder: PRM-001
    sample: PRM-001
    description: 「PRM-」と 3 桁の数字。昇格審査のファイル名にもなります。
  訓練番号:
    type: id
    pattern: "^TRN-[0-9]{2}$"
    placeholder: TRN-01
    sample: TRN-01
    description: 「TRN-」と 2 桁の数字。訓練の課程のファイル名にもなります。
  受講番号:
    type: id
    pattern: "^TRN-[0-9]{2}-E[0-9]+$"
    placeholder: TRN-01-E1
    sample: TRN-01-E1
    description: 訓練番号に「-E」と受講の順番を付けます（例 TRN-01-E1）。
  買取番号:
    type: id
    pattern: "^BUY-[0-9]{4}$"
    placeholder: BUY-0001
    sample: BUY-0001
    description: 「BUY-」と 4 桁の数字。買取のファイル名にもなります。

  # ---- 参照の型 ----
  # 候補と検証の対象を種類の文書に限定します。関係名（relation）は、使う側が関係ごとに付けます
  ランク参照:
    type: ref
    idPattern: "RNK-*"
    scope:
      schemaIds: [rank-list]
    description: ランク一覧のランク番号を 1 件。
  冒険者参照:
    type: ref
    idPattern: "ADV-*"
    scope:
      schemaIds: [adventurer]
    description: 冒険者番号を 1 件。
  依頼者参照:
    type: ref
    idPattern: "CLT-*"
    scope:
      schemaIds: [client]
    relation: requested-by
    description: 依頼者番号を 1 件。
  受け手参照:
    type: ref
    idPatterns: ["ADV-*", "PTY-*"]
    scope:
      schemaIds: [adventurer, party]
    relation: taken-by
    description: 依頼を受けた冒険者かパーティの番号を 1 件。個人でもパーティでも受けられます。
  支部参照:
    type: ref
    idPattern: "BRN-*"
    scope:
      schemaIds: [branch]
    description: 支部の番号を 1 件。関係名は使う側が付けます（依頼の受付支部・職員の所属支部）。
  場所参照:
    type: ref
    idPattern: "PLC-*"
    scope:
      schemaIds: [place-list]
    description: 場所の番号を 1 件。関係名は使う側が付けます（依頼の場所・魔物の生息地）。
  素材参照:
    type: ref
    idPattern: "MAT-*"
    scope:
      schemaIds: [material-list]
    description: 素材の番号を 1 件。関係名は使う側が付けます（魔物が落とす素材・買い取った素材）。
  対象参照:
    type: ref
    idPatterns: ["MON-*", "MAT-*"]
    scope:
      schemaIds: [monster, material-list]
    relation: targets
    fields:
      - { key: quantity, label: 数, type: int, min: 1, description: 納める数です（採取や納品の素材・討伐の納品物）。 }
    description: 依頼の対象の魔物か素材の番号を 1 件（討伐なら魔物と、その魔物が落とす納品物。採取と納品なら素材）。数を添えるときは to と quantity で書きます。
  職能参照:
    type: ref
    idPattern: "JOB-*"
    scope:
      schemaIds: [job-list]
    description: 職能の番号を 1 件。関係名は使う側が付けます（冒険者の職能・訓練で身に付く職能）。
  職員参照:
    type: ref
    idPattern: "STF-*"
    scope:
      schemaIds: [staff-list]
    description: 職員の番号を 1 件。関係名は使う側が付けます。
  規約参照:
    type: ref
    idPattern: "REG-*"
    scope:
      schemaIds: [regulation-list]
    relation: violates
    description: 規約（条）の番号を 1 件。
  冒険者かパーティ参照:
    type: ref
    idPatterns: ["ADV-*", "PTY-*"]
    scope:
      schemaIds: [adventurer, party]
    description: 冒険者かパーティの番号を 1 件。関係名は使う側が付けます。
  教官参照:
    type: ref
    idPatterns: ["STF-*", "ADV-*"]
    scope:
      schemaIds: [staff-list, adventurer]
    relation: taught-by
    description: 教官の番号を 1 件。職員か冒険者（引退した冒険者も）です。
  受注参照:
    type: ref
    idPattern: "QST-*-A*"
    scope:
      schemaIds: [quest]
    relation: settles
    description: 精算した受注の番号を 1 件。

  # ---- 値の型 ----
  金額:
    type: int
    min: 0
    format: "#,##0 セリン"
    description: 通貨「セリン」の整数です（支部の文書の currency）。ファイルには数だけを書きます。
  順位:
    type: int
    min: 1
    description: ランクの上下を比べる数です。大きいほど上のランクです。
  率:
    type: int
    min: 0
    max: 100
    format: "0 ％"
    description: 百分率の整数です（10 なら 10 ％）。
  年月日:
    type: date
    format: "yyyy年M月d日"
    description: YYYY-MM-DD 形式で入力します（例 2026-10-01）。
  一行の文:
    type: line
    maxLength: 100
    placeholder: 1 行で簡潔に
  文章:
    type: text
    rows: 4

  # ---- 区分の型 ----
  # 保存する値は英語、画面の表示は日本語。並びは流れの順
  依頼の状態:
    type: enum
    values:
      - { value: received, label: 受付, description: ギルドが依頼を受け付けた。まだ掲示していない }
      - { value: posted, label: 掲示中, description: 掲示板に貼り、受け手を待っている }
      - { value: assigned, label: 受注済み, description: 冒険者かパーティが受け、遂行している }
      - { value: reported, label: 報告済み, description: 受け手が完了を報告した。精算を待っている }
      - { value: settled, label: 精算済み, description: 報酬を支払い、依頼を閉じた }
      - { value: rejected, label: 却下, description: ギルドが受け付けなかった }
      - { value: cancelled, label: 取消, description: 依頼者が取り下げた }
      - { value: failed, label: 失敗, description: 受け手が遂行できなかった }
      - { value: expired, label: 期限切れ, description: 期限までに受け手が見つからなかったか、終わらなかった }
  # 依頼の状態を変える操作の名前（履歴に残す。quest.yaml の actions の id）
  依頼の操作:
    type: enum
    values:
      - { value: register-quest, label: 受け付ける }
      - { value: post-quest, label: 掲示する }
      - { value: accept-quest, label: 受注する }
      - { value: report-quest, label: 報告する }
      - { value: settle-quest, label: 精算する }
      - { value: reject-quest, label: 却下する }
      - { value: cancel-quest, label: 取り消す }
      - { value: expire-quest, label: 期限切れにする }
  冒険者の状態:
    type: enum
    values:
      - { value: active, label: 現役 }
      - { value: resting, label: 休業 }
      - { value: retired, label: 引退 }
      - { value: expelled, label: 除名 }
      - { value: missing, label: 消息不明 }
  依頼の種別:
    type: enum
    values:
      - { value: subjugation, label: 討伐 }
      - { value: gathering, label: 採取 }
      - { value: escort, label: 護衛 }
      - { value: investigation, label: 調査 }
      - { value: delivery, label: 配達 }
      - { value: procurement, label: 納品, description: 素材を集めて納める。集め方は問わない（討伐でも買い集めでもよい） }
      - { value: other, label: その他 }
  場所の種類:
    type: enum
    values:
      - { value: town, label: 町 }
      - { value: village, label: 村 }
      - { value: road, label: 街道 }
      - { value: forest, label: 森 }
      - { value: wetland, label: 湿地 }
      - { value: mine, label: 坑道 }
      - { value: ruins, label: 遺跡 }
      - { value: other, label: その他 }
  素材の種類:
    type: enum
    values:
      - { value: plant, label: 植物 }
      - { value: monster-part, label: 魔物の部位 }
      - { value: mineral, label: 鉱物 }
      - { value: other, label: その他 }
  職員の役目:
    type: enum
    values:
      - { value: branch-manager, label: 支部長 }
      - { value: receptionist, label: 受付 }
      - { value: appraiser, label: 鑑定士 }
      - { value: instructor, label: 教官 }
      - { value: accountant, label: 会計 }
  規約の分類:
    type: enum
    values:
      - { value: registration, label: 登録 }
      - { value: quest, label: 依頼と受注 }
      - { value: reward, label: 報酬と手数料 }
      - { value: conduct, label: 行い }
      - { value: promotion, label: 昇格 }
      - { value: training, label: 訓練 }
  処分の種類:
    type: enum
    values:
      - { value: caution, label: 注意 }
      - { value: suspension, label: 受注停止 }
      - { value: demotion, label: 降格 }
      - { value: expulsion, label: 除名 }
  審査の結果:
    type: enum
    values:
      - { value: pending, label: 審査中 }
      - { value: passed, label: 合格 }
      - { value: failed, label: 不合格 }
  受講の結果:
    type: enum
    values:
      - { value: in-progress, label: 受講中 }
      - { value: completed, label: 修了 }
      - { value: dropped, label: 中止 }
  依頼者の区分:
    type: enum
    values:
      - { value: individual, label: 個人 }
      - { value: merchant, label: 商会 }
      - { value: public, label: 町・公の機関 }
      - { value: other, label: その他 }
  報告の結果:
    type: enum
    values:
      - { value: success, label: 達成 }
      - { value: failure, label: 未達 }

  # ---- オブジェクト型（概念） ----
  支部:
    type: object
    label: ギルド支部
    entity: { type: branch, defines: true }
    fields:
      - { key: id, label: 支部番号, type: 支部番号, required: true }
      - { key: name, label: 支部名, type: 一行の文, role: title, required: true }
      - { key: town, label: 町, type: 一行の文, required: true }
      - { key: currency, label: 通貨の単位, type: 一行の文, required: true, description: 報酬などの金額の単位です。 }
      - { key: commissionRate, label: 手数料率, type: 率, required: true, description: 報酬から差し引くギルドの手数料の率です。支部で一律です。精算のときに、この率を精算の記録へ写します。 }
      - { key: description, label: 説明, type: 文章 }
  ランク:
    type: object
    label: ランク
    entity: { type: rank, defines: true }
    fields:
      - { key: id, label: ランク番号, type: ランク番号, required: true }
      - { key: name, label: 呼び名, type: 一行の文, role: title, required: true }
      - { key: order, label: 順位, type: 順位, required: true, description: 大きいほど上のランクです。受注の条件はこの数で比べます。 }
      - { key: maxConcurrent, label: 同時に受けられる依頼の数, type: int, min: 1, description: 遂行中の依頼の数の上限です。個人とパーティで別に数えます。書かなければ上限はありません。 }
      - { key: description, label: 説明, type: 文章 }
  冒険者:
    type: object
    label: 冒険者
    entity: { type: adventurer, defines: true }
    fields:
      - { key: id, label: 冒険者番号, type: 冒険者番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: rank, label: ランク, type: ランク参照, relation: has-rank, required: true }
      - { key: status, label: 状態, type: 冒険者の状態, required: true, default: active }
      - { key: registeredOn, label: 登録日, type: 年月日, required: true }
      - { key: job, label: 職能, type: 職能参照, relation: has-job, required: true, description: 冒険者の主な職能です。パーティの中の役割（構成員の role）とは別です。 }
      - { key: note, label: 備考, type: 文章 }
  構成員:
    type: ref
    idPattern: "ADV-*"
    scope:
      schemaIds: [adventurer]
    relation: has-member
    fields:
      - { key: role, label: 役割, type: 一行の文 }
    description: パーティの構成員の冒険者番号。役割を添えるときは to と role で書きます。
  パーティ:
    type: object
    label: パーティ
    entity: { type: party, defines: true }
    fields:
      - { key: id, label: パーティ番号, type: パーティ番号, required: true }
      - { key: name, label: パーティ名, type: 一行の文, role: title, required: true }
      - { key: rank, label: ランク, type: ランク参照, relation: has-rank, required: true, description: パーティとしてのランクです。構成員のランクとは別に持ち、構成員から計算しません。 }
      - { key: leader, label: リーダー, type: 冒険者参照, relation: led-by, required: true, description: 構成員の 1 人です。 }
      - key: members
        label: 構成員
        type: array
        required: true
        description: 6 人までです。冒険者が入れるパーティは 1 つまでです。
        item: { type: 構成員 }
      - { key: formedOn, label: 結成日, type: 年月日, required: true }
      - { key: note, label: 備考, type: 文章 }
  依頼者:
    type: object
    label: 依頼者
    entity: { type: client, defines: true }
    fields:
      - { key: id, label: 依頼者番号, type: 依頼者番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: kind, label: 区分, type: 依頼者の区分, required: true, default: individual }
      - { key: note, label: 備考, type: 文章 }
  完了報告:
    type: object
    label: 完了報告
    fields:
      - { key: reportedOn, label: 報告日, type: 年月日, required: true }
      - { key: outcome, label: 結果, type: 報告の結果, required: true }
      - { key: summary, label: 内容, type: 文章 }
  依頼の履歴:
    type: object
    label: 依頼の履歴
    fields:
      - { key: date, label: 日付, type: 年月日, required: true }
      - { key: action, label: 操作, type: 依頼の操作, required: true }
      - { key: from, label: 前の状態, type: 依頼の状態, description: 受け付けの行には書きません。 }
      - { key: to, label: 後の状態, type: 依頼の状態, required: true }
      - { key: note, label: 理由・メモ, type: 一行の文, description: 却下・取消・期限切れの理由などです。 }
  受注:
    type: object
    label: 受注
    entity: { type: assignment, defines: true }
    fields:
      - { key: id, label: 受注番号, type: 受注番号, required: true }
      - { key: taker, label: 受け手, type: 受け手参照, required: true }
      - { key: acceptedOn, label: 受注日, type: 年月日, required: true }
      - { key: report, label: 完了報告, type: 完了報告, description: 受け手が報告したら書きます。 }
    constraints:
      - id: reported-not-before-accepted
        description: 報告日は受注日以降であること
        where: [ { path: report.reportedOn, exists: true } ]
        check: [ { gte: [ { path: report.reportedOn }, { path: acceptedOn } ] } ]
        level: error
  依頼:
    type: object
    label: 依頼
    entity: { type: quest, defines: true }
    fields:
      - { key: id, label: 依頼番号, type: 依頼番号, required: true }
      - { key: title, label: 件名, type: 一行の文, role: title, required: true }
      - { key: kind, label: 種別, type: 依頼の種別, required: true }
      - { key: status, label: 状態, type: 依頼の状態, required: true, default: received }
      - { key: branch, label: 受付支部, type: 支部参照, relation: received-at, required: true, description: 依頼を受け付けた支部です。精算の手数料率はこの支部のものを使います。 }
      - { key: client, label: 依頼者, type: 依頼者参照, required: true }
      - { key: handledBy, label: 受付担当, type: 職員参照, relation: handled-by, description: 依頼を受け付けた職員です。 }
      - { key: requiredRank, label: 受注できるランクの下限, type: ランク参照, relation: requires-rank, description: 書かなければ、どのランクでも受けられます。 }
      - { key: reward, label: 報酬, type: 金額, required: true }
      - { key: receivedOn, label: 受付日, type: 年月日, required: true }
      - { key: deadline, label: 期限, type: 年月日 }
      - { key: place, label: 場所, type: 場所参照, relation: located-at, description: 依頼を行う場所です。 }
      - key: targets
        label: 対象
        type: array
        description: 討伐の魔物（と、その魔物が落とす素材の納品物）、採取や納品の素材です。
        item: { type: 対象参照 }
      - { key: description, label: 内容, type: 文章 }
      - key: assignments
        label: 受注
        type: array
        relation: has-assignment
        default: []
        methods:
          insert:
            id: { path: id, prefix: { $format: "{id}-A", $of: self }, digits: 1 }
        item: { type: 受注 }
      - key: history
        label: 履歴
        type: array
        default: []
        display: table
        description: 状態を変える操作が 1 行ずつ足します。却下・取消・期限切れの理由もここに残します。手で書き足す必要はありません。
        item: { type: 依頼の履歴 }
      - { key: note, label: 備考, type: 文章, description: 依頼についての覚え書きです。状態を変えた理由は履歴に書きます。 }
    # 型の検査: 依頼の要素ごとに評価する（of を省くとこの依頼の値）
    constraints:
      - id: no-assignment-before-posting
        description: 受付・却下の依頼には受注が無いこと（掲示中の依頼は、掲示し直す前の未達の受注を持てる）
        where:
          - { path: status, oneOf: [received, rejected] }
          - { path: assignments, empty: false }
        expect: absent
        level: error
        message: "依頼「{id}」はまだ受注されない状態なのに、受注の記録があります"
      - id: assignment-after-posting
        description: 受注済み・報告済み・精算済み・失敗の依頼には受注があること
        where:
          - { path: status, oneOf: [assigned, reported, settled, failed] }
          - { path: assignments, empty: true }
        expect: absent
        level: error
        message: "依頼「{id}」に受注の記録がありません（受注済み・報告済み・精算済み・失敗の依頼には要ります）"
      - id: reward-in-tens
        description: 報酬は 10 の倍数であること（手数料 1 割が整数になるように。端数の決まりは製品側を待つ）
        check: [ { endsWith: [ { path: reward }, "0" ] } ]
        level: error
      - id: has-history
        description: 依頼には履歴が 1 行以上あること（操作で受け付けると最初の行が入ります）
        where: [ { path: history, empty: true } ]
        expect: absent
        level: warning
        message: "依頼「{id}」に履歴がありません（操作で受け付けると最初の行が入ります）"
      - id: deadline-not-before-received
        description: 期限は受付日以降であること
        where: [ { path: deadline, exists: true } ]
        check: [ { gte: [ { path: deadline }, { path: receivedOn } ] } ]
        level: error
  精算:
    type: object
    label: 精算
    entity: { type: payment, defines: true }
    fields:
      - { key: id, label: 精算番号, type: 精算番号, required: true }
      - { key: assignment, label: 受注, type: 受注参照, required: true }
      - { key: paidOn, label: 支払日, type: 年月日, required: true }
      - { key: reward, label: 報酬, type: 金額, required: true, description: 依頼の報酬と同じ額です。検査が確かめます。 }
      - { key: commissionRate, label: 手数料率, type: 率, required: true, description: 支払ったときの支部の手数料率です。あとで支部の率が変わっても、この値は変わりません。 }
      - { key: fee, label: 手数料, type: 金額, required: true, description: 報酬 × 手数料率 ÷ 100。検査が確かめます。 }
      - { key: amount, label: 支払額, type: 金額, required: true, description: 報酬 − 手数料。受け手に支払った額です。 }
    constraints:
      - id: fee-is-rate-of-reward
        description: 手数料は報酬 × 手数料率 ÷ 100 であること
        check: [ { eq: [ { number: { path: fee } }, { number: { divide: [ { multiply: [ { path: reward }, { path: commissionRate } ] }, 100 ] } } ] } ]
        level: error
      - id: amount-is-reward-minus-fee
        description: 支払額は報酬 − 手数料であること
        check: [ { eq: [ { number: { path: amount } }, { number: { subtract: [ { path: reward }, { path: fee } ] } } ] } ]
        level: error

  # ---- オブジェクト型（世界） ----
  場所:
    type: object
    label: 場所
    entity: { type: place, defines: true }
    fields:
      - { key: id, label: 場所番号, type: 場所番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: kind, label: 種類, type: 場所の種類, required: true }
      - { key: description, label: 説明, type: 文章 }
  素材:
    type: object
    label: 素材
    entity: { type: material, defines: true }
    fields:
      - { key: id, label: 素材番号, type: 素材番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: kind, label: 種類, type: 素材の種類, required: true }
      - key: origins
        label: 産地
        type: array
        description: 採れる場所です（植物・鉱物）。魔物の部位は、落とす魔物で分かるので書きません。
        item: { type: 場所参照, relation: found-at }
      - { key: description, label: 説明, type: 文章 }
  魔物:
    type: object
    label: 魔物
    entity: { type: monster, defines: true }
    fields:
      - { key: id, label: 魔物番号, type: 魔物番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: recommendedRank, label: 討伐の目安のランク, type: ランク参照, relation: recommended-rank, required: true, description: 討伐依頼の受注できるランクの下限は、これを下回らないようにします（下回れば警告）。 }
      - key: habitats
        label: 生息地
        type: array
        item: { type: 場所参照, relation: inhabits }
      - key: drops
        label: 落とす素材
        type: array
        description: 討伐で得られる素材です。
        item: { type: 素材参照, relation: drops }
      - { key: description, label: 説明, type: 文章 }
  職能:
    type: object
    label: 職能
    entity: { type: job, defines: true }
    fields:
      - { key: id, label: 職能番号, type: 職能番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: description, label: 説明, type: 文章 }

  # ---- オブジェクト型（運営） ----
  職員:
    type: object
    label: ギルド職員
    entity: { type: staff, defines: true }
    fields:
      - { key: id, label: 職員番号, type: 職員番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: role, label: 役目, type: 職員の役目, required: true }
      - { key: branch, label: 所属支部, type: 支部参照, relation: works-at, required: true }
      - { key: note, label: 備考, type: 文章 }
  規約:
    type: object
    label: 規約
    entity: { type: regulation, defines: true }
    fields:
      - { key: id, label: 規約番号, type: 規約番号, required: true }
      - { key: title, label: 見出し, type: 一行の文, role: title, required: true }
      - { key: category, label: 分類, type: 規約の分類, required: true }
      - { key: text, label: 条文, type: 文章, required: true }
      - key: checks
        label: 確かめる検査・操作
        type: array
        description: この規約を確かめる検査か操作の id です（YDE の定義の id を文字で書きます）。人の判断で守る規約は空にします。
        item: { type: word }
  処分:
    type: object
    label: 処分
    entity: { type: sanction, defines: true }
    fields:
      - { key: id, label: 処分番号, type: 処分番号, required: true }
      - { key: subject, label: 対象, type: 冒険者かパーティ参照, relation: sanction-of, required: true }
      - { key: kind, label: 種類, type: 処分の種類, required: true }
      - { key: regulation, label: 違反した規約, type: 規約参照, required: true, description: 処分の根拠の規約です。 }
      - { key: decidedOn, label: 決めた日, type: 年月日, required: true }
      - { key: until, label: 終わる日, type: 年月日, description: 受注停止の終わりの日です。 }
      - { key: decidedBy, label: 決めた職員, type: 職員参照, relation: decided-by, required: true }
      - { key: reason, label: 理由, type: 文章, required: true }
    constraints:
      - id: suspension-has-until
        description: 受注停止の処分には終わる日があること
        where:
          - { path: kind, equals: suspension }
          - { path: until, exists: false }
        expect: absent
        level: error
        message: "受注停止の処分「{id}」に終わる日がありません"
      - id: until-not-before-decided
        description: 終わる日は決めた日以降であること
        where: [ { path: until, exists: true } ]
        check: [ { gte: [ { path: until }, { path: decidedOn } ] } ]
        level: error
  昇格審査:
    type: object
    label: 昇格審査
    entity: { type: promotion, defines: true }
    fields:
      - { key: id, label: 昇格審査番号, type: 昇格審査番号, required: true }
      - { key: candidate, label: 対象, type: 冒険者かパーティ参照, relation: promotion-of, required: true }
      - { key: fromRank, label: いまのランク, type: ランク参照, relation: from-rank, required: true }
      - { key: toRank, label: 昇格先のランク, type: ランク参照, relation: to-rank, required: true }
      - { key: appliedOn, label: 申請日, type: 年月日, required: true }
      - { key: result, label: 結果, type: 審査の結果, required: true, default: pending }
      - { key: decidedOn, label: 決めた日, type: 年月日, description: 合格か不合格を決めた日です。 }
      - { key: decidedBy, label: 決めた職員, type: 職員参照, relation: decided-by }
      - key: basedOn
        label: 根拠の実績
        type: array
        description: 審査の根拠にした受注です。
        item: { type: ref, idPattern: "QST-*-A*", scope: { schemaIds: [quest] }, relation: based-on }
      - { key: note, label: 備考, type: 文章 }
    constraints:
      - id: decided-has-date
        description: 合格・不合格の審査には決めた日と決めた職員があること
        where:
          - { path: result, oneOf: [passed, failed] }
          - { or: [ { path: decidedOn, exists: false }, { path: decidedBy, exists: false } ] }
        expect: absent
        level: error
        message: "昇格審査「{id}」は結果が出ているのに、決めた日か決めた職員がありません"
      - id: pending-has-no-date
        description: 審査中の審査には決めた日が無いこと
        where:
          - { path: result, equals: pending }
          - { path: decidedOn, exists: true }
        expect: absent
        level: error
        message: "審査中の昇格審査「{id}」に決めた日があります"
      - id: decided-not-before-applied
        description: 決めた日は申請日以降であること
        where: [ { path: decidedOn, exists: true } ]
        check: [ { gte: [ { path: decidedOn }, { path: appliedOn } ] } ]
        level: error
  受講:
    type: object
    label: 受講
    entity: { type: enrollment, defines: true }
    fields:
      - { key: id, label: 受講番号, type: 受講番号, required: true }
      - { key: trainee, label: 受講者, type: 冒険者参照, relation: trainee, required: true }
      - { key: startedOn, label: 始めた日, type: 年月日, required: true }
      - { key: result, label: 結果, type: 受講の結果, required: true, default: in-progress }
      - { key: completedOn, label: 終えた日, type: 年月日, description: 修了か中止の日です。 }
    constraints:
      - id: finished-has-date
        description: 修了・中止の受講には終えた日があること
        where:
          - { path: result, oneOf: [completed, dropped] }
          - { path: completedOn, exists: false }
        expect: absent
        level: error
        message: "受講「{id}」は終わっているのに、終えた日がありません"
      - id: in-progress-has-no-date
        description: 受講中の受講には終えた日が無いこと
        where:
          - { path: result, equals: in-progress }
          - { path: completedOn, exists: true }
        expect: absent
        level: error
        message: "受講中の受講「{id}」に終えた日があります"
      - id: completed-not-before-started
        description: 終えた日は始めた日以降であること
        where: [ { path: completedOn, exists: true } ]
        check: [ { gte: [ { path: completedOn }, { path: startedOn } ] } ]
        level: error
  訓練の課程:
    type: object
    label: 訓練の課程
    entity: { type: training, defines: true }
    fields:
      - { key: id, label: 訓練番号, type: 訓練番号, required: true }
      - { key: name, label: 名前, type: 一行の文, role: title, required: true }
      - { key: job, label: 身に付く職能, type: 職能参照, relation: trains-for, description: 書かなければ、職能によらない課程（新人講習など）です。 }
      - { key: instructor, label: 教官, type: 教官参照, required: true }
      - { key: fee, label: 受講料, type: 金額 }
      - { key: description, label: 内容, type: 文章 }
      - key: enrollments
        label: 受講
        type: array
        relation: has-enrollment
        default: []
        methods:
          insert:
            id: { path: id, prefix: { $format: "{id}-E", $of: self }, digits: 1 }
        item: { type: 受講 }
  買取:
    type: object
    label: 素材の買取
    entity: { type: purchase, defines: true }
    fields:
      - { key: id, label: 買取番号, type: 買取番号, required: true }
      - { key: seller, label: 売り手, type: 冒険者かパーティ参照, relation: sold-by, required: true }
      - { key: material, label: 素材, type: 素材参照, relation: buys, required: true }
      - { key: quantity, label: 数, type: int, min: 1, required: true }
      - { key: unitPrice, label: 単価, type: 金額, required: true }
      - { key: amount, label: 代金, type: 金額, required: true, description: 単価 × 数。検査が確かめます。 }
      - { key: purchasedOn, label: 買い取った日, type: 年月日, required: true }
      - { key: appraisedBy, label: 鑑定した職員, type: 職員参照, relation: appraised-by }
    constraints:
      - id: purchase-amount
        description: 代金は単価 × 数であること
        check: [ { eq: [ { number: { path: amount } }, { number: { multiply: [ { path: unitPrice }, { path: quantity } ] } } ] } ]
        level: error
