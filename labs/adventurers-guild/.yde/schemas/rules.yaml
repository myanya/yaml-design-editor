id: guild-rules
name: 運営の決まり（種類をまたぐもの）
kind: library
description: 特定の文書の種類に属さない運営の決まりです。起点が冒険者とパーティのように 2 つの種類にまたがる検査をここに置きます（報告先は起点の定義出現）。
constraints:
  - id: concurrent-within-rank-limit
    description: 遂行中（受注済みの依頼の、報告の無い受注）の数は、受け手のランクの上限まで（A 以上は上限なし）
    match:
      - node: { entity: [adventurer, party], bind: t }
      - edge: { relation: has-rank }
      - node: { entity: rank, bind: r }
    where:
      - { of: r, path: maxConcurrent, exists: true }
    check:
      - lte:
          - count:
              all:
                from: t
                of: a
                match:
                  - node: { entity: [adventurer, party], bind: x }
                  - edge: { relation: taken-by, dir: in }
                  - node: { entity: assignment, bind: a }
                  - edge: { relation: has-assignment, dir: in }
                  - node: { entity: quest, bind: q }
                where:
                  - { of: a, path: report, exists: false }
                  - { of: q, path: status, equals: assigned }
          - { of: r, path: maxConcurrent }
    level: error
    message: "{t.title} の遂行中の依頼は {left} 件で、ランク {r.title} の上限 {right} 件を超えています"
