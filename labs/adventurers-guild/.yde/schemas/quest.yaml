id: quest
name: 依頼
kind: document
description: 依頼 1 件を 1 ファイルで管理します。受注の記録（受け手・受注日・完了報告）は依頼の中に入れ子で書きます。
match: "guild/quests/*.yaml"
filePattern: "guild/quests/{id}.yaml"
root: { type: common#依頼 }
# 他の要素へ線を辿る検査は、型ではなくスキーマに書きます（依頼 → 受注 → 受け手 → ランク など）
constraints:
  # ---- 受注の条件 ----
  - id: taker-rank-meets-requirement
    description: 受け手（冒険者かパーティ）のランクは、依頼の受注できるランクの下限以上であること
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: taken-by }
      - node: { entity: [adventurer, party], bind: t }
      - edge: { relation: has-rank }
      - node: { entity: rank, bind: rt }
    also:
      from: a
      steps:
        - edge: { relation: has-assignment, dir: in }
        - node: { entity: quest, bind: q }
        - edge: { relation: requires-rank }
        - node: { entity: rank, bind: rq }
    check:
      - gte: [ { of: rt, path: order }, { of: rq, path: order } ]
    level: error
    message: "受注「{id}」の受け手 {t.title}（ランク {rt.title}）は、依頼の下限 {rq.title} に届きません"
  - id: inactive-adventurer-not-assigned
    description: 休業・引退・除名・消息不明の冒険者は、遂行中（受注済み）の依頼を受けていないこと
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: taken-by }
      - node: { entity: adventurer, bind: t }
    also:
      from: a
      steps:
        - edge: { relation: has-assignment, dir: in }
        - node: { entity: quest, bind: q }
    where:
      - { of: t, path: status, oneOf: [resting, retired, expelled, missing] }
      - { of: q, path: status, equals: assigned }
    expect: absent
    level: error
    message: "受注「{id}」の受け手 {t.title} は、休業・引退・除名・消息不明のため受注できません"
  # 起点を受注にする: 指摘は依頼の文書（受注の定義出現）に出るので、受注する操作の適用前の検証が止められる
  - id: concurrent-within-rank-limit
    description: 遂行中（受注済みの依頼の、報告の無い受注）の数は、受け手のランクの上限まで（A 以上は制限なし）。超えたら、その受け手の遂行中の受注のそれぞれに出す
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: taken-by }
      - node: { entity: [adventurer, party], bind: t }
      - edge: { relation: has-rank }
      - node: { entity: rank, bind: r }
    also:
      from: a
      steps:
        - edge: { relation: has-assignment, dir: in }
        - node: { entity: quest, bind: q }
    where:
      - { of: a, path: report, exists: false }
      - { of: q, path: status, equals: assigned }
      - { of: r, path: maxConcurrent, exists: true }
    check:
      - lte:
          - count:
              all:
                from: t
                of: x
                match:
                  - node: { entity: [adventurer, party] }
                  - edge: { relation: taken-by, dir: in }
                  - node: { entity: assignment, bind: x }
                  - edge: { relation: has-assignment, dir: in }
                  - node: { entity: quest, bind: y }
                where:
                  - { of: x, path: report, exists: false }
                  - { of: y, path: status, equals: assigned }
          - { of: r, path: maxConcurrent }
    level: error
    message: "受注「{id}」: {t.title} の遂行中の依頼は {left} 件で、ランク {r.title} の上限 {right} 件を超えています"

  # ---- 状態と受注・完了報告の整合 ----
  - id: assigned-has-open-assignment
    description: 受注済みの依頼には、まだ報告の無い受注があること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: has-assignment }
      - node: { entity: assignment, bind: a }
    where:
      - { of: q, path: status, equals: assigned }
      - { of: a, path: report, exists: false }
    expect: exists
    level: error
    message: "受注済みの依頼「{id}」に、遂行中（報告の無い）の受注がありません"
  - id: reported-has-success-report
    description: 報告済み・精算済みの依頼には、達成の報告がある受注があること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: has-assignment }
      - node: { entity: assignment, bind: a }
    where:
      - { of: q, path: status, oneOf: [reported, settled] }
      - { of: a, path: report.outcome, equals: success }
    expect: exists
    level: error
    message: "依頼「{id}」に、達成の完了報告がある受注がありません（報告済み・精算済みの依頼には要ります）"
  - id: failed-has-failure-report
    description: 失敗の依頼には、未達の報告がある受注があること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: has-assignment }
      - node: { entity: assignment, bind: a }
    where:
      - { of: q, path: status, equals: failed }
      - { of: a, path: report.outcome, equals: failure }
    expect: exists
    level: error
    message: "失敗の依頼「{id}」に、未達の完了報告がある受注がありません"
  - id: settled-has-payment
    description: 精算済みの依頼には、受注の精算があること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: has-assignment }
      - node: { entity: assignment, bind: a }
      - edge: { relation: settles, dir: in }
      - node: { entity: payment, bind: p }
    where:
      - { of: q, path: status, equals: settled }
    expect: exists
    level: error
    message: "精算済みの依頼「{id}」に、精算の記録がありません"

  # ---- 日付 ----
  - id: accepted-not-before-received
    description: 受注日は依頼の受付日以降であること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: has-assignment }
      - node: { entity: assignment, bind: a }
    check:
      - gte: [ { of: a, path: acceptedOn }, { of: q, path: receivedOn } ]
    level: error
  - id: reported-by-deadline
    description: 完了報告は依頼の期限以内であること（過ぎていれば警告）
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: has-assignment }
      - node: { entity: assignment, bind: a }
    where:
      - { of: q, path: deadline, exists: true }
      - { of: a, path: report.reportedOn, exists: true }
    check:
      - lte: [ { of: a, path: report.reportedOn }, { of: q, path: deadline } ]
    level: warning
    message: "依頼「{id}」の受注 {a.id} は、期限を過ぎてから報告されています"

  # ---- 討伐の目安（魔物の討伐の目安のランク） ----
  - id: subjugation-rank-meets-monster
    description: 討伐依頼の受注できるランクの下限は、対象の魔物の討伐の目安のランクを下回らないこと（下回れば警告）
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: targets }
      - node: { entity: monster, bind: m }
      - edge: { relation: recommended-rank }
      - node: { entity: rank, bind: rm }
    also:
      from: q
      steps:
        - edge: { relation: requires-rank }
        - node: { entity: rank, bind: rq }
    where:
      - { of: q, path: kind, equals: subjugation }
    check:
      - gte: [ { of: rq, path: order }, { of: rm, path: order } ]
    level: warning
    message: "討伐依頼「{id}」の下限 {rq.title} は、{m.title} の討伐の目安 {rm.title} を下回っています"
  # 下限が無い＝どのランクでも（F でも）受けられるので、目安が F より上の魔物なら下回っている
  - id: subjugation-without-rank
    description: 討伐の目安が F より上の魔物を対象にする討伐依頼には、受注できるランクの下限があること（無ければ警告）
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: targets }
      - node: { entity: monster, bind: m }
      - edge: { relation: recommended-rank }
      - node: { entity: rank, bind: rm }
    where:
      - { of: q, path: kind, equals: subjugation }
      - { of: q, path: requiredRank, exists: false }
      - { of: rm, path: order, gt: 1 }
    expect: absent
    level: warning
    message: "討伐依頼「{id}」に受注できるランクの下限がありません（{m.title} の討伐の目安は {rm.title}）"

  # ---- 種別と対象・場所（世界との整合。どれも警告） ----
  - id: subjugation-targets-monster
    description: 討伐依頼は魔物を対象にすること（無ければ警告）
    match: [ { node: { entity: quest, bind: q } }, { edge: { relation: targets } }, { node: { entity: monster } } ]
    where: [ { of: q, path: kind, equals: subjugation } ]
    expect: exists
    level: warning
    message: "討伐依頼「{id}」の対象に魔物がありません"
  - id: gathering-targets-plain-materials
    description: 採取依頼の対象は、魔物でも魔物の部位でもない素材であること（魔物の部位なら討伐か納品にする）
    match: [ { node: { entity: quest, bind: q } }, { edge: { relation: targets } }, { node: { bind: x } } ]
    where:
      - { of: q, path: kind, equals: gathering }
      - { or: [ { of: x, path: recommendedRank, exists: true }, { of: x, path: kind, equals: monster-part } ] }
    expect: absent
    level: warning
    message: "採取依頼「{id}」の対象 {x.title} は採取では得られません（魔物の部位なら討伐か納品にします）"
  - id: procurement-targets-materials
    description: 納品依頼の対象は素材であること（魔物があれば警告）
    match: [ { node: { entity: quest, bind: q } }, { edge: { relation: targets } }, { node: { entity: monster, bind: x } } ]
    where: [ { of: q, path: kind, equals: procurement } ]
    expect: absent
    level: warning
    message: "納品依頼「{id}」の対象に魔物 {x.title} があります（納品の対象は素材です。倒すなら討伐にします）"
  # 素材ごとに「落とす魔物が対象にあるか」を確かめると、納品物の無い討伐依頼まで指摘してしまう（exists は起点ごとの判定）ので、
  # 対象の素材の数と、そのうち対象の魔物が落とす素材の数を比べる
  - id: subjugation-goods-are-drops
    description: 討伐依頼の納品物（対象の素材）は、どれも対象の魔物が落とす素材であること
    match: [ { node: { entity: quest, bind: q } } ]
    where: [ { of: q, path: kind, equals: subjugation } ]
    check:
      - eq:
          - count:
              all:
                from: q
                match:
                  - node: { entity: quest }
                  - edge: { relation: targets }
                  - node: { entity: material, bind: x }
          - count:
              all:
                from: q
                match:
                  - node: { entity: quest, bind: q2 }
                  - edge: { relation: targets }
                  - node: { entity: material, bind: x }
                also:
                  from: q2
                  steps:
                    - edge: { relation: targets }
                    - node: { entity: monster }
                    - edge: { relation: drops }
                    - node: { same: x }
                of: x
    level: warning
    message: "討伐依頼「{id}」の納品物 {left} 件のうち、対象の魔物が落とす素材は {right} 件です（納品物は対象の魔物が落とす素材にします）"
  - id: subjugation-in-habitat
    description: 討伐依頼の場所は、対象の魔物の生息地であること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: located-at }
      - node: { entity: place, bind: p }
    also:
      from: q
      steps:
        - edge: { relation: targets }
        - node: { entity: monster }
        - edge: { relation: inhabits }
        - node: { same: p }
    # exists は起点（依頼）ごとの判定なので、場所の無い依頼を外す（外さないと解が無い＝違反になる）
    where: [ { of: q, path: kind, equals: subjugation }, { of: q, path: place, exists: true } ]
    expect: exists
    level: warning
    message: "討伐依頼「{id}」の場所は、対象の魔物の生息地ではありません（魔物の一覧の生息地を確かめます）"
  - id: gathering-at-origin
    description: 採取依頼の場所は、対象の素材の産地であること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: located-at }
      - node: { entity: place, bind: p }
    also:
      from: q
      steps:
        - edge: { relation: targets }
        - node: { entity: material }
        - edge: { relation: found-at }
        - node: { same: p }
    # exists は起点（依頼）ごとの判定なので、場所の無い依頼を外す（外さないと解が無い＝違反になる）
    where: [ { of: q, path: kind, equals: gathering }, { of: q, path: place, exists: true } ]
    expect: exists
    level: warning
    message: "採取依頼「{id}」の場所は、対象の素材の産地ではありません（素材の一覧の産地を確かめます）"
  # 納品は集め方を問わないが、魔物の部位は結局その魔物を倒して得るので、討伐の目安を下限の目安にする
  - id: procurement-rank-meets-monster
    description: 魔物の部位を納める納品依頼の下限ランクは、その部位を落とす魔物の討伐の目安を下回らないこと
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: targets }
      - node: { entity: material, bind: x }
      - edge: { relation: drops, dir: in }
      - node: { entity: monster, bind: m }
      - edge: { relation: recommended-rank }
      - node: { entity: rank, bind: rm }
    also:
      from: q
      steps:
        - edge: { relation: requires-rank }
        - node: { entity: rank, bind: rq }
    where: [ { of: q, path: kind, equals: procurement } ]
    check:
      - gte: [ { of: rq, path: order }, { of: rm, path: order } ]
    level: warning
    message: "納品依頼「{id}」の下限 {rq.title} は、{x.title} を落とす {m.title} の討伐の目安 {rm.title} を下回っています"
  - id: procurement-without-rank
    description: 討伐の目安が F より上の魔物の部位を納める納品依頼には、下限ランクがあること
    match:
      - node: { entity: quest, bind: q }
      - edge: { relation: targets }
      - node: { entity: material, bind: x }
      - edge: { relation: drops, dir: in }
      - node: { entity: monster, bind: m }
      - edge: { relation: recommended-rank }
      - node: { entity: rank, bind: rm }
    where:
      - { of: q, path: kind, equals: procurement }
      - { of: q, path: requiredRank, exists: false }
      - { of: rm, path: order, gt: 1 }
    expect: absent
    level: warning
    message: "納品依頼「{id}」に下限ランクがありません（{x.title} を落とす {m.title} の討伐の目安は {rm.title}）"

  # ---- 処分の効き目（Q40） ----
  # 起点を受注にする: 受注する操作で依頼の文書が変わるので、適用前の検証が止められる
  - id: no-acceptance-while-suspended
    description: 受注停止の処分の間（決めた日から終わる日まで）は、その冒険者かパーティは受注できないこと
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: taken-by }
      - node: { entity: [adventurer, party], bind: t }
      - edge: { relation: sanction-of, dir: in }
      - node: { entity: sanction, bind: s }
    where: [ { of: s, path: kind, equals: suspension } ]
    check:
      - or:
          - lt: [ { of: a, path: acceptedOn }, { of: s, path: decidedOn } ]
          - gt: [ { of: a, path: acceptedOn }, { of: s, path: until } ]
    level: error
    message: "受注「{id}」: {t.title} は受注停止の処分 {s.id} の間のため受注できません"

  # パーティを作り直せば受けられる、という逃げ道をふさぐ（Q51）。受注したときの構成員で見る（いまの構成員）
  - id: no-party-acceptance-while-member-suspended
    description: 構成員の誰かが受注停止の処分の間は、そのパーティも受注できないこと
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: taken-by }
      - node: { entity: party, bind: t }
      - edge: { relation: has-member }
      - node: { entity: adventurer, bind: m }
      - edge: { relation: sanction-of, dir: in }
      - node: { entity: sanction, bind: s }
    where: [ { of: s, path: kind, equals: suspension } ]
    check:
      - or:
          - lt: [ { of: a, path: acceptedOn }, { of: s, path: decidedOn } ]
          - gt: [ { of: a, path: acceptedOn }, { of: s, path: until } ]
    level: error
    message: "受注「{id}」: {t.title} の構成員 {m.title} が受注停止の処分 {s.id} の間のため、パーティも受注できません"

  # 構成員の受注停止がパーティに及ぶのと逆向き（Q51）。受注したときの所属ではなく、いまの所属で見る
  - id: no-member-acceptance-while-party-suspended
    description: パーティが受注停止の処分の間は、その構成員も個人で受注できないこと
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: taken-by }
      - node: { entity: adventurer, bind: t }
      - edge: { relation: has-member, dir: in }
      - node: { entity: party, bind: p }
      - edge: { relation: sanction-of, dir: in }
      - node: { entity: sanction, bind: s }
    where: [ { of: s, path: kind, equals: suspension } ]
    check:
      - or:
          - lt: [ { of: a, path: acceptedOn }, { of: s, path: decidedOn } ]
          - gt: [ { of: a, path: acceptedOn }, { of: s, path: until } ]
    level: error
    message: "受注「{id}」: {t.title} の属する {p.title} が受注停止の処分 {s.id} の間のため、個人でも受注できません"

  # ---- 求める職能と段階（Q38・Q52）: 受け手の主な職能（段階つき）か、その職能の資格で満たす。パーティなら構成員の誰か ----
  # 「どれかの道で満たす」は 1 つの照合に書けないので、道ごとの件数を足して 1 以上かを見る（devtrack の UX-284）。
  # 受け手が冒険者でもパーティでも同じ道で辿れるよう、has-member を 0 回以上（repeat）にした。段階は求める段階ごとに検査を分ける
  - id: required-job-met
    description: 求める職能のある依頼（段階が初級か無し）の受け手は、その職能か、その職能の資格を持つこと（パーティなら構成員の誰か）
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: has-assignment, dir: in }
      - node: { entity: quest, bind: q }
      - edge: { relation: requires-job }
      - node: { entity: job, bind: j }
    where: [ { or: [ { of: q, path: requiredLevel, exists: false }, { of: q, path: requiredLevel, equals: beginner } ] } ]
    check:
      - gte:
          - add:
              # 受け手（パーティなら構成員）の主な職能
              - count:
                  all:
                    from: a
                    match:
                      - node: { entity: assignment, bind: a1 }
                      - edge: { relation: taken-by }
                      - node: { entity: [adventurer, party] }
                      - edge: { relation: has-member, repeat: { min: 0 } }
                      - node: { entity: adventurer, bind: t1 }
                      - edge: { relation: has-job }
                      - node: { entity: job, bind: j1 }
                    where: [ { of: t1, path: jobLevel, exists: true } ]
                    also:
                      from: a1
                      steps:
                        - edge: { relation: has-assignment, dir: in }
                        - node: { entity: quest }
                        - edge: { relation: requires-job }
                        - node: { same: j1 }
                    of: j1
              # 受け手（パーティなら構成員）の資格（修了した受講の課程が得させる資格）
              - count:
                  all:
                    from: a
                    match:
                      - node: { entity: assignment, bind: a1 }
                      - edge: { relation: taken-by }
                      - node: { entity: [adventurer, party] }
                      - edge: { relation: has-member, repeat: { min: 0 } }
                      - node: { entity: adventurer }
                      - edge: { relation: trainee, dir: in }
                      - node: { entity: enrollment, bind: e1 }
                      - edge: { relation: has-enrollment, dir: in }
                      - node: { entity: training }
                      - edge: { relation: grants }
                      - node: { entity: qualification, bind: x1 }
                      - edge: { relation: certifies }
                      - node: { entity: job, bind: j1 }
                    where: [ { of: e1, path: result, equals: completed } ]
                    also:
                      from: a1
                      steps:
                        - edge: { relation: has-assignment, dir: in }
                        - node: { entity: quest }
                        - edge: { relation: requires-job }
                        - node: { same: j1 }
                    of: j1
          - 1
    level: warning
    message: "受注「{id}」の受け手は、依頼「{q.id}」の求める職能 {j.title} も、その職能の資格も持っていません"
  - id: required-job-met-intermediate
    description: 求める段階が中級の依頼の受け手は、その職能の中級以上（主な職能の段階か、資格の段階）であること
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: has-assignment, dir: in }
      - node: { entity: quest, bind: q }
      - edge: { relation: requires-job }
      - node: { entity: job, bind: j }
    where: [ { of: q, path: requiredLevel, equals: intermediate } ]
    check:
      - gte:
          - add:
              # 受け手（パーティなら構成員）の主な職能
              - count:
                  all:
                    from: a
                    match:
                      - node: { entity: assignment, bind: a1 }
                      - edge: { relation: taken-by }
                      - node: { entity: [adventurer, party] }
                      - edge: { relation: has-member, repeat: { min: 0 } }
                      - node: { entity: adventurer, bind: t1 }
                      - edge: { relation: has-job }
                      - node: { entity: job, bind: j1 }
                    where: [ { of: t1, path: jobLevel, oneOf: [intermediate, advanced] } ]
                    also:
                      from: a1
                      steps:
                        - edge: { relation: has-assignment, dir: in }
                        - node: { entity: quest }
                        - edge: { relation: requires-job }
                        - node: { same: j1 }
                    of: j1
              # 受け手（パーティなら構成員）の資格（修了した受講の課程が得させる資格）
              - count:
                  all:
                    from: a
                    match:
                      - node: { entity: assignment, bind: a1 }
                      - edge: { relation: taken-by }
                      - node: { entity: [adventurer, party] }
                      - edge: { relation: has-member, repeat: { min: 0 } }
                      - node: { entity: adventurer }
                      - edge: { relation: trainee, dir: in }
                      - node: { entity: enrollment, bind: e1 }
                      - edge: { relation: has-enrollment, dir: in }
                      - node: { entity: training }
                      - edge: { relation: grants }
                      - node: { entity: qualification, bind: x1 }
                      - edge: { relation: certifies }
                      - node: { entity: job, bind: j1 }
                    where: [ { of: e1, path: result, equals: completed }, { of: x1, path: level, oneOf: [intermediate, advanced] } ]
                    also:
                      from: a1
                      steps:
                        - edge: { relation: has-assignment, dir: in }
                        - node: { entity: quest }
                        - edge: { relation: requires-job }
                        - node: { same: j1 }
                    of: j1
          - 1
    level: warning
    message: "受注「{id}」の受け手は、依頼「{q.id}」の求める {j.title}（中級以上）に届きません"
  - id: required-job-met-advanced
    description: 求める段階が上級の依頼の受け手は、その職能の上級（主な職能の段階か、資格の段階）であること
    match:
      - node: { entity: assignment, bind: a }
      - edge: { relation: has-assignment, dir: in }
      - node: { entity: quest, bind: q }
      - edge: { relation: requires-job }
      - node: { entity: job, bind: j }
    where: [ { of: q, path: requiredLevel, equals: advanced } ]
    check:
      - gte:
          - add:
              # 受け手（パーティなら構成員）の主な職能
              - count:
                  all:
                    from: a
                    match:
                      - node: { entity: assignment, bind: a1 }
                      - edge: { relation: taken-by }
                      - node: { entity: [adventurer, party] }
                      - edge: { relation: has-member, repeat: { min: 0 } }
                      - node: { entity: adventurer, bind: t1 }
                      - edge: { relation: has-job }
                      - node: { entity: job, bind: j1 }
                    where: [ { of: t1, path: jobLevel, equals: advanced } ]
                    also:
                      from: a1
                      steps:
                        - edge: { relation: has-assignment, dir: in }
                        - node: { entity: quest }
                        - edge: { relation: requires-job }
                        - node: { same: j1 }
                    of: j1
              # 受け手（パーティなら構成員）の資格（修了した受講の課程が得させる資格）
              - count:
                  all:
                    from: a
                    match:
                      - node: { entity: assignment, bind: a1 }
                      - edge: { relation: taken-by }
                      - node: { entity: [adventurer, party] }
                      - edge: { relation: has-member, repeat: { min: 0 } }
                      - node: { entity: adventurer }
                      - edge: { relation: trainee, dir: in }
                      - node: { entity: enrollment, bind: e1 }
                      - edge: { relation: has-enrollment, dir: in }
                      - node: { entity: training }
                      - edge: { relation: grants }
                      - node: { entity: qualification, bind: x1 }
                      - edge: { relation: certifies }
                      - node: { entity: job, bind: j1 }
                    where: [ { of: e1, path: result, equals: completed }, { of: x1, path: level, equals: advanced } ]
                    also:
                      from: a1
                      steps:
                        - edge: { relation: has-assignment, dir: in }
                        - node: { entity: quest }
                        - edge: { relation: requires-job }
                        - node: { same: j1 }
                    of: j1
          - 1
    level: warning
    message: "受注「{id}」の受け手は、依頼「{q.id}」の求める {j.title}（上級）に届きません"

# ---- 操作: 依頼の状態を進める ----
# 状態は操作だけで変え、前提で移り方を守る。どの操作も、状態を変える前に履歴へ 1 行足す（前の状態を読むため）。
# 受け手のランク・同時に受けられる数・受注できない状態は、上の検査と同じ決まりを、適用後の検証が止める
# （前提では、受け取った受け手の値を依頼と比べられないため）。
actions:
  - id: register-quest
    label: 依頼を受け付ける
    description: 依頼者から依頼を受け付け、依頼の文書を作ります。番号は QST- の次の番号を振ります。状態は受付で、履歴に最初の行が入ります。
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: title, label: 件名, type: common#一行の文, required: true, minLength: 1 }
      - { key: kind, label: 種別, type: common#依頼の種別, required: true }
      - { key: client, label: 依頼者, type: common#依頼者参照, required: true }
      - { key: requiredRank, label: 受注できるランクの下限, type: common#ランク参照, description: 書かなければ、どのランクでも受けられます。 }
      - { key: reward, label: 報酬, type: common#金額, required: true, description: 10 の倍数にします。 }
      - { key: deadline, label: 期限, type: common#年月日 }
      - { key: place, label: 場所, type: common#場所参照 }
      - { key: requiredJob, label: 求める職能, type: common#職能参照 }
      - { key: requiredLevel, label: 求める段階, type: common#資格の段階, description: 書かなければ初級（どの段階でもよい）です。 }
      - { key: targets, label: 対象, type: array, item: { type: common#対象参照 }, description: 討伐の魔物（と納品物）、採取や納品の素材です。数は登録のあとで書き足します。 }
      - { key: description, label: 内容, type: common#文章 }
      - { key: date, label: 受付日, type: common#年月日, required: true }
      - { key: branch, label: 受付支部, type: common#支部参照, required: true, default: BRN-01 }
    do:
      - create:
          schema: quest
          id: { prefix: "QST-", digits: 4 }
          params:
            title: $title
            kind: $kind
            status: received
            branch: $branch
            client: $client
            requiredRank: { $copy: requiredRank }
            reward: $reward
            receivedOn: $date
            deadline: { $copy: deadline }
            place: { $copy: place }
            requiredJob: { $copy: requiredJob }
            requiredLevel: { $copy: requiredLevel }
            targets: { $copy: targets }
            description: { $copy: description }
            history: [ { date: $date, action: register-quest, to: received } ]
  - id: receive-deposit
    label: 報酬を預かる
    description: 受付の依頼の報酬と受付料を、依頼者から預かります。受付料率は受付支部の率を写し、受付料（報酬 × 率 ÷ 100）と受け取った額を計算して、依頼の中に預かり（{依頼番号}-D）を書きます。掲示する前に要ります。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 預かった日, type: common#年月日, required: true }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, equals: received } ]
        expect: exists
        message: "{id} は受付の依頼ではありません（預かるのは掲示する前です）"
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: deposit, exists: false } ]
        expect: exists
        message: "{id} はもう預かっています"
      - match: [ { node: { entity: quest, bind: q } } ]
        check: [ { gte: [ $date, { of: q, path: receivedOn } ] } ]
        message: 預かった日は受付日以降にしてください
    do:
      - each:
          from: self
          match:
            - node: { entity: quest }
            - edge: { relation: received-at }
            - node: { entity: branch, bind: b }
          do:
            - set:
                of: self
                path: deposit
                value:
                  id: { $format: "{id}-D", $of: self }
                  depositedOn: $date
                  reward: { $copy: reward, $of: self }
                  feeRate: { $copy: receptionFeeRate, $of: b }
                  fee: { $value: { divide: [ { multiply: [ { of: self, path: reward }, { of: b, path: receptionFeeRate } ] }, 100 ] } }
                  amount: { $value: { add: [ { of: self, path: reward }, { divide: [ { multiply: [ { of: self, path: reward }, { of: b, path: receptionFeeRate } ] }, 100 ] } ] } }
  - id: post-quest
    label: 依頼を掲示する
    description: 受付か失敗の依頼を掲示中にします。失敗した依頼は掲示し直せます（次の受注は A2、A3 … として足します）。期限を過ぎた依頼は掲示できません。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 掲示日, type: common#年月日, required: true }
      - { key: note, label: メモ, type: common#一行の文 }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, oneOf: [received, failed] } ]
        expect: exists
        message: "{id} は受付か失敗の依頼ではありません（掲示できるのは、受付の依頼と、掲示し直す失敗の依頼です）"
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: deposit, exists: true } ]
        expect: exists
        message: "{id} はまだ報酬を預かっていません（先に「報酬を預かる」）"
      # 期限の無い依頼は通す（前提の where で受け手を外すと「対象ではない」で止まるので、期限の無いときは遠い日とみなす）
      - match: [ { node: { entity: quest, bind: q } } ]
        check:
          - gte: [ { first: [ { of: q, path: deadline }, "9999-12-31" ] }, $date ]
            type: date
        message: "{id} は期限を過ぎているため掲示できません（掲示日 $date）"
      - match: [ { node: { entity: quest, bind: q } } ]
        check: [ { gte: [ $date, { of: q, path: receivedOn } ] } ]
        message: 掲示日は受付日以降にしてください
    do:
      - insert: { of: self, path: history, value: { date: $date, action: post-quest, from: { $value: { of: self, path: status } }, to: posted, note: { $copy: note } } }
      - set: { of: self, path: status, value: posted }
  - id: accept-quest
    label: 依頼を受注する
    description: 掲示中の依頼を、冒険者かパーティが受けます。受注の記録（A1、A2 …）を足して受注済みにします。受け手のランク・同時に受けられる数・受注できない状態に合わなければ、適用後の検証の誤りで止まります。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: taker, label: 受け手, type: common#受け手参照, required: true }
      - { key: date, label: 受注日, type: common#年月日, required: true }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, equals: posted } ]
        expect: exists
        message: "{id} は掲示中の依頼ではありません"
      # 期限の無い依頼は通す（前提の where で受け手を外すと「対象ではない」で止まるので、期限の無いときは遠い日とみなす）
      - match: [ { node: { entity: quest, bind: q } } ]
        check:
          - gte: [ { first: [ { of: q, path: deadline }, "9999-12-31" ] }, $date ]
            type: date
        message: "{id} は期限を過ぎているため受注できません（受注日 $date）"
    do:
      - insert: { of: self, path: history, value: { date: $date, action: accept-quest, from: posted, to: assigned, note: { $format: "受け手 {t}", $with: { t: $taker } } } }
      - insert: { of: self, path: assignments, params: { taker: $taker, acceptedOn: $date } }
      - set: { of: self, path: status, value: assigned }
  - id: report-quest
    label: 完了を報告する
    description: 受注済みの依頼の、遂行中の受注に完了報告を書きます。達成なら報告済み、未達なら失敗にします。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: outcome, label: 結果, type: common#報告の結果, required: true }
      - { key: date, label: 報告日, type: common#年月日, required: true }
      - { key: summary, label: 内容, type: common#文章 }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, equals: assigned } ]
        expect: exists
        message: "{id} は受注済みの依頼ではありません"
    do:
      - each:
          from: self
          match:
            - node: { entity: quest }
            - edge: { relation: has-assignment }
            - node: { entity: assignment, bind: a }
          where: [ { of: a, path: report, exists: false } ]
          do:
            - set: { of: a, path: report, value: { reportedOn: $date, outcome: $outcome, summary: { $copy: summary } } }
      - when: { path: outcome, equals: success }
        insert: { of: self, path: history, value: { date: $date, action: report-quest, from: assigned, to: reported } }
      - when: { path: outcome, equals: success }
        set: { of: self, path: status, value: reported }
      - when: { path: outcome, equals: failure }
        insert: { of: self, path: history, value: { date: $date, action: report-quest, from: assigned, to: failed } }
      - when: { path: outcome, equals: failure }
        set: { of: self, path: status, value: failed }
  - id: settle-quest
    label: 報酬を精算する
    description: 報告済みの依頼の報酬を支払い、精算の記録（PAY- の次の番号）を作って精算済みにします。手数料率は受付支部の率を写し、手数料と支払額を計算します。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 支払日, type: common#年月日, required: true }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, equals: reported } ]
        expect: exists
        message: "{id} は報告済みの依頼ではありません"
    do:
      # 受付支部（手数料率）と、達成の報告がある受注を束縛する。1 本の照合では依頼へ戻れないので、each を入れ子にする
      - each:
          from: self
          match:
            - node: { entity: quest }
            - edge: { relation: received-at }
            - node: { entity: branch, bind: b }
          do:
            - each:
                from: self
                match:
                  - node: { entity: quest }
                  - edge: { relation: has-assignment }
                  - node: { entity: assignment, bind: a }
                where: [ { of: a, path: report.outcome, equals: success } ]
                do:
                  - create:
                      schema: payment
                      id: { prefix: "PAY-", digits: 4 }
                      params:
                        assignment: { $copy: id, $of: a }
                        paidOn: $date
                        reward: { $copy: reward, $of: self }
                        commissionRate: { $copy: commissionRate, $of: b }
                        fee: { $value: { divide: [ { multiply: [ { of: self, path: reward }, { of: b, path: commissionRate } ] }, 100 ] } }
                        amount: { $value: { subtract: [ { of: self, path: reward }, { divide: [ { multiply: [ { of: self, path: reward }, { of: b, path: commissionRate } ] }, 100 ] } ] } }
      - insert: { of: self, path: history, value: { date: $date, action: settle-quest, from: reported, to: settled } }
      - set: { of: self, path: status, value: settled }
  - id: reject-quest
    label: 依頼を却下する
    description: 受付の依頼を、ギルドが受け付けないことにします。理由を履歴に残します。報酬を預かっていれば返します（受付料は返しません）。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 却下した日, type: common#年月日, required: true }
      - { key: reason, label: 却下の理由, type: common#一行の文, required: true, minLength: 1 }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, equals: received }]
        expect: exists
        message: "{id} は受付の依頼ではありません（却下できるのは掲示する前の依頼です）"
    do:
      - when: { of: self, path: deposit, exists: true }
        set:
          of: self
          path: refund
          value:
            id: { $format: "{id}-R", $of: self }
            refundedOn: $date
            amount: { $copy: deposit.reward, $of: self }
      - insert: { of: self, path: history, value: { date: $date, action: reject-quest, from: received, to: rejected, note: $reason } }
      - set: { of: self, path: status, value: rejected }
  - id: cancel-quest
    label: 依頼を取り消す
    description: 依頼者が取り下げた依頼を取消にします（受付・掲示中・受注済みの依頼）。理由を履歴に残します。預かった報酬を返します（受付料は返しません）。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 取り消した日, type: common#年月日, required: true }
      - { key: reason, label: 取消の理由, type: common#一行の文, required: true, minLength: 1 }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, oneOf: [received, posted, assigned] } ]
        expect: exists
        message: "{id} は受付・掲示中・受注済みの依頼ではありません"
    do:
      - when: { of: self, path: deposit, exists: true }
        set:
          of: self
          path: refund
          value:
            id: { $format: "{id}-R", $of: self }
            refundedOn: $date
            amount: { $copy: deposit.reward, $of: self }
      - insert: { of: self, path: history, value: { date: $date, action: cancel-quest, from: { $value: { of: self, path: status } }, to: cancelled, note: $reason } }
      - set: { of: self, path: status, value: cancelled }
  - id: expire-quest
    label: 依頼を期限切れにする
    description: 期限を過ぎた掲示中・受注済みの依頼を期限切れにします。理由を履歴に残します。預かった報酬を返します（受付料は返しません）。
    target: { entity: quest }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 期限切れにした日, type: common#年月日, required: true }
      - { key: reason, label: 理由, type: common#一行の文, required: true, minLength: 1, default: 期限までに終わらなかった }
    require:
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: status, oneOf: [posted, assigned] } ]
        expect: exists
        message: "{id} は掲示中・受注済みの依頼ではありません"
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: deadline, exists: true } ]
        expect: exists
        message: "{id} には期限がありません"
      - match: [ { node: { entity: quest, bind: q } } ]
        where: [ { of: q, path: deadline, exists: true } ]
        check: [ { gt: [ $date, { of: q, path: deadline } ] } ]
        message: "{id} の期限はまだ過ぎていません（期限切れにした日 $date）"
    do:
      - when: { of: self, path: deposit, exists: true }
        set:
          of: self
          path: refund
          value:
            id: { $format: "{id}-R", $of: self }
            refundedOn: $date
            amount: { $copy: deposit.reward, $of: self }
      - insert: { of: self, path: history, value: { date: $date, action: expire-quest, from: { $value: { of: self, path: status } }, to: expired, note: $reason } }
      - set: { of: self, path: status, value: expired }
