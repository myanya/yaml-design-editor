id: payment-list
name: 精算の記録
kind: document
description: 報酬を支払った記録です。1 か月 1 ファイル（guild/payments/年-月.yaml）に、支払った順に並べます。
match: "guild/payments/*.yaml"
root:
  type: object
  fields:
    - key: payments
      label: 精算
      type: array
      required: true
      display: table
      methods:
        insert:
          id: { path: id, prefix: "PAY-", digits: 4 }
      item: { type: common#精算 }
constraints:
  - id: payment-reward-matches-quest
    description: 精算の報酬は、依頼の報酬と同じであること
    match:
      - node: { entity: payment, bind: p }
      - edge: { relation: settles }
      - node: { entity: assignment, bind: a }
    also:
      from: a
      steps:
        - edge: { relation: has-assignment, dir: in }
        - node: { entity: quest, bind: q }
    check:
      - eq: [ { number: { of: p, path: reward } }, { number: { of: q, path: reward } } ]
    level: error
    message: "精算「{id}」の報酬 {left} が、依頼 {q.id} の報酬 {right} と違います"
  - id: payment-only-for-settled-quest
    description: 精算するのは、精算済みの依頼の受注だけであること
    match:
      - node: { entity: payment, bind: p }
      - edge: { relation: settles }
      - node: { entity: assignment, bind: a }
    also:
      from: a
      steps:
        - edge: { relation: has-assignment, dir: in }
        - node: { entity: quest, bind: q }
    where:
      - { of: q, path: status, notEquals: settled }
    expect: absent
    level: error
    message: "精算「{id}」の依頼 {q.id} が精算済みになっていません"
  - id: payment-only-for-success
    description: 精算するのは、達成の報告がある受注だけであること
    match:
      - node: { entity: payment, bind: p }
      - edge: { relation: settles }
      - node: { entity: assignment, bind: a }
    where:
      - { or: [ { of: a, path: report, exists: false }, { of: a, path: report.outcome, equals: failure } ] }
    expect: absent
    level: error
    message: "精算「{id}」の受注 {a.id} に、達成の完了報告がありません"
  - id: paid-not-before-report
    description: 支払日は完了報告の日以降であること
    match:
      - node: { entity: payment, bind: p }
      - edge: { relation: settles }
      - node: { entity: assignment, bind: a }
    where:
      - { of: a, path: report.reportedOn, exists: true }
    check:
      - gte: [ { of: p, path: paidOn }, { of: a, path: report.reportedOn } ]
    level: error
