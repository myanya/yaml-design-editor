id: party
name: パーティ
kind: document
description: 冒険者が組むパーティ 1 組を 1 ファイルで管理します。状態（活動中・解散）と、リーダー不在（活動中でリーダーがいない）は、構成員の出入りと解散の操作で変わり、履歴に残します（Q73）。
match: "guild/parties/*.yaml"
filePattern: "guild/parties/{id}.yaml"
root: { type: common#パーティ }
constraints:
  - id: leader-is-member
    description: パーティのリーダーは構成員の 1 人であること（リーダー不在のパーティは対象外）
    match:
      - node: { entity: party, bind: p }
      - edge: { relation: led-by }
      - node: { entity: adventurer, bind: l }
    also:
      from: p
      steps:
        - edge: { relation: has-member }
        - node: { same: l }
    where: [ { of: p, path: leader, exists: true } ]
    expect: exists
    level: error
    message: "パーティ「{id}」のリーダーが構成員にいません"
  # 冒険者が入れるパーティは 1 つまで。パーティの側に出すので、パーティを組む操作の適用前の検証が止められる
  - id: member-in-one-party
    description: 活動中のパーティの構成員は、ほかの活動中のパーティに入っていないこと（冒険者が入れる活動中のパーティは 1 つまで。解散したパーティの構成員は、解散したときの記録）
    match:
      - node: { entity: party, bind: p }
      - edge: { relation: has-member }
      - node: { entity: adventurer, bind: m }
    where: [ { of: p, path: status, equals: active } ]
    check:
      - lte:
          - count:
              all:
                from: m
                of: x
                match:
                  - node: { entity: adventurer }
                  - edge: { relation: has-member, dir: in }
                  - node: { entity: party, bind: x }
                where: [ { of: x, path: status, equals: active } ]
          - 1
    level: error
    message: "パーティ「{id}」の構成員 {m.title} は、ほかの活動中のパーティにも入っています（入れるのは 1 つまで。いま {left} つ）"
  # 脱退・除名・登録の失効で、構成員はパーティから外れる（Q73）。起点をパーティにするので、構成員を加える操作の適用前の検証が止められる
  - id: members-are-current
    description: 活動中のパーティの構成員は、現役か休業の冒険者であること
    match:
      - node: { entity: party, bind: p }
      - edge: { relation: has-member }
      - node: { entity: adventurer, bind: m }
    where:
      - { of: p, path: status, equals: active }
      - { of: m, path: status, oneOf: [withdrawn, expelled] }
    expect: absent
    level: error
    message: "パーティ「{id}」の構成員 {m.title} は脱退か除名です（パーティから外します）"
  # 解散で遂行中の受注が宙に浮かないように（最後の構成員が抜けて解散するときも、この検査が止める）
  - id: dissolved-has-no-open-assignment
    description: 解散したパーティは、遂行中の依頼を受けていないこと
    match:
      - node: { entity: party, bind: p }
      - edge: { relation: taken-by, dir: in }
      - node: { entity: assignment, bind: a }
      - edge: { relation: assignment-of }
      - node: { entity: quest, bind: q }
    where:
      - { of: p, path: status, equals: dissolved }
      - { of: a, path: report, exists: false }
      - { of: q, path: status, equals: assigned }
    expect: absent
    level: error
    message: "パーティ「{id}」は解散したのに、遂行中の依頼 {q.id} を受けています（先に報告か打ち切りで閉じます）"
actions:
  - id: form-party
    label: パーティを組む
    description: パーティを 1 組作ります。番号は PTY- の次の番号を振ります。状態は活動中です。リーダーは構成員に含めます（人数・所属・リーダーの決まりは、適用後の検証が確かめます）。
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: name, label: パーティ名, type: common#一行の文, required: true, minLength: 1 }
      - { key: rank, label: ランク, type: common#ランク参照, required: true }
      - { key: leader, label: リーダー, type: common#冒険者参照, required: true }
      - { key: members, label: 構成員, type: array, required: true, item: { type: common#冒険者参照 } }
      - { key: date, label: 結成日, type: common#年月日, required: true }
    do:
      - create:
          schema: party
          id: { prefix: "PTY-", digits: 3 }
          params:
            name: $name
            rank: $rank
            status: active
            leader: $leader
            members: $members
            formedOn: $date
            history: [ { date: $date, action: form-party, member: $leader } ]
  # ---- 構成員の出入り・リーダー・解散（Q73） ----
  - id: add-member
    label: 構成員を加える
    description: 活動中のパーティに冒険者を加えます。加える冒険者は現役か休業で、ほかの活動中のパーティに入っていないこと（適用後の検証が確かめます）。6 人までです。
    target: { entity: party }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: member, label: 加える冒険者, type: common#冒険者参照, required: true }
      - { key: role, label: 役割, type: common#一行の文 }
      - { key: date, label: 加わった日, type: common#年月日, required: true }
    require:
      - match: [ { node: { entity: party, bind: p } } ]
        where: [ { of: p, path: status, equals: active } ]
        expect: exists
        message: "{id} は活動中のパーティではありません"
    do:
      - insert: { of: self, path: members, value: { to: $member, role: { $copy: role } } }
      - insert: { of: self, path: history, value: { date: $date, action: add-member, member: $member } }
  - id: leave-party
    label: 構成員が抜ける
    description: 構成員が自分の都合でパーティを抜けます。リーダーは抜けられません（先にリーダーを替えます）。最後の 1 人も抜けられません（解散します）。パーティで遂行中の依頼があっても抜けられます（残った構成員で続けます）。脱退・除名・登録の失効のときは、その操作がパーティから外します。
    target: { entity: party }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: member, label: 抜ける冒険者, type: common#冒険者参照, required: true }
      - { key: date, label: 抜けた日, type: common#年月日, required: true }
      - { key: note, label: 覚え, type: common#一行の文 }
    require:
      - match: [ { node: { entity: party, bind: p } } ]
        where: [ { of: p, path: status, equals: active } ]
        expect: exists
        message: "{id} は活動中のパーティではありません"
      - match:
          - node: { entity: party, bind: p }
          - edge: { relation: has-member }
          - node: { entity: adventurer, bind: m }
        where: [ { of: m, path: id, equals: $member } ]
        expect: exists
        message: "$member は {id} の構成員ではありません"
      - match: [ { node: { entity: party, bind: p } } ]
        check: [ { ne: [ { first: [ { of: p, path: leader }, "" ] }, $member ] } ]
        message: リーダーは抜けられません（先に「リーダーを決める」で替えます）
      - match: [ { node: { entity: party, bind: p } } ]
        check:
          - gt:
              - count:
                  all:
                    from: p
                    of: x
                    match:
                      - node: { entity: party }
                      - edge: { relation: has-member }
                      - node: { entity: adventurer, bind: x }
              - 1
        message: 最後の 1 人は抜けられません（「解散する」で解散します）
    do:
      - call: { of: self, method: remove-member, params: { member: $member, date: $date, cause: leave-party, note: { $copy: note } } }
  - id: change-leader
    label: リーダーを決める
    description: 活動中のパーティのリーダーを決めます（替える・リーダー不在のときに決め直す）。新しいリーダーは構成員の 1 人です（適用後の検証が確かめます）。リーダー不在のパーティは、リーダーを決めるまで受注できません。
    target: { entity: party }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: leader, label: 新しいリーダー, type: common#冒険者参照, required: true }
      - { key: date, label: 決めた日, type: common#年月日, required: true }
      - { key: note, label: 覚え, type: common#一行の文 }
    require:
      - match: [ { node: { entity: party, bind: p } } ]
        where: [ { of: p, path: status, equals: active } ]
        expect: exists
        message: "{id} は活動中のパーティではありません"
    do:
      - insert: { of: self, path: history, value: { date: $date, action: change-leader, member: $leader, note: { $copy: note } } }
      - delete: { of: self, path: leaderlessSince }
      - set: { of: self, path: leader, value: $leader }
  - id: dissolve-party
    label: 解散する
    description: 活動中のパーティを、本人たちの都合で解散します。パーティで遂行中の依頼があるうちはできません（先に報告か打ち切りで閉じます）。構成員は、解散したときの記録として残します（ほかのパーティに入れます）。
    target: { entity: party }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 解散した日, type: common#年月日, required: true }
      - { key: note, label: 覚え, type: common#一行の文 }
    require:
      - match: [ { node: { entity: party, bind: p } } ]
        where: [ { of: p, path: status, equals: active } ]
        expect: exists
        message: "{id} は活動中のパーティではありません"
      - match:
          - node: { entity: party }
          - edge: { relation: taken-by, dir: in }
          - node: { entity: assignment, bind: a }
          - edge: { relation: assignment-of }
          - node: { entity: quest, bind: q }
        where:
          - { of: a, path: report, exists: false }
          - { of: q, path: status, equals: assigned }
        expect: absent
        message: "{id} は遂行中の依頼 {q.id} を受けています（先に報告か打ち切りで閉じます）"
    do:
      - insert: { of: self, path: history, value: { date: $date, action: dissolve-party, note: { $copy: note } } }
      - delete: { of: self, path: leaderlessSince }
      - set: { of: self, path: dissolvedOn, value: $date }
      - set: { of: self, path: dissolvedFor, value: personal }
      - set: { of: self, path: status, value: dissolved }
  - id: sanction-party
    label: 処分を下す（注意・受注停止）
    description: パーティに注意か受注停止の処分を下し、処分の記録（SNC- の次の番号）を作ります。受注停止には終わる日を書きます。パーティの受注停止の間は、構成員も個人で受注できません。
    target: { entity: party }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: kind, label: 種類, type: common#注意と受注停止, required: true }
      - { key: regulation, label: 違反した規約, type: common#規約参照, required: true }
      - { key: date, label: 決めた日, type: common#年月日, required: true }
      - { key: until, label: 終わる日, type: common#年月日, description: 受注停止の終わりの日です。 }
      - { key: decidedBy, label: 決めた職員, type: common#職員参照, required: true }
      - { key: reason, label: 理由, type: common#文章, required: true }
    do:
      - create:
          schema: sanction
          id: { prefix: "SNC-", digits: 3 }
          params:
            subject: { $copy: id, $of: self }
            kind: $kind
            regulation: $regulation
            decidedOn: $date
            until: { $copy: until }
            decidedBy: $decidedBy
            reason: $reason
  - id: demote-party
    label: 降格する
    description: パーティに降格の処分を下し、処分の記録（SNC- の次の番号）を作って、ランクを 1 段下げます。降格の後のランクには、いまのランクの 1 段下を入れます（違えば適用後の検証の誤りで止まります）。
    target: { entity: party }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: toRank, label: 降格の後のランク, type: common#ランク参照, required: true }
      - { key: regulation, label: 違反した規約, type: common#規約参照, required: true }
      - { key: date, label: 決めた日, type: common#年月日, required: true }
      - { key: decidedBy, label: 決めた職員, type: common#職員参照, required: true }
      - { key: reason, label: 理由, type: common#文章, required: true }
    require:
      - match:
          - node: { entity: party }
          - edge: { relation: has-rank }
          - node: { entity: rank, bind: r }
        check: [ { gt: [ { of: r, path: order }, 1 ] } ]
        message: "{id} はいちばん下のランクなので、降格できません"
    do:
      - create:
          schema: sanction
          id: { prefix: "SNC-", digits: 3 }
          params:
            subject: { $copy: id, $of: self }
            kind: demotion
            regulation: $regulation
            decidedOn: $date
            fromRank: { $copy: rank, $of: self }
            toRank: $toRank
            decidedBy: $decidedBy
            reason: $reason
      - set: { of: self, path: rank, value: $toRank }
  # パーティの全滅（Q59・Q68）。構成員をまとめて脱退（死亡）にする。パーティで受けた依頼は先に打ち切る（全滅の確認）
  - id: record-wipeout
    label: 全滅を記録する
    description: "全滅が確かめられたパーティの構成員を、まとめて脱退（理由: 死亡）にし、パーティを解散（理由: 全滅）にします。確かめたこと（証言など）を構成員とパーティの履歴に残します。パーティか構成員が遂行中の依頼を受けているうちはできません（先に「遂行を打ち切る」で全滅の確認として打ち切ります）。"
    target: { entity: party }
    input:
      initial:
        date: { $copy: today, $of: context }
    params:
      - { key: date, label: 確かめた日, type: common#年月日, required: true }
      - { key: evidence, label: 確かめたこと, type: common#一行の文, required: true, minLength: 1 }
    require:
      - match: [ { node: { entity: party, bind: p } } ]
        where: [ { of: p, path: status, equals: active } ]
        expect: exists
        message: "{id} は活動中のパーティではありません"
      - match:
          - node: { entity: party }
          - edge: { relation: taken-by, dir: in }
          - node: { entity: assignment, bind: a }
          - edge: { relation: assignment-of }
          - node: { entity: quest, bind: q }
        where:
          - { of: a, path: report, exists: false }
          - { of: q, path: status, equals: assigned }
        expect: absent
        message: "{id} は遂行中の依頼 {q.id} を受けています（先に、全滅の確認として打ち切ります）"
      - match:
          - node: { entity: party }
          - edge: { relation: has-member }
          - node: { entity: adventurer, bind: m }
          - edge: { relation: taken-by, dir: in }
          - node: { entity: assignment, bind: a }
          - edge: { relation: assignment-of }
          - node: { entity: quest, bind: q }
        where:
          - { of: a, path: report, exists: false }
          - { of: q, path: status, equals: assigned }
        expect: absent
        message: "構成員 {m.title} が個人で遂行中の依頼 {q.id} を受けています（先に打ち切ります）"
    do:
      - each:
          from: self
          match:
            - node: { entity: party }
            - edge: { relation: has-member }
            - node: { entity: adventurer, bind: m }
          where: [ { of: m, path: status, oneOf: [active, resting] } ]
          do:
            - insert: { of: m, path: history, value: { date: $date, action: withdraw-adventurer, from: { $value: { of: m, path: status } }, to: withdrawn, note: { $format: "パーティの全滅: {e}", $with: { e: $evidence } } } }
            - delete: { of: m, path: restingSince }
            - set: { of: m, path: leftFor, value: death }
            - set: { of: m, path: status, value: withdrawn }
      - insert: { of: self, path: history, value: { date: $date, action: record-wipeout, note: $evidence } }
      - delete: { of: self, path: leaderlessSince }
      - set: { of: self, path: dissolvedOn, value: $date }
      - set: { of: self, path: dissolvedFor, value: wiped-out }
      - set: { of: self, path: status, value: dissolved }
