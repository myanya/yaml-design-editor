runbooks:
  - id: RUN-WEB
    name: Web経路の障害
    trigger: Canary/5xx/遅延の継続。
    owner: 運用当番
    steps:
      - 利用者影響と直近配備を確認。Canaryの資格情報期限切れと実障害を区別。
      - CloudFront→WAF→ALB→ECS→DBをrequestId/traceIdで追跡。
      - 直近配備が原因なら承認済みdigestへ切戻す。WAFを全解除せず該当Ruleを調査。
      - 復旧後にSLOと通知の解除、業務データの欠損を確認。
    success: Canary成功・エラー率/遅延回復・業務処理の整合確認。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-SESSION
    name: セッション障害
    trigger: Valkey切替・メモリ圧迫・接続異常。
    owner: 運用当番
    steps:
      - DBにある失効台帳を維持し、セッション欠落は再認証させる。
      - primary endpointの再接続、replica/Failover状態、メモリとTTLを確認。
      - noevictionで書込不能なら無制限再試行せずログインを制限し、容量拡張を判断。
      - 切替前のログアウト・権限変更が復活しないことを確認。
    success: 新規ログインと失効が正常。認可を緩める回避策を入れていない。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-QUEUE
    name: キュー滞留・DLQ
    trigger: 最古メッセージ時間またはDLQ件数の超過。
    owner: 運用当番
    steps:
      - eventIdと毒メッセージを特定し、対象の個人情報をログへコピーしない。
      - 外部依存・Worker容量・visibility延長・DBロックを確認。
      - 修正後に重複排除キーを確認して少量ずつredrive。
      - 元件数・成功・再DLQ・重複除外を突合する。
    success: 滞留が解消し二重メール・二重承認・二重課金等がない。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-UPLOAD
    name: 添付検査の停滞
    trigger: 検査失敗・感染・未検査時間の超過。
    owner: 運用当番
    steps:
      - オブジェクトを隔離したままbucket/key/versionIdと申請IDを照合。
      - GuardDutyの結果とKMS/Role/イベント配送の失敗を確認。
      - 感染・未対応・失敗をクリーンと扱わず、利用者へ再提出/別手段を案内。
      - 修正後に指定バージョンを再検査し、承認済み状態だけを昇格。
    success: 未検査・感染オブジェクトが公開されていない。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-SEC
    name: セキュリティ検出
    trigger: GuardDuty/Security Hubの重大Finding、証跡停止。
    owner: セキュリティ当番
    steps:
      - 証拠と時系列を保全し、影響範囲と主体を確認。
      - 侵害主体の権限・セッションを無効化。必要なネットワーク隔離を承認して実施。
      - ログアーカイブとCloudTrailを照合し、秘密情報を更新。
      - 再発防止と復旧承認を記録。機密情報を通知本文に書かない。
    success: 侵害経路を閉じ、証跡が保全され、再発の兆候がない。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-BACKUP
    name: バックアップ失敗
    trigger: バックアップ/コピー失敗または最新復元点が古い。
    owner: 運用当番
    steps:
      - 対象と最後に成功した復元点を確認し、実効RPOを算出。
      - Role/CMK/Organizations/コピー対応リージョンを確認。
      - 再実行後にコピーの完了を待ち、復元可能性を試験。
      - RPO超過をサービスオーナーへ報告し、欠落期間を明示。
    success: 許容RPO内の復元点が別アカウントに存在し復元できる。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-RESTORE
    name: リージョン災害からの復旧
    trigger: 責任者がDR切替を宣言。
    owner: DR責任者
    steps:
      - 本番書込を止める方針と最後の復元点を確定し、二重書込を防ぐ。
      - 大阪の分離環境にNetwork/IAM/KMSと承認済みコンテナを配備。Cognito/IdP/証明書は再構築・設定再投入する。
      - Auroraと添付S3の版を復元し、DB参照先オブジェクトの存在を照合。
      - Secretsを再発行しValkeyを空で起動。全セッションを再認証。
      - スモーク/認可/業務整合試験後にDNS・配信オリジンを切替。復元点の時刻とRTO実測を記録。
      - 復帰も別の承認手順として計画し、二重更新を避ける。
    success: 目標8時間以内の復旧を実測し、失われた更新範囲を利用者へ説明できる。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-DEPLOY
    name: 配備と切戻し
    trigger: 承認されたreleaseIdの本番反映。
    owner: 運用当番
    steps:
      - スキャン結果、IaC差分、DB migrationの互換性、バックアップを確認。
      - ChangeSetと承認を経てrolling更新。circuit breaker/alarmsを有効化。
      - Canaryと業務スモークを確認。異常なら既知のdigestへ切戻す。
      - 破壊的DB変更は自動rollbackに頼らず個別復旧手順を使う。
    success: イメージdigestとChangeSet、試験結果、承認者が追跡できる。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
  - id: RUN-AUDIT
    name: 監査配送の遅延
    trigger: Outboxの最古未配送時刻、ログ欠測。
    owner: 運用当番
    steps:
      - 業務DBの未配送レコード数と最古時刻を確認。
      - S3/KMS/IAMとWorker/Queueの失敗を確認し、正本のOutboxを消さない。
      - 冪等キーを維持して再配送し、DB件数と保管先のイベントIDを照合。
    success: 監査の欠落と重複を識別でき、配送遅延が許容範囲内。
    escalation: 15分以内に着手できない、または影響が拡大する場合はサービス責任者と関係チームへ連絡。経過と判断をインシデント記録へ残す。
