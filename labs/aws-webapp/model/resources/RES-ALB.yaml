id: RES-ALB
name: 内部Application Load Balancer
purpose: APIのTLS入口とヘルスチェック。
resourceType: AWS::ElasticLoadBalancingV2::LoadBalancer
environment: ENV-PROD
stack: STK-APP
logicalId: Alb
properties:
  Type: application
  Scheme: internal
  IpAddressType: ipv4
  Subnets:
    - ref: RES-SUB-APP-A
    - ref: RES-SUB-APP-B
  SecurityGroups:
    - ref: RES-SG-ALB
  LoadBalancerAttributes:
    - Key: idle_timeout.timeout_seconds
      Value: '60'
    - Key: deletion_protection.enabled
      Value: 'true'
    - Key: routing.http.drop_invalid_header_fields.enabled
      Value: 'true'
    - Key: routing.http.desync_mitigation_mode
      Value: defensive
    - Key: access_logs.s3.enabled
      Value: 'true'
    - Key: access_logs.s3.bucket
      Value:
        ref: RES-S3-ALB-LOG
    - Key: access_logs.s3.prefix
      Value: portal/alb
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
