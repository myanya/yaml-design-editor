id: RES-SG-WORKER-OUT-2
name: Worker Security Group 送信 2
purpose: SGの具体的な通信規則。SG本体の相互依存を避けて個別に管理する。
resourceType: AWS::EC2::SecurityGroupEgress
environment: ENV-PROD
stack: STK-NET
logicalId: SgWorkerOut2
properties:
  GroupId:
    ref: RES-SG-WORKER
  IpProtocol: tcp
  FromPort: 443
  ToPort: 443
  CidrIp: 0.0.0.0/0
