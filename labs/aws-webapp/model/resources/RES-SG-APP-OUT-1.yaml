id: RES-SG-APP-OUT-1
name: API Security Group 送信 1
purpose: SGの具体的な通信規則。SG本体の相互依存を避けて個別に管理する。
resourceType: AWS::EC2::SecurityGroupEgress
environment: ENV-PROD
stack: STK-NET
logicalId: SgAppOut1
properties:
  GroupId:
    ref: RES-SG-APP
  IpProtocol: tcp
  FromPort: 5432
  ToPort: 5432
  DestinationSecurityGroupId:
    ref: RES-SG-DB
