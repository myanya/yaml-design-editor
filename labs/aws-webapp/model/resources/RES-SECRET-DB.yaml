id: RES-SECRET-DB
name: DB API接続情報
purpose: 秘密値を設計YAMLに置かない。
resourceType: AWS::SecretsManager::Secret
environment: ENV-PROD
stack: STK-DATA
logicalId: SecretDb
properties:
  Description: Portal credential for portal_api
  KmsKeyId:
    ref: RES-KMS-DATA
    attribute: Arn
  GenerateSecretString:
    SecretStringTemplate: '{"username":"portal_api"}'
    GenerateStringKey: password
    PasswordLength: 40
    ExcludePunctuation: true
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
deletionPolicy: Retain
designNote: DBユーザー作成とSecretのローテーション適用はbootstrap/rotation手順の対象。値はこのYAMLへ保存しない。
