id: ALM-DB
name: DBのCPU負荷
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::CloudWatch::Alarm
environment: ENV-PROD
stack: STK-OPS
logicalId: AlmDb
properties:
  AlarmName: portal-alm-db
  AlarmDescription: DBのCPU負荷
  Namespace: AWS/RDS
  MetricName: CPUUtilization
  Dimensions:
    - Name: DBInstanceIdentifier
      Value:
        ref: RES-DB-A
  Statistic: Average
  Threshold: 80
  Period: 300
  EvaluationPeriods: 3
  DatapointsToAlarm: 3
  ComparisonOperator: GreaterThanThreshold
  TreatMissingData: missing
  ActionsEnabled: true
  AlarmActions:
    - ref: RES-ALERTS
  OKActions:
    - ref: RES-ALERTS
runbook:
  ref: RUN-WEB
  attribute: Literal
