id: RES-SG-DB-OUT-1
name: DB Security Group 送信 1
purpose: SGの具体的な通信規則。SG本体の相互依存を避けて個別に管理する。
resourceType: AWS::EC2::SecurityGroupEgress
environment: ENV-PROD
stack: STK-NET
logicalId: SgDbOut1
properties:
  GroupId:
    ref: RES-SG-DB
  IpProtocol: tcp
  FromPort: 1
  ToPort: 1
  CidrIp: 127.0.0.1/32
