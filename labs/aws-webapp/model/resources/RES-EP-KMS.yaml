id: RES-EP-KMS
name: kms Endpoint
purpose: AWS APIへのプライベート経路。
resourceType: AWS::EC2::VPCEndpoint
environment: ENV-PROD
stack: STK-NET
logicalId: EpKms
properties:
  VpcId:
    ref: RES-VPC
  ServiceName: com.amazonaws.ap-northeast-1.kms
  VpcEndpointType: Interface
  SubnetIds:
    - ref: RES-SUB-APP-A
    - ref: RES-SUB-APP-B
  SecurityGroupIds:
    - ref: RES-SG-ENDPOINT
  PrivateDnsEnabled: true
