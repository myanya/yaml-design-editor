id: ALM-SESSION
name: セッションのメモリ使用率
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::CloudWatch::Alarm
environment: ENV-PROD
stack: STK-OPS
logicalId: AlmSession
properties:
  AlarmName: portal-alm-session
  AlarmDescription: セッションのメモリ使用率
  Namespace: AWS/ElastiCache
  MetricName: DatabaseMemoryUsagePercentage
  Dimensions:
    - Name: CacheClusterId
      Value:
        ref: INPUT-CACHE-PRIMARY-ID
        attribute: Parameter
    - Name: CacheNodeId
      Value: '0001'
  Statistic: Average
  Threshold: 75
  Period: 60
  EvaluationPeriods: 10
  DatapointsToAlarm: 10
  ComparisonOperator: GreaterThanThreshold
  TreatMissingData: missing
  ActionsEnabled: true
  AlarmActions:
    - ref: RES-ALERTS
  OKActions:
    - ref: RES-ALERTS
runbook:
  ref: RUN-SESSION
  attribute: Literal
