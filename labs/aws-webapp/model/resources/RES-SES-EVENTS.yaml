id: RES-SES-EVENTS
name: メール異常の配送
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::SES::ConfigurationSetEventDestination
environment: ENV-PROD
stack: STK-IDENTITY
logicalId: SesEvents
properties:
  ConfigurationSetName:
    ref: RES-SES-CONFIG
  EventDestination:
    Name: delivery-events
    Enabled: true
    MatchingEventTypes:
      - BOUNCE
      - COMPLAINT
      - REJECT
    SnsDestination:
      TopicARN:
        ref: RES-ALERTS
