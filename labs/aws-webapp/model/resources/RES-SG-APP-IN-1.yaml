id: RES-SG-APP-IN-1
name: API Security Group 受信 1
purpose: SGの具体的な通信規則。SG本体の相互依存を避けて個別に管理する。
resourceType: AWS::EC2::SecurityGroupIngress
environment: ENV-PROD
stack: STK-NET
logicalId: SgAppIn1
properties:
  GroupId:
    ref: RES-SG-APP
  IpProtocol: tcp
  FromPort: 8080
  ToPort: 8080
  SourceSecurityGroupId:
    ref: RES-SG-ALB
