id: RES-LOG-WAF
name: aws-waf-logs-portal
purpose: 診断に必要な情報を用途別に保持する。
resourceType: AWS::Logs::LogGroup
environment: ENV-PROD
stack: STK-EDGE-CERT
logicalId: LogWaf
properties:
  LogGroupName: aws-waf-logs-portal
  RetentionInDays: 90
  LogGroupClass: STANDARD
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
deletionPolicy: Retain
