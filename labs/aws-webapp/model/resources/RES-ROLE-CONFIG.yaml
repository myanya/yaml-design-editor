id: RES-ROLE-CONFIG
name: Config記録・配送Role
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::IAM::Role
environment: ENV-PROD
stack: STK-OPS
logicalId: RoleConfig
properties:
  AssumeRolePolicyDocument:
    Version: '2012-10-17'
    Statement:
      - Sid: TrustService
        Effect: Allow
        Principal:
          Service:
            - config.amazonaws.com
        Action:
          - sts:AssumeRole
  MaxSessionDuration: 3600
  Policies:
    - PolicyName: portal-scope
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ConfigurationRead
            Effect: Allow
            Action:
              - ec2:Describe*
              - rds:Describe*
              - elasticloadbalancing:Describe*
              - s3:GetBucket*
              - iam:Get*
              - iam:List*
            Resource:
              - '*'
          - Sid: ConfigurationDelivery
            Effect: Allow
            Action:
              - s3:PutObject
            Resource:
              - ref: RES-S3-ORG-LOG
                attribute: Arn
                suffix: /config/*
          - Sid: ConfigurationBucket
            Effect: Allow
            Action:
              - s3:GetBucketAcl
              - s3:ListBucket
            Resource:
              - ref: RES-S3-ORG-LOG
                attribute: Arn
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
  ManagedPolicyArns:
    - arn:aws:iam::aws:policy/service-role/AWS_ConfigRole
