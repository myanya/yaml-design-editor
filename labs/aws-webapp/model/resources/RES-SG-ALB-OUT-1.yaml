id: RES-SG-ALB-OUT-1
name: ALB Security Group 送信 1
purpose: SGの具体的な通信規則。SG本体の相互依存を避けて個別に管理する。
resourceType: AWS::EC2::SecurityGroupEgress
environment: ENV-PROD
stack: STK-NET
logicalId: SgAlbOut1
properties:
  GroupId:
    ref: RES-SG-ALB
  IpProtocol: tcp
  FromPort: 8080
  ToPort: 8080
  DestinationSecurityGroupId:
    ref: RES-SG-APP
