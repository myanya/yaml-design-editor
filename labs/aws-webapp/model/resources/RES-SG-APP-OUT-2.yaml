id: RES-SG-APP-OUT-2
name: API Security Group 送信 2
purpose: SGの具体的な通信規則。SG本体の相互依存を避けて個別に管理する。
resourceType: AWS::EC2::SecurityGroupEgress
environment: ENV-PROD
stack: STK-NET
logicalId: SgAppOut2
properties:
  GroupId:
    ref: RES-SG-APP
  IpProtocol: tcp
  FromPort: 6379
  ToPort: 6379
  DestinationSecurityGroupId:
    ref: RES-SG-SESSION
