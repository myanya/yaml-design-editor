id: RES-ROLE-EXEC
name: ECS Execution Role
purpose: コンテナ実行と業務APIの権限を分離。
resourceType: AWS::IAM::Role
environment: ENV-PROD
stack: STK-APP
logicalId: RoleExec
properties:
  AssumeRolePolicyDocument:
    Version: '2012-10-17'
    Statement:
      - Sid: TrustService
        Effect: Allow
        Principal:
          Service:
            - ecs-tasks.amazonaws.com
        Action:
          - sts:AssumeRole
  MaxSessionDuration: 3600
  Policies:
    - PolicyName: portal-scope
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcrToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource:
              - '*'
          - Sid: PullImages
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - ref: RES-ECR-API
                attribute: Arn
              - ref: RES-ECR-WORKER
                attribute: Arn
          - Sid: ContainerLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - ref: RES-LOG-API
                attribute: Arn
              - ref: RES-LOG-WORKER
                attribute: Arn
          - Sid: InjectCredentials
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - ref: RES-SECRET-DB
              - ref: RES-SECRET-DB-WORKER
              - ref: RES-SECRET-SESSION
          - Sid: DecryptCredentials
            Effect: Allow
            Action:
              - kms:Decrypt
            Resource:
              - ref: RES-KMS-DATA
                attribute: Arn
          - Sid: CollectorLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - ref: RES-LOG-OTEL
                attribute: Arn
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
