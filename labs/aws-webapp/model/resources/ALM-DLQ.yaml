id: ALM-DLQ
name: DLQの未処理メッセージ
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::CloudWatch::Alarm
environment: ENV-PROD
stack: STK-OPS
logicalId: AlmDlq
properties:
  AlarmName: portal-alm-dlq
  AlarmDescription: DLQの未処理メッセージ
  Namespace: AWS/SQS
  MetricName: ApproximateNumberOfMessagesVisible
  Dimensions:
    - Name: QueueName
      Value:
        ref: RES-DLQ-JOBS
        attribute: QueueName
  Statistic: Maximum
  Threshold: 0
  Period: 60
  EvaluationPeriods: 1
  DatapointsToAlarm: 1
  ComparisonOperator: GreaterThanThreshold
  TreatMissingData: missing
  ActionsEnabled: true
  AlarmActions:
    - ref: RES-ALERTS
  OKActions:
    - ref: RES-ALERTS
runbook:
  ref: RUN-QUEUE
  attribute: Literal
