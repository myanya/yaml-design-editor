id: RES-SCALE-WORKER
name: WORKERのスケール範囲
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::ApplicationAutoScaling::ScalableTarget
environment: ENV-PROD
stack: STK-APP
logicalId: ScaleWorker
properties:
  MinCapacity: 2
  MaxCapacity: 6
  ServiceNamespace: ecs
  ScalableDimension: ecs:service:DesiredCount
  ResourceId:
    ref: RES-SERVICE-WORKER
    attribute: EcsServiceResourceId
