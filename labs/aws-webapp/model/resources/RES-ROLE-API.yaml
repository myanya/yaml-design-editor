id: RES-ROLE-API
name: API Task Role
purpose: コンテナ実行と業務APIの権限を分離。
resourceType: AWS::IAM::Role
environment: ENV-PROD
stack: STK-APP
logicalId: RoleApi
properties:
  AssumeRolePolicyDocument:
    Version: '2012-10-17'
    Statement:
      - Sid: TrustService
        Effect: Allow
        Principal:
          Service:
            - ecs-tasks.amazonaws.com
        Action:
          - sts:AssumeRole
  MaxSessionDuration: 3600
  Policies:
    - PolicyName: portal-scope
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ApiSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - ref: RES-SECRET-DB
              - ref: RES-SECRET-SESSION
          - Sid: QuarantineUpload
            Effect: Allow
            Action:
              - s3:PutObject
            Resource:
              - ref: RES-S3-QUARANTINE
                attribute: Arn
                suffix: /*
          - Sid: ApprovedDownload
            Effect: Allow
            Action:
              - s3:GetObjectVersion
            Resource:
              - ref: RES-S3-FILES
                attribute: Arn
                suffix: /*
          - Sid: OutboxPublish
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource:
              - ref: RES-QUEUE-JOBS
                attribute: Arn
          - Sid: DataEncryption
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource:
              - ref: RES-KMS-DATA
                attribute: Arn
          - Sid: TraceWrite
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource:
              - '*'
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
