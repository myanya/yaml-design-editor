id: RES-ROLE-BUILD
name: ビルド専用Role
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::IAM::Role
environment: ENV-PROD
stack: STK-DELIVERY
logicalId: RoleBuild
properties:
  AssumeRolePolicyDocument:
    Version: '2012-10-17'
    Statement:
      - Sid: TrustService
        Effect: Allow
        Principal:
          Service:
            - codebuild.amazonaws.com
        Action:
          - sts:AssumeRole
  MaxSessionDuration: 3600
  Policies:
    - PolicyName: portal-scope
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BuildArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Resource:
              - ref: RES-S3-ARTIFACT
                attribute: Arn
                suffix: /*
          - Sid: BuildKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource:
              - ref: RES-KMS-DATA
                attribute: Arn
          - Sid: BuildToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource:
              - '*'
          - Sid: BuildPush
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
            Resource:
              - ref: RES-ECR-API
                attribute: Arn
              - ref: RES-ECR-WORKER
                attribute: Arn
          - Sid: BuildLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - ref: RES-LOG-BUILD
                attribute: Arn
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
