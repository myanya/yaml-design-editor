id: RES-SG-ALB-IN-1
name: ALB Security Group 受信 1
purpose: SGの具体的な通信規則。SG本体の相互依存を避けて個別に管理する。
resourceType: AWS::EC2::SecurityGroupIngress
environment: ENV-PROD
stack: STK-NET
logicalId: SgAlbIn1
properties:
  GroupId:
    ref: RES-SG-ALB
  IpProtocol: tcp
  FromPort: 443
  ToPort: 443
  SourcePrefixListId:
    ref: INPUT-CLOUDFRONT-PREFIX
    attribute: Parameter
