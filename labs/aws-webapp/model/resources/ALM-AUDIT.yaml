id: ALM-AUDIT
name: 業務監査Outboxの滞留
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::CloudWatch::Alarm
environment: ENV-PROD
stack: STK-OPS
logicalId: AlmAudit
properties:
  AlarmName: portal-alm-audit
  AlarmDescription: 業務監査Outboxの滞留
  Namespace: Portal/Business
  MetricName: AuditOutboxOldestSeconds
  Dimensions:
    - Name: Environment
      Value: prod
  Statistic: Maximum
  Threshold: 300
  Period: 60
  EvaluationPeriods: 5
  DatapointsToAlarm: 5
  ComparisonOperator: GreaterThanThreshold
  TreatMissingData: missing
  ActionsEnabled: true
  AlarmActions:
    - ref: RES-ALERTS
  OKActions:
    - ref: RES-ALERTS
runbook:
  ref: RUN-AUDIT
  attribute: Literal
