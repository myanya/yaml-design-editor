id: ALM-SEC
name: 重大Security Hub Finding
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::Events::Rule
environment: ENV-PROD
stack: STK-OPS
logicalId: AlmSec
properties:
  Name: portal-alm-sec
  State: ENABLED
  EventPattern:
    source:
      - aws.securityhub
    detail-type:
      - Security Hub Findings - Imported
    detail:
      findings:
        Severity:
          Label:
            - HIGH
            - CRITICAL
        Workflow:
          Status:
            - NEW
            - NOTIFIED
  Targets:
    - Id: Operations
      Arn:
        ref: RES-ALERTS
      RetryPolicy:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 10
      DeadLetterConfig:
        Arn:
          ref: RES-DLQ-EVENT
          attribute: Arn
runbook:
  ref: RUN-SEC
  attribute: Literal
