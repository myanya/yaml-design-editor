id: RES-LOG-OTEL
name: アプリ計測のログ
purpose: 関連するサービス設定を具体化する。
resourceType: AWS::Logs::LogGroup
environment: ENV-PROD
stack: STK-OPS
logicalId: LogOtel
properties:
  LogGroupName: /portal/otel
  RetentionInDays: 30
  KmsKeyId:
    ref: RES-KMS-LOG
    attribute: Arn
  Tags:
    - Key: System
      Value: approval-portal
    - Key: Environment
      Value: prod
    - Key: Owner
      Value: platform-team
    - Key: CostCenter
      Value: IT-PORTAL
deletionPolicy: Retain
