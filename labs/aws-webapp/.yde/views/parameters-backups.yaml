id: parameters-backups
name: Backup Planの全設定表
kind: grid
rows:
  match:
    - node:
        entity: aws-resource
        bind: r
  where:
    - of: r
      path: resourceType
      oneOf:
        - AWS::Backup::BackupPlan
  limit: 10000
columns:
  - label: 名称
    path: name
  - label: BackupPlan
    path: properties.BackupPlan
  - label: BackupPlanTags
    path: properties.BackupPlanTags
  - label: 採用理由
    path: designNote
