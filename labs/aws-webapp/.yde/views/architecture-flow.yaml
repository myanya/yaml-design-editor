projection:
  id: aws-overview
  build:
    nodes:
      $concat:
        - $each: users
          $build:
            key:
              $copy: id
            label: 利用者
            entityType: system
            detail:
              $copy: .
        - $each: services
          $build:
            key:
              $copy: id
            label:
              $copy: name
            entityType: aws-resource
            detail:
              $copy: .
    edges:
      $concat:
        - $each: entry
          $build:
            key:
              $copy: key
            from:
              $copy: from
            to:
              $copy: to
            label:
              $copy: label
            detail:
              $copy: detail
        - $each: static
          $build:
            key:
              $copy: key
            from:
              $copy: from
            to:
              $copy: to
            label:
              $copy: label
            detail:
              $copy: detail
        - $each: originRoute
          $build:
            key:
              $copy: key
            from:
              $copy: from
            to:
              $copy: to
            label:
              $copy: label
            detail:
              $copy: detail
        - $each: forwarding
          $build:
            key:
              $copy: key
            from:
              $copy: from
            to:
              $copy: to
            label:
              $copy: label
            detail:
              $copy: detail
        - $each: database
          $build:
            key:
              $copy: key
            from:
              $copy: from
            to:
              $copy: to
            label:
              $copy: label
            detail:
              $copy: detail
        - $each: session
          $build:
            key:
              $copy: key
            from:
              $copy: from
            to:
              $copy: to
            label:
              $copy: label
            detail:
              $copy: detail
        - $each: identity
          $build:
            key:
              $copy: key
            from:
              $copy: from
