id: architecture-flow
name: 01 WEBアプリの全体構成（設定から導出）
kind: flow
schemaId: aws-system
layout:
  direction: right
sources:
  - id: users
    from:
      match:
        - node:
            entity: system
            bind: u
      limit: 10000
    build:
      $copy: .
  - id: services
    from:
      match:
        - node:
            entity: aws-resource
            bind: r
      where:
        - or:
            - of: r
              path: resourceType
              oneOf:
                - AWS::CloudFront::Distribution
                - AWS::ElasticLoadBalancingV2::LoadBalancer
                - AWS::ECS::Service
                - AWS::RDS::DBCluster
                - AWS::ElastiCache::ReplicationGroup
                - AWS::Cognito::UserPool
                - AWS::SES::EmailIdentity
            - of: r
              path: id
              oneOf:
                - RES-S3-STATIC
                - RES-S3-FILES
                - RES-S3-QUARANTINE
                - RES-S3-AUDIT
                - RES-S3-REPORTS
                - RES-QUEUE-JOBS
                - RES-QUEUE-SCAN
      limit: 10000
    build:
      $copy: .
  - id: entry
    from:
      match:
        - node:
            entity: system
            bind: user
        - edge:
            via: publicDns.ref
            dir: out
        - node:
            entity: aws-resource
            bind: dns
        - edge:
            via: AliasTarget.DNSName.ref
            dir: out
        - node:
            entity: aws-resource
            bind: cdn
      limit: 10000
    build:
      key:
        $format: entry/{a}/{b}
        $with:
          a:
            $copy: id
            $of: user
          b:
            $copy: id
            $of: cdn
      from:
        $copy: id
        $of: user
      to:
        $copy: id
        $of: cdn
      label:
        $copy: publicUrl
        $of: user
      detail:
        user:
          $copy: .
          $of: user
        dns:
          $copy: .
          $of: dns
        cdn:
          $copy: .
          $of: cdn
  - id: static
    from:
      match:
        - node:
            entity: aws-resource
            bind: cdn
        - edge:
            contains: true
            dir: out
        - node:
            entity: origin
            bind: origin
        - edge:
            via: DomainName.ref
            dir: out
        - node:
            entity: aws-resource
            bind: bucket
      where:
        - of: cdn
          path: resourceType
          oneOf:
            - AWS::CloudFront::Distribution
        - of: bucket
          path: resourceType
          oneOf:
            - AWS::S3::Bucket
      limit: 10000
    build:
      key:
        $format: static/{origin}
        $with:
          origin:
            $copy: Id
            $of: origin
      from:
        $copy: id
        $of: cdn
      to:
        $copy: id
        $of: bucket
      label: OAC / 静的ファイル
      detail:
        cdn:
          $copy: .
          $of: cdn
        origin:
          $copy: .
          $of: origin
        bucket:
          $copy: .
          $of: bucket
  - id: originRoute
    from:
      match:
        - node:
            entity: aws-resource
            bind: cdn
        - edge:
            contains: true
            dir: out
        - node:
            entity: origin
            bind: origin
        - edge:
            via: VpcOriginConfig.VpcOriginId.ref
            dir: out
        - node:
            entity: aws-resource
            bind: vpcOrigin
        - edge:
            via: VpcOriginEndpointConfig.Arn.ref
            dir: out
        - node:
            entity: aws-resource
            bind: alb
      where:
        - of: cdn
          path: resourceType
          oneOf:
            - AWS::CloudFront::Distribution
      limit: 10000
    build:
      key:
        $format: originRoute/{origin}
        $with:
          origin:
            $copy: Id
            $of: origin
      from:
        $copy: id
        $of: cdn
      to:
        $copy: id
        $of: alb
      label:
        $format: VPC Origin / {protocol}
        $with:
          protocol:
            $copy: properties.VpcOriginEndpointConfig.OriginProtocolPolicy
            $of: vpcOrigin
      detail:
        cdn:
          $copy: .
          $of: cdn
        origin:
          $copy: .
          $of: origin
        vpcOrigin:
          $copy: .
          $of: vpcOrigin
        alb:
          $copy: .
          $of: alb
  - id: forwarding
    from:
      match:
        - node:
            entity: aws-resource
            bind: alb
        - edge:
            via: LoadBalancerArn.ref
            dir: in
        - node:
            entity: aws-resource
            bind: listener
        - edge:
            via: ListenerArn.ref
            dir: in
        - node:
            entity: aws-resource
            bind: rule
        - edge:
            via: Actions.TargetGroupArn.ref
            dir: out
        - node:
            entity: aws-resource
            bind: tg
        - edge:
            via: LoadBalancers.TargetGroupArn.ref
            dir: in
        - node:
            entity: aws-resource
            bind: service
      where:
        - of: alb
          path: resourceType
          oneOf:
            - AWS::ElasticLoadBalancingV2::LoadBalancer
        - of: service
          path: resourceType
          oneOf:
            - AWS::ECS::Service
      limit: 10000
    build:
      key:
        $format: forward/{rule}/{service}
        $with:
          rule:
            $copy: id
            $of: rule
          service:
            $copy: id
            $of: service
      from:
        $copy: id
        $of: alb
      to:
        $copy: id
        $of: service
      label:
        $format: 優先度 {priority} / {protocol}:{port}
        $with:
          priority:
            $copy: properties.Priority
            $of: rule
          protocol:
            $copy: properties.Protocol
            $of: tg
          port:
            $copy: properties.Port
            $of: tg
      detail:
        alb:
          $copy: .
          $of: alb
        listener:
          $copy: .
          $of: listener
        rule:
          $copy: .
          $of: rule
        tg:
          $copy: .
          $of: tg
        service:
          $copy: .
          $of: service
  - id: database
    from:
      match:
        - node:
            entity: aws-resource
            bind: service
        - edge:
            via: TaskDefinition.ref
            dir: out
        - node:
            entity: aws-resource
            bind: task
        - edge:
            via: Environment.Value.ref
            dir: out
        - node:
            entity: application-settings
            bind: app
        - edge:
            via: settings.database.cluster.ref
            dir: out
        - node:
            entity: aws-resource
            bind: target
      where:
        - of: service
          path: resourceType
          oneOf:
            - AWS::ECS::Service
      limit: 10000
    build:
      key:
        $format: database/{a}/{b}
        $with:
          a:
            $copy: id
            $of: service
          b:
            $copy: id
            $of: target
      from:
        $copy: id
        $of: service
      to:
        $copy: id
        $of: target
      label: PostgreSQL / TLS
      detail:
        service:
          $copy: .
          $of: service
        task:
          $copy: .
          $of: task
        app:
          $copy: .
          $of: app
        target:
          $copy: .
          $of: target
