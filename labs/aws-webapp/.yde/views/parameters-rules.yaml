id: parameters-rules
name: 転送Ruleの全設定表
kind: grid
rows:
  match:
    - node:
        entity: aws-resource
        bind: r
  where:
    - of: r
      path: resourceType
      oneOf:
        - AWS::ElasticLoadBalancingV2::ListenerRule
  limit: 10000
columns:
  - label: 名称
    path: name
  - label: ListenerArn
    path: properties.ListenerArn
  - label: Priority
    path: properties.Priority
    editable: true
  - label: Conditions
    path: properties.Conditions
  - label: Actions
    path: properties.Actions
  - label: 採用理由
    path: designNote
