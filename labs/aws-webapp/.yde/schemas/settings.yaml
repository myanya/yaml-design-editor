          bind: r
      - edge:
          via: stack
          dir: out
      - node:
          entity: stack
          bind: s
    check:
      - eq:
          - of: r
            path: environment
          - of: s
            path: environment
    level: error
    message: 資源の環境と配備単位の環境を一致させる
    limit: 10000
