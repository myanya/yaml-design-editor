    match:
      - node:
          entity: aws-resource
          bind: r
      - edge:
          via: Subnets.ref
          dir: out
      - node:
          entity: aws-resource
          bind: a
      - edge:
          via: Subnets.ref
          dir: in
      - node:
          same: r
      - edge:
          via: Subnets.ref
          dir: out
      - node:
          entity: aws-resource
          bind: b
    check:
      - or:
          - eq:
              - of: a
                path: id
              - of: b
                path: id
          - ne:
              - of: a
                path: properties.AvailabilityZoneId.ref
              - of: b
                path: properties.AvailabilityZoneId.ref
