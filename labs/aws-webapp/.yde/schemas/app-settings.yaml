definitions:
  binding:
    type: object
    unknownFields: error
    fields:
      - key: ref
        label: 参照先
        type: ref
        relation: uses
      - key: attribute
        label: 展開する属性
        type: string
        default: Ref
      - key: suffix
        label: 属性に付ける末尾
        type: string
      - key: literal
        label: 固定文字列
        type: string
    constraints:
      - id: binding-present
        description: 参照先か固定文字列のいずれかを指定する
        where:
          - path: ref
            exists: false
          - path: literal
            exists: false
        expect: absent
        level: error
      - id: binding-exclusive
        description: 参照先と固定文字列を同時に指定しない
        where:
          - path: ref
            exists: true
          - path: literal
            exists: true
        expect: absent
        level: error
constraints:
  - id: session-expiry
    description: 無操作TTLを最大TTL以下にする
    match:
      - node:
          entity: application-settings
          bind: a
    where:
      - of: a
        path: profile
        equals: api
    check:
      - lte:
          - of: a
            path: settings.session.idleTtlSeconds
          - of: a
            path: settings.session.absoluteTtlSeconds
      - eq:
          - of: a
            path: settings.session.tls
          - 'true'
      - eq:
          - of: a
            path: settings.session.cookie.secure
          - 'true'
      - eq:
          - of: a
            path: settings.session.cookie.httpOnly
          - 'true'
    level: error
  - id: database-port
    description: アプリとAuroraのDB接続ポートを一致させる
    match:
      - node:
          entity: application-settings
          bind: a
      - edge:
          via: database.cluster.ref
          dir: out
      - node:
          entity: aws-resource
          bind: db
    check:
      - eq:
          - of: a
            path: settings.database.port
          - of: db
            path: properties.Port
    level: error
