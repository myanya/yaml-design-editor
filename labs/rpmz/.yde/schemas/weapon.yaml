id: weapon
name: 武器
kind: document
description: 武器 1 つを 1 ファイルで管理します。
match: "db/weapons/*.yaml"
filePattern: "db/weapons/{id}.yaml"
definitions:
  武器:
    type: object
    label: 武器
    entity: { type: weapon, defines: true }
    fields:
      - { key: id, label: 武器ID, type: common#武器ID, required: true }
      - { key: name, label: 名前, type: line, role: title, description: 名前の無い項目は、MZ の空きの番号です。 }
      - { key: iconIndex, label: アイコン, type: common#アイコン番号, default: 0 }
      - { key: iconImage, label: アイコンの画像（YDE だけ）, type: common#アイコン画像 }
      - { key: description, label: 説明, type: text, rows: 2 }
      - { key: wtypeId, label: 武器タイプ, type: common#武器タイプ参照, description: 書かなければ「なし」（MZ の 0。空きの番号の武器）。 }
      - { key: etypeId, label: 装備タイプ, type: common#装備タイプ参照, required: true, default: ETY-01 }
      - { key: price, label: 価格, type: common#価格, default: 0 }
      - { key: animationId, label: アニメーション, type: common#アニメーション参照 }
      - { key: params, label: 能力値の変化, type: parts#能力値 }
      - { key: traits, label: 特徴, type: array, display: list, item: { type: parts#特徴 } }
      - { key: note, label: メモ, type: common#メモ }
root: { type: 武器 }
