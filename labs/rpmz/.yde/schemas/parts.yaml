id: parts
name: 部品の型
kind: library
description: |
  MZ のデータベースの部品（特徴・使用効果・ダメージ・能力値・成長・行動パターン・ドロップなど）と、
  一覧の要素（属性・タイプ・MZ が持つものの番号と名前・特別な値）の形です。
  特徴と使用効果は、MZ と同じく「種類（code）」で中身が決まります。種類を選ぶと、dataId と値の項目がその種類のものに変わります。
definitions:
  # ---- 特徴（traits）: アクター・職業・武器・防具・敵キャラ・ステート ----
  # 種類（code）を選ぶと、その種類の項目（dataId と値）が出ます。MZ が使わない値は、取り込んだときだけ持ちます（unknownFields: allow）
  特徴:
    type: object
    label: 特徴
    unknownFields: allow
    fields:
      - key: code
        label: 種類
        type: enum
        role: title
        required: true
        values:
          - { value: 11, label: 属性有効度, description: 属性のダメージの倍率 }
          - { value: 12, label: 弱体有効度, description: 能力値の弱体がかかる倍率 }
          - { value: 13, label: ステート有効度, description: ステートがかかる倍率 }
          - { value: 14, label: ステート無効化, description: ステートにかからない }
          - { value: 21, label: 通常能力値, description: 能力値の倍率 }
          - { value: 22, label: 追加能力値, description: 命中率などへの加算 }
          - { value: 23, label: 特殊能力値, description: 狙われ率などの倍率 }
          - { value: 31, label: 攻撃時属性, description: 通常攻撃の属性 }
          - { value: 32, label: 攻撃時ステート, description: 通常攻撃で付加するステート }
          - { value: 33, label: 攻撃速度補正, description: 通常攻撃の速度 }
          - { value: 34, label: 攻撃追加回数, description: 通常攻撃の回数 }
          - { value: 35, label: 攻撃スキル, description: 通常攻撃に使うスキル }
          - { value: 41, label: スキルタイプ追加, description: 使えるスキルタイプ }
          - { value: 42, label: スキルタイプ封印, description: 使えなくするスキルタイプ }
          - { value: 43, label: スキル追加, description: 使えるスキル }
          - { value: 44, label: スキル封印, description: 使えなくするスキル }
          - { value: 51, label: 武器タイプ装備, description: 装備できる武器タイプ }
          - { value: 52, label: 防具タイプ装備, description: 装備できる防具タイプ }
          - { value: 53, label: 装備固定, description: 外せない装備欄 }
          - { value: 54, label: 装備封印, description: 使えない装備欄 }
          - { value: 55, label: スロットタイプ, description: 通常か二刀流 }
          - { value: 61, label: 行動回数追加, description: 1 ターンにもう一度行動する確率 }
          - { value: 62, label: 特殊フラグ, description: 自動戦闘・防御・身代わり・TP持ち越し }
          - { value: 63, label: 消滅エフェクト, description: 敵キャラが倒れたときの消え方 }
          - { value: 64, label: パーティ能力, description: エンカウント半減など }
        cases:
          11: [ { key: dataId, label: 属性, type: common#属性参照, role: subtitle, required: true }, { key: value, label: 倍率, type: common#倍率, required: true } ]
          12: [ { key: dataId, label: 能力値, type: common#通常能力値, role: subtitle, required: true }, { key: value, label: 倍率, type: common#倍率, required: true } ]
          13: [ { key: dataId, label: ステート, type: common#ステート参照, role: subtitle, required: true }, { key: value, label: 倍率, type: common#倍率, required: true } ]
          14: [ { key: dataId, label: ステート, type: common#ステート参照, role: subtitle, required: true } ]
          21: [ { key: dataId, label: 能力値, type: common#通常能力値, role: subtitle, required: true }, { key: value, label: 倍率, type: common#倍率, required: true } ]
          22: [ { key: dataId, label: 能力値, type: common#追加能力値, role: subtitle, required: true }, { key: value, label: 加算, type: common#加算率, required: true } ]
          23: [ { key: dataId, label: 能力値, type: common#特殊能力値, role: subtitle, required: true }, { key: value, label: 倍率, type: common#倍率, required: true } ]
          31: [ { key: dataId, label: 属性, type: common#属性参照, role: subtitle, required: true } ]
          32: [ { key: dataId, label: ステート, type: common#ステート参照, relation: inflicts, role: subtitle, required: true }, { key: value, label: 確率, type: common#確率, required: true } ]
          33: [ { key: value, label: 速度, type: int, required: true } ]
          34: [ { key: value, label: 回数, type: int, required: true } ]
          35: [ { key: dataId, label: スキル, type: common#スキル参照, role: subtitle, required: true } ]
          41: [ { key: dataId, label: スキルタイプ, type: common#スキルタイプ参照, role: subtitle, required: true } ]
          42: [ { key: dataId, label: スキルタイプ, type: common#スキルタイプ参照, role: subtitle, required: true } ]
          43: [ { key: dataId, label: スキル, type: common#スキル参照, role: subtitle, required: true } ]
          44: [ { key: dataId, label: スキル, type: common#スキル参照, role: subtitle, required: true } ]
          51: [ { key: dataId, label: 武器タイプ, type: common#武器タイプ参照, role: subtitle, required: true } ]
          52: [ { key: dataId, label: 防具タイプ, type: common#防具タイプ参照, role: subtitle, required: true } ]
          53: [ { key: dataId, label: 装備タイプ, type: common#装備タイプ参照, role: subtitle, required: true } ]
          54: [ { key: dataId, label: 装備タイプ, type: common#装備タイプ参照, role: subtitle, required: true } ]
          55: [ { key: dataId, label: スロットタイプ, type: common#スロットタイプ, role: subtitle, required: true } ]
          61: [ { key: value, label: 確率, type: common#確率, required: true } ]
          62: [ { key: dataId, label: フラグ, type: common#特殊フラグ, role: subtitle, required: true } ]
          63: [ { key: dataId, label: エフェクト, type: common#消滅エフェクト, role: subtitle, required: true } ]
          64: [ { key: dataId, label: 能力, type: common#パーティ能力, role: subtitle, required: true } ]

  # ---- 使用効果（effects）: スキル・アイテム ----
  使用効果:
    type: object
    label: 使用効果
    unknownFields: allow
    fields:
      - key: code
        label: 種類
        type: enum
        role: title
        required: true
        values:
          - { value: 11, label: HP回復 }
          - { value: 12, label: MP回復 }
          - { value: 13, label: TP増加 }
          - { value: 21, label: ステート付加 }
          - { value: 22, label: ステート解除 }
          - { value: 31, label: 強化 }
          - { value: 32, label: 弱体 }
          - { value: 33, label: 強化の解除 }
          - { value: 34, label: 弱体の解除 }
          - { value: 41, label: 特殊効果 }
          - { value: 42, label: 成長 }
          - { value: 43, label: スキル習得 }
          - { value: 44, label: コモンイベント }
        cases:
          11: [ { key: value1, label: 割合, type: common#倍率, required: true }, { key: value2, label: 固定値, type: int, required: true } ]
          12: [ { key: value1, label: 割合, type: common#倍率, required: true }, { key: value2, label: 固定値, type: int, required: true } ]
          13: [ { key: value1, label: TP の量, type: int, required: true } ]
          21: [ { key: dataId, label: ステート, type: common#付加するステート参照, relation: inflicts, role: subtitle, required: true }, { key: value1, label: 確率, type: common#確率, required: true } ]
          22: [ { key: dataId, label: ステート, type: common#ステート参照, relation: removes, role: subtitle, required: true }, { key: value1, label: 確率, type: common#確率, required: true } ]
          31: [ { key: dataId, label: 能力値, type: common#通常能力値, role: subtitle, required: true }, { key: value1, label: ターン数, type: int, min: 1, required: true } ]
          32: [ { key: dataId, label: 能力値, type: common#通常能力値, role: subtitle, required: true }, { key: value1, label: ターン数, type: int, min: 1, required: true } ]
          33: [ { key: dataId, label: 能力値, type: common#通常能力値, role: subtitle, required: true } ]
          34: [ { key: dataId, label: 能力値, type: common#通常能力値, role: subtitle, required: true } ]
          41: [ { key: dataId, label: 特殊効果, type: enum, values: [ { value: 0, label: 逃げる } ], role: subtitle, required: true } ]
          42: [ { key: dataId, label: 能力値, type: common#通常能力値, role: subtitle, required: true }, { key: value1, label: 上がる量, type: int, required: true } ]
          43: [ { key: dataId, label: スキル, type: common#スキル参照, role: subtitle, required: true } ]
          44: [ { key: dataId, label: コモンイベント, type: common#コモンイベント参照, role: subtitle, required: true } ]

  # ---- ダメージ: スキル・アイテム ----
  ダメージ:
    type: object
    label: ダメージ
    fields:
      - { key: type, label: タイプ, type: common#ダメージタイプ, required: true, default: 0 }
      - { key: elementId, label: 属性, type: common#ダメージの属性参照 }
      - { key: formula, label: 計算式, type: common#ダメージ計算式 }
      - { key: variance, label: 分散度, type: int, min: 0, max: 100, default: 20, description: 結果を上下に揺らす幅（%）。 }
      - { key: critical, label: 会心, type: boolean, default: false }
    constraints:
      - id: formula-when-damage
        description: ダメージタイプが「なし」以外なら、計算式があること
        where: [ { path: type, notEquals: 0 }, { path: formula, empty: true } ]
        expect: absent
        level: error
        message: ダメージの計算式がありません（ダメージタイプが「なし」以外のときに要ります）

  # ---- 能力値（params）: 武器・防具は加算、敵キャラは値そのもの ----
  能力値:
    type: object
    label: 能力値
    description: MZ では 8 個の数の並び（params）です。書かなければ 0 です。
    fields:
      - { key: mhp, label: 最大HP, type: int }
      - { key: mmp, label: 最大MP, type: int }
      - { key: atk, label: 攻撃力, type: int }
      - { key: def, label: 防御力, type: int }
      - { key: mat, label: 魔法力, type: int }
      - { key: mdf, label: 魔法防御, type: int }
      - { key: agi, label: 敏捷性, type: int }
      - { key: luk, label: 運, type: int }

  # ---- 職業 ----
  成長:
    type: object
    label: レベルごとの能力値
    description: MZ では能力値ごとの 100 個の並び（params）です。ここではレベルを行にします。
    fields:
      - { key: level, label: レベル, type: int, min: 1, max: 99, required: true }
      - { key: mhp, label: 最大HP, type: int, min: 1, required: true }
      - { key: mmp, label: 最大MP, type: int, min: 0, required: true }
      - { key: atk, label: 攻撃力, type: int, min: 1, required: true }
      - { key: def, label: 防御力, type: int, min: 1, required: true }
      - { key: mat, label: 魔法力, type: int, min: 1, required: true }
      - { key: mdf, label: 魔法防御, type: int, min: 1, required: true }
      - { key: agi, label: 敏捷性, type: int, min: 1, required: true }
      - { key: luk, label: 運, type: int, min: 1, required: true }
  経験値曲線:
    type: object
    label: 経験値曲線
    description: MZ では 4 個の数の並び（expParams）です。
    fields:
      - { key: basis, label: 基本値, type: int, min: 10, max: 50, default: 30 }
      - { key: extra, label: 補正値, type: int, min: 0, max: 40, default: 20 }
      - { key: accA, label: 増加度A, type: int, min: 10, max: 50, default: 30 }
      - { key: accB, label: 増加度B, type: int, min: 10, max: 50, default: 30 }
  習得スキル:
    type: object
    label: 習得スキル
    fields:
      - { key: level, label: レベル, type: int, min: 1, max: 99, required: true }
      - { key: skillId, label: スキル, type: common#スキル参照, relation: learns, required: true }
      - { key: note, label: メモ, type: line }

  # ---- 敵キャラ ----
  行動パターン:
    type: object
    label: 行動パターン
    fields:
      - { key: skillId, label: スキル, type: common#スキル参照, relation: uses, role: title, required: true }
      - { key: rating, label: レーティング, type: int, min: 1, max: 9, default: 5, required: true }
      - key: conditionType
        label: 条件
        type: enum
        role: subtitle
        required: true
        default: 0
        values:
          - { value: 0, label: 常時 }
          - { value: 1, label: ターン, description: ターン A ＋ B × X のとき }
          - { value: 2, label: HP, description: HP が割合の範囲のとき }
          - { value: 3, label: MP, description: MP が割合の範囲のとき }
          - { value: 4, label: ステート, description: ステートにかかっているとき }
          - { value: 5, label: パーティLv, description: パーティの最高レベルがこれ以上のとき }
          - { value: 6, label: スイッチ, description: スイッチが ON のとき }
        cases:
          1: [ { key: conditionParam1, label: ターン A, type: int, min: 0, required: true }, { key: conditionParam2, label: ターン B, type: int, min: 0, required: true } ]
          2: [ { key: conditionParam1, label: 下限, type: common#確率, required: true }, { key: conditionParam2, label: 上限, type: common#確率, required: true } ]
          3: [ { key: conditionParam1, label: 下限, type: common#確率, required: true }, { key: conditionParam2, label: 上限, type: common#確率, required: true } ]
          4: [ { key: conditionParam1, label: ステート, type: common#ステート参照, required: true } ]
          5: [ { key: conditionParam1, label: レベル, type: int, min: 1, required: true } ]
          6: [ { key: conditionParam1, label: スイッチ, type: common#スイッチ参照, required: true } ]
  ドロップアイテム:
    type: object
    label: ドロップアイテム
    description: MZ では 3 つの枠があり、使わない枠は「なし」です。ここでは使う枠だけを書きます。
    fields:
      - key: kind
        label: 種類
        type: enum
        role: subtitle
        required: true
        values: [ { value: 1, label: アイテム }, { value: 2, label: 武器 }, { value: 3, label: 防具 } ]
        cases:
          1: [ { key: dataId, label: アイテム, type: common#アイテム参照, relation: drops, role: title, required: true } ]
          2: [ { key: dataId, label: 武器, type: common#武器参照, relation: drops, role: title, required: true } ]
          3: [ { key: dataId, label: 防具, type: common#防具参照, relation: drops, role: title, required: true } ]
      - { key: denominator, label: 出現率（1/N の N）, type: int, min: 1, required: true, default: 1 }

  # ---- 敵グループ ----
  構成員:
    type: object
    label: 敵グループの構成員
    fields:
      - { key: enemyId, label: 敵キャラ, type: common#敵キャラ参照, relation: has-member, required: true }
      - { key: x, label: X 座標, type: int, required: true }
      - { key: y, label: Y 座標, type: int, required: true }
      - { key: hidden, label: 途中から出現, type: boolean, default: false }

  # ---- 一覧の要素 ----
  属性:
    type: object
    label: 属性
    entity: { type: element, defines: true }
    fields:
      - { key: id, label: 属性ID, type: common#属性ID, required: true }
      - { key: name, label: 名前, type: line, role: title, required: true }
  スキルタイプ:
    type: object
    label: スキルタイプ
    entity: { type: skill-type, defines: true }
    fields:
      - { key: id, label: スキルタイプID, type: common#スキルタイプID, required: true }
      - { key: name, label: 名前, type: line, role: title, required: true }
      - { key: magic, label: 魔法スキル, type: boolean, default: false, description: MZ の「魔法スキル」（システム 1）。サイドビューで詠唱のモーションになります。 }
  武器タイプ:
    type: object
    label: 武器タイプ
    entity: { type: weapon-type, defines: true }
    fields:
      - { key: id, label: 武器タイプID, type: common#武器タイプID, required: true }
      - { key: name, label: 名前, type: line, role: title, required: true }
      - { key: motion, label: 攻撃モーション, type: common#攻撃モーション, default: 0 }
      - { key: weaponImageId, label: 武器画像, type: int, min: 0, default: 0, description: サイドビューの武器画像の番号（画像は MZ 側）。 }
  防具タイプ:
    type: object
    label: 防具タイプ
    entity: { type: armor-type, defines: true }
    fields:
      - { key: id, label: 防具タイプID, type: common#防具タイプID, required: true }
      - { key: name, label: 名前, type: line, role: title, required: true }
  装備タイプ:
    type: object
    label: 装備タイプ
    entity: { type: equip-type, defines: true }
    fields:
      - { key: id, label: 装備タイプID, type: common#装備タイプID, required: true }
      - { key: name, label: 名前, type: line, role: title, required: true }
  アニメーション:
    type: object
    label: アニメーション
    entity: { type: animation, defines: true }
    fields:
      - { key: id, label: アニメーションID, type: common#アニメーションID, required: true }
      - { key: name, label: 名前, type: line, role: title }
  コモンイベント:
    type: object
    label: コモンイベント
    entity: { type: common-event, defines: true }
    fields:
      - { key: id, label: コモンイベントID, type: common#コモンイベントID, required: true }
      - { key: name, label: 名前, type: line, role: title }
  スイッチ:
    type: object
    label: スイッチ
    entity: { type: switch, defines: true }
    fields:
      - { key: id, label: スイッチID, type: common#スイッチID, required: true }
      - { key: name, label: 名前, type: line, role: title }
  変数:
    type: object
    label: 変数
    entity: { type: variable, defines: true }
    fields:
      - { key: id, label: 変数ID, type: common#変数ID, required: true }
      - { key: name, label: 名前, type: line, role: title }
  特別な値:
    type: object
    label: 特別な値
    entity: { type: special, defines: true }
    fields:
      - { key: id, label: ID, type: common#特別な値ID, required: true }
      - { key: name, label: 名前, type: line, role: title, required: true }
      - { key: mzValue, label: MZ の値, type: int, required: true, description: 書き出すときに MZ に書く数（-1 か 0）。 }
