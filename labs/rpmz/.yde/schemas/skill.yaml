id: skill
name: スキル
kind: document
description: スキル 1 つを 1 ファイルで管理します。1 番は通常攻撃、2 番は防御に使われます（MZ のエンジンの約束）。
match: "db/skills/*.yaml"
filePattern: "db/skills/{id}.yaml"
definitions:
  スキル:
    type: object
    label: スキル
    entity: { type: skill, defines: true }
    fields:
      - { key: id, label: スキルID, type: common#スキルID, required: true }
      - { key: name, label: 名前, type: line, role: title, required: true }
      - { key: iconIndex, label: アイコン, type: common#アイコン番号, default: 0 }
      - { key: description, label: 説明, type: text, rows: 2 }
      - { key: stypeId, label: スキルタイプ, type: common#スキルタイプ参照, description: 書かなければ「なし」（MZ の 0）。 }
      - { key: mpCost, label: 消費MP, type: int, min: 0, max: 9999, default: 0 }
      - { key: tpCost, label: 消費TP, type: int, min: 0, max: 100, default: 0 }
      - { key: scope, label: 範囲, type: common#効果範囲, required: true, default: 1 }
      - { key: occasion, label: 使用可能時, type: common#使用可能時, required: true, default: 1 }
      - { key: speed, label: 速度補正, type: int, min: -2000, max: 2000, default: 0 }
      - { key: successRate, label: 成功率, type: int, min: 0, max: 100, default: 100 }
      - { key: repeats, label: 連続回数, type: int, min: 1, max: 9, default: 1 }
      - { key: tpGain, label: 得TP, type: int, min: 0, max: 100, default: 0 }
      - { key: hitType, label: 命中タイプ, type: common#命中タイプ, required: true, default: 1 }
      - { key: animationId, label: アニメーション, type: common#使用時のアニメーション参照 }
      - { key: messageType, label: メッセージの形式, type: int, default: 1, description: MZ のメッセージの形式（通常は 1）。 }
      - { key: message1, label: メッセージ, type: line, description: "%1 は使用者、%2 はスキル名に置き換わります。" }
      - { key: message2, label: メッセージ（2 行目）, type: line }
      - { key: requiredWtypeId1, label: 必要武器 1, type: common#武器タイプ参照 }
      - { key: requiredWtypeId2, label: 必要武器 2, type: common#武器タイプ参照 }
      - { key: damage, label: ダメージ, type: parts#ダメージ }
      - { key: effects, label: 使用効果, type: array, item: { type: parts#使用効果 } }
      - { key: note, label: メモ, type: common#メモ }
root: { type: スキル }
