id: actor
name: アクター
kind: document
description: アクター 1 人を 1 ファイルで管理します。ファイル名は ID です（db/actors/ACT-0001.yaml）。
match: "db/actors/*.yaml"
filePattern: "db/actors/{id}.yaml"
definitions:
  アクター:
    type: object
    label: アクター
    entity: { type: actor, defines: true }
    fields:
      - { key: id, label: アクターID, type: common#アクターID, required: true }
      - { key: name, label: 名前, type: line, role: title, description: 名前の無い項目は、MZ の空きの番号です。 }
      - { key: nickname, label: 二つ名, type: line, role: subtitle }
      - { key: classId, label: 職業, type: common#職業参照, relation: has-class, required: true }
      - { key: initialLevel, label: 初期レベル, type: int, min: 1, max: 99, required: true, default: 1 }
      - { key: maxLevel, label: 最大レベル, type: int, min: 1, max: 99, required: true, default: 99 }
      - { key: profile, label: プロフィール, type: text, rows: 2 }
      - { key: characterName, label: 歩行キャラ, type: common#歩行キャラ画像 }
      - { key: characterIndex, label: 歩行キャラの番号, type: int, min: 0, max: 7, default: 0 }
      - { key: faceName, label: 顔, type: common#顔画像 }
      - { key: faceIndex, label: 顔の番号, type: int, min: 0, max: 7, default: 0 }
      - { key: battlerName, label: サイドビューの戦闘キャラ, type: common#SV戦闘キャラ画像 }
      - key: equips
        label: 初期装備
        type: array
        description: 装備タイプの並びの順（1 番目が武器）。空の欄は ~ と書きます。
        item: { type: common#装備品参照, relation: equips }
      - { key: traits, label: 特徴, type: array, display: list, item: { type: parts#特徴 } }
      - { key: note, label: メモ, type: common#メモ }
    constraints:
      - id: initial-level-within-max
        description: 初期レベルは最大レベル以下であること
        check: [ { lte: [ { path: initialLevel }, { path: maxLevel } ] } ]
        level: error
root: { type: アクター }
# 他の要素へ線を辿る検査（スキーマの constraints）
# 初期装備が職業で装備できるか。MZ と同じく、武器は武器タイプ・防具は防具タイプを、職業の特徴（武器タイプ装備・防具タイプ装備）で見る。
# 「装備した武器の数」と「職業が装備できるタイプの武器の数」が同じなら、どれも装備できる（アクター自身や装備品の特徴で足したタイプは見ない）。
# MZ はゲームの開始時に、装備できない初期装備を黙って外すので、警告にする（MZ の既定のデータにも 1 件ある）
constraints:
  - id: initial-weapons-allowed-by-class
    description: 初期装備の武器は、職業の特徴「武器タイプ装備」のタイプであること
    match: [ { node: { entity: actor, bind: a } } ]
    check:
      - eq:
          - count:
              all:
                from: a
                match: [ { node: { entity: actor } }, { edge: { relation: equips } }, { node: { entity: weapon, bind: w } } ]
                of: w
          - count:
              all:
                from: a
                match:
                  - node: { entity: actor, bind: me }
                  - edge: { relation: equips }
                  - node: { entity: weapon, bind: w }
                  - edge: { via: wtypeId }
                  - node: { entity: weapon-type }
                  - edge: { via: dataId, dir: in }
                  - node: { entity: class }
                  - edge: { relation: has-class, dir: in }
                  - node: { same: me }
                of: w
    level: warning
    reportAt: { of: a, path: equips }
    message: "アクター「{id}」の初期装備に、職業で装備できない武器があります（武器 {left} 本のうち、職業の「武器タイプ装備」に合うのは {right} 本）。MZ はゲームの開始時に、装備できない装備を外します"
  - id: initial-armors-allowed-by-class
    description: 初期装備の防具は、職業の特徴「防具タイプ装備」のタイプであること
    match: [ { node: { entity: actor, bind: a } } ]
    check:
      - eq:
          - count:
              all:
                from: a
                match: [ { node: { entity: actor } }, { edge: { relation: equips } }, { node: { entity: armor, bind: r } } ]
                of: r
          - count:
              all:
                from: a
                match:
                  - node: { entity: actor, bind: me }
                  - edge: { relation: equips }
                  - node: { entity: armor, bind: r }
                  - edge: { via: atypeId }
                  - node: { entity: armor-type }
                  - edge: { via: dataId, dir: in }
                  - node: { entity: class }
                  - edge: { relation: has-class, dir: in }
                  - node: { same: me }
                of: r
    level: warning
    reportAt: { of: a, path: equips }
    message: "アクター「{id}」の初期装備に、職業で装備できない防具があります（防具 {left} 個のうち、職業の「防具タイプ装備」に合うのは {right} 個）。MZ はゲームの開始時に、装備できない装備を外します"
