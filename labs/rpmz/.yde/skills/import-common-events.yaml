id: import-common-events
name: コモンイベントの名前の取り込み（MZ の CommonEvents.json）
kind: import
description: |
  MZ の CommonEvents.json から、コモンイベントの番号と名前だけを db/refs/common-events.yaml へ取り込みます（中身は MZ が持ちます）。
input: { format: json, tree: true }
target: { file: db/refs/common-events.yaml, path: commonEvents, key: [id] }
build:
  id: { $format: "CEV-{n}", $with: { n: { $number: { $copy: id }, $as: "0000" } } }
  name: { $copy: name }
