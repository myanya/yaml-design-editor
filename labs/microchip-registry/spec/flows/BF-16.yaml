id: BF-16
name: "再交付（紙運用）"
business: BIZ-13
source: "別紙 3 業務フロー 28〜30／66"
lanes:
  - { actor: ACT-OWNER, label: "所有者（個人・法人）" }
  - { actor: ACT-REGISTRAR, label: "指定登録機関（担当者）" }
  - { actor: ACT-SYSTEM, label: "指定登録機関（個別 Web システム）" }
  - { actor: ACT-PAYMENT, label: "決済関連" }
steps:
  - { id: BF-16-S01, title: "マイクロチップ登録証明書の有無を確認する", actor: ACT-OWNER, kind: outside }
  - { id: BF-16-S02, title: "マイクロチップ番号を読み取る", actor: ACT-OWNER, kind: outside }
  - { id: BF-16-S03, title: "再交付手数料を支払う（コンビニ・窓口・銀行振込）", actor: ACT-OWNER, kind: outside }
  - { id: BF-16-S04, title: "決済を処理し、支払い証明書を出す", actor: ACT-PAYMENT, kind: outside }
  - { id: BF-16-S05, title: "マイクロチップ登録証明書の再交付申請書を作成する", actor: ACT-OWNER, kind: document }
  - { id: BF-16-S06, title: "郵送か窓口で再交付を申請する", actor: ACT-OWNER, kind: outside }
  - { id: BF-16-S07, title: "申請を受領し、本人と支払いを確認する", actor: ACT-REGISTRAR, kind: outside }
  - { id: BF-16-S08, title: "登録証明書の再交付を実行する", actor: ACT-REGISTRAR, kind: system, action: apply-reissue, note: "経路を「紙」にし、担当者を入れます。本人確認の値には、登録証明書（写）の変更キーか、所有者の登録した電話番号を入れます。" }
  - { id: BF-16-S09, title: "登録証明書の再交付を受け付ける", actor: ACT-SYSTEM, kind: data, action: apply-reissue }
  - { id: BF-16-S10, title: "支払い証明書の支払を記録する", actor: ACT-REGISTRAR, kind: system, action: record-payment }
  - { id: BF-16-S11, title: "新しい変更キーを発行する（共通 DB）", actor: ACT-SYSTEM, kind: data, action: complete-application }
  - { id: BF-16-S12, title: "マイクロチップ登録証明書をダウンロードする", actor: ACT-REGISTRAR, kind: system, note: "レポート certificate で HTML を作り、印刷します。" }
  - { id: BF-16-S13, title: "マイクロチップ登録証明書を送付する", actor: ACT-REGISTRAR, kind: outside }
  - { id: BF-16-S14, title: "マイクロチップ登録証明書を受領する", actor: ACT-OWNER, kind: document }
transitions:
  - { from: BF-16-S01, to: BF-16-S02, label: "【登録証明書無】" }
  - { from: BF-16-S01, to: BF-16-S03, label: "【登録証明書有】" }
  - { from: BF-16-S02, to: BF-16-S03 }
  - { from: BF-16-S03, to: BF-16-S04 }
  - { from: BF-16-S04, to: BF-16-S05, label: "支払い証明書" }
  - { from: BF-16-S05, to: BF-16-S06 }
  - { from: BF-16-S06, to: BF-16-S07, label: "再交付申請書＋登録証明書（写）か身分証明書（写）＋支払い証明書（写）" }
  - { from: BF-16-S07, to: BF-16-S08 }
  - { from: BF-16-S08, to: BF-16-S09 }
  - { from: BF-16-S09, to: BF-16-S10 }
  - { from: BF-16-S10, to: BF-16-S11 }
  - { from: BF-16-S11, to: BF-16-S12 }
  - { from: BF-16-S12, to: BF-16-S13 }
  - { from: BF-16-S13, to: BF-16-S14, label: "郵送 or 手渡し（窓口）" }
notes: "登録証明書で所有者を確認します。登録証明書が無いときは、身分証明書で代えます（システムの外の確認です）。"
