id: BF-12
name: "所有者変更登録（一括）"
business: BIZ-04
source: "別紙 3 業務フロー 11〜12／66"
lanes:
  - { actor: ACT-OWNER, label: "所有者（個人・法人）" }
  - { actor: ACT-SYSTEM, label: "指定登録機関（個別 Web システム）" }
  - { actor: ACT-OLD-OWNER, label: "旧所有者（個人・法人）" }
steps:
  - { id: BF-12-S01, title: "犬猫と登録証明書を譲り渡す（単体のフローと同じ）", actor: ACT-OLD-OWNER, kind: outside }
  - { id: BF-12-S02, title: "犬猫を譲り受ける", actor: ACT-OWNER, kind: outside }
  - { id: BF-12-S03, title: "利用規約を確認する", actor: ACT-OWNER, kind: system, note: "利用規約の確認は再現していません。" }
  - { id: BF-12-S04, title: "新所有者の情報を入力する（一括）", actor: ACT-OWNER, kind: system, action: apply-transfer, note: "外のスクリプト scripts/bulk.py transfer に CSV を渡します。" }
  - { id: BF-12-S05, title: "新所有者情報を一括で受け付ける", actor: ACT-SYSTEM, kind: data, action: apply-transfer, note: "スクリプトが操作を 1 行ずつ呼び、行ごとに前提（変更キー）を確かめます。" }
  - { id: BF-12-S06, title: "変更登録手数料を支払う（クレジット決済のみ）", actor: ACT-OWNER, kind: system, note: "一括の変更登録手数料は、オンライン決済（クレジット決済）だけです。決済はシステムの外です。" }
  - { id: BF-12-S07, title: "支払を確認する", actor: ACT-SYSTEM, kind: data, action: record-payment }
  - { id: BF-12-S08, title: "所有者の変更を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, action: complete-application }
  - { id: BF-12-S09, title: "ワンストップ通知を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, view: onestop-grid, note: "通知情報は書き込まず、ビューで導きます。" }
  - { id: BF-12-S10, title: "マイクロチップ登録証明書を一括発行する", actor: ACT-SYSTEM, kind: document, note: "レポート certificate を 1 件ずつ作ります（一括の発行はありません）。" }
  - { id: BF-12-S11, title: "登録証明書と所有者一括変更登録結果 CSV を受領する", actor: ACT-OWNER, kind: document }
  - { id: BF-12-S12, title: "所有者変更登録（一括）の完了メールを送信する", actor: ACT-SYSTEM, kind: document, note: "メールの送信は再現していません。" }
  - { id: BF-12-S13, title: "完了メールを受領する", actor: ACT-OLD-OWNER, kind: document }
transitions:
  - { from: BF-12-S01, to: BF-12-S02, label: "犬猫＋登録証明書（変更キーを含む）" }
  - { from: BF-12-S02, to: BF-12-S03 }
  - { from: BF-12-S03, to: BF-12-S04 }
  - { from: BF-12-S04, to: BF-12-S05, label: "MC 番号＋変更キー＋犬猫情報＋所有者情報、所有者一括変更登録 CSV" }
  - { from: BF-12-S05, to: BF-12-S06 }
  - { from: BF-12-S06, to: BF-12-S07 }
  - { from: BF-12-S07, to: BF-12-S08 }
  - { from: BF-12-S08, to: BF-12-S09 }
  - { from: BF-12-S09, to: BF-12-S10 }
  - { from: BF-12-S10, to: BF-12-S11, label: "MC 番号＋変更キー（新）、所有者一括変更登録結果 CSV" }
  - { from: BF-12-S10, to: BF-12-S12 }
  - { from: BF-12-S12, to: BF-12-S13 }
notes: "多数の登録を一括で行う者を想定したフローです。完了メールは旧所有者ごとに通知します。"
