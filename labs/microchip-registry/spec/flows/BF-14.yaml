id: BF-14
name: "所有者変更登録（紙運用）"
business: BIZ-10
source: "別紙 3 業務フロー 23〜25／66"
lanes:
  - { actor: ACT-OWNER, label: "所有者（個人・法人）" }
  - { actor: ACT-REGISTRAR, label: "指定登録機関（担当者）" }
  - { actor: ACT-SYSTEM, label: "指定登録機関（個別 Web システム）" }
  - { actor: ACT-OLD-OWNER, label: "旧所有者（個人・法人）" }
  - { actor: ACT-PAYMENT, label: "決済関連" }
steps:
  - { id: BF-14-S01, title: "犬猫と登録証明書を譲り渡す（単体のフローと同じ）", actor: ACT-OLD-OWNER, kind: outside }
  - { id: BF-14-S02, title: "変更登録手数料を支払う（コンビニ・窓口・銀行振込）", actor: ACT-OWNER, kind: outside }
  - { id: BF-14-S03, title: "決済を処理し、支払い証明書を出す", actor: ACT-PAYMENT, kind: outside }
  - { id: BF-14-S04, title: "変更登録申請書を作成する", actor: ACT-OWNER, kind: document }
  - { id: BF-14-S05, title: "郵送か窓口で所有者変更登録を申請する", actor: ACT-OWNER, kind: outside }
  - { id: BF-14-S06, title: "申請を受領し、支払いを確認する", actor: ACT-REGISTRAR, kind: outside }
  - { id: BF-14-S07, title: "新所有者情報を入力する", actor: ACT-REGISTRAR, kind: system, action: apply-transfer, note: "経路を「紙」にし、担当者を入れます。変更キーは登録証明書（写）から読みます。" }
  - { id: BF-14-S08, title: "新所有者情報を受け付ける", actor: ACT-SYSTEM, kind: data, action: apply-transfer }
  - { id: BF-14-S09, title: "支払い証明書の支払を記録する", actor: ACT-REGISTRAR, kind: system, action: record-payment }
  - { id: BF-14-S10, title: "所有者の変更を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, action: complete-application }
  - { id: BF-14-S11, title: "ワンストップ通知を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, view: onestop-grid, note: "通知情報は書き込まず、ビューで導きます。" }
  - { id: BF-14-S12, title: "マイクロチップ登録証明書をダウンロードする", actor: ACT-REGISTRAR, kind: system, note: "レポート certificate で HTML を作り、印刷します。" }
  - { id: BF-14-S13, title: "マイクロチップ登録証明書を送付する", actor: ACT-REGISTRAR, kind: outside }
  - { id: BF-14-S14, title: "マイクロチップ登録証明書を受領する", actor: ACT-OWNER, kind: document }
  - { id: BF-14-S15, title: "所有者変更登録の完了メールを送信する", actor: ACT-SYSTEM, kind: document, note: "メールの送信は再現していません。" }
  - { id: BF-14-S16, title: "完了メールを受領する", actor: ACT-OLD-OWNER, kind: document }
