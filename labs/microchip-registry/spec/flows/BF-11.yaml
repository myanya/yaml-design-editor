id: BF-11
name: "マイクロチップ情報登録（一括）"
business: BIZ-02
source: "別紙 3 業務フロー 7〜8／66"
lanes:
  - { actor: ACT-OWNER, label: "所有者（個人・法人）" }
  - { actor: ACT-SYSTEM, label: "指定登録機関（個別 Web システム）" }
  - { actor: ACT-VET, label: "MC 装着者（獣医師）" }
steps:
  - { id: BF-11-S01, title: "マイクロチップを装着する（単体のフローと同じ）", actor: ACT-VET, kind: outside }
  - { id: BF-11-S02, title: "マイクロチップ登録情報の CSV を作成する", actor: ACT-OWNER, kind: document }
  - { id: BF-11-S03, title: "利用規約を確認する", actor: ACT-OWNER, kind: system, note: "利用規約の確認は再現していません。" }
  - { id: BF-11-S04, title: "マイクロチップ登録情報を入力する（一括）", actor: ACT-OWNER, kind: system, action: apply-registration, note: "外のスクリプト scripts/bulk.py register に CSV を渡します（取り込みから操作を行ごとに呼べないため）。" }
  - { id: BF-11-S05, title: "一括登録を受け付け、装着証明書を確認・保管する", actor: ACT-SYSTEM, kind: data, action: apply-registration, note: "スクリプトが操作を 1 行ずつ呼び、行ごとに前提（二重登録）を確かめます。" }
  - { id: BF-11-S06, title: "登録手数料を支払う（クレジット決済のみ）", actor: ACT-OWNER, kind: system, note: "一括の登録料は、即時決済を想定するためオンライン決済（クレジット決済）だけです。決済はシステムの外です。" }
  - { id: BF-11-S07, title: "支払結果を登録する", actor: ACT-SYSTEM, kind: data, action: record-payment }
  - { id: BF-11-S08, title: "マイクロチップ情報を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, action: complete-application }
  - { id: BF-11-S09, title: "ワンストップ通知を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, view: onestop-grid, note: "通知情報は書き込まず、ビューで導きます。" }
  - { id: BF-11-S10, title: "飼養管理基準の超過を判定し、通知を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, view: breeding-grid, note: "判定条件は要件定義書に無いので、仮の基準です。" }
  - { id: BF-11-S11, title: "マイクロチップ登録証明書を一括発行する", actor: ACT-SYSTEM, kind: document, note: "レポート certificate を 1 件ずつ作ります（一括の発行はありません）。" }
  - { id: BF-11-S12, title: "登録証明書と一括登録結果 CSV を受領する", actor: ACT-OWNER, kind: document }
transitions:
  - { from: BF-11-S01, to: BF-11-S02 }
  - { from: BF-11-S02, to: BF-11-S03 }
  - { from: BF-11-S03, to: BF-11-S04 }
  - { from: BF-11-S04, to: BF-11-S05, label: "マイクロチップ情報一括登録 CSV＋装着証明書（写）" }
  - { from: BF-11-S05, to: BF-11-S06 }
  - { from: BF-11-S06, to: BF-11-S07 }
  - { from: BF-11-S07, to: BF-11-S08 }
  - { from: BF-11-S08, to: BF-11-S09 }
  - { from: BF-11-S09, to: BF-11-S10 }
  - { from: BF-11-S10, to: BF-11-S11 }
  - { from: BF-11-S11, to: BF-11-S12, label: "MC 番号＋変更キー、マイクロチップ情報一括登録結果 CSV" }
notes: "多数の登録を一括で行う者（オークション事業者、動物愛護管理センターなど）を想定したフローです。指定登録機関が代わりに入力する場合もあります。"
