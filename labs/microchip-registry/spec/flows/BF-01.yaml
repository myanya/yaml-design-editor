id: BF-01
name: "マイクロチップ情報登録（単体）"
business: BIZ-01
source: "別紙 3 業務フロー 4〜6／66"
lanes:
  - { actor: ACT-OWNER, label: "所有者（個人・法人）" }
  - { actor: ACT-SYSTEM, label: "指定登録機関（個別 Web システム）" }
  - { actor: ACT-VET, label: "MC 装着者（獣医師）" }
steps:
  - { id: BF-01-S01, title: "マイクロチップ装着を申請する", actor: ACT-OWNER, kind: outside }
  - { id: BF-01-S02, title: "マイクロチップを装着する", actor: ACT-VET, kind: outside }
  - { id: BF-01-S03, title: "マイクロチップ装着料金を支払う", actor: ACT-OWNER, kind: outside }
  - { id: BF-01-S04, title: "マイクロチップ装着証明書を発行する", actor: ACT-VET, kind: document }
  - { id: BF-01-S05, title: "利用規約を確認する", actor: ACT-OWNER, kind: system, note: "利用規約の確認は再現していません。" }
  - { id: BF-01-S06, title: "マイクロチップ情報を入力する（単体）", actor: ACT-OWNER, kind: system, action: apply-registration }
  - { id: BF-01-S07, title: "登録を受け付け、装着証明書を確認・保管する", actor: ACT-SYSTEM, kind: data, action: apply-registration, note: "二重登録の確認は操作の前提です。装着証明書の写しの保管と、マイクロチップ番号の読み取りはありません。" }
  - { id: BF-01-S08, title: "登録手数料を支払う", actor: ACT-OWNER, kind: system, note: "決済はシステムの外です（業務フロー「手数料支払」）。" }
  - { id: BF-01-S09, title: "支払結果を確認する", actor: ACT-SYSTEM, kind: data, action: record-payment }
  - { id: BF-01-S10, title: "マイクロチップ情報を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, action: complete-application }
  - { id: BF-01-S11, title: "ワンストップ通知を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, view: onestop-grid, note: "通知情報は書き込まず、申請・届出と登録からビューで導きます。" }
  - { id: BF-01-S12, title: "飼養管理基準の超過を判定し、通知を登録する（共通 DB）", actor: ACT-SYSTEM, kind: data, view: breeding-grid, note: "判定条件は要件定義書に無いので、仮の基準です。" }
  - { id: BF-01-S13, title: "マイクロチップ登録証明書を発行する", actor: ACT-SYSTEM, kind: document, note: "レポート certificate で HTML を作ります。メールでの送付はシステムの外です。" }
  - { id: BF-01-S14, title: "マイクロチップ登録証明書を受領する", actor: ACT-OWNER, kind: document }
transitions:
  - { from: BF-01-S01, to: BF-01-S02 }
  - { from: BF-01-S02, to: BF-01-S03 }
  - { from: BF-01-S03, to: BF-01-S04 }
  - { from: BF-01-S04, to: BF-01-S05, label: "マイクロチップ装着証明書" }
  - { from: BF-01-S05, to: BF-01-S06 }
  - { from: BF-01-S06, to: BF-01-S07, label: "MC 番号＋犬猫情報＋所有者情報、装着証明書（写）" }
  - { from: BF-01-S07, to: BF-01-S08 }
  - { from: BF-01-S08, to: BF-01-S09 }
  - { from: BF-01-S09, to: BF-01-S10 }
  - { from: BF-01-S10, to: BF-01-S11 }
  - { from: BF-01-S11, to: BF-01-S12 }
  - { from: BF-01-S12, to: BF-01-S13 }
  - { from: BF-01-S13, to: BF-01-S14, label: "MC 番号＋変更キー（メール）" }
notes: "入力情報を一時保存し、2 回目以降の情報入力を省略できること、という備考は再現していません。"
