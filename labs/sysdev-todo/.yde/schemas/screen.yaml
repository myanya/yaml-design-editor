id: todo-screen
name: 画面基本設計
kind: document
description: 利用者から見た画面の目的・項目・操作を定義する。
match: "31_screens/*.{yaml,yml}"
filePattern: "31_screens/{id}.yaml"
root:
  type: todo-design-common#design-document
  entity: { type: screen, defines: true }
  fields:
    - { key: id, type: id, pattern: '^SCR-[A-Z0-9]+(-[A-Z0-9]+)*$', sample: SCR-TODO-LIST }
    - key: domain
      label: 所属ドメイン
      type: ref
      idPattern: 'DOM-*'
      relation: belongs-to-domain
      scope: { schemaIds: [todo-domain-list] }
    - key: domain_operations
      label: 導出元の提供操作
      type: array
      item: { type: ref, idPattern: 'OP-*', relation: realizes-operation, scope: { schemaIds: [todo-domain] } }
    - { key: items, label: 表示・入力項目, type: todo-design-common#data-items }
    - { key: actions, label: 操作・結果・遷移, type: todo-design-common#descriptions }
    - key: apis
      label: 利用API
      type: array
      item: { type: ref, relation: uses-api, scope: { schemaIds: [todo-api] } }
