id: value-type-catalog
name: 値型一覧と定義書
kind: grid
rows:
  idPattern: 'DT-*'
  schemaIds: [todo-value-type-list]
order:
  fileGlob: 22_valuetypes/value-type-list.yaml
columns:
  - { label: 型名, schemaId: todo-value-type-list, path: name, editable: true }
  - { label: 業務上の意味, schemaId: todo-value-type-list, path: summary, editable: true }
  - { label: 種別, schemaId: todo-value-type-list, path: kind, editable: true }
  - { label: 設計状態, schemaId: todo-value-type-list, path: status, editable: true }
detail:
  fileGlob: '22_valuetypes/DT-*.yaml'
  filePattern: '22_valuetypes/{id}.yaml'
newRow:
  file: 22_valuetypes/value-type-list.yaml
  path: types
