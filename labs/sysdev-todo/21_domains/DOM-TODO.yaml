id: DOM-TODO
responsibility: |
  認証された利用者自身のTODOについて、登録・参照・編集・完了状態の変更・削除を行う。
  TODOの所有者と状態を管理し、状態・分類・タグによる一覧の絞り込みを提供する。
  分類・タグの定義を利用してTODOへの割当てを管理する。
out_of_scope: |
  利用者の登録・認証と分類・タグ自体の作成・名称変更・削除は、それぞれの管理ドメインが担当する。
  他の利用者との共有・担当者割当て、通知、添付、繰り返しTODOは初期範囲に含めない。
dependencies:
  - DOM-IDENTITY
  - DOM-CLASSIFICATION
rule_groups:
  - name: 認証と所有者による制限
    rules:
      - すべての操作で認証を必須とし、操作する利用者を認証情報に基づいて特定する。
      - TODOは作成した利用者に属し、他の利用者は参照・変更・削除できない。
      - 他の利用者のTODOに対する操作では、そのTODOの内容や存在を開示しない。
  - name: 状態と期限
    rules:
      - 完了から未完了へ戻せる。
      - 期限を過ぎても自動で状態を変えず、通知もしない。
  - name: 分類とタグの割当て
    rules:
      - 自身の分類・タグだけを割り当てられる。割当ての変更はTODO管理の責務とする。
  - name: 保存と失敗時の扱い
    rules:
      - 操作が成功した場合は変更内容が保存され、画面の再読み込みや再ログイン後も確認できる。
      - 操作の条件を満たさない場合や保存に失敗した場合は、操作の失敗を返し、変更の一部だけを保存しない。
entities:
  - id: ENT-TODO
    name: TODO
    summary: 利用者が完了まで管理する作業。内容・状態・期限・整理用の分類とタグを持つ。
    information:
      - { name: TODO ID, description: TODOの識別子。, data_type: DT-TODO-ID, required: true }
      - { name: 所有者ID, description: TODOを所有する利用者の識別子。, data_type: DT-USER-ID, required: true }
      - { name: タイトル, description: 作業の名前。, data_type: DT-TODO-TITLE, required: true }
      - { name: 説明, description: 作業の補足説明。, data_type: DT-TODO-DESCRIPTION, required: false }
      - { name: 期限, description: 任意の期限日。, data_type: DT-DUE-DATE, required: false }
      - { name: 分類, description: 割り当てる分類の識別子。, data_type: DT-CATEGORY-ID, required: false }
      - { name: タグ, description: 割り当てるタグの識別子。タグなしは空のリスト。, data_type: DT-TAG-ID, required: true, multiple: true, constraints: 同じタグIDを重複させない。 }
      - { name: 状態, description: 作業の完了状態。, data_type: DT-TODO-STATUS, required: true }
      - { name: 作成日時, description: TODOを登録した日時。, data_type: DT-RECORDED-AT, required: true }
      - { name: 最終更新日時, description: TODOを最後に更新した日時。, data_type: DT-RECORDED-AT, required: true }
    rule_groups:
      - name: 所有者と初期状態
        rules:
          - 所有者は登録時に認証されている利用者とし、通常の編集では変更できない。
          - 完了状態を変更しても、内容・期限・分類・タグは保持する。
          - 登録時の状態はDT-TODO-STATUSの初期値に従う。
      - name: 分類とタグの件数
        rules:
          - 1件のTODOに分類を0または1件、タグを0件以上割り当てる。同じタグを重複して割り当てない。
operations:
  - id: OP-TODO-LIST
    name: TODOの一覧を取得する
    summary: 自身のTODOを取得し、指定条件に一致する作業を確認する。
    actor: 認証済みの利用者
    entities:
      - entity: ENT-TODO
        C: { enabled: false }
        R: { enabled: true, target: 認証中の利用者が所有するTODO }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-USER
        C: { enabled: false }
        R: { enabled: true, target: 認証中の利用者 }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-AUTH-SESSION
        C: { enabled: false }
        R: { enabled: true, target: 現在のセッション }
        U:
          enabled: true
          target: 現在のセッション
          condition: { kind: predicate, subject: 今回の要求, operator: satisfies, expected: ENT-AUTH-SESSIONの「操作による延長」の条件 }
          notes: 最終操作日時と有効期限を更新する。
        D: { enabled: false }
      - entity: ENT-CATEGORY
        C: { enabled: false }
        R:
          enabled: true
          target: 入力で指定された分類
          condition: { kind: predicate, subject: 指定された分類の件数, operator: greater_or_equal, expected: "1" }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-TAG
        C: { enabled: false }
        R:
          enabled: true
          target: 入力で指定されたタグ
          condition: { kind: predicate, subject: 指定されたタグの件数, operator: greater_or_equal, expected: "1" }
        U: { enabled: false }
        D: { enabled: false }
    inputs:
      - { name: 状態による絞り込み条件, description: 未完了・完了・すべてのいずれかを指定する。省略時はすべてを対象とする。, data_type: DT-TODO-STATUS-FILTER, required: false }
      - { name: 分類による絞り込み条件, description: 自身の分類を1件指定する。省略時は分類で絞り込まない。, data_type: DT-CATEGORY-ID, required: false }
      - { name: タグによる絞り込み条件, description: 自身のタグを1件指定する。省略時はタグで絞り込まない。, data_type: DT-TAG-ID, required: false }
    result:
      kind: record
      multiple: true
      required: true
      attributes:
        - { name: TODO ID, description: TODOの識別子。, data_type: DT-TODO-ID, required: true }
        - { name: タイトル, description: 作業の名前。, data_type: DT-TODO-TITLE, required: true }
        - { name: 説明, description: 作業の補足説明。, data_type: DT-TODO-DESCRIPTION, required: false }
        - { name: 期限, description: 任意の期限日。, data_type: DT-DUE-DATE, required: false }
        - { name: 分類, description: 割り当てる分類の識別子。, data_type: DT-CATEGORY-ID, required: false }
        - { name: タグ, description: 割り当てるタグの識別子。タグなしは空のリスト。, data_type: DT-TAG-ID, required: true, multiple: true, constraints: 同じタグIDを重複させない。 }
        - { name: 状態, description: 作業の完了状態。, data_type: DT-TODO-STATUS, required: true }
        - { name: 作成日時, description: TODOを登録した日時。, data_type: DT-RECORDED-AT, required: true }
        - { name: 最終更新日時, description: TODOを最後に更新した日時。, data_type: DT-RECORDED-AT, required: true }
      constraints: 自身が所有し、指定条件をすべて満たすTODOの識別子・内容・状態・期限・分類・タグ。
    preconditions:
      kind: and
      conditions:
        - { kind: predicate, subject: 現在の認証状態, operator: satisfies, expected: ENT-AUTH-SESSIONの利用可能条件 }
        - { kind: predicate, subject: 指定された分類のうち存在しない件数, operator: equals, expected: "0" }
        - { kind: predicate, subject: 指定された分類のうち他の利用者が所有する件数, operator: equals, expected: "0" }
        - { kind: predicate, subject: 指定されたタグのうち存在しない件数, operator: equals, expected: "0" }
        - { kind: predicate, subject: 指定されたタグのうち他の利用者が所有する件数, operator: equals, expected: "0" }
    errors:
      - 認証されていない場合は取得しない。
      - 指定された分類・タグが存在しない場合や、他の利用者が所有する場合は、その条件を受け付けない。
  - id: OP-TODO-GET
    name: TODOの内容を確認する
    summary: 自身のTODOを1件指定し、編集や確認に必要な情報を取得する。
    actor: 認証済みの利用者
    entities:
      - entity: ENT-TODO
        C: { enabled: false }
        R: { enabled: true, target: 指定IDに対応する自身のTODO }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-USER
        C: { enabled: false }
        R: { enabled: true, target: 認証中の利用者 }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-AUTH-SESSION
        C: { enabled: false }
        R: { enabled: true, target: 現在のセッション }
        U:
          enabled: true
          target: 現在のセッション
          condition: { kind: predicate, subject: 今回の要求, operator: satisfies, expected: ENT-AUTH-SESSIONの「操作による延長」の条件 }
          notes: 最終操作日時と有効期限を更新する。
        D: { enabled: false }
    inputs:
      - { name: TODO ID, description: 取得するTODOの識別子。, required: true, data_type: DT-TODO-ID }
    result:
      kind: record
      multiple: false
      required: true
      attributes:
        - { name: TODO ID, description: TODOの識別子。, data_type: DT-TODO-ID, required: true }
        - { name: タイトル, description: 作業の名前。, data_type: DT-TODO-TITLE, required: true }
        - { name: 説明, description: 作業の補足説明。, data_type: DT-TODO-DESCRIPTION, required: false }
        - { name: 期限, description: 任意の期限日。, data_type: DT-DUE-DATE, required: false }
        - { name: 分類, description: 割り当てる分類の識別子。, data_type: DT-CATEGORY-ID, required: false }
        - { name: タグ, description: 割り当てるタグの識別子。タグなしは空のリスト。, data_type: DT-TAG-ID, required: true, multiple: true, constraints: 同じタグIDを重複させない。 }
        - { name: 状態, description: 作業の完了状態。, data_type: DT-TODO-STATUS, required: true }
        - { name: 作成日時, description: TODOを登録した日時。, data_type: DT-RECORDED-AT, required: true }
        - { name: 最終更新日時, description: TODOを最後に更新した日時。, data_type: DT-RECORDED-AT, required: true }
      constraints: 内容・状態・期限・分類・タグと更新日時。
    preconditions:
      kind: and
      conditions:
        - { kind: predicate, subject: 現在の認証状態, operator: satisfies, expected: ENT-AUTH-SESSIONの利用可能条件 }
        - { kind: predicate, subject: 対象TODOの件数, operator: equals, expected: "1" }
        - { kind: predicate, subject: 対象TODOの所有者ID, operator: equals, expected: 認証中の利用者ID }
    errors:
      - 未認証の場合は取得しない。
      - 対象のTODOが存在しない場合や、他の利用者が所有する場合は、対象を利用できない旨を返す。
  - id: OP-TODO-CREATE
    name: TODOを登録する
    summary: 新しい作業を、自身が所有する未完了のTODOとして登録する。
    actor: 認証済みの利用者
    entities:
      - entity: ENT-TODO
        C: { enabled: true, target: 新規TODO }
        R: { enabled: false }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-USER
        C: { enabled: false }
        R: { enabled: true, target: 認証中の利用者 }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-AUTH-SESSION
        C: { enabled: false }
        R: { enabled: true, target: 現在のセッション }
        U:
          enabled: true
          target: 現在のセッション
          condition: { kind: predicate, subject: 今回の要求, operator: satisfies, expected: ENT-AUTH-SESSIONの「操作による延長」の条件 }
          notes: 最終操作日時と有効期限を更新する。
        D: { enabled: false }
      - entity: ENT-CATEGORY
        C: { enabled: false }
        R:
          enabled: true
          target: 入力で指定された分類
          condition: { kind: predicate, subject: 指定された分類の件数, operator: greater_or_equal, expected: "1" }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-TAG
        C: { enabled: false }
        R:
          enabled: true
          target: 入力で指定されたタグ
          condition: { kind: predicate, subject: 指定されたタグの件数, operator: greater_or_equal, expected: "1" }
        U: { enabled: false }
        D: { enabled: false }
    inputs:
      - { name: タイトル, description: 登録する作業の名前。, required: true, data_type: DT-TODO-TITLE }
      - { name: 説明, description: 作業の補足説明。, data_type: DT-TODO-DESCRIPTION, required: false }
      - { name: 期限, description: 任意の期限日。, data_type: DT-DUE-DATE, required: false }
      - { name: 分類, description: 自身の分類の識別子。未指定なら未分類。, data_type: DT-CATEGORY-ID, required: false }
      - { name: タグ, description: 自身のタグの識別子の集合。未指定ならタグなし。, data_type: DT-TAG-ID, required: false, multiple: true }
    result:
      kind: record
      multiple: false
      required: true
      attributes:
        - { name: TODO ID, description: TODOの識別子。, data_type: DT-TODO-ID, required: true }
        - { name: タイトル, description: 作業の名前。, data_type: DT-TODO-TITLE, required: true }
        - { name: 説明, description: 作業の補足説明。, data_type: DT-TODO-DESCRIPTION, required: false }
        - { name: 期限, description: 任意の期限日。, data_type: DT-DUE-DATE, required: false }
        - { name: 分類, description: 割り当てる分類の識別子。, data_type: DT-CATEGORY-ID, required: false }
        - { name: タグ, description: 割り当てるタグの識別子。タグなしは空のリスト。, data_type: DT-TAG-ID, required: true, multiple: true, constraints: 同じタグIDを重複させない。 }
        - { name: 状態, description: 作業の完了状態。, data_type: DT-TODO-STATUS, required: true }
        - { name: 作成日時, description: TODOを登録した日時。, data_type: DT-RECORDED-AT, required: true }
        - { name: 最終更新日時, description: TODOを最後に更新した日時。, data_type: DT-RECORDED-AT, required: true }
      constraints: 一意なTODO IDと保存された内容。
    preconditions:
      kind: and
      conditions:
        - { kind: predicate, subject: 現在の認証状態, operator: satisfies, expected: ENT-AUTH-SESSIONの利用可能条件 }
        - { kind: predicate, subject: 指定されたタグのうち存在しない件数, operator: equals, expected: "0" }
        - { kind: predicate, subject: 指定されたタグのうち他の利用者が所有する件数, operator: equals, expected: "0" }
        - kind: or
          conditions:
            - { kind: predicate, subject: 入力の分類, operator: equals, expected: 指定なし }
            - kind: and
              conditions:
                - { kind: predicate, subject: 指定された分類の件数, operator: equals, expected: "1" }
                - { kind: predicate, subject: 指定された分類の所有者ID, operator: equals, expected: 認証中の利用者ID }
    errors:
      - 認証されていない場合は登録しない。
      - 指定された分類・タグが存在しない場合や、他の利用者が所有する場合は登録しない。
  - id: OP-TODO-UPDATE
    name: TODOの内容を編集する
    summary: 自身のTODOのタイトル・説明・期限・分類・タグを変更する。
    actor: 認証済みの利用者
    entities:
      - entity: ENT-TODO
        C: { enabled: false }
        R: { enabled: true, target: 指定IDに対応する自身のTODO }
        U: { enabled: true, target: 指定IDに対応する自身のTODO }
        D: { enabled: false }
      - entity: ENT-USER
        C: { enabled: false }
        R: { enabled: true, target: 認証中の利用者 }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-AUTH-SESSION
        C: { enabled: false }
        R: { enabled: true, target: 現在のセッション }
        U:
          enabled: true
          target: 現在のセッション
          condition: { kind: predicate, subject: 今回の要求, operator: satisfies, expected: ENT-AUTH-SESSIONの「操作による延長」の条件 }
          notes: 最終操作日時と有効期限を更新する。
        D: { enabled: false }
      - entity: ENT-CATEGORY
        C: { enabled: false }
        R:
          enabled: true
          target: 入力で指定された分類
          condition: { kind: predicate, subject: 指定された分類の件数, operator: greater_or_equal, expected: "1" }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-TAG
        C: { enabled: false }
        R:
          enabled: true
          target: 入力で指定されたタグ
          condition: { kind: predicate, subject: 指定されたタグの件数, operator: greater_or_equal, expected: "1" }
        U: { enabled: false }
        D: { enabled: false }
    inputs:
      - { name: TODO ID, description: 編集対象の識別子。, required: true, data_type: DT-TODO-ID }
      - { name: 変更後の内容, description: タイトル・説明・期限・分類・タグ。任意項目を未設定に戻すこともできる。, required: true, data_type: DT-TODO-CONTENT }
    result:
      kind: record
      multiple: false
      required: true
      attributes:
        - { name: TODO ID, description: TODOの識別子。, data_type: DT-TODO-ID, required: true }
        - { name: タイトル, description: 作業の名前。, data_type: DT-TODO-TITLE, required: true }
        - { name: 説明, description: 作業の補足説明。, data_type: DT-TODO-DESCRIPTION, required: false }
        - { name: 期限, description: 任意の期限日。, data_type: DT-DUE-DATE, required: false }
        - { name: 分類, description: 割り当てる分類の識別子。, data_type: DT-CATEGORY-ID, required: false }
        - { name: タグ, description: 割り当てるタグの識別子。タグなしは空のリスト。, data_type: DT-TAG-ID, required: true, multiple: true, constraints: 同じタグIDを重複させない。 }
        - { name: 状態, description: 作業の完了状態。, data_type: DT-TODO-STATUS, required: true }
        - { name: 作成日時, description: TODOを登録した日時。, data_type: DT-RECORDED-AT, required: true }
        - { name: 最終更新日時, description: TODOを最後に更新した日時。, data_type: DT-RECORDED-AT, required: true }
      constraints: 更新後の保存済みの情報。
    preconditions:
      kind: and
      conditions:
        - { kind: predicate, subject: 現在の認証状態, operator: satisfies, expected: ENT-AUTH-SESSIONの利用可能条件 }
        - { kind: predicate, subject: 対象TODOの件数, operator: equals, expected: "1" }
        - { kind: predicate, subject: 対象TODOの所有者ID, operator: equals, expected: 認証中の利用者ID }
        - { kind: predicate, subject: 指定されたタグのうち存在しない件数, operator: equals, expected: "0" }
        - { kind: predicate, subject: 指定されたタグのうち他の利用者が所有する件数, operator: equals, expected: "0" }
        - kind: or
          conditions:
            - { kind: predicate, subject: 入力の分類, operator: equals, expected: 指定なし }
            - kind: and
              conditions:
                - { kind: predicate, subject: 指定された分類の件数, operator: equals, expected: "1" }
                - { kind: predicate, subject: 指定された分類の所有者ID, operator: equals, expected: 認証中の利用者ID }
    postconditions:
      - 完了状態は変更しない。
    errors:
      - 認証されていない場合、対象を利用できない場合は更新しない。
  - id: OP-TODO-SET-STATUS
    name: TODOの完了状態を変更する
    summary: 自身のTODOを完了または未完了にする。
    actor: 認証済みの利用者
    entities:
      - entity: ENT-TODO
        C: { enabled: false }
        R: { enabled: true, target: 指定IDに対応する自身のTODO }
        U: { enabled: true, target: 指定IDに対応する自身のTODO }
        D: { enabled: false }
      - entity: ENT-USER
        C: { enabled: false }
        R: { enabled: true, target: 認証中の利用者 }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-AUTH-SESSION
        C: { enabled: false }
        R: { enabled: true, target: 現在のセッション }
        U:
          enabled: true
          target: 現在のセッション
          condition: { kind: predicate, subject: 今回の要求, operator: satisfies, expected: ENT-AUTH-SESSIONの「操作による延長」の条件 }
          notes: 最終操作日時と有効期限を更新する。
        D: { enabled: false }
    inputs:
      - { name: TODO ID, description: 状態を変更する対象。, required: true, data_type: DT-TODO-ID }
      - { name: 変更後の状態, description: 未完了または完了のいずれかを指定する。, required: true, data_type: DT-TODO-STATUS }
    result:
      kind: record
      multiple: false
      required: true
      attributes:
        - { name: TODO ID, description: TODOの識別子。, data_type: DT-TODO-ID, required: true }
        - { name: タイトル, description: 作業の名前。, data_type: DT-TODO-TITLE, required: true }
        - { name: 説明, description: 作業の補足説明。, data_type: DT-TODO-DESCRIPTION, required: false }
        - { name: 期限, description: 任意の期限日。, data_type: DT-DUE-DATE, required: false }
        - { name: 分類, description: 割り当てる分類の識別子。, data_type: DT-CATEGORY-ID, required: false }
        - { name: タグ, description: 割り当てるタグの識別子。タグなしは空のリスト。, data_type: DT-TAG-ID, required: true, multiple: true, constraints: 同じタグIDを重複させない。 }
        - { name: 状態, description: 作業の完了状態。, data_type: DT-TODO-STATUS, required: true }
        - { name: 作成日時, description: TODOを登録した日時。, data_type: DT-RECORDED-AT, required: true }
        - { name: 最終更新日時, description: TODOを最後に更新した日時。, data_type: DT-RECORDED-AT, required: true }
      constraints: 保存された完了状態を含むTODO。
    preconditions:
      kind: and
      conditions:
        - { kind: predicate, subject: 現在の認証状態, operator: satisfies, expected: ENT-AUTH-SESSIONの利用可能条件 }
        - { kind: predicate, subject: 対象TODOの件数, operator: equals, expected: "1" }
        - { kind: predicate, subject: 対象TODOの所有者ID, operator: equals, expected: 認証中の利用者ID }
    postconditions:
      - 同じ状態を再度指定しても成功とする。
    errors:
      - 認証されていない場合、対象を利用できない場合は変更しない。
  - id: OP-TODO-DELETE
    name: TODOを削除する
    summary: 自身のTODOを管理対象から除く。
    actor: 認証済みの利用者
    entities:
      - entity: ENT-TODO
        C: { enabled: false }
        R: { enabled: true, target: 指定IDに対応する自身のTODO }
        U: { enabled: false }
        D: { enabled: true, target: 指定IDに対応する自身のTODO }
      - entity: ENT-USER
        C: { enabled: false }
        R: { enabled: true, target: 認証中の利用者 }
        U: { enabled: false }
        D: { enabled: false }
      - entity: ENT-AUTH-SESSION
        C: { enabled: false }
        R: { enabled: true, target: 現在のセッション }
        U:
          enabled: true
          target: 現在のセッション
          condition: { kind: predicate, subject: 今回の要求, operator: satisfies, expected: ENT-AUTH-SESSIONの「操作による延長」の条件 }
          notes: 最終操作日時と有効期限を更新する。
        D: { enabled: false }
    inputs:
      - { name: TODO ID, description: 削除する対象の識別子。, required: true, data_type: DT-TODO-ID }
    result: { kind: value, multiple: false, required: true, data_type: DT-OPERATION-RESULT, constraints: 対象が管理対象から除かれたこと。 成功を返す。失敗時はerrorsに記述した条件に従う。 }
    preconditions:
      kind: and
      conditions:
        - { kind: predicate, subject: 現在の認証状態, operator: satisfies, expected: ENT-AUTH-SESSIONの利用可能条件 }
        - { kind: predicate, subject: 対象TODOの件数, operator: equals, expected: "1" }
        - { kind: predicate, subject: 対象TODOの所有者ID, operator: equals, expected: 認証中の利用者ID }
    postconditions:
      - 割り当てていた分類・タグ自体や、他のTODOは削除しない。
    errors:
      - 認証されていない場合、対象が存在しない場合、他の利用者が所有する場合は削除しない。
notes: |
  利用者ごとの管理と共有しない方針は確定。
  状態は未完了と完了の2種類とする。期限は任意とする。分類は最大1件、タグは複数とする。
  状態・分類・タグの絞り込み条件をすべて満たすTODOを取得する方針とする。
  一覧の初期表示の並び順・ページ分割、同時更新の扱いは未決定。値の制約に関する未決事項は各業務データ型の定義書に記載する。★
  分類・タグを削除できるか判断するため、使用状況を分類・タグ管理へ提供する。
  使用状況の確認から削除までの間にドメイン間の整合性を保つ方法は、後続設計で具体化する。★
  TODO削除後の復元は対象外とする。物理削除か論理削除かはテーブル・リポジトリ設計で決める。★
