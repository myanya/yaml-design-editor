    inputs:
      - { name: 確認用トークン, description: メールの確認用リンクから取得する使い捨ての値。, data_type: DT-CONFIRMATION-TOKEN, required: true }
    result: { kind: value, multiple: false, required: true, data_type: DT-OPERATION-RESULT, constraints: 成功を返す。 }
    preconditions:
      all:
        - { subject: 確認要求の件数, operator: equals, expected: "1" }
        - { subject: 確認要求の状態, operator: equals, expected: 未使用 }
        - { subject: 現在日時, operator: less_than, expected: 確認要求の有効期限 }
