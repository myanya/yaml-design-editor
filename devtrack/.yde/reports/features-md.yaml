id: features-md
name: 機能索引（docs/FEATURES.md）
description: 機能から docs/FEATURES.md（エージェント向けの索引）を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。
build:
  # 節は系統（ID の接頭辞）ごと。節の見出しと並びはここが正（新しい系統を足すときは、ここと common の 機能の系統・機能ID に足す）
  sections:
    - { title: 1. ワークスペース・ファイル管理, rows: { $view: doc-features, $where: [ { path: id, startsWith: "W-" } ] } }
    - { title: 2. 文書編集, rows: { $view: doc-features, $where: [ { path: id, startsWith: "E-" } ] } }
    - { title: 3. スキーマ, rows: { $view: doc-features, $where: [ { path: id, startsWith: "S-" } ] } }
    - { title: 4. 検証, rows: { $view: doc-features, $where: [ { path: id, startsWith: "V-" } ] } }
    - { title: 5. ID・参照, rows: { $view: doc-features, $where: [ { path: id, startsWith: "I-" } ] } }
    - { title: 6. ワークスペース横断ビュー, rows: { $view: doc-features, $where: [ { path: id, startsWith: "X-" } ] } }
    - { title: 7. AI による作成支援, rows: { $view: doc-features, $where: [ { path: id, startsWith: "A-" } ] } }
    - { title: 8. エージェント実行（アクティビティ）, rows: { $view: doc-features, $where: [ { path: id, startsWith: "AG-" } ] } }
    - { title: 9. コア API・CLI（エージェント基盤）, rows: { $view: doc-features, $where: [ { path: id, startsWith: "C-" } ] } }
    - { title: 10. skill（フォーマット適合）, rows: { $view: doc-features, $where: [ { path: id, startsWith: "SK-" } ] } }
    - { title: 11. 操作（型の操作とアクション）, rows: { $view: doc-features, $where: [ { path: id, startsWith: "OP-" } ] } }
    - { title: ローカル接続の基盤, rows: { $view: doc-features, $where: [ { path: id, startsWith: "LC-" } ] } }
  # 自動のテストが無く、手動で確かめている機能
  manualOnly:
    $view: doc-features
    $where:
      - { path: values.テスト, empty: true }
      - { path: values.手動, equals: true }
template: features-md.md
