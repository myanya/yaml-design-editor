id: expressions-md
name: 値の式・条件・クエリ（docs/spec/expressions.md）
description: 値の式・条件・クエリの位置と語から docs/spec/expressions.md を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。
build:
  # 節は位置ごと。並びはここが正（位置を足すときは、ここに足す）
  sections:
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-query-node } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-query-node } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-query-edge } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-query-edge } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-query-branch } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-query-branch } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-condition } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-condition } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-comparison } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-comparison } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-expr } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-expr } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-selector } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-selector } ] }
template: expressions-md.md
