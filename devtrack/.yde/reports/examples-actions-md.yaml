id: examples-actions-md
name: "仕様の例: 操作（docs/spec/examples-actions.md）"
description: "仕様の例（分野「操作」）から docs/spec/examples-actions.md を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。"
build:
  title: "操作"
  lead: "操作（アクションと型の操作）の例"
  examples:
    $each: { $view: doc-examples, $where: [ { path: values.分野, equals: actions } ] }
    $build:
      id: { $copy: id }
      title: { $copy: values.題 }
      illustrates: { $copy: values.示す仕様 }
      files: { $copy: values.ファイル }
      # 結果の文字（ひな形は比べられないので、ここで作る）
      result:
        $map: { $copy: values.結果 }
        $using: { ok: 通る（誤りも警告も無い）, schema-error: スキーマの読み込みの誤りになる, error: 検証のエラーになる, warning: 検証の警告になる, view-error: ビューの定義の誤りになる, report-error: レポートの定義の誤りになる }
      message: { $copy: values.文面 }
      view: { $copy: values.ビュー }
      report: { $copy: values.レポート }
      action: { $copy: values.操作 }
      generate: { $copy: values.生成 }
template: examples-md.md
