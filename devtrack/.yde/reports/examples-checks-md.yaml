id: examples-checks-md
name: "仕様の例: 検査と振る舞い（docs/spec/examples-checks.md）"
description: "仕様の例（分野「検査と振る舞い」）から docs/spec/examples-checks.md を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。"
build:
  title: "検査と振る舞い"
  lead: "検査（constraints と組込みの語彙）、関係レジストリ、State と Lifecycle の例"
  examples:
    $each: { $view: doc-examples, $where: [ { path: values.分野, equals: checks } ] }
    $build:
      id: { $copy: id }
      title: { $copy: values.題 }
      illustrates: { $copy: values.示す仕様 }
      files: { $copy: values.ファイル }
      # 結果の文字（ひな形は比べられないので、ここで作る）
      result:
        $map: { $copy: values.結果 }
        $using: { ok: 通る（誤りも警告も無い）, schema-error: スキーマの読み込みの誤りになる, error: 検証のエラーになる, warning: 検証の警告になる, view-error: ビューの定義の誤りになる, report-error: レポートの定義の誤りになる }
      message: { $copy: values.文面 }
      view: { $copy: values.ビュー }
      report: { $copy: values.レポート }
      action: { $copy: values.操作 }
template: examples-md.md
