id: lens-diagrams-md
name: グラフレンズと図の記法（docs/spec/lens-diagrams.md）
description: グラフレンズと図の記法の位置と語から docs/spec/lens-diagrams.md を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。
build:
  # 位置の所属と節順は spec/contexts の guide・order が正。
  sections:
    $each: { $view: doc-contexts, $where: [ { path: values.仕様書, equals: GUIDE-lens-diagrams } ] }
    $bind: context
    $build:
      context: { $copy: . }
      rows:
        $view: doc-keywords-ordered
        $where: [ { path: values.位置, equals: { $copy: id, $of: context } } ]

template: lens-diagrams-md.md
