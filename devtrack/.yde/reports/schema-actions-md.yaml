id: schema-actions-md
name: 操作（docs/spec/schema-actions.md）
description: 操作の位置と語から docs/spec/schema-actions.md を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。
build:
  # 節は位置ごと。並びはここが正（位置を足すときは、ここに足す）
  sections:
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-action } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-action } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-action-target } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-action-target } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-action-input } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-action-input } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-method } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-method } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-insert-rule } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-insert-rule } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-id-numbering } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-id-numbering } ] }
template: schema-actions-md.md
