id: schema-behavior-md
name: State・Event・Lifecycle（docs/spec/schema-behavior.md）
description: State・Event・Lifecycleの位置と語から docs/spec/schema-behavior.md を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。
build:
  # 節は位置ごと。並びはここが正（位置を足すときは、ここに足す）
  sections:
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-state } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-state } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-state-source } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-state-source } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-event } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-event } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-lifecycle } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-lifecycle } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-lifecycle-entry } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-lifecycle-entry } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-lifecycle-transition } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-lifecycle-transition } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-lifecycle-cause } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-lifecycle-cause } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-lifecycle-termination } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-lifecycle-termination } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-lifecycle-history } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-lifecycle-history } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-refinement } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-refinement } ] }
    - context: { $view: doc-contexts, $where: [ { path: id, equals: CTX-refinement-exit } ], $one: true }
      rows: { $view: doc-keywords-ordered, $where: [ { path: values.位置, equals: CTX-refinement-exit } ] }
template: schema-behavior-md.md
