id: schema-behavior-md
name: State・Event・Lifecycle（docs/spec/schema-behavior.md）
description: State・Event・Lifecycleの位置と語から docs/spec/schema-behavior.md を作ります。書き出しは ./gradlew devtrackDocs（docs/ はワークスペースの外なので、レポートの出力先には書きません）。
build:
  # 位置の所属と節順は spec/contexts の guide・order が正。
  sections:
    $each: { $view: doc-contexts, $where: [ { path: values.仕様書, equals: GUIDE-schema-behavior } ] }
    $bind: context
    $build:
      context: { $copy: . }
      rows:
        $view: doc-keywords-ordered
        $where: [ { path: values.位置, equals: { $copy: id, $of: context } } ]

template: schema-behavior-md.md
