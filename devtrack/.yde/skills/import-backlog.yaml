id: import-backlog
name: 指摘台帳の取り込み（BACKLOG.md）
description: docs/BACKLOG.md の表（1 行 1 指摘）を backlog/ の 1 件 1 ファイルへ取り込みます。取り込み直すと、取り込んだ項目だけを BACKLOG.md の値に合わせます。
kind: import
input: { format: markdown }
target: { file: "backlog/{id}.yaml" }
build:
  # Markdown の取り込みは文書の中の | で始まる行をすべて 1 つの表として読むので、テーマ管理の節の表の行も来る。
  # ID が UX- の番号の行だけを取り込む
  $when: { path: ID, matches: "^UX-[0-9]+$" }
  $then:
    id: { $copy: ID }
    # 件名: 「指摘」の欄の先頭の太字。太字が無ければ欄の全体
    title:
      $first:
        - { $value: { extract: [ { path: 指摘 }, "^\\*\\*(.+?)\\*\\*" ] } }
        - { $copy: 指摘 }
    # 状態: 絵文字を値へ。辞書に無い書き方はそのまま入り、検証が「決まった値でない」と指摘する
    status:
      $map: { $copy: 状態 }
      $using: { "📋": todo, "💬": discussing, "🚧": in-progress, "⏳": when-needed, "✅": resolved, "❌": declined }
    # 起点: 先頭の日付と、その後ろの場面
    origin_on: { $value: { extract: [ { path: 起点 }, "^([0-9]{4}-[0-9]{2}-[0-9]{2})" ] } }
    origin: { $value: { extract: [ { path: 起点 }, "^[0-9]{4}-[0-9]{2}-[0-9]{2}\\s*(.+)$" ] } }
    # 本文: 件名が太字の部分だけのときに、欄の全体を写す
    body: { $copy: 指摘, $when: { path: 指摘, startsWith: "**" } }
    memo: { $copy: 技術メモ（対応の当たり） }
    # テーマ: 対応先に T-nn があれば参照にする
    theme: { $value: { extract: [ { path: 対応先 }, "(T-[0-9]{2})" ] } }
    targets: { $copy: 対応先, $when: { path: 対応先, notEquals: "—" } }
