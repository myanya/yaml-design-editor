# グラフレンズの「見え方」で選ぶ。指摘の箱を状態で描き分け、終わった指摘を隠す（未解決とつながるものは残す）・残っている指摘だけを見せる絞り込みを持つ
id: item-lens
name: 指摘の状態
kind: lens
description: 指摘の箱を状態で描き分けます（解決・見送りは小さな札）。上の段の絞り込みで、終わった指摘を隠せます（未解決の指摘と関連でつながるものは残します）。
appearance:
  nodes:
    - level: entity
      entityType: backlog-item
      notation: item-card
      inputs:
        id: {$copy: id}
        title: {$copy: title}
        status: {$copy: data.status}
filters:
  - id: hide-closed
    label: 解決・見送りを隠す
    mode: hide
    entityType: backlog-item
    where: {path: data.status, oneOf: [resolved, declined]}
    # 関連する指摘の線で未解決の指摘と直接つながるものは、経緯として残す（小さな札のまま）
    keepIfLinked:
      via: [relates-to]
      entityType: backlog-item
      where: {not: {path: data.status, oneOf: [resolved, declined]}}
      depth: 1   # 辿る段数。2 にすると、関連を 2 段たどった先に未解決があるものも残す
  - id: in-motion
    label: 議論待ち・対応中だけ
    mode: show
    entityType: backlog-item
    where: {path: data.status, oneOf: [discussing, in-progress]}
  # 機能の箱（250 個）は、未解決の指摘が「関わる機能」で指すものだけ残す
  - id: features-with-open-items
    label: 機能は未解決の指摘があるものだけ
    mode: hide
    entityType: feature
    where: {path: id, exists: true}
    keepIfLinked:
      via: [concerns]
      entityType: backlog-item
      where: {not: {path: data.status, oneOf: [resolved, declined]}}
    default: true
