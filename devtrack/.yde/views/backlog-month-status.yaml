# 行＝起点の日の年月、列＝状態、セル＝指摘の件数。古い月に残る指摘と、決まった値でない状態（未分類の列）が見えます
id: backlog-month-status
name: 起点の月×状態
kind: matrix
rows:
  value: { yearMonth: { path: origin_on } }
cells:
  match:
    - node: { entity: backlog-item, bind: it }
  of: it
  columns:
    path: status
    values:
      - { value: todo, label: 📋 未着手 }
      - { value: discussing, label: 💬 議論待ち }
      - { value: in-progress, label: 🚧 対応中 }
      - { value: when-needed, label: ⏳ 必要になったら }
unclassified: 決まった値でない状態
