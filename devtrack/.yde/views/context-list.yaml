id: context-list
name: 位置の一覧
description: 語を書ける位置を並べます。
rows:
  idPattern: "CTX-*"
  schemaIds: [spec-context]
columns:
  - { label: 定義の言語, schemaId: spec-context, path: language }
  - { label: 説明, schemaId: spec-context, path: description }
  - { label: 実装する機能, schemaId: spec-context, path: features }
  # この位置に書ける語の数（語の側の参照を逆に辿る）
  - label: 語の数
    schemaId: spec-context
    value:
      count:
        all:
          of: k
          match:
            - node: { entity: context, bind: c }
            - edge: { relation: placed-in, dir: in }
            - node: { entity: keyword, bind: k }
  # 未解決の指摘: この位置を「関わる仕様」で参照する指摘のうち、解決でも見送りでもないもの（ID の並び）
  - label: 未解決の指摘
    schemaId: spec-context
    value:
      all:
        of: x
        path: id
        match:
          - node: { entity: context, bind: c }
          - edge: { relation: concerns-spec, dir: in }
          - node: { entity: backlog-item, bind: x }
        where:
          - { of: x, path: status, oneOf: [todo, discussing, in-progress, when-needed] }
