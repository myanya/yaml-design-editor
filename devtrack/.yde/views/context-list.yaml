id: context-list
name: 位置の一覧
description: 仕様書・分野・位置で絞り、仕様書の中の順に読みます。語や例の数は原本から求めます。
rows:
  match:
    - node:
        entity: context
        bind: c
  where:
    - of: c
      path: guide
      equals: $guide
    - of: c
      path: language
      equals: $language
    - of: c
      path: id
      equals: $context
columns:
  - label: 仕様書
    path: guide
    schemaId: spec-context
  - label: 説明
    schemaId: spec-context
    path: description
  - label: 語の数
    schemaId: spec-context
    value:
      count:
        all:
          of: k
          match:
            - node:
                entity: context
                bind: c
            - edge:
                relation: placed-in
                dir: in
            - node:
                entity: keyword
                bind: k
  - label: 未解決の指摘
    schemaId: spec-context
    value:
      all:
        of: x
        path: id
        match:
          - node:
              entity: context
              bind: c
          - edge:
              relation: concerns-spec
              dir: in
          - node:
              entity: backlog-item
              bind: x
        where:
          - of: x
            path: status
            oneOf:
              - todo
              - discussing
              - in-progress
              - when-needed
  - label: 位置を示す例
    schemaId: spec-context
    value:
      count:
        all:
          of: e
          match:
            - node:
                entity: context
                bind: self
            - edge:
                relation: illustrates
                dir: in
            - node:
                entity: example
                bind: e
params:
  - guide
  - language
  - context
order:
  schemaId: spec-context
  path: order
