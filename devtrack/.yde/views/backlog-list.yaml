id: backlog-list
name: 指摘の一覧
description: 指摘を起点の日の新しい順に並べます。ダッシュボードの区画が状態で絞ります。
rows:
  idPattern: "UX-*"
order:
  schemaId: item
  path: origin_on
  direction: desc
# 件名は行の ID の下に出る（件名の項目が role: title）ので、列にしない
columns:
  - label: 状態
    schemaId: item
    path: status
  - label: 起点の日
    schemaId: item
    path: origin_on
  - label: 起点
    schemaId: item
    path: origin
  - label: テーマ
    schemaId: item
    path: theme
  - label: 関連する指摘
    schemaId: item
    path: related
  - label: 対応先
    schemaId: item
    path: targets
  - label: 解決の記録
    schemaId: item
    path: resolutions
