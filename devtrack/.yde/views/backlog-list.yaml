id: backlog-list
name: 指摘の一覧
description: 台帳（backlog/）の未解決の指摘を、起点の日の新しい順に並べます。
# 行＝台帳の文書（スキーマ item）の指摘。記録（closed/）の指摘は closed-list
rows:
  match:
    - node: { entity: backlog-item, schema: item, bind: it }
order:
  schemaId: item
  path: origin_on
  direction: desc
# 件名は行の ID の下に出る（件名の項目が role: title）ので、列にしない
columns:
  - label: 状態
    path: status
  - label: 起点の日
    path: origin_on
  - label: 起点
    path: origin
  - label: テーマ
    path: theme
  - label: 対応先
    path: targets
