id: backlog-dashboard
name: 開発管理
kind: dashboard
default: true
description: 指摘を状態ごとに数え、一覧から指摘の個票へ進みます。段階 0 では docs/BACKLOG.md と記録（docs/archive/backlog-closed.md）の写しです（直すのは Markdown の側）。
sections:
  - id: discussing
    label: 議論待ち（オーナーの判断）
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: discussing }
      expect: exists
  - id: in-progress
    label: 対応中
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: in-progress }
      expect: exists
  - id: todo
    label: 未着手
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: todo }
      expect: exists
  - id: when-needed
    label: 必要になったら
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: when-needed }
      expect: exists
  - id: by-month
    label: 起点の月×状態
    view: backlog-month-status
  - id: themes
    label: テーマ
    view: theme-list
  - id: all
    label: 未解決のすべて
    view: backlog-list
  - id: closed
    label: 解決・見送り（記録）
    view: closed-list
