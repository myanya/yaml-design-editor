id: backlog-dashboard
name: 開発管理
kind: dashboard
default: true
description: 指摘を状態ごとに数え、一覧から指摘の個票と操作へ進みます。先頭の 2 つの区画がオーナーの判断を待つもの（議論待ちの指摘と、ロードマップの判断待ちの決定）です。
actions: [register-item]
sections:
  - id: discussing
    label: 議論待ち（オーナーの判断）
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: discussing }
      expect: exists
  # 判断待ち: ロードマップの本文の決定で、オーナーの判断を待っているもの（上の議論待ちの指摘と合わせて見る）
  - id: pending-decisions
    label: 判断待ちの決定（ロードマップ）
    view: roadmap-decisions
    filter:
      match:
        - node: { entity: roadmap-decision, bind: d }
      where:
        - { of: d, path: status, equals: pending }
      expect: exists
  - id: in-progress
    label: 対応中
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: in-progress }
      expect: exists
  - id: todo
    label: 未着手
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: todo }
      expect: exists
  - id: when-needed
    label: 必要になったら
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, equals: when-needed }
      expect: exists
  # 見つけてから 60 日以上たっても、未着手か議論待ちのままの指摘（基準日で数える。日付の差 daysBetween）
  - id: stale
    label: 60 日以上たつ未着手・議論待ち
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, oneOf: [todo, discussing] }
        - { of: it, path: origin_on, exists: true }
      check:
        - gte: [ { daysBetween: [ { of: it, path: origin_on }, $today ] }, 60 ]
  - id: by-month
    label: 起点の月×状態
    view: backlog-month-status
  - id: closed-by-month
    label: 解決の月×結果
    view: closed-by-month
  - id: themes
    label: テーマ
    view: theme-list
  # 未解決のすべて: 解決でも見送りでもない指摘（状態の書き方が誤っているものも入る）
  - id: all
    label: 未解決のすべて
    view: backlog-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, notEquals: resolved }
        - { of: it, path: status, notEquals: declined }
      expect: exists
  - id: closed
    label: 解決・見送り（記録）
    view: closed-list
    filter:
      match:
        - node: { entity: backlog-item, bind: it }
      where:
        - { of: it, path: status, oneOf: [resolved, declined] }
      expect: exists
  - id: manual-only-features
    label: 手動確認だけの機能
    view: feature-list
    filter:
      match:
        - node: { entity: feature, bind: f }
      where:
        - { of: f, path: tests, empty: true }
        - { of: f, path: manual_check, equals: true }
      expect: exists
