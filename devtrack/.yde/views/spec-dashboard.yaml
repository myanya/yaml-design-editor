id: spec-dashboard
name: 仕様
kind: dashboard
description: 仕様書を選び、位置・語・例へ進みます。専用の読み方は「原本を開く」→「ビュー」で選べます。キーの文字は語の一覧だけに効きます。
placement: vertical
inputs:
  - key: language
    label: 分野
    type: spec#定義の言語
  - key: guide
    label: 仕様書
    type: spec#仕様書参照
  - key: context
    label: 書ける位置
    type: spec#位置参照
  - key: term
    label: キーに含む文字
    type: string
sections:
  - id: guides
    label: 仕様書の目次
    view: spec-guide-list
    group: 読む
  - id: contexts
    label: 書ける位置
    view: context-list
    group: 読む
  - id: keywords
    label: 語を探す
    view: keyword-list
    group: 読む
  - id: schema-kinds
    label: スキーマの種類
    view: schema-kind-list
    group: 種類を確認する
  - id: base-types
    label: 基底の種類
    view: base-type-list
    group: 種類を確認する
