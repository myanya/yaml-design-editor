id: item
name: 指摘
kind: document
description: 指摘（未解決と、解決・見送り）を 1 件 1 ファイルで持ちます。docs/BACKLOG.md（未解決）と docs/archive/backlog-closed.md（解決・見送り）はここから生成します。
match: "backlog/*.yaml"
filePattern: "backlog/{id}.yaml"
# 文書のルートがオブジェクト型 指摘（同一性＝エンティティ backlog-item の定義・状態の検査つき）
root: { type: common#指摘 }
# 業務の操作: 画面（ダッシュボードの「操作」・個票の「この対象の操作」）・CLI `action`・エージェントで同じ名前で呼ぶ
actions:
  - id: register-item
    label: 指摘を登録する
    description: 新しい指摘を 1 件 1 ファイルで作ります。ID を省くと、使われている最大の番号の次を振ります。起点の日には今日が入ります。
    params:
      - { key: id, label: ID, type: common#指摘ID, description: 省くと採番します（UX- の最大の番号の次） }
      - { key: title, label: 件名, type: common#一行の文, required: true, minLength: 1 }
      - { key: origin, label: 起点, type: common#一行の文, required: true, minLength: 1, description: 見つけた場面（作業・試験・レビュー） }
      - { key: status, label: 状態, type: common#未解決の状態, default: todo }
      - { key: body, label: 指摘, type: common#文章, description: "件名だけで足りないとき。先頭に太字の件名を書く慣わしです（**件名**: 詳しく）" }
      - { key: memo, label: 技術メモ, type: common#文章, description: 対応の当たり }
      - { key: theme, label: テーマ, type: common#テーマ参照 }
      - { key: related, label: 関連する指摘, type: array, item: { type: common#指摘参照 } }
      - { key: targets, label: 対応先, type: common#一行の文 }
      - { key: features, label: 関わる機能, type: array, item: { type: common#機能参照 }, description: "FEATURES.md の機能 ID（例 [X-12]）" }
    # ID を渡したときに使われていれば、同じ名前のファイルがあるので作成が止まる
    do:
      - create:
          schema: item
          id: { prefix: "UX-", digits: 2 }
          params:
            id: { $copy: id }
            title: $title
            status: $status
            origin: $origin
            body: { $copy: body }
            memo: { $copy: memo }
            theme: { $copy: theme }
            related: { $copy: related }
            targets: { $copy: targets }
            features: { $copy: features }

  - id: change-status
    label: 状態を変える
    description: 未解決の指摘の状態を、未着手・議論待ち・対応中・必要になったらの間で変えます。解決と見送りは「解決にする」で行います。
    target: { entity: backlog-item, bind: it }
    params:
      - { key: status, label: 状態, type: common#未解決の状態, required: true }
    require:
      - match: [ { node: { entity: backlog-item, bind: x } } ]
        where: [ { of: x, path: status, oneOf: [todo, discussing, in-progress, when-needed] } ]
        expect: exists
        message: "{id} は解決・見送りの指摘です"
    do:
      - set: { of: it, path: status, value: $status }

  - id: record-progress
    label: 一部を解決する
    description: 未解決の指摘に、一部を解決した記録（日付と内容）を足します。指摘は未解決のままです。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: backlog-item, bind: it }
    params:
      - { key: date, label: 日付, type: common#年月日, required: true }
      - { key: note, label: 内容, type: common#文章, required: true, minLength: 1 }
      - { key: targets, label: 対応先, type: common#一行の文, description: この記録で手を入れた先 }
    require:
      - match: [ { node: { entity: backlog-item, bind: x } } ]
        where: [ { of: x, path: status, oneOf: [todo, discussing, in-progress, when-needed] } ]
        expect: exists
        message: "{id} は解決・見送りの指摘です"
    do:
      - insert:
          of: it
          path: resolutions
          value: { date: $date, kind: 一部, note: $note, targets: { $copy: targets } }

  - id: resolve-item
    label: 解決にする
    description: 未解決の指摘を解決（または見送り）にし、解決の日と解決の記録を入れます。対応先・関わる機能を書くと、指摘のものも置き換えます。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: backlog-item, bind: it }
    params:
      - { key: result, label: 結果, type: common#解決の結果, default: resolved }
      - { key: date, label: 解決の日, type: common#年月日, required: true }
      - { key: note, label: 内容, type: common#文章, required: true, minLength: 1, description: 何をしたか（見送りなら理由） }
      - { key: targets, label: 対応先, type: common#一行の文 }
      - { key: features, label: 関わる機能, type: array, item: { type: common#機能参照 }, description: "手を入れた機能（FEATURES.md の ID。書くと指摘の関わる機能を置き換える）" }
    require:
      - match: [ { node: { entity: backlog-item, bind: x } } ]
        where: [ { of: x, path: status, oneOf: [todo, discussing, in-progress, when-needed] } ]
        expect: exists
        message: "{id} は既に解決・見送りの指摘です"
    do:
      - set: { of: it, path: status, value: $result }
      - set: { of: it, path: closed_on, value: $date }
      - insert:
          of: it
          path: resolutions
          value:
            date: $date
            kind: { $map: $result, $using: { resolved: 解決, declined: 見送り } }
            note: $note
            targets: { $copy: targets }
      - when: { path: targets, exists: true }
        set: { of: it, path: targets, value: $targets }
      - when: { path: features, exists: true }
        set: { of: it, path: features, value: $features }

  - id: reopen-item
    label: 再開する
    description: 解決・見送りにした指摘を、未解決に戻します。解決の日を消し、再開の記録（理由）を足します。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: backlog-item, bind: it }
    params:
      - { key: status, label: 戻す状態, type: common#未解決の状態, default: todo }
      - { key: date, label: 日付, type: common#年月日, required: true }
      - { key: note, label: 理由, type: common#文章, required: true, minLength: 1 }
    require:
      - match: [ { node: { entity: backlog-item, bind: x } } ]
        where: [ { of: x, path: status, oneOf: [resolved, declined] } ]
        expect: exists
        message: "{id} は未解決の指摘です"
    do:
      - set: { of: it, path: status, value: $status }
      - delete: { of: it, path: closed_on }
      - insert:
          of: it
          path: resolutions
          value: { date: $date, kind: 再開, note: $note }
