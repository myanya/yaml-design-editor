# 関係レジストリ: 開発管理の関係の語彙。表示名と、参照の向き・多重度の決まりを 1 か所に書きます
id: devtrack-relations
kind: relations
entities:
  - { type: backlog-item, label: 指摘 }
  - { type: theme, label: テーマ }
  - { type: note, label: メモ }
  - { type: feature, label: 機能 }
  - { type: roadmap-theme, label: ロードマップのテーマ }
  - { type: roadmap-item, label: R 項目 }
  - { type: roadmap-outlook, label: ロードマップの展望 }
  - { type: roadmap-record, label: 記録の項 }
  - { type: roadmap-decision, label: 決定 }
relations:
  - name: bundled-in
    label: テーマ
    inverseLabel: 束ねる指摘
    source: [backlog-item]
    target: [theme]
    cardinality: { outMax: 1 }
    description: 指摘はテーマを 1 つまで参照します
  - name: relates-to
    label: 関連する指摘
    inverseLabel: 関連する指摘から
    source: [backlog-item]
    target: [backlog-item]
    description: 重複・派生・同じ原因など、一緒に見たい指摘を参照します
  - name: concerns
    label: 関わる機能
    inverseLabel: 関わる指摘
    source: [backlog-item]
    target: [feature]
    description: 指摘が関わる機能（docs/FEATURES.md の行）を参照します。機能の行に未解決の指摘として出ます
  - name: moved-to
    label: 移した先
    inverseLabel: 移してきた項目
    source: [roadmap-item]
    target: [roadmap-item]
    cardinality: { outMax: 1 }
    description: R 項目を別の R 項目へ移したとき、移した先を参照します（ROADMAP.md では「→ R47-41」）
  - name: snapshot-of
    label: 写しの元
    inverseLabel: 写しを持つ記録
    source: [roadmap-record]
    target: [roadmap-item]
    description: 記録の項が、今のロードマップにある R 項目の当時の写し（ID を持たない行）を持つとき、その R 項目を参照します
  - name: branch-of
    label: 枝の元
    inverseLabel: 枝の項目
    source: [roadmap-item]
    target: [roadmap-item]
    cardinality: { outMax: 1 }
    description: 枝の項目（R49-11a など）が、元の R 項目を参照します
  - name: planned-in
    label: ロードマップの項目
    inverseLabel: 関わる指摘
    source: [backlog-item]
    target: [roadmap-item, roadmap-theme]
    description: 指摘を対応した・対応するロードマップの R 項目かテーマを参照します
  - name: realizes
    label: 実装した機能
    inverseLabel: ロードマップの項目
    source: [roadmap-item]
    target: [feature]
    description: R 項目で足した・直した機能（docs/FEATURES.md の行）を参照します
