# 関係レジストリ: 開発管理の関係の語彙。表示名と、参照の向き・多重度の決まりを 1 か所に書きます
id: devtrack-relations
kind: relations
entities:
  - { type: backlog-item, label: 指摘 }
  - { type: theme, label: テーマ }
  - { type: note, label: メモ }
  - { type: feature, label: 機能 }
  - { type: roadmap-theme, label: ロードマップのテーマ }
  - { type: roadmap-item, label: R 項目 }
  - { type: roadmap-outlook, label: ロードマップの展望 }
relations:
  - name: bundled-in
    label: テーマ
    inverseLabel: 束ねる指摘
    source: [backlog-item]
    target: [theme]
    cardinality: { outMax: 1 }
    description: 指摘はテーマを 1 つまで参照します
  - name: relates-to
    label: 関連する指摘
    inverseLabel: 関連する指摘から
    source: [backlog-item]
    target: [backlog-item]
    description: 重複・派生・同じ原因など、一緒に見たい指摘を参照します
  - name: concerns
    label: 関わる機能
    inverseLabel: 関わる指摘
    source: [backlog-item]
    target: [feature]
    description: 指摘が関わる機能（docs/FEATURES.md の行）を参照します。機能の行に未解決の指摘として出ます
  - name: moved-to
    label: 移した先
    inverseLabel: 移してきた項目
    source: [roadmap-item]
    target: [roadmap-item]
    cardinality: { outMax: 1 }
    description: R 項目を別の R 項目へ移したとき、移した先を参照します（ROADMAP.md では「→ R47-41」）
