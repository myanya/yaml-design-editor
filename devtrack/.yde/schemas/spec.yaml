id: spec
name: 仕様の型
kind: library
description: 仕様（定義に書ける語）で使う型を 1 か所にまとめます。ID・分類（値の型）と、位置・基底の種類・語の形と検査（オブジェクト型）です。文の型は common のものを使います。
definitions:
  # ---- 値の型 ----
  位置ID:
    type: id
    pattern: "^CTX-[a-z][a-z0-9-]*$"
    placeholder: CTX-field
    sample: CTX-field
    description: 「CTX-」と位置の名前（英小文字とハイフン）。番号ではなく名前で付けます（並行の作業で番号が重ならないように）。
  基底の種類ID:
    type: id
    pattern: "^BT-[a-z]+$"
    placeholder: BT-string
    sample: BT-string
    description: 「BT-」と、type に書く基底の種類の名前。
  語ID:
    type: id
    pattern: "^KW-[a-z][a-z0-9-]*\\.[A-Za-z$][A-Za-z0-9]*$"
    placeholder: KW-field.required
    sample: KW-field.required
    description: 「KW-」と位置の名前、「.」、キー。ファイル名（spec/keywords/KW-field.required.yaml の形）にもなります。
  例ID:
    type: id
    pattern: "^EX-[a-z][a-zA-Z0-9-]*$"
    placeholder: EX-field-required
    sample: EX-field-required
    description: 「EX-」と例の名前。ファイル名（spec/examples/EX-field-required.yaml の形）にもなります。
  # 参照の型: 例が示す仕様（位置か語）。線の名前は illustrates。位置と語の側には「例」として出ます
  示す仕様:
    type: ref
    idPattern: ["CTX-*", "KW-*"]
    scope:
      schemaIds: [spec-context, spec-keyword]
    relation: illustrates
  例の分野:
    type: enum
    values:
      - { value: schema, label: スキーマ }
      - { value: checks, label: 検査と振る舞い }
      - { value: views, label: ビューと値の式 }
      - { value: templates, label: 変換のひな型とレポート }
      - { value: actions, label: 操作 }
      - { value: generation, label: 生成と段 }
  例の結果:
    type: enum
    values:
      - { value: ok, label: 通る（誤りも警告も無い） }
      - { value: schema-error, label: スキーマの読み込みの誤り }
      - { value: error, label: 検証のエラー }
      - { value: warning, label: 検証の警告（エラーは無い） }
      - { value: view-error, label: ビューの定義の誤り }
      - { value: report-error, label: レポートの定義の誤り }
  位置参照:
    type: ref
    idPattern: "CTX-*"
    scope:
      schemaIds: [spec-context]
    relation: placed-in
    description: この語を書ける位置。
  語参照:
    type: ref
    idPattern: "KW-*"
    scope:
      schemaIds: [spec-keyword]
    relation: alias-of
    description: 別の書き方である元の語。
  # 参照の型: 語・位置を実装する機能（FEATURES.md の行）。線の名前は implemented-by。機能の側には「定める語と位置」として出ます
  実装する機能:
    type: ref
    scope:
      schemaIds: [feature]
    relation: implemented-by
  # type に書く基底の種類。実装（FieldType）とメタスキーマの選択肢と同じであることを SpecTest が見ます
  基底の種類:
    type: enum
    values: [string, int, number, boolean, enum, date, time, datetime, file, id, ref, array, map, object, any]
  # スキーマ文書の kind に書く種類。実装（SchemaKind）とメタスキーマの選択肢と同じであることを SpecTest が見ます
  スキーマの種類:
    type: enum
    values: [document, library, relations, behavior]
  スキーマの種類ID:
    type: id
    pattern: "^KIND-[a-z]+$"
    placeholder: KIND-document
    sample: KIND-document
    description: 「KIND-」と、kind に書く種類の名前。
  基底の種類の分類:
    type: enum
    values:
      - { value: scalar, label: 表現の基底（スカラー） }
      - { value: semantic, label: 決まった形の文字（日付・時刻・ファイルの場所） }
      - { value: identity, label: 識別と参照 }
      - { value: structure, label: 構造 }
      - { value: open, label: 制約なし }
  定義の言語:
    type: enum
    values:
      - { value: schema, label: スキーマ }
      - { value: expression, label: 値の式・条件・クエリ }
      - { value: transform, label: 変換・生成・レポート }
      - { value: view, label: ビュー・ダッシュボード }
      - { value: agent, label: エージェント・アクティビティ・評価セット・skill }
      - { value: workspace, label: ワークスペースの構成・段 }
  語の分類:
    type: enum
    values:
      - { value: document, label: 文書と適用先 }
      - { value: structure, label: 形 }
      - { value: constraint, label: 必須と値の決まり }
      - { value: identity, label: 識別・参照・関係 }
      - { value: check, label: 検査 }
      - { value: behavior, label: 値の式・自動の値・操作と振る舞い }
      - { value: presentation, label: 表示と編集のヒント }
  語の状態:
    type: enum
    values:
      - { value: stable, label: 安定 }
      - { value: alias, label: 別の書き方 }
      - { value: deprecated, label: 廃止予定 }

  # ---- オブジェクト型 ----
  # 根拠: 仕様の語が、実装のどこで読まれ、メタスキーマのどこに書かれているか
  根拠:
    type: object
    fields:
      - key: metaschema
        label: メタスキーマ
        type: common#一行の文
        description: メタスキーマの中の場所（例 builtin-schemas/schema.yaml の definitions.field）。
      - key: reader
        label: 読む実装
        type: common#一行の文
        description: この語を読む実装（例 semantic-core/schema/SchemaTreeParser.kt の parseField）。
      - key: manual
        label: 利用者向けの説明
        type: common#一行の文
        description: 使い方を説明する文書（例 manual/schema.md）。

  # メタスキーマの中の場所: この位置の語が、メタスキーマのどの項目の並びに当たるか（SpecTest が語と必須を突き合わせる）
  メタスキーマの場所:
    type: object
    fields:
      - key: schema
        label: メタスキーマ
        type: enum
        required: true
        values:
          - { value: schema, label: スキーマ（builtin-schemas/schema.yaml） }
          - { value: relations, label: 関係レジストリ（builtin-schemas/relations.yaml） }
          - { value: transform, label: 生成の定義（builtin-schemas/transform.yaml） }
          - { value: report, label: レポート（builtin-schemas/report.yaml） }
          - { value: view, label: ビュー（builtin-schemas/view.yaml） }
          - { value: workspace, label: ワークスペースの構成（builtin-schemas/workspace.yaml） }
          - { value: view-chart, label: チャートの断片（app-core の view/chart/schema.yaml） }
          - { value: view-flow, label: 業務フロー図の断片（app-core の view/flow/schema.yaml） }
          - { value: flow-model, label: フローの図のモデル（app-core の view/flow/flow-model.yaml） }
          - { value: agent, label: エージェント（builtin-schemas/agent.yaml） }
          - { value: activity, label: アクティビティ（builtin-schemas/activity.yaml） }
          - { value: eval, label: 評価セット（builtin-schemas/eval.yaml） }
          - { value: skill, label: skill（builtin-schemas/skill.yaml） }
          - { value: stage, label: 段の規則と補正（builtin-schemas/stage.yaml） }
      - key: path
        label: たどる道
        type: array
        item: { type: word }
        description: ルートからたどるキーの並び（断片のルートの項目は、空で書きます）。項目の並び（fields）を持つ場所では項目のキー、そうでない場所ではマップのキー（例 [definitions, action]・[root, relations, item]）。
      - key: missing
        label: メタスキーマに無い語
        type: array
        unique: true
        item: { type: word }
        description: 読み取りの実装は読むが、メタスキーマのこの場所に無いキー（分かっているずれ）。指摘を登録して、メタスキーマに足されたらここから外します。

  # 読み取りの実装の中の語の集まり: メタスキーマが形を決めていない位置で、語が実装と同じであることを SpecTest が見る
  実装の語の集まり:
    type: object
    fields:
      - key: sets
        label: キーの集まり
        type: array
        item: { type: word }
        description: 読み取りが「使えるキー」として持つ集まり（クラス名.名前。例 QueryWhere.KEYS）。パッケージは semantic.schema で、ほかのパッケージは頭に書きます（例 workspace.layout.DefinitionScopes.KEYS）。
      - key: enums
        label: 列挙
        type: array
        item: { type: word }
        description: 値がそのまま語になる列挙（クラス名。入れ子は ValueExpr.UnaryFn の形）。
      - key: extra
        label: そのほかの語
        type: array
        unique: true
        item: { type: word }
        description: 上の集まりと列挙に無く、読み取りが個別に読む語。

  # 位置: 語を書ける場所（項目定義・文書のトップレベル・操作 …）。この形の要素がエンティティ context の定義
  位置:
    type: object
    label: 位置
    entity: { type: context, defines: true }
    fields:
      - { key: id, label: ID, type: 位置ID, required: true }
      - { key: title, label: 名前, type: common#一行の文, required: true, role: title }
      - { key: language, label: 定義の言語, type: 定義の言語, required: true }
      - { key: description, label: 説明, type: common#文章, required: true }
      - { key: meta, label: メタスキーマの中の場所, type: メタスキーマの場所, description: 書くと、この位置の語と必須がメタスキーマと同じであることを SpecTest が見ます。 }
      - { key: code, label: 実装の語の集まり, type: 実装の語の集まり, description: 書くと、この位置の語が、実装の集まり・列挙・そのほかの語の和と同じであることを SpecTest が見ます。 }
      - key: features
        label: 実装する機能
        type: array
        unique: true
        item: { type: 実装する機能 }
        description: この位置の語を読んで働く機能（FEATURES.md の行）。機能の個票に「定める語と位置」として出ます。語ごとに違うときは、語の側にも書きます。
      - { key: evidence, label: 根拠, type: 根拠 }

  # 基底の種類: type に書ける基底の種類 1 つ。この形の要素がエンティティ base-type の定義
  基底の種類の定義:
    type: object
    label: 基底の種類
    entity: { type: base-type, defines: true }
    fields:
      - { key: id, label: ID, type: 基底の種類ID, required: true }
      - { key: name, label: 名前, type: 基底の種類, required: true, role: title, description: type に書く文字。 }
      - { key: category, label: 分類, type: 基底の種類の分類, required: true }
      - { key: value, label: 値の形, type: common#一行の文, required: true, description: この種類の項目に書く YAML の値の形。 }
      - { key: description, label: 意味, type: common#文章, required: true }

  # スキーマの種類: kind に書ける種類 1 つ。この形の要素がエンティティ schema-kind の定義
  スキーマの種類の定義:
    type: object
    label: スキーマの種類
    entity: { type: schema-kind, defines: true }
    fields:
      - { key: id, label: ID, type: スキーマの種類ID, required: true }
      - { key: name, label: 名前, type: スキーマの種類, required: true, role: title, description: kind に書く文字。 }
      - { key: target, label: 適用先, type: common#一行の文, required: true, description: この種類のスキーマが、どの文書に当たるか。 }
      - { key: description, label: 意味, type: common#文章, required: true }

  # 例: 小さなワークスペース（ファイルの並び）と、開いて検証したときの結果。SpecTest が実際に開いて確かめます。この形の要素がエンティティ example の定義
  例:
    type: object
    label: 例
    entity: { type: example, defines: true }
    fields:
      - { key: id, label: ID, type: 例ID, required: true }
      - { key: title, label: 何を示すか, type: common#一行の文, required: true, role: title }
      - { key: area, label: 分野, type: 例の分野, required: true, description: 参照文書を分ける分野（docs/spec/examples-分野.md）。 }
      - key: illustrates
        label: 示す仕様
        type: array
        required: true
        unique: true
        item: { type: 示す仕様 }
        description: この例が示す位置か語。
      - key: files
        label: ファイル
        type: array
        required: true
        display: list
        description: 例のワークスペースに置くファイル。定義は .yde/ の下、文書はスキーマの match に合う場所に書きます。
        item:
          type: object
          fields:
            - { key: path, label: 場所, type: common#一行の文, required: true, role: title, description: ワークスペース相対の場所。 }
            - { key: text, label: 中身, type: text, required: true, rows: 12 }
      - key: expect
        label: 結果
        type: object
        required: true
        fields:
          - { key: result, label: 結果, type: 例の結果, required: true }
          - { key: message, label: 文面の一部, type: common#一行の文, description: 誤り・エラー・警告の文面に含まれる文字。通る例には書きません。 }
          - key: report
            label: レポートの出力
            type: object
            description: 結果が「通る」の例で、レポートを作ったときの文字。変換のひな型とレポートのひな形の動きを示します。
            fields:
              - { key: id, label: レポート, type: common#一行の文, required: true, description: 例の中のレポートの ID。 }
              - { key: params, label: 渡す値, type: map, value: { type: common#一行の文 }, description: 受け取る値の名前 → 値。 }
              - { key: text, label: 出力, type: text, required: true, rows: 8, description: 作った文字の全体（末尾の空白と改行は比べません）。 }
          - key: action
            label: 操作の結果
            type: object
            description: 結果が「通る」の例で、操作を計画して適用したときの結果。断られる例は fails、通る例は適用のあとのファイルの中身を書きます。
            fields:
              - { key: name, label: 操作, type: common#一行の文, required: true, description: 操作の ID（型の操作は 型名.操作名）。 }
              - { key: target, label: 受け手, type: common#一行の文, description: 受け手の ID。 }
              - { key: params, label: 渡す値, type: map, value: { type: any }, description: 受け取る値の名前 → 値。 }
              - { key: fails, label: 断りの文面の一部, type: common#一行の文, description: 計画できずに断られる例で、断りの文面に含まれる文字。 }
              - key: files
                label: 適用のあとのファイル
                type: array
                display: list
                description: 適用のあとの中身（YAML として同じであること。書き方やキーの順は比べません）。確かめたいファイルだけを書きます。
                item:
                  type: object
                  fields:
                    - { key: path, label: 場所, type: common#一行の文, required: true, role: title }
                    - { key: text, label: 中身, type: text, required: true, rows: 8 }
          - key: generate
            label: 生成の結果
            type: object
            description: 結果が「通る」の例で、生成を計画したときの結果。誤りになる例は fails、通る例は作る文書の中身を書きます。
            fields:
              - { key: fails, label: 誤りの文面の一部, type: common#一行の文, description: 生成の定義や組み立ての誤りになる例で、誤りの文面に含まれる文字。 }
              - key: files
                label: 作る文書
                type: array
                display: list
                description: 作る文書の中身（YAML として同じであること）。確かめたい文書だけを書きます。
                item:
                  type: object
                  fields:
                    - { key: path, label: 場所, type: common#一行の文, required: true, role: title }
                    - { key: text, label: 中身, type: text, required: true, rows: 8 }
          - key: view
            label: ビューの行
            type: object
            description: 結果が「通る」の例で、ビューを解決したときの行と値。行は並びの順に、すべて書きます。値は、確かめたい列だけを書きます。
            fields:
              - { key: id, label: ビュー, type: common#一行の文, required: true, description: 例の中のビューの ID。 }
              - key: rows
                label: 行
                type: array
                required: true
                display: list
                item:
                  type: object
                  fields:
                    - { key: id, label: 行の ID, type: common#一行の文, required: true, role: title }
                    - { key: values, label: 値, type: map, value: { type: common#一行の文 }, description: 列の見出し → 値の文字（配列は「・」でつないだ文字。値が無ければ空）。 }

  # 語の形: 語を書ける基底の種類（項目定義の語）かスキーマの種類（文書のトップレベルの語）ごとの、値の形と意味。限らない語は省きます
  語の形:
    type: object
    fields:
      - key: applies_to
        label: 書ける基底の種類
        type: array
        unique: true
        item: { type: 基底の種類 }
        description: この形で書ける項目の基底の種類。省くと、どの種類の項目にも書けます。
      - key: kinds
        label: 書けるスキーマの種類
        type: array
        unique: true
        item: { type: スキーマの種類 }
        description: この形で書けるスキーマ文書の種類（文書のトップレベルの語）。省くと、どの種類の文書にも書けます。
      - { key: value, label: 値の形, type: common#一行の文, required: true, description: 語に書く YAML の値の形（例 真偽値・正規表現の文字列）。 }
      - { key: required, label: 必須, type: boolean, description: 必ず書く語。 }
      - { key: default, label: 省いたとき, type: common#一行の文, description: 省いたときの扱い（既定の値）。 }
      - { key: meaning, label: 意味, type: common#文章, required: true }

  # 語: 1 つの位置に書けるキー 1 つ。この形の要素がエンティティ keyword の定義
  語:
    type: object
    label: 語
    entity: { type: keyword, defines: true }
    fields:
      - { key: id, label: ID, type: 語ID, required: true }
      - { key: key, label: キー, type: common#一行の文, required: true, role: title, description: YAML に書くキーの文字。 }
      - { key: context, label: 位置, type: 位置参照, required: true }
      - { key: group, label: 分類, type: 語の分類, description: 参照文書の節。スキーマ文書と項目定義の語に書きます。 }
      - { key: order, label: 並び, type: int, description: 参照文書の表での並び（位置の中の順）。 }
      - { key: status, label: 状態, type: 語の状態, required: true, default: stable }
      - { key: alias_of, label: 元の語, type: 語参照, description: 状態が「別の書き方」のとき、元の語。 }
      - key: forms
        label: 形
        type: array
        required: true
        item: { type: 語の形 }
        description: 書ける基底の種類ごとの値の形と意味。種類で意味が変わらない語は 1 つだけ書きます。
      - { key: inherit, label: 型からの引き継ぎ, type: common#一行の文, description: 型の定義に書いたとき、その型を使う項目にどう引き継がれるか。 }
      - key: features
        label: 実装する機能
        type: array
        unique: true
        item: { type: 実装する機能 }
        description: この語を読んで働く機能（FEATURES.md の行）。機能の個票に「定める語」として出ます。
      - { key: evidence, label: 根拠, type: 根拠 }
    constraints:
      - id: keyword-id-matches
        description: 語の ID は「KW-」＋位置の名前＋「.」＋キーであること
        check:
          - eq:
              - { path: id }
              - { format: "KW-{ctx}.{key}", with: { ctx: { extract: [ { path: context }, "^CTX-(.+)$" ] }, key: { path: key } } }
        level: error
        message: "語「{id}」の ID が、位置とキーから決まる形（KW-位置.キー）と違います"
      - id: alias-has-origin
        description: 状態が「別の書き方」の語は、元の語を持つこと
        where:
          - { path: status, equals: alias }
          - { path: alias_of, exists: false }
        expect: absent
        level: error
        message: "語「{id}」は別の書き方ですが、元の語（alias_of）がありません"
