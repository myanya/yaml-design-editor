id: common
name: 共通の型
kind: library
description: 開発管理で使う型を 1 か所にまとめます。ID・状態・日付と文の型（値の型）と、指摘・解決の記録・テーマ・メモの形と検査（オブジェクト型）です。
definitions:
  # ---- 値の型 ----
  指摘ID:
    type: id
    pattern: "^UX-[0-9]+$"
    placeholder: UX-001
    sample: UX-258
    description: 「UX-」と番号。ファイル名（backlog/UX-123.yaml の形）にもなります。新しい番号は、backlog/ の最大の番号の次です（画面では欄の候補の「採番」）。
  テーマID:
    type: id
    pattern: "^T-[0-9]{2}$"
    placeholder: T-01
    sample: T-01
    description: 「T-」と 2 桁の数字。複数の指摘が絡む横断課題の番号です。
  メモID:
    type: id
    pattern: "^NOTE-[0-9]{2}$"
    placeholder: NOTE-01
    sample: NOTE-01
    description: 「NOTE-」と 2 桁の数字。台帳に添える文章（所感メモなど）の番号です。
  # 参照の型: 候補と検証の対象をテーマに限定し、線の名前（関係）を bundled-in にします
  テーマ参照:
    type: ref
    idPattern: "T-*"
    scope:
      schemaIds: [theme]
    relation: bundled-in
    description: この指摘を束ねるテーマ。テーマに入っていなければ省略します。
  年月日:
    type: date
    format: "yyyy年M月d日"
    description: YYYY-MM-DD 形式で入力します（例 2026-11-07）。
  一行の文:
    type: line
  文章:
    type: text
    rows: 4
  # 状態: 保存する値は英語、画面の表示は BACKLOG.md と同じ絵文字と語
  指摘の状態:
    type: enum
    values:
      - { value: todo, label: 📋 未着手 }
      - { value: discussing, label: 💬 議論待ち }
      - { value: in-progress, label: 🚧 対応中 }
      - { value: when-needed, label: ⏳ 必要になったら }
      - { value: resolved, label: ✅ 解決 }
      - { value: declined, label: ❌ 見送り }
  # 操作の受け取る値: 未解決の状態だけ（解決と見送りは「解決にする」で入れる）
  未解決の状態:
    type: enum
    values:
      - { value: todo, label: 📋 未着手 }
      - { value: discussing, label: 💬 議論待ち }
      - { value: in-progress, label: 🚧 対応中 }
      - { value: when-needed, label: ⏳ 必要になったら }
  解決の結果:
    type: enum
    values:
      - { value: resolved, label: ✅ 解決 }
      - { value: declined, label: ❌ 見送り }
  # 解決の記録の種類: 値をそのまま台帳の文（docs/BACKLOG.md・記録の状態の欄）に出すので、値も日本語にする
  記録の種類:
    type: enum
    values:
      - { value: 一部, label: 一部の解決（指摘は未解決のまま） }
      - { value: 解決, label: 解決 }
      - { value: 見送り, label: 見送り }
      - { value: 再開, label: 再開（解決・見送りを取り消して未解決に戻した） }
  # 参照の型: 関連する指摘（重複・派生・同じ原因など）。線の名前は relates-to
  指摘参照:
    type: ref
    idPattern: "UX-*"
    scope:
      schemaIds: [item]
    relation: relates-to
  # 参照の型: 指摘が関わる機能（FEATURES.md の行）。線の名前は concerns。機能の行に未解決の指摘として出ます
  機能参照:
    type: ref
    scope:
      schemaIds: [feature]
    relation: concerns
  テーマの状態:
    type: enum
    values:
      - { value: discussing, label: 議論待ち }
      - { value: concept, label: 構想 }
      - { value: on-hold, label: 保留 }

  # ---- オブジェクト型 ----
  # 解決の記録: 指摘の中に足していく（一部の解決・解決・見送り・再開）。操作「一部を解決する」「解決にする」「再開する」が足す
  解決の記録:
    type: object
    label: 解決の記録
    fields:
      - key: date
        label: 日付
        type: 年月日
        required: true
      - key: kind
        label: 種類
        type: 記録の種類
        required: true
      - key: note
        label: 内容
        type: 文章
        description: 何を解決したか。最後の解決の内容は技術メモに書いてあることもあります。
      - key: targets
        label: 対応先
        type: 一行の文
        description: この記録で手を入れた先（FEATURES・ROADMAP の項目・テスト名など）。
      - key: section
        label: 記録の節
        type: 一行の文
        description: 2026-11-07 より前の記録（docs/archive/backlog-closed.md）で、この指摘が置かれていた節の見出し。

  # 指摘: 1 件 1 ファイル。この形の要素がエンティティ backlog-item の定義（誕生）
  指摘:
    type: object
    label: 指摘
    entity: { type: backlog-item, defines: true }
    fields:
      - key: id
        label: ID
        type: 指摘ID
        required: true
      - key: title
        label: 件名
        type: 一行の文
        role: title
        required: true
        description: 1 行の要約。台帳の表では、本文が無いときにこの件名が「指摘」の欄になります。
      - key: status
        label: 状態
        type: 指摘の状態
        required: true
        default: todo
      # 未解決の指摘には必須（下の検査）。古い記録には日付の無いものがあるので、型では必須にしない
      - key: origin_on
        label: 起点の日
        type: 年月日
        auto: created
        description: 指摘を見つけた日。登録の操作や新しい文書では、作った日が入ります。
      - key: origin
        label: 起点
        type: 一行の文
        description: 指摘を見つけた場面（作業・試験・レビュー）。
      - key: body
        label: 指摘
        type: 文章
        description: "件名だけで足りないときの本文。台帳の表の「指摘」の欄で、先頭に太字の件名を書く慣わしです（`**件名**: 詳しく`）。"
      - key: memo
        label: 技術メモ
        type: 文章
        description: 対応の当たり。「必要になったら」の指摘には必須です。
      - key: theme
        label: テーマ
        type: テーマ参照
      - key: related
        label: 関連する指摘
        type: array
        description: 重複・派生・同じ原因など、一緒に見たい指摘。相手の個票には「関連する指摘から」として出ます。
        item: { type: 指摘参照 }
      - key: targets
        label: 対応先
        type: 一行の文
        description: 対応した・対応する先（ROADMAP の項目・テスト名など）の記録の文字。機能は「関わる機能」、ROADMAP の R 項目とテーマは「ロードマップの項目」に参照で書きます。
      - key: features
        label: 関わる機能
        type: array
        description: この指摘が関わる機能（FEATURES.md の行）。未解決の指摘は、機能の行の「未解決の指摘」に出ます。
        item: { type: 機能参照 }
      - key: roadmap
        label: ロードマップの項目
        type: array
        description: この指摘を対応した・対応するロードマップの R 項目かテーマ（ROADMAP.md の ID）か、この指摘の扱いを決める決定（DEC-）。相手の側には「関わる指摘」として出ます。
        item: { type: ロードマップ参照 }
      - key: closed_on
        label: 解決の日
        type: 年月日
        description: 解決・見送りにした日。解決・見送りの指摘には必須で、未解決の指摘には書きません。
      - key: resolutions
        label: 解決の記録
        type: array
        display: list
        description: 一部の解決・解決・見送り・再開を足していきます（操作「一部を解決する」「解決にする」「再開する」）。
        item: { type: 解決の記録 }
    # 型の検査: 指摘ごとに評価する。台帳の運用（devtrack/README.md「運用」）を検査にしたもの
    constraints:
      - id: open-has-origin-date
        description: 未解決の指摘には、起点の日があること
        where:
          - { path: status, oneOf: [todo, discussing, in-progress, when-needed] }
          - { path: origin_on, exists: false }
        expect: absent
        level: error
        message: "指摘「{id}」に起点の日がありません"
      - id: closed-has-date
        description: 解決・見送りの指摘には、解決の日があること
        where:
          - { path: status, oneOf: [resolved, declined] }
          - { path: closed_on, exists: false }
        expect: absent
        level: error
        message: "解決・見送りの指摘「{id}」に解決の日がありません"
      - id: open-has-no-closed-date
        description: 未解決の指摘には、解決の日を残さないこと
        where:
          - { path: status, oneOf: [todo, discussing, in-progress, when-needed] }
          - { path: closed_on, exists: true }
        expect: absent
        level: error
        message: "未解決の指摘「{id}」に解決の日が残っています"
      - id: closed-not-before-origin
        description: 解決の日は起点の日以降であること
        where:
          - { path: closed_on, exists: true }
          - { path: origin_on, exists: true }
        check:
          - { gte: [ { path: closed_on }, { path: origin_on } ] }
        level: error
      - id: when-needed-has-memo
        description: 「必要になったら」の指摘には、実装の当たりを技術メモに残すこと
        where:
          - { path: status, equals: when-needed }
          - { path: memo, empty: true }
        expect: absent
        level: warning
        message: "「必要になったら」の指摘「{id}」に、実装の当たり（技術メモ）がありません"

  # テーマ: 複数の指摘が絡む横断課題。この形の要素がエンティティ theme の定義
  テーマ:
    type: object
    label: テーマ
    entity: { type: theme, defines: true }
    fields:
      - key: id
        label: ID
        type: テーマID
        required: true
      - key: title
        label: 名前
        type: 一行の文
        role: title
        required: true
      - key: status
        label: 状態
        type: テーマの状態
        required: true
      - key: status_note
        label: 状態の補足
        type: 一行の文
        description: 台帳の見出しの【】の中（例「保留——落ち着いてから議論を再開する」）。省くと状態の名前を出します。
      - key: body
        label: 本文
        type: 文章
        rows: 12
        description: テーマの本文（Markdown）。束ねる指摘・論点・方策を書きます。台帳の「テーマ管理」の節にそのまま出ます。

  # メモ: 台帳に添える文章（所感メモなど）
  メモ:
    type: object
    label: メモ
    entity: { type: note, defines: true }
    fields:
      - key: id
        label: ID
        type: メモID
        required: true
      - key: title
        label: 名前
        type: 一行の文
        role: title
        required: true
      - key: body
        label: 本文
        type: 文章
        rows: 12
        description: 本文（Markdown）。台帳の節にそのまま出ます。

  # ---- 機能（docs/FEATURES.md の行。エージェント向けの索引） ----
  機能ID:
    type: id
    pattern: "^(W|E|S|V|I|X|A|AG|C|SK|OP|LC)-[0-9]{2,3}$"
    placeholder: W-01
    sample: LC-29
    description: 系統の接頭辞（W・E・S・V・I・X・A・AG・C・SK・OP・LC）と番号。ファイル名（features/W-01.yaml の形）にもなります。
  機能の系統:
    type: enum
    values:
      - { value: W, label: W ワークスペース・ファイル管理 }
      - { value: E, label: E 文書編集 }
      - { value: S, label: S スキーマ }
      - { value: V, label: V 検証 }
      - { value: I, label: I ID・参照 }
      - { value: X, label: X ワークスペース横断ビュー }
      - { value: A, label: A AI による作成支援 }
      - { value: AG, label: AG エージェント実行（アクティビティ） }
      - { value: C, label: C コア API・CLI（エージェント基盤） }
      - { value: SK, label: SK skill（フォーマット適合） }
      - { value: OP, label: OP 操作（型の操作とアクション） }
      - { value: LC, label: LC ローカル接続の基盤 }
  モジュール:
    type: enum
    values: [yaml-core, semantic-core, workspace-core, app-core, agent, desktop, cli, local-server, format-office, web-ui, repo-tests]
  # テストの種類: 単体（名前だけ）・UI（Compose の画面を組み立てるテスト）は ./gradlew test に含まれる。検査は別のタスクか手順。
  # 手動の確認はテストではなく、機能の印 manual_check で持つ
  テストの種類:
    type: enum
    values:
      - { value: unit, label: 単体（./gradlew test。名前のあるテストは省略できる） }
      - { value: ui, label: UI（Compose の画面を組み立てるテスト。./gradlew test に含まれる） }
      - { value: check, label: 検査（./gradlew test に含まれない別のタスクか手順） }

  実装の場所:
    type: object
    label: 実装の場所
    fields:
      - key: path
        label: 場所
        type: 一行の文
        description: ファイルの短い場所（モジュールの中のパッケージからのパス。例 ui/shell/StartScreen.kt）か、クラス・関数の名前。FEATURES.md ではバッククォートで囲んで出します。
      - key: detail
        label: 補足
        type: 一行の文
        description: 場所の中の関数名など（FEATURES.md では場所の後ろの（）の中）。
      - key: module
        label: モジュール
        type: モジュール
        description: その場所があるモジュール（FEATURES.md には出しません。場所を一意に引くため）。
      - key: text
        label: 文で書く場合
        type: 一行の文
        description: 場所の形にならないもの（例「資源 `view/chart/schema.yaml`」）。path の代わりに書き、そのまま出します。
    constraints:
      - id: place-has-path-or-text
        description: 実装の場所には、場所（path）か文（text）のどちらかがあること
        where:
          - { path: path, exists: false }
          - { path: text, exists: false }
        expect: absent
        level: error
        message: "実装の場所に、場所（path）も文（text）もありません"

  テスト:
    type: object
    label: テスト
    fields:
      - key: name
        label: テスト名
        type: 一行の文
        description: テストのクラス名（例 WorkspaceInitTest）か検査の名前。./gradlew test --tests '*名前*' で絞って回せます。
      - key: kind
        label: 種類
        type: テストの種類
        description: 名前のあるテストは省くと単体。名前の無い行（「単体（一部）」）には必ず書きます。手動の確認は機能の manual_check に書きます。
      - key: note
        label: 補足
        type: 一行の文
        description: 何を確かめるか（FEATURES.md では（）の中）。
    constraints:
      - id: test-has-name-or-kind
        description: テストには、名前か種類のどちらかがあること
        where:
          - { path: name, exists: false }
          - { path: kind, exists: false }
        expect: absent
        level: error
        message: "テストに、名前（name）も種類（kind）もありません"

  文書の参照:
    type: object
    label: 文書の参照
    fields:
      - key: label
        label: 見出し
        type: 一行の文
        required: true
        description: 見出しを書かないとき、FEATURES.md のリンクの文字（例 ui）。
      - key: link
        label: 場所
        type: 一行の文
        required: true
        description: docs/ からの相対パス（例 architecture/ui.md）。
      - key: heading
        label: 見出し
        type: 一行の文
        description: その文書の見出しの文字（先頭からの一致でよい。例 UI シェル）。書くと FEATURES.md では「architecture/ui.md「UI シェル」」の形で出し、実在は DocReferencesTest が見ます。

  manual の参照:
    type: object
    label: manual の参照
    fields:
      - key: link
        label: 場所
        type: 一行の文
        required: true
        description: docs/ からの相対パス（例 manual/views.md）。
      - key: heading
        label: 見出し
        type: 一行の文
        description: その文書の見出しの文字（先頭からの一致でよい。例 箱の絞り込み）。FEATURES.md では「manual/views.md「箱の絞り込み」」の形で出し、実在は DocReferencesTest が見ます。

  # 機能: 1 件 1 ファイル。この形の要素がエンティティ feature の定義
  機能:
    type: object
    label: 機能
    entity: { type: feature, defines: true }
    fields:
      - key: id
        label: ID
        type: 機能ID
        required: true
      - key: title
        label: 機能
        type: 一行の文
        role: title
        required: true
        description: FEATURES.md の「機能」の欄。何の機能かと、grep の手がかりになる語彙（バッククォートの名前）だけを 100 字前後で。振る舞いの説明は指し先の manual・architecture に書き、経緯は書きません。
      - key: implementation
        label: 主な実装
        type: array
        required: true
        item: { type: 実装の場所 }
      - key: tests
        label: テスト
        type: array
        item: { type: テスト }
        description: 自動のテスト（単体・UI・検査）。手動の確認だけなら書かずに manual_check を true にします。
      - key: manual_check
        label: 手動で確かめる
        type: boolean
        description: 自動のテストで確かめきれず、手動で確かめている（FEATURES.md では「手動」。画面は skill ui-check）。
      - key: manual_check_note
        label: 手動で確かめる場面
        type: 一行の文
        description: 何を手動で確かめるか（例 画面。FEATURES.md では「手動（画面）」）。
      - key: more_tests
        label: ほかのテストもある
        type: boolean
        description: 代表のテストだけを書いたとき（FEATURES.md では「ほか」）。
      - key: design
        label: 設計
        type: array
        required: true
        item: { type: 文書の参照 }
        description: 設計文書（architecture/ など）の主題。
      - key: manual
        label: 操作の説明
        type: array
        item: { type: manual の参照 }
        description: 利用者向けの説明（manual/ の見出し）。この機能を変えたら、ここを直す。利用者が操作しない内部の基盤なら書かずに internal を true にします。
      - key: internal
        label: 内部の基盤
        type: boolean
        description: 利用者が操作しない内部の基盤（FEATURES.md の操作の説明の欄は「—（内部）」）。
    constraints:
      - id: feature-has-places
        description: 機能には、主な実装と設計がそれぞれ 1 つ以上あること
        where:
          - or:
              - { path: implementation, empty: true }
              - { path: design, empty: true }
        expect: absent
        level: error
        message: "機能「{id}」の主な実装か設計が空です"
      - id: feature-has-tests-or-manual-check
        description: 機能には、自動のテストか、手動で確かめる印（manual_check）のどちらかがあること
        where:
          - { path: tests, empty: true }
          - or:
              - { path: manual_check, exists: false }
              - { path: manual_check, equals: false }
        expect: absent
        level: error
        message: "機能「{id}」に、テストも手動で確かめる印（manual_check: true）もありません"
      - id: feature-has-manual-or-internal
        description: 機能には、操作の説明（manual の参照）か、内部の基盤の印（internal）のどちらかがあること
        where:
          - { path: manual, empty: true }
          - or:
              - { path: internal, exists: false }
              - { path: internal, equals: false }
        expect: absent
        level: error
        message: "機能「{id}」に、操作の説明（manual）も内部の基盤の印（internal: true）もありません"
      - id: internal-has-no-manual
        description: 内部の基盤の印（internal）を付けた機能には、操作の説明を書かないこと
        where:
          - { path: internal, equals: true }
          - { path: manual, empty: false }
        expect: absent
        level: warning
        message: "機能「{id}」は内部の基盤の印があるのに、操作の説明（manual）があります"

  # ---- ロードマップ（docs/ROADMAP.md のテーマと R 項目） ----
  ロードマップのテーマID:
    type: id
    pattern: "^P[0-9]+$"
    placeholder: P53
    sample: P52
    description: 「P」と番号。ファイル名（roadmap/P52.yaml の形）にもなります。
  R項目ID:
    type: id
    pattern: "^R[0-9]+-[0-9]+[a-z]?$"
    placeholder: R52-06
    sample: R52-05
    description: 「R」とテーマの番号・「-」・項目の番号（例 R52-05）。枝の項目は末尾に英小文字（例 R28-05a）。
  記録の項ID:
    type: id
    pattern: "^RH-[0-9]{3}$"
    placeholder: RH-069
    sample: RH-001
    description: 「RH-」と 3 桁の番号。記録（docs/archive/roadmap-history.md）の中の順で、新しい項は最大の番号の次（記録の末尾に出ます）。
  決定ID:
    type: id
    pattern: "^DEC-[0-9]{3}$"
    placeholder: DEC-012
    sample: DEC-001
    description: 「DEC-」と 3 桁の番号。ロードマップの本文の決定（決定済み・判断待ち）の番号で、新しい決定は最大の番号の次です。
  ロードマップの展望ID:
    type: id
    pattern: "^OUTLOOK$"
    sample: OUTLOOK
  ロードマップのテーマの状態:
    type: enum
    values:
      - { value: todo, label: 📋 未着手 }
      - { value: in-progress, label: 🚧 進行中 }
      - { value: ongoing, label: 🔁 定常運用 }
      - { value: done, label: ✅ 完了 }
  R項目の状態:
    type: enum
    values:
      - { value: todo, label: 📋 未着手 }
      - { value: in-progress, label: 🚧 進行中 }
      - { value: partial, label: 🚧 一部完了 }
      - { value: done, label: ✅ 完了 }
      - { value: moved, label: → 別の項目へ移した }
  # R 項目の表の列の形: 基本（内容）・判断つき（内容と判断）・作業（主な場所・前提・完了条件）
  R項目の表の形:
    type: enum
    values:
      - { value: basic, label: 基本（ID・項目・内容・状態） }
      - { value: decision, label: 判断つき（ID・項目・内容・判断・状態） }
      - { value: work, label: 作業（ID・作業・主な場所・前提・完了条件・状態） }
  # 決定の見出しの語: 値をそのまま ROADMAP.md の太字に出すので、値も日本語にする
  決定の語:
    type: enum
    values: [決めたこと, 決定, 合意した方向]
  決定の状態:
    type: enum
    values:
      - { value: decided, label: 決定済み }
      - { value: pending, label: 判断待ち }
  # 参照の型: 移した先の R 項目。線の名前は moved-to
  R項目参照:
    type: ref
    idPattern: "R*"
    scope:
      schemaIds: [roadmap]
    relation: moved-to

  # 参照の型: 指摘が関わるロードマップの項目（R 項目・テーマ・決定）。線の名前は planned-in。相手の側には「関わる指摘」として出ます
  ロードマップ参照:
    type: ref
    idPatterns: ["R*", "P*", "DEC-*"]
    scope:
      schemaIds: [roadmap]
    relation: planned-in
  # 参照の型: R 項目が実装した機能（FEATURES.md の行）。線の名前は realizes
  実装した機能:
    type: ref
    scope:
      schemaIds: [feature]
    relation: realizes
  # 参照の型: 記録の行が、今のロードマップの R 項目の当時の写しであるとき。線の名前は snapshot-of
  写しの元:
    type: ref
    idPattern: "R*"
    scope:
      schemaIds: [roadmap]
    relation: snapshot-of
  # 参照の型: 枝の項目（R49-11a など）の元の R 項目。線の名前は branch-of
  枝の元:
    type: ref
    idPattern: "R*"
    scope:
      schemaIds: [roadmap]
    relation: branch-of

  # R 項目: テーマの本文・節の表の 1 行。この形の要素がエンティティ roadmap-item の定義（テーマが保有する）
  R項目:
    type: object
    label: R 項目
    entity: { type: roadmap-item, defines: true }
    fields:
      - { key: id, label: ID, type: R項目ID, required: true }
      - { key: title, label: 項目, type: 一行の文, role: title, required: true, description: 表の「項目」（作業の表では「作業」）の欄。 }
      - { key: content, label: 内容, type: 一行の文, description: 基本・判断つきの表の「内容」の欄。 }
      - { key: decision, label: 判断, type: 一行の文, description: 判断つきの表の「判断」の欄。 }
      - { key: places, label: 主な場所, type: 一行の文, description: 作業の表の「主な場所」の欄。 }
      - { key: prereq, label: 前提, type: 一行の文, description: 作業の表の「前提」の欄。 }
      - { key: done_criteria, label: 完了条件, type: 一行の文, description: 作業の表の「完了条件」の欄。 }
      - { key: state, label: 状態, type: R項目の状態, required: true, default: todo }
      - { key: state_on, label: 状態の日, type: 年月日, description: 完了・一部完了の日。 }
      - { key: state_note, label: 状態の補足, type: 一行の文, description: "ROADMAP.md では状態の後ろの（）の中（例「✅ 2026-11-07（補足）」）。" }
      - { key: moved_to, label: 移した先, type: R項目参照, description: 状態が「別の項目へ移した」のとき、移した先の R 項目（ROADMAP.md では「→ R47-41」）。 }
      - { key: features, label: 実装した機能, type: array, item: { type: 実装した機能 }, description: この R 項目で足した・直した機能（FEATURES.md の ID）。機能の側には「ロードマップの項目」として出ます。ROADMAP.md には出しません。 }
    constraints:
      - id: done-item-has-date
        description: 完了した R 項目には、状態の日があること
        where:
          - { path: state, equals: done }
          - { path: state_on, exists: false }
        expect: absent
        level: error
        message: "完了した R 項目「{id}」に状態の日がありません"
      - id: moved-item-has-target
        description: 別の項目へ移した R 項目には、移した先があること
        where:
          - { path: state, equals: moved }
          - { path: moved_to, exists: false }
        expect: absent
        level: error
        message: "R 項目「{id}」に移した先がありません"

  # 箇条: 本文の「- **見出し**: 文」の 1 つ。決定（「- **決めたこと（日付 誰）**: 文」）は decision・status・date・by を持つ
  箇条:
    type: object
    label: 箇条
    entity: { type: roadmap-decision, defines: true }
    fields:
      - { key: id, label: 決定の ID, type: 決定ID, description: 決定（決定済み・判断待ち）の箇条だけが持つ番号。ROADMAP.md には出しません。 }
      - { key: label, label: 見出し, type: 一行の文, description: 太字の見出し。無ければ見出しの無い箇条（「- 文」）。 }
      - { key: label_note, label: 見出しの補足, type: 一行の文, description: 太字の後ろ・「:」の前に続く文字（例「（labs/…）」）。 }
      - { key: decision, label: 決定, type: 決定の語, description: 決定済みの箇条の見出しの語。見出しは「語（日付 誰）」になります。 }
      - { key: status, label: 決定の状態, type: 決定の状態, description: "決定済みか、オーナーの判断を待っているか（判断待ちの一覧の元）。判断待ちの見出しは「判断待ち（日付 誰）」になります。" }
      - { key: date, label: 決定の日, type: 年月日, description: 決定済みなら決めた日、判断待ちなら判断を求めた日。 }
      - { key: by, label: 決めた人, type: 一行の文, description: 決定済みなら決めた人、判断待ちなら判断する人。 }
      - { key: text, label: 文, type: 文章, required: true, description: "「:」の後ろの文。続きの行は 2 字下げで書きます。" }
    constraints:
      - id: decision-has-status
        description: 決定の語を書いた箇条には、決定の状態があること
        where:
          - { path: decision, exists: true }
          - { path: status, exists: false }
        expect: absent
        level: error
        message: 決定の語を書いた箇条に、決定の状態がありません
      - id: decision-has-id-date-by
        description: 決定の箇条（決定の状態を書いたもの）には、ID・日・人があること
        where:
          - { path: status, exists: true }
          - or:
              - { path: id, exists: false }
              - { path: date, exists: false }
              - { path: by, exists: false }
        expect: absent
        level: error
        message: 決定の箇条に、ID・日・人のどれかがありません
      - id: decided-has-word
        description: 決定済みの箇条には、見出しの語（決めたこと・決定・合意した方向）があること
        where:
          - { path: status, equals: decided }
          - { path: decision, exists: false }
        expect: absent
        level: error
        message: 決定済みの箇条「{id}」に、見出しの語（decision）がありません
      - id: pending-has-no-word
        description: 判断待ちの箇条には、決定の語を書かないこと（決めたら決定済みにして語を書く）
        where:
          - { path: status, equals: pending }
          - { path: decision, exists: true }
        expect: absent
        level: error
        message: 判断待ちの箇条「{id}」に決定の語があります
      - id: point-id-is-for-decisions
        description: 決定の ID は、決定の箇条（決定の状態を書いたもの）だけが持つこと
        where:
          - { path: id, exists: true }
          - { path: status, exists: false }
        expect: absent
        level: error
        message: 決定の状態の無い箇条に、決定の ID（{id}）があります

  # 本文のかたまり: 文（Markdown のまま。表・コード・段落）・箇条の並び・R 項目の表のどれか 1 つ
  本文のかたまり:
    type: object
    label: 本文のかたまり
    fields:
      - { key: text, label: 文, type: 文章, description: Markdown のまま出す文（段落・表・コード）。 }
      - { key: points, label: 箇条, type: array, item: { type: 箇条 } }
      - { key: columns, label: 表の形, type: R項目の表の形, description: R 項目の表の列の形。 }
      - { key: items, label: R 項目, type: array, item: { type: R項目 } }
    constraints:
      - id: block-has-a-kind
        description: 本文のかたまりは、文・箇条・R 項目の表のどれかを持つこと
        where:
          - { path: text, exists: false }
          - { path: points, exists: false }
          - { path: items, exists: false }
        expect: absent
        level: error
        message: 本文のかたまりに、文（text）・箇条（points）・R 項目（items）のどれもありません
      - id: block-has-one-kind
        description: 本文のかたまりは、文・箇条・R 項目の表のうち 1 つだけを持つこと（2 つ目は次のかたまりに分ける）
        where:
          - or:
              - { path: text, exists: true }
              - { path: points, exists: true }
          - or:
              - { path: points, exists: true }
              - { path: items, exists: true }
          - or:
              - { path: text, exists: true }
              - { path: items, exists: true }
        expect: absent
        level: error
        message: 本文のかたまりには、文（text）・箇条（points）・R 項目（items）のうち 1 つだけを書きます
      - id: items-have-columns
        description: R 項目の表には、列の形があること
        where:
          - { path: items, exists: true }
          - { path: columns, exists: false }
        expect: absent
        level: error
        message: R 項目の表（items）に列の形（columns）がありません

  # 記録の R 項目: 記録の表の 1 行。欄は書いたまま持ちます（記録は書き換えない。状態の書き方もそろえない）。この形の要素もエンティティ roadmap-item の定義
  記録のR項目:
    type: object
    label: 記録の R 項目
    entity: { type: roadmap-item, defines: true }
    fields:
      - { key: id, label: ID, type: R項目ID, description: 今のロードマップに同じ R 項目があるときは書かずに、写しの元（snapshot_of）を書きます。 }
      - { key: snapshot_of, label: 写しの元, type: 写しの元, description: 今のロードマップにある R 項目の、当時の写しの行（ID の欄にはこの ID を出します）。 }
      - { key: parent, label: 枝の元, type: 枝の元, description: 枝の項目（R49-11a など）の元の R 項目。 }
      - { key: title, label: 項目, type: 一行の文, role: title, required: true, description: 表の 2 つ目の欄。 }
      - { key: cells, label: 残りの欄, type: array, item: { type: 一行の文 }, description: 3 つ目からの欄（書いたまま）。 }
      - { key: features, label: 実装した機能, type: array, item: { type: 実装した機能 }, description: この R 項目で足した・直した機能（FEATURES.md の ID。欄に書いてある今の ID）。記録には出しません。 }
    constraints:
      - id: record-item-has-id
        description: 記録の R 項目には、ID か写しの元のどちらかがあること
        where:
          - { path: id, exists: false }
          - { path: snapshot_of, exists: false }
        expect: absent
        level: error
        message: 記録の R 項目「{title}」に、ID も写しの元もありません
      - id: record-item-has-one-id
        description: 記録の R 項目には、ID と写しの元の両方を書かないこと
        where:
          - { path: id, exists: true }
          - { path: snapshot_of, exists: true }
        expect: absent
        level: error
        message: 記録の R 項目「{id}」に、ID と写しの元の両方があります

  # 記録のかたまり: 文（Markdown のまま）か、R 項目の表（見出しの 2 行と行の並び）のどちらか 1 つ
  記録のかたまり:
    type: object
    label: 記録のかたまり
    fields:
      - { key: text, label: 文, type: 文章 }
      - { key: head, label: 表の見出し, type: 文章, description: 表の見出しの行と区切りの行（書いたまま）。 }
      - { key: rows, label: R 項目, type: array, item: { type: 記録のR項目 } }
    constraints:
      - id: record-block-has-one-kind
        description: 記録のかたまりは、文か R 項目の表のどちらか一方だけを持つこと
        where:
          - { path: text, exists: true }
          - { path: rows, exists: true }
        expect: absent
        level: error
        message: 記録のかたまりには、文（text）か R 項目の表（head と rows）のどちらか一方だけを書きます
      - id: record-block-has-a-kind
        description: 記録のかたまりは、文か R 項目の表のどちらかを持つこと
        where:
          - { path: text, exists: false }
          - { path: rows, exists: false }
        expect: absent
        level: error
        message: 記録のかたまりに、文（text）も R 項目の表（rows）もありません
      - id: record-rows-have-head
        description: 記録の R 項目の表には、見出しの行があること
        where:
          - { path: rows, exists: true }
          - { path: head, exists: false }
        expect: absent
        level: error
        message: 記録の R 項目の表（rows）に見出しの行（head）がありません

  # 記録の項: 記録の「### P…」の 1 つ。テーマが保有し、記録には番号の順に出ます。この形の要素がエンティティ roadmap-record の定義
  記録の項:
    type: object
    label: 記録の項
    entity: { type: roadmap-record, defines: true }
    fields:
      - { key: id, label: ID, type: 記録の項ID, required: true }
      - { key: title, label: 見出し, type: 一行の文, role: title, required: true, description: "記録の見出し（「### 」の後ろ。書いたまま）。" }
      - { key: part, label: 区切りの見出し, type: 一行の文, description: "この項の前に置く「## 」の見出し（記録の中の区切り）。" }
      - { key: part_intro, label: 区切りの前書き, type: 文章 }
      - { key: body, label: 本文, type: array, item: { type: 記録のかたまり } }

  ロードマップの節:
    type: object
    label: 節
    fields:
      - { key: title, label: 見出し, type: 一行の文, role: title, required: true }
      - { key: body, label: 本文, type: array, item: { type: 本文のかたまり } }

  # ロードマップのテーマ: 1 件 1 ファイル。この形の要素がエンティティ roadmap-theme の定義
  ロードマップのテーマ:
    type: object
    label: ロードマップのテーマ
    entity: { type: roadmap-theme, defines: true }
    fields:
      - { key: id, label: ID, type: ロードマップのテーマID, required: true }
      - { key: number, label: 番号, type: int, required: true, min: 1, description: ID の番号（P52 なら 52）。状態の表と未完のテーマはこの順に並びます。 }
      - { key: title, label: 名前, type: 一行の文, role: title, required: true, description: "未完のテーマの見出し（「### P52: 名前」）。" }
      - { key: table_title, label: 表の名前, type: 一行の文, description: 状態の表の「テーマ」の欄が見出しと違うとき（省くと名前）。 }
      - { key: status, label: 状態, type: ロードマップのテーマの状態, required: true }
      - { key: status_note, label: 状態の要約, type: 一行の文, required: true, description: 状態の表の「状態」の欄（そのまま出します）。 }
      - { key: body, label: 本文, type: array, item: { type: 本文のかたまり }, description: 見出しの直後の本文（節の前）。 }
      - { key: sections, label: 節, type: array, item: { type: ロードマップの節 }, description: 小見出し（「#### 見出し」）ごとの本文。 }
      - { key: history, label: 記録, type: array, item: { type: 記録の項 }, description: 記録（docs/archive/roadmap-history.md）に出す項。テーマを終えたら、本文と節を項にして移します。 }

  # ロードマップの展望: テーマの候補（計画前）とリスク。1 件だけ（roadmap/outlook/OUTLOOK.yaml）
  テーマの候補:
    type: object
    label: テーマの候補
    fields:
      - { key: name, label: 候補, type: 一行の文, role: title, required: true }
      - { key: foundation, label: 必要になる土台, type: 一行の文 }
      - { key: note, label: 補足, type: 一行の文 }
  リスク:
    type: object
    label: リスク
    fields:
      - { key: risk, label: リスク, type: 一行の文, role: title, required: true }
      - { key: policy, label: 方針, type: 一行の文 }
  ロードマップの展望:
    type: object
    label: ロードマップの展望
    entity: { type: roadmap-outlook, defines: true }
    fields:
      - { key: id, label: ID, type: ロードマップの展望ID, required: true }
      - { key: title, label: 名前, type: 一行の文, role: title, required: true }
      - { key: candidates_intro, label: 候補の前書き, type: 文章 }
      - { key: candidates, label: テーマの候補, type: array, item: { type: テーマの候補 } }
      - { key: risks, label: リスクと未解決課題, type: array, item: { type: リスク } }
