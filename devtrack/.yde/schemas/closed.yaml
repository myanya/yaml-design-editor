id: closed-item
name: 解決した指摘
kind: document
description: 解決・見送りの指摘を 1 件 1 ファイルで持ちます。段階 0 では docs/archive/backlog-closed.md の表から取り込んだ写しです。
match: "closed/*.yaml"
filePattern: "closed/{id}.yaml"
# 台帳と同じ形・同じエンティティ（backlog-item）。台帳と記録で同じ ID があれば、定義の競合として検証が見る
root: { type: common#指摘 }
constraints:
  - id: record-is-closed
    description: 記録の指摘は、解決か見送りであること
    match:
      - node: { entity: backlog-item, schema: closed-item, bind: it }
    where:
      - { of: it, path: status, oneOf: [todo, discussing, in-progress, when-needed] }
    expect: absent
    level: warning
    message: "記録の指摘「{it.id}」が未解決の状態です"
