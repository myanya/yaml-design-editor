id: UX-19
title: 'MANUAL の索引・被参照の記述が**オーバーレイ索引（UX-03）に未追随の疑い**: §6「索引の更新タイミング」注記が「未保存の編集は他ファイルからの解決・被参照にはまだ反映されません」のまま。§5 文書ビューの「被参照は索引（保存済み状態）に基づきます」、§4
  整合ルールの「期待値の材料（他文書）はディスク基準」も現行UIの「見たまま判定」と不一致の可能性'
status: resolved
origin_on: 2026-08-08
origin: R17-02調査
memo: 'UI層は `overlayIndex()`（UX-03）で参照解決・被参照・カバレッジが未保存追随になったはず。実装と突合のうえ MANUAL の該当記述を現行仕様（UI=オーバーレイ・ヘッドレス=ディスク基準）へ更新する。`/sync-docs`
  の対象。**実装と突合のうえ修正（2026-08-13）**: UI層は overlayIndex / unsavedFirstLoader 基準（見たまま）と確認し、§6 索引注記・§5 文書ビューの被参照・§4 整合ルールの材料・カバレッジ節の計4箇所を「UI=見たまま／ヘッドレス=ディスク基準」へ更新'
targets: MANUAL（§4〜§6）
