id: UX-113
title: 「判定を保留した」検査がどこにも見えない。検査の状況の表示では「充足」と出る
status: resolved
origin_on: 2026-09-20
origin: 今後のテーマの精査
body: '**「判定を保留した」検査がどこにも見えない。検査の状況の表示では「充足」と出る**（相手の見つからない参照があると、解の不足を理由とする指摘は黙る＝CALC-17。これ自体は正しいが、黙ったことが利用者に伝わらない。「エラー0」が「すべて確かめて問題なし」なのか「確かめられなかった検査がある」のか区別できない）'
memo: '事実: 保留の記録は `SemanticQueryResult.unknownDropped` にあるが、読むのは `RuleDiagnostics` の2箇所だけで、どちらも黙って null を返す。`RuleDiagnostics.status`
  は `satisfied = diagnosis == null` としているため、保留も「充足」になる（`RuleStatus` に第3の状態が無い。サイドパネル・ID横ぐし・ビュー・エージェントの道具が同じ表示を使う）。CLI `validate`・`readiness`
  にも保留の件数は出ない。**当たり**: 検査の結果を「違反・充足・保留（理由つき）・対象外」の4つに分けて持つ（UX-114 の指摘の構造化と同じ土台）。`readiness` に「保留 n 件」を出し、保留がある要素を「準備完了」と言い切らない選択肢を用意する
  **対応（2026-09-20・P27 段A＝R27-01）**: 検査の結果を違反・充足・保留・対象外の4つに分けた（判定はカーネル `semantic.SemanticRules`）。保留は指摘にせず、検証の結果（`Validator.validateDetailed`
  の `withheld`）に内訳つきで残す——準備完了レポートの「保留」（要素ごとの件数と内訳の一覧。`--pending` でも全件）・検査の状況の「判定保留（理由）」（充足に数えない）・CLI `validate` の `withheld`
  に出る。「比べる値が書かれていない」は保留ではなく対象外にした（任意の項目を比べる検査では値が無いのがふつうで、保留に数えると本当に確かめられなかった検査が埋もれる）。**残**: 値・参照の場所へ出す検査の保留は集めていない（P27 段B）。検証パネル（UI）には保留を出していない（指摘ではないため。見せ方は
  UX-101 と合わせて検討） **追記（2026-09-21・P27 段B の残り）**: 値の場所・参照の場所へ出す検査（整合検証・対象型など）の保留も集めるようにした（意図的差分 D-29 ③）'
targets: ARCHITECTURE §4.37・意図的差分 D-26・D-29
