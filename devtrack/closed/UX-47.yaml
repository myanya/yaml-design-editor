id: UX-47
title: 提出ゲート error-free が強すぎる
status: resolved
origin_on: 2026-08-09
origin: S2第1回
body: '**提出ゲート error-free が強すぎる**: 既存エラーがあると提出不能（幕2）。assignee を必須化すると恒久失敗（幕4）。**「新規エラーなし」の区分が欲しい**（修正系=error-free／点検系=no-new-errors）'
memo: '`gates.validation` に `no-new-errors`（実行開始時のベースライン検証との差分で判定）を追加。`Staging.validateAll` の結果比較で実装できる見込み。**実装（2026-09-17・R28-05b）**:
  `Staging.newErrors`＝ステージ適用後のエラーからディスク原本の同一エラー（(パス, メッセージ) の多重集合）を差し引いた残りが空であることを提出ゲートで要求（既存エラーは拒否理由に載せない・自動適用は requireValid
  を課さない）。T-01 論点2の失敗分類とは独立の単体先行'
targets: R28-05b（FEATURES AG-02）
