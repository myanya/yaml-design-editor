body: '**detailIn カバレッジの警告文に「どこに作ればよいか」がなく、詳細文書の場所探しに10分かかった**（SCR-RESERVE-DETAIL: 03_basic-design/screens に同ID文書があるため「あるじゃないか」と混乱。不足していたのは
  04_detail-design/screens）'
memo: '**実装（2026-09-04・R28-05a）**: 警告文に詳細スキーマの match パターンを併記（「詳細スキーマ: screen-design（04_detail-design/screens/*.{yaml,yml}
  **に作成**）」。`coverageMessage(status, allSchemas)`＝検証・右パネル・横ぐしの3面）。**追補（同日・オーナー指摘「メニューが出てこない」）**: 指摘クリックのメニューに**「詳細文書を作成: <ID>（<スキーマ>）」**を追加（`Issue.scaffold`＋`Views.detailPatternFromMatch`＝match
  から作成先を導出し、スキーマ初期値でファイル作成→開く。ディレクトリ固定＋`*.yaml` 形の単純な glob のみ対応）'
targets: R28-05a（FEATURES V-05）
