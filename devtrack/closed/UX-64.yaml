id: UX-64
title: 連番・通番の自動採番機能が欲しい
status: resolved
origin_on: 2026-08-12
origin: 利用者メモ
body: '**連番・通番の自動採番機能が欲しい**'
memo: 'id 型フィールド・ビュー新規行・詳細作成でのID入力時に、エンティティ宣言の idPattern と既存ID集合（`overlayIndex`）から次番号を提案する入力支援。UX-06（既存ID補完ピッカー）と同じ入力支援面に載せる。**実装（2026-08-12）**:
  純ロジック `schema/IdSuggest`（接頭辞グループ×最大番号+1・ゼロ埋め維持・現在文書の系列を優先・既存ゼロ件でも単純 pattern から初番生成）を新設し、フォームの id 型メニュー「採番: XXX」とビュー新規行ダイアログの初期値に接続。形式の源は
  pattern（UX-79）／entity・ビュー行の idPattern＝検証と同じ宣言'
targets: R17-03（FEATURES E-01 / X-06。`IdSuggestTest`）
