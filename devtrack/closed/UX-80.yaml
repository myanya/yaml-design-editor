id: UX-80
title: ID横ぐしのアスペクト並びがスキーマIDのアルファベット順になり、detail が概念より先に来るケースがある
status: resolved
origin_on: 2026-08-12
origin: 利用者メモ
body: '**ID横ぐしのアスペクト並びがスキーマIDのアルファベット順になり、detail が概念より先に来るケースがある**'
memo: '並びは `core/Aspects.kt`: 定義出現→レジストリの aspect 宣言順→アスペクト名。entity 宣言（defines / aspect 順）の無いスキーマ群でアルファベット順に落ちる。サンプル側の宣言整備と、宣言なし時のフォールバック改善の両面。**実装（2026-08-12）**:
  並びのフォールバックをアスペクト名（＝スキーマID）順からファイルパス順へ（番号付きディレクトリの流れ＝概念→詳細に乗る。定義出現→レジストリ宣言順の優先は従来どおり。`AspectTest` で検証）'
targets: R17-03（FEATURES C-13）
