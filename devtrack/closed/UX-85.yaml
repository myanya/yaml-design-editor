id: UX-85
title: エンティティページ（ID横ぐし）のフォームにAI生成ボタン（✨・「AIで候補追加」）が表示されるが正しく機能しない
status: resolved
origin_on: 2026-08-13
origin: AI生成入口拡大の要件整理
body: '**エンティティページ（ID横ぐし）のフォームにAI生成ボタン（✨・「AIで候補追加」）が表示されるが正しく機能しない**。台帳スペースではクリックしてもダイアログが出ず、`aiRequest` が残留したまま編集スペースへ戻ると**そのとき開いている別文書を対象に**ダイアログが突然開く（同型パスが存在すると別ファイルへ適用されうる）'
memo: '構造的ずれ: `FormView.FieldRow` / 配列の「AIで候補追加」は `FormCtx` 経由で再利用画面（アスペクトカード・出現フォーム）にも描画されるが、`AppState.AiRequest(field, path)`
  が対象文書を持たず、`AiGenerationHost` が `state.openDoc` 参照かつ `EditorArea` 内にのみマウントされている。**実装（2026-08-13）**: `AiRequest` へ対象文書（`OpenDocument`）を追加し全呼び出し側が
  `FormCtx.doc` を渡す形へ、ホストをアプリシェル直下（スペース非依存）へ移設。エンティティページの✨が「押した場所の文書」を対象にその場で動く'
targets: R24-01（FEATURES A-15）
