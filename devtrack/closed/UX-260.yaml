id: UX-260
title: 指摘の番号が二重に振られている
status: resolved
resolved_on: 2026-11-07
resolution: 2026-11-07
origin_on: 2026-11-07
origin: 開発管理の段階 0（devtrack の取り込み）
body: '**指摘の番号が二重に振られている**: UX-140・UX-171 は台帳と記録（archive/backlog-closed.md）に別々の指摘として、UX-172 は記録の中に 2 つの別々の指摘としてある。起点の日が 1〜3
  日違いなので、並行するセッションが同じ「次の番号」を取ったとみられる'
memo: '記録は書き換えない規則なので、台帳の側に枝番を足すか、区別せずそのまま置くかは要判断。台帳を YAML の原本にするなら（devtrack の段階 1）、登録を操作の ID 採番にし、ID の重複（定義の競合）を検証で止める。並行するセッションの同時の採番は、採番だけでは防げない。**解決（2026-11-07）**:
  オーナーの判断で、参照されていない方に新しい番号を振った（記録の UX-140〔2026-10-03〕→ UX-263・台帳の UX-171〔2026-10-18〕→ UX-264・記録の UX-172〔2026-10-20〕→ UX-265）。ROADMAP
  の R43-05 と roadmap-history が指す UX-172・UX-140 は残した方なので、参照は直していない。直す前の記録を devtrack に取り込むと、記録の中の重複は取り込みの誤り（同じファイルに解決される）、台帳と記録の重複は定義の競合として出た'
targets: devtrack の記録の取り込み
