id: UX-114
title: 指摘（Issue）が、どの検査の・どの要素についての指摘かをデータとして持っていない
status: resolved
origin_on: 2026-09-20
origin: 今後のテーマの精査
body: '**指摘（Issue）が、どの検査の・どの要素についての指摘かをデータとして持っていない**（持っているのは重大度・文面・場所・対応・関連IDだけ。検査の id・由来の定義・対象の要素は、文面に埋め込まれた文字列としてしか残らない）'
memo: '影響: ①提出ゲート `no-new-errors` は「同じエラー」を（場所, **文面**）で見分けている（`Staging.newErrors`）。文面に件数や値が入る検査では、既存のエラーの件数が1つ変わっただけで「新しいエラー」になる。別の検査が同じ文面を同じ場所に出すと区別できない
  ②準備完了レポートは指摘を**場所だけ**で要素へ割り当てている（`Readiness`）。報告先を変えた検査（`reportAt`）や、文書レベルに出る指摘は、本来の対象の要素に付かない ③指摘から「解消する手段」を選ぶ仕組み（UX-59
  ゴール駆動・UX-101 指摘の三面モデル）や、指摘の例外承認（この指摘は承知のうえで受け入れる）を作る足場が無い。**当たり**: 指摘に、検査の id・由来（どの定義・どの語彙から来たか）・対象の要素・判定の結果・根拠（束縛と値）を持たせる。文面はそこから組み立てる。P29
  の OQ-04（根拠の構造化）は「需要が立つまで保留」だったが、検査がすべて定義体になり id と由来が揃ったので、安く作れるようになった **対応（2026-09-20・P27 段A＝R27-01）**: 指摘に出どころ `IssueSource`（検査の出どころ
  `RuleOrigin`・呼び名・対象の要素・配り方・根拠に関わった要素の全件）を持たせた。①提出ゲートは（検査, 要素, 配り方）で見分け、根拠に関わる要素が増えたときだけ新しいエラーとする（不足が3件→2件に減る提出が通る・場所の番号がずれても既存のまま）②準備完了レポートは他の出現への案内を重ねて数えない
  ③指摘から解消手段を選ぶ仕組み・例外の承認の足場ができた（未着手）。CLI `validate --sources` で確認できる。**残**: 定義体を通らない指摘（構造の検証・参照の解決・ID の重複）はまだ出どころを持たない＝提出ゲートは今までどおり（場所,
  文面）で見分けるため、要素の挿入で場所の番号がずれると、既存の「参照を解決できません」が新しいエラーに数えられる（P27 段B で扱う） **→ 解消（2026-09-21・P27 段B の残り＝R27-07・意図的差分 D-29）**:
  コードで実装された検査の指摘にも出どころを付けた（検査の名前・指摘の種類・指摘の場所を含む最も内側の ID を持つ要素・その要素の中の場所＝番号を除いたキーの並び・参照の相手）。提出ゲートは、どの指摘も出どころで見分ける'
targets: ARCHITECTURE §4.37・意図的差分 D-26
