id: UX-112
title: ワークスペース全体の検証が、P29 Phase 6 の前後で約2.3倍遅くなっていた
status: resolved
origin_on: 2026-09-20
origin: 今後のテーマの精査（実測）
body: '**ワークスペース全体の検証が、P29 Phase 6 の前後で約2.3倍遅くなっていた**（`validate sysdev-template`＝82文書・約2,700行: Phase 6 着手前 1.1 秒 → 第5段の後 2.6
  秒。`sample-workspace`: 1.0 秒 → 1.4 秒。各3回の実測）'
memo: '原因: 索引からカーネル用の入力一式（走査列・ID の集約・カーネルのグラフ）を作る `IdIndex.toKernelView()` が**呼び出しのたびに全体を作り直して**いた（コメントにも「呼び出しごとに構築。Phase
  7〜8 で解消」と残っていた）。検査がすべてクエリになり「規則 × 要素」の数だけ呼ばれるようになったため、検証時間の大半（プロファイルの標本の約6割）がこの作り直しになっていた。**対応**: 索引に `kernelViewCache`
  を持たせ、走査結果が変わる（`derive`）たびに無効化（`graphCache` と同じ作り）。**結果: 2.6 秒 → 1.3 秒・1.4 秒 → 1.05 秒。検証出力は変更前と完全一致・全テスト緑**。Phase 6 着手前との差（テンプレで
  +0.2 秒）は、検査を要素ごとのクエリとして評価する分で、今の規模では問題にならない。規模が大きくなったときの備えは UX-116'
targets: '`index/IdIndex.kt`・`index/SemanticBridge.kt`'
