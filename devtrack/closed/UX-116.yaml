id: UX-116
title: 全体の検証は、文書ごとに検証を呼び、そのたびに同じ検査を要素ごとに評価し直す作りで、規模が大きくなったときの速さを確かめる手段が無い
status: resolved
origin_on: 2026-09-20
origin: 今後のテーマの精査
body: '**全体の検証は、文書ごとに検証を呼び、そのたびに同じ検査を要素ごとに評価し直す作りで、規模が大きくなったときの速さを確かめる手段が無い**（本命の用途は〜10万行規模のシステムの設計情報。今のテンプレートは約2,700行で 1.3
  秒）'
memo: '事実: `Validator.validate` は文書1つが単位で、`RuleDiagnostics` と文書ツリーのキャッシュは呼び出し1回ごとに作り直す。同じ ID が複数の文書に出ると、その ID の検査は文書の数だけ評価される（報告先と案内の両方）。`forAll`
  は「行 × 列」で解く。以前あった計測用のコード（Bench）は移行後のリファクタリングで削除済み。**当たり**: ①ワークスペース単位で「検査 × 要素」を1回だけ評価し、指摘を文書へ配る形にする（UX-114・UX-115 と同じ土台）
  ②大きさを指定して合成ワークスペースを作り、時間を測る仕組みを用意して、伸び方（文書数に比例か、それ以上か）を先に知る。UX-63 を引き継ぐ **②は対応済み（2026-09-21・P27 R27-03）**: CLI `bench` と合成ワークスペース（`core/Bench.kt`）を用意して実測——開く時間は文書数に比例・全体の検証は規模の2乗に近い伸び（523文書・2,125要素で
  8.8 秒）。作りを変えずに直せた原因（クエリの評価のたびに全参照の逆引き表を作り直す／起点の絞り込みで全要素を総なめ／グラフ整合が文書ごとにグラフを作り直して全参照を調べ直す）を直して 3.3 秒。**残る伸び（規模が2倍で時間が約3〜3.7倍）は①の作りそのもの**——直せる場所への案内（`fixSite`）が案内先の文書ごとに全
  ID を調べる・専用チェッカーと他の出現への案内が文書ごとに評価し直される。P27 段B（ワークスペース単位で1回だけ評価して文書へ配る）で解消する。段B の完了の目安＝`bench` の伸び方が 1.0 前後 **①も対応済み（2026-09-21・P27
  段B-1＝R27-04）**: 検査の評価の覚え書き（`semantic.SemanticCheckSession`）を索引の一式と同じ寿命で持ち、全体を回す経路が共有する。伸び方が 1.0 前後になった（523文書で 8.8 秒 → 0.76
  秒。4,107文書・16,909要素で 6.1 秒）。「毎回全体をまとめて評価する」形にはしていない（アプリで1文字打つたびに全体を評価することになるため）'
targets: ROADMAP P27・ARCHITECTURE §4.39
