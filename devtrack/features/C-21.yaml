id: C-21
title: 生成（業務モデルの項・原文と宣言・dependsOn と input・候補合成・型解決・利用箇所の指定・$validate による文書の検査・系譜・CLI generate）
implementation:
  - path: workspace-core/workspace/BusinessModel.kt
    module: workspace-core
  - path: workspace-core/workspace/BusinessModelTraversal.kt
    module: workspace-core
  - path: workspace-core/workspace/BusinessModelViews.kt
    module: workspace-core
  - path: workspace-core/workspace/BusinessModelRules.kt
    module: workspace-core
  - path: workspace-core/workspace/Generators.kt
    module: workspace-core
  - path: workspace-core/workspace/SchemaModels.kt
    module: workspace-core
    detail: 組み立てたスキーマの定義検査と型解決を既存の読み取りへ接続
  - path: workspace-core/workspace/SchemaUses.kt
    module: workspace-core
    detail: 型への参照と明記を保った利用箇所の指定場所
  - path: semantic-core/semantic/TermComposition.kt
    module: semantic-core
    detail: 変換の $compose から呼ぶ変更候補の合成
  - path: semantic-core/semantic/TransformReads.kt
    module: semantic-core
  - path: cli/commands/GenerateCommands.kt
    module: cli
tests:
  - name: GenerationTest
  - name: SchemaModelsTest
    note: モジュール間の型解決、ビュー原文と参照、初期値、再帰、重複と誤った指定の拒否
  - name: SchemaUsesTest
    note: 共通型の利用箇所の分離、継承と明記、再帰と変更前の値の保持
  - name: TermCompositionTest
    note: 候補の競合・個別指定・重複・対象消失・根拠と値の保持
  - name: BusinessModelTest
  - name: BusinessModelSourcesTest
    note: スコープ内のスキーマ原文、明記と未指定、出力の写しと元の定義の分離
  - name: BusinessDeclarationsTest
    note: 明記した属性・原文の場所・入れ子とエンティティ参照
  - name: BusinessModelRecursionTest
    note: 深い入れ子・再帰型と利用箇所の子・別の項目やモジュールの型の展開
  - name: TodosEntityFoundationTest
    note: 個別・横断・CRUD・DDL の確定値の一致、区分の追加と指定、補正と未対応入力による停止
  - name: TodosDesignContractTest
    note: 導出と候補と確定項目の保存形式、参照先の分離、入れ子と未解決、再帰型を含む導出
  - name: TodosDesignCompositionTest
    note: 導出した宣言への補正と既存の型解決、明記と継承の区別
  - name: TodosDesignGenerationTest
    note: 新形式の候補合成から型解決まで生成内で実行、競合と型の誤りによる後続停止、再生成と対象消失
  - name: TodosSchemaInputsTest
    note: 実際の導出定義が保持する全スキーマの合成と再解決、側面・入れ子・操作の一致、共通型の補正と個別の明記
  - name: TodosDesignTargetsTest
    note: 設計IDと宣言の対応、説明の競合と補正・根拠の保持、入れ子と選択肢、対象消失
  - name: TodosTypeCorrectionsTest
    note: サンプルの共通型の補正と再解決、明記と継承、型の連鎖、競合と対象消失、未接続の補正の明示
  - name: TodosFieldCorrectionsTest
    note: 利用箇所ごとの個別補正、全側面の説明、入れ子と初期値、競合と型の誤り、未反映の補正
  - name: TodosSysdevTest
    note: 設計書の生成・検証・型対応表による初期値の出力と H2 での DDL の確認
  - name: TransformReadsTest
  - name: GeneratedValidationTest
    note: 組み立てた文書の構造・参照・成立条件、予約領域と未割当文書の拒否
  - name: TodosSystemDocumentsTest
    note: 全設計書の確定、設計間の補正の伝達、段階を間違えた入力の拒否、アプリを混ぜない設計用コピーと再生成
  - name: TodosApplicationTest
    note: アプリの確定設定と出力の一致、未確定値を読まないこと、方式の変更と不正入力の拒否
  - name: TodosJavaModelsTest
    note: Form と行モデルの共通型、可変個数の出力、物理列の補正と型・名前の不一致の拒否
  - name: TodosMappersTest
    note: 全メソッドの網羅、一覧と件数の条件の一致、物理名とメソッド名の補正、未解決の条件と列の拒否
  - name: TodosServiceFoundationTest
    note: 処理の個別条件・明細の削除・親の検査対象、状態型・例外・採番の呼出名の補正、未解決の状態と呼び先の拒否
  - name: TodosServiceBindingsTest
    note: Service の入力型・親のキーと Mapper の引数の対応、状態・物理名・呼出名の補正、未知の引数と更新内容の食い違いの拒否
  - name: TodosServiceProgramsTest
    note: 全操作の本体と確認の生成、未対応の比較・参照・検査対象による停止
  - name: TodosWebDesignTest
    note: デザイン台帳の確定後の CSS と HTML の共有、入力 Form の網羅と未対応の検査・メッセージ不足の拒否
  - name: TodosWebBindingsTest
    note: 全操作の Form と Service の照合、項目名・明細と呼出名の補正、対応漏れ・重複・型不一致の拒否
  - name: TodosWebPagesTest
    note: 保存した確定値と全画面・入口・読出しの一致、題と列順の補正、未対応部品・遷移先・子の行の項目対応の不足による停止
  - name: verify-app.ps1
    kind: check
    note: 生成アプリのコピーで全 Mapper・全操作・同時採番・取り消し、実 HTTP の全画面・二重送信・別タブ・部分更新・空配列、絞り込みと URL の補正を検証
  - name: test-application-files.ps1
    kind: check
    note: todos-sysdev の再生成で手修正・計画後の競合・途中失敗・名前変更と削除の範囲・保存データの保持を確認
  - name: test-application-index.ps1
    kind: check
    note: Git の登録漏れ・除外規則・未登録ファイルの分離・保存データの保護・改行・生成記録の一致を確認
  - name: todos-application.yml
    kind: check
    note: Git に登録した設計と生成アプリを取り出し、登録漏れ・除外規則・再生成と独立ビルドを確認
