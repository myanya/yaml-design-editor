id: UX-329
title: 画面設計書の物理パラメータ（欄の幅・段組み・ボタンの強さなど）を、画面ごとに手書きの文書で上書きする仕組みが無い（既定の表だけ）
status: todo
kind: feature
origin_on: 2026-11-15
origin: 'samples/todos-sysdev の画面設計書（部品の木と物理パラメータ）の議論。オーナー: 今回は入れなくてよい'
memo: |-
  画面設計書は、部品の木と物理パラメータ（width・rows・emphasis・align・columns・gap）を生成の定義の既定の表から作る。
  画面ごとに変えたいときは、生成物を直さず、同じ画面を指す手書きの別の文書で上書きする形（生成物と手書きを分ける案一）を考えている。
  あわせて、部品と物理パラメータの種類は、要るものが出たら足す（オーナー: 追加があれば後で）
features:
  - C-21
resolutions:
  - date: 2026-11-21
    kind: 一部
    note: "生成物と分けて上書きする置き場はできた。設計書の補正（samples/todos-sysdev の design/detail/inputs/documents/corrections.yaml）に、画面設計書（screen-designs-operations・details・lists）を指して値を置き換える補正を書ける（入力のスキーマ system-inputs の種類にある。いまは 0 件）。題と並びを変えた確定値がアプリの生成の入力まで届くことは TodosWebPagesTest「画面の補正後の題と列順を生成入力へ保持する」が見る（定義とテストの読みから）。残りは、物理パラメータ（width・rows・emphasis など）を補正した例とテストと、部品・パラメータの種類の追加"
