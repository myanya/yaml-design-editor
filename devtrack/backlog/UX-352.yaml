id: UX-352
title: "定義の言語に版の印が無く、語を変える・廃止するときの決まりが無い"
status: resolved
kind: spec
origin_on: 2026-11-16
origin: "仕様（devtrack/spec）を作る前の調査で、パーサ・メタスキーマ・manual を突き合わせたとき"
memo: |-
  スキーマにも workspace.yaml にも言語の版を表すキーが無い。廃止した書き方は個別に、置き換え先を案内するエラーで扱っている（語彙の removed・ビューの computed・予約した操作の名前）。
  仕様の語は状態（安定・別の書き方・廃止予定）を持てるようにした。版の印を入れるか、語ごとの状態と案内で足りるとするかは、オーナーの判断。
closed_on: 2026-11-17
resolutions:
  - date: 2026-11-17
    kind: 解決
    note: |-
      オーナーの判断: 版の印（版のキー）は足さない。語ごとに、仕様（devtrack/spec）の状態（安定・別の書き方・廃止予定）で扱う。
      語を変える・廃止するときの決まりを、CONVENTIONS「語を変える・廃止するとき」に書いた（廃止は、仕様で廃止予定にしてから、置き換え先を案内する誤りで止める。意味を黙って変えない）。
      版の印が要るのは、配布した定義との互換を保証する必要が出たとき。そのときは ADR で決める。
    targets: CONVENTIONS
