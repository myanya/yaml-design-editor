id: UX-237
title: 取り込みの定義の間で規則（rules）を共有できない
status: todo
origin_on: 2026-11-02
origin: labs/rpmz 段階 2（MZ の JSON の取り込み）
body: '**取り込みの定義の間で規則（rules）を共有できない**: MZ の特徴（25 種）・使用効果・番号 → ID の規則を、取り込みの定義 9 つに同じものを写した。書き出し（段階 3）でも逆向きの規則（ID → 番号・特徴・能力値の並び）を
  9 つに写した。1 つ直すと 9 か所を直すことになる'
memo: '書き出しの `include`（束ねる）とは別に、規則だけの部品（`kind: rules` の skill か、変換定義の `rules` を名前で取り込む `uses:`）。変換定義（`_transforms`）の規則を skill
  から使える形が近い'
