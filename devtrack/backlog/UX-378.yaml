id: UX-378
title: エンティティ定義書がツリー主体で読みづらく、レビューしにくい（テーブル定義書の論理版＋操作の説明として読める、ビューを重ねた見せ方がほしい）
status: in-progress
kind: usability
origin_on: 2026-11-23
origin: バックログの議論。UX-339〜342（エンティティ定義書）のレビューが進んでいない理由を、オーナーに聞いたとき
memo: |-
  オーナーの所感: レビューするのに見た目が悪い。個別のエンティティ定義書は、テーブル定義書の論理版に操作の説明が付いたものに近いので、今のツリー主体の見せ方では読みづらい。人が読みやすいように、ビューを重ねておくなどの工夫がほしい。
  UX-339・340・341・342 は、実装とテストは済んでいて、残りはオーナーのレビューだけ。この読みづらさが、そのレビューを止めている。
  いまの見せ方: samples/todos-sysdev のダッシュボード「エンティティ定義書」（.yde/views/design/basic/review/entity-definition.yaml）が、概要・項目・CRUD・操作のビュー（entity-definition-summary・items・crud・operations）を区画に並べる。原本は確定項目（design/basic/final/entities.yaml）で、フォームで開くとツリーになる。
  当たり: テーブル設計書（ダッシュボード「テーブル設計書」）と同じ読み方ができる形にそろえる。1 エンティティを 1 枚で、(1) 概要、(2) 項目の表（項番・項目・名称・型・必須・制約・参照先・説明を 1 行に）、(3) 操作ごとの説明と、その操作が書く項目（C/U）、の順に上から読めるようにする。項目の表は列が多い（属性の状態・根拠・導出元など）ので、レビュー用の列と確認用の列を分けるかも決める。
  見せ方だけの話で、確定項目の持ち方（原本）は変えない。UX-342 の残り（画面での見やすさ・空欄の理由の見せ方・入れ子の項目の見せ方）と一緒に扱う。
  確かめ方: オーナーの所感と、ビュー定義の読みから。画面では見ていない。
  （2026-11-23 オーナーとのすり合わせ）TODO の実データで、いまの見え方と 1 枚にまとめた案の見本を作って見てもらった（概要 → 項目の表 9 列〔項番・項目・名称・型・必須・制約・参照先・初期値と自動・説明〕→ 入れ子の項目 → 操作と書く項目 → 項目 × 操作）。オーナーは「これだ」。導出元がどこかなどは管理してくれればよく、自分は中身のレビューをしたい。確認用の列（経路・属性の状態・根拠・導出元）は外してよい。見せ方は、ダッシュボードの区画を重ねなくてもよく、今の業務の画面のように、一覧から個票へ飛ぶ形でよい。
  いまの仕組みの足りない所。ダッシュボードの個票（業務詳細）は EntityPage で、エンティティの項目をツリーのフォーム（側面ごとのカード）で出す決め打ち。区画を重ねる仕組み（文書ビューの fields と、受け取る値つきの表 grid）は、編集画面のビューのタブにだけあり、文書単位（ルートの ID）で当たる。ENT-todo は 1 つのファイル（entities.yaml）の中の要素なので、いまの文書ビューは当たらない。
  直し方の当たり。文書ビューを、エンティティ型を当て先にして個票に出せるようにする（個票が、そのビューの区画を重ねて描く。区画の描き方は今の文書ビューのものを使う）。語彙を 1 つ足すので、メタスキーマ・仕様・manual も合わせる。
