resolutions:
  - date: 2026-11-23
    kind: 一部
    note: "実装した。(1) サンプル（samples/todos-sysdev）に、中身を読むためのレビュー用の表を足した（項目＝項番・項目・名称・型・基底・必須・文字数・形式・選択肢・参照先・初期値・自動で入る値・説明、入れ子の項目、操作と書く項目）。(2) 製品に、個票に当てる文書ビューを足した（文書ビューの idPattern。ダッシュボードの個票＝業務詳細が、当たるビューの区画を、その要素を根にして重ねて出す。CLI は view <ビューID> <ID>）。(3) ダッシュボード「エンティティ定義書」に「エンティティ一覧」を足し、ID から個票（entity-definition-sheet＝概要 → 項目 → 入れ子の項目 → 操作と、書く項目 → 項目 × 操作）へ進めるようにした。確かめ方は、CLI の出力と自動テスト（CompositeDocViewTest・ViewDefinitionsTest・ElementSheetUiTest・TodosEntityFoundationTest。全テスト通過）。画面の見え方はオーナーの確認待ち。見本との差: 制約は 1 列でなく「文字数・形式・選択肢」の 3 列。書く項目の並びは項目の順でなく ID の順。項目 × 操作の見出しは横書き。表はいまのグリッドの見た目"
