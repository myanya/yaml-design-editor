id: UX-202
title: 区画のタイルを縦（左の一覧）にしたとき、「一覧と並べる」（一覧 4：詳細 6）では一覧の 4 の中からさらに 220dp をタイルに取るので、表が狭くなる
status: resolved
origin_on: 2026-10-26
origin: ダッシュボードの区画のタイル（群と並べ方）を入れたとき
body: '**区画のタイルを縦（左の一覧）にしたとき、「一覧と並べる」（一覧 4：詳細 6）では一覧の 4 の中からさらに 220dp をタイルに取るので、表が狭くなる**。auto の判定は「タイル 1 枚 150dp・群の見出し 80dp」の見積もりで、長い見出しの実際の幅は測っていない（画面での見え方は未確認）'
memo: 分割時は縦を横に落とす（または分割時だけタイルの幅を狭める）か、auto の見積もりを実測（`onSizeChanged`）に替える。判定は `DashboardPane.estimatedTileRows` の 1 か所
targets: 分割中は auto を横に決め、vertical は左の一覧を 170dp に狭める（`DashboardPane`）
closed_on: 2026-10-26
resolutions:
  - date: 2026-10-26
    kind: 解決
    section: 注文管理サンプル
