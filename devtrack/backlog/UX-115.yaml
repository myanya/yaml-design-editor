id: UX-115
title: カーネル側の CLI（cli モジュールの `workspace validate`）は、定義体で書かれた検査を1つも実行しない
status: resolved
origin_on: 2026-09-20
origin: 今後のテーマの精査
body: '**カーネル側の CLI（cli モジュールの `workspace validate`）は、定義体で書かれた検査を1つも実行しない**（構造の検証・ID の重複・参照の解決・宣言のない関係名だけ。詳細文書の存在・整合・多重度・対象型・非循環・網羅・遷移・利用者の
  `constraints` は、アプリと root の CLI `validate` だけが実行する。**カーネル側では終了コード0なのに、アプリではエラーが出る**ことがある）'
memo: '事実: 定義体を読む部品（`CheckLibrary`）と評価する部品（`SemanticQuery`）は semantic-core にあるが、それを呼ぶのは root の `SchemaLoader`・`Validator`・`RuleDiagnostics`
  だけ。カーネルのスキーマ読み込み（`WorkspaceReader.parseSchemas`）は `constraints`・`functions`・`vocabulary`・`checkers` を読まず、組込み定義体も読み込まない（`BuiltinDefinitionResources`
  を使うのは root だけ）。Phase 6 で検査を定義体へ移すたびに、この差は広がった（意図的差分 D-20・D-23 に記録済み）。ROADMAP P27 の D-4（root の検証をカーネルと同等に）の中身であり、UX-105（カーネル側で語彙のキーが警告になる）も同じ根
  **進捗（2026-09-21・P27 段B-2）**: カーネルのスキーマ読み込みが、定義体の検査を読むようになった（検査の中身と出どころは root と完全一致）。残りは、読み込んだ検査をカーネル側で評価して文書へ配ること（次の小段）
  **対応（2026-09-21・P27 段B-3・B-4＝R27-06）**: 評価して文書へ配る部品（`validate.WorkspaceChecks`）をカーネルへ移し、`workspace validate` も定義体の検査を実行するようにした（出力に「検査」の区分と保留・検査のエラーで終了コード
  3＝意図的差分 D-28）。アプリ側と結果が一致することをテストで確かめている。**残**: root にだけ残る検査（ID のパターンからの逸脱・重複所有・テンプレートの健全性）は、カーネル側の CLI には出ない（P27 段D） **→
  解消（2026-09-21・P27 段D の D-a＝R27-13・意図的差分 D-33）**: この3つと、スキーマの定義の点検・宣言のない関係名の点検を、カーネルへ移した。文書ごとの指摘の全体が、アプリとカーネルで一致する（残りの食い違いは
  UX-117）'
targets: ARCHITECTURE §4.41・意図的差分 D-28
closed_on: 2026-09-21
resolutions:
