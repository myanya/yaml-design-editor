id: UX-334
title: 補正で置き換えた値（項の origins）が設計書に出ない。足したもの（origin）だけが出る
status: todo
kind: feature
origin_on: 2026-11-16
origin: 'samples/todos-sysdev で、補正「TODO の更新者は 100 文字まで」を書いて試したとき'
memo: |-
  補正の set は、要素の origins に {path, 段, 補正の ID と名前} を残すが、生成の定義はまだ origins を写していない。
  エンティティ定義書の更新者は 100 文字に変わるが、出どころは「基本設計「更新者を記録する」」のままで、補正で長さを変えたことはレビューで分からない。
  エンティティ定義書の項目・テーブル設計書の列・アクション定義書の結果に、置き換えた場所と補正の名前を写す（例 changes: [{path: maxLength, by: todo-updated-by-length}]）
  （2026-11-21 オーナーの判断）カーネルの段の補正（.yde/stages）は今後使わない（UX-333 を見送り）。残りは、テーブルの確定項目（design/detail/final/tables.yaml）に補正の出どころ（origins）が無いことだけ。
  （2026-11-23 オーナーの判断）段の仕組みは残す（UX-375 を見送り）。段の補正をまた使うことになったら、置き換えた値の出どころ（項の origins）を設計書に出す件も、あわせて考える。
features:
  - C-23
resolutions:
  - date: 2026-11-21
    kind: 一部
    note: "todos-sysdev では別の形で出るようになった。確定項目に補正の出どころが残り（design/basic/final/entities.yaml の origins に kind: correction・source: COR-…・value・reason）、ビュー entity-definition-items の「根拠」の列に出る。残りは、テーブルの確定項目（design/detail/final/tables.yaml）に origins が無いことと、カーネルの段の補正（.yde/stages。このサンプルではもう使っていない）で置き換えた値の出どころ"
