body: '**パターン制約（V-09）のエラーは原因までは分かるが、どこで発生し・どこを直せばよいか・参照の連鎖（テーブル参照）がどうなっているかが追えない**（eapi-auth-for-pii のデモで体験）。count の「解が N
  件です」も同様（オーナー確認:「それだけでは難しいが周辺から推測は可能」）'
memo: '**実装（2026-09-04・R28-05a）**: absent／count 違反の指摘に**該当の組（束縛の表）を列挙**（「該当の組: api=EAPI-001・tbl=TBL-MEMBER」「解の組: item=TI-101…」。3組＋ほかN組）し、`relatedIds`
  に相手側IDを積んで既存のIDジャンプ導線（UX-15 と同じ選択メニュー）で各エンティティへ飛べるようにした（`SemanticQuery.matchesFrom`）。残: 束縛ごとの**出現座標**への直接ジャンプ（V-07 の IssueDerivation
  相当の選択メニュー）は将来拡張。**追補（同日・オーナー指摘「この文書はINFO止まり」）**: **エラー級の制約違反は出現側の文書にも同じ重大度（ERROR）＋該当の組で報告**するよう変更（修正対象の文書を開いているのに気づけない問題の解消。警告級は
  INFO 案内のまま＝ノイズ回避。全体集計では同一違反が出現数ぶん数えられる）'
targets: R28-05a（FEATURES V-09）
