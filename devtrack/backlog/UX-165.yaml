id: UX-165
title: エンティティの削除で、外からその要素自身への参照があるときは今までどおり拒否する
status: todo
origin_on: 2026-10-13
origin: P40 段階 1
body: '**エンティティの削除で、外からその要素自身への参照があるときは今までどおり拒否する**（保有する要素への参照は「壊れる参照」を見せて続行か拒否を人が決める形にした。親自身への参照も同じ形に揃えるか）'
memo: |-
  `SemanticRefactor.delete` の `inbound` を error でなく warnings に落とす。拒否のままにする理由があれば文書に書く
  （2026-11-23 オーナーの判断）そろえる。エンティティの削除で、その要素自身への外からの参照があるときも、保有する要素への参照と同じく、壊れる参照を見せて続行か拒否を人が決める形にする（SemanticRefactor.delete の inbound を error でなく warnings に）。実装はこれから。
