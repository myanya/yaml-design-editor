id: UX-374
title: 全件テストの時間と実行ごとのばらつきを減らす（TODO サンプルと devtrack の検査が重い）
status: todo
kind: dev
origin_on: 2026-11-22
origin: テストとアプリ生成の改善後、同じコードで全件テストを測り直したとき
body: |-
  **全件テストに約28分かかる**: Windows / JDK 21 で、ビルド成果物を再利用して全テストを実行し直すと27分51秒だった。JVM 2,325件と Web 4件はすべて成功したが、開発時の待ち時間はまだ長い。
  テスト結果のクラスごとの時間を合計すると、TODO サンプル107件が16分52秒、app-core の通常462件が2分21秒、コミット前の規則・文書検査57件が3分35秒、その他のリポジトリ検査221件が27秒だった。サンプル検査は起動・終了を含む全体時間の約6割を占める。
  同じコードの前回はサンプル26分25秒、通常2分00秒、規則・文書7分55秒だった。一様な短縮ではなく、実行ごとのばらつきも大きい。前回の全体47分1秒には文書生成と再ビルドも含まれるため、全体時間をそのまま改修効果として比較しない。
memo: |-
  測定条件: Gradle の test を --no-daemon --no-parallel --max-workers=2 で実行し、一時 init script で JVM の Test タスクだけを強制再実行した。コンパイルと資源生成は再利用し、全体の実時間、Test タスクの実時間、JUnit XML のクラス・ケース別時間を分けて記録した。
  今回の上位は DevtrackTest 3分08秒、TodosSystemDocumentsTest 3分04秒、TodosSysdevTest 2分45秒。後者では複数形状のテーブル生成と H2 の DDL 検査1件が2分17秒を占める。
  実施済み: 検証と定義読み込みの重複を削減し、preCommitTest を全件実行とフックで共有した。実サンプル検査は sampleTest に分け、入力を宣言した。アプリ生成は report --batch で Java の起動回数を121回から5回に減らした。これらの後にも残るテスト時間をこの指摘で扱う。
  次の調査は同じ入力・実行条件で複数回測り、初期化、検証、変換、Java コンパイルと GC の時間を切り分ける。サンプルと devtrack の上位ケースから、不要な開き直し・全体再計算と、大きな実サンプルを必要としない検査を確認する。型解決の繰り返しは UX-295 と合わせて調べ、根拠なく原因と決めない。
  改善後は検査の観点と件数を維持したことを確認し、全件と通常の単体検査を同じ条件で比較する。テストを外すだけの短縮や、実行時の app/data/ の読み取り・コピーは行わない。並列度やヒープの変更は、効果と実行間の干渉を測ってから判断する。
