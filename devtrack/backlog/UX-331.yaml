id: UX-331
title: todos-sysdev のエラー設計書で、要求の形の誤り（URL のパラメータが読めない・決まっていない HTTP メソッドなど）が想定外（500）に入る
status: todo
kind: feature
origin_on: 2026-11-15
origin: samples/todos-sysdev のエラーとメッセージ系の生成（エラー設計書の @ControllerAdvice）
memo: |-
  エラー設計書は NotFoundException（404）・InvalidTokenException（起点の画面へ）・そのほかの例外（500。受付番号）の 3 つを受ける。
  利用者の要求の誤り（MethodArgumentTypeMismatchException・MissingServletRequestParameterException・HttpRequestMethodNotSupportedException など）は、
  いまは想定外として 500 になり、ERROR のログが出る。400 番台に分けるか（画面と文・ログの重さ）を議論で決める
related:
  - UX-374
features:
  - C-21
resolutions:
  - date: 2026-11-21
    kind: 一部
    note: "生成アプリの側は一部を分けている。WebErrors（.yde/reports/application/WebErrors.java）が、静的資源なし（NoResourceFoundException）と決まっていない HTTP メソッド（HttpRequestMethodNotSupportedException）を個別に受ける。パラメータの型違い・不足（MethodArgumentTypeMismatchException・MissingServletRequestParameterException）は Exception（500）のまま。設計書（design/detail/final/error-handling.yaml の handlers）は 404・302・500 の 3 つのままで、アプリと合っていない。設計書に出る GlobalExceptionHandler・InvalidTokenException という名前も生成アプリには無い（アプリは WebErrors）"
