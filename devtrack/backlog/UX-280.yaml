id: UX-280
title: 操作の前提の文面で {left} と {right} が埋まらず、比べた値（期限など）を見せられない
status: duplicate
kind: bug
origin_on: 2026-11-08
origin: labs/adventurers-guild の掲示する操作で、期限を過ぎた依頼の前提の文面に {left} を書いたとき
memo: |-
  検査の message では {left} {right} が比べた値になるが、前提では文字のまま出る（マニュアルの前提の節も {id}・束縛・受け取った値だけを挙げている）。いまは受け取った値（掲示日 ）を出して逃げている。検査と同じ穴を前提でも埋めるか
  （2026-11-21 現物確認）UX-370 と原因が同じ。前提の check の違反は SemanticRuleResult(VIOLATED, violations = …) で返り、matches は null。ActionPlanner.message は matches の先頭の行の束縛しか読まないので、{left}・{right} も束縛の穴も埋まらない。violations（解の行と比べた値を持つ）を読めば両方に届く。
related:
  - UX-370
features:
  - OP-03
closed_on: 2026-11-21
duplicate_of: UX-370
resolutions:
  - date: 2026-11-21
    kind: 重複
    note: UX-370と原因が同じ（ActionPlanner.messageが、checkの違反の解と比べた値を読まない）。{left}・{right}を埋める点はUX-370の技術メモへ移した
