id: UX-171
title: ワークスペース単位の各種の表示設定（レンズの既定の配置・隠す型・型の色・矢印の向きなど）を置く場所と、管理する画面が無い
status: resolved
origin_on: 2026-10-17
origin: P42 段階 1（オーナー要望）
body: '**ワークスペース単位の各種の表示設定（レンズの既定の配置・隠す型・型の色・矢印の向きなど）を置く場所と、管理する画面が無い**（矢印の向きを関係レジストリの `arrow` に置いた初版は、オーナーの指摘「スキーマ定義は表示管理ではない」で取り下げ）'
memo: '2026-10-17 決定: 置き場は `_views` のレンズの見え方の定義（`kind: lens`。設計スペースの「ビュー」に並び、組込みスキーマのフォームで編集できる。両構成で使える）。矢印の向きを最初の項目として移した。レンズ以外の表示設定も同じ流儀で足す。`.yde/workspace.yaml`
  の `display:` 節は、構成ファイルにスキーマを当てない規則とレガシー構成の問題で見送り。起動を跨ぐ個人の好みは `Preferences`（UX-162）'
targets: P42（FEATURES X-12）
closed_on: 2026-10-17
resolutions:
  - date: 2026-10-17
