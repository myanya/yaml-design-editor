id: UX-204
title: 散布図の軸は線形だけで、値が桁で散るとき（単価 120〜49,800）は点が左端に固まって読みにくい
status: resolved
origin_on: 2026-10-26
origin: samples/orders の散布図（単価と受注数量）
body: '**散布図の軸は線形だけで、値が桁で散るとき（単価 120〜49,800）は点が左端に固まって読みにくい**。横軸の目盛りも 0・10,000・20,000 … になり、安い商品の違いが見えない'
memo: '`x` / `y` に軸の種類（`scale: log`）を足す。目盛りは 1・10・100 … の刻みで、0 以下の値は描かない（注意に出す）。描画は `ScatterChart` の `ScatterAxis` の 1 か所'
targets: 'R46-08（`scale: {x: log}`。目盛りは 10 の累乗、0 以下は描かず注意に出す）'
closed_on: 2026-10-26
