id: UX-136
title: 値の式と変換のひな型で、値をそろえる語が片方にしかない
status: todo
origin_on: 2026-09-28
origin: labs/kakeibo の取り込み
body: '**値の式と変換のひな型で、値をそろえる語が片方にしかない**: 変換のひな型に足した `$date`（年月日をそろえる・`$as` で形）と `$trim` は値の式に無く、値の式の `length` `upper` `lower`
  は変換に無い。`number` だけは 1 つの読み方（`SemanticExpression.numberOf`）を共有する。値の条件の `lt` / `gt` などの数の読み方（`compare`）は `numberOf` を通しておらず、桁区切りの表記を読まない'
memo: 語彙の予算（CONVENTIONS §9）の中で、必要になったものから対にする。`compare` を `numberOf` へ寄せるのは既存の挙動の変更なので、意図的差分に登録してから
