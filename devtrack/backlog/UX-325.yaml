id: UX-325
title: samples/todos の番号と参照に文字数の上限が無い（テーブルのカラムの長さが決まらない）
status: todo
origin_on: 2026-11-15
origin: 'samples/todos-sysdev のデータ系の設計書（テーブル設計書）の型の対応を決めたとき'
memo: |-
  TODO番号（TODO- と 3 桁以上）・カテゴリ番号・タグ番号・作業項目番号と、それを指す参照には文字数の上限が無く、テーブルの VARCHAR の長さが決まらない。
  オーナーの判断: 上限があるのが普通で、本来は業務モデルの側で制限すべき内容。いまは長さを指定しない VARCHAR にしておき、業務モデル（samples/todos の common.yaml の番号の型）に上限を足すときに、テーブル設計書へ写す
