id: UX-297
title: スキーマ文書を開くたびに 5 回解析する（文書として・検査の定義集め・スキーマ文書の読み取り）
status: discussing
kind: usability
origin_on: 2026-11-12
origin: 開く処理の分析（docs/archive/workspace-open-analysis.md）
memo: |-
  WorkspaceReader.load が文書として 1 回、parseSchemas が検査の定義集め（CheckCatalog.libraryOf）のために parseToRaw で 1 回、SchemaDocuments.parse が parseToRaw で 1 回（parseToRaw は 2 回解析）。式の項目を読むために生の値を木へ戻す（fromAny）。スキーマ文書の解析（暖 0.11 秒）のうち約 0.08 秒が YAML の解析。
  案 A2: 文書として読んだ木から生の値を作り、1 回の解析で済ませる。
  （2026-11-21 現物確認）登録のあと、State を名前で書いた条件（UX-315）を使うスキーマ文書は、展開してからもう一度組み立てるようになった（WorkspaceReader の usingStates の分岐 → SchemaDocuments.parseRaw）。YAML の解析は増えないが、その文書のスキーマの組み立ては 2 回になる。
theme: T-04
related:
  - UX-296
features:
  - C-01
  - S-15
resolutions:
  - date: 2026-11-21
    kind: 一部
    note: "5 回の解析が 2 回になった。A1（UX-296）で parseToRaw が 1 回の解析になり、スキーマ文書の読み取り（SchemaDocuments）は、検査の定義集めで読んだ値をそのまま受け取る（WorkspaceReader.parseSchemas。読めなかった本文だけ読み直して同じ誤りを出す）。この環境の CLI で、スキーマ文書の解析は 0.32〜0.35 → 0.23〜0.30 秒。残りは、文書として読んだ木から生の値を作って 1 回にすること（数や真偽値のキーの型が変わらないことを確かめてから）と、式の項目を読むために生の値を木へ戻す分（fromAny）"
