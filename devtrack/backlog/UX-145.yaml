id: UX-145
title: Hot Reload の MCP 設定（`.mcp.json`）が Windows 向け
status: todo
kind: dev
origin_on: 2026-10-11
origin: P36 段階 0
body: '**Hot Reload の MCP 設定（`.mcp.json`）が Windows 向け**（2026-10-31 から `powershell … scripts/hot-mcp-server.ps1`。セッションと一緒に止めるのに
  Windows のジョブを使う）で、mac / Linux では `./gradlew hotMcpServer` に読み替えが要る'
memo: |-
  Claude Code の `.mcp.json` は OS ごとの切替を持たない。利用者側の設定で上書きするか、OS を判定する起動スクリプトを 1 枚挟む。mac / Linux でも、セッションが終わったときに Gradle の子孫が残らないか（プロセスグループで止める）を確かめる
  （2026-11-18 現物確認）Linux のクラウドのセッションでも「powershell が見つからない」で MCP サーバが起動せず、画面の確認（ui-check）ができない
