id: UX-242
title: 値の式の `via` が、ID の無い配列の要素から参照を辿れず、パスの番号を黙って無視する
status: discussing
origin_on: 2026-11-02
origin: labs/rpmz 段階 4（ドロップ表）
body: '**値の式の `via` が、ID の無い配列の要素から参照を辿れず、パスの番号を黙って無視する**: (1) `{each: {path: dropItems}, value: {via: dataId, path: name}}`
  は「いまの要素がありません」で得られない（ドロップの枠には ID が無い）。(2) `{via: "dropItems[1].dataId", path: name}` は番号を無視し、ドロップが 1 つの敵キャラでも 2 つ目の欄に 1
  つ目の名前が出る（誤った値が黙って出る）。そのため、ドロップ表に「名前と出現率（1/N）」を並べられない（今は落とすものの名前だけの表と、敵キャラのフォームの出現率）'
memo: (2) は少なくともビュー定義のリントで「via に番号は書けません」と止める。直すなら、参照の場所（`ScannedRef` の path）で `via` のパスを番号まで照合する。(1) は `each` のいまの要素の場所（文書の中のパス）を持ち回り、その部分木に書かれた参照を辿れるようにする
