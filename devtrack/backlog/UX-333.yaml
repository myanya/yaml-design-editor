id: UX-333
title: 段の補正を書くのに、段の項の形（entities[*].aspects[*].fields など）を知る必要がある。設計書で見ている言葉（どの型のどの項目）で当たり先を書けない
status: todo
kind: usability
origin_on: 2026-11-16
origin: 'samples/todos-sysdev で、補正「TODO の更新者は 100 文字まで」を書いて試したとき（オーナーの問い「人は、どうやって直すの？」）'
memo: |-
  人が見ているのはエンティティ定義書の「todo の updated_by」だが、補正は段の項の形で書く（each: entities・where: id・入れ子の each: "aspects[*].fields"・where: key）。
  形は generate --model --stage で見られるが、補正を書くたびに項の形を調べることになる。
  案: 補正にだけ、ID で当たり先を書く短い形（例 target: { entity: todo, field: updated_by }）を足し、読み込みで each・where へ下ろす。
  生成物から「この値の補正のひな型」を出す入口（CLI か画面）も考えられる
features:
  - C-23
