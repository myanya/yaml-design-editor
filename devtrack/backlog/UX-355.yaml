id: UX-355
title: "matrix を証人の側のスキーマに書くと、誤りにも警告にもならず何も指摘されない"
status: todo
kind: usability
origin_on: 2026-11-16
origin: "仕様の例（devtrack/spec/examples）を書いて、実際の結果と突き合わせたとき"
memo: |-
  matrix（行: req・列: env・証人: test）を、証人のスキーマ（test）に書いたところ、足りない組み合わせがあるのに指摘が出なかった。
  同じ宣言を行の要素のスキーマ（req）に移すと、足りない列（ENV-2）が指摘された（例 EX-matrix-missing-cell は行の側に書いた形）。
  manual/checks.md の例は行の側（処理設計書のスキーマ）に書いているが、「どのスキーマに書くか」は明記していない。
  意図した動き（行の母集団に入らない要素への判定の保留）なのか、書く場所の誤りを読み込みで知らせるべきなのかを決める。
  知らせるなら、rows の選択が自分のスキーマの文書の要素を 1 つも選ばない matrix を、スキーマの読み込みの点検に出す。知らせないなら、manual に書く場所を明記する。
features:
  - V-11
spec:
  - CTX-matrix
