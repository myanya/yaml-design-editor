id: UX-310
title: 保存時に自動で入る値（auto）が、名前の付いた型（`年月日` など）の項目と、型に書いた印では、保存と変更セットの適用のときに入らない
status: resolved
origin_on: 2026-11-14
origin: samples/todos の個票に更新日（auto updated）と状態の履歴（行の日付は auto created）を足し、写しで操作を適用したとき
memo: |-
  個票の更新日 `{ key: updated_on, type: 年月日, auto: updated }` が、完了の操作を適用しても変わらず、登録の操作で作った個票の履歴の行は「必須項目「日付」が未設定です」で止まった。`type: date` と直接書くと入った。
  保存の計画（SemanticAutoValues の Walk）が、項目を解決せずに印と型を読んでいた。名前の付いた型の項目は型が date に見えず、型に書いた印（「型に書けば引き継がれ」）は見えない。
  新しい要素の初期値（SchemaScaffold.defaultTree）は解決して読んでいたので、作成日（auto created）は作るときだけ入り、気づかれなかった
closed_on: 2026-11-14
resolutions:
  - date: 2026-11-14
    kind: 解決
    note: 保存の計画で項目を schema.resolve してから印と型を見るようにした（ひな型の初期値と同じ読み方）。SemanticAutoValuesTest に、名前の付いた型の項目・型に書いた印・新しい文書の入れ子の行のテストを足した
    targets: semantic-core/semantic/AutoValues.kt
targets: semantic-core/semantic/AutoValues.kt
features:
  - E-14
