id: UX-45
title: 自動化タブを見ても何が自動実行対象か分からない
status: when-needed
kind: usability
origin_on: 2026-08-09
origin: S2第1回
body: '**自動化タブを見ても何が自動実行対象か分からない**（trigger 付きアクティビティの一覧・監視対象・次回発火が見えず、監視ONで何が起こるか読み取れない）'
memo: |-
  自動化タブへ「自動実行対象」一覧（アクティビティ・トリガ種別・対象glob・次回発火予定／デバウンス残り）を常設表示。`AutomationEngine` がロード済みの定義から導出できる
  （2026-11-23 オーナーの判断）AI によるサポート機能は、いまほとんど使っていないので、優先度を下げる（必要になったら）。
