id: UX-283
title: exists の違反の文面で、照合の途中で束縛した名前（{p.title} など）が埋まらず、穴の文字がそのまま出る
status: todo
origin_on: 2026-11-09
origin: labs/adventurers-guild の「討伐の場所は対象の魔物の生息地」の検査（match で場所を p に束縛し、also と same で生息地を辿る）の文面に {p.title} を書いたとき
memo: expect exists の違反は解が無いので束縛の表が空になり、match の途中までは見つかっていた p も文面に出せない。指摘の文面に「討伐依頼「QST-0905」の場所 {p.title} は…」と穴がそのまま出た。
  いまは文面から穴を外して逃げている。途中まで見つかった束縛で埋めるか、埋まらない穴を読み込みのときに知らせるか
