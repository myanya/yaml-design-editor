resolutions:
  - date: 2026-11-23
    kind: 一部
    note: "実装した。(1) 製品: 文書ビューの区画を要素ごとに繰り返す書き方（区画の each: {path, where} と sections。見出しの {パス} は要素の値で埋まる）を足した。個票にも文書のビューにも書ける。(2) サンプルの生成: 確定項目の書込（CRUD-*）に、子要素への作用 element（C・U・D）と、書く子の項目 elementItems を足した。業務モデルの insert＝C、set・delete＝C・U・D（子要素のすべての項目）、作るときに値を入れる並び＝C。子のエンティティの中への作用（作業項目を済にする）は、親の TODO の操作にも「作業項目を U」の書込として出るようにした（書込は 52 → 53。アクション定義書の書込一覧に 1 行増える。詳細設計の生成物は変わらない）。(3) サンプルの個票: 「入れ子の項目」の 1 つの表をやめ、「子要素 × 操作」の表と、子要素ごとのまとまり（コメント一覧・状態の履歴は 項目 と 項目 × 操作、作業項目は子のエンティティの 項目 と 項目 × 操作）にした。確かめ方は CLI の出力と自動テスト（CompositeDocViewTest・ViewDefinitionsTest・ElementSheetUiTest・TodosEntityFoundationTest）。画面の見え方はオーナーの確認待ち。R/D（読む・エンティティごと消す）は扱っていない"
