id: UX-380
title: エンティティ定義書で、子要素（並びの要素）を個別の表で確かめたい。操作ごとに、子要素への C/U/D も見たい
status: in-progress
kind: usability
origin_on: 2026-11-23
origin: オーナーによるエンティティ定義書の個票（UX-378）のレビュー。UX-340・UX-342 の確認の結果
memo: |-
  オーナーの指摘（2026-11-23）:
  ・UX-340（項目 × 操作）: C/U は業務の認識と合うようになった。ただし、子要素は個別の表として確かめたい。各操作に対して、子要素ごとの C/U/D が見たい。
  ・UX-342（項目と入れ子の項目）: 一緒くたの表にされてしまったので、どれがどれに対応するのかが分かりづらい。
  いまの形: 個票の「入れ子の項目」は、コメント一覧と状態の履歴の中の項目を 1 つの表に並べ、「親の項目」の列で分けている。項目 × 操作は親の項目（タグ・作業項目・コメント一覧・状態の履歴）の単位で C/U を出すだけで、子要素に何をするか（足す・変える・消す）は出ない。確定項目（CRUD-*）も親の項目の単位。
  調べたこと: 業務モデル（design/basic/derived/model.yaml の actions[].effects）には、並びへの作用の種類（insert＝足す・set＝入れ替える・delete＝消す）と、足すときに書く子の項目（written）がある。子要素ごとの C/U/D は機械で導ける（TODO の例: コメントは「コメントを追加する」で C、「TODOを編集する」で入れ替え＝C/U/D。状態の履歴は状態を変える 6 つの操作で C。作業項目は「追加する」で C、「済にする」で U。タグは登録で C、編集で入れ替え）。
  決めること: (1) 子要素の表を、同じ個票の中に子要素ごとに並べるか（文書ビューに「区画を要素ごとに繰り返す」語彙が要る）、子要素の個票へ進む形にするか。(2) 並びを丸ごと入れ替える操作（編集）を、子要素の C/U/D としてどう書くか。
  （2026-11-23 オーナーの判断）(1) 子要素の表は、同じ個票の中に子要素ごとのまとまりとして並べる。(2) 並びを丸ごと入れ替える操作は、子要素への C・U・D すべてとして書く。
