id: UX-227
title: 内蔵作業のパッチ途中失敗で、成功済みの木と索引キャッシュがずれる可能性
status: resolved
kind: bug
origin_on: 2026-10-31
origin: 作業コピーの確認
memo: '`WorkingCopy.applyOps` の索引破棄は正常終了時だけ。内部の部分成功方針とあわせて検討する。外部作業は要求全体を独立コピーで採否するため持ち越さない

  （2026-11-18 現物確認）場所は app-core の tools/WorkingCopy.kt（applyOps のループ）。索引のずれだけなら try/finally で捨てれば消える。部分の成功を残すか戻すかは別の判断'
features:
  - AG-06
closed_on: 2026-11-18
resolutions:
  - date: 2026-11-18
    kind: 解決
    note: パッチが途中で失敗しても索引の覚えを捨てる（成功済みの操作が索引に映る）。成功済みの操作を残す決まりは変えていない
    targets: tools/WorkingCopy.kt・StagingTest
