id: UX-357
title: "小さな言語（クエリ・条件・値の式・変換のひな型・操作の手）の形がメタスキーマに無く、語の一覧が 3 か所に分かれている"
status: discussing
kind: feature
origin_on: 2026-11-17
origin: "メタスキーマの型が any の項目を仕分けたとき（UX-347）"
memo: |-
  クエリ（match・also・forAll）・条件（where・when）・値の比較（check・require・predicate）・値の式・変換のひな型（build・scaffold・set / add / after）・操作の手（do）は、メタスキーマでは型が any で、形は説明文と仕様（docs/spec/expressions.md・templates.md）にある。該当は約 65 か所。
  読み取りが形を確かめて誤りにするので、検証の抜けは無い。
  前提の訂正（2026-11-18）: 登録のときは「設計画面で構造を編集できない」と書いたが、誤りだった。設計画面は、条件・手順・式・ひな型を構造として編集できる（機能 S-27。SchemaValueForms が入力例と語の表示名を持つ）。
  残る論点は 2 つ。
  1. 語の一覧が 3 か所にある: 読み取りの実装（パーサ）・仕様（devtrack/spec）・設計画面（SchemaValueForms の表示名と入力例）。実装と仕様は SpecTest が突き合わせるが、設計画面は別だった。
  2. メタスキーマの検証（スキーマに無いキーの警告・設計画面の汎用の欄の候補）が、小さな言語の中では効かない。
  検討した選択肢:
  - A 案（本格対処）: 仕様の位置（CTX-query-node・CTX-condition・CTX-expr・CTX-template など）をメタスキーマの名前付きの定義にして、各所から $ref で使う。語の一覧がメタスキーマ 1 か所に寄り、設計画面もメタスキーマから欄を作れる。値の式とひな型は再帰し、「決まった値か、式の object か」の形が要るので、汎用の「どちらかの形」（UX-356 で見送った案）が前提になる。約 65 か所の書き換えと、設計画面の作り直しが要る。
  - B 案（暫定）: 仕組みは変えず、設計画面の語（表示名の表と入力例のキー）が仕様の語に含まれることをテストで確かめる。
  - C 案: 何もしない（読み取りが誤りを出すので実害は小さい）。
  オーナーの判断（2026-11-18）: まず B 案で暫定対応し、本格対処（A 案）は別途検討する。
  B 案で分かったこと: 仕様に位置がまだ無い語が 12 個あった（操作の手 insert / delete / create / call / method、照合の連鎖の線 edge、図のひな型の部品 port / portSide / sourcePort / targetPort / children / stroke）。テストに「仕様にまだ無い語」として明記した。仕様に位置を足す作業は UX-358（仕様の残り）で扱う。
  本格対処を検討するときの入口: 汎用の「どちらかの形」を足すか（UX-360 の仕分けとも関わる）、設計画面の欄をメタスキーマから作るか、の 2 つを先に決める。
features:
  - S-15
  - S-27
related:
  - UX-356
  - UX-358
  - UX-360
resolutions:
  - date: 2026-11-18
    kind: 一部
    note: |-
      B 案（暫定）を入れた。設計画面の語（SchemaValueForms の表示名の表と、入力例の最上位のキー・手順の中身のキー）が仕様（devtrack/spec/keywords）の語に含まれることを SchemaValueFormsTest が確かめる。仕様にまだ位置が無い 12 語は一覧で明記し、仕様に足されたら一覧から外すこともテストが求める。
      本格対処（メタスキーマに小さな言語の形を持たせる A 案）は未着手で、別途検討する。
    targets: SchemaValueFormsTest・SchemaValueForms.labelKeys
