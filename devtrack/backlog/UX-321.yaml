id: UX-321
title: 定義体のスコープ（業務モデルなど）を定義できない。生成の材料が、設計書独自のエンティティを業務モデルと取り違える
status: resolved
kind: feature
origin_on: 2026-11-15
origin: 'samples/todos-sysdev で設計書のスキーマを足したとき（業務モデルの項に yde-action などがエンティティとして混ざった）'
memo: |-
  業務モデルの項（BusinessModel）は、ワークスペースの全部の文書のスキーマからエンティティ型を集める。設計書のスキーマは yde-* の詳細化なので外したが、設計の側で独自のエンティティ型を定義すると、業務モデルと区別できない。
  例: todos-sysdev の写しにアクター定義書（型 actor）を足して生成すると、design/generated/controllers/actor.yaml（ActorController）と table-access/actor.yaml（ActorMapper）ができた。生成の材料を書き出すと、業務の型の一覧に actor が並ぶ。
  オーナーの方向（2026-11-15）: 単純なディレクトリではなく「スコープ」を定義できるようにする。今回は業務モデルというスコープを定義し、生成はそのスコープの中の定義体（スキーマ・ビューなど）を見る。ディレクトリでスコープを指定するのは便宜上の書き方の 1 つで、スコープそのものは定義として持つ
features:
  - C-21
closed_on: 2026-11-15
resolutions:
  - date: 2026-11-15
    kind: 解決
    note: '定義体のスコープ（workspace.yaml の scopes。include と uses）を足し、生成の定義に scope を書くと、そのスコープのスキーマだけから業務モデルの項を作るようにした（ADR-0032）。業務モデルから設計を使うとスキーマの誤りになる。定義の索引と検査をスコープで絞るのは UX-326'
