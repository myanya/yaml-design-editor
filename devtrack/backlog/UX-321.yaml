id: UX-321
title: 業務モデルの項に入れるスキーマの範囲を宣言できない（今は定義の種類 yde-* を詳細化するスキーマだけを外している）
status: todo
origin_on: 2026-11-15
origin: 'samples/todos-sysdev で設計書のスキーマを足したとき（業務モデルの項に yde-action などがエンティティとして混ざった）'
memo: |-
  業務モデルの項（BusinessModel）は、ワークスペースの全部の文書のスキーマからエンティティ型を集める。設計書のスキーマは yde-* の詳細化なので外したが、設計の側で新しいエンティティ型（画面など）を定義すると、業務モデルに混ざる。業務モデルのスキーマを宣言する（スキーマの印か、workspace.yaml の範囲か）を、画面の筋の前に決める
features:
  - C-21
