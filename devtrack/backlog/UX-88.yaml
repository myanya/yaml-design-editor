id: UX-88
title: 出現パネルに自己ファイル内のID（1つ目）も一覧される目的が分からない
status: todo
origin_on: 2026-09-02
origin: S1第2回
body: '**出現パネルに自己ファイル内のID（1つ目）も一覧される目的が分からない**（仕様か？）。**追記（オーナー回答後）**: 個別文書でルートIDが出るのは理解できるが、**一覧系文書（00-issues 等）で1つ目の issue
  のIDが対象になる**のは違和感'
memo: '仕様: 「出現」タブは同一IDの**全出現**（自文書含む）を列挙し、詳細化の全体像を見せる（R7系）。ただし対象IDの決定が `SidePanel` で「文書ルートのID → なければ**先頭のローカルID**」フォールバック（SidePanel.kt
  の rootId）のため、ルートIDを持たない一覧系文書では先頭要素のIDが意図せず対象になる。手当て候補: ①一覧系（ルートID無し）ではフォールバックせず「この文書にはルートIDがありません」表示に倒す ②自文書の出現に「この文書」注記・グレーアウト等の区別表示'
features:
  - I-09
