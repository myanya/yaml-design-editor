id: UX-44
title: ワークスペース全体の検証エラーを確認する手段がGUIにない
status: resolved
origin_on: 2026-08-09
origin: S2第1回
body: '**ワークスペース全体の検証エラーを確認する手段がGUIにない**（検証タブは開いている文書のみ。台本の「全体エラー0を確認」が実施できない）'
memo: 'CLI `validate` は全体一覧を出せる。検証タブのスコープ切替（現文書／全体）か、台帳スペースへの検証サマリ追加。見せる範囲の設計は UX-07 と合同で議論。**実装（2026-08-12）**: 検証タブへスコープチップ「この文書／全体」を追加。全体は
  `AppState.validateWorkspace`（オーバーレイ索引＋unsavedFirstLoader＝見たまま判定）で索引対象の全文書を検証し、ファイル別グルーピング・クリックジャンプ。UX-07 の「影響範囲」スコープは持ち込まず2値に留めた。大規模ワークスペースで重ければ
  UX-63 同様のキャッシュを検討'
targets: R17-03（FEATURES V-04）
closed_on: 2026-08-13
resolutions:
