id: UX-381
title: TODO の業務モデルで、子要素（コメント・作業項目・タグ・状態の履歴）への操作が妥当かを評価する（コメントの編集が「TODOを編集する」に入っている）
status: in-progress
kind: spec
origin_on: 2026-11-23
origin: オーナーによるエンティティ定義書の個票のレビュー（UX-380 の「子要素 × 操作」を見て、コメントの編集を「TODOを編集する」で行うのが気になった）
memo: |-
  確認したこと（2026-11-23）: 定義書の表示や生成の誤りではなく、業務モデルがそう定義している。samples/todos-sysdev/.yde/schemas/business/operations.yaml（samples/todos/.yde/schemas/operations.yaml も同じ内容）の edit-todo が、コメント一覧（comments）を入力に持ち、「入力した一覧で全体を置き換えます。既存コメントへの追記は『コメントを追加する』を使います」と説明している。手順は comments の set（丸ごと入れ替え）と、「コメント一覧を消す」（clear.comments）の set []。定義書の C・U・D は、この set をそのまま読んだ結果。
  いまの子要素ごとの操作（業務モデルの定義のまま）:
  ・コメント一覧: 足す＝「TODOにコメントを追加する」（記録日と本文）。変える・消す＝「TODOを編集する」で一覧を丸ごと入れ替える（全部消すのも同じ操作）。コメント 1 件を直す・消す操作は無い。コメントは ID を持たない（日付と本文だけ）ので、1 件を指す操作を作るなら、指し方（番号か ID）も要る。
  ・作業項目: 足す＝「作業項目を追加する」。変える＝「作業項目を済にする」（済を true にするだけ）。件名を直す・済を戻す・消す操作は無く、「TODOを編集する」にも入っていない。
  ・タグ: 登録のときに入れる。変える＝「TODOを編集する」で並びを丸ごと入れ替える（参照の並びなので自然）。
  ・状態の履歴: 状態を変える操作が 1 行ずつ足すだけで、直す・消す操作は無い（履歴なので意図どおりと思われる）。
  気になる点（評価の観点）:
  ・コメントは「記録」に近いのに、TODO の編集で過去のコメントの日付と本文を書き換え・全消去できる。追記だけにするか、1 件ずつの編集・削除にするか。
  ・コメントは丸ごと直せるのに、作業項目は件名も直せず消せない。子要素の間で扱いがそろっていない。
  ・「TODOを編集する」が、TODO 自身の項目と子要素（コメント・タグ）の両方を持ち、操作の範囲が広い。
  決めること: 子要素ごとに、足す・変える・消すを、どの操作で・どの単位（1 件ずつか丸ごとか）で行うか。決めたら業務モデル（samples/todos と todos-sysdev の operations.yaml）を直し、設計書とアプリを作り直す（画面設計の編集画面の「コメント一覧の行を足す／消す」も変わる）。
  （2026-11-23 オーナーの判断）子要素（コメント）への操作は、追加・削除・編集でよい（途中への挿入などは不要）。TODO 個票への操作として定義する。業務モデルでは並びの番号で指し、設計に落とす過程で「番号で指す操作は DB では実現できない」として、詳細設計の段階で一意な番号を自動で振る形にしたい。まず実現可能性を調べる。
  （2026-11-23 実現可能性の調査）できる。ただし製品に足す物がある。
  ・いまの製品: 手（set・delete・insert・call・each）の対象のパスは決まった文字で、固定の番号（comments[0]）なら set も delete も動く（写しで確認）。受け取った値を番号にする書き方は無い（comments[$index] は定義の誤りになり、その定義の操作が全部使えなくなる）。each: {path} にも「何番目か」を読む手段は無い。受け手になれるのは ID を持つ要素か文書だけで、フォームの行の ⋯ も ID の無い行には出ない。
  ・製品に足す物（小〜中）: (a) 手の対象に、受け取った値の番号を書けるようにする（例 delete: {path: comments, index: $index}。範囲の外は計画で止める）。(b) 画面で行を選んで操作を始めたとき、その行の番号が入力に入る入口（ID の無い行の ⋯）。(a) だけなら番号を手で入れる形になる。業務モデルの項（effects）は手の中身をそのまま写すので、番号の指定はほぼそのまま届く。
  ・基本設計（サンプルの生成）: 番号つきの set＝子要素の U、番号つきの delete＝子要素の D、を UX-380 の導出に足す（小）。
  ・詳細設計（サンプルの生成）: 一意な番号はもうある。明細テーブル todo_comments の主キーは（todo_id, seq）で、seq は追加のとき最大値＋1 を自動で振っている。足すのは「番号で指す操作は seq で 1 行を指す」という段の決まりと、seq で 1 行を更新・削除する Mapper・処理・Service・画面（行ごとのボタンが seq を運ぶ）。生成の定義とひな形が複数にまたがり、ここが一番大きい（アプリの 117 ファイルを突き合わせるテストも更新）。
  ・注意: 削除すると seq は欠番になるので、業務モデルの「何番目」と seq の値は一致しなくなる（並び順は保たれる）。いまの「TODOを編集する」の丸ごと入れ替えは seq を 1 から振り直すが、コメントを編集から外せば無くなる。作業項目は ID を持つので、番号でなく ID で指せる。
