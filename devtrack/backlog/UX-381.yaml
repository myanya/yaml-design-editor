resolutions:
  - date: 2026-11-23
    kind: 一部
    note: "1 段目と、2 段目のうち samples/todos までを実装した。(1) 製品: 手の path に、並びの 1 件を受け取った値の番号で指す書き方を足した（並び[$名前]。番号は 0 から。範囲の外は書かずに止める）。初期値のひな型（$copy のパス）にも書け、選んだ行の今の値を読める。ID の無い行の ⋯ から、その行の番号を入れて操作を始められる。業務モデルの項は、番号で指す効果に row（番号を受け取る値の名前）と written（書く子の項目）を添える。(2) samples/todos: 「コメントを編集する」「コメントを削除する」を TODO 個票への操作として足し、「TODOを編集する」からコメント（入れ替えと全消去）を外した。(3) samples/todos-sysdev の基本設計の導出は、番号つきの書き換え＝子要素の U、番号つきの削除＝子要素の D と読むようにした（業務モデルの変更は、詳細設計とアプリの生成と一緒に次の段で入れる）。確かめ方は ActionIndexTest・RowIndexOpsUiTest・TodosCommentOpsTest・BusinessModelTest。実画面は未確認。残り: samples/todos-sysdev の業務モデルの変更と、詳細設計・アプリの生成（seq で 1 行を指す Mapper・処理・Service・画面）。いまの詳細設計の生成は、番号つきの書き換え・削除を「丸ごと入れ替え・全件削除」と読んでしまうので、そのままでは入れられない（Service の生成が未対応として止まることは確認済み）"
