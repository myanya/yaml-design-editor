id: UX-101
title: 「参照の追加先」で開いた先の文書（画面設計書）に警告が出ず、着地後に何をすべきか分からない
status: todo
origin_on: 2026-09-05
origin: UX-100試用
body: '**「参照の追加先」で開いた先の文書（画面設計書）に警告が出ず、着地後に何をすべきか分からない**（検証（全体）には出るが「この文書」には何もない。オーナー:「該当ページに飛ぶだけだと弱い。エラーに対する適切な対処を行える汎用的なアーキテクチャの検討が必要」）'
memo: '原因の正体: **不足＝不在には座標がない**。R28-05a の他出現への案内（3.9節）は「同じIDの出現がある文書」への配送で、修正先の文書に対象IDの出現も参照も存在しない被参照不足には効かない（そもそも3.9節は制約・マトリクスのみで多重度を配送しない）。対応方針:
  **指摘の三面モデル**（診断＝カーネルの構造情報／配送＝報告先・出現先・**修正先**の3役割／対処＝Jump・CreateFile・ApplyEdit の閉じた語彙に統一）の提案中——修正先配送が本件の解、対処語彙の統一が relatedIds/scaffold/openFiles/derivation
  の場当たり増殖の解。**2026-09-19 追記（R29-06）**: 三面のうち内部構造だけの「診断と配送の分離」は P29 Phase 3 で先行実施済み（`validate/RuleDiagnostics.kt`。報告先・出現先の2配送・挙動不変）——本件の残りは
  UI に効く2面（修正先という第3の配送先の新設・対処語彙 Jump / CreateFile / ApplyEdit の統一）で、引き続き保留'
targets: UX-100・R28-05 系
