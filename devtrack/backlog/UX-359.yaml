id: UX-359
title: "1 つでも並びでも書ける語を、複数形の語にして並びの書き方に揃える（書き方を 1 つにする）"
status: when-needed
kind: spec
origin_on: 2026-11-18
origin: "「どちらかの形」の語の検討（UX-356）で、オーナーが挙げた今後の改修"
memo: |-
  いまは、要素 1 つをそのまま書く書き方と、並びの書き方の両方を受ける語がある（allowSingle で型は付けた。UX-356）。書き方が 2 つあると、読み取り・設計画面・書き換え（改名）・パスの [*] のそれぞれで分岐が要る。
  いずれ、複数の要素を扱える語は複数形の名前にして、並びの書き方だけを受けるように揃えたい（1 つだけ書く語は単数形で、スカラーだけ）。
  対象の当たり: 参照の idPattern（単数形なのに配列も受ける）と idPatterns・scope.schemaIds / documentIds・coverage の detailIn.schemaIds・追加の決まりの key（パスか配列）・文書の entity（object か配列）・ワークスペースの構成の ledger（文字列か配列）。ビューの schemaIds なども同じ読み方をしていないか確かめる。
  既存の定義を壊す変更なので、進め方は CONVENTIONS「語を変える・廃止するとき」に従う（古い書き方の検出と移行の手段を先に用意する。samples・templates・devtrack・labs の定義の書き換えも要る）。
  揃え終えたら、定義の語から allowSingle を外せる（利用者のスキーマに残すかは、そのとき決める）。
