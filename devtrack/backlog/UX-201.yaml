id: UX-201
title: 'クエリ行（`rows: match`）のビューは行数の上限が既定 100 で、超えた分が黙って切れる'
status: resolved
origin_on: 2026-10-26
origin: samples/orders のデータを 1 年分（注文 109 件）にしたとき
body: '**クエリ行（`rows: match`）のビューは行数の上限が既定 100 で、超えた分が黙って切れる**。注文一覧（明細 ID も `ORD-*` なのでクエリ行にしている）がダッシュボードで 100 行になり、ID 順で後ろの未処理の注文
  7 件が「未処理」の区画から消えた（件数 0）。画面にも CLI にも打ち切りの表示が無い'
memo: 'サンプルは `rows.limit: 10000` で逃げた。本体では ①打ち切ったら行数の表示に「100 件まで（全 109 件）」のように出す（`SemanticQueryResult.total` は打切り前の数を持つ）②エンティティ一覧の用途（node
  1 つの照合）では既定を無制限にする、のどちらか。変換は「すべての行を相手にする」で既定を外している'
targets: クエリ行は `limit` を書かなければ上限なしに。書いたときは一覧の見出し・ダッシュボードのタイル・CLI の `truncated` で打ち切りを示す（`VirtualViews.ResolvedRows`）
closed_on: 2026-10-26
resolutions:
  - date: 2026-10-26
    kind: 解決
    section: 注文管理サンプル
