id: UX-200
title: 操作の受け取る値に明細の配列を書けるが、ひな型の中で明細番号の採番（`ORD-006-01`）と金額の計算（単価 × 数量・合計）ができない
status: resolved
origin_on: 2026-10-25
origin: samples/orders の試用（オーナー「注文を追加するときに明細も一緒に足したい」）
body: '**操作の受け取る値に明細の配列を書けるが、ひな型の中で明細番号の採番（`ORD-006-01`）と金額の計算（単価 × 数量・合計）ができない**。`$each` の `$index` は 0 始まりで 0 詰めの書き方が無く、ひな型には四則演算・集計が無い（値の式はひな型の指示に書けない＝ROADMAP
  R30-01）'
memo: '2026-10-26 に対応: ひな型に値の式 `{$value: 値の式}`、繰り返しの 1 始まりの番号 `$position`、`$number` の `$as`（`00` で 0 詰め）。`samples/orders`
  の `register-order` が商品・数量・単価の明細を受け取り、番号・明細金額・合計を組み立てる'
targets: R30-01（一部）・C-15・`TemplateValueTest`
closed_on: 2026-10-26
resolutions:
  - date: 2026-10-26
    kind: 解決
    section: 注文管理サンプル
features:
  - C-15
