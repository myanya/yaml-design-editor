id: UX-290
title: 値の式に日付の足し引き（日・月・年）が無く、「1 年後」を年の数と月日の文字の付け直しで作るしかない
status: todo
origin_on: 2026-11-11
origin: labs/adventurers-guild の登録の有効期限（年会費を納めると 1 年延びる）を操作で書いたとき
memo: |-
  日付の部分 `year` / `month` / `day` と差 `daysBetween` はあるが、日付に日数・月数・年数を足して日付を返す関数が無い。
  いまは `{format: "{y}-{md}", with: {y: {add: [{year: …}, 1]}, md: {extract: [日付, "^[0-9]{4}-([0-9]{2}-[0-9]{2})$"]}}}` で作るので、
  2 月 29 日から 1 年後は無い日付（2029-02-29）になり、「30 日後」「翌月末」は書けない。期限・有効期限・支払期日の計算に要る
features:
  - S-23
  - OP-02
