id: UX-223
title: 全テーブルのカラムを 1 つの表にすると、テーブルの間がファイル名の順になる
status: todo
origin_on: 2026-10-31
origin: クエリ行の並び（テーブルモデルのサンプル）
body: '**全テーブルのカラムを 1 つの表にすると、テーブルの間がファイル名の順になる**（`tm-columns` と、受け取る値を空にした `tm-table-columns` は、`order: { schemaId: tm-physical
  }` で各テーブルの中は物理の文書の順になったが、テーブルはカテゴリ → コメント → TODO と並ぶ。業務エンティティの順は TODO → カテゴリ → コメント）'
memo: '「テーブルの順、次にカラムの順」の 2 段の並びが要る。案は `order` に段を並べる書き方（例 `order: [{ of: t, schemaId: todos-business }, { schemaId: tm-physical
  }]`。クエリ行なら束縛ごとに出現を選ぶ）。物理テーブル定義書の埋め込みとレポートは 1 テーブルずつなので影響しない'
