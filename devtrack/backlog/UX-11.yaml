id: UX-11
title: Undoがキーストローク単位
status: resolved
origin_on: 2026-08-02
origin: R16-04試験
body: '**Undoがキーストローク単位**（120→12→1→10→100 と戻る）。未保存追随で他画面から編集が見えるようになった結果、粒度の粗さが気になる（編集対象と別の画面を見ているときに特に違和感）'
memo: '履歴は `EditBuffer` が `markEdited` ごとにスナップショットを記録している。連続する同一パスへの入力を1エントリへ**合体**（タイムウィンドウ or フォーカス移動で区切る）する設計が要る。UX-08（Undoの単位＝ファイル
  vs 操作系列）と合わせて履歴設計として一括議論したい。**実装（2026-08-13）**: `EditBuffer.recordEdit` に合体キーを導入——同一キー（変異対象のスカラーノード等）かつ1秒以内かつ履歴先端の連続入力は、新規エントリを積まず先端を置換（120→12→1
  と戻る粒度を解消し、フィールド単位・タイプの区切り単位で戻る）。構造操作・Undo直後は常に境界。時刻注入でテスト（ARCHITECTURE §4.34）。ファイル横断のUndo（UX-08）は T-01 の状態管理議論のまま'
targets: R17-03（FEATURES E-05。`DocumentsTest`）
