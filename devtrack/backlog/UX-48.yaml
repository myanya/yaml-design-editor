id: UX-48
title: リトライとターン上限のコスト設計が弱い
status: discussing
origin_on: 2026-08-09
origin: S2第1回
body: '**リトライとターン上限のコスト設計が弱い**: ターン上限での失敗はリトライしても直らず maxTurns×2 のコストだけかかる。エラーが起きていないのに収束打ち切りになる不満も'
memo: 手動実行では上限到達時の未提出ドラフトをレビューへ引き継げるが、自動リトライは毎回ゼロから。①リトライを前回ドラフトからの再開にする ②ターン上限失敗はリトライ対象外の区分にする ③リトライ横断の総トークン上限。`handleFailure`
  の失敗分類から設計
theme: T-01
targets: T-01
