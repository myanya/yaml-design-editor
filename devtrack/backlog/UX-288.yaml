id: UX-288
title: ダッシュボードの業務の流れ（flow）と Lifecycle が同じ移り方を別々に宣言し、食い違いを確かめない
status: resolved
origin_on: 2026-11-11
origin: labs/adventurers-guild に依頼の Lifecycle（quest-behavior.yaml）が入り、ダッシュボード「ギルドの受付」の flow（段と工程）と並んだとき
memo: flow の工程（from・action・to）は Lifecycle の遷移（from・to・by.action）と同じ事実を、段＝区画の filter と State＝述語という別の名前で書いている。片方だけ直すと食い違うが、どちらの読み込みも相手を見ない。
  ギルドでは、flow には流れの外（却下・取消・失敗・期限切れ）を置かない決まりで、Lifecycle には全部を書くので、「flow の工程は Lifecycle の遷移の部分集合」という点検が合う。flow の段を Lifecycle の State から導く・工程の候補を Lifecycle から出す、も考えられる
closed_on: 2026-11-14
resolutions:
  - date: 2026-11-14
    kind: 解決
    note: ダッシュボードの flow に lifecycle を書くと、段（State ごとの区画）・工程（操作による遷移）・入口・履歴を Lifecycle から作るようにした（ADR-0029・S-35）。同じ移り方を 2 か所に書かずに済む。手書きの流れ（steps・moves）は今までどおりで、Lifecycle との食い違いは点検しない
    targets: workspace-core/ViewDefinitions.kt
targets: workspace-core/ViewDefinitions.kt
features:
  - X-26
  - S-28
