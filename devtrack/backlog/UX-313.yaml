id: UX-313
title: 業務詳細のフォームで、表の形（display table）の配列の日付が見せ方（format）を使わず、素の値（2026-10-01）で出る
status: todo
origin_on: 2026-11-14
origin: samples/todos の TODO-004 の業務詳細で、個票の「状態の履歴」（表の形）を画面の部品の木で読んだとき
memo: |-
  個票の日付の項目（作成日・更新日）とコメント一覧（縦並び）の日付は「2026年10月1日」で出るが、状態の履歴（display table）の日付の列は「2026-10-01」だった。
  どの列も型は common#年月日（format yyyy年M月d日）。表のセルが項目の見せ方を読んでいないか、読んでいるのが型を解決する前の項目かもしれない（UX-310 と同じ形の取りこぼしの可能性）。見た目だけで、値と検証は変わらない
features:
