body: '**実装が導出元の全項目を保有しないケース**（エンティティが項目の部分集合だけ実装する等）で、「全項目を継承する or **あえて利用しない項目を明示する**」の規約があるとエラーチェックが強くなるのでは、という提案'
memo: '既存機構だけで成立する規約として確立（2026-08-03）: 除外行を**同一IDの出現**として残し `excluded: true`＋note（理由）を書く。カバレッジは自動充足・整合は保留・理由はデータとして記録。サンプルスキーマ（entity/table
  design）に `excluded` を宣言、MANUAL 整合ルール節に規約を明文化。「excluded 行に type が書かれていたら矛盾」等の締め付けは R16-03b と合わせて将来検討'
