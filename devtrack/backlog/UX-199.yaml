id: UX-199
title: 配列の追加の採番（`methods.insert.id.prefix`）で、親の要素の値を使えない
status: resolved
origin_on: 2026-10-25
origin: samples/orders の作成
body: '**配列の追加の採番（`methods.insert.id.prefix`）で、親の要素の値を使えない**。注文明細の番号を「注文番号-01」のように付けたいが、接頭辞のひな型が見るのは新しい要素だけ（`ActionPlanner.applyInsertRuleTo`
  が `TemplatePlace(map, null, …)` で組み立てる）。サンプルでは明細番号を手で書き、注文番号で始まることを検査で確かめている'
memo: '2026-10-26 に対応: 配列を持つ要素（親）を `holder` として渡し、接頭辞のひな型から `$of: self` で読める（アクションの `insert`・追加ボタン・新規行の `newElement`）。skill
  の取り込み（`target.id.prefix`）は据え置き。`samples/orders` の明細（`{$format: "{orderId}-", $of: self}`）が最初の利用例'
targets: OP-01・`InsertNumberingTest`
closed_on: 2026-10-26
resolutions:
  - date: 2026-10-26
    kind: 解決
    section: 注文管理サンプル
