id: UX-319
title: 生成で、同じ表への書き込みを 1 つの文にまとめる計算（グループ化）が変換に無い
status: todo
origin_on: 2026-11-15
origin: 'samples/todos-sysdev のテーブルアクセス設計書を生成したとき（操作の筋）'
memo: |-
  業務モデルの効果（do・Lifecycle・自動の値）を 1 つずつ文にするところまでは計算で作れたが、完了の操作では todo の表への UPDATE が列ごとに 4 文になる。登録では、一覧の行と個票の 2 つの書き込みが同じ todo の表への INSERT 2 文になる（表では 1 行）。
  変換に「並びをキーでまとめる」指示（$groupBy のような）を足すか、データの筋で表の決まりを決めた後に、業務モデルの項の側で表ごとの書き込みを持つかを決める。どちらも「表と列の名前の決まり」（データの筋）が先
features:
  - C-21
