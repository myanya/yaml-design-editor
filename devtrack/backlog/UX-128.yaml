    note: 検査の値の条件に contains・startsWith・endsWith・matches・includes・includesAny・oneOf が入った（schema/QuerySpec.kt）。残りは、consistency
      の assert が equals・lte・gte だけで集合の包含が無いことと、導出値の適用が指摘 1 件ずつであること。生成（generate）と操作が入ったので、一括の伝播が要るかは再判断。manual/checks.md の「判定は現在等値です」の行は古い
