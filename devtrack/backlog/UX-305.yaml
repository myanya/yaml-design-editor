id: UX-305
title: Windows で開くと、ファイルの一覧と本文の読み取りに 0.46〜3.0 秒かかる（YAML 1 件ごとに実パスを 2 回確かめ、1 回ごとにパスの段の数だけ名前を調べる）
status: resolved
kind: usability
origin_on: 2026-11-12
origin: オーナーの Windows の timings.log（labs/adventurers-guild を 3 度開いた記録）
memo: |-
  FileSystemDocumentStore.capture は、一覧（scan）でファイルごとに ReadBoundary.resolve（存在の確認と toRealPath）を行い、本文を読む直前にもう一度 resolve する。JDK の Windows 版の toRealPath はパスの段ごとに名前を調べるので、置き場所が深いほど重い（オーナーの置き場所で文書まで 8〜9 段）。
  2026-11-03 の測定（実パスの解決 0.4〜0.5 ms／件、本文 0.04〜0.05 ms／件）から、キャッシュが暖まった 0.46 秒の 9 割前後が実パスの確認と見られる。1 度目の 3.0 秒は、キャッシュが冷えていたかウイルス対策の走査かを分けられない（段を細かく区切ったので、次の記録で分ける）。
  案 G1: 一覧のときのファイルごとの確認をやめ、読む直前の 1 回にする（決まりは変えない）。案 G2: 確認と読み取りを並列にする。案 G3: フォルダの実パスを全読込の間だけ覚える（「読む直前に確かめる」決まりを変えるのでオーナーの判断）。記録は docs/archive/workspace-open-analysis.md の追記
  2026-11-13 の G1 の後の記録: 暖まったときは 0.46 → 0.30 秒（残りの 7 割は読む直前の実パスの確認）。冷えた 1 度目は 3.36 秒で、うち本文の読み取りが 2.93 秒（1 件 5.0 ms・暖まったときの約 60 倍）。冷えたときに重いのは、名前の解決ではなくファイルを開いて読むこと（ウイルス対策の検査か OS のキャッシュ）。次の当たりは案 G2（読む直前の確認と読み取りを文書ごとに並列にする）
theme: T-04
related:
  - UX-244
  - UX-304
features:
  - C-01
  - W-04
resolutions:
  - date: 2026-11-13
    kind: 一部
    note: 案 G1 を入れた（2026-11-13 オーナーの判断）。全読込で、リンクでない YAML の実パスを一覧では確かめず、読む直前の 1 回だけにした（確認 1,194 回 → 610 回）。G3 は採らない（読込中の親フォルダの差し替えを見逃すため、読む直前に確かめる決まりを守る）。Windows
      での効果はオーナーの次の timings.log で確かめる
    targets: FileSystemDocumentStore.capture・DocumentStoreTest
  - date: 2026-11-14
    kind: 一部
    note: 案 G2 を入れた（2026-11-14 オーナーの判断）。全読込の本文を、文書ごとの「読む直前の実パスの確認 → 読み取り」の組で並列に読む（ParallelReads。既定 8 本・環境変数 YDE_READ_THREADS・32
      件未満は 1 本）。結果は一覧の順、読めない文書は一覧の順で最初の誤り。組込みスキーマを読み取りと重ねるのは見送った。この環境では本文の段が 0.124 → 0.060 秒。Windows での効果はオーナーの次の timings.log
      で確かめる
    targets: ParallelReads・FileSystemDocumentStore.capture・ParallelReadsTest
  - date: 2026-11-21
    kind: 解決
    note: "G2 の効き目をオーナーの Windows の timings.log（2026-11-21。labs/adventurers-guild を 3 度）で確かめた。冷えた 1 度目のファイルの段は 3.36 → 0.53 秒（合計 6.30 → 3.53 秒）、暖まったときは 0.30 → 0.19 秒で、ファイルの段は合計の 6% になった。読む直前の実パスの確認は 8 本で並べると 1 回 1.8 ms（1 本では 0.37 ms）に延びるが、残りは 0.16 秒で、これ以上は追わない。記録は docs/archive/workspace-open-analysis.md「追記: G2 の後のオーナーの端末の記録」。開く速さの残り（セッションの読み込みと画面の段）は T-04 の A・B の案で続ける"
closed_on: 2026-11-21
