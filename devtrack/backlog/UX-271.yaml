id: UX-271
title: ./gradlew devtrackDocs は、原本に検証のエラー（YAML の読み込みの誤りなど）があっても生成物を書く
status: resolved
origin_on: 2026-11-08
origin: 段階 2c-3 の作業
body: '**devtrackDocs が、読めない文書を黙って抜いた生成物を書く**: P52.yaml の値に引用符の無い「: 」を書いたら、その文書が読めず、ROADMAP.md から P52 の行と節が消えたまま書き出された。コミット前のフックと
  CI の DevtrackTest は検証のエラーで止まるが、手元の生成物はその前に壊れている'
memo: devtrackDocs の前に validate devtrack を回し、エラーがあれば書き出さない（cli/build.gradle.kts の devtrackDoc- タスクの dependsOn か、report の --print
  に検証のエラーで止める印を足す）
