id: UX-372
title: 操作を実行した人（利用者区分）を記録・前提にする語彙が無い（利用者ごとに使える業務と見える範囲が違う業務を表せない）
status: discussing
kind: feature
origin_on: 2026-11-20
origin: labs/microchip-registry（環境省「要件定義書」の犬猫マイクロチップ登録業務を YDE で再現する試作）。要件の権限要件（利用者区分ごとの利用可能な業務とデータ閲覧範囲）と、紙の申請を入力する担当者の記録
memo: |-
  要件定義書は、利用者区分（所有者・基礎自治体・都道府県等・警察・指定登録機関・保守者）ごとに、使える業務と見えるデータの範囲（所有者は自分の犬猫だけ、行政は所管の範囲、ワンストップ情報は基礎自治体だけ）を決めている。
  YDE には、操作に「誰が実行できるか」を書く語彙も、実行した人を自動で入れる値（auto: created / updated / revision に当たる「実行者」）も、利用者ごとの行・項目の閲覧範囲も無い。ローカル接続の権限は接続者ごとの操作名と文書の範囲まで。
  試作では、(1) 利用者区分ごとにダッシュボードを分け、(2) 「自分」をダッシュボードの入力（所有者・自治体）で選ぶ絞り込みにし、(3) 担当者は操作の受け取る値（handledBy）で入れて記録している。どれも見せ方と自己申告で、強制ではない。
  向かない用途（複数利用者・ログイン）の境目に当たるので、入れるかどうかから議論する。
  - 入れるとしたら、小さい順に: 実行者を受け取る値の初期値にする（input.initial の context に、接続者か利用者の名前）→ 履歴の行に自動で入れる → 操作に実行できる区分を書く → ダッシュボードの入力を接続者に結び付けて固定する。
features:
