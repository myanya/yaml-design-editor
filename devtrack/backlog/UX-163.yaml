body: '**レンズの段階 2**: 親の箱の中に子の箱を描く（ELK の階層配置）。同じエンティティの出現が文書（側面）ごとに分かれているとき、「一体として見る」（1 つの箱）と「分かれている状態を見る」（側面ごとの区画に子を付ける）の両方に耐える見え方が要る（オーナー:
  議論が必要）。詳細化の出現が別の要素の中に入れ子で書かれる場合の扱いも同じ議論の中で決める'
memo: 'ELK の `hierarchyHandling: INCLUDE_CHILDREN` で親子の箱を配置できる。側面ごとの区画は箱の中の小箱（UML のコンパートメント）として子をその区画に付ける案。線の段階（段階 1）を見てから決める。**解決（2026-10-13）**:
  議論の結果、一体と「側面で分ける」の切替にした（区画は見送り）。配置は段ごとの二段構え（`arrangeNested`）で ELK の階層機能は使わない'
