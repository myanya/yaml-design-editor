id: UX-272
title: 列ごとの行の鍵（cells.series）のクロス集計は、要素の無い期間の行を出さないので、折れ線の横軸が等間隔の時間にならない
status: when-needed
origin_on: 2026-11-08
origin: 発生とクローズの累計（ワニの口）を画面で確かめたとき
body: '**途中の週が抜けると横軸が詰まる**: devtrack のワニの口では 2026-08-17・08-24・09-07 の週に発生もクローズも無く、その週の行が無いので、折れ線の点が等間隔に並び、時間の幅が見た目と合わない（累計なので値は前の週と同じになるはず）'
memo: 'クロス集計に期間を埋める指定（例 `rows.fill: week`＝最初と最後の行の間を週で埋める。累計なら前の行の値、累計でなければ 0）を足す。鍵の値が日付で、刻みが分かるときだけ（weekStart なら 7 日、yearMonth なら 1 か月）'
features:
  - X-17
roadmap:
  - R46-09
