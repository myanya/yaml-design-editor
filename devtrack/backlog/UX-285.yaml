id: UX-285
title: 操作の値の式（$value）で all が使えず、動きから導いた在庫や現金を記録へ写せない
status: todo
origin_on: 2026-11-10
origin: labs/adventurers-guild の「棚卸する」「現金を締める」で、導いた数（買取 − 売却 − 廃棄 …）を棚卸と締めの記録へ書こうとしたとき
memo: $value はグラフの無い合成の環境で計算するので（Transform.valueOf の説明どおり）、all・refCount・occurrenceCount は「無い」になり、first で 0 に落ちて黙って 0 が書かれた。
  いまは導いた値を受け取った値にし、前提（グラフを読める）で「いまの記録から導いた値と同じ」を確かめて逃げている（人が在庫の一覧や支部の現金から写す）。操作の手でも照合の値を読めると、写す手間と写し間違いが無くなる。少なくとも、all が無いことを読み込みのときに知らせたい
features:
