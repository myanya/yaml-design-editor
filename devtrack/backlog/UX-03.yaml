id: UX-03
title: カバレッジ警告も未保存編集で追随してほしい
status: resolved
origin_on: 2026-08-02
origin: 完全性検査UX試験
body: '**カバレッジ警告も未保存編集で追随してほしい**（保存しないと警告が出ない／消えないのが怖い）'
memo: '索引の二層構造（§4.5）に関わる: ローカルID重ねは参照解決のみで、カバレッジ集計はディスク索引基準。編集中文書だけのオーバーレイ判定か、保存前プレビュー検証か、設計議論が必要。**追加の証拠（2026-08-03 R16-03c試験）**:
  「エラーがなくなったのを確認してから保存したい」という希望が再度明確に出た。**実装（2026-08-03）**: `IdIndex.overlay`（走査結果の複製＋dirty分の増分走査）＋`Workspace.overlayIndex`＋`AppState.overlayIndex()`（`(indexVersion,
  editVersion)` キャッシュ）を導入し、UI層の検証・カバレッジ・ビュー行集合・ID横ぐし・参照解決・被参照をすべてオーバーレイ基準（「見たまま判定」）へ切替。旧 L-14（行集合はディスク基準）も改訂。ディスク索引が正・ヘッドレス経路はディスク基準のまま（ARCHITECTURE
  §4.5）'
targets: FEATURES L-14（`OverlayIndexTest`）
closed_on: 2026-08-04
resolutions:
  - date: 2026-08-04
