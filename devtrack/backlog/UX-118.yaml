id: UX-118
title: 変更セットの適用の検証は、台帳の外の文書も、台帳の文書と同じ扱いで検証する
status: todo
origin_on: 2026-09-21
origin: P27 段D の D-b の実装中
body: '**変更セットの適用の検証は、台帳の外の文書も、台帳の文書と同じ扱いで検証する**（1つの文書を検証するとき〔`Workspace.validate`・エディタ〕は、台帳の外の文書では、相手の見つからない参照を情報レベルへ降格し、ワークスペースの他の文書も見る検査を行わない。変更セットの適用〔`Workspace.apply`〕は、この区別をせず、どの文書も索引に載る文書として検証する＝台帳の外の文書の、相手の見つからない参照が、エラーになる）'
memo: '事実: root の `Workspace.apply` は、`Validator.validate` に `indexed` を渡していなかった（既定の true）。カーネルへ移すとき（`ChangeSetApplier`）、挙動を変えないために、そのまま
  `indexedOf = { true }` で引き継いだ。エージェントは台帳の外へ書けないので、影響するのは、CLI の `apply` と skill のインポートで、台帳の外の文書を書くときだけ。揃えるなら `ChangeSetApplier`
  の `indexedOf` を既定（台帳の文書か、予約領域の文書）に戻す1行（既存の挙動が変わるので、先に意図的差分へ登録する）'
features:
  - C-03
  - W-12
