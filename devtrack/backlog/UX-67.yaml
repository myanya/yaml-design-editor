id: UX-67
title: フォームの木構造（ネスト）表示が横に間延びする
status: resolved
origin_on: 2026-08-12
origin: 利用者メモ
body: '**フォームの木構造（ネスト）表示が横に間延びする**。縦に積み重ねる表示形式による**画面圧縮**も検討したい（ヒアリング済み: 対象はフォームのネスト表示）'
memo: '`FormView` のネスト（object・配列・map）はインデントで横方向へ伸びる。インデント幅の圧縮、深い階層のフラット化（セクション見出し＋パンくず方式）、縦積みレイアウトの表示オプション等が候補。既定展開深度（E-11
  の畳み込みサマリ）との組み合わせ方も論点 **実装（2026-10-18）**: 複合値を項目名の下へ全幅で配置し、単一値は利用可能幅で左右／縦を切り替える。型付き・汎用mapと属性付き参照にも適用'
targets: E-18
closed_on: 2026-10-18
resolutions:
  - date: 2026-10-18
    kind: 解決
