id: UX-70
title: スキーマの型を変えると既存文書の残留値を画面から直せない
status: resolved
origin_on: 2026-08-12
origin: 利用者メモ
body: '**スキーマの型を変えると既存文書の残留値を画面から直せない**（string→array で汎用表示に切り替わり、空欄にしても直らない）'
memo: '型不一致の現値の検知＋「値を消す／変換する」の選択を出すマイグレーション支援が本筋。汎用表示のまま値を修正・削除できる最低限の編集手段も要検討。**実装（2026-08-12）**: `ValueEditor` で型と値の構造不一致を検知し、修復UI（「値を消す」＋変換可能な組だけ「配列に変換（現在値を1要素に）／スカラーに変換（先頭値を引き継ぐ）」）＋残留値の汎用エディタ表示へ切替。従来の「汎用表示のみ・修復手段なし」の行き止まりを解消'
targets: R17-03（FEATURES E-01）
