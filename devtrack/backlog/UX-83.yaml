memo: '現状の日付系は DATE のみ（値は素の文字列で往復＝UX-29）。time / datetime の型追加は architecture/ の各主題の「拡張ポイント」 の分岐追加が必要。**解決（2026-10-01）**: P33
  第二弾で `time` / `datetime` を組込みの型の定義体（semantic-core の資源 `builtin-types/`。string ＋ 形式・案内・サンプル値）として YAML で足した。Kotlin の分岐は無い'
