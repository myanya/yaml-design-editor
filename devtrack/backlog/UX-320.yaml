id: UX-320
title: 前提（require）を SQL の条件に写す規則が無く、テーブルアクセス設計書では「手で書く」になる
status: resolved
origin_on: 2026-11-15
origin: 'samples/todos-sysdev のテーブルアクセス設計書を生成したとき（操作の筋）'
memo: |-
  完了の前提「済んでいない作業項目が無い」は、業務モデルでは入れ子の線（contains）と値の条件で書かれ、SQL では「todo_task の done が false の件数が 0」になる。todos の前提の形は、個票があること（今は外した）・状態の条件・入れ子と値の条件の 3 つで、形ごとに写す規則を決めれば計算で作れる見込み。データの筋で表と列の名前を決めてから扱う
features:
  - C-21
closed_on: 2026-11-15
resolutions:
  - date: 2026-11-15
    kind: 解決
    note: '前提の形ごとに写す規則を、生成の定義（YAML）に書いた。受け手の中の要素の条件（入れ子の線と値の条件）は、その要素のテーブルの件数（Mapper の count。完了の前提は TodoTaskMapper.countCompleteTodoNoOpenTask で、0 件なら通す）。受け手の値の条件（状態など）は、Service が読んだ行で確かめる（Java）。ほかの形は処理設計書に「手で書く」と出す。todos の前提は 2 つとも規則で作れた。本体の改修は、変換の条件の includes が配列を受け取るようにしただけ'
