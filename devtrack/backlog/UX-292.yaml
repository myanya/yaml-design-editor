id: UX-292
title: 受け手の無いアクションで、ほかの文書の値（支部の率や会費）を読めない
status: todo
origin_on: 2026-11-11
origin: labs/adventurers-guild の「冒険者を登録する」で、支部の年会費を写そうとしたとき
memo: |-
  受け手のある操作は `each: {from: self, match: …}` で関係を辿って相手の値を `$copy: …, $of: 束縛` で読めるが、受け手の無い操作（登録・新規作成）には起点が無い。
  値の式の読み出し `{in: {schemaId: branch}, path: annualFee}` は `$value` の中では得られず、`input.initial` の `$in` も受け手の出現を選ぶだけだった。
  いまは、冒険者に「登録した支部」を持たせ、年会費は登録の後の操作（受け手は冒険者）で支部から写している。手や初期値で `in: {schemaId}`（文書がちょうど 1 つ）の値を読めると、受け手の無い操作でも一覧の設定を写せる
features:
  - OP-02
  - S-23
