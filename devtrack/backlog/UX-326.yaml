id: UX-326
title: 定義の索引（yde-*）と、検査・ビューのクエリを、スコープで絞れない（設計の側の操作・エンティティ型も業務の定義として検査の対象になる）
status: todo
kind: feature
origin_on: 2026-11-15
origin: 'samples/todos-sysdev のスコープ（ADR-0032）を入れたとき'
memo: |-
  生成はスコープ（業務モデル）のスキーマだけを読むようになったが、定義の索引はワークスペースのすべてのスキーマの操作・エンティティ型を yde-action・yde-entity として載せる。
  設計の側に自分の型を持つ文書（アクター定義書など）を足すと、設計の対応の検査（どのエンティティ型にもテーブル設計書がある など）が、設計の側の型にも設計書を求める。
  クエリの node でスコープを指定する（node: {entity: yde-entity, scope: business} のような）か、定義の索引にスコープを持たせるかを、設計の側に自分の型を持つ文書を足すとき（画面系・アクター定義書）に決める。
  あわせて、使う向き（uses）の点検はスキーマだけで、ビュー・生成の定義が別のスコープのスキーマを読むことは見ていない
features:
