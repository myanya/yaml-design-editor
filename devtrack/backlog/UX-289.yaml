id: UX-289
title: 業務シナリオがケースの間でデータを引き継がず、前段の操作が要る遷移（預かってから掲示・延ばしてから掲示し直す）を、データにその状態が無いと試せない
status: todo
origin_on: 2026-11-11
origin: labs/adventurers-guild の依頼の Lifecycle を behavior-scenarios で試したとき
memo: 受付 → 掲示中 は「報酬を預かる」の後でないと前提で止まり、失敗 → 掲示中 は期限前の失敗が要る。ケースはどれも保存済みの同じ初期データから評価する（S-34 の説明どおり、連続操作は対象外）ので、データにその途中の状態の依頼が無ければ、その遷移は未実行のまま残る。
  ケースに前段の操作を並べられる（同じケースの中で順に当てる）と、データを足さずに辺を通せる。いまは、途中の状態の依頼をデータに置くしかない
features:
  - S-34
