id: UX-51
title: 変更検知契機が人間の保存タイミングの癖に依存
status: discussing
origin_on: 2026-08-09
origin: S2第1回
body: '**変更検知契機が人間の保存タイミングの癖に依存**: 途中保存で起動してしまう。「一通り編集が終わったら起動」にしたい。on-change に「かつ検証エラーなし」等の条件も欲しい。総評「内部状態＋ファイルスタンプの差分管理は契機として弱い」'
memo: '第一歩はトリガ条件の合成（例 `trigger.condition: error-free`＝更新かつ検証OKで発火。on-invalid の対）。抜本は「編集セッション」の区切り（明示マーク・アイドル判定・git差分基準）の設計議論。UX-49・UX-56
  と合同'
theme: T-01
targets: T-01
related:
  - UX-49
  - UX-56
