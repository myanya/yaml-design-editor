id: UX-203
title: 列の軸を値の式で広げたクロス集計は、列の並びが値の文字の順（文字コード順）になり、カテゴリーの定義順や意味のある順に並べられない
status: resolved
origin_on: 2026-10-26
origin: samples/orders の月×商品カテゴリー（列の軸が値の式）
body: '**列の軸を値の式で広げたクロス集計は、列の並びが値の文字の順（文字コード順）になり、カテゴリーの定義順や意味のある順に並べられない**。月別売上の積み上げの系列も同じ順（オフィス家具・オフィス機器・文具・消耗品・飲料・食品）で、色の割り当ても固定できない'
memo: '列の軸に並びの指定を足す（`columns.via` と同じ `order: {schemaId, path}`＝参照先の文書の並び、または値の並びを列挙）。`VirtualViews.resolvePivot` の `axis`（`comparatorFor`）の
  1 か所'
targets: R46-07（`cells.columns.label` で見出しの式・`order` で先に並べる値。サンプルは列の値を商品の `categoryId` にしてカテゴリー番号の順にした）
closed_on: 2026-10-26
resolutions:
  - date: 2026-10-26
    kind: 解決
    section: 注文管理サンプル
