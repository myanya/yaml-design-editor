id: UX-256
title: 外部変更の確認が、ファイルが数百あると画面のスレッドで約 3 秒かかる
status: resolved
origin_on: 2026-11-05
origin: 図の配置の保存の調査
body: '**外部変更の確認が、ファイルが数百あると画面のスレッドで約 3 秒かかる**: labs/aws-webapp（YAML 276 個）で `pollExternalChanges(eventHint = true)` が約 2.9
  秒（更新時刻の収集 1.8 秒・内容の比較 1.3 秒。ファイルを読むだけなら 0.1 秒弱）。文書の変更の知らせのたびに走るので、別のツールでの保存などのたびに画面が止まる（図の配置の保存では走らないように直した＝ADR-0026）'
memo: '`Workspace.walk` と `FileDocumentStore.read` がファイルごとに `WorkspacePaths.resolve` を呼び、そのたびに `ReadBoundary` を作って `toRealPath`
  を 2 回する。1 回の走査・照合で境界を共有する（`ReadBoundary` の説明どおり）。照合を画面のスレッドから外すことも検討'
targets: FEATURES W-04
closed_on: 2026-11-05
resolutions:
  - date: 2026-11-05
    note: 走査と照合を画面のスレッドから IO へ移した（所有スレッドで写しを作り、IO で一覧の走査・本文の照合・再読込の候補の読込、基準の世代が同じときだけ所有スレッドで取り込む）。走査とまとめた読込はルートの実パスを共有。履歴があるときの取り込みは定義が同じなら増分で導出。labs/aws-webapp
      の写し（Linux）で、外部保存・履歴ありの画面のスレッドの時間が中央値 1,607→237ms、変化なしの知らせが 12→0.1ms
    section: 外部変更の確認の重さ
