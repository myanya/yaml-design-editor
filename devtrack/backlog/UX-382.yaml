id: UX-382
title: todos-sysdev で、操作の入力に「行の並び（object の配列）」を持つ形の生成経路が、サンプルから検査されなくなった
status: todo
kind: dev
origin_on: 2026-11-23
origin: UX-381 の 3 段目（コメントの編集・削除を個票への操作に分け、「TODOを編集する」からコメント一覧の入力を外したとき）
memo: |-
  これまで「TODOを編集する」がコメント一覧（日付と本文の行の並び）を入力に持っていたので、入れ子の行の入力（Form・Service の入力の EditTodoCommentsRow、画面の行の表、行ごとの代入）の生成経路が、サンプルの生成物とテスト（TodosWebBindingsTest・TodosWebDesignTest）で確かめられていた。
  コメントを外したので、編集の入力の入れ子は「値を消す」（object）だけになり、行の並びの入力はサンプルに 1 つも無い。生成の定義には経路が残っているが、動くことを確かめる物が無い。
  当たり: 小さな入力（test-fixtures の写しを書き換える・テストの中で業務モデルに行の並びの入力を足す）で、この経路の生成を確かめるテストを足す。使う見込みが無ければ、経路を消すかを決める。
features:
  - C-21
related:
