id: UX-300
title: ダッシュボードの集計を画面の組み立ての中で行う（冷えた JVM で 0.2〜0.3 秒、画面のスレッドを止める）
status: when-needed
kind: usability
origin_on: 2026-11-12
origin: 開く処理の分析（docs/archive/workspace-open-analysis.md）
memo: |-
  ui/view/DashboardPane.kt の remember の中で Dashboards.resolve（表 18 個の行の解決）と dashboardFlow を計算する。開いた直後の最初の描画を遅らせ、編集の版が変わるたびにも画面のスレッドで計算し直す。
  案 B1: 背景で計算し、計算中の表示を出す。画面の購読の規律（版の鍵）を保つ。
  （2026-11-21 追記）背景へ移す前に、画面の段の内訳を測れるようにした。切り替えから最初の描画まで、画面のスレッドに時間の記録を置いたままにし（Timings.attach）、ビュー定義の読み込み・ビューの行の解決・ダッシュボードの集計・業務の流れの集計が、回数つきの合計で timings.log に出る。オーナーの Windows の次の記録で、「画面の状態を戻した後 → 最初の描画」の 1.0 秒のうち集計がどれだけかを確かめてから、案 B1 を入れるかを決める。
  （2026-11-22 オーナーの端末の記録）開いた直後の画面のスレッドで、ダッシュボードの集計が 0.22〜0.26 秒（うちビューの行の解決 18 回で 0.14〜0.17 秒）、業務の流れの集計が 0.05〜0.06 秒。その前に、ビュー定義の読み込み（1 回）が 0.20 秒。合わせて 0.5 秒前後が、初めての組み立てと描画（0.63〜0.67 秒）と同じスレッドで順に走っている。背景で先に計算して組み立てと重ねれば、最初の描画まで 0.3〜0.5 秒早まる見込み（測っていない）。記録は docs/archive/workspace-open-analysis.md の追記。
  （2026-11-22 オーナーの判断）開く速さは十分に改善したので、ここでいったん止める。背景で計算する案（B1・B2）は入れていない。大きなワークスペース（表や行の多いダッシュボード）が出てきたら考える。時間の内訳は timings.log の「ダッシュボードの集計」「ビューの行の解決」「業務の流れの集計」で測れる。
