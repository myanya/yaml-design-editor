id: UX-197
title: 文書が長くなりすぎることへの対処を、字数制限でない別の方法で考える
status: discussing
origin_on: 2026-10-25
origin: P45 の文書更新
body: '**文書が長くなりすぎることへの対処を、字数制限でない別の方法で考える**（オーナー 2026-10-25「字数制限などはあまり良い方法ではない」）。字数の上限は多くの文書が上限の直下（19,99x・29,99x・39,999 字）に張り付き、「主題で分ける」でなく「語を削る」を強いていた。セルの
  2 文禁止も「・」でつなぐ書き方を生んでいた'
memo: '2026-10-25 に docs-lint の SIZE・LINE・CELL を目安（報告だけ・失敗にしない）へ緩め、TICKET・LINK だけを失敗にした。別の方法の候補: 1 ファイル 1 主題の見出し数や節の深さで見る／読み手（人・AI
  エージェント）ごとに必要な範囲を切り出せる構造にする／長い文書は FEATURES のように索引と本文を分ける。方針はオーナーと今後検討'
