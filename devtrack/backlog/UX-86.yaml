id: UX-86
title: 横断Undo（D-07）のフィードバック不足で、保存済みのビュー定義を誤って戻して消す事故が発生
status: resolved
origin_on: 2026-09-02
origin: S1第2回
body: '**横断Undo（D-07）のフィードバック不足で、保存済みのビュー定義を誤って戻して消す事故が発生**。「何が戻ったか」が画面から分からず不安（P1 でも同趣旨）。ワークスペース横断の一長一短が実地で確認された'
memo: '`AppState.undo/redo`（afterHistoryStep）は影響文書を知っている（operationIds）。**実装（2026-09-02）**: ①ステータスバーに「元に戻しました／やり直しました: <変更の意図＋対象>」の常設通知（`historyNotice`。次の編集・保存・✕で消える）②戻った文書へのジャンプ導線（ファイル名リンク）③Undo/Redo
  ボタンのホバーで「次に何が戻るか」の予告（`undoPreview` / `TooltipArea`）。**追記**: 実装後の試用で「ステータスバーでは気づけない」→通知の格上げは UX-95 で保留管理'
targets: S1第2回（FEATURES E-05）・UX-95
closed_on: 2026-09-02
resolutions:
  - date: 2026-09-02
