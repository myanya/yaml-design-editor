id: UX-286
title: 集計（all）の絞り込みで、ほかの束縛の値（締めた日まで など）と比べられず、「ある日までの残高」を検査やビューに書けない
status: todo
origin_on: 2026-11-10
origin: labs/adventurers-guild で、月末の締めや棚卸の「数えた値」を、その日までの動きから導いた値と比べる検査を書こうとしたとき
memo: where の比べる相手は決まった値だけなので、「締めの日以前の入りと出の合計」を all で集められない。いまは締めた時点の導いた値を記録に持たせ、記録の中の 2 つの値を比べている（あとで過去の動きを直しても、締めは古い値のまま）。
  累計のクロス集計（cumulative）で月ごとの残高の形は見られるが、締めとの突き合わせは書けない。where で、ほかの束縛の値（締めの記録の closedOn）と比べられると書ける
