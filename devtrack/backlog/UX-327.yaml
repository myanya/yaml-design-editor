id: UX-327
title: ダッシュボードの定義の自由度を上げ、いろいろな画面の構成に応える（画面はダッシュボードを起点に決めるため）
status: todo
kind: feature
origin_on: 2026-11-15
origin: 'samples/todos-sysdev の画面系の議論（画面はダッシュボードを起点に、業務モデルから計算で決める。ADR-0033）'
memo: |-
  オーナーの方向（2026-11-15）: 業務モデルの操作は基本的にダッシュボードを通じて行うので、ダッシュボードからたどれるビューと操作をアプリの画面の対象にする。
  今後、ダッシュボードの定義の自由度を上げることで、いろいろな画面の構成に応えられるようにしたい。
  候補: 区画ごとの操作のボタン・別のダッシュボードへの道（メニュー）・区画を別の画面に分ける・業務の流れ（flow）の図を画面にするか（いまは外している）。
  ダッシュボードの書き方を足したら、業務モデルの項の reach（BusinessModelViews）と、todos-sysdev の画面系の生成の定義を合わせて直す
features:
  - C-21
related:
  - UX-326
