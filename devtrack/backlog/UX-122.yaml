id: UX-122
title: ビューのグリッドで、セルの場所（相対パス）の表示が無く、確認できなかった
status: todo
origin_on: 2026-09-22
origin: S1 第3回（オーナー。Q5）
body: '**ビューのグリッドで、セルの場所（相対パス）の表示が無く、確認できなかった**——台本の不備: セルの場所を出しているのは、計算列のセルのメニュー（「導出規則へ」「入力値へ」の副題）だけで、普通のセルには場所の表示が無い（セルを押すと原本へ飛ぶ、が唯一の手がかり）。**改善の余地**:
  普通のセルでも、ホバーや右クリックで「原本の場所（相対パス ／ パス）」が分かるとよい（どの文書のどこを編集しているのかが、飛んでみないと分からない）'
memo: '`ViewGridPane` のセル: 編集可能なセルは `Slot` の直接編集（場所の表示は無い）・計算列だけ `DropdownMenu` に場所を出す。足すなら、セルの tooltip（`TooltipArea`）か、行の先頭に「原本を開く
  ↗」を1つ（行の座標は `row.document`・`row.path`）。台本 §3.5 Q5 は「セルを押して原本へ飛ぶ・計算列のメニューで場所を見る」に直した'
targets: V-10
