id: UX-346
title: "スキーマの種類（kind）ごとに書けるトップレベルのキーの決まりが、メタスキーマに無くコードにだけある"
status: resolved
kind: spec
origin_on: 2026-11-16
origin: "仕様（devtrack/spec）を作る前の調査で、パーサ・メタスキーマ・manual を突き合わせたとき"
memo: |-
  builtin-schemas/schema.yaml の kind（document・library・relations・behavior）に cases が無く、どの種類でも全部のキーが候補に出る。
  決まりは workspace-core/workspace/SchemaDocuments.kt と SchemaTreeParser・SchemaDefinitionChecks にある（relations・entities・enforcement は relations だけ、states などは behavior だけ、scaffold と root は document だけ、derive と match は一緒に書けない）。
  メタスキーマに書けるものは書き、書けない決まりは仕様（devtrack/spec）の規則として持つ。
features:
  - S-15
spec:
  - CTX-schema
closed_on: 2026-11-17
resolutions:
  - date: 2026-11-17
    kind: 解決
    note: |-
      オーナーの判断: メタスキーマは変えず、仕様と例で持つ。種類ごとに書けるトップレベルのキーは、仕様の語（位置 CTX-schema の「書ける種類」）に書いてあり、読み取りが明確な誤りを出す。
      決まりは仕様の例で実装と結んだ（relations・entities・enforcement は関係レジストリだけ、states は behavior だけ、root・entity は文書のスキーマだけ、actions は関係レジストリに書けない、derive と match・derive と scaffold は一緒に書けない）。
      メタスキーマの cases で書かなかった理由: cases は値が書かれているときだけ働くので、kind を省いた文書のスキーマ（ほとんどがこれ）で root や match が「使えない項目」と警告される。
      設計画面で種類ごとにキーを絞りたくなったら、cases を既定値でも働かせる変更として別に扱う。
    targets: SpecTest（仕様の例）
