id: UX-100
title: 被参照不足（多重度 inMin）の警告から修正場所へ行けない
status: resolved
origin_on: 2026-09-05
origin: テンプレv3試用
body: '**被参照不足（多重度 inMin）の警告から修正場所へ行けない**（「SI-RESERVE-DETAIL-CONTENT が物理化されていない」警告を押しても、項目を書くべき画面設計書への導線がない。オーナー: 対象設計書に項目を作れるとなお良い・汎用化できなければジャンプでも良い）'
memo: '**実装（同日）**: 指摘メニューに**「参照の追加先を開く: <文書>」**を追加。候補の導出は ①関係の source 型を宣言するスキーマを特定 → ②対象IDのファイルと出現を共有する文書（同一IDの詳細化: 画面定義→同じ画面の設計書）→
  ③台帳型スキーマ（対象と同型を宣言しない）の唯一の文書（業務型→マッピング表）。機械が選べない場合（複数テーブルのどれか等）は黙る。**行の新規作成は見送り**（id 命名・必須項目（物理名・型・origin）が残り結局手入力になるため、開いた先での行追加＋IdSuggest
  に委ねる。作成まで自動化するなら AI アクティビティの領分）'
targets: FEATURES V-08（`SemanticShortage`・`Issue.openFiles`）
closed_on: 2026-09-05
resolutions:
  - date: 2026-09-05
    kind: 解決
