id: UX-139
title: 派生スキーマの型の写像（`derive.fields.type`）に、非修飾の利用者の型の名前を書けない
status: todo
origin_on: 2026-10-01
origin: P33 第一弾の実装中
body: '**派生スキーマの型の写像（`derive.fields.type`）に、非修飾の利用者の型の名前を書けない**（基底の種類・組込みの型・`モジュール#名前` は書ける）。派生の展開は導出元の文書からで、テンプレートのモジュールの定義を引くカタログを持たないため'
memo: '`SchemaDerivation.compile` にテンプレートの `definitionScope`（＝テンプレートの ID）で非修飾名を解決させる（導出スキーマはテンプレートのカタログを引き継ぐので、`typeName`
  を持つ `FieldDef` を作るだけで解決は効くはず）。あわせて写像の先が見つからない名前を、派生の展開の誤りとして報告する'
targets: P33
features:
  - S-17
