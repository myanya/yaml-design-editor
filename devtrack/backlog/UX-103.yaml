id: UX-103
title: 出現先への案内は「定義出現の文書に match する全スキーマ」の規則を見るが、報告先は実際に適用された1スキーマの規則だけを見る
status: resolved
origin_on: 2026-09-19
origin: R29-06 実装中
body: '**出現先への案内は「定義出現の文書に match する全スキーマ」の規則を見るが、報告先は実際に適用された1スキーマの規則だけを見る**（同じファイルに複数スキーマの match が重なる構成では、報告先に存在しない指摘を出現先が案内し得る。現行テンプレ・サンプルでは
  match の重複がなく未発現）'
memo: '出現先の規則列挙を `Workspace.schemaFor` と同じ解決（適用スキーマ1つ）へ揃えるのが筋。ただし Validator は allSchemas しか受け取っておらず適用規則を知らない——P27（スキーマ2層化）で
  Validator の入力を整理するときに合わせて直すのが安い。R29-06 は挙動不変のリファクタリングのため現状維持とした **→ 2026-09-20 R29-13 でパターン制約の分を解消**: 報告先と出現先を、検査を宣言したスキーマの文書の中で（スキーマIDの一致で）決めるようにした（意図的差分
  D-21 ④）。遷移検証は R29-14（第4段）で、網羅マトリクスは R29-16（第5段）で同じ決め方になった＝**解消**'
targets: R28-05a・R29-06・R29-13・R29-14・R29-16
closed_on: 2026-09-20
resolutions:
  - date: 2026-09-20
