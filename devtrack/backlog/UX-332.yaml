id: UX-332
title: ドメイン（集約）の範囲を関係（relation）で制御できない。いまは入れ子（保有）だけで集約を決める
status: todo
origin_on: 2026-11-15
origin: 'samples/todos-sysdev のドメイン定義書の議論。オーナー: 現時点は案 A（集約ごと）でよいが、いずれ relation で集約の範囲をコントロールできるようにしたい'
memo: |-
  いまのドメインは集約（入れ子の持ち主がいないエンティティ型と、その中の入れ子の型）で、業務モデルの項の entities の aggregate から機械的に決まる（todos では TODO・カテゴリ・タグ）。
  将来の構想（オーナー）:
  - 関係（relation）の宣言で集約の範囲を広げる・狭める（例: 参照の関係でも、同じ集約に入れる印）
  - 関係から推論して、境界づけられたコンテキスト（案 B: 業務モデルにドメインを宣言して型を束ねる）に近いまとまりを作る
  - 必要なら、案 B のドメインを業務モデルに明示的に宣言できるようにする
  直すときは、業務モデルの項（BusinessModel の aggregate）と、todos-sysdev の生成の定義（domains・domain-relations）を合わせて直す
features:
  - C-21
