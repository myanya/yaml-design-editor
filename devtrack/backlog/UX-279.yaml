id: UX-279
title: 操作で、受け取った値の ID の要素を束縛できず、前提で受け手と比べることも、手の in で文書を選ぶこともできない
status: todo
origin_on: 2026-11-08
origin: labs/adventurers-guild で、受注する操作（受け手のランクと依頼の下限を比べる）と精算する操作（支払日の月の文書へ足す）を書いたとき
memo: 前提の match の先頭は受け手に固定され、受け取った受け手（taker）とは線でつながらないので、ランクの比較を前提に書けない（適用前の検証に任せた）。手の in は固定の schemaId と fileGlob で、受け取った値から作った名前の文書を選べないので、月の文書が精算を保有する形にできなかった（精算を
  1 件 1 ファイルにし、月を参照する形にした）。受け取った値の ID で node を始められる形か、in の fileGlob に受け取った値を差し込める形
features:
  - OP-02
  - OP-03
