id: UX-99
title: 指摘メニューのIDジャンプ（「定義へ」）が定義出現固定で、修正対象の出現に飛べない
status: todo
origin_on: 2026-09-04
origin: R28-05a試用
body: '**指摘メニューのIDジャンプ（「定義へ」）が定義出現固定で、修正対象の出現に飛べない**（auth を直すのは外部API定義書だが、エラーから API を選ぶと一覧側に着地して戸惑う）'
memo: 'エラー級の出現側報告（UX-98 追補）で実用上は緩和済み（修正対象の文書自体にERRORが出る）。本修正の案: ①メニューに「エンティティページで全出現を見る」（openCrossView）を追加 ②束縛座標つきメニュー（UX-98
  残）と統合して「この出現の該当欄へ」を出す'
targets: P28 候補
