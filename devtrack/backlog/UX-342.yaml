id: UX-342
title: エンティティ定義書の項目と論理型のビューでは、配列の参照先・重複禁止・入れ子・制約を十分に確認できない
status: discussing
kind: usability
origin_on: 2026-11-16
origin: オーナーによるエンティティ定義書の再レビュー。必要な項目から整理する
memo: |-
  保存済みワークスペースの CLI view では title の最大文字数 100、status の 5 選択肢、category の参照先 ENT-category は正しく出る。単独の項目一覧とダッシュボードのスカラー値も一致し、論理型への参照が全面的に切れている状態は再現しなかった。
  オーナーの補足: TODO の項目一覧では基底が array のときだけ表示され、ダッシュボードではほかの YDE の型も表示される。
  原本の entities.yaml を直接見せる表は項目自身の base を読む。TODO の base は tags・tasks・comments・history の 4 項目だけに array があり、ほかの 12 項目は論理型側に保存される。一方 entity-definition-items は type 参照先の base を優先し、無ければ項目自身の base を読むため string・date・ref なども表示する。症状と一致する読み方の差を確認した。
  前回の比較は同じビューの単独表示とダッシュボードで、原本を直接表示する表との比較が不足していた。型を別の記録に分けた後も、利用者が同じ意味の欄で実効値を確認できるよう、表示と原本の役割を整理する。
  tags は itemType がタグ参照を指すが、参照先列は type だけをたどるため空欄。unique: true も原本にあるが列が無い。
  tasks は「要素の論理型」列に ENT-todo-task が入り、論理型とエンティティを同じ見出しで扱っている。comments と history は型への参照までで、行の項目やその制約はエンティティ定義書の中に出ない。
  論理型一覧にも minLength・min・max・multiline・要素の型を見せる列が無い。entity-definition-items には format・unique・単一の入れ子 entity・itemBase・fields の列が無い。
  required を省いた任意項目、初期値の無い項目、型に対象外の制約、導出に失敗した値が同じ空欄に見える。値は YDE の書き方を保ち、表示で無い理由を区別する必要がある。
  「完了時は完了日と結果が必要」などの条件付きの規則は業務モデルにあるが、この定義書では一覧できない。オーナーの指定でデータの規則は後回しにし、型・項目の保持と読み方、補正、既存表示の一致を先に固める。
  GUI の表示そのものは未確認。今回確かめたのは原本・スキーマ・ビュー定義と保存済みの CLI 出力の対応。
  足場固めの指示を受けて実装。全項目のbaseを生成し、要素の論理型とエンティティを別の列にする。要素の基底・参照先、重複禁止、文字数・数値範囲・複数行・表示形式・内部項目の列を追加。CLIの4ダッシュボードを出力し、TODOの項目一覧とCRUDがともに16行になることを確認。GUIでの見やすさ、空欄の理由の見せ方、内部項目の見せ方のレビューは継続。データの規則は後回し。
  （2026-11-23 オーナーのレビュー）一緒くたの表にされてしまったので、どれがどれに対応するのかが分かりづらい（個票の「入れ子の項目」が、子要素の項目を 1 つの表に並べている）。子要素ごとの表にする件は UX-380 で進める。この項目は、空欄の理由の見せ方と条件付きの規則が残り。
features: [C-21, X-05, X-06]
roadmap: [R53-05]
related: [UX-339, UX-340, UX-341, UX-380]
resolutions:
  - date: 2026-11-21
    kind: 一部
    note: "列は足されている。entity-definition-items に、基底の種類・要素の論理型・要素のエンティティ（別の列）・要素の基底の種類・要素の参照先・重ならない・最小と最大の文字数・最小値と最大値・複数行・表示形式・入れ子の項目・属性の状態・根拠の列がある。残りは、画面での見やすさ（空欄の理由・入れ子の項目の見せ方）のレビューと、後回しにした条件付きの規則"
