id: UX-330
title: 完了の知らせの文を、操作の名前の末尾の「する」を「しました」にする決まりで作っている（名前の付け方に頼っていて、汎用ではない）
status: todo
kind: feature
origin_on: 2026-11-15
origin: 'samples/todos-sysdev のエラーとメッセージ系の議論。オーナー: 現時点ではそれで良いが、今後の検討対象に入れておきたい'
memo: |-
  メッセージ定義書の完了の知らせ（キー 操作ID.done）は、操作の label の末尾の「する」を「しました」にし、ID を添える（「TODOを完了しました（{id}）」）。
  「する」で終わらない名前は「「名前」が済みました（{id}）」に落とすが、文として不自然になりうる。
  候補: 業務モデルの操作に完了の文（例 done: ...）を書けるようにする・活用の辞書を持つ・知らせの文は名前に頼らない定型にする
features:
  - C-21
