id: UX-53
title: 自動実行の可観測性が弱い
status: discussing
origin_on: 2026-08-09
origin: S2第1回
body: '**自動実行の可観測性が弱い**: 履歴とログが紐付かず（履歴クリックで該当ログを見たい）、どのノードを読んだかも追えない。連鎖の因果（どのルールに一致して起動したか）が履歴からは分からず、ログを細かく追う必要がある'
memo: 履歴エントリ→該当実行のログ範囲・実行記録へのリンク、ログの階層化（ターン→ツール）、read 系ツールの対象パス表示、連鎖起動の理由（一致ルール・親実行）表示。UX-39（ログ可読性）と合同で設計
related:
  - UX-39
