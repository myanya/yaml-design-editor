id: UX-161
title: 'ID も名前も持たない要素の配列を畳むと、要約が「n 件: （3項目）, （3項目）, …」になり中身が分からない'
status: todo
origin_on: 2026-10-12
origin: テーブルの参照セル
body: '**ID も名前も持たない要素の配列を畳むと、要約が「n 件: （3項目）, （3項目）, …」になり中身が分からない**（例 sysdev-template の画面遷移の遷移一覧＝遷移元・遷移先・契機だけの行）'
memo: '`DisplayCore.inline` の object の要約は id ＞ title ＞ subtitle ＞ キー数で、それ以外の項目は見ない。候補: ①要素の最初のセル型の項目（参照なら名前つき）を並べる ②参照の項目にも
  `role: title` を許す。要約の規則そのものの変更なので、どの場面で困るかを集めてから決める'
