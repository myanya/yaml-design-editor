id: UX-362
title: アクティビティを新しく作るとき、よくある形（推奨の値）を初期値として選べない
status: when-needed
kind: feature
origin_on: 2026-11-18
origin: UX-38・UX-90 の残り（項目の説明とラベルの見直しを入れたあと、テンプレートと初期値の部分を分けた）
memo: |-
  UX-38（サンプルに無い項目が分かりづらい）と UX-90（書込許可の 2 項目を混同する）は、項目の説明とラベルで直した。どちらにも付いていた提案「よくある形を最初から入れておく」は機能の追加なので、ここに分けて残す。
  - 作るときに「点検して指摘を書く」「下書きを作る」「不足を埋める」のような形を選ぶと、target・instruction・allowedFiles・allowedPaths・limits・gates の典型の値が入る。
  - 当たり: メタスキーマの default に書くと、選ばなくても全部のアクティビティに効く。作成の入口で選ばせる形（UX-33 の初期化ウィザードと同じ型。テンプレートは Kotlin に埋め込まず templates/ のファイル）が合う。
  - 何を推奨とするかは、エージェントフローの見直し（T-01）で変わりうる。
  （2026-11-23 オーナーの判断）AI によるサポート機能は、いまほとんど使っていないので、優先度を下げる（必要になったら）。
related:
