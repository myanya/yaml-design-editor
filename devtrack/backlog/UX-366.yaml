id: UX-366
title: 決まった時刻に、AI を使わずにレポート・書き出し・操作を動かす自動実行が無い（日次バッチを定義で書けない）
status: todo
kind: feature
origin_on: 2026-11-20
origin: labs/microchip-registry（環境省「要件定義書」の犬猫マイクロチップ登録業務を YDE で再現する試作）。要件の「ワンストップ通知」「飼養管理通知」（前日の分を日次で集計して通知する）
memo: |-
  やりたいこと: 毎日 1 回、前日の分のレポート（通知の件数と文面）を作る。AI は要らない。
  いまのトリガの schedule は「有効にしてから N 分ごと」で時刻を指定できず、動かせるのはアクティビティ（エージェントの実行）だけ。レポート・書き出し・操作を時刻で動かす入口が無い。「前日」を受け取る値に入れる書き方も無い（ダッシュボードの既定値は $today・$monthStart・$monthEnd だけ）。
  試作では、OS のスケジューラから外のスクリプト（labs/microchip-registry/scripts/daily-batch.py）を動かし、CLI の report --print で前日の分を作っている（デスクトップが開いていても読むだけなので動く）。メールの送信は YDE の外。
  - 当たり: ROADMAP R41-08（決定的な自動実行。トリガからアクションを LLM なしで実行）にレポートと書き出しも含め、時刻の指定（毎日 hh:mm）と、基準日からの日付（$yesterday のような値）を足す。プラン／ワークフロー層（T-02）と合流して設計する。
  - 外への通知（メール）は、設計原則（外界への作用は skill 経由の明示許可制）に沿って、書き出した文面を送る skill として別に考える。
features:
