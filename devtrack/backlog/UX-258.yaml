id: UX-258
title: 未保存の判定（`WorkspaceSession.dirtyDocuments`）が全文書を毎回書き出して比べ、外部変更の取り込みのたびに 2〜3 回走る
status: resolved
origin_on: 2026-11-05
origin: UX-256 の計測
body: '**未保存の判定（`WorkspaceSession.dirtyDocuments`）が全文書を毎回書き出して比べ、外部変更の取り込みのたびに 2〜3 回走る**: labs/aws-webapp の写し（276 件・Linux）で
  1 回約 70〜100ms。履歴が無いときは `hasRetainedEdits` から 2 回、履歴があるときは `reload` と `refreshFrom`（現在と候補）で 3 回。外部保存の取り込みで画面のスレッドに残る時間（約
  0.2 秒）の大半'
memo: '`isDirty` は `persistedText` と `DefaultYamlCodec.dump(document)` を比べる。文書の版ごとに書き出しを覚えるか、編集で触れた文書だけを候補にする。`refreshFrom`
  の `disk.dirtyDocuments()`（読んだばかりの候補）と、`reload` が渡す保護対象との重複も見直す'
related:
  - UX-256
features:
  - C-09
closed_on: 2026-11-12
resolutions:
  - date: 2026-11-12
    kind: 解決
    note: 103d877 で解決。isDirty の書き出しを、文書ごとに木の同一性で覚える（WorkspaceSession.dumpOf）。読み込みの保存基準の書き出しで覚えを埋め、fork などの写しにも渡すので、木が差し替わった文書だけを書き出す。全件の確認の呼び出し（開いてから最初の描画までに
      9 回）と refreshFrom の重複は減らしていないが、1 件ごとは同一性の比較だけで、書き出しは起きない（2026-11-12 の開く処理の分析で確かめた）
    targets: WorkspaceSession.isDirty・dumpOf
targets: WorkspaceSession.isDirty・dumpOf
