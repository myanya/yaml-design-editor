id: UX-189
title: 共通フォームのmapキー削除にも確認なしの経路がある
status: resolved
kind: usability
origin_on: 2026-10-25
origin: 配列削除の調査
memo: |-
  `MapTable`・mapのリスト／汎用表示の確認方針を検討する；配列の共通化には含めず、実装は別途承認を得る
  （2026-11-23 オーナーの判断）確認を入れる。配列の行の削除と同じ方針にそろえ、共通フォームの map のキーの削除（MapTable・map のリスト／汎用表示）にも確認を出す。実装はこれから。
features:
  - E-25
closed_on: 2026-11-23
resolutions:
  - date: 2026-11-23
    kind: 解決
    note: "確認を入れた。共通フォームの map のキーの削除（map のリスト・表 MapTable・スキーマの無い汎用表示）は、配列の行と同じ形の確認（項目名・キー・値の要約・原本の場所）を出してから消す。確認中に値が置き換わった・キー名が変わった・版が進んだ・閲覧専用になった・ソースが解析待ちのときは消さない（MapKeyDeleteButton・MapKeyDeletion。確認の見た目は配列と同じ部品）。MapKeyDeletionTest・FormViewUiTest「キーの削除は確認を出し…」。実画面での見え方は未確認"
