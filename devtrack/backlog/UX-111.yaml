id: UX-111
title: 遷移検証（スキーマの `flow`）を、専用チェッカーを使わない YAML だけの定義にしたい
status: when-needed
origin_on: 2026-09-20
origin: R29-15 の報告
body: '**遷移検証（スキーマの `flow`）を、専用チェッカーを使わない YAML だけの定義にしたい**（R29-15 で非循環は YAML だけの定義に書き直せたが、遷移検証の3種類——到達できない・行き止まり・宣言にない遷移——は、書き直すと今の挙動を保てないため、専用チェッカー
  `checker: flow` に残した。コードに残る専用チェッカーはこの1つだけ）'
memo: '足りない部品は3つ: ①**検査の前提条件**（「開始画面が1つも宣言されていなければ判定しない」を書けるようにする。検査に `enabledWhen: {match: …}` のような前提のクエリを持たせ、解が1つも無ければその検査を黙らせる。検査ごとに1回だけ評価してキャッシュする）②**別のクエリの結果を文面へ出す**（到達できない指摘の文面に「開始:
  画面A・画面B」を出す。①の前提のクエリで束縛した要素の一覧を、文面の `{束縛名の一覧}` として出せるようにするのが素直）③**成り立たない分岐だけを残す**（宣言にない遷移＝「利用側の線 a→b について、宣言側に a→b が無い」。`also`
  に「この分岐が成り立たない解だけを残す」指定を足す）。あわせて決めること: 判定の保留の範囲（今は「遷移のどこかに相手の見つからない参照が1つでもあれば、その種類の指摘をすべて黙らせる」。クエリの規則は「辿った範囲で出会ったものだけ」＝狭くなるが判定としては正確）。書き直した後は
  `CheckerKind.FLOW`・`SemanticFlow`・`FlowArgs` を削除でき、専用チェッカーの仕組み（`schema/Checker.kt`）は UX-110 のような本当に複雑な検査のために残る。利用者が自分で到達性の検査を書く目的は
  R29-15（`repeat`・`row`）で満たせているため、急がない'
targets: R29-14・R29-15（architecture/checks.md「定義層の 3 段」）
related:
  - UX-110
features:
