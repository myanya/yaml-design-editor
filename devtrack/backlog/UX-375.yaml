    kind: 見送り
    note: "オーナーの判断（2026-11-23）: 段（stage）の仕組みは、今後も必要になる可能性があるので残す。実装・メタスキーマ・仕様・manual・ADR-0034 はそのままにし、何も外さない。samples/todos-sysdev がいま段の規則と補正を使っていないことは変わらない"
