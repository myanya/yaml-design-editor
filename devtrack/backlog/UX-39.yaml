id: UX-39
title: 実行ログが読みづらい
status: discussing
kind: usability
origin_on: 2026-08-08
origin: S1第1回
body: '**実行ログが読みづらい**。plan（作業計画）が実行にどう影響しているかもログから見えない'
memo: '`RunsSpace` のログ表示の構造化（ターン区切り・ツール種別の見た目分け・plan の現在状態の常設表示）。plan はツール呼び出しの時系列に埋もれている'
features:
  - AG-09
resolutions:
  - date: 2026-11-18
    kind: 一部
    note: 手動実行の画面は計画を上に常に出し、ターンの区切りの行を出す（ui/run/RunsSpace.kt・RunController.kt）。残りはログの構造化（ツールの種類ごとの見分け）と、計画のどの手順が進行中かの表示。自動実行のログはツール名だけ（UX-53）
