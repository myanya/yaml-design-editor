id: UX-257
title: 配置の保存中（0.1〜0.5 秒）は、同じ図で次の箱をつかめない
status: todo
origin_on: 2026-11-05
origin: 図の配置の保存の調査
body: '**配置の保存中（0.1〜0.5 秒）は、同じ図で次の箱をつかめない**: 置いてすぐ次の箱をつかむと、移動もパンもしない。続けて何個も動かすと引っかかる'
memo: '`FlowCanvas`・`GraphLensView` の startDrag が `!memory.saving` で無効にしている。保存中もつかめるようにし、続けて置いたときは最後の位置だけを保存する（保存をまとめる）。外部変更の照合（`expected`）の扱いに注意'
