id: UX-110
title: 「どの流れを通っても、最後は必ずその画面（状態）に着く」ことを検査したい
status: when-needed
origin_on: 2026-09-20
origin: オーナー要望（R29-14 の報告への質問から）
body: '**「どの流れを通っても、最後は必ずその画面（状態）に着く」ことを検査したい**（例: どの画面からどう遷移しても、必ずメイン画面へ戻ってくる。途中でぐるぐる回り続けて着かない道が無い）。「辿り着ける流れが1つでもある」ことは、クエリの「何段でも辿る線」（R29-15）で
  YAML だけで書けるが、こちらは**すべての道**についての性質で、辿り着ける要素の集まりを求めるだけでは判定できない'
memo: '状態遷移への時相論理の適用にあたる（オーナーが DL-04 で例に挙げた「複雑な処理は個別実装でよい」の領分）。専用チェッカー（`schema/Checker.kt` の `CheckerKind` に種類を足し、`semantic/`
  に実装を足す。文面・重大度・語彙への結び付けは YAML）として実装するのが筋。判定の考え方: 目的の要素を取り除いたグラフに、循環か行き止まりが残っていれば「着かない道がある」。指摘には、着かない道の例（循環の経路・行き止まりの要素）を添える。いずれ必要になる（オーナー）——着手時期はオーナー判断'
