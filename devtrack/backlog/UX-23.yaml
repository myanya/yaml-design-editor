id: UX-23
title: ソースタブの同期モデルへの違和感
status: resolved
origin_on: 2026-08-08
origin: S1第1回
body: '**ソースタブの同期モデルへの違和感**: ①ソース直接編集で保存ボタンが有効にならない ②フォーム⇔ソースを行き来しても相互反映されない ③「変更を反映」ステップ自体が不要では'
memo: '`SourcePane` はローカルtextバッファ＋明示apply方式（パース不能テキストをツリーへ反映できない制約が背景）。パース成功時だけ自動applyする「ライブ同期」化が対応の当たり。パース不能状態の表示・保存の扱いが設計論点。**実装（2026-08-13）**:
  「変更を反映」を廃止しライブ同期化——入力のたびにパースし、成功時だけツリーへ自動反映（markEdited 経路＝①保存ボタンが即有効 ②フォーム⇔ソースが相互反映 ③反映ステップ消滅）。パース不能の間はツリー＝最後に解析できた状態が正で保存もそれを書く（エラーバナー・ソースタブの
  Ctrl+S 拒否・「編集を破棄／整形」で復帰）。設計は ARCHITECTURE §4.34'
targets: R17-03（FEATURES E-03）
