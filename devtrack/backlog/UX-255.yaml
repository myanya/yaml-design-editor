id: UX-255
title: 起点なしのグラフレンズが、箱が数百あると最初の配置に 1 分以上かかる
status: todo
origin_on: 2026-11-05
origin: 図の配置の保存の調査
body: '**起点なしのグラフレンズが、箱が数百あると最初の配置に 1 分以上かかる**: labs/aws-webapp の全体（箱 351 個。応力配置は 150 個までなので階層配置に代替）で `arrangeNested` が約 74
  秒。その間は「配置を計算中…」のまま'
memo: 階層配置（ELK layered・入れ子）のどの段が重いかを測る。数百の箱では軽い配置へ代替するか、計算の途中を見せる・止められるようにする
