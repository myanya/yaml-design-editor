body: '**文書だけを変えたコミットでは、コミット前のフックの `DocReferencesTest`・`SourceRulesTest` が実行されない**（root の test タスクが docs/ とソースを入力に宣言していないので
  UP-TO-DATE になる。わざと見出しを壊しても通った。CI は毎回まっさらなので落ちる）'
