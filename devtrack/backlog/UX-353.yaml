    note: |-
      UX-275 と同じ原因（子の JVM が出す「Picked up JAVA_TOOL_OPTIONS」の行を、合図の行として読んでいた）だった。UX-275 に統合し、そちらで直した。
    targets: WorkspaceOwnershipTest
