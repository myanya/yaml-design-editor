origin: ポートのUI検証
memo: ERサンプルの幅300の箱が約180間隔で並ぶ。GraphLayouts.stressの箱寸法と間隔を再検討する。階層配置と手動移動で回避でき、ポートは重なった箱を貫通する線へ代替しない
targets: FEATURES X-03
closed_on: 2026-11-05
resolutions:
  - date: 2026-11-05
    note: 原因は重なり除去が走っていなかったこと（同じ ELK のグラフで 2 回配置すると 1 回目の配置の種類が残る）。重なり除去の下の配置に応力を指定して 1 回で走らせ、配置の調整（間隔・線の長さ）を足した
    section: 図の配置の調整
