    kind: 重複
    note: UX-369と同じ指摘（操作の前提で、受け手に書いたwhereの意味がmanualに無い）。こちらにだけあった点（条件つきの前提の書き方・止まったときの文面が誤解を招くこと）はUX-369の技術メモへ移した
