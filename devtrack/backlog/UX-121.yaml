id: UX-121
title: 関係パネル（被参照）などに出る項目名が物理名（`based_on` のようなキー名）だけで、スキーマのラベルが出ないので、画面（フォームはラベル表示）との対応が取りづらい
status: todo
origin_on: 2026-09-22
origin: S1 第3回（オーナー。Q2）
body: '**関係パネル（被参照）などに出る項目名が物理名（`based_on` のようなキー名）だけで、スキーマのラベルが出ないので、画面（フォームはラベル表示）との対応が取りづらい**。関係パネルに限らず、場所を示す所（相対パス ／ キー
  ／ パス）は物理名だけ。**ただし、ラベルだけにするとそれはそれで問題**（同じラベルの項目・ラベルの無い項目・検索やコピーには物理名が要る）。**併記するだけのスペースがあるかが気になる**（オーナー）'
memo: '場所の文面は、`viaKey`（参照を書いたキー名）と `path.pretty()` をそのまま出している（SidePanel・IdCrossView・ViewGridPane の副題）。ラベルは、参照元の文書のスキーマの `FieldDef.hints.label`
  から引ける（`schema.resolve` を通す。パスの各段のラベルは `Display` の系統）。見せ方の案: ①主表示はラベル・副題（小さい字）に物理名とパス ②ラベルだけ出して、物理名はホバーの説明（tooltip）とコピーへ
  ③ラベル（物理名）の併記＝スペースを食う。列挙の場面（被参照の一覧・検証の場所）ごとに幅が違うので、まずどの場面で困ったかを聞いてから決める'
targets: I-09・architecture/index-references.md「表示解決」
