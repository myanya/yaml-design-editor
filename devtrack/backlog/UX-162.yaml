id: UX-162
title: スクロール位置と拡縮は画面を離れると戻る
status: todo
origin_on: 2026-10-12
origin: P39 段階 1
body: '**スクロール位置と拡縮は画面を離れると戻る**（フォーム・エンティティページ・一覧の表のスクロール、フロー・レンズ・画像の拡縮と位置）。ノードの固定位置はワークスペース保存で対応済み。残りはスクロールとパン・ズーム'
memo: '`ScrollState` / `LazyListState` のオブジェクトを `ScreenMemory` に文書・ビューごとに置き、`rememberScrollState` の代わりに渡す。ハイライト付きのジャンプから戻るときはハイライトのスクロールが優先。レンズの型・関係のチェックのような「好み」は
  `Preferences` へ移して起動を跨いでもよい（オーナー判断）'
targets: P39
