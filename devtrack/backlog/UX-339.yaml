id: UX-339
title: 論理型を導入した後の補正先と値の読み方がそろわず、最大文字数の補正例と参照先を読むビューに補正が反映されない
status: discussing
origin_on: 2026-11-16
origin: samples/todos-sysdev の引継ぎ調査。テーブル設計書のレビュー中に補正の範囲を確認
memo: |-
  README の例は FLD-todo.title に maxLength: 200 を置くが、項目一覧の最大文字数は type 参照先の論理型から読む値の式になっている。
  補正機構は行の path 列だけを差し替えるため、この例は表示へ反映されない。論理型一覧は補正を宣言しているが、basic-corrections の target.idPatterns に TYP-* が無い。
  基本の補正は詳細設計の生成へ届かない。詳細の補正も path 列の表示だけなので、型対応表の補正や、物理名を参照先から読むカラム・索引・外部キー・DDL の間の一貫性を確かめる必要がある。
  「タイトルだけ200文字」と「共通の論理型を200文字」を区別し、置き換えた値をどの読み手まで届けるかをエンティティ定義書から議論する。今回の初期値の出力方法の変更では補正機構は改修しない。
  足場固めの指示を受けて実装。補正を TermChanges で読み取り用の木に重ね、path・式・照合・参照で共有する。TYP-* と FLD-* を区別して補正でき、テーブルの生成は補正後の基本設計のビューを input として読む。dependsOn で基本の新しい生成物を同じ計画に載せる。共通200・項目60、参照先の変更、一意索引の削除、空文字の初期値の DDL 反映を TodosEntityFoundationTest で確認。ほかの設計書への移行とオーナーレビューは継続。
features: [C-21, X-05, X-06]
roadmap: [R53-05, R53-01, R53-03]
related: [UX-324, UX-333, UX-334, UX-335]
