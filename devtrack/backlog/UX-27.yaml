memo: '実測で裏取り済み: `SchemaInference` の enum 候補条件が最低4サンプル（`ENUM_MIN_SAMPLES = 4`）で、S1データは3出現のため未達。異なり数が小さい場合の閾値緩和か、推測ダイアログでの条件の説明が当たり。**実装（2026-08-12）**:
  `ENUM_MIN_SAMPLES` 4→3（反復条件＝異なり数＜サンプル数は維持）＋推測ダイアログ2箇所へ条件の説明を追記。**追補（同日・試用フィードバック）**: 既存IDが enum 化される問題を修正——全値がサンプル中の論理ID（id
  キーの値）と一致するフィールドは **ref として推測**し、IDらしい値（既存ID一致・ID形式 `SCR-001` 等）は enum 候補から除外（開いた値集合を閉じない）'
