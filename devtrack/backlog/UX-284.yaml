origin: labs/adventurers-guild の「求める職能は、受け手の職能か資格で満たす（パーティなら構成員の誰か）」の検査（required-job-met）を書いたとき
memo: where と check の「または」は同じ束縛の条件どうしだけで、道（edge と node の並び）の選び分けは書けない。冒険者の職能・冒険者の資格・構成員の職能・構成員の資格の 4 本を、
  それぞれ all（also と same）で数えて add で足し、1 以上かを check で見た（同じ道の照合を 4 回書く）。指摘の文面にも、どの道が足りないかを出せない。also に道の並び（どれか）を書けると短くなる
