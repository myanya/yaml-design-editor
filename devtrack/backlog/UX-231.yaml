id: UX-231
title: MCP の上限拒否試験が、UX-229 の修正（R49-70）の後も全テストの中で 1 度 404 になった
status: resolved
origin_on: 2026-11-01
origin: scratchpad の決まりのコミット前の全テスト
body: '**MCP の上限拒否試験が、UX-229 の修正（R49-70）の後も全テストの中で 1 度 404 になった**（`McpHttpTest`「初期化の上限拒否を繰り返してもセッションと同時要求の枠が漏れない」。`McpHttpFixture.initialize`
  が initialized の通知に 202 を期待し、404「MCP セッションを再初期化してください」が返った。全テストを並列に回した負荷の下でだけ出て、このクラスだけを回すと 3 回とも成功した。2026-11-02 には別の試験「確定中の取消とMCP停止は開始した保存と記録を待ち再接続後に同じ結果を返す」が、全テストの中で同じ「再初期化してください」で
  1 度落ち、このクラスだけでは成功した）'
memo: '**原因（2026-11-07 調査）**: 初期化の応答でセッション ID を返した後、SDK が `/mcp` に入れる `HttpRequestLifecycle`（cancelCallOnClose）がその呼び出しを取り消すことがある。クライアントは
  ID を受け取って次へ進むが、`LocalAuthentication` の後始末は `isSent` がまだ false なので未送信とみなし、`McpSessionHooks.finish(false)` で `server.close()`
  する。次の要求は自前の 404「再初期化してください」か SDK の「Session not found」になる（UX-229 は `isSent=true` の時機だけを直していた）。**再現**: CPU を埋めて（4 CPU に busy
  loop 8 本）`McpHttpTest` を流すと 11 回中 10 回失敗し、失敗の数と `isSent=false status=200` の取消の数が一致した。負荷なしでは 5 回とも成功。CI でも 11/01 以降 14 回中
  11 回が失敗し、失敗は全部この試験（desktop・repo-tests の試験は CI で流れていない）。**直し方の当たり**: 未送信の判定に `isCommitted`（ヘッダの確定）も含めると、負荷下で 6 回とも成功し local-server
  87 件も成功。副作用は、ヘッダ確定後に本文が届かなかったセッションが無操作の期限（15 分）まで残り、接続者あたり 8 の枠を使うこと。製品でも負荷の高いときに外部 AI の初期化直後のセッションが閉じうる。「無操作の…」試験の期限 400ms
  も負荷に弱い（今回の再現の失敗はほぼ上の原因）'
targets: FEATURES LC-26
closed_on: 2026-11-07
resolutions:
  - date: 2026-11-07
    note: 初期化の応答が届いたかの判定にヘッダの確定（isCommitted）を含め、成功の応答を確定した後の取消ではセッションを閉じないようにした。クライアントの実際の切断で再現する試験を足した（直す前は毎回 404、直した後は通る）。CPU
      を埋めた状態で McpHttpTest は直す前 11 回中 10 回失敗、直した後 10 回とも成功。GitHub Actions は修正後の実行で McpHttpTest の失敗 0（同じ実行の再実行を含め 3 回連続で全モジュール成功）
    section: MCP の初期化セッションの取消
