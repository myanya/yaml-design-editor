id: UX-120
title: 戻る（Alt+←）が、ジャンプの直後は効かず、他の操作（編集モードの切替など）を挟むと効くようになる
status: resolved
origin_on: 2026-09-22
origin: S1 第3回（オーナー。UX-SCENARIOS §3.5 Q1）
body: '**戻る（Alt+←）が、ジャンプの直後は効かず、他の操作（編集モードの切替など）を挟むと効くようになる**（バグ）'
memo: 履歴そのもの（`AppState.backStack`・`goBack`）は積まれているはず（切替の後は戻れる）。当たりは、キー入力の届き方——Alt+← は root の `Column` の `Modifier.onKeyEvent`（Main.kt）で受けていて、これは**焦点（フォーカス）を持つ子がいるときにだけ**呼ばれる。ジャンプの直後は、開いた文書の中の何にも焦点が無い（または焦点が外れる）ので、キーが
  `Column` まで届かない。編集モードの切替などで、どこかの部品が焦点を取ると届くようになる。直すなら、キーの受け取りを `Window` の `onPreviewKeyEvent`（焦点に関わらず先に受ける）へ移すか、ジャンプの着地で本文の入れ物に焦点を要求する（`FocusRequester`）。ツールバーの
  ← ボタンも同じ症状なら、`canGoBack` の再コンポーズの取りこぼしも疑う（要再現）
targets: I-08
closed_on: 2026-09-22
resolutions:
  - date: 2026-09-22
    kind: 解決
    note: 対応（ショートカットの受け取りを、root の `Column` の `Modifier.onKeyEvent` から `Window(onKeyEvent = …)`＝`Main.kt` の `handleShortcut`
      へ移した。Compose Desktop 1.7.3 の順は、ウィンドウの `onPreviewKeyEvent` → 焦点のある部品とその先祖の `Modifier.onKeyEvent` → ウィンドウの `onKeyEvent`（`ComposeSceneMediator`）なので、焦点が無いときも届き、テキスト入力が消費するキーは今までどおり入力側が先に受ける。Ctrl+S
      / Ctrl+Z / Ctrl+K も同じ経路にした＝焦点が無いときに効かなかったのは同根。ARCHITECTURE §4.24）
features:
  - I-08
