id: UX-106
title: '整合ルールの `lookup.via` に入れ子のパス（例: `target.ref`）を書くと、末尾のキー名だけが参照の線の名前として使われる'
status: resolved
origin_on: 2026-09-19
origin: R29-10 実装中
body: '**整合ルールの `lookup.via` に入れ子のパス（例: `target.ref`）を書くと、末尾のキー名だけが参照の線の名前として使われる**（定義体へ移した結果、`via` は「参照フィールドのキー名」として辿るようになった＝意図的差分
  D-19。別の場所に同じキー名の参照フィールドがあると、そちらも辿り得る。現行のテンプレート・サンプルは `via` が1語のキー名だけで未発現）'
memo: '参照の線を「キー名」でなく「スキーマ上の場所」で指定できるようにするのが根本（`edge` の `via` の指定を場所へ広げる）。第2段（多重度と対象型）で関係の指定を整理するときに合わせて検討する。当面は MANUAL に「`via`
  は参照フィールドのキー名」と明記済み **対応（2026-09-20・P27 R27-02）**: `via` を「参照が書かれた場所の末尾のキーの並び」と比べるようにした（1語なら今までどおりキー名。`target.ref` は「`target`
  の下の `ref`」の参照だけ。配列の番号は無視）。`edge`・値の式 `refCount`・文脈の開示が同じ突き合わせ（`QueryEdgeStep.viaMatches`）を使う'
targets: ARCHITECTURE §4.38・意図的差分 D-27
closed_on: 2026-09-21
resolutions:
  - date: 2026-09-21
