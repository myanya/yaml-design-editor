id: UX-17
title: 除外規約の再設計
status: discussing
origin_on: 2026-08-03
origin: R16-03c試験
body: '**除外規約の再設計**: ①カラム定義内の excluded フラグより、**テーブル定義直下の除外ID一覧**の方が良いのでは ②テーブルには「全カラム必要タイプ」（不要カラムを明示）と「一部カラムのみタイプ」（全項目チェック自体を外す）があり、タイプで動きを変えたい
  ③現状は excluded 行に type を書くとDDL型チェックが走る'
memo: '設計議論（R16-03b と合同で）。対応案: ①テーブル直下の `excludedColumns:`（ref の一覧）＋カバレッジに `excusedBy`（除外参照があれば充足扱い＝既存の ref 機構・バックリンク表示に乗る）②テーブル要素の宣言（例
  `columnPolicy: all / partial`）で**スコープ付き完全性**（「このテーブルは親エンティティの全項目をカバーする」）を判定する新ルール種別 ③現規約では excluded 行に type を書かない運用（①が入れば行自体が消えるため解消）。①②はカバレッジ語彙の拡張のため、着手前に
  architecture/ へ設計を起こす'
features:
  - S-09
  - V-05
