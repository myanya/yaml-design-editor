id: UX-109
title: AI 生成のプレビューなど「索引を重ねずに、未保存の内容だけを検証する経路」では、その内容で新しく書かれた ID に、詳細文書の不足とエンティティの整合の指摘が出なくなった
status: resolved
origin_on: 2026-09-20
origin: R29-13 実装中
body: '**AI 生成のプレビューなど「索引を重ねずに、未保存の内容だけを検証する経路」では、その内容で新しく書かれた ID に、詳細文書の不足とエンティティの整合の指摘が出なくなった**（定義体へ移した検査は、他のパターン制約と同じく索引にある要素だけを判定する＝意図的差分
  D-21 ⑤・D-22 ②。アプリの通常の検証は未保存の編集を重ねた索引を使うため影響なし）'
memo: '以前から `constraints`・網羅マトリクス・遷移検証は同じ制限を持っていた。プレビューの検証にも「提案の内容を重ねた索引」を渡せば、すべての検査がまとめて揃う（`AiGenerationDialog` の検証に渡す索引を、提案を重ねたものにする）。需要を見て判断
  **対応（2026-09-20・P27 R27-02）**: AI 生成のプレビューは、提案の内容を重ねた索引（`AppState.overlayIndexWith`。未保存の編集も重ねる）で検証するようにした。提案で新しく書かれた ID
  にも、詳細文書の不足・エンティティの整合・利用者の `constraints` が効く'
targets: ARCHITECTURE §4.38
closed_on: 2026-09-21
resolutions:
  - date: 2026-09-21
    kind: 解決
