origin: 利用者メモ
body: '**ID横ぐしからAI生成を使うとき、関連ドキュメントも一緒に文脈へ渡したい**（現状はプロンプトで手動補完している）'
memo: 'AI生成の文脈組み立てへ横ぐし合成結果（各アスペクトの出現・参照先文書）を投入する。P19 のコンテキストエンジニアリング（レシピ）と同じ設計面。入口自体は R24-01（2026-08-13）でエンティティページから直接開けるようになった。**実装（2026-08-13）**:
  `AiRequest.relatedFiles` の注入点を新設し、エンティティページからの生成はエンティティの出現・参照先・参照元の文書が「関連文書」候補として自動選択される（内容の文脈 `<related-document>` として参考文書＝手本と区別して送信）。あわせて出現単位の「この出現をAIで作成」（所有キー限定・キー単位マージ適用）も追加'
targets: R24-02（FEATURES A-16）
