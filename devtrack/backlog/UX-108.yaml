id: UX-108
title: クエリの edge は向きによって「参照を書いた要素」の捉え方が違う
status: resolved
origin_on: 2026-09-19
origin: R29-12 実装中
body: '**クエリの edge は向きによって「参照を書いた要素」の捉え方が違う**（出ていく向き `dir: out` は、入れ子の要素が書いた参照も外側の要素のものとして辿る＝`graph.outgoingRefs` はサブツリー配下の全参照。入ってくる向き
  `dir: in` の相手は「その参照を含む、最も内側の ID を持つ要素」。対象型の検査を定義体へ移すとき、出ていく向きで書くと外側の要素（ドメイン・エンティティ定義など）に誤って型の不一致が出た——参照先の側から `dir: in` で辿る形にして解決）'
memo: '既存のクエリコアの性質（R22-01。コンテナ単位で参照を辿れる利点がある）で、MANUAL の constraints の節に注意書きを足した。利用者が「参照を書いた要素そのもの」を `dir: out` で辿りたくなる場面が多いなら、edge
  に「直接書いた参照だけ」を選ぶ指定を足す案。あわせて、クエリは同じノードを二度通らないため、自分自身への参照は対象型の検査にかからない（意図的差分 D-20 ③） **対応（2026-09-20・P27 R27-02）**: 食い違いを無くした——参照を書いた要素は、向きによらず「その参照を含む最も内側の
  ID を持つ要素」。`dir: out` はその要素が直接書いた参照だけを辿る（`refCount` も同じ）。入れ子を辿りたいときのために、入れ子の線 `edge: {contains: true}`（`dir: in` は外側へ・`repeat`
  で何段でも）を足した。以前の挙動は「`contains` を何段でも辿ってから参照の線」という組合せとして書ける。変更の前後で、テンプレート・サンプル・specs の検証結果と全テストは1件も変わらなかった。**残**: クエリは同じノードを二度通らないため、自分自身への参照は対象型の検査にかからない（意図的差分
  D-20 ③。そのまま）'
targets: ARCHITECTURE §4.38・意図的差分 D-27
closed_on: 2026-09-21
resolutions:
  - date: 2026-09-21
