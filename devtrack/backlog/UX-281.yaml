id: UX-281
title: 年・月を特殊な値（期間のメタ概念）として扱い、日付から導いた年・月で束ねた行に、複数の集計を 1 つの表で並べられるようにする
status: todo
origin_on: 2026-11-08
origin: labs/adventurers-guild で、月ごとの精算の表と積み上げ棒を作ったとき
body: '**年・月を特殊な値として扱う**: 年・月は本質的には特殊な値（メタ概念）で、利用者が月に ID を持たせた概念を置かなくても、日付から導いた年・月で行を束ね、その行ごとに複数の集計（例 月ごとの報酬・手数料・支払額の合計）を 1 つの表に並べ、積み上げ棒にもできるようにする（オーナーの判断で改善項目として扱う）。'
memo: いまはクロス集計の cells.aggregate と cells.path が 1 表に 1 つで、cells.series も見出しと行の鍵だけ。グリッドの行は ID を持つ要素だけで、支払日の年月のような値で束ねられない。試作では一度、月に ID を持たせた概念（精算の月）を置いて避けたが、ツールの制約をオントロジーに持ち込む形（支払日との二重持ち・月を足す手間）だったので外し、月ごとの支払額と手数料を別々のクロス集計にした。series の列ごとに path と aggregate を書ける形か、グリッドの行を値の式（yearMonth など）で束ねる形。対応したら試作の月ごとの表を 1 つに戻す
features:
  - X-16
  - X-17
