id: UX-296
title: 生の値への解析（parseToRaw）が本文を 2 回解析する（スキーマ・ビュー・組込みの定義の読み込みがすべて 2 倍）
status: resolved
kind: usability
origin_on: 2026-11-12
origin: 開く処理の分析（docs/archive/workspace-open-analysis.md）
memo: |-
  yaml/YamlIO.kt の parseToRaw は、展開の上限を確かめるために compose と YNode への変換をして結果を捨て、もう一度 Yaml.load する。読み込みで 103 回（スキーマ・組込み）、最初の描画までにさらに 107 回（ビュー定義・図の記法など）。
  案 A1: 組み立てたノード（compose の結果）から値を作り、解析を 1 回にする。数値のキー・日付など、load と同じ値になることをテストで押さえる。
theme: T-04
features:
  - C-01
closed_on: 2026-11-21
resolutions:
  - date: 2026-11-21
    kind: 解決
    note: "案 A1 を入れた。YamlIO.parseToRaw は本文を 1 回だけ解析し、組み立てたノードから展開の上限の確認と値の組み立ての両方を行う（SafeConstructor の constructDocument）。リポジトリの YAML 4,431 件で、直す前と値・キーの型・誤りが同じことを突き合わせた（突き合わせの仮のコードは残していない）。コメントだけの文書が null になることなどは YamlIOTest「生の値への解析は 本文を 1 回読んで load と同じ値を作る」が見る。この環境の CLI（labs/adventurers-guild）で、スキーマ文書の解析 0.38〜0.65 → 0.32〜0.35 秒、組込みスキーマ 0.35〜0.74 → 0.28〜0.33 秒"
