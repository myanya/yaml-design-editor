  yaml/YamlIO.kt の parseToRaw は、展開の上限を確かめるために compose と YNode への変換をして結果を捨て、もう一度 Yaml.load する。読み込みで 103 回（スキーマ・組込み）、最初の描画までにさらに 107 回（ビュー定義・図の記法など）。
