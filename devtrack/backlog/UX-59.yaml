id: UX-59
title: 【今後の開発】ゴール駆動への一般化（一括実行 Level 2）
status: todo
origin_on: 2026-08-09
origin: 一括実行設計
body: '**【今後の開発】ゴール駆動への一般化（一括実行 Level 2）**: 検証・カバレッジの指摘に「解消手段のアクティビティ」を紐付け（例 `resolves: {coverage: ...}`）、ディスパッチャが「指摘が消えるまで（または予算まで）」1件ずつ実行する。残作業の定義をスキーマ側（カバレッジ）へ寄せる、foreach（R18-01）の合流先'
memo: '前提基盤: `Issue` に安定識別子（どの規則の・どの対象か）を持たせる整備。UX-04（指摘→実行可能アクションの紐付け）と同じ機構に合流させ、「1件ワンクリック実行」と「残り全部一括」を同じ紐付けの上に載せる。foreach
  の `source: issues`・共通土台（対象キー・limit・失敗隔離）は流用可'
targets: ROADMAP R18-02・R41-05 ✅（1 件ずつの起動は入った。残りの一括は R18-02）
