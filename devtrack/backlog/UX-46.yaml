id: UX-46
title: エージェントフローの不安定さ
status: discussing
origin_on: 2026-08-09
origin: S2第1回
body: '**エージェントフローの不安定さ**: ①スコープ外パス（issues[*].assignee）への書込を試行し続けて失敗（maxTurns×リトライ2回分を消費）②変更なしで終了すべき場面で abort を選ぶ（幕5でも再現）。総評「動作に不安定さを感じる・抜本的な検討が必要」'
memo: ①システムプロンプトの allowedPaths 明示強化・書込拒否時に「指摘追記へ切替」を誘導 ②「変更なし提出」の正常系（空 submit）と abort の使い分けをカーネル側で規範化。台本側は instruction に本文修正禁止を明記済み（対症）。抜本はエージェントフロー再設計（T-01
  論点3）
theme: T-01
targets: T-01
