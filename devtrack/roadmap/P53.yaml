id: P53
number: 53
title: 業務モデルから作る設計書体系とアプリ生成
status: in-progress
status_note: 全設計書を導出・補正と指定・追加・確定へ移行。整合性の自動確認を行い、全体レビュー待ち
body:
  - text: >-
      対象は [samples/todos-sysdev](../samples/todos-sysdev/README.md)。全体は samples/todos の業務モデル整備 → 設計書体系 → ログインなしの Spring Boot アプリ生成の順。

      業務モデル整備は引継ぎ時点で完了。現在は設計書全体をそろえて内容と整合性をレビューする。テーブル設計書もレビュー未完了。生成できることと、オーナーのレビューが完了したことを分ける。

      導出・補正と指定・追加から確定項目を作り、ビューと後段で共有する。エンティティの既存ビューとテーブル生成は接続済み。エンティティの区分以外の追加・方式は未接続。ほかの設計書は文書・コレクションへの追加と方式の既定値を合成する。

      合意した変換方針は [ADR-0039](decisions/0039-finalized-design-items.md)、レビューする属性・構造・確認例は
      [エンティティ定義書の見直し案](../samples/todos-sysdev/docs/entity-definition-plan.md) にある。

      属性と[保存構造・生成処理](../samples/todos-sysdev/docs/entity-generation-contract.md)はオーナー確認済み。対応範囲は同文書で管理する。

      [設計書の確定と全体レビュー](../samples/todos-sysdev/docs/design-document-migration-plan.md)に対応範囲・依存・検査・試し方を集約する。現行の記載内容を基に全種類を移行し、オーナーが包括してレビューする。

      過不足は今の todos の利用箇所だけでなく、設計書として必要な内容と業務モデルの構造から判断する。
  - columns: work
    items:
      - id: R53-05
        title: エンティティ定義書の必要な情報と機械的な導出を見直す
        places: 導出・補正と指定・追加・確定項目、項目一覧と C/U のビュー、関連テスト
        prereq: エンティティ定義書の必要な項目から議論するオーナー指示
        done_criteria: 明記・継承・補正・追加・未解決を保持し、個別・横断・後段の値を照合してオーナーがレビュー完了を判断する
        state: in-progress
        state_note: 個別・横断・CRUD・テーブル生成で確定値を共有。対応範囲は上記の生成処理に記載。内容レビューを継続
      - id: R53-01
        title: テーブル設計書のレビューを続ける
        places: samples/todos-sysdev の詳細設計項目一覧・型対応表・台帳・補正一覧・ビュー・DDL、TodosSysdevTest
        prereq: エンティティ定義書の再レビューと、基本設計から詳細設計へ渡す値の整理
        done_criteria: 初期値の出力方法、未対応構造、主キー・索引・外部キー、補正の有効範囲と不足を確認し、オーナーがレビュー完了を判断する
        state: todo
        state_note: レビュー未完了。先にエンティティ定義書を見直す。初期値の出力方法は修正・関連テスト済み。未対応構造と補正の拡張は議論待ち
      - id: R53-02
        title: 全設計書を確定項目へ移し包括してレビューする
        places: 各設計書の入力・確定項目・ビュー・後段の生成と、移行計画
        prereq: 現行の記載内容を基に最後まで進めるオーナー指示
        done_criteria: 導出・補正と指定・追加を確定し、既存ビューと後段への伝達を検証して内容レビューを終える
        state: in-progress
        state_note: 20 種類の導出・合成・確定と既存ビューを接続。設計書全体の内容レビューは未完了
      - id: R53-03
        title: 設計書間のつながりとコード生成の入力を確かめる
        places: 基本設計から詳細設計への補正、物理名の参照、SQL・Java の型と初期化の対応、対応の検査
        prereq: 各設計書のレビューで必要な情報と役割が決まっていること
        done_criteria: 補正後の値と物理名が後続設計へ届き、生成物が最新で検証が通り、コード生成に要る情報がそろう
        state: in-progress
        state_note: 物理名・呼出名・URL・入力制約・メッセージ・セッションの伝達、競合と誤りでの停止を自動確認。コード生成と実 DB の確認は今後
      - id: R53-04
        title: Spring Boot のアプリを生成する
        places: 設計項目とビューからの Java・MyBatis XML・Thymeleaf・CSS・設定の生成
        prereq: 設計書体系のレビュー完了と、オーナーによるアプリ生成への着手指示
        done_criteria: ログインなしで、業務モデルにある閲覧と操作が動き、入力・状態・前提・データの決まりと画面遷移を確認できる
        state: todo
sections:
  - title: 現在の材料とレビュー状態
    body:
      - text: >-
          | 対象 | ワークスペース内にあるもの | 状態 |

          |---|---|---|

          | 業務モデル | `.yde/schemas/business`・`.yde/views/business` は samples/todos の写し | 変更は todos を先に直し、指示を受けて写す |

          | エンティティ定義書 | `design/basic/entities.yaml`・`types.yaml`・`classes.yaml`、補正と指定・追加の入力、ダッシュボード | 再レビュー中。了承済みとは扱わない。UX-339・340・341・342
          |

          | テーブル設計書 | `design/detail/tables.yaml`、型対応表、索引の台帳、補正一覧、ダッシュボード、DDL | 実装あり、オーナーレビュー継続中 |

          | ほかの設計書 | `design/generated` の操作・処理・Mapper・画面・Controller・セッション・ドメイン・エラー・メッセージ | 導出・補正と指定・追加・確定に移行。全体レビュー待ち |

          | 段のルールと補正 | basic・detail の段を宣言。段のルールは無く、基本の COR-001 は TODO の ID の代表の説明、詳細の補正一覧は空 | 説明の合成に接続。基本の補正はテーブルの生成と DDL に反映。物理名は
          Mapper、呼出名は処理と Controller に反映 |

          | アプリ | 設計書と DDL が材料 | Spring Boot のアプリ生成は未着手 |
  - title: エンティティ定義書の修正前の調査結果とレビュー範囲
    body:
      - text: |-
          修正前の CLI 調査では、4 エンティティ・23 項目・17 論理型を確認した。基底の未保持、項目固有の制限と組込み型の性質の欠落、C/U の文字を数値として集計する誤りがあった。
          検証エラーなし・生成物が最新でも表示の誤りは見つからず、原本のフォームとビューが違う場所を読むことも原因だった。足場固めの変更は [ADR-0038](decisions/0038-effective-design-items.md) にある。
          その後も共通型から継承した値が原本には無く、ビューが解決する違いが残った。確定項目を共通化する方針と、今回の保存構造の検証は上記の設計案に記録する。
      - text: >-
          オーナーの指定により、条件付き必須・項目間の決まりなどのデータの規則は後回しにし、まず足場を固める。

          議論は、(1) 論理型・基底・配列の要素と項目の記録内容と読み方、(2) 共通の型と項目固有の文字数・数値範囲などを保持して実効値を求める方法、(3) 補正後の値をビューと後続設計が共有する方法、(4) 既存 C/U
          表の出力を原本と一致させる方法、の順。CRUD を R/D まで広げるかも、今回の足場固めとは分けて扱う。

          機械的な導出を維持し、空欄を人が埋める対処にはしない。値が無い理由は、対象外・規定が無い・導出失敗を区別する。元のキーと値は YDE の書き方を保持する。

          足場固めでは、基底・項目の制限・補正後のテーブル生成・C/U 表を修正。全23項目と52個の C/U、共通型と個別項目の補正、参照先と一意索引、空文字の DDL 反映を関連テストで確認した。オーナーレビューは未完了。

          修正後の確認では、値のあるセルだけでなく、任意項目・初期値なし・false・空配列・配列の参照先・入れ子の項目・項目だけに書いた制約・補正・書込の無い CRUD 行を含める。
  - title: テーブル設計書で残る判断
    body:
      - points:
          - id: DEC-022
            status: pending
            date: 2026-11-16
            by: オーナー
            label: 配列の配列とエンティティのマップ
            text: 現変換が拒否する形を業務モデル側で書き直す制限とするか、設計側で中間の行とマップのキーを保存できる形にするか。SQL で表現不能という意味ではない。具体例と影響を説明してから判断する
      - text: |-
          初期値の出力方法は今回の修正対象。UX-335 全体（Java の型や初期化の対応）は継続する。
          補正の意味と有効範囲（UX-339）、番号と参照の長さ（UX-325）、物理名の後続への伝わり（UX-324）はレビューで扱う範囲を決める。
          CRUD 表の列名（UX-336）・採番の接頭辞の見せ方（UX-337）・段の補正（UX-333・334）・画面確認の停止処理（UX-338）は個別の指摘として残す。
