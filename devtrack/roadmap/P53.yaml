id: P53
number: 53
title: 業務モデルから作る設計書体系とアプリ生成
status: in-progress
status_note: 基本・詳細別の配置から独立アプリの業務画面まで生成を接続。設計書と画面の内容レビューを継続
body:
  - text: >-
      対象は [samples/todos-sysdev](../samples/todos-sysdev/README.md)。全体は samples/todos の業務モデル整備 → 設計書体系 → ログインなしの Spring Boot
      アプリ生成の順。

      業務モデル整備は引継ぎ時点で完了。現在は設計書全体をそろえて内容と整合性をレビューする。テーブル設計書もレビュー未完了。生成できることと、オーナーのレビューが完了したことを分ける。

      導出・補正と指定・追加から確定項目を作り、ビューと後段で共有する。エンティティの既存ビューとテーブル生成は接続済み。エンティティの区分以外の追加・方式は未接続。ほかの設計書は文書・コレクションへの追加と方式の既定値を合成する。

      合意した変換方針は [ADR-0039](decisions/0039-finalized-design-items.md)、レビューする属性・構造・確認例は [エンティティ定義書の見直し案](../samples/todos-sysdev/docs/entity-definition-plan.md)
      にある。

      属性と[保存構造・生成処理](../samples/todos-sysdev/docs/entity-generation-contract.md)はオーナー確認済み。対応範囲は同文書で管理する。

      [設計書の確定と全体レビュー](../samples/todos-sysdev/docs/design-document-migration-plan.md)に対応範囲・依存・検査・試し方を集約する。現行の記載内容を基に全種類を移行し、オーナーが包括してレビューする。

      基本設計・詳細設計を上位で分け、各段階に入力・導出・合成・確定を置く。生成アプリは同じワークスペースの app/ に置き、YDE 本体の Gradle から独立させる方針を合意した。 [ADR-0041](decisions/0041-design-layout-and-independent-app.md)
      と [配置整理からアプリ生成までの作業計画](../samples/todos-sysdev/docs/application-generation-plan.md) に境界と完了条件をまとめた。 配置移行と、方式設定からビルド・起動の基本構造を生成する経路を整えた。アプリだけを別の場所へコピーしたテスト・ビルド・起動も確認した。
      共通の Java 型、行モデル、Mapper・XML・DDL と全操作の Service、26 画面・5 Controller を接続した。実 HTTP で全操作と入力の往復、部分更新、二重送信、別タブの確認を検証する。設計書と画面の内容レビューは継続する。

      過不足は今の todos の利用箇所だけでなく、設計書として必要な内容と業務モデルの構造から判断する。
  - columns: work
    items:
      - id: R53-05
        title: エンティティ定義書の必要な情報と機械的な導出を見直す
        places: 導出・補正と指定・追加・確定項目、項目一覧と C/U のビュー、関連テスト
        prereq: エンティティ定義書の必要な項目から議論するオーナー指示
        done_criteria: 明記・継承・補正・追加・未解決を保持し、個別・横断・後段の値を照合してオーナーがレビュー完了を判断する
        state: in-progress
        state_note: 個別・横断・CRUD・テーブル生成で確定値を共有。対応範囲は上記の生成処理に記載。内容レビューを継続
      - id: R53-01
        title: テーブル設計書のレビューを続ける
        places: samples/todos-sysdev の詳細設計項目一覧・型対応表・台帳・補正一覧・ビュー・DDL、TodosSysdevTest
        prereq: エンティティ定義書の再レビューと、基本設計から詳細設計へ渡す値の整理
        done_criteria: 初期値の出力方法、未対応構造、主キー・索引・外部キー、補正の有効範囲と不足を確認し、オーナーがレビュー完了を判断する
        state: todo
        state_note: レビュー未完了。先にエンティティ定義書を見直す。初期値の出力方法は修正・関連テスト済み。未対応構造と補正の拡張は議論待ち
      - id: R53-02
        title: 全設計書を確定項目へ移し包括してレビューする
        places: 各設計書の入力・確定項目・ビュー・後段の生成と、移行計画
        prereq: 現行の記載内容を基に最後まで進めるオーナー指示
        done_criteria: 導出・補正と指定・追加を確定し、既存ビューと後段への伝達を検証して内容レビューを終える
        state: in-progress
        state_note: 20 種類の導出・合成・確定と既存ビューを接続。設計書全体の内容レビューは未完了
      - id: R53-03
        title: 設計書間のつながりとコード生成の入力を確かめる
        places: 基本から詳細への補正、物理名の参照、SQL・Java の型と初期化、アプリの方式・依存・起動設定、対応の検査
        prereq: 配置移行後の確定項目と現行の設計書の形式
        done_criteria: 補正後の値を共有し、各コード出力と確定項目の対応、型・初期値・方式、未対応時の扱いが明示される
        state: in-progress
        state_note: Java と SQL の型・初期値・呼出先・現行の Form と Service と画面の検査を接続し照合。新たに数値入力へ広げる場合の範囲の確認は継続
      - id: R53-04
        title: Spring Boot アプリの全体生成と独立実行を確認する
        places: app/ のソース・資源・ビルドと、全体の再生成・動作確認・CI
        prereq: R53-09・R53-10・R53-11 の生成が接続し、生成を妨げる未決事項が解消されていること
        done_criteria: 再生成の一致、補正の伝達、単独でのテスト・ビルド・起動、業務の閲覧と操作、YDE の全テストを確認する
        state: done
        state_note: 122 ファイルの生成と一致、補正の伝達、独立アプリの 34 テストと JAR の実起動、YDE の全テストを確認。設計内容と画面の見え方はレビューを継続
        state_on: 2026-11-21
      - id: R53-06
        title: 基本設計と詳細設計ごとに入力・導出・合成・確定を配置する
        places: design/ と .yde/ の定義・参照・ビュー・テスト・文書
        prereq: 基本・詳細を最上位で分ける配置方針の合意
        done_criteria: パスと根拠の場所を除く確定値・ID・ビューが移行前と一致し、再生成・検証・DDL が通る
        state: done
        state_on: 2026-11-21
        state_note: 確定文書 80 件と代表ビュー 5 種類・DDL を比較。67 件の関連テストで配置と段階別入力を確認
      - id: R53-07
        title: アプリの独立した Gradle ビルドと検証経路を用意する
        places: app/ の settings・build・Wrapper・依存・起動設定、サンプルのコピー処理と検証
        prereq: R53-03 でアプリの方式・依存・起動設定を整理すること
        done_criteria: app/ を別の場所へコピーしてビルド・起動でき、YDE のモジュール・成果物・テスト対象と競合しない
        state: done
        state_on: 2026-11-21
        state_note: 確定設定から基本構造 12 ファイルを生成。アプリだけをコピーしたテスト・JAR 作成・起動を確認。CI の別ジョブを定義
      - id: R53-08
        title: 複数ファイルのコード生成と再生成を管理する
        places: 既存の変換と文字出力、生成対象の一覧、更新・削除・競合検査
        prereq: R53-03 の出力対応と R53-07 のビルド境界
        done_criteria: 生成予定を検査して適用し、再生成が一致し、競合や途中失敗で前の成果物と手書きファイルを壊さない
        state: done
        state_on: 2026-11-21
        state_note: 確定した出力計画から可変個数の Java・XML・共通 DDL を生成。競合・途中変更・更新と削除・失敗時の復元を検査
      - id: R53-09
        title: Java のモデルとデータアクセスを生成する
        places: モデル・行の型・Mapper・XML・DDL と H2 の結合検証
        prereq: R53-08 の生成経路と確定した型対応・物理設計
        done_criteria: Java と SQL の型・参照・採番・初期値が対応し、実際の Mapper と H2 で入出力が通る
        state: done
        state_note: 7 行モデル・4 Mapper と XML・共通 DDL を生成。全 48 メソッドを H2 で実行し、初期値・入れ子・絞り込み・集計・更新・削除・空 DB の初期化と独立ビルドを確認
        state_on: 2026-11-21
      - id: R53-10
        title: 状態・前提・効果を持つ業務処理を生成する
        places: Service・状態の型と判定・トランザクション・エラー
        prereq: R53-09 のデータアクセスと処理設計の対応範囲の確認
        done_criteria: 成功時の更新と、状態・前提違反時の非更新・エラーを実行して確認できる
        state: done
        state_note: 4 Service・12 操作を生成。H2 で全操作・状態と前提の拒否・確認の非更新・クリア優先・親子の取り消し・同時採番を検証。未対応の式・参照・型の比較は生成前に拒否
        state_on: 2026-11-21
      - id: R53-11
        title: 画面と画面遷移を生成する
        places: Controller・Form・Thymeleaf・CSS・JS・メッセージ・セッション・エラー応答
        prereq: R53-10 の業務処理と画面設計の対応範囲の確認
        done_criteria: 一覧・詳細・入力・確認・実行・エラー表示が接続し、Form とメッセージの制約が一致する
        state: done
        state_note: 26 画面・5 Controller・全 12 操作を接続。実 HTTP で入力保持・欄の違反・別タブ・二重送信・状態再検査・部分更新・コメント全件削除を確認
        state_on: 2026-11-21
      - id: R53-12
        title: 抽象システムモデル・具体システムモデルの体系へ移す
        places: samples/todos-sysdev の変換定義・設計の確定項目・ビュー・人の入力と、依存関係の 4 枚のページ（scripts/design-map.py）
        prereq: 目指す形（業務モデル → 抽象システムモデル → 具体システムモデル → プログラム設計 → ソースコード）のオーナーとの合意
        done_criteria: 各段の変換が 1 つ前の段だけを読み、モデルは項目の形、定義書と設計書はビュー、人の入力は段ごとの全体と個別の判断だけになる。生成アプリは変わらない
        state: todo
        state_note: 目指す形と理想のファイル体系、体系の 5 つの論点（要素の種類・ファイルの粒度・段の境・ソースの作る元）を合意し、いまとの差を 4 枚のページで計算できるようにした。段階と完了の条件は samples/todos-sysdev/docs/system-model-plan.md
sections:
  - title: 現在の材料とレビュー状態
    body:
      - text: >-
          | 対象 | ワークスペース内にあるもの | 状態 |

          |---|---|---|

          | 業務モデル | `.yde/schemas/business`・`.yde/views/business` は samples/todos の写し | 変更は todos を先に直し、指示を受けて写す |

          | エンティティ定義書 | `design/basic/final/entities.yaml`・`types.yaml`・`classes.yaml`、補正と指定・追加の入力、ダッシュボード | 再レビュー中。了承済みとは扱わない。UX-339・340・341・342
          |

          | テーブル設計書 | `design/detail/final/tables.yaml`、型対応表、索引の台帳、補正一覧、ダッシュボード、DDL | 実装あり、オーナーレビュー継続中 |

          | ほかの設計書 | `design/basic/final`・`design/detail/final` の操作・処理・Mapper・画面・Controller・セッション・ドメイン・エラー・メッセージ | 導出・補正と指定・追加・確定に移行。全体レビュー待ち
          |

          | 段のルールと補正 | basic・detail の段を宣言。段のルールは無く、基本の COR-001 は TODO の ID の代表の説明、詳細の補正一覧は空 | 説明の合成に接続。基本の補正はテーブルの生成と DDL
          に反映。物理名は Mapper、呼出名は処理と Controller に反映 |

          | アプリ | `app/` の独立した基本構造・行モデル・Mapper・XML・共通 DDL・全操作の Service・業務の Controller と 26 画面、生成予定と更新の手順 | 確定値からデータアクセス・業務処理・画面まで生成。設計と動作を合わせてレビューする
          |
  - title: エンティティ定義書の修正前の調査結果とレビュー範囲
    body:
      - text: |-
          修正前の CLI 調査では、4 エンティティ・23 項目・17 論理型を確認した。基底の未保持、項目固有の制限と組込み型の性質の欠落、C/U の文字を数値として集計する誤りがあった。
          検証エラーなし・生成物が最新でも表示の誤りは見つからず、原本のフォームとビューが違う場所を読むことも原因だった。足場固めの変更は [ADR-0038](decisions/0038-effective-design-items.md) にある。
          その後も共通型から継承した値が原本には無く、ビューが解決する違いが残った。確定項目を共通化する方針と、今回の保存構造の検証は上記の設計案に記録する。
      - text: >-
          オーナーの指定により、条件付き必須・項目間の決まりなどのデータの規則は後回しにし、まず足場を固める。

          議論は、(1) 論理型・基底・配列の要素と項目の記録内容と読み方、(2) 共通の型と項目固有の文字数・数値範囲などを保持して実効値を求める方法、(3) 補正後の値をビューと後続設計が共有する方法、(4) 既存 C/U 表の出力を原本と一致させる方法、の順。CRUD
          を R/D まで広げるかも、今回の足場固めとは分けて扱う。

          機械的な導出を維持し、空欄を人が埋める対処にはしない。値が無い理由は、対象外・規定が無い・導出失敗を区別する。元のキーと値は YDE の書き方を保持する。

          足場固めでは、基底・項目の制限・補正後のテーブル生成・C/U 表を修正。全23項目と52個の C/U、共通型と個別項目の補正、参照先と一意索引、空文字の DDL 反映を関連テストで確認した。オーナーレビューは未完了。

          修正後の確認では、値のあるセルだけでなく、任意項目・初期値なし・false・空配列・配列の参照先・入れ子の項目・項目だけに書いた制約・補正・書込の無い CRUD 行を含める。
  - title: テーブル設計書で残る判断
    body:
      - points:
          - id: DEC-022
            status: pending
            date: 2026-11-16
            by: オーナー
            label: 配列の配列とエンティティのマップ
            text: 現変換が拒否する形を業務モデル側で書き直す制限とするか、設計側で中間の行とマップのキーを保存できる形にするか。SQL で表現不能という意味ではない。具体例と影響を説明してから判断する
      - text: |-
          初期値の出力方法は今回の修正対象。UX-335 全体は継続する（Java の型の対応は人の書く表になった。残りは、設計書体系での書き方の層・論理型ごとの対応・auto の写し方）。
          補正の意味と有効範囲（UX-339）、番号と参照の長さ（UX-325）はレビューで扱う範囲を決める。
          物理名の後続への伝わり（UX-324）は、詳細設計の補正一覧で付け替えた名前が Mapper・行モデル・Service まで届く形になり、解決にした（2026-11-21）。
          CRUD 表の列名（UX-336）は、日本語のキーの表が原本から無くなり（C/U の原本は操作の writes）、解決にした（2026-11-21）。
          段の補正（.yde/stages）は、todos-sysdev ではいまは使わない（2026-11-21 オーナー）。段の仕組みは、今後も必要になる可能性があるので残す（2026-11-23 オーナー。UX-375 は見送り）。UX-333 は見送りにしてあり、段の補正をまた使うことになったら再開する。UX-334 の残りはテーブルの確定項目に補正の出どころが無いこと。
          採番の接頭辞の見せ方（UX-337）・画面確認の停止処理（UX-338）は個別の指摘として残す。
