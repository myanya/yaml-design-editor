id: P44
number: 44
title: 業務ダッシュボードの拡張
table_title: 業務の入口としてのダッシュボード
status: in-progress
status_note: 初期版と独立した業務導線が完了（2026-10-25）、試用後の拡張判断は下記
body:
- text: |-
    現行の仕様は [ダッシュボードの設計](architecture/dashboards.md)、試用は [TODOサンプル](../samples/todos/README.md) を参照する。
    まず「状況を把握する→対象を選ぶ→操作する」の導線を試し、次の候補は実例に基づいて優先順位を決める。

    - ✅ 2026-10-26 全区画に共有する入力（`inputs`＝日付・選択・文字。区画の filter と表の `params` に `$名前` で渡し、空は絞らない。CLI は `--param`）。
    - 文書ビュー等の追加表現と、対象選択・原本への移動の共有（グラフは P46 で区画に置けるようになった）。
history:
- id: RH-007
  title: 'P44: 業務導線の改善（2026-10-25）'
  body:
  - text: |-
      左端の独立スペースを既定の入口にし、default指定・全幅詳細・任意の分割表示を追加した。
      参照は業務対象へ、原本は明示ボタンへ分け、条件から外れた詳細・戻る履歴・一覧のスクロールを保持する。
      保存と操作は既存経路を共有し、Calculusの評価器・書込経路は増やさなかった。
- id: RH-008
  title: 'P44: 業務ダッシュボードの初期版（2026-10-25）'
  body:
  - text: |-
      ワークスペースごとの業務的な視覚と意味的操作を与える入口として、`kind: dashboard` を追加した。
      既存グリッド・条件・件数・詳細・アクションを合成し、未保存の編集とUndoを反映する。
      基準日、判定できない対象の理由、選択対象が条件から外れた場合の扱いを定め、CLIとread_viewにも同じ結果を開示した。
      TODOサンプルには期限超過・対応中・個票未作成・全件・カテゴリ別状況の区画を追加した。
      確かめ方: `DashboardDefinitionsTest`・`DashboardsTest` と、[TODOサンプルの試用](../../samples/todos/README.md)。
