id: P40
number: 40
title: 保有と所属（入れ子で決まる関係に名前を付け、グラフ・検査・画面で一級にする）
status: done
status_note: 完了（2026-10-13）。段階 1＝名前と検査と画面、段階 2＝レンズの箱の入れ子と「側面で分ける」
history:
- id: RH-045
  title: 'P40: 保有と所属（入れ子で決まる関係） ✅ 完了（2026-10-13）'
  body:
  - text: |-
      目的: ID を持つ要素の中に ID を持つ要素が書かれていること（画面の中の画面項目・テーブルの中のカラム）を、「保有」（親から）「所属」（子から）という名前のある関係としてグラフ・検査・画面で一級に扱う（オーナー 2026-10-12）。P27 の入れ子の線（`contains`）は名前の無い構造の線として残した。
      決めたこと（オーナー 2026-10-13）: ①宣言が無くても線を出す（名前は子を書く項目のキー名）②名前は親のスキーマで子を書く項目の `relation` に書く（参照と同じ語。新しいキーは増やさない）③名前で検査・クエリに使える（`edge: {relation: 名前}` は参照と保有の両方。名前を書かない線は参照だけ）④レンズは線から始める。親の削除では、消える要素と壊れる参照を見せたうえで続行か拒否を人が決める。
      段階 1: 走査が `holderKey / holderRelation` を写し、グラフが `SemanticHolding` を導出。クエリ・`refCount`・`Traverse`・関係レジストリの検査（source / target / cardinality）が名前で保有の線を辿る。定義の点検（`relation` の置き場所・宣言のない名前）。関係パネルと `related` / `read_entity` / CLI `entity show` に保有◆と所属◇。レンズに保有の線。削除の計画に保有する要素と壊れる参照の注意事項。`infer-relations` に保有の実績。テンプレート `labs/sysdev-template` に 9 本の保有の関係を宣言。
      段階 2（UX-163 の議論。オーナー 2026-10-13: 案 A と案 B の切替・箱に入れるのは定義出現の保有だけ・既定は畳む・同じエンティティは点線）: レンズの節点と辺を `LensGraphs`（純ロジック）に切り出し、一体（箱＝エンティティ。定義出現の保有＝誕生の場所だけ入れ子、詳細化の出現の保有は線）と「側面で分ける」（箱＝出現。文書の入れ子そのまま。同じエンティティは定義出現から順に点線）を切替にした。入れ子の箱は畳めて（既定は全部畳み、起点の外側と起点だけ開く）、畳んだ箱の中につながる辺は箱へ付け替える。配置は `GraphLayouts.arrangeNested`（段ごとに配置し、子を持つ箱は中を先に配置してその大きさの節点として外側に置く。段をまたぐ辺は直線）。箱を動かすと中の箱も動く（`withMovedNested`）。関係パネルの「所属」とレンズの出現の箱は側面の表示名（`Aspects.aspectLabelOf`。UX-164）。
      見送り: 案 C（1 つの箱を側面の区画で仕切る）は 3 段の入れ子で箱が巨大になるため採らなかった。
      確かめ方: `LensGraphTest`（入れ子の決め方・点線・畳みと辺の付け替え・絞り込み）・`GraphLayoutsTest`（入れ子の配置の収まりと決定性・親を動かすと中も動く）・`QueryNestingTest`・`HoldingDeleteTest`。
