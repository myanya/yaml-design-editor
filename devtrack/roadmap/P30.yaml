id: P30
number: 30
title: YAML から YAML への変換の拡張と応用
status: in-progress
status_note: R30-03 の一部（ビューの列）完了。他は未着手（下記）
body:
- points:
  - label: 位置づけ
    text: 変換は構造のスキーマの導出の土台として入れた（計算体系の 6 つ目の体系「組み立て」。CORE-CALCULUS「Construct Calculus」）。拡張と応用は個別の開発セクションとしてここで管理する。
  - label: 狙い
    text: 変換を汎用の変換器の土台にする。ビューなど様々なところで使い、テンプレートエンジンを足して YAML から Markdown への変換器なども作る。検査と同じく「プリミティブな実装＋組込み定義＋ユーザ定義」の組合せにする。
  - label: いまあるもの
    text: 選ぶ（既存のクエリ）× 組み立てる（ひな型。`$copy` / `$format` / `$map` / `$first` / `$each` / `$eachEntry` / `$apply` / `$concat` / `$when`）× 規則を子に当てる。結果は新しい項と各値の出どころ。CLI `transform`。組込みの変換定義は `builtin-transforms/`。
  - label: 守ること
    text: 出力は保存しない（原本へ書くなら Rewrite を通す）。クエリを ID の無い場所まで広げない。規則を当てるのは入力の木の子へ向かってだけ。出どころを結果の一部として持つ。置き場は semantic-core。組込みだけの特別な機能を作らない。式の中の条件分岐・キーの計算・利用者定義の再帰・任意のコード実行は入れない。
- columns: basic
  items:
  - id: R30-01
    title: 部品の拡充
    content: 繰り返しの源にクエリを使う。値の式をひな型の指示として書く。並べ替え・重複の除去・件数などの配列の基本操作
    state: partial
    state_on: 2026-10-26
    state_note: '値の式をひな型に `$value`・繰り返しの `$no`・`$number` の `$as`・採番の接頭辞から親を `$of: self` で。samples/orders の明細の一括登録のため'
  - id: R30-02
    title: 利用者が変換定義を置く場所
    content: 置き場（`_transforms` のようなゾーン）とメタスキーマ、CLI とエージェントのツール（読み取り専用の面）。組込みと同じ仕組みで読む
    state: todo
  - id: R30-03
    title: 既存の仕組みを寄せる
    content: 組み立てる側の約 10 か所（ビューの列・skill の書き出し・派生スキーマ・ひな型の生成・AI 生成用の JSON Schema・文脈の開示・穴埋め）を 1 つずつ判断して寄せる。ビューの列は 2026-09-27 に値の式の列へ寄せた（`computed` を廃止し、値の式に参照を 1 段辿る `via` を足した）
    state: partial
    state_note: ビューの列
  - id: R30-04
    title: 文字の出力への派生（Markdown など）
    content: 帳票ごとの Markdown ひな形 → 変換で値の一式を作る → テンプレートエンジンがひな形へはめ込む、の 2 段。書き方・置き場・書き出し先は着手時に決める
    state: done
    state_on: 2026-10-26
    state_note: 'レポート: `.yde/reports` の定義＝変換の `build`（`$view` でビューの行）＋ひな形（`TextTemplate`）＋ `output`。CLI `report`・台帳のビュータブ。manual/reports.md'
  - id: R30-05
    title: 出どころの活用
    content: 変換結果の「出力の場所 → 入力の文書と場所」を、セルのその場編集・原本へのジャンプ・指摘の原本への戻しにつなぐ
    state: todo
history:
- id: RH-038
  title: 'P30: YAML から YAML への変換の拡張と応用（汎用の変換器の土台） 📋 管理開始（2026-09-21）'
  body:
  - text: |-
      > **位置づけ（2026-09-21 オーナー指示）**: 「様々な拡張や応用が考えられるため、個別の開発セクションとして、しっかりと管理していきたい」。YAML から YAML への変換は、P27 段C で、構造のスキーマの導出のための土台として入れた（R27-08。計算体系の6つ目の体系「組み立て」＝[CORE-CALCULUS.md](../CORE-CALCULUS.md) §26・[ARCHITECTURE.md](architecture-2026-09.md) §4.42）。その拡張と応用は、P27 から切り離して、この節で管理する。**各項目の着手は、オーナーの判断を待つ**（勝手に着手しない）。

      **狙い（オーナーの構想）**: YAML から YAML への変換を汎用にし、**汎用の変換器の土台**にする。いずれはビューなど様々なところでこの変換を使い、テンプレートエンジンなどの派生を足して、YAML から Markdown への変換器なども作っていく。検査（判定）が YAML の定義になったのと同じく、変換も「本当にプリミティブな実装＋組込み定義＋ユーザ定義」の組合せにする（CORE-CALCULUS §25）。

      **いまあるもの（R27-08・R27-09）**: 変換 ＝ 選ぶ（既存のクエリ。書かなければ渡された項1つ）× 組み立てる（出力の形をそのまま書いたひな型。`$copy` / `$format` / `$map` / `$first` / `$each` / `$eachEntry` / `$apply` / `$concat` / `$when`）× 規則を子に当てる（必ず終わる形だけ）。結果は新しい項と、各値の出どころ。保存しない。CLI `transform`（試作台）。最初の内部利用＝構造のスキーマの導出（組込みの変換定義 `builtin-transforms/structural-schema.yaml`）。

      **守ること（P27 の判断点 TF-01〜09 で決めたこと）**: 出力は保存しない（原本主義。原本へ書くなら Rewrite を通し、変更セットと承認を経る）／クエリを ID の無い場所まで広げない（選んだものの中は、パスと繰り返しで辿る）／規則を当てるのは、入力の木の子へ向かってだけ（必ず終わる）／出力の各値の出どころを、結果の一部として持つ／置き場は semantic-core（yaml-core には足さない）／組込みだけの特別な機能を作らない（利用者にも同じ書き方を開く）／式の中の条件分岐・キーを計算で作ること・利用者が定義する再帰関数・任意のコードの実行は、入れない。
  - head: |-
      | ID | 項目 | 内容 | 状態 |
      |---|---|---|---|
    rows:
    - title: 部品の拡充
      cells:
      - 'いま無い部品を、使いどころの実需に合わせて足す: ①繰り返しの源にクエリを使う（束縛した要素から、もう一度クエリで選んで配列を作る。ビューの被参照の列に当たる）②既存の値の式（四則演算・文字数・参照の本数・書かれた場所の数・集計）を、ひな型の中で使う（**評価がクエリの評価器に閉じていた点は P31 R31-01 で解消＝`SemanticValues`**。残りは、ひな型の指示として値の式を書く形）③並べ替え・重複の除去・件数などの、配列への基本の操作'
      - 📋
      snapshot_of: R30-01
    - title: 利用者が変換定義を置く場所
      cells:
      - 変換定義を置くゾーン（`_transforms` のような置き場）と、そのメタスキーマ（フォームでの編集と検証）・CLI とエージェントのツール（`read_view` と同じく、読み取り専用の面）。組込みの変換定義（`builtin-transforms/`）と同じ仕組みで読み、同じ能力を持たせる
      - 📋
      snapshot_of: R30-02
    - title: 既存の仕組みを寄せる
      cells:
      - 'P27 の棚卸し（下の P27 節の表）で見つかった「組み立てる側」の約10か所を、1つずつ判断して寄せる。候補: ビューの列と文字の表現・skill の書き出し（csv / Markdown / HTML の固定の形）・派生スキーマ（`derive:`）・ひな型の文書とサンプルの生成（似た規則の実装が3つ）・AI 生成用の JSON Schema・エージェントへの文脈の開示。`{…}` の穴埋めの実装が8つある点も、ここで整理する。**寄せるかどうかは、項目ごとにオーナーが判断する**（既存の挙動を変えるときは、先に意図的差分へ登録する）'
      - 📋
      snapshot_of: R30-03
    - title: 文字の出力への派生（Markdown など）
      cells:
      - '**オーナーの構想（検討メモ。2026-09-21）**: 帳票の種類ごとに Markdown のテンプレート（値を埋め込む形のひな形。例: テーブル定義書）を用意する → YAML から YAML への変換で、そのひな形が求める値の一式を作る（表の形への変換などは、この段で行う）→ テンプレートエンジンが、値の一式からパスで必要な項目を取り出し、構造を Markdown の形へ直しながら、ひな形にはめ込む。土台（YAML から YAML）に要るのは「出力が、パスで取り出せる素直な YAML であること」だけ。テンプレートの書き方・置き場・書き出し先（派生成果物であり、原本ではない）は、着手のときに決める'
      - 📋
