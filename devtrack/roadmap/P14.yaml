id: P14
number: 14
title: ビュー機構の強化（文書ビュー・責務分離）
status: done
status_note: 完了。需要待ちの残りは BACKLOG UX-129
history:
- id: RH-022
  title: 'P14: ビュー機構の強化（文書ビュー・スキーマとビューの責務分離） ✅ 完了（2026-08）'
  body:
  - text: |-
      狙い: スキーマは「データ契約（構造・意味・検証）」、ビューは「画面の合成（何を・どの順で・どんな派生情報とともに見せるか）」という責務分離を確立する。現状のビューは台帳スペース専用の横断グリッド1種類で、文書をフォームで開いたときの表示はスキーマだけが決めており、表示の要望（例: アクター定義書に「利用するユースケース」の被参照表を足す）がスキーマへの表示オプション追加圧力になっている（`role` / `display` / enum `options` と混入は既に始まっている）。本フェーズでビューに**文書ビュー**（`kind: document`: 文書単位の表示合成）を追加し、「内容はスキーマで検証し、表示はビューでコントロールする」を実現する。

      方針（ARCHITECTURE §4.14 の不変条件は維持・拡張する）:

      - **文書ビューがマッチしない文書は現行のスキーマ駆動フォーム**＝「今の表示は暗黙の既定ビュー」。ビューは足したい文書にだけ足す opt-in で、後方互換を壊さない。
      - **表示決定の優先順位**: ①文書ビュー（画面の合成）＞②スキーマの固有表示ヒント（`role` / `display` / `label`＝要素の同一性に近い表示。`Display` の共有契約として存置）＞③予約語規約。既存ヒントの移設はせず、「今後、合成系のオプションはスキーマに足さない」を境界とする。
      - **派生セクション（被参照表など）は読み取り専用＋原本座標へのジャンプ**。fields セクションの編集は既存の `FormCtx` / `Slot` 経路に委譲し、ビュー専用の書込経路を作らない。
      - **人間とAIが同じ面を見る**: 文書ビューも `read_view` / CLI `view` で機械可読に解決できるようにする。
  - head: |-
      | ID | 項目 | 状態 | 内容 |
      |---|---|---|---|
    rows:
    - id: R14-01
      title: 文書ビューの基盤
      cells:
      - ✅
      - 'ビュー定義に `kind`（`grid`＝既存・省略時既定 / `document`）を導入。文書ビューは `match`（glob）／`schemaId` で適用先文書を決め、`sections`（`fields`: スキーマ駆動フォームの射影＝全体または `path` 指定 / `backlinks`: 文書内IDへの被参照表＝`idPattern`・`relation`・`schemaIds` で絞り、`columns` で参照元要素の値を列表示）を上から順に描画する。`parseView` と `builtin-view` の対更新、フォーム（`ui/FormView.kt`）への統合、`read_view`・CLI `view` の対応、`ViewsTest` での一気通貫検証'
    - id: R14-02
      title: スキーマ定義の一級参照とビュー定義リント
      cells:
      - ✅
      - ビューからスキーマ構造を指す一級単位を named definition（`module#name`。非修飾名は schemaId から補完）に統一。グリッド列の `definition:` は定義のセル型フィールド（`Display.tableColumns` と同じ規則。ID型は行キーと重複するため除外）を列集合へ展開し、ラベル・パスをスキーマから導出する（列定義の重複記載の解消）。文書ビューの `fields.definition` は参照宣言で、存在はパース（＝ステージング提出ゲート込み）、実使用（パス先のフィールドが実際にその定義を参照しているか）はリントで検査。リント（`Views.load` に schemas を渡すと有効）はビュー→スキーマの参照（schemaId・パス・definition）の整合を検査し、パスは「ID要素（ID型フィールドを持つ object）から静的に解決できるか」で判定（enum cases は全ケースの和、ID要素の無いスキーマは判定しない＝誤検知を避ける）。指摘はビューを無効化せず定義エラーとして表示する。詳細は [FEATURES.md](../FEATURES.md) X-08
    - id: R14-03
      title: 合成表現の成熟
      cells:
      - ✅
      - 'fields セクションの表示キーの選別（`include`＝列挙順で表示 / `exclude`＝除外。併用不可・選別キーはリント対象）と、要素単位アタッチ（`attachments`: `at` パターン＝YPath 構文＋`[*]`（任意インデックス）に一致する要素の展開フォーム内に、その要素のIDへの被参照表を差し込む。描画は `ObjectFields` の末尾＝ルート・ネスト・配列要素・テーブル行展開のすべての経路に効く。`at` の解決可否・要素のID有無はリント対象）を実装。**取捨選択の判断**: 任意スコープのクエリセクション（検索結果ふうの一覧の埋め込み）は、横断一覧の用途がグリッドビュー＋台帳スペースで既に果たせるため見送り（需要が出たらグリッドビューの埋め込み参照として再検討）。文書ビューのエクスポートも具体的な帳票需要が出るまで見送り（`source.view` はグリッドのみ対象を維持）'
  - text: |-
      **完了条件（R14-01）**: ①既存ワークスペースのグリッドビュー・フォーム表示が無変更で動く（全既存テスト green）②「アクター定義書のスキーマは本質だけを持ち、利用ユースケースの被参照表はビュー側の定義で足す」が実際に組める ③文書ビューの定義エラーがロード・ステージング提出ゲートの両方で検出される ④エージェントが `read_view` で同じ被参照表（原本座標つき）を読める——を `ViewsTest` で自動検証（フォーム描画は L-09 の方針どおり手動確認）。

      **完了条件の充足（2026-08）**: R14-01 は上記①〜④を `ViewsTest` が自動検証。R14-02 は「definition 参照列の展開（ラベル・パス・列集合のスキーマからの導出）」「正しい定義に指摘を出さない誤検知ガード」「schemaId・パス・definition の陳腐化検出」「`fields.definition` の実使用検査」「未知の definition のステージング提出ゲートでの拒否」を、R14-03 は「選別（include）の順序つき表示宣言」「`at` パターンの一致規則（`[*]`＝任意インデックス・深さ厳密）」「要素座標つきの被参照解決とテキスト表現」「選別キー・at のリント」を `ViewsTest` が自動検証（フォーム描画は L-09 の方針どおり手動確認）。
