id: P15
number: 15
title: ビューからの新規作成の強化
status: done
status_note: 完了
history:
- id: RH-023
  title: 'P15: ビューからの新規作成の強化 ✅ 完了（2026-08）'
  body:
  - text: '狙い: ビューグリッドの「新規行」は一覧文書の配列への追加（配列モード）だけだったため、一覧文書を持たず詳細文書だけでIDを運用するレイアウト（1詳細文書＝1ID。例: software-template のアクター定義）では、グリッドから新しい行を作る入口が構造的に存在しなかった（行は既存IDの出現から生まれ、`detail` の「作成」ボタンも既存行にしか出ない）。段階的詳細化（一覧→詳細）のルートに加えて、ビューの一覧から詳細ファイルを直接作る運用を可能にする。'
  - head: |-
      | ID | 項目 | 状態 | 内容 |
      |---|---|---|---|
    rows:
    - id: R15-01
      title: newRow ファイルモード
      cells:
      - ✅
      - '`newRow` に `filePattern`（配列モードの `file`+`path` と排他）を追加。「新規行」→ID入力ダイアログ→ `{id}` 置換先へ詳細文書をスキャフォールド（`Views.scaffold`＝`detail.filePattern` の「作成」と共通: マッチするスキーマの必須初期値＋IDフィールド設定）しディスクへ書込＝索引更新で行が即座に現れる。入力IDは `rows.idPattern` 一致・既存IDとの重複を検査（`AppState.addViewRowFile`）。リントは作成先のスキーマ有無・`detail` 認定条件との整合を検査。`read_view`・CLI `view` のテキスト表現に新規行の作り方（配列=`apply_patch`／ファイル=`create_document`）を明示。ビューはデータを持たない原則は不変——宣言するのは「新しい原本がどこで生まれるか」だけ（ARCHITECTURE §4.14）'
