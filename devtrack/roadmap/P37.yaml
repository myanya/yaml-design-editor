id: P37
number: 37
title: ファイルの場所の型（`file`）と画像の表示
status: in-progress
status_note: 第一弾完了（2026-10-11）。残りは BACKLOG の個別項目（下記）
body:
- points:
  - label: 目的
    text: 設計文書から図・資料のファイルを指せるようにし、AI が書いても誤りにくい書き方と検査を備える。画像はその場で見られるようにする。
  - label: 決定（オーナー。2026-10-11）
    text: 書き方は案 A（接頭辞なし＝ルートから・`./` `../`＝文書から・絶対）。ワークスペースの外と無いファイルの扱いは `.yde/workspace.yaml` の `files:` で選ぶ（許可・許して警告・違反・許す場所）。画像の表示はフロービューと同じ操作（幅に合わせる・拡大率・ドラッグ・拡大表示）。YAML 側に表示のプロパティは置かない。
  - label: 完了（第一弾）
    text: 基底の種類 `file` と `FilePath`・`extensions`・メタスキーマ、検査 `fileIssues` と `FilePolicy`、存在はストアに聞く（CLI・アプリ・変更セットの適用で同じ）、フォームの入力欄（選ぶ・OS で開く・解決した場所の案内）、画像の埋め込みと全面表示。
  - label: 残り
    text: BACKLOG UX-152〜155（場所の補完・スキーマ設計画面の `extensions`・大きな画像の縮小版・画像以外の中身の表示）。
