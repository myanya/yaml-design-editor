id: P25
number: 25
title: スキーマ・リファクタリング
status: done
status_note: 完了
history:
- id: RH-030
  title: 'P25: スキーマ・リファクタリング（スキーマ変更への既存文書の追随） ✅ 完了（2026-08-13）'
  body:
  - text: |-
      狙い: スキーマ定義の変更（フィールド改名・移動・順序変更など）に、既存文書と周辺の消費者（ビュー・宣言）を**1つの変更セット**で追随させる。方式は「操作ベース」——スキーマ差分からの推測（改名と削除＋追加が判別不能）は採らず、明示的なリファクタリング操作が生成器（`Plan` = 変更セット＋警告＋サマリ）を通って既存の `Workspace.apply` で適用される。ID改名（EntityOps。R21-02）・ファイル移動（DocMove。R21-03）と同型で、**新しい書込経路は作らない**。`_schemas` はエージェント書込不可のため本機能は人間専用。

      **設計上の決定（2026-08-13 方針承認時）**:

      - **決定的に書換**: 該当文書のデータキー（cases・フェーズ・`$ref`・派生スキーマを考慮したスキーマ誘導走査で列挙）、スキーマ自身（`fields[i].key`・`phases.key`）、ビューのパス（静的解決が一意な箇所: 通常列・計算列 path / lookup.via・newRow.path・文書ビューの sections / include / exclude・被参照表の列）。
      - **警告のみ（自動書換しない）**: 自由テキスト（アクティビティ instruction 等）、解決が一意に定まらない参照（多義な列パス・skill 写像・アタッチ `at` など）。
      - **拒否（安全側の既定）**: 改名・移動先キーが既存文書に存在する衝突は生成段階で拒否（ファイル一覧つき）。派生スキーマ（`derive` の導出フィールド）・組込みスキーマは対象外＝導出元文書を直す。配列・map の境界をまたぐ移動（1↔N で決定的に解決できない）・共有定義をまたぐ移動も拒否。
      - **文書の順序整列（F2 の文書側）は独立コマンド**（align-order。スキーマは変更しない正規化）。マイグレーションスクリプトの蓄積はしない（閉世界＋変更セット原子適用＋Git履歴で足りる）。
  - head: |-
      | ID | 項目 | 状態 | 内容 |
      |---|---|---|---|
    rows:
    - id: R25-01
      title: 基盤＋フィールド改名
      cells:
      - ✅
      - 2026-08-13 実装。`PatchOp.RenameKey`（順序・コメント保持のキー改名。CLI・エージェントの patch 語彙にも追加）、FieldDef→データパス列挙（インスタンス同一性による走査）、`SchemaRefactor.renameField`（文書＋スキーマ＋ビューの追随・定義文書の警告スキャン）、CLI `refactor rename-field`、スキーマエディタの「一括改名…」＋プレビュー
    - id: R25-02
      title: 親子の移動・順序
      cells:
      - ✅
      - 2026-08-13 実装。`moveField`（同一要素コンテキスト内のみ＝配列・map 境界の横断は拒否・共有定義またぎ拒否・中間 object 生成・空親削除は `--keep-empty` でオプトアウト）、`PatchOp.ReorderKeys`＋`alignOrder`（文書の「スキーマ順へ整列」。`_document` 先頭・未知キーは末尾に相対順）。ビュー書換の拡充（計算列 path / lookup.via・newRow.path・文書ビューの sections path / include / exclude・被参照表の列。移動は警告提示）
    - id: R25-03
      title: 語彙拡大
      cells:
      - ✅
      - 2026-08-13 実装。`renameEnumValue`（values / cases キー / default / phases.order / requiredFrom / activeFrom / 文書値の追随）、`deleteField`（値あり件数の明示・entity.owns 掃除・ID型とフェーズキーは拒否）、`requireField`（必須化＋欠落・空値への既定値充填。`--from` はフェーズ到達文書のみ）、`convertFieldType`（スカラー↔array・string→enum / int / number の検証つき・enum→string・数値等→string）
    - id: R25-04
      title: 定義・関係の改名
      cells:
      - ✅
      - 2026-08-13 実装。`renameDefinition`（`definitions` キー＋非修飾／`module#name` の `$ref`＋ビュー definition 参照の横断書換）・`extractDefinition` / `inlineDefinition`（構造の定義化↔インライン化。参照が残らない定義は削除）、`renameRelation`（レジストリ name＋スキーマ / ビューの `relation:`）、`renameSchemaId`（`id:`＋修飾 `$ref`・schemaId(s)・fromSchemaIds / detailSchemaIds・クエリ `schema:` の横断書換）
  - text: '**完了条件の充足**: 「スキーマのフィールド改名→全該当文書のキー改名（コメント・順序保持）→ビュー列の追随→適用後の検証エラー増加なし」に加え、移動（中間生成・空親削除・境界拒否）・整列・enum値改名（cases / phases 追随）・削除・バックフィル・型変換往復・定義の改名／抽出／インライン化・関係／スキーマIDの改名を `SchemaRefactorTest`（19ケース）が一気通貫で検証。UI導線はスキーマエディタの「一括改名…」「一括削除…」「文書をスキーマ順へ整列…」、その他は CLI `refactor`（12操作）。'
