id: P12
number: 12
title: 操作体験の再基盤化（スペース・受信箱・段階的開示）
status: done
status_note: 完了。ビューグリッド統合は見送り、本文検索は P17 で実施済み
history:
  - id: RH-020
    title: 'P12: 操作体験の再基盤化（スペース・受信箱・段階的開示） 🚧 主要項目完了（2026-07）'
    body:
      - text: |-
          狙い: P1〜P11 で製品は「YAMLエディタ」から「構造化台帳＋AI実行環境」へ変貌したが、UIの骨格は初期の3ペインエディタのままで、新機能はツールバーのアイコン約20個とモーダルダイアログ4種として外付けされ続けた。その結果、①ナビゲーションが実装機構軸（一覧・グラフ・横ぐし・グリッド…）でユーザーの意図軸ではない、②ビジョンの中核である「提案→人間承認」がモーダルに閉じ込められている、③「一覧系」が6系統に分散、④記入者・読み手・情報設計者・AI運用者の4役割に全機能が常時露出、⑤エージェントには段階的開示があるのに人間にはない——という「取っ散らかり」が生じた。**機能は削らず提示層を製品の概念モデルに合わせて再編する**フェーズ（コア層は R9-02 で UI 非依存化済みのため、変更は `ui/` / `Main.kt` / `app` にほぼ閉じる）。

          製品の自己定義: **スキーマで構造化された文書の台帳を、人間とAIが同じ操作系で読み書きし、検証と承認をゲートに仕事を進める環境**。これをUIへ写像し、左端のアクティビティレールで4スペースを切り替える骨格とする。

          | スペース | 中身 | 対応する役割 |
          |---|---|---|
          | 編集 | ファイルツリー＋フォーム／ソース／差分（現行エディタ） | 記入者・読み手 |
          | 台帳 | 一覧・ビューグリッド・参照グラフ・ID横ぐし（俯瞰と横断編集） | 記入者・読み手 |
          | 実行 | 受信箱（承認待ち・質問・競合）・手動実行・自動化・計測/評価 | AI運用者・承認者 |
          | 設計 | `_schemas` / `_views` / `_agents` / `_activities` / `_evals` / `_skills` の定義カタログと編集導線 | 情報設計者 |
      - head: |-
          | ID | 項目 | 状態 | 内容 |
          |---|---|---|---|
        rows:
          - id: R12-01
            title: スペースとアクティビティレール
            cells:
              - ✅
              - 左端レールで4スペースを切替（`app.UiSpace`。[FEATURES.md](../FEATURES.md) W-09）。文書ビュー切替（旧ツールバー5アイコン）は編集／台帳スペース内の配置へ移し、ツールバーはワークスペース操作・履歴・検索・モードに縮小。エージェント実行・自動化・自己改善・skillの4モーダルを廃止し実行／設計スペースへ常設化（`ui/RunsSpace.kt`
                / `ui/DesignSpace.kt`）。エージェント実行の状態はコンポーザブルの `remember` から `RunController`（AppRoot 生存期間）へ退避し、スペース切替で実行が中断しない。ナビゲーション履歴（I-08）は既存の
                `workspaceView` 座標系を維持して互換を保ち、ジャンプはスペースを編集／台帳へ同期する（`NavigationHistoryTest` で検証）
            features:
              - W-09
              - I-08
          - id: R12-02
            title: 受信箱（人間の判断待ちの一級化）
            cells:
              - ✅
              - 承認待ち変更セット（AutomationEngine）・エージェントの質問（ask_human）・外部変更競合を実行スペース先頭の受信箱に集約（W-10）。レールとステータスバーにバッジを常設し、レビューはモーダルではなくスペース内の広い画面で行う。質問はモーダルをやめ受信箱・実行タブの非モーダルカードにし、文書を確認しながら回答できる
            features:
              - W-10
          - id: R12-03
            title: IDインスペクタ
            cells:
              - ✅
              - '右パネルを「検証／関係（参照・被参照）／出現（同一ID出現＋カバレッジ）」のインスペクタへ再編し、「このIDについて知る」を一元化（I-09）。ID横ぐしビュー（I-07）は全出現のその場編集の場として台帳スペースに残し、インスペクタの出現タブから展開する。**将来拡張**:
                出現ストリップ（E-09）・出現選択ダイアログとの完全統合、フォーム内で選択中の要素（ルート以外のID）への追随'
            features:
              - I-09
              - I-07
              - E-09
          - id: R12-04
            title: 一覧系の統合と統合検索
            cells:
              - ✅
              - '一覧・ビューグリッド・グラフ・ID横ぐしを台帳スペースのタブとして同居させた（空間統合。`ui/Shell.kt` の `LedgerSpace`）。ツールバーのID検索ボックスはコマンドパレット（Ctrl+K）へ合流し、パレットのID検索はタイトル部分一致（S-13
                の索引タイトル）にも対応（I-06・X-04）。**見送り（2026-08）**: 一覧ビュー（X-01）を「組込みの自動ビュー」としてビューグリッド機構（X-06）へ実装統合する案——P14〜P16 でビュー機構が「ビュー定義駆動・ID行×宣言列（definition・計算・バックリンク）」へ特化する一方、X-01
                は「ゼロコンフィグ・1行1ファイル（IDのないファイルも表示）・一括編集 X-02 の受け皿」として分化した。統合には IDなし行・ヒューリスティック列・複数選択一括編集・組込みビュー合成の機構追加が必要で「重複解消」でなく「複雑化」になる（現物の重複は
                WorkspaceViews.kt の表描画約100行のみ・コアロジックは分離済み）。台帳タブの使い分けに UX 指摘が出たら「台帳スペースの IA 再設計」として起こし直す。**移管**: 構造検索API（C-05）の本文検索のパレット露出は
                R17-04 で扱う（BACKLOG UX-18 のオーバーレイ未追随と同時対応）'
            features:
              - S-13
              - I-06
              - X-04
              - X-01
              - X-06
              - X-02
              - C-05
          - id: R12-05
            title: プロファイル（人間向け段階的開示）と空状態
            cells:
              - ✅
              - '`_agents` / `_activities` の定義を持たないワークスペースでは実行スペースをレールに出さない（判断待ち・自動化の稼働・手動表示（パレット「実行スペースを表示」）で表示。W-09）。エージェント向け段階的開示（C-04）と同じ思想を人間のUI複雑性に適用した。設計スペースの各定義種別に空状態の説明と
                CTA（新規作成・スキーマ推測 S-16 への導線）を配置。**将来拡張**: テンプレートパック（SK-05）のGUI展開、ワークスペースを開いた直後のホーム（検証・カバレッジ・承認待ちのダッシュボード）'
            features:
              - W-09
              - C-04
              - S-16
              - SK-05
          - id: R12-06
            title: 配列・map のテーブル表示（フォーム内一覧の視認性）
            cells:
              - ✅
              - 'スカラー中心の object 配列と「キー→object」の map をフォーム内で表形式に（[FEATURES.md](../FEATURES.md) E-13。map はキー列つき）。適否と列集合は `Display.tableColumns`（自動判定＋スキーマの
                `display: table / list` ヒント）に一元化し、セル編集は通常の `Slot` 経路を再利用（ARCHITECTURE §4.22）。列にならない項目（長文・ネスト・enum case・スキーマ外キー）は行の展開フォームで扱い、不適格な配列・map
                は従来の縦リスト＋要素単位の畳み込みサマリ（R10-02）が受け皿になる'
            features:
              - E-13
      - text: |-
          **完了条件**: ①4モーダルが廃止され、エージェント実行中にスペースを切り替えても実行・レビューが継続する ②承認待ち・質問・競合が受信箱1箇所に集まり、レール／ステータスバーのバッジから1クリックで到達できる ③`_agents` のない純エディタ用途のワークスペースでAI運用系のUIが目に入らない ④ナビゲーション履歴・閲覧専用・保存系の既存動作が回帰しない（`NavigationHistoryTest` ほか既存テストが green のまま）。Compose UI 自体は手動確認（L-09 の方針どおり）。

          **充足状況（2026-07）**: ①〜③は R12-01/02/05 の実装で充足（①②は構造上の保証＝`RunController` が AppRoot 生存期間、受信箱は各機構の射影。③はレールのプロファイル判定）。④は `NavigationHistoryTest`（スペース同期のテストを追加）を含む全単体テストが green。**フェーズ完了（2026-08）**: R12-04 の残作業 2 点は棚卸しの結果、X-01 の実装統合を見送り（理由は R12-04 欄）、本文検索のパレット露出を P17 R17-04 へ移管して本フェーズを閉じた。
