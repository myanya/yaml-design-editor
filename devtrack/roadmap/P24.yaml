id: P24
number: 24
title: AI 生成の入口拡大
status: in-progress
status_note: R24-04 が残り（下記）
body:
- points:
  - label: 目的
    text: 「AI で作成」（単発生成）を編集スペース専属から解き、適用先が画面上で一意に定まる画面の文脈から直接呼べるようにする。実行系はカーネル統合の単一系統のまま。
  - label: エージェント実行とのすみわけ
    text: 生成対象と適用先が画面上で一意に定まる 1 回生成は AI 生成。対象の選定・複数文書への書込・マルチターンの判断が要る作業はエージェント。一括は foreach とゴール駆動。適用経路は増やさない。
  - label: 完了
    text: 対象文書の明示化とホスト移設、エンティティ文脈と出現単位の生成、新規作成系のたたき台生成。
  - label: 残り
    text: R24-04 設計スペースの導線（スキーマ新規作成・推測ダイアログの「AI で洗練」）。BACKLOG UX-30・UX-33 と合流して設計する。
