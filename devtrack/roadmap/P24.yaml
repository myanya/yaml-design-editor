id: P24
number: 24
title: AI 生成の入口拡大
status: in-progress
status_note: R24-04 が残り（下記）
body:
  - points:
      - label: 目的
        text: 「AI で作成」（単発生成）を編集スペース専属から解き、適用先が画面上で一意に定まる画面の文脈から直接呼べるようにする。実行系はカーネル統合の単一系統のまま。
      - label: エージェント実行とのすみわけ
        text: 生成対象と適用先が画面上で一意に定まる 1 回生成は AI 生成。対象の選定・複数文書への書込・マルチターンの判断が要る作業はエージェント。一括は foreach とゴール駆動。適用経路は増やさない。
      - label: 完了
        text: 対象文書の明示化とホスト移設、エンティティ文脈と出現単位の生成、新規作成系のたたき台生成。
      - label: 残り
        text: R24-04 設計スペースの導線（スキーマ新規作成・推測ダイアログの「AI で洗練」）。BACKLOG UX-30・UX-33 と合流して設計する。
history:
  - id: RH-035
    title: 'P24: AI生成の入口拡大（画面文脈からの単発生成） 🚧 R24-01〜03 完了（2026-08-13）'
    body:
      - text: |-
          狙い: 「AIで作成」（単発生成 A-01〜03）を編集スペース専属から解き、エンティティページなど「適用先が画面上で一意に定まる」画面の文脈から直接呼べるようにする。実行系は R9-01 のカーネル統合（単一系統）を維持し、拡大するのは入口（UX）と文脈組み立てだけ。

          **エージェント実行とのすみわけ（承認済みの規約。2026-08-13 要件整理）**:

          - 生成対象と適用先（1文書・1パス〜文書全体）が**画面上で一意に定まる1回生成**はAI生成。対象の選定・複数文書への書込・マルチターンの判断が要る作業はエージェント実行（アクティビティ）。
          - 「新規ファイル＋文書全体生成」は、スキャフォールド（決定論）＋AI生成（1文書）の合成としてAI生成側に置く。
          - 一括（全行・全不足の解消）は foreach／ゴール駆動（P18・UX-59）であり本フェーズの対象外。検証パネル起点の「この不足を生成で解消」も、指摘→実行可能アクションの機構（UX-04 / UX-59）と合流すべき論点のため扱わない。
          - **適用経路は増やさない**: 適用は対象文書の編集中ツリーへの反映（未保存・Undo可・人が保存）のまま。複数文書への同時適用は作らない（§4.14 / §4.16 の流儀をAI生成にも適用）。
          - 適用外と整理した画面: グラフレンズ・一覧ビュー（ジャンプで足りる）・実行スペース（エージェント領域）・グリッドのスカラーセル（直接編集で足りる）。
      - head: |-
          | ID | 項目 | 状態 | 内容 |
          |---|---|---|---|
        rows:
          - id: R24-01
            title: '基盤: 対象文書の明示化とホスト移設'
            cells:
              - ✅
              - 2026-08-13 実装（[FEATURES.md](../FEATURES.md) A-15）。`AiRequest` に対象文書（`OpenDocument`）を追加し、呼び出し側はフォームの `FormCtx.doc`（文書ヘッダは
                openDoc）を渡す。`AiGenerationHost` を `EditorArea` からアプリシェル直下（スペース非依存）へ移設。エンティティページ（I-07）のフィールド✨・「AIで候補追加」が「押した場所の文書」を対象にその場で動く（台帳スペースでダイアログが開かず、編集スペースへ戻ると別文書対象で開く潜在バグ
                UX-85 の解消を兼ねる）
            features:
              - A-15
              - I-07
          - id: R24-02
            title: エンティティ文脈と出現単位の生成
            cells:
              - ✅
              - '2026-08-13 実装（[FEATURES.md](../FEATURES.md) A-16）。①関連文書: `AiRequest.relatedFiles` の注入点を新設し、エンティティページは出現・参照先・参照元（`AppState.entityRelatedFiles`）を注入（UX-66）。ダイアログは「関連文書／参考文書」の2グループ提示・関連があれば関連から最大3件を自動選択、プロンプトへは
                `<related-document>`（内容の文脈）として手本と区別して送信。②出現単位の生成: アスペクトカード・出現カードのヘッダ✨「この出現をAIで作成」。生成対象は所有キー限定の object（`type:
                id` は常に除外）・適用は既存 Map へのキー単位マージ（非生成キー・キー順を保持。§4.19）'
            features:
              - A-16
          - id: R24-03
            title: 新規作成系のたたき台生成
            cells:
              - ✅
              - 2026-08-13 実装（[FEATURES.md](../FEATURES.md) A-17）。ファイルツリーの新規作成ダイアログ・ビューグリッドの新規行ダイアログにチェックボックス、詳細作成セルに✨ボタンを追加（スキャフォールド→開く→たたき台生成の連結。UX-72
                の前段）。生成は文書全体置換ではなく**ルート object のキー単位マージ**（`requestDocumentDraft`）＝スキャフォールドが設定したID・`_document` を生成が壊さない（R24-02
                の原則を新規作成にも適用）。行IDが分かる経路では関連文書も自動で文脈に付く。ルート対象のマージはパッチを出さない（適用はダイアログ＝文書全体生成と同じ扱い）
            features:
              - A-17
          - id: R24-04
            title: 設計スペースの導線
            cells:
              - 📋
              - スキーマ新規作成・推測ダイアログの「AIで洗練」（決定論的推測 S-16 のドラフトを初期値にメタスキーマ生成 A-03 へ渡す）。UX-30・UX-33 と合流して設計
            features:
              - S-16
              - A-03
      - text: '**実装順**: R24-01（基盤）→ R24-02（エンティティ文脈）→ R24-03（新規作成系）→ R24-04（設計スペース）。各段の完了ごとに試し方を提示し、触り心地の確認（S1 部分再実施）を挟む。'
