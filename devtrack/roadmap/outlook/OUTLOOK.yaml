id: OUTLOOK
title: テーマの候補とリスク
candidates_intro: オーナーの構想で、計画はまだ無い。土台（P47 の段階）がそろってから、必要になった順に P 番号を振って「未完のテーマ」へ起こす。
candidates:
- name: 独立した常駐サーバ
  foundation: P49 の共通状態と通信契約
  note: desktop も接続側にする別プロセス構成は、独立運用の需要が出たときに検討
- name: 検証の高度化
  foundation: 無し（カーネルで閉じる）
  note: 定義体とメタスキーマの範囲で進める
- name: ワークフローの搭載
  foundation: app-core・agent（段階 2）
  note: 操作・検証・エージェントを組む実行器と記録。BACKLOG のテーマ管理 T-02 と合流する
- name: AI エージェントの作り直し
  foundation: agent の切り出し（段階 2）
  note: 新しいモジュールを隣に作って差し替える。BACKLOG のテーマ管理 T-01 と合流する
- name: 外部エージェントによる専用リファクタリング操作
  foundation: P49 の作業・計画・承認契約
  note: 通常の読取・パッチ・業務操作の公開後、既存カーネルのリファクタリング計画を同じ承認経路へ接続
risks:
- risk: 人間の編集中文書へのエージェント変更の競合
  policy: ベースバージョン付きパッチで検出し、既存の競合バナーの流儀で人間に選択させる
- risk: プロンプトインジェクション（文書内の指示文）
  policy: 文書内容は常にデータ扱い（設計原則 4）。加えて許可パッチ範囲・承認ゲートで被害半径を限定
- risk: コスト・実行時間の暴走
  policy: ターン・トークン・時間の上限をカーネルで必須にし、無人実行の方針で強化する
- risk: skill による任意コード実行
  policy: 既定は宣言型変換のみ。コード実行 skill はサンドボックス外作用として明示許可制（人間の事前承認必須・定義変更で承認失効・エージェントからは起動不可）
- risk: 派生スキーマによる間接的な検証ルール変更
  policy: 人間承認（既定）はゲートで足りる。自動適用だけは導出元文書への書込で承認待ちへ降格し、検証ルールが無人で変わる経路を塞いだ
- risk: 創作系（執筆）の品質評価が主観的
  policy: 客観ゲートが弱い領域はルーブリック＋人間承認既定を維持し、自動適用を解禁しない
- risk: 大規模ワークスペースの性能
  policy: 索引はファイル単位の増分更新に対応済み。エージェント実行時のオーバーレイ索引・ステージング検証は全再構築のままのため、遅延が目立てば次の最適化対象にする
- risk: GUI 常駐前提のアーキテクチャ
  policy: ヘッドレスコアを分離済み。以降の全テーマの前提
- risk: 台帳外へのスキーマ誤適用（広すぎる match）による検証ノイズ
  policy: 検証の集計は `ledger` 基準に限定し、台帳外は開いた文書の個別診断のみとする
- risk: コンテキストの絞りすぎによる精度低下
  policy: コンテキスト会計で内訳を可視化し、評価セットのレシピ A/B で「合格率 × トークン」を計測してデータでチューニングする
- risk: クエリコアの語彙が肥大して DB エンジン化するスコープ暴走
  policy: 「やらないこと」（集約は件数のみ・任意深さの再帰なし・任意式なし）を不変条件として明文化し、解禁は実例の需要で段階判断する
- risk: 関係宣言・定義出現一意化の必須化による既存ワークスペースの移行コスト
  policy: lint 先行（警告のみ）・レジストリ自動推測・破壊はワークスペース単位の opt-in スイッチで吸収する
