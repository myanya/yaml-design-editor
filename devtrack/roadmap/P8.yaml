id: P8
number: 8
title: 実運用の成熟（Git 併用・性能・エディタ体験）
status: done
status_note: 完了
history:
- id: RH-016
  title: 'P8: 実運用の成熟（Git併用・性能・エディタ体験） ✅ 完了（2026-07）'
  body:
  - text: '狙い: P1〜P7 で「スキーマ駆動の台帳＋エージェント実行環境」としての機能は一巡した。P8 は新しい機構を足すのではなく、実ワークスペースの規模（数百〜数千文書）と運用（Git併用・長期運用・日常編集）に耐える品質を作る。[FEATURES.md](../FEATURES.md) §11 の制約のうち、利用者影響が大きいものを解消するフェーズ。'
  - head: |-
      | ID | 項目 | 実装（[FEATURES.md](../FEATURES.md)） |
      |---|---|---|
    rows:
    - id: R8-01
      title: YAMLコメント・スタイルの保持
      cells:
      - '✅ E-06・L-01（`YamlIO` を SnakeYAML Node API（`processComments`）ベースへ差し替え。コメント・キー順・引用符/リテラル/フロー表記を「開く→編集→保存」で保持。置換系編集（パッチ・Slot）はコメントを引き継ぎ、構造比較・派生成果物は `dumpPlain` で表層無関係化。残る正規化＝アンカー展開・インデント2・配列要素の前行コメントの `- #` 後置は [ARCHITECTURE.md](architecture-2026-09.md) §4.17 に明文化）'
    - id: R8-02
      title: 索引の増分更新と検索性能
      cells:
      - '✅ I-01・C-08（`IdIndex` をファイル単位の走査結果保持＋`update` による差し替えに改修。保存・外部変更・変更セット適用が増分経路、スキーマ変更時のみ全再構築。ベンチマーク生成＋計測を CLI `bench` として整備: 800文書でフル再構築 約225ms → 増分 約2.4ms）'
    - id: R8-03
      title: ファイル監視のOSネイティブ化
      cells:
      - '✅ W-04（`core/FileWatcher.kt`: WatchService の再帰監視＋新規ディレクトリ追随。UIの外部変更検出とAutomationEngineのトリガ監視が変更イベント駆動になり、使えない環境では従来ポーリングへ自動フォールバック。取りこぼし保険に10秒毎の全走査を残す）'
    - id: R8-04
      title: ソースエディタ・差分の強化
      cells:
      - ✅ E-03・E-04（YAML構文ハイライト＝`ui/SourceHighlight.kt` の純ロジックトークナイザ、検索・置換（1件／すべて）、差分の変更行内文字単位強調＝`charDiffRanges`）
    - id: R8-05
      title: 編集体験の残ギャップ解消
      cells:
      - '✅ E-02（キー名変更）・E-10（複数ドキュメントYAML: 先頭を編集・後続を保持）・X-02（一括編集をルート直下の任意スカラーキーへ拡張）・X-03（参照グラフ: 力学配置 `ui/GraphLayout.kt`・全件描画・パン/ズーム・クリックジャンプ）'
  - text: '**完了条件の充足**: コメント・キー順・表記スタイルを含む編集往復の無損失と冪等性は `YamlIOTest` が検証（R8-01。配列要素の前行コメントのみ SnakeYAML エミッタの制約で初回保存時に `- #` 形へ後置される＝内容は保持・以降は安定）。索引の増分更新がフル再構築と一致することは `IdIndexIncrementalTest` が検証し、コストが変更ファイル数に比例することは CLI `bench` の計測で確認（R8-02）。R8-03〜05 は FEATURES §11 の L-02〜L-08 を解消した（各行に対応機能IDを付記）。'
