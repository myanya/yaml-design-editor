history:
- id: RH-042
  title: 'P35: 汎用フロービュー 初期範囲完了（2026-10）'
  body:
  - text: |-
      原本YAMLから既存Constructでノード・辺・レーンを導出し、原本座標と診断をCLI・read_view・GUIで共有する。
      単独表示・文書埋め込み・原本フォームによる詳細編集・参照移動と選択復元を実装し、BZFL-0002と関連定義・ガイドを移行した。
      ビュー参照の改名は既存のref型とRewriteを使い、投影中の意味を確定できない言及は計画の警告へ開示する。
      全体テスト・実データのCLI検証が成功し、利用者から最小例と実データの画面の確認済み返答を受けた。
      共通の項目改名で組込み型の解決に失敗する既存不具合はUX-143で別管理し、実データの項目改名は未検証として区別した。
      詳細は [実装計画と検証](flow-view.md) と [設計段階の検証](flow-view-validation.md)。
