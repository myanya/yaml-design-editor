id: P39
number: 39
title: 画面の見え方の保持（「戻る」は場所を戻し、見え方は画面が覚える）
status: done
status_note: 段階 1 完了（2026-10-12）。段階 2（スクロール位置・拡縮）は BACKLOG UX-162
history:
- id: RH-044
  title: 'P39: 画面の見え方の保持 ✅ 段階 1 完了（2026-10-12）'
  body:
  - text: |-
      「戻る」で戻ったとき、フォームの畳みや台帳の絞り込みが初期化される（オーナー 2026-10-12。UX-158 も同根）。原因は各画面が見え方を `remember` に持ち、スペース・台帳のタブ・エディタのタブで画面が差し替わる瞬間に捨てられること（戻る固有ではなく、離れた時点で消えていた）。
      決めたこと: 「戻る」は場所（`NavLocation`）を戻し、見え方は画面が覚える（ブラウザがページの状態を保管し、VS Code がエディタごとのビュー状態を持つのと同じ）。履歴に積む情報は増やさず、エディタのタブだけを場所の一部として足した。
      段階 1: `app/ScreenMemory.kt`（`state.memory`）に、フォームの畳み（文書 × パス。`FormCtx.expanded` / `setExpanded`）・ファイルツリーの展開と選択・右パネルのタブと検証の範囲・一覧とビューグリッドと準備の絞り込み・エンティティページの検索語と出現別フォームを移した。
      同じく、レンズの型と関係の隠し（隠した名前だけ持つ）と深さと配置（起点の有無ごと）・実行のタブとレビュー対象・設計の種類・Markdown とスキーマ設計のタブ・定義カードの開閉も移した。
      守ったこと: 覚えは「あれば使う・無ければ既定」で、再読込でスキーマや文書が変わっても古い鍵は読まれないだけにし、画面側で今の候補と突き合わせる（一覧の種別・状態、ツリーの選択、レンズの配置）。寿命はワークスペース。削除・改名はその文書のぶんだけ消す・移す。
      操作の途中（ダイアログ・メニュー・入力途中）は `remember` のまま。代案の `SaveableStateHolder` は AppState から見えずテストできないため採らなかった。
      判断（推奨どおり）: ツリーから開き直すときは常にフォーム（戻る・進むだけが前のタブ）。起動を跨ぐ記憶はしない。段階 2（スクロール位置・拡縮と位置・レンズの節点）は BACKLOG UX-162。
      確かめ方: `ScreenMemoryTest`（文書ごとの畳み・ジャンプ先の自動展開の維持・ワークスペース切替での消去・削除と改名の追随）と `NavigationHistoryTest`（エディタのタブの復元）。
