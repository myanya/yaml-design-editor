id: P32
number: 32
title: 式の値を項にする（集合と値の分離）
status: done
status_note: 完了
history:
- id: RH-040
  title: 'P32: 式の値を項にする（集合と値の分離） ✅ 完了（2026-09-27）'
  body:
  - text: |-
      - **目的**: 式の値を「項と出どころ」にし、集計を配列を受け取る関数に、集合から値への入口を `all` の 1 つにする（[ADR-0010](../decisions/0010-expression-values-are-terms.md)）。家計簿のような金額の集計を、検査でもビューでも同じ書き方で書けるようにする。
      - **守ること**: Query・σ・述語の量化・判定保留・出どころ・1 段評価は変えない。ラムダ・高階関数・再帰は入れない。古い書き方は残さず定義エラーで案内する。各段で `./gradlew test` を緑に保つ。
      - **決めたこと**（2026-09-27）: 古い書き方は残さない・語は `all`・検査の中でも `all: {match}` を許す・`each` も同時に入れる・`count` は配列の件数で `length` は文字数。
  - head: |-
      | ID | 項目 | 内容 | 状態 |
      |---|---|---|---|
    rows:
    - id: R32-01
      title: 文書
      cells:
      - ADR-0010。CORE-CALCULUS §7（値は項・関数と形を受け取る語）と §9（`all` / `each` / 関数）の書き直し
      - 完了
    - id: R32-02
      title: 値の型
      cells:
      - 式の値を項と出どころに。`[*]` を含む読み出しは配列。比較・穴埋め・四則演算はスカラーだけを受け取り、配列は得られない。書き方は変えない
      - 完了
    - id: R32-03
      title: 集計の関数化
      cells:
      - '`sum` / `min` / `max` / `count` を配列を受け取る関数に。`count` は配列の件数・`length` は文字数。古い書き方は定義エラーで案内'
      - 完了
    - id: R32-04
      title: '`all`'
      cells:
      - 同じ起点の全ての解にわたる形と、起点を固定した照合の形（`from` は起点の束縛。ビューでは省略＝行の要素）。検査とビューの両方
      - 完了
    - id: R32-05
      title: '`each`'
      cells:
      - '`{each: 配列の式, value: 式}`。各要素をいまの要素として式を当てる'
      - 完了
  - text: '**結果**: 式の値は項と出どころ（`SemanticCheckSide.node` / `elements`）。読み出しは項を返し `[*]` は配列。`sum` / `min` / `max` / `count` は配列を受け取る関数、集合から配列へは `all`（解の一覧の形と `from` で起点を固定した照合の形。検査の中でも可）、要素ごとの式は `each`。古い書き方は定義エラーで案内。家計簿の試作で、月×費目の金額の表と「期首残高の連続」の検査（絞り方の違う 2 つの合計）が書けることを確かめた。テスト: `SemanticAllTest`・`AllFromCheckTest`・`ViewsTest`。'
