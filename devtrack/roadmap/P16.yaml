id: P16
number: 16
title: 値型と決定論的射影
status: done
status_note: 完了。需要待ちの残りは BACKLOG UX-128
history:
  - id: RH-024
    title: 'P16: 値型と決定論的射影（値レベルの決定論的変換） 📋 構想'
    body:
      - text: |-
          狙い: 段階的詳細化（概念データモデル→Javaエンティティ→テーブル定義など）には、機械的に置き換え可能な領域が一定数ある（例: 「ユーザ名: 4〜100文字の文字列」→ `String`＋`@Size(min=4, max=100)` → `varchar(100)`）。これをLLMではなく**宣言的・決定論的なルール**で導出し、導出元の変更が参照時に自動反映される状態を作る。アーキテクチャの先例は揃っている: 決定論的導出のパターンは派生スキーマ（R11-03: ロード時コンパイル・読み取り専用・`noteDiskChanges` での再導出）、参照時解決の器はビュー機構（ARCHITECTURE §4.14: データを持たない射影。バックリンク列＝派生表示列の先例）、写像語彙は `DeriveTypeRule` / skill列マッピング（path / map / default・`{パス}` プレースホルダ）。欠けているのは「値レベルの決定論的変換」の一級語彙と、導出の材料になる機械可読な制約の2点。

          方針（検討済みの設計境界）:

          - **導出結果は原則永続化しない**: 表示層の射影（計算列）とエクスポートで受ける。仮想派生文書（`derive:` の文書版）は、原本主義と索引・カタログの「ファイル実在」前提を崩すため採らない。
          - **実体化する下流**（テーブル定義書のように手書き項目・意図的上書きが本質的にある文書）は「宣言値（原本）＞導出既定値」の**フィールド単位**合成とし、不一致はドリフト検証で可視化する（黙って書き換えない）。
          - **変換は宣言に閉じる**: lookup（ref の前方トラバース）＋テンプレート（`{パス}` 置換）＋値辞書（map）＋default のみ。任意式・コード実行は導入しない（kind: run の明示許可制の境界を維持）。
          - **命名変換（論理名→物理名）は計算しない**: 日本語→英語は決定論的でない（＝翻訳）ため、物理名は設計判断としてデータに書く（AI生成による一括起案は既存機能で可能）。
          - **評価器は1実装に一元化**: 計算列・整合検証・スキャフォールド・決定論的アクティビティの全消費者で共有する（`Display` / `AiHttp` と同じ流儀）。
      - head: |-
          | ID | 項目 | 状態 | 内容 |
          |---|---|---|---|
        rows:
          - id: R16-00
            title: 'Step 0: 既存機能のみの運用試行'
            cells:
              - ✅
              - 'sample-workspace の todos ワールド（既存の値型台帳 `VALUE-TYPE-*` を持つ `todos/00-concepts.yaml`）の上に構築。**値型レベル**: 型写像文書（`todos/15-ddl-type-mapping.yaml`
                / `16-java-type-mapping.yaml`）の写像行を値型と**同一IDの出現**（1:1詳細化）として宣言し、存在は出現ベースカバレッジ（`detailIn`）で検証、`_views/value-type-mappings.yaml`
                が概念定義と写像を1行に結合する（写像行を `ref` でなく同一ID出現にしたのは、グリッドのバックリンク列が参照元のIDしか表示できず、同一ID出現なら通常列で写像先の値を結合できるため）。**項目レベル**:
                エンティティ実装設計（`todos/20-entities.yaml`）・テーブル設計（`todos/14-tables.yaml`）の各行をプロパティ `FLD-*` の同一ID出現として作成し、「全項目が実装・テーブルへ反映されていること」（完全性検査）が既存の
                `detailIn` だけで機械化できることを確認。`_views/field-traceability.yaml` が概念→実装→DDLの連鎖を1行表示する。写像テンプレート（`varchar({maxLength})`
                等）は**未評価のデータ**で、実装設計・テーブル設計には手評価の結果（`varchar(100)` 等）を書いた——この重複が R16-02（自動評価）・R16-03（適合検証）の要求仕様そのもの。**確認済みの穴**:
                実装型を写像と矛盾する値（String→Int）へ変えても現状の検証は沈黙する（R16-03 が埋める）'
          - id: R16-01
            title: 制約語彙
            cells:
              - ✅
              - '`FieldDef` に `minLength` / `maxLength` / `pattern`（string / text）・`min` / `max`（int / number）を追加（[FEATURES.md](../FEATURES.md)
                S-18）。実行時検証（値が入っているときだけ・ERROR）・`$ref` 合成・メタスキーマ検証（型適合・範囲逆転・不正正規表現）・AI生成の JSON Schema への伝搬（minLength / maxLength
                / pattern / minimum / maximum）。フォーム表示は UX-14 の枠色が自動で受ける。サンプル: `todo-table-design` の `tableName`（小文字スネークケース・30文字以内）'
            features:
              - S-18
          - id: R16-02
            title: 計算列（computed projection）
            cells:
              - ✅
              - 'グリッド列の `computed:`（[FEATURES.md](../FEATURES.md) X-09）: 評価器 `schema/Projection`（`{パス}` テンプレート置換＋値辞書。1段評価・任意式なし）と、`lookup`（ref
                の1ホップ）・`source`（元値を読む出現）・`values`（プレースホルダ解決スコープ）・`map`・`default` の列語彙を実装。バックリンク列と同じ「編集不可の派生表示・座標は導出規則の位置」の流儀で、グリッドUI・`read_view`（「計算値」の印）・CLI
                `view`・エクスポート（`source.view`）へ自動波及。リント（参照スキーマ・パス）・パース排他（`path`／`backlinks`／`editable`）・`builtin-view` の対更新・`ViewsTest`
                の一気通貫検証。設計は ARCHITECTURE §4.26。sample-workspace の `_views/field-traceability.yaml` が手書き宣言値と導出値の並置例（導出元の maxLength
                変更で導出列だけが追随することを確認済み）。**見送り**: 文書ビューへの計算表示・DDL等のテキストエクスポート形式は需要が出たら追加（評価器・列解決は共有できる形になっている）'
            features:
              - X-09
          - id: R16-04
            title: 計算列のUX改善
            cells:
              - ✅
              - '第1回UX試験の指摘（UX-01/02）を実装（[FEATURES.md](../FEATURES.md) X-09）。**来歴の一級化**: `Projection.evaluate` がプレースホルダごとの解決トレースを返し、`ViewCell.trace`（元値＋入力値の座標）として運ぶ。UIのセルクリックは導出の説明（元値→結果）と行き先の選択（導出規則・各入力値・未解決の説明）をポップアップで提示（モーダルではなく
                DropdownMenu。§4.24 整合）。`read_view` の導出行・CLI `view` の `derivation` 節で人間とAIが同じ来歴を見る。**未保存追随**: `AppState.editVersion`（`OpenDocument.onEdited`
                で進む全文書横断の編集カウンタ）をグリッドが購読し、他文書の未保存編集・Undo/Redo でも評価値が追随（「未保存で確認→OKなら保存」）。§4.26 の鮮度の不変条件を「未保存編集に追随する」へ改訂済み'
            features:
              - X-09
          - id: R16-03a
            title: 整合検証の基盤
            cells:
              - ✅
              - 'スキーマの `consistency:` ルール（[FEATURES.md](../FEATURES.md) V-07）: 導出の宣言（`schema/Derivation.kt`）・解決（`index/Derivation.kt`）を計算列から共有化へ切り出し（依存方向上
                core の Views からは Validator が使えないため。ARCHITECTURE §4.26）、「ID要素の値 = 導出値」の等値判定を `Validator.validate` に一元化。判定保留（値未記入・写像行なし・未解決プレースホルダ）は沈黙、`level`/`activeFrom`
                はカバレッジと同じ語彙。テンプレート健全性（UX-12）＝解決不能プレースホルダを導出元文書の編集中にその場で警告。変更セット適用・ステージングはオーバーレイ loader で判定＝エージェントゲートに自動で乗る。`ConsistencyTest`
                で一気通貫検証。sample-workspace の TODO-ENTITY-DESIGN／TODO-TABLE-DESIGN に実ルールを追加（String→Int の型ドリフト・validation の 100→120
                改変が座標つき警告になることを確認済み）'
            features:
              - V-07
          - id: R16-03b
            title: 適合（包含）判定
            cells:
              - ✅
              - '整合ルールに `assert`（`equals`＝既定／`lte`／`gte`。[FEATURES.md](../FEATURES.md) V-07）を追加。lte / gte は両辺を数値として比較し、数値でなければ判定保留（哲学は
                §4.26 のまま）。前提の参照連鎖として todos ワールドに「画面入力→値型」を実装（`todo-screendef` に `maxLength` フィールド＋整合ルール「入力欄の maxLength は参照する値型の
                maxLength 以下」、taskadd のタイトル入力をスキーマ準拠＋値型参照へ更新）。maxLength 200 の入力欄が「導出値「100」以下である必要があります」と指摘されることを CLI で確認済み。**見送り**:
                文字列・enum 集合の包含（列挙の部分集合等）は実需が出たら拡張'
            features:
              - V-07
          - id: R16-03c
            title: 修正のワンクリック化（検証体験の強化パッケージ）
            cells:
              - ✅
              - '第2回UX試験の指摘（UX-13〜16）を実装（[FEATURES.md](../FEATURES.md) V-07）。整合指摘に来歴（`Issue.derivation`）を添付し、検証タブのクリックで「エラー箇所へ／導出規則へ／入力値へ／**導出値を適用**」の選択メニューを提示（計算セルの来歴ポップアップと同じ流儀。適用は通常編集経路＝未保存・Undo可）。あわせて指摘フィールドの枠色づけ（UX-14。全指摘種別に効く）・カバレッジ出現先への不足案内（UX-15。INFO・未保存追加で消える）・明示的除外の規約（UX-16。`excluded:
                true` の同一ID出現＝黙った欠落と意図的除外の区別）を実装。**見送り継続**: 複数文書一括の決定論的伝播（疑似セッション→`apply_patch`。実需が出るまで）'
            features:
              - V-07
      - text: '**P16 完了（2026-08）**: 「概念→実装→物理」の機械的に置換可能な領域を、宣言的ルール（値型台帳・型写像・計算列・整合検証）で決定論化する構想が一巡した。①値型と写像は台帳のデータ（Step 0 の規約）、②導出値は計算列で参照時に表示（R16-02。来歴・未保存追随
          R16-04）、③実体化した下流のドリフトは整合検証で検出し（R16-03a）ワンクリックで修正（R16-03c）、④制約の流れは適合判定で型検査（R16-03b）、⑤制約はスキーマ語彙としても宣言可能（R16-01）。UX試験（P17）との往復で仕様を確定させる進め方（試作→触る→BACKLOG→チューニング）が定着した点も本フェーズの成果。見送り分（文字列・enum集合の包含判定、複数文書一括の決定論的伝播、除外規約の再設計
          UX-17）は需要が出た時点で個別に起こす。'
