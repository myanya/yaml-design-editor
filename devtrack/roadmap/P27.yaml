id: P27
number: 27
title: スキーマ2層化
status: done
status_note: 完了
history:
- id: RH-031
  title: 'P27: スキーマ2層化（Phase D の独立テーマ化） ✅ 段A・段B・段C・段D 完了（2026-09-22。R27-01〜21・意図的差分 D-27〜D-38）。**パッケージ改名（D-3 の前半）も同日完了＝BACKLOG UX-119**（`dev.toros.yde.<モジュール>.*`。規則は CONVENTIONS §8-3・対応表は ARCHITECTURE §2）'
  body:
  - text: |-
      > **進め方（2026-09-20 オーナー決定）**: P29 Phase 6 で検査の語彙はすべて YAML の定義になったが、その検査を**実行して結果を配る仕組み**は root のアプリ側に残り、作りも古いままだった（今後のテーマの精査で実測・確認した弱点＝BACKLOG UX-113〜116）。そこで P27 は「検査を実行する仕組み」から始める——**段A＝指摘のデータの形を決める → 段B＝検査の実行をカーネルへ移す → 段C＝スキーマ2層の導出（下表 D-1・D-2）→ 段D＝残り（D-3・D-4 の残部）**。段A と段B を先に置くのは、段C で分割したあとの意味スキーマ層の出力が、この「検査の結果と指摘のデータ」そのものになるため（先に形を決めておけば、段C は入力側の組み替えだけで済む）。あいだに挟む小さな項目: 段A のあとに**クエリの意味の整理**（UX-108・UX-106・UX-109。利用者が自分で検査を書き始める前に直す）、段B の前に**規模の計測**（大きさを指定して合成ワークスペースを作り、時間の伸び方を先に知る。UX-116）。
      >
      > **`cases` は yaml-core に残す（2026-09-20 オーナーの判断）**: `cases` は選択肢（enum）の一部であり、見るのは同じ object の中の選択肢の値だけで、索引も他の文書も見ない（1つの文書の中で閉じる＝文法プリミティブの境界の内側）。下の仮説の「選択肢を足せば足りる」の「選択肢」は、値によって有効な属性が変わる形（`cases`）を含むものとして読む。`requiredFrom`（同じ文書のフェーズの値だけを見る）と ID・参照の型の扱いは、段C の設計で決める。

      | 段 | 内容 | 状態 |
      |---|---|---|
      | 段A（R27-01） | **検査の結果の4つと、指摘の出どころ**: ①検査1件 × 要素1つの結果を**違反・充足・保留・対象外**の4つに分ける（保留＝データの不備で確かめられなかった／対象外＝確かめるものが無い。理由つき）。判定はカーネル `semantic.SemanticRules`（判定の保留の規則 CALC-17 もここへ集めた。root の `RuleDiagnostics` は根拠を文面へ写すだけ）。遷移検証のチェッカーも「判定しなかった種類とその理由」を返す ②検査の出どころ `schema.RuleOrigin`（どの文書の・どの書き方から展開された・何番目の検査か）を、スキーマの読み込みが展開の記録から付ける ③指摘 `Issue` に出どころ `IssueSource`（検査の出どころ・呼び名・対象の要素・配り方 `IssueDelivery`＝報告先／他の出現への案内／直せる場所への案内／値の場所／参照の場所・根拠に関わった要素の全件）④判定を保留した検査は、指摘にはせず、検証の結果（`Validator.validateDetailed` の `ValidationResult.withheld`）に内訳つきで残す ⑤載せ替え: 提出ゲート `no-new-errors` は（検査, 要素, 配り方）で見分け、根拠に関わる要素が増えたときだけ新しいエラーとする／準備完了レポートは他の出現への案内を重ねて数えず、保留の件数と内訳を出す／検査の状況は保留を「判定保留（理由）」と表示し充足に数えない（意図的差分 D-26）。CLI `validate` は保留の内訳と件数（あるときだけ）を出し、`--sources` で指摘の出どころを出す。**検証の指摘（文面・重大度・場所）は変わらない**——テンプレート・サンプル・specs の `validate` と `readiness` の出力は変更前と完全一致。仕様 CALC-31・CALC-32。`CheckOutcomeTest` 5本・semantic-core `SemanticRulesTest` 5本。**残したもの**: 定義体を通らない指摘（構造の検証・参照の解決・ID の重複）はまだ出どころを持たない／値・参照の場所へ出す検査の保留は集めていない（どちらも、ワークスペース単位で1回だけ評価する段B で扱う） | ✅ 2026-09-20 |
      | （小・R27-02） | **クエリの意味の整理**（BACKLOG UX-108・UX-106・UX-109。意図的差分 D-27。ARCHITECTURE §4.38）: ①参照を書いた要素は、向きによらず「その参照を含む最も内側の ID を持つ要素」——`dir: out` はその要素が直接書いた参照だけを辿り、`dir: in` と対になる（値の式 `refCount` も同じ）②入れ子を辿る線 `edge: {contains: true}`（直下に入れ子になった要素へ。`dir: in` は外側へ。文書ノードとの間は、いちばん外側で書かれた要素。`repeat` と組み合わせられる）——以前の「入れ子の要素の参照も辿る」挙動は、`contains` を何段でも辿ってから参照の線、という部品の組合せとして残る ③`via` は参照が書かれた場所の末尾のキーの並び（1語なら今までどおりキー名。`target.ref` で場所を区別できる）④AI 生成のプレビューは、提案の内容を重ねた索引で検証する（新しく書かれた ID にも定義体の検査が効く）。**影響の実測**: ①の変更の前後で、テンプレート・サンプル・specs の検証結果・ビューの出力・全テストは1件も変わらなかった。`QueryNestingTest` 6本・`PreviewValidationTest` 1本 | ✅ 2026-09-20 |
      | （小・R27-03） | **規模の計測**（BACKLOG UX-116。ARCHITECTURE §4.39）: CLI `bench [--modules 2,4,8,16] [--keep <dir>]`＝大きさ（モジュールの数）を指定して合成ワークスペースを作り（`core/Bench.kt`。ユースケース・画面と入れ子の画面項目・画面遷移・処理の呼び出しの連鎖・テスト項目。検査の語彙をひととおり使い、検証エラーは0）、開く・全体を検証する・準備完了レポートを作る、の時間と、前の大きさとの伸び方（時間の伸び ÷ 文書数の伸び。1.0 前後なら文書数に比例）を出す。**実測**: 開く時間は文書数に比例。全体の検証は**規模の2乗に近い伸び**（32モジュール＝523文書・2,125要素で 8.8 秒）。プロファイルで見つけた、作りを変えなくても直せる原因3つを直した——①クエリの評価のたびに全参照の逆引き表を作り直していた（→グラフにつき1回。`SemanticEntityGraph.refIndexFor`）②起点を固定した評価でも全要素を総なめして起点を探していた ③グラフ整合（宣言のない関係名）が、文書ごとにカーネルのグラフを作り直し、全参照を調べ直していた（→索引につき1回。`KernelIndexView.integrityIssues`）。あわせて「すべての要素について」の相手の集まりを覚えるようにした。**8.8 秒 → 3.3 秒**（検証結果は完全一致）。**残る伸び（伸び方 1.6〜1.9）は、文書ごとに同じ検査を評価し直す作りそのもの**（直せる場所への案内が、詳細文書ごとに全 ID を調べる／遷移検証と他の出現への案内が、文書ごとに評価し直される）で、段B の入力。`BenchTest` 2本 | ✅ 2026-09-21 |
      | 段B-1（R27-04） | **検査の評価を、同じ索引の上では1回だけにする**（ARCHITECTURE §4.39）: カーネルに検査の評価の覚え書き `semantic.SemanticCheckSession`（検査 × 要素の結果・専用チェッカーの1回分・検査に紐づく計算を、同じ走査結果の上で1回だけ求めて覚える。検査は中身ではなく同じものかどうかで見分ける）を置き、索引の一式（`KernelIndexView.checkSession`）と同じ寿命にした。全体を回す経路（`Workspace.validate`＝CLI `validate`・準備完了レポート・提出ゲートの基準、`Staging.validateAll`、変更セットの適用、アプリの全体検証）が共有する（`Validator` の `shareEvaluations`）。直せる場所への案内は、違反している要素の一覧を検査ごとに1回だけ求める。**設計の判断**: 「毎回ワークスペース全体をまとめて評価する」形にはしなかった——アプリで1文字打つたびに全体を評価することになり、開いている文書だけを検証する今より遅くなるため。聞かれた「検査 × 要素」だけを評価して覚える形なら、文書1つの検証は今までどおり軽く、全体の検証は文書数に比例する。共有してよいのは、loader の中身が索引と同じ内容の呼び出しだけ（提案のプレビューなど、索引に重ねていない内容の検証は共有しない＝既定）。**実測: 伸び方が 1.0 前後になった**（32モジュール＝523文書で 8.8 秒 → 0.76 秒。256モジュール＝4,107文書・16,909要素でも 6.1 秒・伸び方 0.95〜1.07）。指摘と保留は、共有する・しないで1件も変わらない（`BenchTest`）。テンプレート・サンプル・specs の出力は完全一致 | ✅ 2026-09-21 |
      | 段B-2（R27-05） | **検査の定義の読み込みを、アプリ側とカーネル側で1つの実装にする**（ARCHITECTURE §4.40）: 組込み定義体と利用者の定義（functions / vocabulary）を集める・スキーマの検査（constraints と語彙）を基本の検査へ展開してパースする・検査の出どころを付ける・語彙のキーをメタスキーマの「知っている項目」へ足す、を workspace-core の `CheckCatalog` へ移し、root の `SchemaLoader` とカーネルの `WorkspaceReader` が同じ実装を使う（移動であって複製ではない）。カーネルのスキーマ（`WorkspaceSchema`）が検査（`constraints` / `checkers` / `expandedChecks`）を持つようになり、派生スキーマも導出元の語彙を引き継ぐ。**結果**: 検査の中身と出どころは、アプリ側とカーネル側で完全に一致（`KernelCheckLoadingTest`）／定義の誤りはカーネル側でもスキーマの読み込みエラーになる／利用者の語彙のキーが、カーネル側で「スキーマに定義されていない項目」と警告されなくなった（BACKLOG UX-105 解消）。検証結果は完全一致。**残**: カーネル側の CLI は、読み込んだ検査をまだ評価しない（次の小段） | ✅ 2026-09-21 |
      | 段B-3・B-4（R27-06） | **定義体の検査を評価して文書へ配る部品をカーネルへ移し、カーネル側の CLI も検査を実行する**（ARCHITECTURE §4.41・意図的差分 D-28）: root の `Validator` の配り方の規則（報告先・他の出現への案内・値と参照の場所・直せる場所への案内・保留の収集）と `RuleDiagnostics` の文面の組み立て・エラー時の対応の導出・検査の状況を、カーネルの座標で workspace-core の `validate.WorkspaceChecks` へ移した（root の `RuleDiagnostics.kt` と `ReferenceSources` は削除。`IssueSource` などの型もパッケージ名のまま移動）。root の `Validator` は結果を `Issue` へ写すだけ。カーネル側の CLI `workspace validate` は `WorkspaceCheckRunner.deliverAll` で全文書へ配り、「検査」の区分と保留を出す（検査のエラーで終了コード 3）。**確かめ方**: コミット済みの版をクリーンビルドして比べ、テンプレート・サンプル・壊した合成ワークスペース（違反21件・保留1件）の出力が、出どころまで完全に一致。アプリ側とカーネル側の結果の一致は `KernelCheckLoadingTest`・cli の契約テスト。`bench` の伸び方は 1.0 前後のまま。BACKLOG UX-115 解消 | ✅ 2026-09-21 |
      | 段B の残り（R27-07） | **コードで実装された検査の指摘にも出どころを付け、値・参照の場所へ出す検査の保留を集める**（ARCHITECTURE §4.37・意図的差分 D-29）: ①構造の検証・ID の重複・参照の解決・宣言のない関係名・ID のパターンからの逸脱・重複所有・テンプレートの健全性・YAML のパースエラーの指摘にも、定義体の検査と同じ形の出どころ（`IssueSource`）を付ける（カーネルの `validate.CodedChecks`。検査の出どころの owner は `(code)`・`at` は検査の名前・`kind` は指摘の種類・対象の要素は指摘の場所を含む最も内側の ID を持つ要素・`within` はその要素の中の場所＝番号を除いたキーの並び・参照の相手は根拠に関わった要素）。指摘の種類は、文面から読み取らず、指摘を作る場所がデータとして付ける（yaml-core `StructuralIssueKind`・semantic-core `SemanticIssueKind`）②提出ゲート `no-new-errors` は、これらも出どころで見分ける——**要素の挿入で場所の番号がずれても、前からある構造・参照のエラーを新しいエラーに数えない**（未解決の参照の文面は場所を含むため、以前は必ず新しいエラーになっていた）。同じ出どころの指摘が複数あるときの比べ方を、指摘の並び順に左右されない形にした③値の場所へ出す検査（整合検証など）の保留は、その値が書かれた文書で、参照の場所へ出す検査（対象型など）の保留は、対象の要素の報告先の文書で集める④CLI `validate --sources` はすべての指摘に出どころを出し、カーネル側の CLI の機械可読の出力も出どころを添える。**確かめ方**: テンプレート・サンプル・specs・壊した合成ワークスペースの `validate` と `readiness` の出力は、変更の前後で完全に一致（`--sources` は出どころが増えた分だけの差）。`CheckOutcomeTest`（出どころ・提出ゲートの場所のずれ）・`ConsistencyTest`（値の場所へ出す検査の保留）。**残したもの**: 検証パネル（UI）に保留は出していない／root にだけ残る検査のカーネル化は段D | ✅ 2026-09-21 |
      | （記録） | 当初の段B の記述（すべて完了）: 検査の実行をカーネルへ移す: ワークスペース単位で「検査 × 要素」を1回だけ評価して指摘を文書へ配る／カーネルのスキーマ読み込みが定義体（constraints・functions・vocabulary・checkers・組込み定義体）を読む／root の `Validator` は結果を写すだけにする／カーネル側 CLI をアプリと同じ結果に（UX-115。UX-105 も同時に解消）／定義体を通らない指摘にも出どころを付ける | ✅ |
      | 段C | スキーマ2層の導出（下表 D-1・D-2）。**設計の判断点 SC-01〜06 は、オーナーが推奨のとおり決定（2026-09-21。下の「段C の設計の判断点」）。導出の方法（汎用の「YAML から YAML への変換」の内部利用の1つにする）は、議論を深めてから決める** | 📋 |
      | 段C の土台（R27-08） | **YAML から YAML への変換の土台**（計算体系の6つ目の体系「組み立て」。CORE-CALCULUS §26・ARCHITECTURE §4.42・FEATURES C-15）: 宣言 `schema/Transform.kt`（`TransformDef`・ひな型）と評価器 `semantic/Transform.kt`（`SemanticTransform`）を semantic-core に置いた。選ぶ＝既存のクエリ（書かなければ渡された項1つ）／組み立てる＝`$copy`・`$format`・`$map`・`$first`・`$each`・`$eachEntry`・`$concat`・`$when`／規則を子に当てる＝`$apply`（同じ規則を同じ場所へ当て直す定義はエラー＝必ず終わる）。結果は新しい項と、各値の出どころ。保存しない。CLI `transform`（試作台）。**最初の内部利用＝構造のスキーマの導出の素案**（R27-09 で組込みの変換定義 `builtin-transforms/structural-schema.yaml` になった）: 導出したスキーマで検証した結果は、fixture の文書と、実データ（テンプレート・サンプル・specs の81文書）で、今の検証結果と一致（違いは属性付き参照の1件だけ＝yaml-core が「値の形ごとの決まり」をまだ知らないため。C-1 で足す）。ID の項目が空のときの文面の「（ID）」が付かなくなる違いが1つ分かっている（C-1 で、意図的差分にするか文面を保つかを決める）。**まだ、検証の経路は切り替えていない**（アプリと CLI の検証結果は1件も変わらない） | ✅ 2026-09-21 |
      | 段C の C-1（R27-09） | **構造の検証を、導出した最小の構造のスキーマへ切り替えた**（ARCHITECTURE §4.43・意図的差分 D-30）: ①yaml-core に最小の構造のスキーマ（`structure` パッケージ。ID・参照・フェーズ・表示のヒントを知らない。値の形ごとの決まり `shapes` を持つ）と、その読み取り・検証を置いた ②導出を組込みの変換定義にした（`builtin-transforms/structural-schema.yaml`。R27-08 の素案を移動）。入力は、スキーマの項目の木を YAML の項へ書き出したもの（`FieldYaml`）——派生スキーマや、語彙のキーを足したメタスキーマも同じ経路 ③導出と検証の入口を workspace-core の `DerivedStructures` の1つにし、アプリ（root の `Validator`）とカーネル（`WorkspaceReader`・セッション・cli）の両方をここへ切り替えた。フェーズに達したら必須の畳み込みと、定義されていないフェーズの申告の警告は、ここ（意味の側）が行う。**確かめ方**: テンプレート・サンプル・specs・合成ワークスペース・共通 fixture の全221文書（スキーマ文書へのメタスキーマの適用を含む）で、旧い検証と指摘が並び順まで一致。`validate`・`readiness` の出力は、変更の前後で完全に一致。速さは、導出の固定費（数十ミリ秒）のほかは変わらない。変わるのは D-30 に登録した文面（ID が空のときの「（ID）」・属性付き参照の `to` の欠落と形の違い）と、ID にスカラーでない値が書かれたときの警告だけ。**残（C-2）**: 利用者が書く木（`FieldDef`）とその読み取り・`cases` の合成・フェーズの読み取りが、まだ yaml-core にある。旧い検証 `StructuralValidator` は、比べる相手としてだけ残している | ✅ 2026-09-21 |
