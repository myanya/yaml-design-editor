      | 段D の D-d の2つ目の後半と D-e（R27-21） | **`IdIndex` ファサードの型の解消と、`Path` 座標の整理は、1つの仕事**（2026-09-21 の実測）: ファサードの型（`IdEntry` / `RefEntry`＝ファイルの場所を `Path` で持つ）と、カーネルの型（`ScannedId` / `ScannedRef`＝ワークスペース相対の文書ID で持つ）の違いは、座標だけ。root の中では「文書ID の値＝絶対パスの文字列」と決めて写しており、この前提に頼る箇所が、`Path.of(d.value)` の形で約45・型を写す呼び出し（`toScanned` など）で約20（`index/Query.kt`・`core/Views.kt`・`core/Aspects.kt`・`validate/Validator.kt` など）、ファサードの型の名前を書いているのは main 約20ファイル・約180行と、テスト13ファイル・33行、`state.overlayIndex()` の呼び出しは 54 か所。型を無くすには、画面・エージェントの道具・読み出しモデルが、ワークスペース相対の文書ID を直接扱い、ファイルを開く所でだけ `Path` へ直す形にする＝D-e の「`Path` 座標の整理」と同じ変更になる。画面（Compose）は自動テストがほとんど無いので、進めるなら、層ごと（①`index/*` と読み出しモデル ②エージェントの道具と CLI ③画面）に分け、層ごとに触り心地の確認（UX シナリオ S1）を挟むのが安全。得られるもの: 座標の写しと、それに伴う取り違えの余地が無くなる・索引の二重持ちが無くなる。利用者から見える機能は増えない **オーナーの判断（2026-09-22）: 画面まで含めて進める（案B）——「まずは、しっかりとここまでやりましょう」**。パッケージ改名（D-3）は、これを終えて、オーナーの動作確認が済んだ時に時期を考える（BACKLOG UX-119。モジュールごとにしっかり分ける方針・IDE のリファクタリング機能でオーナー自身が実施してもよい） **実装（R27-21。2026-09-22・意図的差分 D-38・ARCHITECTURE §4.48）**: ①root の索引・検証・ビュー・クエリ・エンティティの全体像の型を、カーネルの型の別名にして、写しを無くした（`index/SemanticBridge.kt`・`index/EntityGraph.kt`・`index/Derivation.kt` を削除。`index/` は 751 → 333 行・`core/Views.kt` は 463 → 241 行・`Path.of(d.value)` は 42 → 3）②場所を、画面まで含めて、ワークスペース相対の文書ID に揃えた（`Path` は、ファイルを開く・文書キャッシュを引く・ディスクから読む端だけ）③アプリがワークスペースを2回読み込んでいたのを、1回にした（`WorkspaceSession.fork`。2つのセッションは別物のまま＝二層は変えない。開く時間は sysdev-template で 190 → 112 ms・400 文書で 508 → 300 ms）。root の CLI の 190 の出力とカーネル側の CLI の検証の出力は、変更前と完全に一致・全テスト緑・`bench` は線形のまま。**オーナーの触り心地の確認（2026-09-22・UX-SCENARIOS §3.5）＝「基本的には問題なし」。気づきは UX-120〜124 に登録（戻るがジャンプ直後に効かない＝バグ・場所の項目名が物理名だけ・再読込後の Undo は要議論 ほか）** | ✅ |

      > **段C の設計の判断点（2026-09-21 起草・同日オーナー決定）**
      >
      > **オーナーの決定（2026-09-21）**: SC-01〜SC-06 は、いずれも推奨のとおり。あわせて2つの指示があった。
      >
      > - **SC-01 導出の方法は、議論を深めてから決める**: 構造のスキーマの導出を、その場かぎりのプログラムにせず、**汎用にした「YAML から YAML への変換」の内部利用の1つ**にする。入力の選び方には既存のクエリを活用するのが望ましいが、YAML から YAML への変換として機能が足りないなら、それを見据えた形にする。いずれはビューなど様々なところでこの変換を使い、さらに汎用の変換器の土台として、テンプレートエンジンなどの派生を足して YAML から Markdown への変換器なども作っていく——それを意識した設計にする。→ 段C の C-1 に入る前に、変換の形（既存の変換に当たる仕組みの棚卸し・足りない機能・形の案・判断点）を整理して議論する。
      > - **SC-03 値の形式的なチェックは yaml-core に置く**: 値の範囲・文字数・形式・選択肢（選択肢も、実質は値の範囲のチェック）は、yaml-core の構造のスキーマが持つ。意味的なチェックは別（semantic-core）。**分け方の基準**: その値1つと、その項目の宣言だけを見て決まるチェックは形式的（yaml-core）。他の値・他の要素・他の文書・索引・文書のフェーズを見るチェックは意味的（semantic-core）。この基準で、ID の形式（`pattern`）と日付の形式は yaml-core、参照先の絞り込み（`idPatterns`・`scope`）とエンティティ型の ID のパターンからの逸脱は semantic-core になる。
      >
      > **いまの形**: 利用者が書くスキーマは1本の木（`FieldDef` の木）で、構造の検証（yaml-core）・ID と参照の走査（semantic-core）・フォームや AI 生成（アプリ）が、同じ木の、それぞれ自分に要る面だけを読んでいる。木そのものが yaml-core に置かれているため、yaml-core のモデルが、ID・参照・関係・参照先の範囲・フェーズ（`requiredFrom`・`phases`）・表示のヒント（ラベル・説明・タイトルの役割・一覧の見せ方・選択肢のラベル）まで知っている（方針 CORE-CALCULUS §25 の「文法プリミティブは ID・参照・関係・フェーズの意味を知らない」に反している）。スキーマの型も2つある（root の `SchemaDef` とカーネルの `WorkspaceSchema`）。
      >
      > | 判断点 | 問い | 推奨 |
      > |---|---|---|
      > | SC-01 導出の形 | 構造のスキーマを、どう「導出」するか | **別の小さな木を導出する**: 利用者が書く木（＝意味のスキーマ）は semantic-core が持ち、そこから「最小の構造スキーマ」（yaml-core の新しい小さな型: 値の形・必須・値の基本的なチェック・選択肢と `cases`・未定義の項目の扱い・再帰）を導出して、yaml-core で検証する。代案は「木は1本のまま、yaml-core は意味の部分を中身を知らない付箋として運ぶ」——安く済むが、項目の語彙を増やすたびに yaml-core の読み取りを直すことになり、将来「意味の型」（構造の形＋検査＋表示をまとめた、利用者が定義できる型）へ広げられない |
      > | SC-02 `requiredFrom` | フェーズに達したら必須、をどこで解釈するか | **導出のときに畳む**: 意味の側が文書のフェーズを読み、「このフェーズでの必須」を素の必須（`required`）に直した構造スキーマを導出する（フェーズごとに1つ。覚えておく）。yaml-core は `phases` も `requiredFrom` も知らなくなる（実効の必須 `requiredAt` を呼んでいるのは、構造の検証の1か所だけ。フォームは `requiredFrom` を直接読んで注記している）。代案①yaml-core に残す（`cases` と同じく1つの文書の中で閉じる、という理屈。ただし文書のルートの値が文書全体の必須を変えるので `cases` より広く、§25 の「フェーズの意味を知らない」に反する）代案②定義体の検査へ展開する（`activeFrom` つきの「値があること」の検査。ID を持たない入れ子の要素の必須を書けず、フォームの必須の表示と記入の進み具合に別の経路が要る） |
      > | SC-03 ID と参照の型 | 構造のスキーマでは、どんな形として表すか | **ID は文字列（形式と必須つき）・参照は文字列**。意味（索引に載せる・参照先を解決する・関係・参照先の範囲）は意味のスキーマだけが持つ。属性付き参照（スカラーでも `{to, 属性…}` のオブジェクトでも書ける）のために、構造のスキーマに**「値の形ごとの決まり」**（スカラーならこの決まり・オブジェクトならこの決まり）を足す——形を見れば決まりが1つに決まるので、試して戻る処理は要らない。代案: 導出で `any` にして意味の側で検査する（構造の検証が弱くなる） |
      > | SC-04 構造の指摘の文面 | 文面は項目の表示名を使う。表示名は表示のヒント | **当面、構造のスキーマに表示名だけは持たせる**（文面を今と同じに保つ）。指摘の種類（`StructuralIssueKind`）が入ったので、文面の組み立てを上の層へ移すこともできるが、必要になってからにする |
      > | SC-05 表示のヒントと、スキーマの型の一本化 | ラベル・説明・一覧の見せ方・選択肢のラベル・初期値の置き場と、`SchemaDef` / `WorkspaceSchema` の二重 | **利用者が書く木が原本で、項目ごとに「意味」と「表示」の区画を分ける**（木を3本にしない）。タイトルの役割（`role`）は「表示専用」と書かれているが、走査が索引のタイトル（`ScannedId.title`）を決めるのに使っているので、意味の側に置く（一覧の見せ方 `display`・選択肢のラベル `options`・初期値 `default`・説明 `description` は、検証も走査も読まない＝純粋に表示と編集のためのもの）。スキーマの型は、カーネルの1つ（構造＝導出物／意味の宣言と検査／表示）にまとめ、root の `SchemaDef` はアプリに要るもの（ファイルの場所など）だけを足す薄い型にする。スキーマの読み込みの2経路もここで1つにする（下表 D-4 の一部を前倒し） |
      > | SC-06 進め方 | どの順に、何を安全網にして進めるか | **3段＋後回し1つ**: C-1＝最小の構造スキーマと導出を作り、構造の検証をこの経路へ切り替える（結果が完全に一致することを確かめる）→ C-2＝利用者が書く木とその読み取り・`cases` の合成・フェーズを semantic-core へ移す（移動であって複製ではない。パッケージ名は変えない）→ C-3＝スキーマの型の一本化と、表示の区画の切り出し → （⏳ 必要になったら）利用者が定義できる「意味の型」。**利用者のスキーマの書き方は変えない**——3層コア移行の計画書 §17 にある「語彙を JSON Schema に近づける（`fields` → `properties` など）」と「構造のスキーマを構造のスキーマだけで定義する（メタスキーマの自己記述）」は、利用者の書き方と互換性に関わるため段C には入れず、別に判断する。各段で、テンプレート・サンプル・specs・合成ワークスペースの検証の出力が前後で完全に一致すること、変わる箇所は先に意図的差分へ登録すること |
      >
      > **導出の方法＝汎用の「YAML から YAML への変換」の判断点（2026-09-21 起草・同日オーナー決定）**
      >
      > **オーナーの決定（2026-09-21。SQL の SELECT 句との対応と、3つの具体例で説明したうえでの判断）**
      >
      > - **TF-03 規則を子に当てる（`apply`）は必要**: 「本質的に計算器には apply がどうしても必要であり、木構造である YAML では、再帰を扱えることが必須」。入力の木の子へ向かう形で認める。
      > - **TF-02 推奨のとおり「しない」**: クエリを ID の無い場所まで広げない。選んだものの中は、パスで辿れればよい。
      > - **TF-09 推奨のとおり、出力は保存しない**。
      > - **TF-05 は検討メモとして残す（いまは実装に影響させない）**。オーナーの考え: Markdown のテンプレートを、帳票の種類ごとに個別に用意しておく（例: 「テーブル定義書」のテンプレート。値を埋め込む形のひな形が書いてある）。YAML から YAML への変換で、そのひな形が求める値の一式を作る（表の形への変換などは、この段で行う）。テンプレートエンジンは、変換された値の一式から必要な項目をパスで取り出し、構造を Markdown の形へ直しながら、ひな形にはめ込む。——つまり「YAML から YAML への変換（値の一式を作る）→ テンプレートエンジン（ひな形へはめ込む）」の2段で、前段が今回の土台、後段が派生。土台の側に要るのは「出力が、パスで取り出せる素直な YAML であること」だけで、今回の設計はこれを満たす。
      > - TF-01・TF-04・TF-06・TF-07・TF-08 は、上の決定から導かれるものとして、推奨のとおり進める（構造のスキーマの導出を、`apply` を持つ YAML の変換定義で書く）。
      >
      > **いまの形**: 計算体系（CORE-CALCULUS §2）にあるのは、選ぶ（Query）・値を計算する（Expression）・判定する（Predicate）・書き換える（Rewrite）で、**「新しい YAML を組み立てる」体系が無い**。そのため、変換に当たる仕組みは、それぞれが別の書き方と別のプログラムを持っている（棚卸しは下の「変換に当たる既存の仕組み」の表）。
      >
      > | 判断点 | 問い | 推奨 |
      > |---|---|---|
      > | TF-01 変換の基本の形 | 変換を、どんな部品の組合せとして定義するか | **選ぶ × 組み立てる ×（入れ子には）規則を子に当てる**。①選ぶ＝入力のどこを相手にするか ②組み立てる＝出力の形をそのまま YAML で書いた「ひな型」の穴を、値の式で埋める ③入れ子の入力には、名前を付けた規則を子に当てて、その結果をはめ込む。出力は常に YAML の項（木）。計算体系に6つ目の体系「組み立て」として足す（ADR-0009 の手続きどおり、先に体系へ位置づける） |
      > | TF-02 選び方 | 既存のクエリをどこまで使うか | **外側は既存のクエリ、内側はパスと繰り返し**。要素と文書を選んで名前を付けるのは、既存のクエリをそのまま使う。選んだ要素・文書の「中」は、パスと繰り返し（配列の各要素・マップの各項目）で辿る。クエリ自体を ID の無い任意の場所まで広げることはしない（クエリは索引の上の評価と、判定を保留する規則が土台のため）。構造のスキーマの導出は、外側が「スキーマ文書1つ」、内側が項目の木——クエリは使わず、内側の部品だけで書ける。スキーマに沿って文書の中を辿る部品は、書き換えの土台（`SemanticRewrite.walkDocument`）に既にあり、内側の辿り方に使える |
      > | TF-03 入れ子への再帰 | 規則が自分を呼ぶことを認めるか | **「入力の木の子に向かってだけ」認める**。入力は有限なので必ず終わる。CORE-CALCULUS §19 の「利用者が定義する再帰関数は入れない」は、止まらない計算を入れないための決まりで、この形はそれに当たらない、と位置づける（§19 に書き足す）。スキーマの `$ref` は写すだけで辿らない（定義は定義として1回だけ変換する）ので、循環しても終わる |
      > | TF-04 値の式の広げ方 | 組み立てに足りない部品を、どこまで足すか | 今の値の式は文字の値だけを返す。足すのは ①部分木をそのまま写す ②条件に合うときだけ項目を出す ③繰り返しで配列・マップを作る。条件には既存の「値の条件」を使う。式の中の条件分岐（もし〜なら〜、の式）と、キーを計算で作ることは、必要になるまで入れない（「項目を出す条件」と「最初に得られた値」で書く） |
      > | TF-05 出力の種類の広げ方 | Markdown などの文字の出力を、どう派生させるか | **土台は常に YAML から YAML**。文字への書き出しは、土台の外の派生にする。派生の作り方は2つあり、土台はどちらも妨げない——(a) 「文書の形の YAML」（見出し・段落・表・箇条書き）を決めておき、それを Markdown へ書き出す小さな書き出し器を1つ持つ（変換はどれも YAML から YAML のまま。出どころも保てる）(b) 文字のひな型を埋めるテンプレートエンジン。先に作るなら (a)。(b) は、値の式 `format` の延長として後から足せる |
      > | TF-06 出どころ | 出力の各部分が入力のどこから来たかを、結果に持たせるか | **最初から結果の一部にする**（出力の場所 → 入力の文書と場所）。ビューの「セルは原本の場所に解決され、その場で編集できる」・指摘の場所の逆引き・差分の説明に要る。後から足すと、変換を使う側をすべて直すことになる（§20 の確認項目7） |
      > | TF-07 置き場 | どのモジュールに置くか | **semantic-core**（クエリと値の式を使うため）。yaml-core には足さない（構造のスキーマの導出を行うのも意味の側） |
      > | TF-08 既存の仕組みとの関係と順序 | 既存の変換に当たる仕組みを、いつ寄せるか | **段C では、構造のスキーマの導出だけを新しい変換で書く**（組込みの変換定義＝YAML。今の Kotlin の検証と結果が完全に一致することを安全網にする）。ビューの列・skill の書き出し・派生スキーマ・文面のひな型などは「寄せる候補」として台帳に載せ、寄せるかどうかは1つずつ判断する。利用者が変換定義を書ける置き場と CLI は、その次の段（組込みだけの特別な機能にはしない＝利用者にも同じ書き方を開く前提で作る） |
      > | TF-09 出力の扱い（原本主義との関係） | 変換の出力を、ワークスペースの文書として保存してよいか | **保存しない。出力は、メモリ上の読み取り専用の成果物**（派生スキーマ `derive:` と同じ扱い。出どころが原本を指す）。今ある2つの決まり——書き出し skill は YAML への出力を定義の段階で拒否する（原本主義）／導出の結果は仮想の文書として永続化しない——をそのまま守る。原本へ書き込みたい変換（ひな型からの文書の作成など）は、出力の項を「書き換え」（Rewrite）の入力にして、今までどおり変更セットと人間の承認を通す |
      >
      > **変換に当たる既存の仕組み（2026-09-21 の棚卸し）**: 「選ぶ」側は既にクエリへ集約されている（ビューの行・foreach・検査・CLI が共有）。**「組み立てる」側は、約10か所がそれぞれ Kotlin で作り込んでいる**。穴埋めの書き方も揃っていない（`{…}` の穴埋めの実装が8つ——正規表現が3種類＋単純な置き換え＋`$名前` の形）。繰り返しと、入れ子への再帰を宣言で書ける仕組みは1つも無い（繰り返しが要る所はすべて Kotlin のループ）。
      >
      > | 仕組み | 選び方 | 組み立て方 | 宣言で書けるか | 入れ子への再帰 | 単位 |
      > |---|---|---|---|---|---|
      > | グリッドビュー（`_views`） | ID のパターン、またはクエリ。セルは出現ごとの相対パス | 行×列の表。書き出しは Kotlin（画面・文字・CLI の YAML・xlsx / csv / md の4通り） | 選び方と列は書ける。出力の形は書けない | 無い（平らな表） | 要素 |
      > | 文書ビュー | 文書のパターン・パス・`include` / `exclude`・差し込み先 `at`（`[*]` つきのパス＝ID の無い場所も指せる唯一の例） | 区画の一覧。描くのは Kotlin | 同上 | 一部 | 文書 |
      > | 値の式・`{…}` の穴埋め（`Projection`）・導出（計算列） | 束縛からの相対パス・参照を1段辿る | 文字の値1つ（出どころつき） | 書ける | 無い（1段だけ、と明記） | 要素 |
      > | 検査の定義の展開（`functions` / `vocabulary`） | スキーマ文書の最上位の配列だけ | **YAML の木 → YAML の木**（`$名前` の置き換え・`$merge`・`from` / `default` / `map` / `join` / `format`） | **すべて書ける（利用者が書ける YAML から YAML への変換は、今これだけ）** | ひな型の木は辿るが、入力の入れ子は辿らない。繰り返し・条件分岐なし | スキーマ文書 |
      > | 派生スキーマ（`derive:`） | 文書のパターン＋配列のパス | 平らな項目の一覧を Kotlin のループで作る | 宣言は書ける。組み立ては Kotlin | 無い | 文書・配列の要素 |
      > | 書き換え（リファクタリング16操作） | スキーマに沿って文書の木を辿る（`SemanticRewrite.walkDocument`＝**ID の無い場所まで列挙できる、再利用できる部品**） | 操作の列（その場の書き換え） | 書けない | **ある** | 文書（中の場所ごと） |
      > | skill の書き出し・取り込み | 文書のパターン＋配列のパス、またはビュー ／ 表の行 | 列の一覧 → 表 → 形式ごとの書き出し（csv / md / xlsx / json / html はすべて Kotlin の固定の形） ／ パスへの代入 → 変更セット | 列は書ける。Markdown や HTML の形は書けない | 無い | 文書・配列の要素・行 |
      > | AI 生成用の JSON Schema | 選んだ項目の部分木 | 型ごとの規則で Kotlin が再帰的に作る（`cases` → `anyOf`） | 書けない | **ある** | 項目の部分木 |
      > | ひな型の文書・サンプルの生成 | スキーマ＋ファイル名のパターン | 型ごとの規則で Kotlin が再帰的に作る（似た規則の実装が3つある） | 書けない | **ある** | 文書 |
      > | エージェントへの文脈の開示（`Disclosure` / `Traverse`） | ファイルとパス ／ 辿り方の宣言 | 4段階の決まった粒度の文字（Kotlin） | 辿り方は書ける。文字の形は書けない | アウトラインはある | 場所・文書・要素 |
      > | 一括実行 foreach の指示文 | ビュー・指摘・検索・クエリなど | 1行のひな型 `{id}` など | 書ける（最小の「選ぶ × ひな型」の実例） | 無い | 項目 |
      >
      >

      > **構造チェックについてのオーナーの仮説（2026-09-19）**: YAML の構造を検証するスキーマは、本質的には通常の構造チェック（属性の有無・属性の値の型・値の基本的なチェック）に、選択肢（enum）と再帰を足せば足りる。利用者が書くスキーマは意味のスキーマであり、そこから最小の構造チェック用のスキーマを導出して yaml-core で検証する。現在の yaml-core にある解釈寄りの部分（`cases`・`requiredFrom`・ID と参照の型）を意味側へ切り分けるのが本テーマの中身になる。
      >
      > **着手順（2026-09-19 オーナー決定）**: P29 Phase 6（定義層の実体化）の**後**に置く。今の状態で分割すると、個別に実装された検証語彙（整合・多重度・網羅・遷移など）のモデル・パーサ・評価器がそのまま意味スキーマ層の型構造として固定される。Phase 6 で検証語彙を組込み定義体（YAML）へ移してから分割すれば、意味スキーマ層の中身は「定義体の呼び出しの集合 → 核の制約の列への展開」だけになる。

      狙い: ユーザ定義スキーマから**構造／意味の2層スキーマを導出**して各層で検証し、意味スキーマの柔軟性（ユーザ定義を含む）を上げる——P26 の「最終形」を独立テーマとして実現する（移行後リファクタリング計画の Phase D を 2026-08-31 に切り出し）。着手時は単なるクラス分割にせず、構造・意味・表示のそれぞれがどの Calculus を所有するかを明確にした上で進める（[CORE-CALCULUS.md](../CORE-CALCULUS.md) §16・ADR-0009）。

