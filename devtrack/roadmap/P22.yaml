      | ID | 項目 | 状態 | 内容 |
      |---|---|---|---|
    rows:
    - id: R22-01
      title: パターン照合エンジン
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) C-12）。パース（raw Map からの共用パース・日本語エラー。ビュー・foreach・制約・CLI で共用）・評価（EntityGraph の隣接上。安定ソート・経路内再訪禁止・limit）・結果モデル（束縛行＋定義出現座標・タイトルの解決）。`where` のプロパティ値取得は loader 注入。**配置はスケッチの core/Query.kt から変更**: 宣言モデル＋パースは `schema/Query.kt`（`constraints:` が SchemaDef に載るため）・評価器は `index/Query.kt`（R22-03 の判定を `Validator` に置くには validate→core の依存逆転が必要になるため。§4.26 の Derivation と同じ2分割。ARCHITECTURE §4.32 に記録）。テスト: `QueryTest`（決定性・1段分岐・kind: document・limit・述語・オーバーレイ索引の経路差・CLI）'
    - id: R22-02
      title: 消費面の載せ替え
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) X-10 / AG-26 / C-06）。①ビューの `rows: match:`（従来の rows 記法と排他・互換維持。行キーは先頭 bind または `rowKey:`。列の `of:` で結合先の値をセル化——セル編集は各束縛ノードの原本座標ルーティングで §4.14 の不変条件のまま。バックリンク列・計算列と併用可。結合行のID重複は `ViewRow.key`＝束縛値の組で一意化）②foreach の `source: query`（既存5種は存置。束縛ごとの `{scr}` / `{scr_file}` プレースホルダを `targetValues` へ供給）③トラバースの隣接1段を `Query.neighborIds` へ一元化（Traverse は emit レンダラ。`TraverseSpec` の構文・出力は不変＝`TraverseTest` green）④CLI `query`（YAML入力→束縛の表）。`builtin-view` / `builtin-activity` を対更新。sample-workspace に結合ビュー例 `entity-table-matrix` を追加（検証ベースライン エラー5・警告12 は不変）。テスト: `ViewsTest` / `ForeachTest` 拡張'
    - id: R22-03
      title: パターン制約
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) V-09）。スキーマの `constraints:`（`match`＋`expect: exists / absent`・`level`・`activeFrom` はカバレッジと同じ語彙。起点は kind: entity 限定）を「起点束縛ごとのパターンの存在／不在」としてカバレッジの一般形で検証。判定は `Validator`（座標は起点束縛の定義出現・その出現を持つファイルでのみ報告）。判定保留の哲学（型未宣言・未解決参照・母集団外には黙る）。既存 coverage は置き換えない。`builtin-schema` を対更新。テスト: `QueryConstraintTest`（exists / absent・activeFrom・提出ゲート経由）'
  - text: |-
      **実装順の推奨**: R22-01（エンジン）→ R22-02 の③（トラバース載せ替え＝回帰の早期確認）→ ①②④（ビュー・foreach・CLI）→ R22-03（制約）。

      **完了条件の充足（2026-08-10）**: ①2ホップ結合の行がビューグリッド（`ViewRow.key` で行キー化）に表示され、結合先セル（`of:` 列）の編集が各束縛ノードの原本座標へルーティングされる（行はオーバーレイ索引・値は docCache 優先 loader＝UX-03 の経路のまま。sample-workspace `entity-table-matrix` が実例）②foreach がクエリ列挙で一括実行でき、束縛値（`{scr}` / `{scr_file}`）がレシピのプレースホルダへ届く（`ForeachTest`）③既存トラバース・related・ビュー行・foreach 既存5種の出力が回帰しない（`TraverseTest` / `ViewsTest` / `ForeachTest` green のまま）④パターン制約が検証パネル・CLI・変更セット適用・提出ゲートに乗る（`QueryConstraintTest`）⑤「やらないこと」（集約は件数のみ・任意深さの再帰なし・任意式なし・optional 結合なし・分岐は1段）の不変条件が ARCHITECTURE §4.32 に明文化されている。
