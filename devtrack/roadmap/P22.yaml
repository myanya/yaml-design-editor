- id: RH-028
  title: 'P22: 二層モデル③: クエリコア ✅ 完了（2026-08-10）'
  body:
  - text: |-
      狙い: 照会5系統——構造検索（C-05）・トラバース（AG-30）・ビューの行決定（idPattern×schema）・foreach の列挙（AG-26）・導出 lookup（1ホップ。ARCHITECTURE §4.26）——は、いずれも「グラフパターン照合」の断片的な再実装である。単一のパターン照合エンジンに統合し、「1実装・多面開示」（Display / Projection / Traverse の流儀）を照会にも適用する。とくにビューの行が多段結合（例:「画面→uses→ユースケース」の組を1行に）を表現できるようになることが、人間側の最大の機能向上。

      **前提と着手手順**: P20 の EntityGraph に依存（P21 とは技術的に独立だが、整合検証と語彙を揃えるため P21 完了後を推奨）。着手時に本節と §4.9・`core/Traverse.kt`（決定性規約の母体。§4.28）・ARCHITECTURE §4.14（ビューの不変条件: データを持たない・原本座標ルーティング・書込経路を作らない）・§4.27（foreach の3関心事）を読み、**パターン語彙の最終形を ARCHITECTURE へ起こしてから**実装する。完了時は FEATURES.md 登録・MANUAL（ビュー定義リファレンス・CLI）更新・試し方の報告まで。

      方針（承認済みの設計判断）:

      - **語彙は Traverse の `steps` を母体に、束縛（bind）と構造化結果を追加**。実装の基準となるスケッチ:

      ```yaml
      match:
        - node: { entity: screen, bind: scr }      # 起点集合（kind 省略時 entity。kind: document で文書ノード）
        - edge: { relation: uses, dir: out }       # dir: out / in。via（キー名）でも絞れる
        - node: { entity: usecase, bind: uc }
      where:                                       # プロパティ述語（初期は equals / exists のみ）
        - { of: scr, path: status, equals: approved }
      limit: 100
      ```

        結果は**束縛の表**（各行 = `{scr: ID, uc: ID}`。座標・タイトルは EntityGraph から解決）。テキスト開示（emit）はその上の一表現。プロパティ述語の値は「いずれかの出現の該当パスのスカラー」（多段定義の OR。確定は ARCHITECTURE 反映時）。
      - **分岐は1段まで**: 束縛済みノードを起点にもう1本の線形連鎖を足せる（`also: {from: scr, steps: [...]}` 形式を想定）。結合は内部結合のみ（optional 結合は将来・実需待ち）。
      - **やらないこと（着手前に ARCHITECTURE の不変条件として固定）**: 集約は件数のみ・任意深さの再帰パス（`*`）は初期対象外・任意式なし。スプレッドシートエンジン／Cypher を作らない（P16・P19 の規律の継承）。語彙の解禁は実例の需要で段階的に判断する。
      - **決定性**: フロンティアの安定ソート・limitPerHop・budgetChars・訪問済み循環停止は Traverse の規約をそのまま継承し、行の順序も仕様化する（束縛列の辞書順→ID昇順。prompt caching・再現性・テスト容易性のため）。
      - **`kind: document` を最初から語彙に含める**（文書ノード。後付けだとトラバース系の互換に段差が出るため、ここだけは先行決定済み）。
