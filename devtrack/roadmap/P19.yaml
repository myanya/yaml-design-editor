id: P19
number: 19
title: コンテキストエンジニアリングの一級化
status: done
status_note: 完了
history:
- id: RH-025
  title: 'P19: コンテキストエンジニアリングの一級化 ✅ 完了（方針承認 2026-08-09・全項目完了 2026-08-10）'
  body:
  - text: |-
      狙い: エージェント実行の入力トークンが「ワークスペース規模 × ターン数 × 一括実行件数」の積で膨らむ構造問題の解消。実測（2026-08-09、software-template の elaborate-usecase 一括実行16件）では入力238万トークン・1送信あたり15.5〜19Kトークンで、大半は初期コンテキストへ全量展開したビュー（60行）の毎ターン再送だった。チャットAPIはステートレス（全履歴を毎ターン再送）のため、初期コンテキストに置いた宣言は**ターン数ぶん課金される**。一方でエージェントは渡されたビューに頼らず自力探索しており（対象IDが追加指示で来る一括実行ではビューはほぼ死荷重）、「多めの情報の機械的投入」はコストを払いながら精度にも寄与していなかった。中核コンセプトの段階的開示（§4.6）が唯一適用されていない場所が初期コンテキスト——`context.include` / `context.views` は「載せる／載せない」の二値しかない——であり、本フェーズで方針を「**コンテキストは利用者が設計・計測・チューニングする一級の宣言**」へ転換する（§4.2 セルフホスティングの流儀: レシピもアクティビティYAMLの一部）。

      方針（承認済みの設計判断。2026-08-09）:

      - **破壊的刷新**: 旧 `context.include` / `context.views` は廃止し、ロード時定義エラー（移行ヒント付き。`meta` かつ `approval: auto` の定義エラーと同じ流儀）。既存定義は全16件がリポジトリ内テンプレートのため互換維持で守る外部資産がなく、二重語彙の恒久化・全量ダンプ形式の温存・メタアクティビティ（improve-definitions が既存定義を手本にする）経由のレガシー伝播の方が高くつく。
      - **空既定**: `context` 無指定は「指示＋権限＋ゲートのみ」。カタログすら明示宣言制とし、「コンテキストは利用者が設計する」を既定値の意味論に反映する（単発AI生成（R9-01）は既に初期文脈なしで運用実績あり）。
      - **テンプレート同時移行**: 同梱テンプレート16定義を同一変更内で新形式へ移行し、重い6定義（ビュー全量宣言）は絞り込みレシピの実例（お手本）に仕立てる。
      - **計測が先**: コンテキスト会計（R19-01）を最初に入れ、以降の各手の効果を数字で確認しながら進める。
      - **語彙は宣言に閉じる**（P16 と同じ規律）: 絞り込み・予算・条件・経路パターンのみ。任意クエリ言語・任意式は導入しない。
      - **評価器は1実装**: グラフトラバースはレシピ・エージェントツール・CLI の全消費者で共有する（`Display` / `AiHttp` / `Projection` の流儀）。

      グラフの下地は `IdIndex` に実在する: ノード＝論理ID（同一IDの複数出現＝多段定義）、エッジ＝`RefEntry`（`relation`・`viaKey`・参照元スキーマの型付き。`sourceEntryOf` で両端をノード化可能）。欠けているのは多段トラバースの評価器と宣言語彙だけで、消費者は現状すべて1ホップ止まり（`related`・バックリンク列・計算列 `lookup`・`Disclosure.bundle`）。
  - head: |-
      | ID | 項目 | 状態 | 内容 |
      |---|---|---|---|
    rows:
    - id: R19-01
      title: コンテキスト会計
      cells:
      - ✅
      - 2026-08-10 実装（[FEATURES.md](../FEATURES.md) AG-27）。実行記録に `context.sections`（区分別の文字数・概算トークン）・`context.turnInputTokens`（送信別入力の実測）・`toolCalls[].resultChars`（打切り前の全長）を記録し、レビューUIに内訳を表示。`usage.cachedInputTokens`（入力の内数へ正規化。Anthropic は input_tokens + cache_read + cache_creation を総入力化）を追加しメトリクスへ合算。予算判定は総入力基準を維持し、キャッシュ割引の重み付けは R19-05 のキャッシュ有効化時に再判断（ARCHITECTURE §4.28）
    - id: R19-02
      title: コンテキストレシピ語彙
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) AG-28）。`context.items`: `catalog`（match 絞り）/ `phase` / `view`（rows・columns 絞り）/ `doc` / `related` / `sample`（同スキーマの手本N件）。各項目に `budgetChars`（決定的打切り。全文系は既定8,000字）・`when`（always / has-target / no-target）・`{target}` 等のプレースホルダ（foreach 対象値に連動。未解決の項目は開示しない）。旧キー（include / views）は移行ヒント付き定義エラー・無指定の既定は空。`builtin-activity`（kind の cases 展開＝設計スペースのフォームも追随）・MANUAL を対更新し、同梱テンプレート16定義＋ledger パックを新形式へ移行（ARCHITECTURE §4.28）'
    - id: R19-03
      title: グラフトラバース基盤
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) AG-30）。宣言的トラバース評価器 `core/Traverse`（経路パターン: `start`＋`steps` の**連鎖**（各ステップは前ステップの到達ノードから辿る）。`follow: out / in` × `relation`・`via`・`schema` 絞り、`emit`＝段階的開示の4階層、`limitPerHop` 既定10）。訪問済み集合で循環停止・ID昇順の安定ソート・「他n件」・`budgetChars` 打切り＝決定的出力。CLI `traverse`（`--steps` にYAML配列＝レシピの試作台）'
    - id: R19-04
      title: グラフの開示統合
      cells:
      - ✅
      - '2026-08-10 実装（AG-30）。レシピ `kind: graph` 項目（`{target}` 連動・when / budgetChars 対応の決定的プリフェッチ）とエージェントツール `traverse`（related の多段版・相談モード可）。エージェント経路は `staging.index()`（オーバーレイ）、CLI はディスク索引——既存の二層構造（§4.5）を踏襲。`builtin-activity` の graph case で設計スペースのフォームも対応'
    - id: R19-05
      title: 参照の名前解決とツール減量
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) AG-29。会計の実測＝related(ACT-001) 被参照144件13.5K字・read_view 全量28.6K字の履歴膨張と、ID解決目的の read_node が毎実行2〜4ターンある事実を受け、R19-03/04 より前倒し）。**参照の名前解決**: read_node／doc 項目の末尾に「参照の解決」フッタ（配下の参照IDを `ID = タイトル [定義元]` で列挙・未解決も明示）、related の「この要素からの参照」に参照先タイトル付与、ビュー renderText の ref 値セルを「ID（タイトル）」注記へ（従来は「（配列 n 件）」）——「このIDは何か」を追加のツール呼び出しなしで閉じる。**ツール減量**: related の被参照は既定20件打切り＋`limit` 引数、read_view に `rows`／`columns` 引数、list_documents に `match` 引数'
    - id: R19-06
      title: 評価との統合
      cells:
      - ✅
      - 2026-08-10 実装（[FEATURES.md](../FEATURES.md) AG-31）。評価セットの variants に `context`（レシピ丸ごと差し替え。空 = 開示なしのA/Bも可）を追加し、「レシピA/B × 合格率 × トークン」の比較をツール内で完結。レポートに変異別 cachedInputTokens・ケース別 input/outputTokens を追加。絞りすぎ→探索ターン増→逆コスト増や、カタログ項目の要否をデータで判断する閉ループ
    - id: R19-07
      title: prompt caching
      cells:
      - ✅
      - '2026-08-10 実装（FEATURES A-14）。Anthropic 経路の `cache_control`: 切れ目を system・ツール定義末尾・**最新メッセージの末尾ブロック**（毎ターン前進）に置き、2ターン目以降の再送プレフィクス全体をキャッシュ読取化。効果は `usage.cachedInputTokens`（R19-01）で計測。予算判定（`limits.maxTokens`）は総入力基準を維持と決定（キャッシュ読取も総入力の内数として数える。割引はコスト＝課金の問題であり暴走防止の予算とは別物）'
  - text: |-
      効果見込み: elaborate-usecase 系で初期コンテキスト15.5〜19K → 2〜3K／送信、プリフェッチ精度向上による探索ターン減も乗り、同規模の一括実行で入力おおむね1/5〜1/8（238万→30〜50万トークン）。トラバース評価器は影響分析（in 方向の多段）・カバレッジ説明・UI参照グラフ（X-03）の部分グラフ・プラン層（T-02）の依存順序取得の共有基盤になる。T-01（エージェントフロー再設計）・T-02 とは独立に進められ、T-02 の前提基盤となる。**即効修正（実施済み 2026-08-09）**: software-template の elaborate-* 3定義から `context.views`（全量ビュー）を除去し、フォールバック（対象未指定時の選定）を `read_view` のオンデマンド取得へ変更した（初期コンテキストはカタログのみ＝概算で送信あたり約2/3減。本移行は R19-02 で完了させる）。

      **完了条件の充足（2026-08-10）**: ①会計——実行記録の `context` 節・レビューUIの内訳・送信別実測で「どの宣言がいくら払わせたか」が機械取得できる（`KernelTest`）②レシピ——旧語彙は定義エラー・空既定・テンプレート16定義＋ledger パック移行済み・`{target}` 連動と when / budgetChars が効く（`DefinitionsTest` / `KernelTest`）③名前解決と減量——参照IDの意味解決が追加ツール呼び出しなしで閉じ、related / read_view / list_documents に絞り込みが効く（`ToolsTest`）④グラフ——経路パターンの多段トラバースがレシピ・ツール・CLI の3面で同一評価器から使える（`TraverseTest` ほか）⑤eval——レシピA/Bが合格率×トークンで比較できる（`EvalTest`）⑥キャッシュ——Anthropic 経路で切れ目3点が置かれ cachedInputTokens で計測できる（`ToolChatParseTest`）。実測効果はオーナー確認済み（ターン数減・トークン減・安定。1実行 36〜159K → 20〜30K）。以降のレシピ改善は各ワークスペースのアクティビティ定義チューニング（R19-06 の evals で回す運用）に移る。
