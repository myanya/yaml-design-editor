id: P29
number: 29
title: Core Calculus
status: in-progress
status_note: Phase 1〜6 完了。残りは OQ-03（下記）
body:
- points:
  - label: 目的
    text: YAML への計算を Term / Query / Expression / Predicate / Rewrite / Construct（＋Aggregate）の体系へ分解し、上位機能をその合成として説明できる状態にする。「機能ではなく直交プリミティブを増やす」を最上位原則とし、専用評価器の乱立を防ぐ。方針原本は [CORE-CALCULUS.md](CORE-CALCULUS.md)。
  - label: 完了
    text: Phase 1 意味論の固定、Phase 2 既存機能のマッピングと語彙の刈り込み、Phase 3 評価部の共通化、Phase 4 Rewrite の形式化、Phase 5 規約化、Phase 6 定義層の実体化（検査の語彙はすべて定義体になった）。
  - label: 残り
    text: OQ-03（文書分割）。「どの流れを通っても必ず着く」の検査（BACKLOG UX-110）と、遷移検証を YAML だけで書くのに足りない部品（UX-111）は、必要になったら実装する。
  - id: DEC-014
    status: pending
    date: 2026-11-08
    by: オーナー
    text: OQ-03（文書分割）に着手するか決める。
  - label: 決めたこと
    text: 数え上げの評価器は統合しない。関係の多重度（参照の本数）と constraints の count（解の数）は意図的に単位が異なる。
history:
- id: RH-037
  title: 'P29: YDE Core Calculus（YAMLに対する計算体系） Phase 1 着手（2026-09-05 採択）'
  body:
  - text: |-
      狙い: YAML への計算（選択・計算・判定・変更）を **Term / Query / Expression / Predicate / Rewrite の5体系**（補助 Aggregate・下位 Patch / Transaction）へ分解し、上位機能をその合成として説明できる状態にする。「機能ではなく直交プリミティブを増やす」を最上位原則とし、P28 の語彙拡大が専用評価器の乱立へ向かうのを防ぐ。方針原本は [CORE-CALCULUS.md](../CORE-CALCULUS.md)（[ADR-0009](../decisions/0009-core-calculus.md)）・設計レビュー規約は [CONVENTIONS.md](../CONVENTIONS.md) §9。

      | フェーズ（CORE-CALCULUS.md §22） | 状態 | 内容 |
      |---|---|---|
      | Phase 1: 意味論の紙上固定 | ✅ 中核確定（2026-09-05） | コード変更なし。評価モデルを固定し（記録は [CORE-CALCULUS.md](../CORE-CALCULUS.md)）、難所5点（DP-01 束縛の正体・DP-02 where の所属と3段評価・DP-03 Unknown の伝播・DP-04 orchestration の分離・DP-05 判定述語の量化）をオーナーレビューで確定（規範 CALC-01〜16）。中心決定: 束縛は Subject（出現集合を持つ論理ID）・**出現割当て σ**（Expression は σ 固定の単一値計算・集合性は述語境界の量化に局在＝オーナー指摘起点）・選択述語=存在量化／判定述語=反例量化・「解なし＝違反」既定・意味と orchestration の分離定義。方針文書 §6/§7/§8 も対更新。第2回レビュー（同日）: OQ-01 決定＝**Unknown 降格を既定へ採用（CALC-17**。解の不足を理由とする判定のみ降格）・OQ-02 は Phase 2 送り。**CALC-17 評価器 ✅ 実装完了（2026-09-12。意図的差分 D-15・`UnknownDemotionTest` 5本・ベースライン不変）**。OQ-04 は 2026-09-12 決着＝R28-08 の反例表示を試用し「メッセージが分かりやすく現状で十分」→ **構造化 Evidence の一般形は需要（自動修正・配送の高度化等）が立つまで保留**（CALC-09 の should は最小形＝反例列挙＋relatedIds で満たす）。残: OQ-03（文書分割） |
      | Phase 2: 既存機能のマッピング | ✅ **完了（2026-09-19。MP-01〜05 決定・R29 で実装）** | オーナー指摘「新しい語彙を増やしたくないのに増えた」を受けて着手。**写像表**（表面語彙19行を core／糖衣／専用演算／プロセス層に分類）と**重複クラスタ OC-01〜07**——数える単位の三分法（参照本数／出現件数／束縛タプル distinct）・出現選択の三分法（全出現OR／先勝ち／σ一貫）・未解決参照の非対称・activeFrom 判定の7重実装を file:line の根拠つきで可視化。**オーナー決定（同日・本運用前のため互換より正準優先の強化案）**: MP-01=数え上げの正準綴り＋requiredBy 削除／MP-02=σ 選択方針は定義出現優先（OQ-02 決着）／MP-03=機械的統合は前倒し・設計が絡む2件は後続／MP-04=語彙の予算を CONVENTIONS §9 へ／MP-05=出現集合の Aggregate（CALC-21）を明文化。実装は下表 R29-01〜04 |
      | Phase 3: Expression / Predicate の共通化 | ✅ **完了（2026-09-19。R29-03・R29-05〜06）** | 最も小さく純粋な評価部分からの共通化: activeFrom 判定（R29-03）・**Expression／要素述語の共有評価部 `semantic.SemanticExpression`（R29-05）**・**指摘の診断の単一化 `validate.RuleDiagnostics`（R29-06）**。未解決参照の扱いは CALC-20 の原則として明文化済み（コード変更不要）。**本フェーズの外に残したもの**: 指摘の三面モデル（BACKLOG UX-101）のうち UI に効く2面＝修正先への配送・対処語彙の統一（UI系保留の方針どおり着手しない。R29-06 で「診断」と「配送」が分離済みのため、着手時は配送先の追加だけで済む） |
      | Phase 4: Rewrite の形式化 | ✅ **完了（2026-09-19。R29-07〜09・判断点 RP-01〜03 はオーナー決定済み）** | 変更を生成する全経路を「場所の列挙（Query）× 絞り込みと中止条件（Predicate）× 場所ごとの操作（Edit*）」へ写像（写像表18行・重複クラスタ RC-01〜08・起草条項 CALC-22〜25）。**基本形に素直に落ちる**＝改名・削除・選択肢改名・必須化・型変換の文書側・整列・宣言の横断改名3種・エンティティ操作・一括変更・取込／**落ちない**＝フィールド移動（中間生成→Move→空親削除の列＝戦略）・定義の抽出／インライン化（1箇所の構造変換＋集約依存の条件付き操作）・文書移動（物理移動は変更語彙の外）。実装の重複（RC-01〜04）は共有基盤へ寄せて解消（下表 R29-07。API・生成される計画は不変）。**オーナー決定（同日）**: RP-01＝条項 CALC-22〜25 を採択（現行挙動の明文化・挙動変更なし）／RP-02＝変更語彙と取引型の二重化（PatchOp⇔YamlOperation・ChangeSet⇔WorkspaceTransaction）を**「内部の正準＝型付き操作＋トランザクション」と「外部との交換形式＝PatchOp＋変更セット」の2層**として明文化（CALC-08 を改稿。実装は下表 R29-08）／RP-03＝「UI 挙動が変わってよい・当該領域も Undo 範囲へ」→ 文書の新規作成をトランザクション経路へ（下表 R29-09・D-18）。RP-04（操作単位の変更理由）は OQ-04 に従い保留・RP-05（スキーマ解決の層またぎ重複＝`core/RefactorImpact.kt` の簡約版）と変更セット型の workspace-core 再配置は P27 へ |
      | Phase 5: 新規機能の Calculus First 規約化 | ✅ 規約として発効済み | 新しい決定論的機能は Core Calculus 経由を規約化（CONVENTIONS §9 は採択時点で発効済み。既存機能の完全移行は待たない） |
      | **Phase 6: 定義層の実体化**（2026-09-19 追加） | 🚧 **第1段（整合検証。R29-10）・値の条件と値の計算の部品（R29-11）・第2段（多重度と対象型。R29-12）・第3段（詳細文書の存在とエンティティの整合。R29-13）・第4段（非循環と遷移検証。R29-14）・何段でも辿る線（R29-15）・第5段（網羅マトリクス。R29-16）完了（2026-09-20）＝**検査の語彙はすべて定義体になった** | **オーナー方針（本来の目的の明文化）**: 機能を直交させて個別実装をなくし、「本当にプリミティブな実装＋組込み定義＋ユーザ定義」だけで検証を行えるようにする。Phase 1〜4 は意味論の固定と核の内側の重複解消までで、**個別の検査プログラム（詳細文書の存在・整合・グラフ整合・網羅マトリクス・遷移検証・エンティティの整合）は1本も減っていない**——利用者がプリミティブで直接組める検査は `constraints` の1系統だけ。**4層**（CORE-CALCULUS §25）: 文法プリミティブ＝ベース実装・**yaml-core の領域＝YAML の構造と最小の構造チェックだけ・小さく保つ**／意味プリミティブ＝個別実装・**semantic-core の領域＝どう解釈するか**（部品と、複雑なアルゴリズムをまるごと実装する**専用チェッカー**の2種）／組込み定義体＝組込み YAML 定義／ユーザ定義＝ユーザ YAML 定義。**決定の要点**: ①**検査の書き方の3段**——基本の書き方（定義を名前と渡す値で使う／プリミティブを直接書く）がベース → 関数のような定義 → 語彙の定義（どこに書けるか・書き方の形・どの定義をどの値で使うか）。`relations` の `cardinality` などは組込み定義体が作る語彙になり、今までどおり書ける。語彙の定義は利用者も書ける（組込みは特権を持たない）②複雑な処理は個別実装でよい（すべてを YAML で定義できる必要はない。例: 状態遷移への時相論理の適用）。**想定される処理と計算は需要を待たずに用意しておく**（値の条件・値の計算〔四則演算を含む〕・否定と「または」・数え方と集計・グラフの辿り方・集まりどうしの関係）③**指摘のメッセージとエラー時の対応も直交的に**——対応の種類（移動・文書の作成・値の書き込みなど）をプリミティブとして用意し、定義が選ぶ（今の「詳細文書を作成」「導出値を適用」「参照の追加先を開く」の作り込みを置き換える）④定義体へ移して結果が変わる箇所は共通の規則に合わせる（意図的差分を先に登録）⑤**yaml-core には何も足さない**——構造チェックは最小限（属性の有無・値の型・値の基本的なチェック・選択肢・再帰）という仮説を P27 の入力として記録。設計の詳細（棚卸し14行・プリミティブ台帳＝文法3・意味 既存8＋追加13・条項 CALC-26〜30）は当時の仕様ワークスペースに書いた（2026-09-22 に廃止。要点は [CORE-CALCULUS.md](../CORE-CALCULUS.md) §25）。**5段**: ①整合検証（定義体の仕組みそのものをここで作る。値の計算・値を読む文書の指定・メッセージ・対応「導出値を適用」）②多重度・対象型（数え方と集計・否定と「または」）③詳細文書の存在・エンティティの整合（同じ ID が書かれた文書へ辿る線）④非循環・遷移検証（参照を何段でも辿る線）⑤網羅マトリクス（つながっていないもう1つの集まり）。各段の完了条件＝個別の検査プログラム・専用のデータ型・読み取りコードの削除＋検証結果の一致（差は意図的差分の登録だけで説明できること）。**P27（スキーマ2層化）は第5段の後** |

      **試金石（Phase 1 と並走）**: 「束縛間の値比較」（画面項目の `max_length` ≦ 業務データ型の最大桁。R28-02・R28-07 で2回見送った要求）を calculus-first で設計する——Phase 1 スペックの Predicate 合成（束縛2つの値を比較する `LessThanOrEqual`）の適用例として意味論を検証し、実装は仕様レビュー後。→ ✅ **R28-08 として実装完了（2026-09-12）**: 確定した意味論（CALC-12/13＝σ の単一値計算・反例量化）が新語彙の追加なしに `check` 1節へ落ち、calculus-first の経路（要求→意味論の固定→組合せとして実装）が一巡した。

      **Phase 2 の実装項目（語彙の刈り込み。2026-09-19 オーナー承認・本運用前のため互換より正準優先）**:
  - head: |-
      | ID | 項目 |
      |---|---|
    rows:
    - id: R29-01
      title: '✅ **coverage.requiredBy の削除**（MP-01・意図的差分 D-16）: 数え上げの正準を「1ホップ無条件=レジストリ cardinality／条件付き・多段=constraints の count / exists／同一IDの詳細化=coverage detailIn」へ一本化。`requiredBy` を書いたスキーマは移行先を案内する定義エラー（黙って無視しない）。`CoverageRule` から参照ベースを撤去・メタスキーマ／スキーマ設計UI対更新・sample-workspace の2ルールを constraints へ移行（**ベースライン エラー5/警告12 不変**）・関連テスト7ファイル改修＋廃止エラーテスト'
    - id: R29-02
      title: '✅ **期待値導出の σ 選択方針**（MP-02・D-17・CALC-19＝OQ-02 決着）: lookup / source / values の出現選択を「索引挿入順の先頭」から**定義出現優先→索引順**へ（`SemanticDerivation.preferDefining`。CALC-11 の代表出現と同じ規則）。selector で1出現に絞れている運用では挙動不変。`ConsistencyTest` に定義出現優先の判別テスト'
    - id: R29-03
      title: '✅ **activeFrom 判定の一本化**（MP-03 前倒し・OC-04 解消）: 7箇所の同一実装を `semantic.phaseActive` 1関数へ（カーネル2＋root Validator 3ブロック＋3.9 案内）。静的検査（activeFrom には phases が必要・order 内であること）を coverage / consistency だけから**全検証語彙**（constraints / matrix / flow）へ展開'
    - id: R29-04
      title: '✅ **規範化**（MP-04 / MP-05）: DESIGN-CHECK-CATALOG §8 を「目安」から**正準の綴り（規範）**へ格上げ・CONVENTIONS §9 に**語彙の予算**（表面語彙の追加は核にない演算の命名時だけ・追加時は写像表へ1行）・evaluation-model に CALC-19（σ 選択方針）／CALC-20（参照の記述はエッジの実在の証拠）／CALC-21（出現集合の Aggregate＝第6の演算面）を明文化'
  - text: '**Phase 3 の実装項目（内部の共通化。表面語彙・指摘の文言は不変）**:'
  - head: |-
      | ID | 項目 |
      |---|---|
    rows:
    - id: R29-05
      title: '✅ **Expression／要素述語の共有評価部**（2026-09-19）: `semantic/Expression.kt`（`SemanticExpression`）＝①Get（σ が選んだ1出現からの単一値の読み出し）②要素述語 `compare`（eq / ne は文字列等値・順序系は数値比較・数値でなければ null＝Unknown の3値）③式側の σ 選択 `select`（定義出現優先→索引順。CALC-19）の単一実装。**比較演算の2実装（consistency の assert／check 判定述語）を統合**（`ConsistencyAssert.op` で check と同じ `CheckOp` へ落とす）・**σ 候補の列挙を where（存在量化）と check（反例量化）で共有**（`sigmaCandidates`）・導出の出現選択3箇所＋**テンプレート健全性検査（UX-12）の values 選択**を `select` へ（後者は索引順のままだった食い違いの解消＝D-17 追補）。`SemanticExpressionTest` 5本'
    - id: R29-06
      title: '✅ **指摘の診断の単一化**（2026-09-19・OC-07 の残件解消・**指摘の文言／重大度／relatedIds は不変**）: パターン制約・網羅マトリクス・遷移検証は、報告先（定義出現）用と出現先（他出現への案内。旧 3.9 節）用に**同じ規則を別々のコードで2回判定**していた（判定式・根拠の列挙・メッセージ組立が3+1系統で重複）。規則×主語ID の判定を `validate/RuleDiagnostics.kt` の診断（`RuleDiagnosis`）へ1回で写し、配送（`reportIssue`＝規則の level／`noticeIssue`＝エラー級は同格・警告級は INFO）を診断から分離。重大度の写像は `CoverageLevel.toSeverity()` に一本化（10箇所）・検証1回の文書ツリーキャッシュを1本化・遷移検証の全指摘を規則単位でキャッシュ（出現先の案内で ID ごとに閉包を再計算していた無駄の解消）。マトリクス／遷移の案内に特性テストを追加（従来テストなし）'
  - text: '**Phase 4 の実装項目（内部の共通化。高水準操作の API・生成される計画は不変）**:'
  - head: |-
      | ID | 項目 |
      |---|---|
    rows:
    - id: R29-07
      title: '✅ **Rewrite 共有基盤**（2026-09-19）: `semantic/Rewrite.kt`（`SemanticRewrite`）＝①スキーマ誘導の文書走査 `walkDocument`（3実装を統合。`fieldHits`＝データキーの座標・`parentObjects`＝充填先の親・整列は object 訪問点）②到達文書の列挙 `reach`（`$ref` 共有の影響範囲。6コピーを統合）③全スキーマ文書のエントリ列挙 `forEachSchemaEntry`（5コピーを統合）④基本戦略 `rewriteDocuments`（全一致を列挙→文書ごとの操作列＋件数集計）⑤集積器 `PlanOps`（スキーマ操作とエンティティ操作の2実装を統合。削除を後ろへ寄せるかは指定）・`pathDescending`・`listTop`。SchemaRefactor は 1,435→1,216 行・各操作は「1文書分の規則（列挙・絞り込み・操作の生成）」だけを持つ形に。**安全網: `RefactoringPlanGoldenTest`**＝全操作（エンティティ4種＋スキーマ12種）と拒否ケース計49要求の計画を**操作の順序まで**正準テキストへ写して固定（期待値は変更前の実装から生成→変更後も完全一致）。付随: R29-01 の取りこぼし＝`renameSchemaId` の追随対象から廃止語彙 `fromSchemaIds` を除去（D-16 追補）'
    - id: R29-08
      title: '✅ **変更語彙の2層の明文化**（2026-09-19・RP-02・挙動不変）: CALC-08 を「6種の基礎命令への正規化。内部の正準は型付き操作＋トランザクション、PatchOp と変更セットは外部（エージェント・CLI・取込）との交換形式」へ改稿。内部の計画生成で交換形式を作っていた唯一の箇所＝ビュー追随（`Views.fieldRenameImpact`）を型付き操作（`YamlOperation.SetScalar`）での生成へ改め、`RefactorImpact` の合成直前の PatchOp→YamlOperation 変換を撤去'
    - id: R29-09
      title: '✅ **文書の新規作成を Undo 範囲へ**（2026-09-19・RP-03・**意図的差分 D-18**）: 新規 YAML（`createYaml`）・ビューの詳細文書／新規行ファイル・カバレッジ指摘からの詳細文書（`createScaffoldFile`）・スキーマ推測（`inferSchema`）の4経路を、作成の単一経路 `AppState.createDocumentFile`（セッションの `CreateDocument` 1件のトランザクション→保存→`refreshAfterSessionWrite`）へ。**Ctrl+Z で作成を取り消せる（ファイルも消える）／Redo で戻る／作成がそれまでの Undo 履歴を失わせない**（従来は直接書込＋`reload` でセッションを開き直し、履歴ごと失っていた）。**文書の作成・削除を含む履歴の Undo / Redo はファイルの有無までその場で確定**（`afterHistoryStep`。エージェント変更の適用で作成された文書の Undo で削除予約が保存されずファイルが残る潜在不整合も同時に解消）。セッションが文書として扱わないパス・セッション不在時は従来経路へフォールバック。一括変更のフォールバック（`updateRootScalar`）はセッションを開けなかった場合の安全網として存置（書込同値性テストの比較対象）。`AppStateCreateDocumentTest` 5本。範囲外として残したもの＝ファイルの改名・削除・ディレクトリ作成は今も `reload` で履歴を失う（BACKLOG UX-104）'
  - text: '**Phase 6 の実装項目（検査を組込み定義体へ移す。1段ごとに、個別の検査プログラムを削除する）**:'
  - head: |-
      | ID | 項目 |
      |---|---|
    rows:
    - id: R29-10
      title: '✅ **第1段: 定義体の仕組み＋整合検証の移行**（2026-09-19・**意図的差分 D-19**）: **検査の書き方の3段**を実装——基本の書き方（`constraints` に、プリミティブを直接書くか `use` ＋ `with` で定義を使う）→ 関数のような定義（`functions`）→ 語彙の定義（`vocabulary`）。展開は `semantic-core/schema/CheckDefinitions.kt`（`CheckLibrary`。YAML を読んだままの値の上の置き換えだけ）、組込み定義体は workspace-core の資源 `builtin-definitions/`、`SchemaLoader` が全スキーマ文書の定義を集めて展開する。**足した意味プリミティブ**: 値の式（`schema/ValueExpr.kt`: 読み出し・決まった値・テンプレートの展開・辞書での置き換え・最初に得られた値）／値を読む文書の指定（値の読み出しと `edge` の `in`）／メッセージの宣言と指摘の場所（`message`・`reportAt`＝値が書かれた場所）／**エラー時の対応の宣言**（`responses`: 移動 `jump`・値の書き込み `apply`。`Issue.responses` を検証パネルが宣言の順に並べる）。**整合検証（`consistency`）を組込み定義体 `consistency.yaml` へ移し、専用の検査プログラムを削除**（`semantic/Consistency.kt`・`ConsistencyRule`・`ConsistencyAssert`・`parseConsistency`・`IssueDerivation`）。`ConsistencyTest` は指摘の場所・文面・対応（導出規則へ／入力値へ／導出値を適用）・判定保留・テンプレート健全性・activeFrom・lte を含めて通過。変えた点は D-19（指定に合う文書をすべて調べる・`lookup.via` は参照フィールドのキー名・文面の末尾の規則）。**検証結果はコミット済み版と完全一致**（テンプレート・サンプルとも差分0）。利用者の定義と語彙が組込みと同じ仕組みで動くことを `CheckDefinitionTest` で固定（組込みは特権を持たない）・利用者の語彙のキーはメタスキーマの知っている項目へ追加・**CLI `checks`**（展開後の検査を由来つきで表示＝展開の透明性）。yaml-core は無変更'
    - id: R29-11
      title: '✅ **値の条件と値の計算の部品（意味プリミティブ SP-10 の残り。BACKLOG UX-107）**（2026-09-19）: オーナー方針「想定される処理や計算は、ある程度、用意しておく」に沿って、第2段の前にまとめて用意した。**値の条件**（`schema.CheckOp`）に `oneOf`（選択肢のどれか）・`matches`（正規表現の全体一致）・`startsWith` / `endsWith` / `contains` を追加し、**`check`（判定）と `where`（ノードの絞り込み）が同じ演算子・同じ判定を共有**するようにした（`where` は `oneOf` / `matches` / 前方・後方・部分の一致 / 大小 / `empty` を新たに書ける。`exists` / `equals` / `notEquals` は従来どおり）。**値の計算**（`schema.ValueExpr`）に文字数 `length`・`upper` / `lower`・数値の表記を揃える `number`・四則演算 `add` / `subtract` / `multiply` / `divide` を追加（BigDecimal で計算し小数の誤差を持ち込まない。数値として読めない・0 で割るときは値が得られない＝判定保留）。決まった値は式の位置に**そのまま書ける**ようにした（`{value: ...}` はひな型用に残す）。計算そのものは `semantic.SemanticExpression` の純粋な関数（単独でテストできる）。指摘の文面に何を計算したかを添える（「name の文字数: 14」「「300」（= 100 × 3）」）。既存の検査の挙動は変えていない（追加だけ）——テンプレート・サンプルのベースライン不変。条件の組合せ（または・〜でない）と数え方・集計は第2段（SP-02・SP-03）で足す'
    - id: R29-12
      title: '✅ **第2段: 多重度と対象型を組込み定義体へ**（2026-09-19・**意図的差分 D-20**）: 関係の宣言の `cardinality`・`source` / `target` を、組込み定義体 `builtin-definitions/relations.yaml`（コードなし）が作る語彙にし、**カーネルの検査プログラム（`SemanticGraphIntegrity` の対象型と多重度・`SemanticShortage`・`Issue.openFiles`）を削除**した。**足した意味プリミティブ**: ①条件の否定と「または」（SP-02。`where` / `check` の `{not}` `{or}`＝入れ子は1段・3値・node の型の並びと `not`。ノードの絞り込みはクエリ・網羅マトリクス・遷移検証で1実装を共有）②参照の本数と集計（SP-03。値の式 `refCount`＝相手が見つからない参照も数える CALC-20／`sum` / `min` / `max` / `count`＝同じ起点の全ての解にわたる集計）③参照の束縛（edge の `bind`）と参照の場所への指摘（`reportAt: {ref}`）④文面のひな型をどの判定にも（`{id}` `{束縛名.id/type/title}` `{count}`）⑤エラー時の対応「参照を書き足せそうな文書へ移動」（`jump: referenceSources`。被参照不足の「参照の追加先を開く」をこの宣言へ置き換え）⑥語彙の `when` の並び・`with` の `join`。**語彙は関係レジストリ（`in: relations[]`）にも書ける**ようにし、展開された検査は特定のスキーマに属さない検査としてどの文書の要素にも適用する（利用者の語彙も同じ＝組込みは特権を持たない。`RelationDefinitionTest` で固定）。**検証結果はコミット済み版と完全一致**（テンプレート・サンプル・specs とも差分0。文面・場所・重大度・「参照の追加先を開く」は従来どおり）。変えた点は D-20（評価は constraints と同じ経路になりカーネルの snapshot には出ない・多重度の指摘は他の文書の出現にも案内が出る・参照先が未解決の参照と自分自身への参照には参照元の型の不一致を指摘しない）。yaml-core は無変更'
    - id: R29-13
      title: '✅ **第3段: 詳細文書の存在（coverage）とエンティティの整合を組込み定義体へ**（2026-09-20・**意図的差分 D-21・D-22**）: `coverage` を組込み定義体 `builtin-definitions/coverage.yaml` が作る語彙にし、**専用の検査プログラムとデータ型（`semantic/Coverage.kt`・`CoverageRule`・`parseCoverage`・`coverageStatuses` / `coverageMessage`・`CoverageStatus`・`IssueScaffold`・出現先への不足案内の専用コード）を削除**。エンティティの整合のうち浮遊詳細化・定義競合・型競合は `entities.yaml` に直接書いた検査にした（idPattern 逸脱と重複所有は、スキーマの構造に依存する lint として専用コードに残す＝DL-04）。**足した意味プリミティブ**: ①書かれた場所の数（SP-05。値の式 `occurrenceCount`。スキーマ・ファイル・役割で絞れ、`distinct: type` は型の種類の数）②検査の状況の表示 `status`（右パネル・ID 横ぐし・ビューの状態列・エージェントの `related` が共用。coverage 専用だった表示を、利用者の検査も出せる一般の仕組みへ）③直せる場所への案内 `fixSite`（旧・出現先への不足案内 UX-15 を宣言へ。指摘の三面モデルの「修正先」）④エラー時の対応「文書を作る」`create: detailDocument` と文面の `{create.places}` ⑤重大度の切り替え `levelFrom`（関係レジストリの強制スイッチ）⑥node の `typed` ⑦語彙の書き方の形の最小の点検 `requires` / `removed`。**特定のスキーマに属さない検査**を、`kind: library` と組込み定義体に直接書いた `constraints` へ広げた。**スキーマの検査の報告先**を「その検査を宣言したスキーマの文書の中」で決めるようにした（D-21 ④。これまで報告されなかった組合せが報告される・BACKLOG UX-103 のパターン制約の分を解消）。**検証結果**: テンプレート・サンプル・specs は移行の前後で完全一致。詳細文書を消し、定義のない詳細化を足したテンプレートの複製でコミット済み版と比べ、差は D-21 に登録した2点（同じ文書の中での指摘の並び・他の出現への案内）だけであることを確認。yaml-core は無変更'
    - id: R29-14
      title: '✅ **第4段: 非循環と遷移検証——専用チェッカーを定義から使う**（2026-09-20・**意図的差分 D-23**）: 当初は「参照を何段でも辿る線」（SP-06）と「同じ行の2つの参照を1本の線とみなす」（SP-07）をクエリへ足す計画だったが、着手時の検討で**専用チェッカー（SP-13）の形を採った**——到達と循環の判定は、①何段でも辿った結果（経路の列挙でなく集合の計算）②ワークスペース全体での判定保留（相手の見つからない参照が1つでもあれば、解の不足を理由とする指摘をすべて黙らせる＝CALC-17。1つの起点から辿るクエリでは再現できない）③宣言にない遷移は「すべての利用側の線について、宣言側に同じ組がある」という入れ子の量化、を要し、部品の組合せで書くと不自然になる（DL-04「複雑な処理は個別実装でよい。定義の書き方を歪めてまで YAML で書かない」）。**実装**: 検査の基本の書き方に `checker` ＋ `args` ＋ `messages` を足した（`schema/Checker.kt` の `CheckerRule`・`CheckerKind`＝`flow` / `cycle`）。アルゴリズムは専用チェッカー（`SemanticFlow`・`SemanticCycles`＝`SemanticGraphIntegrity` から移動）に残し、**語彙への結び付け・指摘の種類ごとの文面・重大度・配送を定義体へ移した**（`builtin-definitions/flow.yaml`・`relations.yaml` の語彙 relation-acyclic）。削除: `SchemaDef.flow`・`FlowRule`（→チェッカーへ渡す値 `FlowArgs`）・`RuleDiagnostics.flow` / `describeFlowFinding`・`index.Query.flowFindings`・`Validator` の flow の配送・`SemanticGraphIntegrity` の非循環の部分。利用者も同じチェッカーを自分の検査から別の文面・重大度で使える（書かなかった種類は指摘されない。`CheckerRuleTest` で固定＝組込みは特権を持たない）。語彙の書き方の形に `keys`（書けるキーの一覧）を足し、`flow` の綴りの誤りを従来どおり定義エラーにした。**検証結果**: テンプレート・サンプル・specs は移行の前後で完全一致。画面遷移を壊したテンプレートの複製でコミット済み版と比べ、差が0であることを確認（到達不能・行き止まりのエラー6件が同じ形で出る）。yaml-core は無変更。SP-06・SP-07 は採用を見送り（クエリに「何段でも辿る線」が要る需要が出たら改めて検討）'
    - id: R29-15
      title: '✅ **何段でも辿る線と、行を線とみなす指定——辿る計算は専用アルゴリズム・判定は YAML**（2026-09-20・**意図的差分 D-24**）: R29-14 の報告へのオーナーの問い「走査を専用アルゴリズムにし、チェッカーは YAML 定義として外付けにして、利用者もチェッカーだけを YAML に定義できないか（例: どの画面からもメイン画面へ到達できること／画面項目が画面定義→コントローラ→処理→DBアクセスを経て、いずれかの DB 項目に対応付くこと）」を受けて実装。R29-14 は辿る部分と判定を1つのチェッカーに束ねて一覧を閉じていたため、利用者は用意された判定を選ぶことしかできなかった。**`edge` の `repeat`**（`true`＝1回以上・`{min: 0}`＝0回以上）は、その線をくり返して辿り着ける要素の集まりを幅優先で求める（必ず止まる・決定的・最短の道すじを `{path}` に出せる）。**`edge` の `row`** は、同じ行の直下の2つの参照を1本の線として辿る（遷移の表。R29-14 で見送った SP-06・SP-07 を、この形で採用）。判定（exists / absent / count / check）・文面・重大度は今までどおり YAML。判定保留は「辿った範囲で出会った、相手の見つからない参照」で決まる。オーナーの2つの例を利用者の YAML だけで書けることを `ReachabilityTest` で固定。**非循環（`acyclic`）を、この部品で組込み定義体の YAML だけに書き直し、循環の検出の専用チェッカー（`checker: cycle`・`SemanticCycles`）を廃止**（変わるのは循環の経路の始点だけ。循環を含む小さなワークスペースでコミット済み版と比べて確認）。**遷移検証（`flow`）は専用チェッカーのまま**——YAML へ書き直すと今の挙動（開始が無ければ判定しない・開始の一覧を文面に出す・ワークスペース全体での判定保留）を保てないため（YAML だけの定義にするのに足りない部品3つは BACKLOG UX-111＝必要になったら実装する）。「どの流れを通っても最後は必ず着く」の検査は BACKLOG UX-110（同じく、必要になったら実装する）'
    - id: R29-16
      title: '✅ **第5段: 網羅マトリクスを組込み定義体へ**（2026-09-20・**意図的差分 D-25**）: 検査の基本の書き方に **`forAll`**（SP-04。起点とは参照でつながらない、もう1つの集まりの**すべての要素について**、起点からの流れに解があること。不足は `{count}` `{missing}`）を足し、`matrix` を組込み定義体 `builtin-definitions/matrix.yaml` が作る語彙にした。**専用の検査プログラムとデータ型（`SemanticMatrix`・`MatrixRule`・`RuleDiagnostics.matrix`・`index.Query.matrixMissingColumns`・`Validator` の matrix の配送）を削除**。関数のような定義のひな型に `$merge`（渡された object を混ぜ込む）を追加。利用者も同じ書き方で「すべての組について」の検査を作れる（`ForAllTest`。例: 設定項目 × 環境 → 設定値）。変えた点は D-25（判定保留と配送が他の検査と同じ規則になる）。**検証結果**: テンプレート（網羅マトリクスの警告2件を含む）・サンプル・specs は移行の前後で完全一致。`MatrixTest` は無変更で通過。yaml-core は無変更。**これで Phase 6 の5段が完了＝検査の語彙はすべて定義体になった**（コードに残る検査は、専用チェッカー flow と、定義体にしないと決めたもの＝宣言のない関係名・エンティティの idPattern 逸脱と重複所有）'
  - text: '**数え上げ評価器の統合（MP-03 の③）の結論**: requiredBy 削除により3実装→2実装となり、残る cardinality（参照の本数）と constraints count（束縛タプル distinct）は**意図的に単位が異なる**（リンク規律 vs 解の数）ため統合しない——単位の差は正準側の仕様として文書化（カタログ §8）。'
