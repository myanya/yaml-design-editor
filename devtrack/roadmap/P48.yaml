id: P48
number: 48
title: 複合文書ビューと射影ビュー
table_title: 複合文書ビューと射影ビュー（文書を開いたとき、同じ ID の側面・受け取る値つきの表・クエリで着いた要素を 1 枚に合成し、最終的には変換のひな型で組んだ任意の木を出どころで編集する）
status: in-progress
status_note: 段階 1 完了（2026-10-31）。タブの分割と表の横長対策（飾りを減らす・列幅を中身から・埋め込む表の列の選別）も完了（同日）。残りは下記
body:
  - points:
      - label: 目的
        text: 設計書のように「1 つの対象の情報が複数の文書に散る」ものを、文書を開いただけで 1 枚に読み書きできるようにする。きっかけは `samples/todos-sysdev-tablemodel` のテーブル定義書（型・NULL
          可否・意味が物理・論理・業務型・型対応の 4 文書に散り、読めなかった）。最終形は、ビューの定義をスキーマと同じように階層構造を持つ任意の木にし、各項目の値を文書から導き、出どころが 1 か所の項目はその場で編集できる「射影ビュー」。
      - decision: 決めたこと
        status: decided
        date: 2026-10-31
        by: オーナー
        text: ①段階 1 の区画の解決は、区画から変換のひな型（写し `$copy`・ビューの行 `$view`）を組んで `SemanticTransform` で評価し、出どころで原本に結ぶ作り（後の段階で利用者がひな型を直接書く形へ続く）②サンプルは物理テーブルを
          `ENT-*` の第 3 の側面にする形（COL-*・MAP-* と implements を無くす）へ移す。
        id: DEC-006
      - label: 今の姿
        text: '[architecture/views.md「文書ビュー」](architecture/views.md)、使い方は [manual/views.md「複合文書ビュー」](manual/views.md)。実例は
          `samples/todos-sysdev-tablemodel` の `tm-physical-doc`（物理テーブルの文書を開くと、概念の意味・カラム定義の表・論理の属性が 1 枚）。'
  - columns: basic
    items:
      - id: R48-01
        title: 側面の区画 `fields.in`
        content: '開いた文書のルートの ID について、同じ ID の別の出現（側面）を `in: {schemaId / fileGlob}` で選び、その要素のフォーム（`include` / `exclude`）を区画に出す。編集はその文書へ（エンティティページの側面カードと同じ経路）。読み込み時の点検とリント（スキーマの有無・選別キー）'
        state: done
        state_on: 2026-10-31
      - id: R48-02
        title: 表の埋め込み `grid`
        content: '`grid: {view, params: {名前: {path}}}` でグリッドかクロス集計を区画に置き、受け取る値に開いた文書の値を差し込む。行は台帳のビュータブと同じ表（`FormSlots.embeddedGrid`）。CLI
          `view` と `read_view` は行を返す'
        state: done
        state_on: 2026-10-31
      - id: R48-03
        title: クエリの区画 `fields.from`
        content: 開いた文書の要素から線を辿って着いた要素（0 件以上）ごとにフォームの区画を並べる（UX-129 のクエリセクション）。変換の `$each` の源がクエリ
        state: todo
      - id: R48-04
        title: 場所から要素へ
        content: ID を持つ場所では、値の式の `each` と変換の `$each` の中から、同じ ID の別の出現（`in`）と参照先（`via`）を読める。カラムの定義順を保ったまま論理名や SQL 型を引ける
        state: todo
      - id: R48-05
        title: 繰り返しの源にクエリ
        content: R30-01 の残り。入れ子でない関係（逆向きの線）を木に入れる
        state: todo
      - id: R48-06
        title: 射影ビュー（読み取り専用）
        content: '`kind: projection`（仮）＝`from`＋`build`（変換のひな型）＋`root`（見せ方の契約。スキーマと同じ書き方）。CLI・`read_view`・レポートの入力にもなる'
        state: todo
      - id: R48-07
        title: 出どころで編集
        content: R30-05。原本 1 か所のスカラーの写しは編集可、計算と整形は不可、配列は 1 つの配列を丸ごと写したときだけ追加と削除が原本に効く（フロービューの編集適格性の一般化）
        state: todo
      - id: R48-08
        title: 起点を要素の型に
        content: 複合文書ビューを要素の型（エンティティ型）に結び、エンティティページの並びも定義で決める。同じスキーマの複数のビューの切り替えは R48-10 で済み
        state: todo
      - id: R48-09
        title: 既存のビューを寄せる
        content: グリッド・文書ビュー・フローを射影ビューの特別な形として整理する（R30-03 の続き）
        state: todo
      - id: R48-10
        title: タブを分ける
        content: 編集画面のタブを「フォーム・ビュー・ソース・差分」に（フォームは既定のフォーム・ビューは当たる文書ビュー）。当たらない文書ではビューのタブを押せない形で出し説明を添える。複数当たれば ▾ で選び文書ごとに覚える。開いたときのタブは、直前がフォームかビューならビューが当たればビュー（オーナー
          2026-10-31）
        state: done
        state_on: 2026-10-31
      - id: R48-11
        title: 表の横長対策 1〜3
        content: ①飾りを減らす（見出しの「（参照）」を印に・状態の列は検査があるときだけ・行操作は取っ手と ⋯・参照のセルの Hub を省く）②列幅を見出しと値から（`ColumnWidths`・`GridWidths`）③埋め込む表の列の選別
          `grid.columns`。サンプルの「カラム定義」は型（SQL の型と NULL 可否）を 1 列に
        state: done
        state_on: 2026-10-31
      - id: R48-12
        title: 収まらない列は行の展開へ
        content: 幅が足りないとき、左から収まる列だけを表に残し、残りは行頭の ▶ の展開フォームへ。見出しの端に「ほか n 列」と全列を表に戻す切り替え。R48-11 の感触を見てから決める（オーナー 2026-10-31）
        state: todo
      - id: R48-13
        title: カード表示
        content: '1 行を「見出し: 値」の小さなカードにして並べる。定義書を読む用途向き。編集の操作感が変わるので後回し'
        state: todo
