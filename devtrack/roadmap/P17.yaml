    body:
      - text: |-
          狙い: 機能の充実に対して「実際に触ったときの体験」の検証が不足している。利用者（プロダクトオーナー）による**触り心地試験**を定常の開発ループに組み込み、指摘を確実に還流させる。進め方は CONVENTIONS §7 として規約化済み:

          1. **試し方の提示**: 機能追加・変更の完了報告に、具体的な操作手順と「見てほしい観点」を必ず添える（この台本が試験シナリオとして蓄積される）。
          2. **試験と記録**: 利用者が触り、感想・指摘を返す。本題と異なる気になりポイントは [BACKLOG.md](../BACKLOG.md) へ即時記録し、その場では直しに行かない（脱線防止・指摘の保全）。
          3. **チューニング判断**: 指摘ごとに対応要否を個別に判断し、大きいものは本書の項目（Rx-xx）へ起こす。
