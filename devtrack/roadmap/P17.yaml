      - text: |-
          #### R17-03 第2弾: UI/UX優先の一括チューニング計画（2026-08-12 棚卸し）

          **選定方針**: 所感メモで高評価の中核体験——①「検証に導かれて埋める」ループ ②ID横ぐし ③未保存追随の「見たまま判定」——を直接強化する指摘と、行き止まり・混乱を生む不具合的な体験を優先する。オーナー保留中のテーマ（T-01 エージェントフロー・T-02 プラン層）に束ねた実行・自動化系（UX-39/45/46〜56/59〜61）、および単独で設計議論が大きい新機能系（UX-30/32/33/65/67/69 等）は今回の対象外。BACKLOG の UI/UX 直結 **20件**を効果×規模で4波に分けて実施する。

          | 波 | 狙い | 対象（BACKLOG ID） | 規模感 |
          |---|---|---|---|
          | **第1波 即効修正** ✅ | 小粒の不整合・初見体験の罠を一括で潰す | UX-18（R17-04 と合流実施）・UX-27 enum推測閾値・UX-28 サンプル値生成・UX-75 IDクリックの行き先選択・UX-76 enum説明の表示領域・UX-78 フィールド上下移動・UX-80 横ぐし並び順・UX-84 enum default配置。**8件すべて実施（2026-08-12。詳細は BACKLOG 各行）** | 小×8 |
          | **第2波 検証・ID体験** ✅ | 中核ループ「検証に導かれて埋める」とID入力の強化 | UX-70 型変更時の残留値・UX-06 既存ID補完ピッカー・UX-64 自動採番・UX-79 ID型へのpattern適用・UX-44 全体検証のGUI（検証タブのスコープ切替）・UX-05 検証指摘クリックの透明化。**6件すべて実施（2026-08-12。詳細は BACKLOG 各行。UX-06/64/79 はID入力支援として一体設計＝pattern が検証・採番の共通パターン源）** | 中×6 |
          | **第3波 情報密度** ✅ | 要約・一覧の「何が何だか分かる」度を上げる | UX-71 畳みヘッダ要約の強化・UX-77 role: subtitle 活用・UX-68 横ぐしの親ノード情報・UX-73 メタスキーマ未追随の棚卸し。**4件すべて実施（2026-08-13。詳細は BACKLOG 各行。UX-71 はタイトルの索引借用＝titleLookup 注入として実装）** | 中×4 |
          | **第4波 編集の根幹** ✅ | ソース同期モデルとUndo粒度（設計議論→実装） | UX-23 ソースタブのライブ同期・UX-11 Undoのキーストローク単位合体。**2件とも実施（2026-08-13。設計は ARCHITECTURE §4.34 に起こしてから実装。詳細は BACKLOG 各行）** | 大×2 |

          **進め方**: 各波の完了ごとに試し方（操作手順＋見てほしい観点）を提示し、S1 の部分再実施で体感を確認してから次波へ進む（CONVENTIONS §7）。第2波の UX-06/64/79 はID入力支援として一体で設計する（pattern が採番と検証の共通のパターン源）。第4波は着手前に設計論点（パース不能テキストの扱い・履歴エントリの合体規則）を ARCHITECTURE へ起こす。UX-44 の初回スコープは「現文書／全体」の2値とし、「影響範囲」定義の議論（UX-07）は持ち込まない。
