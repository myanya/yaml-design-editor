- id: RH-029
  title: 'P23: 二層モデル④: エンティティページとグラフレンズ ✅ 完了（2026-08-10）'
  body:
  - text: |-
      狙い: 論理層の読み書き面を人間とAIの共有契約として確立する。ノード中心の「エンティティページ」を主役に据え、参照グラフ（X-03）を作り直す。文書ビュー（X-07）は「文書中心の読み面」、エンティティページは「ノード中心の読み書き面」という役割分担を完成させる。

      **前提と着手手順**: P20（宣言・EntityGraph）・P21（エンティティ操作・レジストリ強制）・P22（クエリ）に依存する（R23-01 のみ P20 だけで着手可）。UIの変更が大きいフェーズのため、着手時に本節と §4.9・ARCHITECTURE §4.16（ID横ぐしの現行不変条件: `fieldAt` / `slotAt` 共有・ビュー専用の書込経路を作らない）・§4.22（表示解決）・§4.24（スペース・モーダル新設禁止・状態の退避先）を読み、設計を ARCHITECTURE へ反映してから実装する。Compose UI は自動テスト対象外（L-09）のため、core 側の合成ロジックにテストを置き、UIは UX-SCENARIOS の触り心地試験（S1/S2 の改訂）で確認する計画までをフェーズ内に含める。完了時は FEATURES.md 登録・MANUAL 更新・試し方の報告まで。

      方針（承認済みの設計判断）:

      - **合成は core・UIは購読**: エンティティ全体像の合成（R23-01）は core の純ロジックに置き、UI（R23-02）・エージェント（R23-04）・CLI が同じ合成を消費する（人間とAIが同じ「エンティティの1枚」を見る＝S-13 と同じ共有契約の流儀）。
      - **編集経路は増やさない**: エンティティページの編集は合成値の座標先（文書キャッシュのツリー）への `Slot` ルーティング＝ID横ぐしビューの既存経路のまま（§4.16）。合成表示は「どこを編集するか」の案内であって、新しい書込面ではない。
      - **アスペクトの判定は誤検知回避優先**: `owns` 宣言のない出現同士の重複所有は判定しない（ビューリント §4.14 と同じ「見逃しは許容・誤検知で作者を煩わせない」）。
      - **レンズは宣言化を急がない**: まずUI操作（型・関係のチェックボックス＋起点ID）のアドホックなレンズで出し、宣言的レンズ定義（`_views` の `kind: lens`）は需要が出てから起こす。
  - head: |-
      | ID | 項目 | 状態 | 内容 |
      |---|---|---|---|
    rows:
    - id: R23-01
      title: アスペクト宣言とエンティティ合成
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) S-22 / C-13 / V-10）。`entity.aspect`（省略時スキーマID）と `owns:`（省略時は宣言フィールド全部＝`type: id` 除く）・レジストリ `entities:` 節（`{type, label, description, aspects: [{name, label}]}`＝型の表示名とアスペクト順序。`builtin-relations`・スキーマ設計UIを対更新）。**検証**: 重複所有 WARNING（双方に entity 宣言・少なくとも一方が明示 owns の組だけ判定＝誤検知回避）。**合成**: `core/Aspects.kt` が「定義出現→アスペクト宣言順→アスペクト名→ファイル順」で所有フィールドを座標つきにマージ（重複所有は隠さず注記・スキーマなし出現は unassigned・書き先解決 `ownerSection`）。`fieldAt` は schema 層へ移設（validate から使うため。`Views.fieldAt` は委譲で互換）。テスト: `AspectTest` 新設'
    - id: R23-02
      title: エンティティページ
      cells:
