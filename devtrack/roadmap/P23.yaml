    - id: R23-03
      title: グラフレンズ
      cells:
      - ✅
      - '2026-08-10 実装（[FEATURES.md](../FEATURES.md) X-03 刷新）。①起点近傍（深さ1〜2。エンティティページから遷移・起点解除／深さ切替）②エンティティ型・relation のチェックボックスで絞る部分グラフ。ノードは EntityGraph のエンティティ（型で色分け・凡例・起点強調）・エッジは relation の label・クリックはエンティティページへ着地（履歴 I-08）。`GraphLayout` 再利用。宣言的レンズ定義（`kind: lens`）は需要待ちで見送り'
    - id: R23-04
      title: AIへの開示
