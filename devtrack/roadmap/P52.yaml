id: P52
number: 52
title: 開発管理を YDE で行う（devtrack）
table_title: 開発管理を YDE で行う（devtrack。指摘・テーマ・所感メモを YAML の原本にし、台帳を生成する）
status: in-progress
status_note: 段階 0・1・2a・2b 完了（2026-11-07）・2c-1〜2c-3 の仕組み完了（2026-11-08）。判断待ちにする決定の候補をオーナーが選ぶ（下記）
body:
  - text: |-
      本ツールの開発管理（指摘・テーマ・所感メモ、のちに機能索引とロードマップ）を、YDE のワークスペース [devtrack/](../devtrack/README.md) の YAML を原本にして行う。
      台帳の Markdown（docs/BACKLOG.md・記録）はレポートで生成する派生物で、CI が「検証のエラー 0」と「生成物が最新」を守る。
      使って分かった不足は、その場で devtrack に登録し、製品の改善として直す（自分で使って育てる）。
  - columns: basic
    items:
      - id: R52-01
        title: '段階 0: 取り込みの写し'
        content: BACKLOG.md と記録を 1 件 1 ファイルで取り込み、画面と CLI で眺めた。番号の重なり 3 件（UX-140・171・172）を振り直した
        state: done
        state_on: 2026-11-07
      - id: R52-02
        title: '段階 1: 原本の切り替え'
        content: '指摘・テーマ・所感メモの原本を devtrack にし、BACKLOG.md と記録をレポートで生成（`./gradlew devtrackDocs`）。操作（登録・状態の変更・一部の解決・解決）・解決の日と解決の記録・repo-tests
          の `DevtrackTest` とコミット前のフック。製品: 表のセルの形 `{パス:cell}`'
        state: done
        state_on: 2026-11-07
      - id: R52-03
        title: '段階 2a: devtrack の仕上げと製品の改善'
        content: '関連する指摘（`related`）・記録の種類（一部・解決・見送り・再開）・再開の操作・登録の採番・長く手付かずの区画。製品: 文書を作る手の採番 `create.id`・値の式の日付の差 `daysBetween`・画面の起動の作業ディレクトリ（UX-261）・開いたときのステータス（UX-262）・クロス集計の行の未分類
          `rows.unclassified`（UX-266）・説明の山括弧（UX-267）'
        state: done
        state_on: 2026-11-07
      - id: R52-04
        title: '段階 2b: FEATURES を devtrack へ'
        content: '下の「段階 2b の方針」の 2b-1〜2b-4（✅）。2b-1: 機能 250 件を 1 件 1 ファイルにし、FEATURES.md を生成（欄の区切りを「・」に・テストの種類・節の中は ID の順。`DocReferencesTest`
          は生成物の上でそのまま効く）。操作「機能を登録する」（系統ごとの採番）。製品: ひな形の繰り返しの `more`・`create` の採番の接頭辞に受け取った値'
        state: done
        state_on: 2026-11-07
      - id: R52-05
        title: '段階 2c: ROADMAP を devtrack へ'
        content: 本文も YAML で持ち、下の方針で構造化する。完了したテーマの R 項目（記録の側の 177 件）も取り込み、指摘の対応先の R・P を参照にする
        state: in-progress
        state_note: 2c-1（今の ROADMAP.md の取り込みと原本の切り替え）・2c-2（記録）・2c-3（参照と判断待ちの一覧）✅ 2026-11-08。判断待ちにする決定の候補をオーナーが選ぶ
sections:
  - title: 段階 2b の方針
    body:
      - points:
          - decision: 決めたこと
            status: decided
            date: 2026-11-07
            by: オーナー
            text: |-
              試用（R49-72）の振り返りを待たずに始める。移すときは今の表の形を保ち、整理は切り替えのあとに回す。
                FEATURES はエージェント向けの索引とみなし、エージェントが使いやすい工夫を入れる。manual への参照は最初から持たせる。
                機能の行に未解決の指摘の ID を出す。内部の機能は manual の参照の代わりに「—（内部）」と明示する。
                大きさは目安（8 万字）を超えても構わない（grep で引くので影響が少ない）。系統ごとのファイルに分けるかは、FEATURES の運用がこなれてから議論する（UX-269）。
            id: DEC-009
          - label: 2b-1
            text: 取り込みと原本の切り替え、manual の参照を全行に埋めた「操作の説明」の列（内部の基盤は印。どちらかを検査で必須）（✅）。
          - label: 2b-2
            text: |-
              指摘に関わる機能の参照（関係 `concerns`）を足し、対応先の文字の機能 ID を参照にした。D-18・D-26〜29 は意図的差分の番号で機能ではないので文字のまま、L-14 は X-06 へ。機能の行に未解決の指摘の ID、BACKLOG.md に関わる機能を出す（✅）。
                未解決の指摘は全件を読んで関わる機能を付けた（機能に結びつかない文書・テスト環境・開発環境・サンプルの指摘は付けない）。
          - label: 2b-3
            text: 手動の確認をテストの並びから外し、機能の印 `manual_check`（場面つき）にした。手動確認だけの機能の一覧を FEATURES.md の末尾（skill `ui-check` の案内つき）とダッシュボードに出す（✅）。
          - label: 2b-4
            text: |-
              冒頭に系統の表（接頭辞 → 節 → 範囲）と引き方を置き、設計の欄を見出しで指す（228 件。一般の節しか合わない 22 件は文書だけ）（✅）。
                機能の欄は「何の機能か」と grep の手がかりになる語彙だけを残し、振る舞いの説明は指し先の manual と architecture に任せる（オーナーが見本で決めた）。100 字を超える 25 件を書き直した。
  - title: 段階 2c の構造化の方針
    body:
      - points:
          - decision: 決めたこと
            status: decided
            date: 2026-11-07
            by: オーナー
            text: ROADMAP の本文を YAML として持つことに違和感はない。ただし構造化はしっかり行う。
            id: DEC-010
          - label: テーマ（P）
            text: |-
              ID・名前・状態（列挙。未着手・進行中・定常運用・完了）・状態の補足・目的と考え方・節の並び。
                状態表はテーマから生成し、手で合わせない。
          - label: 節
            text: テーマに保有される要素（見出し・本文・R 項目の並び）。今の「#### 段階 1」「#### 設計」のような小見出しが節になる。
          - label: R 項目
            text: |-
              節に保有される要素。今の表の見出し 4 通り（項目・内容・判断・作業・主な場所・前提・完了条件・状態）は 1 つの型の項目の組で表し、使わない項目は書かない。
                完了の日・関連する指摘・対応した機能（2b のあとは参照）を持つ。枝番（R28-05a など）は R 項目の子にする。
          - label: 判断
            text: |-
              「オーナー判断」は判断待ち・決定（日付・内容・ADR への参照）を構造で持つ。
                BACKLOG の議論待ちとまとめて、判断待ちの一覧をダッシュボードに出す。
          - label: 記録
            text: |-
              完了したテーマは状態で見分け、記録（archive/roadmap-history.md）も生成する。
                ビジョン・中核コンセプト・設計原則・リスクは、メモ（`notes/`）か専用の型で持つ。
          - label: 確かめ方
            text: 生成した ROADMAP.md と記録を今の文書と行ごとに突き合わせ、落ちた文が無いことを確かめてから原本を切り替える（段階 1 と同じ進め方）。
          - decision: 決めたこと
            status: decided
            date: 2026-11-08
            by: オーナー
            text: |-
              R 項目の状態の書き方をそろえる（「✅ 日付（補足）」「📋 未着手」「🚧 進行中」「🚧 一部完了（日付: 補足）」「→ R47-41」）。
                本文の表・コード・文は Markdown のかたまりのまま持ち、構造にするのはテーマ・節・R 項目・決定・状態だけにする。
                記録は本文をそのまま取り込み、生成した記録を今と同じ文字にする（記録の状態の書き方はそろえない）。
                決定には決定済み・判断待ちの印を持たせ、取り込みではすべて決定済みにする（判断待ちの候補は本文から拾ってオーナーに見せる）。
            id: DEC-011
          - label: 2c-1
            text: |-
              今の ROADMAP.md を取り込み（テーマ 52 件〔未完 20 件〕・R 項目 130 件・メモ 3 件・テーマの候補とリスク）、レポート `roadmap-md` で生成して原本を切り替えた。今の文書との違いは、状態の書き方をそろえた 27 行と、状態の表の P48・P49 の順だけ（✅）。
                製品: 変換の `$each` の源にビューの行（`{$view: …}`）・レポートの名前を付けた組み立て `rules`。
          - label: 2c-2
            text: |-
              記録（archive/roadmap-history.md）の 68 項を、それぞれのテーマの記録の項（`history`。RH-001〜068 が記録の中の順）にし、生成して原本を切り替えた。生成した記録は今の文字と同じ（✅）。
                本文は文のまま、R 項目の表（177 件）だけを構造にし、欄は書いたまま持つ（状態の書き方はそろえない）。今のロードマップにも同じ R 項目がある行（R30-01〜05）は写しの元を参照する。
                枝の項目は、元の行が同じ表に無い（R49-11・12 は今のロードマップ、R16-03 はどこにも無い）ので子にせず、枝の元を参照で持つ（R16-03a〜c は元なし）。
                製品: 絵文字が読み込みの 1024 字目の境をまたぐと YAML が読めない不具合を直した（UX-270）。
          - label: 2c-3
            text: |-
              指摘のロードマップの項目（`roadmap`。98 件。対応先の文字の R・P と、R 項目の文に書いてあった指摘の ID から）と、R 項目の実装した機能（`features`。110 件）を参照にした。R 項目とテーマの側には関わる指摘が出る（✅）。
                決定 11 件に ID（DEC-001〜011）を振り、判断待ち（`status: pending`。「判断待ち（日付 誰）」の見出し）と、ダッシュボードの「判断待ちの決定」の区画を足した（✅）。
          - id: DEC-012
            status: pending
            date: 2026-11-08
            by: オーナー
            text: |-
              判断待ちにする決定を、本文から拾った候補から選ぶ。候補は、P28 の次の項目・P29 の OQ-03（文書分割）・P36 の残る判断 4 つ（見た目の方向・可変幅フォント UX-148・Markdown のアプリ内編集 UX-149・図を足す場所）・P43 の R43-10（大きな文書の描画）・P44 の次の候補の優先順位。
                「必要になったら」に近いもの（P31 の R31-04 の残りの応用・P41 の R41-08 の決定的な自動実行・P42 の R42-06 のエージェントへの開示）は判断待ちにしない案。
