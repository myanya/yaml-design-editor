id: P49
number: 49
title: ローカル接続と業務 Web・トレイ常駐
status: in-progress
status_note: v0.3.0 向けに実装中、接続設定・常駐・所有管理、API・CLI・MCP・Web の業務閲覧と操作・通し試験まで完了、次は配布検査。その後に約 2 週間の試用と機能追加・改善を行う
body:
- points:
  - label: 目標版
    text: v0.3.0。現在の v0.2.0 を起点に、一通りの開発・受入後、オーナーが約 2 週間試用する。その結果を受けた機能追加・改善と再検証を終えてから版を上げる（2026-11-01 オーナー方針）。
  - decision: 合意した方向
    status: decided
    date: 2026-10-31
    by: オーナー
    text: |-
      同じ PC 内の利用に限定し、単一の YDE プロセスへデスクトップ・HTTP API・MCP・業務 Web を接続する。
        通常の編集はデスクトップ、Web は業務の閲覧と定義済み操作を担当する。
  - label: 追加要件
    text: |-
      API・MCP・Web はデスクトップの設定から個別に ON/OFF できる。
        新規導入と設定のない旧版からの更新ではすべて OFF、すべて OFF の間は本機能の待受ポートを開かない。
  - label: 状態
    text: 実装中。ここが本開発の作業・受入条件の台帳で、以下の型名・パッケージ名・経路は、完了と記したものを除き実装予定を表す。
  - label: 既存計画との関係
    text: |-
      R47-70 の実施と、常駐・Web の構想を本テーマへ集約する。
        汎用のリファクタリング公開や射影ビューの拡張は、下記の必須範囲へ混ぜない。
sections:
- title: 対象範囲
  body:
  - text: |-
      | 区分 | v0.3.0 で扱うもの |
      |---|---|
      | 利用環境 | 同じ PC・同じ OS ユーザーのローカル利用、初期範囲は同時に一つのワークスペース |
      | デスクトップ | 既存の編集・設計・履歴・承認と、接続設定・トレイ・画面非表示での起動 |
      | API | 文書・エンティティ・検索・ビュー・検証の取得、業務操作の計画と明示適用、作業コピーへのパッチ・新規文書・提案提出・直接確定 |
      | MCP | 保存済みの参照・作業コピーの編集・検証・許可した業務操作と、作業の開始・提案提出・直接確定・結果照会・破棄 |
      | Web | ダッシュボード、grid・matrix・chart の業務表示、業務詳細と参照、検証・レポートの閲覧、定義済み操作の入力・確認・適用 |
      | 常駐 | ウィンドウを非表示にしても、許可した接続・監視・実行・承認待ちを保持 |
      | 対象外 | LAN・インターネット公開、複数利用者の共同編集、独立 daemon・OS サービス、ログイン時の自動起動 |
      | 対象外の操作 | Web での任意のフォーム・ソース・スキーマ編集、外部接続からの任意コード実行と定義文書の自由な書換え |

      フロー図・スキーマレンズ・汎用文書編集の Web 描画と、専用リファクタリング API は後続の需要で扱う。
      Web の未対応ビューは理由を示してデスクトップへ案内し、空の結果として扱わない。
      外部 AI の変更は提案と人の承認を既定にする。
      自作ツールの業務操作は、接続登録時に許した操作・対象範囲について、明示的な適用要求で実行できる。
- title: 接続設定と待受
  body:
  - text: |-
      設定の場所はデスクトップの「設定 → ローカル接続」とする。
      API・MCP・Web の三つのスイッチ、接続先、実際の稼働状態、停止理由、接続者と権限、資格情報の失効を同じ画面へ置く。
      設定は利用者のアプリ設定に保存し、ワークスペースの YAML を開いただけでは有効にならない。
      既に利用者が ON にした設定は再起動後に復元し、未設定の項目は必ず OFF として扱う。

      共通の Ktor サーバが一つの TCP ポートを共有する。
      起動条件は `apiEnabled || mcpEnabled || webEnabled` で、各要求の受付条件は該当機能が実際に ON であることとする。
      初期の接続先は `127.0.0.1:18765` とし、ポートは停止中に変更できる。
      全 NIC へのバインドと、ポート占有時の無断の別ポートへの切替は行わない。

      | API | MCP | Web | 待受 | 有効な経路 |
      |---|---|---|---|---|
      | OFF | OFF | OFF | なし | なし |
      | ON | OFF | OFF | 一つ | `/api/v1` |
      | OFF | ON | OFF | 一つ | `/mcp` |
      | OFF | OFF | ON | 一つ | `/app`・`/web-api` |
      | ON | ON | OFF | 一つ | `/api/v1`・`/mcp` |
      | ON | OFF | ON | 一つ | `/api/v1`・`/app`・`/web-api` |
      | OFF | ON | ON | 一つ | `/mcp`・`/app`・`/web-api` |
      | ON | ON | ON | 一つ | すべて |

      `/api/v1` は自作ツール向けの公開契約、`/web-api` は Web 画面に必要な業務通信である。
      後者も HTTP であり、画面専用の認証・許可した業務操作だけを受け、内部だから安全とは扱わない。
      API を OFF にしても Web は単独で動き、Web を OFF にしたら画面と業務通信の両方を止める。
      設定には「Web を有効にすると、画面と画面用の通信をこの PC 内で待ち受けます」と説明する。
      実装を共有するのはサービス層で、Web から無効な公開 API へ迂回して接続しない。

      - 三つとも OFF の起動ではサーバをバインドせず、health・検出・メトリクス用の別ポートも開かない。
      - 無効な機能の経路は 404 とし、UI 上の表示だけでなく要求受付側で拒否する。
      - 設定した希望値と実際の状態（停止・起動中・稼働・停止中・エラー）を分け、バインド失敗を稼働中と表示しない。
      - 一つの機能を OFF にしても、ほかの ON の機能の接続を維持する。
        該当機能の新規要求を直ちに止め、既存のストリーム・セッションとその機能の認可を失効させる。
      - 実行中の読み取りや未適用の長い処理はキャンセルし、保存中の変更は既存の適用処理が結果を確定するまで待つ。
        保存途中でスレッドを強制停止せず、状態を「停止中」と表示する。
      - 最後の機能の停止完了後は、受理済み要求・keep-alive・ストリームを閉じ、待受ソケットを解放する。
        停止エラーは表示し、OFF 完了を偽らない。
      - 停止しても未保存編集・提出済みの変更セット・確認用の記録を捨てない。
        Web の開いたままのタブと MCP の再接続も、停止した経路を利用できない。
      - 設定変更を同じ管理経路で直列化し、連続した ON/OFF や起動中の OFF でサーバを二重起動しない。
      - トレイ常駐と画面非表示は別設定で、サーバの有効化を伴わない。
        トレイから Web を開く際も、Web が OFF なら設定へ案内し、勝手に ON にしない。
- title: 技術とモジュール
  body:
  - text: |-
      | 場所 | 採用する技術・追加する責務 |
      |---|---|
      | カーネルの三層 | 既存の Kotlin/JVM・JDK 21・YAML・Calculus・履歴・適用を共用 |
      | app-core | 通信非依存の `app.service` を追加し、操作窓口・作業コピー・提出管理・権限判定・更新通知を提供 |
      | local-server（追加） | Ktor Server/CIO、公式 MCP Kotlin SDK、JSON DTO、認証、接続の ON/OFF、Web 資源配信 |
      | desktop | 共通状態とサーバの組立て、設定保存、JDK の SystemTray と Compose の画面、監視と処理の生存期間、EDT との接続 |
      | agent | LLM と自動実行を維持し、共用できる提出・承認処理を app-core へ寄せる |
      | cli | 独立実行を維持し、所有中の書込を制御。明示した接続モードでは API のクライアントを使用 |
      | web-ui（追加） | React・TypeScript・Vite、MUI Core、React Router、TanStack Query、ECharts |
      | API 契約とテスト | OpenAPI 3.1・openapi-typescript、kotlin.test、Ktor testApplication、Vitest、Playwright |

      通信基盤の採用版は MCP SDK 0.16.0・Ktor 3.5.2・Serialization 1.11.0。
      Kotlin 2.4.21・Coroutines 1.11.0 と組み合わせ、依存の宣言を version catalog、local-server の解決結果を lockfile に固定した。
      既存機能の回帰と同梱ランタイムの最小起動の結果は [初期工程の記録](archive/roadmap-history.md) にある。
      認証基盤・設定画面・業務経路・ブラウザへのログイン導線の受入は完了した。ライブラリを更新するときは同じ検査を通す。

      選定の参照: [MCP SDK の版](https://github.com/modelcontextprotocol/kotlin-sdk/releases/tag/0.16.0)・[同タグの依存定義](https://github.com/modelcontextprotocol/kotlin-sdk/blob/0.16.0/gradle/libs.versions.toml)・[Ktor](https://ktor.io/docs/server-engines.html)。
      Web の参照: [React](https://react.dev/learn/build-a-react-app-from-scratch)・[MUI](https://mui.com/material-ui/getting-started/installation/)・[Query](https://tanstack.com/query/latest/docs/framework/react/overview)・[ECharts](https://echarts.apache.org/handbook/en/basics/import/)。

      ```text
      desktop ──→ local-server ──→ app-core ──→ workspace-core ──→ semantic-core ──→ yaml-core
         ├──────→ agent ─────────→ app-core
         └──────→ format-office → app-core
      cli ──────→ app-core / agent / format-office / local-server の client
      web-ui ── HTTP ──→ local-server
      repo-tests ──→ 入口をまたぐ契約と依存規則
      ```

      矢印は依存方向（Web だけ実行時の通信）で、desktop は app-core も直接使う。
      local-server は組込み用の JVM モジュールで、独立プロセスを必須にしない。
      MCP と HTTP API と Web 配信は同じモジュールのパッケージに分け、app-core から Ktor・MCP SDK・Compose へ依存させない。
      CLI 用の通信アダプターは local-server の client に置き、接続モードからサーバを起動しない。
      web-ui は Node のプロジェクトとして管理し、ビルド済み資源を Gradle から同梱する。
      Node・npm・フロントエンドの版はロックし、利用者の PC には Node を要求しない。
      図・入力・表示のライブラリは共通部品で包み、業務の評価器をブラウザへ増やさない。
- title: 共通状態と操作契約
  body:
  - text: |-
      - `WorkspaceHost` が既存の Workspace と DocumentSession を保持し、画面と接続窓口へ同じサービスを渡す。
        ディスクの写しと編集用セッションは統合しない。
      - 通常の外部読取は保存済みの状態、デスクトップは未保存編集込み、外部の作業中は作業コピー込みと明示する。
        索引と本文を同じ版から読み、応答へワークスペース・起動世代・版を含める。
      - 接続の許可はワークスペース ID と結び、要求で任意のディレクトリを開かせない。
        デスクトップで切り替えるときは旧ワークスペースへの処理を収束させ、既存の作業 ID・計画を新しい対象へ付け替えない。
        新しいワークスペースへの接続は別途許可し、以前の接続者へ自動公開しない。
      - 現在の UI の直接編集も含めてセッションへのアクセス順を統一する。
        初期の desktop 接続は既存の DesktopUiDispatcher に合わせ、長い計算は独立したスナップショットで行う。
        HTTP 側だけの Mutex で済ませず、既存の IO 中の排他と画面の追随も確認する。
      - 変更は作業コピーまたは ActionPlanner の計画 → 検証 → 確認済みの変更セット → ChangeSetApplier とする。
        対象に未保存編集や解析できないソース下書きがあれば適用を止める。
      - 外部確定は、変更対象と影響先の検証エラーが残る場合に拒否する（2026-10-31 オーナー確認済み）。
        既存のエラーも含み、警告だけなら許可する。外部提案をデスクトップで承認する場合も同じ条件とし、外部要求に検証を免除する指定を公開しない。
        操作の前提の違反・保留などは既存の判定を維持し、指摘がないことだけで充足と判断しない。通常のデスクトップ編集と内蔵エージェントの既存設定は維持する。
      - 計画には入力・対象・計画時刻・参照した状態の版を結び、確認後にデータ・定義・権限が変わったら再確認させる。
        初期版はワークスペース全体の版による保守的な失効を許し、対象ファイルのハッシュだけで前提の変更を見逃さない。
      - API の再送は接続者・要求 ID・要求内容を照合して二重適用を防ぐ。
        要求結果を照会できるよう記録し、保存中断で結果不明なら自動再実行せず、照合・復旧を求める。
        複数ファイル保存全体の原子性を保証するとは表現しない。
      - 外部からの確定はデスクトップの Undo 対象に追加せず、操作元と結果を記録する（ADR-0017）。
        通常文書は文書単位で古い履歴を適用不可にし、競合する一手で止める。複数文書の一手は分割せず、無関係な履歴を残しても飛び越えない。
        外部へ Undo/Redo は公開せず、作業コピーの保存・破棄を基本とする。スキーマ・配置ルールなど前提を広く変える外部確定では過去の全履歴を適用不可にする。
        外部確定後のデスクトップ編集は通常どおり戻せる。再起動をまたぐ Undo の永続化は本テーマで増やさない。
      - 外部作業は通信接続と別の作業 ID を持ち、開始・検証・提出・承認待ち・適用・却下・破棄・失敗を管理する。
        開始時に提案か直接確定かを固定する。提案はデスクトップ承認、直接確定は外部から計画を確認して保存する（ADR-0019）。
        提出済みの変更セットと適用結果は再起動後も照会でき、復元時は競合・権限を再検査して自動適用しない。
        未提出の作業コピーはプロセス内で保持し、再起動後の不明な ID を成功扱いしない。
        記録の置き場は WorkspaceLayout に従い、既存の実行記録との責務を決める。資格情報を作業記録へ混ぜない。
      - 提出・検証の共通化で、内蔵エージェントの定義読込ゲートを弱めない。
        agent 固有の読込は注入で残し、app-core から agent へ逆依存しない。
      - 接続登録・権限変更はデスクトップで行い、接続者は自分の権限を広げられない。
        閲覧・変更提案・直接確定・許可した業務操作の適用を分け、未設定の接続権限は拒否する。
        ToolPolicy の空一覧が制限なしである既存の意味を、外部接続の既定権限へ流用しない。
      - 一つのワークスペースの所有を OS のファイルロックで管理する。
        ロックの検出に TCP を使わず、旧構成へ `.yde` を作って配置モードを変えないユーザー用アプリ領域を使う。
        常駐中の独立 CLI 書込は拒否し、明示した接続経由の書込は API が ON の場合に限る。
        既存の外部ファイル変更検出は維持し、他ツールの書込まで排他できるとは扱わない。
      - ローカルでも接続認証・Host/Origin 検査・ブラウザの CSRF 対策・入力サイズと実行量の上限を設ける。
        Web の本文はデータとして表示し、レポートや Markdown の HTML・リンクから任意コードを実行させない。
        接続設定と登録権限は OS ユーザーの専用領域で保護し、接続トークンはメモリだけで保持する。ワークスペース・URL・通常ログへ資格情報を書かない。
      - MCP は Streamable HTTP を必須とし、HTTP クライアントと Inspector で相互運用を確認する。
        stdio の中継は初期版の必須外とし、追加時も MCP が OFF なら拒否し、サーバを暗黙に有効化しない。

      Core Calculus の位置づけは、読取が Term / Query、表示値が Expression / Aggregate、前提と検証が Predicate、操作入力の準備が Construct、変更計画が Rewrite である。
      通信・認証・接続の ON/OFF は実行基盤の責務で、新しい業務語彙・評価器・原本への書込経路を追加しない。
      既存の規律は [workspace](architecture/workspace.md)・[actions](architecture/actions.md)・[agents](architecture/agents.md)・[dashboards](architecture/dashboards.md) を参照する。
- title: 実施順序
  body:
  - text: |-
      各行は一つ以上の小さな実装単位に分け、挙動変更と対応するテスト・文書を同じコミットへ含める。
      段階を飛ばして外部への更新を公開せず、前提の受入条件が通ってから次へ進む。
      日程は初期の依存検証と共通状態の移行結果を見て見積もり、未確認の工数を確約しない。
  - columns: work
    items:
    - id: R49-00
      title: 契約と境界を ADR にする
      places: decisions・CONVENTIONS・規則テスト
      prereq: 本計画
      done_criteria: ADR-0013 の入口構成への追加と、三つのスイッチ・共通状態・公開範囲が確定
      state: done
      state_on: 2026-10-31
      state_note: ADR-0016・規則20
    - id: R49-01
      title: 依存の組込み検証
      places: local-server・gradle・配布検査
      prereq: R49-00
      done_criteria: SDK・Ktor・Serialization の組合せで既存テストと同梱ランタイムの最小起動が通る
      state: done
      state_on: 2026-10-31
      state_note: '[記録](archive/roadmap-history.md)'
    - id: R49-10
      title: 共通状態と通知の所有を移す
      places: app-core・desktop・workspace-core
      prereq: R49-01
      done_criteria: AppState が共通状態を受け取り、画面の開閉でセッション・履歴・監視を失わない
      state: done
      state_on: 2026-10-31
      state_note: '[記録](archive/roadmap-history.md)'
    - id: R49-11
      title: 操作計画・適用の共通契約
      places: app-core・workspace-core
      prereq: R49-10
      done_criteria: 未保存・古い計画・権限変更・二重要求・保存失敗と、ADR-0017 の外部確定・履歴失効を同じ窓口で扱う
      state: done
      state_on: 2026-10-31
      state_note: '[記録](archive/roadmap-history.md)'
    - id: R49-12
      title: 作業と提出・承認を共通化
      places: app-core・agent・desktop
      prereq: R49-11
      done_criteria: 外部作業の提出を受信箱で承認でき、再起動後も提出と結果が残る
      state: done
      state_on: 2026-10-31
      state_note: '[記録](archive/roadmap-history.md)'
    - id: R49-20
      title: 接続の状態機械と三つのスイッチ
      places: local-server・desktop
      prereq: R49-10
      done_criteria: 全八組合せと起動中・停止中の切替で、待受と経路が上の表に一致
      state: done
      state_on: 2026-10-31
      state_note: '[記録](archive/roadmap-history.md)'
    - id: R49-21
      title: 接続認証と能力別の受付
