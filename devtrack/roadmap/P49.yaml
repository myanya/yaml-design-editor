  - text: |-
      依存の主経路は「契約・依存確認 → 共通状態・変更契約 → 接続制御・認証 → API / MCP / Web → 通し試験・配布検査 → 約 2 週間の試用 → 機能追加・改善と再検証 → リリース」である。
      工程上は API と MCP の入口を独立に進められるが、共通状態の移行とセッションの排他は先に確定する。
      API の公開前に R49-31 の所有権管理まで通し、各経路の試験中も設定を暗黙に ON にしない。
      R49-00 では新モジュールを SourceScanner・ModuleRules・SourceRules の検査へ登録し、app-core とカーネルへ通信・画面依存が入ることを機械で止める。

      R49-11・12・20・21・22・30 の実装と受入検証の記録は [実装記録](archive/roadmap-history.md)、現在の契約と部品は [ローカル接続](architecture/local-connections.md) にある。
      提案と直接確定は別権限・別方式とする（ADR-0019）。MCP の作業経路も共通の WorkspaceWork を使い、両方式と破棄・結果照会を公開する。
- title: 必須受入条件
  body:
  - text: |-
      | 観点 | 操作・条件 | 合格条件 |
      |---|---|---|
      | 未使用時 | 新規導入・v0.2.0 の設定で起動し、すべて OFF のまま常駐 | 本機能の TCP 待受がゼロで、通常編集・保存・履歴が動く |
      | 八組合せ | API・MCP・Web の全組合せで再起動と実行中切替 | ソケットと全経路を実際に調べ、待受表と一致 |
      | 単独利用 | Web だけ ON、API だけ ON、MCP だけ ON | 各機能が独立して使え、ほかの経路と資格情報では利用できない |
      | 停止 | 開いたブラウザ・MCP ストリーム・keep-alive がある状態で OFF | 新規操作を拒否し、停止完了後の接続が閉じ、最後の OFF でポート解放 |
      | 切替競合 | 起動中の OFF、連続切替、ポート占有、停止失敗 | 二重サーバ・偽の稼働表示・無断の別ポート待受がない |
      | 権限 | トークンなし・期限切れ・別機能のトークン・不正 Origin・任意ファイル要求 | 拒否され、原本と作業コピーを変更しない |
      | ワークスペース切替 | 接続と作業が残ったまま別のワークスペースへ切替 | 旧 ID の誤適用と新しい対象の自動公開がなく、明示した許可の範囲を保つ |
      | 並行操作 | desktop・API・MCP・Web から同じ対象を変更 | 順序と版が管理され、未保存内容や解析不能な下書きを上書きしない |
      | 古い確認 | 操作確認後にデータ・定義・対象・入力・権限を変更 | 古い計画を適用せず、再確認へ戻す |
      | 再送と中断 | 同じ更新要求を再送し、応答切断・保存失敗・再起動も試す | 二重適用せず、結果不明・部分保存を成功扱いしない |
      | 履歴と監視 | 外部から確定し、画面から結果と Undo を確認 | 外部確定を Undo に載せず、競合する一手で停止し、無関係な編集と履歴・監視を保持 |
      | 提出と復旧 | MCP で提案し、画面非表示・再接続・再起動を行う | 提出済みの差分と状態が残り、再検証前に自動適用しない |
      | 複数プロセス | 二つの YDE と独立 CLI で同じワークスペースへ書く | 所有者以外の書込を拒否し、API OFF の迂回路を作らない |
      | Web の意味 | todos と orders の写しで表示・条件・操作を比較 | 同じ版・基準日・入力の共通結果と一致し、保留とゼロ件を区別 |
      | 常駐の寿命 | 窓を閉じて外部操作し、戻して完全終了 | 隠す間は状態が継続し、完全終了時に未保存・処理を扱って待受を解放 |
      | 配布 | Java・Node 未導入の Windows 環境で ZIP を展開 | 同梱ランタイムと資源で動き、既定では待受せず、ライセンスがそろう |

      待受の検査は、設定値の単体試験に加え、配布プロセスの PID に属する OS の待受一覧と実際の接続で確かめる。
      試験用のポートは分離し、終了後にサーバ・子プロセスを回収する。
      単体・契約テストは疑似時刻と SDK のテスト用通信、HTTP は Ktor testApplication を使い、外部 AI の実 API を呼ばない。
      Web は Vitest と Playwright、desktop は既存 Compose UI テストと [ui-check](../.claude/skills/ui-check/SKILL.md) で確認する。
      変更を伴う試験では samples・test-fixtures を一時領域へコピーし、labs の差分へ触れない。

      試用の導線は、todos の写しで「Web だけ ON → TODO の詳細 → 完了を確認・適用 → desktop で履歴を確認」、
      「MCP だけ ON → 外部から変更を提案 → トレイから承認待ちを開く → 差分を適用」、
      「API だけ ON → 作業コピーの差分を確認 → 直接確定 → desktop へ反映」、
      「最後の機能を OFF → 接続失敗とポート解放を確認」の四つを最初に用意する。
      orders の写しでは月別・顧客別の集計とチャート、絞り込み、業務操作後の再取得を確かめる。
- title: 完了とリリース
  body:
  - text: |-
      開発段階ごとに全モジュールの `./gradlew test` と docs-lint を通す。
      実装できた機能だけを FEATURES と manual に載せ、責務・流れ・公開契約は architecture へ反映する。
      語彙を増やす場合はメタスキーマ・設計 UI・Core Calculus の分類と規約も確認する。
      完了した作業の詳細は archive へ移し、テーマ全体の完了時にこの本文も archive/roadmap-history.md へ移す。

      全必須範囲の開発・受入と配布検査を終えた後、オーナーが約 2 週間試用する。試用開始日は開発完了後に決め、期間の経過だけでリリースへ進まない。
      試用中の指摘・追加機能の要望を BACKLOG に整理し、合意した機能追加・改善を実装して受入・回帰・配布検査を再実施する。
      その後のリリース段階で、[配布手順](releasing.md)と [release](../.claude/skills/release/SKILL.md) に従って appVersion を 0.3.0 にする。
      追加依存は JVM と npm の両方のライセンスを配布物へ入れ、Web 資源・ローカルサーバ・停止の検査を Windows 配布検査へ加える。
      公開本文に初期値 OFF、機能別の有効化、Web の対応範囲、ローカル限定、更新時の設定の扱いを明記する。
      本計画の作成では版・タグ・配布物を変更せず、GitHub への公開は公開の依頼時に行う。
