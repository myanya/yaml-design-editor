id: P13
number: 13
title: ワークスペース構造の再編（`.yde` 構成・`ledger` 宣言）
status: done
status_note: 完了
history:
  - id: RH-021
    title: 'P13: ワークスペース構造の再編（`.yde` 構成ディレクトリ・`ledger` 宣言・エディタ層／台帳層の分離） ✅ 完了（2026-07）'
    body:
      - text: |-
          狙い: 現在のワークスペースは「ルート以下の全YAML＝管理対象、`_*`＝予約」という**オプトアウト構造**で、単独運用では機能するが、①既存リポジトリへの後入れで他ツールのYAML（`.github/workflows/` 等）が索引・検証・エージェントのカタログへ混入する、②予約ディレクトリ7つがプロジェクトルートを占有し他ツールと衝突する、③派生成果物（エクスポート）の置き場が原本と構造上区別されない——という限界がある。これを `.git` / `.obsidian` 型の**オプトイン構造**へ反転する: ツール構成は隠しディレクトリ `.yde/` に収め、台帳の範囲は `ledger:` で宣言し、機能を**エディタ層**（単一ファイルで完結する機能。任意のYAMLに効く）と**台帳層**（ワークスペース横断の機構。`ledger` 配下のみ）に分離する。`ledger` 宣言はエディタを台帳へ昇格させるスイッチであり、宣言の無いゼロコンフィグ起動（現行動作＝全体が台帳）は純粋YAMLエディタ用途・後方互換として維持する。

          層の分割基準は「スキーマの有無」ではなく「**単一ファイルで完結するか、ワークスペース横断の索引が要るか**」。スキーマ適用（match→フォーム・型検証・enum・フェーズ）は単文書で完結するためエディタ層に属する（VS Code + YAML language server が任意のファイルへスキーマを当てるのと同じモデル）:

          | 層 | 対象 | 機能 |
          |---|---|---|
          | エディタ層（スキーマ無し） | 全YAML | ソース編集・スタイル保持・汎用フォーム・差分・検索置換 |
          | エディタ層（スキーマ有り） | match した全YAML | スキーマフォーム・単文書検証（型・必須・enum・フェーズ）・表示解決・表形式・スキーマ推測 |
          | 台帳層 | `ledger` 配下のみ | ID索引・参照解決・バックリンク・カバレッジ・ビュー・エージェント・自動化・入出力skill |
      - head: |-
          | ID | 項目 | 状態 | 内容 |
          |---|---|---|---|
        rows:
          - id: R13-01
            title: '`.yde/` 構成ディレクトリとゼロコンフィグ互換'
            cells:
              - ✅
              - 予約ディレクトリ7つ（`_schemas` 〜 `_runs`）を `.yde/` 配下（`schemas/` 等アンダースコア無し）へ移設可能に。`.yde/` が無いワークスペースは現行構造のまま開く（後方互換）。走査が隠しディレクトリ配下を除外しない現行不備（`WorkspaceScan.yamlFiles`
                は末端ファイル名しか見ない）を修正（`.yde` だけ例外として走査・監視する）。[FEATURES.md](../FEATURES.md) W-11
            features:
              - W-11
          - id: R13-02
            title: '`ledger:` 宣言とレイアウトポリシーの一元化'
            cells:
              - ✅
              - '`.yde/workspace.yaml` の `ledger:`（文字列またはリスト）で台帳ディレクトリを宣言。散在していた `startsWith("_")` 判定を `layout/WorkspaceLayout`（workspace-core）へ集約し、「索引除外（`indexExcluded`）」「書込可否（`inLedger`
                / `writableByMeta`）」「スキーマ適用の特例（`zoneOf`）」の3つの意味を分解した。エージェント・自動化・入出力skill・ビューの世界は `ledger` 配下に限定。glob は従来どおり**ワークスペース相対の単一座標系**を維持（root相対は採らない。スキーマが台帳外にも当たるため）。構成ファイルの変更はスキーマ変更と同じ全再構築扱い（`noteDiskChanges`）'
          - id: R13-03
            title: エディタ層のスキーマ適用
            cells:
              - ✅
              - 台帳外のYAMLにも match によるスキーマフォーム・単文書検証を適用（開いた文書ごとの個別診断。一括走査・増分索引は `ledger` のみ＝大量のYAMLを持つリポジトリでも起動・索引コストに乗せない）。`ref`
                の解決・未解決検出は索引が要るため台帳限定（外では `Severity.INFO` へ降格・カバレッジ判定なし）。検証パネル・CLI `validate` の集計は台帳基準。[FEATURES.md](../FEATURES.md)
                W-12
            features:
              - W-12
          - id: R13-04
            title: ツリー表示と移行支援
            cells:
              - ✅
              - ファイルツリーは台帳外も表示し視覚的に区別（薄色・既定で畳む）して「ついでに直す」編集を残す。レガシー→`.yde` の移行は CLI `migrate`（ディレクトリ移動＋構成ファイル作成のみ。glob はワークスペース相対のため定義の書き換え不要）
      - text: '**完了条件の充足**: ①`.yde/` の無い既存ワークスペースが現行どおり動く（全既存テスト green のまま）②`ledger` 宣言下で台帳外YAMLが索引・カタログ・走査（＝検証集計・トリガの母集合）に現れない
          ③台帳外ファイルに match によるスキーマ適用が効き、未解決参照が INFO へ降格される ④エージェントの書込が予約領域・台帳外で拒否される（メタの定義ゾーン書込・runs への実行記録は現行規則を踏襲）——を `WorkspaceLayoutTest`
          が検証（②③はワークスペース統合テスト、④は `AgentToolbox` の統一規則 `checkWritableFile` として実装し、予約領域の拒否は既存 `KernelTest` / `MetaActivityTest`
          が回帰検証）。移行の往復（migrate 後に同じスキーマ・索引・定義が効くこと）も同テストで自動検証。設計は ARCHITECTURE §4.25。'
