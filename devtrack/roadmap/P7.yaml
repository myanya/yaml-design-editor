id: P7
number: 7
title: 段階的詳細化の深化（フェーズ機構・1:N 詳細化）
status: done
status_note: 完了
history:
- id: RH-015
  title: 'P7: 段階的詳細化の深化（フェーズ機構・1:N詳細化） ✅ 完了（2026-07）'
  body:
  - text: '狙い: 工程をまたぐ文書運用（要件定義→論理設計→物理設計など）を検証機構が理解できるようにする。動機は「データモデル定義・テーブル定義・テーブル設計のように情報の重複が多い文書群を、重複なく・工程の進行に応じた検証強度で管理する」こと。文書の物理的な分割単位（単一文書か工程別分割か）は運用の自由とし、どちらの構成でも成立させる。'
  - head: |-
      | ID | 項目 | 状態 | 内容 |
      |---|---|---|---|
    rows:
    - id: R7-01
      title: フェーズ機構（状態依存の検証プロファイル）
      cells:
      - ✅
      - スキーマが順序付きフェーズ（`phases`）を宣言し、文書がルート項目で現在フェーズを申告する。フィールドの `requiredFrom` は「そのフェーズ以降で必須」（累積的）、カバレッジルールの `activeFrom` は「そのフェーズ以降で判定」。未到達フェーズの未記入はエラーにせず、フェーズ別の記入進捗として可視化する（検証パネル・CLI `validate`。[FEATURES.md](../FEATURES.md) S-11・V-06）
    - id: R7-02
      title: 1:N詳細化の一級化
      cells:
      - ✅
      - '1:1の詳細化＝同一ID、1:Nの分裂（例: データモデルの1エンティティ→単票・明細の2テーブル）＝新ID＋`ref`（`relation`）で親へ逆リンク、という規約を確立した（MANUAL §6）。ビュー定義にバックリンク列（`backlinks`: `relation` / 参照元スキーマで絞った被参照の一覧表示）を追加し、旧L-15（出現ベースのカバレッジ `detailIn`＝詳細文書の存在検証）を実装。詳細は [FEATURES.md](../FEATURES.md) S-09・V-05・X-05・X-06・C-07・ARCHITECTURE §4.6／§4.14'
    - id: R7-03
      title: スキーマの共通部品（横断 `$ref`）
      cells:
      - ✅
      - '`kind: library` のスキーマ文書がdefinitionsだけを公開し、工程別スキーマは `moduleId#definition` の修飾`$ref`で参照する。`SchemaCatalog`が全モジュールのパース後にリンクするためファイル順に依存せず、共有定義内の非修飾`$ref`も宣言元libraryを基準に解決する。既存のローカル`$ref`は後方互換。詳細は [FEATURES.md](../FEATURES.md) S-12・ARCHITECTURE §4.7'
    - id: R7-04
      title: 編集可能なID横ぐしフォーム
      cells:
      - ✅
      - '`_views` 定義を書かずに、同一IDの全出現をID横ぐしビュー上でその場編集できる。詳細は [FEATURES.md](../FEATURES.md) I-07・ARCHITECTURE §4.16'
    - id: R7-05
      title: 段階的詳細化のAI導線
      cells:
      - ✅
      - 'R7-01/R7-04は人間向けUIのみで、エージェント側の露出がなかった（`related` は出現の座標のみ、フェーズ状態は検証エラーでしか気づけない）ギャップを埋める。`related`/`list_documents` が出現の主要フィールド要約とフェーズ状態を1回の呼び出しで返し、`context.include: [phase]` で対象文書のフェーズ状態を初期文脈に載せられるようにした。詳細は [FEATURES.md](../FEATURES.md) AG-25。あわせて `sample-workspace` に `table-design` スキーマへの `phases` 適用例（`tables/TBL-TASK.yaml` requirements 段階／`tables/TBL-USER.yaml` physical-design 段階）と、ID串刺しレビュー（`review-screen-elaboration`）・フェーズ前進（`advance-table-phase`）の `_activities` 例を追加'
  - text: |-
      **R7-01 の完了条件充足**: フェーズ申告により「要件定義段階の文書が後工程の必須項目でエラーにならず、フェーズを進めると同じ項目がエラーになる」「カバレッジがフェーズ到達まで沈黙する」「フェーズ別進捗が機械取得できる」を `PhaseTest` が検証。

      **R7-04 の完了条件充足**: `_views` は列を選別・整形して見せたい場合に強力だが、列ごとに `fileGlob`/`path` を手書きする必要があり、スキーマにフィールドを足すたびビュー定義側も追記しないと画面に現れない、という制約を解消する狙いで実装。ID横ぐしビュー（I-07）は `IdIndex` から出現を自動収集しビュー定義が不要なため、出現ごとのプレビュー（`OccurrenceCard`）を埋め込みフォームへ置き換えた。新しい書込経路・解決ロジックは作らず、ビュー機構が既に持つ `Views.fieldAt`（相対パス→FieldDef解決）と、フォームの `FormCtx` / `ObjectFields` / `GenericEditor`（`ui/FormView.kt`）をそのまま再利用。編集は文書キャッシュ（`AppState.ensureDoc`）上のツリーを `Slot`（`slotAt` を `ui/Common.kt` へ共通化）経由で直接変更し `markEdited()` する、既存フォームと同一の経路（ARCHITECTURE §4.16）。ビルドと全単体テスト（`./gradlew test`）で回帰なしを確認。Compose UI 自体は本プロジェクトの既定方針（FEATURES L-09）どおり自動テスト対象外のため、実際のクリック操作による確認は行っていない。

      **R7-05 の完了条件充足**: `related`/`list_documents` の出力にフェーズ状態・出現内容が含まれること、`context.include: [phase]` が初期文脈にフェーズ状態を載せることを `ToolsTest` / `KernelTest` が検証。

      **R7-03 の完了条件充足**: library定義の横断参照、共有定義内の入れ子ローカル参照、サンプル生成、ID索引・検証への透過的な反映、未解決参照とlibrary制約の検出を `SchemaLoaderTest` が検証。スキーマ設計UIもdocument / library切替と横断参照候補に対応。

      **R7-02 の完了条件充足**: 「エンティティ→複数テーブル」の結合表示は、ビューのバックリンク列（親IDへの被参照を relation・参照元スキーマで絞り、参照元の最内IDと座標に解決）が `ViewsTest` で、存在検証は出現ベースのカバレッジ（`detailIn`）が `CoverageTest` で自動検証されている。編集経路は追加していない（バックリンク列は編集不可の派生表示。被参照の変更は参照元文書の編集＝既存経路）。`sample-workspace` には規約の実例として `models/00-data-model.yaml`（ENT-TASK が本体 `TBL-TASK`・明細 `TBL-TASK-HISTORY` の2テーブルへ分裂）、`table-design` スキーマの `entity` 参照（relation: derives）、ビュー `_views/entity-tables.yaml`（バックリンク列）、`todo-screenlist` スキーマの `detailIn`（画面詳細の存在検証）を追加した。

      **P7 全体の完了条件の充足**: 1:N のエンティティ→複数テーブルの結合表示（バックリンク列）と存在検証（relation 限定の参照ベースカバレッジ／出現ベースカバレッジ）が成立し、全項目が完了した。
