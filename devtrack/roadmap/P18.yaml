                尊重＋指数バックオフ＋ジッタ、上限60秒/回・3回）を一元実装（ARCHITECTURE §4.18・FEATURES A-13）。残課題: 項目間クールダウンは効果を見て判断。コンテキスト削減は P19 が本格対応'
