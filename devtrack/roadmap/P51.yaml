id: P51
number: 51
title: YAMLで図のノードと辺の記法を定義する
status: done
status_note: 完了（2026-11-03）。共通契約・人物カード・クラス図・条件と出力の4段階、詳細は[記録](archive/roadmap-history.md)
history:
- id: RH-001
  title: P51 サンプルと試し方（2026-11-03）
  body:
  - text: |-
      機能の4段階とは別のコミットで、`samples/diagrams` に人物相関図・クラス図・型の属性・条件付きカードの一式を追加した。
      README・手引き・利用シナリオS12から試し方へ案内する。
      全体test成功（4分22秒）。サンプルのCLI検証はエラー・警告とも0件、スキーマの図の未解決参照は0件。
- id: RH-002
  title: 'P51 段階4: 条件・型の属性・共通出力（2026-11-03）'
  body:
  - text: |-
      全4段階が完了した。条件は既存のConstruct、型の属性はSemanticSchemaGraphの同じ走査から導く。
      記法のYAMLと表示モデル・来歴をCLI／read_viewへ開示し、改名時の言及調査にも加えた。
      フローのPNGを追加し、レンズとともに画面の描画と計測を共有する。端ラベルは全体表示と保存範囲へ含める。
      菱形の内部配置と輪郭の接続点をそろえ、型の段のクリックは段の切替に追随する。

      全体test成功（2分45秒）、docs-lint失敗なし（既存の目安98件）。
      最初の全体試験ではWindowsのメモリ不足でsemantic-coreの試験JVMが起動できず、確認アプリと専用MCPを停止してから単独で再実行した。
      条件付き部品・スキーマ属性とケース・原本の不変・改名時の言及・画像と端ラベルの保存範囲を試験した。
      実画面はui-checkの専用コピーで、レンズの人物相関図／クラス図／型の属性と、人物・クラスのフローを選択した。
      操作ツリーで配置完了・診断なし・PNGボタンを確認し、Hot Reload後も描画例外はなかった。
      OSの保存ダイアログ、ドラッグ・ホバー・見た目の目視は未操作。PNG本体はオフスクリーンの画像試験で確認した。
      確認用のアプリと専用MCPを終了し、他のセッションのプロセスには触れていない。
- id: RH-003
  title: 'P51 段階3: クラス図と辺の記法（2026-11-03）'
  body:
  - text: |-
      クラスの区画とUMLの辺を同梱記法で追加した。線種・端点記号・多重度の計測描画は共通部品を使う。
      レンズの辺は畳み・集約後も元の参照と属性を保持し、反転は表示する端点の記号と文字へ反映する。
      部品からの移動は一意な原本だけに行い、複数来歴は任意の一件を選ばない。
      全体test成功（6分23秒）、docs-lint失敗なし。参照属性・折り畳み・端点方向・UML区画の来歴を試験した。
- id: RH-004
  title: 'P51 段階2: 人物カードと共通描画（2026-11-03）'
  body:
  - text: |-
      画像と名前を縦に並べる同梱記法、レンズの記法選択、フローのappearanceを追加した。
      文字と画像を共通部品で計測し、その寸法を配置と描画・レンズPNGで共有する。
      画像は原本の文書から解決し、file型と同じ場所・許可の境界を使う。
      全体test成功（4分44秒）、docs-lint失敗なし。配置・折り返し・画像の描画と原本座標を自動試験した。
      実画面の通し確認は全段階の結合後に行う。
- id: RH-005
  title: 'P51 段階1: 図の記法の共通基盤（2026-11-03）'
  body:
  - text: |-
      `kind: diagram-notation` の入力契約・変換・ノードと辺の表示契約を追加した。
      組込みの記法も同じYAMLを通し、適用指定の競合・対象違い・不正な表示を診断する。
      `SemanticTransform.runAt` と部分木の来歴を持つ入力により、合成した値を二段の変換で渡しても原本を保持する。
      画面への適用は次の段階。ADR-0020・FEATURES X-18に登録した。
      全体テストは単一ワーカーで成功、docs-lintは失敗なし。並列実行時の既存MCP試験の不安定さはUX-246に記録した。
