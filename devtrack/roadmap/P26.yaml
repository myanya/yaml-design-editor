id: P26
number: 26
title: 3層コア移行
status: done
status_note: 完了。計画と台帳は [archive](archive/README.md)
history:
- id: RH-032
  title: 'P26: 3層コア移行（in-repoマルチモジュール化） ✅ 移行完了（2026-08-21）・移行後リファクタリング進行中'
  body:
  - text: |-
      狙い: スキーマ（`Schema.kt` ほか）の担当過多を解消するため、非UIコアを `yaml-core`（構文・構造スキーマ・編集操作）／`semantic-core`（意味解釈・意味グラフ・意味検証・リファクタリング計画）／`workspace-core`（版・トランザクション・履歴・永続化）の3層Gradleモジュールへ段階的に**移動**する。最終形は、ユーザ定義スキーマから構造／意味の2層スキーマを導出して各層で検証し、意味スキーマの柔軟性（ユーザ定義を含む）を上げてYAMLエディタを情報管理ツールへ進化させること。

      - 計画・フェーズ・完了条件: [three-layer-core-migration-plan.md](three-layer-core-migration-plan.md)
      - 進捗（作業単位）: [migration-ledger.md](migration-ledger.md)
      - 設計決定: [decisions/](../decisions/README.md)（ADR-0001〜0008・意図的差分一覧）

      | 到達点 | 状態 |
      |---|---|
      | Phase 0: 移行基準の固定（ADR・test-fixtures・ベースライン561テスト） | ✅ 2026-08-16 |
      | Phase 1: モジュール骨格（4モジュール・依存方向の固定） | ✅ 2026-08-16 |
      | Phase 2〜4: yaml-core = M1: YAMLライブラリ | ✅ 2026-08-17（テスト67件。残整理 YM-006b のみ） |
      | Phase 5〜6: semantic-core = M2: 意味解析ライブラリ | ✅ 2026-08-19（6A〜6D完了。6Eは§17-⑥⑦の方向決定まで保留・6Fは後続） |
      | Phase 7〜8: workspace-core = M3: ヘッドレスworkspace | ✅ 2026-08-20（apply/undo/redo/save・外部変更検出・CLI validate） |
      | Phase 9〜10: リファクタリング基盤（plan/apply 分離・CLI完成） = M4 | ✅ 2026-08-20（エンティティ・文書移動・スキーマ全12操作の plan/apply 化。CLI: catalog / entity / refactor / shell・--format yaml\|json・exit code 0〜5） |
      | Phase 11: 増分索引と性能計測 = M5 | ✅ 2026-08-21（SemanticEngine.update＝文書別走査キャッシュ・セッション増分導出・oracle一致テスト・`workspace bench`。走査コストは変更文書数に比例） |
      | Phase 12: 移行完了判定（各コアDoD照合・統合シナリオ・旧テスト台帳） | ✅ 2026-08-21（**計画の全フェーズ完了**。残課題=6E仮想文書・derive/メタスキーマreader・イベントwatch・UIの新API接続は移行後テーマとして個別判断） |
