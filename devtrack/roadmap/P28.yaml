id: P28
number: 28
title: 設計検証の拡充
status: in-progress
status_note: 登録項目はすべて完了。次はオーナー判断（下記）
body:
- points:
  - label: 目的
    text: 本命ユースケース。システム開発の設計情報を管理し、設計を機械的に検証する。「設計に対してどのような機械的チェックが可能か」のカタログ（[DESIGN-CHECK-CATALOG.md](DESIGN-CHECK-CATALOG.md)）を組み上げること自体が成果物。
  - label: 進め方
    text: テンプレート先行。小規模システム開発の文書体系（[labs/sysdev-template](../labs/sysdev-template)）をスキーマ化し、実データで制約を書きながら語彙を確定する。新しい検証要求は必ず Core Calculus を一段挟む（[ADR-0009](decisions/0009-core-calculus.md)）。
  - label: 文書体系とモデルの対応
    text: ビジネスルール BR → ユースケース UC → ドメイン DOM・エンティティ ENT・画面 SCR・API → 詳細設計（同一 ID の段階的詳細化）・処理 PROC → テスト項目（対象 × 観点のマトリクス）・ケース・結果。方式区分は enum と cases、「〜から導出」の関係は relation で宣言する。
  - label: 完了
    text: テンプレート v3、クエリ制約の拡張（count・notEquals）、網羅マトリクス、遷移検証、ゲート体系と指摘の説明性（no-new-errors・readiness）、設計チェックカタログ、ノード一致 same、束縛間の値比較 check。
  - label: 残り
    text: 登録済みの項目はすべて完了。次の項目はオーナー判断。自然文の内容品質（曖昧・矛盾）の AI 補助検証は決定的検証と区別し、後段扱い。
history:
- id: RH-036
  title: 'P28: 設計検証の拡充（システム開発の設計情報管理と機械的検証） 未着手（2026-09-02 方向承認）'
  body:
  - text: |-
      狙い: 本ツールの本命ユースケース（オーナー表明 2026-09-02）＝**システム開発の設計情報管理と設計の機械的検証**。AIネイティブ開発では設計情報の人間レビューが追いつかないため、検証を機械化して「AIが書き、機械が検証し、人間は差分を承認する」ループの検証部を厚くする。実務では規約が明文化されておらず人間RVとフォーマット規律で品質を保っているのが現状のため、**「設計に対してどのような機械的チェックが可能か」のカタログを組み上げること自体**を本テーマの成果物に含める（R28-06）。

      進め方: 抽象論で検証語彙を設計せず、**テンプレート先行**——オーナー提供の小規模システム開発（〜10万行・非機能除く）の文書体系をスキーマ化し、実データで制約を書きながら語彙を確定する。

      **2026-09-05 方向転換（[ADR-0009](../decisions/0009-core-calculus.md)）**: 「要求 → Constraint DSL の機能追加」という直接経路を禁止し、新しい検証要求は必ず Core Calculus（P29）を一段挟む（[CORE-CALCULUS.md](../CORE-CALCULUS.md) §17。既存 calculus で表現可能なら組合せとして実装し、不能なら不足プリミティブの追加を先に検討する）。テンプレート先行の規律自体は維持。

      **文書体系→モデル対応（2026-09-02 オーナー提供のテンプレート）:**

      | 工程 | 文書 | モデル化の当たり |
      |---|---|---|
      | インプット | ビジネスルール定義書（フリーフォーマット・最重要） | 本文は text のまま**ルール1件=BR-\* ID の要素**へ最小構造化した台帳。フリー原文→台帳の取込はAIアクティビティ（原本主義） |
      | 要件定義 | システム概要・ユースケース一覧/定義 | ユースケース UC-\*（機能概要含む）。BR への参照を持つ |
      | アーキテクチャ設計 | オンライン/バッチ/ログ等の方式設計書 | 方式区分は enum＋`cases`（区分ごとの必須項目）として各設計書スキーマへ落とす |
      | 基本設計 | ドメイン一覧/定義・エンティティ定義（論理ER）・画面一覧/遷移/定義・外部/内部API一覧/定義 | ドメイン DOM-\*（UCのグルーピング・エンティティ/ユーザアクション/システムイベント一覧を内包）・エンティティ ENT-\*・画面 SCR-\*・API-\*（外部/内部は型か属性で区別）。「〜から導出」の関係（UA/UC→画面・API）を relation で宣言 |
      | 詳細設計 | 画面設計書・API設計書・テーブル定義書（物理ER）・処理設計書 | 論理→物理は**同一IDの段階的詳細化**（detailIn カバレッジがそのまま効く）。処理 PROC-\* はユーザアクション/システムイベントに紐づく |
      | 試験（処理/画面遷移/UC） | テスト項目一覧（対象×試験観点で機械的抽出）・テストケース・実施結果 | 項目=マトリクスのセル（網羅検証 R28-03、さらに derive/foreach で**生成**も可能）・ケース→項目・結果→ケースの参照連鎖 |
  - head: |-
      | ID | 項目 |
      |---|---|
    rows:
    - id: R28-01
      title: '✅ システム開発テンプレート v1（2026-09-02）→ **v2（2026-09-04。オーナーレビュー反映）**（`sysdev-template/`＝gitignore 対象の実験場・UX-62 の方針）: 文書体系のスキーマ22本＋関係レジストリ（エンティティ16型・relation 14種・enforcement 有効）＋サンプル「会議室予約システム」一式＋ビュー3本。**既存機構だけで多段トレース義務・禁止パターン・条件付き義務（V-09 constraints）・導出規約（多重度）・詳細化存在（detailIn）が動くことを実証**（エラー0・意図的警告3）。v2 反映: ①依存方向の是正（groups＝ドメインがUCを参照。要件は下位工程を参照しない）②試験3階層（単体=詳細設計向け／結合=基本設計向け／総合=要件向け。項目スキーマ分割で階層別トレース制約・BRトレース列の種別分割）③画面遷移文書を原本化（2段階案の前段。詳細遷移モデルは R28-04）④テストケースの消化宣言を手順単位へ ⑤カバレッジ文言に配置ディレクトリ明記（UX-97 暫定）。ツール側指摘は UX-96〜98 登録。→ **v3（2026-09-05。項目レベルのモデル化＝オーナー承認の3判断: 物理型はマッピング表が単一真実源・画面物理型のDT貫通は対象外・ID命名は親名埋込）**: 属性 EA-\*・画面項目 SI-\*/SPI-\*・カラム COL-\* をID化し対応を参照で宣言（logical_name 文字列対応＝表記の対応を廃止）。業務データ型台帳 DT-\*（基本型 base＋制約欄は cases）＋物理型マッピング表 MAP-\*（DDL型の単一真実源・カラムに物理型を書かない）。新規検査: 入力/選択項目の source 必須（kind cases）・field-basic inMin 1（画面 基本↔詳細の不足）・attr-implemented 制約（transient 逃がし）・origin cases（技術項目/技術カラムの構造的逃がし）・dtype outMax 1・maps-type inMin/inMax 1（マッピング漏れ・二重）・col-type-consistent（R28-07 の same で型不一致＝error）。スキーマ24本・関係レジストリ 22型/19関係・ベースライン エラー0/警告6（意図4＝BR-004・UC-003・SCR-RESERVE-DETAIL 未物理化2＋VP-004 実験2）'
    - id: R28-02
      title: '✅ クエリ制約の**拡張**（2026-09-04）: ①`count: {min, max}`（expect と排他。解＝bind 列の組の distinct 件数。評価は `SemanticQuery.countMatchesFrom`＝limit 打切り前 total）②`where` の `notEquals`（「値が1つ以上あり、どの出現の値も指定値でない」＝OR 解釈の否定・値なしは判定保留）。メタスキーマ（builtin-schema 資源）対更新・`QueryConstraintTest` 4本追加・テンプレで実戦投入（proc-unit-min2 / br-unapproved-referenced）。**束縛間の値比較は見送り**（項目レベルのモデル化強化と合わせて後続で設計。consistency で書ける場合はそちら）。C-12 の不変条件（任意式なし・再帰なし）は維持'
    - id: R28-03
      title: '✅ 網羅マトリクス検証（2026-09-04。FEATURES V-11）: スキーマの `matrix:`＝「行×列の全組合せに、行と列の両方を参照する証人（witness）が存在すること」。不足セルは行の定義出現に列挙報告（タイトルつき・先頭5件）・明示除外は証人側の `excluded: true` 行（存在＝充足・理由はデータ）。宣言 `schema/Matrix.kt`・判定 `semantic/Matrix.kt`・rename-relation 追随は `relation` キー採用で既存 walker が自動適用。メタスキーマ対更新・`MatrixTest` 6本・テンプレ実戦投入（proc-viewpoint-matrix＋TI-107 除外行＋ti-covered 制約へ covers 多重度を置換）'
    - id: R28-04
      title: '✅ 遷移検証（2026-09-17。FEATURES V-12）: スキーマの `flow:`＝エッジ文書の行（from / to 参照の組）を有向グラフとみなし、**到達閉包**（BFS。Query の固定長パターンでは書けない任意深さの到達性＝calculus-first の2巡目・CORE-CALCULUS §20 通過・§21 記載）で①到達不能（`start: {relation}` のデータ宣言起点。宣言なし・データ空は判定保留）②行き止まり（`terminal: {relation}` で除外宣言）③宣言外遷移（`usage:` エッジ ⊆ 宣言エッジ）を検出。未解決参照の候補喪失時は解の不足系判定を沈黙（CALC-17 と同じ筋・行き止まりは from 解決で「出あり」と数える非対称）。宣言 `schema/Flow.kt`・カーネル `semantic/Flow.kt`・報告はノードの定義出現＋relatedIds ジャンプ。メタスキーマ対更新・`FlowTest` 8本。テンプレ実戦投入（screen-flow＝開始 SCR-ROOM-LIST・relations に flow-start/flow-terminal 追加・ベースライン不変）。**状態遷移への一般化は状態のID化（エンティティ化）で同一機構**（FlowTest で実証。enum 値の直接ノード化は需要が立つまで見送り＝R28-07 の same と同じ筋）'
    - id: R28-05
      title: 'ゲート体系化と指摘の説明性: ✅ **R28-05a 指摘の説明性（2026-09-04・同日のオーナー試用で追補2件）**＝UX-96（詳細化出現への案内「報告先: 定義出現 <パス>」）・UX-97（detailIn 警告に作成場所併記＋指摘メニューから**「詳細文書を作成」**スキャフォールド）・UX-98（absent／count 違反に該当の組を列挙＋relatedIds ジャンプ・**エラー級は出現側の文書にも ERROR で報告**。残: 束縛座標つき選択メニュー=UX-99 と統合検討）。✅ **R28-05b（2026-09-17）**＝①`gates.validation: no-new-errors`（点検系ゲート。UX-47 解消）: `Staging.newErrors`＝ステージ適用後のエラーからディスク原本の同一エラー（(パス, メッセージ) の多重集合）を差し引き、**増えた分だけ**を拒否理由に列挙（既存エラーで提出を塞がない・自動適用は requireValid を課さない・KernelTest 2本）②準備完了レポート（FEATURES V-13）: CLI `readiness [--pending]`＝全検証をエンティティへ帰属（最内出現規則・文書レベルは unassigned 別掲）し「エラー0=準備完了」を型別／フェーズ別集計つきで機械判定（`validate/Readiness.kt`・`ReadinessTest` 4本）'
    - id: R28-06
      title: '✅ 設計チェックカタログ（2026-09-17）: [docs/DESIGN-CHECK-CATALOG.md](../DESIGN-CHECK-CATALOG.md)＝「設計への機械的チェック」のパターン台帳。①記法・構造（必須／フェーズ必須／cases）②トレーサビリティ（レジストリの型・多重度・enforcement・coverage）③パターン制約（exists/absent/count/where/same/check）④網羅（matrix）⑤遷移・到達性（flow・状態のID化パターン）⑥導出値整合（consistency）⑦プロセス組込（ゲート2種・readiness・activeFrom）＋パターン選択の目安・判定保留／CALC-17 の共通原則。テンプレ実例ID併記。運用: 検証機構の追加・変更時に本書へ1行追加（CONVENTIONS §6）'
    - id: R28-07
      title: '✅ ノード一致 `same`（2026-09-05）: クエリの node ステップに `same: 束縛名`＝「先行して束縛済みのノードそのもの」への到達を要求（他キーと同居不可・起点不可・先行束縛のみ＝パースで固定）。「2経路が同一ノードで合流すること」の照合で**型不一致検出**が可能に（テンプレ col-type-consistent＝カラムの dtype ≠ 実装属性の dtype を error）。評価器では再訪禁止規則の意図的な例外（束縛済みノードへの再到達のみ許可）。**値の束縛間比較でなくノード同一性**（ADR-0008 の筋）——値比較の語彙は same で足りないケースの需要が立つまで見送り。メタスキーマ対更新・`SameNodeTest` 4本（also形／連鎖形・パースエラー3種）。ビュー・foreach・CLI query にも同語彙が乗る（クエリコア共用）'
    - id: R28-08
      title: '✅ **束縛間の値比較（`check` 判定述語）**（2026-09-12 実装。[FEATURES.md](../FEATURES.md) V-09）: calculus-first の試金石（P29・CALC-13 反例量化の最初の実装。R28-02/07 で2回見送った要求）。クエリ制約に判定節 `check:` を追加——項目は `{演算子: [{of: 束縛, path: パス}, {of: 束縛, path: パス}]}`（演算子 lte/gte/lt/gt/eq/ne・リストはすべて成立が期待・`expect`/`count` と三者排他）。評価は解ごとに σ（出現割当て）を反例量化＝違反の組を発見したら違反・評価可能な組がなければ判定保留（沈黙）・項目内の σ は一貫（同一束縛は同一出現）。provenance 最小形＝メッセージに反例の組（値・違反記号）を列挙＋relatedIds ジャンプ（UX-98 流儀・**OQ-04 の判断材料**）。エラー級は詳細化出現側にも反例つき ERROR。`CheckConstraintTest` 8本・メタスキーマ対更新。**テンプレ実戦投入（2026-09-12）**: `spi-length-within-dtype`（SPI→SI→EA→DT の4ホップ・最大文字数）・`spi-range-within-dtype`（数値範囲 min/max の2項目）・`dtype-bounds-ordered`（DT台帳の自己整合＝同一束縛の下限≦上限3項目）。現データは全て充足/判定保留＝**ベースライン不変（エラー0/警告6）**・意図的違反（150>100）で反例表示を確認済み'
  - text: P27（スキーマ2層化）とは独立に着手可能（検証実体・クエリ評価器はカーネル所有済み）。自然文の内容品質（曖昧・矛盾）の AI 補助検証は決定的検証と区別し、本テーマでは後段扱い。
