history:
- id: RH-043
  title: 'P38: グラフレンズの配置と描画の改善（ELK） ✅ 完了（2026-10-12）'
  body:
  - text: |-
      関連性を図示するグラフレンズを読みやすくするため、配置の計算と描画を分け、配置は ELK（Eclipse Layout Kernel。Java 製・EPL-2.0）に任せ、描画は自前の Canvas で行うことにした（オーナー決定 2026-10-12）。
      Kotlin 製の候補（Kuiver・KmpGraphine）は実データで配置の質（交差数・重なり・幅）を比べて見送った。Kuiver は alpha で同じ 2 点間の複数の辺に非対応。フロービューへの ELK 適用は P36 の見送りのまま。
      段階 1: ELK の階層・応力・放射・重なり除去を `ui/GraphLayouts.kt` の 1 ファイルに閉じ、レンズに配置の切替（放射＝起点あり・階層・応力＝150 節点まで・力学＝従来の軽い計算）を付けた。
      節点は ID とタイトルの箱（型で色分け）、辺は矢印と関係のラベル、同じ 2 点間の辺は並べて描き、配置は背景で計算してできるまで前の絵を出し、できたら全体を画面に収める。
      段階 2: ホイールでカーソル中心の拡縮、節点のドラッグ（位置の固定。つながる辺は直線に引き直す）、ホバーで隣接の強調、右クリックのメニュー（エンティティページ・起点にする・原本へ・この型を隠す）、PNG の書き出し（FileKit の保存ダイアログを `rememberFileSaver` に包む）、ミニマップを付けた。
      残した気になりは BACKLOG の UX-156〜158（型の色の Palette 化・配置計算の取り消し・レンズの状態の保持）。
