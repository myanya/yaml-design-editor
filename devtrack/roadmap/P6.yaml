title: ビュー機構
status: done
status_note: 完了
history:
- id: RH-014
  title: 'P6: ビュー機構（段階的詳細化の編集面） ✅ 完了（2026-07）'
  body:
  - text: '狙い: 段階的詳細化（同一IDの複数文書出現。§2）の「一覧⇔詳細の往復」を解消する。複数文書の一部を**宣言的なビュー定義**（`_views`。行=論理ID×列=出現からの相対YPath）で1つの編集可能な一覧に射影し、編集は原本上の座標へルーティングする。ビューは人間（グリッドUI）とエージェント（`read_view`）の**共有契約**であり、データを持たない派生表示に徹する（原本主義）。'
  - head: |-
      | ID | 項目 | 実装（[FEATURES.md](../FEATURES.md)） |
      |---|---|---|
    rows:
    - id: R6-01
      title: ビュー定義と解決エンジン
      cells:
      - '✅ X-05・C-07（`core/Views.kt`: ロード・行×セル解決＝原本座標化・スキーマフィールド解決・詳細スキャフォールド。`_views` は予約ディレクトリ、組込みスキーマ、メタアクティビティの提案対象・パースゲート）'
    - id: R6-02
      title: ビューグリッドUI
      cells:
      - ✅ X-06（スカラーセルの直接編集＝通常の編集経路を再利用、複合値はジャンプ、詳細文書の作成、新規行、カバレッジ表示）
    - id: R6-03
      title: エージェント・CLIへの開示
      cells:
      - ✅ AG-24・C-06（`read_view` ツール＝座標つきでそのまま `apply_patch` 可能、`context.views` の初期文脈開示、CLI `view`。段階的開示に「カタログ→ビュー→骨子→全文」の中間層が加わる）
    - id: R6-04
      title: フォームの他出現ストリップ
      cells:
      - ✅ E-09（詳細文書を開いたとき一覧側の情報を表示。重複記載しない運用の支え）
  - text: '**完了条件の充足**: 「定義ロード→ID結合の行解決（並び順・座標・詳細判定）→ステージング編集の反映→スキャフォールド→定義のパースゲート」を `ViewsTest` が一気通貫で自動検証。将来拡張: 行集合への未保存編集の反映（FEATURES L-14）、エクスポートskillからのビュー定義参照（R9-05）。出現ベースのカバレッジルール（旧L-15）は R7-02 で実装済み。'
