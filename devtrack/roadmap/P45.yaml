id: P45
number: 45
title: ワークスペースの初期化（新しいワークスペースを作るウィザード。テンプレートから・自分の項目で・既存フォルダに後入れ）
status: done
status_note: 完了（2026-10-25）。本文は [記録](archive/roadmap-history.md)
history:
- id: RH-006
  title: 'P45: ワークスペースの初期化（2026-10-25）'
  body:
  - text: |-
      狙い: 導入を容易にする。初めてワークスペースを作るとき、空のフォルダを開いて設計スペースの空状態から始めるのでなく、4 歩の問いに答えると動く一式ができて開く。
      前提はオーナーの「初期化は当該ワークスペースに 1 度しか動かさない」。ここから、初期化済みの判定は `.yde/` か `_schemas/` の有無（印を残さない）、出力は普通の YAML で手直しは設計スペース、開く前に書くので Undo は無く確認で全ファイルを見せる、と決めた。

      オーナー決定（W-1〜W-6）: ①入口はスタート画面・メニュー・パレットと、未初期化フォルダを開いたときの案内（モーダルにしない）②始め方は 3 つ（テンプレートから／自分の項目で／既存フォルダに後入れ。後入れは台帳の宣言だけ）③置き方は一覧 1 ファイルが既定で 1 件 1 ファイルも選べる
      ④サンプルデータはテンプレートで「含める」が既定、自分の項目は空の一覧 ⑤テンプレートの置き場は新設の `templates/`（samples は特色の紹介で増えてよく、templates は業務を限定しない少数の出発点）⑥todos はサンプルのまま役割を増やさず、コード埋め込みの課題台帳パック（旧 `TemplatePacks.kt` の `ledger`）は `templates/issues` へ移して名前を `issues` に。
  - head: |-
      | ID | 項目 | 内容 |
      |---|---|---|
    rows:
    - id: R45-01
      title: テンプレートの置き場と資源化
      cells:
      - '`templates/<id>/`（`template.yaml` ＋ 写すファイル）。workspace-core のビルドが資源 `templates/` へ写し index.txt と files.txt を作る。`WorkspaceTemplates` が読む'
    - id: R45-02
      title: 計画の部品
      cells:
      - '`WorkspaceInit`: 答えの整形と点検・計画（展開／後入れ）・書き込み（既存は上書きしない）・初期化済みの判定・後入れの候補。問いを持つテンプレートは答えを「いまの場所」として変換定義のひな型で YAML を組み立て、ファイル名と Markdown の `{名前}` を埋める（Construct）'
    - id: R45-03
      title: テンプレート 2 つ
      cells:
      - '`issues`（課題管理。旧パックを `.yde` 構成に）と `basic-list`（「自分の項目で」の実体。問い＝名前・英語名・ID の接頭辞・名前の項目・状態の選択肢・そのほかの項目・置き方。スキーマ・空の一覧・一覧ビュー・状態ごとの区画を持つダッシュボード・登録の操作）'
    - id: R45-04
      title: CLI
      cells:
      - '`init <dir> [--template id] [--answers f] [--param k=v] [--no-sample-data] [--adopt] [--ledger d] [--dry-run]`。引数なしで一覧'
    - id: R45-05
      title: 画面
      cells:
      - '`InitWizardHost`（浮いたパネル。場所 → 始め方 → 内容 → 確認 →「作成して開く」）。入口はスタート画面・ファイルメニュー・パレット・編集スペースの未初期化の案内。後入れは設計スペースの「既存文書から推測」を開いて迎える'
    - id: R45-06
      title: テスト・文書
      cells:
      - '`WorkspaceInitTest`（計画）・`WorkspaceTemplatesTest`（全テンプレートと代表の答え 3 通りが検証エラー 0・ダッシュボードが解決・登録の操作が適用できる・CLI）。manual/README「新しいワークスペースを作る」・cli.md・architecture/workspace.md・ui.md・FEATURES W-21/22・README・ZIP の README.txt'
  - text: |-
      確かめ方: `./gradlew :workspace-core:test --tests "*WorkspaceInitTest"` と `./gradlew :test --tests "*WorkspaceTemplatesTest"`。画面はスタート画面の「新しいワークスペースを作る…」から顧客台帳を「自分の項目で」作り、ダッシュボードの「顧客を登録する」で 1 件目が `CUS-001` で入ること。
      見送り: AI に項目を提案させる入口（API キーが要り非決定的。「AI で洗練」と合流して後で）、2 種類目の管理対象、Excel の取り込み、レガシー構成の画面での移行。スタート画面の空の sample-workspace ボタンはこの機会に外した（UX-194）。
