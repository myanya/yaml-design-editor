id: NOTE-01
title: 所感メモ（良かった点・方向性の確認）
body: |
  - TODO管理サンプル: 利用者が登録→完了→再開の動作を確認済み（2026-10-24）。次の検討対象は日付の入力省略・カテゴリの追加導線・対象を起点にした操作のUI。

  - 保存・タブ切替・画面移動で Undo の入力を区切る改善を利用者が確認し、「非常に良い」と評価。現在のまとまり方を基準にする。（2026-10-24 Undo の試用）
  - 横断 Undo の試用で、通知から文書を選ぶより直接編集元へ移動したいとの意見。ビュー経由の編集はビューへ戻り、「編集した画面で戻っている感覚」を重視する。（2026-10-24 Undo の試用）

  - 選択一覧の現在値をチェックと背景色で示す動作を利用者が確認。高さ制限・説明短縮と全文表示・現在値への初期スクロール・検索の改善案も「非常に良い」と評価。（2026-10-21 選択一覧の試用）

  - 計算セルの来歴ポップアップ（R16-04）は「良い出来栄え」。ジャンプ先の畳み問題（UX-10）が解消されれば「すごく良い」。（2026-08-02 R16-04試験）
  - 未保存追随のリアルタイム反映は「気持ちが良い」。重さは感じない。（2026-08-02 R16-04試験）
  - 整合検証（R16-03a）の指摘文言は分かりやすい。編集中の文書側のドリフトが未保存で検出されるのは「非常に良い」。テンプレート健全性（UX-12）は「素晴らしい」。（2026-08-03 R16-03a試験）
  - R16-03c パッケージ: 「導出値を適用」のループ（誤入力→枠色→警告クリック→適用→警告消滅）は「違和感なし」。全体的な見た目はOK。（2026-08-03 R16-03c試験。細部の指摘は UX-03 追記・UX-17 と、即日修正2件＝不足案内のIDジャンプ・テーブルセルの枠色）

  - 「検証に導かれて埋めていく」ループは方向性として正しい——これを洗練させる（UX-04〜07 が具体化）。（2026-08-02 値型一巡試験）
  - ID横ぐしビュー（概念・DDL面・実装面を1画面で編集）は強い体験。（2026-08-02）
  - Web の業務操作（R49-62）: オーナーが試用後に「非常に良いと思いました」と評価。（2026-11-01）
  - 「機能追加と一緒に試し方（操作手順＋見てほしい観点）を提示→触って感想→チューニング判断」の進め方が良い→ CONVENTIONS §7 として規約化。（2026-08-02）

  - S1全体通し: スキーマの推測→仕上げ→検証の流れは違和感なし。書き方の間違い（field/fields・item/items の取り違え等）が構造上発生しないため、**スキーマ作成の敷居を下げているのは確か**。ref 化・role 付けも違和感なし。（2026-08-08 S1第1回）
  - S1全体通し: 「検証に導かれて埋める」は**スキーマ作成直後の文書でも成立し、体感は非常に良い**。枠色（UX-14）の付いた項目を埋めれば「とりあえずOK感」が出るのが快適。未保存追随も違和感なし。（2026-08-08 S1第1回）
  - S1全体通し: エージェント定義は記載に不安なし。実行も不満なし（ログ可読性 UX-39 のみ）。**書込範囲の制御は「変に変更されない」点で評価**。ビューの新規行作成は問題なし。（2026-08-08 S1第1回）

  - S1第2回（セッション基盤切替後）: 推測→仕上げ→検証は「楽に感じる」・**ID横ぐし編集は「非常に良好」**（前回高評価の再確認）・グリッド編集は「元文書への通常編集」と自然に理解・未保存追随に例外なし・実行の可観測性は比較的良好・変更セットの差分/再検証/記録は概ね信頼——**土台のセッション切替による操作感の劣化は観測されず**。横断Undo（D-07）だけは事故事例あり=UX-86。（2026-09-02 S1第2回）

  - R28-08 check 制約の反例表示（`p=SPI-…（max_length: 150） > t=DT-PURPOSE（max_length: 100）`＋relatedIds ジャンプ）は「**メッセージが分かりやすく現状で十分**」→ provenance の構造化 Evidence 一般形は需要が立つまで保留と決着（Core Calculus OQ-04）。（2026-09-12 テンプレ実戦投入試用）
  - CALC-17（Unknown 降格）: 参照が壊れた状態の検証で「**素直に、ダイレクトに原因が理解できた**」——未解決参照の指摘だけが残り、連鎖する「解なし＝違反」が沈黙する因果の見え方は正しい。（2026-09-16 試用）

  - S2自動化: **幕5（連鎖）の体感は良い**。承認→連鎖起動の流れ、auto の降格と自動適用、重複指摘の抑制、適用後の再発火なし、キューの直列消化はいずれも意図通りを確認。（2026-08-09 S2第1回）
  - S2総評: **可能性は感じるが、まだ実用段階ではない**。主課題は ①保存タイミング依存の変更検知（UX-51）②エージェントフローの不安定さと提出ゲート・リトライの設計（UX-46・47・48）③状態管理・巻き戻し（UX-56）。エージェントフローの抜本検討が必要。（2026-08-09 S2第1回）
