id: EX-expr-format-missing
title: "format は、埋まらない穴があると「得られない」になり、first で次の式に進む。式の中の文字列は、{パス} を含んでいても決まった値"
area: views
illustrates: [KW-expr.format, KW-expr.first]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: 設計
      status: done
      points: 3
      due: 2026-10-05
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: 実装
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "tasks/c.yaml"
    text: |-
      id: TASK-3
      title: 試験
      status: todo
      points: 2
      parent: TASK-1
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows: { idPattern: "TASK-*" }
      columns:
        - label: 期限
          value: { first: [ { format: "{due} まで" }, 期限なし ] }
        - label: 式の中の文字列
          value: { first: [ "{due} まで", 期限なし ] }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-1"
        values: { "期限": "2026-10-05 まで", "式の中の文字列": "{due} まで" }
      - id: "TASK-2"
        values: { "期限": "2026-11-20 まで" }
      - id: "TASK-3"
        values: { "期限": "期限なし", "式の中の文字列": "{due} まで" }
