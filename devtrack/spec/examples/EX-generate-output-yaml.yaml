id: EX-generate-output-yaml
title: "output は YAML の文書の場所で書く"
area: generation
illustrates: [KW-generator.output]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, done] }
      actions:
        - id: finish-task
          label: 完了にする
          target: { entity: task }
          do:
            - set: { path: status, value: done }
        - id: reopen-task
          label: やり直す
          target: { entity: task }
          do:
            - set: { path: status, value: todo }
  - path: ".yde/transforms/actions.yaml"
    text: |-
      id: summary
      output: "design/summary.md"
      build:
        x: 1
expect:
  result: ok
  generate:
    fails: ".yaml"
