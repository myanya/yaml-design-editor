id: EX-expr-map-extract
title: "辞書での置き換えと、文字の一部の取り出し"
illustrates: [KW-expr.map, KW-expr.using, KW-expr.extract]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: 設計
      status: done
      points: 3
      due: 2026-10-05
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: 実装
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "tasks/c.yaml"
    text: |-
      id: TASK-3
      title: 試験
      status: todo
      points: 2
      parent: TASK-1
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows: { idPattern: "TASK-*" }
      columns:
        - label: 状態の名前
          value: { map: { path: status }, using: { todo: 未着手, done: 完了 } }
        - label: 番号
          value: { extract: [ { path: id }, "[0-9]+$" ] }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-1"
        values: { "状態の名前": "完了", "番号": "1" }
      - id: "TASK-2"
        values: { "状態の名前": "doing", "番号": "2" }
      - id: "TASK-3"
        values: { "状態の名前": "未着手", "番号": "3" }
