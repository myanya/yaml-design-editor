id: EX-action-delete
title: "delete は値を消す"
illustrates: [KW-action.do]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      filePattern: "tasks/{id}.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: note, type: string }
      actions:
        - id: clear-note
          target: { entity: task }
          do:
            - delete: { path: note }
  - path: "tasks/TASK-1.yaml"
    text: |-
      id: TASK-1
      title: 設計
      status: doing
      note: あとで見る
expect:
  result: ok
  action:
    name: "clear-note"
    target: "TASK-1"
    files:
      - path: "tasks/TASK-1.yaml"
        text: |-
          id: TASK-1
          title: 設計
          status: doing
