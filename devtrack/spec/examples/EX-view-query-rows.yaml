id: EX-view-query-rows
title: "クエリの行は、解が行になり、of でほかの束縛の値を列にする"
illustrates: [KW-view-rows.match, KW-view-rows.where, KW-view-column.of, CTX-query-node, CTX-condition]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: 設計
      status: done
      points: 3
      due: 2026-10-05
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: 実装
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "tasks/c.yaml"
    text: |-
      id: TASK-3
      title: 試験
      status: todo
      points: 2
      parent: TASK-1
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows:
        match:
          - node: { entity: task, bind: c }
          - edge: { relation: child-of }
          - node: { entity: task, bind: p }
        where:
          - { of: c, path: status, notEquals: done }
      columns:
        - { label: 親, of: p, path: title }
        - { label: 状態, path: status }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-2"
        values: { "親": "設計", "状態": "doing" }
      - id: "TASK-3"
        values: { "親": "設計", "状態": "todo" }
