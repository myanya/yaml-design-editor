id: EX-stage-rule
title: "段の規則は、条件で選んだ要素を横ぐしに変える。stage を書いた生成の定義が、その段の項を読む"
area: generation
illustrates: [CTX-stage, CTX-stage-change, KW-generator.stage, KW-workspace.stages]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, done] }
      actions:
        - id: finish-task
          label: 完了にする
          target: { entity: task }
          do:
            - set: { path: status, value: done }
        - id: reopen-task
          label: やり直す
          target: { entity: task }
          do:
            - set: { path: status, value: todo }
  - path: ".yde/workspace.yaml"
    text: |-
      stages:
        - { id: basic, name: 基本設計 }
  - path: ".yde/stages/audit.yaml"
    text: |-
      id: audit
      name: 監査の対象にする
      stage: basic
      kind: rule
      changes:
        - each: actions
          set: { audited: true }
  - path: ".yde/transforms/actions.yaml"
    text: |-
      id: action-specs
      stage: basic
      each: actions
      output: "design/actions/{id}.yaml"
      build:
        id: { $copy: id }
        name: { $copy: label }
        audited: { $copy: audited }
expect:
  result: ok
  generate:
    files:
      - path: "design/actions/finish-task.yaml"
        text: |-
          id: finish-task
          name: 完了にする
          audited: true
      - path: "design/actions/reopen-task.yaml"
        text: |-
          id: reopen-task
          name: やり直す
          audited: true
