id: EX-relation-cardinality-ok
title: "多重度を満たしていれば通る"
area: checks
compare_with: [EX-relation-cardinality-in-min]
illustrates: [CTX-cardinality]
files:
  - path: ".yde/schemas/req.yaml"
    text: |-
      id: req
      match: "reqs/*.yaml"
      entity: { type: req, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
  - path: ".yde/schemas/test.yaml"
    text: |-
      id: test
      match: "tests/*.yaml"
      entity: { type: test, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: covers, type: ref, relation: covers }
  - path: ".yde/schemas/relations.yaml"
    text: |-
      id: relations
      kind: relations
      relations:
        - name: covers
          label: 確かめる要件
          inverseLabel: 確かめる試験
          source: [test]
          target: [req]
          cardinality: { inMin: 1 }
          level: error
  - path: "reqs/a.yaml"
    text: |-
      id: REQ-1
      title: ログインできる
  - path: "tests/a.yaml"
    text: |-
      id: TEST-1
      covers: REQ-1
expect:
  result: ok
