id: EX-matrix-missing-cell
title: "matrix は、行と列のすべての組み合わせに証人があることを求める"
area: checks
illustrates: [CTX-matrix, CTX-matrix-witness, KW-schema.matrix]
files:
  - path: ".yde/schemas/req.yaml"
    text: |-
      id: req
      match: "reqs/*.yaml"
      entity: { type: req, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
      matrix:
        - id: every-req-on-every-env
          rows: { entity: req }
          columns: { entity: env }
          witness:
            node: { entity: test }
            row: { relation: covers }
            column: { relation: runs-on }
          level: error
  - path: ".yde/schemas/env.yaml"
    text: |-
      id: env
      match: "envs/*.yaml"
      entity: { type: env, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
  - path: ".yde/schemas/test.yaml"
    text: |-
      id: test
      match: "tests/*.yaml"
      entity: { type: test, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: covers, type: ref, relation: covers }
          - { key: env, type: ref, relation: runs-on }
  - path: "reqs/a.yaml"
    text: |-
      id: REQ-1
      title: ログインできる
  - path: "envs/a.yaml"
    text: |-
      id: ENV-1
  - path: "envs/b.yaml"
    text: |-
      id: ENV-2
  - path: "tests/a.yaml"
    text: |-
      id: TEST-1
      covers: REQ-1
      env: ENV-1
expect:
  result: error
  message: "ENV-2"
