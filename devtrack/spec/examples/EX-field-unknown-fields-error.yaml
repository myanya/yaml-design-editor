id: EX-field-unknown-fields-error
title: "unknownFields: error を書くと、スキーマに無いキーはエラーになる"
illustrates: [KW-field.unknownFields]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      root:
        type: object
        unknownFields: error
        fields:
          - { key: id, type: id, required: true }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      memo: スキーマに無い項目
expect:
  result: error
  message: "memo"
