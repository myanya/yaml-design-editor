id: EX-expr-read-elsewhere
title: "読み出しは、参照をたどった相手（via）や、同じ ID の別の文書（in）からも読める。format は scopes で入れ物を、with で計算した値を指す（穴は with・予約の穴・scopes・いまの要素の順に探すので、親が無い TASK-1 は自分の点になる）"
area: views
illustrates: [KW-expr.via, KW-expr.in, KW-expr.scopes, KW-expr.with]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: scores
            type: array
            item: { type: int }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: ".yde/schemas/task-detail.yaml"
    text: |-
      id: task-detail
      match: "details/*.yaml"
      entity: { type: task }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: owner, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: Design
      status: done
      points: 3
      due: 2026-10-05
      scores: [2, 5, 1]
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: Build
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "details/a.yaml"
    text: |-
      id: TASK-1
      owner: 田中
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows: { idPattern: "TASK-*", schemaIds: [task] }
      columns:
        - label: 親の題
          value: { via: parent, path: title }
        - label: 担当
          value: { in: { schemaId: task-detail }, path: owner }
        - label: 親から
          value: { format: "親の点は {points}", scopes: [ { via: parent } ] }
        - label: 倍の点
          value: { format: "{n} 点", with: { n: { multiply: [ { path: points }, 2 ] } } }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-1"
        values: { "親の題": "", "担当": "田中", "親から": "親の点は 3", "倍の点": "6 点" }
      - id: "TASK-2"
        values: { "親の題": "Design", "担当": "", "親から": "親の点は 3", "倍の点": "10 点" }
