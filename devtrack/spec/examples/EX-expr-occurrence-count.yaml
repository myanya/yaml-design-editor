id: EX-expr-occurrence-count
title: "occurrenceCount は、その ID が書かれている場所のうち、指定に合うものを数える"
area: views
illustrates: [KW-expr.occurrenceCount]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: scores
            type: array
            item: { type: int }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: ".yde/schemas/task-detail.yaml"
    text: |-
      id: task-detail
      match: "details/*.yaml"
      entity: { type: task }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: owner, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: Design
      status: done
      points: 3
      due: 2026-10-05
      scores: [2, 5, 1]
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: Build
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "details/a.yaml"
    text: |-
      id: TASK-1
      owner: 田中
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows: { idPattern: "TASK-*", schemaIds: [task] }
      columns:
        - label: 詳細の数
          value: { occurrenceCount: { schema: task-detail } }
        - label: 書かれた場所
          value: { occurrenceCount: {} }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-1"
        values: { "詳細の数": "1", "書かれた場所": "2" }
      - id: "TASK-2"
        values: { "詳細の数": "0", "書かれた場所": "1" }
