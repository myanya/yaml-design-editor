id: EX-stage-patch-no-match
title: "補正は、当たる要素が 1 つも無い変更を誤りにする"
area: generation
illustrates: [KW-stage.kind]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, done] }
      actions:
        - id: finish-task
          label: 完了にする
          target: { entity: task }
          do:
            - set: { path: status, value: done }
        - id: reopen-task
          label: やり直す
          target: { entity: task }
          do:
            - set: { path: status, value: todo }
  - path: ".yde/workspace.yaml"
    text: |-
      stages:
        - { id: basic, name: 基本設計 }
  - path: ".yde/stages/rename.yaml"
    text: |-
      id: rename
      stage: basic
      kind: patch
      changes:
        - each: actions
          where: [ { path: id, equals: archive-task } ]
          set: { label: 保管する }
  - path: ".yde/transforms/actions.yaml"
    text: |-
      id: action-specs
      stage: basic
      each: actions
      output: "design/actions/{id}.yaml"
      build:
        id: { $copy: id }
        name: { $copy: label }
        audited: { $copy: audited }
expect:
  result: ok
  generate:
    fails: "rename"
