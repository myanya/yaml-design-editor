id: EX-template-format-missing
title: "$format は、埋まらない穴があると「無い」になり、マップのキーごと落ちる"
area: templates
compare_with: [EX-expr-format-missing]
illustrates: [KW-template.$format, KW-template.$first]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: string }
          - key: tags
            type: array
            item: { type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: "  設計  の  見直し "
      status: done
      points: 3
      due: 2026/10/5
      tags: [設計, 急ぎ]
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: 実装
      status: doing
      points: 12
      due: 2026年11月20日
      tags: [実装]
  - path: "tasks/c.yaml"
    text: |-
      id: TASK-3
      title: 試験
      status: todo
  - path: ".yde/views/tasks.yaml"
    text: |-
      id: tasks
      rows: { idPattern: "TASK-*" }
      columns:
        - { label: 題, path: title }
        - { label: 状態, path: status }
        - { label: 点, path: points }
        - { label: 期限, path: due }
        - { label: 札, path: tags }
  - path: ".yde/reports/example.yaml"
    text: |-
      id: example
      build:
        rows:
          $each: { $view: tasks }
          $build:
            id: { $copy: id }
            points: { $format: "{values.点} 点" }
            label:
              $first:
                - { $format: "{id}（{values.点} 点）" }
                - { $format: "{id}（点なし）" }
      template: example.md
  - path: ".yde/reports/example.md"
    text: |-
      {#each rows}
      - {label}{#if points} / {points}{/if}
      {/each}
expect:
  result: ok
  report:
    id: example
    text: |-
      - TASK-1（3 点） / 3 点
      - TASK-2（12 点） / 12 点
      - TASK-3（点なし）
