id: EX-condition-oneof-order
title: "条件の oneOf と、順序の比較（項目の型で比べる）"
area: views
illustrates: [KW-condition.oneOf, KW-condition.gte, KW-condition.exists]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: 設計
      status: done
      points: 3
      due: 2026-10-05
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: 実装
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "tasks/c.yaml"
    text: |-
      id: TASK-3
      title: 試験
      status: todo
      points: 2
      parent: TASK-1
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows:
        match:
          - node: { entity: task, bind: t }
        where:
          - { of: t, path: status, oneOf: [doing, done] }
          - { of: t, path: due, gte: "2026-11-01" }
      columns:
        - { label: 期限, path: due }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-2"
        values: { "期限": "2026-11-20" }
