id: EX-enforcement-undeclared-relation
title: "関係レジストリがあるとき、宣言していない名前の関係を使うと、スキーマの読み込みの点検に出る"
area: checks
illustrates: [KW-relation.name, KW-enforcement.undeclaredRelation]
files:
  - path: ".yde/schemas/req.yaml"
    text: |-
      id: req
      match: "reqs/*.yaml"
      entity: { type: req, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
  - path: ".yde/schemas/test.yaml"
    text: |-
      id: test
      match: "tests/*.yaml"
      entity: { type: test, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: covers, type: ref, relation: covers }
  - path: ".yde/schemas/relations.yaml"
    text: |-
      id: relations
      kind: relations
      relations:
        - { name: verifies }
      enforcement:
        undeclaredRelation: error
  - path: "reqs/a.yaml"
    text: |-
      id: REQ-1
      title: ログインできる
  - path: "tests/a.yaml"
    text: |-
      id: TEST-1
      covers: REQ-1
expect:
  result: schema-error
  message: "関係「covers」は関係レジストリに宣言されていません"
