id: EX-schema-entities-only-in-registry
title: "entities と enforcement は、関係レジストリ（kind: relations）にだけ書ける"
area: schema
illustrates: [KW-schema.entities, KW-schema.enforcement, KW-schema.kind]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
      entities:
        - { type: task, label: 作業 }
expect:
  result: schema-error
  message: "entities"
