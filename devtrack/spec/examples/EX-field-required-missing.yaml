id: EX-field-required-missing
title: "必須の項目が無いと検証のエラーになる"
illustrates: [KW-field.required]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, required: true }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
expect:
  result: error
  message: "title"
