id: EX-generate-each-needs-hole
title: "each を書いたときは、output に要素ごとに変わる穴が要る"
area: generation
illustrates: [KW-generator.each, KW-generator.output]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, done] }
      actions:
        - id: finish-task
          label: 完了にする
          target: { entity: task }
          do:
            - set: { path: status, value: done }
        - id: reopen-task
          label: やり直す
          target: { entity: task }
          do:
            - set: { path: status, value: todo }
  - path: ".yde/transforms/actions.yaml"
    text: |-
      id: action-specs
      each: actions
      output: "design/actions.yaml"
      build:
        id: { $copy: id }
expect:
  result: ok
  generate:
    fails: "穴"
