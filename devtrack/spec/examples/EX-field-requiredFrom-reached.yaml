id: EX-field-requiredFrom-reached
title: "requiredFrom のフェーズに達すると、値が無いとエラーになる"
illustrates: [KW-field.requiredFrom, KW-schema.phases]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      phases: [draft, review]
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: phase, type: enum, values: [draft, review] }
          - { key: reviewer, type: string, requiredFrom: review }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      phase: review
expect:
  result: error
  message: "reviewer"
