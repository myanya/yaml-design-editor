id: EX-generate-whole-model
title: "each を省くと、業務モデル全体から 1 文書を作る"
area: generation
compare_with: [EX-generate-each-actions, EX-generate-each-needs-hole]
illustrates: [KW-generator.each]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, done] }
      actions:
        - id: finish-task
          label: 完了にする
          target: { entity: task }
          do:
            - set: { path: status, value: done }
        - id: reopen-task
          label: やり直す
          target: { entity: task }
          do:
            - set: { path: status, value: todo }
  - path: ".yde/transforms/actions.yaml"
    text: |-
      id: summary
      output: "design/summary.yaml"
      build:
        actions:
          $each: actions
          $build: { $copy: id }
expect:
  result: ok
  generate:
    files:
      - path: "design/summary.yaml"
        text: |-
          actions: [finish-task, reopen-task]
