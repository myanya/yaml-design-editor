id: EX-expr-date-diff
title: "日付の月と日、日付の差（終わり − 始まり）、引き算"
area: views
illustrates: [KW-expr.month, KW-expr.day, KW-expr.daysBetween, KW-expr.subtract]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: scores
            type: array
            item: { type: int }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: ".yde/schemas/task-detail.yaml"
    text: |-
      id: task-detail
      match: "details/*.yaml"
      entity: { type: task }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: owner, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: Design
      status: done
      points: 3
      due: 2026-10-05
      scores: [2, 5, 1]
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: Build
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "details/a.yaml"
    text: |-
      id: TASK-1
      owner: 田中
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows: { idPattern: "TASK-*", schemaIds: [task] }
      columns:
        - label: 月
          value: { month: { path: due } }
        - label: 日
          value: { day: { path: due } }
        - label: 年末まで
          value: { daysBetween: [ { path: due }, { value: "2026-12-31" } ] }
        - label: 点から 1 を引く
          value: { subtract: [ { path: points }, 1 ] }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-1"
        values: { "月": "10", "日": "5", "年末まで": "87", "点から 1 を引く": "2" }
      - id: "TASK-2"
        values: { "月": "11", "日": "20", "年末まで": "41", "点から 1 を引く": "4" }
