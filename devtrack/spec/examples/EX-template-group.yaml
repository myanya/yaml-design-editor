id: EX-template-group
title: "$group は、キーが同じ要素をまとめ、まとまりごとに組み立てる"
illustrates: [KW-template.$group, KW-template.$by, KW-template.$bind]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: string }
          - key: tags
            type: array
            item: { type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: "  設計  の  見直し "
      status: done
      points: 3
      due: 2026/10/5
      tags: [設計, 急ぎ]
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: 実装
      status: doing
      points: 12
      due: 2026年11月20日
      tags: [実装]
  - path: "tasks/c.yaml"
    text: |-
      id: TASK-3
      title: 試験
      status: todo
  - path: ".yde/views/tasks.yaml"
    text: |-
      id: tasks
      rows: { idPattern: "TASK-*" }
      columns:
        - { label: 題, path: title }
        - { label: 状態, path: status }
        - { label: 点, path: points }
        - { label: 期限, path: due }
        - { label: 札, path: tags }
  - path: ".yde/reports/example.yaml"
    text: |-
      id: example
      build:
        groups:
          $group: { $view: tasks }
          $by: { $copy: values.状態 }
          $build:
            key: { $copy: key }
            ids:
              $each: items
              $build: { $copy: id }
      template: example.md
  - path: ".yde/reports/example.md"
    text: |-
      {#each groups}
      {key}: {#each ids}{.}{#if more}, {/if}{/each}
      {/each}
expect:
  result: ok
  report:
    id: example
    text: |-
      done: TASK-1
      doing: TASK-2
      todo: TASK-3
