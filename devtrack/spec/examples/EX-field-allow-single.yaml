id: EX-field-allow-single
title: "allowSingle: true の配列は、要素 1 つをそのまま書いても並びで書いても通る"
area: schema
illustrates: [KW-field.allowSingle]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: points, type: array, allowSingle: true, item: { type: int } }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      points: 3
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      points: [3, 5]
expect:
  result: ok
