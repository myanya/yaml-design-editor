id: EX-expr-aggregate-array
title: "パスの [*] は配列を返し、集計は配列を受け取る"
area: views
illustrates: [KW-expr.max, KW-expr.count, KW-expr.path, KW-expr.type]
files:
  - path: ".yde/schemas/task.yaml"
    text: |-
      id: task
      match: "tasks/*.yaml"
      entity: { type: task, defines: true }
      root:
        type: object
        fields:
          - { key: id, type: id, required: true }
          - { key: title, type: string, role: title }
          - { key: status, type: enum, values: [todo, doing, done] }
          - { key: points, type: int }
          - { key: due, type: date }
          - { key: parent, type: ref, relation: child-of }
          - key: comments
            type: array
            item:
              type: object
              fields:
                - { key: date, type: date }
                - { key: text, type: string }
  - path: "tasks/a.yaml"
    text: |-
      id: TASK-1
      title: 設計
      status: done
      points: 3
      due: 2026-10-05
      comments:
        - { date: 2026-10-01, text: 着手 }
        - { date: 2026-10-04, text: 完了 }
  - path: "tasks/b.yaml"
    text: |-
      id: TASK-2
      title: 実装
      status: doing
      points: 5
      due: 2026-11-20
      parent: TASK-1
  - path: "tasks/c.yaml"
    text: |-
      id: TASK-3
      title: 試験
      status: todo
      points: 2
      parent: TASK-1
  - path: ".yde/views/example.yaml"
    text: |-
      id: example
      name: 例
      rows: { idPattern: "TASK-*" }
      columns:
        - label: 最後のコメント
          value: { max: { path: "comments[*].date", type: date } }
        - label: コメントの数
          value: { count: { path: "comments[*].date" } }
expect:
  result: ok
  view:
    id: example
    rows:
      - id: "TASK-1"
        values: { "最後のコメント": "2026-10-04", "コメントの数": "2" }
      - id: "TASK-2"
      - id: "TASK-3"
