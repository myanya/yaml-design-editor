id: CTX-expr
title: "値の式"
language: expression
description: "値を計算する式。決まった値（文字・数・真偽値）はそのまま書け、それ以外は下の語を 1 つ持つ object で書きます。{パス} を含む文字列は format の短い書き方です。検査の外（スキーマの値の式・ビューの列・each の value）では「いまの要素」があるので of を省けます。値が得られないときは「得られない」になり、それを使う計算も得られません。"
