id: CTX-expr
title: "値の式"
language: expression
description: "値を計算する式。決まった値（文字・数・真偽値）はそのまま書け、それ以外は下の語を 1 つ持つ object で書きます。式の全体が {パス} を含む文字列のときは、format の短い書き方です（式の中、たとえば first の要素に書いた文字列は、{パス} を含んでいても決まった値です。そこでは {format: 文字列} と書きます）。検査の外（スキーマの値の式・ビューの列・each の value）では「いまの要素」があるので of を省けます。値が得られないときは「得られない」になり、それを使う計算も得られません。"
