forms:
  - value: "{schemaIds, target, set}"
    meaning: "補正を重ねます。原本を変えずに、当たり先の要素へ補正の文書の値を重ねます。path の列だけでなく、値の式・参照先・クエリも補正のあとの値を読みます。同じ場所への補正は、文書の名前の順・文書の中の順で後のものが勝ちます。影響するセルは読み取り専用です。"
