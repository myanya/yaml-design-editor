id: T-04
title: ワークスペースを開く速さ
status: discussing
status_note: 順は決定済み——読み込みの重複（A1・A2 の大半・A5・A6）とビュー定義の共有（A4）は済んだ。次は、オーナーの端末の記録で画面の段の内訳を見て B1 を決める
body: |
  画面でワークスペースを開くと、クリックから最初の描画まで数秒かかる（2026-11-12 の分析で、この環境の冷えた JVM で 2.8〜4.1 秒）。
  時間の記録（`.yde/state/timings.log`・CLI `--timings`）と分析の記録は [workspace-open-analysis.md](archive/workspace-open-analysis.md)。

  - **束ねる指摘**: UX-296（parseToRaw の二度読み）・UX-297（スキーマ文書の 5 回解析）・UX-298（組込みスキーマの作り直し）・UX-299（ビュー定義の読み直し）・UX-300（ダッシュボードの集計が画面のスレッド）・UX-301（保存基準の全件書き出し）・UX-302（構造の全件検証）・UX-303（図の配置の 2 回計算）・UX-304（読み込みが 1 本のスレッド）・UX-305（Windows のファイルの段）・UX-306（全読込を通らない読み込みの経路）・UX-307（構成ファイルの読み直し）
  - **分かったこと**: 時間の大半は初めて動くコードの暖まり（同じ JVM で続けて開くと 2.79 → 1.04 → 0.77 秒）。重複した解析・書き出し・読み直しは、冷えた JVM では暖まった後の 3〜4 倍の時間になる。AppCDS はこの環境では効果を確かめられなかった
  - **オーナーの Windows**: 計算と画面の段はこの環境の冷えた JVM とほぼ同じで、ファイルの一覧と本文の読み取りだけが 0.46〜3.0 秒（この環境の 4〜30 倍。1 度目の合計 5.9 秒の 51%）
  - **G1 の後の記録（2026-11-13）**: 暖まったときのファイルの段は 0.46 → 0.30 秒で、残りの 7 割は読む直前の実パスの確認。冷えた 1 度目は本文の読み取りが 2.9 秒（1 件 5 ms）で、重いのは名前の解決ではなくファイルを開いて読むこと（ウイルス対策の検査か OS のキャッシュ）。これを受けて G2 を入れた

  - **G2 の後の記録（2026-11-21）**: 冷えた 1 度目のファイルの段は 3.36 → 0.53 秒（合計 6.30 → 3.53 秒）、暖まったときは 0.30 → 0.19 秒。ファイルの段は合計の 6% になり、残りはセッションの読み込み 1.3 秒（40%。構造の検証 0.36〜0.44 秒・スキーマ文書の解析 0.38〜0.39 秒・保存基準の書き出しを含む段 0.14〜0.16 秒）、画面の段 1.2〜1.3 秒（39%）、組込みスキーマ 0.31〜0.35 秒（11%）

  - **読み込みの重複を減らした後の記録（2026-11-22）**: 暖まったときの合計は 3.28 → 2.46〜2.49 秒（冷えた 1 度目は 3.53 → 2.82 秒）。セッションの読み込みは 1.32〜1.39 → 0.74〜0.75 秒。残りは、画面の段 1.16〜1.18 秒（47%。ビュー定義の読み込み 0.20 秒・ダッシュボードの集計と業務の流れ 0.27〜0.32 秒・区切りの付いていない組み立てと描画 0.63〜0.67 秒）、セッションの読み込み 0.74 秒（30%）、組込みスキーマ 0.25〜0.27 秒（10%）、ファイルの段 0.20 秒（8%）

  | 案の系統 | 中身 | 効く場面 |
  |---|---|---|
  | G ファイルの段 | 一覧のときの確認をやめて読む直前の 1 回にする（G1。入れた）、確認と読み取りの並列（G2。入れた） | Windows。済み（オーナーの端末で合計の 6% になった） |
  | A 重複を減らす | 二度読み・5 回解析・組込みの作り直し・ビュー定義の読み直し・全件の書き出しと構造の検証・図の 2 回計算をなくす | いつでも。冷えた JVM ほど効く |
  | B 画面のスレッドから外す | ダッシュボードの集計・既定のダッシュボード探しを背景へ | 最初の描画（中身が出るまでは変わらない） |
  | C 並列にする | 組込みスキーマ・本文・スキーマ文書の並行、文書ごとの処理の並列 | 読み込み。4 コアのうち 1 コアしか使っていない |
  | D 暖機・先読み | スタート画面の間に見本で暖める、最近のワークスペースを読んでおく | スタート画面から開くときだけ |
  | E JVM の仕組み | C1 だけのコンパイル、JDK 25 の AOT キャッシュ | 起動の直後。ツールチェーンの判断が要る |
  | F 見え方 | 読み込み中もワークスペースの枠と進み具合を出す | 体感だけ |

  決めたこと（2026-11-13 オーナー）: ファイルの段は G1 を入れ、G3（フォルダの実パスを覚えて読む直前の確認を省く）は採らない。「読む直前に確かめる」決まりを守る。
  決めたこと（2026-11-14 オーナー）: G2 は本文の並列だけを入れる（本数は環境変数 `YDE_READ_THREADS`・32 件未満は 1 本）。組込みスキーマを読み取りと重ねるのは見送る。
  決めること: 入る順（A の中の順と、B・C・D を足すか）、D2（先読み）が所有権の設計（所有権を取ってから読む）と合うか、E3（JDK 25）を検討に入れるか。
  G2 の効き目はオーナーの端末の記録で確かめ、UX-305 を解決にした（2026-11-21）。
  決めたこと（2026-11-21 オーナー）: 下の順に進める。(1) は入れた（UX-301・UX-302 を解決。この環境の CLI でセッションの読み込みが 1.6〜1.8 秒 → 0.9〜1.2 秒）。(2) も入れた（UX-296 を解決・UX-297 は 5 回の解析が 2 回に。開く処理は、直す前の 2.2〜2.5 秒 → 1.2〜1.4 秒）。(3) は、画面の段の区切り（ビュー定義の読み込み・ビューの行の解決・ダッシュボードの集計・業務の流れの集計）と、ビュー定義の共有（UX-299 を解決）まで入れた。ダッシュボードの集計を背景へ移す（B1＝UX-300）のは、オーナーの端末の次の記録で内訳を見てから決める。
  次の順（2026-11-21 の案）: (1) 構造の検証を使うときに計算する（A6＝UX-302）と保存基準の書き出しを編集した文書だけにする（A5＝UX-301）、(2) 解析の重複をなくす（A1＝UX-296・A2＝UX-297）、(3) 画面の段に区切りを足してから、ビュー定義の共有（A4＝UX-299・UX-307）とダッシュボードの集計を背景へ（B1＝UX-300）、(4) 残った文書ごとの処理の並列（C2＝UX-304）。見込みは、オーナーの端末の 3.3 秒が 2 秒前後。
  次の案（2026-11-22。オーナーの判断待ち）: (a) ビュー定義の読み込みとダッシュボードの集計・業務の流れを、画面の初めての組み立てと並べて背景で計算する（B1・B2＝UX-300）。画面のスレッドの 0.5 秒前後が組み立てと重なり、最初の描画まで 0.3〜0.5 秒早まる見込み。計算が間に合わない間は「集計中」の表示になる。(b) 組込みスキーマをファイルの読み取りと並べる（C1。2026-11-14 に見送り）。アプリを起動して最初に開くときは、覚える案（A3）が効かないので、0.2 秒前後は並べないと縮まない。(c) 文書の解析と意味の導出の並列（C2＝UX-304）で 0.1 秒前後。区切りの付いていない組み立てと描画の 0.63〜0.67 秒は、どれでも縮まない（暖機・先読み・JDK の AOT の話になる）。
