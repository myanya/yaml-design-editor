id: T-04
title: ワークスペースを開く速さ
status: discussing
status_note: 議論待ち——分析は済み。どの案から入るかをオーナーと決める
body: |
  画面でワークスペースを開くと、クリックから最初の描画まで数秒かかる（2026-11-12 の分析で、この環境の冷えた JVM で 2.8〜4.1 秒）。
  時間の記録（`.yde/state/timings.log`・CLI `--timings`）と分析の記録は [workspace-open-analysis.md](archive/workspace-open-analysis.md)。

  - **束ねる指摘**: UX-296（parseToRaw の二度読み）・UX-297（スキーマ文書の 5 回解析）・UX-298（組込みスキーマの作り直し）・UX-299（ビュー定義の読み直し）・UX-300（ダッシュボードの集計が画面のスレッド）・UX-301（保存基準の全件書き出し）・UX-302（構造の全件検証）・UX-303（図の配置の 2 回計算）・UX-304（読み込みが 1 本のスレッド）・UX-305（Windows のファイルの段）
  - **分かったこと**: 時間の大半は初めて動くコードの暖まり（同じ JVM で続けて開くと 2.79 → 1.04 → 0.77 秒）。重複した解析・書き出し・読み直しは、冷えた JVM では暖まった後の 3〜4 倍の時間になる。AppCDS はこの環境では効果を確かめられなかった
  - **オーナーの Windows**: 計算と画面の段はこの環境の冷えた JVM とほぼ同じで、ファイルの一覧と本文の読み取りだけが 0.46〜3.0 秒（この環境の 4〜30 倍。1 度目の合計 5.9 秒の 51%）。YAML 1 件ごとに実パスを 2 回確かめるのが主な負担と見られる

  | 案の系統 | 中身 | 効く場面 |
  |---|---|---|
  | G ファイルの段 | 一覧のときの確認をやめて読む直前の 1 回にする（G1。入れた）、確認と読み取りの並列（G2） | Windows。オーナーの端末でいちばん大きい |
  | A 重複を減らす | 二度読み・5 回解析・組込みの作り直し・ビュー定義の読み直し・全件の書き出しと構造の検証・図の 2 回計算をなくす | いつでも。冷えた JVM ほど効く |
  | B 画面のスレッドから外す | ダッシュボードの集計・既定のダッシュボード探しを背景へ | 最初の描画（中身が出るまでは変わらない） |
  | C 並列にする | 組込みスキーマ・本文・スキーマ文書の並行、文書ごとの処理の並列 | 読み込み。4 コアのうち 1 コアしか使っていない |
  | D 暖機・先読み | スタート画面の間に見本で暖める、最近のワークスペースを読んでおく | スタート画面から開くときだけ |
  | E JVM の仕組み | C1 だけのコンパイル、JDK 25 の AOT キャッシュ | 起動の直後。ツールチェーンの判断が要る |
  | F 見え方 | 読み込み中もワークスペースの枠と進み具合を出す | 体感だけ |

  決めたこと（2026-11-13 オーナー）: ファイルの段は G1 を入れ、G3（フォルダの実パスを覚えて読む直前の確認を省く）は採らない。「読む直前に確かめる」決まりを守る。
  決めること: 入る順（A の中の順と、G2・B・C・D を足すか）、D2（先読み）が所有権の設計（所有権を取ってから読む）と合うか、E3（JDK 25）を検討に入れるか。
  ファイルの段は細かく区切ったので、オーナーの端末の次の記録で、冷えたときに重いのが実パスの確認か本文の読み取りかを見分ける。
