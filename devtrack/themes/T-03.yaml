id: T-03
title: 参照先の追加と対象を起点にした操作
status: discussing
status_note: 議論待ち
body: |
  TODO管理での試用を起点に、入力中の作業と選択した対象を引き継ぐ操作の導線を検討する。残る指摘はUX-183・185。選択対象の引継ぎ・前提の無効化・現在値と日付の初期表示は実装済み。
  本体の変更に着手する前に、対象ファイル・挙動・確認方法を提示して承認を得る。

  | 論点 | 検討内容 |
  |---|---|
  | 参照先の追加 | 参照欄に「追加」を置き、許可される型・スコープから作成先と既存の作成操作を選ぶ |
  | 入力の引継ぎ | 元の入力を保持し、作成したIDを選択して復帰する際の親子作業・取消・未保存データの扱いを決める |
  | 複数対象 | 共通の入力でまとめて処理する方式と、対象ごとに入力して順に進める方式を比較する |
  | 対象別の結果 | 実行可能・不可・入力待ちを対象別に示し、除外を明示した確認と途中失敗時の停止・継続・取消を設計する |
  | 操作の無効化 | 前提違反の操作はグレーアウトして理由を示し、パラメータ未入力による未確定を違反と混同しない |
  | 適用と履歴 | 表示後の状態変化を適用時に再検査し、まとめた変更と逐次適用の保存・Undoの単位を決める |

  既存の`ActionPlanner`と`ChangeSetApplier`を使い、UIに前提条件や更新処理を重複実装しない。
  現在の`actionWork`は1件だけなので、参照先の追加を別アクションで起動するだけでは元の入力を保持できない。
  アクションの`each`による定義済みの反復と、任意の操作を選択した複数対象へ適用するUIは分けて検討する。
  確認する場面は、TODO登録途中のカテゴリ追加、一覧で選んだ行からの操作、完了済みを含む複数選択、入力不足、実行直前の状態変更。
