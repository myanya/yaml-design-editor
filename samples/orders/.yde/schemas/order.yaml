id: order
name: 注文
kind: document
description: 注文 1 件を 1 ファイルで管理します。顧客と商品は番号で参照し、明細の金額と合計は検査が確かめます。
match: "orders/*.yaml"
filePattern: "orders/{id}.yaml"
# 文書のルートはオブジェクト型 注文（同一性＝エンティティ order の定義・金額の検査つき）。スキーマの entity は型が持ちます
root: { type: common#注文 }
# 他の要素へ線を辿る検査は、型ではなくスキーマに書きます（注文 → 明細 → 商品）
constraints:
  - id: line-id-starts-with-order-id
    description: 明細番号は、その注文の番号で始まること（例 ORD-001 の明細は ORD-001-01）
    match:
      - node: { entity: order, bind: o }
      - edge: { relation: has-line }
      - node: { entity: order-line, bind: l }
    check:
      - { startsWith: [ { of: l, path: orderLineId }, { format: "{orderId}-", scopes: [ { of: o } ] } ] }
    level: error
    message: "明細番号 {left} は注文番号 {o.id} で始まっていません"
  - id: pending-order-has-no-inactive-product
    description: 未処理の注文に、販売を終えた商品が含まれていないこと
    match:
      - node: { entity: order, bind: o }
      - edge: { relation: has-line }
      - node: { entity: order-line, bind: l }
      - edge: { via: productId }
      - node: { entity: product, bind: p }
    where:
      - { of: o, path: status, equals: pending }
      - { of: p, path: active, equals: false }
    expect: absent
    level: warning
    message: "未処理の注文 {o.id} の明細 {l.id} は、販売を終えた商品 {p.title} を注文しています"
actions:
  - id: register-order
    label: 注文を登録する
    description: 注文を 1 件、明細ごと新しいファイルとして作ります。注文番号は未使用の番号を指定します。明細には商品・数量・単価を入れると、明細番号・明細金額・注文合計金額は自動で入ります。
    input:
      initial:
        orderedAt: { $copy: today, $of: context }
    params:
      - key: orderId
        label: 注文番号
        type: common#注文番号
        required: true
      - key: orderedAt
        label: 注文受付日
        type: common#年月日
        required: true
      - key: customerId
        label: 注文顧客
        type: common#顧客参照
        required: true
      - key: lines
        label: 注文明細
        type: array
        default: []
        display: table
        description: 商品・数量・単価を入れます。明細番号（注文番号-01、-02 …）と明細金額（単価 × 数量）、注文合計金額は自動で入ります。
        item:
          type: object
          fields:
            - { key: productId, label: 注文商品, type: common#商品参照, required: true }
            - { key: quantity, label: 注文数量, type: common#数量, required: true }
            - { key: unitPrice, label: 単価, type: common#金額, required: true }
    require:
      - match: [ { node: { id: $orderId } } ]
        expect: absent
        message: $orderId は既に使われています
    do:
      - create:
          schema: order
          params:
            orderId: $orderId
            orderedAt: $orderedAt
            customerId: $customerId
            status: pending
            # 合計は受け取った明細から計算する（値の式）。明細が無ければ 0
            totalAmount: { $value: { sum: { each: { path: lines }, value: { multiply: [ { path: unitPrice }, { path: quantity } ] } } } }
            # 明細は受け取った値から組み立てる。番号は「注文番号-」に 1 始まりの番号を 2 桁で、金額は単価 × 数量
            lines:
              $each: lines
              $build:
                orderLineId: { $format: "{orderId}-{n}", $with: { orderId: $orderId, n: { $number: $position, $as: "00" } } }
                productId: { $copy: productId }
                quantity: { $copy: quantity }
                unitPrice: { $copy: unitPrice }
                amount: { $value: { multiply: [ { path: unitPrice }, { path: quantity } ] } }
            # 履歴の最初の行（登録）。状態を変える操作が行を足していく
            history: [ { date: $orderedAt, action: register-order, to: pending } ]
  - id: add-order-line
    label: 明細を足す
    description: 未処理の注文に明細を 1 行足します。明細番号は配列の追加の決まり（注文番号-01、-02 …）で採番し、明細金額と注文合計金額を更新します。
    target: { entity: order }
    params:
      - { key: productId, label: 注文商品, type: common#商品参照, required: true }
      - { key: quantity, label: 注文数量, type: common#数量, required: true }
      - { key: unitPrice, label: 単価, type: common#金額, required: true }
    require:
      - match: [ { node: { entity: order, bind: o } } ]
        where: [ { of: o, path: status, equals: pending } ]
        expect: exists
        message: "{id} は未処理の注文ではありません（受注確定・出荷済み・取消済みの注文には明細を足せません。確定した注文を直すときは「確定を戻す」）"
    do:
      # 明細番号は配列の insert の決まりが付ける（接頭辞は親の注文番号）。金額は受け取った値から計算する
      - insert:
          of: self
          path: lines
          params:
            productId: $productId
            quantity: $quantity
            unitPrice: $unitPrice
            amount: { $value: { multiply: [ { path: unitPrice }, { path: quantity } ] } }
      # 合計は、受け手（self）のいまの合計に足した明細の金額を加える
      - set:
          of: self
          path: totalAmount
          value: { $value: { add: [ { of: self, path: totalAmount }, { multiply: [ { path: unitPrice }, { path: quantity } ] } ] } }
  - id: confirm-order
    label: 受注を確定する
    description: 未処理の注文の内容を確定します。明細が 1 件以上あり、販売を終えた商品を含まないことが前提です。確定した注文には明細を足せません（直すときは「確定を戻す」）。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: order }
    params:
      - { key: date, label: 確定日, type: common#年月日, required: true }
      - { key: note, label: メモ, type: common#一行の文 }
    require:
      - match: [ { node: { entity: order, bind: o } } ]
        where: [ { of: o, path: status, equals: pending } ]
        expect: exists
        message: "{id} は未処理の注文ではありません"
      - match:
          - node: { entity: order, bind: o }
          - edge: { relation: has-line }
          - node: { entity: order-line }
        expect: exists
        message: "{id} には明細がありません"
      - match:
          - node: { entity: order, bind: o }
          - edge: { relation: has-line }
          - node: { entity: order-line, bind: l }
          - edge: { via: productId }
          - node: { entity: product, bind: p }
        where: [ { of: p, path: active, equals: false } ]
        expect: absent
        message: "{id} の明細 {l.id} は、販売を終えた商品 {p.title} を注文しています"
      - match: [ { node: { entity: order, bind: o } } ]
        check: [ { gte: [ $date, { of: o, path: orderedAt } ] } ]
        message: 確定日は注文受付日以降にしてください
    do:
      - set: { of: self, path: status, value: confirmed }
      - set: { of: self, path: confirmedAt, value: $date }
      - insert: { of: self, path: history, value: { date: $date, action: confirm-order, from: pending, to: confirmed, note: { $copy: note } } }
  - id: unconfirm-order
    label: 確定を戻す
    description: 受注確定の注文を未処理に戻します（明細を直すときなど）。確定日を外し、戻した理由を履歴に残します。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: order }
    params:
      - { key: date, label: 戻した日, type: common#年月日, required: true }
      - { key: reason, label: 戻す理由, type: common#一行の文, required: true, minLength: 1 }
    require:
      - match: [ { node: { entity: order, bind: o } } ]
        where: [ { of: o, path: status, equals: confirmed } ]
        expect: exists
        message: "{id} は受注確定の注文ではありません"
      - match: [ { node: { entity: order, bind: o } } ]
        check: [ { gte: [ $date, { of: o, path: confirmedAt } ] } ]
        message: 戻した日は確定日以降にしてください
    do:
      - set: { of: self, path: status, value: pending }
      - delete: { of: self, path: confirmedAt }
      - insert: { of: self, path: history, value: { date: $date, action: unconfirm-order, from: confirmed, to: pending, note: $reason } }
  - id: ship-order
    label: 注文を出荷する
    description: 受注確定の注文を出荷済みにし、出荷日を記録します。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: order }
    params:
      - { key: date, label: 出荷日, type: common#年月日, required: true }
      - { key: note, label: メモ, type: common#一行の文 }
    require:
      - match: [ { node: { entity: order, bind: o } } ]
        where: [ { of: o, path: status, equals: confirmed } ]
        expect: exists
        message: "{id} は受注確定の注文ではありません（未処理なら先に「受注を確定する」）"
      - match: [ { node: { entity: order, bind: o } } ]
        check: [ { gte: [ $date, { of: o, path: confirmedAt } ] } ]
        message: 出荷日は確定日以降にしてください
    do:
      - set: { of: self, path: status, value: shipped }
      - set: { of: self, path: shippedAt, value: $date }
      - insert: { of: self, path: history, value: { date: $date, action: ship-order, from: confirmed, to: shipped, note: { $copy: note } } }
  - id: cancel-order
    label: 注文を取り消す
    description: 未処理か受注確定の注文を取消済みにし、取消日と理由を記録します。出荷済みの注文は取り消せません。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: order }
    params:
      - { key: date, label: 取消日, type: common#年月日, required: true }
      - { key: reason, label: 取消理由, type: common#一行の文, required: true, minLength: 1 }
    require:
      - match: [ { node: { entity: order, bind: o } } ]
        where: [ { of: o, path: status, oneOf: [pending, confirmed] } ]
        expect: exists
        message: "{id} は未処理・受注確定の注文ではありません（出荷済み・取消済みの注文は取り消せません）"
      - match: [ { node: { entity: order, bind: o } } ]
        check: [ { gte: [ $date, { of: o, path: orderedAt } ] } ]
        message: 取消日は注文受付日以降にしてください
    do:
      # 履歴の「前の状態」は受け手のいまの状態を読むので、状態を変える前に足す
      - insert: { of: self, path: history, value: { date: $date, action: cancel-order, from: { $copy: status, $of: self }, to: cancelled, note: $reason } }
      - set: { of: self, path: status, value: cancelled }
      - set: { of: self, path: cancelledAt, value: $date }
      - set: { of: self, path: cancelReason, value: $reason }
