id: order-dashboard
name: 注文ダッシュボード
kind: dashboard
default: true
description: 注文の状況です。件数を押すと一覧に切り替わり、注文番号を押すと詳細と操作（確定・出荷・取消）へ進みます。顧客別・商品別は、注文から集計した件数と金額です。
actions: [register-order]
# 区画のタイルの並べ方: auto（幅が十分で横に 3 段以上になるときだけ縦の一覧）/ horizontal（横に折り返す）/ vertical（左の一覧）
placement: auto
# 全区画に共有する入力。空なら絞らない（受付日の範囲は注文一覧と月×商品カテゴリーの params へ、顧客区分は顧客別の filter へ）
inputs:
  - { key: from, label: 受付日（から）, type: date }
  - { key: to, label: 受付日（まで）, type: date }
  - key: kind
    label: 顧客区分
    type: enum
    values: [{ value: individual, label: 個人 }, { value: corporate, label: 法人 }]
# 業務の流れ: 状況の区画を段、操作を工程として流れ図に並べる。段を押すとその区画の一覧、工程を押すと
# その段の注文が「いま操作できる／できない（理由）」に分かれて並び、行から操作できる。区画の filter が「その段にいる」の定義
flow:
  direction: right
  start: { action: register-order, to: pending }
  steps: [pending, confirmed, shipped, cancelled]
  moves:
    - { from: pending, action: confirm-order, to: confirmed }
    - { from: pending, action: add-order-line }
    - { from: pending, action: cancel-order, to: cancelled }
    - { from: confirmed, action: ship-order, to: shipped }
    - { from: confirmed, action: unconfirm-order, to: pending }
    - { from: confirmed, action: cancel-order, to: cancelled }
  # 業務詳細の「流れの中の位置」に出す履歴（注文の history。行の項目は date / action / from / to / note）
  history: { path: history }
# 区画は group で 3 つの群に分け、見出し付きで並べる（群は畳める）
sections:
  - id: pending
    label: 未処理
    group: 状況
    view: order-grid
    filter:
      match:
        - node: { entity: order, bind: o }
      where:
        - { of: o, path: status, equals: pending }
      expect: exists
  - id: confirmed
    label: 受注確定
    group: 状況
    view: order-grid
    filter:
      match:
        - node: { entity: order, bind: o }
      where:
        - { of: o, path: status, equals: confirmed }
      expect: exists
  - id: shipped
    label: 出荷済み
    group: 状況
    view: order-grid
    filter:
      match:
        - node: { entity: order, bind: o }
      where:
        - { of: o, path: status, equals: shipped }
      expect: exists
  - id: cancelled
    label: 取消済み
    group: 状況
    view: order-grid
    filter:
      match:
        - node: { entity: order, bind: o }
      where:
        - { of: o, path: status, equals: cancelled }
      expect: exists
  # 滞留: 未処理・受注確定のまま、受付から基準日まで 7 日以上たった注文（基準日を変えると変わる）
  - id: stale
    label: 受付から 7 日以上
    group: 状況
    view: order-grid
    filter:
      match:
        - node: { entity: order, bind: o }
      where:
        - { of: o, path: status, oneOf: [pending, confirmed] }
      check:
        - { gte: [ { daysBetween: [ { of: o, path: orderedAt }, $today ] }, 7 ] }
  - id: all
    label: すべての注文
    group: 状況
    view: order-grid
  - id: customers
    label: 顧客別
    group: 内訳
    view: customer-grid
    # 顧客区分（共有の入力）で絞る。空なら条件が外れて全員
    filter:
      match:
        - node: { entity: customer, bind: c }
      where:
        - { of: c, path: kind, equals: $kind }
      expect: exists
  - id: companies
    label: 会社別
    group: 内訳
    view: company-grid
  - id: products
    label: 商品別
    group: 内訳
    view: product-grid
  - id: categories
    label: カテゴリー別
    group: 内訳
    view: category-grid
  # チャートの区画: 件数の代わりに項目の数を出し、一覧の代わりに図を描く
  - id: monthly
    label: 月別売上
    group: 図
    view: monthly-sales-chart
  - id: share
    label: 顧客別の割合
    group: 図
    view: customer-share-chart
  - id: company-share
    label: 会社別の割合
    group: 図
    view: company-share-chart
  - id: ranking
    label: 顧客別の順位
    group: 図
    view: customer-ranking-chart
