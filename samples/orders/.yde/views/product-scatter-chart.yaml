id: product-scatter-chart
name: 単価と受注数量
kind: chart
chart: scatter
description: 商品一覧の 2 つの数の列を軸にした散布図です。横軸＝現在の販売単価、縦軸＝受注数量（取消済みの注文は除く）、点＝商品。単価の高い商品は少量で、安い商品は大量に売れているか、外れた商品はどれかを見ます。
view: product-grid
x: 現在の販売単価          # 横軸にする数の列（散布図では x は数の列）
series: [受注数量]          # 縦軸にする数の列（2 つ以上なら色分け）
label: 商品名               # 点の名前（マウスを載せたときと材料の見出し。省略すると行のタイトル）
y: { label: 受注数量, format: "#,##0" }
# 単価は 120 円〜49,800 円と桁で散るので、横軸を対数にする（0 以下の値は描かない）
scale: { x: log }
