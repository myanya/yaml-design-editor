id: ENT-TODO
physical_name: todos
columns:
  - { id: ATTR-TODO-ID, physical_name: todo_id }
  - { id: ATTR-TODO-TITLE, physical_name: title }
  - { id: ATTR-TODO-SUMMARY, physical_name: summary }
  - { id: ATTR-TODO-CATEGORY, physical_name: category_id }
  - { id: ATTR-TODO-FOLLOWS, physical_name: follows_todo_id }
  - { id: ATTR-TODO-STATUS, physical_name: status }
  - { id: ATTR-TODO-CREATED, physical_name: created_on }
  - { id: ATTR-TODO-UPDATED, physical_name: updated_on }
  - { id: ATTR-TODO-DUE, physical_name: due_on }
  - { id: ATTR-TODO-COMPLETED, physical_name: completed_on }
  - { id: ATTR-TODO-DETAILS, physical_name: details }
  - { id: ATTR-TODO-RESULT, physical_name: result }
primary_key: [ATTR-TODO-ID]
foreign_keys:
  - { column: ATTR-TODO-CATEGORY, target: ATTR-CATEGORY-ID, on_delete: RESTRICT, on_update: RESTRICT }
  - { column: ATTR-TODO-FOLLOWS, target: ATTR-TODO-ID, on_delete: RESTRICT, on_update: RESTRICT }
indexes:
  - { name: idx_todos_category, unique: false, columns: [ATTR-TODO-CATEGORY] }
  - { name: idx_todos_due, unique: false, columns: [ATTR-TODO-DUE] }
checks:
  - { name: ck_todos_due, columns: [ATTR-TODO-DUE, ATTR-TODO-CREATED], condition: 期限はNULL、または作成日以降とする。 }
  - { name: ck_todos_completed, columns: [ATTR-TODO-COMPLETED, ATTR-TODO-CREATED], condition: 完了日はNULL、または作成日以降とする。 }
  - { name: ck_todos_updated, columns: [ATTR-TODO-UPDATED, ATTR-TODO-CREATED], condition: 更新日は作成日以降とする。 }
  - { name: ck_todos_follows, columns: [ATTR-TODO-FOLLOWS, ATTR-TODO-ID], condition: 元のTODOはNULL、または自分以外とする。 }
  - { name: ck_todos_completion, columns: [ATTR-TODO-STATUS, ATTR-TODO-COMPLETED, ATTR-TODO-RESULT], condition: CLOSEDなら完了日と空白だけではない結果が必要。CLOSED以外では完了日をNULLにする。 }
physical_notes: |
  一覧と個票を一つのレコードにまとめる。
  TODO番号は登録操作が採番し（使われている番号の最大の次）、初期状態OPENと登録日も登録操作から渡す。DB既定値やDBの自動採番には依存しない。
  更新日は、行を更新するたびにアプリケーションが入れる。DBのトリガーには頼らない。
  カテゴリ別一覧と期限順一覧の検索を想定し、二つの非一意索引を置く。性能測定による確定は後続の検討とする。
  カテゴリの削除とキー変更は参照中なら拒否する。未分類への変更は明示的な操作で行う。
  状態遷移の前提と再開コメントの追加、状態の履歴の追記はアプリケーション側の責務とし、DBでは現在の状態の整合を保証する。
