id: TBL-COMMENT
physical_name: comments
implements: ENT-COMMENT
columns:
  - id: COL-COMMENT-TODO
    physical_name: todo_id
    implements: ATTR-COMMENT-TODO
  - id: COL-COMMENT-NUMBER
    physical_name: comment_no
    implements: ATTR-COMMENT-NUMBER
  - id: COL-COMMENT-DATE
    physical_name: recorded_on
    implements: ATTR-COMMENT-DATE
  - id: COL-COMMENT-BODY
    physical_name: body
    implements: ATTR-COMMENT-BODY
primary_key:
  - COL-COMMENT-TODO
  - COL-COMMENT-NUMBER
foreign_keys:
  - column: COL-COMMENT-TODO
    target: COL-TODO-ID
    on_delete: RESTRICT
    on_update: RESTRICT
indexes: []
checks: []
notes: |
  TODO番号とコメント番号で一意に識別する。論理属性のrequired=trueはNOT NULLとする。
  コメント番号はTODO内で正の整数を割り当てる。既存の配列を移す場合は配列順を保持し、その後は変更しない。
  同時追加時の採番と衝突処理はアプリケーション設計で決める。MAX+1だけで安全とみなさない。
  コメントがあるTODOの削除とキー変更は拒否する。履歴の削除方針は業務側で別途決める。
