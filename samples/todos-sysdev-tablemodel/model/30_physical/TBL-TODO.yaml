id: TBL-TODO
physical_name: todos
implements: ENT-TODO
columns:
  - id: COL-TODO-ID
    physical_name: todo_id
    implements: ATTR-TODO-ID
  - id: COL-TODO-TITLE
    physical_name: title
    implements: ATTR-TODO-TITLE
  - id: COL-TODO-SUMMARY
    physical_name: summary
    implements: ATTR-TODO-SUMMARY
  - id: COL-TODO-CATEGORY
    physical_name: category_id
    implements: ATTR-TODO-CATEGORY
  - id: COL-TODO-STATUS
    physical_name: status
    implements: ATTR-TODO-STATUS
  - id: COL-TODO-CREATED
    physical_name: created_on
    implements: ATTR-TODO-CREATED
  - id: COL-TODO-DUE
    physical_name: due_on
    implements: ATTR-TODO-DUE
  - id: COL-TODO-COMPLETED
    physical_name: completed_on
    implements: ATTR-TODO-COMPLETED
  - id: COL-TODO-DETAILS
    physical_name: details
    implements: ATTR-TODO-DETAILS
  - id: COL-TODO-RESULT
    physical_name: result
    implements: ATTR-TODO-RESULT
primary_key:
  - COL-TODO-ID
foreign_keys:
  - column: COL-TODO-CATEGORY
    target: COL-CATEGORY-ID
    on_delete: RESTRICT
    on_update: RESTRICT
indexes:
  - name: idx_todos_category
    unique: false
    columns:
      - COL-TODO-CATEGORY
  - name: idx_todos_due
    unique: false
    columns:
      - COL-TODO-DUE
checks:
  - name: ck_todos_due
    columns: [COL-TODO-DUE, COL-TODO-CREATED]
    condition: 期限はNULL、または作成日以降とする。
  - name: ck_todos_completed
    columns: [COL-TODO-COMPLETED, COL-TODO-CREATED]
    condition: 完了日はNULL、または作成日以降とする。
  - name: ck_todos_completion
    columns: [COL-TODO-STATUS, COL-TODO-COMPLETED, COL-TODO-RESULT]
    condition: CLOSEDなら完了日と空白だけではない結果が必要。CLOSED以外では完了日をNULLにする。
notes: |
  一覧と個票を一つのレコードにまとめる。論理属性のrequired=trueはNOT NULL、falseはNULL許可とする。
  初期状態OPENと登録日は登録操作から渡し、DB既定値や自動採番に依存しない。
  カテゴリ別一覧と期限順一覧の検索を想定し、二つの非一意索引を置く。性能測定による確定は後続の検討とする。
  カテゴリの削除とキー変更は参照中なら拒否する。未分類への変更は明示的な操作で行う。
  状態遷移の前提と再開コメントの追加はアプリケーション側の責務とし、DBでは現在の状態の整合を保証する。
