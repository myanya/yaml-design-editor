id: ENT-STATUS-HISTORY
attributes:
  - id: ATTR-HISTORY-TODO
    name: 対象TODO
    dtype: DT-TODO-ID
    required: true
    source: 個票.id
    references: ENT-TODO
  - id: ATTR-HISTORY-NUMBER
    name: 履歴番号
    dtype: DT-HISTORY-NUMBER
    required: true
    source: 状態の履歴の配列位置から採番する
  - id: ATTR-HISTORY-DATE
    name: 日付
    dtype: DT-DATE
    required: true
    source: 個票.history[*].date
  - id: ATTR-HISTORY-ACTION
    name: 操作
    dtype: DT-ACTION
    required: true
    source: 個票.history[*].action
  - id: ATTR-HISTORY-FROM
    name: 前の状態
    dtype: DT-STATUS
    required: false
    source: 個票.history[*].from
  - id: ATTR-HISTORY-TO
    name: 後の状態
    dtype: DT-STATUS
    required: true
    source: 個票.history[*].to
  - id: ATTR-HISTORY-NOTE
    name: 理由
    dtype: DT-TEXT
    required: false
    source: 個票.history[*].note
key:
  - ATTR-HISTORY-TODO
  - ATTR-HISTORY-NUMBER
notes: |-
  履歴番号はTODO内で一意。配列順（古い順）を番号として保存する。同じ日に同じ操作を繰り返せるため、日付や操作をキーにしない。
  前の状態は、登録と個票の作成の行には無い。理由は中止と再開の行にだけある。
  行は追記だけで、書き換えと削除をしない。最後の行の後の状態は、TODOの状態と一致する。
