  - { name: association-target, label: 関連の先, inverseLabel: 先となる関連, source: [todo-association], target: [todo-concept] }
  - { name: operates-on, label: 操作の対象, inverseLabel: 対象とする操作, source: [todo-operation], target: [todo-concept] }
  - { name: has-attribute, label: 属性, inverseLabel: 属するエンティティ, source: [todo-concept], target: [todo-attribute] }
