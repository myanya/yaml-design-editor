  - { name: primary-key, label: 主キー, inverseLabel: 主キーとするテーブル, source: [todo-concept], target: [todo-attribute] }
  - { name: column-use, label: 対象カラム, inverseLabel: 使うキー・条件, source: [todo-concept], target: [todo-attribute] }
  - { name: foreign-key-target, label: 外部キーの参照先, inverseLabel: 参照してくる外部キー, source: [todo-concept], target: [todo-attribute] }
