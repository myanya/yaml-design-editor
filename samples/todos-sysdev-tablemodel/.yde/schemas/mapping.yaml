id: tm-mapping
name: SQLite型対応
match: model/30_physical/types.yaml
entity:
  type: todo-datatype
  idPattern: DT-*
  defines: false
  aspect: physical
  owns: [sql_type]
root:
  type: object
  fields:
    - { key: dialect, type: enum, required: true, values: [sqlite], label: DB方言 }
    - { key: policy, label: 型対応の方針, type: text, required: true }
    - key: types
      type: array
      required: true
      label: 型の対応
      item:
        type: object
        fields:
          - { key: id, type: id, required: true, label: 業務データ型 }
          - { key: sql_type, type: enum, required: true, values: [TEXT, INTEGER], label: SQLの型 }
