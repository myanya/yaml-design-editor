id: todo-management
name: TODO管理
rows:
  idPattern: TODO-*
order:
  fileGlob: todos/todo-list.yaml
columns:
  - label: カテゴリ
    schemaId: todo-list
    path: category
    editable: true
  - label: ステータス
    schemaId: todo-detail
    path: status
  - label: 期限
    schemaId: todo-detail
    path: due_on
    editable: true
  - label: 概要
    schemaId: todo-list
    path: summary
    editable: true
  - label: 作成日
    schemaId: todo-detail
    path: created_on
  # 更新日は個票の項目（保存と操作の適用で自動で入る）
  - label: 更新日
    schemaId: todo-detail
    path: updated_on
detail:
  fileGlob: todos/details/*.yaml
  filePattern: todos/details/{id}.yaml
newRow:
  file: todos/todo-list.yaml
  path: todos
