id: todo-dashboard
name: TODOダッシュボード
kind: dashboard
default: true
description: 業務の流れで状態ごとの件数と、いま操作できるTODOを示します。気になる状況の件数を選び、一覧のIDから詳細と操作へ進みます。期限超過は未完了で期限が基準日より前のTODOです。
actions: [register-todo, add-category]
# 業務の流れ: 状態の区画を段、状態を変える操作を工程として流れ図に並べる。段を押すとその区画の一覧、
# 工程を押すとその段の TODO が「いま操作できる／できない（理由）」に分かれて並び、行から操作できる。
# 段と工程は状態の流れの宣言（.yde/schemas/todo-behavior.yaml）と同じ移り方で、区画の filter が「その段にいる」の定義
flow:
  direction: right
  start: { action: register-todo, to: open }
  steps: [open, in-progress, closed, canceled]
  moves:
    - { from: open, action: start-todo, to: in-progress }
    - { from: open, action: complete-todo, to: closed }
    - { from: open, action: cancel-todo, to: canceled }
    - { from: in-progress, action: complete-todo, to: closed }
    - { from: in-progress, action: cancel-todo, to: canceled }
    - { from: closed, action: reopen-todo, to: in-progress }
  # 業務詳細の「流れの中の位置」に出す履歴（個票の状態の履歴。行の項目は date / action / from / to / note）。
  # 一覧の行に無いので、同じ ID の個票から読まれる
  history: { path: history }
# 区画は group で群に分け、見出し付きで並べる（群は畳める）。流れの段にした区画は流れ図に出る
sections:
  - id: open
    label: 未着手
    group: 状況
    view: todo-management
    filter:
      match: [ { node: { entity: todo, bind: t } } ]
      where: [ { of: t, path: status, equals: OPEN } ]
      expect: exists
  - id: in-progress
    label: 対応中
    group: 状況
    view: todo-management
    filter:
      match: [ { node: { entity: todo, bind: t } } ]
      where: [ { of: t, path: status, equals: IN_PROGRESS } ]
      expect: exists
  - id: closed
    label: 完了
    group: 状況
    view: todo-management
    filter:
      match: [ { node: { entity: todo, bind: t } } ]
      where: [ { of: t, path: status, equals: CLOSED } ]
      expect: exists
  - id: canceled
    label: 中止
    group: 状況
    view: todo-management
    filter:
      match: [ { node: { entity: todo, bind: t } } ]
      where: [ { of: t, path: status, equals: CANCELED } ]
      expect: exists
  - id: overdue
    label: 期限超過
    group: 注意
    view: todo-by-due
    filter:
      match:
        - node: {entity: todo, bind: t}
      where:
        - {of: t, path: status, oneOf: [OPEN, IN_PROGRESS]}
        - {of: t, path: due_on, exists: true}
      check:
        - lt: [{of: t, in: {schemaId: todo-detail}, path: due_on}, $today]
          type: date
  # フォームやビューの新規行で一覧だけを作った TODO（状態の流れに入る前。配布時のデータでは 0 件）
  - id: missing-detail
    label: 個票未作成
    group: 注意
    view: todo-management
    filter:
      match:
        - node: {entity: todo, bind: t}
      check:
        - eq: [{occurrenceCount: {of: t, schema: todo-detail}}, 0]
  - id: all
    label: すべてのTODO
    group: 全体
    view: todo-management
  - id: categories
    label: カテゴリ別の状況
    group: 全体
    view: category-status-matrix
