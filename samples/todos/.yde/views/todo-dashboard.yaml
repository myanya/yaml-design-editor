id: todo-dashboard
name: TODOダッシュボード
kind: dashboard
default: true
description: 業務の流れで状態ごとの件数と、いま操作できるTODOを示します。気になる状況の件数を選び、一覧のIDから詳細と操作へ進みます。期限超過は未完了で期限が基準日より前のTODOです。
actions: [register-todo, add-category, add-tag]
# 業務の流れ: 状態の流れ（todo-behavior.yaml の todo-lifecycle）から作る。段は状態（区画の id は todo-OPEN など、
# 見出しは状態の表示名）、線は状態を変える操作、入口は登録、履歴は個票の状態の履歴。段の区画は「TODO管理」の表で並べる
flow:
  lifecycle: todo-lifecycle
  view: todo-management
  group: 状況
  direction: right
# 区画は group で群に分け、見出し付きで並べる（群は畳める）。状況の段の区画は、上の flow が状態から作る
sections:
  # 期限超過は未着手と対応中だけ（中断・完了・中止は数えない）
  - id: overdue
    label: 期限超過
    group: 注意
    view: todo-by-due
    filter:
      match:
        - node: {entity: todo, bind: t}
      where:
        - {of: t, path: status, oneOf: [OPEN, IN_PROGRESS]}
        - {of: t, path: due_on, exists: true}
      check:
        - lt: [{of: t, in: {schemaId: todo-detail}, path: due_on}, $today]
          type: date
  # フォームやビューの新規行で一覧だけを作った TODO（状態の流れに入る前。配布時のデータでは 0 件）
  - id: missing-detail
    label: 個票未作成
    group: 注意
    view: todo-management
    filter:
      match:
        - node: {entity: todo, bind: t}
      check:
        - eq: [{occurrenceCount: {of: t, schema: todo-detail}}, 0]
  - id: all
    label: すべてのTODO
    group: 全体
    view: todo-management
  - id: categories
    label: カテゴリ別の状況
    group: 全体
    view: category-status-matrix
  - id: tags
    label: タグ別の状況
    group: 全体
    view: tag-status-matrix
