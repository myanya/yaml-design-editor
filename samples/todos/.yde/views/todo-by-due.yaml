id: todo-by-due
name: 期限順
rows:
  idPattern: "TODO-*"
# 個票の期限の順。due_on は日付の項目なので、日付として並びます（type を書く必要はありません）。
# 期限の無い TODO（個票が無い・期限が未定）は後ろ、同じ期限は ID の順です。
order:
  schemaId: todo-detail
  path: due_on
columns:
  - label: タイトル
    schemaId: todo-list
    path: title
  - label: ステータス
    schemaId: todo-detail
    path: status
    editable: true
  - label: 期限
    schemaId: todo-detail
    path: due_on
    editable: true
  - label: 完了日
    schemaId: todo-detail
    path: completed_on
    editable: true
detail:
  fileGlob: "todos/details/*.yaml"
  filePattern: "todos/details/{id}.yaml"
