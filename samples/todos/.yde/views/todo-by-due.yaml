id: todo-by-due
name: 期限順
# 受け取る値: タグ（複数）とカテゴリ（TODO管理と同じ。空なら絞らない）
params: [tags, category]
rows:
  match:
    - node: { entity: todo, bind: t }
  where:
    - { of: t, path: tags, includesAny: $tags }
    - { of: t, path: category, equals: $category }
order:
  schemaId: todo-detail
  path: due_on
columns:
  - label: タイトル
    schemaId: todo-list
    path: title
  - label: ステータス
    schemaId: todo-detail
    path: status
  - label: 期限
    schemaId: todo-detail
    path: due_on
    editable: true
  - label: 完了日
    schemaId: todo-detail
    path: completed_on
detail:
  fileGlob: todos/details/*.yaml
  filePattern: todos/details/{id}.yaml
