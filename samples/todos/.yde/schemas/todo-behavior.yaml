id: todo-behavior
name: TODOの振る舞い
kind: behavior
description: >-
  TODOの状態の流れの原本です。状態（個票の status の値）・入口・移り方・終わり・状態の履歴をここに書きます。
  流れは 2 段で書きます。粗い流れ（todo-lifecycle）は「未完了 → 完了／中止」だけで、未完了の中の流れ（未着手・対応中・中断）は
  詳細化（refinements）に別に書きます。
  状態を変える操作（operations.yaml の lifecycle: todo-lifecycle）は、2 段を合わせた流れから、できる状態・移り先・履歴の行が決まり、
  ダッシュボードの業務の流れ（todo-dashboard.yaml の flow）も、ここから段と線が決まります。
  遷移は業務シナリオ scenarios/lifecycle.yaml で確かめます。
# State: 個票の status の値ごとに 1 つ（todo-OPEN・todo-IN_PROGRESS・todo-SUSPENDED・todo-CLOSED・todo-CANCELED）。
# 表示名は選択肢の label（未着手・対応中・中断・完了・中止）。State を別に保存するのではなく、「status がその値と等しい」という述語です
states:
  - source: { entity: todo, path: status, enum: common#ステータス }
    idPrefix: todo-
  # 未完了: 述語を書かない State。下の詳細化の子（未着手・対応中・中断）のどれかのとき真です。
  # status には子の値を書き、未完了という値は持ちません
  - id: todo-ACTIVE
    entity: todo
    label: 未完了
# Event（外から起きる事実）は置きません。個人の TODO では、状態を変える出来事はどれも本人の操作として記録するためです
lifecycles:
  - id: todo-lifecycle
    entity: todo
    states: [todo-ACTIVE, todo-CLOSED, todo-CANCELED]
    entry:
      - { to: todo-ACTIVE, by: { action: register-todo } }
    transitions:
      - { from: todo-ACTIVE, to: todo-CLOSED, by: { action: complete-todo } }
      # 中止は未完了のどの状態からでもできます（詳細化の exits で狭めていないため）
      - { from: todo-ACTIVE, to: todo-CANCELED, by: { action: cancel-todo } }
    # 完了と中止が終わり。完了から戻る移り方はありません（追加の作業は、元のTODOを選んで新しく登録します）
    termination:
      terminal: [todo-CLOSED, todo-CANCELED]
    # 状態の履歴: 移るたびに、個票の history へ 1 行（date・action・from・to と、操作が足す値）。from・to は子の状態です
    history: { path: history }
# 詳細化: 未完了の中の流れ。入口は未完了へ入る原因（登録）ごとに 1 つ、出口は未完了から出る遷移を出られる子に狭めます
refinements:
  - state: todo-ACTIVE
    states: [todo-OPEN, todo-IN_PROGRESS, todo-SUSPENDED]
    entry:
      - { to: todo-OPEN, by: { action: register-todo } }
    transitions:
      - { from: todo-OPEN, to: todo-IN_PROGRESS, by: { action: start-todo } }
      - { from: todo-IN_PROGRESS, to: todo-SUSPENDED, by: { action: suspend-todo } }
      - { from: todo-SUSPENDED, to: todo-IN_PROGRESS, by: { action: resume-todo } }
    exits:
      # 完了できるのは対応中からだけ
      - { by: { action: complete-todo }, from: [todo-IN_PROGRESS] }
