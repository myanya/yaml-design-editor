id: todo-detail
name: TODO個票
kind: document
description: 一覧のTODOを同じIDで詳細化し、進捗とコメントを記録します。
match: "todos/details/*.yaml"
entity:
  type: todo
  idType: common#TODO番号
  defines: false
  owns: [status, created_on, due_on, completed_on, details, result, comments]
root:
  type: object
  fields:
    - key: id
      label: ID
      type: common#TODO番号
      required: true
      description: 一覧のIDと一致させ、todos/details/<ID>.yaml に保存します。
    - key: status
      label: ステータス
      type: common#ステータス
      required: true
      default: OPEN
    - key: created_on
      label: 作成日
      type: common#年月日
      required: true
      description: TODOを登録した日。
    - key: due_on
      label: 期限
      type: common#年月日
      description: 未定の場合は省略します。作成日より前の日付は検査が指摘します。
    - key: completed_on
      label: 完了日
      type: common#年月日
      description: 完了時に入力します。未完了・中止の場合は省略します。
    - key: details
      label: 詳細
      type: common#文章
      description: 作業内容や完了条件を記載します。
    - key: result
      label: 結果
      type: common#文章
      description: 対応結果や中止理由を記載します。
    - key: comments
      label: コメント一覧
      type: array
      default: []
      display: list
      description: 並び順は任意です。ビューの「更新日」は、コメントの日付のいちばん新しいものです。
      item:
        type: object
        fields:
          - key: date
            label: 日付
            type: common#年月日
            required: true
          - key: body
            label: コメント本文
            type: text
            required: true
# 個票の検査。日付の項目どうしの比較は、項目の型が日付なので日付として比べます（type: date を書く必要はありません）
constraints:
  - id: due-not-before-created
    description: 期限は作成日以降であること
    match:
      - node: { entity: todo, bind: t }
    check:
      - gte: [ { of: t, path: due_on }, { of: t, path: created_on } ]
    level: error
  - id: completed-not-before-created
    description: 完了日は作成日以降であること
    match:
      - node: { entity: todo, bind: t }
    check:
      - gte: [ { of: t, path: completed_on }, { of: t, path: created_on } ]
    level: error
  - id: closed-has-completed-on
    description: 完了した TODO には完了日があること
    match:
      - node: { entity: todo, bind: t }
    where:
      - { of: t, path: status, equals: CLOSED }
      - { of: t, path: completed_on, exists: false }
    expect: absent
    level: warning
    message: "完了した TODO「{id}」に完了日がありません"
