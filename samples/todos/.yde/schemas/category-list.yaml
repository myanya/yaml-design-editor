id: category-list
name: カテゴリ一覧
kind: document
description: TODOからIDで参照するカテゴリを管理します。
match: todos/category-list.yaml
entity:
  type: category
  idType: common#カテゴリ番号   # ID の形式は共通の型から（「CAT-」と 3 桁以上の数字）
  defines: true
  owns: [name]
root:
  type: object
  fields:
    - key: categories
      label: カテゴリ一覧
      type: array
      default: []
      display: table
      methods:
        insert:
          id: { path: id, prefix: "CAT-", digits: 3 }
      item:
        type: object
        fields:
          - key: id
            label: ID
            type: common#カテゴリ番号
            required: true
            description: 追加時にCAT-001形式で自動採番します。TODOからこのIDを参照します。
          - key: name
            label: カテゴリ名
            type: common#一行の文
            role: title
            required: true
actions:
  - id: add-category
    label: カテゴリを追加する
    description: TODOを分類するカテゴリを作ります。IDは一覧の追加規則で自動採番します。
    params:
      - key: name
        label: カテゴリ名
        type: common#一行の文
        minLength: 1
        required: true
    do:
      - insert:
          in: { schemaId: category-list }
          path: categories
          params: { name: $name }
