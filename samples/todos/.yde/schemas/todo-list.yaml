id: todo-list
name: TODO一覧
kind: document
description: ID・タイトル・概要・カテゴリを管理する一覧。個票と同じIDを使用します。
match: todos/todo-list.yaml
entity:
  type: todo
  idType: common#TODO番号   # ID の形式は共通の型から（「TODO-」と 3 桁以上の数字）
  defines: true
  owns: [title, summary, category]
root:
  type: object
  fields:
    - key: todos
      label: TODO一覧
      type: array
      default: []
      display: table
      item:
        type: object
        fields:
          - key: id
            label: ID
            type: common#TODO番号
            required: true
            description: 一覧内で一意のID。例：TODO-001。個票のIDとファイル名にも使用します。
          - key: title
            label: タイトル
            type: common#一行の文
            role: title
            required: true
          - key: summary
            label: 概要
            type: common#一行の文
            role: subtitle
            required: true
          - key: category
            label: カテゴリ
            type: common#カテゴリ参照
