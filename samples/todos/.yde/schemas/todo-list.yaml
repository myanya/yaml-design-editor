id: todo-list
name: TODO一覧
kind: document
description: ID・タイトル・概要・カテゴリを管理する一覧。個票と同じIDを使用します。
match: todos/todo-list.yaml
# 行の形（オブジェクト型 TODO一覧の行）が同一性（エンティティ todo の定義）を持つので、スキーマの entity は要りません
root:
  type: object
  fields:
    - key: todos
      label: TODO一覧
      type: array
      default: []
      display: table
      # 一覧の「追加」とビューの新規行で、番号を自動で振る（「TODOを登録する」と同じ TODO- と 3 桁）
      methods:
        insert:
          id: { path: id, prefix: "TODO-", digits: 3 }
      item: { type: common#TODO一覧の行 }
