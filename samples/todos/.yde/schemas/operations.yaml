id: todo-operations
name: TODOの操作
kind: library
definitions:
  操作の記録:
    type: common#文章
    minLength: 1
    description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
description: 業務上の操作を、確認して適用できる変更セットとして実行します。
actions:
  - id: register-todo
    label: TODOを登録する
    description: 一覧と未着手の個票を一度に作成します。TODO番号は、使われている番号の次を自動で振ります。状態（未着手）と状態の履歴の最初の行は、状態の流れ（todo-lifecycle）の入口から入ります。
    # 状態の流れの入口（todo-behavior.yaml の entry）。作った個票に、初めの状態と履歴の行を書く
    lifecycle: todo-lifecycle
    params:
      - key: title
        label: タイトル
        type: common#一行の文
        required: true
      - key: summary
        label: 概要
        type: common#一行の文
        required: true
      - key: category
        label: カテゴリ
        type: common#カテゴリ参照
      - key: follows
        label: 元のTODO
        type: common#TODO参照
        description: 完了したTODOに追加の作業が要るときに、その元のTODOを選びます。
      - key: due
        label: 期限
        type: common#年月日
      - key: details
        label: 詳細
        type: common#文章
    do:
      # 個票を先に作り、番号を採番で決める（TODO- と 3 桁。一覧と個票で使われている番号の次）。作った個票は todo で後の手から指せる
      - create:
          schema: todo-detail
          id: { prefix: "TODO-", digits: 3 }
          bind: todo
          params:
            due_on:
              $copy: due
            details:
              $copy: details
            comments: []
      # 一覧に、採番した番号で行を足す
      - insert:
          in:
            schemaId: todo-list
          path: todos
          value:
            id: { $copy: id, $of: todo }
            title: $title
            summary: $summary
            category:
              $copy: category
            follows:
              $copy: follows
  - id: add-todo-comment
    label: TODOにコメントを追加する
    input:
      initial:
        date: { $copy: today, $of: context }
    description: 個票のあるTODOへ、状態に関係なく日付と本文を記録します。
    target: { entity: todo }
    params:
      - { key: date, label: 記録日, type: common#年月日, required: true }
      - { key: body, label: コメント本文, type: 操作の記録, required: true }
    require:
      - match: [{ node: { entity: todo, schema: todo-detail } }]
        expect: exists
        message: "{id} は個票が必要です。先に「TODOを編集する」で作成してください"
    do:
      - insert:
          in: { schemaId: todo-detail }
          path: comments
          value: { date: $date, body: $body }
          of: self
  - id: edit-todo
    label: TODOを編集する
    description: 現在値を表示し、変更した項目だけを更新します。状態と完了日は変えません（着手・完了・再開・中止の操作で変えます）。空文字への変更と消去は別で、消去は「値を消す」で指定します。個票がなければ未着手の個票を作成します。
    input:
      submit: changed
      initial:
        title: { $copy: title, $of: self, $in: { schemaId: todo-list } }
        summary: { $copy: summary, $of: self, $in: { schemaId: todo-list } }
        category: { $copy: category, $of: self, $in: { schemaId: todo-list } }
        created_on: { $copy: created_on, $of: self, $in: { schemaId: todo-detail } }
        due_on: { $copy: due_on, $of: self, $in: { schemaId: todo-detail } }
        details: { $copy: details, $of: self, $in: { schemaId: todo-detail } }
        result: { $copy: result, $of: self, $in: { schemaId: todo-detail } }
        comments: { $copy: comments, $of: self, $in: { schemaId: todo-detail } }
    target: { entity: todo }
    params:
      - key: title
        label: タイトル
        type: common#一行の文
        minLength: 1
      - key: summary
        label: 概要
        type: common#一行の文
        minLength: 1
      - key: category
        label: カテゴリ
        type: common#カテゴリ参照
      - key: created_on
        label: 作成日
        type: common#年月日
      - key: due_on
        label: 期限
        type: common#年月日
      - key: details
        label: 詳細
        type: common#文章
      - key: result
        label: 結果・中止理由
        type: common#文章
      - key: comments
        label: コメント一覧
        type: array
        item: { type: common#コメント }
        description: 入力した一覧で全体を置き換えます。既存コメントへの追記は「コメントを追加する」を使います。
      - key: clear
        label: 値を消す
        type: object
        default: {}
        description: チェックした項目を消去します。同じ項目に入力した値より消去が優先します。
        fields:
          - { key: category, label: "カテゴリを消す", type: boolean }
          - { key: due_on, label: "期限を消す", type: boolean }
          - { key: details, label: "詳細を消す", type: boolean }
          - { key: result, label: "結果・中止理由を消す", type: boolean }
          - { key: comments, label: "コメント一覧を消す", type: boolean }
    require:
      - match: [{ node: { entity: todo, schema: todo-list } }]
        expect: exists
        message: "{id} はTODO一覧の定義が必要です"
    do:
      - when:
          - { path: title, exists: true }
        set:
          in: { schemaId: todo-list }
          path: title
          value: $title
          of: self
      - when:
          - { path: summary, exists: true }
        set:
          in: { schemaId: todo-list }
          path: summary
          value: $summary
          of: self
      - when:
          - { path: category, exists: true }
        set:
          in: { schemaId: todo-list }
          path: category
          value: $category
          of: self
      - when:
          - { path: created_on, exists: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        set:
          in: { schemaId: todo-detail }
          path: created_on
          value: $created_on
          of: self
      - when:
          - { path: due_on, exists: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        set:
          in: { schemaId: todo-detail }
          path: due_on
          value: $due_on
          of: self
      - when:
          - { path: details, exists: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        set:
          in: { schemaId: todo-detail }
          path: details
          value: $details
          of: self
      - when:
          - { path: result, exists: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        set:
          in: { schemaId: todo-detail }
          path: result
          value: $result
          of: self
      - when:
          - { path: comments, exists: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        set:
          in: { schemaId: todo-detail }
          path: comments
          value: $comments
          of: self
      - when:
          - { path: clear.category, equals: true }
        delete:
          in: { schemaId: todo-list }
          path: category
          of: self
      - when:
          - { path: clear.due_on, equals: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        delete:
          in: { schemaId: todo-detail }
          path: due_on
          of: self
      - when:
          - { path: clear.details, equals: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        delete:
          in: { schemaId: todo-detail }
          path: details
          of: self
      - when:
          - { path: clear.result, equals: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        delete:
          in: { schemaId: todo-detail }
          path: result
          of: self
      - when:
          - { path: clear.comments, equals: true }
          - { of: self, in: { schemaId: todo-detail }, path: id, exists: true }
        set:
          in: { schemaId: todo-detail }
          path: comments
          value: []
          of: self
      # 一覧だけのTODOも操作で詳細化できる。新しい個票への値はcreateのparamsへまとめて渡す。
      # 状態は既定の未着手（OPEN）で、状態の履歴の最初の行に「個票の作成」を残す
      - when: { of: self, in: { schemaId: todo-detail }, path: id, exists: false }
        create:
          schema: todo-detail
          params:
            id: { $copy: id, $of: self, $in: { schemaId: todo-list } }
            created_on: { $copy: created_on }
            due_on:
              $when:
                or:
                  - { path: clear.due_on, exists: false }
                  - { path: clear.due_on, equals: false }
              $copy: due_on
            details:
              $when:
                or:
                  - { path: clear.details, exists: false }
                  - { path: clear.details, equals: false }
              $copy: details
            result:
              $when:
                or:
                  - { path: clear.result, exists: false }
                  - { path: clear.result, equals: false }
              $copy: result
            comments:
              $when:
                or:
                  - { path: clear.comments, exists: false }
                  - { path: clear.comments, equals: false }
              $copy: comments
            history:
              - { date: '', action: edit-todo, to: OPEN }
  # ---- 状態を変える操作 ----
  # どの状態からできるか・どの状態へ移るか・状態の履歴の行は、状態の流れ（todo-behavior.yaml の transitions）から決まる。
  # ここに書くのは、状態のほかに書く値（完了日・結果）と、履歴の行に足す値（理由・日付・再開予定日）だけ
  - id: start-todo
    label: TODOに着手する
    description: 未着手の作業を対応中にします。追加の入力はありません。
    target: { entity: todo }
    lifecycle: todo-lifecycle
  - id: suspend-todo
    label: TODOを中断する
    description: 対応中の作業を一時止めます。理由と再開予定日を状態の履歴に残します。完了や中止と違い、再開できます。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: todo }
    params:
      - { key: date, label: 中断日, type: common#年月日, required: true }
      - { key: reason, label: 中断理由, type: 操作の記録, required: true }
      - key: resume_on
        label: 再開予定日
        type: common#年月日
        description: 決まっていれば入れます。中断日以降の日付です。
    lifecycle:
      id: todo-lifecycle
      history: { date: $date, note: $reason, resume_on: { $copy: resume_on } }
  - id: resume-todo
    label: TODOを再開する
    description: 中断した作業を対応中に戻します。
    input:
      initial:
        date: { $copy: today, $of: context }
    target: { entity: todo }
    params:
      - { key: date, label: 再開日, type: common#年月日, required: true }
      - { key: note, label: メモ, type: common#文章 }
    lifecycle:
      id: todo-lifecycle
      history: { date: $date, note: { $copy: note } }
  - id: complete-todo
    label: TODOを完了する
    input:
      initial:
        date: { $copy: today, $of: context }
    description: 対応中の作業を完了にし、完了日と成果を記録します。完了したTODOは戻せません（追加の作業は、元のTODOを選んで新しく登録します）。
    target: { entity: todo }
    params:
      - { key: date, label: 完了日, type: common#年月日, required: true }
      - { key: result, label: 完了結果, type: 操作の記録, required: true }
    lifecycle:
      id: todo-lifecycle
      history: { date: $date }
    do:
      - set: { in: { schemaId: todo-detail }, path: completed_on, value: $date, of: self }
      - set: { in: { schemaId: todo-detail }, path: result, value: $result, of: self }
  - id: cancel-todo
    label: TODOを中止する
    description: 未着手・対応中・中断の作業を中止し、理由を結果欄と状態の履歴に残します。
    target: { entity: todo }
    params:
      - { key: reason, label: 中止理由, type: 操作の記録, required: true }
    lifecycle:
      id: todo-lifecycle
      history: { note: $reason }
    do:
      - set: { in: { schemaId: todo-detail }, path: result, value: $reason, of: self }
