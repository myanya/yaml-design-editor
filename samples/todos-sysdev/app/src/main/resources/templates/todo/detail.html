<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/business :: head}"></head>
<body><header th:replace="~{fragments/business :: header}"></header>
<main id="main" th:fragment="main" class="page w-l">
<h1>TODO詳細</h1>
<div th:replace="~{fragments/business :: notice(${page.node('page.body[0].notice')})}"></div>
<div th:replace="~{fragments/business :: facts(${page.node('page.body[1].facts')})}"></div>
<section class="panel section" th:with="node=${page.node('page.body[2].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
<div th:replace="~{fragments/business :: dataTable(${page.node('page.body[2].section.body[0].table')})}"></div>
</section>
<section class="panel section" th:with="node=${page.node('page.body[3].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
<div th:replace="~{fragments/business :: dataTable(${page.node('page.body[3].section.body[0].table')})}"></div>
</section>
<section class="panel section" th:with="node=${page.node('page.body[4].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
<div th:replace="~{fragments/business :: dataTable(${page.node('page.body[4].section.body[0].table')})}"></div>
</section>
<div th:replace="~{fragments/business :: actions(${page.node('page.body[5].actions')})}"></div>
<nav><a th:href="${page.homeUrl()}">一覧へ戻る</a></nav>
</main></body></html>
