<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/business :: head}"></head>
<body><header th:replace="~{fragments/business :: header}"></header>
<main id="main" th:fragment="main" class="page w-m">
<h1>タグを追加する（確認）</h1>
<div th:replace="~{fragments/business :: notice(${page.node('page.body[0].notice')})}"></div>
<div th:replace="~{fragments/business :: facts(${page.node('page.body[1].facts')})}"></div>
<form class="form" method="post" th:action="${page.url(page.node('page.body[2].form').action)}" th:with="node=${page.node('page.body[2].form')}"><th:block th:replace="~{fragments/business :: hidden(${node})}"></th:block>
<div th:replace="~{fragments/business :: actions(${page.node('page.body[2].form.body[0].actions')})}"></div>
</form>
<nav><a th:href="${page.homeUrl()}">一覧へ戻る</a></nav>
</main></body></html>
