<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><body>
<head th:fragment="head"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${page.title()}"></title><link rel="stylesheet" th:href="@{/css/theme.css}"><script defer th:src="@{/js/htmx.min.js}"></script></head>
<header th:fragment="header" class="shell-header"><a class="skip-link" href="#main">本文へ</a><a class="brand" th:href="${page.homeUrl()}" th:text="${page.brand()}"></a><span class="eyebrow">MISSION CONTROL</span></header>
<th:block th:fragment="cells(values)"><th:block th:each="cell,loop : ${values}"><a th:if="${!cell['url'].isEmpty()}" th:href="${cell['url']}" th:text="${cell['text']}"></a><span th:if="${cell['url'].isEmpty()}" th:text="${cell['text']}"></span><br th:if="${!loop.last}"></th:block></th:block>
<div th:fragment="notice(node)">
  <p class="notice-done" role="status" th:if="${!page.notice.isEmpty()}" th:text="${page.notice}"></p>
  <div class="notice-errors" role="alert" th:if="${!page.errors.isEmpty() or (page.binding != null and page.binding.hasErrors())}"><p>内容を確認してください。</p><ul><li th:each="message : ${page.errors}" th:text="${message}"></li><li th:if="${page.binding != null}" th:each="error : ${page.validationMessages()}" th:text="${error}"></li></ul></div>
</div>
<section th:fragment="facts(node)" class="section"><h2 th:if="${node['title'] != null}" th:text="${node['title']}"></h2><dl class="facts" th:classappend="${node['columns'] == '2' ? 'cols-2' : ''}"><th:block th:each="fact : ${page.facts(node)}"><dt th:text="${fact['label'] != null ? fact['label'] : fact['item']}"></dt><dd><th:block th:if="${fact['before'] != null}"><span class="muted" th:insert="~{fragments/business :: cells(${fact['before']})}"></span><span aria-label="変更後"> → </span></th:block><th:block th:replace="~{fragments/business :: cells(${fact['cells']})}"></th:block></dd></th:block></dl><p class="muted" th:if="${node['kind'] == 'changes' and page.facts(node).isEmpty()}">変更はありません。</p></section>
<div th:fragment="actions(node)" class="actions"><th:block th:replace="~{fragments/business :: buttons(${node},${page.self()})}"></th:block></div>
<th:block th:fragment="buttons(node,row)"><th:block th:each="button : ${page.actions(node,row)}"><button th:if="${button['kind'] == 'submit'}" type="submit" th:class="${'button-' + button['emphasis']}" th:formaction="${button['action'] != null ? page.actionUrl(button,row) : null}" th:text="${button['label']}"></button><a th:if="${button['kind'] != 'submit'}" th:class="${'button-' + button['emphasis']}" th:href="${page.actionUrl(button,row)}" th:text="${button['label']}"></a></th:block></th:block>
<th:block th:fragment="hidden(node)"><input th:each="hidden : ${page.hidden(node)}" type="hidden" th:name="${hidden['name']}" th:value="${hidden['value']}"></th:block>
<label th:fragment="clear(node)" th:if="${page.clearFlag(node) != ''}" class="choices"><input class="control-checkbox" type="checkbox" th:name="${page.fieldName(page.clearFlag(node))}" value="true" th:checked="${page.checked(page.clearFlag(node),'true')}">値を消す</label>
<div th:fragment="field(node)" class="field" th:with="item=${node['item']}, name=${page.fieldName(item)}, control=${node['control']}">
 <label th:for="${name}"><span th:text="${node['label'] != null ? node['label'] : item}"></span><span class="required" th:if="${node['required'] == 'true'}">必須</span></label>
 <textarea th:if="${control == 'textarea'}" class="control-textarea" th:id="${name}" th:name="${name}" th:rows="${node['rows'] ?: '4'}" th:required="${node['required'] == 'true'}" th:text="${page.value(item)}" th:attr="aria-invalid=${!page.fieldError(item).isEmpty()},aria-describedby=${name+'-error'}"></textarea>
 <select th:if="${control == 'select'}" class="control-select" th:id="${name}" th:name="${name}" th:required="${node['required'] == 'true'}"><option value="">未選択</option><option th:each="choice : ${page.candidates(node)}" th:value="${choice['id']}" th:text="${choice[node['candidates']['name']]}" th:selected="${page.checked(item,choice['id'])}"></option></select>
 <input th:if="${control != 'textarea' and control != 'select' and control != 'checkbox'}" th:type="${control}" th:class="${'control-'+control}" th:id="${name}" th:name="${name}" th:value="${page.value(item)}" th:required="${node['required'] == 'true'}" th:attr="aria-invalid=${!page.fieldError(item).isEmpty()},aria-describedby=${name+'-error'}">
 <input th:if="${control == 'checkbox'}" class="control-checkbox" type="checkbox" th:id="${name}" th:name="${name}" value="true" th:checked="${page.checked(item,'true')}">
 <th:block th:replace="~{fragments/business :: clear(${node})}"></th:block>
 <span class="field-error" th:id="${name+'-error'}" th:text="${page.fieldError(item)}"></span>
</div>
<fieldset th:fragment="choices(node)" class="field choices"><legend th:text="${node['label']}"></legend><label th:each="choice : ${page.candidates(node)}"><input class="control-checkbox" type="checkbox" th:name="${page.fieldName(node['item'])}" th:value="${choice['id']}" th:checked="${page.checked(node['item'],choice['id'])}"><span th:text="${choice[node['candidates']['name']]}"></span></label><p class="muted" th:if="${page.candidates(node).isEmpty()}">選択できる項目はありません。</p><th:block th:replace="~{fragments/business :: clear(${node})}"></th:block><span class="field-error" th:text="${page.fieldError(node['item'])}"></span></fieldset>
<section th:fragment="rows(node)" class="section"><h2 th:text="${node['label']}"></h2><th:block th:each="index : ${page.rowNumbers(node)}"><fieldset class="section"><legend th:text="${'行 '+(index+1)}"></legend><th:block th:each="column : ${node['columns']}"><div th:replace="~{fragments/business :: field(${page.rowField(column,node['item'],index)})}"></div></th:block><button class="button-secondary" type="submit" name="_rows" th:value="${node['item']+':'+index}" th:formaction="${page.redrawUrl()}" th:attr="hx-post=${page.redrawUrl()}" hx-include="closest form" hx-target="#main" hx-swap="outerHTML" hx-disabled-elt="this" formnovalidate>この行を消す</button></fieldset></th:block><div class="actions"><button class="button-secondary" type="submit" name="_rows" th:value="${node['item']+':add'}" th:formaction="${page.redrawUrl()}" th:attr="hx-post=${page.redrawUrl()}" hx-include="closest form" hx-target="#main" hx-swap="outerHTML" hx-disabled-elt="this" formnovalidate>行を足す</button><th:block th:replace="~{fragments/business :: clear(${node})}"></th:block></div></section>
<div th:fragment="dataTable(node)" class="table-scroll"><p class="muted" th:if="${page.rows(node).isEmpty()}" th:text="${node['empty'] != null ? page.message(node['empty']) : 'まだありません。'}"></p><table th:if="${!page.rows(node).isEmpty()}" class="table"><thead><tr><th scope="col" th:each="column : ${node['columns']}" th:text="${column['label'] != null ? column['label'] : column['item']}"></th><th scope="col" th:if="${node['rowActions'] != null and !node['rowActions'].isEmpty()}">操作</th></tr></thead><tbody><tr th:each="row : ${page.rows(node)}"><td th:each="column,loop : ${node['columns']}"><th:block th:replace="~{fragments/business :: cells(${page.tableCells(node,row,column,loop.index)})}"></th:block></td><td th:if="${node['rowActions'] != null and !node['rowActions'].isEmpty()}"><div class="actions" th:insert="~{fragments/business :: buttons(${node['rowActions']},${row})}"></div></td></tr></tbody></table></div>
<div th:fragment="matrix(node)" class="table-scroll"><p class="muted" th:if="${page.rows(node).isEmpty()}" th:text="${page.message(node['empty'])}"></p><table class="table" th:if="${!page.rows(node).isEmpty()}"><thead><tr><th scope="col">区分</th><th scope="col" th:each="label : ${node['columns']}" th:text="${label}"></th><th scope="col">合計</th></tr></thead><tbody><tr th:each="row : ${page.rows(node)}"><th scope="row"><a th:href="${page.entityUrl(node['rows']['entity'],row['id'])}" th:text="${row['name']}"></a></th><td class="align-end" th:each="column : ${page.matrixColumns(node)}"><a th:href="${page.matrixUrl(node,row,column)}" th:text="${page.number(row[column['name']])}"></a></td><td class="align-end" th:text="${page.total(node,row)}"></td></tr></tbody><tfoot><tr><th scope="row">合計</th><td class="align-end" th:each="column : ${page.matrixColumns(node)}" th:text="${page.columnTotal(node,column['name'])}"></td><td class="align-end" th:text="${page.grandTotal(node)}"></td></tr></tfoot></table></div>
</body></html>
