    crud:
      - 項目: id
        名称: ID
        register-todo: C
        add-todo-comment: ''
        add-todo-task: ''
        edit-todo: ''
        start-todo: ''
        suspend-todo: ''
        resume-todo: ''
        complete-todo: ''
        cancel-todo: ''
