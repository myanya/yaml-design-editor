      - seq: '07'
        id: OPS-todo.resume-todo
        action: resume-todo
        label: TODOを再開する
        crud: U
        writes:
          - id: CRUD-todo.resume-todo.status
            entity: ENT-todo
            operation: OPS-todo.resume-todo
            item: FLD-todo.status
            crud: U
          - id: CRUD-todo.resume-todo.history
            entity: ENT-todo
            operation: OPS-todo.resume-todo
            item: FLD-todo.history
            crud: U
          - id: CRUD-todo.resume-todo.updated_on
            entity: ENT-todo
            operation: OPS-todo.resume-todo
            item: FLD-todo.updated_on
            crud: U
      - seq: '08'
        id: OPS-todo.complete-todo
        action: complete-todo
        label: TODOを完了する
        crud: U
        writes:
          - id: CRUD-todo.complete-todo.completed_on
            entity: ENT-todo
            operation: OPS-todo.complete-todo
            item: FLD-todo.completed_on
            crud: U
          - id: CRUD-todo.complete-todo.result
            entity: ENT-todo
            operation: OPS-todo.complete-todo
            item: FLD-todo.result
            crud: U
          - id: CRUD-todo.complete-todo.status
            entity: ENT-todo
            operation: OPS-todo.complete-todo
            item: FLD-todo.status
            crud: U
          - id: CRUD-todo.complete-todo.history
            entity: ENT-todo
