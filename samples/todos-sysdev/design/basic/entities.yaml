  - id: ENT-todo-task
    label: 作業項目
    description: TODO を小分けにした作業です。TODO の中にだけあり、済んでいない作業項目があるうちは TODO を完了できません。
    source: todo-task
    parent: ENT-todo
    parentField: FLD-todo.tasks
    numbering:
      item: FLD-todo-task.id
      path: id
      prefix:
        $format: '{id}-S'
        $of: owner
      digits: 2
      description: 親の ID に「-S」と 2 桁の番号を続ける（使われている番号の次）
    documents:
      - todo-detail
    items:
      - seq: '01'
        id: FLD-todo-task.id
        key: id
        label: ID
        type: common#作業項目番号
        base: id
        required: true
        pattern: ^TODO-[0-9]{3,}-S[0-9]{2,}$
        description: 追加すると自動で振ります（例 TODO-002-S01）。
        source: todo-task.id
        documents:
          - todo-detail
      - seq: '02'
        id: FLD-todo-task.title
        key: title
        label: 作業
        type: common#一行の文
        base: string
        required: true
        maxLength: 100
        pattern: ^[^\r\n]*$
        source: todo-task.title
        documents:
          - todo-detail
      - seq: '03'
        id: FLD-todo-task.done
        key: done
        label: 済
        type: boolean
        base: boolean
        required: true
        default: false
        source: todo-task.done
        documents:
          - todo-detail
    operations:
      - seq: '01'
        id: OPS-todo-task.add-todo-task
        action: add-todo-task
        label: 作業項目を追加する
        crud: C
        writes:
          - id: CRUD-todo-task.add-todo-task.id
            entity: ENT-todo-task
            operation: OPS-todo-task.add-todo-task
            item: FLD-todo-task.id
            crud: C
          - id: CRUD-todo-task.add-todo-task.title
            entity: ENT-todo-task
            operation: OPS-todo-task.add-todo-task
            item: FLD-todo-task.title
            crud: C
          - id: CRUD-todo-task.add-todo-task.done
            entity: ENT-todo-task
            operation: OPS-todo-task.add-todo-task
            item: FLD-todo-task.done
            crud: C
      - seq: '02'
        id: OPS-todo-task.todo-task.finish
        action: todo-task.finish
        label: 作業項目を済にする
        crud: U
        writes:
          - id: CRUD-todo-task.todo-task.finish.done
            entity: ENT-todo-task
            operation: OPS-todo-task.todo-task.finish
            item: FLD-todo-task.done
            crud: U
    crud:
      - 項目: id
        名称: ID
        add-todo-task: C
        todo-task.finish: ''
      - 項目: title
        名称: 作業
        add-todo-task: C
        todo-task.finish: ''
      - 項目: done
        名称: 済
        add-todo-task: C
        todo-task.finish: U
