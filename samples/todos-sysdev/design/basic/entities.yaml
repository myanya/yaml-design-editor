        todo-task.finish: ''
      - 項目: summary
        名称: 概要
        register-todo: C
        add-todo-comment: ''
        add-todo-task: ''
        edit-todo: U
        start-todo: ''
        suspend-todo: ''
        resume-todo: ''
        complete-todo: ''
        cancel-todo: ''
        todo-task.finish: ''
      - 項目: category
        名称: カテゴリ
        register-todo: C
        add-todo-comment: ''
        add-todo-task: ''
        edit-todo: U
        start-todo: ''
        suspend-todo: ''
        resume-todo: ''
        complete-todo: ''
        cancel-todo: ''
        todo-task.finish: ''
      - 項目: tags
        名称: タグ
        register-todo: C
        add-todo-comment: ''
        add-todo-task: ''
        edit-todo: U
        start-todo: ''
        suspend-todo: ''
        resume-todo: ''
        complete-todo: ''
        cancel-todo: ''
        todo-task.finish: ''
      - 項目: follows
        名称: 元のTODO
        register-todo: C
        add-todo-comment: ''
        add-todo-task: ''
        edit-todo: ''
        start-todo: ''
        suspend-todo: ''
