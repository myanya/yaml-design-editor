          - id: CRUD-todo.edit-todo.due_on
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.due_on
            crud: U
          - id: CRUD-todo.edit-todo.details
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.details
            crud: U
          - id: CRUD-todo.edit-todo.result
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.result
            crud: U
          - id: CRUD-todo.edit-todo.comments
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.comments
            crud: U
          - id: CRUD-todo.edit-todo.updated_on
