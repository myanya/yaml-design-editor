      - seq: '04'
        id: OPS-todo.edit-todo
        action: edit-todo
        label: TODOを編集する
        crud: U
        writes:
          - id: CRUD-todo.edit-todo.title
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.title
            crud: U
          - id: CRUD-todo.edit-todo.summary
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.summary
            crud: U
          - id: CRUD-todo.edit-todo.category
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.category
            crud: U
          - id: CRUD-todo.edit-todo.tags
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.tags
            crud: U
          - id: CRUD-todo.edit-todo.created_on
            entity: ENT-todo
            operation: OPS-todo.edit-todo
            item: FLD-todo.created_on
