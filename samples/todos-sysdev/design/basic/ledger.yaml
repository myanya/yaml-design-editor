# 基本設計項目台帳（人が書く）: 業務モデルから導けない基本設計の項目を、人が決めて書く。
# エンティティが増えたら、どれかの区分の entities に足す（足していなければ、検査がエンティティの場所で指摘する）
entityClasses:
  - seq: '01'
    id: CLS-master
    name: master
    label: マスタ
    description: 業務の中で参照される、変わりにくいデータ。利用者が登録・変更するが、業務の出来事では増えない（TODO から参照される分類）
    entities: [ENT-category, ENT-tag]
  - seq: '02'
    id: CLS-transaction
    name: transaction
    label: トランザクション
    description: 業務の出来事（登録・着手・完了など）ごとに増え、状態が変わるデータ。中に入れ子で持つデータも同じ区分
    entities: [ENT-todo, ENT-todo-task]
