          - resume_on
          - date
  - id: resume-todo
    kind: action
    label: TODOを再開する
    description: 中断した作業を対応中に戻します。
    subject: todo
    target:
      entity: todo
    creates: []
    params:
      - key: date
        label: 再開日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        required: true
        format: yyyy年M月d日
      - key: note
        label: メモ
        type: common#文章
        base: string
        multiline: true
      - key: version
        label: 版
        type: int
        base: int
        description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
        required: true
        builtinType:
          name: int
          base: int
          builtin: true
        carried: true
    inputParams:
      - key: date
        label: 再開日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        required: true
        format: yyyy年M月d日
      - key: note
        label: メモ
        type: common#文章
        base: string
        multiline: true
    carriedValues:
      version:
        $copy: version
        $of: self
    carried:
      - version
    input:
      initial:
        date:
          $copy: today
          $of: context
    require:
      - id: version-unchanged
        message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        rule:
          match:
            - node:
                entity: todo
                bind: t
          where:
            - of: t
              path: version
              equals: $version
          expect: exists
    lifecycle:
      id: todo-lifecycle
      transitions:
        - from:
            - id: todo-SUSPENDED
              label: 中断
              value: SUSPENDED
          to:
            id: todo-IN_PROGRESS
            label: 対応中
            value: IN_PROGRESS
      refusal: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
      history:
        date: $date
        note:
          $copy: note
    effects:
      - op: set
        source: lifecycle
        entity: todo
        schema: todo-detail
        path: status
        field:
          key: status
          base: enum
        value: IN_PROGRESS
      - op: insert
        source: lifecycle
        entity: todo
        schema: todo-detail
        path: history
        field:
          key: history
          base: array
          item:
            base: object
        value:
          date: $date
          action: resume-todo
          from:
            $copy: status
            $of: self
          to: IN_PROGRESS
          note:
            $copy: note
        written:
          - key: date
            value: $date
            base: date
          - key: action
            value: resume-todo
            base: enum
          - key: from
            value:
              $copy: status
              $of: self
            base: enum
          - key: to
            value: IN_PROGRESS
            base: enum
          - key: note
            value:
              $copy: note
            base: string
      - op: set
        source: auto
        auto: updated
        entity: todo
        schema: todo-detail
        path: updated_on
        field:
          key: updated_on
          base: date
        value:
          $copy: today
          $of: context
      - op: set
        source: auto
        auto: revision
        entity: todo
        path: version
        field:
          key: version
          base: int
        value:
          $copy: version
          $of: next
    checks:
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
      - constraint: unfinished-has-no-completed-on
        form: element
        level: error
        items:
          - todo.status
  - id: complete-todo
    kind: action
    label: TODOを完了する
    description: 対応中の作業を完了にし、完了日と成果を記録します。済んでいない作業項目があるうちは完了できません。完了したTODOは戻せません（追加の作業は、元のTODOを選んで新しく登録します）。
    subject: todo
    target:
      entity: todo
    creates: []
    params:
      - key: date
        label: 完了日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        required: true
        format: yyyy年M月d日
      - key: result
        label: 完了結果
        type: todo-operations#操作の記録
        base: string
        description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        required: true
        minLength: 1
        multiline: true
      - key: version
        label: 版
        type: int
        base: int
        description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
