      - key: date
        label: 完了日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        required: true
        format: yyyy年M月d日
      - key: result
        label: 完了結果
        type: todo-operations#操作の記録
        base: string
        description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        required: true
        minLength: 1
        multiline: true
    carriedValues:
      version:
        $copy: version
        $of: self
    carried:
      - version
    input:
      initial:
        date:
          $copy: today
          $of: context
    require:
      - id: no-open-task
        message: '{id} には済んでいない作業項目があります（済にしてから完了します）'
        rule:
          match:
            - node:
                entity: todo
                bind: t
            - edge:
                contains: true
            - node:
                entity: todo-task
                bind: s
          where:
            - of: s
              path: done
              equals: false
          expect: absent
      - id: version-unchanged
        message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        rule:
          match:
            - node:
                entity: todo
                bind: t
          where:
            - of: t
              path: version
              equals: $version
          expect: exists
    lifecycle:
      id: todo-lifecycle
      transitions:
        - from:
            - id: todo-IN_PROGRESS
              label: 対応中
              value: IN_PROGRESS
          to:
            id: todo-CLOSED
            label: 完了
            value: CLOSED
      refusal: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
      history:
        date: $date
    effects:
      - op: set
        source: do
        of: self
        entity: todo
        schema: todo-detail
        path: completed_on
        field:
          key: completed_on
          base: date
        value: $date
      - op: set
        source: do
        of: self
        entity: todo
        schema: todo-detail
        path: result
        field:
          key: result
          base: string
        value: $result
      - op: set
        source: lifecycle
        entity: todo
        schema: todo-detail
        path: status
        field:
          key: status
          base: enum
        value: CLOSED
      - op: insert
        source: lifecycle
        entity: todo
        schema: todo-detail
        path: history
        field:
          key: history
          base: array
          item:
            base: object
        value:
          date: $date
          action: complete-todo
          from:
            $copy: status
            $of: self
          to: CLOSED
        written:
          - key: date
            value: $date
            base: date
          - key: action
            value: complete-todo
            base: enum
          - key: from
            value:
              $copy: status
              $of: self
            base: enum
          - key: to
            value: CLOSED
            base: enum
      - op: set
        source: auto
        auto: updated
        entity: todo
        schema: todo-detail
        path: updated_on
        field:
          key: updated_on
          base: date
        value:
          $copy: today
          $of: context
      - op: set
        source: auto
        auto: revision
        entity: todo
        path: version
        field:
          key: version
          base: int
        value:
          $copy: version
          $of: next
    checks:
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
      - constraint: completed-not-before-created
        form: element
        level: error
        items:
          - todo.completed_on
        params:
          - date
      - constraint: closed-has-completed-on
        form: element
        level: error
        items:
          - todo.status
          - todo.completed_on
        params:
          - date
      - constraint: closed-has-result
        form: element
        level: error
        items:
          - todo.status
          - todo.result
        params:
          - result
      - constraint: closed-has-no-open-task
        form: pattern
        level: error
        items:
          - todo.status
