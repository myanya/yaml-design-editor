# 生成物（basic-operations-resolved）: 手で直さず、業務モデルか生成の定義（design/basic/basic-operations-resolved.yaml）を直して作り直します（CLI generate）。
id: SYS-basic-operations-resolved
actions:
  - id: add-category
    kind: action
    label: カテゴリを追加する
    description: TODOを分類するカテゴリを作ります。IDは一覧の追加規則で自動採番します。
    subject: category
    creates:
      - category
    params:
      - key: name
        label: カテゴリ名
        type: common#一行の文
        base: string
        required: true
        minLength: 1
        maxLength: 100
        pattern: ^[^\r\n]*$
        overrides:
          minLength: 1
    inputParams:
      - key: name
        label: カテゴリ名
        type: common#一行の文
        base: string
        required: true
        minLength: 1
        maxLength: 100
        pattern: ^[^\r\n]*$
        overrides:
          minLength: 1
    input: {}
    require: []
    effects:
      - op: insert
        source: do
        entity: category
        schema: category-list
        path: categories
        field:
          key: categories
          base: array
          item:
            base: object
            entity: category
        params:
          name: $name
        numbering:
          path: id
          prefix: CAT-
          digits: 3
        written:
          - key: name
            value: $name
            base: string
    checks: []
  - id: register-todo
    kind: action
    label: TODOを登録する
    description: 一覧と未着手の個票を一度に作成します。TODO番号は、使われている番号の次を自動で振ります。状態（未着手）と状態の履歴の最初の行は、状態の流れ（todo-lifecycle）の入口から入ります。
    subject: todo
    creates:
      - todo
    params:
      - key: title
        label: タイトル
        type: common#一行の文
        base: string
        required: true
        maxLength: 100
        pattern: ^[^\r\n]*$
      - key: summary
        label: 概要
        type: common#一行の文
        base: string
        required: true
        maxLength: 100
        pattern: ^[^\r\n]*$
      - key: category
        label: カテゴリ
        type: common#カテゴリ参照
        base: ref
        description: カテゴリ一覧の ID を 1 件。未分類なら省略します。
        refTarget: entity
        idPatternLayers:
          -   - CAT-*
        scope:
          schemaIds:
            - category-list
          documentIds: []
        relation: in-category
        idPatterns:
          - CAT-*
        schemas:
          - category-list
        targets:
          - category
        target: category
        targetTitle: name
        targetLabel: カテゴリ
      - key: tags
        label: タグ
        type: array
        base: array
        unique: true
        item:
          type: common#タグ参照
          base: ref
          description: タグ一覧の ID を 1 件。
          refTarget: entity
          idPatternLayers:
            -   - TAG-*
          scope:
            schemaIds:
              - tag-list
            documentIds: []
          relation: tagged
          idPatterns:
            - TAG-*
          schemas:
            - tag-list
          targets:
            - tag
          target: tag
          targetTitle: name
          targetLabel: タグ
      - key: follows
        label: 元のTODO
        type: common#TODO参照
        base: ref
        description: 完了したTODOに追加の作業が要るときに、その元のTODOを選びます。
        refTarget: entity
        idPatternLayers:
          -   - TODO-*
        scope:
          schemaIds:
            - todo-list
          documentIds: []
        relation: follow-up-of
        idPatterns:
          - TODO-*
        schemas:
          - todo-list
        targets:
          - todo
        target: todo
        targetTitle: title
        targetLabel: TODO
      - key: due
        label: 期限
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        format: yyyy年M月d日
      - key: details
        label: 詳細
        type: common#文章
        base: string
        multiline: true
    inputParams:
      - key: title
        label: タイトル
        type: common#一行の文
        base: string
        required: true
        maxLength: 100
        pattern: ^[^\r\n]*$
      - key: summary
        label: 概要
        type: common#一行の文
        base: string
        required: true
        maxLength: 100
        pattern: ^[^\r\n]*$
      - key: category
        label: カテゴリ
        type: common#カテゴリ参照
        base: ref
        description: カテゴリ一覧の ID を 1 件。未分類なら省略します。
        refTarget: entity
        idPatternLayers:
          -   - CAT-*
        scope:
          schemaIds:
            - category-list
          documentIds: []
        relation: in-category
        idPatterns:
          - CAT-*
        schemas:
          - category-list
        targets:
          - category
        target: category
        targetTitle: name
        targetLabel: カテゴリ
      - key: tags
        label: タグ
        type: array
        base: array
        unique: true
        item:
          type: common#タグ参照
          base: ref
          description: タグ一覧の ID を 1 件。
          refTarget: entity
          idPatternLayers:
            -   - TAG-*
          scope:
            schemaIds:
              - tag-list
            documentIds: []
          relation: tagged
          idPatterns:
            - TAG-*
          schemas:
            - tag-list
          targets:
            - tag
          target: tag
          targetTitle: name
          targetLabel: タグ
      - key: follows
        label: 元のTODO
        type: common#TODO参照
        base: ref
        description: 完了したTODOに追加の作業が要るときに、その元のTODOを選びます。
        refTarget: entity
        idPatternLayers:
          -   - TODO-*
        scope:
          schemaIds:
            - todo-list
          documentIds: []
        relation: follow-up-of
        idPatterns:
          - TODO-*
        schemas:
          - todo-list
        targets:
          - todo
        target: todo
        targetTitle: title
        targetLabel: TODO
      - key: due
        label: 期限
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        format: yyyy年M月d日
      - key: details
        label: 詳細
        type: common#文章
        base: string
        multiline: true
    input: {}
    require: []
    lifecycle:
      id: todo-lifecycle
      entry:
        - id: todo-OPEN
          label: 未着手
          value: OPEN
    effects:
      - op: create
        source: do
        bind: todo
        entity: todo
        schema: todo-detail
        values:
          due_on:
            $copy: due
          details:
            $copy: details
          comments: []
        id:
          prefix: TODO-
          digits: 3
        numbering:
          path: id
          prefix: TODO-
          digits: 3
        written:
          - key: due_on
            value:
              $copy: due
            base: date
          - key: details
            value:
              $copy: details
            base: string
          - key: comments
            value: []
            base: array
            item:
              base: object
      - op: insert
        source: do
        entity: todo
        schema: todo-list
        path: todos
        field:
          key: todos
          base: array
          item:
            base: object
            entity: todo
        value:
          id:
            $copy: id
            $of: todo
          title: $title
          summary: $summary
          category:
            $copy: category
          tags:
            $copy: tags
          follows:
            $copy: follows
        written:
          - key: id
            value:
              $copy: id
              $of: todo
            base: id
          - key: title
            value: $title
            base: string
          - key: summary
            value: $summary
            base: string
          - key: category
            value:
              $copy: category
            base: ref
          - key: tags
            value:
              $copy: tags
            base: array
            item:
              base: ref
          - key: follows
            value:
              $copy: follows
            base: ref
      - op: set
        source: lifecycle
        'on': create
        entity: todo
        schema: todo-detail
        path: status
        field:
          key: status
          base: enum
        value: OPEN
      - op: insert
        source: lifecycle
        'on': create
        entity: todo
        schema: todo-detail
        path: history
        field:
          key: history
          base: array
          item:
            base: object
        value:
          date:
            $copy: today
            $of: context
          action: register-todo
          to: OPEN
        written:
          - key: date
            value:
              $copy: today
              $of: context
            base: date
          - key: action
            value: register-todo
            base: enum
          - key: to
            value: OPEN
            base: enum
      - op: set
        source: auto
        auto: created
        entity: todo
        schema: todo-detail
        path: created_on
        field:
          key: created_on
          base: date
        value:
          $copy: today
          $of: context
      - op: set
        source: auto
        auto: updated
        entity: todo
        schema: todo-detail
        path: updated_on
        field:
          key: updated_on
          base: date
        value:
          $copy: today
          $of: context
    checks:
      - constraint: due-not-before-created
        form: element
        level: error
        items:
          - todo.due_on
          - todo.created_on
        params:
          - due
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
          - todo.created_on
      - constraint: follows-not-self
        form: element
        level: error
        items:
          - todo.follows
          - todo.id
        params:
          - follows
      - constraint: has-detail
        form: occurrence
        level: error
        items:
          - todo.id
      - constraint: in-category.outMax
        form: relation
        kind: outMax
        level: warning
        items:
          - todo.category
        multiple: false
        params:
          - category
      - constraint: in-category.types
        form: relation
        kind: types
        level: warning
        items:
          - todo.category
        multiple: false
        params:
          - category
      - constraint: tagged.types
        form: relation
        kind: types
        level: warning
        items:
          - todo.tags
        multiple: true
        params:
          - tags
      - constraint: follow-up-of.acyclic
        form: relation
        kind: acyclic
        level: error
        items:
          - todo.follows
        multiple: false
        params:
          - follows
      - constraint: follow-up-of.outMax
        form: relation
        kind: outMax
        level: warning
        items:
          - todo.follows
        multiple: false
        params:
          - follows
      - constraint: follow-up-of.types
        form: relation
        kind: types
        level: warning
        items:
          - todo.follows
        multiple: false
        params:
          - follows
  - id: add-todo-comment
    kind: action
    label: TODOにコメントを追加する
    description: TODOの個票へ、状態に関係なく日付と本文を記録します。
    subject: todo
    target:
      entity: todo
    creates: []
    params:
      - key: date
        label: 記録日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        required: true
        format: yyyy年M月d日
      - key: body
        label: コメント本文
        type: todo-operations#操作の記録
        base: string
        description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        required: true
        minLength: 1
        multiline: true
      - key: version
        label: 版
        type: int
        base: int
        description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
        required: true
        builtinType:
          name: int
          base: int
          builtin: true
        carried: true
    inputParams:
      - key: date
        label: 記録日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        required: true
        format: yyyy年M月d日
      - key: body
        label: コメント本文
        type: todo-operations#操作の記録
        base: string
        description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        required: true
        minLength: 1
        multiline: true
    carriedValues:
      version:
        $copy: version
        $of: self
    carried:
      - version
    input:
      initial:
        date:
          $copy: today
          $of: context
    require:
      - id: version-unchanged
        message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        rule:
          match:
            - node:
                entity: todo
                bind: t
          where:
            - of: t
              path: version
              equals: $version
          expect: exists
    effects:
      - op: insert
        source: do
        of: self
        entity: todo
        schema: todo-detail
        path: comments
        field:
          key: comments
          base: array
          item:
            base: object
        value:
          date: $date
          body: $body
        written:
          - key: date
            value: $date
            base: date
          - key: body
            value: $body
            base: string
      - op: set
        source: auto
        auto: updated
        entity: todo
        schema: todo-detail
        path: updated_on
        field:
          key: updated_on
          base: date
        value:
          $copy: today
          $of: context
      - op: set
        source: auto
        auto: revision
        entity: todo
        path: version
        field:
          key: version
          base: int
        value:
          $copy: version
          $of: next
    checks:
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
  - id: edit-todo-comment
    kind: action
    label: コメントを編集する
    description: TODOの個票のコメント 1 件の、記録日と本文を直します。変更した項目だけを更新します。
    subject: todo
    target:
      entity: todo
    creates: []
    params:
      - key: row
        label: コメントの番号
        type: int
        base: int
        description: コメント一覧の何番目か（0 から数えます）
        required: true
        min: 0.0
        overrides:
          min: 0.0
        builtinType:
          name: int
          base: int
          builtin: true
      - key: date
        label: 記録日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        format: yyyy年M月d日
      - key: body
        label: コメント本文
        type: todo-operations#操作の記録
        base: string
        description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        minLength: 1
        multiline: true
      - key: version
        label: 版
        type: int
        base: int
        description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
        required: true
        builtinType:
          name: int
          base: int
          builtin: true
        carried: true
    inputParams:
      - key: date
        label: 記録日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        format: yyyy年M月d日
      - key: body
        label: コメント本文
        type: todo-operations#操作の記録
        base: string
        description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        minLength: 1
        multiline: true
    carriedValues:
      version:
        $copy: version
        $of: self
    carried:
      - version
    rowOf:
      field: comments
      param: row
      item:
        key: row
        label: コメントの番号
        type: int
        base: int
        description: コメント一覧の何番目か（0 から数えます）
        required: true
        min: 0.0
        overrides:
          min: 0.0
        builtinType:
          name: int
          base: int
          builtin: true
      entity: todo
      label: コメント一覧
      fields:
        - key: date
          label: 日付
          base: date
          required: true
          format: yyyy年M月d日
        - key: body
          label: コメント本文
          base: string
          required: true
          multiline: true
    input:
      submit: changed
      initial:
        date:
          $copy: comments[$row].date
          $of: self
          $in:
            schemaId: todo-detail
        body:
          $copy: comments[$row].body
          $of: self
          $in:
            schemaId: todo-detail
    require:
      - id: version-unchanged
        message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        rule:
          match:
            - node:
                entity: todo
                bind: t
          where:
            - of: t
              path: version
              equals: $version
          expect: exists
    effects:
      - op: set
        source: do
        of: self
        entity: todo
        schema: todo-detail
        path: comments[$row].date
        field:
          key: comments
          base: array
          item:
            base: object
        row:
          param: row
        when:
          - path: date
            exists: true
        value: $date
        written:
          - key: date
            value: $date
            base: date
      - op: set
        source: do
        of: self
        entity: todo
        schema: todo-detail
        path: comments[$row].body
        field:
          key: comments
          base: array
          item:
            base: object
        row:
          param: row
        when:
          - path: body
            exists: true
        value: $body
        written:
          - key: body
            value: $body
            base: string
      - op: set
        source: auto
        auto: updated
        entity: todo
        schema: todo-detail
        path: updated_on
        field:
          key: updated_on
          base: date
        value:
          $copy: today
          $of: context
      - op: set
        source: auto
        auto: revision
        entity: todo
        path: version
        field:
          key: version
          base: int
        value:
          $copy: version
          $of: next
    checks:
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
