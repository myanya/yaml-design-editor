  - id: add-todo-task
    kind: action
    label: 作業項目を追加する
    description: 未完了のTODOに、作業項目を足します。番号はTODOの番号に続けて自動で振ります（TODO-004-S04 など）。済にするのは、個票の作業項目の行の「⋯」の「作業項目を済にする」です。
    subject: todo
    target:
      entity: todo
    creates:
      - todo-task
    params:
      - key: title
        label: 作業
        type: common#一行の文
        base: string
        required: true
        minLength: 1
        maxLength: 100
        pattern: ^[^\r\n]*$
        overrides:
          minLength: 1
      - key: version
        label: 版
        type: int
        base: int
        description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
        required: true
        builtinType:
          name: int
          base: int
          builtin: true
        carried: true
    inputParams:
      - key: title
        label: 作業
        type: common#一行の文
        base: string
        required: true
        minLength: 1
        maxLength: 100
        pattern: ^[^\r\n]*$
        overrides:
          minLength: 1
    carriedValues:
      version:
        $copy: version
        $of: self
    carried:
      - version
    input: {}
    require:
      - id: active
        message: '{id} は完了か中止をしているので、作業項目を足せません'
        rule:
          match:
            - node:
                entity: todo
                bind: t
          where:
            - of: t
              path: status
              oneOf:
                - OPEN
                - IN_PROGRESS
                - SUSPENDED
          expect: exists
      - id: version-unchanged
