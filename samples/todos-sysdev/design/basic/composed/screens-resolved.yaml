      kind: operation
      target: todo
      starts:
        - screen: todo-dashboard
          place: 区画「期限超過」の行のボタン
        - screen: todo-dashboard
          place: 区画「すべてのTODO」の行のボタン
        - screen: todo
          place: 画面のボタン
      shownWhen:
        - value: OPEN
          label: 未着手
        - value: IN_PROGRESS
          label: 対応中
        - value: SUSPENDED
          label: 中断
      carried:
        version:
          $copy: version
          $of: self
      input:
        screen: cancel-todo/input
        request: GET /todo/{id}/cancel-todo
        items:
          - key: reason
            label: 中止理由
            type: todo-operations#操作の記録
            base: string
            description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
            required: true
            minLength: 1
            multiline: true
      confirm:
        screen: cancel-todo/confirm
        request: POST /todo/{id}/cancel-todo/confirm
        shows:
          - 中止理由
        stateChange:
          - from:
              - 未着手
              - 対応中
              - 中断
            to: 中止
        back:
          request: POST /todo/{id}/cancel-todo/back
          to: cancel-todo/input
      execute:
