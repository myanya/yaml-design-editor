# 生成物（basic-screens-resolved）: 手で直さず、業務モデルか生成の定義（design/basic/basic-screens-resolved.yaml）を直して作り直します（CLI generate）。
id: SYS-basic-screens-resolved
reach:
  dashboards:
    - todo-dashboard
  entities:
    - todo
    - category
    - tag
  nested:
    - todo-task
  operations:
    - add-category
    - register-todo
    - add-todo-comment
    - edit-todo-comment
    - delete-todo-comment
    - add-todo-task
    - delete-todo-task
    - edit-todo
    - start-todo
    - suspend-todo
    - resume-todo
    - complete-todo
    - cancel-todo
    - add-tag
    - todo-task.finish
lists:
  - resolvedId: RSV-list.todo-dashboard
    screen: SCR-todo-dashboard
    record:
      id: todo-dashboard
      name: TODOダッシュボード
      kind: list
      url: /
      filters:
        - key: tags
          label: タグ
          type: common#タグ参照
          multiple: true
          carried: URL のパラメータ
        - key: category
          label: カテゴリ
          type: common#カテゴリ参照
          carried: URL のパラメータ
      buttons:
        - operation: register-todo
          label: TODOを登録する
          to: register-todo/input
        - operation: add-category
          label: カテゴリを追加する
          to: add-category/input
        - operation: add-tag
          label: タグを追加する
          to: add-tag/input
      sections:
        - id: overdue
          label: 期限超過
          group: 注意
          view: todo-by-due
          kind: 一覧
          rows: todo
          filter:
            match:
              - node:
                  entity: todo
                  bind: t
            where:
              - of: t
                path: status
                oneOf:
                  - OPEN
                  - IN_PROGRESS
              - of: t
                path: due_on
                exists: true
            check:
              - lt:
                  - of: t
                    in:
                      schemaId: todo-detail
                    path: due_on
                  - $today
                type: date
          columns:
            - タイトル
            - ステータス
            - 期限
            - 完了日
          link:
            by: 行の ID
            to: todo
          rowButtons:
            - operation: add-todo-comment
              label: TODOにコメントを追加する
              shownWhen: いつも
              to: add-todo-comment/input
            - operation: add-todo-task
              label: 作業項目を追加する
              shownWhen: いつも
              to: add-todo-task/input
            - operation: edit-todo
              label: TODOを編集する
              shownWhen: いつも
              to: edit-todo/input
            - operation: start-todo
              label: TODOに着手する
              shownWhen:
                - value: OPEN
                  label: 未着手
              to: start-todo/confirm
            - operation: suspend-todo
              label: TODOを中断する
              shownWhen:
                - value: IN_PROGRESS
                  label: 対応中
              to: suspend-todo/input
            - operation: resume-todo
              label: TODOを再開する
              shownWhen:
                - value: SUSPENDED
                  label: 中断
              to: resume-todo/input
            - operation: complete-todo
              label: TODOを完了する
              shownWhen:
                - value: IN_PROGRESS
                  label: 対応中
              to: complete-todo/input
            - operation: cancel-todo
              label: TODOを中止する
              shownWhen:
                - value: OPEN
                  label: 未着手
                - value: IN_PROGRESS
                  label: 対応中
                - value: SUSPENDED
                  label: 中断
              to: cancel-todo/input
        - id: all
          label: すべてのTODO
          group: 全体
          view: todo-management
          kind: 一覧
          rows: todo
          columns:
            - カテゴリ
            - ステータス
            - 作業
            - タグ
            - 期限
            - 概要
            - 作成日
            - 更新日
          link:
            by: 行の ID
            to: todo
          rowButtons:
            - operation: add-todo-comment
              label: TODOにコメントを追加する
              shownWhen: いつも
              to: add-todo-comment/input
            - operation: add-todo-task
              label: 作業項目を追加する
              shownWhen: いつも
              to: add-todo-task/input
            - operation: edit-todo
              label: TODOを編集する
              shownWhen: いつも
              to: edit-todo/input
            - operation: start-todo
              label: TODOに着手する
              shownWhen:
                - value: OPEN
                  label: 未着手
              to: start-todo/confirm
            - operation: suspend-todo
              label: TODOを中断する
              shownWhen:
                - value: IN_PROGRESS
                  label: 対応中
              to: suspend-todo/input
            - operation: resume-todo
              label: TODOを再開する
              shownWhen:
                - value: SUSPENDED
                  label: 中断
              to: resume-todo/input
            - operation: complete-todo
              label: TODOを完了する
              shownWhen:
                - value: IN_PROGRESS
                  label: 対応中
              to: complete-todo/input
            - operation: cancel-todo
              label: TODOを中止する
              shownWhen:
                - value: OPEN
                  label: 未着手
                - value: IN_PROGRESS
                  label: 対応中
                - value: SUSPENDED
                  label: 中断
              to: cancel-todo/input
        - id: categories
          label: カテゴリ別の状況
          group: 全体
          view: category-status-matrix
          kind: 集計
          rows: category
          columns:
            - 未着手
            - 対応中
            - 中断
            - 完了
            - 中止
          cell:
            to: todo-dashboard
            shows: todo
            by:
              row: category
              column: status
        - id: tags
          label: タグ別の状況
          group: 全体
          view: tag-status-matrix
          kind: 集計
          rows: tag
          columns:
            - 未着手
            - 対応中
            - 中断
            - 完了
            - 中止
          cell:
            to: todo-dashboard
            shows: todo
            by:
              row: tag
              column: status
        - id: categories-master
          label: カテゴリ一覧
          group: マスタ
          view: category-management
          kind: 一覧
          rows: category
          columns:
            - カテゴリ名
            - TODOの数
          link:
            by: 行の ID
            to: category
          rowButtons: []
        - id: tags-master
          label: タグ一覧
          group: マスタ
          view: tag-management
          kind: 一覧
          rows: tag
          columns:
            - タグ名
            - TODOの数
          link:
            by: 行の ID
            to: tag
          rowButtons: []
      originalRoutes:
        url: /
      designId: SCR-todo-dashboard
details:
  - resolvedId: RSV-detail.todo
    screen: SCR-todo
    record:
      id: todo
      name: TODO詳細
      kind: detail
      url: /todo/{id}
      items:
        - key: id
          label: ID
          type: common#TODO番号
        - key: title
          label: タイトル
          type: common#一行の文
        - key: summary
          label: 概要
          type: common#一行の文
        - key: category
          label: カテゴリ
          type: common#カテゴリ参照
          link: category
        - key: tags
          label: タグ
          type: array
          many: true
          link: tag
        - key: follows
          label: 元のTODO
          type: common#TODO参照
          link: todo
        - key: status
          label: ステータス
          type: common#ステータス
        - key: created_on
          label: 作成日
          type: common#年月日
        - key: updated_on
          label: 更新日
          type: common#年月日
        - key: due_on
          label: 期限
          type: common#年月日
        - key: completed_on
          label: 完了日
          type: common#年月日
        - key: details
          label: 詳細
          type: common#文章
        - key: result
          label: 結果
          type: common#文章
      tables:
        - item: comments
          label: コメント一覧
          columns:
            - 日付
            - コメント本文
          rowButtons:
            - operation: edit-todo-comment
              label: コメントを編集する
              shownWhen: いつも
              to: edit-todo-comment/input
            - operation: delete-todo-comment
              label: コメントを削除する
              shownWhen: いつも
              to: delete-todo-comment/confirm
        - item: history
          label: 状態の履歴
          columns:
            - 日付
            - 操作
            - 前の状態
            - 後の状態
            - 理由
            - 再開予定日
        - item: tasks
          label: 作業項目
          entity: todo-task
          columns:
            - ID
            - 作業
            - 済
          rowButtons:
            - operation: todo-task.finish
              label: 作業項目を済にする
              shownWhen: いつも
              to: todo-task.finish/confirm
            - operation: delete-todo-task
              label: 作業項目を削除する
              shownWhen: いつも
              to: delete-todo-task/confirm
      buttons:
        - operation: add-todo-comment
          label: TODOにコメントを追加する
          shownWhen: いつも
          to: add-todo-comment/input
        - operation: add-todo-task
          label: 作業項目を追加する
          shownWhen: いつも
          to: add-todo-task/input
        - operation: edit-todo
          label: TODOを編集する
          shownWhen: いつも
          to: edit-todo/input
        - operation: start-todo
          label: TODOに着手する
          shownWhen:
            - value: OPEN
              label: 未着手
          to: start-todo/confirm
        - operation: suspend-todo
          label: TODOを中断する
          shownWhen:
            - value: IN_PROGRESS
              label: 対応中
          to: suspend-todo/input
        - operation: resume-todo
          label: TODOを再開する
          shownWhen:
            - value: SUSPENDED
              label: 中断
          to: resume-todo/input
        - operation: complete-todo
          label: TODOを完了する
          shownWhen:
            - value: IN_PROGRESS
              label: 対応中
          to: complete-todo/input
        - operation: cancel-todo
          label: TODOを中止する
          shownWhen:
            - value: OPEN
              label: 未着手
            - value: IN_PROGRESS
              label: 対応中
            - value: SUSPENDED
              label: 中断
          to: cancel-todo/input
      originalRoutes:
        url: /todo/{id}
      designId: SCR-todo
  - resolvedId: RSV-detail.category
    screen: SCR-category
    record:
      id: category
      name: カテゴリ詳細
      kind: detail
      url: /category/{id}
      items:
        - key: id
          label: ID
          type: common#カテゴリ番号
        - key: name
          label: カテゴリ名
          type: common#一行の文
      tables: []
      buttons: []
      originalRoutes:
        url: /category/{id}
      designId: SCR-category
  - resolvedId: RSV-detail.tag
    screen: SCR-tag
    record:
      id: tag
      name: タグ詳細
      kind: detail
      url: /tag/{id}
      items:
        - key: id
          label: ID
          type: common#タグ番号
        - key: name
          label: タグ名
          type: common#一行の文
      tables: []
      buttons: []
      originalRoutes:
        url: /tag/{id}
      designId: SCR-tag
operations:
  - resolvedId: RSV-operation.add-category
    screen: SCR-add-category
    record:
      id: add-category
      name: カテゴリを追加する
      kind: operation
      starts:
        - screen: todo-dashboard
          place: 上部のボタン
      shownWhen: いつも
      input:
        screen: add-category/input
        request: GET /category/add-category
        items:
          - key: name
            label: カテゴリ名
            type: common#一行の文
            base: string
            required: true
            minLength: 1
            maxLength: 100
            pattern: ^[^\r\n]*$
            overrides:
              minLength: 1
      confirm:
        screen: add-category/confirm
        request: POST /category/add-category/confirm
        shows:
          - カテゴリ名
        back:
          request: POST /category/add-category/back
          to: add-category/input
      execute:
        request: POST /category/add-category
        returns: 起点の画面（starts の画面。画面の ID で受け取る）
        notice: add-category.done
        refusals: []
        onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
      originalRoutes:
        input: GET /category/add-category
        confirm: POST /category/add-category/confirm
        back: POST /category/add-category/back
        execute: POST /category/add-category
      designId: SCR-add-category
  - resolvedId: RSV-operation.register-todo
    screen: SCR-register-todo
    record:
      id: register-todo
      name: TODOを登録する
      kind: operation
      starts:
        - screen: todo-dashboard
          place: 上部のボタン
      shownWhen: いつも
      input:
        screen: register-todo/input
        request: GET /todo/register-todo
        items:
          - key: title
            label: タイトル
            type: common#一行の文
            base: string
            required: true
            maxLength: 100
            pattern: ^[^\r\n]*$
          - key: summary
            label: 概要
            type: common#一行の文
            base: string
            required: true
            maxLength: 100
            pattern: ^[^\r\n]*$
          - key: category
            label: カテゴリ
            type: common#カテゴリ参照
            base: ref
            description: カテゴリ一覧の ID を 1 件。未分類なら省略します。
            refTarget: entity
            idPatternLayers:
              -   - CAT-*
            scope:
              schemaIds:
                - category-list
              documentIds: []
            relation: in-category
            idPatterns:
              - CAT-*
            schemas:
              - category-list
            targets:
              - category
            target: category
            targetTitle: name
            targetLabel: カテゴリ
          - key: tags
            label: タグ
            type: array
            base: array
            unique: true
            item:
              type: common#タグ参照
              base: ref
              description: タグ一覧の ID を 1 件。
              refTarget: entity
              idPatternLayers:
                -   - TAG-*
              scope:
                schemaIds:
                  - tag-list
                documentIds: []
              relation: tagged
              idPatterns:
                - TAG-*
              schemas:
                - tag-list
              targets:
                - tag
              target: tag
              targetTitle: name
              targetLabel: タグ
          - key: follows
            label: 元のTODO
            type: common#TODO参照
            base: ref
            description: 完了したTODOに追加の作業が要るときに、その元のTODOを選びます。
            refTarget: entity
            idPatternLayers:
              -   - TODO-*
            scope:
              schemaIds:
                - todo-list
              documentIds: []
            relation: follow-up-of
            idPatterns:
              - TODO-*
            schemas:
              - todo-list
            targets:
              - todo
            target: todo
            targetTitle: title
            targetLabel: TODO
          - key: due
            label: 期限
            type: common#年月日
            base: date
            description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
            format: yyyy年M月d日
          - key: details
            label: 詳細
            type: common#文章
            base: string
            multiline: true
      confirm:
        screen: register-todo/confirm
        request: POST /todo/register-todo/confirm
        shows:
          - タイトル
          - 概要
          - カテゴリ
          - タグ
          - 元のTODO
          - 期限
          - 詳細
        back:
          request: POST /todo/register-todo/back
          to: register-todo/input
      execute:
        request: POST /todo/register-todo
        returns: 起点の画面（starts の画面。画面の ID で受け取る）
        notice: register-todo.done
        refusals:
          - key: check.due-not-before-created
            message: TODO「{id}」の期限（{left}）が、作成日（{right}）より前です
          - key: check.updated-not-before-created
            message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
          - key: check.follows-not-self
            message: TODO「{id}」の元のTODOに、自分自身は選べません
          - key: check.follow-up-of.acyclic
            message: 「元のTODO」をたどると、自分（{id}）に戻ります（循環はできません）
        onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
      originalRoutes:
        input: GET /todo/register-todo
        confirm: POST /todo/register-todo/confirm
        back: POST /todo/register-todo/back
        execute: POST /todo/register-todo
      designId: SCR-register-todo
  - resolvedId: RSV-operation.add-todo-comment
    screen: SCR-add-todo-comment
    record:
      id: add-todo-comment
      name: TODOにコメントを追加する
      kind: operation
      target: todo
      starts:
        - screen: todo-dashboard
          place: 区画「期限超過」の行のボタン
        - screen: todo-dashboard
          place: 区画「すべてのTODO」の行のボタン
        - screen: todo
          place: 画面のボタン
      shownWhen: いつも
      carried:
        version:
          $copy: version
          $of: self
      input:
        screen: add-todo-comment/input
        request: GET /todo/{id}/add-todo-comment
        items:
          - key: date
            label: 記録日
            type: common#年月日
            base: date
            description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
            required: true
            format: yyyy年M月d日
          - key: body
            label: コメント本文
            type: todo-operations#操作の記録
            base: string
            description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
            required: true
            minLength: 1
            multiline: true
        initial:
          date:
            $copy: today
            $of: context
      confirm:
        screen: add-todo-comment/confirm
        request: POST /todo/{id}/add-todo-comment/confirm
        shows:
          - 記録日
          - コメント本文
        back:
          request: POST /todo/{id}/add-todo-comment/back
          to: add-todo-comment/input
      execute:
        request: POST /todo/{id}/add-todo-comment
        returns: 起点の画面（starts の画面。画面の ID で受け取る）
        notice: add-todo-comment.done
        refusals:
          - key: add-todo-comment.version-unchanged
            message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
          - key: check.updated-not-before-created
            message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
        onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
      originalRoutes:
        input: GET /todo/{id}/add-todo-comment
        confirm: POST /todo/{id}/add-todo-comment/confirm
        back: POST /todo/{id}/add-todo-comment/back
        execute: POST /todo/{id}/add-todo-comment
      designId: SCR-add-todo-comment
  - resolvedId: RSV-operation.edit-todo-comment
    screen: SCR-edit-todo-comment
    record:
      id: edit-todo-comment
      name: コメントを編集する
      kind: operation
      target: todo
      starts:
        - screen: todo
          place: 表「コメント一覧」の行のボタン
      shownWhen: いつも
      row:
        key: row
        label: コメントの番号
        table: comments
        tableLabel: コメント一覧
        carried: 行のボタンが運ぶ（URL のパラメータ）。入力・確認の画面では hidden 項目で持ち回す
      carried:
        version:
          $copy: version
          $of: self
      input:
        screen: edit-todo-comment/input
        request: GET /todo/{id}/edit-todo-comment
        items:
          - key: date
            label: 記録日
            type: common#年月日
            base: date
            description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
            format: yyyy年M月d日
          - key: body
            label: コメント本文
            type: todo-operations#操作の記録
            base: string
            description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
            minLength: 1
            multiline: true
        initial:
          date:
            $copy: comments[$row].date
            $of: self
            $in:
              schemaId: todo-detail
          body:
            $copy: comments[$row].body
            $of: self
            $in:
              schemaId: todo-detail
        submit: changed
      confirm:
        screen: edit-todo-comment/confirm
        request: POST /todo/{id}/edit-todo-comment/confirm
        shows:
          - 記録日
          - コメント本文
        back:
          request: POST /todo/{id}/edit-todo-comment/back
          to: edit-todo-comment/input
      execute:
        request: POST /todo/{id}/edit-todo-comment
        returns: 起点の画面（starts の画面。画面の ID で受け取る）
        notice: edit-todo-comment.done
        refusals:
          - key: edit-todo-comment.version-unchanged
            message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
          - key: check.updated-not-before-created
            message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
        onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
      originalRoutes:
        input: GET /todo/{id}/edit-todo-comment
        confirm: POST /todo/{id}/edit-todo-comment/confirm
        back: POST /todo/{id}/edit-todo-comment/back
        execute: POST /todo/{id}/edit-todo-comment
      designId: SCR-edit-todo-comment
  - resolvedId: RSV-operation.delete-todo-comment
    screen: SCR-delete-todo-comment
    record:
      id: delete-todo-comment
      name: コメントを削除する
      kind: operation
      target: todo
      starts:
        - screen: todo
          place: 表「コメント一覧」の行のボタン
      shownWhen: いつも
      row:
        key: row
        label: コメントの番号
        table: comments
        tableLabel: コメント一覧
        carried: 行のボタンが運ぶ（URL のパラメータ）。入力・確認の画面では hidden 項目で持ち回す
      carried:
        version:
          $copy: version
          $of: self
      confirm:
