# 生成物（basic-entity-candidates）: 手で直さず、業務モデルか生成の定義（design/basic/basic-entity-candidates.yaml）を直して作り直します（CLI generate）。
id: CMP-basic-entity-candidates
entities:
  - id: ENT-category
    label: カテゴリ
    description: TODO を分ける区分です。1 件の TODO は、カテゴリの 1 つに入るか、どれにも入りません（未分類）。
    source: category
    title: FLD-category.name
    numbering:
      item: FLD-category.id
      path: id
      prefix: CAT-
      digits: 3
      description: 「CAT-」に 3 桁の番号を続ける（使われている番号の次）
    documents:
      - category-list
    items:
      - id: FLD-category.id
        key: id
        seq: '01'
        owner: ENT-category
        path:
          - fields
          - id
        source: category.id
        label: ID
        description: 追加時にCAT-001形式で自動採番します。TODOからこのIDを参照します。
        base: id
        required: true
        pattern: ^CAT-[0-9]{3,}$
        type: TYP-common.カテゴリ番号
        attributeStates:
          type: present
          base: present
          required: present
          default: unconstrained
          auto: not-applicable
          minLength: not-applicable
          maxLength: not-applicable
          pattern: present
          min: not-applicable
          max: not-applicable
          values: not-applicable
          unique: not-applicable
          multiline: not-applicable
          format: not-applicable
      - id: FLD-category.name
        key: name
        seq: '02'
        owner: ENT-category
        path:
          - fields
          - name
        source: category.name
        label: カテゴリ名
        base: string
        required: true
        maxLength: 100
        pattern: ^[^\r\n]*$
        type: TYP-common.一行の文
        attributeStates:
          type: present
          base: present
          required: present
          default: unconstrained
          auto: not-applicable
          minLength: unconstrained
          maxLength: present
          pattern: present
          min: not-applicable
          max: not-applicable
          values: not-applicable
          unique: not-applicable
          multiline: unconstrained
          format: not-applicable
    operations:
      - seq: '01'
        id: OPS-category.add-category
        action: add-category
        label: カテゴリを追加する
        crud: C
        writes:
          - id: CRUD-category.add-category.name
            entity: ENT-category
            operation: OPS-category.add-category
            item: FLD-category.name
            crud: C
    identifiers:
      - FLD-category.id
