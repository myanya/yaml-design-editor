        minLength: 1
  schemas:
    - id: category-list
      document: .yde/schemas/input/0.yaml
      declared:
        id: category-list
        name: カテゴリ一覧
        kind: document
        description: TODOからIDで参照するカテゴリを管理します。
        match: todos/category-list.yaml
        entity:
          type: category
          idType: common#カテゴリ番号
          defines: true
          owns:
            - name
        root:
          type: object
          fields:
            - key: categories
              label: カテゴリ一覧
              type: array
              default: []
              display: table
              methods:
                insert:
                  id:
                    path: id
                    prefix: CAT-
                    digits: 3
              item:
                type: object
                label: カテゴリ
                fields:
                  - key: id
                    label: ID
                    type: common#カテゴリ番号
                    required: true
                    description: 追加時にCAT-001形式で自動採番します。TODOからこのIDを参照します。
                  - key: name
                    label: カテゴリ名
                    type: common#一行の文
                    role: title
                    required: true
        actions:
          - id: add-category
            label: カテゴリを追加する
            description: TODOを分類するカテゴリを作ります。IDは一覧の追加規則で自動採番します。
            params:
              - key: name
                label: カテゴリ名
                type: common#一行の文
                minLength: 1
                required: true
            do:
              - insert:
                  in:
                    schemaId: category-list
                  path: categories
                  params:
                    name: $name
    - id: common
      document: .yde/schemas/input/1.yaml
      declared:
        id: common
        name: 共通の型
        kind: library
        description: TODO 管理で使う型を 1 か所にまとめます。値の型（ID の形式・日付の見せ方・文字の長さ・ステータスの選択肢）と、オブジェクト型（一覧の行・個票・作業項目・コメントの形と、その検査）です。
        definitions:
          TODO番号:
            type: id
            pattern: ^TODO-[0-9]{3,}$
            placeholder: TODO-001
            sample: TODO-001
            description: 「TODO-」と 3 桁以上の数字。一覧と個票で同じ番号を使い、個票のファイル名にもなります。
          カテゴリ番号:
            type: id
            pattern: ^CAT-[0-9]{3,}$
            placeholder: CAT-001
            sample: CAT-001
            description: 「CAT-」と 3 桁以上の数字。
          タグ番号:
            type: id
            pattern: ^TAG-[0-9]{3,}$
            placeholder: TAG-001
            sample: TAG-001
            description: 「TAG-」と 3 桁以上の数字。
          作業項目番号:
            type: id
            pattern: ^TODO-[0-9]{3,}-S[0-9]{2,}$
            placeholder: TODO-001-S01
            sample: TODO-001-S01
            description: TODO の番号・「-S」・2 桁以上の数字。追加すると、その TODO の中の続き番号を自動で振ります。
          カテゴリ参照:
            type: ref
            idPattern: CAT-*
            relation: in-category
            scope:
              schemaIds:
                - category-list
            description: カテゴリ一覧の ID を 1 件。未分類なら省略します。
          タグ参照:
            type: ref
            idPattern: TAG-*
            relation: tagged
            scope:
              schemaIds:
                - tag-list
            description: タグ一覧の ID を 1 件。
          TODO参照:
            type: ref
            idPattern: TODO-*
            relation: follow-up-of
            scope:
              schemaIds:
                - todo-list
            description: 元のTODOの番号を 1 件。
          年月日:
            type: date
            format: yyyy年M月d日
            description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
          一行の文:
            type: line
            maxLength: 100
            placeholder: 1 行で簡潔に
          文章:
            type: text
            rows: 4
          ステータス:
            type: enum
            values:
              - value: OPEN
                label: 未着手
              - value: IN_PROGRESS
                label: 対応中
              - value: SUSPENDED
                label: 中断
              - value: CLOSED
                label: 完了
              - value: CANCELED
                label: 中止
          TODOの操作:
            type: enum
            values:
              - value: register-todo
                label: TODOを登録する
              - value: start-todo
                label: TODOに着手する
              - value: complete-todo
                label: TODOを完了する
              - value: suspend-todo
                label: TODOを中断する
              - value: resume-todo
                label: TODOを再開する
              - value: cancel-todo
                label: TODOを中止する
          TODO一覧の行:
            type: object
            label: TODO
            entity:
              type: todo
              defines: true
            fields:
              - key: id
                label: ID
                type: TODO番号
                required: true
                description: TODO を識別する番号。一覧と個票で共通に使い、個票のファイル名にも使います（例：TODO-001）。
              - key: title
                label: タイトル
                type: 一行の文
                role: title
                required: true
              - key: summary
                label: 概要
                type: 一行の文
                role: subtitle
                required: true
              - key: category
                label: カテゴリ
                type: カテゴリ参照
              - key: tags
                label: タグ
                type: array
                unique: true
                description: いくつでも付けられます（カテゴリは 1 つまで）。同じタグは 1 度だけです。付けなければ省略します。
                item:
                  type: タグ参照
              - key: follows
                label: 元のTODO
                type: TODO参照
                description: 完了したTODOに追加の作業が要るとき、このTODOがその続きであることを示します。
            constraints:
              - id: follows-not-self
                description: 元のTODOは自分以外であること
                where:
                  - path: follows
                    exists: true
                check:
                  - ne:
                      - path: follows
                      - path: id
                level: error
                message: TODO「{id}」の元のTODOに、自分自身は選べません
          コメント:
            type: object
            fields:
              - key: date
                label: 日付
                type: 年月日
                required: true
              - key: body
                label: コメント本文
                type: text
                required: true
          状態の記録:
            type: object
            label: 状態の記録
            fields:
              - key: date
                label: 日付
                type: 年月日
                required: true
                auto: created
                description: 完了・中断・再開は入力した日付、登録・着手・中止は適用した日です。
              - key: action
                label: 操作
                type: TODOの操作
                required: true
              - key: from
                label: 前の状態
                type: ステータス
                description: 登録の行には書きません。
              - key: to
                label: 後の状態
                type: ステータス
                required: true
              - key: note
                label: 理由
                type: 文章
                description: 中止と中断の理由、再開のメモです。
              - key: resume_on
                label: 再開予定日
                type: 年月日
                description: 中断の行にだけ書きます。
            constraints:
              - id: resume-not-before-suspend
                description: 再開予定日は中断した日以降であること
                where:
                  - path: resume_on
                    exists: true
                check:
                  - gte:
                      - path: resume_on
                      - path: date
                level: error
                message: 再開予定日（{left}）は、中断した日（{right}）より前にできません
          作業項目:
            type: object
            label: 作業項目
            entity:
              type: todo-task
              defines: true
            fields:
              - key: id
                label: ID
                type: 作業項目番号
                required: true
                description: 追加すると自動で振ります（例 TODO-002-S01）。
              - key: title
                label: 作業
                type: 一行の文
                role: title
                required: true
              - key: done
                label: 済
                type: boolean
                required: true
                default: false
            methods:
              finish:
                label: 作業項目を済にする
                do:
                  - set:
                      path: done
                      value: true
          TODO個票:
            type: object
            label: TODO個票
            entity:
              type: todo
              defines: false
            fields:
              - key: id
                label: ID
                type: TODO番号
                required: true
                description: TODO を識別する番号。一覧と個票で共通に使い、個票のファイル名にも使います（例：TODO-001）。
              - key: status
                label: ステータス
                type: ステータス
                required: true
                default: OPEN
              - key: created_on
                label: 作成日
                type: 年月日
                required: true
                auto: created
                description: 個票を作成した日を自動で記録します。登録操作ではTODOの登録日になります。過去分は「TODOを編集する」でも修正できます。
              - key: updated_on
                label: 更新日
                type: 年月日
                required: true
                auto: updated
                description: 個票の中身を変えて保存した日を自動で記録します（操作の適用でも入ります）。一覧の側（タイトル・概要・カテゴリ）だけの変更では変わりません。
              - key: due_on
                label: 期限
                type: 年月日
                description: 未定の場合は省略します。作成日より前の日付は検査が指摘します。
              - key: completed_on
                label: 完了日
                type: 年月日
                description: 完了時に入力します。未完了・中止の場合は省略します。
              - key: details
                label: 詳細
                type: 文章
                description: 作業内容や完了条件を記載します。
              - key: result
                label: 結果
                type: 文章
                description: 対応結果や中止理由を記載します。
              - key: tasks
                label: 作業項目
                type: array
                default: []
                display: table
                description: 作業を小分けにした明細です。済んでいない作業項目があるうちは完了できません。
                methods:
                  insert:
                    id:
                      path: id
                      prefix:
                        $format: '{id}-S'
                        $of: owner
                      digits: 2
                item:
                  type: 作業項目
                  fields:
                    - key: id
                    - key: title
                    - key: done
              - key: comments
                label: コメント一覧
                type: array
                default: []
                display: list
                description: 並び順は任意です。
                item:
                  type: コメント
                  fields:
                    - key: date
                    - key: body
              - key: history
                label: 状態の履歴
                type: array
                default: []
                display: table
                description: 状態の流れ（todo-behavior.yaml）が、状態を変える操作のたびに古い順に 1 行ずつ足します。手で書き足す必要はありません。
                item:
                  type: 状態の記録
                  fields:
                    - key: date
                    - key: action
                    - key: from
                    - key: to
                    - key: note
                    - key: resume_on
            constraints:
              - id: due-not-before-created
                description: 期限は作成日以降であること
                where:
                  - path: due_on
                    exists: true
                check:
                  - gte:
                      - path: due_on
                      - path: created_on
                level: error
                message: TODO「{id}」の期限（{left}）が、作成日（{right}）より前です
              - id: updated-not-before-created
                description: 更新日は作成日以降であること
                check:
                  - gte:
                      - path: updated_on
                      - path: created_on
                level: error
                message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
              - id: completed-not-before-created
                description: 完了日は作成日以降であること
                where:
                  - path: completed_on
                    exists: true
                check:
                  - gte:
                      - path: completed_on
                      - path: created_on
                level: error
                message: TODO「{id}」の完了日（{left}）が、作成日（{right}）より前です
              - id: closed-has-completed-on
                description: 完了した TODO には完了日があること
                where:
                  - state: todo-CLOSED
                  - path: completed_on
                    exists: false
                expect: absent
                level: error
                message: 完了した TODO「{id}」に完了日がありません
              - id: closed-has-result
                description: 完了したTODOには結果を記録すること
                where:
                  - state: todo-CLOSED
                  - path: result
                    empty: true
                expect: absent
                level: error
                message: 完了した TODO「{id}」に結果がありません
              - id: unfinished-has-no-completed-on
                description: 完了以外のTODOには完了日を残さないこと
                where:
                  - not:
                      state: todo-CLOSED
                  - path: completed_on
                    exists: true
                expect: absent
                level: error
                message: 完了していない TODO「{id}」に完了日が残っています
    - id: todo-operations
      document: .yde/schemas/input/2.yaml
      declared:
        id: todo-operations
        name: TODOの操作
        kind: library
        definitions:
          操作の記録:
            type: common#文章
            minLength: 1
            description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        description: 業務上の操作を、確認して適用できる変更セットとして実行します。
        actions:
          - id: register-todo
            label: TODOを登録する
            description: 一覧と未着手の個票を一度に作成します。TODO番号は、使われている番号の次を自動で振ります。状態（未着手）と状態の履歴の最初の行は、状態の流れ（todo-lifecycle）の入口から入ります。
            lifecycle: todo-lifecycle
            params:
              - key: title
                label: タイトル
                type: common#一行の文
                required: true
              - key: summary
                label: 概要
                type: common#一行の文
                required: true
              - key: category
                label: カテゴリ
                type: common#カテゴリ参照
              - key: tags
                label: タグ
                type: array
                unique: true
                item:
                  type: common#タグ参照
              - key: follows
                label: 元のTODO
                type: common#TODO参照
                description: 完了したTODOに追加の作業が要るときに、その元のTODOを選びます。
              - key: due
                label: 期限
                type: common#年月日
              - key: details
                label: 詳細
                type: common#文章
            do:
              - create:
                  schema: todo-detail
                  id:
                    prefix: TODO-
                    digits: 3
                  bind: todo
                  params:
                    due_on:
                      $copy: due
                    details:
                      $copy: details
                    comments: []
              - insert:
                  in:
                    schemaId: todo-list
                  path: todos
                  value:
                    id:
                      $copy: id
                      $of: todo
                    title: $title
                    summary: $summary
                    category:
                      $copy: category
                    tags:
                      $copy: tags
                    follows:
                      $copy: follows
          - id: add-todo-comment
            label: TODOにコメントを追加する
            input:
              initial:
                date:
                  $copy: today
                  $of: context
            description: TODOの個票へ、状態に関係なく日付と本文を記録します。
            target:
              entity: todo
            params:
              - key: date
                label: 記録日
                type: common#年月日
                required: true
              - key: body
                label: コメント本文
                type: 操作の記録
                required: true
            do:
              - insert:
                  in:
                    schemaId: todo-detail
                  path: comments
                  value:
                    date: $date
                    body: $body
                  of: self
          - id: edit-todo-comment
            label: コメントを編集する
            description: TODOの個票のコメント 1 件の、記録日と本文を直します。変更した項目だけを更新します。
            input:
              submit: changed
              initial:
                date:
                  $copy: comments[$row].date
                  $of: self
                  $in:
                    schemaId: todo-detail
                body:
                  $copy: comments[$row].body
                  $of: self
                  $in:
                    schemaId: todo-detail
            target:
              entity: todo
            params:
              - key: row
                label: コメントの番号
                type: int
                min: 0
                required: true
                description: コメント一覧の何番目か（0 から数えます）
              - key: date
                label: 記録日
                type: common#年月日
              - key: body
                label: コメント本文
                type: 操作の記録
            do:
              - when:
                  - path: date
                    exists: true
                set:
                  in:
                    schemaId: todo-detail
                  path: comments[$row].date
                  value: $date
                  of: self
              - when:
                  - path: body
                    exists: true
                set:
                  in:
                    schemaId: todo-detail
                  path: comments[$row].body
                  value: $body
                  of: self
          - id: delete-todo-comment
            label: コメントを削除する
            description: TODOの個票のコメント 1 件を消します。ほかのコメントは変えません。
            target:
              entity: todo
            params:
              - key: row
                label: コメントの番号
                type: int
                min: 0
                required: true
                description: コメント一覧の何番目か（0 から数えます）
            do:
              - delete:
                  in:
                    schemaId: todo-detail
                  path: comments[$row]
                  of: self
          - id: add-todo-task
            label: 作業項目を追加する
            description: 未完了のTODOに、作業項目を足します。番号はTODOの番号に続けて自動で振ります（TODO-004-S04 など）。済にするのは、個票の作業項目の行の「⋯」の「作業項目を済にする」です。
            target:
              entity: todo
            params:
              - key: title
                label: 作業
                type: common#一行の文
                minLength: 1
                required: true
            require:
              - id: active
                match:
                  - node:
                      entity: todo
                      bind: t
                where:
                  - of: t
                    state: todo-ACTIVE
                expect: exists
                message: '{id} は完了か中止をしているので、作業項目を足せません'
            do:
              - insert:
                  in:
                    schemaId: todo-detail
                  path: tasks
                  value:
                    id: ''
                    title: $title
                    done: false
                  of: self
          - id: delete-todo-task
            label: 作業項目を削除する
            description: 未完了のTODOの作業項目 1 件を消します。ほかの作業項目は変えません（残った作業項目の番号は振り直しません）。
            target:
              entity: todo
            params:
              - key: row
                label: 作業項目の番号
                type: int
                min: 0
                required: true
                description: 作業項目の何番目か（0 から数えます）
            require:
              - id: active
                match:
                  - node:
                      entity: todo
                      bind: t
                where:
                  - of: t
                    state: todo-ACTIVE
                expect: exists
                message: '{id} は完了か中止をしているので、作業項目を消せません'
            do:
              - delete:
                  in:
                    schemaId: todo-detail
                  path: tasks[$row]
                  of: self
          - id: edit-todo
            label: TODOを編集する
            description: 現在値を表示し、変更した項目だけを更新します。状態と完了日は変えません（着手・完了・再開・中止の操作で変えます）。空文字への変更と消去は別で、消去は「値を消す」で指定します。
            input:
              submit: changed
              initial:
                title:
                  $copy: title
                  $of: self
                  $in:
                    schemaId: todo-list
                summary:
                  $copy: summary
                  $of: self
                  $in:
                    schemaId: todo-list
                category:
                  $copy: category
                  $of: self
                  $in:
                    schemaId: todo-list
                tags:
                  $copy: tags
                  $of: self
                  $in:
                    schemaId: todo-list
                created_on:
                  $copy: created_on
                  $of: self
                  $in:
                    schemaId: todo-detail
                due_on:
                  $copy: due_on
                  $of: self
                  $in:
                    schemaId: todo-detail
                details:
                  $copy: details
                  $of: self
                  $in:
                    schemaId: todo-detail
                result:
                  $copy: result
                  $of: self
                  $in:
                    schemaId: todo-detail
            target:
              entity: todo
            params:
              - key: title
                label: タイトル
                type: common#一行の文
                minLength: 1
              - key: summary
                label: 概要
                type: common#一行の文
                minLength: 1
              - key: category
                label: カテゴリ
                type: common#カテゴリ参照
              - key: tags
                label: タグ
                type: array
                unique: true
                item:
                  type: common#タグ参照
                description: 入力した並びで全体を置き換えます。
              - key: created_on
                label: 作成日
                type: common#年月日
              - key: due_on
                label: 期限
                type: common#年月日
              - key: details
                label: 詳細
                type: common#文章
              - key: result
                label: 結果・中止理由
                type: common#文章
              - key: clear
                label: 値を消す
                type: object
                default: {}
                description: チェックした項目を消去します。同じ項目に入力した値より消去が優先します。
                fields:
                  - key: category
                    label: カテゴリを消す
                    type: boolean
                  - key: tags
                    label: タグを消す
                    type: boolean
                  - key: due_on
                    label: 期限を消す
                    type: boolean
                  - key: details
                    label: 詳細を消す
                    type: boolean
                  - key: result
                    label: 結果・中止理由を消す
                    type: boolean
            do:
              - when:
                  - path: title
                    exists: true
                set:
                  in:
                    schemaId: todo-list
                  path: title
                  value: $title
                  of: self
              - when:
                  - path: summary
                    exists: true
                set:
                  in:
                    schemaId: todo-list
                  path: summary
                  value: $summary
                  of: self
              - when:
                  - path: category
                    exists: true
                set:
                  in:
                    schemaId: todo-list
                  path: category
                  value: $category
                  of: self
              - when:
                  - path: tags
                    exists: true
                set:
                  in:
                    schemaId: todo-list
                  path: tags
                  value: $tags
                  of: self
              - when:
                  - path: created_on
                    exists: true
                set:
                  in:
                    schemaId: todo-detail
                  path: created_on
                  value: $created_on
                  of: self
              - when:
                  - path: due_on
                    exists: true
                set:
                  in:
                    schemaId: todo-detail
                  path: due_on
                  value: $due_on
                  of: self
              - when:
                  - path: details
                    exists: true
                set:
                  in:
                    schemaId: todo-detail
                  path: details
                  value: $details
                  of: self
              - when:
                  - path: result
                    exists: true
                set:
                  in:
                    schemaId: todo-detail
                  path: result
                  value: $result
                  of: self
              - when:
                  - path: clear.category
                    equals: true
                delete:
                  in:
                    schemaId: todo-list
                  path: category
                  of: self
              - when:
                  - path: clear.tags
                    equals: true
                delete:
                  in:
                    schemaId: todo-list
                  path: tags
                  of: self
              - when:
                  - path: clear.due_on
                    equals: true
                delete:
                  in:
                    schemaId: todo-detail
                  path: due_on
                  of: self
              - when:
                  - path: clear.details
                    equals: true
                delete:
                  in:
                    schemaId: todo-detail
                  path: details
                  of: self
              - when:
                  - path: clear.result
                    equals: true
                delete:
                  in:
                    schemaId: todo-detail
                  path: result
                  of: self
          - id: start-todo
            label: TODOに着手する
            description: 未着手の作業を対応中にします。追加の入力はありません。
            target:
              entity: todo
            lifecycle: todo-lifecycle
          - id: suspend-todo
            label: TODOを中断する
            description: 対応中の作業を一時止めます。理由と再開予定日を状態の履歴に残します。完了や中止と違い、再開できます。
            input:
              initial:
                date:
                  $copy: today
                  $of: context
            target:
              entity: todo
            params:
              - key: date
                label: 中断日
                type: common#年月日
                required: true
              - key: reason
                label: 中断理由
                type: 操作の記録
                required: true
              - key: resume_on
                label: 再開予定日
                type: common#年月日
                description: 決まっていれば入れます。中断日以降の日付です。
            lifecycle:
              id: todo-lifecycle
              history:
                date: $date
                note: $reason
                resume_on:
                  $copy: resume_on
          - id: resume-todo
            label: TODOを再開する
            description: 中断した作業を対応中に戻します。
            input:
              initial:
                date:
                  $copy: today
                  $of: context
            target:
              entity: todo
            params:
              - key: date
                label: 再開日
                type: common#年月日
                required: true
              - key: note
                label: メモ
                type: common#文章
            lifecycle:
              id: todo-lifecycle
              history:
                date: $date
                note:
                  $copy: note
          - id: complete-todo
            label: TODOを完了する
            input:
              initial:
                date:
                  $copy: today
                  $of: context
            description: 対応中の作業を完了にし、完了日と成果を記録します。済んでいない作業項目があるうちは完了できません。完了したTODOは戻せません（追加の作業は、元のTODOを選んで新しく登録します）。
            target:
              entity: todo
            params:
              - key: date
                label: 完了日
                type: common#年月日
                required: true
              - key: result
                label: 完了結果
                type: 操作の記録
                required: true
            require:
              - id: no-open-task
                match:
                  - node:
                      entity: todo
                      bind: t
                  - edge:
                      contains: true
                  - node:
                      entity: todo-task
                      bind: s
                where:
                  - of: s
                    path: done
                    equals: false
                expect: absent
                message: '{id} には済んでいない作業項目があります（済にしてから完了します）'
            lifecycle:
              id: todo-lifecycle
              history:
                date: $date
            do:
              - set:
                  in:
                    schemaId: todo-detail
                  path: completed_on
                  value: $date
                  of: self
              - set:
                  in:
                    schemaId: todo-detail
                  path: result
                  value: $result
                  of: self
          - id: cancel-todo
            label: TODOを中止する
            description: 未着手・対応中・中断の作業を中止し、理由を結果欄と状態の履歴に残します。
            target:
              entity: todo
            params:
              - key: reason
                label: 中止理由
                type: 操作の記録
                required: true
            lifecycle:
              id: todo-lifecycle
              history:
                note: $reason
            do:
              - set:
                  in:
                    schemaId: todo-detail
                  path: result
                  value: $reason
                  of: self
    - id: todo-relations
      document: .yde/schemas/input/3.yaml
      declared:
        id: todo-relations
        kind: relations
        entities:
          - type: todo
            label: TODO
            description: やることを 1 件ずつ管理する単位です。タイトル・概要・分類（カテゴリとタグ）を一覧に、進み具合（状態・日付・結果・作業項目・コメント・状態の履歴）を個票に書きます。
          - type: category
            label: カテゴリ
            description: TODO を分ける区分です。1 件の TODO は、カテゴリの 1 つに入るか、どれにも入りません（未分類）。
          - type: tag
            label: タグ
            description: TODO に付ける目印です。1 件の TODO に、いくつでも付けられます。
          - type: todo-task
            label: 作業項目
            description: TODO を小分けにした作業です。TODO の中にだけあり、済んでいない作業項目があるうちは TODO を完了できません。
        relations:
          - name: in-category
            label: カテゴリ
            inverseLabel: このカテゴリのTODO
            source:
              - todo
            target:
              - category
            cardinality:
              outMax: 1
            description: TODO はカテゴリを 1 つまで参照します（未分類なら参照しません）。参照は一覧の行に書きます
          - name: tagged
            label: タグ
            inverseLabel: このタグのTODO
            source:
              - todo
            target:
              - tag
            description: TODO はタグをいくつでも参照します（多対多）。参照は一覧の行の tags に書きます
          - name: follow-up-of
            label: 元のTODO
            inverseLabel: 続きのTODO
            source:
              - todo
            target:
              - todo
            cardinality:
              outMax: 1
            acyclic: true
            description: 完了したTODOに追加の作業が要るとき、新しく登録したTODOが元のTODOを 1 つまで参照します。参照は一覧の行に書きます
    - id: tag-list
      document: .yde/schemas/input/4.yaml
      declared:
        id: tag-list
        name: タグ一覧
        kind: document
        description: TODOに付けるタグを管理します。カテゴリ（1 つまで）と違い、1 件のTODOにいくつでも付けられます。
        match: todos/tag-list.yaml
        entity:
          type: tag
          idType: common#タグ番号
          defines: true
          owns:
            - name
        root:
          type: object
          fields:
            - key: tags
              label: タグ一覧
              type: array
              default: []
              display: table
              methods:
                insert:
                  id:
                    path: id
                    prefix: TAG-
                    digits: 3
              item:
                type: object
                label: タグ
                fields:
                  - key: id
                    label: ID
                    type: common#タグ番号
                    required: true
                    description: 追加時にTAG-001形式で自動採番します。TODOからこのIDを参照します。
                  - key: name
                    label: タグ名
                    type: common#一行の文
                    role: title
                    required: true
        actions:
          - id: add-tag
            label: タグを追加する
            description: TODOに付けるタグを作ります。IDは一覧の追加規則で自動採番します。
            params:
              - key: name
                label: タグ名
                type: common#一行の文
                minLength: 1
                required: true
            do:
              - insert:
                  in:
                    schemaId: tag-list
                  path: tags
                  params:
                    name: $name
    - id: todo-behavior
      document: .yde/schemas/input/5.yaml
      declared:
        id: todo-behavior
        name: TODOの振る舞い
        kind: behavior
        description: 'TODOの状態の流れの原本です。状態（個票の status の値）・入口・移り方・終わり・状態の履歴をここに書きます。 流れは 2 段で書きます。粗い流れ（todo-lifecycle）は「未完了 →
          完了／中止」だけで、未完了の中の流れ（未着手・対応中・中断）は 詳細化（refinements）に別に書きます。 状態を変える操作（operations.yaml の lifecycle: todo-lifecycle）は、2
          段を合わせた流れから、できる状態・移り先・履歴の行が決まり、 ダッシュボードの業務の流れ（todo-dashboard.yaml の flow）も、ここから段と線が決まります。 遷移は業務シナリオ scenarios/lifecycle.yaml
          で確かめます。'
        states:
          - source:
              entity: todo
              path: status
              enum: common#ステータス
            idPrefix: todo-
          - id: todo-ACTIVE
            entity: todo
            label: 未完了
        lifecycles:
          - id: todo-lifecycle
            entity: todo
            states:
              - todo-ACTIVE
              - todo-CLOSED
              - todo-CANCELED
            entry:
              - to: todo-ACTIVE
                by:
                  action: register-todo
            transitions:
              - from: todo-ACTIVE
                to: todo-CLOSED
                by:
                  action: complete-todo
              - from: todo-ACTIVE
                to: todo-CANCELED
                by:
                  action: cancel-todo
            termination:
              terminal:
                - todo-CLOSED
                - todo-CANCELED
            history:
              path: history
        refinements:
          - state: todo-ACTIVE
            states:
              - todo-OPEN
              - todo-IN_PROGRESS
              - todo-SUSPENDED
            entry:
              - to: todo-OPEN
                by:
                  action: register-todo
            transitions:
              - from: todo-OPEN
                to: todo-IN_PROGRESS
                by:
                  action: start-todo
              - from: todo-IN_PROGRESS
                to: todo-SUSPENDED
                by:
                  action: suspend-todo
              - from: todo-SUSPENDED
                to: todo-IN_PROGRESS
                by:
                  action: resume-todo
            exits:
              - by:
                  action: complete-todo
                from:
                  - todo-IN_PROGRESS
    - id: todo-detail
      document: .yde/schemas/input/6.yaml
      declared:
        id: todo-detail
        name: TODO個票
        kind: document
        description: 一覧のTODOを同じIDで詳細化し、進捗とコメントを記録します。
        match: todos/details/*.yaml
        filePattern: todos/details/{id}.yaml
        root:
          type: common#TODO個票
          fields:
            - key: id
            - key: status
            - key: created_on
            - key: updated_on
            - key: due_on
            - key: completed_on
            - key: details
            - key: result
            - key: tasks
              item:
                fields:
                  - key: id
                  - key: title
                  - key: done
            - key: comments
              item:
                fields:
                  - key: date
                  - key: body
            - key: history
              item:
                fields:
                  - key: date
                  - key: action
                  - key: from
                  - key: to
                  - key: note
                  - key: resume_on
        constraints:
          - id: closed-has-no-open-task
            description: 完了したTODOには、済んでいない作業項目が無いこと
            match:
              - node:
                  entity: todo
                  bind: t
              - edge:
                  contains: true
              - node:
                  entity: todo-task
                  bind: s
            where:
              - of: t
                state: todo-CLOSED
              - of: s
                path: done
                equals: false
            expect: absent
            level: error
            message: 完了したTODO「{id}」に、済んでいない作業項目があります
    - id: todo-list
      document: .yde/schemas/input/7.yaml
      declared:
        id: todo-list
        name: TODO一覧
        kind: document
        description: ID・タイトル・概要・カテゴリを管理する一覧。個票と同じIDを使用します。
        match: todos/todo-list.yaml
        root:
          type: object
          fields:
            - key: todos
              label: TODO一覧
              type: array
              default: []
              display: table
              item:
                type: common#TODO一覧の行
                fields:
                  - key: id
                  - key: title
                  - key: summary
                  - key: category
                  - key: tags
                    item: {}
                  - key: follows
        constraints:
          - id: has-detail
            description: 一覧のTODOには個票があること
            match:
              - node:
                  entity: todo
                  bind: t
            check:
              - gte:
                  - occurrenceCount:
                      of: t
                      schema: todo-detail
                  - 1
            level: error
            message: TODO「{id}」に個票がありません（TODOは「TODOを登録する」で一覧と個票を一緒に作ります）
  viewDefinitions:
    - id: category-management
      name: カテゴリ一覧
      description: カテゴリを並べ、名前と、そのカテゴリのTODOの数を見ます。ダッシュボードの「マスタ」の区画から開きます。カテゴリの追加はダッシュボード上部の操作です。
      rows:
        match:
          - node:
              entity: category
              bind: c
      order:
        schemaId: category-list
      columns:
        - label: カテゴリ名
          schemaId: category-list
          path: name
        - label: TODOの数
          value:
            refCount:
              of: c
              dir: in
              relation: in-category
    - id: category-status-matrix
      name: カテゴリ×ステータス
      kind: matrix
      description: 行＝カテゴリ、列＝TODOの状態、セル＝そのカテゴリのTODOの件数です。合計の行と列は自動で付きます。セルを押すと、数えたTODOへ移動できます。
      rows:
        idPattern: CAT-*
      order:
        schemaId: category-list
      unclassified: false
      cells:
        match:
          - node:
              entity: category
              bind: cat
          - edge:
              relation: in-category
              dir: in
          - node:
              entity: todo
              bind: t
        of: t
        columns:
          path: status
          values:
            - value: OPEN
              label: 未着手
            - value: IN_PROGRESS
              label: 対応中
            - value: SUSPENDED
              label: 中断
            - value: CLOSED
              label: 完了
            - value: CANCELED
              label: 中止
    - id: tag-management
      name: タグ一覧
      description: タグを並べ、名前と、そのタグを付けたTODOの数を見ます。ダッシュボードの「マスタ」の区画から開きます。タグの追加はダッシュボード上部の操作です。
      rows:
        match:
          - node:
              entity: tag
              bind: g
      order:
        schemaId: tag-list
      columns:
        - label: タグ名
          schemaId: tag-list
          path: name
        - label: TODOの数
          value:
            refCount:
              of: g
              dir: in
              relation: tagged
    - id: tag-status-matrix
      name: タグ×ステータス
      kind: matrix
      description: 行＝タグ、列＝TODOの状態、セル＝そのタグを付けたTODOの件数です。1 件のTODOに複数のタグを付けられるので、同じTODOが複数の行に数えられます（そのため合計の行と列は出しません）。セルを押すと、数えたTODOへ移動できます。
      rows:
        idPattern: TAG-*
      order:
        schemaId: tag-list
      unclassified: false
      totals: false
      cells:
        match:
          - node:
              entity: tag
              bind: tag
          - edge:
              relation: tagged
              dir: in
          - node:
              entity: todo
              bind: t
        of: t
        columns:
          path: status
          values:
            - value: OPEN
              label: 未着手
            - value: IN_PROGRESS
              label: 対応中
            - value: SUSPENDED
              label: 中断
            - value: CLOSED
              label: 完了
            - value: CANCELED
              label: 中止
    - id: todo-by-due
      name: 期限順
      params:
        - tags
        - category
      rows:
        match:
          - node:
              entity: todo
              bind: t
        where:
          - of: t
            path: tags
            includesAny: $tags
          - of: t
            path: category
            equals: $category
      order:
        schemaId: todo-detail
        path: due_on
      columns:
        - label: タイトル
          schemaId: todo-list
          path: title
        - label: ステータス
          schemaId: todo-detail
          path: status
        - label: 期限
          schemaId: todo-detail
          path: due_on
          editable: true
        - label: 完了日
          schemaId: todo-detail
          path: completed_on
      detail:
        fileGlob: todos/details/*.yaml
        filePattern: todos/details/{id}.yaml
    - id: todo-dashboard
      name: TODOダッシュボード
      kind: dashboard
      default: true
      description: 業務の流れで状態ごとの件数と、いま操作できるTODOを示します。気になる状況の件数を選び、一覧のIDから詳細と操作へ進みます。期限超過は未完了で期限が基準日より前のTODOです。
      actions:
        - register-todo
        - add-category
        - add-tag
      inputs:
        - key: tags
          label: タグ
          type: common#タグ参照
          multiple: true
        - key: category
          label: カテゴリ
          type: common#カテゴリ参照
      flow:
        lifecycle: todo-lifecycle
        view: todo-management
        group: 状況
        direction: right
      sections:
        - id: overdue
          label: 期限超過
          group: 注意
          view: todo-by-due
          filter:
            match:
              - node:
                  entity: todo
                  bind: t
            where:
              - of: t
                state:
                  - todo-OPEN
                  - todo-IN_PROGRESS
              - of: t
                path: due_on
                exists: true
            check:
              - lt:
                  - of: t
                    in:
                      schemaId: todo-detail
                    path: due_on
                  - $today
                type: date
        - id: all
          label: すべてのTODO
          group: 全体
          view: todo-management
        - id: categories
          label: カテゴリ別の状況
          group: 全体
          view: category-status-matrix
        - id: tags
          label: タグ別の状況
          group: 全体
          view: tag-status-matrix
        - id: categories-master
          label: カテゴリ一覧
          group: マスタ
          view: category-management
        - id: tags-master
          label: タグ一覧
          group: マスタ
          view: tag-management
    - id: todo-management
      name: TODO管理
      params:
        - tags
        - category
      rows:
        match:
          - node:
              entity: todo
              bind: t
        where:
          - of: t
            path: tags
            includesAny: $tags
          - of: t
            path: category
            equals: $category
      order:
        fileGlob: todos/todo-list.yaml
      columns:
        - label: カテゴリ
          schemaId: todo-list
          path: category
          editable: true
        - label: ステータス
          schemaId: todo-detail
          path: status
        - label: 作業
          schemaId: todo-detail
          value:
            map:
              format: '{done}/{all}'
              with:
                done:
                  count:
                    all:
                      match:
                        - node:
                            entity: todo
                            bind: t
                        - edge:
                            contains: true
                        - node:
                            entity: todo-task
                            bind: s
                      where:
                        - of: s
                          path: done
                          equals: true
                      of: s
                all:
                  count:
                    path: tasks[*].id
            using:
              0/0: ''
        - label: タグ
          schemaId: todo-list
          path: tags
          editable: true
        - label: 期限
          schemaId: todo-detail
          path: due_on
          editable: true
        - label: 概要
          schemaId: todo-list
          path: summary
          editable: true
        - label: 作成日
          schemaId: todo-detail
          path: created_on
        - label: 更新日
          schemaId: todo-detail
          path: updated_on
      detail:
        fileGlob: todos/details/*.yaml
        filePattern: todos/details/{id}.yaml
  views:
    - id: category-management
      label: カテゴリ一覧
      kind: grid
      description: カテゴリを並べ、名前と、そのカテゴリのTODOの数を見ます。ダッシュボードの「マスタ」の区画から開きます。カテゴリの追加はダッシュボード上部の操作です。
      rows: category
      match:
        - node:
            entity: category
            bind: c
      order:
        schemaId: category-list
      columns:
        - label: カテゴリ名
          schema: category-list
          path: name
          field:
            type: common#一行の文
            base: string
        - label: TODOの数
          computed: true
          value:
            refCount:
              of: c
              dir: in
              relation: in-category
    - id: category-status-matrix
      label: カテゴリ×ステータス
      kind: matrix
      description: 行＝カテゴリ、列＝TODOの状態、セル＝そのカテゴリのTODOの件数です。合計の行と列は自動で付きます。セルを押すと、数えたTODOへ移動できます。
      rows: category
      counts: todo
      match:
        - node:
            entity: category
            bind: cat
        - edge:
            relation: in-category
            dir: in
        - node:
            entity: todo
            bind: t
      columns:
        path: status
        values:
          - value: OPEN
            label: 未着手
          - value: IN_PROGRESS
            label: 対応中
          - value: SUSPENDED
            label: 中断
          - value: CLOSED
            label: 完了
          - value: CANCELED
            label: 中止
      order:
        schemaId: category-list
      unclassified: false
    - id: tag-management
      label: タグ一覧
      kind: grid
      description: タグを並べ、名前と、そのタグを付けたTODOの数を見ます。ダッシュボードの「マスタ」の区画から開きます。タグの追加はダッシュボード上部の操作です。
      rows: tag
      match:
        - node:
            entity: tag
            bind: g
      order:
        schemaId: tag-list
      columns:
        - label: タグ名
          schema: tag-list
          path: name
          field:
            type: common#一行の文
            base: string
        - label: TODOの数
          computed: true
          value:
            refCount:
              of: g
              dir: in
              relation: tagged
    - id: tag-status-matrix
      label: タグ×ステータス
      kind: matrix
      description: 行＝タグ、列＝TODOの状態、セル＝そのタグを付けたTODOの件数です。1 件のTODOに複数のタグを付けられるので、同じTODOが複数の行に数えられます（そのため合計の行と列は出しません）。セルを押すと、数えたTODOへ移動できます。
      rows: tag
      counts: todo
      match:
        - node:
            entity: tag
            bind: tag
        - edge:
            relation: tagged
            dir: in
        - node:
            entity: todo
            bind: t
      columns:
        path: status
        values:
          - value: OPEN
            label: 未着手
          - value: IN_PROGRESS
            label: 対応中
          - value: SUSPENDED
            label: 中断
          - value: CLOSED
            label: 完了
          - value: CANCELED
            label: 中止
      order:
        schemaId: tag-list
      unclassified: false
    - id: todo-by-due
      label: 期限順
      kind: grid
      params:
        - tags
        - category
      rows: todo
      match:
        - node:
            entity: todo
            bind: t
      where:
        - of: t
          path: tags
          includesAny: $tags
        - of: t
          path: category
          equals: $category
      order:
        schemaId: todo-detail
        path: due_on
      columns:
        - label: タイトル
          schema: todo-list
          path: title
          field:
            type: common#一行の文
            base: string
        - label: ステータス
          schema: todo-detail
          path: status
          field:
            type: common#ステータス
            base: enum
            values:
              - value: OPEN
                label: 未着手
              - value: IN_PROGRESS
                label: 対応中
              - value: SUSPENDED
                label: 中断
              - value: CLOSED
                label: 完了
              - value: CANCELED
                label: 中止
            stateOf: todo
        - label: 期限
          schema: todo-detail
          path: due_on
          editable: true
          field:
            type: common#年月日
            base: date
            format: yyyy年M月d日
        - label: 完了日
          schema: todo-detail
          path: completed_on
          field:
            type: common#年月日
            base: date
            format: yyyy年M月d日
      detail:
        fileGlob: todos/details/*.yaml
        filePattern: todos/details/{id}.yaml
    - id: todo-management
      label: TODO管理
      kind: grid
      params:
        - tags
        - category
      rows: todo
      match:
        - node:
            entity: todo
            bind: t
      where:
        - of: t
          path: tags
          includesAny: $tags
        - of: t
          path: category
          equals: $category
      order:
        fileGlob: todos/todo-list.yaml
      columns:
        - label: カテゴリ
          schema: todo-list
          path: category
          editable: true
          field:
            type: common#カテゴリ参照
            base: ref
            target: category
            targetTitle: name
        - label: ステータス
          schema: todo-detail
          path: status
          field:
            type: common#ステータス
            base: enum
            values:
              - value: OPEN
                label: 未着手
              - value: IN_PROGRESS
                label: 対応中
              - value: SUSPENDED
                label: 中断
              - value: CLOSED
                label: 完了
              - value: CANCELED
                label: 中止
            stateOf: todo
        - label: 作業
          schema: todo-detail
          computed: true
          value:
            map:
              format: '{done}/{all}'
              with:
                done:
                  count:
                    all:
                      match:
                        - node:
                            entity: todo
                            bind: t
                        - edge:
                            contains: true
                        - node:
                            entity: todo-task
                            bind: s
                      where:
                        - of: s
                          path: done
                          equals: true
                      of: s
                all:
                  count:
                    path: tasks[*].id
            using:
              0/0: ''
        - label: タグ
          schema: todo-list
          path: tags
          editable: true
          field:
            type: array
            base: array
            item:
              type: common#タグ参照
              base: ref
              declarations:
                - schema: common
                  document: .yde/schemas/input/1.yaml
                  path:
                    - definitions
                    - タグ参照
                  inherited: true
                  declared:
                    type: ref
                    idPattern: TAG-*
                    relation: tagged
                    scope:
                      schemaIds:
                        - tag-list
                    description: タグ一覧の ID を 1 件。
                - schema: common
                  document: .yde/schemas/input/1.yaml
                  path:
                    - definitions
                    - TODO一覧の行
                    - fields
                    - 4
                    - item
                  inherited: false
                  declared:
                    type: タグ参照
                - schema: todo-list
                  document: .yde/schemas/input/7.yaml
                  path:
                    - root
                    - fields
                    - 0
                    - item
                    - fields
                    - 4
                    - item
                  inherited: false
                  declared: {}
              description: タグ一覧の ID を 1 件。
              refTarget: entity
              idPatternLayers:
                -   - TAG-*
              scope:
                schemaIds:
                  - tag-list
                documentIds: []
              relation: tagged
              idPatterns:
                - TAG-*
              schemas:
                - tag-list
              targets:
                - tag
              target: tag
              targetTitle: name
              targetLabel: タグ
        - label: 期限
          schema: todo-detail
          path: due_on
          editable: true
          field:
            type: common#年月日
            base: date
            format: yyyy年M月d日
        - label: 概要
          schema: todo-list
          path: summary
          editable: true
          field:
            type: common#一行の文
            base: string
        - label: 作成日
          schema: todo-detail
          path: created_on
          field:
            type: common#年月日
            base: date
            format: yyyy年M月d日
        - label: 更新日
          schema: todo-detail
          path: updated_on
          field:
            type: common#年月日
            base: date
            format: yyyy年M月d日
      detail:
        fileGlob: todos/details/*.yaml
        filePattern: todos/details/{id}.yaml
  dashboards:
    - id: todo-dashboard
      label: TODOダッシュボード
      description: 業務の流れで状態ごとの件数と、いま操作できるTODOを示します。気になる状況の件数を選び、一覧のIDから詳細と操作へ進みます。期限超過は未完了で期限が基準日より前のTODOです。
      default: true
      inputs:
        - key: tags
          label: タグ
          type: common#タグ参照
          multiple: true
          field:
            type: common#タグ参照
            base: ref
            target: tag
            targetTitle: name
        - key: category
          label: カテゴリ
          type: common#カテゴリ参照
          field:
            type: common#カテゴリ参照
            base: ref
            target: category
            targetTitle: name
      usesToday: true
      actions:
        - register-todo
        - add-category
        - add-tag
      sections:
        - id: overdue
          label: 期限超過
          group: 注意
          view: todo-by-due
          filter:
            match:
              - node:
                  entity: todo
                  bind: t
            where:
              - of: t
                path: status
                oneOf:
                  - OPEN
                  - IN_PROGRESS
              - of: t
                path: due_on
                exists: true
            check:
              - lt:
                  - of: t
                    in:
                      schemaId: todo-detail
                    path: due_on
                  - $today
                type: date
        - id: all
          label: すべてのTODO
          group: 全体
          view: todo-management
        - id: categories
          label: カテゴリ別の状況
          group: 全体
          view: category-status-matrix
        - id: tags
          label: タグ別の状況
          group: 全体
          view: tag-status-matrix
        - id: categories-master
          label: カテゴリ一覧
          group: マスタ
          view: category-management
        - id: tags-master
          label: タグ一覧
          group: マスタ
          view: tag-management
      reach:
        entities:
          - todo
          - category
          - tag
        nested:
          - todo-task
        operations:
          - register-todo
          - add-category
          - add-tag
          - add-todo-comment
          - edit-todo-comment
          - delete-todo-comment
          - add-todo-task
          - delete-todo-task
          - edit-todo
          - start-todo
          - suspend-todo
          - resume-todo
          - complete-todo
          - cancel-todo
          - todo-task.finish
  reach:
    entities:
      - todo
      - category
      - tag
    nested:
      - todo-task
    operations:
      - register-todo
      - add-category
      - add-tag
      - add-todo-comment
      - edit-todo-comment
      - delete-todo-comment
      - add-todo-task
      - delete-todo-task
      - edit-todo
      - start-todo
      - suspend-todo
      - resume-todo
      - complete-todo
      - cancel-todo
      - todo-task.finish
