    - id: start-todo
      kind: action
      label: TODOに着手する
      description: 未着手の作業を対応中にします。追加の入力はありません。
      subject: todo
      target:
        entity: todo
      creates: []
      params:
        - key: version
          label: 版
          type: int
          base: int
          description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
          required: true
          builtinType:
            name: int
            base: int
            builtin: true
          carried: true
      inputParams: []
      carriedValues:
        version:
          $copy: version
          $of: self
      carried:
        - version
      input: {}
      require:
        - id: version-unchanged
          message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
          rule:
            match:
              - node:
                  entity: todo
                  bind: t
            where:
              - of: t
                path: version
                equals: $version
            expect: exists
      lifecycle:
        id: todo-lifecycle
        transitions:
          - from:
              - id: todo-OPEN
                label: 未着手
                value: OPEN
            to:
              id: todo-IN_PROGRESS
              label: 対応中
              value: IN_PROGRESS
        refusal: 「{id}」は「{state}」なので、「TODOに着手する」はできません（できるのは「未着手」のとき）
      effects:
        - op: set
          source: lifecycle
          entity: todo
          schema: todo-detail
          path: status
          field:
            key: status
            base: enum
          value: IN_PROGRESS
        - op: insert
          source: lifecycle
          entity: todo
          schema: todo-detail
          path: history
          field:
            key: history
            base: array
            item:
              base: object
          value:
            date:
              $copy: today
              $of: context
            action: start-todo
            from:
              $copy: status
              $of: self
            to: IN_PROGRESS
          written:
            - key: date
              value:
                $copy: today
                $of: context
              base: date
            - key: action
              value: start-todo
              base: enum
            - key: from
              value:
                $copy: status
                $of: self
              base: enum
            - key: to
              value: IN_PROGRESS
              base: enum
        - op: set
          source: auto
          auto: updated
          entity: todo
          schema: todo-detail
          path: updated_on
          field:
            key: updated_on
            base: date
          value:
            $copy: today
            $of: context
        - op: set
          source: auto
          auto: revision
          entity: todo
          path: version
          field:
            key: version
            base: int
          value:
            $copy: version
            $of: next
      checks:
        - constraint: updated-not-before-created
          form: element
          level: error
          items:
            - todo.updated_on
        - constraint: unfinished-has-no-completed-on
          form: element
          level: error
          items:
            - todo.status
