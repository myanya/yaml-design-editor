          - path: completed_on
            exists: true
        expect: absent
      source: common#TODO個票
    - id: resume-not-before-suspend
      label: 再開予定日は中断した日以降であること
      message: 再開予定日（{left}）は、中断した日（{right}）より前にできません
      level: error
      form: element
      entity: todo
      at: history[*]
