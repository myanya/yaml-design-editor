            empty: true
        expect: absent
      source: common#TODO個票
    - id: unfinished-has-no-completed-on
      label: 完了以外のTODOには完了日を残さないこと
      message: 完了していない TODO「{id}」に完了日が残っています
      level: error
      form: element
      entity: todo
      reads:
        - todo.status
        - todo.completed_on
      rule:
        where:
