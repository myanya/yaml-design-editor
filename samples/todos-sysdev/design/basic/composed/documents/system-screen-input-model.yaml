      label: 作業項目
      description: TODO を小分けにした作業です。TODO の中にだけあり、済んでいない作業項目があるうちは TODO を完了できません。
      numbering:
        path: id
        prefix:
          $format: '{id}-S'
          $of: owner
        digits: 2
      owner:
        entity: todo
        field: tasks
      aggregate: todo
      title: title
