# 生成物（messages-derived）: 手で直さず、業務モデルか生成の定義（design/basic/messages-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-messages.messages
record:
  id: DOC-messages.messages
  value:
    id: messages
    name: メッセージ定義書
    file: src/main/resources/messages.properties
    writing:
      - 名前の穴（{id} など）は、文の中で最初に出た順に {0} {1} … へ置き換えて書く（MessageFormat）。穴の意味は holes
      - 入力の誤りのキーは、Bean Validation の誤りのコードの頭に validation. を付けたもの（DefaultMessageCodesResolver の prefix）。日付として読めない誤りは typeMismatch
      - 文に ' を書くときは '' と書く（MessageFormat）
    holes:
      - name: id
        means: 受け手の ID（作る操作は作った要素の ID。データの決まりは、決まりの起点の要素の ID）
      - name: state
        means: 受け手の今の状態の名前
      - name: left
        means: データの決まりの check の左の値（画面の表示の形）
      - name: right
        means: データの決まりの check の右の値（画面の表示の形）
      - name: 'no'
        means: 受付番号（ログと突き合わせる）
    messages:
      - key: start-todo.state
        kind: 状態の断り
        text: 「{id}」は「{state}」なので、「TODOに着手する」はできません（できるのは「未着手」のとき）
        source: 操作 start-todo の Lifecycle（todo-lifecycle）
      - key: suspend-todo.state
        kind: 状態の断り
        text: 「{id}」は「{state}」なので、「TODOを中断する」はできません（できるのは「対応中」のとき）
        source: 操作 suspend-todo の Lifecycle（todo-lifecycle）
      - key: resume-todo.state
        kind: 状態の断り
        text: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
        source: 操作 resume-todo の Lifecycle（todo-lifecycle）
      - key: complete-todo.state
        kind: 状態の断り
        text: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
        source: 操作 complete-todo の Lifecycle（todo-lifecycle）
      - key: cancel-todo.state
        kind: 状態の断り
        text: 「{id}」は「{state}」なので、「TODOを中止する」はできません（できるのは「未完了」のとき）
        source: 操作 cancel-todo の Lifecycle（todo-lifecycle）
      - key: add-todo-comment.version-unchanged
        kind: 前提の断り
        text: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        source: 操作 add-todo-comment の前提 version-unchanged
      - key: edit-todo-comment.version-unchanged
        kind: 前提の断り
        text: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
