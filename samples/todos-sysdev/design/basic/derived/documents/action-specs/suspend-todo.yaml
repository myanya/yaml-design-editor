# 生成物（action-specs-derived）: 手で直さず、業務モデルか生成の定義（design/basic/action-specs-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-action-specs.suspend-todo
record:
  id: DOC-action-specs.suspend-todo
  value:
    id: suspend-todo
    name: TODOを中断する
    description: 対応中の作業を一時止めます。理由と再開予定日を状態の履歴に残します。完了や中止と違い、再開できます。
    kind: action
    subject: todo
    inputs:
      - key: date
        label: 中断日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        required: true
        format: yyyy年M月d日
      - key: reason
        label: 中断理由
        type: todo-operations#操作の記録
        base: string
        description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
        required: true
        minLength: 1
        multiline: true
      - key: resume_on
        label: 再開予定日
        type: common#年月日
        base: date
        description: 決まっていれば入れます。中断日以降の日付です。
        format: yyyy年M月d日
    initial:
      date:
        $copy: today
        $of: context
    state:
      id: todo-lifecycle
      transitions:
        - from:
            - id: todo-IN_PROGRESS
              label: 対応中
              value: IN_PROGRESS
          to:
            id: todo-SUSPENDED
            label: 中断
            value: SUSPENDED
      refusal: 「{id}」は「{state}」なので、「TODOを中断する」はできません（できるのは「対応中」のとき）
      history:
        date: $date
        note: $reason
        resume_on:
          $copy: resume_on
    preconditions: []
    effects:
      - op: set
        schema: todo-detail
        path: status
        value: SUSPENDED
        source: lifecycle
        entity: todo
        field:
          key: status
          base: enum
      - op: insert
        schema: todo-detail
        path: history
        value:
          date: $date
          action: suspend-todo
          from:
            $copy: status
            $of: self
          to: SUSPENDED
          note: $reason
          resume_on:
            $copy: resume_on
        source: lifecycle
        entity: todo
        field:
          key: history
          base: array
          item:
            base: object
        written:
          - key: date
            value: $date
            base: date
          - key: action
            value: suspend-todo
            base: enum
          - key: from
            value:
              $copy: status
              $of: self
            base: enum
          - key: to
            value: SUSPENDED
            base: enum
          - key: note
            value: $reason
            base: string
          - key: resume_on
            value:
              $copy: resume_on
            base: date
      - op: set
        schema: todo-detail
        path: updated_on
        value:
          $copy: today
          $of: context
        source: auto
        auto: updated
        entity: todo
        field:
          key: updated_on
          base: date
    receiver:
      entity: todo
    inputPolicy:
      initial:
        date:
          $copy: today
          $of: context
    checks:
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
      - constraint: unfinished-has-no-completed-on
        form: element
        level: error
        items:
          - todo.status
      - constraint: resume-not-before-suspend
        form: element
        level: error
        items:
          - todo.history
        params:
          - resume_on
          - date
    writes:
      - CRUD-todo.suspend-todo.status
      - CRUD-todo.suspend-todo.history
      - CRUD-todo.suspend-todo.updated_on
  source:
    id: rule-action-specs
    document: .yde/transforms/design/basic/action-specs-derived.yaml
