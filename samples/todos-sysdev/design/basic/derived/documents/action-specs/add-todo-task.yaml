# 生成物（action-specs-derived）: 手で直さず、業務モデルか生成の定義（design/basic/action-specs-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-action-specs.add-todo-task
record:
  id: DOC-action-specs.add-todo-task
  value:
    id: add-todo-task
    name: 作業項目を追加する
    description: 未完了のTODOに、作業項目を足します。番号はTODOの番号に続けて自動で振ります（TODO-004-S04 など）。済にするのは、個票の作業項目の行の「⋯」の「作業項目を済にする」です。
    kind: action
    subject: todo
    inputs:
      - key: title
        label: 作業
        type: common#一行の文
        base: string
        required: true
        minLength: 1
        maxLength: 100
        pattern: ^[^\r\n]*$
        overrides:
          minLength: 1
    preconditions:
      - id: active
        message: '{id} は完了か中止をしているので、作業項目を足せません'
        rule:
          match:
            - node:
                entity: todo
                bind: t
          where:
            - of: t
              path: status
              oneOf:
                - OPEN
                - IN_PROGRESS
                - SUSPENDED
          expect: exists
    effects:
      - op: insert
        schema: todo-detail
        path: tasks
        value:
          id: ''
          title: $title
          done: false
        of: self
        source: do
        entity: todo
        field:
          key: tasks
          base: array
          item:
            base: object
            entity: todo-task
        written:
          - key: id
            value: ''
            base: id
          - key: title
            value: $title
            base: string
          - key: done
            value: false
            base: boolean
        numbering:
          path: id
          prefix:
            $format: '{id}-S'
            $of: owner
          digits: 2
      - op: set
        schema: todo-detail
        path: updated_on
        value:
          $copy: today
          $of: context
        source: auto
        auto: updated
        entity: todo
        field:
          key: updated_on
          base: date
    receiver:
      entity: todo
    checks:
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
      - constraint: closed-has-no-open-task
        form: pattern
        level: error
        items:
          - todo-task.done
          - todo.tasks
    writes:
      - CRUD-todo.add-todo-task.tasks
      - CRUD-todo.add-todo-task.updated_on
      - CRUD-todo-task.add-todo-task.id
      - CRUD-todo-task.add-todo-task.title
      - CRUD-todo-task.add-todo-task.done
  source:
    id: rule-action-specs
    document: .yde/transforms/design/basic/action-specs-derived.yaml
