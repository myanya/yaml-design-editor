# 生成物（action-specs-derived）: 手で直さず、業務モデルか生成の定義（design/basic/action-specs-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-action-specs.edit-todo
record:
  id: DOC-action-specs.edit-todo
  value:
    id: edit-todo
    name: TODOを編集する
    description: 現在値を表示し、変更した項目だけを更新します。状態と完了日は変えません（着手・完了・再開・中止の操作で変えます）。空文字への変更と消去は別で、消去は「値を消す」で指定します。
    kind: action
    subject: todo
    inputs:
      - key: title
        label: タイトル
        type: common#一行の文
        base: string
        minLength: 1
        maxLength: 100
        pattern: ^[^\r\n]*$
        overrides:
          minLength: 1
      - key: summary
        label: 概要
        type: common#一行の文
        base: string
        minLength: 1
        maxLength: 100
        pattern: ^[^\r\n]*$
        overrides:
          minLength: 1
      - key: category
        label: カテゴリ
        type: common#カテゴリ参照
        base: ref
        description: カテゴリ一覧の ID を 1 件。未分類なら省略します。
        refTarget: entity
        idPatternLayers:
          -   - CAT-*
        scope:
          schemaIds:
            - category-list
          documentIds: []
        relation: in-category
        idPatterns:
          - CAT-*
        schemas:
          - category-list
        targets:
          - category
        target: category
        targetTitle: name
        targetLabel: カテゴリ
        clearedBy: clear.category
      - key: tags
        label: タグ
        type: array
        base: array
        description: 入力した並びで全体を置き換えます。
        unique: true
        item:
          type: common#タグ参照
          base: ref
          description: タグ一覧の ID を 1 件。
          refTarget: entity
          idPatternLayers:
            -   - TAG-*
          scope:
            schemaIds:
              - tag-list
            documentIds: []
          relation: tagged
          idPatterns:
            - TAG-*
          schemas:
            - tag-list
          targets:
            - tag
          target: tag
          targetTitle: name
          targetLabel: タグ
        clearedBy: clear.tags
      - key: created_on
        label: 作成日
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        format: yyyy年M月d日
      - key: due_on
        label: 期限
        type: common#年月日
        base: date
        description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
        format: yyyy年M月d日
        clearedBy: clear.due_on
      - key: details
        label: 詳細
        type: common#文章
        base: string
        multiline: true
        clearedBy: clear.details
      - key: result
        label: 結果・中止理由
        type: common#文章
        base: string
        multiline: true
        clearedBy: clear.result
      - key: comments
        label: コメント一覧
        type: array
        base: array
        description: 入力した一覧で全体を置き換えます。既存コメントへの追記は「コメントを追加する」を使います。
        item:
          type: common#コメント
          base: object
          fields:
            - key: date
              label: 日付
              type: common#年月日
              base: date
              declarations:
                - schema: common
                  document: .yde/schemas/input/1.yaml
                  path:
                    - definitions
                    - 年月日
                  inherited: true
                  declared:
                    type: date
                    format: yyyy年M月d日
                    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
                - schema: common
                  document: .yde/schemas/input/1.yaml
                  path:
                    - definitions
                    - コメント
                    - fields
                    - 0
                  inherited: false
                  declared:
                    key: date
                    label: 日付
                    type: 年月日
                    required: true
              description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
              required: true
              format: yyyy年M月d日
            - key: body
              label: コメント本文
              type: text
              base: string
              declarations:
                - schema: builtin-types
                  path:
                    - definitions
                    - text
                  inherited: true
                  declared:
                    type: string
                    display: multiline
                - schema: common
                  document: .yde/schemas/input/1.yaml
                  path:
                    - definitions
                    - コメント
                    - fields
                    - 1
                  inherited: false
                  declared:
                    key: body
                    label: コメント本文
                    type: text
                    required: true
              required: true
              multiline: true
              builtinType:
                name: text
                base: string
                builtin: true
                multiline: true
        clearedBy: clear.comments
      - key: clear
        label: 値を消す
        type: object
        base: object
        description: チェックした項目を消去します。同じ項目に入力した値より消去が優先します。
        default: {}
        fields:
          - key: category
            label: カテゴリを消す
            type: boolean
            base: boolean
            builtinType:
              name: boolean
              base: boolean
              builtin: true
          - key: tags
            label: タグを消す
            type: boolean
            base: boolean
            builtinType:
              name: boolean
              base: boolean
              builtin: true
          - key: due_on
            label: 期限を消す
            type: boolean
            base: boolean
            builtinType:
              name: boolean
              base: boolean
              builtin: true
          - key: details
            label: 詳細を消す
            type: boolean
            base: boolean
            builtinType:
              name: boolean
              base: boolean
              builtin: true
          - key: result
            label: 結果・中止理由を消す
            type: boolean
            base: boolean
            builtinType:
              name: boolean
              base: boolean
              builtin: true
          - key: comments
            label: コメント一覧を消す
            type: boolean
            base: boolean
            builtinType:
              name: boolean
              base: boolean
              builtin: true
    initial:
      title:
        $copy: title
        $of: self
        $in:
          schemaId: todo-list
      summary:
        $copy: summary
        $of: self
        $in:
          schemaId: todo-list
      category:
        $copy: category
        $of: self
        $in:
          schemaId: todo-list
      tags:
        $copy: tags
        $of: self
        $in:
          schemaId: todo-list
      created_on:
        $copy: created_on
        $of: self
        $in:
          schemaId: todo-detail
      due_on:
        $copy: due_on
        $of: self
        $in:
          schemaId: todo-detail
      details:
        $copy: details
        $of: self
        $in:
          schemaId: todo-detail
      result:
        $copy: result
        $of: self
        $in:
          schemaId: todo-detail
      comments:
        $copy: comments
        $of: self
        $in:
          schemaId: todo-detail
    preconditions: []
    effects:
      - op: set
        schema: todo-list
        path: title
        value: $title
        of: self
        when:
          - path: title
            exists: true
        source: do
        entity: todo
        field:
          key: title
          base: string
      - op: set
        schema: todo-list
        path: summary
        value: $summary
        of: self
        when:
          - path: summary
            exists: true
        source: do
        entity: todo
        field:
          key: summary
          base: string
      - op: set
        schema: todo-list
        path: category
        value: $category
        of: self
        when:
          - path: category
            exists: true
        source: do
        entity: todo
        field:
          key: category
          base: ref
      - op: set
        schema: todo-list
        path: tags
        value: $tags
        of: self
        when:
          - path: tags
            exists: true
        source: do
        entity: todo
        field:
          key: tags
          base: array
          item:
            base: ref
      - op: set
        schema: todo-detail
        path: created_on
        value: $created_on
        of: self
        when:
          - path: created_on
            exists: true
        source: do
        entity: todo
        field:
          key: created_on
          base: date
      - op: set
        schema: todo-detail
        path: due_on
        value: $due_on
        of: self
        when:
          - path: due_on
            exists: true
        source: do
        entity: todo
        field:
          key: due_on
          base: date
      - op: set
        schema: todo-detail
        path: details
        value: $details
        of: self
        when:
          - path: details
            exists: true
        source: do
        entity: todo
        field:
          key: details
          base: string
      - op: set
        schema: todo-detail
        path: result
        value: $result
        of: self
        when:
          - path: result
            exists: true
        source: do
        entity: todo
        field:
          key: result
          base: string
      - op: set
        schema: todo-detail
        path: comments
        value: $comments
        of: self
        when:
          - path: comments
            exists: true
        source: do
        entity: todo
        field:
          key: comments
          base: array
          item:
            base: object
      - op: delete
        schema: todo-list
        path: category
        of: self
        when:
          - path: clear.category
            equals: true
        source: do
        entity: todo
        field:
          key: category
          base: ref
      - op: delete
        schema: todo-list
        path: tags
        of: self
        when:
          - path: clear.tags
            equals: true
        source: do
        entity: todo
        field:
          key: tags
          base: array
          item:
            base: ref
      - op: delete
        schema: todo-detail
        path: due_on
        of: self
        when:
          - path: clear.due_on
            equals: true
        source: do
        entity: todo
        field:
          key: due_on
          base: date
      - op: delete
        schema: todo-detail
        path: details
        of: self
        when:
          - path: clear.details
            equals: true
        source: do
        entity: todo
        field:
          key: details
          base: string
      - op: delete
        schema: todo-detail
        path: result
        of: self
        when:
          - path: clear.result
            equals: true
        source: do
        entity: todo
        field:
          key: result
          base: string
      - op: set
        schema: todo-detail
        path: comments
        value: []
        of: self
        when:
          - path: clear.comments
            equals: true
        source: do
        entity: todo
        field:
          key: comments
          base: array
          item:
            base: object
      - op: set
        schema: todo-detail
        path: updated_on
        value:
          $copy: today
          $of: context
        source: auto
        auto: updated
        entity: todo
        field:
          key: updated_on
          base: date
    receiver:
      entity: todo
    inputPolicy:
      submit: changed
      initial:
        title:
          $copy: title
          $of: self
          $in:
            schemaId: todo-list
        summary:
          $copy: summary
          $of: self
          $in:
            schemaId: todo-list
        category:
          $copy: category
          $of: self
          $in:
            schemaId: todo-list
        tags:
          $copy: tags
          $of: self
          $in:
            schemaId: todo-list
        created_on:
          $copy: created_on
          $of: self
          $in:
            schemaId: todo-detail
        due_on:
          $copy: due_on
          $of: self
          $in:
            schemaId: todo-detail
        details:
          $copy: details
          $of: self
          $in:
            schemaId: todo-detail
        result:
          $copy: result
          $of: self
          $in:
            schemaId: todo-detail
        comments:
          $copy: comments
          $of: self
          $in:
            schemaId: todo-detail
    checks:
      - constraint: due-not-before-created
        form: element
        level: error
        items:
          - todo.due_on
          - todo.created_on
        params:
          - due_on
          - created_on
      - constraint: updated-not-before-created
        form: element
        level: error
        items:
          - todo.updated_on
          - todo.created_on
        params:
          - created_on
      - constraint: completed-not-before-created
        form: element
        level: error
        items:
          - todo.created_on
        params:
          - created_on
      - constraint: closed-has-result
        form: element
        level: error
        items:
          - todo.result
        params:
          - result
      - constraint: in-category.outMax
        form: relation
        level: warning
        kind: outMax
        multiple: false
        items:
          - todo.category
        params:
          - category
      - constraint: in-category.types
        form: relation
        level: warning
        kind: types
        multiple: false
        items:
          - todo.category
        params:
          - category
      - constraint: tagged.types
        form: relation
        level: warning
        kind: types
        multiple: true
        items:
          - todo.tags
        params:
          - tags
    writes:
      - CRUD-todo.edit-todo.title
      - CRUD-todo.edit-todo.summary
      - CRUD-todo.edit-todo.category
      - CRUD-todo.edit-todo.tags
      - CRUD-todo.edit-todo.created_on
      - CRUD-todo.edit-todo.due_on
      - CRUD-todo.edit-todo.details
      - CRUD-todo.edit-todo.result
      - CRUD-todo.edit-todo.comments
      - CRUD-todo.edit-todo.updated_on
  source:
    id: rule-action-specs
    document: .yde/transforms/design/basic/action-specs-derived.yaml
