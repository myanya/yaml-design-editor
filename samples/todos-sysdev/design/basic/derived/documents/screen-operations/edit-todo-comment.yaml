# 生成物（screen-operations-derived）: 手で直さず、業務モデルか生成の定義（design/basic/screen-operations-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-screen-operations.edit-todo-comment
record:
  id: DOC-screen-operations.edit-todo-comment
  value:
    id: edit-todo-comment
    name: コメントを編集する
    kind: operation
    target: todo
    starts:
      - screen: todo
        place: 表「コメント一覧」の行のボタン
    shownWhen: いつも
    row:
      key: row
      label: コメントの番号
      table: comments
      tableLabel: コメント一覧
      carried: 行のボタンが運ぶ（URL のパラメータ）。入力・確認の画面では hidden 項目で持ち回す
    carried:
      version:
        $copy: version
        $of: self
    input:
      screen: edit-todo-comment/input
      request: GET /todo/{id}/edit-todo-comment
      items:
        - key: date
          label: 記録日
          type: common#年月日
          base: date
          description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
          format: yyyy年M月d日
        - key: body
          label: コメント本文
          type: todo-operations#操作の記録
          base: string
          description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
          minLength: 1
          multiline: true
      initial:
        date:
          $copy: comments[$row].date
          $of: self
          $in:
            schemaId: todo-detail
        body:
          $copy: comments[$row].body
          $of: self
          $in:
            schemaId: todo-detail
      submit: changed
    confirm:
      screen: edit-todo-comment/confirm
      request: POST /todo/{id}/edit-todo-comment/confirm
      shows:
        - 記録日
        - コメント本文
      back:
        request: POST /todo/{id}/edit-todo-comment/back
        to: edit-todo-comment/input
    execute:
      request: POST /todo/{id}/edit-todo-comment
      returns: 起点の画面（starts の画面。画面の ID で受け取る）
      notice: edit-todo-comment.done
      refusals:
        - key: edit-todo-comment.version-unchanged
          message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        - key: check.updated-not-before-created
          message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
      onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
    originalRoutes:
      input: GET /todo/{id}/edit-todo-comment
      confirm: POST /todo/{id}/edit-todo-comment/confirm
      back: POST /todo/{id}/edit-todo-comment/back
      execute: POST /todo/{id}/edit-todo-comment
  source:
    id: rule-screen-operations
    document: .yde/transforms/design/basic/screen-operations-derived.yaml
