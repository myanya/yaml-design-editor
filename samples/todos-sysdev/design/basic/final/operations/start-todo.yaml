# 生成物（basic-operations）: 手で直さず、業務モデルか生成の定義（design/basic/basic-operations.yaml）を直して作り直します（CLI generate）。
id: ACT-start-todo
source: start-todo
seq: '08'
kind: action
label: TODOに着手する
description: 未着手の作業を対応中にします。追加の入力はありません。
subject: todo
entity: ENT-todo
receiver: ENT-todo
creates: []
lifecycle: LCY-todo-lifecycle
transition: TRN-todo-lifecycle.start-todo
refusal: 「{id}」は「{state}」なので、「TODOに着手する」はできません（できるのは「未着手」のとき）
inputs:
  - id: PRM-start-todo.version
    key: version
    label: 版
    builtin: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    carried: true
    addedBy: SPC-optimistic-lock
    initial:
      $copy: version
      $of: self
preconditions:
  - id: PRE-start-todo.version-unchanged
    source: version-unchanged
    message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
    addedBy: SPC-optimistic-lock
    rule:
      match:
        - node:
            entity: todo
            bind: t
      where:
        - of: t
          path: version
          equals: $version
      expect: exists
effects:
  - id: EFF-start-todo.01
    op: set
    cause: lifecycle
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: status
    item: FLD-todo.status
    value: IN_PROGRESS
  - id: EFF-start-todo.02
    op: insert
    cause: lifecycle
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: history
    item: FLD-todo.history
    value:
      date:
        $copy: today
        $of: context
      action: start-todo
      from:
        $copy: status
        $of: self
      to: IN_PROGRESS
    written:
      - key: date
        value:
          $copy: today
          $of: context
        base: date
      - key: action
        value: start-todo
        base: enum
      - key: from
        value:
          $copy: status
          $of: self
        base: enum
      - key: to
        value: IN_PROGRESS
        base: enum
  - id: EFF-start-todo.03
    op: set
    cause: auto
    auto: updated
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: updated_on
    item: FLD-todo.updated_on
    value:
      $copy: today
      $of: context
  - id: EFF-start-todo.version
    op: set
    cause: auto
    auto: revision
    subject: todo
    entity: ENT-todo
    path: version
    item: FLD-todo.version
    addedBy: SPC-optimistic-lock
checks:
  - rule: RUL-updated-not-before-created
    items:
      - todo.updated_on
  - rule: RUL-unfinished-has-no-completed-on
    items:
      - todo.status
writes:
  - CRUD-todo.start-todo.status
  - CRUD-todo.start-todo.history
  - CRUD-todo.start-todo.updated_on
