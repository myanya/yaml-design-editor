# 生成物（basic-operations）: 手で直さず、業務モデルか生成の定義（design/basic/basic-operations.yaml）を直して作り直します（CLI generate）。
id: ACT-resume-todo
source: resume-todo
seq: '10'
kind: action
label: TODOを再開する
description: 中断した作業を対応中に戻します。
subject: todo
entity: ENT-todo
receiver: ENT-todo
creates: []
lifecycle: LCY-todo-lifecycle
transition: TRN-todo-lifecycle.resume-todo
refusal: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
history:
  date: $date
  note:
    $copy: note
inputs:
  - id: PRM-resume-todo.date
    key: date
    label: 再開日
    type: TYP-common.年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    required: true
    format: yyyy年M月d日
    initial:
      $copy: today
      $of: context
  - id: PRM-resume-todo.note
    key: note
    label: メモ
    type: TYP-common.文章
    base: string
    multiline: true
preconditions: []
effects:
  - id: EFF-resume-todo.01
    op: set
    cause: lifecycle
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: status
    item: FLD-todo.status
    value: IN_PROGRESS
  - id: EFF-resume-todo.02
    op: insert
    cause: lifecycle
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: history
    item: FLD-todo.history
    value:
      date: $date
      action: resume-todo
      from:
        $copy: status
        $of: self
      to: IN_PROGRESS
      note:
        $copy: note
    written:
      - key: date
        value: $date
        base: date
      - key: action
        value: resume-todo
        base: enum
      - key: from
        value:
          $copy: status
          $of: self
        base: enum
      - key: to
        value: IN_PROGRESS
        base: enum
      - key: note
        value:
          $copy: note
        base: string
  - id: EFF-resume-todo.03
    op: set
    cause: auto
    auto: updated
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: updated_on
    item: FLD-todo.updated_on
    value:
      $copy: today
      $of: context
checks:
  - rule: RUL-updated-not-before-created
    items:
      - todo.updated_on
  - rule: RUL-unfinished-has-no-completed-on
    items:
      - todo.status
writes:
  - CRUD-todo.resume-todo.status
  - CRUD-todo.resume-todo.history
  - CRUD-todo.resume-todo.updated_on
