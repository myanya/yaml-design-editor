# 生成物（basic-operations）: 手で直さず、業務モデルか生成の定義（design/basic/basic-operations.yaml）を直して作り直します（CLI generate）。
id: ACT-edit-todo
source: edit-todo
seq: '07'
kind: action
label: TODOを編集する
description: 現在値を表示し、変更した項目だけを更新します。状態と完了日は変えません（着手・完了・再開・中止の操作で変えます）。空文字への変更と消去は別で、消去は「値を消す」で指定します。
subject: todo
entity: ENT-todo
receiver: ENT-todo
creates: []
submit: changed
inputs:
  - id: PRM-edit-todo.title
    key: title
    label: タイトル
    type: TYP-common.一行の文
    base: string
    minLength: 1
    maxLength: 100
    pattern: ^[^\r\n]*$
    overrides:
      minLength: 1
    initial:
      $copy: title
      $of: self
      $in:
        schemaId: todo-list
  - id: PRM-edit-todo.summary
    key: summary
    label: 概要
    type: TYP-common.一行の文
    base: string
    minLength: 1
    maxLength: 100
    pattern: ^[^\r\n]*$
    overrides:
      minLength: 1
    initial:
      $copy: summary
      $of: self
      $in:
        schemaId: todo-list
  - id: PRM-edit-todo.category
    key: category
    label: カテゴリ
    type: TYP-common.カテゴリ参照
    base: ref
    description: カテゴリ一覧の ID を 1 件。未分類なら省略します。
    clearedBy: clear.category
    reference:
      target: entity
      entity: ENT-category
      entities:
        - ENT-category
      subject: category
      relation: in-category
      title: name
      label: カテゴリ
      idPatternLayers:
        -   - CAT-*
      idPatterns:
        - CAT-*
      scope:
        schemaIds:
          - category-list
        documentIds: []
      schemas:
        - category-list
    initial:
      $copy: category
      $of: self
      $in:
        schemaId: todo-list
  - id: PRM-edit-todo.tags
    key: tags
    label: タグ
    base: array
    description: 入力した並びで全体を置き換えます。
    clearedBy: clear.tags
    unique: true
    item:
      type: TYP-common.タグ参照
      base: ref
      description: タグ一覧の ID を 1 件。
      reference:
        target: entity
        entity: ENT-tag
        entities:
          - ENT-tag
        subject: tag
        relation: tagged
        title: name
        label: タグ
        idPatternLayers:
          -   - TAG-*
        idPatterns:
          - TAG-*
        scope:
          schemaIds:
            - tag-list
          documentIds: []
        schemas:
          - tag-list
    initial:
      $copy: tags
      $of: self
      $in:
        schemaId: todo-list
  - id: PRM-edit-todo.created_on
    key: created_on
    label: 作成日
    type: TYP-common.年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    format: yyyy年M月d日
    initial:
      $copy: created_on
      $of: self
      $in:
        schemaId: todo-detail
  - id: PRM-edit-todo.due_on
    key: due_on
    label: 期限
    type: TYP-common.年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    clearedBy: clear.due_on
    format: yyyy年M月d日
    initial:
      $copy: due_on
      $of: self
      $in:
        schemaId: todo-detail
  - id: PRM-edit-todo.details
    key: details
    label: 詳細
    type: TYP-common.文章
    base: string
    clearedBy: clear.details
    multiline: true
    initial:
      $copy: details
      $of: self
      $in:
        schemaId: todo-detail
  - id: PRM-edit-todo.result
    key: result
    label: 結果・中止理由
    type: TYP-common.文章
    base: string
    clearedBy: clear.result
    multiline: true
    initial:
      $copy: result
      $of: self
      $in:
        schemaId: todo-detail
  - id: PRM-edit-todo.clear
    key: clear
    label: 値を消す
    base: object
    description: チェックした項目を消去します。同じ項目に入力した値より消去が優先します。
    default: {}
    fields:
      - key: category
        label: カテゴリを消す
        builtin: boolean
        base: boolean
      - key: tags
        label: タグを消す
        builtin: boolean
        base: boolean
      - key: due_on
        label: 期限を消す
        builtin: boolean
        base: boolean
      - key: details
        label: 詳細を消す
        builtin: boolean
        base: boolean
      - key: result
        label: 結果・中止理由を消す
        builtin: boolean
        base: boolean
  - id: PRM-edit-todo.version
    key: version
    label: 版
    builtin: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    carried: true
    addedBy: SPC-optimistic-lock
    initial:
      $copy: version
      $of: self
preconditions:
  - id: PRE-edit-todo.version-unchanged
    source: version-unchanged
    message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
    addedBy: SPC-optimistic-lock
    rule:
      match:
        - node:
            entity: todo
            bind: t
      where:
        - of: t
          path: version
          equals: $version
      expect: exists
effects:
  - id: EFF-edit-todo.01
    op: set
    cause: do
    of: self
    subject: todo
    entity: ENT-todo
    schema: todo-list
    path: title
    item: FLD-todo.title
    when:
      - path: title
        exists: true
    value: $title
  - id: EFF-edit-todo.02
    op: set
    cause: do
    of: self
    subject: todo
    entity: ENT-todo
    schema: todo-list
    path: summary
    item: FLD-todo.summary
    when:
      - path: summary
        exists: true
