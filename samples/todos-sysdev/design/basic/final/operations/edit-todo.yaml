  - id: EFF-edit-todo.09
    op: delete
    cause: do
    of: self
    subject: todo
    entity: ENT-todo
    schema: todo-list
    path: category
    item: FLD-todo.category
    when:
      - path: clear.category
        equals: true
  - id: EFF-edit-todo.10
    op: delete
    cause: do
    of: self
    subject: todo
    entity: ENT-todo
    schema: todo-list
    path: tags
    item: FLD-todo.tags
