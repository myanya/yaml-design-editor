checks:
  - rule: RUL-due-not-before-created
    items:
      - todo.due_on
      - todo.created_on
    params:
      - PRM-edit-todo.due_on
      - PRM-edit-todo.created_on
  - rule: RUL-updated-not-before-created
    items:
      - todo.updated_on
      - todo.created_on
    params:
      - PRM-edit-todo.created_on
  - rule: RUL-completed-not-before-created
    items:
      - todo.created_on
    params:
      - PRM-edit-todo.created_on
  - rule: RUL-closed-has-result
    items:
      - todo.result
    params:
      - PRM-edit-todo.result
  - rule: RUL-in-category.outMax
    items:
      - todo.category
    multiple: false
    params:
      - PRM-edit-todo.category
  - rule: RUL-in-category.types
    items:
      - todo.category
    multiple: false
    params:
      - PRM-edit-todo.category
  - rule: RUL-tagged.types
