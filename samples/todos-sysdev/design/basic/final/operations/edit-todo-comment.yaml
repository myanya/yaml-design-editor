# 生成物（basic-operations）: 手で直さず、業務モデルか生成の定義（design/basic/basic-operations.yaml）を直して作り直します（CLI generate）。
id: ACT-edit-todo-comment
source: edit-todo-comment
seq: '04'
kind: action
label: コメントを編集する
description: TODOの個票のコメント 1 件の、記録日と本文を直します。変更した項目だけを更新します。
subject: todo
entity: ENT-todo
receiver: ENT-todo
creates: []
submit: changed
row:
  param: PRM-edit-todo-comment.row
  item: FLD-todo.comments
inputs:
  - id: PRM-edit-todo-comment.row
    key: row
    label: コメントの番号
    builtin: int
    base: int
    description: コメント一覧の何番目か（0 から数えます）
    required: true
    min: 0.0
    overrides:
      min: 0.0
  - id: PRM-edit-todo-comment.date
    key: date
    label: 記録日
    type: TYP-common.年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    format: yyyy年M月d日
    initial:
      $copy: comments[$row].date
      $of: self
      $in:
        schemaId: todo-detail
  - id: PRM-edit-todo-comment.body
    key: body
    label: コメント本文
    type: TYP-todo-operations.操作の記録
    base: string
    description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
    minLength: 1
    multiline: true
    initial:
      $copy: comments[$row].body
      $of: self
      $in:
        schemaId: todo-detail
  - id: PRM-edit-todo-comment.version
    key: version
    label: 版
    builtin: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    carried: true
    addedBy: SPC-optimistic-lock
    initial:
      $copy: version
      $of: self
preconditions:
  - id: PRE-edit-todo-comment.version-unchanged
    source: version-unchanged
    message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
    addedBy: SPC-optimistic-lock
    rule:
      match:
        - node:
            entity: todo
            bind: t
      where:
        - of: t
          path: version
          equals: $version
      expect: exists
effects:
  - id: EFF-edit-todo-comment.01
    op: set
    cause: do
    of: self
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: comments[$row].date
    item: FLD-todo.comments
    row: PRM-edit-todo-comment.row
    when:
      - path: date
        exists: true
    value: $date
    written:
      - key: date
        value: $date
        base: date
  - id: EFF-edit-todo-comment.02
    op: set
    cause: do
    of: self
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: comments[$row].body
    item: FLD-todo.comments
    row: PRM-edit-todo-comment.row
    when:
      - path: body
        exists: true
    value: $body
    written:
      - key: body
        value: $body
        base: string
  - id: EFF-edit-todo-comment.03
    op: set
    cause: auto
    auto: updated
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: updated_on
    item: FLD-todo.updated_on
    value:
      $copy: today
      $of: context
  - id: EFF-edit-todo-comment.version
    op: set
    cause: auto
    auto: revision
    subject: todo
    entity: ENT-todo
    path: version
    item: FLD-todo.version
    addedBy: SPC-optimistic-lock
checks:
  - rule: RUL-updated-not-before-created
    items:
      - todo.updated_on
writes:
  - CRUD-todo.edit-todo-comment.comments
  - CRUD-todo.edit-todo-comment.updated_on
