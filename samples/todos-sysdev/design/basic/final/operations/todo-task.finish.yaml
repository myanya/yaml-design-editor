# 生成物（basic-operations）: 手で直さず、業務モデルか生成の定義（design/basic/basic-operations.yaml）を直して作り直します（CLI generate）。
id: ACT-todo-task.finish
source: todo-task.finish
seq: '15'
kind: method
label: 作業項目を済にする
subject: todo-task
entity: ENT-todo-task
receiver: ENT-todo-task
creates: []
inputs:
  - id: PRM-todo-task.finish.version
    key: version
    label: 版
    builtin: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    carried: true
    addedBy: SPC-optimistic-lock
    initial:
      $copy: version
      $of: owner
preconditions:
  - id: PRE-todo-task.finish.version-unchanged
    source: version-unchanged
    message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
    addedBy: SPC-optimistic-lock
    rule:
      match:
        - node:
            entity: todo
            bind: owner
        - edge:
            contains: true
        - node:
            entity: todo-task
            bind: t
      where:
        - of: owner
          path: version
          equals: $version
      expect: exists
effects:
  - id: EFF-todo-task.finish.01
    op: set
    cause: do
    within: todo-task
    subject: todo-task
    entity: ENT-todo-task
    schema: todo-detail
    path: done
    item: FLD-todo-task.done
    value: true
  - id: EFF-todo-task.finish.02
    op: set
    cause: auto
    auto: updated
    subject: todo
    entity: ENT-todo
    schema: todo-detail
    path: updated_on
    item: FLD-todo.updated_on
    value:
      $copy: today
      $of: context
  - id: EFF-todo-task.finish.version
    op: set
    cause: auto
    auto: revision
    subject: todo
    entity: ENT-todo
    path: version
    item: FLD-todo.version
    addedBy: SPC-optimistic-lock
checks:
  - rule: RUL-updated-not-before-created
    items:
      - todo.updated_on
  - rule: RUL-closed-has-no-open-task
    items:
      - todo-task.done
writes:
  - CRUD-todo.todo-task.finish.tasks
  - CRUD-todo.todo-task.finish.updated_on
  - CRUD-todo-task.todo-task.finish.done
