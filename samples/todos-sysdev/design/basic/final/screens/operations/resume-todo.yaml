# 生成物（screen-operations）: 手で直さず、業務モデルか生成の定義（design/basic/screen-operations.yaml）を直して作り直します（CLI generate）。
id: resume-todo
name: TODOを再開する
kind: operation
target: todo
starts:
  - screen: todo-dashboard
    place: 区画「期限超過」の行のボタン
  - screen: todo-dashboard
    place: 区画「すべてのTODO」の行のボタン
  - screen: todo
    place: 画面のボタン
shownWhen:
  - value: SUSPENDED
    label: 中断
carried:
  version:
    $copy: version
    $of: self
input:
  screen: resume-todo/input
  request: GET /todo/{id}/resume-todo
  items:
    - key: date
      label: 再開日
      type: common#年月日
      base: date
      description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
      required: true
      format: yyyy年M月d日
    - key: note
      label: メモ
      type: common#文章
      base: string
      multiline: true
  initial:
    date:
      $copy: today
      $of: context
confirm:
  screen: resume-todo/confirm
  request: POST /todo/{id}/resume-todo/confirm
  shows:
    - 再開日
    - メモ
  stateChange:
    - from:
        - 中断
      to: 対応中
  back:
    request: POST /todo/{id}/resume-todo/back
    to: resume-todo/input
execute:
  request: POST /todo/{id}/resume-todo
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: resume-todo.done
  refusals:
    - key: resume-todo.state
      message: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
    - key: resume-todo.version-unchanged
      message: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
    - key: check.updated-not-before-created
      message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
    - key: check.unfinished-has-no-completed-on
      message: 完了していない TODO「{id}」に完了日が残っています
  onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
originalRoutes:
  input: GET /todo/{id}/resume-todo
  confirm: POST /todo/{id}/resume-todo/confirm
  back: POST /todo/{id}/resume-todo/back
  execute: POST /todo/{id}/resume-todo
designId: DOC-screen-operations.resume-todo
designKind: screen-operations
designPath: design/basic/final/screens/operations/resume-todo.yaml
origins:
  source:
    id: rule-screen-operations
    document: .yde/transforms/design/basic/screen-operations-derived.yaml
    path: []
  decisions: []
  inputs: []
