# 生成物（screen-operations）: 手で直さず、業務モデルか生成の定義（design/basic/screen-operations.yaml）を直して作り直します（CLI generate）。
id: add-todo-task
name: 作業項目を追加する
kind: operation
target: todo
starts:
  - screen: todo-dashboard
    place: 区画「期限超過」の行のボタン
  - screen: todo-dashboard
    place: 区画「すべてのTODO」の行のボタン
  - screen: todo
    place: 画面のボタン
shownWhen: いつも
input:
  screen: add-todo-task/input
  request: GET /todo/{id}/add-todo-task
  items:
    - key: title
      label: 作業
      type: common#一行の文
      base: string
      required: true
      minLength: 1
      maxLength: 100
      pattern: ^[^\r\n]*$
      overrides:
        minLength: 1
confirm:
  screen: add-todo-task/confirm
  request: POST /todo/{id}/add-todo-task/confirm
  shows:
    - 作業
  back:
    request: POST /todo/{id}/add-todo-task/back
    to: add-todo-task/input
execute:
  request: POST /todo/{id}/add-todo-task
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: add-todo-task.done
  refusals:
    - key: add-todo-task.active
      message: '{id} は完了か中止をしているので、作業項目を足せません'
    - key: check.updated-not-before-created
      message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
    - key: check.closed-has-no-open-task
      message: 完了したTODO「{id}」に、済んでいない作業項目があります
  onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
originalRoutes:
  input: GET /todo/{id}/add-todo-task
  confirm: POST /todo/{id}/add-todo-task/confirm
  back: POST /todo/{id}/add-todo-task/back
  execute: POST /todo/{id}/add-todo-task
designId: DOC-screen-operations.add-todo-task
designKind: screen-operations
designPath: design/basic/final/screens/operations/add-todo-task.yaml
origins:
  source:
    id: rule-screen-operations
    document: .yde/transforms/design/basic/screen-operations-derived.yaml
    path: []
  decisions: []
  inputs: []
