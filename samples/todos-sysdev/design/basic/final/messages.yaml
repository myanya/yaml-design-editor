# 生成物（basic-messages）: 手で直さず、業務モデルか生成の定義（design/basic/basic-messages.yaml）を直して作り直します（CLI generate）。
documentId: SYS-basic-messages
holes:
  - name: id
    means: 受け手の ID（作る操作は作った要素の ID。データの決まりは、決まりの起点の要素の ID）
  - name: state
    means: 受け手の今の状態の名前
  - name: left
    means: データの決まりの check の左の値（画面の表示の形）
  - name: right
    means: データの決まりの check の右の値（画面の表示の形）
  - name: 'no'
    means: 受付番号（ログと突き合わせる）
messages:
  - id: MSG-start-todo.state
    key: start-todo.state
    kind: 状態の断り
    text: 「{id}」は「{state}」なので、「TODOに着手する」はできません（できるのは「未着手」のとき）
    source: TRN-todo-lifecycle.start-todo
  - id: MSG-suspend-todo.state
    key: suspend-todo.state
    kind: 状態の断り
    text: 「{id}」は「{state}」なので、「TODOを中断する」はできません（できるのは「対応中」のとき）
    source: TRN-todo-lifecycle.suspend-todo
  - id: MSG-resume-todo.state
    key: resume-todo.state
    kind: 状態の断り
    text: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
    source: TRN-todo-lifecycle.resume-todo
  - id: MSG-complete-todo.state
    key: complete-todo.state
    kind: 状態の断り
    text: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
    source: TRN-todo-lifecycle.complete-todo
  - id: MSG-cancel-todo.state
    key: cancel-todo.state
    kind: 状態の断り
    text: 「{id}」は「{state}」なので、「TODOを中止する」はできません（できるのは「未完了」のとき）
