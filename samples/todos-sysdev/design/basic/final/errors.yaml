# 生成物（basic-errors）: 手で直さず、業務モデルか生成の定義（design/basic/basic-errors.yaml）を直して作り直します（CLI generate）。
documentId: SYS-basic-errors
kinds:
  - id: ERK-input
    label: 入力の誤り
    when: 確認へを押したとき（入力の検査）
    shownAt: 入力画面（欄の横と、上のまとめ）
  - id: ERK-input-rule
    label: 受け取る値が原因のデータの決まりの違反
    when: 確認へを押したとき（書く前に確かめる）と、確定のとき
    shownAt: 入力画面（欄の横と、上のまとめ）と、確認画面の断りの文
  - id: ERK-state
    label: 状態の断り
    when: 確定のとき
    shownAt: 確認画面の断りの文
  - id: ERK-precondition
    label: 前提の断り
    when: 確定のとき
    shownAt: 確認画面の断りの文
  - id: ERK-rule
    label: データの決まりの違反
    when: 確定のとき（書いた後の値で）
    shownAt: 確認画面の断りの文
  - id: ERK-empty
    label: 絞り込みの結果が 0 件（正常）
    when: 一覧画面を出すとき
    shownAt: 一覧画面の表の代わりの文
  - id: ERK-not-found
    label: ID を指定して見つからない
    when: 詳細画面・操作の画面で受け手を読んだとき
    shownAt: 見つからない画面
  - id: ERK-token
    label: 二重の確定・時間切れ
    when: 確定のとき（確認画面を経ていない・確定済み・時間切れ）
    shownAt: 起点の画面へ戻し、知らせで出す
  - id: ERK-unexpected
    label: 想定外
    when: いつでも
    shownAt: エラー画面（受付番号だけ。中身は出さない）
