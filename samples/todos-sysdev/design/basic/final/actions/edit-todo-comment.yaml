# 生成物（action-specs）: 手で直さず、業務モデルか生成の定義（design/basic/action-specs.yaml）を直して作り直します（CLI generate）。
id: edit-todo-comment
name: コメントを編集する
description: TODOの個票のコメント 1 件の、記録日と本文を直します。変更した項目だけを更新します。
kind: action
subject: todo
inputs:
  - key: row
    label: コメントの番号
    type: int
    base: int
    description: コメント一覧の何番目か（0 から数えます）
    required: true
    min: 0.0
    overrides:
      min: 0.0
    builtinType:
      name: int
      base: int
      builtin: true
  - key: date
    label: 記録日
    type: common#年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    format: yyyy年M月d日
  - key: body
    label: コメント本文
    type: todo-operations#操作の記録
    base: string
    description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
    minLength: 1
    multiline: true
initial:
  date:
    $copy: comments[$row].date
    $of: self
    $in:
      schemaId: todo-detail
  body:
    $copy: comments[$row].body
    $of: self
    $in:
      schemaId: todo-detail
preconditions: []
effects:
  - op: set
    schema: todo-detail
    path: comments[$row].date
    value: $date
    of: self
    when:
      - path: date
        exists: true
    source: do
    entity: todo
    field:
      key: comments
      base: array
      item:
        base: object
    row:
      param: row
    written:
      - key: date
        value: $date
        base: date
  - op: set
    schema: todo-detail
    path: comments[$row].body
    value: $body
    of: self
    when:
      - path: body
        exists: true
    source: do
    entity: todo
    field:
      key: comments
      base: array
      item:
        base: object
    row:
      param: row
    written:
      - key: body
        value: $body
        base: string
  - op: set
    schema: todo-detail
    path: updated_on
    value:
      $copy: today
      $of: context
    source: auto
    auto: updated
    entity: todo
    field:
      key: updated_on
      base: date
receiver:
  entity: todo
inputPolicy:
  submit: changed
  initial:
    date:
      $copy: comments[$row].date
      $of: self
      $in:
        schemaId: todo-detail
    body:
      $copy: comments[$row].body
      $of: self
      $in:
        schemaId: todo-detail
checks:
  - constraint: updated-not-before-created
    form: element
    level: error
    items:
      - todo.updated_on
writes:
  - CRUD-todo.edit-todo-comment.comments
  - CRUD-todo.edit-todo-comment.updated_on
designId: DOC-action-specs.edit-todo-comment
designKind: action-specs
designPath: design/basic/final/actions/edit-todo-comment.yaml
origins:
  source:
    id: rule-action-specs
    document: .yde/transforms/design/basic/action-specs-derived.yaml
    path: []
  decisions: []
  inputs: []
