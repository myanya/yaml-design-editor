# 生成物（action-specs）: 手で直さず、業務モデルか生成の定義（design/basic/action-specs.yaml）を直して作り直します（CLI generate）。
id: resume-todo
name: TODOを再開する
description: 中断した作業を対応中に戻します。
kind: action
subject: todo
inputs:
  - key: date
    label: 再開日
    type: common#年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    required: true
    format: yyyy年M月d日
  - key: note
    label: メモ
    type: common#文章
    base: string
    multiline: true
initial:
  date:
    $copy: today
    $of: context
state:
  id: todo-lifecycle
  transitions:
    - from:
        - id: todo-SUSPENDED
          label: 中断
          value: SUSPENDED
      to:
        id: todo-IN_PROGRESS
        label: 対応中
        value: IN_PROGRESS
  refusal: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
  history:
    date: $date
    note:
      $copy: note
preconditions: []
effects:
  - op: set
    schema: todo-detail
    path: status
    value: IN_PROGRESS
    source: lifecycle
    entity: todo
    field:
      key: status
      base: enum
  - op: insert
    schema: todo-detail
    path: history
    value:
      date: $date
      action: resume-todo
      from:
        $copy: status
        $of: self
      to: IN_PROGRESS
      note:
        $copy: note
    source: lifecycle
    entity: todo
    field:
      key: history
      base: array
      item:
        base: object
    written:
      - key: date
        value: $date
        base: date
      - key: action
        value: resume-todo
        base: enum
      - key: from
        value:
          $copy: status
          $of: self
        base: enum
      - key: to
        value: IN_PROGRESS
        base: enum
      - key: note
        value:
          $copy: note
        base: string
  - op: set
    schema: todo-detail
    path: updated_on
    value:
      $copy: today
      $of: context
    source: auto
    auto: updated
    entity: todo
    field:
      key: updated_on
      base: date
receiver:
  entity: todo
inputPolicy:
  initial:
    date:
      $copy: today
      $of: context
checks:
  - constraint: updated-not-before-created
    form: element
    level: error
    items:
      - todo.updated_on
  - constraint: unfinished-has-no-completed-on
    form: element
    level: error
    items:
      - todo.status
writes:
  - CRUD-todo.resume-todo.status
  - CRUD-todo.resume-todo.history
  - CRUD-todo.resume-todo.updated_on
designId: DOC-action-specs.resume-todo
designKind: action-specs
designPath: design/basic/final/actions/resume-todo.yaml
origins:
  source:
    id: rule-action-specs
    document: .yde/transforms/design/basic/action-specs-derived.yaml
    path: []
  decisions: []
  inputs: []
