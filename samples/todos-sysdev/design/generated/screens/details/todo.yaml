# 生成物（screen-details）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/screen-details.yaml）を直して作り直します（CLI generate）。
id: todo
name: TODO詳細
kind: detail
url: /todo/{id}
items:
  - key: id
    label: ID
    type: common#TODO番号
  - key: title
    label: タイトル
    type: common#一行の文
  - key: summary
    label: 概要
    type: common#一行の文
  - key: category
    label: カテゴリ
    type: common#カテゴリ参照
    link: category
  - key: tags
    label: タグ
    type: array
    many: true
    link: tag
  - key: follows
    label: 元のTODO
    type: common#TODO参照
    link: todo
  - key: status
    label: ステータス
    type: common#ステータス
  - key: created_on
    label: 作成日
    type: common#年月日
  - key: updated_on
    label: 更新日
    type: common#年月日
  - key: updated_by
    label: 更新者
    type: 利用者ID
  - key: due_on
    label: 期限
    type: common#年月日
  - key: completed_on
    label: 完了日
    type: common#年月日
  - key: details
    label: 詳細
    type: common#文章
  - key: result
    label: 結果
    type: common#文章
tables:
  - item: comments
    label: コメント一覧
    columns:
      - 日付
      - コメント本文
  - item: history
    label: 状態の履歴
    columns:
      - 日付
      - 操作
      - 前の状態
      - 後の状態
      - 理由
      - 再開予定日
  - item: tasks
    label: 作業項目
    entity: todo-task
    columns:
      - ID
      - 作業
      - 済
    rowButtons:
      - operation: todo-task.finish
        label: 作業項目を済にする
        shownWhen: いつも
        to: todo-task.finish/confirm
buttons:
  - operation: add-todo-comment
    label: TODOにコメントを追加する
    shownWhen: いつも
    to: add-todo-comment/input
  - operation: add-todo-task
    label: 作業項目を追加する
    shownWhen: いつも
    to: add-todo-task/input
  - operation: edit-todo
    label: TODOを編集する
    shownWhen: いつも
    to: edit-todo/input
  - operation: start-todo
    label: TODOに着手する
    shownWhen:
      - value: OPEN
        label: 未着手
    to: start-todo/confirm
  - operation: suspend-todo
    label: TODOを中断する
    shownWhen:
      - value: IN_PROGRESS
        label: 対応中
    to: suspend-todo/input
  - operation: resume-todo
    label: TODOを再開する
    shownWhen:
      - value: SUSPENDED
        label: 中断
    to: resume-todo/input
  - operation: complete-todo
    label: TODOを完了する
    shownWhen:
      - value: IN_PROGRESS
        label: 対応中
    to: complete-todo/input
  - operation: cancel-todo
    label: TODOを中止する
    shownWhen:
      - value: OPEN
        label: 未着手
      - value: IN_PROGRESS
        label: 対応中
      - value: SUSPENDED
        label: 中断
    to: cancel-todo/input
