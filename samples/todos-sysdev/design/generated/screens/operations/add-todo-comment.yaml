# 生成物（screen-operations）: 手で直さず、業務モデルか生成の定義（design/screen-operations.yaml）を直して作り直します（CLI generate）。
id: add-todo-comment
name: TODOにコメントを追加する
kind: operation
target: todo
starts:
  - screen: todo-dashboard
    place: 区画「期限超過」の行のボタン
  - screen: todo-dashboard
    place: 区画「すべてのTODO」の行のボタン
  - screen: todo
    place: 画面のボタン
shownWhen: いつも
input:
  screen: add-todo-comment/input
  request: GET /todo/{id}/add-todo-comment
  items:
    - key: date
      label: 記録日
      type: common#年月日
      base: date
      required: true
    - key: body
      label: コメント本文
      type: todo-operations#操作の記録
      base: string
      required: true
      minLength: 1
      multiline: true
  initial:
    date:
      $copy: today
      $of: context
confirm:
  screen: add-todo-comment/confirm
  request: POST /todo/{id}/add-todo-comment/confirm
  shows:
    - 記録日
    - コメント本文
  back:
    request: POST /todo/{id}/add-todo-comment/back
    to: add-todo-comment/input
execute:
  request: POST /todo/{id}/add-todo-comment
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: add-todo-comment.done
  refusals: []
  onRefusal: 確認画面に断りの文を出す
