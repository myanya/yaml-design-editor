# 生成物（screen-operations）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/screen-operations.yaml）を直して作り直します（CLI generate）。
id: start-todo
name: TODOに着手する
kind: operation
target: todo
starts:
  - screen: todo-dashboard
    place: 区画「期限超過」の行のボタン
  - screen: todo-dashboard
    place: 区画「すべてのTODO」の行のボタン
  - screen: todo
    place: 画面のボタン
shownWhen:
  - value: OPEN
    label: 未着手
confirm:
  screen: start-todo/confirm
  request: GET /todo/{id}/start-todo/confirm
  shows: []
  stateChange:
    - from:
        - 未着手
      to: 対応中
execute:
  request: POST /todo/{id}/start-todo
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: start-todo.done
  refusals:
    - key: start-todo.state
      message: 「{id}」は「{state}」なので、「TODOに着手する」はできません（できるのは「未着手」のとき）
    - key: check.updated-not-before-created
      message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
    - key: check.unfinished-has-no-completed-on
      message: 完了していない TODO「{id}」に完了日が残っています
  onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
