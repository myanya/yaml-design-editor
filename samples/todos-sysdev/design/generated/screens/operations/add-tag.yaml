# 生成物（screen-operations）: 手で直さず、業務モデルか生成の定義（design/screen-operations.yaml）を直して作り直します（CLI generate）。
id: add-tag
name: タグを追加する
kind: operation
starts:
  - screen: todo-dashboard
    place: 上部のボタン
shownWhen: いつも
input:
  screen: add-tag/input
  request: GET /tag/add-tag
  items:
    - key: name
      label: タグ名
      type: common#一行の文
      base: string
      required: true
      minLength: 1
      maxLength: 100
      pattern: ^[^\r\n]*$
confirm:
  screen: add-tag/confirm
  request: POST /tag/add-tag/confirm
  shows:
    - タグ名
  back:
    request: POST /tag/add-tag/back
    to: add-tag/input
execute:
  request: POST /tag/add-tag
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: add-tag.done
  refusals: []
  onRefusal: 確認画面に断りの文を出す
