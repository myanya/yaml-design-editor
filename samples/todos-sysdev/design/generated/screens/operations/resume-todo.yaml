# 生成物（screen-operations）: 手で直さず、業務モデルか生成の定義（design/screen-operations.yaml）を直して作り直します（CLI generate）。
id: resume-todo
name: TODOを再開する
kind: operation
target: todo
starts:
  - screen: todo-dashboard
    place: 区画「期限超過」の行のボタン
  - screen: todo-dashboard
    place: 区画「すべてのTODO」の行のボタン
  - screen: todo
    place: 画面のボタン
shownWhen:
  - value: SUSPENDED
    label: 中断
input:
  screen: resume-todo/input
  request: GET /todo/{id}/resume-todo
  items:
    - key: date
      label: 再開日
      type: common#年月日
      base: date
      required: true
    - key: note
      label: メモ
      type: common#文章
      base: string
      multiline: true
  initial:
    date:
      $copy: today
      $of: context
confirm:
  screen: resume-todo/confirm
  request: POST /todo/{id}/resume-todo/confirm
  shows:
    - 再開日
    - メモ
  stateChange:
    - from:
        - 中断
      to: 対応中
  back:
    request: POST /todo/{id}/resume-todo/back
    to: resume-todo/input
execute:
  request: POST /todo/{id}/resume-todo
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: resume-todo.done
  refusals:
    - key: resume-todo.state
      message: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
  onRefusal: 確認画面に断りの文を出す
