# 生成物（screen-operations）: 手で直さず、業務モデルか生成の定義（design/screen-operations.yaml）を直して作り直します（CLI generate）。
id: complete-todo
name: TODOを完了する
kind: operation
target: todo
starts:
  - screen: todo-dashboard
    place: 区画「期限超過」の行のボタン
  - screen: todo-dashboard
    place: 区画「すべてのTODO」の行のボタン
  - screen: todo
    place: 画面のボタン
shownWhen:
  - value: IN_PROGRESS
    label: 対応中
input:
  screen: complete-todo/input
  request: GET /todo/{id}/complete-todo
  items:
    - key: date
      label: 完了日
      type: common#年月日
      base: date
      description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
      required: true
      format: yyyy年M月d日
    - key: result
      label: 完了結果
      type: todo-operations#操作の記録
      base: string
      description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
      required: true
      minLength: 1
      multiline: true
  initial:
    date:
      $copy: today
      $of: context
confirm:
  screen: complete-todo/confirm
  request: POST /todo/{id}/complete-todo/confirm
  shows:
    - 完了日
    - 完了結果
  stateChange:
    - from:
        - 対応中
      to: 完了
  back:
    request: POST /todo/{id}/complete-todo/back
    to: complete-todo/input
execute:
  request: POST /todo/{id}/complete-todo
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: complete-todo.done
  refusals:
    - key: complete-todo.state
      message: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
    - key: complete-todo.no-open-task
      message: '{id} には済んでいない作業項目があります（済にしてから完了します）'
    - key: check.updated-not-before-created
      message: TODO「{id}」の更新日（{left}）が、作成日（{right}）より前です
    - key: check.completed-not-before-created
      message: TODO「{id}」の完了日（{left}）が、作成日（{right}）より前です
    - key: check.closed-has-completed-on
      message: 完了した TODO「{id}」に完了日がありません
    - key: check.closed-has-result
      message: 完了した TODO「{id}」に結果がありません
    - key: check.closed-has-no-open-task
      message: 完了したTODO「{id}」に、済んでいない作業項目があります
  onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
originalRoutes:
  input: GET /todo/{id}/complete-todo
  confirm: POST /todo/{id}/complete-todo/confirm
  back: POST /todo/{id}/complete-todo/back
  execute: POST /todo/{id}/complete-todo
designId: DOC-screen-operations.complete-todo
designKind: screen-operations
designPath: design/generated/screens/operations/complete-todo.yaml
origins:
  source:
    id: rule-screen-operations
    document: .yde/transforms/design/screen-operations-derived.yaml
    path: []
  decisions: []
  inputs: []
