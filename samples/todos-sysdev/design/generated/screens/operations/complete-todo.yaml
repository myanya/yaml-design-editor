# 生成物（screen-operations）: 手で直さず、業務モデルか生成の定義（design/screen-operations.yaml）を直して作り直します（CLI generate）。
id: complete-todo
name: TODOを完了する
kind: operation
target: todo
starts:
  - screen: todo-dashboard
    place: 区画「期限超過」の行のボタン
  - screen: todo-dashboard
    place: 区画「すべてのTODO」の行のボタン
  - screen: todo
    place: 画面のボタン
shownWhen:
  - value: IN_PROGRESS
    label: 対応中
input:
  screen: complete-todo/input
  request: GET /todo/{id}/complete-todo
  items:
    - key: date
      label: 完了日
      type: common#年月日
      base: date
      required: true
    - key: result
      label: 完了結果
      type: todo-operations#操作の記録
      base: string
      required: true
      minLength: 1
      multiline: true
  initial:
    date:
      $copy: today
      $of: context
confirm:
  screen: complete-todo/confirm
  request: POST /todo/{id}/complete-todo/confirm
  shows:
    - 完了日
    - 完了結果
  stateChange:
    - from:
        - 対応中
      to: 完了
  back:
    request: POST /todo/{id}/complete-todo/back
    to: complete-todo/input
execute:
  request: POST /todo/{id}/complete-todo
  returns: 起点の画面（starts の画面。画面の ID で受け取る）
  notice: complete-todo.done
  refusals:
    - key: complete-todo.state
      message: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
    - key: complete-todo.no-open-task
      message: '{id} には済んでいない作業項目があります（済にしてから完了します）'
  onRefusal: 確認画面に断りの文を出す
