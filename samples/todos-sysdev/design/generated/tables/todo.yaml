# 生成物（table-designs）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/table-designs.yaml）を直して作り直します（CLI generate）。
id: todo
name: TODOのテーブル
tables:
  - name: todo
    kind: main
    class: Todo
    columns:
      - name: id
        item: id
        label: ID
        type: VARCHAR
        notNull: true
        primaryKey: true
        java:
          name: id
          type: String
      - name: title
        item: title
        label: タイトル
        type: VARCHAR(100)
        notNull: true
        java:
          name: title
          type: String
      - name: summary
        item: summary
        label: 概要
        type: VARCHAR(100)
        notNull: true
        java:
          name: summary
          type: String
      - name: category
        item: category
        label: カテゴリ
        type: VARCHAR
        references:
          table: category
          column: id
        java:
          name: category
          type: String
      - name: follows
        item: follows
        label: 元のTODO
        type: VARCHAR
        references:
          table: todo
          column: id
        java:
          name: follows
          type: String
      - name: status
        item: status
        label: ステータス
        type: VARCHAR
        notNull: true
        default: OPEN
        check:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
          - CLOSED
          - CANCELED
        java:
          name: status
          type: TodoStatus
      - name: created_on
        item: created_on
        label: 作成日
        type: DATE
        notNull: true
        java:
          name: createdOn
          type: LocalDate
      - name: updated_on
        item: updated_on
        label: 更新日
        type: DATE
        notNull: true
        java:
          name: updatedOn
          type: LocalDate
      - name: updated_by
        item: updated_by
        label: 更新者
        type: VARCHAR(50)
        notNull: true
        java:
          name: updatedBy
          type: String
        origin: 基本設計「更新者を記録する」（audit-updated-by）
      - name: due_on
        item: due_on
        label: 期限
        type: DATE
        java:
          name: dueOn
          type: LocalDate
      - name: completed_on
        item: completed_on
        label: 完了日
        type: DATE
        java:
          name: completedOn
          type: LocalDate
      - name: details
        item: details
        label: 詳細
        type: VARCHAR
        java:
          name: details
          type: String
      - name: result
        item: result
        label: 結果
        type: VARCHAR
        java:
          name: result
          type: String
    primaryKey:
      - id
  - name: todo_tags
    kind: link
    item: tags
    label: タグ
    class: TodoTags
    columns:
      - name: todo_id
        label: 親の ID
        type: VARCHAR
        notNull: true
        references:
          table: todo
          column: id
        java:
          name: todoId
          type: String
      - name: seq
        label: 並び順（業務モデルの配列の順。1 から）
        type: INTEGER
        notNull: true
        java:
          name: seq
          type: int
      - name: tag_id
        type: VARCHAR
        notNull: true
        references:
          table: tag
          column: id
        java:
          name: tagId
          type: String
    primaryKey:
      - todo_id
      - seq
    unique:
      -   - todo_id
          - tag_id
  - name: todo_comments
    kind: detail
    item: comments
    label: コメント一覧
    class: TodoComments
    columns:
      - name: todo_id
        label: 親の ID
        type: VARCHAR
        notNull: true
        references:
          table: todo
          column: id
        java:
          name: todoId
          type: String
      - name: seq
        label: 並び順（業務モデルの配列の順。1 から）
        type: INTEGER
        notNull: true
        java:
          name: seq
          type: int
      - name: date
        item: date
        label: 日付
        type: DATE
        notNull: true
        java:
          name: date
          type: LocalDate
      - name: body
        item: body
        label: コメント本文
        type: VARCHAR
        notNull: true
        java:
          name: body
          type: String
    primaryKey:
      - todo_id
      - seq
  - name: todo_history
    kind: detail
    item: history
    label: 状態の履歴
    class: TodoHistory
    columns:
      - name: todo_id
        label: 親の ID
        type: VARCHAR
        notNull: true
        references:
          table: todo
          column: id
        java:
          name: todoId
          type: String
      - name: seq
        label: 並び順（業務モデルの配列の順。1 から）
        type: INTEGER
        notNull: true
        java:
          name: seq
          type: int
      - name: date
        item: date
        label: 日付
        type: DATE
        notNull: true
        java:
          name: date
          type: LocalDate
      - name: action
        item: action
        label: 操作
        type: VARCHAR
        notNull: true
        check:
          - register-todo
          - start-todo
          - complete-todo
          - suspend-todo
          - resume-todo
          - cancel-todo
        java:
          name: action
          type: String
      - name: from_
        item: from
        label: 前の状態
        type: VARCHAR
        check:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
          - CLOSED
          - CANCELED
        java:
          name: from
          type: TodoStatus
      - name: to_
        item: to
        label: 後の状態
        type: VARCHAR
        notNull: true
        check:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
          - CLOSED
          - CANCELED
        java:
          name: to
          type: TodoStatus
      - name: note
        item: note
        label: 理由
        type: VARCHAR
        java:
          name: note
          type: String
      - name: resume_on
        item: resume_on
        label: 再開予定日
        type: DATE
        java:
          name: resumeOn
          type: LocalDate
    primaryKey:
      - todo_id
      - seq
