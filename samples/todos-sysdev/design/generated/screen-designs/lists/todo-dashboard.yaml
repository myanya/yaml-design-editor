# 生成物（screen-designs-lists）: 手で直さず、業務モデルか生成の定義（design/screen-designs-lists.yaml）を直して作り直します（CLI generate）。
id: todo-dashboard
name: TODOダッシュボード（画面設計書）
screens:
  - id: todo-dashboard
    template: todo-dashboard/list
    page:
      title: TODOダッシュボード
      width: l
      body:
        - notice:
            kind: done
        - filters:
            action: GET /
            body:
              - choices:
                  item: tags
                  label: タグ
                  control: checkboxes
                  candidates:
                    entity: tag
                    name: name
                    read: TagMapper.selectAll
                    empty: 未選択（絞らない）
              - field:
                  item: category
                  label: カテゴリ
                  control: select
                  candidates:
                    entity: category
                    name: name
                    read: CategoryMapper.selectAll
                    empty: 未選択（絞らない）
              - field:
                  item: date
                  label: 基準日
                  control: date
                  width: 10ch
                  default: 今日
              - actions:
                  - label: 絞る
                    kind: submit
                    emphasis: primary
                  - label: 戻す
                    kind: link
                    to: GET /
                    emphasis: secondary
        - actions:
            - operation: register-todo
              label: TODOを登録する
              kind: link
              to: GET /todo/register-todo
              from: todo-dashboard
              emphasis: secondary
              shownWhen: いつも
            - operation: add-category
              label: カテゴリを追加する
              kind: link
              to: GET /category/add-category
              from: todo-dashboard
              emphasis: secondary
              shownWhen: いつも
            - operation: add-tag
              label: タグを追加する
              kind: link
              to: GET /tag/add-tag
              from: todo-dashboard
              emphasis: secondary
              shownWhen: いつも
        - section:
            title: 注意
            gap: l
            body:
              - section:
                  id: overdue
                  title: 期限超過
                  count: TodoMapper.countTodoDashboardOverdue
                  body:
                    - table:
                        read: TodoMapper.selectTodoDashboardOverdue
                        columns:
                          - label: ID
                            item: id
                            link:
                              to: todo
                          - label: タイトル
                            item: title
                          - label: ステータス
                            item: status
                            labels:
                              - value: OPEN
                                label: 未着手
                              - value: IN_PROGRESS
                                label: 対応中
                              - value: SUSPENDED
                                label: 中断
                              - value: CLOSED
                                label: 完了
                              - value: CANCELED
                                label: 中止
                          - label: 期限
                            item: due_on
                            format: yyyy年M月d日
                          - label: 完了日
                            item: completed_on
                            format: yyyy年M月d日
                        rowActions:
                          - operation: add-todo-comment
                            label: TODOにコメントを追加する
                            kind: link
                            to: GET /todo/{id}/add-todo-comment
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen: いつも
                          - operation: add-todo-task
                            label: 作業項目を追加する
                            kind: link
                            to: GET /todo/{id}/add-todo-task
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen: いつも
                          - operation: edit-todo
                            label: TODOを編集する
                            kind: link
                            to: GET /todo/{id}/edit-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen: いつも
                          - operation: start-todo
                            label: TODOに着手する
                            kind: link
                            to: GET /todo/{id}/start-todo/confirm
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - OPEN
                          - operation: suspend-todo
                            label: TODOを中断する
                            kind: link
                            to: GET /todo/{id}/suspend-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - IN_PROGRESS
                          - operation: resume-todo
                            label: TODOを再開する
                            kind: link
                            to: GET /todo/{id}/resume-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - SUSPENDED
                          - operation: complete-todo
                            label: TODOを完了する
                            kind: link
                            to: GET /todo/{id}/complete-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - IN_PROGRESS
                          - operation: cancel-todo
                            label: TODOを中止する
                            kind: link
                            to: GET /todo/{id}/cancel-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - OPEN
                              - IN_PROGRESS
                              - SUSPENDED
        - section:
            title: 全体
            gap: l
            body:
              - section:
                  id: all
                  title: すべてのTODO
                  count: TodoMapper.countTodoDashboardAll
                  body:
                    - table:
                        read: TodoMapper.selectTodoDashboardAll
                        columns:
                          - label: ID
                            item: id
                            link:
                              to: todo
                          - label: カテゴリ
                            item: category
                            link:
                              to: category
                              name: name
                          - label: ステータス
                            item: status
                            labels:
                              - value: OPEN
                                label: 未着手
                              - value: IN_PROGRESS
                                label: 対応中
                              - value: SUSPENDED
                                label: 中断
                              - value: CLOSED
                                label: 完了
                              - value: CANCELED
                                label: 中止
                          - label: 作業
                            computed: true
                          - label: タグ
                            item: tags
                            link:
                              to: tag
                              name: name
                              many: true
                          - label: 期限
                            item: due_on
                            format: yyyy年M月d日
                          - label: 概要
                            item: summary
                          - label: 作成日
                            item: created_on
                            format: yyyy年M月d日
                          - label: 更新日
                            item: updated_on
                            format: yyyy年M月d日
                        rowActions:
                          - operation: add-todo-comment
                            label: TODOにコメントを追加する
                            kind: link
                            to: GET /todo/{id}/add-todo-comment
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen: いつも
                          - operation: add-todo-task
                            label: 作業項目を追加する
                            kind: link
                            to: GET /todo/{id}/add-todo-task
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen: いつも
                          - operation: edit-todo
                            label: TODOを編集する
                            kind: link
                            to: GET /todo/{id}/edit-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen: いつも
                          - operation: start-todo
                            label: TODOに着手する
                            kind: link
                            to: GET /todo/{id}/start-todo/confirm
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - OPEN
                          - operation: suspend-todo
                            label: TODOを中断する
                            kind: link
                            to: GET /todo/{id}/suspend-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - IN_PROGRESS
                          - operation: resume-todo
                            label: TODOを再開する
                            kind: link
                            to: GET /todo/{id}/resume-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - SUSPENDED
                          - operation: complete-todo
                            label: TODOを完了する
                            kind: link
                            to: GET /todo/{id}/complete-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - IN_PROGRESS
                          - operation: cancel-todo
                            label: TODOを中止する
                            kind: link
                            to: GET /todo/{id}/cancel-todo
                            from: todo-dashboard
                            emphasis: secondary
                            shownWhen:
                              - OPEN
                              - IN_PROGRESS
                              - SUSPENDED
              - section:
                  id: categories
                  title: カテゴリ別の状況
                  count: CategoryMapper.countTodoDashboardCategories
                  body:
                    - matrix:
                        read: CategoryMapper.selectTodoDashboardCategories
                        rows:
                          entity: category
                          link:
                            to: category
                        columns:
                          - 未着手
                          - 対応中
                          - 中断
                          - 完了
                          - 中止
                        cell:
                          link:
                            to: todo-dashboard
                            by: その行と列で絞る（URL のパラメータ）
                          align: end
                        totals: 行と列の合計
              - section:
                  id: tags
                  title: タグ別の状況
                  count: TagMapper.countTodoDashboardTags
                  body:
                    - matrix:
                        read: TagMapper.selectTodoDashboardTags
                        rows:
                          entity: tag
                          link:
                            to: tag
                        columns:
                          - 未着手
                          - 対応中
                          - 中断
                          - 完了
                          - 中止
                        cell:
                          link:
                            to: todo-dashboard
                            by: その行と列で絞る（URL のパラメータ）
                          align: end
                        totals: 行と列の合計
        - section:
            title: マスタ
            gap: l
            body:
              - section:
                  id: categories-master
                  title: カテゴリ一覧
                  count: CategoryMapper.countTodoDashboardCategoriesMaster
                  body:
                    - table:
                        read: CategoryMapper.selectTodoDashboardCategoriesMaster
                        columns:
                          - label: ID
                            item: id
                            link:
                              to: category
                          - label: カテゴリ名
                            item: name
                          - label: TODOの数
                            computed: true
                        rowActions: []
              - section:
                  id: tags-master
                  title: タグ一覧
                  count: TagMapper.countTodoDashboardTagsMaster
                  body:
                    - table:
                        read: TagMapper.selectTodoDashboardTagsMaster
                        columns:
                          - label: ID
                            item: id
                            link:
                              to: tag
                          - label: タグ名
                            item: name
                          - label: TODOの数
                            computed: true
                        rowActions: []
