# 生成物（screen-designs-operations）: 手で直さず、業務モデルか生成の定義（design/screen-designs-operations.yaml）を直して作り直します（CLI generate）。
id: complete-todo
name: TODOを完了する（画面設計書）
form:
  class: CompleteTodoForm
  emptyAsNull: 空の欄は未入力（null）として受け取る（前後の空白は落とさない）
  fields:
    - name: date
      item: date
      type: LocalDate
      validations:
        - name: NotNull
        - name: DateTimeFormat
          iso: DATE
    - name: result
      item: result
      type: String
      validations:
        - name: NotNull
        - name: Size
          min: 1
  classes: []
screens:
  - id: complete-todo/input
    template: todo/complete-todo/input
    page:
      title: TODOを完了する
      width: m
      body:
        - notice:
            kind: errors
            for: form
        - facts:
            of: todo
            title: 対象
            items:
              - item: id
                label: ID
              - item: title
        - form:
            action: POST /todo/{id}/complete-todo/confirm
            object: CompleteTodoForm
            hidden:
              - from
            body:
              - field:
                  item: date
                  label: 完了日
                  control: date
                  required: true
                  width: 10ch
              - field:
                  item: result
                  label: 完了結果
                  control: textarea
                  required: true
                  rows: 5
              - actions:
                  - label: 確認へ
                    kind: submit
                    emphasis: primary
                  - label: やめる
                    kind: link
                    to: 起点の画面
                    emphasis: secondary
  - id: complete-todo/confirm
    template: todo/complete-todo/confirm
    page:
      title: TODOを完了する（確認）
      width: m
      body:
        - notice:
            kind: refusal
        - facts:
            of: todo
            title: 対象
            items:
              - item: id
                label: ID
              - item: title
        - facts:
            title: 入力した値
            of: form
            items:
              - item: date
                label: 完了日
                format: yyyy年M月d日
              - item: result
                label: 完了結果
                keepBreaks: true
        - facts:
            title: 状態の移り方
            items:
              - label: 状態
                from:
                  - 対応中
                to: 完了
        - form:
            action: POST /todo/{id}/complete-todo
            hidden:
              - date
              - result
              - flow
              - from
            body:
              - actions:
                  - label: 確定
                    kind: submit
                    emphasis: primary
                  - label: 入力へ戻る
                    kind: submit
                    action: POST /todo/{id}/complete-todo/back
                    emphasis: secondary
