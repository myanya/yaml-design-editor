# 生成物（screen-designs-operations）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/screen-designs-operations.yaml）を直して作り直します（CLI generate）。
id: add-tag
name: タグを追加する（画面設計書）
form:
  class: AddTagForm
  emptyAsNull: 空の欄は未入力（null）として受け取る（前後の空白は落とさない）
  fields:
    - name: name
      item: name
      type: String
      validations:
        - name: NotNull
        - name: Size
          min: 1
          max: 100
        - name: Pattern
          regexp: ^[^\r\n]*$
  classes: []
screens:
  - id: add-tag/input
    template: tag/add-tag/input
    page:
      title: タグを追加する
      width: m
      body:
        - notice:
            kind: errors
            for: form
        - form:
            action: POST /tag/add-tag/confirm
            object: AddTagForm
            hidden:
              - from
            body:
              - field:
                  item: name
                  label: タグ名
                  control: text
                  required: true
                  width: 40ch
              - actions:
                  - label: 確認へ
                    kind: submit
                    emphasis: primary
                  - label: やめる
                    kind: link
                    to: 起点の画面
                    emphasis: secondary
  - id: add-tag/confirm
    template: tag/add-tag/confirm
    page:
      title: タグを追加する（確認）
      width: m
      body:
        - notice:
            kind: refusal
        - facts:
            title: 入力した値
            of: form
            items:
              - item: name
                label: タグ名
        - form:
            action: POST /tag/add-tag
            hidden:
              - name
              - flow
              - from
            body:
              - actions:
                  - label: 確定
                    kind: submit
                    emphasis: primary
                  - label: 入力へ戻る
                    kind: submit
                    action: POST /tag/add-tag/back
                    emphasis: secondary
