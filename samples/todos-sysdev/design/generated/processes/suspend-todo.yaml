# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: suspend-todo
name: TODOを中断する
service:
  class: TodoService
  method: suspendTodo
  arguments:
    - id
    - date
    - reason
    - resumeOn
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    entity: todo
    key: id
  - step: check
    precondition: suspend-todo.state
    allowed:
      - IN_PROGRESS
  - step: write
    op: set
    entity: todo
    path: status
    value: SUSPENDED
    source: lifecycle
  - step: write
    op: insert
    entity: todo
    path: history
    value:
      date: $date
      action: suspend-todo
      from:
        $copy: status
        $of: self
      to: SUSPENDED
      note: $reason
      resume_on:
        $copy: resume_on
    source: lifecycle
  - step: write
    op: set
    entity: todo
    path: updated_on
    value:
      $copy: today
      $of: context
    source: auto
