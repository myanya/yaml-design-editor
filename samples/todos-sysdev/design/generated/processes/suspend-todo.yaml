# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: suspend-todo
name: TODOを中断する
service:
  class: TodoService
  method: suspendTodo
  arguments:
    - id
    - date
    - reason
    - resumeOn
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key: id
    missing: 見つからなければ「見つかりません」で断る
  - step: check
    precondition: suspend-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - IN_PROGRESS
    message: 「{id}」は「{state}」なので、「TODOを中断する」はできません（できるのは「対応中」のとき）
  - step: write
    call: TodoMapper.suspendTodo
    kind: update
    set:
      - item: status
        value: SUSPENDED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date: $date
      action: suspend-todo
      from:
        $copy: status
        $of: self
      to: SUSPENDED
      note: $reason
      resume_on:
        $copy: resume_on
    seq: TodoMapper.maxSeqTodoHistory の次
