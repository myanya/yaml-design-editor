# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: cancel-todo
name: TODOを中止する
service:
  class: TodoService
  method: cancelTodo
  arguments:
    - id
    - reason
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key: id
    missing: 見つからなければ「見つかりません」で断る
  - step: check
    precondition: cancel-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - OPEN
      - IN_PROGRESS
      - SUSPENDED
    message: 「{id}」は「{state}」なので、「TODOを中止する」はできません（できるのは「未完了」のとき）
  - step: write
    call: TodoMapper.cancelTodo
    kind: update
    set:
      - item: result
        value: $reason
      - item: status
        value: CANCELED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date:
        $copy: today
        $of: context
      action: cancel-todo
      from:
        $copy: status
        $of: self
      to: CANCELED
      note: $reason
    seq: TodoMapper.maxSeqTodoHistory の次
