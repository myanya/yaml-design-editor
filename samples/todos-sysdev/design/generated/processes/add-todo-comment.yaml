# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: add-todo-comment
name: TODOにコメントを追加する
service:
  class: TodoService
  method: addTodoComment
  arguments:
    - id
    - date
    - body
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    entity: todo
    key: id
  - step: write
    op: insert
    entity: todo
    path: comments
    value:
      date: $date
      body: $body
    source: do
  - step: write
    op: set
    entity: todo
    path: updated_on
    value:
      $copy: today
      $of: context
    source: auto
