# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: complete-todo
name: TODOを完了する
service:
  class: TodoService
  method: completeTodo
  arguments:
    - id
    - date
    - result
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key: id
    missing: 見つからなければ「見つかりません」で断る
  - step: check
    precondition: complete-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - IN_PROGRESS
    message: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
  - step: check
    precondition: complete-todo.no-open-task
    by: SQL（件数）
    call: TodoTaskMapper.countCompleteTodoNoOpenTask
    expect: 0 件なら通す
    message: '{id} には済んでいない作業項目があります（済にしてから完了します）'
  - step: write
    call: TodoMapper.completeTodo
    kind: update
    set:
      - item: completed_on
        value: $date
      - item: result
        value: $result
      - item: status
        value: CLOSED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date: $date
      action: complete-todo
      from:
        $copy: status
        $of: self
      to: CLOSED
    seq: TodoMapper.maxSeqTodoHistory の次
