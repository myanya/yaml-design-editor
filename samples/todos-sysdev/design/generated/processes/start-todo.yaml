# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: start-todo
name: TODOに着手する
service:
  class: TodoService
  method: startTodo
  arguments:
    - id
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key: id
    missing: 見つからなければ「見つかりません」で断る
  - step: check
    precondition: start-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - OPEN
    message: 「{id}」は「{state}」なので、「TODOに着手する」はできません（できるのは「未着手」のとき）
  - step: write
    call: TodoMapper.startTodo
    kind: update
    set:
      - item: status
        value: IN_PROGRESS
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date:
        $copy: today
        $of: context
      action: start-todo
      from:
        $copy: status
        $of: self
      to: IN_PROGRESS
    seq: TodoMapper.maxSeqTodoHistory の次
