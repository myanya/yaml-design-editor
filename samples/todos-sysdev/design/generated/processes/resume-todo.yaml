# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: resume-todo
name: TODOを再開する
service:
  class: TodoService
  method: resumeTodo
  arguments:
    - id
    - date
    - note
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key: id
    missing: 見つからなければ「見つかりません」で断る
  - step: check
    precondition: resume-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - SUSPENDED
    message: 「{id}」は「{state}」なので、「TODOを再開する」はできません（できるのは「中断」のとき）
  - step: write
    call: TodoMapper.resumeTodo
    kind: update
    set:
      - item: status
        value: IN_PROGRESS
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date: $date
      action: resume-todo
      from:
        $copy: status
        $of: self
      to: IN_PROGRESS
      note:
        $copy: note
    seq: TodoMapper.maxSeqTodoHistory の次
