# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: edit-todo
name: TODOを編集する
service:
  class: TodoService
  method: editTodo
  arguments:
    - id
    - title
    - summary
    - category
    - tags
    - createdOn
    - dueOn
    - details
    - result
    - comments
    - clear
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key: id
    missing: 見つからなければ「見つかりません」で断る
  - step: write
    call: TodoMapper.editTodo
    kind: update
    set:
      - item: title
        value: $title
        when:
          - path: title
            exists: true
      - item: summary
        value: $summary
        when:
          - path: summary
            exists: true
      - item: category
        value: $category
        when:
          - path: category
            exists: true
      - item: created_on
        value: $created_on
        when:
          - path: created_on
            exists: true
      - item: due_on
        value: $due_on
        when:
          - path: due_on
            exists: true
      - item: details
        value: $details
        when:
          - path: details
            exists: true
      - item: result
        value: $result
        when:
          - path: result
            exists: true
      - item: category
        value: null
        when:
          - path: clear.category
            equals: true
      - item: due_on
        value: null
        when:
          - path: clear.due_on
            equals: true
      - item: details
        value: null
        when:
          - path: clear.details
            equals: true
      - item: result
        value: null
        when:
          - path: clear.result
            equals: true
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    when:
      - path: title
        exists: true
  - step: write
    call: TodoMapper.deleteTodoTags
    kind: delete
    when:
      - path: tags
        exists: true
  - step: write
    call: TodoMapper.insertTodoTags
    kind: insert
    each: $tags
    seq: 配列の順（1 から）
    when:
      - path: tags
        exists: true
  - step: write
    call: TodoMapper.deleteTodoComments
    kind: delete
    when:
      - path: comments
        exists: true
  - step: write
    call: TodoMapper.insertTodoComments
    kind: insert
    each: $comments
    seq: 配列の順（1 から）
    when:
      - path: comments
        exists: true
  - step: write
    call: TodoMapper.deleteTodoComments
    kind: delete
    when:
      - path: clear.comments
        equals: true
  - step: write
    call: TodoMapper.insertTodoComments
    kind: insert
    each: []
    seq: 配列の順（1 から）
    when:
      - path: clear.comments
        equals: true
