# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: register-todo
name: TODOを登録する
service:
  class: TodoService
  method: registerTodo
  arguments:
    - title
    - summary
    - category
    - tags
    - follows
    - due
    - details
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: number
    entity: todo
    call: TodoMapper.maxId
    rule:
      path: id
      prefix: TODO-
      digits: 3
  - step: write
    call: TodoMapper.insert
    kind: insert
    values:
      id: 採番した番号
      due_on:
        $copy: due
      details:
        $copy: details
      title: $title
      summary: $summary
      category:
        $copy: category
      follows:
        $copy: follows
      status: OPEN
      created_on:
        $copy: today
        $of: context
      updated_on:
        $copy: today
        $of: context
  - step: write
    call: TodoMapper.insertTodoTags
    kind: insert
    each:
      $copy: tags
    seq: 配列の順（1 から）
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: 採番した番号
      date:
        $copy: today
        $of: context
      action: register-todo
      to: OPEN
    seq: TodoMapper.maxSeqTodoHistory の次
