# 生成物（processes）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/processes.yaml）を直して作り直します（CLI generate）。
id: register-todo
name: TODOを登録する
service:
  class: TodoService
  method: registerTodo
  arguments:
    - title
    - summary
    - category
    - tags
    - follows
    - due
    - details
confirm:
  - method: checkRegisterTodo
    arguments:
      - title
      - summary
      - category
      - tags
      - follows
      - due
      - details
    does: 受け手を読み（あれば）、入力の値で書いた後の値を計算し、次の決まりを確かめる（書かない）。違反は欄の名前とメッセージのキーの並びで返す
    constraints:
      - constraint: due-not-before-created
        field: due
        message: check.due-not-before-created
      - constraint: follows-not-self
        field: follows
        message: check.follows-not-self
      - constraint: follow-up-of.acyclic
        field: follows
        message: check.follow-up-of.acyclic
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: number
    entity: todo
    call: TodoMapper.maxId
    rule:
      path: id
      prefix: TODO-
      digits: 3
  - step: check
    constraint: due-not-before-created
    by: Java（書いた後の値）
    rule:
      where:
        - path: due_on
          exists: true
      check:
        - gte:
            - path: due_on
            - path: created_on
    field: due
    message: check.due-not-before-created
  - step: check
    constraint: updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: check.updated-not-before-created
  - step: check
    constraint: follows-not-self
    by: Java（書いた後の値）
    rule:
      where:
        - path: follows
          exists: true
      check:
        - ne:
            - path: follows
            - path: id
    field: follows
    message: check.follows-not-self
  - step: check
    constraint: follow-up-of.acyclic
    by: Java（参照の先をたどる）
    follow: follows
    call: TodoMapper.findById
    how: 書く参照の先から、同じ項目の参照を findById でたどり、受け手（作る操作は作る要素）に戻れば断る
    field: follows
    message: check.follow-up-of.acyclic
  - step: write
    call: TodoMapper.insert
    kind: insert
    values:
      id: 採番した番号
      due_on:
        $copy: due
      details:
        $copy: details
      title: $title
      summary: $summary
      category:
        $copy: category
      follows:
        $copy: follows
      status: OPEN
      created_on:
        $copy: today
        $of: context
      updated_on:
        $copy: today
        $of: context
  - step: write
    call: TodoMapper.insertTodoTags
    kind: insert
    each:
      $copy: tags
    seq: 配列の順（1 から）
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: 採番した番号
      date:
        $copy: today
        $of: context
      action: register-todo
      to: OPEN
    seq: TodoMapper.maxSeqTodoHistory の次
