# 生成物（table-access）: 手で直さず、業務モデルか生成の定義（design/table-access.yaml）を直して作り直します（CLI generate）。
id: todo-task
name: 作業項目の読み書き
table: todo_task
mapper: TodoTaskMapper
accesses:
  - operation: todo-task.finish
    method: todoTaskFinish
    statements:
      - kind: select
        table: todo_task
        where:
          - column: id
            value: $id
      - kind: update
        table: todo_task
        set:
          - column: done
            value: true
        where:
          - column: id
            value: $id
        source: do
      - kind: update
        table: todo
        set:
          - column: updated_on
            value:
              $copy: today
              $of: context
        where:
          - column: id
            value: $id
        source: auto
