# 生成物（table-access）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/table-access.yaml）を直して作り直します（CLI generate）。
id: todo-task
name: 作業項目の読み書き
mapper: TodoTaskMapper
tables:
  - todo_task
methods:
  - name: findById
    kind: select
    table: todo_task
    where:
      - item: id
        param: id
    operations:
      - todo-task.finish
    screens: []
  - name: insert
    kind: insert
    table: todo_task
    columns: テーブル設計書のすべての列
    operations:
      - add-todo-task
    screens: []
  - name: maxId
    kind: max
    table: todo_task
    item: id
    where:
      - item: todo_id
        param: id
    numbering:
      path: id
      prefix:
        $format: '{id}-S'
        $of: owner
      digits: 2
    operations:
      - add-todo-task
    screens: []
  - name: maxSeq
    kind: max
    table: todo_task
    item: seq
    where:
      - item: todo_id
        param: id
    operations:
      - add-todo-task
    screens: []
  - name: todoTaskFinish
    kind: update
    table: todo_task
    set:
      - item: done
        value: true
    where:
      - item: id
        param: id
    operations:
      - todo-task.finish
    screens: []
  - name: countCompleteTodoNoOpenTask
    kind: count
    table: todo_task
    where:
      - item: todo_id
        param: id
      - item: done
        equals: false
    precondition: complete-todo.no-open-task
    expect: absent
    operations:
      - complete-todo
    screens: []
  - name: countClosedHasNoOpenTask
    kind: count
    table: todo_task
    join:
      - table: todo
        item: id
        equalsItem: todo_id
    where:
      - item: todo_id
        param: todoId
      - table: todo
        item: status
        equals: CLOSED
      - item: done
        equals: false
    constraint: closed-has-no-open-task
    expect: absent
    operations:
      - add-todo-task
      - complete-todo
      - todo-task.finish
    screens: []
