# 生成物（table-access）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/table-access.yaml）を直して作り直します（CLI generate）。
id: category
name: カテゴリの読み書き
mapper: CategoryMapper
tables:
  - category
methods:
  - name: findDetail
    kind: select
    table: category
    where:
      - item: id
        param: id
    includes: []
    names: []
    operations: []
    screens:
      - category
  - name: selectAll
    kind: select
    table: category
    columns:
      - id
      - name
    order:
      - item: id
    operations: []
    screens:
      - 参照の候補
  - name: selectTodoDashboardCategories
    kind: aggregate
    table: category
    order:
      - item: id
    groupBy:
      - item: id
      - item: status
        of: todo
        values:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
          - CLOSED
          - CANCELED
    counts: todo
    via:
      relation: in-category
      dir: in
    operations: []
    screens:
      - todo-dashboard
  - name: countTodoDashboardCategories
    kind: count
    table: category
    operations: []
    screens:
      - todo-dashboard
  - name: selectTodoDashboardCategoriesMaster
    kind: select
    table: category
    columns:
      - item: id
      - label: カテゴリ名
        item: name
      - label: TODOの数
        computed:
          count: 参照してくる要素
          relation: in-category
          dir: in
    where: []
    order:
      - item: id
    params: []
    operations: []
    screens:
      - todo-dashboard
  - name: countTodoDashboardCategoriesMaster
    kind: count
    table: category
    where: 上の select と同じ条件
    operations: []
    screens:
      - todo-dashboard
  - name: insert
    kind: insert
    table: category
    columns: テーブル設計書のすべての列
    operations:
      - add-category
    screens: []
  - name: maxId
    kind: max
    table: category
    item: id
    where:
      - item: id
        startsWith: CAT-
    numbering:
      path: id
      prefix: CAT-
      digits: 3
    operations:
      - add-category
    screens: []
