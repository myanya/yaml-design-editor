# 生成物（table-access）: 手で直さず、業務モデルか生成の定義（design/table-access.yaml）を直して作り直します（CLI generate）。
id: todo
name: TODOの読み書き
mapper: TodoMapper
tables:
  - todo
  - todo_tags
  - todo_comments
  - todo_history
methods:
  - name: findById
    kind: select
    table: todo
    where:
      - item: id
        param: id
    operations:
      - add-todo-comment
      - add-todo-task
      - edit-todo
      - start-todo
      - suspend-todo
      - resume-todo
      - complete-todo
      - cancel-todo
  - name: insert
    kind: insert
    table: todo
    columns: テーブル設計書のすべての列
    operations:
      - register-todo
  - name: maxId
    kind: max
    table: todo
    item: id
    where:
      - item: id
        startsWith: TODO-
    numbering:
      path: id
      prefix: TODO-
      digits: 3
    operations:
      - register-todo
  - name: insertTodoTags
    kind: insert
    table: todo_tags
    columns: テーブル設計書のすべての列
    operations:
      - register-todo
      - edit-todo
  - name: insertTodoHistory
    kind: insert
    table: todo_history
    columns: テーブル設計書のすべての列
    operations:
      - register-todo
      - start-todo
      - suspend-todo
      - resume-todo
      - complete-todo
      - cancel-todo
  - name: maxSeqTodoHistory
    kind: max
    table: todo_history
    item: seq
    where:
      - item: todo_id
        param: id
    operations:
      - register-todo
      - start-todo
      - suspend-todo
      - resume-todo
      - complete-todo
      - cancel-todo
  - name: insertTodoComments
    kind: insert
    table: todo_comments
    columns: テーブル設計書のすべての列
    operations:
      - add-todo-comment
      - edit-todo
  - name: maxSeqTodoComments
    kind: max
    table: todo_comments
    item: seq
    where:
      - item: todo_id
        param: id
    operations:
      - add-todo-comment
  - name: addTodoComment
    kind: update
    table: todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - add-todo-comment
  - name: addTodoTask
    kind: update
    table: todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - add-todo-task
  - name: editTodo
    kind: update
    table: todo
    set:
      - item: title
        value: $title
        when:
          - path: title
            exists: true
      - item: summary
        value: $summary
        when:
          - path: summary
            exists: true
      - item: category
        value: $category
        when:
          - path: category
            exists: true
      - item: created_on
        value: $created_on
        when:
          - path: created_on
            exists: true
      - item: due_on
        value: $due_on
        when:
          - path: due_on
            exists: true
      - item: details
        value: $details
        when:
          - path: details
            exists: true
      - item: result
        value: $result
        when:
          - path: result
            exists: true
      - item: category
        value: null
        when:
          - path: clear.category
            equals: true
      - item: due_on
        value: null
        when:
          - path: clear.due_on
            equals: true
      - item: details
        value: null
        when:
          - path: clear.details
            equals: true
      - item: result
        value: null
        when:
          - path: clear.result
            equals: true
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - edit-todo
  - name: deleteTodoTags
    kind: delete
    table: todo_tags
    where:
      - item: todo_id
        param: id
    operations:
      - edit-todo
  - name: deleteTodoComments
    kind: delete
    table: todo_comments
    where:
      - item: todo_id
        param: id
    operations:
      - edit-todo
  - name: startTodo
    kind: update
    table: todo
    set:
      - item: status
        value: IN_PROGRESS
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - start-todo
  - name: suspendTodo
    kind: update
    table: todo
    set:
      - item: status
        value: SUSPENDED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - suspend-todo
  - name: resumeTodo
    kind: update
    table: todo
    set:
      - item: status
        value: IN_PROGRESS
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - resume-todo
  - name: completeTodo
    kind: update
    table: todo
    set:
      - item: completed_on
        value: $date
      - item: result
        value: $result
      - item: status
        value: CLOSED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - complete-todo
  - name: cancelTodo
    kind: update
    table: todo
    set:
      - item: result
        value: $reason
      - item: status
        value: CANCELED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - cancel-todo
  - name: todoTaskFinish
    kind: update
    table: todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: todoId
    operations:
      - todo-task.finish
