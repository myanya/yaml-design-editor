# 生成物（table-access）: 手で直さず、業務モデルか生成の定義（design/table-access.yaml）を直して作り直します（CLI generate）。
id: todo
name: TODOの読み書き
mapper: TodoMapper
tables:
  - todo
  - todo_tags
  - todo_comments
  - todo_history
methods:
  - name: findDetail
    kind: select
    table: todo
    where:
      - item: id
        param: id
    includes:
      - item: tags
        table: todo_tags
        order:
          - item: seq
      - item: comments
        table: todo_comments
        order:
          - item: seq
      - item: history
        table: todo_history
        order:
          - item: seq
      - item: tasks
        table: todo_task
        order:
          - item: seq
    names:
      - item: category
        table: category
        name: name
      - item: tags
        table: tag
        name: name
      - item: follows
        table: todo
        name: title
    operations: []
    screens:
      - todo
  - name: selectAll
    kind: select
    table: todo
    columns:
      - id
      - title
    order:
      - item: id
    operations: []
    screens:
      - 参照の候補
  - name: selectTodoDashboardOverdue
    kind: select
    table: todo
    columns:
      - item: id
      - label: タイトル
        item: title
      - label: ステータス
        item: status
      - label: 期限
        item: due_on
      - label: 完了日
        item: completed_on
    where:
      - item: tags
        op: includesAny
        value: $tags
        via: todo_tags
        skipIfEmpty: true
      - item: category
        op: equals
        value: $category
        skipIfEmpty: true
      - item: status
        op: in
        values:
          - OPEN
          - IN_PROGRESS
      - item: due_on
        op: notNull
      - item: due_on
        op: lt
        value: $today
    order:
      - item: due_on
        nulls: last
    params:
      - tags
      - category
      - today
    operations: []
    screens:
      - todo-dashboard
  - name: countTodoDashboardOverdue
    kind: count
    table: todo
    where: 上の select と同じ条件
    operations: []
    screens:
      - todo-dashboard
  - name: selectTodoDashboardAll
    kind: select
    table: todo
    columns:
      - item: id
      - label: カテゴリ
        item: category
        names:
          table: category
          name: name
      - label: ステータス
        item: status
      - label: 作業
        computed:
          of:
            format: '{done}/{all}'
            parts:
              done:
                count: todo_task
                parent: 行の ID
                where:
                  - item: done
                    op: equals
                    value: true
              all:
                count: 入れ子の要素
                item: tasks
                parent: 行の ID
          replace:
            0/0: ''
      - label: タグ
        item: tags
        names:
          table: tag
          name: name
          many: true
      - label: 期限
        item: due_on
      - label: 概要
        item: summary
      - label: 作成日
        item: created_on
      - label: 更新日
        item: updated_on
    where:
      - item: tags
        op: includesAny
        value: $tags
        via: todo_tags
        skipIfEmpty: true
      - item: category
        op: equals
        value: $category
        skipIfEmpty: true
    order:
      - item: id
    params:
      - tags
      - category
    operations: []
    screens:
      - todo-dashboard
  - name: countTodoDashboardAll
    kind: count
    table: todo
    where: 上の select と同じ条件
    operations: []
    screens:
      - todo-dashboard
  - name: findById
    kind: select
    table: todo
    where:
      - item: id
        param: id
    operations:
      - add-todo-comment
      - add-todo-task
      - edit-todo
      - start-todo
      - suspend-todo
      - resume-todo
      - complete-todo
      - cancel-todo
    screens: []
  - name: insert
    kind: insert
    table: todo
    columns: テーブル設計書のすべての列
    operations:
      - register-todo
    screens: []
  - name: maxId
    kind: max
    table: todo
    item: id
    where:
      - item: id
        startsWith: TODO-
    numbering:
      path: id
      prefix: TODO-
      digits: 3
    operations:
      - register-todo
    screens: []
  - name: insertTodoTags
    kind: insert
    table: todo_tags
    columns: テーブル設計書のすべての列
    operations:
      - register-todo
      - edit-todo
    screens: []
  - name: insertTodoHistory
    kind: insert
    table: todo_history
    columns: テーブル設計書のすべての列
    operations:
      - register-todo
      - start-todo
      - suspend-todo
      - resume-todo
      - complete-todo
      - cancel-todo
    screens: []
  - name: maxSeqTodoHistory
    kind: max
    table: todo_history
    item: seq
    where:
      - item: todo_id
        param: id
    operations:
      - register-todo
      - start-todo
      - suspend-todo
      - resume-todo
      - complete-todo
      - cancel-todo
    screens: []
  - name: insertTodoComments
    kind: insert
    table: todo_comments
    columns: テーブル設計書のすべての列
    operations:
      - add-todo-comment
      - edit-todo
    screens: []
  - name: maxSeqTodoComments
    kind: max
    table: todo_comments
    item: seq
    where:
      - item: todo_id
        param: id
    operations:
      - add-todo-comment
    screens: []
  - name: addTodoComment
    kind: update
    table: todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - add-todo-comment
    screens: []
  - name: addTodoTask
    kind: update
    table: todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - add-todo-task
    screens: []
  - name: editTodo
    kind: update
    table: todo
    set:
      - item: title
        value: $title
        when:
          - path: title
            exists: true
      - item: summary
        value: $summary
        when:
          - path: summary
            exists: true
      - item: category
        value: $category
        when:
          - path: category
            exists: true
      - item: created_on
        value: $created_on
        when:
          - path: created_on
            exists: true
      - item: due_on
        value: $due_on
        when:
          - path: due_on
            exists: true
      - item: details
        value: $details
        when:
          - path: details
            exists: true
      - item: result
        value: $result
        when:
          - path: result
            exists: true
      - item: category
        value: null
        when:
          - path: clear.category
            equals: true
      - item: due_on
        value: null
        when:
          - path: clear.due_on
            equals: true
      - item: details
        value: null
        when:
          - path: clear.details
            equals: true
      - item: result
        value: null
        when:
          - path: clear.result
            equals: true
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - edit-todo
    screens: []
  - name: deleteTodoTags
    kind: delete
    table: todo_tags
    where:
      - item: todo_id
        param: id
    operations:
      - edit-todo
    screens: []
  - name: deleteTodoComments
    kind: delete
    table: todo_comments
    where:
      - item: todo_id
        param: id
    operations:
      - edit-todo
    screens: []
  - name: startTodo
    kind: update
    table: todo
    set:
      - item: status
        value: IN_PROGRESS
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - start-todo
    screens: []
  - name: suspendTodo
    kind: update
    table: todo
    set:
      - item: status
        value: SUSPENDED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - suspend-todo
    screens: []
  - name: resumeTodo
    kind: update
    table: todo
    set:
      - item: status
        value: IN_PROGRESS
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - resume-todo
    screens: []
  - name: completeTodo
    kind: update
    table: todo
    set:
      - item: completed_on
        value: $date
      - item: result
        value: $result
      - item: status
        value: CLOSED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - complete-todo
    screens: []
  - name: cancelTodo
    kind: update
    table: todo
    set:
      - item: result
        value: $reason
      - item: status
        value: CANCELED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
    operations:
      - cancel-todo
    screens: []
  - name: todoTaskFinish
    kind: update
    table: todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: todoId
    operations:
      - todo-task.finish
    screens: []
