# 生成物（domain-relations）: 手で直さず、業務モデルか生成の定義（design/domain-relations.yaml）を直して作り直します（CLI generate）。
id: domain-relations
name: ドメイン関連定義書
domains:
  - domain: category
    label: カテゴリ
    members:
      - カテゴリ
  - domain: tag
    label: タグ
    members:
      - タグ
  - domain: todo
    label: TODO
    members:
      - TODO
      - 作業項目
relations:
  - relation: in-category
    label: カテゴリ
    inverseLabel: このカテゴリのTODO
    from: todo
    fromLabel: TODO
    to: category
    toLabel: カテゴリ
    many: 1 つまで
    back: いくつでも
    note: TODO はカテゴリを 1 つまで参照します（未分類なら参照しません）。参照は一覧の行に書きます
  - relation: tagged
    label: タグ
    inverseLabel: このタグのTODO
    from: todo
    fromLabel: TODO
    to: tag
    toLabel: タグ
    many: いくつでも
    back: いくつでも
    note: TODO はタグをいくつでも参照します（多対多）。参照は一覧の行の tags に書きます
  - relation: follow-up-of
    label: 元のTODO
    inverseLabel: 続きのTODO
    from: todo
    fromLabel: TODO
    to: todo
    toLabel: TODO
    many: 1 つまで
    back: いくつでも
    acyclic: 循環しない
    note: 完了したTODOに追加の作業が要るとき、新しく登録したTODOが元のTODOを 1 つまで参照します。参照は一覧の行に書きます
holdings:
  - from: todo
    to: todo-task
    toLabel: 作業項目
    note: 「TODO」の中にだけあり、「TODO」が無ければ無い
designId: DOC-domain-relations.domain-relations
designKind: domain-relations
designPath: design/generated/domain-relations.yaml
origins:
  source:
    id: rule-domain-relations
    document: .yde/transforms/design/domain-relations-derived.yaml
    path: []
  decisions: []
  inputs: []
