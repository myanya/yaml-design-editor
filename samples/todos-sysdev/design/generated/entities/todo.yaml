# 生成物（entity-specs）: 手で直さず、業務モデルか生成の定義（design/entity-specs.yaml）を直して作り直します（CLI generate）。
id: todo
name: TODO
numbering:
  path: id
  prefix: TODO-
  digits: 3
documents:
  - todo-list
  - todo-detail
items:
  - key: id
    label: ID
    type: common#TODO番号
    base: id
    required: true
    pattern: ^TODO-[0-9]{3,}$
    documents:
      - todo-list
      - todo-detail
  - key: title
    label: タイトル
    type: common#一行の文
    base: string
    required: true
    maxLength: 100
    pattern: ^[^\r\n]*$
    documents:
      - todo-list
  - key: summary
    label: 概要
    type: common#一行の文
    base: string
    required: true
    maxLength: 100
    pattern: ^[^\r\n]*$
    documents:
      - todo-list
  - key: category
    label: カテゴリ
    type: common#カテゴリ参照
    base: ref
    target: category
    relation: in-category
    documents:
      - todo-list
  - key: tags
    label: タグ
    type: array
    base: array
    unique: true
    item:
      type: common#タグ参照
      base: ref
      relation: tagged
      idPatterns:
        - TAG-*
      schemas:
        - tag-list
      target: tag
      targetTitle: name
    documents:
      - todo-list
  - key: follows
    label: 元のTODO
    type: common#TODO参照
    base: ref
    target: todo
    relation: follow-up-of
    documents:
      - todo-list
  - key: status
    label: ステータス
    type: common#ステータス
    base: enum
    required: true
    default: OPEN
    values:
      - value: OPEN
        label: 未着手
      - value: IN_PROGRESS
        label: 対応中
      - value: SUSPENDED
        label: 中断
      - value: CLOSED
        label: 完了
      - value: CANCELED
        label: 中止
    stateOf: todo
    documents:
      - todo-detail
  - key: created_on
    label: 作成日
    type: common#年月日
    base: date
    required: true
    auto: created
    format: yyyy年M月d日
    documents:
      - todo-detail
  - key: updated_on
    label: 更新日
    type: common#年月日
    base: date
    required: true
    auto: updated
    format: yyyy年M月d日
    documents:
      - todo-detail
  - key: due_on
    label: 期限
    type: common#年月日
    base: date
    format: yyyy年M月d日
    documents:
      - todo-detail
  - key: completed_on
    label: 完了日
    type: common#年月日
    base: date
    format: yyyy年M月d日
    documents:
      - todo-detail
  - key: details
    label: 詳細
    type: common#文章
    base: string
    multiline: true
    documents:
      - todo-detail
  - key: result
    label: 結果
    type: common#文章
    base: string
    multiline: true
    documents:
      - todo-detail
  - key: tasks
    label: 作業項目
    type: array
    base: array
    default: []
    item:
      type: common#作業項目
      base: object
      entity: todo-task
    documents:
      - todo-detail
  - key: comments
    label: コメント一覧
    type: array
    base: array
    default: []
    item:
      type: common#コメント
      base: object
      fields:
        - key: date
          label: 日付
          type: common#年月日
          base: date
          required: true
          format: yyyy年M月d日
        - key: body
          label: コメント本文
          type: text
          base: string
          required: true
          multiline: true
    documents:
      - todo-detail
  - key: history
    label: 状態の履歴
    type: array
    base: array
    default: []
    item:
      label: 状態の記録
      type: common#状態の記録
      base: object
      fields:
        - key: date
          label: 日付
          type: common#年月日
          base: date
          required: true
          auto: created
          format: yyyy年M月d日
        - key: action
          label: 操作
          type: common#TODOの操作
          base: enum
          required: true
          values:
            - value: register-todo
              label: TODOを登録する
            - value: start-todo
              label: TODOに着手する
            - value: complete-todo
              label: TODOを完了する
            - value: suspend-todo
              label: TODOを中断する
            - value: resume-todo
              label: TODOを再開する
            - value: cancel-todo
              label: TODOを中止する
        - key: from
          label: 前の状態
          type: common#ステータス
          base: enum
          values:
            - value: OPEN
              label: 未着手
            - value: IN_PROGRESS
              label: 対応中
            - value: SUSPENDED
              label: 中断
            - value: CLOSED
              label: 完了
            - value: CANCELED
              label: 中止
          stateOf: todo
        - key: to
          label: 後の状態
          type: common#ステータス
          base: enum
          required: true
          values:
            - value: OPEN
              label: 未着手
            - value: IN_PROGRESS
              label: 対応中
            - value: SUSPENDED
              label: 中断
            - value: CLOSED
              label: 完了
            - value: CANCELED
              label: 中止
          stateOf: todo
        - key: note
          label: 理由
          type: common#文章
          base: string
          multiline: true
        - key: resume_on
          label: 再開予定日
          type: common#年月日
          base: date
          format: yyyy年M月d日
    documents:
      - todo-detail
operations:
  - id: register-todo
    label: TODOを登録する
  - id: add-todo-comment
    label: TODOにコメントを追加する
  - id: add-todo-task
    label: 作業項目を追加する
  - id: edit-todo
    label: TODOを編集する
  - id: start-todo
    label: TODOに着手する
  - id: suspend-todo
    label: TODOを中断する
  - id: resume-todo
    label: TODOを再開する
  - id: complete-todo
    label: TODOを完了する
  - id: cancel-todo
    label: TODOを中止する
  - id: todo-task.finish
    label: 作業項目を済にする
