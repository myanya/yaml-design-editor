# 生成物（entity-specs）: 手で直さず、業務モデルか生成の定義（design/entity-specs.yaml）を直して作り直します（CLI generate）。
id: todo-task
name: 作業項目
numbering:
  path: id
  prefix:
    $format: '{id}-S'
    $of: owner
  digits: 2
owner:
  entity: todo
  field: tasks
documents:
  - todo-detail
items:
  - key: id
    label: ID
    type: common#作業項目番号
    base: id
    required: true
    pattern: ^TODO-[0-9]{3,}-S[0-9]{2,}$
    documents:
      - todo-detail
  - key: title
    label: 作業
    type: common#一行の文
    base: string
    required: true
    maxLength: 100
    pattern: ^[^\r\n]*$
    documents:
      - todo-detail
  - key: done
    label: 済
    type: boolean
    base: boolean
    required: true
    default: false
    documents:
      - todo-detail
operations:
  - id: add-todo-task
    label: 作業項目を追加する
  - id: todo-task.finish
    label: 作業項目を済にする
crud:
  - 項目: id
    名前: ID
    add-todo-task: C
    todo-task.finish: ''
  - 項目: title
    名前: 作業
    add-todo-task: C
    todo-task.finish: ''
  - 項目: done
    名前: 済
    add-todo-task: C
    todo-task.finish: U
