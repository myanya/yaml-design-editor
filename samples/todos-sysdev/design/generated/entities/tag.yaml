# 生成物（entity-specs）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/entity-specs.yaml）を直して作り直します（CLI generate）。
id: tag
name: タグ
numbering:
  path: id
  prefix: TAG-
  digits: 3
documents:
  - tag-list
items:
  - key: id
    label: ID
    type: common#タグ番号
    base: id
    required: true
    pattern: ^TAG-[0-9]{3,}$
    documents:
      - tag-list
  - key: name
    label: タグ名
    type: common#一行の文
    base: string
    required: true
    maxLength: 100
    pattern: ^[^\r\n]*$
    documents:
      - tag-list
operations:
  - id: add-tag
    label: タグを追加する
crud:
  - 項目: id
    名前: ID
    add-tag: ''
  - 項目: name
    名前: タグ名
    add-tag: C
