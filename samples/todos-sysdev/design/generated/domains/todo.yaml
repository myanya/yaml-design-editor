# 生成物（domains）: 手で直さず、業務モデルか生成の定義（design/domains.yaml）を直して作り直します（CLI generate）。
id: todo
name: TODO
description: やることを 1 件ずつ管理する単位です。タイトル・概要・分類（カテゴリとタグ）を一覧に、進み具合（状態・日付・結果・作業項目・コメント・状態の履歴）を個票に書きます。
members:
  - entity: todo
    label: TODO
    role: 集約の中心
    description: やることを 1 件ずつ管理する単位です。タイトル・概要・分類（カテゴリとタグ）を一覧に、進み具合（状態・日付・結果・作業項目・コメント・状態の履歴）を個票に書きます。
    numbering: 「TODO-」と 3 桁の番号（使われている番号の次）
  - entity: todo-task
    label: 作業項目
    role: 「TODO」の中にだけある
    description: TODO を小分けにした作業です。TODO の中にだけあり、済んでいない作業項目があるうちは TODO を完了できません。
    numbering: 外側の番号に続けて 2 桁の続き番号（使われている番号の次）
information:
  - of: TODO
    items:
      - key: id
        label: ID
        kind: 番号
        required: 必ずある
        note: 一覧内で一意のID。例：TODO-001。個票のIDとファイル名にも使用します。
      - key: title
        label: タイトル
        kind: 一行の文（100 文字まで）
        required: 必ずある
      - key: summary
        label: 概要
        kind: 一行の文（100 文字まで）
        required: 必ずある
      - key: category
        label: カテゴリ
        kind: カテゴリを 1 つ指す
        note: カテゴリ一覧の ID を 1 件。未分類なら省略します。
      - key: tags
        label: タグ
        kind: タグをいくつでも指す
        note: いくつでも付けられます（カテゴリは 1 つまで）。同じタグは 1 度だけです。付けなければ省略します。
      - key: follows
        label: 元のTODO
        kind: TODOを 1 つ指す
        note: 完了したTODOに追加の作業が要るとき、このTODOがその続きであることを示します。
      - key: status
        label: ステータス
        kind: 状態
        choices:
          - 未着手
          - 対応中
          - 中断
          - 完了
          - 中止
        required: 必ずある
      - key: created_on
        label: 作成日
        kind: 年月日
        required: 必ずある
        auto: 作ったときの日付が入る
        note: 個票を作成した日を自動で記録します。登録操作ではTODOの登録日になります。過去分は「TODOを編集する」でも修正できます。
      - key: updated_on
        label: 更新日
        kind: 年月日
        required: 必ずある
        auto: 書き換えたときの日付が入る
        note: 個票の中身を変えて保存した日を自動で記録します（操作の適用でも入ります）。一覧の側（タイトル・概要・カテゴリ）だけの変更では変わりません。
      - key: due_on
        label: 期限
        kind: 年月日
        note: 未定の場合は省略します。作成日より前の日付は検査が指摘します。
      - key: completed_on
        label: 完了日
        kind: 年月日
        note: 完了時に入力します。未完了・中止の場合は省略します。
      - key: details
        label: 詳細
        kind: 文章
        note: 作業内容や完了条件を記載します。
      - key: result
        label: 結果
        kind: 文章
        note: 対応結果や中止理由を記載します。
      - key: tasks
        label: 作業項目
        kind: 作業項目の並び
        note: 作業を小分けにした明細です。済んでいない作業項目があるうちは完了できません。
      - key: comments
        label: コメント一覧
        kind: 行の並び
        columns:
          - 日付
          - コメント本文
        note: 並び順は任意です。
      - key: history
        label: 状態の履歴
        kind: 行の並び
        columns:
          - 日付
          - 操作
          - 前の状態
          - 後の状態
          - 理由
          - 再開予定日
        note: 状態の流れ（todo-behavior.yaml）が、状態を変える操作のたびに古い順に 1 行ずつ足します。手で書き足す必要はありません。
  - of: 作業項目
    items:
      - key: id
        label: ID
        kind: 番号
        required: 必ずある
        note: 追加すると自動で振ります（例 TODO-002-S01）。
      - key: title
        label: 作業
        kind: 一行の文（100 文字まで）
        required: 必ずある
      - key: done
        label: 済
        kind: はい・いいえ
        required: 必ずある
states:
  - lifecycle: todo-lifecycle
    of: TODO
    states:
      - 未着手
      - 対応中
      - 中断
      - 完了
      - 中止
    groups:
      - label: 未完了
        states:
          - 未着手
          - 対応中
          - 中断
    start:
      - to: 未着手
        by: TODOを登録する
    moves:
      - by: TODOを完了する
        from:
          - 対応中
        to: 完了
      - by: TODOを中止する
        from:
          - 未着手
          - 対応中
          - 中断
        to: 中止
      - by: TODOに着手する
        from:
          - 未着手
        to: 対応中
      - by: TODOを中断する
        from:
          - 対応中
        to: 中断
      - by: TODOを再開する
        from:
          - 中断
        to: 対応中
    end:
      - 完了
      - 中止
operations:
  - label: TODOを登録する
    of: TODO
    description: 一覧と未着手の個票を一度に作成します。TODO番号は、使われている番号の次を自動で振ります。状態（未着手）と状態の履歴の最初の行は、状態の流れ（todo-lifecycle）の入口から入ります。
    requires: []
    inputs:
      - タイトル
      - 概要
      - カテゴリ
      - タグ
      - 元のTODO
      - 期限
      - 詳細
  - label: TODOにコメントを追加する
    of: TODO
    description: TODOの個票へ、状態に関係なく日付と本文を記録します。
    requires: []
    inputs:
      - 記録日
      - コメント本文
  - label: 作業項目を追加する
    of: TODO
    description: 未完了のTODOに、作業項目を足します。番号はTODOの番号に続けて自動で振ります（TODO-004-S04 など）。済にするのは、個票の作業項目の行の「⋯」の「作業項目を済にする」です。
    requires:
      - '{id} は完了か中止をしているので、作業項目を足せません'
    inputs:
      - 作業
  - label: TODOを編集する
    of: TODO
    description: 現在値を表示し、変更した項目だけを更新します。状態と完了日は変えません（着手・完了・再開・中止の操作で変えます）。空文字への変更と消去は別で、消去は「値を消す」で指定します。
    requires: []
    inputs:
      - タイトル
      - 概要
      - カテゴリ
      - タグ
      - 作成日
      - 期限
      - 詳細
      - 結果・中止理由
      - コメント一覧
      - 値を消す
  - label: TODOに着手する
    of: TODO
    description: 未着手の作業を対応中にします。追加の入力はありません。
    when:
      - 未着手
    requires: []
    inputs: []
  - label: TODOを中断する
    of: TODO
    description: 対応中の作業を一時止めます。理由と再開予定日を状態の履歴に残します。完了や中止と違い、再開できます。
    when:
      - 対応中
    requires: []
    inputs:
      - 中断日
      - 中断理由
      - 再開予定日
  - label: TODOを再開する
    of: TODO
    description: 中断した作業を対応中に戻します。
    when:
      - 中断
    requires: []
    inputs:
      - 再開日
      - メモ
  - label: TODOを完了する
    of: TODO
    description: 対応中の作業を完了にし、完了日と成果を記録します。済んでいない作業項目があるうちは完了できません。完了したTODOは戻せません（追加の作業は、元のTODOを選んで新しく登録します）。
    when:
      - 対応中
    requires:
      - '{id} には済んでいない作業項目があります（済にしてから完了します）'
    inputs:
      - 完了日
      - 完了結果
  - label: TODOを中止する
    of: TODO
    description: 未着手・対応中・中断の作業を中止し、理由を結果欄と状態の履歴に残します。
    when:
      - 未着手
      - 対応中
      - 中断
    requires: []
    inputs:
      - 中止理由
  - label: 作業項目を済にする
    of: 作業項目
    inputs: []
rules:
  - label: 期限は作成日以降であること
    level: 守る（破ると断る）
  - label: 更新日は作成日以降であること
    level: 守る（破ると断る）
  - label: 完了日は作成日以降であること
    level: 守る（破ると断る）
  - label: 完了した TODO には完了日があること
    level: 守る（破ると断る）
  - label: 完了したTODOには結果を記録すること
    level: 守る（破ると断る）
  - label: 完了以外のTODOには完了日を残さないこと
    level: 守る（破ると断る）
  - label: 再開予定日は中断した日以降であること
    level: 守る（破ると断る）
  - label: 元のTODOは自分以外であること
    level: 守る（破ると断る）
  - label: 完了したTODOには、済んでいない作業項目が無いこと
    level: 守る（破ると断る）
  - label: 一覧のTODOには個票があること
    level: 守る（破ると断る）
relations:
  - direction: 出る
    label: カテゴリ
    to: category
    toLabel: カテゴリ
    many: 1 つまで
    note: TODO はカテゴリを 1 つまで参照します（未分類なら参照しません）。参照は一覧の行に書きます
  - direction: 出る
    label: タグ
    to: tag
    toLabel: タグ
    many: いくつでも
    note: TODO はタグをいくつでも参照します（多対多）。参照は一覧の行の tags に書きます
  - direction: 出る
    label: 元のTODO
    to: todo
    toLabel: TODO
    many: 1 つまで
    acyclic: 循環しない
    note: 完了したTODOに追加の作業が要るとき、新しく登録したTODOが元のTODOを 1 つまで参照します。参照は一覧の行に書きます
  - direction: 入る
    label: 続きのTODO
    to: todo
    toLabel: TODO
    many: いくつでも
    acyclic: 循環しない
    note: 完了したTODOに追加の作業が要るとき、新しく登録したTODOが元のTODOを 1 つまで参照します。参照は一覧の行に書きます
