# 生成物（action-specs）: 手で直さず、業務モデルか生成の定義（design/action-specs.yaml）を直して作り直します（CLI generate）。
id: complete-todo
name: TODOを完了する
description: 対応中の作業を完了にし、完了日と成果を記録します。済んでいない作業項目があるうちは完了できません。完了したTODOは戻せません（追加の作業は、元のTODOを選んで新しく登録します）。
kind: action
subject: todo
inputs:
  - key: date
    label: 完了日
    type: common#年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    required: true
    format: yyyy年M月d日
  - key: result
    label: 完了結果
    type: todo-operations#操作の記録
    base: string
    description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
    required: true
    minLength: 1
    multiline: true
initial:
  date:
    $copy: today
    $of: context
state:
  lifecycle: todo-lifecycle
  transitions:
    - from:
        - todo-IN_PROGRESS
      to: todo-CLOSED
preconditions:
  - id: complete-todo.state
    kind: state
    allowed:
      - 対応中
    message: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
  - id: complete-todo.no-open-task
    kind: rule
    message: '{id} には済んでいない作業項目があります（済にしてから完了します）'
effects:
  - op: set
    entity: todo
    path: completed_on
    value: $date
    source: do
  - op: set
    entity: todo
    path: result
    value: $result
    source: do
  - op: set
    entity: todo
    path: status
    value: CLOSED
    source: lifecycle
  - op: insert
    entity: todo
    path: history
    value:
      date: $date
      action: complete-todo
      from:
        $copy: status
        $of: self
      to: CLOSED
    source: lifecycle
  - op: set
    entity: todo
    path: updated_on
    value:
      $copy: today
      $of: context
    source: auto
