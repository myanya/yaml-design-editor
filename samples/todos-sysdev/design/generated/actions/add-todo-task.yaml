# 生成物（action-specs）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/action-specs.yaml）を直して作り直します（CLI generate）。
id: add-todo-task
name: 作業項目を追加する
description: 未完了のTODOに、作業項目を足します。番号はTODOの番号に続けて自動で振ります（TODO-004-S04 など）。済にするのは、個票の作業項目の行の「⋯」の「作業項目を済にする」です。
kind: action
subject: todo
inputs:
  - key: title
    label: 作業
    type: common#一行の文
    base: string
    required: true
    minLength: 1
    maxLength: 100
    pattern: ^[^\r\n]*$
preconditions:
  - id: add-todo-task.active
    kind: rule
    message: '{id} は完了か中止をしているので、作業項目を足せません'
effects:
  - op: insert
    entity: todo
    path: tasks
    value:
      id: ''
      title: $title
      done: false
    source: do
  - op: set
    entity: todo
    path: updated_on
    value:
      $copy: today
      $of: context
    source: auto
  - op: set
    entity: todo
    path: updated_by
    value:
      $copy: actor
      $of: context
    origin: 基本設計「更新者を記録する」（audit-updated-by）
