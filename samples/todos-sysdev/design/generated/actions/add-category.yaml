# 生成物（action-specs）: 手で直さず、業務モデルか段の規則・補正（.yde/stages）か生成の定義（design/action-specs.yaml）を直して作り直します（CLI generate）。
id: add-category
name: カテゴリを追加する
description: TODOを分類するカテゴリを作ります。IDは一覧の追加規則で自動採番します。
kind: action
subject: category
inputs:
  - key: name
    label: カテゴリ名
    type: common#一行の文
    base: string
    required: true
    minLength: 1
    maxLength: 100
    pattern: ^[^\r\n]*$
    overrides:
      minLength: 1
preconditions: []
effects:
  - op: insert
    entity: category
    path: categories
    value:
      name: $name
    source: do
