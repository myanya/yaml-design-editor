# 生成物（screen-flows）: 手で直さず、業務モデルか生成の定義（design/screen-flows.yaml）を直して作り直します（CLI generate）。
id: todo
name: TODOの画面の動き
controller: TodoController
screens:
  - screen: todo
    handler: show
    request: GET /todo/{id}
    does: 受け手を読んで詳細画面を出す（無ければ「見つかりません」）
    service: TodoService.findDetail
    reads:
      - TodoMapper.findDetail
    session:
      reads:
        - notice
handlers:
  - action: register-todo
    name: TODOを登録する
    form: RegisterTodoForm
    service: TodoService.registerTodo
    returnTo: 起点の画面（パラメータ from の画面の ID。画面遷移定義書にある画面だけを受け取る）
    steps:
      - handler: registerTodoInput
        request: GET /todo/register-todo
        screen: register-todo/input
        does: 初期値でフォームを作って入力画面を出す
        reads:
          - CategoryMapper.selectAll
          - TagMapper.selectAll
          - TodoMapper.selectAll
      - handler: registerTodoConfirm
        request: POST /todo/register-todo/confirm
        screen: register-todo/confirm
        does: フォームを検査し（@Validated）、誤りなら入力画面に誤りを添えて戻す。通れば、受け取る値が原因で破れうるデータの決まりを Service で確かめ（calls。あれば）、違反なら入力画面の欄に添えて戻す。通れば確認画面を出す（入力の値は
          hidden 項目）
        reads: []
        calls:
          - TodoService.checkRegisterTodo
        session:
          puts:
            - token
      - handler: registerTodoBack
        request: POST /todo/register-todo/back
        screen: register-todo/input
        does: hidden 項目の値で入力画面を出す
      - handler: registerTodo
        request: POST /todo/register-todo
        does: トークンを照合して消す（無い・違うなら InvalidTokenException）→ Service で入力検査・状態・前提・データの決まりを確かめ直して書く → 断れば（RefusedException）確認画面に断りの文を出す。書けたら完了の知らせを置き、起点の画面へリダイレクトする
        session:
          reads:
            - token
          removes:
            - token
          puts:
            - notice
        refusals:
          - check.due-not-before-created
          - check.updated-not-before-created
          - check.follows-not-self
          - check.follow-up-of.acyclic
