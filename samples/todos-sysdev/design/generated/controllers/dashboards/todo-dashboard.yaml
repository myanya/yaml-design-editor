# 生成物（dashboard-flows）: 手で直さず、業務モデルか生成の定義（design/dashboard-flows.yaml）を直して作り直します（CLI generate）。
id: todo-dashboard
name: TODOダッシュボードの画面の動き
controller: TodoDashboardController
screens:
  - screen: todo-dashboard
    handler: show
    request: GET /
    params:
      - key: tags
        label: タグ
        multiple: true
      - key: category
        label: カテゴリ
      - key: categories.cell
        label: 区画「カテゴリ別の状況」のセル（行と列）
      - key: tags.cell
        label: 区画「タグ別の状況」のセル（行と列）
    does: 絞り込みで区画の一覧と集計を読んで、一覧画面を出す
    session:
      reads:
        - notice
