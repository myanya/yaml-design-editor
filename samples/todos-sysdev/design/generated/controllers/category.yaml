# 生成物（screen-flows）: 手で直さず、業務モデルか生成の定義（design/screen-flows.yaml）を直して作り直します（CLI generate）。
id: category
name: カテゴリの画面の動き
controller: CategoryController
screens:
  - screen: category
    handler: show
    request: GET /category/{id}
    does: 受け手を読んで詳細画面を出す（無ければ「見つかりません」）
    service: CategoryService.findDetail
    reads:
      - CategoryMapper.findDetail
    session:
      reads:
        - notice
handlers:
  - action: add-category
    name: カテゴリを追加する
    form: AddCategoryForm
    service: CategoryService.addCategory
    returnTo: 起点の画面（パラメータ from の画面の ID。画面遷移定義書にある画面だけを受け取る）
    steps:
      - handler: addCategoryInput
        request: GET /category/add-category
        screen: add-category/input
        does: 初期値でフォームを作って入力画面を出す
        reads: []
      - handler: addCategoryConfirm
        request: POST /category/add-category/confirm
        screen: add-category/confirm
        does: フォームを検査し（@Validated）、誤りなら入力画面に誤りを添えて戻す。通れば、受け取る値が原因で破れうるデータの決まりを Service で確かめ（calls。あれば）、違反なら入力画面の欄に添えて戻す。通れば確認画面を出す（入力の値は
          hidden 項目）
        reads: []
        calls: []
        session:
          puts:
            - token
      - handler: addCategoryBack
        request: POST /category/add-category/back
        screen: add-category/input
        does: hidden 項目の値で入力画面を出す
      - handler: addCategory
        request: POST /category/add-category
        does: トークンを照合して消す（無い・違うなら InvalidTokenException）→ Service で入力検査・状態・前提・データの決まりを確かめ直して書く → 断れば（RefusedException）確認画面に断りの文を出す。書けたら完了の知らせを置き、起点の画面へリダイレクトする
        session:
          reads:
            - token
          removes:
            - token
          puts:
            - notice
        refusals: []
designId: DOC-screen-flows.category
designKind: screen-flows
designPath: design/generated/controllers/category.yaml
origins:
  source:
    id: rule-screen-flows
    document: .yde/transforms/design/screen-flows-derived.yaml
    path: []
  decisions: []
  inputs: []
