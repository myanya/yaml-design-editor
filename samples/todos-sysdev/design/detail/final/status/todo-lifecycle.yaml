# 生成物（status-rules）: 手で直さず、業務モデルか生成の定義（design/detail/status-rules.yaml）を直して作り直します（CLI generate）。
id: todo-lifecycle
entity: todo
enum:
  name: TodoStatus
  values:
    - constant: OPEN
      label: 未着手
      state: todo-OPEN
    - constant: IN_PROGRESS
      label: 対応中
      state: todo-IN_PROGRESS
    - constant: SUSPENDED
      label: 中断
      state: todo-SUSPENDED
    - constant: CLOSED
      label: 完了
      state: todo-CLOSED
    - constant: CANCELED
      label: 中止
      state: todo-CANCELED
groups:
  - method: isTodoActive
    label: 未完了
    state: todo-ACTIVE
    values:
      - OPEN
      - IN_PROGRESS
      - SUSPENDED
entry:
  - action: register-todo
    to: OPEN
transitions:
  - action: complete-todo
    from:
      - IN_PROGRESS
    to: CLOSED
  - action: cancel-todo
    from:
      - OPEN
      - IN_PROGRESS
      - SUSPENDED
    to: CANCELED
  - action: start-todo
    from:
      - OPEN
    to: IN_PROGRESS
  - action: suspend-todo
    from:
      - IN_PROGRESS
    to: SUSPENDED
  - action: resume-todo
    from:
      - SUSPENDED
    to: IN_PROGRESS
terminal:
  - CLOSED
  - CANCELED
stateFields:
  - status
designId: DOC-status-rules.todo-lifecycle
designKind: status-rules
designPath: design/detail/final/status/todo-lifecycle.yaml
origins:
  source:
    id: rule-status-rules
    document: .yde/transforms/design/detail/status-rules-derived.yaml
    path: []
  decisions: []
  inputs: []
