# 生成物（application-web）: 手で直さず、業務モデルか生成の定義（design/detail/application-web.yaml）を直して作り直します（CLI generate）。
id: APP-web
pages:
  - id: WPAGE-todo-dashboard
    key: todo-dashboard
    template: todo-dashboard/list
    screen:
      id: todo-dashboard
      template: todo-dashboard/list
      page:
        title: TODOダッシュボード
        width: l
        body:
          - notice:
              kind: done
          - filters:
              action: GET /
              body:
                - choices:
                    item: tags
                    label: タグ
                    control: checkboxes
                    candidates:
                      entity: tag
                      name: name
                      read: TagMapper.selectAll
                      empty: 未選択（絞らない）
                - field:
                    item: category
                    label: カテゴリ
                    control: select
                    candidates:
                      entity: category
                      name: name
                      read: CategoryMapper.selectAll
                      empty: 未選択（絞らない）
                - field:
                    item: date
                    label: 基準日
                    control: date
                    width: 10ch
                    default: 今日
                - actions:
                    - label: 絞る
                      kind: submit
                      emphasis: primary
                    - label: 戻す
                      kind: link
                      to: GET /
                      emphasis: secondary
          - actions:
              - operation: register-todo
                label: TODOを登録する
                kind: link
                to: GET /todo/register-todo
                from: todo-dashboard
                emphasis: secondary
                shownWhen: いつも
              - operation: add-category
                label: カテゴリを追加する
                kind: link
                to: GET /category/add-category
                from: todo-dashboard
                emphasis: secondary
                shownWhen: いつも
              - operation: add-tag
                label: タグを追加する
                kind: link
                to: GET /tag/add-tag
                from: todo-dashboard
                emphasis: secondary
                shownWhen: いつも
          - section:
              title: 注意
              gap: l
              body:
                - section:
                    id: overdue
                    title: 期限超過
                    count: TodoMapper.countTodoDashboardOverdue
                    body:
                      - table:
                          read: TodoMapper.selectTodoDashboardOverdue
                          empty: list.empty.todo
                          columns:
                            - label: ID
                              item: id
                              link:
                                to: todo
                            - label: タイトル
                              item: title
                            - label: ステータス
                              item: status
                              labels:
                                - value: OPEN
                                  label: 未着手
                                - value: IN_PROGRESS
                                  label: 対応中
                                - value: SUSPENDED
                                  label: 中断
                                - value: CLOSED
                                  label: 完了
                                - value: CANCELED
                                  label: 中止
                            - label: 期限
                              item: due_on
                              format: yyyy年M月d日
                            - label: 完了日
                              item: completed_on
                              format: yyyy年M月d日
                          rowActions:
                            - operation: add-todo-comment
                              label: TODOにコメントを追加する
                              kind: link
                              to: GET /todo/{id}/add-todo-comment
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen: いつも
                            - operation: add-todo-task
                              label: 作業項目を追加する
                              kind: link
                              to: GET /todo/{id}/add-todo-task
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen: いつも
                            - operation: edit-todo
                              label: TODOを編集する
                              kind: link
                              to: GET /todo/{id}/edit-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen: いつも
                            - operation: start-todo
                              label: TODOに着手する
                              kind: link
                              to: GET /todo/{id}/start-todo/confirm
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - OPEN
                            - operation: suspend-todo
                              label: TODOを中断する
                              kind: link
                              to: GET /todo/{id}/suspend-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - IN_PROGRESS
                            - operation: resume-todo
                              label: TODOを再開する
                              kind: link
                              to: GET /todo/{id}/resume-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - SUSPENDED
                            - operation: complete-todo
                              label: TODOを完了する
                              kind: link
                              to: GET /todo/{id}/complete-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - IN_PROGRESS
                            - operation: cancel-todo
                              label: TODOを中止する
                              kind: link
                              to: GET /todo/{id}/cancel-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - OPEN
                                - IN_PROGRESS
                                - SUSPENDED
          - section:
              title: 全体
              gap: l
              body:
                - section:
                    id: all
                    title: すべてのTODO
                    count: TodoMapper.countTodoDashboardAll
                    body:
                      - table:
                          read: TodoMapper.selectTodoDashboardAll
                          empty: list.empty.todo
                          columns:
                            - label: ID
                              item: id
                              link:
                                to: todo
                            - label: カテゴリ
                              item: category
                              link:
                                to: category
                                name: name
                            - label: ステータス
                              item: status
                              labels:
                                - value: OPEN
                                  label: 未着手
                                - value: IN_PROGRESS
                                  label: 対応中
                                - value: SUSPENDED
                                  label: 中断
                                - value: CLOSED
                                  label: 完了
                                - value: CANCELED
                                  label: 中止
                            - label: 作業
                              computed: true
                            - label: タグ
                              item: tags
                              link:
                                to: tag
                                name: name
                                many: true
                            - label: 期限
                              item: due_on
                              format: yyyy年M月d日
                            - label: 概要
                              item: summary
                            - label: 作成日
                              item: created_on
                              format: yyyy年M月d日
                            - label: 更新日
                              item: updated_on
                              format: yyyy年M月d日
                          rowActions:
                            - operation: add-todo-comment
                              label: TODOにコメントを追加する
                              kind: link
                              to: GET /todo/{id}/add-todo-comment
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen: いつも
                            - operation: add-todo-task
                              label: 作業項目を追加する
                              kind: link
                              to: GET /todo/{id}/add-todo-task
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen: いつも
                            - operation: edit-todo
                              label: TODOを編集する
                              kind: link
                              to: GET /todo/{id}/edit-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen: いつも
                            - operation: start-todo
                              label: TODOに着手する
                              kind: link
                              to: GET /todo/{id}/start-todo/confirm
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - OPEN
                            - operation: suspend-todo
                              label: TODOを中断する
                              kind: link
                              to: GET /todo/{id}/suspend-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - IN_PROGRESS
                            - operation: resume-todo
                              label: TODOを再開する
                              kind: link
                              to: GET /todo/{id}/resume-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - SUSPENDED
                            - operation: complete-todo
                              label: TODOを完了する
                              kind: link
                              to: GET /todo/{id}/complete-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - IN_PROGRESS
                            - operation: cancel-todo
                              label: TODOを中止する
                              kind: link
                              to: GET /todo/{id}/cancel-todo
                              from: todo-dashboard
                              emphasis: secondary
                              shownWhen:
                                - OPEN
                                - IN_PROGRESS
                                - SUSPENDED
                - section:
                    id: categories
                    title: カテゴリ別の状況
                    count: CategoryMapper.countTodoDashboardCategories
                    body:
                      - matrix:
                          read: CategoryMapper.selectTodoDashboardCategories
                          rows:
                            entity: category
                            link:
                              to: category
                          columns:
                            - 未着手
                            - 対応中
                            - 中断
                            - 完了
                            - 中止
                          cell:
                            link:
                              to: todo-dashboard
                              by: その行と列で絞る（URL のパラメータ）
                            align: end
                          totals: 行と列の合計
                          empty: list.empty.category
                - section:
                    id: tags
                    title: タグ別の状況
                    count: TagMapper.countTodoDashboardTags
                    body:
                      - matrix:
                          read: TagMapper.selectTodoDashboardTags
                          rows:
                            entity: tag
                            link:
                              to: tag
                          columns:
                            - 未着手
                            - 対応中
                            - 中断
                            - 完了
                            - 中止
                          cell:
                            link:
                              to: todo-dashboard
                              by: その行と列で絞る（URL のパラメータ）
                            align: end
                          totals: 行と列の合計
                          empty: list.empty.tag
          - section:
              title: マスタ
              gap: l
              body:
                - section:
                    id: categories-master
                    title: カテゴリ一覧
                    count: CategoryMapper.countTodoDashboardCategoriesMaster
                    body:
                      - table:
                          read: CategoryMapper.selectTodoDashboardCategoriesMaster
                          empty: list.empty.category
                          columns:
                            - label: ID
                              item: id
                              link:
                                to: category
                            - label: カテゴリ名
                              item: name
                            - label: TODOの数
                              computed: true
                          rowActions: []
                - section:
                    id: tags-master
                    title: タグ一覧
                    count: TagMapper.countTodoDashboardTagsMaster
                    body:
                      - table:
                          read: TagMapper.selectTodoDashboardTagsMaster
                          empty: list.empty.tag
                          columns:
                            - label: ID
                              item: id
                              link:
                                to: tag
                            - label: タグ名
                              item: name
                            - label: TODOの数
                              computed: true
                          rowActions: []
    html:
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: notice(${page.node('page.body[0].notice')})}"></div>
      - valid: true
        plain: true
        raw: |
          <form class="filters" method="get" th:action="${page.url(page.node('page.body[1].filters').action)}" th:with="node=${page.node('page.body[1].filters')}"><th:block th:replace="~{fragments/business :: hidden(${node})}"></th:block>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: choices(${page.node('page.body[1].filters.body[0].choices')})}"></div>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: field(${page.node('page.body[1].filters.body[1].field')})}"></div>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: field(${page.node('page.body[1].filters.body[2].field')})}"></div>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: actions(${page.node('page.body[1].filters.body[3].actions')})}"></div>
      - valid: true
        plain: true
        raw: |
          </form>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: actions(${page.node('page.body[2].actions')})}"></div>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[3].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[3].section.body[0].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: dataTable(${page.node('page.body[3].section.body[0].section.body[0].table')})}"></div>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[4].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[4].section.body[0].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: dataTable(${page.node('page.body[4].section.body[0].section.body[0].table')})}"></div>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[4].section.body[1].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: matrix(${page.node('page.body[4].section.body[1].section.body[0].matrix')})}"></div>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[4].section.body[2].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: matrix(${page.node('page.body[4].section.body[2].section.body[0].matrix')})}"></div>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[5].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[5].section.body[0].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: dataTable(${page.node('page.body[5].section.body[0].section.body[0].table')})}"></div>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          <section class="panel section" th:with="node=${page.node('page.body[5].section.body[1].section')}"><h2 th:text="${node.title}"></h2><span class="muted" th:if="${node['count'] != null}" th:text="${page.count(node)}"></span>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: dataTable(${page.node('page.body[5].section.body[1].section.body[0].table')})}"></div>
      - valid: true
        plain: true
        raw: |
          </section>
      - valid: true
        plain: true
        raw: |
          </section>
    routeMatches:
      - handler: show
  - id: WPAGE-category
    key: category
    template: category/detail
    screen:
      id: category
      template: category/detail
      read: CategoryMapper.findDetail
      page:
        title: カテゴリ詳細
        width: l
        body:
          - notice:
              kind: done
          - facts:
              of: category
              columns: 2
              items:
                - item: id
                  label: ID
                - item: name
                  label: カテゴリ名
          - actions: []
    html:
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: notice(${page.node('page.body[0].notice')})}"></div>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: facts(${page.node('page.body[1].facts')})}"></div>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: actions(${page.node('page.body[2].actions')})}"></div>
    routeMatches:
      - handler: show
  - id: WPAGE-tag
    key: tag
    template: tag/detail
    screen:
      id: tag
      template: tag/detail
      read: TagMapper.findDetail
      page:
        title: タグ詳細
        width: l
        body:
          - notice:
              kind: done
          - facts:
              of: tag
              columns: 2
              items:
                - item: id
                  label: ID
                - item: name
                  label: タグ名
          - actions: []
    html:
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: notice(${page.node('page.body[0].notice')})}"></div>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: facts(${page.node('page.body[1].facts')})}"></div>
      - valid: true
        plain: true
        raw: |
          <div th:replace="~{fragments/business :: actions(${page.node('page.body[2].actions')})}"></div>
    routeMatches:
      - handler: show
  - id: WPAGE-todo
    key: todo
    template: todo/detail
    screen:
      id: todo
      template: todo/detail
      read: TodoMapper.findDetail
      page:
        title: TODO詳細
        width: l
        body:
          - notice:
              kind: done
          - facts:
              of: todo
              columns: 2
              items:
                - item: id
                  label: ID
                - item: title
                  label: タイトル
                - item: summary
                  label: 概要
                - item: category
                  label: カテゴリ
                  link:
                    to: category
                    name: name
                - item: tags
                  label: タグ
                  link:
                    to: tag
                    name: name
                    many: true
                - item: follows
                  label: 元のTODO
                  link:
                    to: todo
                    name: title
                - item: status
                  label: ステータス
                  labels:
                    - value: OPEN
                      label: 未着手
                    - value: IN_PROGRESS
                      label: 対応中
                    - value: SUSPENDED
                      label: 中断
                    - value: CLOSED
                      label: 完了
                    - value: CANCELED
                      label: 中止
                - item: created_on
                  label: 作成日
                  format: yyyy年M月d日
                - item: updated_on
                  label: 更新日
                  format: yyyy年M月d日
                - item: due_on
                  label: 期限
                  format: yyyy年M月d日
                - item: completed_on
                  label: 完了日
                  format: yyyy年M月d日
                - item: details
                  label: 詳細
                  keepBreaks: true
                - item: result
                  label: 結果
                  keepBreaks: true
          - section:
              title: コメント一覧
              body:
                - table:
                    of: comments
                    columns:
                      - item: date
                        label: 日付
                        format: yyyy年M月d日
                      - item: body
                        label: コメント本文
                        keepBreaks: true
                    rowActions:
                      - operation: edit-todo-comment
                        label: コメントを編集する
                        kind: link
                        to: GET /todo/{id}/edit-todo-comment
                        row:
                          param: row
                          item: seq
                        from: todo
                        emphasis: secondary
                        shownWhen: いつも
                      - operation: delete-todo-comment
                        label: コメントを削除する
                        kind: link
                        to: GET /todo/{id}/delete-todo-comment/confirm
                        row:
                          param: row
                          item: seq
                        from: todo
                        emphasis: secondary
                        shownWhen: いつも
          - section:
              title: 状態の履歴
              body:
                - table:
                    of: history
                    columns:
                      - item: date
                        label: 日付
                        format: yyyy年M月d日
                      - item: action
                        label: 操作
                        labels:
                          - value: register-todo
                            label: TODOを登録する
                          - value: start-todo
                            label: TODOに着手する
                          - value: complete-todo
                            label: TODOを完了する
                          - value: suspend-todo
                            label: TODOを中断する
                          - value: resume-todo
                            label: TODOを再開する
                          - value: cancel-todo
                            label: TODOを中止する
                      - item: from
                        label: 前の状態
                        labels:
                          - value: OPEN
                            label: 未着手
                          - value: IN_PROGRESS
                            label: 対応中
                          - value: SUSPENDED
                            label: 中断
                          - value: CLOSED
                            label: 完了
                          - value: CANCELED
                            label: 中止
                      - item: to
                        label: 後の状態
                        labels:
                          - value: OPEN
                            label: 未着手
                          - value: IN_PROGRESS
                            label: 対応中
                          - value: SUSPENDED
                            label: 中断
                          - value: CLOSED
                            label: 完了
                          - value: CANCELED
                            label: 中止
                      - item: note
                        label: 理由
                        keepBreaks: true
                      - item: resume_on
                        label: 再開予定日
                        format: yyyy年M月d日
          - section:
              title: 作業項目
              body:
                - table:
                    of: tasks
                    columns:
                      - item: id
                        label: ID
                      - item: title
                        label: タイトル
                      - item: done
                        label: 済
                        mark:
                          'true': 済
                          'false': 未
                    rowActions:
                      - operation: todo-task.finish
                        label: 作業項目を済にする
                        kind: link
                        to: GET /todo-task/{id}/todo-task.finish/confirm
                        from: todo
                        emphasis: secondary
                        shownWhen: いつも
          - actions:
              - operation: add-todo-comment
                label: TODOにコメントを追加する
                kind: link
                to: GET /todo/{id}/add-todo-comment
                from: todo
                emphasis: secondary
                shownWhen: いつも
              - operation: add-todo-task
                label: 作業項目を追加する
                kind: link
                to: GET /todo/{id}/add-todo-task
                from: todo
                emphasis: secondary
                shownWhen: いつも
              - operation: edit-todo
                label: TODOを編集する
                kind: link
                to: GET /todo/{id}/edit-todo
                from: todo
                emphasis: secondary
                shownWhen: いつも
              - operation: start-todo
                label: TODOに着手する
                kind: link
                to: GET /todo/{id}/start-todo/confirm
                from: todo
                emphasis: secondary
                shownWhen:
                  - OPEN
              - operation: suspend-todo
                label: TODOを中断する
                kind: link
                to: GET /todo/{id}/suspend-todo
