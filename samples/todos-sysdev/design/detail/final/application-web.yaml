        screenMatches:
          - screen: complete-todo/input
      - handler: completeTodo
        path: /todo/{id}/complete-todo
        method: POST
      - handler: cancelTodoInput
        path: /todo/{id}/cancel-todo
        method: GET
        screenMatches:
          - screen: cancel-todo/input
      - handler: cancelTodoConfirm
        path: /todo/{id}/cancel-todo/confirm
        method: POST
        screenMatches:
          - screen: cancel-todo/confirm
      - handler: cancelTodoBack
        path: /todo/{id}/cancel-todo/back
        method: POST
        screenMatches:
          - screen: cancel-todo/input
      - handler: cancelTodo
        path: /todo/{id}/cancel-todo
        method: POST
  - id: JCONT-todo-task
    key: todo-task
    controller: TodoTaskController
    handlers:
      - action: todo-task.finish
        name: 作業項目を済にする
        service: TodoTaskService.todoTaskFinish
        returnTo: 起点の画面（パラメータ from の画面の ID。画面遷移定義書にある画面だけを受け取る）
        steps:
          - handler: todoTaskFinishConfirm
            request: GET /todo-task/{id}/todo-task.finish/confirm
            screen: todo-task.finish/confirm
            does: 受け手を読んで確認画面を出す
            reads:
              - TodoTaskMapper.findById
            calls: []
            session:
              puts:
                - token
          - handler: todoTaskFinish
            request: POST /todo-task/{id}/todo-task.finish
            does: トークンを照合して消す（無い・違うなら InvalidTokenException）→ Service で入力検査・状態・前提・データの決まりを確かめ直して書く → 断れば（RefusedException）確認画面に断りの文を出す。書けたら完了の知らせを置き、起点の画面へリダイレクトする
            session:
              reads:
                - token
              removes:
                - token
              puts:
                - notice
            refusals:
              - check.updated-not-before-created
              - check.closed-has-no-open-task
    routes:
      - handler: todoTaskFinishConfirm
        path: /todo-task/{id}/todo-task.finish/confirm
        method: GET
        screenMatches:
          - screen: todo-task.finish/confirm
      - handler: todoTaskFinish
        path: /todo-task/{id}/todo-task.finish
        method: POST
  - id: JCONT-todo-dashboard
    key: todo-dashboard
    controller: TodoDashboardController
    screens:
      - screen: todo-dashboard
        handler: show
        request: GET /
        params:
          - key: tags
            label: タグ
            multiple: true
          - key: category
            label: カテゴリ
          - key: date
            label: 基準日
          - key: categories.cell
            label: 区画「カテゴリ別の状況」のセル（行と列）
          - key: tags.cell
            label: 区画「タグ別の状況」のセル（行と列）
        does: 絞り込みで区画の一覧と集計を読んで、一覧画面を出す
        service: TodoDashboardService.show
        reads:
          - section: overdue
            select: TodoMapper.selectTodoDashboardOverdue
            count: TodoMapper.countTodoDashboardOverdue
          - section: all
            select: TodoMapper.selectTodoDashboardAll
            count: TodoMapper.countTodoDashboardAll
          - section: categories
            select: CategoryMapper.selectTodoDashboardCategories
            count: CategoryMapper.countTodoDashboardCategories
          - section: tags
            select: TagMapper.selectTodoDashboardTags
            count: TagMapper.countTodoDashboardTags
          - section: categories-master
            select: CategoryMapper.selectTodoDashboardCategoriesMaster
            count: CategoryMapper.countTodoDashboardCategoriesMaster
          - section: tags-master
            select: TagMapper.selectTodoDashboardTagsMaster
            count: TagMapper.countTodoDashboardTagsMaster
        candidates:
          - TagMapper.selectAll
          - CategoryMapper.selectAll
        session:
          reads:
            - notice
    routes:
      - handler: show
        path: /
        method: GET
        screenMatches:
          - screen: todo-dashboard
