# 生成物（screen-styles）: 手で直さず、業務モデルか生成の定義（design/detail/screen-styles.yaml）を直して作り直します（CLI generate）。
id: screen-styles
name: 画面のクラスと CSS の対応表
naming:
  - part: 部品
    rule: 部品の名前をそのままクラスにする（page・notice・filters・section・facts・table・form・field・choices・rows・actions・matrix）
  - part: width（画面）
    rule: w-{s|m|l}
  - part: width（欄）
    rule: w-{n}ch（欄の最大幅。狭い画面では画面幅に収める）
  - part: columns
    rule: cols-{n}
  - part: emphasis
    rule: button-{primary|secondary}
  - part: align
    rule: align-end
  - part: gap
    rule: gap-{s|m|l}
  - part: notice の種類
    rule: notice-{done|errors|refusal}
  - part: field の部品
    rule: control-{text|textarea|date|select|checkbox|number}
classes:
  - class: page
    applies: 'margin: 0 auto; padding: var(--space-large) var(--space-medium); display: grid; gap: var(--space-large)'
  - class: w-s
    applies: 'max-width: var(--width-small)'
  - class: w-m
    applies: 'max-width: var(--width-medium)'
  - class: w-l
    applies: 'max-width: var(--width-large)'
  - class: notice-done
    applies: 'border-left: 3px solid var(--success); color: var(--success); padding: var(--space-medium); background: var(--surface)'
  - class: notice-errors
    applies: 'border-left: 3px solid var(--danger); color: var(--danger); padding: var(--space-medium); background: var(--surface)'
  - class: notice-refusal
    applies: 'border-left: 3px solid var(--warning); color: var(--warning); padding: var(--space-medium); background: var(--surface)'
  - class: section
    applies: 'display: grid; gap: var(--space-medium); padding: var(--space-medium); background: var(--surface); border: 1px
      solid var(--line); border-radius: var(--radius)'
  - class: filters
    applies: 'display: flex; flex-wrap: wrap; align-items: end; gap: var(--space-medium); padding: var(--space-medium); border:
      1px solid var(--line); background: var(--surface)'
  - class: facts
    applies: 'display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-small) var(--space-medium)'
  - class: cols-2
    applies: 'grid-template-columns: repeat(2, max-content minmax(0, 1fr))'
  - class: table
    applies: 'width: 100%; border-collapse: collapse; text-align: left'
  - class: matrix
    applies: 'width: 100%; border-collapse: collapse; text-align: left'
  - class: form
    applies: 'display: grid; gap: var(--space-medium)'
  - class: field
    applies: 'display: flex; flex-direction: column; gap: var(--space-small)'
  - class: choices
    applies: 'display: flex; flex-wrap: wrap; gap: var(--space-medium)'
  - class: rows
    applies: 'width: 100%; border-collapse: collapse; text-align: left'
  - class: control-text
    applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
  - class: control-textarea
    applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
  - class: control-date
    applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
  - class: control-select
    applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
  - class: control-number
    applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius);
      text-align: right'
  - class: control-checkbox
    applies: 'accent-color: var(--primary); width: 1.25rem; height: 1.25rem'
  - class: actions
    applies: 'display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-small)'
  - class: button-primary
    applies: 'background: var(--primary); color: var(--ink); border: 1px solid var(--primary); font-weight: 700'
  - class: button-secondary
    applies: 'background: var(--surface); color: var(--text); border: 1px solid var(--line)'
  - class: align-end
    applies: 'text-align: right'
  - class: gap-s
    applies: 'gap: var(--space-small)'
  - class: gap-m
    applies: 'gap: var(--space-medium)'
  - class: gap-l
    applies: 'gap: var(--space-large)'
  - class: badge
    applies: 'display: inline-flex; padding: .15em .6em; border: 1px solid currentColor; border-radius: var(--radius); font-size:
      var(--small); white-space: nowrap'
  - class: brand
    applies: 'font-family: var(--font-display); font-weight: 700; letter-spacing: .16em; color: var(--primary); text-decoration:
      none'
  - class: eyebrow
    applies: 'font-family: var(--font-mono); color: var(--primary); font-size: var(--small); letter-spacing: .14em; text-transform:
      uppercase'
  - class: field-error
    applies: 'color: var(--danger)'
  - class: footer
    applies: 'color: var(--muted); border-top: 1px solid var(--line); padding-top: var(--space-medium); font-size: var(--small)'
  - class: hero
    applies: 'border-left: 3px solid var(--secondary); padding-left: var(--space-medium); display: grid; gap: var(--space-small)'
  - class: palette
    applies: 'display: flex; flex-wrap: wrap; gap: var(--space-small)'
  - class: panel-grid
    applies: 'display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-medium); align-items: start'
  - class: panel-title
    applies: 'display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-small); padding-bottom:
      var(--space-small); border-bottom: 1px solid var(--line)'
  - class: required
    applies: 'color: var(--secondary); font-size: var(--small); margin-left: .5em'
  - class: shell-header
    applies: 'display: flex; align-items: center; justify-content: space-between; gap: var(--space-medium); flex-wrap: wrap;
      padding: var(--space-medium) var(--space-large); border-bottom: 1px solid var(--line); background: var(--surface)'
  - class: skip-link
    applies: 'position: absolute; top: -100px; left: var(--space-medium); padding: var(--space-small); background: var(--primary);
      color: var(--ink); z-index: 2'
  - class: status-active
    applies: 'color: var(--primary)'
  - class: status-done
    applies: 'color: var(--success)'
  - class: status-error
    applies: 'color: var(--danger)'
  - class: status-waiting
    applies: 'color: var(--warning)'
  - class: swatch
    applies: 'display: grid; gap: .3em; flex: 1 0 130px; padding: var(--space-small); border: 1px solid var(--line); border-top:
      4px solid var(--swatch); font: var(--small)/1.6 var(--font-mono); background: var(--surface)'
  - class: table-scroll
    applies: 'overflow-x: auto'
