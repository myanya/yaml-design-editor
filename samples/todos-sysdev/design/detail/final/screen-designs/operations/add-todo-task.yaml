# 生成物（screen-designs-operations）: 手で直さず、業務モデルか生成の定義（design/detail/screen-designs-operations.yaml）を直して作り直します（CLI generate）。
id: add-todo-task
name: 作業項目を追加する（画面設計書）
form:
  class: AddTodoTaskForm
  emptyAsNull: 空の欄は未入力（null）として受け取る（前後の空白は落とさない）
  fields:
    - name: title
      item: title
      type: String
      validations:
        - name: NotNull
        - name: Size
          min: 1
          max: 100
        - name: Pattern
          regexp: ^[^\r\n]*$
    - name: version
      item: version
      type: Long
      validations:
        - name: NotNull
  classes: []
screens:
  - id: add-todo-task/input
    template: todo/add-todo-task/input
    page:
      title: 作業項目を追加する
      width: m
      body:
        - notice:
            kind: errors
            for: form
        - facts:
            of: todo
            title: 対象
            items:
              - item: id
                label: ID
              - item: title
        - form:
            action: POST /todo/{id}/add-todo-task/confirm
            object: AddTodoTaskForm
            hidden:
              - version
              - from
            body:
              - field:
                  item: title
                  label: 作業
                  control: text
                  required: true
                  width: 40ch
              - actions:
                  - label: 確認へ
                    kind: submit
                    emphasis: primary
                  - label: やめる
                    kind: link
                    to: 起点の画面
                    emphasis: secondary
  - id: add-todo-task/confirm
    template: todo/add-todo-task/confirm
    page:
      title: 作業項目を追加する（確認）
      width: m
      body:
        - notice:
            kind: refusal
        - facts:
            of: todo
            title: 対象
            items:
              - item: id
                label: ID
              - item: title
        - facts:
            title: 入力した値
            of: form
            items:
              - item: title
                label: 作業
        - form:
            action: POST /todo/{id}/add-todo-task
            hidden:
              - title
              - version
              - flow
              - from
            body:
              - actions:
                  - label: 確定
                    kind: submit
                    emphasis: primary
                  - label: 入力へ戻る
                    kind: submit
                    action: POST /todo/{id}/add-todo-task/back
                    emphasis: secondary
designId: DOC-screen-designs-operations.add-todo-task
designKind: screen-designs-operations
designPath: design/detail/final/screen-designs/operations/add-todo-task.yaml
origins:
  source:
    id: rule-screen-designs-operations
    document: .yde/transforms/design/detail/screen-designs-operations-derived.yaml
    path: []
  decisions: []
  inputs: []
