# 生成物（detail-table-access）: 手で直さず、業務モデルか生成の定義（design/detail/detail-table-access.yaml）を直して作り直します（CLI generate）。
id: ACC-tag
source: ENT-tag
entity: tag
label: タグの読み書き
mapper: TagMapper
tables:
  - TBL-tag
methods:
  - id: MTH-tag.findDetail
    name: findDetail
    kind: select
    table: TBL-tag
    where:
      - item: id
        param: id
        column: COL-tag.id
    includes: []
    names: []
    sources:
      - SCR-tag
  - id: MTH-tag.selectAll
    name: selectAll
    kind: select
    table: TBL-tag
    columns:
      - id
      - name
    order:
      - item: id
        column: COL-tag.id
    sources:
      - ENT-tag
  - id: MTH-tag.selectTodoDashboardTags
    name: selectTodoDashboardTags
    kind: aggregate
    table: TBL-tag
    order:
      - item: id
        column: COL-tag.id
    groupBy:
      - item: id
        column: COL-tag.id
      - item: status
        of: todo
        values:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
          - CLOSED
          - CANCELED
    counts: TBL-todo
    via:
      relation: tagged
      dir: in
    sources:
      - QRY-todo-dashboard.tags
  - id: MTH-tag.countTodoDashboardTags
    name: countTodoDashboardTags
    kind: count
    table: TBL-tag
    sources:
      - QRY-todo-dashboard.tags
  - id: MTH-tag.selectTodoDashboardTagsMaster
    name: selectTodoDashboardTagsMaster
    kind: select
    table: TBL-tag
    columns:
      - item: id
        column: COL-tag.id
      - label: タグ名
        item: name
        column: COL-tag.name
      - label: TODOの数
        computed:
          count: 参照してくる要素
          relation: tagged
          dir: in
    where: []
    order:
      - item: id
        column: COL-tag.id
    params: []
    sources:
      - QRY-todo-dashboard.tags-master
  - id: MTH-tag.countTodoDashboardTagsMaster
    name: countTodoDashboardTagsMaster
    kind: count
    table: TBL-tag
    sources:
      - QRY-todo-dashboard.tags-master
    whereFrom: MTH-tag.selectTodoDashboardTagsMaster
  - id: MTH-tag.insert
    name: insert
    kind: insert
    table: TBL-tag
    columns:
      mode: all
    sources:
      - ACT-add-tag
  - id: MTH-tag.maxId
    name: maxId
    kind: max
    table: TBL-tag
    item: id
    where:
      - item: id
        startsWith: TAG-
        column: COL-tag.id
    numbering:
      path: id
      prefix: TAG-
      digits: 3
    sources:
      - ACT-add-tag
    column: COL-tag.id
