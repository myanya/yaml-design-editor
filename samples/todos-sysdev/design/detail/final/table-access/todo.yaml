            format: '{done}/{all}'
            parts:
              done:
                count: todo_task
                parent: 行の ID
                where:
                  - item: done
                    op: equals
                    value: true
              all:
                count: 入れ子の要素
                item: tasks
                parent: 行の ID
          replace:
