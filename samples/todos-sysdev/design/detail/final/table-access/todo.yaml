# 生成物（detail-table-access）: 手で直さず、業務モデルか生成の定義（design/detail/detail-table-access.yaml）を直して作り直します（CLI generate）。
id: ACC-todo
source: ENT-todo
entity: todo
label: TODOの読み書き
mapper: TodoMapper
tables:
  - TBL-todo
  - TBL-todo_tags
  - TBL-todo_comments
  - TBL-todo_history
methods:
  - id: MTH-todo.findDetail
    name: findDetail
    kind: select
    table: TBL-todo
    where:
      - item: id
        param: id
        column: COL-todo.id
    includes:
      - item: tags
        table: TBL-todo_tags
        order:
          - item: seq
            column: COL-todo_tags.seq
        column: COL-todo_tags.tag_id
      - item: comments
        table: TBL-todo_comments
        order:
          - item: seq
            column: COL-todo_comments.seq
      - item: history
        table: TBL-todo_history
        order:
          - item: seq
            column: COL-todo_history.seq
      - item: tasks
        table: TBL-todo_task
        order:
          - item: seq
            column: COL-todo_task.seq
        where:
          - item: deleted
            equals: false
            column: COL-todo_task.deleted
    names:
      - item: category
        table: TBL-category
        name: name
      - item: tags
        table: TBL-tag
        name: name
      - item: follows
        table: TBL-todo
        name: title
        column: COL-todo.follows
    sources:
      - SCR-todo
  - id: MTH-todo.selectAll
    name: selectAll
    kind: select
    table: TBL-todo
    columns:
      - id
      - title
    order:
      - item: id
        column: COL-todo.id
    sources:
      - ENT-todo
  - id: MTH-todo.selectTodoDashboardOverdue
    name: selectTodoDashboardOverdue
    kind: select
    table: TBL-todo
    columns:
      - item: id
        column: COL-todo.id
      - label: タイトル
        item: title
        column: COL-todo.title
      - label: ステータス
        item: status
        column: COL-todo.status
      - label: 期限
        item: due_on
        column: COL-todo.due_on
      - label: 完了日
        item: completed_on
        column: COL-todo.completed_on
    where:
      - item: tags
        op: includesAny
        value: $tags
        via: TBL-todo_tags
        skipIfEmpty: true
      - item: category
        op: equals
        value: $category
        skipIfEmpty: true
        column: COL-todo.category
      - item: status
        op: in
        values:
          - OPEN
          - IN_PROGRESS
        column: COL-todo.status
      - item: due_on
        op: notNull
        column: COL-todo.due_on
      - item: due_on
        op: lt
        value: $today
        column: COL-todo.due_on
    order:
      - item: due_on
        nulls: last
        column: COL-todo.due_on
    params:
      - tags
      - category
      - today
    sources:
      - QRY-todo-dashboard.overdue
  - id: MTH-todo.countTodoDashboardOverdue
    name: countTodoDashboardOverdue
    kind: count
    table: TBL-todo
    sources:
      - QRY-todo-dashboard.overdue
    whereFrom: MTH-todo.selectTodoDashboardOverdue
  - id: MTH-todo.selectTodoDashboardAll
    name: selectTodoDashboardAll
    kind: select
    table: TBL-todo
    columns:
      - item: id
        column: COL-todo.id
      - label: カテゴリ
        item: category
        names:
          table: TBL-category
          name: name
        column: COL-todo.category
      - label: ステータス
        item: status
        column: COL-todo.status
      - label: 作業
        computed:
          of:
            format: '{done}/{all}'
            parts:
              done:
                count: todo_task
                parent: 行の ID
                where:
                  - item: done
                    op: equals
                    value: true
                  - item: deleted
                    op: equals
                    value: false
              all:
                count: 入れ子の要素
                item: tasks
                parent: 行の ID
                where:
                  - item: deleted
                    op: equals
                    value: false
          replace:
            0/0: ''
      - label: タグ
        item: tags
        names:
          table: TBL-tag
          name: name
          many: true
      - label: 期限
        item: due_on
        column: COL-todo.due_on
      - label: 概要
        item: summary
        column: COL-todo.summary
      - label: 作成日
        item: created_on
        column: COL-todo.created_on
      - label: 更新日
        item: updated_on
        column: COL-todo.updated_on
    where:
      - item: tags
        op: includesAny
        value: $tags
        via: TBL-todo_tags
        skipIfEmpty: true
      - item: category
        op: equals
        value: $category
        skipIfEmpty: true
        column: COL-todo.category
    order:
      - item: id
        column: COL-todo.id
    params:
      - tags
      - category
    sources:
      - QRY-todo-dashboard.all
  - id: MTH-todo.countTodoDashboardAll
    name: countTodoDashboardAll
    kind: count
    table: TBL-todo
    sources:
      - QRY-todo-dashboard.all
    whereFrom: MTH-todo.selectTodoDashboardAll
  - id: MTH-todo.findById
    name: findById
    kind: select
    table: TBL-todo
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-add-todo-comment
      - ACT-edit-todo-comment
      - ACT-delete-todo-comment
      - ACT-add-todo-task
      - ACT-delete-todo-task
      - ACT-edit-todo
      - ACT-start-todo
      - ACT-suspend-todo
      - ACT-resume-todo
      - ACT-complete-todo
      - ACT-cancel-todo
  - id: MTH-todo.insert
    name: insert
    kind: insert
    table: TBL-todo
    columns:
      mode: all
    sources:
      - ACT-register-todo
  - id: MTH-todo.maxId
    name: maxId
    kind: max
    table: TBL-todo
    item: id
    where:
      - item: id
        startsWith: TODO-
        column: COL-todo.id
    numbering:
      path: id
      prefix: TODO-
      digits: 3
    sources:
      - ACT-register-todo
    column: COL-todo.id
  - id: MTH-todo.insertTodoTags
    name: insertTodoTags
    kind: insert
    table: TBL-todo_tags
    columns:
      mode: all
    sources:
      - ACT-register-todo
      - ACT-edit-todo
  - id: MTH-todo.insertTodoHistory
    name: insertTodoHistory
    kind: insert
    table: TBL-todo_history
    columns:
      mode: all
    sources:
      - ACT-register-todo
      - ACT-start-todo
      - ACT-suspend-todo
      - ACT-resume-todo
      - ACT-complete-todo
      - ACT-cancel-todo
  - id: MTH-todo.maxSeqTodoHistory
    name: maxSeqTodoHistory
    kind: max
    table: TBL-todo_history
    item: seq
    where:
      - item: todo_id
        param: id
        column: COL-todo_history.todo_id
    sources:
      - ACT-register-todo
      - ACT-start-todo
      - ACT-suspend-todo
      - ACT-resume-todo
      - ACT-complete-todo
      - ACT-cancel-todo
    column: COL-todo_history.seq
  - id: MTH-todo.insertTodoComments
    name: insertTodoComments
    kind: insert
    table: TBL-todo_comments
    columns:
      mode: all
    sources:
      - ACT-add-todo-comment
  - id: MTH-todo.maxSeqTodoComments
    name: maxSeqTodoComments
    kind: max
    table: TBL-todo_comments
    item: seq
    where:
      - item: todo_id
        param: id
        column: COL-todo_comments.todo_id
    sources:
      - ACT-add-todo-comment
    column: COL-todo_comments.seq
  - id: MTH-todo.addTodoComment
    name: addTodoComment
    kind: update
    table: TBL-todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-add-todo-comment
  - id: MTH-todo.editTodoCommentCommentsRow
    name: editTodoCommentCommentsRow
    kind: update
    table: TBL-todo_comments
    set:
      - item: date
        value: $date
        when:
          - path: date
            exists: true
        mode: value
        column: COL-todo_comments.date
      - item: body
        value: $body
        when:
          - path: body
            exists: true
        mode: value
        column: COL-todo_comments.body
    where:
      - item: todo_id
        param: id
        column: COL-todo_comments.todo_id
      - item: seq
        param: row
        column: COL-todo_comments.seq
    sources:
      - ACT-edit-todo-comment
  - id: MTH-todo.editTodoComment
    name: editTodoComment
    kind: update
    table: TBL-todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-edit-todo-comment
  - id: MTH-todo.deleteTodoCommentCommentsRow
    name: deleteTodoCommentCommentsRow
    kind: delete
    table: TBL-todo_comments
    where:
      - item: todo_id
        param: id
        column: COL-todo_comments.todo_id
      - item: seq
        param: row
        column: COL-todo_comments.seq
    sources:
      - ACT-delete-todo-comment
  - id: MTH-todo.deleteTodoComment
    name: deleteTodoComment
    kind: update
    table: TBL-todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-delete-todo-comment
  - id: MTH-todo.addTodoTask
    name: addTodoTask
    kind: update
    table: TBL-todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-add-todo-task
  - id: MTH-todo.deleteTodoTask
    name: deleteTodoTask
    kind: update
    table: TBL-todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-delete-todo-task
  - id: MTH-todo.editTodo
    name: editTodo
    kind: update
    table: TBL-todo
    set:
      - item: title
        value: $title
        when:
          - path: title
            exists: true
        mode: value
        column: COL-todo.title
      - item: summary
        value: $summary
        when:
          - path: summary
            exists: true
        mode: value
        column: COL-todo.summary
      - item: category
        value: $category
        when:
          - path: category
            exists: true
        mode: value
        column: COL-todo.category
      - item: created_on
        value: $created_on
        when:
          - path: created_on
            exists: true
        mode: value
        column: COL-todo.created_on
      - item: due_on
        value: $due_on
        when:
          - path: due_on
            exists: true
        mode: value
        column: COL-todo.due_on
      - item: details
        value: $details
        when:
          - path: details
            exists: true
        mode: value
        column: COL-todo.details
      - item: result
        value: $result
        when:
          - path: result
            exists: true
        mode: value
        column: COL-todo.result
      - item: category
        value: null
        when:
          - path: clear.category
            equals: true
        mode: clear
        column: COL-todo.category
      - item: due_on
        value: null
        when:
          - path: clear.due_on
            equals: true
        mode: clear
        column: COL-todo.due_on
      - item: details
        value: null
        when:
          - path: clear.details
            equals: true
        mode: clear
        column: COL-todo.details
      - item: result
        value: null
        when:
          - path: clear.result
            equals: true
        mode: clear
        column: COL-todo.result
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-edit-todo
  - id: MTH-todo.deleteTodoTags
    name: deleteTodoTags
    kind: delete
    table: TBL-todo_tags
    where:
      - item: todo_id
        param: id
        column: COL-todo_tags.todo_id
    sources:
      - ACT-edit-todo
  - id: MTH-todo.startTodo
    name: startTodo
    kind: update
    table: TBL-todo
    set:
      - item: status
        value: IN_PROGRESS
        mode: value
        column: COL-todo.status
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-start-todo
  - id: MTH-todo.suspendTodo
    name: suspendTodo
    kind: update
    table: TBL-todo
    set:
      - item: status
        value: SUSPENDED
        mode: value
        column: COL-todo.status
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-suspend-todo
  - id: MTH-todo.resumeTodo
    name: resumeTodo
    kind: update
    table: TBL-todo
    set:
      - item: status
        value: IN_PROGRESS
        mode: value
        column: COL-todo.status
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-resume-todo
  - id: MTH-todo.completeTodo
    name: completeTodo
    kind: update
    table: TBL-todo
    set:
      - item: completed_on
        value: $date
        mode: value
        column: COL-todo.completed_on
      - item: result
        value: $result
        mode: value
        column: COL-todo.result
      - item: status
        value: CLOSED
        mode: value
        column: COL-todo.status
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-complete-todo
  - id: MTH-todo.cancelTodo
    name: cancelTodo
    kind: update
    table: TBL-todo
    set:
      - item: result
        value: $reason
        mode: value
        column: COL-todo.result
      - item: status
        value: CANCELED
        mode: value
        column: COL-todo.status
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: next
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: id
        column: COL-todo.id
    sources:
      - ACT-cancel-todo
  - id: MTH-todo.todoTaskFinish
    name: todoTaskFinish
    kind: update
    table: TBL-todo
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
        mode: value
        column: COL-todo.updated_on
      - item: version
        value:
          $copy: version
          $of: ownerNext
        mode: value
        column: COL-todo.version
    where:
      - item: id
        param: todoId
        column: COL-todo.id
    sources:
      - ACT-todo-task.finish
