        column: status
      - item: due_on
        op: notNull
        columnId: COL-todo.due_on
        column: due_on
      - item: due_on
        op: lt
        value: $today
        columnId: COL-todo.due_on
        column: due_on
    order:
      - item: due_on
        nulls: last
        columnId: COL-todo.due_on
        column: due_on
