# 生成物（detail-table-access）: 手で直さず、業務モデルか生成の定義（design/detail/detail-table-access.yaml）を直して作り直します（CLI generate）。
id: ACC-category
source: ENT-category
entity: category
label: カテゴリの読み書き
mapper: CategoryMapper
tables:
  - TBL-category
methods:
  - id: MTH-category.findDetail
    name: findDetail
    kind: select
    table: TBL-category
    where:
      - item: id
        param: id
        column: COL-category.id
    includes: []
    names: []
    sources:
      - SCR-category
  - id: MTH-category.selectAll
    name: selectAll
    kind: select
    table: TBL-category
    columns:
      - id
      - name
    order:
      - item: id
        column: COL-category.id
    sources:
      - ENT-category
  - id: MTH-category.selectTodoDashboardCategories
    name: selectTodoDashboardCategories
    kind: aggregate
    table: TBL-category
    order:
      - item: id
        column: COL-category.id
    groupBy:
      - item: id
        column: COL-category.id
      - item: status
        of: todo
        values:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
          - CLOSED
          - CANCELED
    counts: TBL-todo
    via:
      relation: in-category
      dir: in
    sources:
      - QRY-todo-dashboard.categories
  - id: MTH-category.countTodoDashboardCategories
    name: countTodoDashboardCategories
    kind: count
    table: TBL-category
    sources:
      - QRY-todo-dashboard.categories
  - id: MTH-category.selectTodoDashboardCategoriesMaster
    name: selectTodoDashboardCategoriesMaster
    kind: select
    table: TBL-category
    columns:
      - item: id
        column: COL-category.id
      - label: カテゴリ名
        item: name
        column: COL-category.name
      - label: TODOの数
        computed:
          count: 参照してくる要素
          relation: in-category
          dir: in
    where: []
    order:
      - item: id
        column: COL-category.id
    params: []
    sources:
      - QRY-todo-dashboard.categories-master
  - id: MTH-category.countTodoDashboardCategoriesMaster
    name: countTodoDashboardCategoriesMaster
    kind: count
    table: TBL-category
    sources:
      - QRY-todo-dashboard.categories-master
    whereFrom: MTH-category.selectTodoDashboardCategoriesMaster
  - id: MTH-category.insert
    name: insert
    kind: insert
    table: TBL-category
    columns:
      mode: all
    sources:
      - ACT-add-category
  - id: MTH-category.maxId
    name: maxId
    kind: max
    table: TBL-category
    item: id
    where:
      - item: id
        startsWith: CAT-
        column: COL-category.id
    numbering:
      path: id
      prefix: CAT-
      digits: 3
    sources:
      - ACT-add-category
    column: COL-category.id
