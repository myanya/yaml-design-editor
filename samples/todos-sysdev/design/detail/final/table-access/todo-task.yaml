# 生成物（detail-table-access）: 手で直さず、業務モデルか生成の定義（design/detail/detail-table-access.yaml）を直して作り直します（CLI generate）。
id: ACC-todo-task
source: ENT-todo-task
entity: todo-task
label: 作業項目の読み書き
mapper: TodoTaskMapper
tables:
  - TBL-todo_task
methods:
  - id: MTH-todo-task.findById
    name: findById
    kind: select
    table: TBL-todo_task
    where:
      - item: id
        param: id
        column: COL-todo_task.id
    sources:
      - ACT-todo-task.finish
  - id: MTH-todo-task.insert
    name: insert
    kind: insert
    table: TBL-todo_task
    columns:
      mode: all
    sources:
      - ACT-add-todo-task
  - id: MTH-todo-task.maxId
    name: maxId
    kind: max
    table: TBL-todo_task
    item: id
    where:
      - item: todo_id
        param: id
        column: COL-todo_task.todo_id
    numbering:
      path: id
      prefix:
        $format: '{id}-S'
        $of: owner
      digits: 2
    sources:
      - ACT-add-todo-task
    column: COL-todo_task.id
  - id: MTH-todo-task.maxSeq
    name: maxSeq
    kind: max
    table: TBL-todo_task
    item: seq
    where:
      - item: todo_id
        param: id
        column: COL-todo_task.todo_id
    sources:
      - ACT-add-todo-task
    column: COL-todo_task.seq
  - id: MTH-todo-task.todoTaskFinish
    name: todoTaskFinish
    kind: update
    table: TBL-todo_task
    set:
      - item: done
        value: true
        mode: value
        column: COL-todo_task.done
    where:
      - item: id
        param: id
        column: COL-todo_task.id
    sources:
      - ACT-todo-task.finish
  - id: MTH-todo-task.countCompleteTodoNoOpenTask
    name: countCompleteTodoNoOpenTask
    kind: count
    table: TBL-todo_task
    where:
      - item: todo_id
        param: id
        column: COL-todo_task.todo_id
      - item: done
        equals: false
        column: COL-todo_task.done
    precondition: PRE-complete-todo.no-open-task
    expect: absent
    sources:
      - ACT-complete-todo
  - id: MTH-todo-task.countClosedHasNoOpenTask
    name: countClosedHasNoOpenTask
    kind: count
    table: TBL-todo_task
    join:
      - table: TBL-todo
        item: id
        equalsItem: todo_id
        column: COL-todo.id
    where:
      - item: todo_id
        param: todoId
        column: COL-todo_task.todo_id
      - table: TBL-todo
        item: status
        equals: CLOSED
        column: COL-todo.status
      - item: done
        equals: false
        column: COL-todo_task.done
    constraint: RUL-closed-has-no-open-task
    expect: absent
    sources:
      - ACT-add-todo-task
      - ACT-complete-todo
      - ACT-todo-task.finish
