  - seq: '09'
    id: SQL-common.一行の文
    type: TYP-common.一行の文
    literal: string
    sql: VARCHAR({maxLength})
    description: 最大文字数を長さにする
  - seq: '10'
    id: SQL-common.文章
    type: TYP-common.文章
    literal: string
    sql: VARCHAR
    description: 業務モデルに上限が無いので長さを決めない
  - seq: '11'
    id: SQL-common.ステータス
    type: TYP-common.ステータス
    literal: string
    sql: VARCHAR
    description: 選択肢の値は CHECK で縛る
  - seq: '12'
    id: SQL-common.TODOの操作
    type: TYP-common.TODOの操作
    literal: string
    sql: VARCHAR
    description: 選択肢の値は CHECK で縛る
  - seq: '13'
    id: SQL-text
    type: TYP-text
    literal: string
    sql: VARCHAR
    description: 組込みの文章（上限なし）
  - seq: '14'
    id: SQL-boolean
    type: TYP-boolean
    literal: boolean
    sql: BOOLEAN
  - seq: '15'
    id: SQL-seq
    literal: number
    sql: INTEGER
    description: 詳細設計だけの型。明細と入れ子のテーブルの並び順（1 から）
  - seq: '16'
    id: SQL-key
    literal: string
    sql: VARCHAR
    description: 詳細設計だけの型。マップの項目を写した明細テーブルのキー（業務モデルのマップのキー）
  - seq: '17'
    id: SQL-int
    literal: number
    sql: INTEGER
    description: 組込みの整数（型の名前を持たない整数の項目）。方式が足す項目（同時更新を検出する版など）が使う
