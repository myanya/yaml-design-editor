# 生成物（detail-processes）: 手で直さず、業務モデルか生成の定義（design/detail/detail-processes.yaml）を直して作り直します（CLI generate）。
id: PRC-complete-todo
source: ACT-complete-todo
operation: complete-todo
label: TODOを完了する
inputs:
  - key: date
    label: 完了日
    type: common#年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    required: true
    format: yyyy年M月d日
  - key: result
    label: 完了結果
    type: todo-operations#操作の記録
    base: string
    description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
    required: true
    minLength: 1
    multiline: true
  - key: version
    label: 版
    type: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    builtinType:
      name: int
      base: int
      builtin: true
    carried: true
service:
  class: TodoService
  method: completeTodo
  arguments:
    - id
    - date
    - result
    - version
confirm:
  - method: checkCompleteTodo
    arguments:
      - id
      - date
      - result
      - version
    does: 受け手を読み（あれば）、入力の値で書いた後の値を計算し、次の決まりを確かめる（書かない）。違反は欄の名前とメッセージのキーの並びで返す
    constraints:
      - constraint: RUL-completed-not-before-created
        field: date
        message: MSG-check.completed-not-before-created
      - constraint: RUL-closed-has-completed-on
        field: date
        message: MSG-check.closed-has-completed-on
      - constraint: RUL-closed-has-result
        field: result
        message: MSG-check.closed-has-result
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-complete-todo.01
    step: read
    call: MTH-todo.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: ENT-todo
  - id: STP-complete-todo.02
    step: check
    error: ERR-complete-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - ENC-todo-IN_PROGRESS
    message: MSG-complete-todo.state
    checkMode: state
    phase: before
    entity: ENT-todo
    stateField: status
  - id: STP-complete-todo.03
    step: check
    precondition: PRE-complete-todo.no-open-task
    by: SQL（件数）
    call: MTH-todo-task.countCompleteTodoNoOpenTask
    expect: 0 件なら通す
    message: MSG-complete-todo.no-open-task
    checkMode: count
    phase: before
    entity: ENT-todo
    countExpectation: absent
    key:
      param: id
  - id: STP-complete-todo.04
    step: check
    precondition: PRE-complete-todo.version-unchanged
    by: Java（読んだ行）
    rule:
      - of: t
        path: version
        equals: $version
    message: MSG-complete-todo.version-unchanged
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-complete-todo.05
    step: check
    constraint: RUL-updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: MSG-check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-complete-todo.06
    step: check
    constraint: RUL-completed-not-before-created
    by: Java（書いた後の値）
    rule:
      where:
        - path: completed_on
          exists: true
      check:
        - gte:
            - path: completed_on
            - path: created_on
    field: date
    message: MSG-check.completed-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-complete-todo.07
    step: check
    constraint: RUL-closed-has-completed-on
    by: Java（書いた後の値）
    rule:
      where:
        - path: status
          equals: CLOSED
        - path: completed_on
          exists: false
      expect: absent
    field: date
    message: MSG-check.closed-has-completed-on
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-complete-todo.08
    step: check
    constraint: RUL-closed-has-result
    by: Java（書いた後の値）
    rule:
      where:
        - path: status
          equals: CLOSED
        - path: result
          empty: true
      expect: absent
    field: result
    message: MSG-check.closed-has-result
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-complete-todo.09
    step: write
    call: MTH-todo.completeTodo
    kind: update
    set:
      - item: completed_on
        value: $date
      - item: result
        value: $result
      - item: status
        value: CLOSED
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: next
    where:
      - item: id
        param: id
        value:
          param: id
  - id: STP-complete-todo.10
    step: write
    call: MTH-todo.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date: $date
      action: complete-todo
      from:
        $copy: status
        $of: self
      to: CLOSED
    seq:
      mode: next
      call: MTH-todo.maxSeqTodoHistory
      key:
        param: id
  - id: STP-complete-todo.11
    step: check
    constraint: RUL-closed-has-no-open-task
    by: SQL（件数。書いた後）
    call: MTH-todo-task.countClosedHasNoOpenTask
    key:
      param: id
    expect: 0 件なら通す
    violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
    message: MSG-check.closed-has-no-open-task
    checkMode: count
    phase: after
    entity: ENT-todo
    countExpectation: absent
subject: todo
transactionMode: atomic
