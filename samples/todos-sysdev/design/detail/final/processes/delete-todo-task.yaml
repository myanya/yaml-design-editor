id: PRC-delete-todo-task
source: ACT-delete-todo-task
operation: delete-todo-task
label: 作業項目を削除する
inputs:
  - key: row
    label: 作業項目の番号
    type: int
    base: int
    description: 作業項目の何番目か（0 から数えます）
    required: true
    min: 0.0
    overrides:
      min: 0.0
    builtinType:
      name: int
      base: int
      builtin: true
  - key: version
    label: 版
    type: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    builtinType:
      name: int
      base: int
      builtin: true
    carried: true
service:
  class: TodoService
  method: deleteTodoTask
  arguments:
    - id
    - row
    - version
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-delete-todo-task.01
    step: read
    call: MTH-todo.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: ENT-todo
  - id: STP-delete-todo-task.02
    step: check
    precondition: PRE-delete-todo-task.active
    by: Java（読んだ行）
    rule:
      - of: t
        path: status
        oneOf:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
    message: MSG-delete-todo-task.active
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-delete-todo-task.03
    step: check
    precondition: PRE-delete-todo-task.version-unchanged
    by: Java（読んだ行）
    rule:
      - of: t
        path: version
        equals: $version
    message: MSG-delete-todo-task.version-unchanged
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-delete-todo-task.04
    step: check
    constraint: RUL-updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: MSG-check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-delete-todo-task.05
    step: write
    call: MTH-todo-task.deleteTodoTaskTasksRow
    kind: delete
    where:
      - item: todo_id
        param: id
        value:
          param: id
      - item: seq
        param: row
        value:
          param: row
    rowKey:
      item: seq
      param: row
    missing: 行が無ければ NotFoundException（error.notFound.todo.tasks）
    missingEntity: todo.tasks
  - id: STP-delete-todo-task.06
    step: write
    call: MTH-todo.deleteTodoTask
    kind: update
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: next
    where:
      - item: id
        param: id
        value:
          param: id
  - id: STP-delete-todo-task.07
    step: check
    constraint: RUL-closed-has-no-open-task
    by: SQL（件数。書いた後）
    call: MTH-todo-task.countClosedHasNoOpenTask
    key:
      param: id
    expect: 0 件なら通す
    violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
    message: MSG-check.closed-has-no-open-task
    checkMode: count
    phase: after
    entity: ENT-todo
    countExpectation: absent
subject: todo
transactionMode: atomic
