# 生成物（detail-processes）: 手で直さず、業務モデルか生成の定義（design/detail/detail-processes.yaml）を直して作り直します（CLI generate）。
id: PRC-add-todo-task
source: ACT-add-todo-task
operation: add-todo-task
label: 作業項目を追加する
inputs:
  - key: title
    label: 作業
    type: common#一行の文
    base: string
    required: true
    minLength: 1
    maxLength: 100
    pattern: ^[^\r\n]*$
    overrides:
      minLength: 1
  - key: version
    label: 版
    type: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    builtinType:
      name: int
      base: int
      builtin: true
    carried: true
service:
  class: TodoService
  method: addTodoTask
  arguments:
    - id
    - title
    - version
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-add-todo-task.01
    step: read
    call: MTH-todo.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: ENT-todo
  - id: STP-add-todo-task.02
    step: check
    precondition: PRE-add-todo-task.active
    by: Java（読んだ行）
    rule:
      - of: t
        path: status
        oneOf:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
    message: MSG-add-todo-task.active
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-add-todo-task.03
    step: check
    precondition: PRE-add-todo-task.version-unchanged
    by: Java（読んだ行）
    rule:
      - of: t
        path: version
        equals: $version
    message: MSG-add-todo-task.version-unchanged
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-add-todo-task.04
    step: number
    entity: ENT-todo-task
    call: MTH-todo-task.maxId
    rule:
      path: id
      prefix:
        $format: '{id}-S'
        $of: owner
      digits: 2
  - id: STP-add-todo-task.05
    step: check
    constraint: RUL-updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: MSG-check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-add-todo-task.06
    step: write
    call: MTH-todo-task.insert
    kind: insert
    values:
      id:
        generated: numberedId
      title: $title
      done: false
      todo_id: $id
      seq:
        sequence:
          call: MTH-todo-task.maxSeq
          key:
            param: id
  - id: STP-add-todo-task.07
    step: write
    call: MTH-todo.addTodoTask
    kind: update
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: next
    where:
      - item: id
        param: id
        value:
          param: id
  - id: STP-add-todo-task.08
    step: check
    constraint: RUL-closed-has-no-open-task
    by: SQL（件数。書いた後）
    call: MTH-todo-task.countClosedHasNoOpenTask
    key:
      param: id
    expect: 0 件なら通す
    violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
    message: MSG-check.closed-has-no-open-task
    checkMode: count
    phase: after
    entity: ENT-todo
    countExpectation: absent
subject: todo
transactionMode: atomic
