# 生成物（detail-processes）: 手で直さず、業務モデルか生成の定義（design/detail/detail-processes.yaml）を直して作り直します（CLI generate）。
id: PRC-todo-task.finish
source: ACT-todo-task.finish
operation: todo-task.finish
label: 作業項目を済にする
inputs:
  - key: version
    label: 版
    type: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    builtinType:
      name: int
      base: int
      builtin: true
    carried: true
service:
  class: TodoTaskService
  method: todoTaskFinish
  arguments:
    - id
    - version
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-todo-task.finish.01
    step: read
    call: MTH-todo-task.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo-task）
    entity: ENT-todo-task
  - id: STP-todo-task.finish.02
    step: read-owner
    call: MTH-todo.findById
    key:
      self: todo_id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: ENT-todo
  - id: STP-todo-task.finish.03
    step: check
    precondition: PRE-todo-task.finish.version-unchanged
    by: Java（読んだ親の行）
    rule:
      - of: owner
        path: version
        equals: $version
    message: MSG-todo-task.finish.version-unchanged
    checkMode: owner
    subjectAlias: owner
    phase: before
    entity: ENT-todo
  - id: STP-todo-task.finish.04
    step: check
    constraint: RUL-updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: MSG-check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-todo-task.finish.05
    step: write
    call: MTH-todo-task.todoTaskFinish
    kind: update
    set:
      - item: done
        value: true
    where:
      - item: id
        param: id
        value:
          param: id
  - id: STP-todo-task.finish.06
    step: write
    call: MTH-todo.todoTaskFinish
    kind: update
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: ownerNext
    where:
      - item: id
        param: todoId
        value:
          self: todo_id
  - id: STP-todo-task.finish.07
    step: check
    constraint: RUL-closed-has-no-open-task
    by: SQL（件数。書いた後）
    call: MTH-todo-task.countClosedHasNoOpenTask
    key:
      self: todo_id
    expect: 0 件なら通す
    violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
    message: MSG-check.closed-has-no-open-task
    checkMode: count
    phase: after
    entity: ENT-todo
    countExpectation: absent
subject: todo-task
transactionMode: atomic
