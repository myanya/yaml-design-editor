# 生成物（detail-processes）: 手で直さず、業務モデルか生成の定義（design/detail/detail-processes.yaml）を直して作り直します（CLI generate）。
id: PRC-suspend-todo
source: ACT-suspend-todo
operation: suspend-todo
label: TODOを中断する
inputs:
  - key: date
    label: 中断日
    type: common#年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    required: true
    format: yyyy年M月d日
  - key: reason
    label: 中断理由
    type: todo-operations#操作の記録
    base: string
    description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
    required: true
    minLength: 1
    multiline: true
  - key: resume_on
    label: 再開予定日
    type: common#年月日
    base: date
    description: 決まっていれば入れます。中断日以降の日付です。
    format: yyyy年M月d日
  - key: version
    label: 版
    type: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    builtinType:
      name: int
      base: int
      builtin: true
    carried: true
service:
  class: TodoService
  method: suspendTodo
  arguments:
    - id
    - date
    - reason
    - resumeOn
    - version
confirm:
  - method: checkSuspendTodo
    arguments:
      - id
      - date
      - reason
      - resumeOn
      - version
    does: 受け手を読み（あれば）、入力の値で書いた後の値を計算し、次の決まりを確かめる（書かない）。違反は欄の名前とメッセージのキーの並びで返す
    constraints:
      - constraint: RUL-resume-not-before-suspend
        field: resumeOn
        message: MSG-check.resume-not-before-suspend
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-suspend-todo.01
    step: read
    call: MTH-todo.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: ENT-todo
  - id: STP-suspend-todo.02
    step: check
    error: ERR-suspend-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - ENC-todo-IN_PROGRESS
    message: MSG-suspend-todo.state
    checkMode: state
    phase: before
    entity: ENT-todo
    stateField: status
  - id: STP-suspend-todo.03
    step: check
    precondition: PRE-suspend-todo.version-unchanged
    by: Java（読んだ行）
    rule:
      - of: t
        path: version
        equals: $version
    message: MSG-suspend-todo.version-unchanged
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-suspend-todo.04
    step: check
    constraint: RUL-updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: MSG-check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-suspend-todo.05
    step: check
    constraint: RUL-unfinished-has-no-completed-on
    by: Java（書いた後の値）
    rule:
      where:
        - not:
            path: status
            equals: CLOSED
        - path: completed_on
          exists: true
      expect: absent
    message: MSG-check.unfinished-has-no-completed-on
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-suspend-todo.06
    step: check
    constraint: RUL-resume-not-before-suspend
    by: Java（書いた後の値）
    at: history[*]
    rule:
      where:
        - path: resume_on
          exists: true
      check:
        - gte:
            - path: resume_on
            - path: date
    field: resumeOn
    message: MSG-check.resume-not-before-suspend
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-suspend-todo.07
    step: write
    call: MTH-todo.suspendTodo
    kind: update
    set:
      - item: status
        value: SUSPENDED
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: next
    where:
      - item: id
        param: id
        value:
          param: id
  - id: STP-suspend-todo.08
    step: write
    call: MTH-todo.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date: $date
      action: suspend-todo
      from:
        $copy: status
        $of: self
      to: SUSPENDED
      note: $reason
      resume_on:
        $copy: resume_on
    seq:
      mode: next
      call: MTH-todo.maxSeqTodoHistory
      key:
        param: id
subject: todo
transactionMode: atomic
