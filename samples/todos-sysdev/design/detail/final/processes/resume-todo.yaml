# 生成物（detail-processes）: 手で直さず、業務モデルか生成の定義（design/detail/detail-processes.yaml）を直して作り直します（CLI generate）。
id: PRC-resume-todo
source: ACT-resume-todo
operation: resume-todo
label: TODOを再開する
inputs:
  - key: date
    label: 再開日
    type: common#年月日
    base: date
    description: YYYY-MM-DD 形式で入力します（例 2026-09-22）。
    required: true
    format: yyyy年M月d日
  - key: note
    label: メモ
    type: common#文章
    base: string
    multiline: true
  - key: version
    label: 版
    type: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    builtinType:
      name: int
      base: int
      builtin: true
    carried: true
service:
  class: TodoService
  method: resumeTodo
  arguments:
    - id
    - date
    - note
    - version
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-resume-todo.01
    step: read
    call: MTH-todo.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: ENT-todo
  - id: STP-resume-todo.02
    step: check
    error: ERR-resume-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - ENC-todo-SUSPENDED
    message: MSG-resume-todo.state
    checkMode: state
    phase: before
    entity: ENT-todo
    stateField: status
  - id: STP-resume-todo.03
    step: check
    precondition: PRE-resume-todo.version-unchanged
    by: Java（読んだ行）
    rule:
      - of: t
        path: version
        equals: $version
    message: MSG-resume-todo.version-unchanged
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-resume-todo.04
    step: check
    constraint: RUL-updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: MSG-check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-resume-todo.05
    step: check
    constraint: RUL-unfinished-has-no-completed-on
    by: Java（書いた後の値）
    rule:
      where:
        - not:
            path: status
            equals: CLOSED
        - path: completed_on
          exists: true
      expect: absent
    message: MSG-check.unfinished-has-no-completed-on
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-resume-todo.06
    step: write
    call: MTH-todo.resumeTodo
    kind: update
    set:
      - item: status
        value: IN_PROGRESS
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: next
    where:
      - item: id
        param: id
        value:
          param: id
  - id: STP-resume-todo.07
    step: write
    call: MTH-todo.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date: $date
      action: resume-todo
      from:
        $copy: status
        $of: self
      to: IN_PROGRESS
      note:
        $copy: note
    seq:
      mode: next
      call: MTH-todo.maxSeqTodoHistory
      key:
        param: id
subject: todo
transactionMode: atomic
