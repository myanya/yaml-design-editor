# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/detail/processes.yaml）を直して作り直します（CLI generate）。
id: cancel-todo
name: TODOを中止する
service:
  class: TodoService
  method: cancelTodo
  arguments:
    - id
    - reason
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: todo
  - step: check
    precondition: cancel-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - OPEN
      - IN_PROGRESS
      - SUSPENDED
    message: cancel-todo.state
    text: 「{id}」は「{state}」なので、「TODOを中止する」はできません（できるのは「未完了」のとき）
    checkMode: state
    phase: before
    entity: todo
    stateField: status
  - step: check
    constraint: updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: todo
  - step: check
    constraint: unfinished-has-no-completed-on
    by: Java（書いた後の値）
    rule:
      where:
        - not:
            path: status
            equals: CLOSED
        - path: completed_on
          exists: true
      expect: absent
    message: check.unfinished-has-no-completed-on
    checkMode: prospective
    phase: before
    entity: todo
  - step: write
    call: TodoMapper.cancelTodo
    kind: update
    set:
      - item: result
        value: $reason
      - item: status
        value: CANCELED
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
        value:
          param: id
  - step: write
    call: TodoMapper.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date:
        $copy: today
        $of: context
      action: cancel-todo
      from:
        $copy: status
        $of: self
      to: CANCELED
      note: $reason
    seq:
      mode: next
      call: TodoMapper.maxSeqTodoHistory
      key:
        param: id
subject: todo
originalService:
  class: TodoService
  method: cancelTodo
  arguments:
    - id
    - reason
transactionMode: atomic
designId: DOC-processes.cancel-todo
designKind: processes
designPath: design/detail/final/processes/cancel-todo.yaml
origins:
  source:
    id: rule-processes
    document: .yde/transforms/design/detail/processes-derived.yaml
    path: []
  decisions: []
  inputs: []
