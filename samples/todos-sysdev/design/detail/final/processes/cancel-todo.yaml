# 生成物（detail-processes）: 手で直さず、業務モデルか生成の定義（design/detail/detail-processes.yaml）を直して作り直します（CLI generate）。
id: PRC-cancel-todo
source: ACT-cancel-todo
operation: cancel-todo
label: TODOを中止する
inputs:
  - key: reason
    label: 中止理由
    type: todo-operations#操作の記録
    base: string
    description: 完了結果・中止理由・中断理由・コメントとして残す空でない文章。
    required: true
    minLength: 1
    multiline: true
  - key: version
    label: 版
    type: int
    base: int
    description: 画面を開いたときに読んだ版です。確定するときの版と比べて、その間のほかの更新を検出します（人は入力しません。画面が運びます）。
    required: true
    builtinType:
      name: int
      base: int
      builtin: true
    carried: true
service:
  class: TodoService
  method: cancelTodo
  arguments:
    - id
    - reason
    - version
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-cancel-todo.01
    step: read
    call: MTH-todo.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: ENT-todo
  - id: STP-cancel-todo.02
    step: check
    error: ERR-cancel-todo.state
    by: Java（読んだ行の状態）
    allowed:
      - ENC-todo-OPEN
      - ENC-todo-IN_PROGRESS
      - ENC-todo-SUSPENDED
    message: MSG-cancel-todo.state
    checkMode: state
    phase: before
    entity: ENT-todo
    stateField: status
  - id: STP-cancel-todo.03
    step: check
    precondition: PRE-cancel-todo.version-unchanged
    by: Java（読んだ行）
    rule:
      - of: t
        path: version
        equals: $version
    message: MSG-cancel-todo.version-unchanged
    checkMode: current
    subjectAlias: t
    phase: before
    entity: ENT-todo
  - id: STP-cancel-todo.04
    step: check
    constraint: RUL-updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: MSG-check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-cancel-todo.05
    step: check
    constraint: RUL-unfinished-has-no-completed-on
    by: Java（書いた後の値）
    rule:
      where:
        - not:
            path: status
            equals: CLOSED
        - path: completed_on
          exists: true
      expect: absent
    message: MSG-check.unfinished-has-no-completed-on
    checkMode: prospective
    phase: before
    entity: ENT-todo
  - id: STP-cancel-todo.06
    step: write
    call: MTH-todo.cancelTodo
    kind: update
    set:
      - item: result
        value: $reason
      - item: status
        value: CANCELED
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: next
    where:
      - item: id
        param: id
        value:
          param: id
  - id: STP-cancel-todo.07
    step: write
    call: MTH-todo.insertTodoHistory
    kind: insert
    values:
      todo_id: $id
      date:
        $copy: today
        $of: context
      action: cancel-todo
      from:
        $copy: status
        $of: self
      to: CANCELED
      note: $reason
    seq:
      mode: next
      call: MTH-todo.maxSeqTodoHistory
      key:
        param: id
subject: todo
transactionMode: atomic
