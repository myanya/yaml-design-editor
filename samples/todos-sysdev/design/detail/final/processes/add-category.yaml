# 生成物（detail-processes）: 手で直さず、業務モデルか生成の定義（design/detail/detail-processes.yaml）を直して作り直します（CLI generate）。
id: PRC-add-category
source: ACT-add-category
operation: add-category
label: カテゴリを追加する
inputs:
  - key: name
    label: カテゴリ名
    type: common#一行の文
    base: string
    required: true
    minLength: 1
    maxLength: 100
    pattern: ^[^\r\n]*$
    overrides:
      minLength: 1
service:
  class: CategoryService
  method: addCategory
  arguments:
    - name
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - id: STP-add-category.01
    step: number
    entity: ENT-category
    call: MTH-category.maxId
    rule:
      path: id
      prefix: CAT-
      digits: 3
  - id: STP-add-category.02
    step: write
    call: MTH-category.insert
    kind: insert
    values:
      id:
        generated: numberedId
      name: $name
subject: category
transactionMode: atomic
