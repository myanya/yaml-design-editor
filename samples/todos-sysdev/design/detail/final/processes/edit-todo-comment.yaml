# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/detail/processes.yaml）を直して作り直します（CLI generate）。
id: edit-todo-comment
name: コメントを編集する
service:
  class: TodoService
  method: editTodoComment
  arguments:
    - id
    - row
    - date
    - body
    - version
confirm: []
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: todo
  - step: check
    precondition: edit-todo-comment.version-unchanged
    by: Java（読んだ行）
    rule:
      - of: t
        path: version
        equals: $version
    message: edit-todo-comment.version-unchanged
    text: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
    checkMode: current
    subjectAlias: t
    phase: before
    entity: todo
  - step: check
    constraint: updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    message: check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: todo
  - step: write
    call: TodoMapper.editTodoCommentCommentsRow
    kind: update
    set:
      - item: date
        value: $date
        when:
          - path: date
            exists: true
      - item: body
        value: $body
        when:
          - path: body
            exists: true
    where:
      - item: todo_id
        param: id
        value:
          param: id
      - item: seq
        param: row
        value:
          param: row
    rowKey:
      item: seq
      param: row
    missing: 行が無ければ NotFoundException（error.notFound.todo.comments）
    missingEntity: todo.comments
  - step: write
    call: TodoMapper.editTodoComment
    kind: update
    set:
      - item: updated_on
        value:
          $copy: today
          $of: context
      - item: version
        value:
          $copy: version
          $of: next
    where:
      - item: id
        param: id
        value:
          param: id
subject: todo
originalService:
  class: TodoService
  method: editTodoComment
  arguments:
    - id
    - row
    - date
    - body
    - version
transactionMode: atomic
designId: DOC-processes.edit-todo-comment
designKind: processes
designPath: design/detail/final/processes/edit-todo-comment.yaml
origins:
  source:
    id: rule-processes
    document: .yde/transforms/design/detail/processes-derived.yaml
    path: []
  decisions: []
  inputs: []
