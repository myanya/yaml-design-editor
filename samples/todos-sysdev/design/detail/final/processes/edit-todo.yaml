# 生成物（processes）: 手で直さず、業務モデルか生成の定義（design/detail/processes.yaml）を直して作り直します（CLI generate）。
id: edit-todo
name: TODOを編集する
service:
  class: TodoService
  method: editTodo
  arguments:
    - id
    - title
    - summary
    - category
    - tags
    - createdOn
    - dueOn
    - details
    - result
    - comments
    - clear
confirm:
  - method: checkEditTodo
    arguments:
      - id
      - title
      - summary
      - category
      - tags
      - createdOn
      - dueOn
      - details
      - result
      - comments
      - clear
    does: 受け手を読み（あれば）、入力の値で書いた後の値を計算し、次の決まりを確かめる（書かない）。違反は欄の名前とメッセージのキーの並びで返す
    constraints:
      - constraint: due-not-before-created
        field: dueOn
        message: check.due-not-before-created
      - constraint: updated-not-before-created
        field: createdOn
        message: check.updated-not-before-created
      - constraint: completed-not-before-created
        field: createdOn
        message: check.completed-not-before-created
      - constraint: closed-has-result
        field: result
        message: check.closed-has-result
transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
steps:
  - step: read
    call: TodoMapper.findById
    key:
      param: id
    missing: 見つからなければ NotFoundException（error.notFound.todo）
    entity: todo
  - step: check
    constraint: due-not-before-created
    by: Java（書いた後の値）
    rule:
      where:
        - path: due_on
          exists: true
      check:
        - gte:
            - path: due_on
            - path: created_on
    field: dueOn
    message: check.due-not-before-created
    checkMode: prospective
    phase: before
    entity: todo
  - step: check
    constraint: updated-not-before-created
    by: Java（書いた後の値）
    rule:
      check:
        - gte:
            - path: updated_on
            - path: created_on
    field: createdOn
    message: check.updated-not-before-created
    checkMode: prospective
    phase: before
    entity: todo
  - step: check
    constraint: completed-not-before-created
    by: Java（書いた後の値）
    rule:
      where:
        - path: completed_on
          exists: true
      check:
        - gte:
            - path: completed_on
            - path: created_on
    field: createdOn
    message: check.completed-not-before-created
    checkMode: prospective
    phase: before
    entity: todo
  - step: check
    constraint: closed-has-result
    by: Java（書いた後の値）
    rule:
      where:
        - path: status
          equals: CLOSED
        - path: result
          empty: true
      expect: absent
    field: result
    message: check.closed-has-result
    checkMode: prospective
    phase: before
    entity: todo
  - step: write
    call: TodoMapper.editTodo
    kind: update
    set:
      - item: title
        value: $title
        when:
          - path: title
            exists: true
      - item: summary
        value: $summary
        when:
          - path: summary
            exists: true
      - item: category
        value: $category
        when:
          - path: category
            exists: true
      - item: created_on
        value: $created_on
        when:
          - path: created_on
            exists: true
      - item: due_on
        value: $due_on
        when:
          - path: due_on
            exists: true
      - item: details
        value: $details
        when:
          - path: details
            exists: true
      - item: result
        value: $result
        when:
          - path: result
            exists: true
      - item: category
        value: null
        when:
          - path: clear.category
            equals: true
        mode: clear
      - item: due_on
        value: null
        when:
          - path: clear.due_on
            equals: true
        mode: clear
      - item: details
        value: null
        when:
          - path: clear.details
            equals: true
        mode: clear
      - item: result
        value: null
        when:
          - path: clear.result
            equals: true
        mode: clear
      - item: updated_on
        value:
          $copy: today
          $of: context
    where:
      - item: id
        param: id
  - step: write
    call: TodoMapper.deleteTodoTags
    kind: delete
    when:
      - path: tags
        exists: true
  - step: write
    call: TodoMapper.insertTodoTags
    kind: insert
    each: $tags
    seq:
      mode: position
      start: 1
    when:
      - path: tags
        exists: true
  - step: write
    call: TodoMapper.deleteTodoComments
    kind: delete
    when:
      - path: comments
        exists: true
  - step: write
    call: TodoMapper.insertTodoComments
    kind: insert
    each: $comments
    seq:
      mode: position
      start: 1
    when:
      - path: comments
        exists: true
  - step: write
    call: TodoMapper.deleteTodoTags
    kind: delete
    when:
      - path: clear.tags
        equals: true
  - step: write
    call: TodoMapper.deleteTodoComments
    kind: delete
    when:
      - path: clear.comments
        equals: true
  - step: write
    call: TodoMapper.insertTodoComments
    kind: insert
    each: []
    seq:
      mode: position
      start: 1
    when:
      - path: clear.comments
        equals: true
subject: todo
originalService:
  class: TodoService
  method: editTodo
  arguments:
    - id
    - title
    - summary
    - category
    - tags
    - createdOn
    - dueOn
    - details
    - result
    - comments
    - clear
transactionMode: atomic
designId: DOC-processes.edit-todo
designKind: processes
designPath: design/detail/final/processes/edit-todo.yaml
origins:
  source:
    id: rule-processes
    document: .yde/transforms/design/detail/processes-derived.yaml
    path: []
  decisions: []
  inputs: []
