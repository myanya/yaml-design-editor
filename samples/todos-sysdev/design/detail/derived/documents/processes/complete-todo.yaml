# 生成物（processes-derived）: 手で直さず、業務モデルか生成の定義（design/detail/processes-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-processes.complete-todo
record:
  id: DOC-processes.complete-todo
  value:
    id: complete-todo
    name: TODOを完了する
    service:
      class: TodoService
      method: completeTodo
      arguments:
        - id
        - date
        - result
    confirm:
      - method: checkCompleteTodo
        arguments:
          - id
          - date
          - result
        does: 受け手を読み（あれば）、入力の値で書いた後の値を計算し、次の決まりを確かめる（書かない）。違反は欄の名前とメッセージのキーの並びで返す
        constraints:
          - constraint: completed-not-before-created
            field: date
            message: check.completed-not-before-created
          - constraint: closed-has-completed-on
            field: date
            message: check.closed-has-completed-on
          - constraint: closed-has-result
            field: result
            message: check.closed-has-result
    transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
    steps:
      - step: read
        call: TodoMapper.findById
        key:
          param: id
        missing: 見つからなければ NotFoundException（error.notFound.todo）
        entity: todo
      - step: check
        precondition: complete-todo.state
        by: Java（読んだ行の状態）
        allowed:
          - IN_PROGRESS
        message: complete-todo.state
        text: 「{id}」は「{state}」なので、「TODOを完了する」はできません（できるのは「対応中」のとき）
        checkMode: state
        phase: before
        entity: todo
        stateField: status
      - step: check
        precondition: complete-todo.no-open-task
        by: SQL（件数）
        call: TodoTaskMapper.countCompleteTodoNoOpenTask
        expect: 0 件なら通す
        message: complete-todo.no-open-task
        text: '{id} には済んでいない作業項目があります（済にしてから完了します）'
        checkMode: count
        phase: before
        entity: todo
        countExpectation: absent
        key:
          param: id
      - step: check
        constraint: updated-not-before-created
        by: Java（書いた後の値）
        rule:
          check:
            - gte:
                - path: updated_on
                - path: created_on
        message: check.updated-not-before-created
        checkMode: prospective
        phase: before
        entity: todo
      - step: check
        constraint: completed-not-before-created
        by: Java（書いた後の値）
        rule:
          where:
            - path: completed_on
              exists: true
          check:
            - gte:
                - path: completed_on
                - path: created_on
        field: date
        message: check.completed-not-before-created
        checkMode: prospective
        phase: before
        entity: todo
      - step: check
        constraint: closed-has-completed-on
        by: Java（書いた後の値）
        rule:
          where:
            - path: status
              equals: CLOSED
            - path: completed_on
              exists: false
          expect: absent
        field: date
        message: check.closed-has-completed-on
        checkMode: prospective
        phase: before
        entity: todo
      - step: check
        constraint: closed-has-result
        by: Java（書いた後の値）
        rule:
          where:
            - path: status
              equals: CLOSED
            - path: result
              empty: true
          expect: absent
        field: result
        message: check.closed-has-result
        checkMode: prospective
        phase: before
        entity: todo
      - step: write
        call: TodoMapper.completeTodo
        kind: update
        set:
          - item: completed_on
            value: $date
          - item: result
            value: $result
          - item: status
            value: CLOSED
          - item: updated_on
            value:
              $copy: today
              $of: context
        where:
          - item: id
            param: id
            value:
              param: id
      - step: write
        call: TodoMapper.insertTodoHistory
        kind: insert
        values:
          todo_id: $id
          date: $date
          action: complete-todo
          from:
            $copy: status
            $of: self
          to: CLOSED
        seq:
          mode: next
          call: TodoMapper.maxSeqTodoHistory
          key:
            param: id
      - step: check
        constraint: closed-has-no-open-task
        by: SQL（件数。書いた後）
        call: TodoTaskMapper.countClosedHasNoOpenTask
        key:
          param: id
        expect: 0 件なら通す
        violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
        message: check.closed-has-no-open-task
        checkMode: count
        phase: after
        entity: todo
        countExpectation: absent
    subject: todo
    originalService:
      class: TodoService
      method: completeTodo
      arguments:
        - id
        - date
        - result
    transactionMode: atomic
  source:
    id: rule-processes
    document: .yde/transforms/design/detail/processes-derived.yaml
