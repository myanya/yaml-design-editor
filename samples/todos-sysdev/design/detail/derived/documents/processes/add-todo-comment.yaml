# 生成物（processes-derived）: 手で直さず、業務モデルか生成の定義（design/detail/processes-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-processes.add-todo-comment
record:
  id: DOC-processes.add-todo-comment
  value:
    id: add-todo-comment
    name: TODOにコメントを追加する
    service:
      class: TodoService
      method: addTodoComment
      arguments:
        - id
        - date
        - body
        - version
    confirm: []
    transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
    steps:
      - step: read
        call: TodoMapper.findById
        key:
          param: id
        missing: 見つからなければ NotFoundException（error.notFound.todo）
        entity: todo
      - step: check
        precondition: add-todo-comment.version-unchanged
        by: Java（読んだ行）
        rule:
          - of: t
            path: version
            equals: $version
        message: add-todo-comment.version-unchanged
        text: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        checkMode: current
        subjectAlias: t
        phase: before
        entity: todo
      - step: check
        constraint: updated-not-before-created
        by: Java（書いた後の値）
        rule:
          check:
            - gte:
                - path: updated_on
                - path: created_on
        message: check.updated-not-before-created
        checkMode: prospective
        phase: before
        entity: todo
      - step: write
        call: TodoMapper.insertTodoComments
        kind: insert
        values:
          todo_id: $id
          date: $date
          body: $body
        seq:
          mode: next
          call: TodoMapper.maxSeqTodoComments
          key:
            param: id
      - step: write
        call: TodoMapper.addTodoComment
        kind: update
        set:
          - item: updated_on
            value:
              $copy: today
              $of: context
          - item: version
            value:
              $copy: version
              $of: next
        where:
          - item: id
            param: id
            value:
              param: id
    subject: todo
    originalService:
      class: TodoService
      method: addTodoComment
      arguments:
        - id
        - date
        - body
        - version
    transactionMode: atomic
  source:
    id: rule-processes
    document: .yde/transforms/design/detail/processes-derived.yaml
