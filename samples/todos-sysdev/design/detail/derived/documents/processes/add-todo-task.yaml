# 生成物（processes-derived）: 手で直さず、業務モデルか生成の定義（design/detail/processes-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-processes.add-todo-task
record:
  id: DOC-processes.add-todo-task
  value:
    id: add-todo-task
    name: 作業項目を追加する
    service:
      class: TodoService
      method: addTodoTask
      arguments:
        - id
        - title
    confirm: []
    transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
    steps:
      - step: read
        call: TodoMapper.findById
        key:
          param: id
        missing: 見つからなければ NotFoundException（error.notFound.todo）
        entity: todo
      - step: check
        precondition: add-todo-task.active
        by: Java（読んだ行）
        rule:
          - of: t
            path: status
            oneOf:
              - OPEN
              - IN_PROGRESS
              - SUSPENDED
        message: add-todo-task.active
        text: '{id} は完了か中止をしているので、作業項目を足せません'
        checkMode: current
        phase: before
        entity: todo
      - step: number
        entity: todo-task
        call: TodoTaskMapper.maxId
        rule:
          path: id
          prefix:
            $format: '{id}-S'
            $of: owner
          digits: 2
      - step: check
        constraint: updated-not-before-created
        by: Java（書いた後の値）
        rule:
          check:
            - gte:
                - path: updated_on
                - path: created_on
        message: check.updated-not-before-created
        checkMode: prospective
        phase: before
        entity: todo
      - step: write
        call: TodoTaskMapper.insert
        kind: insert
        values:
          id:
            generated: numberedId
          title: $title
          done: false
          todo_id: $id
          seq:
            sequence:
              call: TodoTaskMapper.maxSeq
              key:
                param: id
      - step: write
        call: TodoMapper.addTodoTask
        kind: update
        set:
          - item: updated_on
            value:
              $copy: today
              $of: context
        where:
          - item: id
            param: id
            value:
              param: id
      - step: check
        constraint: closed-has-no-open-task
        by: SQL（件数。書いた後）
        call: TodoTaskMapper.countClosedHasNoOpenTask
        key:
          param: id
        expect: 0 件なら通す
        violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
        message: check.closed-has-no-open-task
        checkMode: count
        phase: after
        entity: todo
        countExpectation: absent
    subject: todo
    originalService:
      class: TodoService
      method: addTodoTask
      arguments:
        - id
        - title
    transactionMode: atomic
  source:
    id: rule-processes
    document: .yde/transforms/design/detail/processes-derived.yaml
