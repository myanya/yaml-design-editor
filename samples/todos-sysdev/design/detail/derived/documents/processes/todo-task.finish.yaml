# 生成物（processes-derived）: 手で直さず、業務モデルか生成の定義（design/detail/processes-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-processes.todo-task.finish
record:
  id: DOC-processes.todo-task.finish
  value:
    id: todo-task.finish
    name: 作業項目を済にする
    service:
      class: TodoTaskService
      method: todoTaskFinish
      arguments:
        - id
        - version
    confirm: []
    transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
    steps:
      - step: read
        call: TodoTaskMapper.findById
        key:
          param: id
        missing: 見つからなければ NotFoundException（error.notFound.todo-task）
        entity: todo-task
      - step: read-owner
        call: TodoMapper.findById
        key:
          self: todo_id
        missing: 見つからなければ NotFoundException（error.notFound.todo）
        entity: todo
      - step: check
        precondition: todo-task.finish.version-unchanged
        by: Java（読んだ親の行）
        rule:
          - of: owner
            path: version
            equals: $version
        message: todo-task.finish.version-unchanged
        text: '{id} は、ほかの人が先に更新しました（画面を開き直してから、もう一度操作します）'
        checkMode: owner
        subjectAlias: owner
        phase: before
        entity: todo
      - step: check
        constraint: updated-not-before-created
        by: Java（書いた後の値）
        rule:
          check:
            - gte:
                - path: updated_on
                - path: created_on
        message: check.updated-not-before-created
        checkMode: prospective
        phase: before
        entity: todo
      - step: write
        call: TodoTaskMapper.todoTaskFinish
        kind: update
        set:
          - item: done
            value: true
        where:
          - item: id
            param: id
            value:
              param: id
      - step: write
        call: TodoMapper.todoTaskFinish
        kind: update
        set:
          - item: updated_on
            value:
              $copy: today
              $of: context
          - item: version
            value:
              $copy: version
              $of: ownerNext
        where:
          - item: id
            param: todoId
            value:
              self: todo_id
      - step: check
        constraint: closed-has-no-open-task
        by: SQL（件数。書いた後）
        call: TodoTaskMapper.countClosedHasNoOpenTask
        key:
          self: todo_id
        expect: 0 件なら通す
        violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
        message: check.closed-has-no-open-task
        checkMode: count
        phase: after
        entity: todo
        countExpectation: absent
    subject: todo-task
    originalService:
      class: TodoTaskService
      method: todoTaskFinish
      arguments:
        - id
        - version
    transactionMode: atomic
  source:
    id: rule-processes
    document: .yde/transforms/design/detail/processes-derived.yaml
