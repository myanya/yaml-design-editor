# 詳細設計の方式の指定（全体の判断）。人が書く。方式（rule）と対象を書くと、規則が項目を足す・変える。
# いまの方式:
#   soft-delete（論理削除）: 対象のエンティティのテーブルに「削除の印」のカラムを足し、消す読み書きを「印を立てる」に、
#                           読む・数える読み書きに「削除されていない」の条件を足す。
#                           操作の効果（消す）と状態の遷移は変えない。指定を外すと、行を消す（物理削除）に戻る。
# 対象（target）: エンティティ（ENT-…）か、区分（CLS-…。その区分のエンティティすべて）
inputId: INPUT-detail-specifications
specifications:
  - id: DSPC-001
    rule: soft-delete
    target: ENT-todo-task
    reason: 消した作業項目を、後から調べられるように残す
