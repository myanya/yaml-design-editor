# 生成物（processes-derived）: 手で直さず、業務モデルか生成の定義（design/processes-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-processes.todo-task.finish
record:
  id: DOC-processes.todo-task.finish
  value:
    id: todo-task.finish
    name: 作業項目を済にする
    service:
      class: TodoTaskService
      method: todoTaskFinish
      arguments:
        - id
    confirm: []
    transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
    steps:
      - step: read
        call: TodoTaskMapper.findById
        key: id
        missing: 見つからなければ NotFoundException（error.notFound.todo-task）
      - step: check
        constraint: updated-not-before-created
        by: Java（書いた後の値）
        rule:
          check:
            - gte:
                - path: updated_on
                - path: created_on
        message: check.updated-not-before-created
      - step: write
        call: TodoTaskMapper.todoTaskFinish
        kind: update
        set:
          - item: done
            value: true
        where:
          - item: id
            param: id
      - step: write
        call: TodoMapper.todoTaskFinish
        kind: update
        set:
          - item: updated_on
            value:
              $copy: today
              $of: context
        where:
          - item: id
            param: todoId
      - step: check
        constraint: closed-has-no-open-task
        by: SQL（件数。書いた後）
        call: TodoTaskMapper.countClosedHasNoOpenTask
        key: 読んだ行の todo_id
        expect: 0 件なら通す
        violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
        message: check.closed-has-no-open-task
    subject: todo-task
    originalService:
      class: TodoTaskService
      method: todoTaskFinish
      arguments:
        - id
  source:
    id: rule-processes
    document: .yde/transforms/design/processes-derived.yaml
