id: DRV-document-table-access.category
record:
  id: DOC-table-access.category
  value:
    id: category
    name: カテゴリの読み書き
    mapper: CategoryMapper
    tables:
      - category
    methods:
      - name: findDetail
        kind: select
        table: category
        where:
          - item: id
            param: id
            columnId: COL-category.id
            column: id
        includes: []
        names: []
        operations: []
        screens:
          - category
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
            name: name
            source: FLD-category.name
        methodId: findDetail
        tableId: TBL-category
      - name: selectAll
        kind: select
        table: category
        columns:
          - id
          - name
        order:
          - item: id
            columnId: COL-category.id
            column: id
        operations: []
        screens:
          - 参照の候補
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
            name: name
            source: FLD-category.name
        methodId: selectAll
        tableId: TBL-category
      - name: selectTodoDashboardCategories
        kind: aggregate
        table: category
        order:
          - item: id
            columnId: COL-category.id
            column: id
        groupBy:
          - item: id
            columnId: COL-category.id
            column: id
          - item: status
            of: todo
            values:
              - OPEN
              - IN_PROGRESS
              - SUSPENDED
              - CLOSED
              - CANCELED
        counts: todo
        via:
          relation: in-category
          dir: in
        operations: []
        screens:
          - todo-dashboard
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
            name: name
            source: FLD-category.name
        methodId: selectTodoDashboardCategories
        tableId: TBL-category
      - name: countTodoDashboardCategories
        kind: count
        table: category
        operations: []
        screens:
          - todo-dashboard
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
            name: name
            source: FLD-category.name
        methodId: countTodoDashboardCategories
        tableId: TBL-category
      - name: selectTodoDashboardCategoriesMaster
        kind: select
        table: category
        columns:
          - item: id
            columnId: COL-category.id
            column: id
          - label: カテゴリ名
            item: name
            columnId: COL-category.name
            column: name
          - label: TODOの数
            computed:
              count: 参照してくる要素
              relation: in-category
              dir: in
        where: []
        order:
          - item: id
            columnId: COL-category.id
            column: id
        params: []
        operations: []
        screens:
          - todo-dashboard
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
            name: name
            source: FLD-category.name
        methodId: selectTodoDashboardCategoriesMaster
        tableId: TBL-category
      - name: countTodoDashboardCategoriesMaster
        kind: count
        table: category
        where: 上の select と同じ条件
        operations: []
        screens:
          - todo-dashboard
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
            name: name
            source: FLD-category.name
        methodId: countTodoDashboardCategoriesMaster
        tableId: TBL-category
      - name: insert
        kind: insert
        table: category
        columns: テーブル設計書のすべての列
        operations:
          - add-category
        screens: []
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
            name: name
            source: FLD-category.name
        methodId: insert
        tableId: TBL-category
      - name: maxId
        kind: max
        table: category
        item: id
        where:
          - item: id
            startsWith: CAT-
            columnId: COL-category.id
            column: id
        numbering:
          path: id
          prefix: CAT-
          digits: 3
        operations:
          - add-category
        screens: []
        columnId: COL-category.id
        column: id
        columnBindings:
          - columnId: COL-category.id
            item: id
            name: id
            source: FLD-category.id
          - columnId: COL-category.name
            item: name
