# 生成物（screen-lists-derived）: 手で直さず、業務モデルか生成の定義（design/screen-lists-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-screen-lists.todo-dashboard
record:
  id: DOC-screen-lists.todo-dashboard
  value:
    id: todo-dashboard
    name: TODOダッシュボード
    kind: list
    url: /
    filters:
      - key: tags
        label: タグ
        type: common#タグ参照
        multiple: true
        carried: URL のパラメータ
      - key: category
        label: カテゴリ
        type: common#カテゴリ参照
        carried: URL のパラメータ
    buttons:
      - operation: register-todo
        label: TODOを登録する
        to: register-todo/input
      - operation: add-category
        label: カテゴリを追加する
        to: add-category/input
      - operation: add-tag
        label: タグを追加する
        to: add-tag/input
    sections:
      - id: overdue
        label: 期限超過
        group: 注意
        view: todo-by-due
        kind: 一覧
        rows: todo
        filter:
          match:
            - node:
                entity: todo
                bind: t
          where:
            - of: t
              path: status
              oneOf:
                - OPEN
                - IN_PROGRESS
            - of: t
              path: due_on
              exists: true
          check:
            - lt:
                - of: t
                  in:
                    schemaId: todo-detail
                  path: due_on
                - $today
              type: date
        columns:
          - タイトル
          - ステータス
          - 期限
          - 完了日
        link:
          by: 行の ID
          to: todo
        rowButtons:
          - operation: add-todo-comment
            label: TODOにコメントを追加する
            shownWhen: いつも
            to: add-todo-comment/input
          - operation: add-todo-task
            label: 作業項目を追加する
            shownWhen: いつも
            to: add-todo-task/input
          - operation: edit-todo
            label: TODOを編集する
            shownWhen: いつも
            to: edit-todo/input
          - operation: start-todo
            label: TODOに着手する
            shownWhen:
              - value: OPEN
                label: 未着手
            to: start-todo/confirm
          - operation: suspend-todo
            label: TODOを中断する
            shownWhen:
              - value: IN_PROGRESS
                label: 対応中
            to: suspend-todo/input
          - operation: resume-todo
            label: TODOを再開する
            shownWhen:
              - value: SUSPENDED
                label: 中断
            to: resume-todo/input
          - operation: complete-todo
            label: TODOを完了する
            shownWhen:
              - value: IN_PROGRESS
                label: 対応中
            to: complete-todo/input
          - operation: cancel-todo
            label: TODOを中止する
            shownWhen:
              - value: OPEN
                label: 未着手
              - value: IN_PROGRESS
                label: 対応中
              - value: SUSPENDED
                label: 中断
            to: cancel-todo/input
      - id: all
        label: すべてのTODO
        group: 全体
        view: todo-management
        kind: 一覧
        rows: todo
        columns:
          - カテゴリ
          - ステータス
          - 作業
          - タグ
          - 期限
          - 概要
          - 作成日
          - 更新日
        link:
          by: 行の ID
          to: todo
        rowButtons:
          - operation: add-todo-comment
            label: TODOにコメントを追加する
            shownWhen: いつも
            to: add-todo-comment/input
          - operation: add-todo-task
            label: 作業項目を追加する
            shownWhen: いつも
            to: add-todo-task/input
          - operation: edit-todo
            label: TODOを編集する
            shownWhen: いつも
            to: edit-todo/input
          - operation: start-todo
            label: TODOに着手する
            shownWhen:
              - value: OPEN
                label: 未着手
            to: start-todo/confirm
          - operation: suspend-todo
            label: TODOを中断する
            shownWhen:
              - value: IN_PROGRESS
                label: 対応中
            to: suspend-todo/input
          - operation: resume-todo
            label: TODOを再開する
            shownWhen:
              - value: SUSPENDED
                label: 中断
            to: resume-todo/input
          - operation: complete-todo
            label: TODOを完了する
            shownWhen:
              - value: IN_PROGRESS
                label: 対応中
            to: complete-todo/input
          - operation: cancel-todo
            label: TODOを中止する
            shownWhen:
              - value: OPEN
                label: 未着手
              - value: IN_PROGRESS
                label: 対応中
              - value: SUSPENDED
                label: 中断
            to: cancel-todo/input
      - id: categories
        label: カテゴリ別の状況
        group: 全体
        view: category-status-matrix
        kind: 集計
        rows: category
        columns:
          - 未着手
          - 対応中
          - 中断
          - 完了
          - 中止
        cell:
          to: todo-dashboard
          shows: todo
          by:
            row: category
            column: status
      - id: tags
        label: タグ別の状況
        group: 全体
        view: tag-status-matrix
        kind: 集計
        rows: tag
        columns:
          - 未着手
          - 対応中
          - 中断
          - 完了
          - 中止
        cell:
          to: todo-dashboard
          shows: todo
          by:
            row: tag
            column: status
      - id: categories-master
        label: カテゴリ一覧
        group: マスタ
        view: category-management
        kind: 一覧
        rows: category
        columns:
          - カテゴリ名
          - TODOの数
        link:
          by: 行の ID
          to: category
        rowButtons: []
      - id: tags-master
        label: タグ一覧
        group: マスタ
        view: tag-management
        kind: 一覧
        rows: tag
        columns:
          - タグ名
          - TODOの数
        link:
          by: 行の ID
          to: tag
        rowButtons: []
    originalRoutes:
      url: /
  source:
    id: rule-screen-lists
    document: .yde/transforms/design/screen-lists-derived.yaml
