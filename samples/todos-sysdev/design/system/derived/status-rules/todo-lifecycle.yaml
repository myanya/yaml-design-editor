# 生成物（status-rules-derived）: 手で直さず、業務モデルか生成の定義（design/status-rules-derived.yaml）を直して作り直します（CLI generate）。
id: DRV-document-status-rules.todo-lifecycle
record:
  id: DOC-status-rules.todo-lifecycle
  value:
    id: todo-lifecycle
    entity: todo
    enum:
      name: TodoStatus
      values:
        - constant: OPEN
          label: 未着手
          state: todo-OPEN
        - constant: IN_PROGRESS
          label: 対応中
          state: todo-IN_PROGRESS
        - constant: SUSPENDED
          label: 中断
          state: todo-SUSPENDED
        - constant: CLOSED
          label: 完了
          state: todo-CLOSED
        - constant: CANCELED
          label: 中止
          state: todo-CANCELED
    groups:
      - method: isTodoActive
        label: 未完了
        state: todo-ACTIVE
        values:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
    entry:
      - action: register-todo
        to: OPEN
    transitions:
      - action: complete-todo
        from:
          - IN_PROGRESS
        to: CLOSED
      - action: cancel-todo
        from:
          - OPEN
          - IN_PROGRESS
          - SUSPENDED
        to: CANCELED
      - action: start-todo
        from:
          - OPEN
        to: IN_PROGRESS
      - action: suspend-todo
        from:
          - IN_PROGRESS
        to: SUSPENDED
      - action: resume-todo
        from:
          - SUSPENDED
        to: IN_PROGRESS
    terminal:
      - CLOSED
      - CANCELED
  source:
    id: rule-status-rules
    document: .yde/transforms/design/status-rules-derived.yaml
