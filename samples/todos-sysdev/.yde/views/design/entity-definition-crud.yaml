id: entity-definition-crud
name: エンティティ定義書（CRUD）
description: >-
  行＝項目、列＝操作で、操作が項目を作成（C）・更新（U）するかを見せる（エンティティ定義書の 1 区画）。
  セルは操作一覧の書く項目（CRUD-*）から作り、押すとその書く項目へ移れる。行と列は項番の順
kind: matrix
params: [entity]
rows:
  value: { format: "{seq} {label}", with: { seq: { via: item, path: seq }, label: { via: item, path: label } } }
cells:
  match: [{ node: { id: "CRUD-*", bind: c } }]
  where: [{ of: c, path: entity, equals: $entity }]
  of: c
  columns: { value: { format: "{seq} {label}", with: { seq: { via: operation, path: seq }, label: { via: operation, path: label } } } }
  aggregate: max
  path: crud
totals: false
unclassified: false
