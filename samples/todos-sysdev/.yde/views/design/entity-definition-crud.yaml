id: entity-definition-crud
name: エンティティ定義書（CRUD）
description: 確定項目一覧を読む。補正や型継承は生成時に解決し、ビューでは再計算しない
params: [entity]
rows:
  match:
    - node: { id: "ENT-*", bind: e }
    - edge: { contains: true }
    - node: { id: "FLD-*", bind: f }
  rowKey: f
  where: [{ of: e, path: id, equals: $entity }]
order: { schemaId: basic-entity-list }
columns:
  - { label: 項番, path: seq }
  - { label: 項目, path: key }
  - { label: 名称, path: label }
  - each:
      rows:
        match:
          - node: { id: "ENT-*", bind: e }
          - edge: { contains: true }
          - node: { id: "OPS-*", bind: o }
        rowKey: o
        where: [{ of: e, path: id, equals: $entity }]
      order: { schemaId: basic-entity-list }
      bind: op
    value:
      all:
        match:
          - node: { id: "FLD-*" }
          - edge: { via: item, dir: in }
          - node: { id: "CRUD-*", bind: c }
        where: [{ of: c, path: operation, equals: $op }]
        of: c
        path: crud
