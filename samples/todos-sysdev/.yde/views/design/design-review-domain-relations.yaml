id: design-review-domain-relations
name: ドメイン関連定義書
kind: dashboard
description: ドメイン関連定義書の確定文書を選び、概要・内容・根拠を確認する。対象を空にすると、この種類の文書をまとめて表示する。
inputs:
  - key: document
    label: 対象の設計書
    type: ref
    idPatterns:
      - DOC-domain-relations.*
    default: DOC-domain-relations.domain-relations
sections:
  - id: summary
    label: 概要と根拠
    view: system-document-summary
    filter:
      match:
        - node:
            id: DOC-domain-relations.*
            bind: design
      expect: exists
  - id: content
    label: 設計内容
    view: system-document-content
    filter:
      match:
        - node:
            id: DOC-domain-relations.*
            bind: design
      expect: exists
  - id: documents
    label: この設計書の一覧
    view: system-document-list
    filter:
      match:
        - node:
            id: DOC-domain-relations.*
            bind: design
      expect: exists
