id: entity-definition-items
name: エンティティ定義書（項目一覧）
description: 確定項目一覧を読む。補正や型継承は生成時に解決し、ビューでは再計算しない
params: [entity]
rows:
  match:
    - node: { id: "ENT-*", bind: e }
    - edge: { contains: true }
    - node: { id: "FLD-*", bind: f }
  rowKey: f
  where:
    - { of: e, path: id, equals: $entity }
order: { schemaId: basic-entity-list }
columns:
  - label: 所属先
    path: owner
  - label: 経路
    path: path
  - label: 項番
    path: seq
  - label: 項目
    path: key
  - label: 名称
    path: label
  - label: 論理型
    path: type
  - label: 基底の種類
    path: base
    schemaId: basic-entity-list
  - label: 要素の論理型
    path: item.type
    schemaId: basic-entity-list
  - label: 要素のエンティティ
    path: item.entity
    schemaId: basic-entity-list
  - label: 要素の基底の種類
    path: item.base
    schemaId: basic-entity-list
  - label: 重ならない
    path: unique
  - label: 必須
    path: required
  - label: 最大文字数
    path: maxLength
    schemaId: basic-entity-list
  - label: 形
    path: pattern
    schemaId: basic-entity-list
  - label: 最小文字数
    path: minLength
    schemaId: basic-entity-list
  - label: 最小値
    path: min
    schemaId: basic-entity-list
  - label: 最大値
    path: max
    schemaId: basic-entity-list
  - label: 複数行
    path: multiline
    schemaId: basic-entity-list
  - label: 表示形式
    path: format
    schemaId: basic-entity-list
  - label: 要素の参照先
    path: item.reference.entities
    schemaId: basic-entity-list
  - label: 初期値
    path: default
  - label: 自動で入る値
    path: auto
  - label: 選択肢
    schemaId: basic-entity-list
    value:
      path: values[*].value
  - label: エンティティ
    path: entity
  - label: 入れ子の項目
    path: fields
  - label: 配列の要素
    path: item
  - label: 選択肢の項目
    path: cases
  - label: 参照先
    path: reference.entities
