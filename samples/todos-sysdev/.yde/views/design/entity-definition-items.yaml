id: entity-definition-items
name: エンティティ定義書（項目一覧）
description: 基本設計項目一覧の項目に、補正一覧を重ねた一覧（エンティティ定義書の 1 区画）。行はエンティティの中の項目（FLD-*）
params: [entity]
rows:
  match:
    - node: { id: "ENT-*", bind: e }
    - edge: { contains: true }
    - node: { id: "FLD-*", bind: f }
  rowKey: f
  where:
    - { of: e, path: id, equals: $entity }
order: { schemaId: basic-entity-list }
corrections: { schemaIds: [basic-corrections] }
columns:
  - { label: 項番, path: seq }
  - { label: 項目, path: key }
  - { label: 名称, path: label }
  - { label: 論理型, path: type }
  - { label: 基底の種類, value: { first: [{ via: type, path: base }, { path: base }] } }
  - { label: 要素の論理型, path: itemType }
  - { label: 要素のエンティティ, path: itemEntity }
  - { label: 要素の基底の種類, path: itemBase }
  - { label: 重ならない, path: unique }
  - { label: 必須, path: required }
  - { label: 最大文字数, value: { first: [{ path: maxLength }, { via: type, path: maxLength }] } }
  - { label: 形, value: { first: [{ path: pattern }, { via: type, path: pattern }] } }
  - { label: 最小文字数, value: { first: [{ path: minLength }, { via: type, path: minLength }] } }
  - { label: 最小値, value: { first: [{ path: min }, { via: type, path: min }] } }
  - { label: 最大値, value: { first: [{ path: max }, { via: type, path: max }] } }
  - { label: 複数行, value: { first: [{ path: multiline }, { via: type, path: multiline }] } }
  - { label: 表示形式, value: { first: [{ path: format }, { via: type, path: format }] } }
  - { label: 要素の参照先, value: { via: itemType, path: target } }
  - { label: 初期値, path: default }
  - { label: 自動で入る値, path: auto }
  - { label: 選択肢, value: { each: { first: [{ path: values }, { via: type, path: values }] }, value: { path: value } } }
  - { label: エンティティ, path: entity }
  - { label: 入れ子の項目, path: fields }
  - { label: 論理型の項目, value: { first: [{ via: type, path: "fields[*].key" }, { via: itemType, path: "fields[*].key" }] } }
  - { label: 参照先, value: { first: [{ path: target }, { via: type, path: target }] } }
  - { label: 説明, path: description }
  - { label: 導出元, path: source }
  - { label: ルール, path: rule }
  - { label: 補正, backlinks: { schemaIds: [basic-corrections] } }
