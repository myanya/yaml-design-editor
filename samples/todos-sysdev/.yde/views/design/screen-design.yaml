id: screen-design
name: 操作の画面の設計書（基本から詳細まで）
kind: document
schemaId: screen-operation
description: >-
  操作の画面定義書を開いたとき、同じ操作の画面設計書（部品の木とフォームのクラス）を 1 つの画面に並べ、この操作を扱う Controller へ案内する。
  レビューは、この画面で、起点の画面・入力と確認の中身から、部品の木とフォームの検査までを縦に読む
sections:
  - { label: 画面の中身（画面定義書）, fields: { include: [id, name, target, starts, shownWhen, input, confirm, execute] } }
  - { label: 部品の木とフォーム（画面設計書）, fields: { in: { schemaId: screen-design-operation }, include: [form, screens] } }
  - { label: この操作を扱う Controller, backlinks: {} }
