id: screen-design-related
name: 関連する確定設計項目
params:
  - source
rows:
  match:
    - node:
        entity: sysdev-screen-design-operation
        bind: design
  where:
    - of: design
      path: id
      equals: $source
  rowKey: design
columns:
  - label: form
    path: form
  - label: screens
    path: screens
