id: action-trace
name: 操作の設計の対応
description: 業務モデルの操作ごとに、どの設計書に降りているかの対応表（トレーサビリティ）。行は業務モデルの操作（定義の索引）で、数が 0 の欄は設計が無い
rows:
  match:
    - node:
        entity: yde-action
        bind: a
columns:
  - label: 操作名
    value:
      all:
        from: a
        match:
          - node:
              bind: a
          - edge:
              via: id
              dir: in
          - node:
              entity: sysdev-action-spec
              bind: design
        of: design
        path: name
  - label: 主体
    value:
      all:
        from: a
        match:
          - node:
              bind: a
          - edge:
              via: id
              dir: in
          - node:
              entity: sysdev-action-spec
              bind: design
        of: design
        path: subject
  - label: アクション定義書
    value:
      count:
        all:
          from: a
          match:
            - node:
                bind: a
            - edge:
                via: id
                dir: in
            - node:
                entity: sysdev-action-spec
                bind: design
          of: design
  - label: 処理設計書
    value:
      count:
        all:
          from: a
          match:
            - node:
                bind: a
            - edge:
                via: id
                dir: in
            - node:
                entity: sysdev-process
                bind: design
          of: design
  - label: 画面定義書（入力と確認）
    value:
      count:
        all:
          from: a
          match:
            - node:
                bind: a
            - edge:
                via: id
                dir: in
            - node:
                entity: sysdev-screen-operation
                bind: design
          of: design
  - label: 扱う Controller と Mapper
    value:
      refCount:
        of: a
        dir: in
