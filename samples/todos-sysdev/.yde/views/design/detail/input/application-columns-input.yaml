id: application-columns-input
name: 確定した物理列と SQL の型
description: 列の項目だけを読む（基底の種類・長さ・初期値は、列が基本設計から運んでいる）。型対応（SQL-）は同じ詳細設計の項目なので、参照でたどる
rows:
  idPattern: COL-*
  schemaIds:
    - detail-table-list
columns:
  - label: record
    path: .
  - label: sql
    value:
      format:
        via: sqlType
        path: sql
      with:
        maxLength:
          path: maxLength
  - label: literal
    value:
      via: sqlType
      path: literal
