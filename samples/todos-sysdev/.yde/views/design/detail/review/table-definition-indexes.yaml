id: table-definition-indexes
name: テーブル設計書（索引）
description: 詳細設計項目一覧に確定した索引の一覧。導出した索引と台帳の索引を含み、補正も生成時に反映済み。主キーの索引はカラム一覧で見る。
params:
  - table
rows:
  match:
    - node:
        id: TBL-*
        bind: t
    - edge:
        via: table
        dir: in
    - node:
        id: IDX-*
        bind: x
  rowKey: x
  where:
    - of: t
      path: id
      equals: $table
order:
  schemaId: detail-table-list
columns:
  - label: 項番
    path: seq
  - label: テーブル
    of: t
    path: id
  - label: 索引名
    path: name
  - label: 一意
    value:
      first:
        - path: unique
        - 'false'
  - label: カラム
    value:
      path: columns[*].column
  - label: カラム名
    value:
      each:
        path: columns
      value:
        via: column
        path: name
  - label: 並び
    value:
      each:
        path: columns
      value:
        first:
          - path: order
          - asc
  - label: 導出元
    path: source
  - label: 張る理由（台帳）
    path: reason
  - label: 補正
    backlinks:
      schemaIds:
        - detail-corrections
