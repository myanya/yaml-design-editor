id: process-definition-steps
name: 処理設計書（ステップ）
description: 詳細設計の「処理の手順」のステップを、実行順に一覧する。呼ぶ Mapper のメソッドの名前と、メッセージのテキストは、ステップが ID で参照している先のレコードから取得する
rows: { idPattern: "STP-*", schemaIds: [detail-process] }
columns:
  - label: 種類
    path: step
  - label: 呼ぶメソッド
    value: { via: call, path: name }
  - label: チェックの実装方式
    path: by
  - label: 事前条件
    path: precondition
  - label: 制約
    value: { via: constraint, path: label }
  - label: メッセージ
    value: { via: message, path: text }
  - label: 実行できる状態
    path: allowed
  - label: 設計項目ID
    path: id
