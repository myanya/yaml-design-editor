id: table-definition-summary
name: テーブル設計書（概要）
description: 確定した詳細設計項目一覧のテーブルの概要。日本語名と区分は基本設計の確定項目を参照する。DDL もこの表を読む。補正と台帳の索引は生成時に合成済み。
params:
  - table
rows:
  match:
    - node:
        id: TBL-*
        bind: t
  where:
    - of: t
      path: id
      equals: $table
order:
  schemaId: detail-table-list
columns:
  - label: 項番
    path: seq
  - label: テーブル名
    path: name
  - label: テーブル日本語名
    value:
      first:
        - path: label
        - via: source
          path: label
  - label: テーブル区分
    value:
      all:
        match:
          - node:
              id: TBL-*
              bind: t
          - edge:
              via: source
          - node:
              bind: s
          - edge:
              contains: true
              dir: in
              repeat:
                min: 0
          - node:
              id: ENT-*
              bind: e
          - edge:
              via: entityClass
          - node:
              id: CLS-*
              bind: c
        of: c
        path: label
  - label: 主／明細
    path: kind
  - label: 主キーの制約名
    path: primaryKeyName
  - label: 親テーブル
    path: parent
  - label: 導出元
    path: source
  - label: 補正
    backlinks:
      schemaIds:
        - detail-corrections
