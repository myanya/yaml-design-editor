id: table-definition-columns
name: テーブル設計書（カラム一覧）
description: カラムと確定した基本設計項目を読む。SQL の型の穴には利用箇所の確定値を渡す。型の継承と基本設計の補正をビューで計算し直さない。 補正と台帳の追加は保存済みの確定値に含む。
params:
  - table
rows:
  match:
    - node:
        id: TBL-*
        bind: t
    - edge:
        contains: true
    - node:
        id: COL-*
        bind: c
  rowKey: c
  where:
    - of: t
      path: id
      equals: $table
order:
  schemaId: detail-table-list
columns:
  - label: 項番
    path: seq
  - label: テーブル
    of: t
    path: id
  - label: カラム名
    path: name
  - label: カラム日本語名
    value:
      first:
        - path: label
        - via: source
          path: label
  - label: 論理型
    value:
      first:
        - via: source
          path: item.type
        - via: source
          path: value.type
        - via: source
          path: type
        - via: sqlType
          path: type
  - label: SQL の型
    value:
      format:
        via: sqlType
        path: sql
      scopes:
        - via: source
      with:
        maxLength:
          first:
            - via: source
              path: item.maxLength
            - via: source
              path: value.maxLength
            - via: source
              path: maxLength
  - label: NOT NULL
    value:
      first:
        - path: notNull
        - via: source
          path: required
        - 'false'
  - label: NOT NULL の根拠
    value:
      first:
        - map:
            path: notNull
          using:
            'true': 詳細設計（足したカラム）
            'false': 詳細設計（埋め込みの親の項目が必須でない）
        - map:
            via: source
            path: required
          using:
            'true': 基本設計の必須
        - 必須でない
  - label: 主キーの順
    path: primaryKey
  - label: 初期値の設定
    value:
      map:
        count:
          all:
            from: c
            match:
              - node:
                  id: COL-*
                  bind: c
              - edge:
                  via: source
              - node:
                  id: FLD-*
                  bind: f
            where:
              - of: f
                path: default
                exists: true
            of: f
      using:
        '0': 設定なし
        '1': 設定あり
  - label: 初期値
    value:
      via: source
      path: default
  - label: 初期値の出力方法
    value:
      via: sqlType
      path: literal
  - label: 自動で入る値
    value:
      first:
        - via: source
          path: auto
        - なし
  - label: 入る値（CHECK）
    value:
      each:
        first:
          - via: source
            path: values
          - via: source
            path: item.values
          - via: source
            path: value.values
      value:
        path: value
  - label: 参照先テーブル
    path: referencesTable
  - label: 参照先カラム
    path: referencesColumn
  - label: 役割
    path: role
  - label: 説明（足したカラム）
    path: description
  - label: 型対応表の行
    path: sqlType
  - label: 導出元
    path: source
  - label: 補正
    backlinks:
      schemaIds:
        - detail-corrections
