id: process-definition
name: 処理設計書（処理）
description: 詳細設計の「処理の手順」を、操作ごとの処理（Service のメソッド 1 つ）で一覧する。処理設計書にあたるビューで、値は確定したレコード（design/detail/final/processes/）から読む。適用したオーバーライドは、レコードの decisions に残る
rows: { idPattern: "PRC-*", schemaIds: [detail-process] }
columns:
  - label: 操作
    path: label
  - label: Service のクラス
    path: service.class
  - label: Service のメソッド
    path: service.method
  - label: 引数
    path: service.arguments
  - label: トランザクション
    path: transaction
  - label: 生成元（基本設計の操作）
    path: source
  - label: 設計項目ID
    path: id
