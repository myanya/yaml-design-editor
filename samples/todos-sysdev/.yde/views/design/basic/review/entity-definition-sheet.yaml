# エンティティの個票（ダッシュボードの一覧から ID を押したときの見せ方）。1 エンティティを 1 枚で、上から読む
id: entity-definition-sheet
name: エンティティ定義書（個票）
description: >-
  確定項目一覧のエンティティ（ENT-*）の個票。概要 → 項目 → 入れ子の項目 → 操作と書く項目 → 項目 × 操作 の順に重ねる。
  表はレビュー用のビューで、値は確定項目のまま（ビューでは再計算しない）
kind: document
idPattern: "ENT-*"
schemaId: basic-entity-list
sections:
  - { label: 概要, fields: { include: [label, entityClass, description, parent, parentField, identifiers, numbering] } }
  - label: 項目
    grid: { view: entity-definition-review-items, params: { entity: { path: id } } }
  - label: 入れ子の項目
    grid: { view: entity-definition-review-nested, params: { entity: { path: id } } }
  - label: 操作と、書く項目
    grid: { view: entity-definition-review-operations, params: { entity: { path: id } } }
  - label: 項目 × 操作
    grid: { view: entity-definition-crud, params: { entity: { path: id } } }
