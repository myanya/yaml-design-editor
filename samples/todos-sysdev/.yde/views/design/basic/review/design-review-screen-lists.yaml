id: design-review-screen-lists
name: 画面定義書（一覧画面）
kind: dashboard
description: 画面定義書（一覧画面）の確定文書を選び、概要・内容・根拠を確認する。対象を空にすると、この種類の文書をまとめて表示する。
inputs:
  - key: document
    label: 対象の設計書
    type: ref
    idPatterns:
      - DOC-screen-lists.*
    default: DOC-screen-lists.todo-dashboard
sections:
  - id: summary
    label: 概要と根拠
    view: system-document-summary
    filter:
      match:
        - node:
            id: DOC-screen-lists.*
            bind: design
      expect: exists
  - id: content
    label: 設計内容
    view: system-document-content
    filter:
      match:
        - node:
            id: DOC-screen-lists.*
            bind: design
      expect: exists
  - id: documents
    label: この設計書の一覧
    view: system-document-list
    filter:
      match:
        - node:
            id: DOC-screen-lists.*
            bind: design
      expect: exists
