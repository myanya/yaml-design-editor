id: error-definition
name: エラー定義書（エラーケース）
description: 基本設計のエラー定義のレコード（操作がエラーになるケース 1 件を 1 行）を一覧する。エラー定義書にあたるビューで、エラー種別・操作・メッセージは、ID で参照した先のレコードから取得する
rows: { idPattern: "ERR-*", schemaIds: [basic-error-list] }
columns:
  - label: 操作
    value: { via: operation, path: label }
  - label: 種類
    value: { via: kind, path: label }
  - label: 発生タイミング
    value: { via: kind, path: when }
  - label: 表示場所
    value: { via: kind, path: shownAt }
  - label: 原因
    path: cause
  - label: 入力欄にも表示する入力パラメータ
    path: inputs
  - label: メッセージ
    value: { via: message, path: text }
  - label: 設計項目ID
    path: id
