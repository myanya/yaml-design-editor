id: basic-types
name: 論理型一覧
description: 確定項目一覧を読む。補正や型継承は生成時に解決し、ビューでは再計算しない
rows: { idPattern: "TYP-*" }
order: { schemaId: basic-type-list }
columns:
  - label: 項番
    path: seq
  - label: 型の名前
    path: name
  - label: 基底の種類
    path: base
  - label: 最大文字数
    path: maxLength
  - label: 最小文字数
    path: minLength
  - label: 最小値
    path: min
  - label: 最大値
    path: max
  - label: 複数行
    path: multiline
  - label: 形
    path: pattern
  - label: 表示形式
    path: format
  - label: 選択肢
    value:
      path: values[*].value
  - label: 参照先
    path: reference.entities
  - label: 行の項目
    value:
      path: fields[*].key
  - label: 説明
    path: description
  - label: 導出元
    path: source
  - label: 属性の状態
    path: attributeStates
  - label: 根拠
    path: origins
