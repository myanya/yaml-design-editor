id: operation-definition
name: 操作（一覧）
description: 基本設計の「操作」の項目一覧を並べる。値は確定項目をそのまま読み、ビューでは計算しない。対象・受け手・遷移は、同じ段の項目への参照
rows: { idPattern: "ACT-*", schemaIds: [basic-operation] }
order: { path: seq }
columns:
  - label: 操作
    path: source
  - label: 名称
    path: label
  - label: 種類
    path: kind
  - label: 対象
    path: entity
  - label: 受け手
    path: receiver
  - label: 作る要素
    value:
      path: creates[*]
  - label: はじまり
    path: entry
  - label: 遷移
    path: transition
  - label: 入力
    value:
      path: inputs[*].key
  - label: 前提
    value:
      path: preconditions[*].source
  - label: 確かめる決まり
    value:
      path: checks[*].rule
