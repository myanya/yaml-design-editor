id: message-definition
name: メッセージ定義書
description: 基本設計のメッセージ定義のレコード（メッセージ 1 件を 1 行）を一覧する。メッセージ定義書にあたるビュー。バリデーションメッセージは、キーの代わりに、操作・入力パラメータ・チェックの種類を持つ
rows: { idPattern: "MSG-*", schemaIds: [basic-message-list] }
columns:
  - label: 種類
    path: kind
  - label: キー
    path: key
  - label: テキスト
    path: text
  - label: テキストの生成元
    path: source
  - label: 操作（入力バリデーション）
    value: { via: operation, path: label }
  - label: 入力パラメータ（入力バリデーション）
    value: { via: input, path: label }
  - label: チェック（入力バリデーション）
    path: check
  - label: 設計項目ID
    path: id
