id: operation-definition-inputs
name: 操作（入力）
description: 基本設計の「操作」の項目一覧から、入力を並べる。型は同じ段の項目への参照で、決まりはこの入力で効く値
rows:
  match:
    - node: { id: "ACT-*", bind: a }
    - edge: { contains: true }
    - node: { id: "PRM-*", bind: p }
  rowKey: p
order: { schemaId: basic-operation }
columns:
  - label: 操作
    of: a
    path: source
  - label: 入力
    path: key
  - label: 名称
    path: label
  - label: 型
    path: definition.type
  - label: 基底の種類
    path: definition.base
  - label: 必須
    path: definition.required
  - label: 最大の長さ
    path: definition.maxLength
  - label: 表示の形
    path: definition.format
  - label: 参照先
    path: definition.reference.entity
  - label: 説明
    path: definition.description
