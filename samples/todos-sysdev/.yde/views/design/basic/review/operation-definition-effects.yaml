id: operation-definition-effects
name: 操作（効果）
description: 基本設計の「操作」の項目一覧から、効果を並べる。書く項目とエンティティは同じ段の項目への参照で、書く場所は導出元（業務モデル）の場所
rows:
  match:
    - node: { id: "ACT-*", bind: a }
    - edge: { contains: true }
    - node: { id: "EFF-*", bind: e }
  rowKey: e
order: { schemaId: basic-operation }
columns:
  - label: 操作
    of: a
    path: source
  - label: 効果
    path: id
  - label: 書き方
    path: op
  - label: 起こり
    path: cause
  - label: エンティティ
    path: entity
  - label: 書く項目
    path: item
  - label: 書く場所
    path: path
  - label: 行の番号
    path: row
  - label: 足す先の並び
    path: collection.key
