id: entity-definition-summary
name: エンティティ定義書（概要）
description: 確定項目一覧を読む。補正や型継承は生成時に解決し、ビューでは再計算しない
params: [entity]
rows:
  match:
    - node: { id: "ENT-*", bind: e }
  where:
    - { of: e, path: id, equals: $entity }
order: { schemaId: basic-entity-list }
columns:
  - label: 名称
    path: label
  - label: 区分
    value:
      via: entityClass
      path: label
  - label: 説明
    path: description
  - label: 親エンティティ
    path: parent
  - label: 親の項目
    path: parentField
  - label: ID項目
    path: identifiers
  - label: 接頭辞
    path: numbering.prefix
  - label: 桁
    path: numbering.digits
  - label: ID形式の説明
    path: numbering.description
  - label: 導出元
    path: source
  - label: 業務モデルの文書
    path: documents
