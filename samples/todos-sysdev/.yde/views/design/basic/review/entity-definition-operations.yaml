id: entity-definition-operations
name: エンティティ定義書（操作一覧）
description: 確定項目一覧を読む。補正や型継承は生成時に解決し、ビューでは再計算しない
params: [entity]
rows:
  match:
    - node: { id: "ENT-*", bind: e }
    - edge: { contains: true }
    - node: { id: "OPS-*", bind: o }
  rowKey: o
  where:
    - { of: e, path: id, equals: $entity }
order: { schemaId: basic-entity-list }
columns:
  - label: 項番
    path: seq
  - label: 操作
    path: action
  - label: 名称
    path: label
  - label: 作成・更新
    path: crud
  - label: 書く項目
    value:
      path: writes[*].item
