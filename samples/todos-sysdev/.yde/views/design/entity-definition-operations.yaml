id: entity-definition-operations
name: エンティティ定義書（操作一覧）
description: 基本設計項目一覧の操作（このエンティティの項目を作成・更新する業務の操作）に、補正一覧を重ねた一覧（エンティティ定義書の 1 区画）
params: [entity]
rows:
  match:
    - node: { id: "ENT-*", bind: e }
    - edge: { contains: true }
    - node: { id: "OPS-*", bind: o }
  rowKey: o
  where:
    - { of: e, path: id, equals: $entity }
order: { schemaId: basic-entity-list }
corrections: { schemaIds: [basic-corrections] }
columns:
  - { label: 項番, path: seq }
  - { label: 操作, path: action }
  - { label: 名称, path: label }
  - { label: 作成・更新, path: crud }
  - { label: 書く項目, value: { path: "writes[*].item" } }
  - { label: 補正, backlinks: { schemaIds: [basic-corrections] } }
