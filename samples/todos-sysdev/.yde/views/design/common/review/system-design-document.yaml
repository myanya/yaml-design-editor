id: system-design-document
name: 確定した設計書
kind: document
match: design/*/final/**
sections:
  - label: 設計内容
    fields:
      exclude:
        - designId
        - designKind
        - designPath
        - origins
  - label: 同じ導出元の設計書
    grid:
      view: system-related-documents
      params:
        source:
          path: id
  - label: 採用した値の根拠
    fields:
      include:
        - origins
