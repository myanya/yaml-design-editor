id: screen-design
name: 画面の設計書（基本から詳細まで）
kind: document
schemaId: basic-screen
description: 基本設計の「画面」の項目 1 件と、その画面の詳細設計を並べる。画面定義書にあたるビューで、値は確定項目をそのまま読む。
sections:
  - label: 画面の中身（画面定義書）
    fields:
      include:
        - id
        - source
        - kind
        - label
        - description
        - url
        - entity
        - operation
        - filters
        - buttons
        - sections
        - items
        - tables
        - hidden
        - input
        - confirm
        - execute
        - decisions
  - label: 部品の木とフォーム（操作の画面の画面設計書）
    grid:
      view: screen-design-related
      params:
        source:
          path: source
  - label: この画面を指している項目
    backlinks: {}
