id: screen-design
name: 操作の画面の設計書（基本から詳細まで）
kind: document
schemaId: screen-operation
description: 導出元の操作を参照して、確定した基本設計と詳細設計を並べる。
sections:
  - label: 画面の中身（画面定義書）
    fields:
      include:
        - id
        - name
        - target
        - starts
        - shownWhen
        - input
        - confirm
        - execute
  - label: 部品の木とフォーム（画面設計書）
    grid:
      view: screen-design-related
      params:
        source:
          path: id
  - label: この操作を扱う Controller
    backlinks: {}
