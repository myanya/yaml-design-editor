id: action-design
name: 操作の設計書（基本から詳細まで）
kind: document
schemaId: action-spec
description: 導出元の操作を参照して、確定した基本設計と詳細設計を並べる。
sections:
  - label: 外から見た振る舞い（アクション定義書）
    fields:
      include:
        - id
        - name
        - description
        - kind
        - subject
        - inputs
        - initial
        - state
        - preconditions
        - effects
  - label: 内部の手順（処理設計書）
    grid:
      view: action-design-related
      params:
        source:
          path: id
  - label: この操作を扱う Controller と Mapper
    backlinks: {}
