id: table-definition-foreign-keys
name: テーブル設計書（外部キー）
description: 詳細設計項目一覧に確定した外部キーの一覧。入れ子の親への複合キーと、参照のカラムの参照先・削除時の扱いを表示する。
params:
  - table
rows:
  match:
    - node:
        id: TBL-*
        bind: t
    - edge:
        contains: true
    - node:
        id: FK-*
        bind: f
  rowKey: f
  where:
    - of: t
      path: id
      equals: $table
order:
  schemaId: detail-table-list
columns:
  - label: 項番
    path: seq
  - label: テーブル
    of: t
    path: id
  - label: 制約名
    path: name
  - label: カラム
    path: columns
  - label: カラム名
    value:
      each:
        path: columns
      value:
        path: name
  - label: 参照先テーブル
    path: referencesTable
  - label: 参照先テーブル名
    value:
      via: referencesTable
      path: name
  - label: 参照先カラム
    value:
      each:
        path: columns
      value:
        path: referencesColumn
  - label: 参照先カラム名
    value:
      each:
        path: columns
      value:
        via: referencesColumn
        path: name
  - label: 消したときの動き
    value:
      first:
        - path: onDelete
        - 指定しない
  - label: 補正
    backlinks:
      schemaIds:
        - detail-corrections
