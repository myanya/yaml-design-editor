id: table-definition
name: テーブル設計書
kind: dashboard
description: >-
  確定した詳細設計項目一覧（design/detail/tables.yaml）を表示する。物理名・型対応・索引・外部キーは保存値を、日本語名・必須・論理型・初期値・選択肢・区分は参照先の基本設計の確定項目を読む。補正と台帳は生成時に合成し、ビューで再適用しない。テーブルを選ぶと絞られる（最初は
  todo）。
inputs:
  - key: table
    label: テーブル
    type: detail-table-list#テーブル参照
    default: TBL-todo
sections:
  - id: summary
    label: 概要
    group: テーブル設計書
    view: table-definition-summary
  - id: columns
    label: カラム一覧
    group: テーブル設計書
    view: table-definition-columns
  - id: indexes
    label: 索引
    group: テーブル設計書
    view: table-definition-indexes
  - id: foreign-keys
    label: 外部キー
    group: テーブル設計書
    view: table-definition-foreign-keys
