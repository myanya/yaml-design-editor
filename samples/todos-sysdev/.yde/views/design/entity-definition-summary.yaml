id: entity-definition-summary
name: エンティティ定義書（概要）
description: 基本設計項目一覧のエンティティに、補正一覧を重ねた概要（エンティティ定義書の 1 区画）
params: [entity]
rows:
  match:
    - node: { id: "ENT-*", bind: e }
  where:
    - { of: e, path: id, equals: $entity }
order: { schemaId: basic-entity-list }
corrections: { schemaIds: [basic-corrections] }
columns:
  - { label: 名称, path: label }
  - { label: 説明, path: description }
  - { label: 親エンティティ, path: parent }
  - { label: 親の項目, path: parentField }
  - { label: ID項目, path: numbering.item }
  - { label: 接頭辞, path: numbering.prefix }
  - { label: 桁, path: numbering.digits }
  - { label: ID形式の説明, path: numbering.description }
  - { label: 導出元, path: source }
  - { label: 業務モデルの文書, path: documents }
  - { label: 補正, backlinks: { schemaIds: [basic-corrections] } }
