id: entity-specs
name: エンティティ定義書
description: >-
  業務モデルのエンティティ型ごとに、システムが持つ項目（名前・型・必須・文字数・選択肢・参照先）と ID の振り方を 1 本にする。
  一覧の行と個票のように業務モデルで 2 か所に書かれた項目は 1 つにまとめる（キーの初出順。どの文書に書かれているかは documents）。
  CRUD 表は、項目ごとに、どの操作がその項目を作る（C）・書き換える（U）かを並べる（列は、この型の項目を書く操作）。
  値はすべて業務モデルから写し、設計の判断は入れない
scope: business
each: entities
output: "design/generated/entities/{id}.yaml"
build:
  id: { $copy: id }
  name: { $copy: label }
  numbering: { $copy: numbering }
  owner: { $copy: owner }
  documents: { $each: aspects, $build: { $copy: schema } }
  items:
    $group: { $apply: fields }
    $by: { $copy: field.key }
    $build:
      key: { $copy: key }
      label: { $copy: "items[0].field.label" }
      type: { $copy: "items[0].field.type" }
      base: { $copy: "items[0].field.base" }
      required: { $copy: "items[0].field.required" }
      default: { $copy: "items[0].field.default" }
      auto: { $copy: "items[0].field.auto" }
      minLength: { $copy: "items[0].field.minLength" }
      maxLength: { $copy: "items[0].field.maxLength" }
      pattern: { $copy: "items[0].field.pattern" }
      format: { $copy: "items[0].field.format" }
      multiline: { $copy: "items[0].field.multiline" }
      values: { $copy: "items[0].field.values" }
      stateOf: { $copy: "items[0].field.stateOf" }
      target: { $copy: "items[0].field.target" }
      relation: { $copy: "items[0].field.relation" }
      unique: { $copy: "items[0].field.unique" }
      item: { $copy: "items[0].field.item" }
      fields: { $copy: "items[0].field.fields" }
      documents: { $each: items, $build: { $copy: schema } }
  # CRUD 表の列（この型の項目を書く操作）の名前
  operations:
    $group: { $apply: marks }
    $by: { $copy: operation }
    $build: { id: { $copy: key }, label: { $copy: "items[0].label" } }
  # CRUD 表: 1 行が 1 項目。列は操作の ID で、C＝作る・U＝書き換える・空＝書かない
  crud:
    $group: { $apply: fields }
    $by: { $copy: field.key }
    $bind: row
    $build:
      $entries:
        $concat:
          - - { key: 項目, value: { $copy: key } }
            - { key: 名前, value: { $first: [{ $copy: "items[0].field.label" }, { $copy: key }] } }
          - $group: { $apply: marks, $of: element }
            $by: { $copy: operation }
            $build: { key: { $copy: key }, value: '' }
          - $group: { $apply: marks, $of: element }
            $by: { $when: [{ path: item, equals: { $copy: key, $of: row } }], $then: { $copy: operation } }
            $build: { key: { $copy: key }, value: { $copy: "items[0].mark" } }
rules:
  # いまの場所＝エンティティ型。側面ごとの項目を 1 列に（{field: 項目, schema: 書かれた文書の種類}）
  - id: fields
    build:
      $each: aspects
      $bind: asp
      $flatten: true
      $build:
        $each: fields
        $build: { field: { $copy: . }, schema: { $copy: schema, $of: asp } }
  # いまの場所＝エンティティ型。この型の項目を書く操作の印の並び（{item, operation, label, mark}）
  - id: marks
    build:
      $each: actions
      $of: model
      $bind: a
      $flatten: true
      $build:
        $each: effects
        $flatten: true
        $build:
          $concat:
            # 項目を書く（値を入れる・消す・配列へ足す。別の型の要素を足す配列も、この型の項目を書く）
            - $when:
                - { path: entity, equals: { $copy: id, $of: element } }
                - { or: [{ path: op, equals: set }, { path: op, equals: delete }, { path: op, equals: insert }] }
                - { or: [{ path: field.item.entity, exists: false }, { path: field.item.entity, notEquals: { $copy: id, $of: element } }] }
              $then:
                - { item: { $copy: field.key }, operation: { $copy: id, $of: a }, label: { $copy: label, $of: a }, mark: { $apply: mark, $of: a } }
            # この型の要素を作る（文書を作る・一覧や入れ子の配列へ足す）: 書いた項目はどれも C
            - $when: [{ path: op, equals: create }, { path: entity, equals: { $copy: id, $of: element } }]
              $then: { $each: written, $build: { item: { $copy: key }, operation: { $copy: id, $of: a }, label: { $copy: label, $of: a }, mark: C } }
            - $when: [{ path: op, equals: insert }, { path: field.item.entity, equals: { $copy: id, $of: element } }]
              $then: { $each: written, $build: { item: { $copy: key }, operation: { $copy: id, $of: a }, label: { $copy: label, $of: a }, mark: C } }
  # いまの場所＝操作。この型を作る操作なら C（作るときに入る値）、そうでなければ U
  - id: mark
    build:
      $first:
        - { $when: [{ path: creates, includes: { $copy: id, $of: element } }], $then: C }
        - U
