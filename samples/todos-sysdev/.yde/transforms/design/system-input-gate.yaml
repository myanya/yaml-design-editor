id: system-input-gate
name: 設計書の手書き入力を検査する
scope: design
dependsOn: []
output: design/system/input-check.yaml
input:
  $validate:
    schemas:
      $each: schemas
      $of: model
      $build:
        $when:
          - path: id
            oneOf:
              - system-inputs
              - system-corrections
              - system-additions
        $then:
          $copy: declared
    documents:
      design/system/corrections.yaml:
        $apply: input-document
        $with:
          row:
            $view: system-corrections-document
            $one: true
      design/system/additions.yaml:
        $apply: input-document
        $with:
          row:
            $view: system-additions-document
            $one: true
build:
  id: SYS-input-check
  status: validated
rules:
  - id: input-document
    with:
      - row
    build:
      $copy: values.record
      $of: row
