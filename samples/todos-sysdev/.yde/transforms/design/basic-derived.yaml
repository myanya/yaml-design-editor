id: basic-derived
name: 導出項目一覧（業務モデルの宣言）
description: >-
  補正とアーキテクチャの規則を当てる前の、業務モデルの項を記録する。
  型と項目の declarations は明記された属性・継承元・原文の場所を保持する。
  schemas はスキーマの原文を保持し、入れ子や操作を失わずに補正後の型を解く材料にする。
  中の識別子は生成の材料であり、確定した設計項目の ID として索引へ登録しない
scope: business
output: design/basic/derived/model.yaml
build:
  id: DRV-business
  model: { $copy: . }
