id: domains
name: ドメイン定義書
description: >-
  基本設計。ドメイン（集約＝入れ子の持ち主がいないエンティティ型と、その中の入れ子の型）ごとに、業務の概念を業務の言葉で 1 本にする
  （説明・構成・情報・状態の流れ・提供する操作・データの決まり・ほかのドメインとの関係）。テーブル・列・クラスのようなシステムの言葉は書かない。
  人が読む文書で、ほかの設計書の入力にはしない（設計書は業務モデルを直接読む）。ドメインの範囲を関係で決める仕組みは今後（UX-332）
scope: business
stage: basic
each: entities
output: "design/generated/domains/{id}.yaml"
build:
  $when: [{ path: owner, exists: false }]
  id: { $copy: id }
  name: { $copy: label }
  description: { $copy: description }
  # 構成: 集約の中心と、その中にだけある型
  members:
    $each: entities
    $of: model
    $bind: m
    $build:
      $when: [{ path: aggregate, equals: { $copy: id, $of: element } }]
      entity: { $copy: id }
      label: { $copy: label }
      role:
        $first:
          - $when: [{ path: owner, exists: false }]
            $then: 集約の中心
          - $format: "「{o[0]}」の中にだけある"
            $with: { o: { $each: entities, $of: model, $build: { $when: [{ path: id, equals: { $copy: owner.entity, $of: m } }], $then: { $copy: label } } } }
      description: { $copy: description }
      numbering:
        $first:
          - $when: [{ path: owner, exists: true }, { path: numbering, exists: true }]
            $then: { $format: "外側の番号に続けて {numbering.digits} 桁の続き番号（使われている番号の次）" }
          - $when: [{ path: numbering, exists: true }]
            $then: { $format: "「{numbering.prefix}」と {numbering.digits} 桁の番号（使われている番号の次）" }
  # 情報: 型ごとの項目（業務の型の名前と説明。一覧の行と個票のように 2 か所に書かれた項目は 1 つ）
  information:
    $each: entities
    $of: model
    $flatten: true
    $build:
      $when: [{ path: aggregate, equals: { $copy: id, $of: element } }]
      $then:
        - of: { $copy: label }
          items:
            $group: { $each: aspects, $flatten: true, $build: { $each: fields, $build: { $copy: . } } }
            $by: { $copy: key }
            $build: { $apply: info, $at: "items[0]" }
  # 状態の流れ（Lifecycle）
  states:
    $each: entities
    $of: model
    $bind: m
    $flatten: true
    $build:
      $when: [{ path: aggregate, equals: { $copy: id, $of: element } }]
      $then:
        $each: lifecycles
        $of: model
        $build:
          $when: [{ path: entity, equals: { $copy: id, $of: m } }]
          lifecycle: { $copy: id }
          of: { $copy: label, $of: m }
          states: { $each: states, $build: { $copy: label } }
          groups: { $each: groups, $build: { label: { $copy: label }, states: { $each: states, $build: { $copy: label } } } }
          start:
            $each: entry
            $build:
              to: { $copy: to.label }
              by: { $copy: actionLabel }
          moves:
            $each: transitions
            $build:
              by: { $copy: actionLabel }
              from: { $each: from, $build: { $copy: label } }
              to: { $copy: to.label }
          end: { $each: terminal, $build: { $copy: label } }
  # 提供する操作（受け手か、作る要素の型がこのドメインのもの）
  operations:
    $each: entities
    $of: model
    $bind: m
    $flatten: true
    $build:
      $when: [{ path: aggregate, equals: { $copy: id, $of: element } }]
      $then:
        $each: actions
        $of: model
        $build:
          $when: [{ path: subject, equals: { $copy: id, $of: m } }]
          label: { $copy: label }
          of: { $copy: label, $of: m }
          description: { $copy: description }
          when: { $each: lifecycle.transitions, $flatten: true, $build: { $each: from, $build: { $copy: label } } }
          requires: { $each: require, $build: { $when: [{ path: message, exists: true }], $then: { $copy: message } } }
          inputs: { $each: params, $build: { $copy: label } }
  # データの決まり（関係の決まりは relations）
  rules:
    $each: entities
    $of: model
    $bind: m
    $flatten: true
    $build:
      $when: [{ path: aggregate, equals: { $copy: id, $of: element } }]
      $then:
        $each: constraints
        $of: model
        $build:
          $when: [{ path: entity, equals: { $copy: id, $of: m } }, { not: { path: form, equals: relation } }]
          label: { $copy: label }
          level: { $map: { $copy: level }, $using: { error: 守る（破ると断る）, warning: 気づかせる（警告） } }
  # ほかのドメインとの関係（出る向きと入る向き。相手はドメイン定義書の ID）
  relations:
    $concat:
      - $each: relations
        $of: model
        $bind: r
        $build:
          $when: [{ path: source, includes: { $copy: id, $of: element } }]
          direction: 出る
          label: { $copy: label }
          to: { $copy: "target[0]" }
          toLabel: { $format: "{l[0]}", $with: { l: { $each: entities, $of: model, $build: { $when: [{ path: id, equals: { $copy: "target[0]", $of: r } }], $then: { $copy: label } } } } }
          many: { $first: [{ $when: [{ path: cardinality.outMax, equals: 1 }], $then: 1 つまで }, いくつでも] }
          acyclic: { $when: [{ path: acyclic, equals: true }], $then: 循環しない }
          note: { $copy: description }
      - $each: relations
        $of: model
        $bind: r
        $build:
          $when: [{ path: target, includes: { $copy: id, $of: element } }]
          direction: 入る
          label: { $copy: inverseLabel }
          to: { $copy: "source[0]" }
          toLabel: { $format: "{l[0]}", $with: { l: { $each: entities, $of: model, $build: { $when: [{ path: id, equals: { $copy: "source[0]", $of: r } }], $then: { $copy: label } } } } }
          many: { $first: [{ $when: [{ path: cardinality.inMax, equals: 1 }], $then: 1 つまで }, いくつでも] }
          acyclic: { $when: [{ path: acyclic, equals: true }], $then: 循環しない }
          note: { $copy: description }
rules:
  # いまの場所＝項目（業務モデルの項の field）。業務の言葉の情報 1 つ
  - id: info
    build:
      key: { $copy: key }
      label: { $copy: label }
      kind: { $apply: kind }
      choices: { $when: [{ path: base, equals: enum }], $then: { $each: values, $build: { $copy: label } } }
      columns: { $when: [{ path: item.base, equals: object }, { path: item.entity, exists: false }], $then: { $each: item.fields, $build: { $copy: label } } }
      required: { $when: [{ path: required, equals: true }], $then: 必ずある }
      auto: { $map: { $copy: auto }, $using: { created: 作ったときの日付が入る, updated: 書き換えたときの日付が入る, revision: 版が進む } }
      note: { $copy: description }
  # 業務の型の名前（モジュールの名前は外す）と、文字数の上限
  - id: kind
    when: [{ path: base, equals: id }]
    build: 番号
  - id: kind
    when: [{ path: base, equals: enum }, { path: stateOf, exists: true }]
    build: 状態
  - id: kind
    when: [{ path: base, equals: enum }]
    build: 選択肢
  - id: kind
    when: [{ path: base, equals: ref }]
    build: { $format: "{targetLabel}を 1 つ指す" }
  - id: kind
    when: [{ path: base, equals: array }, { path: item.base, equals: ref }]
    build: { $format: "{item.targetLabel}をいくつでも指す" }
  - id: kind
    when: [{ path: base, equals: array }, { path: item.entity, exists: true }]
    build: { $format: "{item.entityLabel}の並び" }
  - id: kind
    when: [{ path: base, equals: array }]
    build: 行の並び
  - id: kind
    when: [{ path: base, equals: boolean }]
    build: はい・いいえ
  - id: kind
    when: [{ path: maxLength, exists: true }]
    build: { $format: "{t}（{maxLength} 文字まで）", $with: { t: { $apply: type-name } } }
  - id: kind
    build: { $apply: type-name }
  - id: type-name
    build: { $first: [{ $value: { extract: [{ path: type }, "#(.+)$"] } }, { $copy: type }] }
