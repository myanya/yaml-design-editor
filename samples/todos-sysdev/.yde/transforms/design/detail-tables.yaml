id: detail-tables
name: 補正・追加を反映した物理項目の確定
scope: business
dependsOn:
  - detail-tables-derived
output: design/detail/tables.yaml
input:
  $apply: physical
  $with:
    row:
      $view: system-physical-derived-input
      $one: true
    ledger:
      $view: detail-ledger-input
      $one: true
    types:
      $view: detail-sql-types-input
      $one: true
build:
  $copy: .
rules:
  - id: physical
    with:
      - row
      - ledger
      - types
    build:
      $apply: rebuild
      $with:
        composed:
          $compose:
            derived:
              $concat:
                - $apply: flatten
                  $with:
                    document:
                      $copy: values.document
                      $of: row
                - $each: values.record.mappings
                  $of: types
                  $build:
                    id:
                      $copy: id
                    value:
                      $copy: .
                    source:
                      id: sql-types
                      document: design/detail/sql-types.yaml
            additions:
              $each: values.record.indexes
              $of: ledger
              $build:
                id:
                  $copy: id
                value:
                  $copy: .
                source:
                  id: ledger
                  document: design/detail/ledger.yaml
            changes:
              $each:
                $view: detail-corrections-input
              $build:
                target:
                  $copy: values.record.target
                set:
                  $copy: values.record.set
                priority: individual
                source:
                  id:
                    $copy: id
  - id: flatten
    with:
      - document
    build:
      $each: tables
      $of: document
      $flatten: true
      $build:
        $concat:
          - - id:
                $copy: id
              value:
                $apply: contract-result
                $with:
                  combined:
                    $compose:
                      derived:
                        - id: record
                          value:
                            $entries:
                              $eachEntry: .
                              $flatten: true
                              $build:
                                $when:
                                  - not:
                                      path: $key
                                      oneOf:
                                        - columns
                                        - indexes
                                        - foreignKeys
                                $then:
                                  - key: $key
                                    value:
                                      $copy: .
                          source:
                            id: contract
                      additions: []
                      changes:
                        - target: record
                          set:
                            originalName:
                              $copy: name
                          priority: individual
                          source:
                            id: contract
              source:
                id: table
          - $each: columns
            $build:
              id:
                $copy: id
              value:
                $apply: contract-result
                $with:
                  combined:
                    $compose:
                      derived:
                        - id: record
                          value:
                            $copy: .
                          source:
                            id: contract
                      additions: []
                      changes:
                        - target: record
                          set:
                            table:
                              $copy: id
                              $of: table
                            item:
                              $first:
                                - $value:
                                    extract:
                                      - path: source
                                      - '[^.]+$'
                                - $value:
                                    extract:
                                      - path: id
                                      - '[^.]+$'
                          priority: individual
                          source:
                            id: contract
              source:
                id: column
          - $each: indexes
            $build:
              id:
                $copy: id
              value:
                $copy: .
              source:
                id: index
          - $each: foreignKeys
            $build:
              id:
                $copy: id
              value:
                $apply: contract-result
                $with:
                  combined:
                    $compose:
                      derived:
                        - id: record
                          value:
                            $copy: .
                          source:
                            id: contract
                      additions: []
                      changes:
                        - target: record
                          set:
                            table:
                              $copy: id
                              $of: table
                          priority: individual
                          source:
                            id: contract
              source:
                id: foreignKey
      $bind: table
  - id: rebuild
    with:
      - composed
    build:
      tables:
        $each: records
        $of: composed
        $bind: t
        $build:
          $when:
            - path: id
              startsWith: TBL-
          $then:
            $apply: contract-result
            $with:
              combined:
                $compose:
                  derived:
                    - id: record
                      value:
                        $copy: value
                      source:
                        id: contract
                  additions: []
                  changes:
                    - target: record
                      set:
                        columns:
                          $each: records
                          $of: composed
                          $build:
                            $when:
                              - path: id
                                startsWith: COL-
                              - path: value.table
                                equals:
                                  $copy: id
                                  $of: t
                            $then:
                              $copy: value
                        indexes:
                          $each: records
                          $of: composed
                          $build:
                            $when:
                              - path: id
                                startsWith: IDX-
                              - path: value.table
                                equals:
                                  $copy: id
                                  $of: t
                            $then:
                              $copy: value
                        foreignKeys:
                          $each: records
                          $of: composed
                          $build:
                            $when:
                              - path: id
                                startsWith: FK-
                              - path: value.table
                                equals:
                                  $copy: id
                                  $of: t
                            $then:
                              $copy: value
                      priority: individual
                      source:
                        id: contract
      mappings:
        $each: records
        $of: composed
        $build:
          $when:
            - path: id
              startsWith: SQL-
          $then:
            $copy: value
      decisions:
        $copy: decisions
        $of: composed
      documentId: SYS-physical-final
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
