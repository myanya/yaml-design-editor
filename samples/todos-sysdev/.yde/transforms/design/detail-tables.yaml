id: detail-tables
name: 詳細設計項目一覧（テーブル）
description: >-
  詳細設計の段の項から、テーブル・カラム・索引・外部キーの設計項目を 1 本の一覧にする。持つのは詳細設計にだけ出てくるもの
  （テーブル名・カラム名・主キーの順と名前・型対応への参照・親のキーと並び順・索引・外部キー）だけで、名称・必須・論理型・初期値・選択肢は
  導出元（基本設計項目一覧のエンティティ・項目・論理型）を参照でたどって読む（テーブル設計書のビューと DDL のレポート）。
  業務モデルの形からテーブルへの写し方（深さによらない）:
  エンティティ型 → 主のテーブル（入れ子のエンティティは、親の ID と、親の中の位置＝配列なら並び順・マップならキー）・
  配列とマップの項目 → 明細テーブル（親のキー＋並び順かキーが主キー。行の中の配列・マップは、さらに下の明細テーブルで、親への外部キーは複合）・
  名前の有無によらない object（エンティティでない）→ 埋め込み（中の項目を 親のキー_項目 のカラムに）・要素が名前の無い配列・マップの配列とマップは
  テーブルにできない形（対応の検査が指摘する）。
  テーブルは TBL-テーブル名、カラムは COL-テーブル名.カラム名、索引は IDX-索引名、外部キーは FK-制約名。テーブル名はエンティティ型のスネーク、明細は 親のテーブル名_項目、
  カラム名は項目のキー（SQL の予約語は末尾に _）。SQL の型は型対応表（design/detail/sql-types.yaml）の SQL-論理型 を指す。
  外部キーは、入れ子で持つ親へ 1 つ（親の主キーのカラムの組。親の行を消したら一緒に消す）と、参照のカラムごとに 1 つ（消したときの動きは指定しない）。
  索引は、配列の「同じものは 1 度だけ」（親のキーと要素・比べる項目の一意の索引）と、入れ子のエンティティの親の ID（1 件・マップは一意）と、
  外部キーのカラム（主キーの先頭のカラムは主キーの索引で足りるので除く）に張る。業務モデルから導けない索引は、人が書く詳細設計項目台帳（design/detail/ledger.yaml）に書く
scope: business
stage: detail
output: design/detail/tables.yaml
build:
  tables:
    # 項番を通しで振るため、主のテーブルと明細テーブルを 1 列にしてから ID でまとめる（まとめる段で、カラムから索引と外部キーを作る）
    $group:
      $concat:
        # エンティティ型ごとの主のテーブル
        - $each: entities
          $bind: ent
          $build:
            id: { $format: "TBL-{t}", $with: { t: { $case: { $copy: id }, $as: snake } } }
            name: { $case: { $copy: id }, $as: snake }
            kind: main
            source: { $format: "ENT-{id}" }
            parent: { $when: [{ path: owner.entity, exists: true }], $then: { $format: "TBL-{t}", $with: { t: { $case: { $copy: owner.entity }, $as: snake } } } }
            # 入れ子のエンティティを 1 件・マップで持つとき: 親の ID（とマップのキー）の一意の索引（親の ID の索引を兼ねる）
            uniques:
              $when: [{ path: owner.entity, exists: true }]
              $then: { $apply: owner-uniques, $with: { o: { $copy: owner }, b: { $apply: owner-base, $with: { o: { $copy: owner } } }, t: { $case: { $copy: id }, $as: snake } } }
            parentIndexed:
              $when: [{ path: owner.entity, exists: true }]
              $then: { $apply: owner-indexed, $with: { b: { $apply: owner-base, $with: { o: { $copy: owner } } } } }
            columns:
              $group:
                $concat:
                  # ID の項目（主キー）
                  - $each: aspects
                    $flatten: true
                    $build:
                      $each: fields
                      $flatten: true
                      $build:
                        $when: [{ path: base, equals: id }]
                        $then:
                          - id: { $format: "COL-{t}.{c}", $with: { t: { $case: { $copy: id, $of: ent }, $as: snake }, c: { $apply: sql-name, $with: { name: { $copy: key } } } } }
                            name: { $apply: sql-name, $with: { name: { $copy: key } } }
                            source: { $format: "FLD-{e}.{key}", $with: { e: { $copy: id, $of: ent } } }
                            sqlType: { $apply: sql-ref }
                            pk: true
                  # 入れ子のエンティティ: 親の ID（親のテーブルの主キーを指す）と、親の中の位置（配列なら並び順・マップならキー）
                  - $when: [{ path: owner.entity, exists: true }]
                    $then:
                      $concat:
                        - - id: { $format: "COL-{t}.{p}_id", $with: { t: { $case: { $copy: id }, $as: snake }, p: { $case: { $copy: owner.entity }, $as: snake } } }
                            name: { $format: "{p}_id", $with: { p: { $case: { $copy: owner.entity }, $as: snake } } }
                            role: parent
                            label: { $format: "{l[0]}のID", $with: { l: { $each: entities, $of: model, $flatten: true, $build: { $when: [{ path: id, equals: { $copy: owner.entity, $of: ent } }], $then: [{ $copy: label }] } } } }
                            description: 入れ子で持つ外側のエンティティの行の ID（親のテーブルの主キーを指す）
                            sqlType:
                              $format: "{l[0]}"
                              $with:
                                l: { $each: entities, $of: model, $flatten: true, $build: { $when: [{ path: id, equals: { $copy: owner.entity, $of: ent } }], $then: { $apply: id-sql-refs } } }
                            notNull: true
                            referencesTable: { $format: "TBL-{p}", $with: { p: { $case: { $copy: owner.entity }, $as: snake } } }
                            referencesColumn: { $format: "COL-{p}.{c}", $with: { p: { $case: { $copy: owner.entity }, $as: snake }, c: { $apply: target-id-col, $with: { e: { $copy: owner.entity } } } } }
                        - $apply: owner-key
                          $with: { o: { $copy: owner }, b: { $apply: owner-base, $with: { o: { $copy: owner } } }, t: { $case: { $copy: id }, $as: snake } }
                  # そのほかの項目（埋め込みの object は中の項目ごとに。配列・マップ・入れ子のエンティティは別のテーブル）
                  - $each: aspects
                    $flatten: true
                    $build:
                      $each: fields
                      $flatten: true
                      $build:
                        $when: [{ path: base, notEquals: id }]
                        $then:
                          $apply: cols
                          $with:
                            ctx:
                              table: { $case: { $copy: id, $of: ent }, $as: snake }
                              src: { $copy: id, $of: ent }
                              optional: false
              $by: { $copy: id }
              $apply: column
        # 配列・マップの項目ごとの明細テーブル（埋め込みの object の中・行の中の配列とマップも、深さによらず）
        - $each: entities
          $bind: ent
          $flatten: true
          $build:
            $each: aspects
            $flatten: true
            $build:
              $each: fields
              $flatten: true
              $apply: tables
              $with:
                ctx:
                  table: { $case: { $copy: id, $of: ent }, $as: snake }
                  label: { $copy: label, $of: ent }
                  src: { $copy: id, $of: ent }
                  optional: false
                  # 親のテーブル（エンティティの主のテーブル）の主キー → 明細が持つ親のキー
                  keys:
                    - name: { $format: "{t}_id", $with: { t: { $case: { $copy: id, $of: ent }, $as: snake } } }
                      ref: { $format: "COL-{t}.{c}", $with: { t: { $case: { $copy: id, $of: ent }, $as: snake }, c: { $apply: target-id-col, $with: { e: { $copy: id, $of: ent } } } } }
                      sqlType: { $format: "{l[0]}", $with: { l: { $apply: id-sql-refs, $of: ent } } }
                      label: { $format: "{e}のID", $with: { e: { $copy: label, $of: ent } } }
                      description: 配列・マップを持つエンティティの行の ID（親のテーブルの主キーを指す）
    $by: { $copy: id }
    $bind: tg
    $build:
      seq: { $number: $position, $as: "00" }
      id: { $copy: "items[0].id" }
      name: { $copy: "items[0].name" }
      label: { $copy: "items[0].label" }
      kind: { $copy: "items[0].kind" }
      source: { $copy: "items[0].source" }
      parent: { $copy: "items[0].parent" }
      primaryKeyName: { $format: "pk_{n}", $with: { n: { $copy: "items[0].name" } } }
      columns: { $copy: "items[0].columns" }
      # 索引: 一意の索引（配列の「同じものは 1 度だけ」・入れ子のエンティティの親）と、外部キーのカラムの索引
      indexes:
        $group:
          $concat:
            - $each: "items[0].uniques"
              $build:
                id: { $format: "IDX-{name}" }
                name: { $copy: name }
                unique: true
                columns: { $each: columns, $build: { column: { $copy: . } } }
                source: { $copy: source }
            # 入れ子のエンティティの親の ID（1 件・マップで持つときは一意の索引が兼ねる）
            - $each: "items[0].columns"
              $build:
                $when: [{ path: role, equals: parent }, { path: primaryKey, exists: false }, { of: tg, path: "items[0].parentIndexed", exists: false }]
                $then:
                  id: { $format: "IDX-ix_{t}_{name}", $with: { t: { $copy: "items[0].name", $of: tg } } }
                  name: { $format: "ix_{t}_{name}", $with: { t: { $copy: "items[0].name", $of: tg } } }
                  columns: [{ column: { $copy: id } }]
                  source: { $format: "FK-fk_{t}_{p}", $with: { t: { $copy: "items[0].name", $of: tg }, p: { $value: { extract: [{ of: tg, path: "items[0].parent" }, "^TBL-(.+)$"] } } } }
            # 参照のカラム（主キーの先頭のカラムは、主キーの索引で足りる）
            - $each: "items[0].columns"
              $build:
                $when:
                  - { path: referencesTable, exists: true }
                  - { or: [{ path: role, exists: false }, { path: role, notEquals: parent }] }
                  - { or: [{ path: primaryKey, exists: false }, { path: primaryKey, notEquals: 1 }] }
                $then:
                  id: { $format: "IDX-ix_{t}_{name}", $with: { t: { $copy: "items[0].name", $of: tg } } }
                  name: { $format: "ix_{t}_{name}", $with: { t: { $copy: "items[0].name", $of: tg } } }
                  columns: [{ column: { $copy: id } }]
                  source: { $format: "FK-fk_{t}_{name}", $with: { t: { $copy: "items[0].name", $of: tg } } }
        $by: { $copy: id }
        $build:
          seq: { $number: $position, $as: "00" }
          id: { $copy: "items[0].id" }
          name: { $copy: "items[0].name" }
          table: { $copy: "items[0].id", $of: tg }
          unique: { $copy: "items[0].unique" }
          columns: { $copy: "items[0].columns" }
          source: { $copy: "items[0].source" }
      # 外部キー: 入れ子で持つ親へ 1 つ（親のキーのカラムの組・親の行を消したら一緒に消す）と、参照のカラムごとに 1 つ。
      # どのカラムがどのカラムを指すかは、カラムの参照先に書く（外部キーには参照先のテーブルだけ）
      foreignKeys:
        $group:
          $concat:
            - $when: [{ path: "items[0].parent", exists: true }]
              $then:
                - id: { $format: "FK-fk_{t}_{p}", $with: { t: { $copy: "items[0].name" }, p: { $value: { extract: [{ path: "items[0].parent" }, "^TBL-(.+)$"] } } } }
                  name: { $format: "fk_{t}_{p}", $with: { t: { $copy: "items[0].name" }, p: { $value: { extract: [{ path: "items[0].parent" }, "^TBL-(.+)$"] } } } }
                  columns: { $each: "items[0].columns", $build: { $when: [{ path: role, equals: parent }], $then: { $copy: id } } }
                  referencesTable: { $copy: "items[0].parent" }
                  onDelete: cascade
            - $each: "items[0].columns"
              $build:
                $when: [{ path: referencesTable, exists: true }, { or: [{ path: role, exists: false }, { path: role, notEquals: parent }] }]
                $then:
                  id: { $format: "FK-fk_{t}_{name}", $with: { t: { $copy: "items[0].name", $of: tg } } }
                  name: { $format: "fk_{t}_{name}", $with: { t: { $copy: "items[0].name", $of: tg } } }
                  columns: [{ $copy: id }]
                  referencesTable: { $copy: referencesTable }
        $by: { $copy: id }
        $build:
          seq: { $number: $position, $as: "00" }
          id: { $copy: "items[0].id" }
          name: { $copy: "items[0].name" }
          columns: { $copy: "items[0].columns" }
          referencesTable: { $copy: "items[0].referencesTable" }
          onDelete: { $copy: "items[0].onDelete" }
rules:
  # いまの場所＝カラムのまとまり（{key, items}）。出力するキーだけを、決まった順に。主キーの順は、主キーのカラムを先頭に並べた位置
  - id: column
    build:
      seq: { $number: $position, $as: "00" }
      id: { $copy: "items[0].id" }
      name: { $copy: "items[0].name" }
      role: { $copy: "items[0].role" }
      label: { $copy: "items[0].label" }
      description: { $copy: "items[0].description" }
      source: { $copy: "items[0].source" }
      sqlType: { $copy: "items[0].sqlType" }
      notNull: { $copy: "items[0].notNull" }
      primaryKey: { $when: [{ path: "items[0].pk", equals: true }], $then: { $number: $position } }
      referencesTable: { $copy: "items[0].referencesTable" }
      referencesColumn: { $copy: "items[0].referencesColumn" }
  # いまの場所＝項目。テーブル（ctx）の中のカラム。配列・マップ・入れ子のエンティティは別のテーブルなので無い
  - id: cols
    with: [ctx]
    when: [{ or: [{ path: base, oneOf: [array, map] }, { path: entity, exists: true }] }]
    build: []
  # 埋め込みの object（名前の有無によらない）: 中の項目のカラムを、接頭辞（項目のキー_）を足して
  - id: cols
    with: [ctx]
    when: [{ path: base, equals: object }]
    build:
      $each: fields
      $flatten: true
      $apply: cols
      $with: { ctx: { $apply: embed-ctx, $with: { ctx: { $copy: ., $of: ctx } } } }
  # スカラー・参照: カラム 1 つ。埋め込みのカラムは日本語名を持つ（親の項目の名称＋の＋名称）。親の項目が必須でなければ、必須でも NOT NULL にしない
  - id: cols
    with: [ctx]
    build:
      - id: { $format: "COL-{t}.{c}", $with: { t: { $copy: table, $of: ctx }, c: { $apply: col-name, $with: { ctx: { $copy: ., $of: ctx } } } } }
        name: { $apply: col-name, $with: { ctx: { $copy: ., $of: ctx } } }
        label: { $when: [{ of: ctx, path: labelPrefix, exists: true }], $then: { $format: "{p}{l}", $with: { p: { $copy: labelPrefix, $of: ctx }, l: { $first: [{ $copy: label }, { $copy: key }] } } } }
        source: { $format: "FLD-{s}.{key}", $with: { s: { $copy: src, $of: ctx } } }
        sqlType: { $apply: sql-ref }
        notNull: { $when: [{ of: ctx, path: optional, equals: true }, { path: required, equals: true }], $then: false }
        referencesTable: { $when: [{ path: base, equals: ref }, { path: target, exists: true }], $then: { $format: "TBL-{r}", $with: { r: { $case: { $copy: target }, $as: snake } } } }
        referencesColumn: { $when: [{ path: base, equals: ref }, { path: target, exists: true }], $then: { $format: "COL-{r}.{c}", $with: { r: { $case: { $copy: target }, $as: snake }, c: { $apply: target-id-col, $with: { e: { $copy: target } } } } } }
  # 埋め込みの object の中の ctx: カラム名と日本語名の接頭辞を足し、導出元を中の項目の ID の部分に（名前付きの型なら型の ID）、親が必須でなければ optional
  - id: embed-ctx
    with: [ctx]
    build:
      table: { $copy: table, $of: ctx }
      label: { $copy: label, $of: ctx }
      keys: { $copy: keys, $of: ctx }
      prefix: { $first: [{ $format: "{p}{key}_", $with: { p: { $copy: prefix, $of: ctx } } }, { $format: "{key}_" }] }
      labelPrefix:
        $first:
          - { $format: "{p}{l}の", $with: { p: { $copy: labelPrefix, $of: ctx }, l: { $first: [{ $copy: label }, { $copy: key }] } } }
          - { $format: "{l}の", $with: { l: { $first: [{ $copy: label }, { $copy: key }] } } }
      src: { $first: [{ $when: [{ path: type, contains: "#" }], $then: { $apply: typ-key } }, { $format: "{s}.{key}", $with: { s: { $copy: src, $of: ctx } } }] }
      optional: { $first: [{ $when: [{ path: required, equals: true }], $then: { $copy: optional, $of: ctx } }, true] }
  # カラム名: 接頭辞＋項目のキー（SQL の予約語なら末尾に _）
  - id: col-name
    with: [ctx]
    build: { $apply: sql-name, $with: { name: { $first: [{ $format: "{p}{key}", $with: { p: { $copy: prefix, $of: ctx } } }, { $copy: key }] } } }
  # いまの場所＝項目。配列・マップの項目の明細テーブル（要素ごとの表。行の中の配列・マップは、その下の表）。埋め込みの object は中の項目へ
  - id: tables
    with: [ctx]
    when: [{ path: base, equals: array }]
    build: { $apply: detail-table, $at: item, $with: { ctx: { $copy: ., $of: ctx }, field: { $apply: field-info, $with: { ctx: { $copy: ., $of: ctx } } } } }
  - id: tables
    with: [ctx]
    when: [{ path: base, equals: map }]
    build: { $apply: detail-table, $at: value, $with: { ctx: { $copy: ., $of: ctx }, field: { $apply: field-info, $with: { ctx: { $copy: ., $of: ctx } } } } }
  - id: tables
    with: [ctx]
    when: [{ path: base, equals: object }, { path: entity, exists: false }]
    build:
      $each: fields
      $flatten: true
      $apply: tables
      $with: { ctx: { $apply: embed-ctx, $with: { ctx: { $copy: ., $of: ctx } } } }
  - id: tables
    with: [ctx]
    build: []
  # いまの場所＝配列・マップの項目。明細テーブルを作るのに要る、項目の事実（名前は接頭辞つき）
  - id: field-info
    with: [ctx]
    build:
      key: { $copy: key }
      name: { $first: [{ $format: "{p}{key}", $with: { p: { $copy: prefix, $of: ctx } } }, { $copy: key }] }
      labelName:
        $first:
          - { $format: "{p}{l}", $with: { p: { $copy: labelPrefix, $of: ctx }, l: { $first: [{ $copy: label }, { $copy: key }] } } }
          - { $first: [{ $copy: label }, { $copy: key }] }
      collection: { $copy: base }
      unique: { $copy: unique }
      source: { $format: "FLD-{s}.{key}", $with: { s: { $copy: src, $of: ctx } } }
      element: { $apply: sql-name, $with: { name: { $copy: key } } }
  # いまの場所＝配列・マップの要素。要素がエンティティならそのエンティティのテーブル、名前の無い配列・マップならテーブルにできない形（対応の検査が指摘する）
  - id: detail-table
    with: [ctx, field]
    when: [{ or: [{ path: entity, exists: true }, { path: base, oneOf: [array, map] }] }]
    build: []
  - id: detail-table
    with: [ctx, field]
    build:
      $concat:
        - - id: { $format: "TBL-{t}_{n}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
            name: { $format: "{t}_{n}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
            label: { $format: "{t}の{n}", $with: { t: { $copy: label, $of: ctx }, n: { $copy: labelName, $of: field } } }
            kind: detail
            source: { $copy: source, $of: field }
            parent: { $format: "TBL-{t}", $with: { t: { $copy: table, $of: ctx } } }
            # 配列の「同じものは 1 度だけ」: 親のキーと、要素（スカラー・参照）か比べる項目（object）の一意の索引
            uniques: { $apply: detail-uniques, $with: { ctx: { $copy: ., $of: ctx }, field: { $copy: ., $of: field } } }
            columns:
              $group:
                $concat:
                  # 親のキー（親のテーブルの主キーを指す。主キーの先頭）
                  - $each: keys
                    $of: ctx
                    $build:
                      id: { $format: "COL-{t}_{n}.{name}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
                      name: { $copy: name }
                      role: parent
                      label: { $copy: label }
                      description: { $copy: description }
                      sqlType: { $copy: sqlType }
                      notNull: true
                      pk: true
                      referencesTable: { $format: "TBL-{t}", $with: { t: { $copy: table, $of: ctx } } }
                      referencesColumn: { $copy: ref }
                  # 自分のキー（主キーの最後）: 配列は並び順・マップはキー
                  - - $when: [{ of: field, path: collection, equals: array }]
                      $then:
                        id: { $format: "COL-{t}_{n}.seq", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
                        name: seq
                        role: seq
                        label: 並び順
                        description: 業務モデルの配列の中の順（1 から）
                        sqlType: SQL-seq
                        notNull: true
                        pk: true
                    - $when: [{ of: field, path: collection, equals: map }]
                      $then:
                        id: { $format: "COL-{t}_{n}.{n}_key", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
                        name: { $format: "{n}_key", $with: { n: { $copy: name, $of: field } } }
                        role: key
                        label: { $format: "{n}のキー", $with: { n: { $copy: labelName, $of: field } } }
                        description: 業務モデルのマップのキー
                        sqlType: SQL-key
                        notNull: true
                        pk: true
                  # 要素: 参照なら参照先の ID・スカラーなら値・object なら行の項目のカラム（埋め込みは中の項目ごと）
                  - $apply: elem-cols
                    $with: { ctx: { $apply: row-ctx, $with: { ctx: { $copy: ., $of: ctx }, field: { $copy: ., $of: field } } }, field: { $copy: ., $of: field } }
              $by: { $copy: id }
              $apply: column
        # 行の中の配列・マップ: その下の明細テーブル（親のキーは、この表の主キー）
        - $when: [{ path: base, equals: object }]
          $then:
            $each: fields
            $flatten: true
            $apply: tables
            $with: { ctx: { $apply: row-ctx, $with: { ctx: { $copy: ., $of: ctx }, field: { $copy: ., $of: field } } } }
  # いまの場所＝要素。明細テーブルの中の ctx（この表の名前・導出元・この表の主キー → 子が持つ親のキー）
  - id: row-ctx
    with: [ctx, field]
    build:
      table: { $format: "{t}_{n}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
      label: { $format: "{t}の{n}", $with: { t: { $copy: label, $of: ctx }, n: { $copy: labelName, $of: field } } }
      src: { $first: [{ $when: [{ path: type, contains: "#" }], $then: { $apply: typ-key } }, { $value: { extract: [{ of: field, path: source }, "^FLD-(.+)$"] } }] }
      optional: false
      keys:
        $concat:
          - $each: keys
            $of: ctx
            $build:
              name: { $copy: name }
              ref: { $format: "COL-{t}_{n}.{c}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field }, c: { $copy: name } } }
              sqlType: { $copy: sqlType }
              label: { $copy: label }
              description: { $copy: description }
          - - $when: [{ of: field, path: collection, equals: array }]
              $then:
                name: { $format: "{n}_seq", $with: { n: { $copy: name, $of: field } } }
                ref: { $format: "COL-{t}_{n}.seq", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
                sqlType: SQL-seq
                label: { $format: "{n}の並び順", $with: { n: { $copy: labelName, $of: field } } }
                description: 親の明細テーブルの行の並び順（親のテーブルの主キーを指す）
            - $when: [{ of: field, path: collection, equals: map }]
              $then:
                name: { $format: "{n}_key", $with: { n: { $copy: name, $of: field } } }
                ref: { $format: "COL-{t}_{n}.{n}_key", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
                sqlType: SQL-key
                label: { $format: "{n}のキー", $with: { n: { $copy: labelName, $of: field } } }
                description: 親の明細テーブルの行のキー（親のテーブルの主キーを指す）
  # いまの場所＝要素。要素のカラム（ctx はこの表）
  - id: elem-cols
    with: [ctx, field]
    when: [{ path: base, equals: object }]
    build: { $each: fields, $flatten: true, $apply: cols, $with: { ctx: { $copy: ., $of: ctx } } }
  - id: elem-cols
    with: [ctx, field]
    when: [{ path: base, equals: ref }]
    build:
      - id: { $format: "COL-{t}.{r}_id", $with: { t: { $copy: table, $of: ctx }, r: { $case: { $copy: target }, $as: snake } } }
        name: { $format: "{r}_id", $with: { r: { $case: { $copy: target }, $as: snake } } }
        role: element
        source: { $copy: source, $of: field }
        sqlType: { $apply: sql-ref }
        notNull: true
        referencesTable: { $format: "TBL-{r}", $with: { r: { $case: { $copy: target }, $as: snake } } }
        referencesColumn: { $format: "COL-{r}.{c}", $with: { r: { $case: { $copy: target }, $as: snake }, c: { $apply: target-id-col, $with: { e: { $copy: target } } } } }
  - id: elem-cols
    with: [ctx, field]
    build:
      - id: { $format: "COL-{t}.{c}", $with: { t: { $copy: table, $of: ctx }, c: { $copy: element, $of: field } } }
        name: { $copy: element, $of: field }
        role: element
        source: { $copy: source, $of: field }
        sqlType: { $apply: sql-ref }
        notNull: true
  # いまの場所＝要素。配列の「同じものは 1 度だけ」の一意の索引の材料（親のキーと、要素か比べる項目）
  - id: detail-uniques
    with: [ctx, field]
    when: [{ of: field, path: unique, equals: true }, { path: base, notEquals: object }]
    build:
      - name: { $format: "ux_{t}_{n}_{c}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field }, c: { $apply: elem-col-name, $with: { field: { $copy: ., $of: field } } } } }
        columns:
          $concat:
            - $each: keys
              $of: ctx
              $build: { $format: "COL-{t}_{n}.{name}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
            - [{ $format: "COL-{t}_{n}.{c}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field }, c: { $apply: elem-col-name, $with: { field: { $copy: ., $of: field } } } } }]
        source: { $copy: source, $of: field }
  - id: detail-uniques
    with: [ctx, field]
    when: [{ of: field, path: unique, exists: true }, { path: base, equals: object }]
    build:
      - name: { $format: "ux_{t}_{n}_{c}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field }, c: { $first: [{ $copy: "unique[0]", $of: field }, { $copy: unique, $of: field }] } } }
        columns:
          $concat:
            - $each: keys
              $of: ctx
              $build: { $format: "COL-{t}_{n}.{name}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field } } }
            - $first:
                - $each: unique
                  $of: field
                  $build: { $format: "COL-{t}_{n}.{c}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field }, c: { $apply: sql-name, $with: { name: { $copy: . } } } } }
                - [{ $format: "COL-{t}_{n}.{c}", $with: { t: { $copy: table, $of: ctx }, n: { $copy: name, $of: field }, c: { $apply: sql-name, $with: { name: { $copy: unique, $of: field } } } } }]
        source: { $copy: source, $of: field }
  - id: detail-uniques
    with: [ctx, field]
    build: []
  # いまの場所＝要素。要素のカラム名（参照なら 参照先_id・スカラーなら項目のキー）
  - id: elem-col-name
    with: [field]
    when: [{ path: base, equals: ref }]
    build: { $format: "{r}_id", $with: { r: { $case: { $copy: target }, $as: snake } } }
  - id: elem-col-name
    with: [field]
    build: { $copy: element, $of: field }
  # 入れ子のエンティティを持つ親の項目の基底の種類（array・map・object）。o は owner（{entity, field}）
  - id: owner-base
    with: [o]
    build:
      $format: "{b[0]}"
      $with:
        b:
          $each: entities
          $of: model
          $flatten: true
          $build:
            $when: [{ path: id, equals: { $copy: entity, $of: o } }]
            $then:
              $each: aspects
              $flatten: true
              $build:
                $each: fields
                $flatten: true
                $build: { $when: [{ path: key, equals: { $copy: field, $of: o } }], $then: [{ $copy: base }] }
  # 入れ子のエンティティの、親の中の位置（配列なら並び順・マップならキー。1 件なら無い）。t はこの表の名前
  - id: owner-key
    with: [o, b, t]
    when: [{ of: b, path: ., equals: array }]
    build:
      - id: { $format: "COL-{t}.seq", $with: { t: { $copy: ., $of: t } } }
        name: seq
        role: seq
        label: 並び順
        description: 業務モデルの配列の中の順（1 から）
        sqlType: SQL-seq
        notNull: true
  - id: owner-key
    with: [o, b, t]
    when: [{ of: b, path: ., equals: map }]
    build:
      - id: { $format: "COL-{t}.{f}_key", $with: { t: { $copy: ., $of: t }, f: { $copy: field, $of: o } } }
        name: { $format: "{f}_key", $with: { f: { $copy: field, $of: o } } }
        role: key
        label: キー
        description: 業務モデルのマップのキー
        sqlType: SQL-key
        notNull: true
  - id: owner-key
    with: [o, b, t]
    build: []
  # 入れ子のエンティティを 1 件・マップで持つとき、親の ID（とマップのキー）は重ならない
  - id: owner-uniques
    with: [o, b, t]
    when: [{ of: b, path: ., equals: map }]
    build:
      - name: { $format: "ux_{t}_{p}_id", $with: { t: { $copy: ., $of: t }, p: { $case: { $copy: entity, $of: o }, $as: snake } } }
        columns:
          - { $format: "COL-{t}.{p}_id", $with: { t: { $copy: ., $of: t }, p: { $case: { $copy: entity, $of: o }, $as: snake } } }
          - { $format: "COL-{t}.{f}_key", $with: { t: { $copy: ., $of: t }, f: { $copy: field, $of: o } } }
        source: { $format: "FLD-{e}.{f}", $with: { e: { $copy: entity, $of: o }, f: { $copy: field, $of: o } } }
  - id: owner-uniques
    with: [o, b, t]
    when: [{ of: b, path: ., equals: object }]
    build:
      - name: { $format: "ux_{t}_{p}_id", $with: { t: { $copy: ., $of: t }, p: { $case: { $copy: entity, $of: o }, $as: snake } } }
        columns: [{ $format: "COL-{t}.{p}_id", $with: { t: { $copy: ., $of: t }, p: { $case: { $copy: entity, $of: o }, $as: snake } } }]
        source: { $format: "FLD-{e}.{f}", $with: { e: { $copy: entity, $of: o }, f: { $copy: field, $of: o } } }
  - id: owner-uniques
    with: [o, b, t]
    build: []
  # 親の ID の索引を、一意の索引が兼ねるか（1 件・マップで持つとき）
  - id: owner-indexed
    with: [b]
    when: [{ of: b, path: ., oneOf: [map, object] }]
    build: true
  # 参照先のエンティティ型（e）の ID の項目のカラム名
  - id: target-id-col
    with: [e]
    build:
      $format: "{c[0]}"
      $with:
        c:
          $each: entities
          $of: model
          $flatten: true
          $build:
            $when: [{ path: id, equals: { $copy: ., $of: e } }]
            $then:
              $each: aspects
              $flatten: true
              $build:
                $each: fields
                $flatten: true
                $build: { $when: [{ path: base, equals: id }], $then: [{ $apply: sql-name, $with: { name: { $copy: key } } }] }
  # いまの場所＝エンティティ型。ID の項目の SQL の型の対応（親の ID の列に使う。側面ごとに出るので、呼ぶ側が先頭を使う）
  - id: id-sql-refs
    build:
      $each: aspects
      $flatten: true
      $build:
        $each: fields
        $build: { $when: [{ path: base, equals: id }], $then: { $apply: sql-ref } }
  # 論理型の名前の ID の部分（いまの場所は type を持つもの）: common#一行の文 → common.一行の文、組込みの text → text
  - id: typ-key
    build:
      $first:
        - $format: "{m}.{n}"
          $with: { m: { $value: { extract: [{ path: type }, "^([^#]+)#"] } }, n: { $value: { extract: [{ path: type }, "#(.+)$"] } } }
        - { $copy: type }
  # SQL の型の対応への参照（いまの場所は type を持つ項目）: 型対応表の SQL-論理型
  - id: sql-ref
    build: { $format: "SQL-{k}", $with: { k: { $apply: typ-key } } }
  # SQL の名前（name）: SQL の予約語（H2 2.x の一覧）に当たれば末尾に _ を付ける（項目ごとの付け替えは補正一覧（詳細設計））
  - id: sql-name
    with: [name]
    build:
      $map: { $copy: ., $of: name }
      $using:
        all: all_
        and: and_
        any: any_
        array: array_
        as: as_
        asymmetric: asymmetric_
        authorization: authorization_
        between: between_
        both: both_
        case: case_
        cast: cast_
        check: check_
        constraint: constraint_
        cross: cross_
        current_catalog: current_catalog_
        current_date: current_date_
        current_path: current_path_
        current_role: current_role_
        current_schema: current_schema_
        current_time: current_time_
        current_timestamp: current_timestamp_
        current_user: current_user_
        day: day_
        default: default_
        distinct: distinct_
        else: else_
        end: end_
        except: except_
        exists: exists_
        "false": false_
        fetch: fetch_
        for: for_
        foreign: foreign_
        from: from_
        full: full_
        group: group_
        groups: groups_
        having: having_
        hour: hour_
        if: if_
        ilike: ilike_
        in: in_
        inner: inner_
        intersect: intersect_
        interval: interval_
        is: is_
        join: join_
        key: key_
        leading: leading_
        left: left_
        like: like_
        limit: limit_
        localtime: localtime_
        localtimestamp: localtimestamp_
        minus: minus_
        minute: minute_
        month: month_
        natural: natural_
        not: not_
        "null": null_
        offset: offset_
        "on": on_
        or: or_
        order: order_
        over: over_
        partition: partition_
        primary: primary_
        qualify: qualify_
        range: range_
        regexp: regexp_
        right: right_
        row: row_
        rownum: rownum_
        rows: rows_
        second: second_
        select: select_
        session_user: session_user_
        set: set_
        some: some_
        symmetric: symmetric_
        system_user: system_user_
        table: table_
        to: to_
        top: top_
        trailing: trailing_
        "true": true_
        uescape: uescape_
        union: union_
        unique: unique_
        unknown: unknown_
        user: user_
        using: using_
        value: value_
        values: values_
        when: when_
        where: where_
        window: window_
        with: with_
        year: year_
