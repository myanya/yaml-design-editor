id: dashboard-flows-derived
name: 画面遷移設計（一覧画面の Controller）
description: 詳細設計。ダッシュボードごとに、一覧画面の Controller を 1 つ作る。絞り込み（ダッシュボードの共有の入力）と、集計のセルから来たときの 行と列の絞り込みは URL のパラメータで受け取る（タブごとに独立。セッションには置かない）。完了の知らせ（flash）を読む
scope: business
each: dashboards
output: design/system/derived/dashboard-flows/{id}.yaml
dependsOn:
  - system-actions-model
  - system-access-bindings
  - system-session-bindings
  - screen-lists
  - screen-designs-lists
  - error-handling
  - system-input-gate
  - system-screen-bindings
input:
  $apply: model-input
  $with:
    row:
      $view: system-actions-model-input
      $one: true
build:
  id:
    $format: DRV-document-dashboard-flows.{id}
  record:
    id:
      $format: DOC-dashboard-flows.{id}
    value:
      $apply: linked-document
      $with:
        document:
          id:
            $copy: id
          name:
            $format: '{label}の画面の動き'
          controller:
            $format: '{name}Controller'
            $with:
              name:
                $case:
                  $copy: id
                $as: pascal
          screens:
            - screen:
                $copy: id
              handler: show
              request:
                $first:
                  - $when:
                      - path: default
                        equals: true
                    $then: GET /
                  - $format: GET /{id}
              params:
                $concat:
                  - $each: inputs
                    $build:
                      key:
                        $copy: key
                      label:
                        $copy: label
                      multiple:
                        $copy: multiple
                  - $each: sections
                    $bind: sec
                    $flatten: true
                    $build:
                      $each: views
                      $of: model
                      $build:
                        $when:
                          - path: id
                            equals:
                              $copy: view
                              $of: sec
                          - path: kind
                            equals: matrix
                        key:
                          $format: '{s}.cell'
                          $with:
                            s:
                              $copy: id
                              $of: sec
                        label:
                          $format: 区画「{l}」のセル（行と列）
                          $with:
                            l:
                              $copy: label
                              $of: sec
              does: 絞り込みで区画の一覧と集計を読んで、一覧画面を出す
              service:
                $format: '{n}Service.show'
                $with:
                  'n':
                    $case:
                      $copy: id
                    $as: pascal
              reads:
                $each: sections
                $bind: sec
                $flatten: true
                $build:
                  $each: views
                  $of: model
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: view
                          $of: sec
                      - path: rows
                        exists: true
                    section:
                      $copy: id
                      $of: sec
                    select:
                      $format: '{m}Mapper.select{d}{s}'
                      $with:
                        m:
                          $case:
                            $copy: rows
                          $as: pascal
                        d:
                          $case:
                            $copy: id
                            $of: element
                          $as: pascal
                        s:
                          $case:
                            $copy: id
                            $of: sec
                          $as: pascal
                    count:
                      $format: '{m}Mapper.count{d}{s}'
                      $with:
                        m:
                          $case:
                            $copy: rows
                          $as: pascal
                        d:
                          $case:
                            $copy: id
                            $of: element
                          $as: pascal
                        s:
                          $case:
                            $copy: id
                            $of: sec
                          $as: pascal
              candidates:
                $each: inputs
                $build:
                  $when:
                    - path: field.target
                      exists: true
                  $then:
                    $format: '{n}Mapper.selectAll'
                    $with:
                      'n':
                        $case:
                          $copy: field.target
                        $as: pascal
              session:
                reads:
                  - notice
        bindings:
          $concat:
            - $each:
                $view: system-access-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
            - $each:
                $view: system-session-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
            - $each:
                $view: system-screen-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
        messages: []
    source:
      id: rule-dashboard-flows
      document: .yde/transforms/design/dashboard-flows-derived.yaml
rules:
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
