id: screen-styles-derived
name: 画面のクラスと CSS の対応表
description: 画面部品に対応するクラスと CSS 宣言の既定値。見た目の値は確定したデザイン台帳の CSS 変数を参照する。個別の宣言は詳細設計の補正・追加を通す。
scope: business
output: design/detail/derived/documents/screen-styles/screen-styles.yaml
dependsOn:
  - system-actions-model
  - detail-document-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-actions-model-input
      $one: true
build:
  id:
    $format: DRV-document-screen-styles.screen-styles
  record:
    id:
      $format: DOC-screen-styles.screen-styles
    value:
      id: screen-styles
      name: 画面のクラスと CSS の対応表
      naming:
        - part: 部品
          rule: 部品の名前をそのままクラスにする（page・notice・filters・section・facts・table・form・field・choices・rows・actions・matrix）
        - part: width（画面）
          rule: w-{s|m|l}
        - part: width（欄）
          rule: w-{n}ch（欄の最大幅。狭い画面では画面幅に収める）
        - part: columns
          rule: cols-{n}
        - part: emphasis
          rule: button-{primary|secondary}
        - part: align
          rule: align-end
        - part: gap
          rule: gap-{s|m|l}
        - part: notice の種類
          rule: notice-{done|errors|refusal}
        - part: field の部品
          rule: control-{text|textarea|date|select|checkbox|number}
      classes:
        - class: page
          applies: 'margin: 0 auto; padding: var(--space-large) var(--space-medium); display: grid; gap: var(--space-large)'
        - class: w-s
          applies: 'max-width: var(--width-small)'
        - class: w-m
          applies: 'max-width: var(--width-medium)'
        - class: w-l
          applies: 'max-width: var(--width-large)'
        - class: notice-done
          applies: 'border-left: 3px solid var(--success); color: var(--success); padding: var(--space-medium); background: var(--surface)'
        - class: notice-errors
          applies: 'border-left: 3px solid var(--danger); color: var(--danger); padding: var(--space-medium); background: var(--surface)'
        - class: notice-refusal
          applies: 'border-left: 3px solid var(--warning); color: var(--warning); padding: var(--space-medium); background: var(--surface)'
        - class: section
          applies: >-
            display: grid; gap: var(--space-medium); padding: var(--space-medium); background: var(--surface); border: 1px solid
            var(--line); border-radius: var(--radius)
        - class: filters
          applies: >-
            display: flex; flex-wrap: wrap; align-items: end; gap: var(--space-medium); padding: var(--space-medium); border: 1px solid
            var(--line); background: var(--surface)
        - class: facts
          applies: 'display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-small) var(--space-medium)'
        - class: cols-2
          applies: 'grid-template-columns: repeat(2, max-content minmax(0, 1fr))'
        - class: table
          applies: 'width: 100%; border-collapse: collapse; text-align: left'
        - class: matrix
          applies: 'width: 100%; border-collapse: collapse; text-align: left'
        - class: form
          applies: 'display: grid; gap: var(--space-medium)'
        - class: field
          applies: 'display: flex; flex-direction: column; gap: var(--space-small)'
        - class: choices
          applies: 'display: flex; flex-wrap: wrap; gap: var(--space-medium)'
        - class: rows
          applies: 'width: 100%; border-collapse: collapse; text-align: left'
        - class: control-text
          applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
        - class: control-textarea
          applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
        - class: control-date
          applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
        - class: control-select
          applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius)'
        - class: control-number
          applies: 'color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); text-align: right'
        - class: control-checkbox
          applies: 'accent-color: var(--primary); width: 1.25rem; height: 1.25rem'
        - class: actions
          applies: 'display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-small)'
        - class: button-primary
          applies: 'background: var(--primary); color: var(--ink); border: 1px solid var(--primary); font-weight: 700'
        - class: button-secondary
          applies: 'background: var(--surface); color: var(--text); border: 1px solid var(--line)'
        - class: align-end
          applies: 'text-align: right'
        - class: gap-s
          applies: 'gap: var(--space-small)'
        - class: gap-m
          applies: 'gap: var(--space-medium)'
        - class: gap-l
          applies: 'gap: var(--space-large)'
    source:
      id: rule-screen-styles
      document: .yde/transforms/design/detail/screen-styles-derived.yaml
rules:
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
