id: application-process-gate
name: 処理設計の機械的な指定と Mapper の呼び先を照合する
scope: design
dependsOn:
  - detail-processes
  - application-access
  - basic-messages
output: design/detail/composed/application/process-contract.yaml
input:
  processes:
    $each:
      $view: detail-model-processes
    $build:
      $apply: process
      $with:
        source:
          $apply: process-document
          $at: values.record
  contracts:
    $each: schemas
    $of: model
    $build:
      $when:
        - path: id
          equals: application-process-contract
      $then:
        $copy: declared
build:
  $apply: validated
  $with:
    documents:
      $validate:
        schemas:
          $copy: contracts
        documents:
          design/detail/composed/application/process-contract.yaml:
            id: SYS-application-process-check
            processes:
              $copy: processes
rules:
  # ---- 処理の手順のレコード（PRC-・STP-）を読む入力アダプタ。ID で参照している先（Mapper のメソッド・メッセージ・状態の定数）を解決して、
  #      下のルールが読む形にする。同じアダプタが、処理の手順を読む変換定義それぞれにある（ルールを定義の間で共有できないため。UX-384）
  - id: process-document
    build:
      id:
        $copy: operation
      name:
        $copy: label
      service:
        $copy: service
      confirm:
        $each: confirm
        $build:
          method:
            $copy: method
          arguments:
            $copy: arguments
          does:
            $copy: does
          constraints:
            $each: constraints
            $build:
              constraint:
                $value:
                  extract:
                    - path: constraint
                    - ^RUL-(.*)$
              field:
                $copy: field
              message:
                $apply: process-message-key
                $with:
                  ref:
                    $copy: message
      transaction:
        $copy: transaction
      steps:
        $each: steps
        $bind: processStep
        $build:
          $apply: process-calls
          $with:
            node:
              $entries:
                $eachEntry: .
                $flatten: true
                $build:
                  $apply: process-step-entry
                  $with:
                    step:
                      $copy: .
                      $of: processStep
      subject:
        $copy: subject
      originalService:
        class:
          $format: '{name}Service'
          $with:
            name:
              $case:
                $copy: subject
              $as: pascal
        method:
          $case:
            $copy: operation
          $as: camel
        arguments:
          $copy: service.arguments
      transactionMode:
        $copy: transactionMode
      inputs:
        $copy: inputs
      designId:
        $copy: id
      designKind: processes
      designPath:
        $format: design/detail/final/processes/{operation}.yaml
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: id
    build: []
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: message
      - or:
          - of: step
            path: precondition
            exists: true
          - of: step
            path: error
            exists: true
    build:
      - key: message
        value:
          $apply: process-message-key
          $with:
            ref:
              $copy: .
      - key: text
        value:
          $apply: process-message-text
          $with:
            ref:
              $copy: .
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: message
    build:
      - key: message
        value:
          $apply: process-message-key
          $with:
            ref:
              $copy: .
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: precondition
    build:
      - key: precondition
        value:
          $value:
            extract:
              - path: .
              - ^PRE-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: error
    build:
      - key: precondition
        value:
          $value:
            extract:
              - path: .
              - ^ERR-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: constraint
    build:
      - key: constraint
        value:
          $value:
            extract:
              - path: .
              - ^RUL-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: entity
    build:
      - key: entity
        value:
          $value:
            extract:
              - path: .
              - ^ENT-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: allowed
    build:
      - key: allowed
        value:
          $each: .
          $build:
            $apply: process-constant-name
            $with:
              ref:
                $copy: .
  - id: process-step-entry
    with:
      - step
    build:
      - key: $key
        value:
          $copy: .
  - id: process-message-key
    with:
      - ref
    build:
      $apply: process-pick-key
      $with:
        row:
          $view: basic-model-messages
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: process-pick-key
    with:
      - row
    build:
      $copy: values.record.key
      $of: row
  - id: process-message-text
    with:
      - ref
    build:
      $apply: process-pick-text
      $with:
        row:
          $view: basic-model-messages
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: process-pick-text
    with:
      - row
    build:
      $copy: values.record.text
      $of: row
  - id: process-constant-name
    with:
      - ref
    build:
      $apply: process-pick-constant
      $with:
        row:
          $view: detail-model-status-constants
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: process-pick-constant
    with:
      - row
    build:
      $copy: values.record.constant
      $of: row
  # 入れ子の中も歩いて、呼ぶメソッドの ID（call: MTH-）を、呼び名（Mapper 名.メソッド名）にする
  - id: process-calls
    with:
      - node
    build:
      $first:
        - $apply: process-calls-map
          $with:
            entries:
              $eachEntry: .
              $of: node
              $flatten: true
              $build:
                $first:
                  - $when:
                      - path: $key
                        equals: call
                    $then:
                      - key: $key
                        value:
                          $apply: process-call-name
                          $with:
                            ref:
                              $copy: .
                  - - key: $key
                      value:
                        $apply: process-calls
                        $with:
                          node:
                            $copy: .
        - $each: .
          $of: node
          $build:
            $apply: process-calls
            $with:
              node:
                $copy: .
        - $copy: .
          $of: node
  - id: process-calls-map
    with:
      - entries
    when:
      - of: entries
        path: .
        exists: true
    build:
      $entries:
        $copy: .
        $of: entries
  - id: process-call-name
    with:
      - ref
    build:
      $first:
        - $apply: process-pick-call
          $with:
            row:
              $view: detail-model-methods
              $where:
                - path: id
                  equals:
                    $copy: .
                    $of: ref
              $one: true
        - $copy: .
          $of: ref
  - id: process-pick-call
    with:
      - row
    build:
      $format: '{m}.{n}'
      $with:
        m:
          $copy: values.mapper
          $of: row
        'n':
          $copy: values.name
          $of: row
  # ---- 入力アダプタ ここまで ----
  - id: first
    with:
      - items
    build:
      $copy: '[0]'
      $of: items
  - id: validated
    with:
      - documents
    build:
      $apply: first
      $with:
        items:
          $eachEntry: .
          $of: documents
          $flatten: true
          $build:
            - $copy: .
  - id: process
    with:
      - source
    build:
      source:
        $copy: designId
        $of: source
      transactionMode:
        $copy: transactionMode
        $of: source
      checks:
        $each: steps
        $of: source
        $build:
          $when:
            - path: step
              equals: check
          $then:
            mode:
              $copy: checkMode
            entity:
              $copy: entity
            phase:
              $copy: phase
      calls:
        $each: steps
        $of: source
        $build:
          $concat:
            - $when:
                - path: call
                  exists: true
              $then:
                - $apply: call
                  $with:
                    name:
                      $copy: call
            - $when:
                - path: seq.call
                  exists: true
              $then:
                - $apply: call
                  $with:
                    name:
                      $copy: seq.call
            - $eachEntry: values
              $flatten: true
              $build:
                $when:
                  - path: sequence.call
                    exists: true
                $then:
                  - $apply: call
                    $with:
                      name:
                        $copy: sequence.call
        $flatten: true
  - id: call
    with:
      - name
    build:
      $apply: resolved
      $with:
        name:
          $copy: .
          $of: name
        row:
          $first:
            - $view: application-method-input
              $where:
                - path: values.record.call
                  equals:
                    $copy: .
                    $of: name
              $one: true
            - {}
  - id: resolved
    with:
      - name
      - row
    build:
      call:
        $copy: .
        $of: name
      method:
        $first:
          - $copy: values.record.id
            $of: row
          - ''
      resolved:
        $first:
          - $when:
              - of: row
                path: values.record.id
                exists: true
            $then: true
          - false
