id: application-runtime-model
name: 状態型と業務例外の生成値を確定する
scope: design
dependsOn:
  - detail-status
  - error-handling
output: design/detail/final/application-runtime-model.yaml
input:
  states:
    $each:
      $view: detail-model-status
    $build:
      $apply: state
      $with:
        source:
          $copy: values.record
        constants:
          $each: values.record.constants
          $build:
            $copy: id
  errors:
    $each:
      $view: error-handling-input
    $build:
      $each: values.record.exceptions
      $build:
        $when:
          - path: kind
            oneOf:
              - refused
              - notFound
        $then:
          id:
            $format: JERR-{kind}
            $with:
              kind:
                $copy: kind
          kind:
            $copy: kind
          name:
            $copy: class
          parent:
            $copy: extends
          refused:
            $when:
              - path: kind
                equals: refused
            $then: true
          notFound:
            $when:
              - path: kind
                equals: notFound
            $then: true
    $flatten: true
  contracts:
    $each: schemas
    $of: model
    $build:
      $when:
        - path: id
          equals: application-runtime-model
      $then:
        $copy: declared
build:
  $apply: validated
  $with:
    documents:
      $validate:
        schemas:
          $copy: contracts
        documents:
          design/detail/final/application-runtime-model.yaml:
            id: APP-runtime
            states:
              $copy: states
            errors:
              $copy: errors
rules:
  - id: first
    with:
      - items
    build:
      $copy: '[0]'
      $of: items
  - id: validated
    with:
      - documents
    build:
      $apply: first
      $with:
        items:
          $eachEntry: .
          $of: documents
          $flatten: true
          $build:
            - $copy: .
  # 状態型: 詳細設計の「状態の型」の項目 1 つから作る。項目が ID で指している定数（ENC-…）は、定数の名前に置き換える
  - id: state
    with:
      - source
      - constants
    build:
      id:
        $format: JSTATE-{lifecycle}
        $of: source
      source:
        $copy: id
        $of: source
      name:
        $copy: enum
        $of: source
      values:
        $each: constants
        $of: source
        $build:
          constant:
            $copy: constant
          label:
            $copy: label
          state:
            $copy: state
      groups:
        $first:
          - $each: groups
            $of: source
            $build:
              method:
                $copy: method
              label:
                $copy: label
              state:
                $copy: state
              values:
                $each: constants
                $build:
                  $apply: constant-name
                  $with:
                    ref:
                      $copy: .
                    constants:
                      $copy: constants
                      $of: source
          - []
      transitions:
        $first:
          - $each: transitions
            $of: source
            $build:
              action:
                $copy: action
              from:
                $each: from
                $build:
                  $apply: constant-name
                  $with:
                    ref:
                      $copy: .
                    constants:
                      $copy: constants
                      $of: source
              to:
                $apply: constant-name
                $with:
                  ref:
                    $copy: to
                  constants:
                    $copy: constants
                    $of: source
          - []
      entry:
        $first:
          - $each: entries
            $of: source
            $build:
              action:
                $copy: action
              to:
                $apply: constant-name
                $with:
                  ref:
                    $copy: to
                  constants:
                    $copy: constants
                    $of: source
          - []
      terminal:
        $first:
          - $each: terminal
            $of: source
            $build:
              $apply: constant-name
              $with:
                ref:
                  $copy: .
                constants:
                  $copy: constants
                  $of: source
          - []
      # 定数に無い ID を指している所（あれば、スキーマの検査で止まる）
      invalidReferences:
        $concat:
          - $each: transitions
            $of: source
            $build:
              $concat:
                - $each: from
                  $build:
                    $when:
                      - not:
                          path: .
                          of: constants
                          includes:
                            $copy: .
                    $then:
                      $copy: .
                - $when:
                    - not:
                        path: .
                        of: constants
                        includes:
                          $copy: to
                  $then:
                    - $copy: to
            $flatten: true
          - $each: entries
            $of: source
            $build:
              $when:
                - not:
                    path: .
                    of: constants
                    includes:
                      $copy: to
              $then:
                $copy: to
          - $each: terminal
            $of: source
            $build:
              $when:
                - not:
                    path: .
                    of: constants
                    includes:
                      $copy: .
              $then:
                $copy: .
          - $each: groups
            $of: source
            $build:
              $each: constants
              $build:
                $when:
                  - not:
                      path: .
                      of: constants
                      includes:
                        $copy: .
                $then:
                  $copy: .
            $flatten: true
      transitionPairs:
        $each: transitions
        $of: source
        $build:
          $each: from
          $build:
            action:
              $copy: action
              $of: transition
            state:
              $apply: constant-name
              $with:
                ref:
                  $copy: .
                constants:
                  $copy: constants
                  $of: source
        $bind: transition
        $flatten: true
      entity:
        $copy: subject
        $of: source
      stateFields:
        $copy: stateFields
        $of: source
  # 定数の ID（ENC-…）から、定数の名前を引く
  - id: constant-name
    with:
      - ref
      - constants
    build:
      $apply: first
      $with:
        items:
          $each: .
          $of: constants
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $copy: constant
