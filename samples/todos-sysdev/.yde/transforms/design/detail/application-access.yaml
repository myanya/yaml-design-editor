            $when:
              - of: data
                path: operator
                oneOf:
                  - equals
                  - notEquals
                  - lt
                  - lte
                  - gt
                  - gte
            $then: true
          symbol:
            $map:
              $copy: operator
              $of: data
            $using:
              equals: '='
              notEquals: <>
              lt: <
              lte: <=
              gt: '>'
              gte: '>='
