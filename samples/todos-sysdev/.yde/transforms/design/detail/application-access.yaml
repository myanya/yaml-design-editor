                value:
                  $copy: .
                type:
                  $copy: type
                  $of: data
                literal: true
                quoted:
                  $when:
                    - of: data
                      path: type
                      oneOf:
                        - java.lang.String
                        - java.time.LocalDate
                  $then: true
                plain:
                  $when:
                    - not:
                        of: data
                        path: type
                        oneOf:
                          - java.lang.String
                          - java.time.LocalDate
                  $then: true
          quoted:
            $when:
              - of: data
                path: type
                oneOf:
                  - java.lang.String
                  - java.time.LocalDate
            $then: true
          plain:
            $when:
              - not:
                  of: data
                  path: type
                  oneOf:
                    - java.lang.String
                    - java.time.LocalDate
            $then: true
          optionalTest:
            $first:
              - $when:
                  - path: collection
                    equals: true
                    of: data
                $then:
                  $format: input.{p} != null and !input.{p}.isEmpty()
                  $with:
                    p:
                      $copy: param
                      $of: data
              - $when:
                  - path: type
                    equals: java.lang.String
                    of: data
                $then:
                  $format: input.{p} != null and input.{p} != ''
                  $with:
                    p:
                      $copy: param
                      $of: data
              - $format: input.{p} != null
                $with:
                  p:
                    $copy: param
                    $of: data
