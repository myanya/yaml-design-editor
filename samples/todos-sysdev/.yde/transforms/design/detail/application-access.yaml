id: application-access
name: 確定したテーブルアクセスから Mapper の受け渡しと SQL を確定する
scope: design
dependsOn:
  - detail-table-access
  - application-data-model
output: design/detail/final/application-access.yaml
input:
  mappers:
    $each:
      $view: detail-model-table-access
    $build:
      $apply: mapper
      $with:
        document:
          $apply: access-document
          $at: values.record
  contracts:
    $each: schemas
    $of: model
    $build:
      $when:
        - path: id
          equals: application-access
      $then:
        $copy: declared
build:
  $apply: validated
  $with:
    documents:
      $validate:
        schemas:
          $copy: contracts
        documents:
          design/detail/final/application-access.yaml:
            id: APP-access
            mappers:
              $copy: mappers
rules:
  # テーブルへの読み書きの項目（ACC-・MTH-）を、下の規則が読む形に入口で 1 度だけ組む。
  # 項目は、テーブルとカラムを ID で指している。名前は、同じ詳細設計のテーブルの項目から ID で引く
  - id: access-document
    build:
      id:
        $copy: entity
      name:
        $copy: label
      mapper:
        $copy: mapper
      tables:
        $each: tables
        $build:
          $apply: access-table-name
          $with:
            ref:
              $copy: .
      methods:
        $each: methods
        $build:
          $apply: access-method
          $with:
            method:
              $copy: .
            table:
              $apply: access-table
              $with:
                ref:
                  $copy: table
      designId:
        $copy: id
  - id: access-table
    with:
      - ref
    build:
      $apply: record
      $with:
        row:
          $view: application-physical-table-input
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: access-table-name
    with:
      - ref
    build:
      $apply: access-name
      $with:
        table:
          $apply: access-table
          $with:
            ref:
              $copy: .
              $of: ref
        fallback:
          $copy: .
          $of: ref
  - id: access-name
    with:
      - table
      - fallback
    build:
      $first:
        - $copy: name
          $of: table
        - $copy: .
          $of: fallback
  - id: access-column-name
    with:
      - ref
    build:
      $apply: access-column-record
      $with:
        row:
          $view: application-columns-input
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: access-column-record
    with:
      - row
    build:
      $copy: values.record.name
      $of: row
  - id: access-method
    with:
      - method
      - table
    build:
      $entries:
        $concat:
          - $apply: access-entries
            $with:
              node:
                $copy: .
                $of: method
              top: true
          - - key: columnBindings
              value:
                $each: columns
                $of: table
                $build:
                  columnId:
                    $copy: id
                  item:
                    $copy: item
                  name:
                    $copy: name
                  source:
                    $copy: source
            - key: methodId
              value:
                $value:
                  extract:
                    - path: id
                    - ^MTH-[^.]+\.(.*)$
            - key: tableId
              value:
                $copy: id
                $of: table
  # 入れ子の中も同じ決まりで歩く: table・counts・via は名前に、column は ID と名前の 2 つに
  - id: access-walk
    with:
      - node
    build:
      $first:
        - $apply: access-map
          $with:
            entries:
              $apply: access-entries
              $with:
                node:
                  $copy: .
                  $of: node
                top: false
        - $each: .
          $of: node
          $build:
            $apply: access-walk
            $with:
              node:
                $copy: .
        - $copy: .
          $of: node
  - id: access-map
    with:
      - entries
    when:
      - of: entries
        path: .
        exists: true
    build:
      $entries:
        $copy: .
        $of: entries
  - id: access-entries
    with:
      - node
      - top
    build:
      $eachEntry: .
      $of: node
      $flatten: true
      $build:
        $first:
          - $when:
              - of: top
                path: .
                equals: true
              - path: $key
                oneOf:
                  - id
                  - sources
            $then: []
          - $when:
              - path: $key
                oneOf:
                  - table
                  - counts
                  - via
            $then:
              - key: $key
                value:
                  $apply: access-table-name
                  $with:
                    ref:
                      $copy: .
          - $when:
              - path: $key
                equals: column
            $then:
              - key: columnId
                value:
                  $copy: .
              - key: column
                value:
                  $apply: access-column-name
                  $with:
                    ref:
                      $copy: .
          - $when:
              - of: top
                path: .
                equals: true
              - path: $key
                equals: precondition
            $then:
              - key: $key
                value:
                  $value:
                    extract:
                      - path: .
                      - ^PRE-(.*)$
          - $when:
              - of: top
                path: .
                equals: true
              - path: $key
                equals: whereFrom
            $then:
              - key: $key
                value:
                  $value:
                    extract:
                      - path: .
                      - ^MTH-[^.]+\.(.*)$
          - $when:
              - of: top
                path: .
                equals: true
              - path: $key
                equals: constraint
            $then:
              - key: $key
                value:
                  $value:
                    extract:
                      - path: .
                      - ^RUL-(.*)$
          - - key: $key
              value:
                $apply: access-walk
                $with:
                  node:
                    $copy: .
  - id: first
    with:
      - items
    build:
      $copy: '[0]'
      $of: items
  - id: record
    with:
      - row
    build:
      $copy: values.record
      $of: row
  - id: table
    with:
      - name
    build:
      $first:
        - $apply: record
          $with:
            row:
              $view: application-physical-table-input
              $where:
                - path: values.record.name
                  equals:
                    $copy: .
                    $of: name
              $one: true
        - $apply: record
          $with:
            row:
              $view: application-physical-table-input
              $where:
                - path: values.record.originalName
                  equals:
                    $copy: .
                    $of: name
              $one: true
  - id: row-model
    with:
      - table
    build:
      $apply: record
      $with:
        row:
          $view: application-row-model-input
          $where:
            - path: values.record.table
              equals:
                $copy: .
                $of: table
          $one: true
  - id: column
    with:
      - table
      - item
      - columnId
    build:
      $apply: column-result
      $with:
        physical:
          $first:
            - $apply: record
              $with:
                row:
                  $view: application-physical-column-input
                  $where:
                    - path: id
                      equals:
                        $copy: .
                        $of: columnId
                  $one: true
            - $apply: first
              $with:
                items:
                  $each: columns
                  $of: table
                  $build:
                    $when:
                      - path: item
                        equals:
                          $copy: .
                          $of: item
                    $then:
                      $copy: .
  - id: column-result
    with:
      - physical
    build:
      id:
        $copy: id
        $of: physical
      column:
        $copy: name
        $of: physical
      item:
        $copy: item
        $of: physical
      role:
        $copy: role
        $of: physical
      source:
        $copy: source
        $of: physical
      referencesTable:
        $copy: referencesTable
        $of: physical
      referencesColumn:
        $copy: referencesColumn
        $of: physical
      model:
        $apply: record
        $with:
          row:
            $view: application-java-column-input
            $where:
              - path: values.record.source
                equals:
                  $copy: id
                  $of: physical
            $one: true
  - id: method-source
    with:
      - method
      - document
    build:
      raw:
        $copy: .
        $of: method
      where:
        $first:
          - $copy: where
            $of: method
          - $apply: inherited-where
            $with:
              source:
                $apply: first
                $with:
                  items:
                    $each: methods
                    $of: document
                    $build:
                      $when:
                        - path: methodId
                          equals:
                            $copy: whereFrom
                            $of: method
                      $then:
                        $copy: .
          - []
      conditionSource:
        $copy: whereFrom
        $of: method
      includesCatalog:
        $group:
          $each: methods
          $of: document
          $flatten: true
          $build:
            $copy: includes
        $by:
          $copy: item
        $build:
          $copy: items[0]
      conditionReferenceResolved:
        $first:
          - $when:
              - path: whereFrom
                exists: false
                of: method
            $then: true
          - $apply: source-found
            $with:
              record:
                $apply: first
                $with:
                  items:
                    $each: methods
                    $of: document
                    $build:
                      $when:
                        - path: methodId
                          equals:
                            $copy: whereFrom
                            $of: method
                      $then:
                        $copy: .
          - false
  - id: inherited-where
    with:
      - source
    when:
      - path: .
        exists: true
        of: source
    build:
      $copy: where
      $of: source
  - id: mapper
    with:
      - document
    build:
      id:
        $format: MAP-{id}
        $with:
          id:
            $copy: id
            $of: document
      source:
        $copy: designId
        $of: document
      name:
        $copy: mapper
        $of: document
      methods:
        $each: methods
        $of: document
        $build:
          $apply: merge
          $with:
            base:
              $apply: method
              $with:
                source:
                  $apply: method-source
                  $with:
                    method:
                      $copy: .
                    document:
                      $copy: .
                      $of: document
                table:
                  $apply: table
                  $with:
                    name:
                      $copy: table
                row:
                  $apply: row-model
                  $with:
                    table:
                      $copy: table
            extra:
              id:
                $format: JMTH-{mapper}.{method}
                $with:
                  mapper:
                    $copy: id
                    $of: document
                  method:
                    $copy: methodId
              mapper:
                $copy: mapper
                $of: document
              call:
                $format: '{mapper}.{method}'
                $with:
                  mapper:
                    $copy: mapper
                    $of: document
                  method:
                    $copy: name
  - id: method
    with:
      - source
      - table
      - row
    build:
      $apply: method-final
      $with:
        source:
          $copy: .
          $of: source
        table:
          $copy: .
          $of: table
        row:
          $copy: .
          $of: row
        conditions:
          $each: where
          $of: source
          $build:
            $apply: condition
            $with:
              node:
                $copy: .
              table:
                $copy: .
                $of: table
        writes:
          $each: raw.set
          $of: source
          $build:
            $apply: write
            $with:
              node:
                $copy: .
              table:
                $copy: .
                $of: table
  - id: condition
    with:
      - node
      - table
    build:
      $apply: condition-resolved
      $with:
        node:
          $copy: .
          $of: node
        table:
          $first:
            - $apply: table
              $with:
                name:
                  $copy: table
                  $of: node
            - $copy: .
              $of: table
        column:
          $apply: column
          $with:
            table:
              $first:
                - $apply: table
                  $with:
                    name:
                      $copy: table
                      $of: node
                - $copy: .
                  $of: table
            item:
              $copy: item
              $of: node
            columnId:
              $copy: columnId
              $of: node
  - id: condition-base
    with:
      - node
      - table
      - column
    build:
      raw:
        $copy: .
        $of: node
      column:
        $copy: column
        $of: column
      table:
        $copy: name
        $of: table
      type:
        $copy: model.java.qualifiedName
        $of: column
      param:
        $case:
          $first:
            - $copy: param
              $of: node
            - $value:
                extract:
                  - of: node
                    path: value
                  - ^\$(.+)$
        $as: camel
      operator:
        $first:
          - $copy: op
            $of: node
          - $when:
              - path: param
                exists: true
                of: node
            $then: equals
          - $when:
              - path: equals
                exists: true
                of: node
            $then: equals
          - $when:
              - path: notEquals
                exists: true
                of: node
            $then: notEquals
          - $when:
              - path: oneOf
                exists: true
                of: node
            $then: in
          - $when:
              - path: startsWith
                exists: true
                of: node
            $then: startsWith
      constant:
        $first:
          - $copy: equals
            $of: node
          - $copy: notEquals
            $of: node
          - $copy: value
            $of: node
      values:
        $first:
          - $copy: oneOf
            $of: node
          - $copy: values
            $of: node
      prefix:
        $copy: startsWith
        $of: node
      optional:
        $copy: skipIfEmpty
        $of: node
      collection:
        $when:
          - path: op
            equals: includesAny
            of: node
        $then: true
      link:
        $when:
          - path: op
            equals: includesAny
            of: node
        $then:
          $apply: link
          $with:
            table:
              $apply: table
              $with:
                name:
                  $copy: via
                  $of: node
            parent:
              $copy: .
              $of: table
  - id: link
    with:
      - table
      - parent
    build:
      table:
        $copy: name
        $of: table
      keys:
        $each: columns
        $of: table
        $build:
          $when:
            - path: referencesTable
              equals:
                $copy: id
                $of: parent
            - path: role
              equals: parent
          $then:
            column:
              $copy: name
            parentColumn:
              $apply: column-name
              $with:
                id:
                  $copy: referencesColumn
      element:
        $apply: first
        $with:
          items:
            $each: columns
            $of: table
            $build:
              $when:
                - path: role
                  equals: element
              $then:
                $apply: column
                $with:
                  table:
                    $copy: .
                    $of: table
                  item:
                    $copy: item
                  columnId:
                    $copy: id
  - id: column-name
    with:
      - id
    build:
      $apply: name
      $with:
        record:
          $apply: record
          $with:
            row:
              $view: application-physical-column-input
              $where:
                - path: id
                  equals:
                    $copy: .
                    $of: id
              $one: true
  - id: name
    with:
      - record
    build:
      $copy: name
      $of: record
  - id: write-base
    with:
      - node
      - table
    build:
      column:
        $apply: column
        $with:
          table:
            $copy: .
            $of: table
          item:
            $copy: item
            $of: node
          columnId:
            $copy: columnId
            $of: node
      raw:
        $copy: .
        $of: node
      value:
        $apply: write-value
        $with:
          node:
            $copy: .
            $of: node
      condition:
        $each: when
        $of: node
        $build:
          param:
            $case:
              $copy: path
            $as: camel
          boolean:
            $when:
              - path: equals
                exists: true
            $then: true
          exists:
            $copy: exists
          value:
            $copy: equals
  - id: write-value
    with:
      - node
    when:
      - of: node
        path: value
        startsWith: $$
    build:
      param:
        $case:
          $value:
            extract:
              - of: node
                path: value
              - ^\$(.+)$
        $as: camel
  - id: write-value
    with:
      - node
    when:
      - path: value.$copy
        exists: true
        of: node
    build:
      param:
        $case:
          $format: '{scope}-{path}'
          $with:
            scope:
              $copy: value.$of
              $of: node
            path:
              $copy: value.$copy
              $of: node
        $as: camel
  - id: write-value
    with:
      - node
    when:
      - path: mode
        equals: clear
        of: node
    build:
      nil: true
  - id: write-value
    with:
      - node
    build:
      constant:
        $copy: value
        $of: node
  - id: method-data
    with:
      - source
      - table
      - row
      - conditions
      - writes
    build:
      name:
        $copy: raw.name
        $of: source
      source:
        $copy: raw.methodId
        $of: source
      kind:
        $copy: raw.kind
        $of: source
      raw:
        $copy: raw
        $of: source
      table:
        $copy: name
        $of: table
      tableId:
        $copy: id
        $of: table
      row:
        $copy: .
        $of: row
      conditionSource:
        $copy: conditionSource
        $of: source
      inputClass:
        $format: '{name}Input'
        $with:
          name:
            $case:
              $copy: raw.name
              $of: source
            $as: pascal
      resultClass:
        $format: '{name}Result'
        $with:
          name:
            $case:
              $copy: raw.name
              $of: source
            $as: pascal
      conditions:
        $copy: .
        $of: conditions
      writes:
        $copy: .
        $of: writes
      joins:
        $each: raw.join
        $of: source
        $build:
          table:
            $copy: table
          column:
            $copy: column
          other:
            $apply: column-name-by-item
            $with:
              table:
                $copy: .
                $of: table
              item:
                $copy: equalsItem
      order:
        $each: raw.order
        $of: source
        $build:
          column:
            $copy: column
          direction:
            $first:
              - $copy: dir
              - asc
          nulls:
            $copy: nulls
      parameters:
        $apply: parameters
        $with:
          conditions:
            $copy: .
            $of: conditions
          writes:
            $copy: .
            $of: writes
      maxColumn:
        $when:
          - path: raw.kind
            equals: max
            of: source
        $then:
          $apply: column
          $with:
            table:
              $copy: .
              $of: table
            columnId:
              $copy: raw.columnId
              $of: source
            item:
              $copy: raw.item
              $of: source
      bindings:
        $copy: columns
        $of: row
      properties:
        $apply: properties
        $with:
          source:
            $copy: .
            $of: source
          table:
            $copy: .
            $of: table
      baseBindings:
        $apply: base-bindings
        $with:
          source:
            $copy: .
            $of: source
          table:
            $copy: .
            $of: table
          row:
            $copy: .
            $of: row
      single:
        $when:
          - path: raw.kind
            equals: select
            of: source
          - path: raw.columns
            exists: false
            of: source
        $then: true
      select:
        $when:
          - of: source
            path: raw.kind
            oneOf:
              - select
              - aggregate
        $then: true
      insert:
        $when:
          - path: raw.kind
            equals: insert
            of: source
        $then: true
      update:
        $when:
          - path: raw.kind
            equals: update
            of: source
        $then: true
      delete:
        $when:
          - path: raw.kind
            equals: delete
            of: source
        $then: true
      count:
        $when:
          - path: raw.kind
            equals: count
            of: source
        $then: true
      max:
        $when:
          - path: raw.kind
            equals: max
            of: source
        $then: true
      writeGroups:
        $group:
          $copy: .
          $of: writes
        $by:
          $copy: column.id
        $build:
          column:
            $copy: items[0].column.column
          type:
            $copy: items[0].column.model.java.qualifiedName
          branches:
            $concat:
              - $each: items
                $build:
                  $when:
                    - path: value.nil
                      equals: true
                  $then:
                    $copy: .
              - $each: items
                $build:
                  $when:
                    - path: value.nil
                      exists: false
                  $then:
                    $copy: .
      many:
        $when:
          - or:
              - path: raw.columns
                exists: true
                of: source
              - path: raw.kind
                equals: aggregate
                of: source
        $then: true
      numericMax:
        $when:
          - path: raw.kind
            equals: max
            of: source
          - not:
              path: raw.item
              equals: id
              of: source
        $then: true
      idMax:
        $when:
          - path: raw.kind
            equals: max
            of: source
          - path: raw.item
            equals: id
            of: source
        $then: true
      conditionReferenceResolved:
        $copy: conditionReferenceResolved
        $of: source
      requiredConditions:
        $each: .
        $of: conditions
        $build:
          $when:
            - or:
                - path: optional
                  exists: false
                - path: optional
                  equals: false
          $then:
            $copy: .
  - id: column-name-by-item
    with:
      - table
      - item
    build:
      $apply: name
      $with:
        record:
          $apply: first
          $with:
            items:
              $each: columns
              $of: table
              $build:
                $when:
                  - path: item
                    equals:
                      $copy: .
                      $of: item
                $then:
                  $copy: .
  - id: parameters
    with:
      - conditions
      - writes
    build:
      $group:
        $concat:
          - $each: .
            $of: conditions
            $build:
              $when:
                - path: param
                  exists: true
              $then:
                name:
                  $copy: param
                type:
                  $first:
                    - $when:
                        - path: collection
                          equals: true
                      $then:
                        $format: java.util.List<{type}>
                        $with:
                          type:
                            $copy: link.element.model.java.qualifiedName
                    - $copy: type
          - $each: .
            $of: writes
            $build:
              $when:
                - path: value.param
                  exists: true
              $then:
                name:
                  $copy: value.param
                type:
                  $copy: column.model.java.qualifiedName
          - $each: .
            $of: writes
            $flatten: true
            $build:
              $each: condition
              $build:
                $when:
                  - path: boolean
                    equals: true
                $then:
                  name:
                    $copy: param
