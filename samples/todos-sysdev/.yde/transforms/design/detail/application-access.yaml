                  - java.time.LocalDate
            $then: true
          plain:
            $when:
              - not:
                  of: data
                  path: column.model.java.qualifiedName
                  oneOf:
                    - java.lang.String
                    - java.time.LocalDate
            $then: true
          unconditional:
            $when:
              - of: data
                path: condition
                empty: true
            $then: true
  - id: method-final
    with:
      - source
      - table
      - row
      - conditions
      - writes
    build:
      $apply: method-render
      $with:
        data:
          $apply: method-data
          $with:
            source:
              $copy: .
              $of: source
            table:
              $copy: .
              $of: table
            row:
              $copy: .
              $of: row
            conditions:
              $copy: .
              $of: conditions
            writes:
              $copy: .
              $of: writes
  - id: method-render
    with:
      - data
    build:
      $apply: merge
      $with:
        base:
          $copy: .
          $of: data
        extra:
          bindings:
            $each: bindings
            $of: data
            $build:
              $apply: merge
              $with:
                base:
                  $copy: .
                extra:
                  noDefault:
                    $when:
                      - path: default
                        exists: false
                    $then: true
          properties:
            $each: properties
            $of: data
            $build:
              $apply: merge
              $with:
                base:
                  $copy: .
                extra:
                  methodName:
                    $copy: name
                    $of: data
                  collection:
                    $when:
                      - path: collection
                        exists: true
                    $then:
                      $apply: merge
                      $with:
                        base:
                          $copy: collection
                        extra:
                          rowMap:
                            $when:
                              - path: collection.scalar
                                exists: false
                            $then: true
                          directScalar:
                            $when:
                              - path: collection.scalar
                                equals: true
                              - path: collection.target
                                exists: false
                            $then: true
          joins:
            $each: joins
            $of: data
            $build:
              $apply: merge
              $with:
                base:
                  $copy: .
                extra:
                  outerTable:
                    $copy: table
                    $of: data
  - id: source-found
    with:
      - record
    build:
      $when:
        - path: methodId
          exists: true
          of: record
      $then: true
