id: screen-designs-operations-derived
name: 画面設計書（操作の画面）
description: >-
  詳細設計。ダッシュボードからたどれる操作ごとに、入力画面と確認画面の部品の木（page・notice・facts・form・field・rows・actions）と、 フォームのクラス（項目の Java の型と Bean Validation）を 1 本にする。HTML
  の手前の形で、③で Thymeleaf のテンプレートに機械的に写す。 決め打ちの規則（画面系の議論で決めたもの）: 入力欄は型から（一行＝text・複数行＝textarea・日付＝date・参照＝select・参照の配列＝choices・ object
  の配列＝rows・真偽値＝checkbox）・検査は 必須＝NotNull・文字数＝Size・形式＝Pattern・重なり不可＝UniqueElements・ 空の欄は未入力（null。前後の空白は落とさない）・値を消すは、効果の「when:
  clear.項目」から、その項目の欄の横にチェック・ 変わった項目だけを送る操作は、確認画面に変わる項目だけを「今の値 → 新しい値」で出す（今の値は DB から）・物理パラメータは既定の表から
scope: business
each: designActions
output: design/detail/derived/documents/screen-designs-operations/{id}.yaml
dependsOn:
  - system-model
  - basic-operations-resolved
  - messages
  - basic-screens-resolved
  - screen-styles
  - detail-document-input-gate
  - system-screen-bindings
  - system-access-bindings
  - application-java-types
input:
  $apply: screen-model
  $with:
    original:
      $apply: model-input
      $with:
        row:
          $view: system-model-input
          $one: true
        operations:
          $view: basic-operations-resolved-input
          $one: true
        screens:
          $view: basic-screens-resolved-input
          $one: true
    documents:
      $each:
        $view: basic-screens-resolved-operations
      $build:
        $copy: values.record
build:
  id:
    $format: DRV-document-screen-designs-operations.{id}
  record:
    id:
      $format: DOC-screen-designs-operations.{id}
    value:
      $apply: linked-document
      $with:
        document:
          $when:
            - of: model
              path: designReach.operations
              includes:
                $copy: id
          id:
            $copy: id
          name:
            $format: '{label}（画面設計書）'
          form:
            $when:
              - path: params
                empty: false
            $then:
              class:
                $format: '{n}Form'
                $with:
                  'n':
                    $case:
                      $copy: id
                    $as: pascal
              emptyAsNull: 空の欄は未入力（null）として受け取る（前後の空白は落とさない）
              fields:
                $each: params
                $apply: java-field
              classes:
                $each: params
                $build:
                  $when:
                    - or:
                        - path: base
                          equals: object
                        - path: item.base
                          equals: object
                  name:
                    $apply: nested-class
                  fields:
                    $first:
                      - $each: fields
                        $apply: java-field
                      - $each: item.fields
                        $apply: java-field
          screens:
            $concat:
              - $when:
                  - path: inputParams
                    empty: false
                $then:
                  - id:
                      $format: '{id}/input'
                    template:
                      $format: '{t}/{a}/input'
                      $with:
                        t:
                          $copy: subject
                        a:
                          $copy: id
                    page:
                      title:
                        $copy: label
                      width: m
                      body:
                        $concat:
                          - - notice:
                                kind: errors
                                for: form
                          - $when:
                              - path: target.entity
                                exists: true
                            $then:
                              - facts:
                                  of:
                                    $copy: target.entity
                                  title: 対象
                                  items:
                                    $apply: receiver-items
                          - - form:
                                action:
                                  $format: POST {u}/confirm
                                  $with:
                                    u:
                                      $apply: url
                                object:
                                  $format: '{n}Form'
                                  $with:
                                    'n':
                                      $case:
                                        $copy: id
                                      $as: pascal
                                # 並びの 1 件を番号で指す操作: 初期値は、番号の指す行（並び順 seq が一致する 1 件）から読む
                                row:
                                  $apply: row-key
                                hidden:
                                  $concat:
                                    # 並びの番号は行のボタンから受け取り、人は入力しない
                                    - $when:
                                        - path: rowOf
                                          exists: true
                                      $then:
                                        - $copy: rowOf.param
                                    # 画面が運ぶ入力（読んだときの版など）は、受け手から読んで隠し項目で運ぶ
                                    - $copy: carried
                                    - - from
                                body:
                                  $concat:
                                    - $each: inputParams
                                      $build:
                                        $when:
                                          - not:
                                              path: base
                                              equals: object
                                        $then:
                                          $apply: field
                                    - - actions:
                                          - label: 確認へ
                                            kind: submit
                                            emphasis: primary
                                          - label: やめる
                                            kind: link
                                            to: 起点の画面
                                            emphasis: secondary
              - - id:
                    $format: '{id}/confirm'
                  template:
                    $format: '{t}/{a}/confirm'
                    $with:
                      t:
                        $copy: subject
                      a:
                        $copy: id
                  page:
                    title:
                      $format: '{label}（確認）'
                    width: m
                    body:
                      $concat:
                        - - notice:
                              kind: refusal
                        - $when:
                            - path: target.entity
                              exists: true
                          $then:
                            - facts:
                                of:
                                  $copy: target.entity
                                title: 対象
                                items:
                                  $apply: receiver-items
                        # 並びの 1 件を番号で指す操作: 対象の行（番号の指す 1 件）の今の値を見せる
                        - $when:
                            - path: rowOf
                              exists: true
                          $then:
                            - facts:
                                title:
                                  $format: 対象の行（{rowOf.label}）
                                of: row
                                row:
                                  $apply: row-key
                                items:
                                  $each: rowOf.fields
                                  $apply: show
                        - $when:
                            - path: inputParams
                              empty: false
                          $then:
                            - $first:
                                - $when:
                                    - path: input.submit
                                      equals: changed
                                  $then:
                                    facts:
                                      title: 変わる項目
                                      kind: changes
                                      compareWith: 今の値（DB から読む）
                                      row:
                                        $apply: row-key
                                      items:
                                        $each: inputParams
                                        $build:
                                          $when:
                                            - not:
                                                path: base
                                                equals: object
                                          $then:
                                            $apply: show
                                - facts:
                                    title: 入力した値
                                    of: form
                                    items:
                                      $each: inputParams
                                      $build:
                                        $when:
                                          - not:
                                              path: base
                                              equals: object
                                        $then:
                                          $apply: show
                        - $when:
                            - path: lifecycle.transitions
                              exists: true
                          $then:
                            - facts:
                                title: 状態の移り方
                                items:
                                  $each: lifecycle.transitions
                                  $build:
                                    label: 状態
                                    from:
                                      $each: from
                                      $build:
                                        $copy: label
                                    to:
                                      $copy: to.label
                        - - form:
                              action:
                                $format: POST {u}
                                $with:
                                  u:
                                    $apply: url
                              hidden:
                                $concat:
                                  - $each: params
                                    $build:
                                      $copy: key
                                  - - flow
                                    - from
                              body:
                                - actions:
                                    $concat:
                                      - - label: 確定
                                          kind: submit
                                          emphasis: primary
                                      - $when:
                                          - path: inputParams
                                            empty: false
                                        $then:
                                          - label: 入力へ戻る
                                            kind: submit
                                            action:
                                              $format: POST {u}/back
                                              $with:
                                                u:
                                                  $apply: url
                                            emphasis: secondary
                                      - $when:
                                          - path: inputParams
                                            empty: true
                                        $then:
                                          - label: やめる
                                            kind: link
                                            to: 起点の画面
                                            emphasis: secondary
        bindings:
          $concat:
            - $each:
                $view: system-screen-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
            - $each:
                $view: system-access-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
        messages:
          $each:
            $view: messages-input
          $flatten: true
          $build:
            $copy: values.record.messages
    source:
      id: rule-screen-designs-operations
      document: .yde/transforms/design/detail/screen-designs-operations-derived.yaml
rules:
  - id: url
    when:
      - path: target.entity
        exists: true
    build:
      $format: /{t}/{k}/{a}
      $with:
        t:
          $copy: subject
        k: '{id}'
        a:
          $copy: id
  - id: url
    build:
      $format: /{t}/{a}
      $with:
        t:
          $copy: subject
        a:
          $copy: id
  # 番号で指す行: どの並びの、どの受け取る値で、行のどの項目（並び順 seq）と突き合わせるか
  - id: row-key
    when:
      - path: rowOf
        exists: true
    build:
      table:
        $copy: rowOf.field
      param:
        $copy: rowOf.param
      item: seq
  - id: receiver-items
    build:
      $concat:
        - - item: id
            label: ID
        - $each: entities
          $of: model
          $build:
            $when:
              - path: id
                equals:
                  $copy: target.entity
                  $of: element
              - path: title
                exists: true
            item:
              $copy: title
  - id: field
    when:
      - path: base
        equals: array
      - path: item.base
        equals: object
    build:
      rows:
        item:
          $copy: key
        label:
          $copy: label
        columns:
          $each: item.fields
          $apply: field
        actions:
          - label: 行を足す
            kind: submit
            emphasis: secondary
          - label: この行を消す
            kind: submit
            emphasis: secondary
            per: row
        redraw: 入力画面へ POST して描き直す
        clearable:
          $when:
            - path: clearedBy
              exists: true
          $then:
            flag:
              $copy: clearedBy
            label: 値を消す
  - id: field
    when:
      - path: base
        equals: array
      - path: item.base
        equals: ref
    build:
      choices:
        item:
          $copy: key
        label:
          $copy: label
        control: checkboxes
        candidates:
          $apply: candidates
          $at: item
        clearable:
          $when:
            - path: clearedBy
              exists: true
          $then:
            flag:
              $copy: clearedBy
            label: 値を消す
  - id: field
    build:
      field:
        item:
          $copy: key
        label:
          $copy: label
        control:
          $apply: control
        required:
          $copy: required
        width:
          $apply: width
        rows:
          $when:
            - path: multiline
              equals: true
          $then: 5
        align:
          $when:
            - path: base
              oneOf:
                - int
                - number
          $then: end
        values:
          $when:
            - path: base
              equals: enum
          $then:
            $copy: values
        candidates:
          $when:
            - path: base
              equals: ref
          $then:
            $apply: candidates
        clearable:
          $when:
            - path: clearedBy
              exists: true
          $then:
            flag:
              $copy: clearedBy
            label: 値を消す
  - id: control
    when:
      - path: base
        equals: string
      - path: multiline
        equals: true
    build: textarea
  - id: control
    when:
      - path: base
        equals: date
    build: date
  - id: control
    when:
      - path: base
        oneOf:
          - ref
          - enum
    build: select
  - id: control
    when:
      - path: base
        equals: boolean
    build: checkbox
  - id: control
    when:
      - path: base
        oneOf:
          - int
          - number
    build: number
  - id: control
    build: text
  - id: width
    when:
      - path: base
        equals: date
    build: 10ch
  - id: width
    when:
      - path: base
        equals: string
      - path: multiline
        exists: false
      - path: maxLength
        lte: 40
    build:
      $format: '{maxLength}ch'
  - id: width
    when:
      - path: base
        equals: string
      - path: multiline
        exists: false
    build: 40ch
  - id: candidates
    build:
      entity:
        $copy: target
      name:
        $copy: targetTitle
      read:
        $format: '{n}Mapper.selectAll'
        $with:
          'n':
            $case:
              $copy: target
            $as: pascal
      empty:
        $first:
          - $when:
              - path: required
                equals: true
            $then: 選ばせる
          - 未選択を選べる
  - id: show
    build:
      item:
        $copy: key
      label:
        $copy: label
      format:
        $first:
          - $copy: format
          - $copy: item.format
      labels:
        $when:
          - path: base
            equals: enum
        $then:
          $copy: values
      name:
        $first:
          - $when:
              - path: base
                equals: ref
            $then:
              entity:
                $copy: target
              item:
                $copy: targetTitle
          - $when:
              - path: item.base
                equals: ref
            $then:
              entity:
                $copy: item.target
              item:
                $copy: item.targetTitle
      keepBreaks:
        $when:
          - path: multiline
            equals: true
        $then: true
  - id: java-field
    build:
      name:
        $case:
          $copy: key
        $as: camel
      item:
        $copy: key
      type:
        $apply: java-type
      validations:
        $concat:
          - $when:
              - path: required
                equals: true
            $then:
              - name: NotNull
          - $when:
              - or:
                  - path: minLength
                    exists: true
                  - path: maxLength
                    exists: true
            $then:
              - name: Size
                min:
                  $copy: minLength
                max:
                  $copy: maxLength
          - $when:
              - path: pattern
                exists: true
            $then:
              - name: Pattern
                regexp:
                  $copy: pattern
          - $when:
              - path: base
                equals: date
            $then:
              - name: DateTimeFormat
                iso: DATE
          - $when:
              - path: unique
                exists: true
            $then:
              - name: UniqueElements
          - $when:
              - path: item.base
                equals: object
            $then:
              - name: Valid
  - id: nested-class
    when:
      - path: base
        equals: array
    build:
      $format: '{o}{k}Row'
      $with:
        o:
          $case:
            $copy: id
            $of: element
          $as: pascal
        k:
          $case:
            $copy: key
          $as: pascal
  - id: nested-class
    build:
      $format: '{o}{k}'
      $with:
        o:
          $case:
            $copy: id
            $of: element
          $as: pascal
        k:
          $case:
            $copy: key
          $as: pascal
  # 業務モデルの操作ではなく、基本設計の「操作」の項目一覧を解いたもの（basic-operations-resolved）を designActions として重ねて読む
  - id: model-input
    with:
      - row
      - operations
      - screens
    build:
      $apply: model-with-operations
      $with:
        composed:
          $compose:
            derived:
              - id: model
                value:
                  $copy: values.model
                  $of: row
                source:
                  id: system-model
            additions: []
            changes:
              - target: model
                set:
                  designActions:
                    $copy: values.actions
                    $of: operations
                  # ダッシュボードからたどれる範囲は、業務モデルではなく、画面の項目（解いた形）から読む
                  designReach:
                    $copy: values.reach
                    $of: screens
                priority: individual
                source:
                  id: basic-operations
  - id: model-with-operations
    with:
      - composed
    build:
      $copy: records[0].value
      $of: composed
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
  - id: screen-model
    with:
      - original
      - documents
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: original
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  designActions:
                    $each: designActions
                    $of: original
                    $bind: item
                    $build:
                      $apply: screen-source
                      $with:
                        original:
                          $copy: .
                        document:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: .
                              $of: documents
                              $build:
                                $when:
                                  - path: id
                                    equals:
                                      $copy: id
                                      $of: item
                                $then:
                                  $copy: .
                priority: individual
                source:
                  id: contract
  - id: screen-source
    with:
      - original
      - document
    when:
      - path: .
        of: document
        exists: true
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: original
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  label:
                    $copy: name
                    $of: document
                  params:
                    $each: params
                    $of: original
                    $bind: parameter
                    $build:
                      $apply: screen-parameter
                      $with:
                        parameter:
                          $copy: .
                        value:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: input.items
                              $of: document
                              $build:
                                $when:
                                  - path: key
                                    equals:
                                      $copy: key
                                      $of: parameter
                                $then:
                                  $copy: .
                  inputParams:
                    $each: inputParams
                    $of: original
                    $bind: parameter
                    $build:
                      $apply: screen-parameter
                      $with:
                        parameter:
                          $copy: .
                        value:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: input.items
                              $of: document
                              $build:
                                $when:
                                  - path: key
                                    equals:
                                      $copy: key
                                      $of: parameter
                                $then:
                                  $copy: .
                  input:
                    $apply: screen-update
                    $with:
                      record:
                        $first:
                          - $copy: input
                            $of: original
                          - {}
                      set:
                        initial:
                          $copy: input.initial
                          $of: document
                        submit:
                          $copy: input.submit
                          $of: document
                priority: individual
                source:
                  id: contract
  - id: screen-source
    with:
      - original
      - document
    build:
      $copy: .
      $of: original
  - id: screen-parameter
    with:
      - parameter
      - value
    build:
      $apply: screen-update
      $with:
        record:
          $copy: .
          $of: parameter
        set:
          $copy: .
          $of: value
  - id: screen-update
    with:
      - record
      - set
    when:
      - of: set
        path: .
        empty: false
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: record
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  $copy: .
                  $of: set
                priority: individual
                source:
                  id: contract
  - id: screen-update
    with:
      - record
      - set
    build:
      $copy: .
      $of: record
  - id: java-type
    when:
      - path: base
        equals: array
      - path: item.base
        equals: object
    build:
      $format: List<{n}>
      $with:
        'n':
          $apply: nested-class
  - id: java-type
    when:
      - path: base
        equals: array
    build:
      $format: List<{n}>
      $with:
        'n':
          $apply: java-type
          $at: item
  - id: java-type
    when:
      - path: base
        equals: object
    build:
      $apply: nested-class
  - id: java-type
    build:
      $apply: scalar-java-type
      $with:
        base:
          $copy: base
        row:
          $view: application-java-types-input
          $one: true
  - id: scalar-java-type
    with:
      - base
      - row
    build:
      $apply: contract-first
      $with:
        matches:
          $each: values.record.mappings
          $of: row
          $build:
            $when:
              - path: base
                equals:
                  $copy: .
                  $of: base
            $then:
              $copy: name
