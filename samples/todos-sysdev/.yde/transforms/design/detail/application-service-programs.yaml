id: application-service-programs
name: 確定した処理を Service の実行手順へ変換する
scope: design
dependsOn:
  - application-service-bindings
  - application-runtime-model
  - application-configuration
output: design/detail/final/application-service-programs.yaml
input:
  processes:
    $each:
      $view: processes-input
    $build:
      $copy: values.record
  inputs:
    $each:
      $view: application-service-inputs-input
    $build:
      $copy: values.record
  bindings:
    $each:
      $view: application-service-bindings-input
    $build:
      $copy: values.record
  methods:
    $each:
      $view: application-method-input
    $build:
      $copy: values.record
  tables:
    $each:
      $view: application-physical-table-input
    $build:
      $copy: values.record
  entities:
    $each:
      $view: basic-model-entities
    $build:
      $copy: values.record
  states:
    $each:
      $view: application-state-input
    $build:
      $copy: values.record
  errors:
    $each:
      $view: application-exception-input
    $build:
      $copy: values.record
  contracts:
    $each: schemas
    $of: model
    $build:
      $when:
        - path: id
          equals: application-service-programs
      $then:
        $copy: declared
build:
  $apply: all
  $with:
    global:
      $copy: .
rules:
  - id: first
    with:
      - items
    build:
      $copy: '[0]'
      $of: items
  - id: all
    with:
      - global
    build:
      $apply: finish
      $with:
        global:
          $copy: .
          $of: global
        operations:
          $each: processes
          $of: global
          $build:
            $apply: operation
            $with:
              process:
                $copy: .
              global:
                $copy: .
                $of: global
  - id: finish
    with:
      - global
      - operations
    build:
      $apply: validated
      $with:
        documents:
          $validate:
            schemas:
              $copy: contracts
              $of: global
            documents:
              design/detail/final/application-service-programs.yaml:
                id: APP-service-programs
                services:
                  $group:
                    $copy: .
                    $of: operations
                  $by:
                    $copy: service
                  $build:
                    id:
                      $format: JSERVICE-{name}
                      $with:
                        name:
                          $copy: key
                    name:
                      $copy: key
                    operations:
                      $copy: items
                    mappers:
                      $group:
                        $copy: methods
                        $of: global
                      $by:
                        $copy: mapper
                      $build:
                        name:
                          $copy: key
                        variable:
                          $case:
                            $copy: key
                          $as: camel
                    errors:
                      $copy: errors
                      $of: global
  - id: validated
    with:
      - documents
    build:
      $apply: first
      $with:
        items:
          $eachEntry: .
          $of: documents
          $flatten: true
          $build:
            - $copy: .
  - id: method
    with:
      - call
      - global
    build:
      $apply: first
      $with:
        items:
          $each: methods
          $of: global
          $build:
            $when:
              - path: call
                equals:
                  $copy: .
                  $of: call
            $then:
              $copy: .
  - id: method-id
    with:
      - id
      - global
    build:
      $apply: first
      $with:
        items:
          $each: methods
          $of: global
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: id
            $then:
              $copy: .
  - id: operation
    with:
      - process
      - global
    build:
      $apply: operation-ready
      $with:
        ctx:
          process:
            $copy: .
            $of: process
          global:
            $copy: .
            $of: global
          input:
            $apply: first
            $with:
              items:
                $each: inputs
                $of: global
                $build:
                  $when:
                    - path: source
                      equals:
                        $copy: designId
                        $of: process
                  $then:
                    $copy: .
          binding:
            $apply: first
            $with:
              items:
                $each: bindings
                $of: global
                $build:
                  $when:
                    - path: source
                      equals:
                        $copy: designId
                        $of: process
                  $then:
                    $copy: .
  - id: operation-ready
    with:
      - ctx
    build:
      $apply: operation-steps
      $with:
        ctx:
          $copy: .
          $of: ctx
        primary:
          $apply: method-id
          $with:
            id:
              $copy: binding.primary
              $of: ctx
            global:
              $copy: global
              $of: ctx
        steps:
          $each: process.steps
          $of: ctx
          $build:
            $apply: step
            $with:
              raw:
                $copy: .
              stepNumber: $position
              ctx:
                $copy: .
                $of: ctx
  - id: step
    with:
      - raw
      - stepNumber
      - ctx
    build:
      index:
        $copy: .
        $of: stepNumber
      raw:
        $copy: .
        $of: raw
      method:
        $apply: method
        $with:
          call:
            $copy: call
            $of: raw
          global:
            $copy: global
            $of: ctx
      binding:
        $apply: first
        $with:
          items:
            $each: binding.steps
            $of: ctx
            $build:
              $when:
                - path: index
                  equals:
                    $copy: .
                    $of: stepNumber
              $then:
                $copy: .
      row:
        $format: row{i}
        $with:
          i:
            $copy: .
            $of: stepNumber
      rows:
        $format: rows{i}
        $with:
          i:
            $copy: .
            $of: stepNumber
  - id: operation-steps
    with:
      - ctx
      - primary
      - steps
    build:
      $apply: operation-body
      $with:
        ctx:
          process:
            $copy: process
            $of: ctx
          global:
            $copy: global
            $of: ctx
          input:
            $copy: input
            $of: ctx
          binding:
            $copy: binding
            $of: ctx
          primary:
            $copy: .
            $of: primary
          steps:
            $copy: .
            $of: steps
          writes:
            $each: .
            $of: steps
            $build:
              $when:
                - path: raw.step
                  equals: write
              $then:
                $apply: write-context
                $with:
                  step:
                    $copy: .
                  ctx:
                    $copy: .
                    $of: ctx
          number:
            $apply: first
            $with:
              items:
                $each: .
                $of: steps
                $build:
                  $when:
                    - path: raw.step
                      equals: number
                  $then:
                    $copy: .
          inputScope:
            symbols:
              $each: binding.symbols
              $of: ctx
              $build:
                $when:
                  - path: place
                    equals: input
                $then:
                  $copy: .
          currentScope:
            $apply: row-scope
            $with:
              java: original
              method:
                $copy: .
                $of: primary
  - id: write-context
    with:
      - step
      - ctx
    build:
      $apply: write-context-ready
      $with:
        step:
          $copy: .
          $of: step
        ctx:
          $copy: .
          $of: ctx
        table:
          $apply: first
          $with:
            items:
              $each: global.tables
              $of: ctx
              $build:
                $when:
                  - path: id
                    equals:
                      $copy: method.tableId
                      $of: step
                $then:
                  $copy: .
        reader:
          $apply: first
          $with:
            items:
              $each: global.methods
              $of: ctx
              $build:
                $when:
                  - path: tableId
                    equals:
                      $copy: method.tableId
                      $of: step
                  - path: source
                    equals: findById
                $then:
                  $copy: .
  - id: operation-body
    with:
      - ctx
    build:
      id:
        $format: JOP-{id}
        $with:
          id:
            $copy: process.id
            $of: ctx
      source:
        $copy: process.designId
        $of: ctx
      service:
        $copy: input.service
        $of: ctx
      method:
        $copy: input.method
        $of: ctx
      input:
        $copy: input
        $of: ctx
      confirm:
        $each: process.confirm
        $of: ctx
        $build:
          method:
            $copy: method
          operationMethod:
            $copy: input.method
            $of: ctx
          arguments:
            $each: input.arguments
            $of: ctx
            $build:
              name:
                $copy: name
              accessor:
                $copy: accessor
              type:
                $apply: external-type
                $with:
                  className:
                    $copy: input.className
                    $of: ctx
          inputClass:
            $copy: input.className
            $of: ctx
      tokens:
        $concat:
          - - valid: true
              plain: true
              raw: |2
                        var today = java.time.LocalDate.now(clock);
                        var violations = new java.util.ArrayList<BusinessViolation>();
          - $each: steps
            $of: ctx
            $build:
              $when:
                - path: raw.step
                  equals: read
              $then:
                $apply: read
                $with:
                  step:
                    $copy: .
                  ctx:
                    $copy: .
                    $of: ctx
            $flatten: true
          - $each: steps
            $of: ctx
            $build:
              $when:
                - path: raw.step
                  equals: number
              $then:
                $apply: number
                $with:
                  step:
                    $copy: .
                  ctx:
                    $copy: .
                    $of: ctx
            $flatten: true
          - $each: writes
            $of: ctx
            $build:
              $apply: prepare-write
              $with:
                write:
                  $copy: .
                ctx:
                  $copy: .
                  $of: ctx
            $flatten: true
          - $each: steps
            $of: ctx
            $build:
              $when:
                - path: raw.step
                  equals: check
                - path: raw.phase
                  equals: before
              $then:
                $apply: check
                $with:
                  step:
                    $copy: .
                  ctx:
                    $copy: .
                    $of: ctx
            $flatten: true
          - - valid: true
              plain: true
              raw: '        if (preview) return new OperationOutcome('
          - $apply: operation-id
            $with:
              ctx:
                $copy: .
                $of: ctx
          - - valid: true
              plain: true
              raw: |
                , violations);
          - $apply: refuse
            $with:
              ctx:
                $copy: .
                $of: ctx
          - $each: writes
            $of: ctx
            $build:
              $apply: execute-write
              $with:
                write:
                  $copy: .
                ctx:
                  $copy: .
                  $of: ctx
            $flatten: true
          - $each: steps
            $of: ctx
            $build:
              $when:
                - path: raw.step
                  equals: check
                - path: raw.phase
                  equals: after
              $then:
                $apply: check
                $with:
                  step:
                    $copy: .
                  ctx:
                    $copy: .
                    $of: ctx
            $flatten: true
          - $apply: refuse
            $with:
              ctx:
                $copy: .
                $of: ctx
          - - valid: true
              plain: true
              raw: '        return new OperationOutcome('
          - $apply: operation-id
            $with:
              ctx:
                $copy: .
                $of: ctx
          - - valid: true
              plain: true
              raw: |
                , violations);
      arguments:
        $each: input.arguments
        $of: ctx
        $build:
          name:
            $copy: name
          accessor:
            $copy: accessor
          type:
            $apply: external-type
            $with:
              className:
                $copy: input.className
                $of: ctx
      contract:
        reads:
          $each: steps
          $of: ctx
          $build:
            $when:
              - path: raw.step
                equals: read
            $then:
              $copy: index
        numbers:
          $each: steps
          $of: ctx
          $build:
            $when:
              - path: raw.step
                equals: number
            $then:
              $copy: index
        steps:
          $each: steps
          $of: ctx
          $build:
            $copy: raw.step
        confirms:
          $each: process.confirm
          $of: ctx
          $build:
            sameArguments:
              $apply: same
              $with:
                left:
                  $copy: arguments
                right:
                  $copy: process.service.arguments
                  $of: ctx
  - id: operation-id
    with:
      - ctx
    when:
      - of: ctx
        path: number
        exists: true
    build:
      - valid: true
        plain: true
        raw: numberedId
  - id: operation-id
    with:
      - ctx
    build:
      $first:
        - $apply: symbol-token
          $with:
            symbol:
              $apply: first
              $with:
                items:
                  $each: binding.symbols
                  $of: ctx
                  $build:
                    $when:
                      - path: place
                        equals: input
                      - path: name
                        equals: id
                    $then:
                      $copy: .
        - - valid: false
            raw: UNSUPPORTED
            error: 操作の ID を解決できません
  - id: refuse
    with:
      - ctx
    build:
      $concat:
        - - valid: true
            plain: true
            raw: '        if (!violations.isEmpty()) throw new '
        - - valid: true
            errorClass:
              $apply: error-name
              $with:
                kind: refused
                ctx:
                  $copy: .
                  $of: ctx
        - - valid: true
            plain: true
            raw: |
              (violations.getFirst());
  - id: error-name
    with:
      - kind
      - ctx
    build:
      $apply: error-name-ready
      $with:
        error:
          $apply: first
          $with:
            items:
              $each: global.errors
              $of: ctx
              $build:
                $when:
                  - path: kind
                    equals:
                      $copy: .
                      $of: kind
                $then:
                  $copy: .
  - id: error-name-ready
    with:
      - error
    build:
      $copy: name
      $of: error
  - id: read
    with:
      - step
      - ctx
    build:
      $concat:
        - - valid: true
            plain: true
            raw: '        var original = '
        - $apply: call
          $with:
            step:
              $copy: .
              $of: step
            ctx:
              $copy: .
              $of: ctx
        - - valid: true
            plain: true
            raw: |-
              ;
                      if (original == null) throw new 
        - - valid: true
            errorClass:
              $apply: error-name
              $with:
                kind: notFound
                ctx:
                  $copy: .
                  $of: ctx
        - - valid: true
            plain: true
            raw: (
        - - valid: true
            literal: true
            value:
              $copy: raw.entity
              $of: step
        - - valid: true
            plain: true
            raw: ', '
        - $apply: key
          $with:
            source:
              $copy: raw.key
              $of: step
            ctx:
              $copy: .
              $of: ctx
        - - valid: true
            plain: true
            raw: |
              );
  - id: call
    with:
      - step
      - ctx
    build:
      $apply: method-call
      $with:
        method:
          $copy: method
          $of: step
        parameters:
          $copy: binding.parameters
          $of: step
  - id: method-call
    with:
      - method
      - parameters
    when:
      - of: parameters
        path: '[0]'
        exists: false
    build:
      $concat:
        - - valid: true
            plain: true
            raw:
              $format: '{m}.{n}()'
              $with:
                m:
                  $case:
                    $copy: mapper
                    $of: method
                  $as: camel
                'n':
                  $copy: name
                  $of: method
  - id: method-call
    with:
      - method
      - parameters
    build:
      $concat:
        - - valid: true
            plain: true
            raw:
              $format: 'ServiceChecks.call(new {m}.{i}(), p -> '
              $with:
                m:
                  $copy: mapper
                  $of: method
                i:
                  $copy: inputClass
                  $of: method
        - - valid: true
            plain: true
            raw: '{ '
        - $each: .
          $of: parameters
          $build:
            $concat:
              - - valid: true
                  plain: true
                  raw:
                    $format: p.set{a}(
                    $with:
                      a:
                        $copy: accessor
              - - valid: true
                  plain: true
                  raw:
                    $copy: binding.java
              - - valid: true
                  plain: true
                  raw: '); '
          $flatten: true
        - - valid: true
            plain: true
            raw: '}, '
        - - valid: true
            plain: true
            raw:
              $format: '{m}::{n})'
              $with:
                m:
                  $case:
                    $copy: mapper
                    $of: method
                  $as: camel
                'n':
                  $copy: name
                  $of: method
  - id: call-key
    with:
      - method
      - keyTokens
    when:
      - of: method
        path: parameters[0]
        exists: true
      - of: method
        path: parameters[1]
        exists: false
    build:
      $concat:
        - - valid: true
            plain: true
            raw:
              $format: ServiceChecks.call(new {m}.{i}(), p -> p.set{a}(
              $with:
                m:
                  $copy: mapper
                  $of: method
                i:
                  $copy: inputClass
                  $of: method
                a:
                  $copy: parameters[0].accessor
                  $of: method
        - $copy: .
          $of: keyTokens
        - - valid: true
            plain: true
            raw:
              $format: ), {m}::{n})
              $with:
                m:
                  $case:
                    $copy: mapper
                    $of: method
                  $as: camel
                'n':
                  $copy: name
                  $of: method
  - id: call-key
    with:
      - method
      - keyTokens
    build:
      - valid: false
        raw: UNSUPPORTED
        error: キーを一つ渡す Mapper 呼出しを解決できません
  - id: key
    with:
      - source
      - ctx
    when:
      - of: source
        path: param
        exists: true
    build:
      $apply: symbol-token
      $with:
        symbol:
          $apply: first
          $with:
            items:
              $each: binding.symbols
              $of: ctx
              $build:
                $when:
                  - path: place
                    equals: input
                  - path: name
                    equals:
                      $copy: param
                      $of: source
                $then:
                  $copy: .
  - id: key
    with:
      - source
      - ctx
    when:
      - of: source
        path: self
        exists: true
    build:
      $apply: symbol-token
      $with:
        symbol:
          $apply: first
          $with:
            items:
              $each: binding.symbols
              $of: ctx
              $build:
                $when:
                  - path: place
                    equals: self
                  - path: path
                    equals:
                      $copy: self
                      $of: source
                $then:
                  $copy: .
  - id: key
    with:
      - source
      - ctx
    when:
      - of: source
        path: generated
        exists: true
    build:
      $apply: symbol-token
      $with:
        symbol:
          $apply: first
          $with:
            items:
              $each: binding.symbols
              $of: ctx
              $build:
                $when:
                  - path: place
                    equals: generated
                  - path: path
                    equals:
                      $copy: generated
                      $of: source
                $then:
                  $copy: .
  - id: key
    with:
      - source
      - ctx
    build:
      - valid: false
        raw: UNSUPPORTED
        error: キーの参照元を解決できません
  - id: symbol-token
    with:
      - symbol
    when:
      - of: symbol
        path: java
        exists: true
    build:
      - valid: true
        plain: true
        raw:
          $copy: java
          $of: symbol
  - id: symbol-token
    with:
      - symbol
    build:
      - valid: false
        raw: UNSUPPORTED
        error: 値の参照元を解決できません
  - id: number
    with:
      - step
      - ctx
    build:
      $concat:
        - - valid: true
            plain: true
            raw: '        var numberedId = SequenceNumbers.nextId('
        - $apply: call
          $with:
            step:
              $copy: .
              $of: step
            ctx:
              $copy: .
              $of: ctx
        - - valid: true
            plain: true
            raw: ', '
        - $apply: prefix
          $with:
            rule:
              $copy: raw.rule
              $of: step
            ctx:
              $copy: .
              $of: ctx
        - - valid: true
            plain: true
            raw: ', '
        - - valid: true
            plain: true
            raw:
              $format: '{d}'
              $with:
                d:
                  $copy: raw.rule.digits
                  $of: step
            digits:
              $copy: raw.rule.digits
              $of: step
        - - valid: true
            plain: true
            raw: |
              );
  - id: prefix
    with:
      - rule
      - ctx
    when:
      - of: rule
        path: prefix.$of
        equals: owner
      - of: rule
        path: prefix.$format
        exists: true
    build:
      $concat:
        - - valid: true
            literal: true
            value:
              $copy: prefix.$format
              $of: rule
            prefixFormat:
              $copy: prefix.$format
              $of: rule
        - - valid: true
            plain: true
            raw: '.replace("{id}", '
        - $apply: symbol-token
          $with:
            symbol:
              $apply: first
              $with:
                items:
                  $each: binding.symbols
                  $of: ctx
                  $build:
                    $when:
                      - path: place
                        equals: self
                      - path: path
                        equals: id
                    $then:
                      $copy: .
        - - valid: true
            plain: true
            raw: )
  - id: prefix
    with:
      - rule
      - ctx
    build:
      - valid: true
        literal: true
        value:
          $copy: prefix
          $of: rule
  - id: value
    with:
      - value
      - type
      - ctx
    build:
      $apply: value-ready
      $with:
        record:
          value:
            $copy: .
            $of: value
        type:
          $copy: .
          $of: type
        ctx:
          $copy: .
          $of: ctx
  - id: value-ready
    with:
      - record
      - type
      - ctx
    when:
      - of: record
        path: value.$copy
        exists: true
    build:
      $apply: value-copy
      $with:
        place:
          $first:
            - $copy: value.$of
              $of: record
            - input
        path:
          $copy: value.$copy
          $of: record
        type:
          $copy: .
          $of: type
        ctx:
          $copy: .
          $of: ctx
  - id: value-copy
    with:
      - place
      - path
      - type
      - ctx
    build:
      $apply: typed-symbol
      $with:
        symbol:
          $apply: first
          $with:
            items:
              $each: binding.symbols
              $of: ctx
              $build:
                $when:
                  - path: place
                    equals:
                      $copy: .
                      $of: place
                  - path: path
                    equals:
                      $copy: .
                      $of: path
                $then:
                  $copy: .
        type:
          $copy: .
          $of: type
  - id: value-ready
    with:
      - record
      - type
      - ctx
    when:
      - of: record
        path: value.generated
        exists: true
    build:
      $apply: value-copy
      $with:
        place: generated
