id: processes-derived
name: 処理設計書（Service）
description: >-
  操作ごとに Service のメソッドと手順を書く。手順は、テーブルアクセス設計書の Mapper のメソッドを呼ぶ形で書く（名前の決まりは同じ）。 決め打ちの規則: 1 操作＝1
  トランザクション・受け手を先に読む（findById）・状態の前提（Lifecycle）は読んだ行の状態で確かめる（Java）・ 業務モデルの前提は、受け手の中の要素の条件なら件数（Mapper の
  count）、受け手の値の条件なら読んだ行（Java）で確かめる・ 採番は使われている番号の次（maxId）・書く手順は、同じテーブルへの値をまとめた insert か update と、明細の行（並び順は maxSeq の次）・
  データの決まり（業務モデルの操作の checks＝書くと破れうる決まり）は、要素ごとの決まりと循環の決まりは書いた後の値を計算して書く前に Java で、
  入れ子の要素の決まりは書いた後に同じトランザクションで件数を数えて確かめる（違反なら例外で書いたものを取り消す）。断るのはエラーの決まりだけ・ 受け取る値が原因で破れうる Java の決まりは、確認へでも確かめる（confirm
  のメソッド。書かない）。 型・桁・形式の入力検査は Controller（Bean Validation）で行い、ここには書かない。断りの文はメッセージのキー（メッセージ定義書）で書く
scope: business
each: designActions
output: design/detail/derived/documents/processes/{id}.yaml
dependsOn:
  - system-model
  - basic-operations-resolved
  - basic-rules
  - system-access-bindings
  - messages
  - detail-document-input-gate
  - status-rules
input:
  $apply: model-input
  $with:
    row:
      $view: system-model-input
      $one: true
    operations:
      $view: basic-operations-resolved-input
      $one: true
    rules:
      $each:
        $view: basic-model-rules
      $build:
        $copy: values.record
build:
  id:
    $format: DRV-document-processes.{id}
  record:
    id:
      $format: DOC-processes.{id}
    value:
      $apply: linked-document
      $with:
        document:
          id:
            $copy: id
          name:
            $copy: label
          service:
            class:
              $format: '{name}Service'
              $with:
                name:
                  $case:
                    $copy: subject
                  $as: pascal
            method:
              $case:
                $copy: id
              $as: camel
            arguments:
              $concat:
                - $when:
                    - path: target.entity
                      exists: true
                  $then:
                    - id
                - $each: params
                  $build:
                    $case:
                      $copy: key
                    $as: camel
          confirm:
            $group:
              $each: checks
              $build:
                $when:
                  - path: params
                    exists: true
                  - path: level
                    equals: error
                  - or:
                      - path: form
                        equals: element
                      - path: kind
                        equals: acyclic
                $then:
                  $copy: .
            $by: confirm
            $build:
              method:
                $format: check{n}
                $with:
                  'n':
                    $case:
                      $copy: id
                      $of: element
                    $as: pascal
              arguments:
                $concat:
                  - $when:
                      - of: element
                        path: target.entity
                        exists: true
                    $then:
                      - id
                  - $each: params
                    $of: element
                    $build:
                      $case:
                        $copy: key
                      $as: camel
              does: 受け手を読み（あれば）、入力の値で書いた後の値を計算し、次の決まりを確かめる（書かない）。違反は欄の名前とメッセージのキーの並びで返す
              constraints:
                $each: items
                $build:
                  constraint:
                    $copy: constraint
                  field:
                    $case:
                      $copy: params[0]
                    $as: camel
                  message:
                    $format: check.{c}
                    $with:
                      c:
                        $copy: constraint
          transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
          steps:
            $concat:
              - $when:
                  - path: target.entity
                    exists: true
                $then:
                  - step: read
                    call:
                      $format: '{n}Mapper.findById'
                      $with:
                        'n':
                          $case:
                            $copy: target.entity
                          $as: pascal
                    key:
                      param: id
                    missing:
                      $format: 見つからなければ NotFoundException（error.notFound.{e}）
                      $with:
                        e:
                          $copy: target.entity
                    entity:
                      $copy: target.entity
              # 受け手を入れ子で持つ親の値を条件にする前提（同時更新の検出の、親の版）があれば、親の行を読む
              - $each: require
                $build:
                  $when:
                  - path: rule.match[1].edge.contains
                    equals: true
                  - path: rule.match[2].node.entity
                    equals:
                      $copy: target.entity
                      $of: element
                  - path: rule.where[0].of
                    equals:
                      $copy: rule.match[0].node.bind
                  $then:
                    step: read-owner
                    call:
                      $format: '{n}Mapper.findById'
                      $with:
                        'n':
                          $case:
                            $copy: rule.match[0].node.entity
                          $as: pascal
                    key:
                      self:
                        $format: '{p}_id'
                        $with:
                          p:
                            $case:
                              $copy: rule.match[0].node.entity
                            $as: snake
                    missing:
                      $format: 見つからなければ NotFoundException（error.notFound.{e}）
                      $with:
                        e:
                          $copy: rule.match[0].node.entity
                    entity:
                      $copy: rule.match[0].node.entity
              - $when:
                  - path: lifecycle.transitions
                    exists: true
                $then:
                  - step: check
                    precondition:
                      $format: '{id}.state'
                    by: Java（読んだ行の状態）
                    allowed:
                      $apply: state-allowed
                      $with:
                        row:
                          $view: status-rules-input
                          $where:
                            - path: values.record.id
                              equals:
                                $copy: lifecycle.id
                                $of: element
                          $one: true
                        action:
                          $copy: id
                          $of: element
                    message:
                      $format: '{id}.state'
                    text:
                      $copy: lifecycle.refusal
                    checkMode: state
                    phase: before
                    entity:
                      $copy: target.entity
                    stateField:
                      $apply: state-field
                      $with:
                        row:
                          $view: status-rules-input
                          $where:
                            - path: values.record.id
                              equals:
                                $copy: lifecycle.id
                                $of: element
                          $one: true
              - $each: require
                $build:
                  $when:
                    - path: id
                      exists: true
                  $then:
                    $apply: precondition
              - $each: effects
                $build:
                  $when:
                    - path: numbering
                      exists: true
                  step: number
                  entity:
                    $first:
                      - $copy: field.item.entity
                      - $copy: entity
                  call:
                    $format: '{n}Mapper.maxId'
                    $with:
                      'n':
                        $case:
                          $first:
                            - $copy: field.item.entity
                            - $copy: entity
                        $as: pascal
                  rule:
                    $copy: numbering
              - $each: checks
                $bind: c
                $flatten: true
                $build:
                  $each: designRules
                  $of: model
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: constraint
                          $of: c
                      - path: level
                        equals: error
                      - or:
                          - path: form
                            equals: element
                          - path: kind
                            equals: acyclic
                    $then:
                      $first:
                        - $when:
                            - path: kind
                              equals: acyclic
                          $then:
                            step: check
                            constraint:
                              $copy: id
                            by: Java（参照の先をたどる）
                            follow:
                              $copy: fields[0].key
                            call:
                              $format: '{n}Mapper.findById'
                              $with:
                                'n':
                                  $case:
                                    $copy: entity
                                  $as: pascal
                            how: 書く参照の先から、同じ項目の参照を findById でたどり、受け手（作る操作は作る要素）に戻れば断る
                            field:
                              $case:
                                $copy: params[0]
                                $of: c
                              $as: camel
                            message:
                              $format: check.{id}
                            checkMode: cycle
                            phase: before
                            entity:
                              $copy: entity
                        - step: check
                          constraint:
                            $copy: id
                          by: Java（書いた後の値）
                          at:
                            $copy: at
                          rule:
                            $copy: rule
                          field:
                            $case:
                              $copy: params[0]
                              $of: c
                            $as: camel
                          message:
                            $format: check.{id}
                          checkMode: prospective
                          phase: before
                          entity:
                            $copy: entity
              - $group:
                  $apply: writes
                $by:
                  $first:
                    - $copy: row
                    - $copy: call
                $build:
                  step: write
                  call:
                    $copy: items[0].call
                  kind:
                    $copy: items[0].kind
                  values:
                    $first:
                      - $copy: items[0].values
                      - $when:
                          - path: items[0].item
                            exists: true
                          - path: items[0].kind
                            equals: insert
                        $then:
                          $entries:
                            $group: items
                            $by:
                              $copy: item
                            $build:
                              key:
                                $copy: key
                              value:
                                $copy: items[0].value
                  set:
                    $when:
                      - path: items[0].kind
                        equals: update
                    $then:
                      $each: items
                      $build:
                        item:
                          $copy: item
                        value:
                          $copy: value
                        when:
                          $copy: when
                        mode:
                          $copy: mode
                  each:
                    $copy: items[0].each
                  seq:
                    $copy: items[0].seq
                  where:
                    $copy: items[0].where
                  when:
                    $when:
                      - path: items[0].kind
                        notEquals: update
                    $then:
                      $copy: items[0].when
                  key:
                    $copy: items[0].key
                  ownerKey:
                    $copy: items[0].ownerKey
                  rowKey:
                    $copy: items[0].rowKey
                  missing:
                    $copy: items[0].missing
                  missingEntity:
                    $copy: items[0].missingEntity
              - $each: checks
                $bind: c
                $flatten: true
                $build:
                  $each: designRules
                  $of: model
                  $bind: k
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: constraint
                          $of: c
                      - path: level
                        equals: error
                      - path: form
                        equals: pattern
                      - path: rule.match[1].edge.contains
                        equals: true
                    step: check
                    constraint:
                      $copy: id
                    by: SQL（件数。書いた後）
                    call:
                      $format: '{m}Mapper.count{n}'
                      $with:
                        m:
                          $case:
                            $copy: rule.match[2].node.entity
                          $as: pascal
                        'n':
                          $case:
                            $copy: id
                          $as: pascal
                    key:
                      $first:
                        - $when:
                            - of: element
                              path: target.entity
                              equals:
                                $copy: rule.match[0].node.entity
                          $then:
                            param: id
                        - $when:
                            - of: element
                              path: target.entity
                              equals:
                                $copy: rule.match[2].node.entity
                          $then:
                            self:
                              $format: '{p}_id'
                              $with:
                                p:
                                  $case:
                                    $copy: rule.match[0].node.entity
                                  $as: snake
                        - generated: numberedId
                    expect:
                      $map:
                        $copy: rule.expect
                      $using:
                        absent: 0 件なら通す
                        exists: 1 件以上なら通す
                    violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
                    message:
                      $format: check.{id}
                    checkMode: count
                    phase: after
                    entity:
                      $copy: entity
                    countExpectation:
                      $copy: rule.expect
          subject:
            $copy: subject
          originalService:
            class:
              $format: '{name}Service'
              $with:
                name:
                  $case:
                    $copy: subject
                  $as: pascal
            method:
              $case:
                $copy: id
              $as: camel
            arguments:
              $concat:
                - $when:
                    - path: target.entity
                      exists: true
                  $then:
                    - id
                - $each: params
                  $build:
                    $case:
                      $copy: key
                    $as: camel
          transactionMode: atomic
        bindings:
          $concat:
            - $each:
                $view: system-access-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
        messages:
          $each:
            $view: messages-input
          $flatten: true
          $build:
            $copy: values.record.messages
    source:
      id: rule-processes
      document: .yde/transforms/design/detail/processes-derived.yaml
rules:
  # 受け手を入れ子で持つ親の値を条件にする前提: 読んだ親の行で確かめる
  - id: precondition
    when:
      - path: rule.match[1].edge.contains
        equals: true
      - path: rule.match[2].node.entity
        equals:
          $copy: target.entity
          $of: element
      - path: rule.where[0].of
        equals:
          $copy: rule.match[0].node.bind
    build:
      step: check
      precondition:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      by: Java（読んだ親の行）
      rule:
        $copy: rule.where
      message:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      text:
        $copy: message
      checkMode: owner
      subjectAlias:
        $copy: rule.match[0].node.bind
      phase: before
      entity:
        $copy: rule.match[0].node.entity
  - id: precondition
    when:
      - path: rule.match[1].edge.contains
        equals: true
    build:
      step: check
      precondition:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      by: SQL（件数）
      call:
        $format: '{m}Mapper.count{n}'
        $with:
          m:
            $case:
              $copy: rule.match[2].node.entity
            $as: pascal
          'n':
            $case:
              $format: '{a}.{r}'
              $with:
                a:
                  $copy: id
                  $of: element
                r:
                  $copy: id
            $as: pascal
      expect:
        $map:
          $copy: rule.expect
        $using:
          absent: 0 件なら通す
          exists: 1 件以上なら通す
      message:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      text:
        $copy: message
      checkMode: count
      phase: before
      entity:
        $copy: target.entity
        $of: element
      countExpectation:
        $copy: rule.expect
      key:
        param: id
  - id: precondition
    when:
      - path: rule.match[1]
        exists: false
      - path: rule.match[0].node.entity
        equals:
          $copy: target.entity
          $of: element
    build:
      step: check
      precondition:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      by: Java（読んだ行）
      rule:
        $copy: rule.where
      message:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      text:
        $copy: message
      checkMode: current
      subjectAlias:
        $copy: rule.match[0].node.bind
      phase: before
      entity:
        $copy: target.entity
        $of: element
  - id: precondition
    build:
      step: check
      precondition:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      by: 手で書く（前提の形から写す規則が無い）
      rule:
        $copy: rule
      message:
        $format: '{a}.{r}'
        $with:
          a:
            $copy: id
            $of: element
          r:
            $copy: id
      text:
        $copy: message
      checkMode: unsupported
      phase: before
      entity:
        $copy: target.entity
        $of: element
  - id: writes
    build:
      $each: effects
      $bind: e
      $flatten: true
      $build:
        $concat:
          - $when:
              - path: op
                equals: create
            $then:
              $concat:
                - $when:
                    - path: numbering
                      exists: true
                  $then:
                    - call:
                        $format: '{n}Mapper.insert'
                        $with:
                          'n':
                            $case:
                              $copy: entity
                            $as: pascal
                      kind: insert
                      item:
                        $copy: numbering.path
                      value:
                        generated: numberedId
                - $each: written
                  $build:
                    $when:
                      - not:
                          path: base
                          oneOf:
                            - array
                            - object
                            - map
                    call:
                      $format: '{n}Mapper.insert'
                      $with:
                        'n':
                          $case:
                            $copy: entity
                            $of: e
                          $as: pascal
                    kind: insert
                    item:
                      $copy: key
                    value:
                      $copy: value
          - $when:
              - path: op
                equals: insert
              - path: field.item.entity
                exists: true
            $then:
              $concat:
                - $when:
                    - path: numbering
                      exists: true
                  $then:
                    - call:
                        $format: '{n}Mapper.insert'
                        $with:
                          'n':
                            $case:
                              $copy: field.item.entity
                            $as: pascal
                      kind: insert
                      item:
                        $copy: numbering.path
                      value:
                        generated: numberedId
                - $each: written
                  $build:
                    $when:
                      - not:
                          path: base
                          oneOf:
                            - array
                            - object
                            - map
                    call:
                      $format: '{n}Mapper.insert'
                      $with:
                        'n':
                          $case:
                            $copy: field.item.entity
                            $of: e
                          $as: pascal
                    kind: insert
                    item:
                      $copy: key
                    value:
                      $first:
                        - $when:
                            - path: key
                              equals:
                                $copy: numbering.path
                                $of: e
                          $then:
                            generated: numberedId
                        - $copy: value
                - $when:
                    - path: entity
                      notEquals:
                        $copy: field.item.entity
                  $then:
                    - call:
                        $format: '{n}Mapper.insert'
                        $with:
                          'n':
                            $case:
                              $copy: field.item.entity
                            $as: pascal
                      kind: insert
                      item:
                        $format: '{p}_id'
                        $with:
                          p:
                            $case:
                              $copy: entity
                            $as: snake
                      value: $$id
                    - call:
                        $format: '{n}Mapper.insert'
                        $with:
                          'n':
                            $case:
                              $copy: field.item.entity
                            $as: pascal
                      kind: insert
                      item: seq
                      value:
                        sequence:
                          call:
                            $format: '{n}Mapper.maxSeq'
                            $with:
                              'n':
                                $case:
                                  $copy: field.item.entity
                                $as: pascal
                          key:
                            param: id
          - $when:
              - or:
                  - path: op
                    equals: set
                  - path: op
                    equals: delete
              - not:
                  path: field.base
                  oneOf:
                    - array
                    - object
                    - map
            $then:
              - call:
                  $first:
                    - $when:
                        - of: element
                          path: creates
                          includes:
                            $copy: entity
                      $then:
                        $format: '{n}Mapper.insert'
                        $with:
                          'n':
                            $case:
                              $copy: entity
                            $as: pascal
                    - $format: '{n}Mapper.{m}'
                      $with:
                        'n':
                          $case:
                            $copy: entity
                          $as: pascal
                        m:
                          $case:
                            $copy: id
                            $of: element
                          $as: camel
                kind:
                  $first:
                    - $when:
                        - of: element
                          path: creates
                          includes:
                            $copy: entity
                      $then: insert
                    - update
                item:
                  $copy: field.key
                value:
                  $first:
                    - $copy: value
                    - null
                when:
                  $copy: when
                where:
                  $when:
                    - not:
                        of: element
                        path: creates
                        includes:
                          $copy: entity
                  $then:
                    - item: id
                      param:
                        $first:
                          - $when:
                              - path: entity
                                equals:
                                  $copy: target.entity
                                  $of: element
                            $then: id
                          - $format: '{e}Id'
                            $with:
                              e:
                                $case:
                                  $copy: entity
                                $as: camel
                      value:
                        $first:
                          - $when:
                              - of: element
                                path: creates
                                includes:
                                  $copy: entity
                            $then:
                              generated: numberedId
                          - $when:
                              - path: entity
                                equals:
                                  $copy: target.entity
                                  $of: element
                            $then:
                              param: id
                          - self:
                              $format: '{e}_id'
                              $with:
                                e:
                                  $case:
                                    $copy: entity
                                  $as: snake
                mode:
                  $when:
                    - path: op
                      equals: delete
                  $then: clear
          - $when:
              - path: op
                equals: insert
              - path: field.base
                equals: array
              - path: field.item.entity
                exists: false
            $then:
              - row:
                  $format: row-{i}
                  $with:
                    i: $index
                call:
                  $format: '{n}Mapper.insert{d}'
                  $with:
                    'n':
                      $case:
                        $copy: entity
                      $as: pascal
                    d:
                      $case:
                        $apply: effect-detail-name
                      $as: pascal
                kind: insert
                seq:
                  mode: next
                  call:
                    $format: '{n}Mapper.maxSeq{d}'
                    $with:
                      'n':
                        $case:
                          $copy: entity
                        $as: pascal
                      d:
                        $case:
                          $apply: effect-detail-name
                        $as: pascal
                  key:
                    $first:
                      - $when:
                          - of: element
                            path: creates
                            includes:
                              $copy: entity
                        $then:
                          generated: numberedId
                      - param: id
                values:
                  $entries:
                    $concat:
                      - - key:
                            $format: '{p}_id'
                            $with:
                              p:
                                $case:
                                  $copy: entity
                                $as: snake
                          value:
                            $first:
                              - $when:
                                  - of: element
                                    path: creates
                                    includes:
                                      $copy: entity
                                $then:
                                  generated: numberedId
                              - $$id
                      - $each: written
                        $build:
                          key:
                            $copy: key
                          value:
                            $copy: value
          # 並びの番号で指す効果（row）: 明細テーブルの並び順の列 seq で 1 行を指す。操作が受け取る番号（row）は、アプリでは seq の値。
          # 書き換えは、その 1 行の update（書くのは written の列だけ）。同じ行への書き換えは 1 つの update にまとめる
          - $when:
              - path: op
                equals: set
              - path: field.base
                equals: array
              - path: field.item.entity
                exists: false
              - path: row
                exists: true
            $then:
              $each: written
              $build:
                row:
                  $format: row-{f}-{p}-update
                  $with:
                    f:
                      $copy: field.key
                      $of: e
                    p:
                      $copy: row.param
                      $of: e
                call:
                  $format: '{n}Mapper.{m}{f}Row'
                  $with:
                    'n':
                      $case:
                        $copy: entity
                        $of: e
                      $as: pascal
                    m:
                      $case:
                        $copy: id
                        $of: element
                      $as: camel
                    f:
                      $case:
                        $copy: field.key
                        $of: e
                      $as: pascal
                kind: update
                item:
                  $copy: key
                value:
                  $copy: value
                when:
                  $copy: when
                  $of: e
                where:
                  - item:
                      $format: '{p}_id'
                      $with:
                        p:
                          $case:
                            $copy: entity
                            $of: e
                          $as: snake
                    param: id
                    value:
                      param: id
                  - item: seq
                    param:
                      $copy: row.param
                      $of: e
                    value:
                      param:
                        $copy: row.param
                        $of: e
                rowKey:
                  item: seq
                  param:
                    $copy: row.param
                    $of: e
                missing:
                  $format: 行が無ければ NotFoundException（error.notFound.{e}.{f}）
                  $with:
                    e:
                      $copy: entity
                      $of: e
                    f:
                      $copy: field.key
                      $of: e
                missingEntity:
                  $format: '{e}.{f}'
                  $with:
                    e:
                      $copy: entity
                      $of: e
                    f:
                      $copy: field.key
                      $of: e
          # 番号で指した 1 行の削除
          - $when:
              - path: op
                equals: delete
              - path: field.base
                equals: array
              - path: field.item.entity
                exists: false
              - path: row
                exists: true
            $then:
              - row:
                  $format: row-{i}-delete-row
                  $with:
                    i: $index
                call:
                  $format: '{n}Mapper.{m}{f}Row'
                  $with:
                    'n':
                      $case:
                        $copy: entity
                      $as: pascal
                    m:
                      $case:
                        $copy: id
                        $of: element
                      $as: camel
                    f:
                      $case:
                        $copy: field.key
                      $as: pascal
                kind: delete
                when:
                  $copy: when
                where:
                  - item:
                      $format: '{p}_id'
                      $with:
                        p:
                          $case:
                            $copy: entity
                          $as: snake
                    param: id
                    value:
                      param: id
                  - item: seq
                    param:
                      $copy: row.param
                    value:
                      param:
                        $copy: row.param
                rowKey:
                  item: seq
                  param:
                    $copy: row.param
                missing:
                  $format: 行が無ければ NotFoundException（error.notFound.{entity}.{field.key}）
                missingEntity:
                  $format: '{entity}.{field.key}'
          - $when:
              - path: op
                equals: set
              - path: field.base
                equals: array
              - path: field.item.entity
                exists: false
              - path: row
                exists: false
            $then:
              - row:
                  $format: row-{i}-delete
                  $with:
                    i: $index
                call:
                  $format: '{n}Mapper.delete{d}'
                  $with:
                    'n':
                      $case:
                        $copy: entity
                      $as: pascal
                    d:
                      $case:
                        $apply: effect-detail-name
                      $as: pascal
                kind: delete
                when:
                  $copy: when
                key:
                  $first:
                    - $when:
                        - of: element
                          path: creates
                          includes:
                            $copy: entity
                      $then:
                        generated: numberedId
                    - $when:
                        - path: entity
                          equals:
                            $copy: target.entity
                            $of: element
                      $then:
                        param: id
                    - self:
                        $format: '{e}_id'
                        $with:
                          e:
                            $case:
                              $copy: entity
                            $as: snake
              - row:
                  $format: row-{i}-insert
                  $with:
                    i: $index
                call:
                  $format: '{n}Mapper.insert{d}'
                  $with:
                    'n':
                      $case:
                        $copy: entity
                      $as: pascal
                    d:
                      $case:
                        $apply: effect-detail-name
                      $as: pascal
                kind: insert
                each:
                  $copy: value
                seq:
                  mode: position
                  start: 1
                when:
                  $copy: when
                ownerKey:
                  $first:
                    - $when:
                        - of: element
                          path: creates
                          includes:
                            $copy: entity
                      $then:
                        generated: numberedId
                    - $when:
                        - path: entity
                          equals:
                            $copy: target.entity
                            $of: element
                      $then:
                        param: id
                    - self:
                        $format: '{e}_id'
                        $with:
                          e:
                            $case:
                              $copy: entity
                            $as: snake
          - $when:
              - or:
                  - path: op
                    equals: create
                  - path: field.item.entity
                    exists: true
              - or:
                  - path: op
                    equals: create
                  - path: op
                    equals: insert
            $then:
              $each: written
              $build:
                $when:
                  - path: base
                    equals: array
                  - path: item.entity
                    exists: false
                  - path: value
                    empty: false
                row:
                  $format: row-{k}
                  $with:
                    k:
                      $copy: key
                call:
                  $format: '{n}Mapper.insert{d}'
                  $with:
                    'n':
                      $case:
                        $first:
                          - $copy: field.item.entity
                            $of: e
                          - $copy: entity
                            $of: e
                      $as: pascal
                    d:
                      $case:
                        $format: '{t}_{k}'
                        $with:
                          t:
                            $case:
                              $first:
                                - $copy: field.item.entity
                                  $of: e
                                - $copy: entity
                                  $of: e
                            $as: snake
                          k:
                            $copy: key
                      $as: pascal
                kind: insert
                each:
                  $copy: value
                seq:
                  mode: position
                  start: 1
                ownerKey:
                  generated: numberedId
          - $when:
              - path: op
                equals: delete
              - path: field.base
                equals: array
              - path: field.item.entity
                exists: false
              - path: row
                exists: false
            $then:
              - row:
                  $format: row-{i}-clear
                  $with:
                    i: $index
                call:
                  $format: '{n}Mapper.delete{d}'
                  $with:
                    'n':
                      $case:
                        $copy: entity
                      $as: pascal
                    d:
                      $case:
                        $apply: effect-detail-name
                      $as: pascal
                kind: delete
                when:
                  $copy: when
                key:
                  $first:
                    - $when:
                        - of: element
                          path: creates
                          includes:
                            $copy: entity
                      $then:
                        generated: numberedId
                    - $when:
                        - path: entity
                          equals:
                            $copy: target.entity
                            $of: element
                      $then:
                        param: id
                    - self:
                        $format: '{e}_id'
                        $with:
                          e:
                            $case:
                              $copy: entity
                            $as: snake
  - id: effect-detail-name
    build:
      $format: '{t}_{k}'
      $with:
        t:
          $case:
            $copy: entity
          $as: snake
        k:
          $copy: field.key
  # データの決まりは、業務モデルではなく、基本設計の「データの決まり」（design/basic/final/rules.yaml）から読む（ADR-0042）。
  # 確定した決まりを designRules として重ね、この定義の中では designRules を読む
  - id: model-input
    with:
      - row
      - operations
      - rules
    build:
      $apply: model-with-rules
      $with:
        composed:
          $compose:
            derived:
              - id: model
                value:
                  $copy: values.model
                  $of: row
                source:
                  id: system-model
            additions: []
            changes:
              - target: model
                set:
                  # 業務モデルの操作ではなく、基本設計の「操作」の項目一覧を解いたもの（basic-operations-resolved）
                  designActions:
                    $copy: values.actions
                    $of: operations
                  designRules:
                    $each: .
                    $of: rules
                    $build:
                      id:
                        $copy: source
                      level:
                        $copy: level
                      form:
                        $copy: form
                      kind:
                        $copy: kind
                      entity:
                        $copy: subject
                      at:
                        $copy: at
                      rule:
                        $copy: rule
                      fields:
                        $when:
                          - path: fields
                            exists: true
                        $then:
                          $each: fields
                          $build:
                            entity:
                              $copy: subject
                            key:
                              $copy: key
                            multiple:
                              $copy: multiple
                priority: individual
                source:
                  id: basic-rules
  - id: model-with-rules
    with:
      - composed
    build:
      $copy: records[0].value
      $of: composed
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
  - id: state-field
    with:
      - row
    build:
      $copy: values.record.stateFields[0]
      $of: row
  - id: state-allowed
    with:
      - row
      - action
    build:
      $each: values.record.transitions
      $of: row
      $flatten: true
      $build:
        $when:
          - path: action
            equals:
              $copy: .
              $of: action
        $then:
          $copy: from
