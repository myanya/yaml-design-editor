id: application-output-plan
name: 固定出力と行モデルの出力単位を確定する
scope: design
dependsOn:
  - application-configuration
  - application-data-model
  - application-access
  - application-runtime-model
  - application-process-gate
  - application-service-bindings
  - application-service-programs
  - application-theme
  - screen-styles
  - application-web-forms
  - application-web-bindings
  - application-web
output: design/detail/final/application-output-plan.yaml
build:
  id: APP-output-plan
  outputs:
    $concat:
      - - id: OUTPUT-settings
          report: app-settings
          params: {}
        - id: OUTPUT-build
          report: app-build
          params: {}
        - id: OUTPUT-gradle-properties
          report: app-gradle-properties
          params: {}
        - id: OUTPUT-main
          report: app-main
          params: {}
        - id: OUTPUT-properties
          report: app-properties
          params: {}
        - id: OUTPUT-test
          report: app-test
          params: {}
        - id: OUTPUT-gitignore
          report: app-gitignore
          params: {}
        - id: OUTPUT-readme
          report: app-readme
          params: {}
        - id: OUTPUT-wrapper-properties
          report: app-wrapper-properties
          params: {}
      - $each:
          $view: application-row-model-input
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-row-model
          params:
            model:
              $copy: id
      - $each:
          $view: application-access-input
        $flatten: true
        $build:
          $concat:
            - - id:
                  $format: OUTPUT-JAVA-{id}
                report: app-mapper
                params:
                  mapper:
                    $copy: id
            - - id:
                  $format: OUTPUT-XML-{id}
                report: app-mapper-xml
                params:
                  mapper:
                    $copy: id
      - - id: OUTPUT-app-schema
          report: ddl
          params: {}
          destination: app/src/main/resources/schema.sql
      - $each:
          $view: application-state-input
        $build:
          id:
            $format: OUTPUT-{id}
            $with:
              id:
                $copy: id
          report: app-status
          params:
            runtime:
              $copy: id
      - $each:
          $view: application-exception-input
        $build:
          id:
            $format: OUTPUT-{id}
            $with:
              id:
                $copy: id
          report: app-exception
          params:
            runtime:
              $copy: id
      - - id: OUTPUT-business-violation
          report: app-business-violation
          params: {}
      - $each:
          $view: application-service-inputs-input
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-service-input
          params:
            operation:
              $copy: id
      - - id: OUTPUT-operation-runner
          report: app-operation-runner
          params: {}
        - id: OUTPUT-sequence-numbers
          report: app-sequence-numbers
          params: {}
      - - id: OUTPUT-service-checks
          report: app-service-checks
          params: {}
        - id: OUTPUT-operation-outcome
          report: app-operation-outcome
          params: {}
      - $each:
          $view: application-service-programs-input
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-service
          params:
            service:
              $copy: id
      - - id: OUTPUT-app-theme-css
          report: app-theme-css
          params: {}
        - id: OUTPUT-app-design-preview
          report: app-design-preview
          params: {}
        - id: OUTPUT-app-design-preview-controller
          report: app-design-preview-controller
          params: {}
      - $each:
          $view: application-web-forms-input
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-web-form
          params:
            form:
              $copy: id
      - - id: OUTPUT-app-web-binding
          report: app-web-binding
          params: {}
        - id: OUTPUT-app-validation-messages
          report: app-validation-messages
          params: {}
      - $each:
          $view: application-web-bindings-input
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-web-operation
          params:
            webOperation:
              $copy: id
      - $each:
          $view: application-web-pages-input
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-web-page
          params:
            page:
              $copy: id
      - - id: OUTPUT-app-web-model
          report: app-web-model
          params: {}
        - id: OUTPUT-app-business-fragments
          report: app-business-fragments
          params: {}
        - id: OUTPUT-app-web-runtime
          report: app-web-runtime
          params: {}
        - id: OUTPUT-app-web-page-model
          report: app-web-page-model
          params: {}
        - id: OUTPUT-app-web-catalog
          report: app-web-catalog
          params: {}
        - id: OUTPUT-app-web-reads
          report: app-web-reads
          params: {}
        - id: OUTPUT-app-web-actions
          report: app-web-actions
          params: {}
        - id: OUTPUT-app-web-errors
          report: app-web-errors
          params: {}
        - id: OUTPUT-app-error-page
          report: app-error-page
          params: {}
      - $each:
          $view: application-web-controllers-input
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-controller
          params:
            controller:
              $copy: id
      - $each:
          $view: application-web-read-services-input
          $where:
            - path: values.record.standalone
              equals: true
        $build:
          id:
            $format: OUTPUT-{id}
          report: app-read-service
          params:
            reader:
              $copy: id
