id: system-final
name: 全設計書の確定前検査
scope: design
dependsOn:
  - dashboard-flows
  - error-handling
  - processes
  - screen-designs-details
  - screen-designs-lists
  - screen-designs-operations
  - screen-flows
  - screen-styles
  - screen-transitions
  - session-design
  - detail-tables
  - basic-types
  - basic-entities
output: design/detail/composed/review.yaml
input:
  $apply: validate-system
  $with:
    schemas:
      $each: schemas
      $of: model
      $build:
        $when:
          - path: id
            notEquals: design-coverage
        $then:
          $copy: declared
    documents:
      $each:
        $view: system-final-documents
      $build:
        $copy: values.record
    business:
      $view: system-model-input
      $one: true
build:
  id: SYS-system-review
  status: validated
  documents:
    $each:
      $view: system-final-documents
    $build:
      id:
        $copy: id
      kind:
        $copy: values.record.designKind
      source:
        $copy: values.record.id
      path:
        $copy: values.record.designPath
  inputs:
    corrections:
      $each:
        $view: system-corrections-input
      $build:
        $copy: values.correction
    specifications:
      $each:
        $view: system-specifications-input
      $build:
        $copy: values.specification
    additions:
      $each:
        $view: system-additions-input
      $build:
        $copy: values.addition
rules:
  - id: validate-system
    with:
      - schemas
      - documents
      - business
    build:
      $validate:
        schemas:
          $concat:
            - $copy: .
              $of: schemas
            - $each: values.model.schemas
              $of: business
              $build:
                $copy: declared
        views:
          $copy: values.model.viewDefinitions
          $of: business
        documents:
          $entries:
            $concat:
              - $each:
                  $view: system-final-documents
                $build:
                  key:
                    $copy: values.record.designPath
                  value:
                    $copy: values.record
              - - key: design/basic/final/entities.yaml
                  value:
                    entities:
                      $each:
                        $view: basic-model-entities
                      $build:
                        $copy: values.record
                - key: design/basic/final/types.yaml
                  value:
                    types:
                      $each:
                        $view: basic-model-types
                      $build:
                        $copy: values.record
                - key: design/basic/final/classes.yaml
                  value:
                    classes:
                      $each:
                        $view: system-classes-input
                      $build:
                        $copy: values.record
                - key: design/detail/final/tables.yaml
                  value:
                    $apply: record-row
                    $with:
                      row:
                        $view: physical-final-input
                        $one: true
                - key: design/basic/inputs/documents/corrections.yaml
                  value:
                    $apply: record-row
                    $with:
                      row:
                        $view: basic-document-corrections
                        $one: true
                - key: design/basic/inputs/documents/additions.yaml
                  value:
                    $apply: record-row
                    $with:
                      row:
                        $view: basic-document-additions
                        $one: true
                - key: design/detail/inputs/documents/corrections.yaml
                  value:
                    $apply: record-row
                    $with:
                      row:
                        $view: detail-document-corrections
                        $one: true
                - key: design/detail/inputs/documents/additions.yaml
                  value:
                    $apply: record-row
                    $with:
                      row:
                        $view: detail-document-additions
                        $one: true
                - key: design/detail/composed/documents/finalization-gate.yaml
                  value:
                    $apply: gate
                    $with:
                      documents:
                        $copy: .
                        $of: documents
  - id: record-row
    with:
      - row
    build:
      $copy: values.record
      $of: row
  - id: gate
    with:
      - documents
    build:
      id: GATE-system-final
      documents:
        $each: .
        $of: documents
        $build:
          $copy: designId
      identities:
        $concat:
          - $each:
              $view: dashboard-flows-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: error-handling-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: processes-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: screen-designs-details-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: screen-designs-lists-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: screen-designs-operations-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: screen-flows-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: screen-styles-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: screen-transitions-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
          - $each:
              $view: session-design-derived-input
            $bind: derived
            $build:
              $when:
                - path: values.record.value
                  exists: true
              $then:
                target:
                  $copy: values.record.id
                expected:
                  $copy: values.record.value.id
                actual:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: documents
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: values.record.id
                              $of: derived
                        $then:
                          $copy: id
      pending:
        $concat:
          - $each:
              $view: system-corrections-input
            $flatten: true
            $build:
              $apply: pending-keys
              $with:
                input:
                  $copy: values.correction
                value:
                  $copy: values.correction.set
                reserved:
                  - id
                  - designId
                  - designKind
                  - designPath
                  - origins
                  - originalRoutes
                  - originalService
                  - methodId
                  - originalName
                  - role
          - $each:
              $view: system-specifications-input
            $flatten: true
            $build:
              $apply: pending-keys
              $with:
                input:
                  $copy: values.specification
                value:
                  $copy: values.specification.settings
                reserved:
                  - id
                  - designId
                  - designKind
                  - designPath
                  - origins
                  - originalRoutes
                  - originalService
                  - methodId
                  - originalName
                  - role
          - $each:
              $view: system-corrections-input
            $bind: correction
            $flatten: true
            $build:
              $each: values.correction.changes
              $build:
                $when:
                  - path: path[0]
                    oneOf:
                      - id
                      - designId
                      - designKind
                      - designPath
                      - origins
                      - originalRoutes
                      - originalService
                      - methodId
                      - originalName
                      - role
                $then:
                  input:
                    $copy: id
                    $of: correction
                  path:
                    $copy: path
                  reason: 識別子と導出記録は変更できません
          - $each:
              $view: system-additions-input
            $build:
              $when:
                - path: values.addition.collection
                  exists: true
              $then:
                $apply: pending-addition
                $with:
                  input:
                    $copy: values.addition
                  document:
                    $apply: contract-first
                    $with:
                      matches:
                        $each: .
                        $of: documents
                        $build:
                          $when:
                            - path: designId
                              equals:
                                $copy: values.addition.target
                                $of: addition
                          $then:
                            $copy: .
            $bind: addition
          - $each:
              $view: system-corrections-input
            $bind: correction
            $flatten: true
            $build:
              $each: values.correction.changes
              $bind: change
              $flatten: true
              $build:
                $each: path
                $build:
                  $when:
                    - path: .
                      oneOf:
                        - designId
                        - designKind
                        - designPath
                        - origins
                        - originalRoutes
                        - originalService
                        - methodId
                        - originalName
                  $then:
                    input:
                      $copy: id
                      $of: correction
                    path:
                      $copy: path
                      $of: change
                    reason: 導出時の識別子や来歴は変更できません
      inputs: []
      consistency:
        $concat:
          - $each: .
            $of: documents
            $flatten: true
            $build:
              $when:
                - path: designKind
                  equals: screen-flows
              $then:
                $each: handlers
                $build:
                  $apply: check-form
                  $with:
                    handler:
                      $copy: .
                    design:
                      $apply: contract-first
                      $with:
                        matches:
                          $each: .
                          $of: documents
                          $build:
                            $when:
                              - path: designKind
                                equals: screen-designs-operations
                              - path: id
                                equals:
                                  $copy: action
                                  $of: handler
                            $then:
                              $copy: .
                $bind: handler
          - $each:
              $view: screen-flows-derived-input
            $build:
              $apply: check-attribute
              $with:
                subject:
                  $copy: values.record.id
                attribute: controller
                expected:
                  $first:
                    - $copy: values.record.value.controller
                    - unset: true
                actual:
                  $first:
                    - $apply: contract-first
                      $with:
                        matches:
                          $each: .
                          $of: documents
                          $build:
                            $when:
                              - path: designId
                                equals:
                                  $copy: values.record.id
                                  $of: derived
                            $then:
                              $copy: controller
                    - unset: true
            $bind: derived
          - $each:
              $view: dashboard-flows-derived-input
            $build:
              $apply: check-attribute
              $with:
                subject:
                  $copy: values.record.id
                attribute: controller
                expected:
                  $first:
                    - $copy: values.record.value.controller
                    - unset: true
                actual:
                  $first:
                    - $apply: contract-first
                      $with:
                        matches:
                          $each: .
                          $of: documents
                          $build:
                            $when:
                              - path: designId
                                equals:
                                  $copy: values.record.id
                                  $of: derived
                            $then:
                              $copy: controller
                    - unset: true
            $bind: derived
          - $each:
              $view: screen-designs-operations-derived-input
            $build:
              $apply: check-attribute
              $with:
                subject:
                  $copy: values.record.id
                attribute: form.class
                expected:
                  $first:
                    - $copy: values.record.value.form.class
                    - unset: true
                actual:
                  $first:
                    - $apply: contract-first
                      $with:
                        matches:
                          $each: .
                          $of: documents
                          $build:
                            $when:
                              - path: designId
                                equals:
                                  $copy: values.record.id
                                  $of: derived
                            $then:
                              $copy: form.class
                    - unset: true
            $bind: derived
  - id: pending-keys
    with:
      - input
      - value
      - reserved
    build:
      $eachEntry: .
      $of: value
      $flatten: true
      $build:
        - $when:
            - path: $key
              oneOf:
                - id
                - designId
                - designKind
                - designPath
                - origins
                - originalRoutes
                - originalService
                - methodId
                - originalName
                - role
          $then:
            input:
              $copy: id
              $of: input
            attribute: $key
            reason: 識別子と導出記録は変更できません
  - id: pending-addition
    with:
      - input
      - document
    build:
      $first:
        - $when:
            - path: kind
              of: input
              equals: dashboard-flows
            - not:
                of: input
                path: collection
                oneOf:
                  - screens
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: error-handling
            - not:
                of: input
                path: collection
                oneOf:
                  - exceptions
                  - refusals
                  - screens
                  - settings
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: processes
            - not:
                of: input
                path: collection
                oneOf:
                  - confirm
                  - steps
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: screen-designs-details
            - not:
                of: input
                path: collection
                oneOf:
                  - screens
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: screen-designs-lists
            - not:
                of: input
                path: collection
                oneOf:
                  - screens
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: screen-designs-operations
            - not:
                of: input
                path: collection
                oneOf:
                  - screens
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: screen-flows
            - not:
                of: input
                path: collection
                oneOf:
                  - screens
                  - handlers
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: screen-styles
            - not:
                of: input
                path: collection
                oneOf:
                  - naming
                  - classes
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: screen-transitions
            - not:
                of: input
                path: collection
                oneOf:
                  - screens
                  - transitions
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
        - $when:
            - path: kind
              of: input
              equals: session-design
            - not:
                of: input
                path: collection
                oneOf:
                  - attributes
                  - notKept
          $then:
            input:
              $copy: id
              $of: input
            collection:
              $copy: collection
              $of: input
            reason: このコレクションへの追加には対応していません
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: check-attribute
    with:
      - subject
      - attribute
      - expected
      - actual
    build:
      $apply: checked-value
      $with:
        result:
          $compose:
            derived:
              - id: value
                value:
                  checked: true
                source:
                  id: consistency
            additions: []
            changes:
              - target: value
                set:
                  value:
                    $copy: .
                    $of: expected
                priority: rule
                source:
                  id:
                    $format: '{subject}.{attribute}.expected'
                    $with:
                      subject:
                        $copy: .
                        $of: subject
                      attribute:
                        $copy: .
                        $of: attribute
              - target: value
                set:
                  value:
                    $copy: .
                    $of: actual
                priority: rule
                source:
                  id:
                    $format: '{subject}.{attribute}.actual'
                    $with:
                      subject:
                        $copy: .
                        $of: subject
                      attribute:
                        $copy: .
                        $of: attribute
  - id: check-form
    with:
      - handler
      - design
    build:
      $apply: check-attribute
      $with:
        subject:
          $copy: action
          $of: handler
        attribute: form
        expected:
          $first:
            - $copy: form.class
              $of: design
            - unset: true
        actual:
          $first:
            - $copy: form
              $of: handler
            - unset: true
  - id: checked-value
    with:
      - result
    build:
      $copy: records[0].value.checked
      $of: result
