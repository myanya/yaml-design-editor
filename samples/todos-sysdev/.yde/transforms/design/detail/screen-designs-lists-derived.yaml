id: screen-designs-lists-derived
name: 画面設計書（一覧画面）
description: >-
  詳細設計。ダッシュボードごとに、一覧画面の部品の木（page・notice・filters・actions・section・table・matrix）を 1 本にする。 HTML の手前の形で、③で Thymeleaf のテンプレートに機械的に写す。決め打ちの規則:
  絞り込みは GET のフォーム（共有の入力と、区画が基準日を使えば基準日）・ 上部の操作はボタン（操作の最初の画面へ）・区画は群ごとの見出しの下に、件数つきの見出しと表（行の ID は詳細へ・行の右に操作のボタン）か集計 （セルは、その行と列で絞った一覧へ）・行が 0
  件なら表の代わりに「該当する…はありません」（正常。メッセージのキー list.empty.型）・ 読み出しは区画ごとの Mapper の select と count
scope: business
each: dashboards
output: design/detail/derived/documents/screen-designs-lists/{id}.yaml
dependsOn:
  - system-actions-model
  - basic-operations-resolved
  - messages
  - screen-lists
  - screen-styles
  - detail-document-input-gate
  - system-screen-bindings
  - system-access-bindings
input:
  $apply: screen-model
  $with:
    original:
      $apply: model-input
      $with:
        row:
          $view: system-actions-model-input
          $one: true
        operations:
          $view: basic-operations-resolved-input
          $one: true
    documents:
      $each:
        $view: screen-lists-input
      $build:
        $copy: values.record
build:
  id:
    $format: DRV-document-screen-designs-lists.{id}
  record:
    id:
      $format: DOC-screen-designs-lists.{id}
    value:
      $apply: linked-document
      $with:
        document:
          id:
            $copy: id
          name:
            $format: '{label}（画面設計書）'
          screens:
            - id:
                $copy: id
              template:
                $format: '{id}/list'
              page:
                title:
                  $copy: label
                width: l
                body:
                  $concat:
                    - - notice:
                          kind: done
                    - - filters:
                          action:
                            $apply: list-url
                          body:
                            $concat:
                              - $each: inputs
                                $apply: input-field
                              - $when:
                                  - path: usesToday
                                    equals: true
                                $then:
                                  - field:
                                      item: date
                                      label: 基準日
                                      control: date
                                      width: 10ch
                                      default: 今日
                              - - actions:
                                    - label: 絞る
                                      kind: submit
                                      emphasis: primary
                                    - label: 戻す
                                      kind: link
                                      to:
                                        $apply: list-url
                                      emphasis: secondary
                    - - actions:
                          $each: actions
                          $bind: aid
                          $flatten: true
                          $build:
                            $each: designActions
                            $of: model
                            $build:
                              $when:
                                - path: id
                                  equals:
                                    $copy: .
                                    $of: aid
                              $then:
                                $apply: button
                    - $group: sections
                      $by:
                        $first:
                          - $copy: group
                          - その他
                      $build:
                        section:
                          title:
                            $copy: key
                          gap: l
                          body:
                            $each: items
                            $bind: sec
                            $flatten: true
                            $build:
                              $each: views
                              $of: model
                              $bind: v
                              $flatten: true
                              $build:
                                $when:
                                  - path: id
                                    equals:
                                      $copy: view
                                      $of: sec
                                $then:
                                  - section:
                                      id:
                                        $copy: id
                                        $of: sec
                                      title:
                                        $copy: label
                                        $of: sec
                                      count:
                                        $format: '{m}Mapper.count{d}{s}'
                                        $with:
                                          m:
                                            $case:
                                              $copy: rows
                                            $as: pascal
                                          d:
                                            $case:
                                              $copy: id
                                              $of: element
                                            $as: pascal
                                          s:
                                            $case:
                                              $copy: id
                                              $of: sec
                                            $as: pascal
                                      body:
                                        - $first:
                                            - $when:
                                                - path: kind
                                                  equals: matrix
                                              $then:
                                                matrix:
                                                  read:
                                                    $format: '{m}Mapper.select{d}{s}'
                                                    $with:
                                                      m:
                                                        $case:
                                                          $copy: rows
                                                        $as: pascal
                                                      d:
                                                        $case:
                                                          $copy: id
                                                          $of: element
                                                        $as: pascal
                                                      s:
                                                        $case:
                                                          $copy: id
                                                          $of: sec
                                                        $as: pascal
                                                  rows:
                                                    entity:
                                                      $copy: rows
                                                    link:
                                                      to:
                                                        $copy: rows
                                                  columns:
                                                    $each: columns.values
                                                    $build:
                                                      $copy: label
                                                  cell:
                                                    link:
                                                      to:
                                                        $copy: id
                                                        $of: element
                                                      by: その行と列で絞る（URL のパラメータ）
                                                    align: end
                                                  totals:
                                                    $first:
                                                      - $when:
                                                          - path: unclassified
                                                            equals: false
                                                        $then: 行と列の合計
                                                      - 行と列の合計と未分類
                                                  empty:
                                                    $format: list.empty.{r}
                                                    $with:
                                                      r:
                                                        $copy: rows
                                            - table:
                                                read:
                                                  $format: '{m}Mapper.select{d}{s}'
                                                  $with:
                                                    m:
                                                      $case:
                                                        $copy: rows
                                                      $as: pascal
                                                    d:
                                                      $case:
                                                        $copy: id
                                                        $of: element
                                                      $as: pascal
                                                    s:
                                                      $case:
                                                        $copy: id
                                                        $of: sec
                                                      $as: pascal
                                                empty:
                                                  $format: list.empty.{r}
                                                  $with:
                                                    r:
                                                      $copy: rows
                                                columns:
                                                  $concat:
                                                    - - label: ID
                                                        item: id
                                                        link:
                                                          to:
                                                            $copy: rows
                                                    - $each: columns
                                                      $build:
                                                        label:
                                                          $copy: label
                                                        item:
                                                          $copy: path
                                                        computed:
                                                          $copy: computed
                                                        format:
                                                          $first:
                                                            - $copy: field.format
                                                            - $copy: field.item.format
                                                        labels:
                                                          $when:
                                                            - path: field.base
                                                              equals: enum
                                                          $then:
                                                            $copy: field.values
                                                        link:
                                                          $first:
                                                            - $when:
                                                                - path: field.base
                                                                  equals: ref
                                                              $then:
                                                                to:
                                                                  $copy: field.target
                                                                name:
                                                                  $copy: field.targetTitle
                                                            - $when:
                                                                - path: field.item.base
                                                                  equals: ref
                                                              $then:
                                                                to:
                                                                  $copy: field.item.target
                                                                name:
                                                                  $copy: field.item.targetTitle
                                                                many: true
                                                rowActions:
                                                  $each: designActions
                                                  $of: model
                                                  $build:
                                                    $when:
                                                      - path: target.entity
                                                        equals:
                                                          $copy: rows
                                                          $of: v
                                                      # 並びの 1 件を番号で指す操作は、行が決まる所（詳細画面のその並びの表）にだけ出す
                                                      - path: rowOf
                                                        exists: false
                                                    $then:
                                                      $apply: button
        bindings:
          $concat:
            - $each:
                $view: system-screen-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
            - $each:
                $view: system-access-bindings-input
              $flatten: true
              $build:
                $copy: values.bindings
        messages:
          $each:
            $view: messages-input
          $flatten: true
          $build:
            $copy: values.record.messages
    source:
      id: rule-screen-designs-lists
      document: .yde/transforms/design/detail/screen-designs-lists-derived.yaml
rules:
  - id: list-url
    when:
      - path: default
        equals: true
    build: GET /
  - id: list-url
    build:
      $format: GET /{id}
  - id: input-field
    when:
      - path: field.base
        equals: ref
      - path: multiple
        equals: true
    build:
      choices:
        item:
          $copy: key
        label:
          $copy: label
        control: checkboxes
        candidates:
          $apply: candidates
  - id: input-field
    when:
      - path: field.base
        equals: ref
    build:
      field:
        item:
          $copy: key
        label:
          $copy: label
        control: select
        candidates:
          $apply: candidates
  - id: input-field
    when:
      - path: field.base
        equals: date
    build:
      field:
        item:
          $copy: key
        label:
          $copy: label
        control: date
        width: 10ch
  - id: input-field
    when:
      - path: field.base
        equals: enum
    build:
      field:
        item:
          $copy: key
        label:
          $copy: label
        control: select
        values:
          $copy: field.values
  - id: input-field
    build:
      field:
        item:
          $copy: key
        label:
          $copy: label
        control: text
        width: 20ch
  - id: candidates
    build:
      entity:
        $copy: field.target
      name:
        $copy: field.targetTitle
      read:
        $format: '{n}Mapper.selectAll'
        $with:
          'n':
            $case:
              $copy: field.target
            $as: pascal
      empty: 未選択（絞らない）
  - id: button
    build:
      operation:
        $copy: id
      label:
        $copy: label
      kind: link
      to:
        $first:
          - $when:
              - path: inputParams
                empty: false
            $then:
              $format: GET {u}
              $with:
                u:
                  $apply: url
          - $format: GET {u}/confirm
            $with:
              u:
                $apply: url
      from:
        $copy: id
        $of: element
      emphasis: secondary
      shownWhen:
        $apply: shown-when
  - id: url
    when:
      - path: target.entity
        exists: true
    build:
      $format: /{t}/{k}/{a}
      $with:
        t:
          $copy: subject
        k: '{id}'
        a:
          $copy: id
  - id: url
    build:
      $format: /{t}/{a}
      $with:
        t:
          $copy: subject
        a:
          $copy: id
  - id: shown-when
    when:
      - path: lifecycle.transitions
        exists: true
    build:
      $each: lifecycle.transitions
      $flatten: true
      $build:
        $each: from
        $build:
          $copy: value
  - id: shown-when
    build: いつも
  # 業務モデルの操作ではなく、基本設計の「操作」の項目一覧を解いたもの（basic-operations-resolved）を designActions として重ねて読む
  - id: model-input
    with:
      - row
      - operations
    build:
      $apply: model-with-operations
      $with:
        composed:
          $compose:
            derived:
              - id: model
                value:
                  $copy: values.model
                  $of: row
                source:
                  id: system-actions-model
            additions: []
            changes:
              - target: model
                set:
                  designActions:
                    $copy: values.actions
                    $of: operations
                priority: individual
                source:
                  id: basic-operations
  - id: model-with-operations
    with:
      - composed
    build:
      $copy: records[0].value
      $of: composed
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
  - id: screen-model
    with:
      - original
      - documents
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: original
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  dashboards:
                    $each: dashboards
                    $of: original
                    $bind: item
                    $build:
                      $apply: screen-source
                      $with:
                        original:
                          $copy: .
                        document:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: .
                              $of: documents
                              $build:
                                $when:
                                  - path: id
                                    equals:
                                      $copy: id
                                      $of: item
                                $then:
                                  $copy: .
                priority: individual
                source:
                  id: contract
  - id: screen-source
    with:
      - original
      - document
    when:
      - path: .
        of: document
        exists: true
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: original
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  label:
                    $copy: name
                    $of: document
                  inputs:
                    $each: inputs
                    $of: original
                    $bind: input
                    $build:
                      $apply: screen-parameter
                      $with:
                        parameter:
                          $copy: .
                        value:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: filters
                              $of: document
                              $build:
                                $when:
                                  - path: key
                                    equals:
                                      $copy: key
                                      $of: input
                                $then:
                                  $copy: .
                  sections:
                    $each: sections
                    $of: original
                    $bind: section
                    $build:
                      $apply: screen-parameter
                      $with:
                        parameter:
                          $copy: .
                        value:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: sections
                              $of: document
                              $build:
                                $when:
                                  - path: id
                                    equals:
                                      $copy: id
                                      $of: section
                                $then:
                                  label:
                                    $copy: label
                                  group:
                                    $copy: group
                priority: individual
                source:
                  id: contract
  - id: screen-source
    with:
      - original
      - document
    build:
      $copy: .
      $of: original
  - id: screen-parameter
    with:
      - parameter
      - value
    build:
      $apply: screen-update
      $with:
        record:
          $copy: .
          $of: parameter
        set:
          $copy: .
          $of: value
  - id: screen-update
    with:
      - record
      - set
    when:
      - of: set
        path: .
        empty: false
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: record
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  $copy: .
                  $of: set
                priority: individual
                source:
                  id: contract
  - id: screen-update
    with:
      - record
      - set
    build:
      $copy: .
      $of: record
