id: application-data-model
name: 確定した物理列から Java の行モデルを確定する
scope: design
dependsOn:
  - detail-tables
  - application-java-types
output: design/detail/final/application-data-model.yaml
input:
  models:
    $apply: models
    $with:
      tables:
        $view: application-tables-input
        $one: true
      types:
        $view: application-java-types-input
        $one: true
  contracts:
    $each: schemas
    $of: model
    $build:
      $when:
        - path: id
          oneOf:
            - application-java-type-values
            - application-data-model
      $then:
        $copy: declared
build:
  $apply: validated-result
  $with:
    documents:
      $validate:
        schemas:
          $copy: contracts
        documents:
          design/detail/final/application-data-model.yaml:
            id: APP-data-model
            models:
              $copy: models
rules:
  - id: models
    with:
      - tables
      - types
    build:
      $each: values.record.tables
      $of: tables
      $bind: table
      $build:
        id:
          $format: JROW-{originalName}
        tableId:
          $copy: id
        table:
          $copy: name
        className:
          $format: '{n}Row'
          $with:
            'n':
              $case:
                $copy: originalName
              $as: pascal
        columns:
          $each: columns
          $build:
            $apply: column
            $with:
              column:
                $copy: .
              row:
                $view: application-columns-input
                $where:
                  - path: id
                    equals:
                      $copy: id
                      $of: columnSource
                $one: true
              types:
                $copy: values.record.mappings
                $of: types
          $bind: columnSource
  - id: column
    with:
      - column
      - row
      - types
    build:
      id:
        $format: JCOL-{id}
        $with:
          id:
            $copy: id
            $of: column
      source:
        $copy: id
        $of: column
      column:
        $copy: name
        $of: column
      name:
        $case:
          $copy: name
          $of: column
        $as: camel
      accessor:
        $case:
          $copy: name
          $of: column
        $as: pascal
      java:
        $apply: first
        $with:
          matches:
            $each: .
            $of: types
            $build:
              $when:
                - path: base
                  equals:
                      $copy: base
                      $of: column
              $then:
                $copy: .
      sql:
        $copy: values.sql
        $of: row
      default:
        $apply: default
        $with:
          column:
            $copy: .
            $of: column
          row:
            $copy: .
            $of: row
  - id: first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  # 初期値は列が運んでいる（空文字・false・0 も値）。出力方法は型対応（同じ詳細設計の項目）から
  - id: default
    with:
      - column
      - row
    when:
      - path: default
        of: column
        exists: true
    build:
      value:
        $copy: default
        $of: column
      literal:
        $copy: values.literal
        $of: row
  - id: validated-result
    with:
      - documents
    build:
      $apply: first
      $with:
        matches:
          $eachEntry: .
          $of: documents
          $flatten: true
          $build:
            - $copy: .
