id: application-service-inputs
name: 確定した操作と処理から Service の引数を確定する
scope: design
dependsOn:
  - detail-processes
  - application-java-types
  - basic-messages
output: design/detail/final/application-service-inputs.yaml
input:
  operations:
    $each:
      $view: detail-model-processes
    $build:
      $apply: operation
      $with:
        process:
          $apply: process-document
          $at: values.record
        types:
          $view: application-java-types-input
          $where: []
          $one: true
    $bind: processRow
  contracts:
    $each: schemas
    $of: model
    $build:
      $when:
        - path: id
          equals: application-service-inputs
      $then:
        $copy: declared
build:
  $apply: validated
  $with:
    documents:
      $validate:
        schemas:
          $copy: contracts
        documents:
          design/detail/final/application-service-inputs.yaml:
            id: APP-service-inputs
            operations:
              $copy: operations
rules:
  # ---- 処理の手順のレコード（PRC-・STP-）を読む入力アダプタ。ID で参照している先（Mapper のメソッド・メッセージ・状態の定数）を解決して、
  #      下のルールが読む形にする。同じアダプタが、処理の手順を読む変換定義それぞれにある（ルールを定義の間で共有できないため。UX-384）
  - id: process-document
    build:
      id:
        $copy: operation
      name:
        $copy: label
      service:
        $copy: service
      confirm:
        $each: confirm
        $build:
          method:
            $copy: method
          arguments:
            $copy: arguments
          does:
            $copy: does
          constraints:
            $each: constraints
            $build:
              constraint:
                $value:
                  extract:
                    - path: constraint
                    - ^RUL-(.*)$
              field:
                $copy: field
              message:
                $apply: process-message-key
                $with:
                  ref:
                    $copy: message
      transaction:
        $copy: transaction
      steps:
        $each: steps
        $bind: processStep
        $build:
          $apply: process-calls
          $with:
            node:
              $entries:
                $eachEntry: .
                $flatten: true
                $build:
                  $apply: process-step-entry
                  $with:
                    step:
                      $copy: .
                      $of: processStep
      subject:
        $copy: subject
      originalService:
        class:
          $format: '{name}Service'
          $with:
            name:
              $case:
                $copy: subject
              $as: pascal
        method:
          $case:
            $copy: operation
          $as: camel
        arguments:
          $copy: service.arguments
      transactionMode:
        $copy: transactionMode
      inputs:
        $copy: inputs
      designId:
        $copy: id
      designKind: processes
      designPath:
        $format: design/detail/final/processes/{operation}.yaml
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: id
    build: []
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: message
      - or:
          - of: step
            path: precondition
            exists: true
          - of: step
            path: error
            exists: true
    build:
      - key: message
        value:
          $apply: process-message-key
          $with:
            ref:
              $copy: .
      - key: text
        value:
          $apply: process-message-text
          $with:
            ref:
              $copy: .
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: message
    build:
      - key: message
        value:
          $apply: process-message-key
          $with:
            ref:
              $copy: .
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: precondition
    build:
      - key: precondition
        value:
          $value:
            extract:
              - path: .
              - ^PRE-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: error
    build:
      - key: precondition
        value:
          $value:
            extract:
              - path: .
              - ^ERR-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: constraint
    build:
      - key: constraint
        value:
          $value:
            extract:
              - path: .
              - ^RUL-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: entity
    build:
      - key: entity
        value:
          $value:
            extract:
              - path: .
              - ^ENT-(.*)$
  - id: process-step-entry
    with:
      - step
    when:
      - path: $key
        equals: allowed
    build:
      - key: allowed
        value:
          $each: .
          $build:
            $apply: process-constant-name
            $with:
              ref:
                $copy: .
  - id: process-step-entry
    with:
      - step
    build:
      - key: $key
        value:
          $copy: .
  - id: process-message-key
    with:
      - ref
    build:
      $apply: process-pick-key
      $with:
        row:
          $view: basic-model-messages
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: process-pick-key
    with:
      - row
    build:
      $copy: values.record.key
      $of: row
  - id: process-message-text
    with:
      - ref
    build:
      $apply: process-pick-text
      $with:
        row:
          $view: basic-model-messages
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: process-pick-text
    with:
      - row
    build:
      $copy: values.record.text
      $of: row
  - id: process-constant-name
    with:
      - ref
    build:
      $apply: process-pick-constant
      $with:
        row:
          $view: detail-model-status-constants
          $where:
            - path: id
              equals:
                $copy: .
                $of: ref
          $one: true
  - id: process-pick-constant
    with:
      - row
    build:
      $copy: values.record.constant
      $of: row
  # 入れ子の中も歩いて、呼ぶメソッドの ID（call: MTH-）を、呼び名（Mapper 名.メソッド名）にする
  - id: process-calls
    with:
      - node
    build:
      $first:
        - $apply: process-calls-map
          $with:
            entries:
              $eachEntry: .
              $of: node
              $flatten: true
              $build:
                $first:
                  - $when:
                      - path: $key
                        equals: call
                    $then:
                      - key: $key
                        value:
                          $apply: process-call-name
                          $with:
                            ref:
                              $copy: .
                  - - key: $key
                      value:
                        $apply: process-calls
                        $with:
                          node:
                            $copy: .
        - $each: .
          $of: node
          $build:
            $apply: process-calls
            $with:
              node:
                $copy: .
        - $copy: .
          $of: node
  - id: process-calls-map
    with:
      - entries
    when:
      - of: entries
        path: .
        exists: true
    build:
      $entries:
        $copy: .
        $of: entries
  - id: process-call-name
    with:
      - ref
    build:
      $first:
        - $apply: process-pick-call
          $with:
            row:
              $view: detail-model-methods
              $where:
                - path: id
                  equals:
                    $copy: .
                    $of: ref
              $one: true
        - $copy: .
          $of: ref
  - id: process-pick-call
    with:
      - row
    build:
      $format: '{m}.{n}'
      $with:
        m:
          $copy: values.mapper
          $of: row
        'n':
          $copy: values.name
          $of: row
  # ---- 入力アダプタ ここまで ----
  - id: first
    with:
      - items
    build:
      $copy: '[0]'
      $of: items
  - id: validated
    with:
      - documents
    build:
      $apply: first
      $with:
        items:
          $eachEntry: .
          $of: documents
          $flatten: true
          $build:
            - $copy: .
  - id: operation
    with:
      - process
      - types
    build:
      $apply: operation-ready
      $with:
        process:
          $copy: .
          $of: process
        fields:
          # 入力パラメータの定義は、処理の手順のレコードが運んでいる（基本設計も中間ファイルも読まない）
          $each: inputs
          $of: process
          $build:
            $apply: field
            $with:
              owner:
                $copy: id
                $of: process
              path:
                $copy: key
              types:
                $copy: values.record.mappings
                $of: types
  - id: operation-ready
    with:
      - process
      - fields
    build:
      id:
        $format: SINPUT-{id}
        $with:
          id:
            $copy: id
            $of: process
      source:
        $copy: designId
        $of: process
      action:
        $copy: id
        $of: process
      service:
        $copy: service.class
        $of: process
      method:
        $copy: service.method
        $of: process
      className:
        $format: '{n}Input'
        $with:
          'n':
            $case:
              $copy: id
              $of: process
            $as: pascal
      arguments:
        $each: service.arguments
        $of: process
        $build:
          $apply: argument
          $with:
            name:
              $copy: .
            fields:
              $copy: .
              $of: fields
            target:
              $copy: subject
              $of: process
            receiver:
              $apply: first
              $with:
                items:
                  $each: steps
                  $of: process
                  $build:
                    $when:
                      - path: step
                        equals: read
                    $then: true
      classes:
        $each: .
        $of: fields
        $build:
          $copy: classes
        $flatten: true
  - id: argument
    with:
      - name
      - fields
      - target
      - receiver
    build:
      $apply: argument-result
      $with:
        name:
          $copy: .
          $of: name
        field:
          $apply: first
          $with:
            items:
              $each: .
              $of: fields
              $build:
                $when:
                  - path: name
                    equals:
                      $copy: .
                      $of: name
                $then:
                  $copy: .
        target:
          $copy: .
          $of: target
        receiver:
          $copy: .
          $of: receiver
  - id: argument-result
    with:
      - name
      - field
      - target
      - receiver
    when:
      - of: field
        path: name
        exists: true
    build:
      $copy: .
      $of: field
  - id: argument-result
    with:
      - name
      - field
      - target
      - receiver
    when:
      - of: name
        path: .
        equals: id
      - of: receiver
        path: .
        equals: true
    build:
      key: id
      name: id
      accessor: Id
      type: java.lang.String
      base: ref
      target:
        $copy: .
        $of: target
      receiver: true
      classes: []
  - id: argument-result
    with:
      - name
      - field
      - target
      - receiver
    build:
      name:
        $copy: .
        $of: name
      type: UNRESOLVED
      classes: []
  - id: field
    with:
      - owner
      - path
      - types
    build:
      $apply: field-ready
      $with:
        raw:
          $copy: .
        owner:
          $copy: .
          $of: owner
        path:
          $copy: .
          $of: path
        types:
          $copy: .
          $of: types
        type:
          $apply: type
          $with:
            owner:
              $copy: .
              $of: owner
            path:
              $copy: .
              $of: path
            types:
              $copy: .
              $of: types
  - id: field-ready
    with:
      - raw
      - owner
      - path
      - types
      - type
    build:
      key:
        $copy: key
        $of: raw
      name:
        $case:
          $copy: key
          $of: raw
        $as: camel
      accessor:
        $case:
          $copy: key
          $of: raw
        $as: pascal
      path:
        $copy: .
        $of: path
      type:
        $copy: name
        $of: type
      base:
        $copy: base
        $of: raw
      constraints:
        $copy: .
        $of: raw
      classes:
        $first:
          - $copy: classes
            $of: type
          - []
      children:
        $copy: fields
        $of: type
      item:
        $copy: item
        $of: type
  - id: type
    with:
      - owner
      - path
      - types
    when:
      - path: base
        equals: array
    build:
      $apply: array-type
      $with:
        item:
          $apply: type
          $with:
            owner:
              $copy: .
              $of: owner
            path:
              $format: '{p}Item'
              $with:
                p:
                  $copy: .
                  $of: path
            types:
              $copy: .
              $of: types
          $at: item
  - id: array-type
    with:
      - item
    build:
      name:
        $format: java.util.List<{t}>
        $with:
          t:
            $copy: name
            $of: item
      item:
        $copy: .
        $of: item
      classes:
        $first:
          - $copy: classes
            $of: item
          - []
  - id: type
    with:
      - owner
      - path
      - types
    when:
      - path: base
        equals: object
    build:
      $apply: object-type
      $with:
        name:
          $format: '{o}{p}'
          $with:
            o:
              $case:
                $copy: .
                $of: owner
              $as: pascal
            p:
              $case:
                $copy: .
                $of: path
              $as: pascal
        fields:
          $each: fields
          $build:
            $apply: field
            $with:
              owner:
                $copy: .
                $of: owner
              path:
                $format: '{p}.{k}'
                $with:
                  p:
                    $copy: .
                    $of: path
                  k:
                    $copy: key
              types:
                $copy: .
                $of: types
  - id: object-type
    with:
      - name
      - fields
    build:
      name:
        $copy: .
        $of: name
      fields:
        $copy: .
        $of: fields
      classes:
        $concat:
          - - name:
                $copy: .
                $of: name
              fields:
                $copy: .
                $of: fields
          - $each: .
            $of: fields
            $build:
              $copy: classes
            $flatten: true
  - id: type
    with:
      - owner
      - path
      - types
    build:
      $apply: scalar-lookup
      $with:
        raw:
          $copy: .
        types:
          $copy: .
          $of: types
  - id: scalar-lookup
    with:
      - raw
      - types
    build:
      $apply: scalar-type
      $with:
        mapping:
          $apply: first
          $with:
            items:
              $each: .
              $of: types
              $build:
                $when:
                  - path: base
                    equals:
                      $copy: base
                      $of: raw
                $then:
                  $copy: .
        raw:
          $copy: .
          $of: raw
  - id: scalar-type
    with:
      - mapping
      - raw
    build:
      name:
        $first:
          - $copy: qualifiedName
            $of: mapping
          - UNRESOLVED
      base:
        $copy: base
        $of: raw
      classes: []
