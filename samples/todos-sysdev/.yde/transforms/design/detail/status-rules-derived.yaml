id: status-rules-derived
name: 状態の判定（処理設計書）
description: >-
  Lifecycle ごとに、状態の enum（保存する値）と、詳細化の親の判定と、操作ごとにできる状態と移り先を書く。 決め打ちの規則: enum の名前は「型の名前＋Status」・定数は保存する値・親の判定は「is＋親の
  ID」のメソッド。業務モデルではなく、基本設計の「状態と遷移」（design/basic/final/states.yaml）を読む（ADR-0042）。状態への参照は、同じ Lifecycle の状態から値を引く
scope: business
each: lifecycles
output: design/detail/derived/documents/status-rules/{source}.yaml
dependsOn:
  - basic-states
  - detail-document-input-gate
input:
  lifecycles:
    $each:
      $view: basic-model-states
    $build:
      $copy: values.record
build:
  id:
    $format: DRV-document-status-rules.{source}
  record:
    id:
      $format: DOC-status-rules.{source}
    value:
      id:
        $copy: source
      entity:
        $copy: subject
      enum:
        name:
          $format: '{name}Status'
          $with:
            name:
              $case:
                $copy: subject
              $as: pascal
        values:
          $each: states
          $build:
            constant:
              $case:
                $copy: value
              $as: constant
            label:
              $copy: label
            state:
              $copy: source
      groups:
        $each: groups
        $build:
          method:
            $format: is{name}
            $with:
              name:
                $case:
                  $copy: source
                $as: pascal
          label:
            $copy: label
          state:
            $copy: source
          values:
            $each: states
            $build:
              $apply: state-value
              $with:
                ref:
                  $copy: .
                states:
                  $copy: states
                  $of: element
      entry:
        $each: entries
        $build:
          action:
            $copy: action
          to:
            $apply: state-value
            $with:
              ref:
                $copy: to
              states:
                $copy: states
                $of: element
      transitions:
        $each: transitions
        $build:
          action:
            $copy: action
          from:
            $each: from
            $build:
              $apply: state-value
              $with:
                ref:
                  $copy: .
                states:
                  $copy: states
                  $of: element
          to:
            $apply: state-value
            $with:
              ref:
                $copy: to
              states:
                $copy: states
                $of: element
      terminal:
        $each: terminal
        $build:
          $apply: state-value
          $with:
            ref:
              $copy: .
            states:
              $copy: states
              $of: element
      stateFields:
        $group:
          $each: states
          $build:
            $first:
              - $copy: path
              - UNRESOLVED
        $by:
          $copy: .
        $build:
          $copy: key
    source:
      id: rule-status-rules
      document: .yde/transforms/design/detail/status-rules-derived.yaml
rules:
  # 状態への参照（STA-…）から、同じ Lifecycle の状態の保存する値を引く
  - id: state-value
    with:
      - ref
      - states
    build:
      $apply: first-state-value
      $with:
        items:
          $each: .
          $of: states
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $first:
                - $copy: value
                - UNRESOLVED
  - id: first-state-value
    with:
      - items
    build:
      $first:
        - $copy: '[0]'
          $of: items
        - UNRESOLVED
