id: detail-table-access
name: 詳細設計項目一覧（テーブルへの読み書き）
description: >-
  具体システムモデルの「テーブルへの読み書き」を項目の形で作る（ADR-0042）。エンティティ型ごとに 1 ファイルにし、読み書きのまとまり（ACC-。Mapper 1 つ）と、
  そのテーブル（主のテーブルと明細テーブル）を読み書きするメソッド（MTH-）に設計 ID を振る。
  入力は基本設計の項目（エンティティ・操作・データの決まり・一覧の検索条件・画面）と、同じ詳細設計のテーブルの項目だけで、業務モデルも解いた形も読まない。
  メソッドは作る元（sources。操作 ACT-・検索条件 QRY-・詳細画面 SCR-・エンティティ ENT-）を指し、テーブルとカラムは ID（TBL-・COL-）で指す（名前を写さない）。
  決め打ちの規則: 受け手は findById で読む・作る要素は insert（番号は maxId、明細の並び順は maxSeq）・値を書く操作は操作ごとの update（書く列だけ）・
  配列を置き換える操作は明細を消して入れ直す・前提のうち「受け手の中の要素の条件」と、要素をまたぐデータの決まりは件数を数える count。
  ID で 1 件読むメソッド（findDetail）と参照の候補（selectAll）は、詳細画面（画面の項目の kind: detail）があるエンティティに作る。
  詳細設計の個別の判断（design/detail/inputs/decisions.yaml）は、項目の ID を対象にして、ここで項目へ直接当てる（Mapper とメソッドの名前）。
  補正前のファイルは作らない
scope: business
each: entities
output: design/detail/final/table-access/{id}.yaml
dependsOn:
  - basic-entities
  - basic-operations
  - basic-rules
  - basic-queries
  - basic-screens
  - detail-tables
  - detail-document-input-gate
input:
  $apply: model-input
  $with:
    entities:
      $each:
        $view: basic-model-entities
      $build:
        $apply: item-entity
        $at: values.record
    actions:
      $each:
        $view: basic-model-operations
      $build:
        $apply: item-action
        $at: values.record
    rules:
      $each:
        $view: basic-model-rules
      $build:
        $copy: values.record
    queries:
      $each:
        $view: basic-model-queries
      $build:
        $copy: values.record
    screens:
      $each:
        $view: basic-model-screens
      $build:
        $copy: values.record
    decisions:
      $each:
        $view: detail-decisions-input
      $build:
        $copy: values.decision
build:
  $apply: decided-item
  $with:
    item:
      $apply: physical-access
      $with:
        document:
          id:
            $format: ACC-{id}
          source:
            $format: ENT-{id}
          entity:
            $copy: id
          label:
            $format: '{label}の読み書き'
          mapper:
            $format: '{n}Mapper'
            $with:
              'n':
                $case:
                  $copy: id
                $as: pascal
          tables:
            $concat:
              - - $case:
                    $copy: id
                  $as: snake
              - $group:
                  $apply: fields
                $by:
                  $when:
                    - path: field.base
                      equals: array
                    - path: field.item.entity
                      exists: false
                  $then:
                    $copy: field.key
                $build:
                  $apply: detail-name
          methods:
            $group:
              $apply: methods
            $by:
              $copy: name
            $build:
              id:
                $format: MTH-{e}.{m}
                $with:
                  e:
                    $copy: id
                    $of: element
                  m:
                    $copy: key
              name:
                $copy: key
              kind:
                $copy: items[0].kind
              table:
                $copy: items[0].table
              columns:
                $copy: items[0].columns
              item:
                $copy: items[0].item
              set:
                $when:
                  - path: items[0].kind
                    equals: update
                $then:
                  $each: items
                  $build:
                    $copy: set
              join:
                $copy: items[0].join
              where:
                $copy: items[0].where
              numbering:
                $copy: items[0].numbering
              precondition:
                $copy: items[0].precondition
              constraint:
                $copy: items[0].constraint
              expect:
                $copy: items[0].expect
              includes:
                $copy: items[0].includes
              names:
                $copy: items[0].names
              order:
                $copy: items[0].order
              groupBy:
                $copy: items[0].groupBy
              counts:
                $copy: items[0].counts
              via:
                $copy: items[0].via
              params:
                $copy: items[0].params
              # 作る元: 操作（ACT-）・一覧の検索条件（QRY-）・詳細画面（SCR-。ID で 1 件読む）・エンティティ（ENT-。参照の候補）
              sources:
                $group:
                  $each: items
                  $flatten: true
                  $build:
                    $first:
                      - $when:
                          - path: operation
                            exists: true
                        $then:
                          - $format: ACT-{operation}
                      - $when:
                          - path: query
                            exists: true
                        $then:
                          - $copy: query
                      - $when:
                          - path: detail
                            exists: true
                        $then:
                          - $copy: detail
                      - - $format: ENT-{e}
                          $with:
                            e:
                              $copy: id
                              $of: element
                $by:
                  $copy: .
                $build:
                  $copy: key
              # 同じ条件で数えるメソッドは、条件を持つメソッドを ID で指す
              whereFrom:
                $when:
                  - path: items[0].whereFrom
                    exists: true
                $then:
                  $format: MTH-{e}.{w}
                  $with:
                    e:
                      $copy: id
                      $of: element
                    w:
                      $copy: items[0].whereFrom
rules:
  - id: fields
    build:
      $each: aspects
      $bind: asp
      $flatten: true
      $build:
        $each: fields
        $build:
          field:
            $copy: .
          schema:
            $copy: schema
            $of: asp
  - id: detail-name
    build:
      $format: '{t}_{k}'
      $with:
        t:
          $case:
            $copy: id
            $of: element
          $as: snake
        k:
          $copy: key
  - id: methods
    build:
      $concat:
        - $when:
            - of: model
              path: designReach.entities
              includes:
                $copy: id
          $then:
            - name: findDetail
              kind: select
              table:
                $case:
                  $copy: id
                $as: snake
              where:
                - item: id
                  param: id
              includes:
                $concat:
                  - $group:
                      $apply: fields
                    $by:
                      $when:
                        - path: field.base
                          equals: array
                        - path: field.item.entity
                          exists: false
                      $then:
                        $copy: field.key
                    $build:
                      item:
                        $copy: key
                      table:
                        $apply: detail-name
                      order:
                        - item: seq
                  - $each: entities
                    $of: model
                    $build:
                      $when:
                        - path: owner.entity
                          equals:
                            $copy: id
                            $of: element
                      item:
                        $copy: owner.field
                      table:
                        $case:
                          $copy: id
                        $as: snake
                      order:
                        - item: seq
              names:
                $group:
                  $apply: fields
                $by:
                  $when:
                    - or:
                        - path: field.target
                          exists: true
                        - path: field.item.target
                          exists: true
                  $then:
                    $copy: field.key
                $build:
                  item:
                    $copy: key
                  table:
                    $case:
                      $first:
                        - $copy: items[0].field.target
                        - $copy: items[0].field.item.target
                    $as: snake
                  name:
                    $first:
                      - $copy: items[0].field.targetTitle
                      - $copy: items[0].field.item.targetTitle
              screen:
                $copy: id
              # 作る元: このエンティティの詳細画面
              detail:
                $apply: contract-first
                $with:
                  matches:
                    $each: designDetails
                    $of: model
                    $flatten: true
                    $build:
                      $when:
                        - path: entity
                          equals:
                            $copy: id
                            $of: element
                      $then:
                        - $copy: screen
            - name: selectAll
              kind: select
              table:
                $case:
                  $copy: id
                $as: snake
              columns:
                $concat:
                  - - id
                  - $when:
                      - path: title
                        exists: true
                    $then:
                      - $copy: title
              order:
                - item: id
              screen: 参照の候補
        - $each: designQueries
          $of: model
          $bind: d
          $flatten: true
          $build:
            $each: sections
            $bind: sec
            $flatten: true
            $build:
              $each: views
              $of: d
              $bind: v
              $flatten: true
              $build:
                $when:
                  - path: id
                    equals:
                      $copy: view
                      $of: sec
                  - path: rows
                    equals:
                      $copy: id
                      $of: element
                $then:
                  $first:
                    - $when:
                        - path: kind
                          equals: matrix
                      $then:
                        - name:
                            $format: select{d}{s}
                            $with:
                              d:
                                $case:
                                  $copy: id
                                  $of: d
                                $as: pascal
                              s:
                                $case:
                                  $copy: id
                                  $of: sec
                                $as: pascal
                          kind: aggregate
                          table:
                            $case:
                              $copy: rows
                            $as: snake
                          counts:
                            $case:
                              $copy: counts
                            $as: snake
                          via:
                            $copy: match[1].edge
                          groupBy:
                            - item: id
                            - item:
                                $copy: columns.path
                              of:
                                $copy: counts
                              values:
                                $each: columns.values
                                $build:
                                  $copy: value
                          order:
                            $first:
                              - $apply: order
                                $at: order
                              - - item: id
                          screen:
                            $copy: id
                            $of: d
                          query:
                            $copy: query
                            $of: d
                        - name:
                            $format: count{d}{s}
                            $with:
                              d:
                                $case:
                                  $copy: id
                                  $of: d
                                $as: pascal
                              s:
                                $case:
                                  $copy: id
                                  $of: sec
                                $as: pascal
                          kind: count
                          table:
                            $case:
                              $copy: rows
                            $as: snake
                          screen:
                            $copy: id
                            $of: d
                          query:
                            $copy: query
                            $of: d
                    - - name:
                          $format: select{d}{s}
                          $with:
                            d:
                              $case:
                                $copy: id
                                $of: d
                              $as: pascal
                            s:
                              $case:
                                $copy: id
                                $of: sec
                              $as: pascal
                        kind: select
                        table:
                          $case:
                            $copy: rows
                          $as: snake
                        params:
                          $concat:
                            - $first:
                                - $copy: params
                                - []
                            - $when:
                                - of: sec
                                  path: filter.check
                                  exists: true
                              $then:
                                - today
                        where:
                          $concat:
                            - $first:
                                - $each: where
                                  $apply: cond
                                - []
                            - $first:
                                - $each: filter.where
                                  $of: sec
                                  $apply: cond
                                - []
                            - $first:
                                - $each: filter.check
                                  $of: sec
                                  $apply: cond
                                - []
                        columns:
                          $concat:
                            - - item: id
                            - $each: columns
                              $build:
                                label:
                                  $copy: label
                                item:
                                  $copy: path
                                computed:
                                  $when:
                                    - path: computed
                                      equals: true
                                  $then:
                                    $apply: expr
                                    $at: value
                                names:
                                  $first:
                                    - $when:
                                        - path: field.target
                                          exists: true
                                      $then:
                                        table:
                                          $case:
                                            $copy: field.target
                                          $as: snake
                                        name:
                                          $copy: field.targetTitle
                                    - $when:
                                        - path: field.item.target
                                          exists: true
                                      $then:
                                        table:
                                          $case:
                                            $copy: field.item.target
                                          $as: snake
                                        name:
                                          $copy: field.item.targetTitle
                                        many: true
                        order:
                          $first:
                            - $apply: order
                              $at: order
                            - - item: id
                        screen:
                          $copy: id
                          $of: d
                        query:
                          $copy: query
                          $of: d
                      - name:
                          $format: count{d}{s}
                          $with:
                            d:
                              $case:
                                $copy: id
                                $of: d
                              $as: pascal
                            s:
                              $case:
                                $copy: id
                                $of: sec
                              $as: pascal
                        kind: count
                        table:
                          $case:
                            $copy: rows
                          $as: snake
                        screen:
                          $copy: id
                          $of: d
                        query:
                          $copy: query
                          $of: d
                        whereFrom:
                          $format: select{d}{s}
                          $with:
                            d:
                              $case:
                                $copy: id
                                $of: d
                              $as: pascal
                            s:
                              $case:
                                $copy: id
                                $of: sec
                              $as: pascal
        - $each: designActions
          $of: model
          $build:
            $when:
              - path: target.entity
                equals:
                  $copy: id
                  $of: element
            name: findById
            kind: select
            table:
              $case:
                $copy: id
                $of: element
              $as: snake
            where:
              - item: id
                param: id
            operation:
              $copy: id
        - $each: designActions
          $of: model
          $flatten: true
          $build:
            $when:
              - path: creates
                includes:
                  $copy: id
                  $of: element
            $then:
              $concat:
                - - name: insert
                    kind: insert
                    table:
                      $case:
                        $copy: id
                        $of: element
                      $as: snake
                    columns:
                      mode: all
                    operation:
                      $copy: id
                - $when:
                    - of: element
                      path: numbering
                      exists: true
                    - of: element
                      path: owner.entity
                      exists: false
                  $then:
                    - name: maxId
                      kind: max
                      table:
                        $case:
                          $copy: id
                          $of: element
                        $as: snake
                      item: id
                      where:
                        - item: id
                          startsWith:
                            $copy: numbering.prefix
                            $of: element
                      numbering:
                        $copy: numbering
                        $of: element
                      operation:
                        $copy: id
                - $when:
                    - of: element
                      path: owner.entity
                      exists: true
                  $then:
                    - name: maxId
                      kind: max
                      table:
                        $case:
                          $copy: id
                          $of: element
                        $as: snake
                      item: id
                      where:
                        - item:
                            $format: '{p}_id'
                            $with:
                              p:
                                $case:
                                  $copy: owner.entity
                                  $of: element
                                $as: snake
                          param: id
                      numbering:
                        $copy: numbering
                        $of: element
                      operation:
                        $copy: id
                    - name: maxSeq
                      kind: max
                      table:
                        $case:
                          $copy: id
                          $of: element
                        $as: snake
                      item: seq
                      where:
                        - item:
                            $format: '{p}_id'
                            $with:
                              p:
                                $case:
                                  $copy: owner.entity
                                  $of: element
                                $as: snake
                          param: id
                      operation:
                        $copy: id
        - $each: designActions
          $of: model
          $bind: a
          $flatten: true
          $build:
            $each: effects
            $bind: e
            $flatten: true
            $build:
              $concat:
                - $when:
                    - path: entity
                      equals:
                        $copy: id
                        $of: element
                    - or:
                        - path: op
                          equals: set
                        - path: op
                          equals: delete
                    - not:
                        path: field.base
                        oneOf:
                          - array
                          - object
                          - map
                    - not:
                        of: a
                        path: creates
                        includes:
                          $copy: id
                          $of: element
                  $then:
                    - name:
                        $case:
                          $copy: id
                          $of: a
                        $as: camel
                      kind: update
                      table:
                        $case:
                          $copy: id
                          $of: element
                        $as: snake
                      set:
                        item:
                          $copy: field.key
                        value:
                          $first:
                            - $copy: value
                            - null
                        when:
                          $copy: when
                        mode:
                          $first:
                            - $when:
                                - path: op
                                  equals: delete
                              $then: clear
                            - value
                      where:
                        - item: id
                          param:
                            $first:
                              - $when:
                                  - path: entity
                                    equals:
                                      $copy: target.entity
                                      $of: a
                                $then: id
                              - $format: '{e}Id'
                                $with:
                                  e:
                                    $case:
                                      $copy: entity
                                    $as: camel
                      operation:
                        $copy: id
                        $of: a
                - $when:
                    - path: entity
                      equals:
                        $copy: id
                        $of: element
                    - path: op
                      equals: insert
                    - path: field.base
                      equals: array
                    - path: field.item.entity
                      exists: false
                  $then:
                    - name:
                        $format: insert{n}
                        $with:
                          'n':
                            $case:
                              $apply: effect-detail-name
                            $as: pascal
                      kind: insert
                      table:
                        $apply: effect-detail-name
                      columns:
                        mode: all
                      operation:
                        $copy: id
                        $of: a
                    - name:
                        $format: maxSeq{n}
                        $with:
                          'n':
                            $case:
                              $apply: effect-detail-name
                            $as: pascal
                      kind: max
                      table:
                        $apply: effect-detail-name
                      item: seq
                      where:
                        - item:
                            $format: '{p}_id'
                            $with:
                              p:
                                $case:
                                  $copy: id
                                  $of: element
                                $as: snake
                          param: id
                      operation:
                        $copy: id
                        $of: a
                # 並びの番号で指す効果（row）: 明細テーブルの 1 行を、親のキーと並び順（seq）で指す update・delete。
                # メソッドは操作ごと（操作の名前＋項目＋Row）。書く列は操作が書く子の項目だけ
                - $when:
                    - path: entity
                      equals:
                        $copy: id
                        $of: element
                    - path: op
                      equals: set
                    - path: field.base
                      equals: array
                    - path: field.item.entity
                      exists: false
                    - path: row
                      exists: true
                  $then:
                    $each: written
                    $build:
                      name:
                        $format: '{m}{f}Row'
                        $with:
                          m:
                            $case:
                              $copy: id
                              $of: a
                            $as: camel
                          f:
                            $case:
                              $copy: field.key
                              $of: e
                            $as: pascal
                      kind: update
                      table:
                        $format: '{t}_{k}'
                        $with:
                          t:
                            $case:
                              $copy: entity
                              $of: e
                            $as: snake
                          k:
                            $copy: field.key
                            $of: e
                      set:
                        item:
                          $copy: key
                        value:
                          $copy: value
                        when:
                          $copy: when
                          $of: e
                        mode: value
                      where:
                        - item:
                            $format: '{p}_id'
                            $with:
                              p:
                                $case:
                                  $copy: id
                                  $of: element
                                $as: snake
                          param: id
                        - item: seq
                          param:
                            $copy: row.param
                            $of: e
                      operation:
                        $copy: id
                        $of: a
                - $when:
                    - path: entity
                      equals:
                        $copy: id
                        $of: element
                    - path: op
                      equals: delete
                    - path: field.base
                      equals: array
                    - path: field.item.entity
                      exists: false
                    - path: row
                      exists: true
                  $then:
                    - name:
                        $format: '{m}{f}Row'
                        $with:
                          m:
                            $case:
                              $copy: id
                              $of: a
                            $as: camel
                          f:
                            $case:
                              $copy: field.key
                            $as: pascal
                      kind: delete
                      table:
                        $apply: effect-detail-name
                      where:
                        - item:
                            $format: '{p}_id'
                            $with:
                              p:
                                $case:
                                  $copy: id
                                  $of: element
                                $as: snake
                          param: id
                        - item: seq
                          param:
                            $copy: row.param
                      operation:
                        $copy: id
                        $of: a
                - $when:
                    - path: entity
                      equals:
                        $copy: id
                        $of: element
                    - path: op
                      equals: set
                    - path: field.base
                      equals: array
                    - path: field.item.entity
                      exists: false
                    - path: row
                      exists: false
                  $then:
                    - name:
                        $format: delete{n}
                        $with:
                          'n':
                            $case:
                              $apply: effect-detail-name
                            $as: pascal
                      kind: delete
                      table:
                        $apply: effect-detail-name
                      where:
                        - item:
                            $format: '{p}_id'
                            $with:
                              p:
                                $case:
                                  $copy: id
                                  $of: element
                                $as: snake
                          param: id
                      operation:
                        $copy: id
                        $of: a
                    - name:
                        $format: insert{n}
                        $with:
                          'n':
                            $case:
                              $apply: effect-detail-name
                            $as: pascal
                      kind: insert
                      table:
                        $apply: effect-detail-name
                      columns:
                        mode: all
                      operation:
                        $copy: id
                        $of: a
                - $when:
                    - or:
                        - path: op
                          equals: create
                        - path: op
                          equals: insert
                    - or:
                        - path: entity
                          equals:
                            $copy: id
                            $of: element
                        - path: field.item.entity
                          equals:
                            $copy: id
                            $of: element
                    - or:
                        - path: op
                          equals: create
                        - path: field.item.entity
                          exists: true
                  $then:
                    $each: written
                    $build:
                      $when:
                        - path: base
                          equals: array
                        - path: item.entity
                          exists: false
                        - path: value
                          empty: false
                      name:
                        $format: insert{n}
                        $with:
                          'n':
                            $case:
                              $format: '{t}_{k}'
                              $with:
                                t:
                                  $case:
                                    $copy: id
                                    $of: element
                                  $as: snake
                                k:
                                  $copy: key
                            $as: pascal
                      kind: insert
                      table:
                        $format: '{t}_{k}'
                        $with:
                          t:
                            $case:
                              $copy: id
                              $of: element
                            $as: snake
                          k:
                            $copy: key
                      columns:
                        mode: all
                      operation:
                        $copy: id
                        $of: a
        - $each: designActions
          $of: model
          $bind: a
          $flatten: true
          $build:
            $each: require
            $bind: r
            $build:
              $when:
                - path: rule.match[1].edge.contains
                  equals: true
                - path: rule.match[2].node.entity
                  equals:
                    $copy: id
                    $of: element
                # 親の値を条件にする前提（同時更新の検出の、親の版）は、読んだ親の行で確かめるので、件数の検査にしない
                - not:
                    path: rule.where[0].of
                    equals:
                      $copy: rule.match[0].node.bind
              name:
                $format: count{n}
                $with:
                  'n':
                    $case:
                      $format: '{a}.{r}'
                      $with:
                        a:
                          $copy: id
                          $of: a
                        r:
                          $copy: id
                    $as: pascal
              kind: count
              table:
                $case:
                  $copy: id
                  $of: element
                $as: snake
              where:
                $concat:
                  - - item:
                        $format: '{p}_id'
                        $with:
                          p:
                            $case:
                              $copy: owner.entity
                              $of: element
                            $as: snake
                      param: id
                  - $each: rule.where
                    $build:
                      $when:
                        - path: of
                          equals:
                            $copy: rule.match[2].node.bind
                            $of: r
                      item:
                        $copy: path
                      equals:
                        $copy: equals
                      notEquals:
                        $copy: notEquals
                      oneOf:
                        $copy: oneOf
              expect:
                $copy: rule.expect
              precondition:
                $format: 'PRE-{a}.{r}'
                $with:
                  a:
                    $copy: id
                    $of: a
                  r:
                    $copy: id
              operation:
                $copy: id
                $of: a
        - $each: designActions
          $of: model
          $bind: a
          $flatten: true
          $build:
            $each: checks
            $bind: c
            $flatten: true
            $build:
              $each: designRules
              $of: model
              $bind: k
              $build:
                $when:
                  - path: id
                    equals:
                      $copy: constraint
                      $of: c
                  - path: level
                    equals: error
                  - path: form
                    equals: pattern
                  - path: rule.match[1].edge.contains
                    equals: true
                  - path: rule.match[2].node.entity
                    equals:
                      $copy: id
                      $of: element
                name:
                  $format: count{n}
                  $with:
                    'n':
                      $case:
                        $copy: id
                      $as: pascal
                kind: count
                table:
                  $case:
                    $copy: id
                    $of: element
                  $as: snake
                join:
                  - table:
                      $case:
                        $copy: rule.match[0].node.entity
                      $as: snake
                    item: id
                    equalsItem:
                      $format: '{p}_id'
                      $with:
                        p:
                          $case:
                            $copy: owner.entity
                            $of: element
                          $as: snake
                where:
                  $concat:
                    - - item:
                          $format: '{p}_id'
                          $with:
                            p:
                              $case:
                                $copy: owner.entity
                                $of: element
                              $as: snake
                        param:
                          $format: '{p}Id'
                          $with:
                            p:
                              $case:
                                $copy: owner.entity
                                $of: element
                              $as: camel
                    - $each: rule.where
                      $build:
                        $when:
                          - path: of
                            equals:
                              $copy: rule.match[0].node.bind
                              $of: k
                        table:
                          $case:
                            $copy: rule.match[0].node.entity
                            $of: k
                          $as: snake
                        item:
                          $copy: path
                        equals:
                          $copy: equals
                        notEquals:
                          $copy: notEquals
                        oneOf:
                          $copy: oneOf
                    - $each: rule.where
                      $build:
                        $when:
                          - path: of
                            equals:
                              $copy: rule.match[2].node.bind
                              $of: k
                        item:
                          $copy: path
                        equals:
                          $copy: equals
                        notEquals:
                          $copy: notEquals
                        oneOf:
                          $copy: oneOf
                expect:
                  $copy: rule.expect
                constraint:
                  $format: RUL-{id}
                operation:
                  $copy: id
                  $of: a
  - id: cond
    when:
      - path: includesAny
        exists: true
    build:
      item:
        $copy: path
      op: includesAny
      value:
        $copy: includesAny
      via:
        $format: '{t}_{k}'
        $with:
          t:
            $case:
              $copy: id
              $of: element
            $as: snake
          k:
            $copy: path
      skipIfEmpty:
        $when:
          - path: includesAny
            startsWith: $$
        $then: true
  - id: cond
    when:
      - path: equals
        exists: true
    build:
      item:
        $copy: path
      op: equals
      value:
        $copy: equals
      skipIfEmpty:
        $when:
          - path: equals
            startsWith: $$
        $then: true
  - id: cond
    when:
      - path: oneOf
        exists: true
    build:
      item:
        $copy: path
      op: in
      values:
        $copy: oneOf
  - id: cond
    when:
      - path: exists
        equals: true
    build:
      item:
        $copy: path
      op: notNull
  - id: cond
    when:
      - path: exists
        equals: false
    build:
      item:
        $copy: path
      op: isNull
  - id: cond
    when:
      - path: lt
        exists: true
    build:
      item:
        $copy: lt[0].path
      op: lt
      value:
        $copy: lt[1]
  - id: cond
    when:
      - path: lte
        exists: true
    build:
      item:
        $copy: lte[0].path
      op: lte
      value:
        $copy: lte[1]
  - id: cond
    when:
      - path: gt
        exists: true
    build:
      item:
        $copy: gt[0].path
      op: gt
      value:
        $copy: gt[1]
  - id: cond
    when:
      - path: gte
        exists: true
    build:
      item:
        $copy: gte[0].path
      op: gte
      value:
        $copy: gte[1]
  - id: cond
    build:
      op: 手で書く
      raw:
        $copy: .
  - id: order
    when:
      - path: path
        exists: true
    build:
      - item:
          $copy: path
        nulls: last
  - id: order
    build:
      - item: id
  - id: expr
    when:
      - path: map
        exists: true
    build:
      of:
        $apply: expr
        $at: map
      replace:
        $copy: using
  - id: expr
    when:
      - path: format
        exists: true
    build:
      format:
        $copy: format
      parts:
        $eachEntry: with
        $apply: expr
  - id: expr
    when:
      - path: count.all.match[1].edge.contains
        equals: true
    build:
      count:
        $case:
          $copy: count.all.match[2].node.entity
        $as: snake
      parent: 行の ID
      where:
        $each: count.all.where
        $apply: cond
  - id: expr
    when:
      - path: count.path
        exists: true
    build:
      count: 入れ子の要素
      item:
        $value:
          extract:
            - path: count.path
            - ^[^\[]+
      parent: 行の ID
  - id: expr
    when:
      - path: refCount
        exists: true
    build:
      count: 参照してくる要素
      relation:
        $copy: refCount.relation
      dir:
        $copy: refCount.dir
  - id: expr
    build:
      op: 手で書く
      raw:
        $copy: .
  - id: effect-detail-name
    build:
      $format: '{t}_{k}'
      $with:
        t:
          $case:
            $copy: entity
          $as: snake
        k:
          $copy: field.key
  # データの決まりは、業務モデルではなく、基本設計の「データの決まり」（design/basic/final/rules.yaml）から読む（ADR-0042）。
  # 確定した決まりを designRules として重ね、この定義の中では designRules を読む
  # 入力は基本設計の項目だけ（エンティティ・操作・データの決まり・一覧の検索条件）。業務モデルも、解いた形も読まない（ADR-0042）。
  # 下の規則（methods など）が読む形に、入口で 1 度だけ組む
  - id: model-input
    with:
      - entities
      - actions
      - rules
      - queries
      - screens
      - decisions
    build:
      entities:
        $copy: .
        $of: entities
      # 個別の判断のうち、読み書きのまとまり（ACC-）とメソッド（MTH-）を対象にするもの。対象の ID から、どのエンティティの項目かを取り出しておく
      designDecisions:
        $each: .
        $of: decisions
        $flatten: true
        $build:
          $when:
            - or:
                - path: target
                  startsWith: ACC-
                - path: target
                  startsWith: MTH-
          $then:
            - id:
                $copy: id
              target:
                $copy: target
              set:
                $copy: set
              entity:
                $value:
                  extract:
                    - path: target
                    - ^(?:ACC|MTH)-([^.]+)
      designActions:
        $copy: .
        $of: actions
      # ID で 1 件読むメソッドと、参照の候補を読むメソッドは、詳細画面があるエンティティに作る（画面の項目の kind: detail）
      designReach:
        entities:
          $each: .
          $of: screens
          $flatten: true
          $build:
            $when:
              - path: kind
                equals: detail
            $then:
              - $value:
                  extract:
                    - path: entity
                    - ^ENT-(.*)$
      designDetails:
        $each: .
        $of: screens
        $flatten: true
        $build:
          $when:
            - path: kind
              equals: detail
          $then:
            - entity:
                $value:
                  extract:
                    - path: entity
                    - ^ENT-(.*)$
              screen:
                $copy: id
      designRules:
        $each: .
        $of: rules
        $build:
          id:
            $copy: source
          level:
            $copy: level
          form:
            $copy: form
          kind:
            $copy: kind
          entity:
            $copy: subject
          at:
            $copy: at
          rule:
            $copy: rule
          fields:
            $when:
              - path: fields
                exists: true
            $then:
              $each: fields
              $build:
                entity:
                  $copy: subject
                key:
                  $copy: key
                multiple:
                  $copy: multiple
      designQueries:
        $each: .
        $of: queries
        $build:
          id:
            $copy: dashboard
          query:
            $copy: id
          sections:
            - id:
                $copy: section
              view:
                $copy: view
              filter:
                $copy: filter
          views:
            - id:
                $copy: view
              kind:
                $copy: kind
              rows:
                $copy: subject
              counts:
                $copy: counts
              match:
                $copy: match
              params:
                $copy: params
              where:
                $copy: where
              order:
                $copy: order
              columns:
                $first:
                  - $when:
                      - path: kind
                        equals: matrix
                    $then:
                      path:
                        $copy: axis.path
                      values:
                        $copy: axis.values
                  - $each: columns
                    $build:
                      label:
                        $copy: label
                      path:
                        $copy: path
                      computed:
                        $copy: computed
                      value:
                        $copy: value
                      field:
                        $first:
                          - $when:
                              - path: reference.many
                                equals: true
                            $then:
                              item:
                                target:
                                  $copy: reference.subject
                                targetTitle:
                                  $copy: reference.title
                          - $when:
                              - path: reference
                                exists: true
                            $then:
                              target:
                                $copy: reference.subject
                              targetTitle:
                                $copy: reference.title
  # エンティティの項目（ENT-・FLD-）を、下の規則が読む形にする
  - id: item-entity
    build:
      id:
        $copy: source
      label:
        $copy: label
      title:
        $value:
          extract:
            - path: title
            - '[^.]+$'
      numbering:
        $when:
          - path: numbering
            exists: true
        $then:
          path:
            $copy: numbering.path
          prefix:
            $copy: numbering.prefix
          digits:
            $copy: numbering.digits
      owner:
        $when:
          - path: parent
            exists: true
        $then:
          entity:
            $value:
              extract:
                - path: parent
                - ^ENT-(.*)$
          field:
            $value:
              extract:
                - path: parentField
                - '[^.]+$'
      aspects:
        - schema:
            $copy: documents[0]
          fields:
            $each: items
            $apply: item-field
  - id: item-field
    build:
      key:
        $copy: key
      base:
        $copy: base
      entity:
        $value:
          extract:
            - path: entity
            - ^ENT-(.*)$
      target:
        $value:
          extract:
            - path: reference.entities[0]
            - ^ENT-(.*)$
      targetTitle:
        $apply: title-of
        $with:
          ref:
            $copy: reference.entities[0]
      fields:
        $each: fields
        $apply: item-field
      item:
        $apply: item-field
        $at: item
      value:
        $apply: item-field
        $at: value
  # 参照先のエンティティの、表題の項目のキー
  - id: title-of
    with:
      - ref
    when:
      - of: ref
        path: .
        exists: true
    build:
      $apply: contract-first
      $with:
        matches:
          $each:
            $view: basic-model-entities
          $flatten: true
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              - $value:
                  extract:
                    - path: values.record.title
                    - '[^.]+$'
  # エンティティの項目の ID から、業務モデルの名前
  - id: entity-source
    with:
      - ref
    when:
      - of: ref
        path: .
        exists: true
    build:
      $apply: contract-first
      $with:
        matches:
          $each:
            $view: basic-model-entities
          $flatten: true
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              - $copy: values.record.source
  # 操作の項目（ACT-・EFF-・PRE-）を、下の規則が読む形にする。効果が指す項目（FLD-）は ID で引く
  - id: item-action
    build:
      $apply: item-action-body
      $with:
        act:
          $copy: .
  - id: item-action-body
    with:
      - act
    build:
      id:
        $copy: source
      target:
        $when:
          - path: receiver
            exists: true
        $then:
          entity:
            $apply: entity-source
            $with:
              ref:
                $copy: receiver
      creates:
        $each: creates
        $build:
          $apply: entity-source
          $with:
            ref:
              $copy: .
      require:
        $each: preconditions
        $build:
          id:
            $copy: source
          message:
            $copy: message
          rule:
            $copy: rule
      effects:
        $each: effects
        $bind: e
        $build:
          op:
            $copy: op
          source:
            $copy: cause
          auto:
            $copy: auto
          of:
            $copy: of
          entity:
            $copy: subject
          schema:
            $copy: schema
          path:
            $copy: path
          field:
            $first:
              - $when:
                  - path: item
                    exists: true
                $then:
                  $apply: effect-field
                  $with:
                    row:
                      $view: basic-model-fields
                      $where:
                        - path: id
                          equals:
                            $copy: item
                            $of: e
                      $one: true
              - $when:
                  - path: collection
                    exists: true
                $then:
                  key:
                    $copy: collection.key
                  base: array
                  item:
                    base: object
                    entity:
                      $apply: entity-source
                      $with:
                        ref:
                          $copy: collection.element
          row:
            $when:
              - path: row
                exists: true
            $then:
              param:
                $apply: contract-first
                $with:
                  matches:
                    $each: inputs
                    $of: act
                    $flatten: true
                    $build:
                      $when:
                        - path: id
                          equals:
                            $copy: row
                            $of: e
                      $then:
                        - $copy: key
          when:
            $copy: when
          # 自動で入る版（revision）は、値を「その項目の、次の値」として渡す
          value:
            $first:
              - $when:
                  - path: auto
                    equals: revision
                $then:
                  $entries:
                    - key: $$copy
                      value:
                        $copy: path
                    - key: $$of
                      value:
                        $first:
                          - $when:
                              - not:
                                  path: subject
                                  equals:
                                    $copy: subject
                                    $of: act
                            $then: ownerNext
                          - next
              - $copy: value
          values:
            $copy: values
          params:
            $copy: params
          id:
            $copy: identifier
          numbering:
            $copy: numbering
          written:
            $copy: written
      checks:
        $each: checks
        $build:
          constraint:
            $value:
              extract:
                - path: rule
                - ^RUL-(.*)$
          items:
            $copy: items
  - id: effect-field
    with:
      - row
    build:
      key:
        $copy: values.record.key
        $of: row
      base:
        $copy: values.record.base
        $of: row
      item:
        $when:
          - of: row
            path: values.record.item
            exists: true
        $then:
          base:
            $copy: values.record.item.base
            $of: row
          entity:
            $apply: entity-source
            $with:
              ref:
                $copy: values.record.item.entity
                $of: row
  - id: physical-access
    with:
      - document
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: document
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  tables:
                    $each: tables
                    $of: document
                    $build:
                      $apply: physical-table-name
                      $with:
                        name:
                          $copy: .
                  methods:
                    $each: methods
                    $of: document
                    $build:
                      $apply: physical-method
                      $with:
                        method:
                          $copy: .
                priority: individual
                source:
                  id: contract
  - id: physical-table-name
    with:
      - name
    build:
      $apply: physical-read-name
      $with:
        table:
          $apply: physical-find-table
          $with:
            name:
              $copy: .
              $of: name
        fallback:
          $copy: .
          $of: name
  - id: physical-method
    with:
      - method
    build:
      $apply: physical-method-result
      $with:
        method:
          $copy: .
          $of: method
        table:
          $apply: physical-find-table
          $with:
            name:
              $copy: table
              $of: method
  - id: physical-method-result
    with:
      - method
      - table
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $apply: physical-walk
                  $with:
                    table:
                      $copy: .
                      $of: table
                    node:
                      $copy: .
                      $of: method
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  table:
                    $copy: id
                    $of: table
                priority: individual
                source:
                  id: contract
  - id: physical-walk
    with:
      - table
      - node
    build:
      $apply: physical-walk-node
      $with:
        table:
          $first:
            - $apply: physical-find-table
              $with:
                name:
                  $copy: table
                  $of: node
            - $copy: .
              $of: table
        node:
          $copy: .
          $of: node
  - id: physical-walk-node
    with:
      - table
      - node
    build:
      $first:
        - $apply: physical-map
          $with:
            table:
              $copy: .
              $of: table
            node:
              $copy: .
              $of: node
            entries:
              $eachEntry: .
              $of: node
              $flatten: true
              $build:
                - key: $key
                  value:
                    $first:
                      - $when:
                          - path: $key
                            equals: table
                        $then:
                          $copy: id
                          $of: table
                      # 数える要素のテーブル（counts）と、条件が通る明細テーブル（via）も、テーブルの ID で指す
                      - $when:
                          - path: $key
                            oneOf:
                              - counts
                              - via
                        $then:
                          $apply: physical-table-name
                          $with:
                            name:
                              $copy: .
                      - $apply: physical-walk
                        $with:
                          table:
                            $copy: .
                            $of: table
                          node:
                            $copy: .
        - $each: .
          $of: node
          $build:
            $apply: physical-walk
            $with:
              table:
                $copy: .
                $of: table
              node:
                $copy: .
        - $copy: .
          $of: node
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: physical-find-table
    with:
      - name
    build:
      $apply: contract-first
      $with:
        matches:
          $each:
            $view: physical-tables-input
          $build:
            $when:
              - or:
                  - path: values.record.originalName
                    equals:
                      $copy: .
                      $of: name
                  - path: values.record.name
                    equals:
                      $copy: .
                      $of: name
            $then:
              $copy: values.record
  - id: physical-read-name
    with:
      - table
      - fallback
    build:
      $first:
        - $copy: id
          $of: table
        - $copy: .
          $of: fallback
  - id: physical-map
    with:
      - table
      - node
      - entries
    when:
      - of: entries
        path: .
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - of: node
                path: item
                exists: true
            $then:
              - key: column
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: columns
                      $of: table
                      $build:
                        $when:
                          - path: item
                            equals:
                              $copy: item
                              $of: node
                        $then:
                          $copy: id
  # 個別の判断を当てる。対象は読み書きのまとまり（ACC-。Mapper の名前 mapper）とメソッド（MTH-。名前 name）。
  # このエンティティの項目への判断だけを当てる。どのエンティティにも無い対象と、その対象では置き換えられない値は、
  # 対象の無い変更として合成に渡し、エラーで止める
  - id: decided-item
    with:
      - item
    build:
      $apply: decided
      $with:
        composed:
          $compose:
            derived:
              - id:
                  $copy: id
                  $of: item
                value:
                  $copy: .
                  $of: item
                source:
                  id: rule-detail-table-access
                  document: .yde/transforms/design/detail/detail-table-access.yaml
            additions: []
            changes:
              $each: designDecisions
              $of: model
              $bind: dec
              $flatten: true
              $build:
                $apply: entity-decision
                $with:
                  decision:
                    $copy: .
                  item:
                    $copy: .
                    $of: item
                  known:
                    $each: entities
                    $of: model
                    $flatten: true
                    $build:
                      $when:
                        - path: id
                          equals:
                            $copy: entity
                            $of: dec
                      $then:
                        - $copy: id
  - id: entity-decision
    with:
      - decision
      - item
      - known
    when:
      - of: decision
        path: entity
        equals:
          $copy: entity
          $of: item
    build:
      $apply: decision-changes
      $with:
        decision:
          $copy: .
          $of: decision
        matches:
          $concat:
            - $when:
                - of: item
                  path: id
                  equals:
                    $copy: target
                    $of: decision
              $then:
                $apply: member-entries
                $with:
                  decision:
                    $copy: .
                    $of: decision
                  owner:
                    $copy: id
                    $of: item
                  place: []
                  allowed:
                    - mapper
            - $apply: listed-members
              $with:
                decision:
                  $copy: .
                  $of: decision
                owner:
                  $copy: id
                  $of: item
                collection: methods
                members:
                  $copy: methods
                  $of: item
                allowed:
                  - name
  - id: entity-decision
    with:
      - decision
      - item
      - known
    when:
      - of: known
        path: .
        empty: true
    build:
      $apply: decision-changes
      $with:
        decision:
          $copy: .
          $of: decision
        matches: []
  - id: entity-decision
    with:
      - decision
      - item
      - known
    build: []
  - id: decision-changes
    with:
      - decision
      - matches
    when:
      - of: matches
        path: .
        empty: false
    build:
      $copy: .
      $of: matches
  - id: decision-changes
    with:
      - decision
      - matches
    build:
      - target:
          $copy: target
          $of: decision
        set:
          $copy: set
          $of: decision
        priority: individual
        source:
          id:
            $copy: id
            $of: decision
          document: design/detail/inputs/decisions.yaml
  - id: listed-members
    with:
      - decision
      - owner
      - collection
      - members
      - allowed
    build:
      $each: .
      $of: members
      $flatten: true
      $build:
        $when:
          - path: id
            equals:
              $copy: target
              $of: decision
        $then:
          $apply: member-entries
          $with:
            decision:
              $copy: .
              $of: decision
            owner:
              $copy: .
              $of: owner
            place:
              - $copy: .
                $of: collection
              - $number: $index
            allowed:
              $copy: .
              $of: allowed
  - id: member-entries
    with:
      - decision
      - owner
      - place
      - allowed
    build:
      $eachEntry: set
      $of: decision
      $flatten: true
      $build:
        $first:
          - $when:
              - of: allowed
                path: .
                includes: $key
            $then:
              - target:
                  $copy: .
                  $of: owner
                path:
                  $concat:
                    - $copy: .
                      $of: place
                    - - $key
                value:
                  $copy: .
                priority: individual
                source:
                  id:
                    $copy: id
                    $of: decision
                  document: design/detail/inputs/decisions.yaml
          - - target:
                $format: '{t}（{k} は、この対象では置き換えられません）'
                $with:
                  t:
                    $copy: target
                    $of: decision
                  k: $key
              set:
                $copy: set
                $of: decision
              priority: individual
              source:
                id:
                  $copy: id
                  $of: decision
                document: design/detail/inputs/decisions.yaml
  # 当てた判断を、項目の decisions に残す（どの場所を、どの値に、どの判断で）
  - id: decided
    with:
      - composed
    when:
      - of: composed
        path: decisions
        empty: false
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: records[0].value
                  $of: composed
                source:
                  id: composed
            additions: []
            changes:
              - target: record
                set:
                  decisions:
                    $each: decisions
                    $of: composed
                    $build:
                      path:
                        $copy: path
                      value:
                        $copy: selected[0].value
                      by:
                        $each: selected
                        $build:
                          $copy: source.id
                priority: individual
                source:
                  id: decisions
  - id: decided
    with:
      - composed
    build:
      $copy: records[0].value
      $of: composed
