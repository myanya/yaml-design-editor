id: screen-designs-details-derived
name: 画面設計書（詳細画面）
description: >-
  詳細設計。ダッシュボードからたどれるエンティティ型ごとに、詳細画面の部品の木（page・notice・facts・section・table・actions）を 1 本にする。 HTML の手前の形で、③で Thymeleaf のテンプレートに機械的に写す。決め打ちの規則:
  項目は 2 段の facts（日付は型の format・選択肢は表示名・ 参照は名前と ID で参照先の詳細へのリンク・文章は改行を保つ）・繰り返しと入れ子の型は見出しつきの表（入れ子の型の行の右に、その型の操作のボタン）・ 画面の下に操作のボタン（Lifecycle
  の状態で出す・出さない。押すと操作の最初の画面へ。起点の画面の ID を from で渡す）・読み出しは Mapper の findDetail
scope: business
each: entities
output: design/system/derived/screen-designs-details/{id}.yaml
dependsOn:
  - system-actions-model
  - messages
  - screen-details
  - screen-styles
  - system-input-gate
  - system-screen-bindings
  - system-access-bindings
input:
  $apply: screen-model
  $with:
    original:
      $apply: model-input
      $with:
        row:
          $view: system-actions-model-input
          $one: true
    documents:
      $each:
        $view: screen-details-input
      $build:
        $copy: values.record
build:
  id:
    $format: DRV-document-screen-designs-details.{id}
  record:
    id:
      $format: DOC-screen-designs-details.{id}
    value:
      $apply: detail-presentation
      $with:
        built:
          $apply: linked-document
          $with:
            document:
              $when:
                - of: model
                  path: reach.entities
                  includes:
                    $copy: id
              id:
                $copy: id
              name:
                $format: '{label}詳細（画面設計書）'
              screens:
                - id:
                    $copy: id
                  template:
                    $format: '{id}/detail'
                  read:
                    $format: '{n}Mapper.findDetail'
                    $with:
                      'n':
                        $case:
                          $copy: id
                        $as: pascal
                  page:
                    title:
                      $format: '{label}詳細'
                    width: l
                    body:
                      $concat:
                        - - notice:
                              kind: done
                        - - facts:
                              of:
                                $copy: id
                              columns: 2
                              items:
                                $group:
                                  $apply: fields
                                $by:
                                  $when:
                                    - or:
                                        - not:
                                            path: field.base
                                            oneOf:
                                              - array
                                              - object
                                              - map
                                        - path: field.item.base
                                          equals: ref
                                  $then:
                                    $copy: field.key
                                $build:
                                  $apply: show
                                  $at: items[0].field
                        - $group:
                            $apply: fields
                          $by:
                            $when:
                              - path: field.base
                                equals: array
                              - path: field.item.base
                                equals: object
                              - path: field.item.entity
                                exists: false
                            $then:
                              $copy: field.key
                          $build:
                            section:
                              title:
                                $copy: items[0].field.label
                              body:
                                - table:
                                    of:
                                      $copy: key
                                    columns:
                                      $each: items[0].field.item.fields
                                      $apply: show
                        - $group:
                            $apply: fields
                          $by:
                            $when:
                              - path: field.item.entity
                                exists: true
                            $then:
                              $copy: field.key
                          $bind: t
                          $build:
                            section:
                              title:
                                $copy: items[0].field.label
                              body:
                                - table:
                                    of:
                                      $copy: key
                                    columns:
                                      $each: entities
                                      $of: model
                                      $flatten: true
                                      $build:
                                        $when:
                                          - path: id
                                            equals:
                                              $copy: items[0].field.item.entity
                                              $of: t
                                        $then:
                                          $each: aspects[0].fields
                                          $apply: show
                                    rowActions:
                                      $each: actions
                                      $of: model
                                      $build:
                                        $when:
                                          - path: target.entity
                                            equals:
                                              $copy: items[0].field.item.entity
                                              $of: t
                                        $then:
                                          $apply: button
                        - - actions:
                              $each: actions
                              $of: model
                              $build:
                                $when:
                                  - path: target.entity
                                    equals:
                                      $copy: id
                                      $of: element
                                $then:
                                  $apply: button
            bindings:
              $concat:
                - $each:
                    $view: system-screen-bindings-input
                  $flatten: true
                  $build:
                    $copy: values.bindings
                - $each:
                    $view: system-access-bindings-input
                  $flatten: true
                  $build:
                    $copy: values.bindings
            messages:
              $each:
                $view: messages-input
              $flatten: true
              $build:
                $copy: values.record.messages
        logical:
          $apply: contract-first
          $with:
            matches:
              $each:
                $view: screen-details-input
              $build:
                $when:
                  - path: values.record.id
                    equals:
                      $copy: id
                      $of: element
                $then:
                  $copy: values.record
    source:
      id: rule-screen-designs-details
      document: .yde/transforms/design/screen-designs-details-derived.yaml
rules:
  - id: fields
    build:
      $each: aspects
      $bind: asp
      $flatten: true
      $build:
        $each: fields
        $build:
          field:
            $copy: .
          schema:
            $copy: schema
            $of: asp
  - id: show
    build:
      item:
        $copy: key
      label:
        $copy: label
      format:
        $first:
          - $copy: format
          - $copy: item.format
      labels:
        $when:
          - path: base
            equals: enum
        $then:
          $copy: values
      link:
        $first:
          - $when:
              - path: base
                equals: ref
            $then:
              to:
                $copy: target
              name:
                $copy: targetTitle
          - $when:
              - path: item.base
                equals: ref
            $then:
              to:
                $copy: item.target
              name:
                $copy: item.targetTitle
              many: true
      keepBreaks:
        $when:
          - path: multiline
            equals: true
        $then: true
      mark:
        $when:
          - path: base
            equals: boolean
        $then:
          'true': 済
          'false': 未
      align:
        $when:
          - path: base
            oneOf:
              - int
              - number
        $then: end
  - id: button
    build:
      operation:
        $copy: id
      label:
        $copy: label
      kind: link
      to:
        $first:
          - $when:
              - path: params
                empty: false
            $then:
              $format: GET {u}
              $with:
                u:
                  $apply: url
          - $format: GET {u}/confirm
            $with:
              u:
                $apply: url
      from:
        $copy: id
        $of: element
      emphasis: secondary
      shownWhen:
        $apply: shown-when
  - id: url
    when:
      - path: target.entity
        exists: true
    build:
      $format: /{t}/{k}/{a}
      $with:
        t:
          $copy: subject
        k: '{id}'
        a:
          $copy: id
  - id: url
    build:
      $format: /{t}/{a}
      $with:
        t:
          $copy: subject
        a:
          $copy: id
  - id: shown-when
    when:
      - path: lifecycle.transitions
        exists: true
    build:
      $each: lifecycle.transitions
      $flatten: true
      $build:
        $each: from
        $build:
          $copy: value
  - id: shown-when
    build: いつも
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
  - id: screen-model
    with:
      - original
      - documents
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: original
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  entities:
                    $each: entities
                    $of: original
                    $bind: item
                    $build:
                      $apply: screen-source
                      $with:
                        original:
                          $copy: .
                        document:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: .
                              $of: documents
                              $build:
                                $when:
                                  - path: id
                                    equals:
                                      $copy: id
                                      $of: item
                                $then:
                                  $copy: .
                priority: individual
                source:
                  id: contract
  - id: screen-source
    with:
      - original
      - document
    when:
      - path: .
        of: document
        exists: true
    build:
      $copy: .
      $of: original
  - id: screen-source
    with:
      - original
      - document
    build:
      $copy: .
      $of: original
  - id: screen-parameter
    with:
      - parameter
      - value
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: parameter
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  $first:
                    - $copy: .
                      $of: value
                    - {}
                priority: individual
                source:
                  id: contract
  - id: detail-presentation
    with:
      - built
      - logical
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: built
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  name:
                    $format: '{name}（画面設計書）'
                    $with:
                      name:
                        $copy: name
                        $of: logical
                  screens:
                    $each: screens
                    $of: built
                    $build:
                      $apply: contract-result
                      $with:
                        combined:
                          $compose:
                            derived:
                              - id: record
                                value:
                                  $copy: .
                                source:
                                  id: contract
                            additions: []
                            changes:
                              - target: record
                                set:
                                  page:
                                    $apply: contract-result
                                    $with:
                                      combined:
                                        $compose:
                                          derived:
                                            - id: record
                                              value:
                                                $copy: page
                                              source:
                                                id: contract
                                          additions: []
                                          changes:
                                            - target: record
                                              set:
                                                title:
                                                  $copy: name
                                                  $of: logical
                                                body:
                                                  $apply: detail-items
                                                  $at: page.body
                                                  $with:
                                                    logical:
                                                      $copy: .
                                                      $of: logical
                                              priority: individual
                                              source:
                                                id: contract
                                priority: individual
                                source:
                                  id: contract
                priority: individual
                source:
                  id: contract
    when:
      - path: .
        of: built
        exists: true
  - id: detail-items
    with:
      - logical
    build:
      $first:
        - $apply: detail-map
          $with:
            node:
              $copy: .
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: detail-items
                    $with:
                      logical:
                        $copy: .
                        $of: logical
            logical:
              $copy: .
              $of: logical
        - $each: .
          $build:
            $apply: detail-items
            $with:
              logical:
                $copy: .
                $of: logical
        - $copy: .
  - id: detail-map
    with:
      - node
      - entries
      - logical
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: item
                of: node
                exists: true
              - path: label
                of: node
                exists: true
            $then:
              - key: label
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: items
                      $of: logical
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: item
                              $of: node
                        $then:
                          $copy: label
