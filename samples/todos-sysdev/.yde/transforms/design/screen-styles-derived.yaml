id: screen-styles-derived
name: 画面のクラスの対応表（Tailwind CSS）
description: >-
  詳細設計。画面設計書の部品と物理パラメータを写す、決まった名前のクラスと、その中身（Tailwind CSS のユーティリティ）の表を 1 本にする。 ③では、この表から CSS を作る（各クラスを @apply で定義する）。HTML
  には決まった名前のクラスだけを書き、見た目はこの表で変える。 クラスの名前の決まり: 部品の名前（page・section・facts・table・field
  など）と、パラメータの値（w-m・w-40ch・cols-2・button-primary・align-end・gap-l）
scope: business
output: design/system/derived/screen-styles/screen-styles.yaml
dependsOn:
  - system-actions-model
  - system-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-actions-model-input
      $one: true
build:
  id:
    $format: DRV-document-screen-styles.screen-styles
  record:
    id:
      $format: DOC-screen-styles.screen-styles
    value:
      id: screen-styles
      name: 画面のクラスの対応表（Tailwind CSS）
      naming:
        - part: 部品
          rule: 部品の名前をそのままクラスにする（page・notice・filters・section・facts・table・form・field・choices・rows・actions・matrix）
        - part: width（画面）
          rule: w-{s|m|l}
        - part: width（欄）
          rule: w-{n}ch（Tailwind の任意の値 w-[{n}ch]）
        - part: columns
          rule: cols-{n}
        - part: emphasis
          rule: button-{primary|secondary}
        - part: align
          rule: align-end
        - part: gap
          rule: gap-{s|m|l}
        - part: notice の種類
          rule: notice-{done|errors|refusal}
        - part: field の部品
          rule: control-{text|textarea|date|select|checkbox|number}
      classes:
        - class: page
          applies: mx-auto px-4 py-6 space-y-6
        - class: w-s
          applies: max-w-2xl
        - class: w-m
          applies: max-w-3xl
        - class: w-l
          applies: max-w-7xl
        - class: notice-done
          applies: rounded-md bg-green-50 p-3 text-green-800
        - class: notice-errors
          applies: rounded-md bg-red-50 p-3 text-red-800
        - class: notice-refusal
          applies: rounded-md bg-amber-50 p-3 text-amber-900
        - class: section
          applies: space-y-3
        - class: filters
          applies: flex flex-wrap items-end gap-4 rounded-md bg-gray-50 p-3
        - class: facts
          applies: grid grid-cols-[max-content_1fr] gap-x-4 gap-y-2
        - class: cols-2
          applies: md:grid-cols-[max-content_1fr_max-content_1fr]
        - class: table
          applies: min-w-full divide-y divide-gray-200 text-sm
        - class: matrix
          applies: min-w-full divide-y divide-gray-200 text-sm
        - class: form
          applies: space-y-4
        - class: field
          applies: flex flex-col gap-1
        - class: choices
          applies: flex flex-wrap gap-3
        - class: rows
          applies: min-w-full divide-y divide-gray-200 text-sm
        - class: control-text
          applies: rounded-md border-gray-300
        - class: control-textarea
          applies: rounded-md border-gray-300
        - class: control-date
          applies: rounded-md border-gray-300
        - class: control-select
          applies: rounded-md border-gray-300
        - class: control-number
          applies: rounded-md border-gray-300 text-right
        - class: control-checkbox
          applies: rounded border-gray-300
        - class: actions
          applies: flex flex-wrap gap-2
        - class: button-primary
          applies: rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700
        - class: button-secondary
          applies: rounded-md border border-gray-300 bg-white px-4 py-2 hover:bg-gray-50
        - class: align-end
          applies: text-right
        - class: gap-s
          applies: space-y-2
        - class: gap-m
          applies: space-y-4
        - class: gap-l
          applies: space-y-8
    source:
      id: rule-screen-styles
      document: .yde/transforms/design/screen-styles-derived.yaml
rules:
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
