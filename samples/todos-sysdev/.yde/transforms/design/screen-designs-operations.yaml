id: screen-designs-operations
name: 画面設計書（操作の画面）
description: >-
  詳細設計。ダッシュボードからたどれる操作ごとに、入力画面と確認画面の部品の木（page・notice・facts・form・field・rows・actions）と、
  フォームのクラス（項目の Java の型と Bean Validation）を 1 本にする。HTML の手前の形で、③で Thymeleaf のテンプレートに機械的に写す。
  決め打ちの規則（画面系の議論で決めたもの）: 入力欄は型から（一行＝text・複数行＝textarea・日付＝date・参照＝select・参照の配列＝choices・
  object の配列＝rows・真偽値＝checkbox）・検査は 必須＝NotNull・文字数＝Size・形式＝Pattern・重なり不可＝UniqueElements・
  空の欄は未入力（null。前後の空白は落とさない）・値を消すは、効果の「when: clear.項目」から、その項目の欄の横にチェック・
  変わった項目だけを送る操作は、確認画面に変わる項目だけを「今の値 → 新しい値」で出す（今の値は DB から）・物理パラメータは既定の表から
scope: business
each: actions
output: "design/generated/screen-designs/operations/{id}.yaml"
build:
  $when: [{ of: model, path: reach.operations, includes: { $copy: id } }]
  id: { $copy: id }
  name: { $format: "{label}（画面設計書）" }
  form:
    $when: [{ path: params, empty: false }]
    $then:
      class: { $format: "{n}Form", $with: { n: { $case: { $copy: id }, $as: pascal } } }
      emptyAsNull: 空の欄は未入力（null）として受け取る（前後の空白は落とさない）
      fields: { $each: params, $apply: java-field }
      classes:
        $each: params
        $build:
          $when: [{ or: [{ path: base, equals: object }, { path: item.base, equals: object }] }]
          name: { $apply: nested-class }
          fields: { $first: [{ $each: fields, $apply: java-field }, { $each: item.fields, $apply: java-field }] }
  screens:
    $concat:
      - $when: [{ path: params, empty: false }]
        $then:
          - id: { $format: "{id}/input" }
            template: { $format: "{t}/{a}/input", $with: { t: { $copy: subject }, a: { $copy: id } } }
            page:
              title: { $copy: label }
              width: m
              body:
                $concat:
                  - [{ notice: { kind: errors, for: form } }]
                  - $when: [{ path: target.entity, exists: true }]
                    $then: [{ facts: { of: { $copy: target.entity }, title: 対象, items: { $apply: receiver-items } } }]
                  - - form:
                        action: { $format: "POST {u}/confirm", $with: { u: { $apply: url } } }
                        object: { $format: "{n}Form", $with: { n: { $case: { $copy: id }, $as: pascal } } }
                        hidden: [from]
                        body:
                          $concat:
                            - $each: params
                              $build:
                                $when: [{ not: { path: base, equals: object } }]
                                $then: { $apply: field }
                            - - actions:
                                  - { label: 確認へ, kind: submit, emphasis: primary }
                                  - { label: やめる, kind: link, to: 起点の画面, emphasis: secondary }
      - - id: { $format: "{id}/confirm" }
          template: { $format: "{t}/{a}/confirm", $with: { t: { $copy: subject }, a: { $copy: id } } }
          page:
            title: { $format: "{label}（確認）" }
            width: m
            body:
              $concat:
                - [{ notice: { kind: refusal } }]
                - $when: [{ path: target.entity, exists: true }]
                  $then: [{ facts: { of: { $copy: target.entity }, title: 対象, items: { $apply: receiver-items } } }]
                - $when: [{ path: params, empty: false }]
                  $then:
                    - $first:
                        - $when: [{ path: input.submit, equals: changed }]
                          $then:
                            facts:
                              title: 変わる項目
                              kind: changes
                              compareWith: 今の値（DB から読む）
                              items: { $each: params, $build: { $when: [{ not: { path: base, equals: object } }], $then: { $apply: show } } }
                        - facts:
                            title: 入力した値
                            of: form
                            items: { $each: params, $build: { $when: [{ not: { path: base, equals: object } }], $then: { $apply: show } } }
                - $when: [{ path: lifecycle.transitions, exists: true }]
                  $then:
                    - facts:
                        title: 状態の移り方
                        items:
                          $each: lifecycle.transitions
                          $build:
                            label: 状態
                            from: { $each: from, $build: { $copy: label } }
                            to: { $copy: to.label }
                - - form:
                      action: { $format: "POST {u}", $with: { u: { $apply: url } } }
                      hidden:
                        $concat:
                          - $each: params
                            $build: { $copy: key }
                          - [flow, from]
                      body:
                        - actions:
                            $concat:
                              - [{ label: 確定, kind: submit, emphasis: primary }]
                              - $when: [{ path: params, empty: false }]
                                $then: [{ label: 入力へ戻る, kind: submit, action: { $format: "POST {u}/back", $with: { u: { $apply: url } } }, emphasis: secondary }]
                              - $when: [{ path: params, empty: true }]
                                $then: [{ label: やめる, kind: link, to: 起点の画面, emphasis: secondary }]
rules:
  # いまの場所＝操作。受け手のある操作は /型/{id}/操作、受け手の無い操作は /型/操作（画面定義書と同じ）
  - id: url
    when: [{ path: target.entity, exists: true }]
    build: { $format: "/{t}/{k}/{a}", $with: { t: { $copy: subject }, k: "{id}", a: { $copy: id } } }
  - id: url
    build: { $format: "/{t}/{a}", $with: { t: { $copy: subject }, a: { $copy: id } } }
  # いまの場所＝操作。受け手の要約に出す項目（ID と見出しの項目）
  - id: receiver-items
    build:
      $concat:
        - [{ item: id, label: ID }]
        - $each: entities
          $of: model
          $build:
            $when: [{ path: id, equals: { $copy: target.entity, $of: element } }, { path: title, exists: true }]
            item: { $copy: title }
  # いまの場所＝受け取る値（または object の配列の要素の項目）。入力欄 1 つ（A-1）
  - id: field
    when: [{ path: base, equals: array }, { path: item.base, equals: object }]
    build:
      rows:
        item: { $copy: key }
        label: { $copy: label }
        columns: { $each: item.fields, $apply: field }
        actions: [{ label: 行を足す, kind: submit, emphasis: secondary }, { label: この行を消す, kind: submit, emphasis: secondary, per: row }]
        redraw: 入力画面へ POST して描き直す
  - id: field
    when: [{ path: base, equals: array }, { path: item.base, equals: ref }]
    build:
      choices:
        item: { $copy: key }
        label: { $copy: label }
        control: checkboxes
        candidates: { $apply: candidates, $at: item }
        clearable: { $when: [{ path: clearedBy, exists: true }], $then: { flag: { $copy: clearedBy }, label: 値を消す } }
  - id: field
    build:
      field:
        item: { $copy: key }
        label: { $copy: label }
        control: { $apply: control }
        required: { $copy: required }
        width: { $apply: width }
        rows: { $when: [{ path: multiline, equals: true }], $then: 5 }
        align: { $when: [{ path: base, oneOf: [int, number] }], $then: end }
        values: { $when: [{ path: base, equals: enum }], $then: { $copy: values } }
        candidates: { $when: [{ path: base, equals: ref }], $then: { $apply: candidates } }
        clearable: { $when: [{ path: clearedBy, exists: true }], $then: { flag: { $copy: clearedBy }, label: 値を消す } }
  - id: control
    when: [{ path: base, equals: string }, { path: multiline, equals: true }]
    build: textarea
  - id: control
    when: [{ path: base, equals: date }]
    build: date
  - id: control
    when: [{ path: base, oneOf: [ref, enum] }]
    build: select
  - id: control
    when: [{ path: base, equals: boolean }]
    build: checkbox
  - id: control
    when: [{ path: base, oneOf: [int, number] }]
    build: number
  - id: control
    build: text
  # 欄の幅（物理パラメータ）: 一行の文字は最長の文字数（上限 40ch）、日付は 10ch
  - id: width
    when: [{ path: base, equals: date }]
    build: 10ch
  - id: width
    when: [{ path: base, equals: string }, { path: multiline, exists: false }, { path: maxLength, lte: 40 }]
    build: { $format: "{maxLength}ch" }
  - id: width
    when: [{ path: base, equals: string }, { path: multiline, exists: false }]
    build: 40ch
  # 参照の候補（参照先の型の一覧。名前は参照先の見出しの項目）
  - id: candidates
    build:
      entity: { $copy: target }
      name: { $copy: targetTitle }
      read: { $format: "{n}Mapper.selectAll", $with: { n: { $case: { $copy: target }, $as: pascal } } }
      empty: { $first: [{ $when: [{ path: required, equals: true }], $then: 選ばせる }, 未選択を選べる] }
  # 確認画面に出す値の形（A-3）
  - id: show
    build:
      item: { $copy: key }
      label: { $copy: label }
      format: { $first: [{ $copy: format }, { $copy: item.format }] }
      labels: { $when: [{ path: base, equals: enum }], $then: { $copy: values } }
      name:
        $first:
          - $when: [{ path: base, equals: ref }]
            $then: { entity: { $copy: target }, item: { $copy: targetTitle } }
          - $when: [{ path: item.base, equals: ref }]
            $then: { entity: { $copy: item.target }, item: { $copy: item.targetTitle } }
      keepBreaks: { $when: [{ path: multiline, equals: true }], $then: true }
  # フォームのクラスの項目（Java の型と Bean Validation。A-2）
  - id: java-field
    build:
      name: { $case: { $copy: key }, $as: camel }
      item: { $copy: key }
      type: { $apply: java-type }
      validations:
        $concat:
          - $when: [{ path: required, equals: true }]
            $then: [{ name: NotNull }]
          - $when: [{ or: [{ path: minLength, exists: true }, { path: maxLength, exists: true }] }]
            $then: [{ name: Size, min: { $copy: minLength }, max: { $copy: maxLength } }]
          - $when: [{ path: pattern, exists: true }]
            $then: [{ name: Pattern, regexp: { $copy: pattern } }]
          - $when: [{ path: base, equals: date }]
            $then: [{ name: DateTimeFormat, iso: DATE }]
          - $when: [{ path: unique, exists: true }]
            $then: [{ name: UniqueElements }]
          - $when: [{ path: item.base, equals: object }]
            $then: [{ name: Valid }]
  - id: java-type
    when: [{ path: base, equals: date }]
    build: LocalDate
  - id: java-type
    when: [{ path: base, equals: boolean }]
    build: boolean
  - id: java-type
    when: [{ path: base, equals: int }]
    build: Integer
  - id: java-type
    when: [{ path: base, equals: number }]
    build: BigDecimal
  - id: java-type
    when: [{ path: base, equals: array }, { path: item.base, equals: object }]
    build: { $format: "List<{n}>", $with: { n: { $apply: nested-class } } }
  - id: java-type
    when: [{ path: base, equals: array }]
    build: List<String>
  - id: java-type
    when: [{ path: base, equals: object }]
    build: { $apply: nested-class }
  - id: java-type
    build: String
  # 入れ子のクラスの名前（操作の名前＋項目のキー。配列の要素は Row）
  - id: nested-class
    when: [{ path: base, equals: array }]
    build: { $format: "{o}{k}Row", $with: { o: { $case: { $copy: id, $of: element }, $as: pascal }, k: { $case: { $copy: key }, $as: pascal } } }
  - id: nested-class
    build: { $format: "{o}{k}", $with: { o: { $case: { $copy: id, $of: element }, $as: pascal }, k: { $case: { $copy: key }, $as: pascal } } }
