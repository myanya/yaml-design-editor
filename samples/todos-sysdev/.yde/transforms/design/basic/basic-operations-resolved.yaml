id: basic-operations-resolved
name: 操作を解いた形（詳細設計の生成入力）
description: >-
  基本設計の「操作」の項目一覧（design/basic/final/operations/）を、詳細設計の導出が読む形に解く（ADR-0042）。
  操作の項目が ID で指しているもの（エンティティ・項目・遷移と状態・データの決まり・入力）を、指した先の値に置き換えて 1 つの並びにする。
  入力は基本設計の項目だけで、業務モデルを読まない。同じ解き方を、読む側の定義それぞれに書かないための途中経過で、
  詳細設計が項目を直接読むようになったら（移行計画の段階 4）なくす
scope: business
output: design/basic/composed/operations-resolved.yaml
dependsOn:
  - basic-operations
  - basic-entities
  - basic-states
  - basic-rules
  - basic-types
input:
  operations:
    $each:
      $view: basic-model-operations
    $build:
      $copy: values.record
  entities:
    $each:
      $view: basic-model-entities
    $build:
      $copy: values.record
  lifecycles:
    $each:
      $view: basic-model-states
    $build:
      $copy: values.record
  rules:
    $each:
      $view: basic-model-rules
    $build:
      $copy: values.record
  types:
    $each:
      $view: basic-model-types
    $build:
      $copy: values.record
build:
  id: SYS-basic-operations-resolved
  actions:
    $each: operations
    $bind: op
    $build:
      id:
        $copy: source
      kind:
        $copy: kind
      label:
        $copy: label
      description:
        $copy: description
      subject:
        $copy: subject
      target:
        $when:
          - path: receiver
            exists: true
        $then:
          entity:
            $apply: entity-source
            $with:
              ref:
                $copy: receiver
      creates:
        $each: creates
        $build:
          $apply: entity-source
          $with:
            ref:
              $copy: .
      params:
        $each: inputs
        $apply: flat
      # 人が入れる入力: 並びの番号（行が運ぶ値）と、画面が運ぶ入力（carried）を除いたもの
      inputParams:
        $each: inputs
        $build:
          $when:
            - or:
                - path: carried
                  exists: false
                - path: carried
                  equals: false
            - or:
                - of: op
                  path: row.param
                  exists: false
                - not:
                    path: id
                    equals:
                      $copy: row.param
                      $of: op
          $then:
            $apply: flat
      # 画面が運ぶ入力の読み元（入力のキー → 受け手から読む式）。入力画面の無い操作でも、確認画面を出すときに読む
      carriedValues:
        $apply: non-empty-map
        $with:
          entries:
            $each: inputs
            $build:
              $when:
                - path: carried
                  equals: true
                - path: initial
                  exists: true
              $then:
                key:
                  $copy: key
                value:
                  $copy: initial
      # 画面が運ぶ入力のキー（入力画面と確認画面で隠し項目にする）
      carried:
        $apply: non-empty-list
        $with:
          items:
            $each: inputs
            $build:
              $when:
                - path: carried
                  equals: true
              $then:
                $copy: key
      # 並びの 1 件を番号で指す操作: 並びの項目と、番号を受け取る入力
      rowOf:
        $when:
          - path: row
            exists: true
        $then:
          $apply: row-of
          $with:
            field:
              $apply: field-record
              $with:
                ref:
                  $copy: row.item
            param:
              $apply: input-record
              $with:
                ref:
                  $copy: row.param
                inputs:
                  $copy: inputs
      input:
        submit:
          $copy: submit
        initial:
          $apply: non-empty-map
          $with:
            entries:
              $each: inputs
              $build:
                $when:
                  - path: initial
                    exists: true
                  - or:
                      - path: carried
                        exists: false
                      - path: carried
                        equals: false
                $then:
                  key:
                    $copy: key
                  value:
                    $copy: initial
      require:
        $each: preconditions
        $build:
          id:
            $copy: source
          message:
            $copy: message
          rule:
            $copy: rule
      lifecycle:
        $when:
          - path: lifecycle
            exists: true
        $then:
          id:
            $apply: lifecycle-source
            $with:
              ref:
                $copy: lifecycle
          entry:
            $when:
              - path: entry
                exists: true
            $then:
              - $apply: state-of
                $with:
                  ref:
                    $apply: entry-to
                    $with:
                      ref:
                        $copy: entry
          transitions:
            $when:
              - path: transition
                exists: true
            $then:
              - $apply: transition
                $with:
                  record:
                    $apply: transition-record
                    $with:
                      ref:
                        $copy: transition
          refusal:
            $copy: refusal
          history:
            $copy: history
      effects:
        $each: effects
        $build:
          op:
            $copy: op
          source:
            $copy: cause
          auto:
            $copy: auto
          'on':
            $copy: 'on'
          of:
            $copy: of
          within:
            $copy: within
          bind:
            $copy: bind
          entity:
            $copy: subject
          schema:
            $copy: schema
          path:
            $copy: path
          field:
            $first:
              - $when:
                  - path: item
                    exists: true
                $then:
                  $apply: effect-field
                  $with:
                    field:
                      $apply: field-record
                      $with:
                        ref:
                          $copy: item
              - $when:
                  - path: collection
                    exists: true
                $then:
                  key:
                    $copy: collection.key
                  base: array
                  item:
                    base: object
                    entity:
                      $apply: entity-source
                      $with:
                        ref:
                          $copy: collection.element
          row:
            $when:
              - path: row
                exists: true
            $then:
              param:
                $apply: input-key
                $with:
                  ref:
                    $copy: row
                  inputs:
                    $copy: inputs
                    $of: op
          when:
            $copy: when
          # 自動で入る版（revision）は、値を「受け手のその項目の、次の値」として渡す（読む側は next の場所として解く）
          value:
            $first:
              - $when:
                  - path: auto
                    equals: revision
                $then:
                  $entries:
                    - key: $$copy
                      value:
                        $copy: path
                    - key: $$of
                      value: next
              - $copy: value
          values:
            $copy: values
          params:
            $copy: params
          id:
            $copy: identifier
          numbering:
            $copy: numbering
          written:
            $copy: written
      checks:
        $each: checks
        $build:
          $apply: check
          $with:
            rule:
              $apply: rule-record
              $with:
                ref:
                  $copy: rule
            items:
              $copy: items
            multiple:
              $copy: multiple
            params:
              $when:
                - path: params
                  exists: true
              $then:
                $each: params
                $build:
                  $apply: input-key
                  $with:
                    ref:
                      $copy: .
                    inputs:
                      $copy: inputs
                      $of: op
      provides:
        $copy: provides
rules:
  # 入力・並びの要素・まとまりの項目: 項目の決まりを、読む側の形（型は業務モデルの型の名前、参照先はエンティティ型）に戻す。
  # 入力を丸ごと写す読み手があるので、キーは業務モデルと同じ順に並べる
  - id: flat
    build:
      key:
        $copy: key
      label:
        $copy: label
      type:
        $first:
          - $apply: type-name
            $with:
              ref:
                $copy: type
          - $copy: builtin
          - $copy: base
      base:
        $copy: base
      description:
        $copy: description
      required:
        $copy: required
      default:
        $copy: default
      unique:
        $copy: unique
      refTarget:
        $copy: reference.target
      format:
        $copy: format
      min:
        $copy: min
      max:
        $copy: max
      minLength:
        $copy: minLength
      maxLength:
        $copy: maxLength
      multiline:
        $copy: multiline
      pattern:
        $copy: pattern
      values:
        $copy: values
      idPatternLayers:
        $copy: reference.idPatternLayers
      scope:
        $copy: reference.scope
      relation:
        $copy: reference.relation
      idPatterns:
        $copy: reference.idPatterns
      schemas:
        $copy: reference.schemas
      overrides:
        $copy: overrides
      builtinType:
        $when:
          - path: builtin
            exists: true
        $then:
          name:
            $copy: builtin
          base:
            $copy: base
          builtin: true
      targets:
        $when:
          - path: reference.entities
            exists: true
        $then:
          $each: reference.entities
          $build:
            $apply: entity-source
            $with:
              ref:
                $copy: .
      target:
        $copy: reference.subject
      targetTitle:
        $copy: reference.title
      targetLabel:
        $copy: reference.label
      item:
        $when:
          - path: item
            exists: true
        $then:
          $apply: flat
          $at: item
      fields:
        $when:
          - path: fields
            exists: true
        $then:
          $each: fields
          $apply: flat
      clearedBy:
        $copy: clearedBy
      carried:
        $copy: carried
  # 並びの行の指定: 並びの項目（エンティティの項目）から、キー・名称・要素の項目を引く
  - id: row-of
    with:
      - field
      - param
    build:
      field:
        $copy: key
        $of: field
      param:
        $copy: key
        $of: param
      # 番号を受け取る入力（名称など）
      item:
        $apply: flat
        $at: .
        $of: param
      entity:
        $apply: entity-source
        $with:
          ref:
            $copy: owner
            $of: field
      label:
        $copy: label
        $of: field
      fields:
        $each: item.fields
        $of: field
        $build:
          key:
            $copy: key
          label:
            $copy: label
          base:
            $copy: base
          required:
            $copy: required
          format:
            $copy: format
          multiline:
            $copy: multiline
          values:
            $copy: values
          item:
            $when:
              - path: item
                exists: true
            $then:
              base:
                $copy: item.base
              format:
                $copy: item.format
  # 効果が書く項目: キー・基底の種類・並びの要素
  - id: effect-field
    with:
      - field
    build:
      key:
        $copy: key
        $of: field
      base:
        $copy: base
        $of: field
      item:
        $when:
          - of: field
            path: item
            exists: true
        $then:
          base:
            $copy: item.base
            $of: field
          entity:
            $when:
              - of: field
                path: item.entity
                exists: true
            $then:
              $apply: entity-source
              $with:
                ref:
                  $copy: item.entity
                  $of: field
  # 確かめるデータの決まり: 形・種類・厳しさは、指した決まりから引く
  - id: check
    with:
      - rule
      - items
      - multiple
      - params
    build:
      constraint:
        $copy: source
        $of: rule
      form:
        $copy: form
        $of: rule
      kind:
        $copy: kind
        $of: rule
      level:
        $copy: level
        $of: rule
      items:
        $copy: .
        $of: items
      multiple:
        $copy: .
        $of: multiple
      params:
        $copy: .
        $of: params
  # 遷移: 前の状態と後の状態を、指した状態から引く
  - id: transition
    with:
      - record
    build:
      from:
        $each: from
        $of: record
        $build:
          $apply: state-of
          $with:
            ref:
              $copy: .
      to:
        $apply: state-of
        $with:
          ref:
            $copy: to
            $of: record
  # ここから下は、ID から項目を引く規則
  - id: entity-source
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: entities
          $of: model
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $copy: source
  - id: type-name
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: types
          $of: model
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $copy: name
  - id: field-record
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: entities
          $of: model
          $flatten: true
          $build:
            $each: items
            $build:
              $when:
                - path: id
                  equals:
                    $copy: .
                    $of: ref
              $then:
                $copy: .
  - id: input-key
    with:
      - ref
      - inputs
    build:
      $apply: first
      $with:
        items:
          $each: .
          $of: inputs
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $copy: key
  - id: input-record
    with:
      - ref
      - inputs
    build:
      $apply: first
      $with:
        items:
          $each: .
          $of: inputs
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $copy: .
  - id: non-empty-list
    with:
      - items
    when:
      - of: items
        path: .
        empty: false
    build:
      $copy: .
      $of: items
  - id: non-empty-map
    with:
      - entries
    when:
      - of: entries
        path: .
        empty: false
    build:
      $entries:
        $copy: .
        $of: entries
  - id: non-empty-map
    with:
      - entries
    build:
      $copy: missing
      $of: entries
  - id: rule-record
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: rules
          $of: model
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $copy: .
  - id: lifecycle-source
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: lifecycles
          $of: model
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: ref
            $then:
              $copy: source
  - id: transition-record
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: lifecycles
          $of: model
          $flatten: true
          $build:
            $each: transitions
            $build:
              $when:
                - path: id
                  equals:
                    $copy: .
                    $of: ref
              $then:
                $copy: .
  - id: entry-to
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: lifecycles
          $of: model
          $flatten: true
          $build:
            $each: entries
            $build:
              $when:
                - path: id
                  equals:
                    $copy: .
                    $of: ref
              $then:
                $copy: to
  - id: state-of
    with:
      - ref
    build:
      $apply: first
      $with:
        items:
          $each: lifecycles
          $of: model
          $flatten: true
          $build:
            $each: states
            $build:
              $when:
                - path: id
                  equals:
                    $copy: .
                    $of: ref
              $then:
                id:
                  $copy: source
                label:
                  $copy: label
                value:
                  $copy: value
  - id: first
    with:
      - items
    build:
      $copy: '[0]'
      $of: items
