id: screen-operations-derived
name: 画面定義書（操作の画面）
description: >-
  基本設計。ダッシュボードからたどれる操作ごとに、入力画面と確認画面を 1 本にする（業務モデルの項の reach.operations）。 決め打ちの規則（画面系の議論で決めたもの）: 受け取る値がある操作は 入力画面 → 確認画面 → 確定、無い操作は 確認画面 → 確定・
  入力の値は hidden 項目で持ち回り、確定で入力検査・状態・前提をすべて確かめ直す・確定の後は起点の画面へリダイレクトし、完了の知らせを出す・ 起点の画面は画面の ID で受け取る（URL は受け取らない）・断ったときは確認画面に断りの文を出す。URL は業務の ID
  のまま
scope: business
each: actions
output: design/basic/derived/documents/screen-operations/{id}.yaml
dependsOn:
  - system-actions-model
  - basic-document-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-actions-model-input
      $one: true
build:
  id:
    $format: DRV-document-screen-operations.{id}
  record:
    id:
      $format: DOC-screen-operations.{id}
    value:
      $apply: linked-document
      $with:
        document:
          $when:
            - of: model
              path: reach.operations
              includes:
                $copy: id
          id:
            $copy: id
          name:
            $copy: label
          kind: operation
          target:
            $copy: target.entity
          starts:
            $concat:
              - $each: dashboards
                $of: model
                $build:
                  $when:
                    - path: actions
                      includes:
                        $copy: id
                        $of: element
                  screen:
                    $copy: id
                  place: 上部のボタン
              - $each: dashboards
                $of: model
                $bind: d
                $flatten: true
                $build:
                  $each: sections
                  $bind: sec
                  $flatten: true
                  $build:
                    $each: views
                    $of: model
                    $build:
                      $when:
                        - path: id
                          equals:
                            $copy: view
                            $of: sec
                        - path: kind
                          equals: grid
                        - path: rows
                          equals:
                            $copy: target.entity
                            $of: element
                        - of: element
                          path: rowOf
                          exists: false
                      screen:
                        $copy: id
                        $of: d
                      place:
                        $format: 区画「{l}」の行のボタン
                        $with:
                          l:
                            $copy: label
                            $of: sec
              - $when:
                  - path: target.entity
                    exists: true
                  - path: rowOf
                    exists: false
                  - of: model
                    path: reach.entities
                    includes:
                      $copy: target.entity
                $then:
                  - screen:
                      $copy: target.entity
                    place: 画面のボタン
              # 並びの 1 件を番号で指す操作は、行が決まる所（詳細画面のその並びの表の行）からだけ始まる
              - $when:
                  - path: rowOf
                    exists: true
                  - of: model
                    path: reach.entities
                    includes:
                      $copy: target.entity
                $then:
                  - screen:
                      $copy: target.entity
                    place:
                      $format: 表「{rowOf.label}」の行のボタン
              - $each: entities
                $of: model
                $build:
                  $when:
                    - path: id
                      equals:
                        $copy: target.entity
                        $of: element
                    - path: owner.entity
                      exists: true
                  screen:
                    $copy: owner.entity
                  place:
                    $format: 表「{l}」の行のボタン
                    $with:
                      l:
                        $copy: label
          shownWhen:
            $apply: shown-when
          # 行から受け取る値: 並びの番号は行のボタンが運び、人は入力しない（入力・確認の画面では hidden 項目で持ち回す）
          row:
            $when:
              - path: rowOf
                exists: true
            $then:
              key:
                $copy: rowOf.param
              label:
                $copy: rowOf.item.label
              table:
                $copy: rowOf.field
              tableLabel:
                $copy: rowOf.label
              carried: 行のボタンが運ぶ（URL のパラメータ）。入力・確認の画面では hidden 項目で持ち回す
          input:
            $when:
              - path: inputParams
                empty: false
            $then:
              screen:
                $format: '{id}/input'
              request:
                $format: GET {u}
                $with:
                  u:
                    $apply: url
              items:
                $each: inputParams
                $build:
                  $copy: .
              initial:
                $copy: input.initial
              submit:
                $copy: input.submit
          confirm:
            screen:
              $format: '{id}/confirm'
            request:
              $first:
                - $when:
                    - path: inputParams
                      empty: false
                  $then:
                    $format: POST {u}/confirm
                    $with:
                      u:
                        $apply: url
                - $format: GET {u}/confirm
                  $with:
                    u:
                      $apply: url
            shows:
              $each: inputParams
              $build:
                $copy: label
            stateChange:
              $each: lifecycle.transitions
              $build:
                from:
                  $each: from
                  $build:
                    $copy: label
                to:
                  $copy: to.label
            back:
              $when:
                - path: inputParams
                  empty: false
              $then:
                request:
                  $format: POST {u}/back
                  $with:
                    u:
                      $apply: url
                to:
                  $format: '{id}/input'
          execute:
            request:
              $format: POST {u}
              $with:
                u:
                  $apply: url
            returns: 起点の画面（starts の画面。画面の ID で受け取る）
            notice:
              $format: '{id}.done'
            refusals:
              $concat:
                - $when:
                    - path: lifecycle.refusal
                      exists: true
                  $then:
                    - key:
                        $format: '{id}.state'
                      message:
                        $copy: lifecycle.refusal
                - $each: require
                  $build:
                    $when:
                      - path: id
                        exists: true
                    key:
                      $format: '{a}.{r}'
                      $with:
                        a:
                          $copy: id
                          $of: element
                        r:
                          $copy: id
                    message:
                      $copy: message
                - $each: checks
                  $bind: c
                  $flatten: true
                  $build:
                    $each: constraints
                    $of: model
                    $build:
                      $when:
                        - path: id
                          equals:
                            $copy: constraint
                            $of: c
                        - path: level
                          equals: error
                        - or:
                            - path: form
                              equals: element
                            - path: rule.match[1].edge.contains
                              equals: true
                            - path: kind
                              equals: acyclic
                      key:
                        $format: check.{id}
                      message:
                        $first:
                          - $copy: message
                          - $when:
                              - path: kind
                                equals: acyclic
                            $then:
                              $format: 「{r}」をたどると、自分（{id}）に戻ります（循環はできません）
                              $with:
                                r:
                                  $copy: relationLabel
                                id: '{id}'
                          - $copy: label
            onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
          originalRoutes:
            $apply: operation-routes
            $with:
              value:
                $when:
                  - of: model
                    path: reach.operations
                    includes:
                      $copy: id
                id:
                  $copy: id
                name:
                  $copy: label
                kind: operation
                target:
                  $copy: target.entity
                starts:
                  $concat:
                    - $each: dashboards
                      $of: model
                      $build:
                        $when:
                          - path: actions
                            includes:
                              $copy: id
                              $of: element
                        screen:
                          $copy: id
                        place: 上部のボタン
                    - $each: dashboards
                      $of: model
                      $bind: d
                      $flatten: true
                      $build:
                        $each: sections
                        $bind: sec
                        $flatten: true
                        $build:
                          $each: views
                          $of: model
                          $build:
                            $when:
                              - path: id
                                equals:
                                  $copy: view
                                  $of: sec
                              - path: kind
                                equals: grid
                              - path: rows
                                equals:
                                  $copy: target.entity
                                  $of: element
                              - of: element
                                path: rowOf
                                exists: false
                            screen:
                              $copy: id
                              $of: d
                            place:
                              $format: 区画「{l}」の行のボタン
                              $with:
                                l:
                                  $copy: label
                                  $of: sec
                    - $when:
                        - path: target.entity
                          exists: true
                        - path: rowOf
                          exists: false
                        - of: model
                          path: reach.entities
                          includes:
                            $copy: target.entity
                      $then:
                        - screen:
                            $copy: target.entity
                          place: 画面のボタン
                    # 並びの 1 件を番号で指す操作は、行が決まる所（詳細画面のその並びの表の行）からだけ始まる
                    - $when:
                        - path: rowOf
                          exists: true
                        - of: model
                          path: reach.entities
                          includes:
                            $copy: target.entity
                      $then:
                        - screen:
                            $copy: target.entity
                          place:
                            $format: 表「{rowOf.label}」の行のボタン
                    - $each: entities
                      $of: model
                      $build:
                        $when:
                          - path: id
                            equals:
                              $copy: target.entity
                              $of: element
                          - path: owner.entity
                            exists: true
                        screen:
                          $copy: owner.entity
                        place:
                          $format: 表「{l}」の行のボタン
                          $with:
                            l:
                              $copy: label
                shownWhen:
                  $apply: shown-when
                # 行から受け取る値: 並びの番号は行のボタンが運び、人は入力しない（入力・確認の画面では hidden 項目で持ち回す）
                row:
                  $when:
                    - path: rowOf
                      exists: true
                  $then:
                    key:
                      $copy: rowOf.param
                    label:
                      $copy: rowOf.item.label
                    table:
                      $copy: rowOf.field
                    tableLabel:
                      $copy: rowOf.label
                    carried: 行のボタンが運ぶ（URL のパラメータ）。入力・確認の画面では hidden 項目で持ち回す
                input:
                  $when:
                    - path: inputParams
                      empty: false
                  $then:
                    screen:
                      $format: '{id}/input'
                    request:
                      $format: GET {u}
                      $with:
                        u:
                          $apply: url
                    items:
                      $each: inputParams
                      $build:
                        key:
                          $copy: key
                        label:
                          $copy: label
                        type:
                          $copy: type
                        base:
                          $copy: base
                        required:
                          $copy: required
                        minLength:
                          $copy: minLength
                        maxLength:
                          $copy: maxLength
                        pattern:
                          $copy: pattern
                        multiline:
                          $copy: multiline
                        values:
                          $copy: values
                        target:
                          $first:
                            - $copy: target
                            - $copy: item.target
                        many:
                          $when:
                            - path: base
                              equals: array
                          $then: true
                    initial:
                      $copy: input.initial
                    submit:
                      $copy: input.submit
                confirm:
                  screen:
                    $format: '{id}/confirm'
                  request:
                    $first:
                      - $when:
                          - path: inputParams
                            empty: false
                        $then:
                          $format: POST {u}/confirm
                          $with:
                            u:
                              $apply: url
                      - $format: GET {u}/confirm
                        $with:
                          u:
                            $apply: url
                  shows:
                    $each: inputParams
                    $build:
                      $copy: label
                  stateChange:
                    $each: lifecycle.transitions
                    $build:
                      from:
                        $each: from
                        $build:
                          $copy: label
                      to:
                        $copy: to.label
                  back:
                    $when:
                      - path: inputParams
                        empty: false
                    $then:
                      request:
                        $format: POST {u}/back
                        $with:
                          u:
                            $apply: url
                      to:
                        $format: '{id}/input'
                execute:
                  request:
                    $format: POST {u}
                    $with:
                      u:
                        $apply: url
                  returns: 起点の画面（starts の画面。画面の ID で受け取る）
                  notice:
                    $format: '{id}.done'
                  refusals:
                    $concat:
                      - $when:
                          - path: lifecycle.refusal
                            exists: true
                        $then:
                          - key:
                              $format: '{id}.state'
                            message:
                              $copy: lifecycle.refusal
                      - $each: require
                        $build:
                          $when:
                            - path: id
                              exists: true
                          key:
                            $format: '{a}.{r}'
                            $with:
                              a:
                                $copy: id
                                $of: element
                              r:
                                $copy: id
                          message:
                            $copy: message
                      - $each: checks
                        $bind: c
                        $flatten: true
                        $build:
                          $each: constraints
                          $of: model
                          $build:
                            $when:
                              - path: id
                                equals:
                                  $copy: constraint
                                  $of: c
                              - path: level
                                equals: error
                              - or:
                                  - path: form
                                    equals: element
                                  - path: rule.match[1].edge.contains
                                    equals: true
                                  - path: kind
                                    equals: acyclic
                            key:
                              $format: check.{id}
                            message:
                              $first:
                                - $copy: message
                                - $when:
                                    - path: kind
                                      equals: acyclic
                                  $then:
                                    $format: 「{r}」をたどると、自分（{id}）に戻ります（循環はできません）
                                    $with:
                                      r:
                                        $copy: relationLabel
                                      id: '{id}'
                                - $copy: label
                  onRefusal: 確認画面に断りの文を出す（受け取る値が原因のデータの決まりは、確認へで入力画面の欄の横にも。エラー定義書）
        bindings:
          $concat: []
        messages: []
    source:
      id: rule-screen-operations
      document: .yde/transforms/design/basic/screen-operations-derived.yaml
rules:
  - id: shown-when
    when:
      - path: lifecycle.transitions
        exists: true
    build:
      $each: lifecycle.transitions
      $flatten: true
      $build:
        $each: from
        $build:
          value:
            $copy: value
          label:
            $copy: label
  - id: shown-when
    build: いつも
  - id: url
    when:
      - path: target.entity
        exists: true
    build:
      $format: /{t}/{k}/{a}
      $with:
        t:
          $copy: subject
        k: '{id}'
        a:
          $copy: id
  - id: url
    build:
      $format: /{t}/{a}
      $with:
        t:
          $copy: subject
        a:
          $copy: id
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
  - id: operation-routes
    with:
      - value
    build:
      input:
        $copy: input.request
        $of: value
      confirm:
        $copy: confirm.request
        $of: value
      back:
        $copy: confirm.back.request
        $of: value
      execute:
        $copy: execute.request
        $of: value
