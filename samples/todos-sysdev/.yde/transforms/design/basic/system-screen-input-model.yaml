id: system-screen-input-model
name: 確定した画面入力を共有する
scope: business
dependsOn:
  - system-model
  - basic-operations-resolved
  - screen-operation-candidates
output: design/basic/composed/documents/system-screen-input-model.yaml
input:
  $apply: screen-model
  $with:
    original:
      $apply: model-input
      $with:
        row:
          $view: system-model-input
          $one: true
        operations:
          $view: basic-operations-resolved-input
          $one: true
    documents:
      $each:
        $view: screen-operation-candidates-input
      $build:
        $copy: values.record
build:
  id: SYS-system-screen-input-model
  model:
    $copy: .
rules:
  # 操作は、型・項目・操作への個別の判断を当てた基本設計の「操作」の項目を解いたもの（basic-operations-resolved）で置き換えて読む
  - id: model-input
    with:
      - row
      - operations
    build:
      $apply: model-with-operations
      $with:
        composed:
          $compose:
            derived:
              - id: model
                value:
                  $copy: values.model
                  $of: row
                source:
                  id: system-model
            additions: []
            changes:
              - target: model
                set:
                  actions:
                    $copy: values.actions
                    $of: operations
                priority: individual
                source:
                  id: basic-operations
  - id: model-with-operations
    with:
      - composed
    build:
      $copy: records[0].value
      $of: composed
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: screen-model
    with:
      - original
      - documents
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: original
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  actions:
                    $each: actions
                    $of: original
                    $bind: item
                    $build:
                      $apply: screen-source
                      $with:
                        original:
                          $copy: .
                        document:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: .
                              $of: documents
                              $build:
                                $when:
                                  - path: id
                                    equals:
                                      $copy: id
                                      $of: item
                                $then:
                                  $copy: .
                priority: individual
                source:
                  id: contract
  - id: screen-source
    with:
      - original
      - document
    when:
      - path: .
        of: document
        exists: true
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: original
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  label:
                    $copy: name
                    $of: document
                  params:
                    $each: params
                    $of: original
                    $bind: parameter
                    $build:
                      $apply: screen-parameter
                      $with:
                        parameter:
                          $copy: .
                        value:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: input.items
                              $of: document
                              $build:
                                $when:
                                  - path: key
                                    equals:
                                      $copy: key
                                      $of: parameter
                                $then:
                                  $copy: .
                  input:
                    $apply: screen-update
                    $with:
                      record:
                        $first:
                          - $copy: input
                            $of: original
                          - {}
                      set:
                        initial:
                          $copy: input.initial
                          $of: document
                        submit:
                          $copy: input.submit
                          $of: document
                priority: individual
                source:
                  id: contract
  - id: screen-source
    with:
      - original
      - document
    build:
      $copy: .
      $of: original
  - id: screen-parameter
    with:
      - parameter
      - value
    build:
      $apply: screen-update
      $with:
        record:
          $copy: .
          $of: parameter
        set:
          $copy: .
          $of: value
  - id: screen-update
    with:
      - record
      - set
    when:
      - of: set
        path: .
        empty: false
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: record
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  $copy: .
                  $of: set
                priority: individual
                source:
                  id: contract
  - id: screen-update
    with:
      - record
      - set
    build:
      $copy: .
      $of: record
