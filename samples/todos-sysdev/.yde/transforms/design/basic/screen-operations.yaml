id: screen-operations
name: 画面定義書（操作の画面）の保存
scope: business
dependsOn:
  - screen-operation-candidates
  - messages
each: documents
output: '{file}.yaml'
input:
  documents:
    $each:
      $view: screen-operation-candidates-input
    $build:
      file:
        $format: design/basic/final/screens/operations/{id}
        $with:
          id:
            $copy: values.record.id
      document:
        $copy: values.record
build:
  $apply: linked-document
  $with:
    document:
      $copy: document
    bindings: []
    messages:
      $each:
        $view: messages-input
      $flatten: true
      $build:
        $copy: values.record.messages
rules:
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
