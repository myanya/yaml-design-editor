id: system-actions-model
name: 確定した操作を後段へ渡す
scope: business
dependsOn:
  - system-model
  - action-specs
output: design/basic/composed/documents/system-actions-model.yaml
input:
  $apply: model
  $with:
    row:
      $view: system-model-input
      $one: true
    actions:
      $each:
        $view: action-specs-input
      $build:
        $copy: values.record
build:
  id: SYS-system-actions-model
  model:
    $copy: .
rules:
  - id: model
    with:
      - row
      - actions
    build:
      $apply: result
      $with:
        composed:
          $compose:
            derived:
              - id: model
                value:
                  $copy: values.model
                  $of: row
                source:
                  id: system-model
            additions: []
            changes:
              - target: model
                set:
                  actions:
                    $each: values.model.actions
                    $of: row
                    $bind: originalAction
                    $build:
                      $apply: action
                      $with:
                        document:
                          $apply: contract-first
                          $with:
                            matches:
                              $each: .
                              $of: actions
                              $build:
                                $when:
                                  - path: id
                                    equals:
                                      $copy: id
                                      $of: originalAction
                                $then:
                                  $copy: .
                        original:
                          - $copy: .
                        entities:
                          $copy: values.model.entities
                          $of: row
                priority: individual
                source:
                  id: action-specs
  - id: action
    with:
      - document
      - original
      - entities
    build:
      $apply: action-result
      $with:
        composed:
          $compose:
            derived:
              - id: action
                value:
                  $copy: '[0]'
                  $of: original
                source:
                  id: derived-action
            additions: []
            changes:
              - target: action
                set:
                  id:
                    $copy: id
                    $of: document
                  label:
                    $copy: name
                    $of: document
                  description:
                    $copy: description
                    $of: document
                  subject:
                    $copy: subject
                    $of: document
                  kind:
                    $copy: kind
                    $of: document
                  params:
                    $copy: inputs
                    $of: document
                  # 人が入れる受け取る値: 並びの番号（行が運ぶ値）を除いたもの。画面の入力欄・確認の表示はこれで作る
                  inputParams:
                    $apply: input-params
                    $with:
                      inputs:
                        $copy: inputs
                        $of: document
                      rowParam:
                        $apply: contract-first
                        $with:
                          matches:
                            $each: effects
                            $of: document
                            $build:
                              $when:
                                - path: row
                                  exists: true
                              $then:
                                $copy: row.param
                  lifecycle:
                    $copy: state
                    $of: document
                  require:
                    $copy: preconditions
                    $of: document
                  effects:
                    $copy: effects
                    $of: document
                  # 並びの 1 件を番号で指す操作（効果に row を持つ）: どの並びの行を、どの受け取る値で指すか。
                  # 画面はこの操作を、その並びの表の行のボタンにし、番号は行が運ぶ（人は入力しない）
                  rowOf:
                    $apply: contract-first
                    $with:
                      matches:
                        $each: effects
                        $of: document
                        $bind: ef
                        $build:
                          $when:
                            - path: row
                              exists: true
                          $then:
                            field:
                              $copy: field.key
                            param:
                              $copy: row.param
                            schema:
                              $copy: schema
                            entity:
                              $copy: entity
                            # 並びの見出し（その項目の名称）
                            label:
                              $apply: contract-first
                              $with:
                                matches:
                                  $each: .
                                  $of: entities
                                  $bind: en
                                  $flatten: true
                                  $build:
                                    $each: aspects
                                    $flatten: true
                                    $build:
                                      $each: fields
                                      $build:
                                        $when:
                                          - of: en
                                            path: id
                                            equals:
                                              $copy: entity
                                              $of: ef
                                          - path: key
                                            equals:
                                              $copy: field.key
                                              $of: ef
                                        $then:
                                          $copy: label
                            # 並びの要素の項目（対象の行を見せるのに使う）
                            fields:
                              $apply: contract-first
                              $with:
                                matches:
                                  $each: .
                                  $of: entities
                                  $bind: en
                                  $flatten: true
                                  $build:
                                    $each: aspects
                                    $flatten: true
                                    $build:
                                      $each: fields
                                      $build:
                                        $when:
                                          - of: en
                                            path: id
                                            equals:
                                              $copy: entity
                                              $of: ef
                                          - path: key
                                            equals:
                                              $copy: field.key
                                              $of: ef
                                        $then:
                                          $copy: item.fields
                            # 番号を受け取る値の定義（名称など）
                            item:
                              $apply: contract-first
                              $with:
                                matches:
                                  $each: inputs
                                  $of: document
                                  $build:
                                    $when:
                                      - path: key
                                        equals:
                                          $copy: row.param
                                          $of: ef
                                    $then:
                                      $copy: .
                  target:
                    $copy: receiver
                    $of: document
                  input:
                    $apply: action-input
                    $with:
                      policy:
                        $first:
                          - $copy: inputPolicy
                            $of: document
                          - {}
                      initial:
                        $copy: initial
                        $of: document
                  checks:
                    $copy: checks
                    $of: document
                  provides:
                    $copy: provides
                    $of: document
                priority: individual
                source:
                  id:
                    $copy: designId
                    $of: document
  - id: input-params
    with:
      - inputs
      - rowParam
    when:
      - of: rowParam
        path: .
        exists: true
    build:
      $each: .
      $of: inputs
      $build:
        $when:
          - path: key
            notEquals:
              $copy: .
              $of: rowParam
        $then:
          $copy: .
  - id: input-params
    with:
      - inputs
      - rowParam
    build:
      $copy: .
      $of: inputs
  - id: action-result
    with:
      - composed
    build:
      $copy: records[0].value
      $of: composed
  - id: result
    with:
      - composed
    build:
      $copy: records[0].value
      $of: composed
  - id: action-input
    with:
      - policy
      - initial
    when:
      - path: .
        of: initial
        exists: true
    build:
      $apply: contract-result
      $with:
        combined:
          $compose:
            derived:
              - id: record
                value:
                  $copy: .
                  $of: policy
                source:
                  id: contract
            additions: []
            changes:
              - target: record
                set:
                  initial:
                    $copy: .
                    $of: initial
                priority: individual
                source:
                  id: contract
  - id: action-input
    with:
      - policy
      - initial
    build:
      $copy: .
      $of: policy
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
