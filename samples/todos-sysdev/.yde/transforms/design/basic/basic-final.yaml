id: basic-final
name: basic-final
scope: design
dependsOn:
  - basic-entity-candidates
  - basic-type-candidates
output: design/basic/composed/final.yaml
build:
  id: CMP-basic-final
  entities:
    $each: .
    $flatten: true
    $build:
      $when:
        - path: path
          equals: design/basic/final/entities.yaml
      $then:
        $copy: document.entities
  types:
    $each: .
    $flatten: true
    $build:
      $when:
        - path: path
          equals: design/basic/final/types.yaml
      $then:
        $copy: document.types
  classes:
    $each: .
    $flatten: true
    $build:
      $when:
        - path: path
          equals: design/basic/final/classes.yaml
      $then:
        $copy: document.classes
input:
  $apply: validate-final
  $with:
    entities:
      $apply: policy-entities
      $with:
        entities:
          $each:
            $view: basic-entity-candidates-input
          $build:
            $copy: values.entities
          $flatten: true
    types:
      $each:
        $view: basic-type-candidates-input
      $build:
        $copy: values.types
      $flatten: true
    contracts:
      $each: schemas
      $of: model
      $build:
        $when:
          - path: id
            oneOf:
              - basic-design-values
              - basic-design-contract
              - basic-entity-list
              - basic-type-list
              - basic-classes
              - basic-final-gate
        $then:
          $copy: declared
    classes:
      $compose:
        derived: []
        additions:
          $each:
            $view: basic-additions-input
          $build:
            $when:
              - path: values.record.kind
                equals: class
            $then:
              id:
                $copy: values.record.class.designId
              value:
                $apply: class-record
                $at: values.record.class
              source:
                id:
                  $copy: id
              keySpace:
                scope: classes
                path:
                  - name
        changes: []
rules:
  # 方式（全体の判断）が足す項目。区分を対象にした指定「optimistic-lock」（同時更新を版で検出する）を、その区分のエンティティに当てる。
  # 入れ子で持つ要素（親のあるエンティティ）には足さない（親の版で守る）。足した項目は addedBy に指定の ID を持ち、根拠（origins）に残る
  - id: policy-entities
    with:
      - entities
    build:
      $each: .
      $of: entities
      $bind: ent
      $build:
        $apply: policy-entity
        $with:
          entity:
            $copy: .
          added:
            $each:
              $view: basic-specifications-input
            $bind: policy
            $flatten: true
            $build:
              $when:
                - path: values.record.rule
                  equals: optimistic-lock
                - of: ent
                  path: parent
                  exists: false
              $then:
                $each:
                  $view: basic-specifications-input
                $build:
                  $when:
                    - path: values.record.rule
                      equals: entity-class
                    - path: values.record.target
                      equals:
                        $copy: id
                        $of: ent
                    - path: values.record.settings.entityClass
                      equals:
                        $copy: values.record.target
                        $of: policy
                  $then:
                    id:
                      $format: FLD-{e}.{k}
                      $with:
                        e:
                          $copy: source
                          $of: ent
                        k:
                          $copy: values.record.settings.key
                          $of: policy
                    key:
                      $copy: values.record.settings.key
                      $of: policy
                    seq:
                      $apply: next-seq
                      $at: .
                      $of: ent
                    owner:
                      $copy: id
                      $of: ent
                    label:
                      $copy: values.record.settings.label
                      $of: policy
                    description: 更新のたびに 1 進む番号です。読んだときの版と保存するときの版を比べて、同時の更新を検出します（方式 optimistic-lock が足す項目で、業務モデルにはありません）。
                    base: int
                    required: true
                    default: 0
                    auto: revision
                    addedBy:
                      $copy: id
                      $of: policy
                    attributeStates:
                      type: not-applicable
                      base: present
                      required: present
                      default: present
                      auto: present
                      minLength: not-applicable
                      maxLength: not-applicable
                      pattern: not-applicable
                      min: unconstrained
                      max: unconstrained
                      values: not-applicable
                      unique: not-applicable
                      multiline: not-applicable
                      format: not-applicable
  # 足す項目の項番: いまの項目の数の次
  - id: next-seq
    build:
      $number:
        $value:
          add:
            - count:
                path: items[*]
            - 1
      $as: '00'
  - id: policy-entity
    with:
      - entity
      - added
    when:
      - of: added
        path: .
        empty: false
    build:
      $apply: policy-entity-result
      $with:
        combined:
          $compose:
            derived:
              - id: entity
                value:
                  $copy: .
                  $of: entity
                source:
                  id: derived
            additions: []
            changes:
              - target: entity
                set:
                  items:
                    $concat:
                      - $copy: items
                        $of: entity
                      - $copy: .
                        $of: added
                priority: rule
                source:
                  id: optimistic-lock
  - id: policy-entity
    with:
      - entity
      - added
    build:
      $copy: .
      $of: entity
  - id: policy-entity-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: validate-final
    with:
      - entities
      - types
      - contracts
      - classes
    build:
      $apply: validated-documents
      $with:
        documents:
          $validate:
            schemas:
              $concat:
                - $copy: .
                  $of: contracts
                - $each:
                    $view: basic-field-model-input
                  $build:
                    $each: values.model.schemas
                    $build:
                      $copy: declared
                  $flatten: true
            documents:
              design/basic/final/entities.yaml:
                entities:
                  $each: .
                  $build:
                    $apply: complete
                    $with:
                      node:
                        $copy: .
                  $of: entities
              design/basic/final/types.yaml:
                types:
                  $each: .
                  $build:
                    $apply: complete
                    $with:
                      node:
                        $copy: .
                  $of: types
              design/basic/final/classes.yaml:
                classes:
                  $each: records
                  $of: classes
                  $build:
                    $apply: complete
                    $with:
                      node:
                        $copy: value
              finalization-gate.yaml:
                pending:
                  $each:
                    $view: basic-field-model-input
                  $build:
                    $copy: values.pending
                  $flatten: true
                builtinPending:
                  $each:
                    $view: basic-field-model-input
                  $build:
                    $copy: values.builtinPending
                  $flatten: true
                additions:
                  $each:
                    $view: basic-additions-input
                  $build:
                    $when:
                      - path: values.record.kind
                        notEquals: class
                    $then:
                      $copy: values.record
                specifications:
                  $concat:
                    - $each:
                        $view: basic-specifications-input
                      $build:
                        $when:
                          - or:
                              - not:
                                  path: values.record.rule
                                  oneOf:
                                    - entity-class
                                    - optimistic-lock
                              - path: values.record.uses
                                exists: true
                        $then:
                          $copy: values.record
                    - $each:
                        $view: basic-specifications-input
                      $bind: spec
                      $flatten: true
                      $build:
                        $eachEntry: values.record.settings
                        $flatten: true
                        $build:
                          - $when:
                              - not:
                                  of: spec
                                  path: values.record.rule
                                  equals: optimistic-lock
                              - path: $key
                                notEquals: entityClass
                            $then:
                              source:
                                $copy: id
                                $of: spec
                              attribute: $key
                              value:
                                $copy: .
                requests:
                  $concat:
                    - $each:
                        $view: basic-description-corrections-input
                      $build:
                        $copy: values.correction.target
                    - $each:
                        $view: basic-specifications-input
                      $build:
                        $copy: values.record.target
                corrections:
                  $each:
                    $view: basic-description-corrections-input
                  $build:
                    $when:
                      - not:
                          path: values.correction.target
                          startsWith: FLD-
                      - not:
                          path: values.correction.target
                          startsWith: TYP-
                    $then:
                      $eachEntry: values.correction.set
                      $flatten: true
                      $build:
                        - $when:
                            - not:
                                path: $key
                                oneOf:
                                  - label
                                  - description
                                  - entityClass
                          $then:
                            target:
                              $copy: values.correction.target
                              $of: correction
                            attribute: $key
                            value:
                              $copy: .
                  $flatten: true
                  $bind: correction
  - id: class-record
    build:
      $entries:
        $concat:
          - - key: id
              value:
                $copy: designId
          - $eachEntry: .
            $flatten: true
            $build:
              - $when:
                  - path: $key
                    notEquals: designId
                $then:
                  key: $key
                  value:
                    $copy: .
  - id: complete
    with:
      - node
    build:
      $apply: complete-composed
      $with:
        node:
          $copy: .
          $of: node
        composed:
          $compose:
            derived:
              - id:
                  $copy: id
                  $of: node
                value:
                  $apply: children
                  $at: .
                  $of: node
                source:
                  id: derived
            additions: []
            changes:
              $concat:
                - $each:
                    $view: basic-description-corrections-input
                  $build:
                    $when:
                      - path: values.correction.target
                        equals:
                          $copy: id
                          $of: node
                      - not:
                          path: values.correction.target
                          oneOf: []
                    $then:
                      $eachEntry: values.correction.set
                      $flatten: true
                      $build:
                        - $when:
                            - path: $key
                              oneOf:
                                - label
                                - description
                                - entityClass
                          $then:
                            target:
                              $copy: id
                              $of: node
                            path:
                              - $key
                            value:
                              $copy: .
                            priority: individual
                            source:
                              id:
                                $copy: id
                                $of: correction
                  $flatten: true
                  $bind: correction
                - $each:
                    $view: basic-specifications-input
                  $build:
                    $when:
                      - path: values.record.target
                        equals:
                          $copy: id
                          $of: node
                      - path: values.record.rule
                        equals: entity-class
                    $then:
                      target:
                        $copy: id
                        $of: node
                      path:
                        - entityClass
                      value:
                        $copy: values.record.settings.entityClass
                      priority: individual
                      source:
                        id:
                          $copy: id
  - id: complete-composed
    with:
      - node
      - composed
    build:
      $entries:
        $concat:
          - $eachEntry: records[0].value
            $flatten: true
            $build:
              - $when:
                  - path: $key
                    notEquals: origins
                $then:
                  key: $key
                  value:
                    $copy: .
            $of: composed
          - - key: origins
              value:
                $concat:
                  - - $when:
                        - of: node
                          path: source
                          exists: true
                      $then:
                        kind: derived
                        source:
                          $copy: source
                          $of: node
                    - $when:
                        - of: node
                          path: action
                          exists: true
                      $then:
                        kind: derived
                        source:
                          $copy: action
                          $of: node
                    - $when:
                        - of: node
                          path: operation
                          exists: true
                      $then:
                        kind: derived
                        source:
                          $copy: operation
                          $of: node
                  - $each:
                      $view: basic-targets-input
                    $build:
                      $each: values.targets
                      $build:
                        $when:
                          - path: designId
                            equals:
                              $copy: id
                              $of: node
                        $then:
                          $each: occurrences
                          $build:
                            $each: declarations
                            $build:
                              kind:
                                $first:
                                  - $when:
                                      - path: inherited
                                        equals: true
                                    $then: inherited
                                  - derived
                              source:
                                $copy: schema
                              document:
                                $copy: document
                              path:
                                $copy: path
                              value:
                                $copy: declared
                          $flatten: true
                      $flatten: true
                    $flatten: true
                  - $each:
                      $view: basic-description-corrections-input
                    $build:
                      $when:
                        - or:
                            - path: values.correction.target
                              equals:
                                $copy: id
                                $of: node
                            - path: values.correction.target
                              equals:
                                $copy: type
                                $of: node
                      $then:
                        kind: correction
                        source:
                          $copy: id
                        value:
                          $copy: values.correction.set
                        reason:
                          $copy: values.correction.reason
                  - $each:
                      $view: basic-specifications-input
                    $build:
                      $when:
                        - path: values.record.target
                          equals:
                            $copy: id
                            $of: node
                      $then:
                        kind: rule
                        source:
                          $copy: id
                        value:
                          $copy: values.record.settings
                        reason:
                          $copy: values.record.reason
                  - $each:
                      $view: basic-specifications-input
                    $build:
                      $when:
                        - path: id
                          equals:
                            $copy: addedBy
                            $of: node
                      $then:
                        kind: rule
                        source:
                          $copy: id
                        value:
                          $copy: values.record.settings
                        reason:
                          $copy: values.record.reason
                  - $each:
                      $view: basic-additions-input
                    $build:
                      $when:
                        - path: values.record.class.designId
                          equals:
                            $copy: id
                            $of: node
                      $then:
                        kind: addition
                        source:
                          $copy: id
                        value:
                          $copy: values.record.class
                        reason:
                          $copy: values.record.reason
  - id: children
    build:
      $entries:
        $eachEntry: .
        $flatten: true
        $build:
          - key: $key
            value:
              $first:
                - $when:
                    - path: $key
                      oneOf:
                        - items
                        - fields
                        - operations
                        - writes
                  $then:
                    $each: .
                    $build:
                      $apply: complete
                      $with:
                        node:
                          $copy: .
                - $when:
                    - path: $key
                      oneOf:
                        - item
                        - value
                  $then:
                    $apply: children
                - $when:
                    - path: $key
                      equals: cases
                  $then:
                    $eachEntry: .
                    $build:
                      $each: .
                      $build:
                        $apply: complete
                        $with:
                          node:
                            $copy: .
                - $copy: .
  - id: validated-documents
    with:
      - documents
    build:
      $eachEntry: .
      $of: documents
      $flatten: true
      $build:
        - path: $key
          document:
            $copy: .
