id: screen-details-derived
name: 画面定義書（詳細画面）
description: >-
  基本設計。ダッシュボードからたどれるエンティティ型ごとに、詳細画面を 1 つ作る（業務モデルの項の reach.entities）。 決め打ちの規則: 項目は業務モデルの 2 か所（一覧の行と個票）をまとめて並べる・参照の項目は参照先の詳細画面へ・ ID
  の無い繰り返し（コメント・履歴）は表・入れ子の型（作業項目）は表にして、行の右にその型の操作のボタン・ 画面の下に、この型を受け手にする操作のボタン（Lifecycle の状態で出す・出さない）。直接の編集は無い（閲覧専用の範囲）
scope: business
each: entities
output: design/basic/derived/documents/screen-details/{id}.yaml
dependsOn:
  - system-actions-model
  - basic-document-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-actions-model-input
      $one: true
build:
  id:
    $format: DRV-document-screen-details.{id}
  record:
    id:
      $format: DOC-screen-details.{id}
    value:
      $when:
        - of: model
          path: reach.entities
          includes:
            $copy: id
      id:
        $copy: id
      name:
        $format: '{label}詳細'
      kind: detail
      url:
        $format: /{t}/{k}
        $with:
          t:
            $copy: id
          k: '{id}'
      items:
        $group:
          $apply: fields
        $by:
          $when:
            - or:
                - not:
                    path: field.base
                    oneOf:
                      - array
                      - object
                      - map
                - path: field.item.base
                  equals: ref
          $then:
            $copy: field.key
        $build:
          key:
            $copy: key
          label:
            $copy: items[0].field.label
          type:
            $copy: items[0].field.type
          many:
            $when:
              - path: items[0].field.base
                equals: array
            $then: true
          link:
            $first:
              - $copy: items[0].field.target
              - $copy: items[0].field.item.target
      tables:
        $concat:
          - $group:
              $apply: fields
            $by:
              $when:
                - path: field.base
                  equals: array
                - path: field.item.base
                  equals: object
                - path: field.item.entity
                  exists: false
              $then:
                $copy: field.key
            $build:
              item:
                $copy: key
              label:
                $copy: items[0].field.label
              columns:
                $each: items[0].field.item.fields
                $build:
                  $copy: label
          - $group:
              $apply: fields
            $by:
              $when:
                - path: field.item.entity
                  exists: true
              $then:
                $copy: field.key
            $bind: t
            $build:
              item:
                $copy: key
              label:
                $copy: items[0].field.label
              entity:
                $copy: items[0].field.item.entity
              columns:
                $each: entities
                $of: model
                $flatten: true
                $build:
                  $when:
                    - path: id
                      equals:
                        $copy: items[0].field.item.entity
                        $of: t
                  $then:
                    $each: aspects[0].fields
                    $build:
                      $copy: label
              rowButtons:
                $each: actions
                $of: model
                $build:
                  $when:
                    - path: target.entity
                      equals:
                        $copy: items[0].field.item.entity
                        $of: t
                  operation:
                    $copy: id
                  label:
                    $copy: label
                  shownWhen:
                    $apply: shown-when
                  to:
                    $apply: first-screen
      buttons:
        $each: actions
        $of: model
        $build:
          $when:
            - path: target.entity
              equals:
                $copy: id
                $of: element
          operation:
            $copy: id
          label:
            $copy: label
          shownWhen:
            $apply: shown-when
          to:
            $apply: first-screen
      originalRoutes:
        url:
          $format: /{t}/{k}
          $with:
            t:
              $copy: id
            k: '{id}'
    source:
      id: rule-screen-details
      document: .yde/transforms/design/basic/screen-details-derived.yaml
rules:
  - id: fields
    build:
      $each: aspects
      $bind: asp
      $flatten: true
      $build:
        $each: fields
        $build:
          field:
            $copy: .
          schema:
            $copy: schema
            $of: asp
  - id: shown-when
    when:
      - path: lifecycle.transitions
        exists: true
    build:
      $each: lifecycle.transitions
      $flatten: true
      $build:
        $each: from
        $build:
          value:
            $copy: value
          label:
            $copy: label
  - id: shown-when
    build: いつも
  - id: first-screen
    when:
      - path: params
        empty: false
    build:
      $format: '{id}/input'
  - id: first-screen
    build:
      $format: '{id}/confirm'
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
