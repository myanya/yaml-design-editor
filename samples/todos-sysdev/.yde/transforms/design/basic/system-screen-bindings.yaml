id: system-screen-bindings
name: 確定した画面の URL
scope: business
dependsOn:
  - screen-lists
  - screen-details
  - screen-operations
output: design/basic/composed/documents/system-screen-bindings.yaml
build:
  id: SYS-system-screen-bindings
  bindings:
    $concat:
      - $each:
          $view: screen-lists-input
        $flatten: true
        $build:
          - before:
              $format: GET {url}
              $with:
                url:
                  $copy: values.record.originalRoutes.url
            after:
              $format: GET {url}
              $with:
                url:
                  $copy: values.record.url
            roles:
              - request
              - action
              - to
              - url
          - before:
              $copy: values.record.originalRoutes.url
            after:
              $copy: values.record.url
            roles:
              - request
              - action
              - to
              - url
      - $each:
          $view: screen-details-input
        $flatten: true
        $build:
          - before:
              $format: GET {url}
              $with:
                url:
                  $copy: values.record.originalRoutes.url
            after:
              $format: GET {url}
              $with:
                url:
                  $copy: values.record.url
            roles:
              - request
              - action
              - to
              - url
          - before:
              $copy: values.record.originalRoutes.url
            after:
              $copy: values.record.url
            roles:
              - request
              - action
              - to
              - url
      - $each:
          $view: screen-operations-input
        $flatten: true
        $build:
          - before:
              $copy: values.record.originalRoutes.input
            after:
              $copy: values.record.input.request
            roles:
              - request
              - action
              - to
              - url
          - before:
              $copy: values.record.originalRoutes.confirm
            after:
              $copy: values.record.confirm.request
            roles:
              - request
              - action
              - to
              - url
          - before:
              $copy: values.record.originalRoutes.back
            after:
              $copy: values.record.confirm.back.request
            roles:
              - request
              - action
              - to
              - url
          - before:
              $copy: values.record.originalRoutes.execute
            after:
              $copy: values.record.execute.request
            roles:
              - request
              - action
              - to
              - url
