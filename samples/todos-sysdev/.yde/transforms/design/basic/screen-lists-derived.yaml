id: screen-lists-derived
name: 画面定義書（一覧画面）
description: >-
  基本設計。ダッシュボードごとに一覧画面を 1 つ作る（ダッシュボードを起点に画面を決める）。決め打ちの規則（画面系の議論で決めたもの）: 絞り込みはダッシュボードの共有の入力で、URL のパラメータで持つ・区画は同じ画面の中に並べる（業務の流れの図は外す）・
  上部の操作はボタン・一覧の区画の行の右に、行の型を受け手にする操作のボタン（Lifecycle の状態で出す・出さない）・ 行の ID は詳細画面へ・集計のセルは、その行と列で絞った一覧へ・ボタンは操作の入力画面（入力が無ければ確認画面）へ
scope: business
each: dashboards
output: design/basic/derived/documents/screen-lists/{id}.yaml
dependsOn:
  - system-actions-model
  - basic-document-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-actions-model-input
      $one: true
build:
  id:
    $format: DRV-document-screen-lists.{id}
  record:
    id:
      $format: DOC-screen-lists.{id}
    value:
      id:
        $copy: id
      name:
        $copy: label
      kind: list
      url:
        $first:
          - $when:
              - path: default
                equals: true
            $then: /
          - $format: /{id}
      filters:
        $each: inputs
        $build:
          key:
            $copy: key
          label:
            $copy: label
          type:
            $copy: type
          multiple:
            $copy: multiple
          carried: URL のパラメータ
      buttons:
        $each: actions
        $bind: aid
        $flatten: true
        $build:
          $each: actions
          $of: model
          $build:
            $when:
              - path: id
                equals:
                  $copy: .
                  $of: aid
            operation:
              $copy: id
            label:
              $copy: label
            to:
              $apply: first-screen
      sections:
        $each: sections
        $bind: sec
        $flatten: true
        $build:
          $each: views
          $of: model
          $bind: v
          $flatten: true
          $build:
            $when:
              - path: id
                equals:
                  $copy: view
                  $of: sec
            $then:
              - id:
                  $copy: id
                  $of: sec
                label:
                  $copy: label
                  $of: sec
                group:
                  $copy: group
                  $of: sec
                view:
                  $copy: id
                kind:
                  $map:
                    $copy: kind
                  $using:
                    grid: 一覧
                    matrix: 集計
                    chart: グラフ
                rows:
                  $copy: rows
                filter:
                  $copy: filter
                  $of: sec
                columns:
                  $first:
                    - $when:
                        - path: kind
                          equals: grid
                      $then:
                        $each: columns
                        $build:
                          $copy: label
                    - $when:
                        - path: kind
                          equals: matrix
                      $then:
                        $each: columns.values
                        $build:
                          $copy: label
                link:
                  $when:
                    - path: kind
                      equals: grid
                    - path: rows
                      exists: true
                  $then:
                    by: 行の ID
                    to:
                      $copy: rows
                cell:
                  $when:
                    - path: kind
                      equals: matrix
                  $then:
                    to:
                      $copy: id
                      $of: element
                    shows:
                      $copy: counts
                    by:
                      row:
                        $copy: rows
                      column:
                        $copy: columns.path
                rowButtons:
                  $when:
                    - path: kind
                      equals: grid
                  $then:
                    $each: actions
                    $of: model
                    $build:
                      $when:
                        - path: target.entity
                          equals:
                            $copy: rows
                            $of: v
                        # 並びの 1 件を番号で指す操作は、行が決まる所（詳細画面のその並びの表）にだけ出す
                        - path: rowOf
                          exists: false
                      operation:
                        $copy: id
                      label:
                        $copy: label
                      shownWhen:
                        $apply: shown-when
                      to:
                        $apply: first-screen
      originalRoutes:
        url:
          $first:
            - $when:
                - path: default
                  equals: true
              $then: /
            - $format: /{id}
    source:
      id: rule-screen-lists
      document: .yde/transforms/design/basic/screen-lists-derived.yaml
rules:
  - id: shown-when
    when:
      - path: lifecycle.transitions
        exists: true
    build:
      $each: lifecycle.transitions
      $flatten: true
      $build:
        $each: from
        $build:
          value:
            $copy: value
          label:
            $copy: label
  - id: shown-when
    build: いつも
  - id: first-screen
    when:
      - path: inputParams
        empty: false
    build:
      $format: '{id}/input'
  - id: first-screen
    build:
      $format: '{id}/confirm'
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
