id: processes
name: 処理設計書（Service）
description: >-
  操作ごとに Service のメソッドと手順を書く。手順は、テーブルアクセス設計書の Mapper のメソッドを呼ぶ形で書く（名前の決まりは同じ）。
  決め打ちの規則: 1 操作＝1 トランザクション・受け手を先に読む（findById）・状態の前提（Lifecycle）は読んだ行の状態で確かめる（Java）・
  業務モデルの前提は、受け手の中の要素の条件なら件数（Mapper の count）、受け手の値の条件なら読んだ行（Java）で確かめる・
  採番は使われている番号の次（maxId）・書く手順は、同じテーブルへの値をまとめた insert か update と、明細の行（並び順は maxSeq の次）・
  データの決まり（業務モデルの操作の checks＝書くと破れうる決まり）は、要素ごとの決まりと循環の決まりは書いた後の値を計算して書く前に Java で、
  入れ子の要素の決まりは書いた後に同じトランザクションで件数を数えて確かめる（違反なら例外で書いたものを取り消す）。断るのはエラーの決まりだけ・
  受け取る値が原因で破れうる Java の決まりは、確認へでも確かめる（confirm のメソッド。書かない）。
  型・桁・形式の入力検査は Controller（Bean Validation）で行い、ここには書かない。断りの文はメッセージのキー（メッセージ定義書）で書く
scope: business
stage: detail
each: actions
output: "design/generated/processes/{id}.yaml"
build:
  id: { $copy: id }
  name: { $copy: label }
  service:
    class: { $format: "{name}Service", $with: { name: { $case: { $copy: subject }, $as: pascal } } }
    method: { $case: { $copy: id }, $as: camel }
    arguments:
      $concat:
        - $when: [{ path: target.entity, exists: true }]
          $then: [id]
        - $each: params
          $build: { $case: { $copy: key }, $as: camel }
  # 確認へで呼ぶ確かめ（書かない）: 受け取る値が原因で破れうる、Java で確かめる決まり。違反は欄ごとに返し、入力画面に出す
  confirm:
    $group:
      $each: checks
      $build:
        $when: [{ path: params, exists: true }, { path: level, equals: error }, { or: [{ path: form, equals: element }, { path: kind, equals: acyclic }] }]
        $then: { $copy: . }
    $by: confirm
    $build:
      method: { $format: "check{n}", $with: { n: { $case: { $copy: id, $of: element }, $as: pascal } } }
      arguments:
        $concat:
          - $when: [{ of: element, path: target.entity, exists: true }]
            $then: [id]
          - $each: params
            $of: element
            $build: { $case: { $copy: key }, $as: camel }
      does: 受け手を読み（あれば）、入力の値で書いた後の値を計算し、次の決まりを確かめる（書かない）。違反は欄の名前とメッセージのキーの並びで返す
      constraints:
        $each: items
        $build:
          constraint: { $copy: constraint }
          field: { $case: { $copy: "params[0]" }, $as: camel }
          message: { $format: "check.{c}", $with: { c: { $copy: constraint } } }
  transaction: 1 操作 1 トランザクション（全部書けたときだけ確定する）
  steps:
    $concat:
      # 受け手を読む（無ければ「見つかりません」）
      - $when: [{ path: target.entity, exists: true }]
        $then:
          - step: read
            call: { $format: "{n}Mapper.findById", $with: { n: { $case: { $copy: target.entity }, $as: pascal } } }
            key: id
            missing: { $format: "見つからなければ NotFoundException（error.notFound.{e}）", $with: { e: { $copy: target.entity } } }
      # 状態の前提（Lifecycle）: 読んだ行の状態が、この操作のできる状態か
      - $when: [{ path: lifecycle.transitions, exists: true }]
        $then:
          - step: check
            precondition: { $format: "{id}.state" }
            by: Java（読んだ行の状態）
            allowed: { $each: lifecycle.transitions, $flatten: true, $build: { $each: from, $build: { $copy: value } } }
            message: { $format: "{id}.state" }
            text: { $copy: lifecycle.refusal }
      # 業務モデルの前提（名前を付けたもの）
      - $each: require
        $build:
          $when: [{ path: id, exists: true }]
          $then: { $apply: precondition }
      # 採番（使われている番号の次）
      - $each: effects
        $build:
          $when: [{ path: numbering, exists: true }]
          step: number
          entity: { $first: [{ $copy: field.item.entity }, { $copy: entity }] }
          call: { $format: "{n}Mapper.maxId", $with: { n: { $case: { $first: [{ $copy: field.item.entity }, { $copy: entity }] }, $as: pascal } } }
          rule: { $copy: numbering }
      # データの決まり（Java）: 書いた後の値を計算し、書く前に確かめる（要素ごとの決まり・循環の決まり）
      - $each: checks
        $bind: c
        $flatten: true
        $build:
          $each: constraints
          $of: model
          $build:
            $when: [{ path: id, equals: { $copy: constraint, $of: c } }, { path: level, equals: error }, { or: [{ path: form, equals: element }, { path: kind, equals: acyclic }] }]
            $then:
              $first:
                - $when: [{ path: kind, equals: acyclic }]
                  $then:
                    step: check
                    constraint: { $copy: id }
                    by: Java（参照の先をたどる）
                    follow: { $copy: "fields[0].key" }
                    call: { $format: "{n}Mapper.findById", $with: { n: { $case: { $copy: entity }, $as: pascal } } }
                    how: 書く参照の先から、同じ項目の参照を findById でたどり、受け手（作る操作は作る要素）に戻れば断る
                    field: { $case: { $copy: "params[0]", $of: c }, $as: camel }
                    message: { $format: "check.{id}" }
                - step: check
                  constraint: { $copy: id }
                  by: Java（書いた後の値）
                  at: { $when: [{ path: at, exists: true }], $then: { $format: "足す {a} の行", $with: { a: { $copy: at } } } }
                  rule: { $copy: rule }
                  field: { $case: { $copy: "params[0]", $of: c }, $as: camel }
                  message: { $format: "check.{id}" }
      # 書く: 同じテーブルへの値は 1 つの insert か update に、明細は行ごとに
      - $group: { $apply: writes }
        $by: { $first: [{ $copy: row }, { $copy: call }] }
        $build:
          step: write
          call: { $copy: "items[0].call" }
          kind: { $copy: "items[0].kind" }
          # insert は項目 → 値。update は書く項目の並び（条件つきの値は when。同じ項目を、値を入れる・消すの 2 通りに書くこともある）
          values:
            $first:
              - { $copy: "items[0].values" }
              - $when: [{ path: "items[0].item", exists: true }, { path: "items[0].kind", equals: insert }]
                # 同じ項目は先の値（採番した番号など）
                $then: { $entries: { $group: items, $by: { $copy: item }, $build: { key: { $copy: key }, value: { $copy: "items[0].value" } } } }
          set:
            $when: [{ path: "items[0].kind", equals: update }]
            $then: { $each: items, $build: { item: { $copy: item }, value: { $copy: value }, when: { $copy: when } } }
          each: { $copy: "items[0].each" }
          seq: { $copy: "items[0].seq" }
          where: { $copy: "items[0].where" }
          when: { $copy: "items[0].when" }
      # データの決まり（SQL）: 入れ子の要素の決まりは、書いた後に同じトランザクションで件数を数える（違反なら例外で取り消す）
      - $each: checks
        $bind: c
        $flatten: true
        $build:
          $each: constraints
          $of: model
          $bind: k
          $build:
            $when:
              - { path: id, equals: { $copy: constraint, $of: c } }
              - { path: level, equals: error }
              - { path: form, equals: pattern }
              - { path: "rule.match[1].edge.contains", equals: true }
            step: check
            constraint: { $copy: id }
            by: SQL（件数。書いた後）
            call:
              $format: "{m}Mapper.count{n}"
              $with:
                m: { $case: { $copy: "rule.match[2].node.entity" }, $as: pascal }
                n: { $case: { $copy: id }, $as: pascal }
            # 数える外側の要素: 受け手が外側の型ならその ID、内側の型なら読んだ行の外側の ID
            key:
              $first:
                - $when: [{ of: element, path: target.entity, equals: { $copy: "rule.match[0].node.entity" } }]
                  $then: id
                - $when: [{ of: element, path: target.entity, equals: { $copy: "rule.match[2].node.entity" } }]
                  $then: { $format: "読んだ行の {p}_id", $with: { p: { $case: { $copy: "rule.match[0].node.entity" }, $as: snake } } }
                - 作った要素の ID
            expect: { $map: { $copy: rule.expect }, $using: { absent: 0 件なら通す, exists: 1 件以上なら通す } }
            violation: 例外（RefusedException）を投げ、書いたものをトランザクションごと取り消す
            message: { $format: "check.{id}" }
rules:
  # いまの場所＝前提。受け手の中の要素の条件は件数、受け手の値の条件は読んだ行、そのほかは手で書く
  - id: precondition
    when: [{ path: "rule.match[1].edge.contains", equals: true }]
    build:
      step: check
      precondition: { $format: "{a}.{r}", $with: { a: { $copy: id, $of: element }, r: { $copy: id } } }
      by: SQL（件数）
      call:
        $format: "{m}Mapper.count{n}"
        $with:
          m: { $case: { $copy: "rule.match[2].node.entity" }, $as: pascal }
          n: { $case: { $format: "{a}.{r}", $with: { a: { $copy: id, $of: element }, r: { $copy: id } } }, $as: pascal }
      expect: { $map: { $copy: rule.expect }, $using: { absent: 0 件なら通す, exists: 1 件以上なら通す } }
      message: { $format: "{a}.{r}", $with: { a: { $copy: id, $of: element }, r: { $copy: id } } }
      text: { $copy: message }
  - id: precondition
    when: [{ path: "rule.match[1]", exists: false }, { path: "rule.match[0].node.entity", equals: { $copy: target.entity, $of: element } }]
    build:
      step: check
      precondition: { $format: "{a}.{r}", $with: { a: { $copy: id, $of: element }, r: { $copy: id } } }
      by: Java（読んだ行）
      rule: { $copy: rule.where }
      message: { $format: "{a}.{r}", $with: { a: { $copy: id, $of: element }, r: { $copy: id } } }
      text: { $copy: message }
  - id: precondition
    build:
      step: check
      precondition: { $format: "{a}.{r}", $with: { a: { $copy: id, $of: element }, r: { $copy: id } } }
      by: 手で書く（前提の形から写す規則が無い）
      rule: { $copy: rule }
      message: { $format: "{a}.{r}", $with: { a: { $copy: id, $of: element }, r: { $copy: id } } }
      text: { $copy: message }
  # いまの場所＝操作。書く値の並び（{call, kind, item, value} は同じ呼び出しでまとめ、row を持つものは行ごと）
  - id: writes
    build:
      $each: effects
      $bind: e
      $flatten: true
      $build:
        $concat:
          # 文書を作る（主のテーブルの insert の値。採番した ID が先）
          - $when: [{ path: op, equals: create }]
            $then:
              $concat:
                - $when: [{ path: numbering, exists: true }]
                  $then:
                    - call: { $format: "{n}Mapper.insert", $with: { n: { $case: { $copy: entity }, $as: pascal } } }
                      kind: insert
                      item: { $copy: numbering.path }
                      value: 採番した番号
                - $each: written
                  $build:
                    $when: [{ not: { path: base, oneOf: [array, object, map] } }]
                    call: { $format: "{n}Mapper.insert", $with: { n: { $case: { $copy: entity, $of: e }, $as: pascal } } }
                    kind: insert
                    item: { $copy: key }
                    value: { $copy: value }
          # エンティティの要素を配列へ足す（その型の主のテーブルの insert の値。入れ子の型は親の ID と並び順も）
          - $when: [{ path: op, equals: insert }, { path: field.item.entity, exists: true }]
            $then:
              $concat:
                - $when: [{ path: numbering, exists: true }]
                  $then:
                    - call: { $format: "{n}Mapper.insert", $with: { n: { $case: { $copy: field.item.entity }, $as: pascal } } }
                      kind: insert
                      item: { $copy: numbering.path }
                      value: 採番した番号
                - $each: written
                  $build:
                    $when: [{ not: { path: base, oneOf: [array, object, map] } }]
                    call: { $format: "{n}Mapper.insert", $with: { n: { $case: { $copy: field.item.entity, $of: e }, $as: pascal } } }
                    kind: insert
                    item: { $copy: key }
                    value:
                      $first:
                        - { $when: [{ path: key, equals: { $copy: numbering.path, $of: e } }], $then: 採番した番号 }
                        - { $copy: value }
                - $when: [{ path: entity, notEquals: { $copy: field.item.entity } }]
                  $then:
                    - call: { $format: "{n}Mapper.insert", $with: { n: { $case: { $copy: field.item.entity }, $as: pascal } } }
                      kind: insert
                      item: { $format: "{p}_id", $with: { p: { $case: { $copy: entity }, $as: snake } } }
                      value: $$id
                    - call: { $format: "{n}Mapper.insert", $with: { n: { $case: { $copy: field.item.entity }, $as: pascal } } }
                      kind: insert
                      item: seq
                      value: { $format: "次の並び順（{n}Mapper.maxSeq の次）", $with: { n: { $case: { $copy: field.item.entity }, $as: pascal } } }
          # 値を書く・消す（作る操作なら insert の値、そうでなければ操作ごとの update）
          - $when: [{ or: [{ path: op, equals: set }, { path: op, equals: delete }] }, { not: { path: field.base, oneOf: [array, object, map] } }]
            $then:
              - call:
                  $first:
                    - $when: [{ of: element, path: creates, includes: { $copy: entity } }]
                      $then: { $format: "{n}Mapper.insert", $with: { n: { $case: { $copy: entity }, $as: pascal } } }
                    - $format: "{n}Mapper.{m}"
                      $with: { n: { $case: { $copy: entity }, $as: pascal }, m: { $case: { $copy: id, $of: element }, $as: camel } }
                kind: { $first: [{ $when: [{ of: element, path: creates, includes: { $copy: entity } }], $then: insert }, update] }
                item: { $copy: field.key }
                value: { $first: [{ $copy: value }, null] }
                when: { $copy: when }
                where:
                  $when: [{ not: { of: element, path: creates, includes: { $copy: entity } } }]
                  $then:
                    - item: id
                      param:
                        $first:
                          - { $when: [{ path: entity, equals: { $copy: target.entity, $of: element } }], $then: id }
                          - { $format: "{e}Id", $with: { e: { $case: { $copy: entity }, $as: camel } } }
          # 明細へ 1 行足す（ID の無い繰り返し）: 親の ID・並び順・足す要素の値
          - $when: [{ path: op, equals: insert }, { path: field.base, equals: array }, { path: field.item.entity, exists: false }]
            $then:
              - row: { $format: "row-{i}", $with: { i: $index } }
                call: { $format: "{n}Mapper.insert{d}", $with: { n: { $case: { $copy: entity }, $as: pascal }, d: { $case: { $apply: effect-detail-name }, $as: pascal } } }
                kind: insert
                seq: { $format: "{n}Mapper.maxSeq{d} の次", $with: { n: { $case: { $copy: entity }, $as: pascal }, d: { $case: { $apply: effect-detail-name }, $as: pascal } } }
                values:
                  $entries:
                    $concat:
                      - - key: { $format: "{p}_id", $with: { p: { $case: { $copy: entity }, $as: snake } } }
                          # 親を作る操作なら採番した番号、そうでなければ受け手の ID
                          value: { $first: [{ $when: [{ of: element, path: creates, includes: { $copy: entity } }], $then: 採番した番号 }, $$id] }
                      - $each: written
                        $build: { key: { $copy: key }, value: { $copy: value } }
          # 配列の項目に値を入れる＝明細を置き換える（消して、要素ごとに入れ直す）
          - $when: [{ path: op, equals: set }, { path: field.base, equals: array }, { path: field.item.entity, exists: false }]
            $then:
              - row: { $format: "row-{i}-delete", $with: { i: $index } }
                call: { $format: "{n}Mapper.delete{d}", $with: { n: { $case: { $copy: entity }, $as: pascal }, d: { $case: { $apply: effect-detail-name }, $as: pascal } } }
                kind: delete
                when: { $copy: when }
              - row: { $format: "row-{i}-insert", $with: { i: $index } }
                call: { $format: "{n}Mapper.insert{d}", $with: { n: { $case: { $copy: entity }, $as: pascal }, d: { $case: { $apply: effect-detail-name }, $as: pascal } } }
                kind: insert
                each: { $copy: value }
                seq: 配列の順（1 から）
                when: { $copy: when }
          # 作る要素の値の中の配列（登録のタグなど）: 明細へ要素ごとに 1 行
          - $when: [{ or: [{ path: op, equals: create }, { path: field.item.entity, exists: true }] }, { or: [{ path: op, equals: create }, { path: op, equals: insert }] }]
            $then:
              $each: written
              $build:
                $when: [{ path: base, equals: array }, { path: item.entity, exists: false }, { path: value, empty: false }]
                row: { $format: "row-{k}", $with: { k: { $copy: key } } }
                call:
                  $format: "{n}Mapper.insert{d}"
                  $with:
                    n: { $case: { $first: [{ $copy: field.item.entity, $of: e }, { $copy: entity, $of: e }] }, $as: pascal }
                    d: { $case: { $format: "{t}_{k}", $with: { t: { $case: { $first: [{ $copy: field.item.entity, $of: e }, { $copy: entity, $of: e }] }, $as: snake }, k: { $copy: key } } }, $as: pascal }
                kind: insert
                each: { $copy: value }
                seq: 配列の順（1 から）
  # いまの場所＝効果。書く配列の項目の明細テーブルの名前（テーブル設計書と同じ）
  - id: effect-detail-name
    build: { $format: "{t}_{k}", $with: { t: { $case: { $copy: entity }, $as: snake }, k: { $copy: field.key } } }
