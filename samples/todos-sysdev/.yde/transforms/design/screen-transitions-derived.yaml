id: screen-transitions-derived
name: 画面遷移定義書
description: >-
  基本設計。ダッシュボードを起点に、たどれる画面の一覧と、画面の移り方を 1 本にする（業務モデルの項の reach）。 画面は 一覧画面（ダッシュボード）・詳細画面（たどれるエンティティ型ごと）・操作の入力画面と確認画面。移り方は 区画の行の ID → 詳細・集計のセル →
  一覧（行と列で絞る）・ボタン → 操作の最初の画面・参照の項目 → 参照先の詳細・ 入力 → 確認 → 確定 → 起点の画面（確認から入力へ戻れる）。業務の流れの図（flow）は、いまは外す
scope: business
each: dashboards
output: design/system/derived/screen-transitions/{id}.yaml
dependsOn:
  - system-actions-model
  - screen-lists
  - screen-details
  - screen-operations
  - system-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-actions-model-input
      $one: true
build:
  id:
    $format: DRV-document-screen-transitions.{id}
  record:
    id:
      $format: DOC-screen-transitions.{id}
    value:
      $apply: linked-document
      $with:
        document:
          id:
            $copy: id
          name:
            $format: '{label}からの画面遷移'
          start:
            $copy: id
          screens:
            $concat:
              - $each:
                  $view: screen-lists-input
                $build:
                  $when:
                    - path: values.record.id
                      equals:
                        $copy: id
                        $of: element
                  $then:
                    id:
                      $copy: values.record.id
                    kind:
                      $copy: values.record.kind
                    label:
                      $copy: values.record.name
                    source:
                      $copy: values.record.designId
                    url:
                      $copy: values.record.url
              - $each:
                  $view: screen-details-input
                $build:
                  $when:
                    - path: reach.entities
                      of: element
                      includes:
                        $copy: values.record.id
                  $then:
                    id:
                      $copy: values.record.id
                    kind:
                      $copy: values.record.kind
                    label:
                      $copy: values.record.name
                    source:
                      $copy: values.record.designId
                    url:
                      $copy: values.record.url
              - $each:
                  $view: screen-operations-input
                $flatten: true
                $build:
                  $when:
                    - path: reach.operations
                      of: element
                      includes:
                        $copy: values.record.id
                  $then:
                    $concat:
                      - $when:
                          - path: values.record.input
                            exists: true
                        $then:
                          - id:
                              $copy: values.record.input.screen
                            kind: input
                            label:
                              $format: '{name}（入力）'
                              $with:
                                name:
                                  $copy: values.record.name
                            source:
                              $copy: values.record.designId
                            request:
                              $copy: values.record.input.request
                      - - id:
                            $copy: values.record.confirm.screen
                          kind: confirm
                          label:
                            $format: '{name}（確認）'
                            $with:
                              name:
                                $copy: values.record.name
                          source:
                            $copy: values.record.designId
                          request:
                            $copy: values.record.confirm.request
          transitions:
            $concat:
              - $each: sections
                $bind: sec
                $flatten: true
                $build:
                  $each: views
                  $of: model
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: view
                          $of: sec
                      - path: rows
                        exists: true
                    from:
                      $copy: id
                      $of: element
                    by:
                      $first:
                        - $when:
                            - path: kind
                              equals: matrix
                          $then:
                            $format: 区画「{l}」のセル
                            $with:
                              l:
                                $copy: label
                                $of: sec
                        - $format: 区画「{l}」の行の ID
                          $with:
                            l:
                              $copy: label
                              $of: sec
                    to:
                      $first:
                        - $when:
                            - path: kind
                              equals: matrix
                          $then:
                            $copy: id
                            $of: element
                        - $copy: rows
                    note:
                      $when:
                        - path: kind
                          equals: matrix
                      $then: その行と列で絞る（URL のパラメータ）
              - $each: actions
                $bind: aid
                $flatten: true
                $build:
                  $each: actions
                  $of: model
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: .
                          $of: aid
                    from:
                      $copy: id
                      $of: element
                    by:
                      $format: ボタン「{label}」
                    to:
                      $apply: first-screen
              - $each: sections
                $bind: sec
                $flatten: true
                $build:
                  $each: views
                  $of: model
                  $bind: v
                  $flatten: true
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: view
                          $of: sec
                      - path: kind
                        equals: grid
                    $then:
                      $each: actions
                      $of: model
                      $build:
                        $when:
                          - path: target.entity
                            equals:
                              $copy: rows
                              $of: v
                        from:
                          $copy: id
                          $of: element
                        by:
                          $format: 区画「{s}」の行のボタン「{l}」
                          $with:
                            s:
                              $copy: label
                              $of: sec
                            l:
                              $copy: label
                        to:
                          $apply: first-screen
              - $each: reach.entities
                $bind: e
                $flatten: true
                $build:
                  $each: entities
                  $of: model
                  $bind: ent
                  $flatten: true
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: .
                          $of: e
                    $then:
                      $concat:
                        - $group:
                            $apply: fields
                          $by:
                            $when:
                              - or:
                                  - path: field.target
                                    exists: true
                                  - path: field.item.target
                                    exists: true
                            $then:
                              $copy: field.key
                          $build:
                            from:
                              $copy: id
                              $of: ent
                            by:
                              $format: 項目「{l}」
                              $with:
                                l:
                                  $copy: items[0].field.label
                            to:
                              $first:
                                - $copy: items[0].field.target
                                - $copy: items[0].field.item.target
                        - $each: actions
                          $of: model
                          $build:
                            $when:
                              - path: target.entity
                                equals:
                                  $copy: id
                                  $of: ent
                            from:
                              $copy: id
                              $of: ent
                            by:
                              $format: ボタン「{label}」
                            to:
                              $apply: first-screen
              - $each: reach.nested
                $bind: 'n'
                $flatten: true
                $build:
                  $each: entities
                  $of: model
                  $bind: ent
                  $flatten: true
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: .
                          $of: 'n'
                    $then:
                      $each: actions
                      $of: model
                      $build:
                        $when:
                          - path: target.entity
                            equals:
                              $copy: id
                              $of: ent
                        from:
                          $copy: owner.entity
                          $of: ent
                        by:
                          $format: 表「{t}」の行のボタン「{l}」
                          $with:
                            t:
                              $copy: label
                              $of: ent
                            l:
                              $copy: label
                        to:
                          $apply: first-screen
              - $each: actions
                $of: model
                $flatten: true
                $build:
                  $when:
                    - of: element
                      path: reach.operations
                      includes:
                        $copy: id
                  $then:
                    $concat:
                      - $when:
                          - path: params
                            empty: false
                        $then:
                          - from:
                              $format: '{id}/input'
                            by: ボタン「確認へ」
                            to:
                              $format: '{id}/confirm'
                          - from:
                              $format: '{id}/confirm'
                            by: ボタン「入力へ戻る」
                            to:
                              $format: '{id}/input'
                      - - from:
                            $format: '{id}/confirm'
                          by: ボタン「確定」
                          to: 起点の画面
                          note: 完了の知らせを出す
        bindings:
          $concat: []
        messages: []
    source:
      id: rule-screen-transitions
      document: .yde/transforms/design/screen-transitions-derived.yaml
rules:
  - id: fields
    build:
      $each: aspects
      $bind: asp
      $flatten: true
      $build:
        $each: fields
        $build:
          field:
            $copy: .
          schema:
            $copy: schema
            $of: asp
  - id: first-screen
    when:
      - path: params
        empty: false
    build:
      $format: '{id}/input'
  - id: first-screen
    build:
      $format: '{id}/confirm'
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
  - id: linked-document
    with:
      - document
      - bindings
      - messages
    build:
      $apply: linked-tree
      $of: document
      $with:
        bindings:
          $copy: .
          $of: bindings
        role: document
        messages:
          $copy: .
          $of: messages
  - id: contract-result
    with:
      - combined
    build:
      $copy: records[0].value
      $of: combined
  - id: contract-first
    with:
      - matches
    build:
      $copy: '[0]'
      $of: matches
  - id: linked-tree
    with:
      - bindings
      - role
      - messages
    build:
      $first:
        - $apply: linked-map
          $with:
            entries:
              $eachEntry: .
              $flatten: true
              $build:
                - key: $key
                  value:
                    $apply: linked-tree
                    $with:
                      bindings:
                        $copy: .
                        $of: bindings
                      role: $key
                      messages:
                        $copy: .
                        $of: messages
            node:
              $copy: .
            messages:
              $copy: .
              $of: messages
        - $each: .
          $build:
            $apply: linked-tree
            $with:
              bindings:
                $copy: .
                $of: bindings
              role:
                $copy: .
                $of: role
              messages:
                $copy: .
                $of: messages
        - $apply: linked-scalar
          $with:
            leaf:
              $copy: .
            bindings:
              $copy: .
              $of: bindings
            role:
              $copy: .
              $of: role
  - id: linked-scalar
    with:
      - leaf
      - bindings
      - role
    build:
      $first:
        - $apply: contract-first
          $with:
            matches:
              $each: .
              $of: bindings
              $build:
                $when:
                  - path: before
                    equals:
                      $copy: .
                      $of: leaf
                  - path: roles
                    includes:
                      $copy: .
                      $of: role
                $then:
                  $copy: after
        - $copy: .
          $of: leaf
  - id: linked-map
    with:
      - entries
      - node
      - messages
    when:
      - path: .
        of: entries
        exists: true
    build:
      $entries:
        $concat:
          - $copy: .
            $of: entries
          - $when:
              - path: text
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: text
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: message
                              $of: node
                        $then:
                          $copy: text
          - $when:
              - path: key
                of: node
                exists: true
              - path: message
                of: node
                exists: true
            $then:
              - key: message
                value:
                  $apply: contract-first
                  $with:
                    matches:
                      $each: .
                      $of: messages
                      $build:
                        $when:
                          - path: key
                            equals:
                              $copy: key
                              $of: node
                        $then:
                          $copy: text
