id: action-specs-derived
name: アクション定義書
description: 業務モデルの操作ごとに、外から見た振る舞いを 1 本の文書にする。値はすべて業務モデルから写し、設計の判断は入れない
scope: business
each: actions
output: design/system/derived/action-specs/{id}.yaml
dependsOn:
  - system-model
  - system-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-model-input
      $one: true
build:
  id:
    $format: DRV-document-action-specs.{id}
  record:
    id:
      $format: DOC-action-specs.{id}
    value:
      id:
        $copy: id
      name:
        $copy: label
      description:
        $copy: description
      kind:
        $copy: kind
      subject:
        $copy: subject
      inputs:
        $copy: params
      initial:
        $copy: input.initial
      state:
        $copy: lifecycle
      preconditions:
        $each: require
        $build:
          $copy: .
      effects:
        $copy: effects
      receiver:
        $copy: target
      inputPolicy:
        $copy: input
      checks:
        $copy: checks
      provides:
        $copy: provides
      writes:
        $each:
          $view: basic-model-entities
        $flatten: true
        $build:
          $each: values.record.operations
          $flatten: true
          $build:
            $when:
              - path: action
                equals:
                  $copy: id
                  $of: element
            $then:
              $each: writes
              $build:
                $copy: id
    source:
      id: rule-action-specs
      document: .yde/transforms/design/action-specs-derived.yaml
rules:
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
