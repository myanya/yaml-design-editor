id: basic-types
name: 基本設計項目一覧（論理型）
description: >-
  基本設計の段の項から、論理型の設計項目を 1 本の一覧にする。業務モデルで名前を付けた型（common#一行の文 など）と、
  項目が直接使う組込みの型（text・boolean）。論理型は TYP-モジュール.型の名前（組込みは TYP-型の名前）の ID を持ち、導出元（業務モデルの型の定義）を参照で指す。
  値は業務モデルの書き方のまま（基底の種類・文字数・形・表示形式・選択肢・参照先）。行の型（コメントなど）は、行の項目（FLD-モジュール.型の名前.キー）を持つ。
  エンティティの項目と、詳細設計の型対応表・テーブルは、この論理型を参照する
scope: business
stage: basic
output: design/basic/types.yaml
build:
  types:
    # 項番を通しで振るため、名前付きの型と組込みの型を 1 列にしてから、名前でまとめる（名前は重ならない）
    $group:
      $concat:
        - { $each: types, $build: { $copy: . } }
        # 組込みの型: エンティティの項目と、名前付きの型の中で直接使うもの（入れ子の項目・配列とマップの要素を含む。名前に # が無く、入れ物でない）
        - $each: entities
          $flatten: true
          $build:
            $each: aspects
            $flatten: true
            $build: { $each: fields, $flatten: true, $apply: builtins }
        - $each: types
          $flatten: true
          $build:
            $concat:
              - { $each: fields, $flatten: true, $apply: builtins }
              - { $apply: builtins, $at: item }
              - { $apply: builtins, $at: value }
    $by: { $copy: name }
    $bind: g
    $build:
      seq: { $number: $position, $as: "00" }
      id: { $apply: typ-id, $at: "items[0]" }
      name: { $copy: key }
      base: { $copy: "items[0].base" }
      maxLength: { $copy: "items[0].maxLength" }
      minLength: { $copy: "items[0].minLength" }
      pattern: { $copy: "items[0].pattern" }
      format: { $copy: "items[0].format" }
      min: { $copy: "items[0].min" }
      max: { $copy: "items[0].max" }
      multiline: { $copy: "items[0].multiline" }
      values: { $copy: "items[0].values" }
      target: { $when: [{ path: "items[0].target", exists: true }], $then: { $format: "ENT-{t}", $with: { t: { $copy: "items[0].target" } } } }
      # 配列・マップの型: 要素の論理型か要素のエンティティ（要素が名前の無い配列・マップなら、その基底の種類）
      itemType: { $first: [{ $apply: type-of, $at: "items[0].item" }, { $apply: type-of, $at: "items[0].value" }] }
      itemEntity: { $first: [{ $apply: entity-of, $at: "items[0].item" }, { $apply: entity-of, $at: "items[0].value" }] }
      itemBase: { $first: [{ $apply: elem-base, $at: "items[0].item" }, { $apply: elem-base, $at: "items[0].value" }] }
      # 行の型（object）の項目と、配列・マップの型の要素が名前の無い object なら、その項目: 項目ごとに ID（FLD-モジュール.型の名前.キー）と、
      # 項目の論理型への参照（入れ子の項目は FLD-モジュール.型の名前.キー.キー）
      fields:
        $first:
          - $each: "items[0].fields"
            $apply: item
            $with: { owner: { id: { $apply: typ-key, $at: "items[0]" } } }
          - $apply: elem-items
            $at: "items[0].item"
            $with: { owner: { id: { $apply: typ-key, $at: "items[0]" } } }
          - $apply: elem-items
            $at: "items[0].value"
            $with: { owner: { id: { $apply: typ-key, $at: "items[0]" } } }
      description: { $copy: "items[0].description" }
      # 導出元: 業務モデルの型の定義（定義の索引の yde-type）。組込みの型には無い
      source: { $when: [{ path: "items[0].builtin", exists: false }], $then: { $copy: key } }
rules:
  # 論理型の ID（いまの場所は name を持つ型）: common#一行の文 → TYP-common.一行の文、組込みの text → TYP-text
  - id: typ-id
    build: { $format: "TYP-{k}", $with: { k: { $apply: typ-key } } }
  - id: typ-key
    build:
      $first:
        - $format: "{m}.{n}"
          $with: { m: { $value: { extract: [{ path: name }, "^([^#]+)#"] } }, n: { $value: { extract: [{ path: name }, "#(.+)$"] } } }
        - { $copy: name }
  # 項目の論理型への参照（いまの場所は type を持つ項目）
  - id: typ-ref
    build:
      $first:
        - $format: "TYP-{m}.{n}"
          $with: { m: { $value: { extract: [{ path: type }, "^([^#]+)#"] } }, n: { $value: { extract: [{ path: type }, "#(.+)$"] } } }
        - { $format: "TYP-{type}" }
  # 項目（か要素）と、その中で使う組込みの型（名前に # が無く、入れ物でないもの）
  - id: builtins
    build:
      $concat:
        - - $when: [{ not: { path: base, oneOf: [array, map, object] } }, { not: { path: type, contains: "#" } }]
            $then: { name: { $copy: type }, base: { $copy: base }, builtin: true }
        - { $each: fields, $flatten: true, $apply: builtins }
        - { $apply: builtins, $at: item }
        - { $apply: builtins, $at: value }
  # 名前の無い入れ物（配列・マップ・名前の無い object・入れ子のエンティティ）でなければ、論理型への参照（いまの場所は項目か要素）
  - id: type-of
    when:
      - { not: { path: base, oneOf: [array, map] } }
      - { path: entity, exists: false }
      - { or: [{ path: base, notEquals: object }, { path: type, contains: "#" }] }
    build: { $apply: typ-ref }
  # 名前の無い入れ物の基底の種類（配列・マップ・object。名前付きの型は論理型に書く）
  - id: base-of
    when: [{ path: base, oneOf: [array, map] }]
    build: { $copy: base }
  - id: base-of
    when: [{ path: base, equals: object }, { or: [{ path: entity, exists: true }, { not: { path: type, contains: "#" } }] }]
    build: object
  # 入れ子のエンティティ（項目か要素が、ID を持つ object）
  - id: entity-of
    when: [{ path: entity, exists: true }]
    build: { $format: "ENT-{entity}" }
  # 要素が名前の無い配列・マップのとき（配列の配列など）、その基底の種類。テーブルにできない形の印（対応の検査が指摘する）
  - id: elem-base
    when: [{ path: base, oneOf: [array, map] }]
    build: { $copy: base }
  # 入れ子の項目: 名前の無い object の項目と、名前の無い object を要素にする配列・マップの、要素の項目。ID は FLD-親の項目の ID の部分.キー
  - id: sub-items
    with: [owner]
    when: [{ path: base, equals: object }, { path: entity, exists: false }, { not: { path: type, contains: "#" } }]
    build:
      $each: fields
      $apply: item
      $with: { owner: { id: { $format: "{o}.{key}", $with: { o: { $copy: id, $of: owner } } } } }
  - id: sub-items
    with: [owner]
    when: [{ path: base, oneOf: [array, map] }]
    build:
      $first:
        - { $apply: elem-items, $at: item, $with: { owner: { id: { $format: "{o}.{key}", $with: { o: { $copy: id, $of: owner } } } } } }
        - { $apply: elem-items, $at: value, $with: { owner: { id: { $format: "{o}.{key}", $with: { o: { $copy: id, $of: owner } } } } } }
  # 要素が名前の無い object なら、その項目（いまの場所は要素）
  - id: elem-items
    with: [owner]
    when: [{ path: base, equals: object }, { path: entity, exists: false }, { not: { path: type, contains: "#" } }]
    build: { $each: fields, $apply: item, $with: { owner: { $copy: ., $of: owner } } }
  # 入れ子の項目 1 つ（いまの場所は項目。owner は親の ID の部分）
  - id: item
    with: [owner]
    build:
      seq: { $number: $position, $as: "00" }
      id: { $format: "FLD-{o}.{key}", $with: { o: { $copy: id, $of: owner } } }
      key: { $copy: key }
      label: { $copy: label }
      type: { $apply: type-of }
      base: { $apply: base-of }
      entity: { $apply: entity-of }
      itemType: { $first: [{ $apply: type-of, $at: item }, { $apply: type-of, $at: value }] }
      itemEntity: { $first: [{ $apply: entity-of, $at: item }, { $apply: entity-of, $at: value }] }
      itemBase: { $first: [{ $apply: elem-base, $at: item }, { $apply: elem-base, $at: value }] }
      required: { $copy: required }
      default: { $copy: default }
      auto: { $copy: auto }
      unique: { $copy: unique }
      description: { $copy: description }
      fields: { $apply: sub-items, $with: { owner: { $copy: ., $of: owner } } }
