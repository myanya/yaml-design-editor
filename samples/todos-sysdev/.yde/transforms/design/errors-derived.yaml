id: errors-derived
name: エラー定義書
description: >-
  基本設計。断りの種類と出す場所、業務モデルのデータの決まりの扱い（どう確かめるか・確かめない理由）、操作ごとの断り（入力の誤り・見つからない・ 状態・前提・データの決まり・二重の確定）を 1 本にする。決め打ちの規則（エラーとメッセージの議論で決めたもの）:
  入力の誤りは確認へで入力画面に（欄の横と上のまとめ）・受け取る値が原因で破れうるデータの決まりは確認へでも入力画面の欄の横に・ 状態・前提・データの決まりは確定のときに確認画面に・ID を指定して見つからなければ見つからない画面（404）・絞り込みの結果が 0
  件は正常（一覧に文）・ 二重の確定と時間切れは起点の画面へ戻して知らせ・想定外はエラー画面（受付番号だけ。500）・断るのはエラーの決まりだけ（警告は断らない）
scope: business
output: design/system/derived/errors/errors.yaml
dependsOn:
  - system-screen-input-model
  - system-input-gate
input:
  $apply: model-input
  $with:
    row:
      $view: system-screen-input-model-input
      $one: true
build:
  id:
    $format: DRV-document-errors.errors
  record:
    id:
      $format: DOC-errors.errors
    value:
      id: errors
      name: エラー定義書
      kinds:
        - kind: input
          label: 入力の誤り
          when: 確認へを押したとき（Bean Validation）
          shownAt: 入力画面（欄の横と、上のまとめ）
          status: 200
          message: validation.検査.フォーム.項目
        - kind: input-rule
          label: 受け取る値が原因のデータの決まりの違反
          when: 確認へを押したとき（Service の確かめ。書かない）
          shownAt: 入力画面（欄の横と、上のまとめ）
          status: 200
          message: check.決まり
        - kind: state
          label: 状態の断り
          when: 確定のとき
          shownAt: 確認画面の断りの文
          status: 200
          message: 操作.state
        - kind: precondition
          label: 前提の断り
          when: 確定のとき
          shownAt: 確認画面の断りの文
          status: 200
          message: 操作.前提
        - kind: rule
          label: データの決まりの違反
          when: 確定のとき（書いた後の値で）
          shownAt: 確認画面の断りの文
          status: 200
          message: check.決まり
        - kind: empty
          label: 絞り込みの結果が 0 件（正常）
          when: 一覧画面を出すとき
          shownAt: 一覧画面の表の代わりの文
          status: 200
          message: list.empty.型
        - kind: not-found
          label: ID を指定して見つからない
          when: 詳細画面・操作の画面で受け手を読んだとき
          shownAt: 見つからない画面
          status: 404
          message: error.notFound.型
        - kind: token
          label: 二重の確定・時間切れ
          when: 確定のとき（トークンが無い・違う）
          shownAt: 起点の画面へ戻し、知らせで出す
          status: 302
          message: error.token
        - kind: unexpected
          label: 想定外
          when: いつでも（DB の誤り・画面を改ざんした参照の値が外部キーで書けない、など）
          shownAt: エラー画面（受付番号だけ。中身は出さない）
          status: 500
          message: error.unexpected
      constraints:
        $each: constraints
        $of: model
        $bind: k
        $build:
          constraint:
            $copy: id
          label:
            $copy: label
          level:
            $copy: level
          form:
            $copy: form
          by:
            $apply: by
          how:
            $apply: how
          message:
            $when:
              - path: level
                equals: error
              - or:
                  - path: form
                    equals: element
                  - path: rule.match[1].edge.contains
                    equals: true
                  - path: kind
                    equals: acyclic
            $then:
              $format: check.{id}
          operations:
            $each: actions
            $of: model
            $bind: a
            $flatten: true
            $build:
              $each: checks
              $build:
                $when:
                  - path: constraint
                    equals:
                      $copy: id
                      $of: k
                $then:
                  $copy: id
                  $of: a
      operations:
        $each: actions
        $of: model
        $bind: a
        $build:
          id:
            $copy: id
          name:
            $copy: label
          screens:
            $first:
              - $when:
                  - of: model
                    path: reach.operations
                    includes:
                      $copy: id
                $then: 入力画面と確認画面（ダッシュボードからたどれる）
              - 画面なし（ダッシュボードからたどれない。Service だけ）
          inputs:
            $each: params
            $bind: p
            $flatten: true
            $build:
              $concat:
                - $when:
                    - not:
                        path: base
                        equals: object
                    - or:
                        - path: item.base
                          exists: false
                        - not:
                            path: item.base
                            equals: object
                    - or:
                        - path: required
                          equals: true
                        - path: maxLength
                          exists: true
                        - path: minLength
                          exists: true
                        - path: pattern
                          exists: true
                        - path: base
                          equals: date
                        - path: unique
                          exists: true
                  $then:
                    - field:
                        $case:
                          $copy: key
                        $as: camel
                      label:
                        $copy: label
                      checks:
                        $apply: input-checks
                - $when:
                    - path: item.base
                      equals: object
                  $then:
                    $each: item.fields
                    $build:
                      $when:
                        - or:
                            - path: required
                              equals: true
                            - path: maxLength
                              exists: true
                            - path: minLength
                              exists: true
                            - path: pattern
                              exists: true
                            - path: base
                              equals: date
                            - path: unique
                              exists: true
                      field:
                        $format: '{p}.{k}'
                        $with:
                          p:
                            $case:
                              $copy: key
                              $of: p
                            $as: camel
                          k:
                            $case:
                              $copy: key
                            $as: camel
                      label:
                        $copy: label
                      checks:
                        $apply: input-checks
          refusals:
            $concat:
              - $when:
                  - path: target.entity
                    exists: true
                $then:
                  - kind: not-found
                    message:
                      $format: error.notFound.{e}
                      $with:
                        e:
                          $copy: target.entity
                    when: 受け手の ID で読んで、無いとき
                    shownAt: 見つからない画面（404）
              - $when:
                  - path: lifecycle.refusal
                    exists: true
                $then:
                  - kind: state
                    message:
                      $format: '{id}.state'
                    when: 受け手の状態が、この操作のできる状態でないとき
                    allowed:
                      $each: lifecycle.transitions
                      $flatten: true
                      $build:
                        $each: from
                        $build:
                          $copy: label
                    shownAt: 確認画面（確定のとき）
              - $each: require
                $build:
                  $when:
                    - path: id
                      exists: true
                  kind: precondition
                  message:
                    $format: '{a}.{r}'
                    $with:
                      a:
                        $copy: id
                        $of: a
                      r:
                        $copy: id
                  when:
                    $copy: message
                  shownAt: 確認画面（確定のとき）
              - $each: checks
                $bind: c
                $flatten: true
                $build:
                  $each: constraints
                  $of: model
                  $build:
                    $when:
                      - path: id
                        equals:
                          $copy: constraint
                          $of: c
                      - path: level
                        equals: error
                      - or:
                          - path: form
                            equals: element
                          - path: form
                            equals: pattern
                          - path: kind
                            equals: acyclic
                    kind: rule
                    message:
                      $format: check.{id}
                    when:
                      $copy: label
                    by:
                      $apply: by
                    shownAt:
                      $first:
                        - $when:
                            - of: c
                              path: params
                              exists: true
                            - not:
                                path: form
                                equals: pattern
                          $then:
                            $format: 入力画面の「{l[0]}」の欄の横（確認へ）と、確認画面（確定のとき）
                            $with:
                              l:
                                $each: params
                                $of: a
                                $build:
                                  $when:
                                    - path: key
                                      equals:
                                        $copy: params[0]
                                        $of: c
                                  $then:
                                    $copy: label
                        - 確認画面（確定のとき）
              - - kind: token
                  message: error.token
                  when: トークンが無い・違う（確定済み・時間切れ・確認画面を経ない確定）
                  shownAt: 起点の画面へ戻し、知らせで出す
    source:
      id: rule-errors
      document: .yde/transforms/design/errors-derived.yaml
rules:
  - id: by
    when:
      - path: level
        equals: warning
    build: 対象外
  - id: by
    when:
      - path: form
        equals: occurrence
    build: 対象外
  - id: by
    when:
      - path: kind
        equals: types
    build: 対象外
  - id: by
    when:
      - path: kind
        equals: outMax
      - path: multiple
        equals: false
    build: 対象外
  - id: by
    when:
      - or:
          - path: form
            equals: element
          - path: kind
            equals: acyclic
    build: Java
  - id: by
    when:
      - path: form
        equals: pattern
      - path: rule.match[1].edge.contains
        equals: true
    build: SQL
  - id: by
    build: 手で書く
  - id: how
    when:
      - path: level
        equals: warning
    build: 警告は断らない（YDE の操作と同じく、断るのはエラーの決まりだけ）
  - id: how
    when:
      - path: form
        equals: occurrence
    build: エンティティ型は 1 つのテーブル（一覧の行と個票は同じ行）なので、どの文書に書かれるかの決まりは起きない
  - id: how
    when:
      - path: kind
        equals: types
    build: 参照の列は参照先のテーブルの外部キーなので、宣言の外の型は入らない
  - id: how
    when:
      - path: kind
        equals: outMax
      - path: multiple
        equals: false
    build: 参照は 1 列なので、2 つは入らない
  - id: how
    when:
      - path: kind
        equals: acyclic
    build: 書く参照の先から、同じ項目の参照を findById でたどり、受け手（作る操作は作る要素）に戻れば断る（書く前）
  - id: how
    when:
      - path: form
        equals: element
      - path: at
        exists: true
    build: 足す明細の行について、書いた後の値を計算し、書く前に確かめる
  - id: how
    when:
      - path: form
        equals: element
    build: 書いた後の値を計算し、書く前に確かめる
  - id: how
    when:
      - path: form
        equals: pattern
      - path: rule.match[1].edge.contains
        equals: true
    build: 書いた後に、同じトランザクションで入れ子の要素の件数を数える（違反なら例外で書いたものを取り消す）
  - id: how
    build: 写す規則が無い形
  - id: input-checks
    build:
      $concat:
        - $when:
            - path: required
              equals: true
          $then:
            - 必須
        - $when:
            - path: maxLength
              exists: true
          $then:
            - $format: 最長 {maxLength} 文字
        - $when:
            - path: minLength
              gt: 1
          $then:
            - $format: 最短 {minLength} 文字
        - $when:
            - path: pattern
              exists: true
          $then:
            - 形式
        - $when:
            - path: base
              equals: date
          $then:
            - 年月日として読める
        - $when:
            - path: unique
              exists: true
          $then:
            - 同じものを 2 回選ばない
  - id: model-input
    with:
      - row
    build:
      $copy: values.model
      $of: row
