id: screen-lists
name: 画面定義書（一覧画面）
description: >-
  基本設計。ダッシュボードごとに一覧画面を 1 つ作る（ダッシュボードを起点に画面を決める）。決め打ちの規則（画面系の議論で決めたもの）:
  絞り込みはダッシュボードの共有の入力で、URL のパラメータで持つ・区画は同じ画面の中に並べる（業務の流れの図は外す）・
  上部の操作はボタン・一覧の区画の行の右に、行の型を受け手にする操作のボタン（Lifecycle の状態で出す・出さない）・
  行の ID は詳細画面へ・集計のセルは、その行と列で絞った一覧へ・ボタンは操作の入力画面（入力が無ければ確認画面）へ
scope: business
each: dashboards
output: "design/generated/screens/lists/{id}.yaml"
build:
  id: { $copy: id }
  name: { $copy: label }
  kind: list
  url: { $first: [{ $when: [{ path: default, equals: true }], $then: / }, { $format: "/{id}" }] }
  filters:
    $each: inputs
    $build:
      key: { $copy: key }
      label: { $copy: label }
      type: { $copy: type }
      multiple: { $copy: multiple }
      carried: URL のパラメータ
  # 上部の操作のボタン（ダッシュボードに書いた順）
  buttons:
    $each: actions
    $bind: aid
    $flatten: true
    $build:
      $each: actions
      $of: model
      $build:
        $when: [{ path: id, equals: { $copy: ., $of: aid } }]
        operation: { $copy: id }
        label: { $copy: label }
        to: { $apply: first-screen }
  sections:
    $each: sections
    $bind: sec
    $flatten: true
    $build:
      $each: views
      $of: model
      $bind: v
      $flatten: true
      $build:
        $when: [{ path: id, equals: { $copy: view, $of: sec } }]
        $then:
          - id: { $copy: id, $of: sec }
            label: { $copy: label, $of: sec }
            group: { $copy: group, $of: sec }
            view: { $copy: id }
            kind: { $map: { $copy: kind }, $using: { grid: 一覧, matrix: 集計, chart: グラフ } }
            rows: { $copy: rows }
            filter: { $copy: filter, $of: sec }
            columns:
              $first:
                - $when: [{ path: kind, equals: grid }]
                  $then: { $each: columns, $build: { $copy: label } }
                - $when: [{ path: kind, equals: matrix }]
                  $then: { $each: columns.values, $build: { $copy: label } }
            link:
              $when: [{ path: kind, equals: grid }, { path: rows, exists: true }]
              $then: { by: 行の ID, to: { $copy: rows } }
            cell:
              $when: [{ path: kind, equals: matrix }]
              $then:
                to: { $copy: id, $of: element }
                shows: { $copy: counts }
                by: { row: { $copy: rows }, column: { $copy: columns.path } }
            rowButtons:
              $when: [{ path: kind, equals: grid }]
              $then:
                $each: actions
                $of: model
                $build:
                  $when: [{ path: target.entity, equals: { $copy: rows, $of: v } }]
                  operation: { $copy: id }
                  label: { $copy: label }
                  shownWhen: { $apply: shown-when }
                  to: { $apply: first-screen }
rules:
  # いまの場所＝操作。ボタンを出す状態（Lifecycle の遷移の元の状態）。Lifecycle に従わない操作は、いつも出す
  - id: shown-when
    when: [{ path: lifecycle.transitions, exists: true }]
    build: { $each: lifecycle.transitions, $flatten: true, $build: { $each: from, $build: { value: { $copy: value }, label: { $copy: label } } } }
  - id: shown-when
    build: いつも
  # いまの場所＝操作。ボタンを押して出る画面（入力が無い操作は確認画面）
  - id: first-screen
    when: [{ path: params, empty: false }]
    build: { $format: "{id}/input" }
  - id: first-screen
    build: { $format: "{id}/confirm" }
