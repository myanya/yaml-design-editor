id: basic-entities
name: 基本設計項目一覧（エンティティ）
description: >-
  基本設計の段の項（業務モデル＋基本設計のルール）から、エンティティの設計項目を 1 本の一覧にする。
  エンティティは ENT-型、項目は FLD-型.キー、操作は OPS-型.操作、書く項目は CRUD-型.操作.キー の ID を持ち、導出元（業務モデルのエンティティ型・項目・操作）を参照で指す。
  値は業務モデルの項と同じ書き方（YDE の標準。型の名前・auto・選択肢の value・採番）のまま持ち、日本語に言い換えない。人が読む言葉は説明（description）に書く。
  一覧の行と個票のように業務モデルで 2 か所に書かれた項目は 1 つにまとめる。人が読む設計書はビュー「エンティティ定義書」
scope: business
stage: basic
output: design/basic/entities.yaml
build:
  entities:
    $each: entities
    $bind: ent
    $build:
      id: { $format: "ENT-{id}" }
      label: { $copy: label }
      description: { $copy: description }
      source: { $copy: id }
      parent: { $when: [{ path: owner.entity, exists: true }], $then: { $format: "ENT-{owner.entity}" } }
      parentField: { $when: [{ path: owner.entity, exists: true }], $then: { $format: "FLD-{owner.entity}.{owner.field}" } }
      # ID形式: 業務モデルの採番のまま（ID を入れる項目 path・接頭辞 prefix・桁 digits）と、ID項目（項目一覧の設計項目）と説明
      numbering:
        $when: [{ path: numbering, exists: true }]
        $then:
          item: { $format: "FLD-{id}.{numbering.path}" }
          path: { $copy: numbering.path }
          prefix: { $copy: numbering.prefix }
          digits: { $copy: numbering.digits }
          description:
            $first:
              # 接頭辞を親の ID から作るとき（作業項目 TODO-002-S01）
              - $when: [{ path: "numbering.prefix.$of", equals: owner }]
                $then:
                  $format: "親の ID に「{s}」と {numbering.digits} 桁の番号を続ける（使われている番号の次）"
                  $with: { s: { $value: { extract: [{ path: "numbering.prefix.$format" }, '\}(.*)$'] } } }
              - { $format: "「{numbering.prefix}」に {numbering.digits} 桁の番号を続ける（使われている番号の次）" }
      documents: { $each: aspects, $build: { $copy: schema } }
      # 項目一覧: 側面ごとの項目をキーでまとめる（初出順）。共通の性質は論理型に、項目固有の制限は項目に持つ。
      # 基底はすべての項目に記録する。型の参照と項目そのものの決まり（必須・初期値・自動・重ならない）も保持する
      items:
        $group: { $apply: fields }
        $by: { $copy: field.key }
        $build:
          seq: { $number: $position, $as: "00" }
          id: { $format: "FLD-{e}.{k}", $with: { e: { $copy: id, $of: ent }, k: { $copy: key } } }
          key: { $copy: key }
          label: { $copy: "items[0].field.label" }
          # 論理型（TYP-…）。名前の無い入れ物（配列・マップ・名前の無い object・入れ子のエンティティ）は型を持たないので、基底の種類と、
          # 要素の論理型か要素のエンティティ（配列・マップ）か、入れ子の項目（名前の無い object）を持つ
          type: { $apply: type-of, $at: "items[0].field" }
          base: { $copy: "items[0].field.base" }
          maxLength: { $copy: "items[0].field.overrides.maxLength" }
          minLength: { $copy: "items[0].field.overrides.minLength" }
          pattern: { $copy: "items[0].field.overrides.pattern" }
          format: { $copy: "items[0].field.overrides.format" }
          min: { $copy: "items[0].field.overrides.min" }
          max: { $copy: "items[0].field.overrides.max" }
          multiline: { $copy: "items[0].field.overrides.multiline" }
          values: { $copy: "items[0].field.overrides.values" }
          target: { $when: [{ path: "items[0].field.overrides.target", exists: true }], $then: { $format: "ENT-{t}", $with: { t: { $copy: "items[0].field.overrides.target" } } } }
          entity: { $apply: entity-of, $at: "items[0].field" }
          itemType: { $first: [{ $apply: type-of, $at: "items[0].field.item" }, { $apply: type-of, $at: "items[0].field.value" }] }
          itemEntity: { $first: [{ $apply: entity-of, $at: "items[0].field.item" }, { $apply: entity-of, $at: "items[0].field.value" }] }
          itemBase: { $first: [{ $apply: elem-base, $at: "items[0].field.item" }, { $apply: elem-base, $at: "items[0].field.value" }] }
          itemOverrides: { $first: [{ $copy: "items[0].field.item.overrides" }, { $copy: "items[0].field.value.overrides" }] }
          required: { $copy: "items[0].field.required" }
          default: { $copy: "items[0].field.default" }
          auto: { $copy: "items[0].field.auto" }
          unique: { $copy: "items[0].field.unique" }
          description: { $copy: "items[0].field.description" }
          # 入れ子の項目（名前の無い object の項目・名前の無い object を要素にする配列とマップの、要素の項目）
          fields: { $apply: sub-items, $at: "items[0].field", $with: { owner: { id: { $copy: id, $of: ent } } } }
          # 導出元: 業務モデルの項目（ルールで足した項目は、業務モデルに無いので書かない）
          source:
            $when: [{ path: "items[0].field.origin", exists: false }]
            $then: { $format: "{e}.{k}", $with: { e: { $copy: id, $of: ent }, k: { $copy: key } } }
          rule: { $copy: "items[0].field.origin.by" }
          documents: { $each: items, $build: { $copy: schema } }
      # 操作一覧: この型の項目を作成（C）・更新（U）する操作（操作ごとに、書く項目）
      operations:
        $group:
          $each: actions
          $of: model
          $bind: a
          $flatten: true
          $build:
            $each: effects
            $flatten: true
            $build:
              $concat:
                # 項目を書く（値を入れる・消す・配列へ足す。別の型の要素を足す配列も、この型の項目を書く）
                - $when:
                    - { path: entity, equals: { $copy: id, $of: ent } }
                    - { or: [{ path: op, equals: set }, { path: op, equals: delete }, { path: op, equals: insert }] }
                    - { or: [{ path: field.item.entity, exists: false }, { path: field.item.entity, notEquals: { $copy: id, $of: ent } }] }
                  $then: [{ item: { $copy: field.key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } }]
                # この型の要素を作る（文書を作る・一覧や入れ子の配列へ足す）: 書いた項目はどれも作成
                - $when: [{ path: op, equals: create }, { path: entity, equals: { $copy: id, $of: ent } }]
                  $then: { $each: written, $build: { item: { $copy: key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } } }
                - $when: [{ path: op, equals: insert }, { path: field.item.entity, equals: { $copy: id, $of: ent } }]
                  $then: { $each: written, $build: { item: { $copy: key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } } }
        $by: { $copy: action }
        $bind: op
        $build:
          seq: { $number: $position, $as: "00" }
          id: { $format: "OPS-{e}.{a}", $with: { e: { $copy: id, $of: ent }, a: { $copy: key } } }
          action: { $copy: key }
          label: { $copy: "items[0].label" }
          crud: { $first: [{ $when: [{ path: "items[0].creates", equals: true }], $then: C }, U] }
          # 書く項目（CRUD 表のセル）: 項目ごとに、作成（C）か更新（U）か
          writes:
            $group: items
            $by: { $copy: item }
            $build:
              id: { $format: "CRUD-{e}.{a}.{k}", $with: { e: { $copy: id, $of: ent }, a: { $copy: key, $of: op }, k: { $copy: key } } }
              entity: { $format: "ENT-{e}", $with: { e: { $copy: id, $of: ent } } }
              operation: { $format: "OPS-{e}.{a}", $with: { e: { $copy: id, $of: ent }, a: { $copy: key, $of: op } } }
              item: { $format: "FLD-{e}.{k}", $with: { e: { $copy: id, $of: ent }, k: { $copy: key } } }
              crud: { $first: [{ $when: [{ of: op, path: "items[0].creates", equals: true }], $then: C }, U] }
      # CRUD 表: 行＝項目、列＝操作 ID、値＝作成 C か更新 U（書かなければ空）。上の操作一覧と同じ書く印から作る
      crud:
        $group: { $apply: fields }
        $by: { $copy: field.key }
        $bind: row
        $build:
          $entries:
            $concat:
              - - { key: 項目, value: { $copy: key } }
                - { key: 名称, value: { $first: [{ $copy: "items[0].field.label" }, { $copy: key }] } }
              - $group:
                  $each: actions
                  $of: model
                  $bind: a
                  $flatten: true
                  $build:
                    $each: effects
                    $flatten: true
                    $build:
                      $concat:
                        # 項目を書く（値を入れる・消す・配列へ足す。別の型の要素を足す配列も、この型の項目を書く）
                        - $when:
                            - { path: entity, equals: { $copy: id, $of: ent } }
                            - { or: [{ path: op, equals: set }, { path: op, equals: delete }, { path: op, equals: insert }] }
                            - { or: [{ path: field.item.entity, exists: false }, { path: field.item.entity, notEquals: { $copy: id, $of: ent } }] }
                          $then: [{ item: { $copy: field.key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } }]
                        # この型の要素を作る（文書を作る・一覧や入れ子の配列へ足す）: 書いた項目はどれも作成
                        - $when: [{ path: op, equals: create }, { path: entity, equals: { $copy: id, $of: ent } }]
                          $then: { $each: written, $build: { item: { $copy: key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } } }
                        - $when: [{ path: op, equals: insert }, { path: field.item.entity, equals: { $copy: id, $of: ent } }]
                          $then: { $each: written, $build: { item: { $copy: key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } } }
                $by: { $copy: action }
                $build: { key: { $copy: key }, value: '' }
              - $group:
                  $each: actions
                  $of: model
                  $bind: a
                  $flatten: true
                  $build:
                    $each: effects
                    $flatten: true
                    $build:
                      $concat:
                        # 項目を書く（値を入れる・消す・配列へ足す。別の型の要素を足す配列も、この型の項目を書く）
                        - $when:
                            - { path: entity, equals: { $copy: id, $of: ent } }
                            - { or: [{ path: op, equals: set }, { path: op, equals: delete }, { path: op, equals: insert }] }
                            - { or: [{ path: field.item.entity, exists: false }, { path: field.item.entity, notEquals: { $copy: id, $of: ent } }] }
                          $then: [{ item: { $copy: field.key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } }]
                        # この型の要素を作る（文書を作る・一覧や入れ子の配列へ足す）: 書いた項目はどれも作成
                        - $when: [{ path: op, equals: create }, { path: entity, equals: { $copy: id, $of: ent } }]
                          $then: { $each: written, $build: { item: { $copy: key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } } }
                        - $when: [{ path: op, equals: insert }, { path: field.item.entity, equals: { $copy: id, $of: ent } }]
                          $then: { $each: written, $build: { item: { $copy: key }, action: { $copy: id, $of: a }, label: { $copy: label, $of: a }, creates: { $when: [{ of: a, path: creates, includes: { $copy: id, $of: ent } }], $then: true } } }
                $by: { $when: [{ path: item, equals: { $copy: key, $of: row } }], $then: { $copy: action } }
                $build: { key: { $copy: key }, value: { $first: [{ $when: [{ path: "items[0].creates", equals: true }], $then: C }, U] } }
rules:
  # いまの場所＝エンティティ型。側面ごとの項目を 1 列に（{field: 項目, schema: 書かれた文書の種類}）
  - id: fields
    build:
      $each: aspects
      $bind: asp
      $flatten: true
      $build:
        $each: fields
        $build: { field: { $copy: . }, schema: { $copy: schema, $of: asp } }
  # 論理型への参照（いまの場所は type を持つ項目）: common#一行の文 → TYP-common.一行の文、組込みの text → TYP-text
  - id: typ-ref
    build:
      $first:
        - $format: "TYP-{m}.{n}"
          $with: { m: { $value: { extract: [{ path: type }, "^([^#]+)#"] } }, n: { $value: { extract: [{ path: type }, "#(.+)$"] } } }
        - { $format: "TYP-{type}" }
  # 名前の無い入れ物（配列・マップ・名前の無い object・入れ子のエンティティ）でなければ、論理型への参照（いまの場所は項目か要素）
  - id: type-of
    when:
      - { or: [{ not: { path: base, oneOf: [array, map] } }, { path: type, contains: "#" }] }
      - { path: entity, exists: false }
      - { or: [{ path: base, notEquals: object }, { path: type, contains: "#" }] }
    build: { $apply: typ-ref }
  # 入れ子のエンティティ（項目か要素が、ID を持つ object）
  - id: entity-of
    when: [{ path: entity, exists: true }]
    build: { $format: "ENT-{entity}" }
  # 要素が名前の無い配列・マップのとき（配列の配列など）、その基底の種類。テーブルにできない形の印（対応の検査が指摘する）
  - id: elem-base
    build: { $copy: base }
  # 入れ子の項目: 名前の無い object の項目と、名前の無い object を要素にする配列・マップの、要素の項目。ID は FLD-親の項目の ID の部分.キー
  - id: sub-items
    with: [owner]
    when: [{ path: base, equals: object }, { path: entity, exists: false }, { not: { path: type, contains: "#" } }]
    build:
      $each: fields
      $apply: item
      $with: { owner: { id: { $format: "{o}.{key}", $with: { o: { $copy: id, $of: owner } } } } }
  - id: sub-items
    with: [owner]
    when: [{ path: base, oneOf: [array, map] }]
    build:
      $first:
        - { $apply: elem-items, $at: item, $with: { owner: { id: { $format: "{o}.{key}", $with: { o: { $copy: id, $of: owner } } } } } }
        - { $apply: elem-items, $at: value, $with: { owner: { id: { $format: "{o}.{key}", $with: { o: { $copy: id, $of: owner } } } } } }
  # 要素が名前の無い object なら、その項目（いまの場所は要素）
  - id: elem-items
    with: [owner]
    when: [{ path: base, equals: object }, { path: entity, exists: false }, { not: { path: type, contains: "#" } }]
    build: { $each: fields, $apply: item, $with: { owner: { $copy: ., $of: owner } } }
  # 入れ子の項目 1 つ（いまの場所は項目。owner は親の ID の部分）
  - id: item
    with: [owner]
    build:
      seq: { $number: $position, $as: "00" }
      id: { $format: "FLD-{o}.{key}", $with: { o: { $copy: id, $of: owner } } }
      key: { $copy: key }
      label: { $copy: label }
      type: { $apply: type-of }
      base: { $copy: base }
      maxLength: { $copy: "overrides.maxLength" }
      minLength: { $copy: "overrides.minLength" }
      pattern: { $copy: "overrides.pattern" }
      format: { $copy: "overrides.format" }
      min: { $copy: "overrides.min" }
      max: { $copy: "overrides.max" }
      multiline: { $copy: "overrides.multiline" }
      values: { $copy: "overrides.values" }
      target: { $when: [{ path: "overrides.target", exists: true }], $then: { $format: "ENT-{t}", $with: { t: { $copy: "overrides.target" } } } }
      entity: { $apply: entity-of }
      itemType: { $first: [{ $apply: type-of, $at: item }, { $apply: type-of, $at: value }] }
      itemEntity: { $first: [{ $apply: entity-of, $at: item }, { $apply: entity-of, $at: value }] }
      itemBase: { $first: [{ $apply: elem-base, $at: item }, { $apply: elem-base, $at: value }] }
      itemOverrides: { $first: [{ $copy: "item.overrides" }, { $copy: "value.overrides" }] }
      required: { $copy: required }
      default: { $copy: default }
      auto: { $copy: auto }
      unique: { $copy: unique }
      description: { $copy: description }
      fields: { $apply: sub-items, $with: { owner: { $copy: ., $of: owner } } }
