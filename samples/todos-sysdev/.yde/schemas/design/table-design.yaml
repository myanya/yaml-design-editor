id: table-design
name: テーブル設計書（Entity・DDL）
kind: document
description: >-
  詳細設計。業務モデルのエンティティ型 1 つのテーブル（主のテーブルと明細テーブル）・カラム・SQL の型・主キー・外部キー・CHECK と、
  Java の Entity のクラスと項目。schema.sql と Entity クラスの元。生成物（.yde/transforms/design/table-designs.yaml）で、手で直さない
match: "design/generated/tables/*.yaml"
entity: { type: yde-entity, defines: false }
root:
  type: object
  fields:
    - { key: id, label: エンティティ型, type: id, required: true }
    - { key: name, label: 名前, type: string, role: title }
    - key: tables
      label: テーブル
      type: array
      display: list
      item:
        type: object
        fields:
          - { key: name, label: テーブル名, type: string, required: true, role: title }
          - key: kind
            label: 種類
            type: enum
            values:
              - { value: main, label: 主のテーブル }
              - { value: detail, label: 明細（ID の無い繰り返し） }
              - { value: link, label: 紐づけ（参照の並び） }
              - { value: values, label: 値の並び }
          - { key: item, label: 業務モデルの項目, type: string }
          - { key: label, label: 名前, type: string }
          - { key: class, label: Java のクラス, type: string }
          - key: columns
            label: カラム
            type: array
            display: table
            item:
              type: object
              fields:
                - { key: name, label: カラム名, type: string, required: true }
                - { key: item, label: 業務モデルの項目, type: string }
                - { key: label, label: 名前, type: string }
                - { key: origin, label: 出どころ, type: string, description: "業務モデルに無く、段の規則・補正で足した列（段「名前」（ID））" }
                - { key: type, label: SQL の型, type: string, required: true }
                - { key: notNull, label: NOT NULL, type: boolean }
                - { key: primaryKey, label: 主キー, type: boolean }
                - { key: default, label: 初期値, type: any }
                - { key: check, label: 入る値（CHECK）, type: array, item: { type: any } }
                - key: references
                  label: 外部キー
                  type: object
                  fields:
                    - { key: table, label: テーブル, type: string }
                    - { key: column, label: カラム, type: string }
                - key: java
                  label: Java の項目
                  type: object
                  fields:
                    - { key: name, label: 名前, type: string }
                    - { key: type, label: 型, type: string }
          - { key: primaryKey, label: 主キー, type: array, item: { type: string } }
          - { key: unique, label: 重ならない組, type: array, item: { type: array, item: { type: string } } }
