id: action-spec
name: アクション定義書
kind: document
description: 基本設計。業務モデルの操作 1 つの、外から見た振る舞い（受け取る値・前提・状態の移り方・結果）。生成物（.yde/transforms/design/action-specs.yaml）で、手で直さない
match: design/generated/actions/*.yaml
entity:
  type: sysdev-action-spec
  defines: true
root:
  type: object
  fields:
    - key: designId
      type: id
      label: 設計項目ID
      required: true
      pattern: ^DOC-\S+$
    - key: id
      label: 操作ID
      type: ref
      required: true
    - key: name
      label: 操作名
      type: string
      role: title
      required: true
    - key: description
      label: 説明
      type: text
    - key: kind
      label: 種類
      type: enum
      values:
        - value: action
          label: 操作
        - value: method
          label: 型の操作
    - key: subject
      label: 主体のエンティティ型
      type: ref
    - key: inputs
      label: 受け取る値
      type: array
      display: table
      item:
        type: any
    - key: initial
      label: 入力の初期値
      type: any
    - key: state
      label: 状態の移り方
      type: any
    - key: preconditions
      label: 前提（断りの種類）
      type: any
    - key: effects
      label: 結果
      type: array
      display: table
      item:
        type: any
    - key: designKind
      type: system-inputs#種類
      label: 設計書の種類
      required: true
    - key: designPath
      type: string
      label: 保存先
      required: true
    - key: origins
      type: any
      label: 根拠
    - key: receiver
      type: any
    - key: inputPolicy
      type: any
    - key: checks
      type: any
    - key: provides
      type: any
    - key: writes
      label: 書込（基本設計の確定項目）
      type: array
      item:
        type: ref
        idPatterns:
          - CRUD-*
  unknownFields: error
