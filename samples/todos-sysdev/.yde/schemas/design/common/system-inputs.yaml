id: system-inputs
name: 設計書の補正・指定・追加の形式
kind: library
definitions:
  対象:
    type: string
    pattern: ^DOC-\S+$
  種類:
    type: enum
    values:
      - value: dashboard-flows
      - value: domain-relations
      - value: domains
      - value: error-handling
      - value: errors
      - value: messages
      - value: processes
      - value: screen-designs-details
      - value: screen-designs-lists
      - value: screen-designs-operations
      - value: screen-flows
      - value: screen-styles
      - value: screen-transitions
      - value: session-design
  補正:
    type: object
    fields:
      - key: id
        type: id
        required: true
        pattern: ^SCOR-\S+$
      - key: kind
        type: 種類
        required: true
      - key: target
        type: 対象
        required: true
      - key: set
        type: any
      - key: changes
        type: array
        item:
          type: object
          fields:
            - key: path
              type: array
              item:
                type: any
              required: true
            - key: value
              type: any
              required: true
      - key: reason
        type: text
        required: true
      - key: select
        type: object
        fields:
          - key: collection
            type: string
            required: true
          - key: key
            type: string
            required: true
          - key: equals
            type: string
            required: true
    unknownFields: error
    constraints:
      - id: correction-content
        where:
          - path: set
            exists: false
          - path: changes
            empty: true
        expect: absent
        level: error
        message: 補正する set または changes が必要です
  指定:
    type: object
    fields:
      - key: id
        type: id
        required: true
        pattern: ^SSPC-\S+$
      - key: kind
        type: 種類
        required: true
      - key: target
        type: 対象
        required: true
      - key: rule
        type: enum
        values:
          - defaults
        required: true
      - key: settings
        type: any
        required: true
      - key: reason
        type: text
        required: true
    unknownFields: error
  追加:
    type: object
    fields:
      - key: id
        type: id
        required: true
        pattern: ^SADD-\S+$
      - key: kind
        type: 種類
        required: true
      - key: document
        type: any
      - key: reason
        type: text
        required: true
      - key: target
        type: 対象
      - key: collection
        type: string
      - key: items
        type: array
        item:
          type: any
    unknownFields: error
    constraints:
      - id: addition-needed
        where:
          - path: document
            exists: false
          - path: items
            exists: false
        expect: absent
        level: error
        message: document または items が必要です
      - id: addition-exclusive
        where:
          - path: document
            exists: true
          - or:
              - path: target
                exists: true
              - path: collection
                exists: true
              - path: items
                exists: true
        expect: absent
        level: error
        message: 文書の追加とコレクションへの追加は別の記録に書きます
      - id: addition-target
        where:
          - path: items
            exists: true
          - path: target
            exists: false
        expect: absent
        level: error
        message: コレクションへの追加には target が必要です
      - id: addition-collection
        where:
          - path: items
            exists: true
          - path: collection
            exists: false
        expect: absent
        level: error
        message: コレクションへの追加には collection が必要です
  基本設計の種類:
    type: 種類
    values: [domains, domain-relations, errors, messages, screen-transitions]
  基本設計の補正:
    type: 補正
    fields:
      - {key: kind, type: 基本設計の種類}
  基本設計の指定:
    type: 指定
    fields:
      - {key: kind, type: 基本設計の種類}
  基本設計の追加:
    type: 追加
    fields:
      - {key: kind, type: 基本設計の種類}
  詳細設計の種類:
    type: 種類
    values: [dashboard-flows, error-handling, processes, screen-designs-details, screen-designs-lists, screen-designs-operations, screen-flows, screen-styles, session-design]
  詳細設計の補正:
    type: 補正
    fields:
      - {key: kind, type: 詳細設計の種類}
  詳細設計の指定:
    type: 指定
    fields:
      - {key: kind, type: 詳細設計の種類}
  詳細設計の追加:
    type: 追加
    fields:
      - {key: kind, type: 詳細設計の種類}
