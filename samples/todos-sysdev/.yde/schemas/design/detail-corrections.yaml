id: detail-corrections
name: 補正一覧（詳細設計）
kind: document
description: >-
  人が書く文書。詳細設計項目一覧の設計項目（テーブル・カラム・索引・外部キー）と型対応表の行を ID で指し、値を置き換える（一覧そのものは変えない）。
  項目を足すときは詳細設計項目台帳（design/detail/ledger.yaml）に書く。
  重ねた結果はビュー「テーブル設計書」で見る。全体の方針は詳細設計のルールに書き、ここには個別の例外（このカラムだけ名前を変える、など）を書く
match: "design/detail/corrections*.yaml"
root:
  type: object
  fields:
    - key: corrections
      label: 補正
      type: array
      display: table
      item:
        type: object
        fields:
          - { key: id, label: 補正ID, type: id, required: true, pattern: "^DCOR-[0-9]{3,}$" }
          - key: target
            label: 当たり先
            type: ref
            required: true
            idPatterns: ["TBL-*", "COL-*", "IDX-*", "FK-*", "SQL-*"]
            description: 置き換える設計項目（詳細設計項目一覧と型対応表の ID。例 外部キーの消したときの動き onDelete）
          - { key: set, label: 置き換える値, type: any, required: true, description: "設計項目の項目のキーと新しい値（例 name: todo_title）" }
          - { key: reason, label: 理由, type: text, required: true }
