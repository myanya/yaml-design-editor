id: design-coverage
name: 設計の対応の検査
kind: library
description: >-
  業務モデルの定義（定義の索引の操作・エンティティ型・Lifecycle）が、どれも設計書に降りていることを確かめる。
  操作はアクション定義書・処理設計書・Controller のハンドラ・Mapper のメソッドへ、エンティティ型はエンティティ定義書・
  テーブル設計書・テーブルアクセス設計書へ降りる。ダッシュボードは画面遷移定義書・一覧画面の画面定義書・Controller へ降り、
  操作はダッシュボードからたどれれば画面定義書（入力画面と確認画面）へ降りる（たどれない操作は、業務モデルのダッシュボードの不足）。
  業務モデルを写し直したのに作り直していない・生成の定義が要素を落とした、のどちらも指摘になる（指摘は業務モデルの定義の場所に出る）
constraints:
  - id: action-has-spec
    description: どの操作にもアクション定義書がある
    match: [{ node: { entity: yde-action, bind: a } }]
    check: [{ gte: [{ occurrenceCount: { of: a, schema: action-spec } }, 1] }]
    level: error
    message: "操作「{id}」にアクション定義書がありません（generate で作り直します）"
  - id: action-has-process
    description: どの操作にも処理設計書がある
    match: [{ node: { entity: yde-action, bind: a } }]
    check: [{ gte: [{ occurrenceCount: { of: a, schema: process } }, 1] }]
    level: error
    message: "操作「{id}」に処理設計書がありません（generate で作り直します）"
  - id: action-has-handler
    description: どの操作にも Controller のハンドラがある（ダッシュボードからたどれない操作には、画面もハンドラも作らないので警告）
    match: [{ node: { entity: yde-action, bind: a } }]
    check: [{ gte: [{ refCount: { of: a, dir: in, via: action } }, 1] }]
    level: warning
    message: "操作「{id}」を扱う Controller のハンドラがありません（ダッシュボードからたどれない操作か、主体のエンティティ型が決まらない操作です）"
  - id: action-has-access
    description: どの操作にも Mapper の読み書きがある
    match: [{ node: { entity: yde-action, bind: a } }]
    check: [{ gte: [{ refCount: { of: a, dir: in, via: operations } }, 1] }]
    level: error
    message: "操作「{id}」の読み書きがテーブルアクセス設計書にありません"
  - id: lifecycle-has-status-rule
    description: どの Lifecycle にも状態の判定がある
    match: [{ node: { entity: yde-lifecycle, bind: l } }]
    check: [{ gte: [{ occurrenceCount: { of: l, schema: status-rule } }, 1] }]
    level: error
    message: "Lifecycle「{id}」に状態の判定（enum と遷移）がありません（generate で作り直します）"
  - id: entity-has-spec
    description: どのエンティティ型にもエンティティ定義書がある
    match: [{ node: { entity: yde-entity, bind: e } }]
    check: [{ gte: [{ occurrenceCount: { of: e, schema: entity-spec } }, 1] }]
    level: error
    message: "エンティティ型「{id}」にエンティティ定義書がありません（generate で作り直します）"
  - id: entity-has-table
    description: どのエンティティ型にもテーブル設計書がある
    match: [{ node: { entity: yde-entity, bind: e } }]
    check: [{ gte: [{ occurrenceCount: { of: e, schema: table-design } }, 1] }]
    level: error
    message: "エンティティ型「{id}」にテーブル設計書がありません（generate で作り直します）"
  - id: entity-has-mapper
    description: どのエンティティ型にもテーブルアクセス設計書（Mapper）がある
    match: [{ node: { entity: yde-entity, bind: e } }]
    check: [{ gte: [{ occurrenceCount: { of: e, schema: table-access } }, 1] }]
    level: error
    message: "エンティティ型「{id}」にテーブルアクセス設計書がありません（generate で作り直します）"
  - id: dashboard-has-screens
    description: どのダッシュボードにも画面遷移定義書・一覧画面の画面定義書・一覧画面の Controller がある
    match: [{ node: { entity: yde-view, bind: v } }]
    where: [{ of: v, path: kind, equals: dashboard }]
    check:
      - { gte: [{ occurrenceCount: { of: v, schema: screen-transitions } }, 1] }
      - { gte: [{ occurrenceCount: { of: v, schema: screen-list } }, 1] }
      - { gte: [{ occurrenceCount: { of: v, schema: dashboard-flow } }, 1] }
    level: error
    message: "ダッシュボード「{id}」の画面の設計書がそろっていません（generate で作り直します）"
  - id: action-has-screen
    description: どの操作にも画面定義書（入力画面と確認画面）がある＝ダッシュボードからたどれる
    match: [{ node: { entity: yde-action, bind: a } }]
    check: [{ gte: [{ occurrenceCount: { of: a, schema: screen-operation } }, 1] }]
    level: warning
    message: "操作「{id}」はダッシュボードからたどれず、画面がありません（業務モデルのダッシュボードに、操作のボタンか、受け手の型の一覧を足します）"
