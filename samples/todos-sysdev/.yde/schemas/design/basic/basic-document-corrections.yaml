id: basic-document-corrections
name: 基本設計の設計書の補正と指定
kind: document
match: design/basic/inputs/documents/corrections.yaml
root:
  type: object
  fields:
    - key: inputId
      type: id
      required: true
    - key: corrections
      type: array
      item:
        type: system-inputs#基本設計の補正
    - key: specifications
      type: array
      item:
        type: system-inputs#基本設計の指定
  unknownFields: error
