id: screen-list
name: 画面定義書（一覧画面）
kind: document
description: 基本設計。ダッシュボード 1 つの一覧画面（絞り込みの欄・上部のボタン・区画の表と、行の ID の先・行の右のボタンと、それを出す状態）。 生成物（.yde/transforms/design/basic/screen-lists.yaml）で、手で直さない
match: design/basic/final/screens/lists/*.yaml
entity:
  type: sysdev-screen-list
  defines: true
root:
  type: object
  fields:
    - key: designId
      type: id
      label: 設計項目ID
      required: true
      pattern: ^DOC-\S+$
    - key: id
      label: ダッシュボード
      type: ref
      required: true
    - key: name
      label: 名前
      type: string
      role: title
    - key: kind
      label: 種類
      type: string
    - key: url
      label: URL
      type: string
    - key: filters
      label: 絞り込みの欄
      type: array
      display: table
      item:
        type: any
    - key: buttons
      label: 上部のボタン
      type: array
      display: table
      item:
        type: object
        fields:
          - key: operation
            label: 操作
            type: ref
          - key: label
            label: ボタン
            type: string
          - key: to
            label: 移る先
            type: string
    - key: sections
      label: 区画
      type: array
      display: list
      item:
        type: object
        unknownFields: allow
        fields:
          - key: id
            label: 区画
            type: string
          - key: label
            label: 見出し
            type: string
            role: title
          - key: group
            label: 群
            type: string
          - key: view
            label: ビュー
            type: ref
          - key: kind
            label: 種類
            type: string
          - key: rows
            label: 行の型
            type: string
          - key: filter
            label: 区画の条件
            type: any
          - key: columns
            label: 列
            type: array
            item:
              type: string
          - key: link
            label: 行の ID の先
            type: any
          - key: cell
            label: セルの先
            type: any
          - key: rowButtons
            label: 行の右のボタン
            type: array
            display: table
            item:
              type: any
    - key: designKind
      type: system-inputs#種類
      label: 設計書の種類
      required: true
    - key: designPath
      type: string
      label: 保存先
      required: true
    - key: origins
      type: any
      label: 根拠
    - key: originalRoutes
      type: any
  unknownFields: error
