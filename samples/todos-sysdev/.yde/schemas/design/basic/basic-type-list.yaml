id: basic-type-list
name: 基本設計項目一覧（論理型）
kind: document
description: 型を解決した確定型一覧。各項目にも適用する値を保持し、ビューは継承値を再計算しない
match: "design/basic/final/types.yaml"
definitions:
  論理型参照:
    type: ref
    idPatterns: ["TYP-*"]
    description: 基本設計の論理型（TYP-モジュール.型の名前・組込みは TYP-型の名前）
  項目:
    type: basic-design-contract#確定した項目
root:
  type: basic-design-contract#確定型一覧
