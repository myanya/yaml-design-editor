id: screen-operation
name: 画面定義書（操作の画面）
kind: document
description: >-
  基本設計。ダッシュボードからたどれる操作 1 つの入力画面と確認画面（起点の画面・ボタンを出す状態・入力の項目と初期値・確認に出すもの・
  確定の後の戻り先と完了の知らせ・断りの種類）。生成物（.yde/transforms/design/basic/screen-operations.yaml）で、手で直さない
match: design/basic/final/screens/operations/*.yaml
entity:
  type: sysdev-screen-operation
  defines: true
root:
  type: object
  fields:
    - key: designId
      type: id
      label: 設計項目ID
      required: true
      pattern: ^DOC-\S+$
    - key: id
      label: 操作
      type: ref
      required: true
    - key: name
      label: 操作名
      type: string
      role: title
    - key: kind
      label: 種類
      type: string
    - key: target
      label: 受け手
      type: string
    - key: starts
      label: 起点の画面
      type: array
      display: table
      item:
        type: any
    - key: shownWhen
      label: ボタンを出す状態
      type: any
    - key: row
      label: 行から受け取る値
      type: any
      description: 並びの 1 件を番号で指す操作の番号。その並びの表の行のボタンが運び、人は入力しない（入力・確認の画面では hidden 項目で持ち回す）
    - key: carried
      label: 画面が運ぶ値
      type: any
      description: 人は入力せず、画面を出すときに受け手から読んで hidden 項目で持ち回す値（入力のキー → 読む式）。同時更新を検出する版など。入力画面の無い操作は、確認画面を出すときに読む
    - key: input
      label: 入力画面
      type: any
    - key: confirm
      label: 確認画面
      type: any
    - key: execute
      label: 確定
      type: any
    - key: designKind
      type: system-inputs#種類
      label: 設計書の種類
      required: true
    - key: designPath
      type: string
      label: 保存先
      required: true
    - key: origins
      type: any
      label: 根拠
    - key: originalRoutes
      type: any
  unknownFields: error
