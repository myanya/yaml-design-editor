id: session-design
name: セッション情報設計
kind: document
description: 詳細設計。セッションに置くもの（キー・中身・目的・置くハンドラ・読むハンドラ・消すとき）と、置かないものの置き場。Controller はここにあるキーだけを使う。 生成物（.yde/transforms/design/session-design.yaml）で、手で直さない
match: design/generated/session.yaml
root:
  type: object
  fields:
    - key: designId
      type: id
      label: 設計項目ID
      required: true
      pattern: ^DOC-\S+$
    - key: id
      label: 設計書
      type: string
      required: true
    - key: name
      label: 名前
      type: string
      role: title
    - key: policy
      label: 決まり
      type: array
      item:
        type: string
    - key: attributes
      label: セッションに置くもの
      type: array
      display: list
      item:
        type: object
        fields:
          - key: key
            label: キー
            type: string
            required: true
            role: title
          - key: contents
            label: 中身
            type: string
          - key: purpose
            label: 目的
            type: string
          - key: puts
            label: 置くハンドラ
            type: any
          - key: reads
            label: 読むハンドラ
            type: any
          - key: removes
            label: 消すとき
            type: string
          - key: status
            label: 状態
            type: string
          - key: role
            type: string
    - key: notKept
      label: 置かないもの
      type: array
      display: table
      item:
        type: object
        fields:
          - key: what
            label: もの
            type: string
          - key: where
            label: 置き場
            type: string
    - key: designKind
      type: system-inputs#種類
      label: 設計書の種類
      required: true
    - key: designPath
      type: string
      label: 保存先
      required: true
    - key: origins
      type: any
      label: 根拠
  unknownFields: error
entity:
  type: sysdev-session-design
  defines: true
