id: entity-spec
name: エンティティ定義書
kind: document
description: >-
  基本設計。業務モデルのエンティティ型 1 つの、システムが持つ項目（名前・型・必須・文字数・選択肢・参照先）と ID の振り方と、
  どの操作がどの項目を作る（C）・書き換える（U）かの表（CRUD 表）。業務モデルで 2 か所に書かれた項目は 1 つにまとめる。
  生成物（.yde/transforms/design/entity-specs.yaml）で、手で直さない
match: "design/generated/entities/*.yaml"
# 業務のエンティティ型と同じ ID の詳細化（定義は業務モデルのエンティティ型）
entity: { type: yde-entity, defines: false }
root:
  type: object
  fields:
    - { key: id, label: エンティティ型, type: id, required: true }
    - { key: name, label: 名前, type: string, role: title, required: true }
    - { key: numbering, label: ID の振り方, type: any, description: "新しい要素の ID（path）を、接頭辞（prefix）と使われている番号の次（digits 桁）で振る" }
    - key: owner
      label: 入れ子で持つ外側
      type: object
      fields:
        - { key: entity, label: エンティティ型, type: ref }
        - { key: field, label: 項目, type: string }
    - { key: documents, label: 業務モデルの文書, type: array, item: { type: string } }
    - key: items
      label: 項目
      type: array
      display: table
      item:
        type: object
        unknownFields: allow
        fields:
          - { key: key, label: キー, type: string, required: true }
          - { key: label, label: 名前, type: string, role: title }
          - { key: type, label: 業務の型, type: string }
          - { key: base, label: 基底の種類, type: string }
          - { key: required, label: 必須, type: boolean }
          - { key: maxLength, label: 最大文字数, type: int }
          - { key: target, label: 参照先, type: any }
          - { key: documents, label: 業務モデルの文書, type: array, item: { type: string } }
          - { key: origin, label: 出どころ, type: string, description: "業務モデルに無く、段の規則・補正で足した項目（段「名前」（ID））" }
    - key: operations
      label: CRUD 表の列（操作）
      type: array
      display: table
      item:
        type: object
        fields:
          - { key: id, label: 操作, type: ref }
          - { key: label, label: 名前, type: string }
    - key: crud
      label: CRUD 表（C＝作る・U＝書き換える）
      type: array
      display: table
      item: { type: any }
