id: detail-table-access
name: 詳細設計項目一覧（テーブルへの読み書き）
kind: document
description: >-
  具体システムモデルの「テーブルへの読み書き」。エンティティ型ごとに 1 ファイルで、Mapper 1 つ（読み書きのまとまり ACC-）と、
  そのテーブル（主のテーブルと明細テーブル）を読み書きするメソッド（MTH-）。メソッドは操作をまたいで 1 つにまとめる。
  メソッドは作る元（sources。操作 ACT-・一覧の検索条件 QRY-・詳細画面 SCR-・エンティティ ENT-）を指し、テーブルとカラムは ID（TBL-・COL-）で指す（名前を写さない）。
  個別の判断で置き換えられるのは、Mapper の名前（mapper）とメソッドの名前（name）。メソッドの ID は、判断で名前を替えても変わらない。
  生成物（.yde/transforms/design/detail/detail-table-access.yaml）で、手で直さない
match: design/detail/final/table-access/*.yaml
entity:
  type: sysdev-table-access
  defines: true
root:
  type: object
  fields:
    - key: id
      label: 設計項目ID
      type: id
      required: true
      pattern: ^ACC-\S+$
      description: ACC-エンティティ型
    - key: source
      label: 作る元
      type: ref
      required: true
      idPatterns:
        - ENT-*
      description: 基本設計のエンティティ
    - key: entity
      label: エンティティ型
      type: ref
      required: true
    - key: label
      label: 名前
      type: string
      role: title
    - key: mapper
      label: Mapper
      type: string
      required: true
      description: Mapper の名前（既定はエンティティ型の名前 + Mapper）
    - key: tables
      label: テーブル
      type: array
      item:
        type: ref
        idPatterns:
          - TBL-*
    - key: methods
      label: メソッド
      type: array
      display: list
      item:
        type: object
        fields:
          - key: id
            label: 設計項目ID
            type: id
            required: true
            pattern: ^MTH-\S+$
            description: MTH-エンティティ型.既定のメソッド名
          - key: name
            label: メソッド
            type: string
            required: true
            role: title
          - key: kind
            label: 種類
            type: enum
            values:
              - value: select
                label: 読む
              - value: insert
                label: 足す
              - value: update
                label: 書き換える
              - value: delete
                label: 消す
              - value: max
                label: 最大の値
              - value: count
                label: 件数
              - value: aggregate
                label: 集計
          - key: table
            label: テーブル
            type: ref
            required: true
            idPatterns:
              - TBL-*
          - key: columns
            label: 列
            type: any
          - key: item
            label: 読む項目
            type: string
          - key: column
            label: 読むカラム
            type: ref
            idPatterns:
              - COL-*
          - key: set
            label: 書く項目
            type: array
            display: table
            item:
              type: any
          - key: join
            label: つなぐテーブル
            type: array
            display: table
            item:
              type: any
          - key: where
            label: 条件
            type: any
          - key: numbering
            label: 採番の決まり
            type: any
          - key: precondition
            label: 操作の前提
            type: ref
            idPatterns:
              - PRE-*
          - key: constraint
            label: データの決まり
            type: ref
            idPatterns:
              - RUL-*
          - key: expect
            label: 通す件数
            type: enum
            values:
              - value: absent
                label: 0 件
              - value: exists
                label: 1 件以上
          - key: includes
            label: 一緒に読む明細
            type: array
            display: table
            item:
              type: any
          - key: names
            label: 一緒に読む参照先の名前
            type: array
            display: table
            item:
              type: any
          - key: order
            label: 並び
            type: array
            item:
              type: any
          - key: groupBy
            label: まとめる単位
            type: array
            item:
              type: any
          - key: counts
            label: 数える要素のテーブル
            type: ref
            idPatterns:
              - TBL-*
          - key: via
            label: 数える要素への線
            type: any
          - key: params
            label: 受け取る値
            type: array
            item:
              type: string
          - key: sources
            label: 作る元
            type: array
            item:
              type: ref
              idPatterns:
                - ACT-*
                - QRY-*
                - SCR-*
                - ENT-*
            description: このメソッドが要る理由（使う操作・一覧の検索条件・詳細画面・参照の候補にするエンティティ）
          - key: whereFrom
            label: 同じ条件を読むメソッド
            type: ref
            idPatterns:
              - MTH-*
            description: 件数を数えるメソッドが、条件を持つメソッドを指す
        unknownFields: error
    - key: decisions
      label: 当てた判断
      type: any
  unknownFields: error
