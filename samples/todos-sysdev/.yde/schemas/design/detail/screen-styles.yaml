id: screen-styles
name: 画面のクラスと CSS の対応表
kind: document
description: 画面部品と CSS 宣言の確定した対応。配色・文字・余白は画面デザイン台帳の CSS 変数を使う。
match: design/detail/final/screen-designs/styles.yaml
root:
  type: object
  fields:
    - key: designId
      type: id
      label: 設計項目ID
      required: true
      pattern: ^DOC-\S+$
    - key: id
      label: 設計書
      type: string
      required: true
    - key: name
      label: 名前
      type: string
      role: title
    - key: naming
      label: クラスの名前の決まり
      type: array
      display: table
      item:
        type: object
        fields:
          - key: part
            label: 部品・パラメータ
            type: string
          - key: rule
            label: クラスの名前
            type: string
    - key: classes
      label: クラスの中身
      type: array
      display: table
      item:
        type: object
        fields:
          - key: class
            label: クラス
            type: string
            required: true
          - key: applies
            label: CSS の宣言
            type: string
    - key: designKind
      type: system-inputs#種類
      label: 設計書の種類
      required: true
    - key: designPath
      type: string
      label: 保存先
      required: true
    - key: origins
      type: any
      label: 根拠
  unknownFields: error
entity:
  type: sysdev-screen-styles
  defines: true
