id: detail-document-corrections
name: 詳細設計の設計書の補正と指定
kind: document
match: design/detail/inputs/documents/corrections.yaml
root:
  type: object
  fields:
    - key: inputId
      type: id
      required: true
    - key: corrections
      type: array
      item:
        type: system-inputs#詳細設計の補正
    - key: specifications
      type: array
      item:
        type: system-inputs#詳細設計の指定
  unknownFields: error
