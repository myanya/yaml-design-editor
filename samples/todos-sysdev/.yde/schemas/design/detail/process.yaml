id: process
name: 処理設計書（Service）
kind: document
description: 詳細設計。操作 1 つの Service のメソッドと、1 トランザクションの中の手順（読む・前提とデータの決まりを確かめる・書く）と、確認へで呼ぶ確かめ。生成物（.yde/transforms/design/detail/processes.yaml）で、手で直さない
match: design/detail/final/processes/*.yaml
entity:
  type: sysdev-process
  defines: true
root:
  type: object
  fields:
    - key: designId
      type: id
      label: 設計項目ID
      required: true
      pattern: ^DOC-\S+$
    - key: id
      label: 操作ID
      type: ref
      required: true
    - key: name
      label: 操作名
      type: string
      role: title
      required: true
    - key: service
      label: Service
      type: object
      fields:
        - key: class
          label: クラス
          type: string
          required: true
        - key: method
          label: メソッド
          type: string
          required: true
        - key: arguments
          label: 引数
          type: array
          item:
            type: string
    - key: confirm
      label: 確認へで呼ぶ確かめ（書かない）
      type: array
      display: list
      item:
        type: any
    - key: transaction
      label: トランザクション
      type: string
    - key: steps
      label: 手順
      type: array
      display: table
      item:
        type: any
    - key: designKind
      type: system-inputs#種類
      label: 設計書の種類
      required: true
    - key: designPath
      type: string
      label: 保存先
      required: true
    - key: origins
      type: any
      label: 根拠
    - key: subject
      type: ref
    - key: originalService
      type: any
    - key: transactionMode
      type: enum
      values:
        - atomic
      required: true
  unknownFields: error
