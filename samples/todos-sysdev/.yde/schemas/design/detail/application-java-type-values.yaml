id: application-java-type-values
name: Java のスカラー型の対応形式
kind: library
definitions:
  対応:
    type: object
    unknownFields: error
    fields:
      - key: base
        type: enum
        required: true
        values:
          - string
          - id
          - ref
          - enum
          - boolean
          - int
          - number
          - date
      - key: name
        type: string
        required: true
      - key: qualifiedName
        type: string
        required: true
      - key: literal
        type: enum
        required: true
        values:
          - string
          - number
          - boolean
          - date
    constraints:
      - id: type-string
        check:
          - eq:
              - path: name
              - String
          - eq:
              - path: qualifiedName
              - java.lang.String
          - eq:
              - path: literal
              - string
        level: error
        message: string の対応は java.lang.String / string です。別の方式は生成規則と検証をそろえて追加してください
        where:
          - path: base
            equals: string
      - id: type-id
        check:
          - eq:
              - path: name
              - String
          - eq:
              - path: qualifiedName
              - java.lang.String
