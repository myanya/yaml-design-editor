id: basic-entity-list
name: 基本設計項目一覧（エンティティ）
kind: document
description: 導出・補正・追加を合成して検査した確定項目。個別ビュー・横断ビュー・詳細生成の共通入力
match: "design/basic/entities.yaml"
definitions:
  エンティティ参照:
    type: ref
    idPatterns: ["ENT-*"]
    description: 基本設計のエンティティ（ENT-業務のエンティティ型）
  CRUD:
    type: enum
    values: [C, U]
    description: C＝作成（その操作が要素を作るときに書く）・U＝更新（作った後に書き換える）
root:
  type: basic-design-contract#確定エンティティ一覧
