id: basic-entity-list
name: 基本設計項目一覧（エンティティ）
kind: document
description: >-
  基本設計の原本のうち、エンティティの設計項目（エンティティ・項目・CRUD・操作）。業務モデルに基本設計のルールを当てて作る生成物で、手で直さない。
  値は業務モデルの項と同じ書き方（YDE の標準）で、人が読む言葉は説明に書く。個別に直すときは補正一覧（基本設計）に書き、重ねた結果はビュー「エンティティ定義書」で見る
match: "design/basic/entities.yaml"
definitions:
  エンティティ参照:
    type: ref
    idPatterns: ["ENT-*"]
    description: 基本設計のエンティティ（ENT-業務のエンティティ型）
  CRUD:
    type: enum
    values: [C, U]
    description: C＝作成（その操作が要素を作るときに書く）・U＝更新（作った後に書き換える）
root:
  type: object
  fields:
    - key: entities
      label: エンティティ
      type: array
      item:
        type: object
        fields:
          - { key: id, label: 設計項目ID, type: id, required: true, description: "ENT-業務のエンティティ型" }
          - { key: label, label: 名称, type: string, role: title }
          - { key: description, label: 説明, type: text }
          - { key: source, label: 導出元, type: ref, description: 業務モデルのエンティティ型 }
          - { key: parent, label: 親エンティティ, type: エンティティ参照, description: 入れ子で持たれるとき、持つ側のエンティティ }
          - { key: parentField, label: 親の項目, type: ref, idPatterns: ["FLD-*"], description: 親エンティティの中で、このエンティティを並べる項目（親の項目一覧の設計項目） }
          - key: numbering
            label: ID形式
            type: object
            description: 業務モデルの採番（YDE の標準の書き方）。新しい要素の ID は、接頭辞に、使われている番号の次を桁の数で続ける
            fields:
              - { key: item, label: ID項目, type: ref, idPatterns: ["FLD-*"], description: ID を入れる項目（項目一覧の設計項目） }
              - { key: path, label: ID を入れる項目のキー, type: string }
              - { key: prefix, label: 接頭辞, type: any, description: "決まった文字（TODO-）か、変換のひな型（親の ID から作るとき）" }
              - { key: digits, label: 桁, type: int }
              - { key: description, label: 説明, type: text }
          - { key: documents, label: 業務モデルの文書, type: array, item: { type: string } }
          - key: items
            label: 項目一覧
            type: array
            display: table
            item:
              type: object
              fields:
                - { key: seq, label: 項番, type: string }
                - { key: id, label: 設計項目ID, type: id, required: true, description: "FLD-エンティティ型.キー" }
                - { key: key, label: 項目, type: string, required: true }
                - { key: label, label: 名称, type: string, role: title }
                - { key: type, label: 論理型, type: string, description: "業務モデルの型の名前（YDE の標準。common#一行の文 など）" }
                - { key: base, label: 基底の種類, type: string, description: "YDE の基底の種類（string・date・enum・ref・array など）" }
                - { key: itemType, label: 要素の論理型, type: string, description: "配列の要素の論理型（基底の種類が array のとき。common#タグ参照 など）" }
                - { key: required, label: 必須, type: boolean }
                - { key: minLength, label: 最小文字数, type: int }
                - { key: maxLength, label: 最大文字数, type: int }
                - { key: pattern, label: 形, type: any, description: 値の正規表現（完全一致） }
                - { key: default, label: 初期値, type: any }
                - key: auto
                  label: 自動で入る値
                  type: enum
                  values: [created, updated, revision]
                  description: 業務モデルの auto のまま。created＝作成した日・updated＝書き換えて保存した日・revision＝版（1 つ進める）
                - key: values
                  label: 選択肢
                  type: array
                  item:
                    type: object
                    fields:
                      - { key: value, label: 値, type: string }
                      - { key: label, label: 表示名, type: string }
                - { key: target, label: 参照先, type: エンティティ参照 }
                - key: item
                  label: 要素
                  type: object
                  description: 配列の要素（論理型・基底の種類・参照先・入れ子のエンティティ・行の項目）
                  fields:
                    - { key: type, label: 要素の論理型, type: string }
                    - { key: base, label: 基底の種類, type: string }
                    - { key: target, label: 参照先, type: エンティティ参照 }
                    - { key: entity, label: 入れ子のエンティティ, type: エンティティ参照 }
                    - { key: fields, label: 行の項目, type: any }
                - { key: unique, label: 重ならない, type: any }
                - { key: description, label: 説明, type: text }
                - { key: source, label: 導出元, type: ref, description: 業務モデルの項目（エンティティ型.キー）。ルールで足した項目には無い }
                - { key: rule, label: ルール, type: ref, description: この項目を足した基本設計のルール }
                - { key: documents, label: 業務モデルの文書, type: array, item: { type: string } }
          - key: operations
            label: 操作一覧
            type: array
            display: table
            description: このエンティティの項目を作成・更新する業務の操作
            item:
              type: object
              fields:
                - { key: seq, label: 項番, type: string }
                - { key: id, label: 設計項目ID, type: id, required: true, description: "OPS-エンティティ型.操作" }
                - { key: action, label: 操作, type: ref, description: 業務モデルの操作 }
                - { key: label, label: 名称, type: string, role: title }
                - { key: crud, label: 作成・更新, type: CRUD }
                - key: writes
                  label: 書く項目
                  type: array
                  display: table
                  description: 項目ごとに、作成（C）か更新（U）か。CRUD のセル
                  item:
                    type: object
                    fields:
                      - { key: id, label: 設計項目ID, type: id, required: true, description: "CRUD-エンティティ型.操作.キー" }
                      - { key: entity, label: エンティティ, type: エンティティ参照 }
                      - { key: operation, label: 操作, type: ref, idPatterns: ["OPS-*"] }
                      - { key: item, label: 項目, type: ref, idPatterns: ["FLD-*"] }
                      - { key: crud, label: CRUD, type: CRUD }
          - key: crud
            label: CRUD
            type: array
            display: table
            description: 行＝項目、列＝操作 ID、値＝作成 C か更新 U（書かなければ空）。操作一覧の書く項目と同じもの
            item: { type: any }
