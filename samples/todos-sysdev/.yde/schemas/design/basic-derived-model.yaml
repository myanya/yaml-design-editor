id: basic-derived-model
name: 導出した業務モデルの保存形式
kind: library
description: エンティティ・項目・型と宣言を検査する。中の識別子は文字で保持し、確定項目の出現や参照として索引に登録しない
definitions:
  制限:
    type: basic-design-values#属性
    fields:
      - { key: target, label: 導出した参照先, type: any, description: 業務モデルの項のまま、一つの名前か複数の名前を保持する }
  組込み型:
    type: 制限
    fields:
      - { key: name, label: 型の名前, type: string, required: true }
      - { key: base, type: basic-design-values#基底, required: true }
      - { key: builtin, label: 組込み, type: boolean, required: true }
  値:
    type: 制限
    fields:
      - { key: key, label: 項目, type: string }
      - { key: type, label: YDE の型, type: string, required: true }
      - { key: base, type: basic-design-values#基底, required: true }
      - { key: declarations, label: 宣言, type: array, item: { type: basic-design-values#宣言 } }
      - { key: relation, label: 関係名, type: string }
      - { key: idPatterns, label: ID の条件, type: array, item: { type: string } }
      - { key: schemas, label: 参照先スキーマ, type: array, item: { type: string } }
      - { key: targetTitle, label: 参照先の見出し項目, type: string }
      - { key: targetLabel, label: 参照先の名称, type: string }
      - { key: stateOf, label: 状態のエンティティ, type: string }
      - { key: entity, label: 入れ子のエンティティ, type: string }
      - { key: entityLabel, label: 入れ子の名称, type: string }
      - { key: item, label: 配列の要素, type: 値 }
      - { key: value, label: マップの値, type: 値 }
      - { key: fields, label: object の項目, type: array, item: { type: 項目 } }
      - { key: cases, label: 選択肢ごとの項目, type: map, value: { type: array, item: { type: 項目 } } }
      - { key: overrides, label: 共通型との差, type: 制限 }
      - { key: builtinType, label: 組込み型の性質, type: 組込み型 }
  項目:
    type: 値
    fields:
      - { key: key, type: string, required: true }
  型:
    type: 値
    fields:
      - { key: name, label: 型の名前, type: string, required: true }
  保有元:
    type: object
    unknownFields: error
    fields:
      - { key: entity, label: エンティティ, type: string, required: true }
      - { key: field, label: 項目, type: string, required: true }
  エンティティ:
    type: object
    unknownFields: error
    fields:
      - { key: id, label: 業務のエンティティ名, type: string, required: true }
      - { key: label, label: 名称, type: string }
      - { key: description, label: 説明, type: text }
      - { key: aggregate, label: 集約, type: string }
      - { key: title, label: 見出しの項目, type: string }
      - { key: owner, label: 保有元, type: 保有元 }
      - key: numbering
        label: 採番
        type: object
        unknownFields: error
        fields:
          - { key: path, label: ID を入れる場所, type: string }
          - { key: prefix, label: 接頭辞, type: any }
          - { key: digits, label: 桁, type: int }
      - key: aspects
        label: 側面
        type: array
        required: true
        item:
          type: object
          unknownFields: error
          fields:
            - { key: schema, label: スキーマ, type: string, required: true }
            - { key: defines, label: 定義の出現, type: boolean, required: true }
            - { key: at, label: 場所, type: string, description: 空文字は文書のルートを表す }
            - { key: owner, label: 保有元, type: 保有元 }
            - { key: fields, label: 項目, type: array, item: { type: 項目 }, required: true }
  モデル:
    type: object
    unknownFields: error
    fields:
      - { key: entities, label: エンティティ, type: array, item: { type: エンティティ }, required: true }
      - { key: types, label: 型, type: array, item: { type: 型 }, required: true }
      - { key: relations, label: 関係, type: any }
      - { key: actions, label: 操作, type: any }
      - { key: states, label: 状態, type: any }
      - { key: lifecycles, label: 状態の流れ, type: any }
      - { key: constraints, label: データの規則, type: any }
      - { key: views, label: ビュー, type: any }
      - { key: dashboards, label: ダッシュボード, type: any }
      - { key: reach, label: 閲覧する範囲, type: any }
