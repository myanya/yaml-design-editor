id: message-definition
name: メッセージ定義書
kind: document
description: 基本設計。画面に出す文の一覧（キー・種類・文・出どころ）と、入力の誤りの文（フォームの項目ごと）。③で messages.properties に写す。 生成物（.yde/transforms/design/messages.yaml）で、手で直さない
match: design/generated/messages.yaml
root:
  type: object
  fields:
    - key: designId
      type: id
      label: 設計項目ID
      required: true
      pattern: ^DOC-\S+$
    - key: id
      label: 設計書
      type: string
      required: true
    - key: name
      label: 名前
      type: string
      role: title
    - key: file
      label: 写すファイル
      type: string
    - key: writing
      label: 写し方
      type: array
      display: list
      item:
        type: string
    - key: holes
      label: 名前の穴
      type: array
      display: table
      item:
        type: object
        fields:
          - key: name
            label: 穴
            type: string
            required: true
          - key: means
            label: 入る値
            type: string
    - key: messages
      label: 文
      type: array
      display: table
      item:
        type: object
        fields:
          - key: key
            label: キー
            type: string
            required: true
          - key: kind
            label: 種類
            type: string
          - key: text
            label: 文
            type: string
            required: true
          - key: source
            label: 出どころ
            type: string
    - key: validation
      label: 入力の誤りの文（フォームの項目ごと）
      type: array
      display: list
      item:
        type: object
        fields:
          - key: form
            label: フォーム
            type: string
            required: true
          - key: field
            label: 項目
            type: string
            required: true
          - key: label
            label: 名前
            type: string
            role: title
          - key: messages
            label: 文
            type: array
            display: table
            item:
              type: object
              fields:
                - key: key
                  label: キー
                  type: string
                  required: true
                - key: kind
                  label: 種類
                  type: string
                - key: text
                  label: 文
                  type: string
                  required: true
                - key: source
                  label: 検査
                  type: string
    - key: designKind
      type: system-inputs#種類
      label: 設計書の種類
      required: true
    - key: designPath
      type: string
      label: 保存先
      required: true
    - key: origins
      type: any
      label: 根拠
  unknownFields: error
entity:
  type: sysdev-message-definition
  defines: true
