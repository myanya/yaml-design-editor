id: system-corrections
name: system-corrections
kind: document
match: design/system/corrections.yaml
root:
  type: object
  fields:
    - key: inputId
      type: id
      required: true
    - key: corrections
      type: array
      item:
        type: system-inputs#補正
    - key: specifications
      type: array
      item:
        type: system-inputs#指定
  unknownFields: error
