id: table-access
name: テーブルアクセス設計書（Repository）
kind: document
description: >-
  詳細設計。エンティティ型ごとの Mapper と、そのテーブル（主のテーブルと明細テーブル）を読み書きするメソッド。メソッドは操作をまたいで 1 つにまとめ、
  使う操作を並べる。列は業務モデルの項目のキー（item）で書き、カラム名はテーブル設計書から引く。MyBatis の XML に書く SQL の元。
  生成物（.yde/transforms/design/table-access.yaml）で、手で直さない
match: "design/generated/table-access/*.yaml"
entity: { type: yde-entity, defines: false }
root:
  type: object
  fields:
    - { key: id, label: エンティティ型, type: id, required: true }
    - { key: name, label: 名前, type: string, role: title }
    - { key: mapper, label: Mapper, type: string, required: true }
    - { key: tables, label: テーブル, type: array, item: { type: string } }
    - key: methods
      label: メソッド
      type: array
      display: list
      item:
        type: object
        fields:
          - { key: name, label: メソッド, type: string, required: true, role: title }
          - key: kind
            label: 種類
            type: enum
            values:
              - { value: select, label: 1 件を読む }
              - { value: insert, label: 足す }
              - { value: update, label: 書き換える }
              - { value: delete, label: 消す }
              - { value: max, label: 最大の値 }
              - { value: count, label: 件数 }
          - { key: table, label: テーブル, type: string, required: true }
          - { key: columns, label: 列, type: string }
          - { key: item, label: 読む項目, type: string }
          - { key: set, label: 書く項目, type: array, display: table, item: { type: any } }
          - { key: where, label: 条件, type: array, display: table, item: { type: any } }
          - { key: numbering, label: 採番の決まり, type: any }
          - { key: precondition, label: 業務モデルの前提, type: ref }
          - key: expect
            label: 通す件数
            type: enum
            values: [{ value: absent, label: 0 件 }, { value: exists, label: 1 件以上 }]
          - { key: operations, label: 使う操作, type: array, item: { type: ref } }
