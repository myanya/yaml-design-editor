id: app-web-page
name: 業務画面の HTML
params:
  - page
build:
  config:
    $apply: config
    $with:
      row:
        $view: application-configuration-input
        $one: true
  record:
    $apply: record
    $with:
      row:
        $view: application-web-pages-input
        $where:
          - path: id
            equals: $page
        $one: true
rules:
  - id: config
    with:
      - row
    build:
      $copy: values.record.settings
      $of: row
  - id: record
    with:
      - row
    build:
      $copy: values.record
      $of: row
template: business-page.html
output: app/src/main/resources/templates/{record.template}.html
