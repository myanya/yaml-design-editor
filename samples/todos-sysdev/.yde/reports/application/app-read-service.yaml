id: app-read-service
name: 確定した入口と読出しを Java にする
params:
  - reader
build:
  config:
    $apply: config
    $with:
      row:
        $view: application-configuration-input
        $one: true
  record:
    $apply: record
    $with:
      row:
        $view: application-web-read-services-input
        $where:
          - path: id
            equals: $reader
        $one: true
  mappers:
    $each:
      $view: application-access-input
    $build:
      name:
        $copy: values.record.name
      variable:
        $case:
          $copy: values.record.name
        $as: camel
rules:
  - id: config
    with:
      - row
    build:
      $copy: values.record.settings
      $of: row
  - id: record
    with:
      - row
    build:
      $copy: values.record
      $of: row
template: ReadService.java
output: app/src/main/java/{#each config.package}{.}/{/each}service/{record.name}.java
