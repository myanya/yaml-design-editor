id: app-validation-messages
name: 入力の誤りの確定メッセージ
build:
  config:
    $apply: config
    $with:
      row:
        $view: application-configuration-input
        $one: true
  record:
    $apply: record
    $with:
      row:
        $view: messages-input
        $one: true
rules:
  - id: config
    with:
      - row
    build:
      $copy: values.record.settings
      $of: row
  - id: record
    with:
      - row
    build:
      $copy: values.record
      $of: row
template: WebValidationMessages.java
output: app/src/main/java/{#each config.package}{.}/{/each}web/WebValidationMessages.java
