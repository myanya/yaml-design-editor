id: app-gitignore
name: "独立アプリ: .gitignore"
description: 詳細設計の確定設定から生成する。生成後のアプリは YDE を使わずビルドできる
build:
  $apply: configuration
  $with:
    row:
      $view: application-configuration-input
      $one: true
rules:
  - id: configuration
    with:
      - row
    build:
      config:
        $copy: values.record.settings
        $of: row
template: gitignore.txt
output: app/.gitignore
