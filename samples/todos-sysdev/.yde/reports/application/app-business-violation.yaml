id: app-business-violation
name: app-business-violation
build:
  config:
    $apply: config
    $with:
      row:
        $view: application-configuration-input
rules:
  - id: config
    with:
      - row
    build:
      $copy: '[0].values.record.settings'
      $of: row
  - id: record
    with:
      - row
    build:
      $copy: values.record
      $of: row
template: BusinessViolation.java
output: app/src/main/java/{#each config.package}{.}/{/each}service/error/BusinessViolation.java
