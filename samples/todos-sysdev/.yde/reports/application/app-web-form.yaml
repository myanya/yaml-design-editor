id: app-web-form
name: 入力検査付き Form
params:
  - form
build:
  config:
    $apply: config
    $with:
      row:
        $view: application-configuration-input
        $one: true
  record:
    $apply: record
    $with:
      row:
        $view: application-web-forms-input
        $where:
          - path: id
            equals: $form
        $one: true
rules:
  - id: config
    with:
      - row
    build:
      $copy: values.record.settings
      $of: row
  - id: record
    with:
      - row
    build:
      $copy: values.record
      $of: row
template: WebForm.java
output: app/src/main/java/{#each config.package}{.}/{/each}web/form/{record.className}.java
