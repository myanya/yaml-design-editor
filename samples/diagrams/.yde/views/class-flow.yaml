id: class-flow
name: クラス図のフロー
kind: flow
schemaId: classes
projection:
  id: class-projection
  build:
    nodes:
      $each: classes
      $build: {key: {$copy: id}, label: {$copy: name}, entityType: class, detail: {$copy: .}}
    edges:
      $concat:
        - $each: classes
          $build:
            $when: {path: base, empty: false}
            $then: {from: {$copy: id}, to: {$copy: base}, relation: inherits, detail: {$copy: base}}
        - $each: classes
          $build:
            $when: {path: interface, empty: false}
            $then: {from: {$copy: id}, to: {$copy: interface}, relation: realizes, detail: {$copy: interface}}
        - $each: classes
          $build:
            $when: {path: part, empty: false}
            $then: {from: {$copy: id}, to: {$copy: part.to}, relation: owns, detail: {$copy: part}}
appearance:
  nodes:
    - level: entity
      entityType: class
      notation: uml-class
      inputs:
        title: {$copy: data.name}
        stereotype: {$copy: data.stereotype}
        attributes: {$copy: data.attributes}
        operations: {$copy: data.operations}
  edges:
    - {relation: inherits, notation: uml-generalization}
    - {relation: realizes, notation: uml-realization}
    - relation: owns
      notation: uml-composition
      inputs: {sourceLabel: {$copy: data.sourceMultiplicity}, targetLabel: {$copy: data.targetMultiplicity}}
