# 組込みの型（定義体。P33）: text ＝ 複数行の文字列。
#
# 決まりは string と同じで、違いは「複数行の欄で編集する」ヒント（display: multiline）だけ。
# text から作った型や、使う側の項目にヒントは引き継がれ、UI は型の名前ではなくこのヒントで複数行の欄を出す。
# ここにコードは無い。利用者も definitions に同じ書き方で自分の型を作れる（組込みは特権を持たない。CORE-CALCULUS §25）。
id: builtin-types
kind: library
name: 組込みの型
definitions:
  text:
    type: string
    display: multiline
