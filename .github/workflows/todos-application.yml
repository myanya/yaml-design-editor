name: todos-application

on:
  push:
    paths:
      - 'samples/todos-sysdev/**'
      - 'yaml-core/**'
      - 'semantic-core/**'
      - 'workspace-core/**'
      - 'app-core/**'
      - 'cli/**'
      - '.github/workflows/todos-application.yml'
  pull_request:
    paths:
      - 'samples/todos-sysdev/**'
      - 'yaml-core/**'
      - 'semantic-core/**'
      - 'workspace-core/**'
      - 'app-core/**'
      - 'cli/**'
      - '.github/workflows/todos-application.yml'

jobs:
  generated-application:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git の登録漏れと保存データの除外を確認する
        run: |
          ./samples/todos-sysdev/scripts/test-application-files.ps1
          ./samples/todos-sysdev/scripts/test-application-index.ps1
          ./samples/todos-sysdev/scripts/export-app-index.ps1 -Destination scratchpad/todos-application-index
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: YDE CLI を用意する
        run: .\gradlew.bat :cli:cliDist --no-daemon --console=plain
      - name: 生成物の一致と再生成時の保護を確認する
        run: |
          ./samples/todos-sysdev/scripts/generate-app.ps1 -Workspace scratchpad/todos-application-index/samples/todos-sysdev -SkipCliBuild -Check
      - name: Git に登録したアプリをテスト・ビルドする
        run: |
          ./samples/todos-sysdev/scripts/verify-app.ps1 -Application scratchpad/todos-application-index/samples/todos-sysdev/app -Verification scratchpad/todos-application-index/samples/todos-sysdev/verification

  # Linux で確かめるもの:
  # - 設計書の依存関係のページ（samples/todos-sysdev/docs/ の HTML）が、いまの変換定義から作り直したものと同じか
  # - PowerShell の無い環境用の再生成スクリプト（generate-app.py）でも、app/ と生成記録に差分が出ないか
  #   （Windows のジョブの generate-app.ps1 -Check と同じ結果になることを、push ごとに確かめる）
  design-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 設計書の依存マップが最新かを確かめる
        run: python3 samples/todos-sysdev/scripts/design-map.py --check
      - name: generate-app.py でもアプリの生成物に差分が無いことを確かめる
        run: python3 samples/todos-sysdev/scripts/generate-app.py --check
